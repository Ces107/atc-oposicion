ass="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "La velocidad sobre el suelo (GS):", "opts": ["es la velocidad del avión respecto al suelo resultado de la suma vectorial de la velocidad verdadera y velocidad calibrada.", "es la velocidad del avión respecto al suelo resultado de la suma vectorial de la velocidad verdadera y velocidad indicada.", "es la velocidad del avión respecto al suelo resultado de la suma vectorial de la velocidad verdadera y velocidad del viento.", "es la velocidad del avión respecto al suelo resultado d la suma vectorial de la velocidad verdadera y velocidad verdadera."], "ans": 2, "why": "La GS resulta de sumar vectorialmente TAS y viento.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «la suma vectorial de la velocidad verdadera y la velocidad del viento.»", "note": ""}, {"n": 2, "stem": "Dentro del esquema RECAT-EU, en qué categoría se clasifica un B757", "opts": ["Super Heavy", "Lower Medium", "Upper Medium", "Lower Heavy"], "ans": 3, "why": "RECAT-EU clasifica el B752/B753 como Lower Heavy (H-); el texto del manual no recoge la tabla de tipos. Conocimiento de EUROCONTROL RECAT-EU.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": "La tabla de categorías del manual es gráfica; la categoría se ha comprobado por conocimiento general."}, {"n": 3, "stem": "Cual de las siguientes afirmaciones es correcta", "opts": ["La corriente de aire que circula por el extradós disminuye en velocidad y aumenta en presión generando sustentación.", "El Coffin Corner es el punto donde coinciden las velocidades de entrada en pérdida por alta y baja velocidad.", "La aparición de una onda de choque puede provocar la entrada en pérdida de baja velocidad", "Para evitar el Coffin Corner el piloto debe ascender para ampliar el margen entre las velocidades de perdida y de ese modo evitarlo."], "ans": 1, "why": "El Coffin Corner es donde coinciden las velocidades de pérdida alta y baja. En extradós la presión disminuye; y para evitarlo se desciende, no se asciende.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «velocidad. El punto donde coinciden ambas velocidades es conocido como Coffin Corner.»", "note": ""}, {"n": 4, "stem": "Cual de las siguientes respuestas es falsa. La cizalladura:", "opts": ["Puede ser horizontal o vertical.", "Es un fenómeno adverso común en zonas de tormenta", "En niveles altos conlleva aparición de áreas de turbulencia", "Es el término por el que se conoce a la diferencia de temperatura entre dos puntos próximos."], "ans": 3, "why": "La cizalladura es cambio de velocidad y/o dirección del viento, no de temperatura.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 3: «La cizalladura del viento ( wind shear, en inglés) es un cambio en la velocidad y/ o la dirección del»", "note": ""}, {"n": 5, "stem": "El sistema ILS es un sistema de ayuda a la navegación que proporciona a la aeronave información de precisión en la fase de:", "opts": ["despegue", "aproximación y aterrizaje", "ruta", "ruta y aproximación"], "ans": 1, "why": "El ILS da guiado de precisión en aproximación y aterrizaje.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 5: «información de precisión para guiado horizontal y vertical, en la fase de aproximación y aterrizaje.»", "note": ""}, {"n": 6, "stem": "El datum WGS84 es un sistema de referencia geodésico universal con cobertura para toda la superficie terrestre:", "opts": ["Definido por los parámetros: un origen que es el centro de masas de la tierra y un elipsoide WGS84.", "Definido por los parámetros un origen que es el centro de masas de la tierra y un sistema de ejes coordenados.", "Este datum no existe.", "Definido por los parámetros un origen que es el centro de masas de la tierra, un sistema de ejes coordenados (Z. X e Y) y un elipsoide WGS84."], "ans": 3, "why": "El WGS84 se define por origen en el centro de masas, sistema de ejes X,Y,Z y el elipsoide WGS84.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 4: «Origen: centro de masas de la Tierra. Sistemas de ejes coordenados:»", "note": ""}, {"n": 7, "stem": "La Carta de Transición a la Aproximación Final", "opts": ["Se proporcionará a la tripulación de vuelo información que le permita vigilar y verificar las altitudes asignadas por un controlador que usa un sistema de vigilancia ATS.", "Se proporcionará a la tripulación de vuelo como soporte de operaciones de transición de reglas de vuelo IFR a VFR.", "Son un método sistematizado para la secuenciación de flujos de llegadas utilizado en diversos aeropuertos de alta densidad.", "Facilita la información necesaria para efectuar los procedimientos de aproximación instrumental a la pista de aterrizaje prevista, incluyendo los de aproximación frustrada y los de espera."], "ans": 2, "why": "Las cartas TRAN contienen transiciones RNAV1 como método sistematizado de secuenciación de llegadas.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 4: «un método sistematizado para la secuenciación de flujos de llegadas utilizado en diversos»", "note": ""}, {"n": 8, "stem": "La función de CANSO es:", "opts": ["Intentar proporcionar un foro europeo para la resolución de problemas y creación de estándares para la electrónica en la aviación.", "Ser el primer vehículo para la cooperación entre las aerolíneas en la promoción de servicios de transporte aéreo seguro, fiable y económico.", "Proporcionar una plataforma mundial para los clientes y aquéllos interesados en impulsar los Servicios de Navegación Aérea civiles (SNA), con el fin de prestar un servicio eficaz, seguro, eficiente y rentable.", "Elaborar el programa espacial europeo y llevarlo a cabo."], "ans": 2, "why": "CANSO es la organización de proveedores de servicios de navegación aérea civil y ofrece una plataforma mundial para impulsar un servicio eficaz, seguro, eficiente y rentable. Las otras opciones describen organismos distintos (electrónica, aerolíneas, programa espacial).", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 1: «Es proporcionar una plataforma mundial para los clientes y aquéllos interesados en impulsar los Servicios de»", "note": ""}, {"n": 9, "stem": "¿Cuál de estos procesos no facilita el intercambio de calor entre unas regiones y otras del planeta?", "opts": ["Corrientes oceánicas.", "Turbulencia", "Transpiración.", "Corrientes de convección."], "ans": 2, "why": "El manual lista conducción, convección, advección y turbulencia como procesos de transmisión de calor, y las corrientes oceánicas también redistribuyen calor. La transpiración (evapotranspiración) forma parte del ciclo del agua, no es un mecanismo de intercambio de calor entre regiones.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 3: «el intercambio de calor se puede realizar a través de los siguientes procesos:»", "note": ""}, {"n": 10, "stem": "Los servicios de Navegación Aérea para los que está certificado Enaire son:", "opts": ["ATS, CNS y AIS", "Formación de control, ATS y CNS", "SDP; ATS y CNS", "AIS, evaluación e instrucción"], "ans": 0, "why": "El manual enumera como servicios certificados el ATS (1.4.1), el CNS (1.4.2) y el AIS (1.4.3). Formación, evaluación e instrucción o SDP no son servicios de navegación aérea certificados.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 7: «ENAIRE está certificada como organización proveedora de los siguientes servicios de navegación»", "note": ""}, {"n": 11, "stem": "El DME que se instala con un ILS proporciona información de distancia:", "opts": ["al umbral de parada", "al punto de contacto", "al Localizador", "al umbral de aproximación"], "ans": 3, "why": "El DME asociado al ILS sustituye a las radiobalizas y da distancia constante al umbral de la pista (umbral de aproximación). El umbral de parada corresponde al stopway y no es la referencia del ILS.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 5: «las radiobalizas han sido sustituidas por DME coemplazado con la senda planeo, ya que da información constante de distancia al…»", "note": ""}, {"n": 12, "stem": "El DVOR o VOR Doppler se diferencia del VOR convencional en:", "opts": ["La banda de frecuencia de trabajo", "En el principio de funcionamiento y la banda de frecuencias", "Tiene el mismo principio de funcionamiento, pero con diferentes técnicas de transmisión que mejora la calidad de la señal", "En el principio de funcionamiento y el alcance"], "ans": 2, "why": "El DVOR mantiene el principio de funcionamiento y la banda VHF del VOR convencional; solo cambia la técnica de transmisión, lo que mejora la calidad de la señal ante obstáculos.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 5: «que se basa en el mismo principio de funcionamiento, pero utiliza diferentes técnicas de transmisión,»", "note": ""}, {"n": 13, "stem": "Los planes de vuelo son tratados por el IFPS que se encarga de:", "opts": ["Proporcionar a operaciones de NM información sobre planes de vuelo (FPL) para la planificación ATFCM, monitorización y asignación de slot.", "La validación", "La distribución en el área ECAC", "Todas son correctas"], "ans": 3, "why": "El IFPS recepciona, valida (procesado inicial), distribuye los datos de FPL en el área ECAC y proporciona a NM información para planificación ATFCM, monitorización y asignación de slot. Las tres primeras opciones son ciertas, luego todas son correctas.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 6: «De proporcionar a operaciones del Gestor de red (NM Network Manager) información sobre»", "note": ""}, {"n": 14, "stem": "La función principal de las cartas OACI 1:500.000", "opts": ["Es atender las necesidades de la navegación aérea visual en vuelos a baja velocidad, a distancias cortas o medias y a altitudes bajas e intermedias.", "Es atender las necesidades de la navegación aérea instrumental en la planificación de vuelo en los TMA.", "Es atender a las aeronaves que vuelen bajo reglas de vuelo visual y operen dentro de un TMA.", "Es asistir a las tripulaciones en vuelo con la información necesaria para pasar de la fase de vuelo en ruta y descenso a la de aproximación a la pista de aterrizaje mediante referencias visuales."], "ans": 0, "why": "La carta OACI 1:500.000 atiende la navegación visual a baja velocidad, distancias cortas o medias y altitudes bajas e intermedias. La carta de circulación VFR para TMA es otra distinta.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 4: «La función principal de esta carta es la de atender a las necesidades de la navegación aérea»", "note": ""}, {"n": 15, "stem": "Los principales servicios gestionados por ENAIRE son:", "opts": ["El Control de Tránsito Aéreo y el Servicio de Certificación de Controladores Aéreos", "La Información Aeronáutica y el Servicio de Control de ruta y aproximación", "El Control de Tránsito Aéreo; el Servicio de Comunicaciones, Navegación y Vigilancia; y el Servicio de Información Aeronáutica", "Servicio de Tránsito Aéreo; y Servicio de Comunicaciones, Navegación y Vigilancia"], "ans": 2, "why": "ENAIRE presta ATS (control de tránsito aéreo), CNS y AIS. La opción C recoge los tres; la D omite la información aeronáutica y las otras incluyen servicios inexistentes como certificación de controladores.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 7: «ENAIRE presta los servicios de tránsito aéreo de»", "note": ""}, {"n": 16, "stem": "La frecuencia de trabajo de un PSR es:", "opts": ["L (de 1 a 2 GHz) y S (de 2 a 4 GHz)", "L (de 1 a 2 GHz) y S (de 3 a 4 GHz)", "S (de 1 a 2 GHz) y L (de 2 a 4 GHz)", "L (de 2 a 3 GHz) y S (de 1 a 2 GHz)"], "ans": 0, "why": "El radar primario trabaja en banda L (1-2 GHz) y S (2-4 GHz). Las demás opciones alteran los rangos o los intercambian.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 5: «El PSR trabaja en las bandas de frecuencia L (de 1 a 2 GHz) y S (de 2 a 4 GHz).»", "note": ""}, {"n": 17, "stem": "Cual de las siguientes afirmaciones es correcta", "opts": ["Las velocidades de despegue varían con el peso del avión.", "La distancia de despegue no es normalmente un factor limitante, ya que es generalmente mayor que la distancia de despegue con un motor inoperativo.", "La pista requerida para el despegue debe estar basada en la posible pérdida de un motor en el punto más crítico, que es a VR (velocidad de rotación).", "Todas son correctas"], "ans": 0, "why": "La distancia de despegue con todos los motores es generalmente menor que con un motor inoperativo (B dice mayor, falso) y la pérdida crítica de motor se considera a V1, no a VR (C falso). Solo A es correcta.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «Las velocidades de despegue varían con el peso del avión.»", "note": ""}, {"n": 18, "stem": "El derecho nacional es el conjunto de las normas aprobadas de acuerdo con la Constitución española y en lo referente al transporte aéreo está compuesto por:", "opts": ["Leyes, Reales Decretos, Órdenes ministeriales, Circulares aeronáuticas y Resoluciones de la Dirección General de Aviación Civil", "Leyes, Reales Decretos, Cartas aeronáuticas y Resoluciones de la Dirección General de Aviación Civil", "Leyes, Reales Decretos, Órdenes ministeriales, Cartas aeronáuticas y Resoluciones de la Agencia Europea de la Seguridad Aérea", "Exclusivamente por Leyes y Reales Decretos"], "ans": 0, "why": "El derecho nacional se compone de Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de la DGAC. Las cartas aeronáuticas no son normas y EASA es derecho europeo.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 1: «Es el conjunto de las normas aprobadas de acuerdo con la Constitución Española.»", "note": ""}, {"n": 19, "stem": "Respecto al TRM podría afirmarse", "opts": ["Que es algo abstracto, etéreo, un concepto deseable pero no evidenciable en la conducta humana.", "Que se sustenta en habilidades y actitudes observables, que pueden dividirse en habilidades, estrategias y actitudes concretas trazables a aspectos concretos, conocidos y observables de la conducta humana.", "Que deriva del conocimiento en CRM (comercial resource management) pero incorporando el trabajo en equipo.", "Todas son ciertas"], "ans": 1, "why": "El TRM se basa en habilidades conductuales observables, divisibles en estrategias concretas trazables al funcionamiento humano. Deriva del CRM entendido como Cockpit/Crew Resource Management, no 'commercial', por lo que C es falsa.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «concretos del funcionamiento humano, y, por tanto, están íntimamente relacionadas con el»", "note": ""}, {"n": 20, "stem": "Aena pasa a denominarse ENAIRE en el contesto de privatización parcial de Aena S.A. por:", "opts": ["Ley 18/2014, de 15 de octubre", "Ley 48/1960, de 21 de julio", "Ley 21/2003, de 7 de julio", "Real Decreto 931/2010, de 23 de julio"], "ans": 0, "why": "Aena EPE pasó a denominarse ENAIRE por la Ley 18/2014, de 15 de octubre. Las otras normas son de otras materias o años.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 7: «pasó a denominarse ENAIRE por la Ley 18/2014 de 15 de octubre, de aprobación de medidas»", "note": ""}, {"n": 21, "stem": "En ATC, respecto a lo que conocemos sobre los incidentes de tránsito aéreo podríamos afirmar:", "opts": ["En ningún incidente se ha observado que se realicen asunciones incorrectas sobre información no conocida, sino que los errores consisten en equivocaciones en un número, no detectar un vehículo en pista, o fallos de la radio, por ejemplo.", "Que se ha comprobado que las únicas estrategias preventivas se basan en el entrenamiento y la práctica para la reducción al mínimo posible de errores, ya que una vez que se producen, no es posible corregirlos.", "Que se ha comprobado que las estrategias defensivas de trabajo no tienen ningún efecto en seguridad, sino todo lo contrario, al tener un efecto de acumulación de tráfico.", "Ninguna de las demás es correcta"], "ans": 3, "why": "La mayoría de los incidentes presentan alguna asunción (A falsa) y se pueden desarrollar estrategias defensivas y de verificación (B y C falsas). Ninguna de las demás es correcta.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «mayoría de los incidentes de tránsito aéreo presentan alguna asunción. Esto permite desarrollar»", "note": ""}, {"n": 22, "stem": "El indicador de lugar OACI que corresponde al aeródromo de Sabadell:", "opts": ["LESB", "LESA", "LEBA", "LELL"], "ans": 3, "why": "El indicador OACI de Sabadell es LELL. LESB es Son Bonet (Mallorca), LESA Salamanca y LEBA Córdoba.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": ""}, {"n": 23, "stem": "La contribución a Reason en el ámbito de los errores humanos consistió en:", "opts": ["El desarrollo del modelo GEMS (Generic Error Modelling System) y la integración de las actuaciones humanas dentro de un marco más amplio entendiendo todo como un sistema sujeto a condiciones latentes (modelo del queso suizo)", "Sólo desarrolló el modelo GEMS, el modelo del queso suizo corresponde a Rasmussen", "Solo desarrolló el modelo del queso suizo pero no trabajó en ningún momento en el ámbito de los errores humanos", "Reason no tuvo nada que ver con la seguridad en aviación ni en otras industrias"], "ans": 0, "why": "Reason desarrolló el modelo GEMS sobre errores humanos y el modelo del queso suizo, integrando la actuación humana en un sistema con condiciones latentes. El queso suizo no es de Rasmussen.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «Permitió proponer un modelo de clasificación (modelo GEMS General Error Modelling System)»", "note": ""}, {"n": 24, "stem": "Cuál de las siguientes afirmaciones es correcta", "opts": ["Los timones de profundidad controlan el movimiento de cabeceo alrededor del eje vertical.", "El timón de dirección está localizado en el estabilizador vertical en la sección de cola y cerca del borde de salida.", "Los timones de profundidad se actúan pisando los pedales del timón.", "El accionamiento del timón de dirección se efectúa girando la palanca o mando a la izquierda y derecha."], "ans": 1, "why": "El timón de dirección está en el estabilizador vertical, cerca del borde de salida. Los timones de profundidad controlan cabeceo sobre el eje lateral y se accionan con la palanca; el de dirección con los pedales.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «El timón de dirección está localizado en el estabilizador»", "note": ""}, {"n": 25, "stem": "En un determinado momento, dos aeronaves se encuentran en un aeródromo. Una ajusta su altímetro utilizando el QFE y la otra el QNH. Después, ascienden ambas a la vez sin calar los altímetros hasta alcanzar la misma altitud ¿qué sucederá entonces?", "opts": ["Que la diferencia de altitud marcada por ambos altímetros será nula si, al despegar, ambas se encontraban a nivel del mar", "Que la diferencia de altitud marcada por ambos altímetros será nula si, al despegar, la presión atmosférica real era de 1013,25 hPa.", "Que la diferencia de altitud marcada por ambos altímetros corresponderá a la elevación del aeródromo, si al despegar, ambas se encontraban a nivel del mar.", "Que la diferencia de altitud, marcada por ambos altímetros, corresponderá a la elevación del aeródromo si, al despegar, la presión atmosférica real era de 1013,25 hPa."], "ans": 0, "why": "QFE y QNH coinciden si el aeródromo está al nivel del mar, por lo que ambos altímetros marcarán lo mismo y la diferencia será nula. La diferencia solo sería la elevación del aeródromo si este no estuviera a nivel del mar, y 1013,25 hPa no interviene.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 3: «En el caso de que el aeropuerto esté al nivel del mar, el QNH coincidirá con el QFE, si el aeropuerto»", "note": ""}, {"n": 26, "stem": "Identificador de la Oficina del Servicio de Información Aeronáutica del aeródromo de Almería", "opts": ["LEANYNYX", "LERIYUYX", "LEAMYOYX", "Ninguna es correcta"], "ans": 2, "why": "Indicador de lugar de Almería LEAM más el designador YOY (oficina AIS de aeródromo) y la X final: LEAMYOYX. LEANYNYX es la oficina NOTAM internacional.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 2: «Oficina del Servicio de Información Aeronáutica de Aeródromo»", "note": ""}, {"n": 27, "stem": "Respecto a la carga de trabajo se podría afirmar:", "opts": ["Que los estudios demuestran que el mejor nivel de desempeño se obtiene a niveles medios de la carga de trabajo.", "Que los escenarios de baja carga de trabajo dificultan la motivación, y pueden generar monotonía y aburrimiento, induciendo somnolencia fisiológica.", "Que los escenarios de elevada carga de trabajo pueden rebasar la capacidad de una persona y degradar peligrosamente el desempeño.", "todas son ciertas"], "ans": 3, "why": "El manual afirma las tres cosas: mejor desempeño con carga media, monotonía y somnolencia con carga baja, y degradación con carga elevada. Todas son ciertas.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «demuestran que el mejor nivel de desempeño se obtiene a niveles medios de carga de trabajo.»", "note": ""}, {"n": 28, "stem": "La atmósfera ideal, definida por OACI, en la que la distribución de la presión, densidad y temperatura en la atmósfera son independientes de la latitud y época del año, se denomina:", "opts": ["ASA", "ESA", "ISA", "OSA"], "ans": 2, "why": "La atmósfera ideal definida por OACI es la ISA (International Standard Atmosphere). ASA, ESA y OSA no existen con ese significado.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 3: «Esta atmósfera la definió la OACI y fue denominada atmósfera ISA (International»", "note": ""}, {"n": 29, "stem": "El RNAV 3D proporciona:", "opts": ["Posición y guiado en el plano vertical", "Previsiones de tiempo de vuelo entre puntos de la ruta", "Posicionamiento y guiado en el plano horizontal y vertical", "Posicionamiento y guiado en el plano horizontal y vertical, además de cálculo de tiempo en tramos de la ruta"], "ans": 2, "why": "La tabla del manual marca RNAV 2D con posicionamiento en plano horizontal, RNAV 3D añade el plano vertical y solo RNAV 4D añade tiempo de vuelo entre puntos. Por tanto 3D es horizontal más vertical.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": ""}, {"n": 30, "stem": "La marcación angular del blanco en un radar se obtiene…", "opts": ["a partir del ángulo de posición de la antena en el instante de recepción de la señal reflejada", "a partir del tiempo de emisión de la señal", "a partir de la media de tiempo transcurrido desde que se envía la señal de interrogación hata que se recibe la señal reflejada en el blanco", "no siempre existe marcación angular para un blanco detectado"], "ans": 0, "why": "La marcación angular se obtiene del ángulo de la antena al recibir el eco. El tiempo de ida y vuelta da la distancia, no la marcación.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 5: «Marcación angular del blanco: Este parámetro se obtiene a partir del ángulo de posición de la antena en el instante de…»", "note": ""}, {"n": 31, "stem": "La velocidad que proporciona el mejor rendimiento de ascenso en configuración de aproximación con un motor inoperativo, y con la máxima potencia de despegue en el motor operativo(s), es:", "opts": ["La velocidad de ascenso en aterrizaje.", "La velocidad de ascenso en aproximación.", "La velocidad de toma.", "La velocidad de pérdida."], "ans": 1, "why": "Esa es la definición literal de velocidad de ascenso en aproximación. La de ascenso en aterrizaje se define en configuración de aterrizaje.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «Ascenso en aproximación: la velocidad que proporciona el mejor rendimiento de ascenso en configuración de aproximación con un…»", "note": ""}, {"n": 32, "stem": "La fuerza opuesta al empuje es…", "opts": ["…la gravedad.", "…el peso W.", "…la resistencia.", "…la sustentación."], "ans": 2, "why": "Las fuerzas opuestas en el eje longitudinal son empuje y resistencia; peso y sustentación son las del eje vertical.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «Cuando el empuje excede a la resistencia, la velocidad de la aeronave aumentará y el avión»", "note": ""}, {"n": 33, "stem": "En qué documento se pueden consultar los códigos designadores de aerolíneas de IATA", "opts": ["Airline Coding Directory (ACD)", "Doc 8585", "Doc 7910", "Airline Coding Document (ACD)"], "ans": 0, "why": "IATA edita el Airline Coding Directory (ACD). Doc 8585 es el de OACI para designadores de operadores y Doc 7910 el de indicadores de lugar.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 2: «Los códigos designadores de aerolíneas se pueden consultar en el documento “Airline Coding Directory (ACD)”»", "note": ""}, {"n": 34, "stem": "Uno de los modelos más conocidos de conciencia situacional es:", "opts": ["El de Endsley, que contempla los tres niveles de percepción, comprensión y proyección a futuro", "El de Reason, que se basa en ser consciente de los agujeros en el modelo del queso suizo.", "El de Rasmussen, que consiste en tomar conciencia de todo el tráfico que está en el sector y que va a entrar poco tiempo después.", "El de Shorrock, que además es el modelo más empleado en aviación"], "ans": 0, "why": "El modelo de Endsley define tres niveles de conciencia situacional: percepción, comprensión y proyección futura. Reason, Rasmussen y Shorrock corresponden a otros modelos.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «Endsley define el concepto de conciencia situacional como»", "note": ""}, {"n": 35, "stem": "Para que una tormenta tropical alcance la categoría de Huracán ¿qué intensidad deben alcanzar los vientos sostenidos en superficie?", "opts": ["65 kt", "88 kt", "120 kt", "160 kt"], "ans": 0, "why": "El manual fija el huracán en vientos sostenidos mayores de 64 kt; de las opciones, 65 kt es la única que lo cumple sin ser exagerada (34-63 kt es tormenta tropical).", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 3: «Huracán, Ciclón o Tifón, con vientos máximos en superficie mayores a 64 kt.»", "note": ""}, {"n": 36, "stem": "La capacidad máxima", "opts": ["Coincide con la capacidad sostenible en un período de una hora", "En condiciones óptimas coincide con la capacidad declarada", "Solo puede lograrse en períodos cortos de tiempo por ser bastante mayor que la capacidad sostenible", "Es inferior a la capacidad disponible"], "ans": 2, "why": "La capacidad máxima puede ser sensiblemente superior a la sostenible, pero solo durante un periodo no superior a 60 minutos.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 6: «La capacidad máxima, también determinada por la Dirección de Operaciones, podrá ser»", "note": ""}, {"n": 37, "stem": "La dependencia de los servicios de tránsito aéreo del aeródromo de llegada, en caso de aterrizaje en un aeródromo de alternativa, transmitirá el mensaje ARR a", "opts": ["El explotador", "Todos los destinatarios de los datos básicos de plan de vuelo", "El aeródromo de destino únicamente", "Ninguna es correcta"], "ans": 3, "why": "En aterrizaje en alternativa el ARR va al ACC/FIC, a la torre del aeródromo de destino, a la oficina ARO de salida y a los ACC/FIC de las FIR que se habrían cruzado; ninguna opción lo refleja.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 6: «- A la torre de control del aeródromo de destino;»", "note": ""}, {"n": 38, "stem": "Entre las funciones relativas a la ATFM de la Unidad Central ATM están", "opts": ["Centralizar a nivel nacional las funciones de la FMP cuando estas no estén operativas o siempre que así se determine", "Participar en la gestión de la parte civil de la AMC", "Gestionar la base de datos que contiene los detalles del área de operaciones de la red (ENV)", "Monitorizar el sistema para la validación y distribución de los planes de vuelo (IFPS)"], "ans": 0, "why": "Entre las funciones ATFM de la UCATM está centralizar las FMP cuando no estén operativas. Participar en la AMC es función FUA, no ATFM.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 6: «- Centralizar a nivel nacional las funciones de las FMP cuando éstas no»", "note": ""}, {"n": 39, "stem": "¿Cómo se codifica según OACI la descripción del tipo de aeronave de un Tupolev T154?", "opts": ["S2P", "L4J", "L2J", "L3J"], "ans": 3, "why": "El Tupolev Tu-154 es trimotor a reacción: L (avión terrestre), 3 motores, J (jet), es decir L3J.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": ""}, {"n": 41, "stem": "Las superficies de control primarias con las que el piloto consigue el equilibrio del avión son:", "opts": ["Alerones, timones de profundidad y timón de dirección.", "Alerones, timones de profundidad, timón de dirección y trim tabs.", "Alerones, timones de profundidad, timón de dirección y spoilers.", "Alerones, timones de profundidad, timón de dirección y flaps."], "ans": 0, "why": "Las primarias son tres: alerones, timón de profundidad y timón de dirección. Trim tabs, spoilers y flaps son mandos secundarios.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 9: «Las superficies de control primarias con las que el piloto consigue el equilibrio del avión son»", "note": ""}, {"n": 42, "stem": "En el ámbito científico de los factores humanos, hay factores que incrementan la probabilidad de pérdida de rendimiento a la hora de detectar señales o eventos relevantes, como por ejemplo:", "opts": ["tiempo que hay que mantener una atención vigilante, el nivel de atención sostenida necesario", "no hay factores que influyan en ese rendimiento, porque es exclusivamente intrínseco", "el número de tráficos dentro del sector que van en la misma dirección", "el nivel de brillo asignado a cada color en la pantalla radar"], "ans": 0, "why": "El manual cita el tiempo de atención vigilante y el nivel de atención sostenida como factores de pérdida de rendimiento en detección.", "src": "Examen real ENAIRE 16-feb-2023 (adaptado a 2025). Manual ENAIRE, tema 8: «como son el tiempo que hay que mantener una atención vigilante o el nivel de atención»", "note": ""}, {"n": 43, "stem": "Cual de estas afirmaciones es correcta:", "opts": ["Cuando se produce un cambio de importancia operacional en los procedimientos de las cartas, se publica una nueva edición que se distribuye mediante el sistema AIRAC.", "Cuando se produce un cambio de importancia operacional en los procedimientos de las cartas, se publica una nueva edición que se distribuye mediante enmienda regular al AIP, Suplemento Regular o correcciones manuscritas al AIP.", "La revisión de la información topográfica reflejada en las cartas se lleva a cabo continuamente y se publican regularmente reimpresiones enmendadas cuando las fuentes de producción lo permiten.", "Las erratas de información detectadas después de la publ
