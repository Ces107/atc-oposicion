const app=document.getElementById('app'),B=window.ATC_BANK,EN=[["uoe-real-dic2024:1","Whenever she goes out, she stays at ______.",["Maria's","her friends","the house of Maria","All the above are correct"],0,"Possessive ellipsis: \"at Maria's [house]\"."],["uoe-real-dic2024:2","\"We were at the ACDC concert last week.\" \"Were you? So ______!\"",["I was","was I being","I was there","was I"],3,"Inverted \"so + auxiliary + subject\" for emphatic agreement with a past simple statement (\"so was I\")."],["uoe-real-dic2024:3","The ______ was caused by war in the region.",["drought","famine","flood","hurricane"],1,"War disrupts food supply and distribution, causing famine; the other options are natural-disaster words unrelated to war as a cause."],["uoe-real-dic2024:4","I got lost in the city, ______ being quite good at navigating unfamiliar places.",["although","despite","however","even if"],1,"\"Despite\" + gerund (\"despite being good at...\") is the correct concessive structure; \"although/even if\" need a full clause with a subject and verb."],["uoe-real-dic2024:5","My jeans ______ in the wash and they're too small for me now.",["reduced","deteriorated","shrank","diminished"],2,"\"Shrink/shrank/shrunk\" is the specific verb for fabric becoming smaller when washed."],["uoe-real-dic2024:6","I've never seen a man so ______ to his family as Mark is.",["eager","keen","dedicated","interested"],2,"\"Dedicated to\" fits the sense of devotion to family; \"eager/keen/interested\" collocate with activities, not with being devoted to people."],["uoe-real-dic2024:7","Although he would have preferred to carry on working, my dad ______ his career in order to have children.",["devoted","repealed","sacrificed","abolished"],2,"\"Sacrifice one's career\" is the standard collocation for giving something up for a greater priority."],["uoe-real-dic2024:8","The new CEO will take ______ the company's operations next month.",["up","off","over","on"],2,"\"Take over\" = assume control/responsibility for something, exactly the sense here."],["uoe-real-dic2024:9","The Magic Box is a famous tennis ______ in Madrid.",["pitch","court","rink","course"],1,"Tennis is played on a \"court\"; \"pitch\" is for football/rugby, \"rink\" for ice sports, \"course\" for golf."],["uoe-real-dic2024:10","In summer, I get ______ from the chlorine in the pools.",["pinkeye","hoarse","dizzy","fever"],0,"Chlorine exposure is a classic cause of \"pinkeye\" (conjunctivitis); the other symptoms don't specifically link to pool chlorine."],["uoe-real-dic2024:11","The south of the city has long been its most ______ area, with incomes well below average.",["affluent","wealthy","impoverished","loaded"],2,"\"Impoverished\" (poor) matches \"incomes well below average\"; the other three options all mean the opposite (rich)."],["uoe-real-dic2024:12","It was time to change the ______ on the car as they had worn out.",["wheels","wing mirrors","windshield","tires"],3,"Tires are the component that wears out with use and needs periodic replacement."],["uoe-real-dic2024:13","______, we would have chosen an alternate route.",["If we knew earlier","Had we been informed about road closure","If our team was better informed","Did we know about the road closure"],1,"Inverted third conditional (\"Had we been informed...\" = \"If we had been informed...\") is the only grammatically complete and correctly tensed option for a hypothetical past result."],["uoe-real-dic2024:14","\"I'm not the manager here, it's his responsibility to deal with ______, not mine!\"",["customers's complaints","customers' complaints","the customers complaints","customers complaints"],1,"Regular plural noun \"customers\" takes an apostrophe after the s for the possessive (\"customers' complaints\")."],["uoe-real-dic2024:15","Benefits ______ slightly next year, although we don't predict any job losses.",["expect to fall","are expecting to fall","are expected falling","are expected to fall"],3,"Passive \"be expected to + infinitive\" is the correct structure; benefits don't \"expect\" anything themselves (active voice doesn't fit)."],["uoe-real-dic2024:16","No sooner ______ everyone started speaking ill of him.",["had Rishi left than","did Rishi leave when","left Rishi when","Rishi had left than"],0,"\"No sooner + inverted past perfect + than\" is the fixed structure for two events happening in quick succession."],["uoe-real-dic2024:17","Not until we have no choice ______ the business down.",["close we","we will close","will we close","we close"],2,"A negative/restrictive adverbial (\"Not until...\") fronted at the start of a sentence triggers subject-auxiliary inversion in the main clause."],["uoe-real-dic2024:18","Make sure you mix the ingredients well, ______ you might get lumps in your cake.",["unless","otherwise","provided","supposing"],1,"\"Otherwise\" introduces the negative consequence of not following the instruction; \"unless\" would need the clause negated differently."],["uoe-real-dic2024:19","The murderers were convicted and sentenced ______ six months in prison.",["for","on","with","to"],3,"\"Sentenced to [a period/punishment]\" is the fixed legal collocation."],["uoe-real-dic2024:20","I wouldn't call her a friend, she is more like a/an ______ really.",["ancestor","successor","acquaintance","peer"],2,"\"Acquaintance\" (someone you know slightly, less than a friend) is exactly the contrast being drawn."],["uoe-real-dic2024:21","Just as you arrived, I ______ ready to go out.",["have got","would get","have been getting","was getting"],3,"Past continuous describes an action in progress at the moment another action happened (\"just as you arrived\")."],["uoe-real-dic2024:22","I spoke to Michael last night and he says he ______ while he was at the swimming pool of the hotel.",["had stolen his phone","got stolen his phone","was got his phone stolen","had his phone stolen"],3,"Causative \"have something done\" in the past perfect (\"had his phone stolen\") describes something that happened to his possession, not an action he performed."],["uoe-real-dic2024:23","The cathedral seems to have been ______ construction for quite some time.",["in","under","on","below"],1,"\"Under construction\" is the fixed prepositional phrase for a building being built/renovated."],["uoe-real-dic2024:24","Soy is a very important ______ in Brazil.",["agriculture","crop","cattle","livestock"],1,"Soy is a plant, so \"crop\" is the correct countable noun; \"agriculture\" is uncountable/abstract, \"cattle/livestock\" refer to animals."],["uoe-real-dic2024:25","They're staying in my house for the time ______.",["going","making","doing","being"],3,"\"For the time being\" is the fixed idiom meaning \"for now, temporarily\"."],["uoe-real-dic2024:26","The police is still trying to ______ out how they were able to steal so easily.",["figure","think","guess","sort"],0,"\"Figure out\" = work out/understand, the standard phrasal verb for this sense."],["uoe-real-dic2024:27","The population is taken serious ______ against their betrayal politicians, finally.",["activity","action","contrasts","reactions"],1,"\"Take serious action against\" is the standard collocation for responding decisively to a problem."],["uoe-real-dic2024:28","______ of globalization contend that it fosters global cooperation and development.",["Detractors","Opponents","Sceptics","Proponents"],3,"\"Contend that it fosters\" is a positive claim, matching \"proponents\" (supporters); the other three options describe critics, who would argue the opposite."],["uoe-real-dic2024:29","Despite her initial interest in pursuing a career in medical research, she ultimately found her calling in direct patient care and is now a respected ______ with a focus on integrative medicine.",["surgeon","pharmacist","physician","physiotherapist"],2,"\"Physician\" is the general term for a doctor providing direct patient care, matching the context best among the options."],["uoe-real-dic2024:30","Every week, the local ______ is bustling with activity as vendors display an eclectic mix of antiques, vintage clothing, and miscellaneous treasures for bargain hunters to explore.",["artisan market","bazaar","street market","farmer's market"],2,"A \"street market\" is the natural venue for vendors selling a mixed, informal range of second-hand/eclectic goods."],["uoe-real-dic2024:31","The ______ carefully hemmed the wedding gown to fit the bride perfectly.",["furrier","leather craftswoman","artisan","seamstress"],3,"\"Hemming a gown\" is precisely a seamstress's task (someone who sews and alters clothing)."],["uoe-real-dic2024:32","Have you considered applying for a job with the ______ service?",["civil","civic","national","governmental"],0,"\"Civil service\" is the fixed term for public administration employment."],["uoe-real-dic2024:33","Attendance at the museum has ______ significantly since they launched new exhibitions.",["rose","risen","raise","raised"],1,"Present perfect needs the past participle of the intransitive verb \"rise\" (\"has risen\"); \"raise/raised\" is the transitive verb (to raise something)."],["uoe-real-dic2024:34","Despite the unpredictable climate, farmers ______ their fields, relying on advanced technology to anticipate weather patterns and mitigate potential risks.",["steadfastly sow","had steadfastly sowed","have steadfastly sowed","have been steadfastly sowing"],3,"Present perfect continuous emphasises an ongoing repeated practice up to now, matching \"relying on technology\" as a continuous strategy."],["uoe-real-dic2024:35","Rebecca didn't deserve ______ punished quite so severely, if you ask me.",["be","being","to be","to being"],2,"\"Deserve to be + past participle\" is the correct infinitive-passive structure."],["uoe-real-dic2024:36","At the event there were several families, many of ______ children were eagerly participating in the activities.",["who","whom","whose","which"],2,"Possessive relative pronoun \"whose\" is needed before \"children\" (the families' children)."],["uoe-real-dic2024:37","I think you should face up ______ the fact our relationship's over.",["on","with","to","at"],2,"\"Face up to\" is the fixed phrasal verb meaning to accept an unpleasant reality."],["uoe-real-dic2024:38","Please let's continue tomorrow, shall we? It's too much information for me to ______ in in one go.",["take","read","get","listen"],0,"\"Take in\" = absorb/understand information, matching \"too much information... in one go\"."],["uoe-real-dic2024:39","How dare you accuse me ______!",["to cheat","cheating","that I cheat","of cheating"],3,"\"Accuse someone of + gerund\" is the fixed structure."],["uoe-real-dic2024:40","Scarcely had Matt begun his new job ______ he decided to resign.",["that","than","when","but"],2,"\"Scarcely... when\" is the correct pairing for two closely-sequenced past events (parallel to \"no sooner... than\")."],["uoe-real-nov2025:1","Luigi works at a ______ in Rome.",["travel agent's","travel agents","travel's agent","None of the above are correct"],0,"\"At the travel agent's\" is the standard possessive-ellipsis pattern for a shop/office (like \"at the dentist's\", \"at the butcher's\") — the noun after the apostrophe-s is omitted."],["uoe-real-nov2025:2","When Yanis arrived, he soon ______ at all his jokes.",["had everyone laughed","had laughing everyone","had everyone laughing","had laughed everyone"],2,"Causative \"have\" + object + present participle (\"had everyone laughing\") describes causing a state/action."],["uoe-real-nov2025:3","You know what they ______: different strokes for different folks!",["say","tell","speak","state"],0,"\"You know what they say\" is the fixed idiom introducing a proverb."],["uoe-real-nov2025:4","Do you believe in that old ______ about not walking under a ladder?",["curse","misfortune","uncertainty","superstition"],3,"A belief like \"walking under a ladder is bad luck\" is a superstition by definition."],["uoe-real-nov2025:5","What's the ______ number of road accidents in Rome per year?",["approximate","random","close","inexact"],0,"\"The approximate number\" is the natural collocation for a rounded/estimated figure."],["uoe-real-nov2025:6","How many students ______ from university correctly?",["qualify","graduate","depart","exit"],1,"\"Graduate from university\" is the standard collocation for completing a degree."],["uoe-real-nov2025:7","To maintain a healthy lifestyle, it's important to ______ excessive consumption of sugary drinks.",["avoid","prevent","face","confront"],0,"\"Avoid consumption of X\" is the natural collocation; \"prevent\" would need a different object structure (\"prevent people from consuming\")."],["uoe-real-nov2025:8","After examining the X-rays, they told me that ______ was necessary to repair the fractured bone.",["operation","surgery","remedy","cure"],1,"\"Surgery\" is the uncountable noun for a medical operation in general; \"operation\" needs an article (\"an operation\")."],["uoe-real-nov2025:9","After recovering well, the patient was ______ from the hospital and advised to rest at home.",["discharged","transferred","admitted","monitored"],0,"\"Discharged from hospital\" is the standard term for being released after treatment."],["uoe-real-nov2025:10","He broke his arm and had to wear a ______ for several weeks.",["crutch","cast","plaster","bandage"],1,"\"Cast\" is the rigid support for a broken bone in standard English; \"plaster\" (plaster cast) is the British-English near-synonym, but \"cast\" alone is the more general/international term used in the answer key here."],["uoe-real-nov2025:11","The fashion show showcased a variety of colourful and diverse ______, ranging from casual wear to haute couture creations.",["cloths","garments","threads","attire"],1,"\"Garments\" is the neutral plural countable noun for pieces of clothing; \"cloths\" means pieces of fabric (for cleaning etc.), a common spelling confusable with \"clothes\"."],["uoe-real-nov2025:12","The ______ situation in the country has led to job losses and financial uncertainty.",["economics","economy","economical","economic"],3,"\"Economic\" means relating to the economy (economic situation, economic growth); \"economical\" means cost-effective/thrifty — a very common C1 confusable pair, and it does not fit here."],["uoe-real-nov2025:13","Given her Italian heritage, whenever she travels to Italy, she usually stays at her ______.",["ancestral families estate","grandmother's historic villa","ancestral familys' house","grandmothers' historic villa"],1,"Only this option has correct singular possessive punctuation and matches a plausible single owner (\"her grandmother\")."],["uoe-real-nov2025:14","I have ______ my children with meticulous care and unwavering dedication.",["rose","risen","raise","raised"],3,"\"Raise\" (raised/raised) is the transitive verb for bringing up children; \"rise\" (rose/risen) is intransitive and doesn't take a direct object like \"my children\"."],["uoe-real-nov2025:15","I ______ it's going to rain tonight, don't you?",["speculate","reflect","reckon","ponder"],2,"\"I reckon\" (= I think/believe, informal) is the natural fit before a tag question like \"don't you?\"."],["uoe-real-nov2025:16","Thanks for thinking of us, but those kinds of political gatherings don't align with my political views. I'm afraid I'll have to ______ your kind invitation.",["decline","deny","condemn","reject"],0,"\"Decline an invitation\" is the standard polite collocation; \"reject\" is too blunt/harsh for a \"kind invitation\" and isn't idiomatic here."],["uoe-real-nov2025:17","This is not the real exam, this is a ______ exam. It's just to train us for the real one.",["false","mock","fake","artificial"],1,"A \"mock exam\" is the standard term for a practice exam."],["uoe-real-nov2025:18","I'm in a real ______ and I just don't know what to do.",["dilemma","paradox","query","hunch"],0,"\"Dilemma\" (a difficult choice) fits \"don't know what to do\"; the others don't fit the sense of indecision."],["uoe-real-nov2025:19","Luckily, only ______ of the medicine got spilt.",["little","a little","few","a few"],1,"\"Medicine\" here is uncountable, so it takes \"a little\" (some, a small amount); \"a few\"/\"few\" are for countable nouns."],["uoe-real-nov2025:20","As a specialist in prenatal and postnatal care, she is highly respected in her field and excels in her role as a dedicated ______, providing essential support to mothers throughout their pregnancy journey.",["nurse","caretaker","gynecologist","midwife"],3,"\"Midwife\" is the precise term for someone who specialises in supporting mothers through prenatal and postnatal care; \"gynecologist\" is a doctor with a broader medical remit, and \"nurse\"/\"caretaker\" are too generic for the description given."],["uoe-set-01:1","The air traffic controller was praised for keeping a ______ head when three aircraft declared emergencies at the same time.",["sharp","calm","cool","quiet"],2,"\"Keep a cool head\" is the fixed collocation (stay calm under pressure). \"Keep calm\" exists, but \"keep a calm head\", \"keep a quiet head\" and \"keep a sharp head\" are not idiomatic."],["uoe-set-01:2","She has always been very good ______ explaining complex procedures to new trainees.",["at","in","on","with"],0,"\"Good at + gerund\" is the dependent preposition for skill. \"Good with\" is used for people or tools (good with children), not for an activity."],["uoe-set-01:3","By the time the supervisor arrived, the controllers ______ the traffic for almost two hours.",["handled","had been handling","have been handling","were handled"],1,"A past perfect continuous is needed for an activity in progress up to a past moment (\"by the time the supervisor arrived\"). The passive \"were handled\" would need a different subject."],["uoe-set-01:4","The airline has decided to ______ all flights until the fog clears.",["put through","call off","turn over","set aside"],1,"\"Call off\" means to cancel. \"Put through\" is to connect (a call), \"turn over\" is to hand over or flip, and \"set aside\" is to reserve or ignore."],["uoe-set-01:5","I would have phoned you yesterday if I ______ your number.",["had","would have","have had","had had"],3,"Third conditional: if + past perfect, would have + past participle. \"Had had\" is the past perfect of \"have\" (possess)."],["uoe-set-01:6","The new radar system is different ______ the old one in several important ways.",["against","from","of","with"],1,"\"Different from\" is the standard dependent preposition."],["uoe-set-01:7","Neither the pilots nor the flight attendant ______ aware of the change in the schedule.",["were","are","was","have been"],2,"With \"neither... nor\" the verb agrees with the nearer subject (\"the flight attendant\", singular), so \"was\". The tense is past because the change had already occurred."],["uoe-set-01:8","Despite the heavy rain, the match went ______ as planned.",["in","ahead","through","along"],1,"\"Go ahead\" means to take place, proceed. \"Go through\" means to be approved or to experience, and \"go along\" needs \"with\"."],["uoe-set-01:9","He apologised ______ being late for the briefing.",["for","of","about that","to"],0,"\"Apologise for + gerund\"; the person apologised to is introduced with \"to\" (\"apologise to the captain for being late\")."],["uoe-set-01:10","The team is under a great deal of ______ to finish the software update before the deadline.",["tension","pressure","stress","strain"],1,"\"Under pressure\" and \"put pressure on someone to do something\" take an infinitive. \"Under stress\" and \"under strain\" are also collocations but do not take \"to + infinitive\" of purpose here."],["uoe-set-01:11","\"How long ______ English?\" \"Since I was fifteen.\"",["do you study","are you studying","did you study","have you been studying"],3,"\"Since\" + a point in the past requires a present perfect (continuous here, for an activity in progress up to now). Simple present and past do not link the past to now."],["uoe-set-01:12","I am not used to ______ up so early in the morning.",["get","getting","got","have got"],1,"\"Be used to\" is followed by a gerund (or noun) meaning \"accustomed to\"; \"used to + infinitive\" is a different structure for past habits."],["uoe-set-01:13","The pilot's explanation did not ______ to the passengers, who remained anxious.",["appeal","attract","convince","persuade"],0,"\"Appeal to\" someone means to be attractive or acceptable to them. \"Convince\" and \"persuade\" take a direct object, without \"to\"."],["uoe-set-01:14","Hardly ______ the runway when the engine failed.",["the aircraft had left","did the aircraft leave","the aircraft left","had the aircraft left"],3,"After a negative adverb at the start (\"hardly... when\"), inversion is required with the past perfect: \"had the aircraft left\"."],["uoe-set-01:15","The manager insisted ______ everyone attending the safety course.",["in","on","to","at"],1,"\"Insist on\" is the dependent preposition; \"on + object + gerund\" (everyone attending) is correct. \"Insist that everyone attend\" is the alternative without a preposition."],["uoe-set-01:16","We had a lot of ______ information about the new procedures.",["an useful","usefuls","useful","many useful"],2,"\"Information\" is uncountable: no plural, no \"a/an\", and \"many\" cannot be used with it. \"A lot of useful information\" is correct."],["uoe-set-01:17","The report is due tomorrow, so I will have to work late ______ I want to or not.",["whether","even","if","although"],0,"\"Whether... or not\" expresses that both possibilities do not change the result. \"If\" cannot be used with \"or not\" in this way, and \"although\" needs a contrasting clause."],["uoe-set-01:18","It is high time we ______ the equipment.",["replace","have replaced","will replace","replaced"],3,"After \"it is (high) time\" the past simple is used with present or future meaning, expressing that the action is overdue."],["uoe-set-01:19","The conference was ______ interesting than I had expected.",["much most","very more","far more","more far"],2,"Comparatives are strengthened with \"far\" or \"much\" placed before the comparative; \"very more\" is not possible, and word order \"more far\" is wrong."],["uoe-set-01:20","She succeeded ______ persuading the committee to change its decision.",["at","to","for","in"],3,"\"Succeed in + gerund\" is the dependent preposition."],["uoe-set-01:21","The flight was delayed ______ the strong crosswinds.",["in case of","instead of","in spite of","owing to"],3,"\"Owing to\" introduces a cause. \"Instead of\" is alternative, \"in spite of\" is concession, and \"in case of\" means \"in the event of\"."],["uoe-set-01:22","\"Would you mind ______ the window?\" \"Not at all.\"",["opening","to open","open","opened"],0,"\"Would you mind\" is followed by a gerund."],["uoe-set-01:23","He is said ______ one of the best controllers in the region.",["that he is","being","to be","be"],2,"Personal passive of \"say\": subject + is said + to-infinitive. \"It is said that he is\" would be the impersonal alternative; option A (\"He is said that he is\") mixes the two patterns, \"being\" needs \"to be\", and \"be\" lacks \"to\"."],["uoe-set-01:24","The two runways are ______ from each other by a taxiway.",["split","removed","separated","parted"],2,"\"Separated from... by\" is the natural collocation for things kept apart by something between them. \"Split\" and \"parted\" do not take \"from... by\" naturally."],["uoe-set-01:25","I'd rather you ______ smoke in the terminal.",["didn't","don't","won't","not to"],0,"\"Would rather + subject + past simple\" expresses a preference about another person's present or future behaviour."],["uoe-set-02:1","The airport authority has ______ a new procedure to reduce noise at night.",["put up with","taken over","set off","brought in"],3,"\"Bring in\" means to introduce (a rule, a law). \"Take over\" is to assume control, \"set off\" is to start a journey or trigger, and \"put up with\" is to tolerate."],["uoe-set-02:2","I remember ______ the door before I left, so it cannot be my fault.",["to lock","lock","to have locked","locking"],3,"\"Remember + gerund\" refers to recalling a past action; \"remember + to-infinitive\" means not forgetting to do something."],["uoe-set-02:3","______ the difficult weather, the crew managed to land safely.",["Despite","Although","However","Even though of"],0,"\"Despite\" is a preposition followed by a noun phrase. \"Although\" needs a clause, \"however\" is a linking adverb, and \"even though of\" is not English."],["uoe-set-02:4","She is <strong><em>_</em>_ university graduate with </strong>____ excellent command of English.",["a / an","an / an","a / the","the / a"],0,"The article depends on the initial sound: \"university\" begins with /j/ (a consonant sound), so \"a\"; \"excellent\" begins with a vowel sound, so \"an\"."],["uoe-set-02:5","The trainees were made ______ the procedure again after they failed the test.",["to repeat","repeat","repeating","for repeating"],0,"\"Make\" takes a bare infinitive in the active (\"made them repeat\"), but in the passive it takes a to-infinitive (\"were made to repeat\")."],["uoe-set-02:6","We must find a way to ______ with the growing volume of traffic.",["handle","manage","cope","control"],2,"\"Cope with\" takes the preposition given in the stem. \"Manage\", \"handle\" and \"control\" are transitive verbs used without \"with\" (\"handle the volume\"), so they cannot fill the gap before \"with the growing volume\"."],["uoe-set-02:7","The engineer denied ______ the warning light.",["ignoring","to ignore","having ignore","ignore"],0,"\"Deny\" is followed by a gerund (\"denied ignoring\" or \"denied having ignored\")."],["uoe-set-02:8","It was ______ a long delay that many passengers gave up and went home.",["very","so","too","such"],3,"\"Such + a/an + adjective + noun... that\" expresses result. \"So\" cannot stand directly before \"a long delay\" (it would need \"so long a delay\"), and \"too\" and \"very\" do not combine with \"that\"."],["uoe-set-02:9","I would like to ______ you of the change in the meeting time.",["remember","remind","recall","recollect"],1,"\"Remind somebody of/about something\" is the structure. \"Remember\", \"recall\" and \"recollect\" do not take a person as indirect object in this way."],["uoe-set-02:10","The instructions were so unclear ______ nobody knew what to do.",["as","which","than","that"],3,"\"So + adjective + that\" introduces the result clause."],["uoe-set-02:11","Not only ______ late, but he also forgot the documents.",["he arrived","arrived he","did he arrive","he did arrive"],2,"\"Not only\" at the start of a sentence triggers subject-auxiliary inversion."],["uoe-set-02:12","She has ______ progress in her English since she started the course.",["done","made","taken","got"],1,"\"Make progress\" is the fixed collocation."],["uoe-set-02:13","The company is looking forward ______ the new terminal next year.",["to open","opening","to opening","for opening"],2,"In \"look forward to\", \"to\" is a preposition, so it is followed by a gerund."],["uoe-set-02:14","There are ______ people in the waiting room, so we can start.",["a little","few","a few","little"],2,"\"A few\" is positive (some, enough), \"few\" is negative (hardly any), and \"little\" and \"a little\" are used with uncountable nouns."],["uoe-set-02:15","The meeting has been put ______ until next week because of illness.",["out","off","away","down"],1,"\"Put off\" means to postpone."],["uoe-set-02:16","\"I'm afraid I can't help you: the deadline was yesterday.\" \"______ I had asked you earlier!\"",["If only","As long as","Provided","Unless"],0,"\"If only + past perfect\" expresses regret about the past and can stand alone as an exclamation. \"As long as\", \"provided\" and \"unless\" introduce conditions, so they need a main clause (\"Unless I had asked you earlier, ...\") and cannot end the sentence here."],["uoe-set-02:17","The supervisor suggested ______ the shift pattern.",["to change","us to change","changing","that we to change"],2,"\"Suggest\" is followed by a gerund or a that-clause; it never takes \"to + infinitive\" or \"object + to-infinitive\"."],["uoe-set-02:18","I have no idea ______ she left so suddenly.",["that","which","why","what"],2,"\"Why\" introduces an indirect question about the reason."],["uoe-set-02:19","We ran ______ of fuel just before we reached the airport.",["out","off","away","down"],0,"\"Run out of\" means to have no more of something."],["uoe-set-02:20","______ the two options, the second is clearly the more economical.",["Among","Between","Amid","Amongst all"],1,"\"Between\" is used for two items; \"among\" is used for three or more."],["uoe-set-02:21","The passengers were ______ to leave the aircraft through the emergency exits.",["said","told","spoken","talked"],1,"\"Tell someone to do something\" (passive: \"were told to\"). \"Say\" cannot take an object person plus infinitive."],["uoe-set-02:22","The results were ______ better than anyone had predicted.",["more","very","most","much"],3,"\"Much better\" is a comparative strengthened by \"much\". \"Very\" cannot modify a comparative."],["uoe-set-02:23","He stopped ______ a rest because he was exhausted.",["for taking","taking","take","to take"],3,"\"Stop + to-infinitive\" expresses purpose (stopped in order to take); \"stop + gerund\" means the activity ended."],["uoe-set-02:24","In the ______ of an emergency, passengers should stay calm.",["result","cause","event","matter"],2,"\"In the event of\" is a fixed phrase meaning \"if there is\"."],["uoe-set-02:25","By this time next year, I ______ my training.",["will complete","will have completed","am completing","have completed"],1,"Future perfect for an action that will be finished before a specified future time."],["uoe-set-04:1","\"I will call you as soon as the aircraft lands,\" she said. She said that she ______ me as soon as the aircraft landed.",["would call","will call","had called","calls"],0,"In reported speech after a past reporting verb, \"will\" backshifts to \"would\"."],["uoe-set-04:2","The report, ______ was published last week, criticises the delays.",["that","who","which","what"],2,"In a non-defining relative clause (between commas) \"that\" cannot be used; \"which\" refers to the thing (the report)."],["uoe-set-04:3","______ the instructions carefully, he began the procedure.",["Read","Having read","To have read","Been reading"],1,"A perfect participle clause shows that the first action was completed before the main action (\"Having read..., he began...\")."],["uoe-set-04:4","The runway ______ at the moment, so all flights are diverted.",["is repairing","has repaired","is being repaired","is repaired"],2,"A present continuous passive expresses an action in progress that is done to the runway."],["uoe-set-04:5","The woman ______ car was parked outside is a controller.",["who","which","whom","whose"],3,"\"Whose\" shows possession (\"her car\") in a relative clause."],["uoe-set-04:6","He asked me ______ the day before.",["where had I been","where I had been","where was I","where have I been"],1,"In reported questions the word order is normal (subject then verb) and the tense backshifts (\"had been\")."],["uoe-set-04:7","The pilot, ______ by the noise, decided to abort the take-off.",["alarming","alarmed","to alarm","having alarm"],1,"A past participle clause has a passive meaning (\"who was alarmed by the noise\")."],["uoe-set-04:8","Everyone knew the results ______ published, but nobody had seen them.",["have been","had been","to be","having"],1,"After the past \"knew\", the action (publication) precedes it, so the past perfect passive \"had been published\" is needed."],["uoe-set-04:9","She suggested that he ______ a doctor.",["sees","will see","saw","see"],3,"After \"suggest that\" the subjunctive (bare infinitive) is used in formal English; British English also accepts \"should see\"."],["uoe-set-04:10","The manager is thought ______ the company next year.",["leave","leaving","to be leaving","that he leaves"],2,"Personal passive with a continuous infinitive for a future arrangement: \"is thought to be leaving\"."],["uoe-set-04:11","This is the airport ______ I used to work.",["that","which","where","what"],2,"\"Where\" is a relative adverb of place, replacing \"in which\"."],["uoe-set-04:12","It was the controller ______ noticed the error.",["who","which","whom","whose"],0,"In a cleft sentence (\"It was... who...\") the relative pronoun is the subject of \"noticed\", so \"who\"."],["uoe-set-04:13","She denied ______ the confidential file.",["having seen","to have seen","have seen","being seen it"],0,"\"Deny\" takes a gerund; the perfect gerund \"having seen\" refers to an earlier action."],["uoe-set-04:14","______ the delay, we missed our connecting flight.",["Because","As of","Although","Because of"],3,"\"Because of\" is a compound preposition followed by a noun phrase (\"the delay\"). \"Because\" and \"although\" need a clause, and \"as of\" means \"starting from\" a date."],["uoe-set-04:15","The plane, ______ engines were damaged, landed safely.",["whose","that","which","its"],0,"\"Whose\" joins the plane and its engines and works as a possessive relative."],["uoe-set-04:16","The letter ______ yesterday has not arrived yet.",["posting","posted","which posting","to be posted"],1,"A past participle can reduce a passive relative clause (\"which was posted yesterday\")."],["uoe-set-04:17","\"Don't touch the equipment,\" said the instructor. The instructor told us ______ the equipment.",["not to touch","to not touch","not touch","don't touch"],0,"The negative infinitive is \"not to + verb\"; the split form \"to not touch\" is generally avoided in formal writing."],["uoe-set-04:18","There is a suspicion ______ the data were altered.",["which","what","that","who"],2,"\"That\" introduces a noun clause explaining the content of the noun \"suspicion\"."],["uoe-set-04:19","All the passengers ______ tickets had been cancelled were rebooked.",["who","which","whose","whom"],2,"Possession (\"their tickets\") requires \"whose\" even with people."],["uoe-set-04:20","He is believed ______ the country last night.",["to have left","to leave","leaving","having left"],0,"A perfect infinitive is needed when the belief concerns a past event (\"last night\")."],["uoe-set-04:21","The more you practise, ______ you will become.",["the good","more better","best","the better"],3,"The double comparative structure \"the + comparative, the + comparative\" is used for parallel change."],["uoe-set-04:22","They have their engines ______ every six months.",["checked","checking","check","to check"],0,"Causative \"have + object + past participle\" is used when someone else performs the action."],["uoe-set-04:23","The captain, along with the crew, ______ responsible for the safety of the flight.",["are","have been","were","is"],3,"\"Along with the crew\" is a parenthetical addition and does not change the singular subject \"the captain\"."],["uoe-set-04:24","The instructions had to be followed exactly, ______ the training would have been wasted.",["as well","or else","even so","in case"],1,"\"Or else\" means \"otherwise\" and introduces the consequence of not following the instructions."],["uoe-set-04:25","No sooner ______ the aircraft landed than the fire brigade arrived.",["has","was","did","had"],3,"\"No sooner\" takes past perfect inversion: \"had the aircraft landed\" followed by \"than\"."],["uoe-set-05:1","The inquiry found that the accident was the ______ result of several small errors, none of which was serious alone.",["compound","collective","cumulative","consecutive"],2,"\"Cumulative\" means growing by successive additions, which matches small errors adding up. \"Collective\" refers to a group acting together, and \"consecutive\" means one after another."],["uoe-set-05:2","The airline's reputation has taken a serious ______ following the data leak.",["wound","stroke","hit","bite"],2,"\"Take a hit\" (suffer damage) is the natural collocation with \"reputation\". \"Wound\" is not used with \"take\" in this way, and \"take a stroke\" and \"take a bite\" do not fit here."],["uoe-set-05:3","The new director promised to ______ light on the causes of the delays.",["throw","put","bring","give"],0,"\"Shed light on\" and \"throw light on\" are the fixed collocations meaning to clarify. Only \"throw\" is offered among the options."],["uoe-set-05:4","After the merger, the two companies found themselves ______ odds over the management structure.",["at","in","on","by"],0,"\"At odds (with each other) over/about\" means in disagreement."],["uoe-set-05:5","The trainee's performance left a great ______ to be desired.",["amount","deal","part","lot"],1,"The fixed idiom is \"leave a great deal to be desired\" (be very unsatisfactory). \"A lot\" is not used in this idiom."],["uoe-set-05:6","The minister refused to be ______ down on the exact date of the reform.",["locked","pinned","held","chained"],1,"\"Pin someone down (on/to something)\" means to force them to give a precise answer or decision. \"Locked down\" means put under restriction, \"held down\" means kept in place (or kept a job), and \"chained down\" is only literal."],["uoe-set-05:7","Safety procedures must be observed at all ______.",["means","times","events","ends"],1,"\"At all times\" means always."],["uoe-set-05:8","The proposal met with ______ opposition from the unions.",["hard","thick","fierce","tall"],2,"\"Fierce opposition\" is the standard collocation for strong resistance. \"Hard\" collocates with work."],["uoe-set-05:9","The pilot managed to land the aircraft, but only by the ______ of his teeth.",["tip","edge","skin","grace"],2,"\"By the skin of one's teeth\" is the idiom for barely succeeding."],["uoe-set-05:10","It goes without ______ that safety comes first in aviation.",["telling","knowing","speaking","saying"],3,"\"It goes without saying that\" means it is obvious."],["uoe-set-05:11","The company is ______ to rising fuel costs, which cut into its profits.",["attached","unsheltered","vulnerable","immune"],2,"\"Vulnerable to\" is the usual collocation for being easily harmed by something. \"Unsheltered\" is not used figuratively with \"to\", \"attached to\" means fond of or connected to, and \"immune to\" says the opposite of the relative clause (the costs do cut into its profits)."],["uoe-set-05:12","The two governments reached a ______ agreement after weeks of negotiations.",["fastening","tying","attaching","binding"],3,"\"Binding agreement\" means legally enforceable."],["uoe-set-05:13","Air traffic has ______ to a standstill because of the strike.",["turned","come","gone","got"],1,"\"Come to a standstill\" (or \"grind to a halt\") is the fixed phrase."],["uoe-set-05:14","He was ______ with the task of investigating the incident.",["blamed","accused","commanded","charged"],3,"\"Be charged with\" (a task) means to be given responsibility for it. \"Accused of\" and \"blamed for\" use different prepositions."],["uoe-set-05:15","The results of the survey were ______ inconclusive.",["hardly","largely","barely","scarcely"],1,"\"Largely\" means to a great extent and combines with adjectives like \"inconclusive\". \"Hardly\", \"barely\" and \"scarcely\" have negative meanings and cannot express degree here."],["uoe-set-05:16","The whole system is ______ to failure unless it is regularly maintained.",["inclined","prone","apt","keen"],1,"\"Prone to\" (something bad) is the collocation with \"failure\". \"Inclined\" and \"apt\" take an infinitive, and \"keen\" does not fit."],["uoe-set-05:17","Please ______ in mind that the deadline cannot be extended.",["put","keep","hold","take"],1,"\"Keep/bear in mind\" is the collocation. \"Put in mind\" is archaic, and \"hold\" and \"take\" do not combine with \"in mind\" in this sense."],["uoe-set-05:18","The controller's calm voice had a ______ effect on the frightened pilot.",["soother","sooth","soothed","soothing"],3,"An adjective is needed: \"soothing effect\" (calming)."],["uoe-set-05:19","They finally ______ an agreement after years of dispute.",["beat","hit","struck","knocked"],2,"\"Strike a deal/agreement\" is the fixed collocation."],["uoe-set-05:20","The project has been ______ with problems from the very beginning.",["plagued","infected","diseased","attacked"],0,"\"Be plagued with/by problems\" is the collocation. \"Infected\" would need \"by\" and a real infection."],["uoe-set-05:21","The government has come ______ heavy criticism for its handling of the crisis.",["under","below","beneath","down"],0,"\"Come under criticism/attack/fire\" is the fixed collocation."],["uoe-set-05:22","His remarks were completely ______ of context, and so they gave a false impression.",["out","off","away","apart"],0,"\"Out of context\" (or \"taken out of context\") is the fixed phrase."],["uoe-set-05:23","The engineer had a ______ escape when the tool slipped from the platform.",["short","thin","slim","narrow"],3,"\"Have a narrow escape\" is the fixed collocation for nearly suffering harm."],["uoe-set-05:24","The two proposals differ ______ in several respects.",["widely","highly","largely","lengthily"],0,"\"Differ widely\" means to be very different. \"Highly\" collocates with \"likely\" or \"recommended\"."],["uoe-set-05:25","It was a ______ of pure luck that nobody was hurt.",["shot","flash","hit","stroke"],3,"\"A stroke of luck\" is the fixed idiom for a sudden fortunate event."],["uoe-set-06:1","The new rules will ______ into force on 1 January.",["run","come","step","take"],1,"\"Come into force\" (or \"into effect\") is the fixed expression for a law or rule starting to apply."],["uoe-set-06:2","The engineer ______ the fault to a faulty sensor.",["turned down","put down","brought down","let down"],1,"\"Put something down to\" means to attribute it to a cause. \"Turn down\" is to refuse, \"bring down\" is to cause to fall, and \"let down\" is to disappoint."],["uoe-set-06:3","We cannot ______ the possibility that the signal was jammed.",["rule over","rule out","rule in","rule off"],1,"\"Rule out\" means to exclude."],["uoe-set-06:4","The negotiations broke ______ after both sides refused to compromise.",["by","in","over","down"],3,"\"Break down\" means to fail or collapse (of talks). \"Break in\" is to enter illegally or interrupt, and \"break over\" and \"break by\" are not phrasal verbs with this meaning."],["uoe-set-06:5","The captain decided to ______ the flight because of the storm.",["cut off","call off","put across","pull through"],1,"\"Call off\" means to cancel. \"Cut off\" is to disconnect, \"put across\" is to communicate, and \"pull through\" is to survive."],["uoe-set-06:6","I am really ______ with the amount of paperwork.",["fed out","fed in","fed up","fed on"],2,"\"Fed up with\" means bored and annoyed."],["uoe-set-06:7","The plan fell ______ because of the lack of funding.",["through","across","along","into"],0,"\"Fall through\" means to fail to happen. The other particles do not form a phrasal verb with that meaning."],["uoe-set-06:8","The trainees have to ______ up with the fast pace of the course.",["keep","hold","stand","come"],0,"\"Keep up with\" means to stay at the same level or speed as others."],["uoe-set-06:9","Only after the investigation did the true cause ______ to light.",["bring","come","get","turn"],1,"\"Come to light\" means to become known. \"Bring to light\" requires an object, and after \"did the true cause\" an intransitive verb is needed."],["uoe-set-06:10","She takes ______ her mother in her patience.",["up","on","after","over"],2,"\"Take after\" means to resemble a family member in character or appearance."],["uoe-set-06:11","The government has ______ up a committee to examine the accident.",["made","put","taken","set"],3,"\"Set up\" means to establish. \"Put up\" is to erect or accommodate, and \"take up\" and \"make up\" have different meanings."],["uoe-set-06:12","The supervisor will ______ over the controller's position at 14:00.",["make","get","put","take"],3,"\"Take over\" means to assume responsibility from someone else; in ATC \"take over a sector/position\"."],["uoe-set-06:13","Many airlines have ______ back on services to save money.",["turned","held","cut","pulled"],2,"\"Cut back on\" means to reduce."],["uoe-set-06:14","I find it hard to ______ up with such rude behaviour.",["deal","keep","come","put"],3,"\"Put up with\" means to tolerate. \"Keep up with\" is to stay level with, \"come up with\" is to produce an idea, and \"deal up with\" does not exist (\"deal with\")."],["uoe-set-06:15","Never ______ the importance of clear communication.",["play down","play up","play on","play off"],0,"\"Play down\" means to make something seem less important."],["uoe-set-06:16","The company ______ a new design for the cockpit.",["came through","came across","came up with","came round"],2,"\"Come up with\" means to produce an idea or plan. \"Come across\" means to find by chance."],["uoe-set-06:17","He was ______ off by the smell of smoke in the cabin.",["tipped","taken","shut","put"],3,"\"Put off\" means to discourage or repel and works in the passive with \"by\". \"Tipped off\" means warned secretly, and \"shut off\" and \"taken off\" have literal meanings."],["uoe-set-06:18","They managed to ______ out the fire before it reached the fuel tanks.",["turn","take","put","make"],2,"\"Put out\" is the phrasal verb used for extinguishing a fire."],["uoe-set-06:19","The meeting has been ______ forward from Friday to Wednesday.",["brought","taken","held","gone"],0,"\"Bring forward\" means to move to an earlier date; the opposite is \"put back\". \"Take forward\" means to develop a plan, so it does not fit a date change."],["uoe-set-06:20","The pilot was ______ by the controller's sudden change of runway.",["taken aback","taken over","taken up","taken off"],0,"\"Be taken aback (by)\" means to be shocked or surprised. The other phrasal verbs have literal meanings (assume control, occupy or begin, remove or leave the ground)."],["uoe-set-06:21","The airline has ______ off the launch of the new route until spring.",["set","put","called","taken"],1,"\"Put off\" means to postpone. \"Set off\" is to begin a journey or trigger, \"call off\" is to cancel (it would not take \"until spring\"), and \"take off\" is to leave the ground."],["uoe-set-06:22","It is difficult to ______ out exactly what caused the failure.",["figure","go","put","break"],0,"\"Figure out\" means to understand or solve. \"Work out\" would also be possible but it is not offered."],["uoe-set-06:23","The instructor asked the trainees to ______ through the checklist once more.",["stand","put","make","go"],3,"\"Go through\" means to review something carefully, step by step."],["uoe-set-06:24","The airline is planning to ______ out the old fleet by 2030.",["step","fade","phase","wear"],2,"\"Phase out\" means to remove gradually."],["uoe-set-06:25","Flights were ______ to other airports because of the fog.",["detoured","deviated","diverted","diverged"],2,"\"Divert\" is the standard aviation verb for redirecting a flight. \"Deviate\" is used for departing from a course by choice, \"detour\" is a noun or road term, and \"diverge\" means to separate."],["uoe-set-07:1","Under no circumstances ______ the door to the control room be left open.",["it must","must","should it","does"],1,"After a negative adverbial at the start (\"under no circumstances\"), the auxiliary comes before the subject: \"must the door... be left\". Option A does not invert, and C and D leave the sentence ungrammatical."],["uoe-set-07:2","Had the crew reacted sooner, the accident ______ avoided.",["would be","will have been","had been","would have been"],3,"\"Had + subject + past participle\" is an inverted third conditional (= \"If the crew had reacted sooner\"), so the result clause is \"would have been\"."],["uoe-set-07:3","I am still terrified of flying. If I ______ so afraid of it, I would have accepted that job in Dubai last year. (mixed conditional)",["am not","weren't","wouldn't be","won't be"],1,"A mixed conditional links a permanent or present state to a past result: \"If + past simple (were), would have + past participle\". \"Am not\" and \"won't be\" are real-condition tenses that cannot pair with \"would have accepted\", and \"would\" does not go in the if-clause."],["uoe-set-07:4","I wish I ______ more attention during the training last year.",["paid","would pay","had paid","have paid"],2,"A wish about the past takes the past perfect."],["uoe-set-07:5","It is essential that every pilot ______ the checklist before departure.",["completes","will complete","completed","complete"],3,"After expressions of necessity (\"it is essential that\"), the mandative subjunctive uses the bare infinitive; the same form is used for third person singular (\"every pilot complete\")."],["uoe-set-07:6","Little ______ that the signal was false.",["did they know","they knew","they did know","knew they"],0,"\"Little\" in this negative sense triggers inversion with a dummy auxiliary (\"did they know\")."],["uoe-set-07:7","Should you ______ any difficulty, please contact the help desk.",["having","had","to have","have"],3,"\"Should + subject + bare infinitive\" is a formal conditional inversion meaning \"If you have...\"."],["uoe-set-07:8","Only after the tower had confirmed clearance ______ the runway.",["the aircraft entered","entered the aircraft","the aircraft did enter","did the aircraft enter"],3,"\"Only after + clause\" at the start requires inversion in the main clause, with \"did\"."],["uoe-set-07:9","I would rather you ______ the report to anyone else.",["not to show","didn't show","wouldn't show","haven't shown"],1,"\"Would rather + subject + past simple\" for a preference about present or future; the negative is \"didn't show\"."],["uoe-set-07:10","Were the airport ______ closed, all flights would be cancelled.",["be","being","to be","been"],2,"\"Were + subject + to-infinitive\" is the inverted second conditional for hypothetical events (\"If the airport were to be closed\")."],["uoe-set-07:11","If only he ______ the warning, none of this would have happened.",["heeded","has heeded","would heed","had heeded"],3,"\"If only\" with the past perfect expresses regret about the past."],["uoe-set-07:12","Rarely ______ such a well-organised event.",["have I seen","I have seen","I saw","seen I have"],0,"\"Rarely\" as a negative adverb at the start requires inversion of auxiliary and subject."],["uoe-set-07:13","Supposing the engine ______ during take-off, what would the pilot do?",["fails","had failed","failed","will fail"],2,"\"Supposing\" works like \"if\" in a hypothetical second conditional, followed by the past simple."],["uoe-set-07:14","He insisted that the meeting ______ postponed.",["be","is","was being","would"],0,"After \"insist that\" with a demand meaning, the mandative subjunctive (bare infinitive) is used: \"be postponed\". (When \"insist\" means \"state firmly that something is true\", the indicative is used.)"],["uoe-set-07:15","Not until the storm had passed ______ to take off.",["the aircraft could be cleared","the aircraft was cleared","could the aircraft be cleared","the aircraft to be cleared"],2,"\"Not until + clause\" at the start requires inversion in the main clause."],["uoe-set-07:16","Suppose you ______ the chance again, would you do the same?",["get","got","had got","will get"],1,"\"Suppose\" with a past simple expresses a hypothetical present or future situation."],["uoe-set-07:17","Such ______ the noise that nobody could hear the announcement.",["is","did","it was","was"],3,"\"Such\" at the start of a sentence triggers inversion of the verb \"be\" and the subject: \"Such was the noise that...\"."],["uoe-set-07:18","If you ______ me last week, I would have helped you.",["asked","have asked","would ask","had asked"],3,"Third conditional: if + past perfect, would have + participle."],["uoe-set-07:19","I wish I ______ speak Japanese; it would help me in my new job.",["can","could","will","would"],1,"A wish about a present situation takes the past form of the verb: \"could\". \"Can\" and \"will\" are present forms, and \"would\" is used to express annoyance about someone else's behaviour."],["uoe-set-07:20","Never before ______ such a large number of aircraft in the sector.",["the controller handled","the controller has handled","has the controller handled","handled the controller"],2,"\"Never before\" as a negative adverbial at the start of a sentence requires inversion (auxiliary before subject)."],["uoe-set-07:21","The manager acted as if he ______ everything under control.",["has","had","would have","is having"],1,"\"As if\" for an unreal or doubtful situation takes the past simple, even for present time."],["uoe-set-07:22","It's about time the government ______ something about air pollution.",["did","does","will do","has done"],0,"\"It's about time\" is followed by the past simple with present meaning; the action is overdue."],["uoe-set-07:23","Had it not been for the controller's quick reaction, the two aircraft ______.",["would have collided","would collide","had collided","will collide"],0,"\"Had it not been for\" is an inverted third conditional (\"If it had not been for...\"), so the result clause takes \"would have + past participle\"."],["uoe-set-07:24","He suggested that she ______ to the hospital immediately.",["go","goes","went","would go"],0,"Mandative subjunctive after \"suggest that\": bare infinitive (\"she go\")."],["uoe-set-07:25","I'd sooner ______ by train than by air.",["to travel","travelling","travel","travelled"],2,"\"Would sooner/rather\" followed by a bare infinitive when the subject is the same."],["uoe-set-08:1","______ the pilot needed most was a clear weather report.",["That","Which","What","It"],2,"A wh-cleft (\"What the pilot needed most was...\") puts the emphasis on the complement. \"What\" acts as the object of \"needed\"."],["uoe-set-08:2","It was not until 2015 ______ the new procedure was introduced.",["that","when","which","since"],0,"In \"It was not until... that...\" the connector is \"that\"."],["uoe-set-08:3","______ from the tower, the aircraft could not be seen in the fog.",["Viewing","Viewed","To view","Having view"],1,"A past participle clause with passive meaning (\"when it was viewed from the tower\") has the same subject as the main clause (the aircraft)."],["uoe-set-08:4","The pilot regrets ______ you that the flight has been cancelled.",["having informed","informing","to inform","inform"],2,"\"Regret to + infinitive\" is used to announce bad news now; \"regret + gerund\" refers to regretting a past action."],["uoe-set-08:5","She is ______ honest person I have ever met.",["more","most","a most","the most"],3,"The superlative of long adjectives needs \"the most\". \"A most\" means \"very\" and is not followed by \"ever met\" as a comparison."],["uoe-set-08:6","______ of the two runways is currently open; both are closed for maintenance.",["Any","Either","None","Neither"],3,"\"Neither of the two\" means not one and not the other; it agrees with the fact that both are closed. \"None\" is used for more than two."],["uoe-set-08:7","The number of passengers ______ increased significantly this year.",["have","has","are","were"],1,"\"The number of\" takes a singular verb; \"a number of\" takes a plural verb."],["uoe-set-08:8","Not ______ the instructions, he made several mistakes.",["to understand","understanding","understood","having understand"],1,"A participle clause with an active meaning and a negative uses \"not + -ing\" (\"because he did not understand\")."],["uoe-set-08:9","The airport is ______ hour's drive from the city centre.",["a","the","an","one of"],2,"\"Hour\" begins with a vowel sound (the \"h\" is silent), so the indefinite article is \"an\"."],["uoe-set-08:10","He tried ______ the engine, but it would not start.",["having restarted","to restart","restart","to have restarted"],1,"\"Try + to-infinitive\" means to make an effort (\"tried to restart but failed\"); \"try + gerund\" would mean to experiment with a method."],["uoe-set-08:11","Passengers are advised ______ to the airport at least two hours before departure.",["to arriving","arriving","arrive","to arrive"],3,"\"Advise someone to + infinitive\"; the passive keeps the to-infinitive."],["uoe-set-08:12","Neither the captain nor the co-pilots ______ told about the fault.",["were","was","has been","is"],0,"With \"neither... nor\" the verb agrees with the nearer subject (\"the co-pilots\", plural), and the past tense fits the narrative."],["uoe-set-08:13","There is hardly ______ time left before the deadline.",["any","no","some","many"],0,"\"Hardly\" is negative in meaning, so it is followed by \"any\"; \"hardly no\" is a double negative, and \"many\" needs a countable noun."],["uoe-set-08:14","The two pilots, ______ of whom had over 10,000 flying hours, landed the aircraft in the storm.",["most","all","both","many"],2,"\"Both of whom\" is the partitive relative used for exactly two people. \"All\", \"most\" and \"many\" refer to larger groups."],["uoe-set-08:15","______ the cost, the project is not worth continuing.",["To give","Giving","Gave","Given"],3,"\"Given + noun\" means \"considering\" (a participle used like a preposition)."],["uoe-set-08:16","She has been working here for more ______ ten years.",["than","as","that","of"],0,"\"More than\" is used before numbers; \"as\" and \"that\" are not used in comparisons of this kind."],["uoe-set-08:17","I object ______ being treated like a child.",["to","at","on","with"],0,"\"Object to\" takes a gerund, because \"to\" is a preposition."],["uoe-set-08:18","He went on ______ about the problems for over an hour.",["for talking","talking","talk","to talking"],1,"\"Go on + gerund\" means to continue doing the same thing; \"go on + to-infinitive\" means to do something new next."],["uoe-set-08:19","Each of the controllers ______ a headset.",["have","are having","has","were"],2,"\"Each\" is singular, so the verb agrees in the singular."],["uoe-set-08:20","Air traffic control is ______ demanding job that it requires constant concentration.",["so","such a","such","a so"],1,"\"Such a + adjective + noun + that\" expresses result. \"So\" is used before an adjective without a noun (\"so demanding\"), and \"a so\" is not possible."],["uoe-set-08:21","It was the manager, not the assistant, ______ made the mistake.",["which","whom","who","whose"],2,"In a cleft sentence about a person as the subject, \"who\" is used."],["uoe-set-08:22","The report ______ by an independent panel is due tomorrow.",["written","writing","to write","which writes"],0,"A past participle reduces a passive relative clause (\"which was written by an independent panel\")."],["uoe-set-08:23","______ we have finished the analysis, we will send you the results.",["Once","Whereas","Unless","Although"],0,"\"Once\" means \"as soon as\" and links two future actions; the present perfect is used after it for the completed one."],["uoe-set-08:24","The captain, together with the officers, ______ decided to abort.",["have","were","are","has"],3,"\"Together with\" does not make the subject plural; \"the captain\" is singular."],["uoe-set-08:25","I don't mind ______ late as long as the work is finished.",["worked","to work","work","working"],3,"\"Mind\" is followed by a gerund."],["uoe-set-09:1","The committee is composed ______ representatives from six countries.",["by","with","from","of"],3,"\"Be composed of\" means to be made up of. \"Comprise\" needs no preposition, and \"composed by\" would refer to a composer."],["uoe-set-09:2","The authorities are reluctant to comply ______ the new regulations.",["to","for","with","by"],2,"\"Comply with\" is the dependent preposition."],["uoe-set-09:3","The success of the mission was attributed ______ careful planning.",["with","to","for","at"],1,"\"Attribute something to\" a cause."],["uoe-set-09:4","______ the fact that the weather was poor, the flight departed on time.",["Despite","In spite","Although","However"],0,"\"Despite the fact that\" is correct; \"in spite\" needs \"of\" (\"in spite of the fact that\"). \"Although\" cannot be followed by \"the fact that\", and \"however\" is an adverb."],["uoe-set-09:5","The findings are consistent ______ earlier studies.",["to","on","of","with"],3,"\"Consistent with\" means in agreement with."],["uoe-set-09:6","He was convicted ______ negligence.",["for","with","of","about"],2,"\"Convicted of\" a crime; \"accused of\", \"suspected of\" and \"guilty of\" follow the same pattern."],["uoe-set-09:7","The company benefited ______ the new tax rules.",["from","of","with","on"],0,"\"Benefit from\" is the dependent preposition."],["uoe-set-09:8","The new system is superior ______ the old one.",["than","from","to","of"],2,"Latinate comparatives (\"superior\", \"inferior\", \"prior\", \"senior\") take \"to\", not \"than\"."],["uoe-set-09:9","The delay was brief, ______ costly.",["whereas","despite","albeit","unless"],2,"\"Albeit\" means \"although it is\" and is followed by an adjective or phrase, not a full clause: \"brief, albeit costly\". \"Whereas\" needs a clause, \"despite\" needs a noun phrase, and \"unless\" introduces a condition."],["uoe-set-09:10","______ the delay was unavoidable, the airline still offered the passengers compensation.",["Despite","Although","Because of","Notwithstanding of"],1,"\"Although\" introduces a concessive clause with subject and verb. \"Despite\" and \"because of\" need noun phrases, and \"notwithstanding of\" is not English."],["uoe-set-09:11","Which word is the most formal way of saying \"about\" in a legal document?",["around","concerning","roughly","as for"],1,"\"Concerning\" (or \"regarding\", \"in respect of\") is used in formal writing; the others are informal or have a different meaning (roughly = approximately)."],["uoe-set-09:12","The pilot is responsible ______ the safety of everyone on board.",["of","at","about","for"],3,"\"Responsible for\" (a thing) and \"responsible to\" (a person)."],["uoe-set-09:13","The regulations apply ______ all commercial operators.",["for","to","on","at"],1,"\"Apply to\" means to be relevant to; \"apply for\" means to request."],["uoe-set-09:14","He was accused ______ falsifying the records.",["for","of","with","about"],1,"\"Accuse someone of + gerund\"."],["uoe-set-09:15","The airline is liable ______ any damage to luggage.",["of","with","about","for"],3,"\"Liable for\" means legally responsible; \"liable to\" means likely to (do something bad)."],["uoe-set-09:16","There is no point ______ complaining; nothing will change.",["of","in","to","for"],1,"\"There is no point in + gerund\"."],["uoe-set-09:17","I am writing ______ regard to your application.",["with","in","for","by"],0,"\"With regard to\" (or \"in regard to\") is the fixed formal phrase; \"in regard\" without \"to\" and \"for regard\" do not exist."],["uoe-set-09:18","The plan is doomed ______ failure.",["for","of","to","at"],2,"\"Doomed to\" + noun/infinitive."],["uoe-set-09:19","The captain was not ______ of the fault until after landing.",["aware","known","noticed","realised"],0,"\"Aware of\" is an adjective plus dependent preposition. \"Known\", \"noticed\" and \"realised\" are verbs that do not take \"of\" in this passive pattern."],["uoe-set-09:20","She takes great pride ______ her work as a controller.",["at","in","of","for"],1,"\"Take pride in\" is the fixed expression."],["uoe-set-09:21","Which linker expresses contrast in a formal report?",["Nevertheless","Moreover","Furthermore","Consequently"],0,"\"Nevertheless\" introduces a contrast. \"Moreover\" and \"furthermore\" add information, and \"consequently\" shows result."],["uoe-set-09:22","The results, ______, were not conclusive.",["however","although","despite","whereas"],0,"\"However\" can be inserted between commas as a linking adverb. \"Although\", \"despite\" and \"whereas\" cannot be used parenthetically in this way."],["uoe-set-09:23","The airline is under an obligation ______ its passengers.",["at","for","of","to"],3,"\"An obligation to\" a person (and \"to + infinitive\" for the duty)."],["uoe-set-09:24","I look forward ______ hearing from you.",["in","for","at","to"],3,"\"Look forward to + gerund\", the standard closing in formal letters."],["uoe-set-09:25","The investigation was carried ______ by an independent team.",["on","up","out","off"],2,"\"Carry out\" means to perform or conduct."],["uoe-set-10:1","The airline has ______ a strict policy on the use of electronic devices during take-off.",["adopted","adapted","adept","adjusted"],0,"\"Adopt a policy\" means to start to use it. \"Adapt\" means to change something for a new purpose, \"adjust\" is to make small changes, and \"adept\" is an adjective meaning skilful."],["uoe-set-10:2","Passengers with connecting flights are asked to ______ their luggage at the transfer desk.",["check over","check out","check up","check in"],3,"\"Check in\" luggage means to hand it over to the airline. \"Check out\" is to leave a hotel, \"check up\" is to verify, and \"check over\" is to examine."],["uoe-set-10:3","Bad weather is the main ______ of flight delays in winter.",["cause","reason","origin","outcome"],0,"\"The cause of\" is the collocation for what makes something happen. \"Reason\" is followed by \"for\" or \"why\", \"origin\" refers to where something starts, and \"outcome\" is a result."],["uoe-set-10:4","The pilot was ______ about the possibility of a crosswind on landing.",["concerns","concerning","concern","concerned"],3,"\"Be concerned about\" (worried). \"Concerning\" is a preposition meaning \"about\"."],["uoe-set-10:5","The airport handles ______ 30 million passengers a year.",["approximate","approximation","approximately","approximating"],2,"An adverb is needed before a number: \"approximately\"."],["uoe-set-10:6","Flights were disrupted after a fault in the ______ system.",["navigate","navigation","navigated","navigating"],1,"\"Navigation system\" uses the noun as a modifier, as in \"navigation system\", \"navigation light\". \"Navigate\" is a verb, and \"navigated\" and \"navigating\" are verb forms that do not act as noun modifiers in this compound."],["uoe-set-10:7","The meeting was called to discuss ways of ______ the risk of runway incursions.",["minimise","minimising","minimised","minimisation"],1,"After the preposition \"of\" a gerund is required."],["uoe-set-10:8","The air traffic controllers were ______ a pay rise by the ministry.",["dismissed","prevented","rejected","denied"],3,"\"Deny someone something\" and the passive \"were denied a pay rise\" are correct. \"Rejected\" and \"dismissed\" take the request itself as the object, and \"prevented\" needs \"from + gerund\"."],["uoe-set-10:9","It is a legal ______ to wear a seat belt during take-off.",["require","requirement","required","requisition"],1,"After \"a legal\" a noun is needed: \"requirement\". \"Requisition\" means an official order to take property."],["uoe-set-10:10","The captain kept the passengers ______ of developments throughout the delay.",["information","informing","inform","informed"],3,"\"Keep + object + informed (of/about)\" is the fixed pattern with a past participle."],["uoe-set-10:11","She was ______ to the post of head of operations last month.",["promoted","advanced","upgraded","lifted"],0,"\"Be promoted to\" a post is the collocation for career advancement. \"Upgraded\" is used for equipment or a seat, \"advanced to\" is used for a stage of a competition, and \"lifted\" is only physical or for bans."],["uoe-set-10:12","Air traffic ______ is expected to double over the next twenty years.",["grows","grown","growing","growth"],3,"\"Air traffic growth\" (noun compound) is the subject; the verb \"is expected\" follows."],["uoe-set-10:13","The two controllers ______ each other during yesterday's change of shift.",["brief","briefing","briefed","to brief"],2,"Past simple, since the sentence describes an event during a past shift change; the pronoun \"each other\" follows the verb."],["uoe-set-10:14","The engineer ______ a thorough inspection before the aircraft was cleared for flight.",["carried out","carried on","carried off","carried through"],0,"\"Carry out an inspection\" is the collocation. \"Carry on\" means to continue, \"carry off\" is to succeed in a difficult task, and \"carry through\" is to complete despite difficulty."],["uoe-set-10:15","The runway was closed ______ heavy snowfall.",["in spite of","although","due to","instead of"],2,"\"Due to\" (or \"owing to\") introduces the cause. The other options express concession or alternative."],["uoe-set-10:16","He has been ______ the air traffic control service for fifteen years.",["with","from","by","on"],0,"\"Be with a company or organisation\" is used for employment. \"From\" gives an origin, not membership, \"by\" gives the agent, and \"on\" is used for a team or committee (\"on the board\"), not for a whole service."],["uoe-set-10:17","The success of the operation ______ on good communication between the teams.",["insists","depends","bases","counts"],1,"\"Depend on\" fits the subject (the success... depends on). \"Insist\" needs a different preposition and a personal subject, and \"base\" and \"count\" do not fit this pattern with \"on\" and a non-human subject."],["uoe-set-10:18","The instructions must be followed ______ the letter.",["at","by","to","with"],2,"\"To the letter\" means exactly."],["uoe-set-10:19","The company ______ a new safety culture, encouraging staff to report mistakes freely.",["fetches","fastens","fosters","forbids"],2,"\"Foster\" means to encourage the development of something. \"Forbid\" would contradict the rest of the sentence."],["uoe-set-10:20","Please ______ the enclosed form and return it within seven days.",["fill in","fill up","fill on","fill with"],0,"\"Fill in\" a form is the standard British usage. \"Fill up\" means to make full, and \"fill on\" and \"fill with\" (without an object of the right kind) do not mean completing a form."],["uoe-set-10:21","The report ______ that human error was a contributing factor.",["speaks","tells","states","talks"],2,"\"State that\" is the formal reporting verb. \"Tell\" needs a person as object, and \"speak\" and \"talk\" need a preposition and cannot introduce a that-clause."],["uoe-set-10:22","The trainee was ______ to ask for help when he needed it.",["courage","encouraging","encourage","encouraged"],3,"\"Be encouraged to + infinitive\" in the passive."],["uoe-set-10:23","Working night shifts can have a serious ______ on your health.",["affect","effect","affection","affective"],1,"\"Effect\" is the noun (have an effect on); \"affect\" is the verb."],["uoe-set-10:24","The trainees were split ______ groups of four.",["in","into","to","up"],1,"\"Split into\" groups is the fixed pattern for dividing."],["uoe-set-10:25","The captain assured the passengers ______ there was no danger.",["of that","about","that","to"],2,"\"Assure + person + that-clause\". \"Assure of\" needs a noun (\"assured them of his support\")."],["uoe-set-12:1","The airline came in ______ criticism for cancelling the flights without warning.",["at","with","for","by"],2,"\"Come in for criticism\" means to receive it; it is a fixed phrasal expression."],["uoe-set-12:2","Seldom ______ so many aircraft been delayed at one time.",["has","are","have","do"],2,"\"Seldom\" at the start requires inversion with the auxiliary; \"so many aircraft\" is plural, so \"have\" (present perfect passive, \"have been delayed\")."],["uoe-set-12:3","The findings ______ to suggest that fatigue played a role.",["intend","tempt","tend","attend"],2,"\"Tend to + infinitive\" means to be likely to. \"Tempt\" needs an object, \"intend\" needs a personal subject, and \"attend\" means to be present."],["uoe-set-12:4","Her calm response ______ the tension in the room.",["diffused","defused","confused","refused"],1,"\"Defuse\" means to reduce danger or tension. \"Diffuse\" means to spread out. This is a common confusion."],["uoe-set-12:5","The company is ______ for bankruptcy unless it finds new investors.",["going","heading","coming","taking"],1,"\"Head for\" means to move towards, often a bad outcome (\"heading for bankruptcy\"). \"Going\", \"coming\" and \"taking\" do not combine with \"for\" in this sense."],["uoe-set-12:6","It is not ______ to speak while the controller is transmitting.",["advisor","advisory","advisable","advising"],2,"\"It is advisable to + infinitive\" (recommended). \"Advisory\" is an adjective meaning giving advice and is not used after \"it is\"."],["uoe-set-12:7","The meeting went on for hours, ______ nothing was decided.",["thus","but","because","so that"],1,"\"But\" shows contrast between the length of the meeting and the lack of decision. \"Because\", \"so that\" and \"thus\" give the wrong logic."],["uoe-set-12:8","The pilot had no ______ but to divert to another airport.",["decision","choice","chance","selection"],1,"\"Have no choice but to + infinitive\" is the fixed expression. \"Decision\", \"chance\" and \"selection\" do not collocate with \"but to\"."],["uoe-set-12:9","The whole operation was ______ by a lack of communication.",["handled","hammered","hunted","hampered"],3,"\"Hampered by\" means hindered or obstructed. \"Handled\" is neutral and does not fit \"lack of\"."],["uoe-set-12:10","No sooner had he sat down ______ the phone rang.",["when","then","that","than"],3,"\"No sooner... than\" is the fixed correlative pair; \"hardly... when\" is the parallel structure."],["uoe-set-12:11","I would have called earlier, but I ______ your number.",["didn't have","haven't","wouldn't have","don't have had"],0,"The excuse describes a past state at the time the call could have been made, so the past simple \"didn't have\". \"Haven't\" alone is not used for possession in modern English, \"wouldn't have\" is a result form, not a fact, and \"don't have had\" does not exist."],["uoe-set-12:12","The two companies have agreed to ______ their resources.",["pull","pour","puddle","pool"],3,"\"Pool resources\" means to combine them for shared use."],["uoe-set-12:13","She spoke so quietly that I could ______ hear her.",["barely not","hard","hardly","hardly not"],2,"\"Hardly\" (= almost not) modifies the verb; \"hard\" means with effort, and \"barely not\" and \"hardly not\" are double negatives."],["uoe-set-12:14","The decision was taken in the ______ of national security.",["intention","interesting","interests","interested"],2,"\"In the interests of\" (plural) is the standard fixed phrase in British English."],["uoe-set-12:15","The controller was asked to ______ the incident in writing.",["account in","account of","account on","account for"],3,"\"Account for\" means to explain. The other combinations are not verb phrases with this meaning."],["uoe-set-12:16","The trainees are expected to have ______ the manual by next week.",["got through","gone off","come round","turned up"],0,"\"Get through\" a book or document means to finish it. \"Go off\" is to explode or go bad, \"come round\" is to visit or recover, and \"turn up\" is to arrive."],["uoe-set-12:17","They ______ to pay the fine, arguing that the rule was unfair.",["refused","denied","rejected","resisted"],0,"\"Refuse + to-infinitive\". \"Deny\" and \"resist\" take a gerund, and \"reject\" takes a noun object."],["uoe-set-12:18","The ______ of the two proposals is that the second is cheaper.",["difference","different","differ","differently"],0,"A noun is needed after \"The\" and before \"of\": \"difference\"."],["uoe-set-12:19","Everyone ______ the pilot was relieved when the aircraft landed.",["apart from","except of","instead of","beside"],0,"\"Apart from\" means except. \"Except of\" is not English (\"except\" or \"except for\"), \"instead of\" means in place of, and \"beside\" means next to (\"besides\" would mean in addition to)."],["uoe-set-12:20","The airport ______ to expand to accommodate the growing demand.",["is set","is put","is made","is gone"],0,"\"Be set to + infinitive\" means to be about to or scheduled to."],["uoe-set-12:21","She has a ______ for solving problems quickly.",["knob","knot","nook","knack"],3,"\"A knack for\" means a natural skill. The other words are nouns for a tangle, a corner and a handle."],["uoe-set-12:22","The instructor made it ______ that late arrivals would not be tolerated.",["clear","clearly","clarity","clearing"],0,"\"Make it clear that\" uses an adjective as the object complement."],["uoe-set-12:23","______ his experience, he still made a basic mistake.",["Because of","Despite","Thanks to","Owing to"],1,"\"Despite\" expresses concession, which fits the contrast with \"still\". The other options express cause."],["uoe-set-12:24","The two aircraft came ______ close to colliding.",["perilously","perilous","peril","perils"],0,"An adverb modifies \"close\": \"perilously close\"."],["uoe-set-12:25","The match was postponed ______ the heavy rain.",["although","because","despite","because of"],3,"\"Because of\" is a compound preposition followed by a noun phrase. \"Because\" and \"although\" need a clause, and \"despite\" would contradict the meaning."],["uoe-set-13:1","She had a sore throat and a ______ voice after shouting at the match all afternoon.",["dizzy","numb","swollen","hoarse"],3,"\"Hoarse\" describes a rough, strained voice. \"Dizzy\" is a feeling that things are spinning, \"numb\" means without feeling in a part of the body, and \"swollen\" means bigger than normal (glands, an ankle); none describes a voice."],["uoe-set-13:2","The nurse put a ______ on the small cut on my finger.",["cast","plaster","sling","crutch"],1,"In British English a (sticking) plaster is the small adhesive dressing for a cut (American \"Band-Aid\"). A \"cast\" holds a broken bone, a \"sling\" is a cloth that supports an injured arm, and a \"crutch\" is a stick you lean on to walk."],["uoe-set-13:3","After the operation he was kept in hospital for three days and then ______.",["dismissed","expelled","evicted","discharged"],3,"A patient is \"discharged\" from hospital when allowed to go home. A worker is \"dismissed\" from a job, a pupil is \"expelled\" from a school, and a tenant is \"evicted\" from a home."],["uoe-set-13:4","The doctor wrote me a ______ for antibiotics and told me to take them for a week.",["recipe","receipt","prescription","description"],2,"A \"prescription\" is the doctor's written order for medicine. \"Recipe\" (Spanish \"receta\" de cocina) is for cooking, a \"receipt\" proves you paid, and a \"description\" says what something is like."],["uoe-set-13:5","I can't breathe through my nose; it's completely ______.",["closed","shut","blocked","locked"],2,"A \"blocked\" (or \"stuffy\") nose is the fixed phrase for a cold. \"Closed\", \"shut\" and \"locked\" are used for doors, shops and eyes, never for a nose."],["uoe-set-13:6","A ______ is a doctor who specialises in the illnesses of children.",["podiatrist","gynaecologist","paediatrician","psychiatrist"],2,"A \"paediatrician\" (American \"pediatrician\") treats children. A \"podiatrist\" treats feet, a \"gynaecologist\" treats the female reproductive system, and a \"psychiatrist\" treats mental illness."],["uoe-set-13:7","She ______ her ankle when she slipped on the wet stairs.",["bent","folded","curved","twisted"],3,"You \"twist\" (or \"sprain\") an ankle when you injure it by turning it suddenly. \"Bend\" a knee is a normal movement, \"fold\" is for paper or clothes, and \"curve\" describes a shape."],["uoe-set-13:8","I've got an appointment at the ______ at ten, so I'll be a bit late.",["doctors","doctor's","doctors's","doctor'"],1,"\"At the doctor's\" is the possessive with the noun left out (the doctor's surgery), like \"at the dentist's\" or \"at Maria's\". \"Doctors\" is a plain plural, and \"doctors's\" and \"doctor'\" are not English forms."],["uoe-set-13:9","The hospital wants to shorten waiting lists f
