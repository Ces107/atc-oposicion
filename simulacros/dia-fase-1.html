or ______ surgery, such as hip replacements, which can be planned in advance.",["optional","elective","voluntary","selective"],1,"\"Elective surgery\" is the fixed term for planned, non-emergency operations. \"Optional\", \"voluntary\" and \"selective\" are ordinary adjectives that do not form this medical term."],["uoe-set-13:10","The cut was so deep that it needed six ______.",["stitches","seams","knots","patches"],0,"A doctor closes a wound with \"stitches\". \"Seams\" are the joins in sewn fabric, \"knots\" are tied in string or rope, and \"patches\" are pieces of material that cover a hole."],["uoe-set-13:11","Many people feel ______ when they read in a moving car.",["seasick","carsick","homesick","airsick"],1,"\"Carsick\" is the nausea caused by travelling in a car. \"Seasick\" refers to a boat, \"airsick\" to a plane, and \"homesick\" means missing your home."],["uoe-set-13:12","The vaccine has been shown to ______ the risk of serious illness by 90 %.",["shorten","drop","fall","cut"],3,"\"Cut (or reduce, lower) the risk\" is transitive and collocates with \"risk\". \"Shorten\" is for length or time, \"fall\" is intransitive (the risk falls, nobody \"falls\" it), and transitive \"drop\" (drop prices) does not collocate with \"risk\"."],["uoe-set-13:13","Only when the test results came back ______ how serious the infection was.",["the doctors realised","realised the doctors","did the doctors realise","the doctors did realise"],2,"\"Only when...\" at the start of a sentence forces inversion in the main clause: auxiliary + subject + verb (\"did the doctors realise\"). A and D keep normal order, and B inverts a main verb, which English does not do."],["uoe-set-13:14","I need to ______ before the trip; I can't read road signs clearly any more.",["have my eyes tested","have tested my eyes","have my eyes test","test my eyes by someone"],0,"Causative \"have + object + past participle\" says someone else does the action for you. B is a perfect infinitive (I did it myself, already), C needs the participle \"tested\", and D is not English."],["uoe-set-13:15","\"I didn't sleep at all last night.\" \"______. The neighbours had a party.\"",["So did I","Neither did I","Neither I did","I didn't too"],1,"To agree with a negative statement: \"Neither / Nor + auxiliary + subject\". \"So did I\" agrees with a positive statement, \"Neither I did\" lacks the inversion, and the negative of \"too\" is \"either\" (\"I didn't either\")."],["uoe-set-13:16","It took her weeks to ______ the flu; she was exhausted for a long time afterwards.",["get by","get through to","get round to","get over"],3,"\"Get over\" an illness means to recover from it. \"Get by\" means to manage with little money, \"get through to\" means to make someone understand or reach them by phone, and \"get round to\" means to finally find time to do something."],["uoe-set-13:17","Your blood pressure is too high; you should ______ salt.",["cut back from","cut out of","cut down on","cut off from"],2,"\"Cut down on\" something means to consume less of it. \"Cut out\" (with no \"of\") would mean stop completely, \"cut off from\" means isolated from, and \"cut back from\" is not a phrasal verb with this meaning (\"cut back on\" is)."],["uoe-set-13:18","He was diagnosed ______ diabetes at the age of forty.",["of","from","with","by"],2,"\"Be diagnosed with\" an illness is the fixed dependent preposition. \"Suffer from\" takes \"from\", \"die of\" takes \"of\", and \"by\" would introduce the doctor who made the diagnosis."],["uoe-set-13:19","The doctor advised him ______ smoking immediately.",["to give up","giving up","give up","that he gives up"],0,"\"Advise + person + to-infinitive\". \"Advise + -ing\" is used only without a person (\"she advised giving up\"), the bare infinitive is never used after \"advise\", and the that-clause needs \"should\" (\"advised him that he should give up\"), not the present \"gives\"."],["uoe-set-13:20","The patient's temperature has ______ steadily since this morning.",["raised","risen","rose","arisen"],1,"\"Rise, rose, risen\" is intransitive (something goes up by itself), so the present perfect is \"has risen\". \"Raise\" needs an object (you raise something), \"rose\" is the past simple, not the participle, and \"arise\" means that a problem or situation appears."],["uoe-set-13:21","There's still ______ hope that he will walk again; the doctors say it will just take time.",["a little","little","a few","few"],0,"\"Hope\" is uncountable, and \"a little\" means some (positive), which fits \"will just take time\". \"Little\" without \"a\" means almost none, which contradicts the second clause, and \"a few\" and \"few\" go with countable plurals."],["uoe-set-13:22","The new drug has some unpleasant side ______, such as nausea and headaches.",["effects","affects","results","consequences"],0,"\"Side effects\" is the fixed compound for unwanted effects of a medicine. \"Affect\" is a verb, and \"side results\" and \"side consequences\" do not exist as compounds."],["uoe-set-13:23","After the accident she was in a ______ for two weeks and remembers nothing.",["trance","daze","coma","faint"],2,"A \"coma\" is a long state of deep unconsciousness after injury or illness. A \"trance\" is a dream-like state (hypnosis), a \"daze\" is a short moment of confusion, and a \"faint\" lasts seconds."],["uoe-set-13:24","As a ______, she spends most of her day on the ward giving injections, changing dressings and checking patients' blood pressure.",["surgeon","pharmacist","paramedic","nurse"],3,"Injections, dressings and blood pressure on a hospital ward are a nurse's routine. A \"surgeon\" operates, a \"pharmacist\" prepares and sells medicines, and a \"paramedic\" gives emergency care in an ambulance, not on a ward."],["uoe-set-13:25","The ______ arrived within minutes and gave him first aid before taking him to hospital in the ambulance.",["paramedics","physicians","surgeons","chemists"],0,"\"Paramedics\" are the trained staff of an ambulance. \"Physicians\" are doctors, \"surgeons\" operate in hospital, and in British English \"chemists\" are pharmacists (or a chemist's is a shop)."],["uoe-set-14:1","The ______ took in the waist of my trousers and shortened the sleeves of my jacket.",["tailor","cobbler","upholsterer","jeweller"],0,"A \"tailor\" makes and alters clothes. A \"cobbler\" repairs shoes, an \"upholsterer\" covers sofas and chairs, and a \"jeweller\" makes or sells jewellery."],["uoe-set-14:2","She works as a ______, designing the layout of parks and public gardens.",["gardener","landscape architect","florist","groundskeeper"],1,"\"Designing the layout\" is the work of a landscape architect. A \"gardener\" and a \"groundskeeper\" look after gardens and grounds that already exist, and a \"florist\" sells and arranges cut flowers."],["uoe-set-14:3","She was ______ from her job for repeatedly arriving late.",["resigned","retired","fired","quit"],2,"\"Be fired (from a job)\" is the passive of the employer's action. \"Resign\", \"retire\" and \"quit\" are things the worker does, so they cannot be passive here (\"she resigned\", not \"she was resigned from\")."],["uoe-set-14:4","The company had to ______ two hundred workers when the factory closed.",["lay down","lay out","lay aside","lay off"],3,"\"Lay off\" workers means to end their jobs because there is no work. \"Lay down\" means to establish rules, \"lay out\" means to arrange or spend money, and \"lay aside\" means to save or put away."],["uoe-set-14:5","I would like to ______ for the post of senior engineer advertised on your website.",["candidate","apply","request","solicit"],1,"\"Apply for a job/post\". \"Candidate\" is a noun, \"request\" takes a direct object without \"for\" (\"request information\"), and \"solicit\" means to ask for money, business or support."],["uoe-set-14:6","He's always ______ promises that he can't keep.",["doing","taking","making","putting"],2,"\"Make a promise\" is the fixed collocation (also make a decision, make an effort). \"Do a promise\", \"take a promise\" and \"put a promise\" are not English."],["uoe-set-14:7","The ______ room is on the second floor, next to the head teacher's office.",["teacher's's","teachers's","teachers","teachers'"],3,"A room used by many teachers is \"the teachers' room\": regular plural in -s, apostrophe after the s. \"Teacher's's\" and \"teachers's\" are not English, and \"teachers\" without the apostrophe is a plain plural."],["uoe-set-14:8","Students who fail the exam in June can ______ it in September.",["revise","recover","resit","restore"],2,"In British English you \"resit\" (American \"retake\") an exam you failed. \"Revise\" means to study again before an exam, \"recover\" means to get better or get something back, and \"restore\" means to repair or bring back."],["uoe-set-14:9","Before the exam I need to ______ everything we studied this term.",["revise","resit","retire","recover"],0,"British \"revise\" (American \"review\") means to study material again before an exam. \"Resit\" is taking the exam again, \"retire\" is stopping work, and \"recover\" is getting better."],["uoe-set-14:10","Not only ______ the project on time, but she also came in under budget.",["she finished","did she finish","finished she","she did finish"],1,"\"Not only\" at the start of a sentence triggers auxiliary inversion: \"Not only did she finish\". A and D keep normal order, and C inverts the main verb, which modern English does not allow."],["uoe-set-14:11","We're going to ______ by a professional before we put the house up for sale.",["get painted it","get it paint","get it to paint","get it painted"],3,"Causative \"get + object + past participle\" (= have it painted). A puts the object in the wrong place, B needs the participle, and \"get it to paint\" would mean persuade the house to paint something."],["uoe-set-14:12","My boss made me ______ the whole report again.",["to rewrite","rewrite","rewriting","rewritten"],1,"Active \"make + object + bare infinitive\" (\"made me rewrite\"). The to-infinitive appears only in the passive (\"I was made to rewrite it\"), and the -ing form and participle do not follow \"make + object\" in this meaning."],["uoe-set-14:13","The ______ fitted new pipes in the bathroom and fixed the dripping tap.",["electrician","carpenter","plumber","bricklayer"],2,"Pipes and taps are a plumber's work. An \"electrician\" handles wiring, a \"carpenter\" works with wood, and a \"bricklayer\" builds walls."],["uoe-set-14:14","She is so ______ to her patients that she often stays long after her shift ends.",["committed","keen","eager","fond"],0,"\"Committed (or dedicated, devoted) to someone\" means giving them a lot of time and effort. \"Keen on\", \"eager to + verb\" and \"fond of\" exist, but none takes \"to\" + a person in this sense."],["uoe-set-14:15","Applicants must have at least five years' ______ in a similar role.",["experiences","experiment","expertise","experience"],3,"Work \"experience\" is uncountable and measured in time (\"five years' experience\"). \"Experiences\" are separate events, an \"experiment\" is a scientific test, and \"expertise\" is a level of skill, not something counted in years."],["uoe-set-14:16","Don't ______ your wet coat on the bed!",["lie","lay","lain","laid"],1,"\"Lay, laid, laid\" is transitive (lay something somewhere); an imperative needs the base form \"lay\". \"Lie, lay, lain\" is intransitive (you lie down), and \"laid\" and \"lain\" are not base forms."],["uoe-set-14:17","Could you ______ me at reception while I'm at lunch?",["fill out","fill up with","fill in for","fill in on"],2,"\"Fill in for someone\" means to do their job for a short time. \"Fill out\" is used for forms, \"fill up with\" means to make full of, and \"fill someone in on something\" means to give them information."],["uoe-set-14:18","She has been in charge ______ the training department since 2019.",["of","for","with","on"],0,"\"In charge of\" is the fixed phrase. \"Responsible for\" takes \"for\", but \"in charge\" never does, and \"with\" and \"on\" do not follow it."],["uoe-set-14:19","By the time I retire, I ______ here for over thirty years.",["will work","am working","have worked","will have worked"],3,"Future perfect for a period that will be complete at a future point (\"by the time I retire\"). The future simple and the present continuous do not show completion, and the present perfect refers to now, not to a future moment."],["uoe-set-14:20","He earns a good ______ as a consultant, but he works very long hours.",["life","living","earning","gain"],1,"\"Earn a living\" (or \"make a living\") is the fixed phrase for the money you live on. \"Earn a life\", \"earn an earning\" and \"earn a gain\" are not English."],["uoe-set-14:21","We were ______ to hear that the factory would stay open after all.",["relieved","released","relaxed","relived"],0,"\"Relieved\" is the feeling when a worry ends. \"Released\" means set free, \"relaxed\" means calm (not a reaction to news), and \"relived\" means lived through again."],["uoe-set-14:22","She's a third-year ______ at the University of Valencia, studying chemistry.",["graduate","postgraduate","undergraduate","alumnus"],2,"A student working towards a first degree is an \"undergraduate\". A \"graduate\" has already finished, a \"postgraduate\" studies for a master's or doctorate, and an \"alumnus\" is a former student."],["uoe-set-14:23","The firm offers a generous ______ package, including health insurance and a company car.",["profits","benefits","gains","earnings"],1,"A \"benefits package\" is what an employer gives besides the salary. \"Profits\" belong to the company, \"gains\" are increases, and \"earnings\" are the money you are paid, not extras like insurance or a car."],["uoe-set-14:24","For forty years he worked as a ______, cutting hair and trimming beards in his small shop near the station.",["butcher","baker","bartender","barber"],3,"A \"barber\" cuts men's hair and beards. A \"butcher\" sells meat, a \"baker\" makes bread, and a \"bartender\" serves drinks."],["uoe-set-14:25","With two part-time jobs, she just about manages to make ends ______.",["meet","join","touch","match"],0,"\"Make ends meet\" is the fixed idiom for having just enough money to live. The other verbs do not form the idiom."],["uoe-set-15:1","My black T-shirt has ______ after so many washes; it's grey now.",["paled","faded","bleached","dimmed"],1,"Colours \"fade\" when they lose strength through washing or sunlight. \"Pale\" describes faces or light, \"bleach\" means to whiten something with chemicals (an action someone does), and \"dim\" is for lights becoming less bright."],["uoe-set-15:2","These shoes don't ______ me; they're half a size too small.",["suit","match","fit","go"],2,"\"Fit\" is about size. \"Suit\" means to look good on someone, \"match\" means to be the same colour or style as something else, and \"go (with)\" means to look good together."],["uoe-set-15:3","That blue scarf really ______ your eyes; you should wear that colour more often.",["fits","matches up","takes after","brings out"],3,"\"Bring out\" a feature means to make it more noticeable. \"Fits\" is about size, \"match up\" means to correspond (it takes \"with\"), and \"take after\" means to resemble a relative."],["uoe-set-15:4","I had a flat ______ on the way to work, so I had to change the wheel.",["wheel","tube","tyre","rim"],2,"\"A flat tyre\" (American \"flat tire\") is the fixed phrase. You change the wheel because the tyre is flat; the \"tube\" is inside some tyres, and the \"rim\" is the metal edge of the wheel."],["uoe-set-15:5","The ______ was so dirty that I could hardly see the road ahead.",["windscreen","bonnet","boot","bumper"],0,"You look through the \"windscreen\" (American \"windshield\"). The \"bonnet\" (American \"hood\") covers the engine, the \"boot\" (American \"trunk\") is for luggage, and the \"bumper\" protects the front and back."],["uoe-set-15:6","I bought this cake at the ______ on the corner.",["bakers","baker's","baker's shop's","bakers'"],1,"Shops named after the person who runs them take the possessive with the noun left out: \"at the baker's\" (= the baker's shop), like \"at the travel agent's\". \"Bakers\" is a plain plural, \"baker's shop's\" adds a second, meaningless possessive, and \"bakers'\" would mean belonging to several bakers."],["uoe-set-15:7","We need to ______ the bathroom; the paint is peeling and the tiles are cracked.",["do without","do away","do in","do up"],3,"British \"do up\" a room or house means to repair and redecorate it. \"Do without\" means to manage without something, \"do away with\" (it needs \"with\") means to abolish, and \"do in\" is slang for kill or exhaust."],["uoe-set-15:8","The landlord has put the ______ up again; we now pay 900 euros a month.",["rent","rate","fee","fare"],0,"\"Rent\" is what a tenant pays for a home. A \"fare\" is paid for a journey, a \"fee\" for a professional service or an exam, and \"rate\" is a general word for a price per unit, not the payment for a flat."],["uoe-set-15:9","The bus ______ has gone up to 2.50 euros.",["fee","fare","toll","charge"],1,"\"Fare\" is the price of a journey on public transport. A \"toll\" is paid to use a road or bridge, a \"fee\" is for a service, and \"bus charge\" is not the idiomatic term."],["uoe-set-15:10","I'm not used to ______ on the left; it took me a week to feel comfortable in London.",["drive","driving","have driven","be driving"],1,"In \"be used to\" (accustomed to), \"to\" is a preposition, so it takes a noun or -ing form. A, C and D treat \"to\" as part of an infinitive, which is the pattern of \"used to\" for past habits."],["uoe-set-15:11","She ______ her hair cut short for the summer.",["made","got to","had","let"],2,"Causative \"have + object + past participle\": she paid a hairdresser to do it. \"Make\" and \"let\" are followed by a bare infinitive with an active meaning, and \"got to\" means \"had the chance to\"."],["uoe-set-15:12","\"I've never been to Lisbon.\" \"______. Shall we go together?\"",["Neither have I","So have I","I haven't either too","Neither I have"],0,"\"Never\" makes the statement negative, so agreement is \"Neither / Nor + auxiliary + subject\", with the same auxiliary (have). \"So have I\" agrees with a positive, C doubles \"either\" and \"too\", and D lacks inversion."],["uoe-set-15:13","Could you ______ the potatoes while I prepare the meat?",["shell","scale","peel","pluck"],2,"You \"peel\" potatoes, apples and oranges (remove the skin). You \"shell\" peas, nuts or eggs, \"scale\" a fish and \"pluck\" a chicken's feathers."],["uoe-set-15:14","This steak is very ______; I can hardly cut it.",["hard","tough","strong","rough"],1,"Meat that is difficult to cut or chew is \"tough\" (the opposite is \"tender\"). \"Hard\" is for stone or stale bread, \"strong\" for flavours and coffee, and \"rough\" for surfaces."],["uoe-set-15:15","If the shirt doesn't fit, you can get a ______ as long as you keep the receipt.",["refusal","return","repayment","refund"],3,"A \"refund\" is money given back for something you return to a shop. A \"refusal\" is saying no, a \"repayment\" pays back a loan, and you \"return\" an item but do not \"get a return\"."],["uoe-set-15:16","______ you need any help with your luggage, just ask at reception.",["Should","Were","Had","Would"],0,"\"Should + subject + bare infinitive\" is a formal inverted first conditional (= \"If you need\"). \"Were\" needs \"to\" (\"Were you to need\"), \"Had\" needs a past participle and refers to the past, and \"Would\" cannot start an if-clause."],["uoe-set-15:17","Could you ______ me your car this weekend? Mine is at the garage.",["borrow","lend","rent","hire"],1,"\"Lend\" means to give something for a time (lend someone something). \"Borrow\" is the other direction (borrow something from someone), and \"rent\" and \"hire\" are commercial deals for money, not a favour between friends."],["uoe-set-15:18","We've ______ milk; can you buy some on your way home?",["run over","run into","run out of","run off with"],2,"\"Run out of\" something means to have none left. \"Run over\" means to hit with a vehicle, \"run into\" means to meet by chance, and \"run off with\" means to steal or leave with someone."],["uoe-set-15:19","The flat comes ______ a washing machine and a dishwasher.",["by","along","to","with"],3,"\"Come with\" means to include as part of the deal. \"Come by\" means to obtain, \"come along\" means to arrive or make progress, and \"come to\" means to total or regain consciousness."],["uoe-set-15:20","There's water all over the floor under the sink; one of the ______ must be leaking.",["pipes","plugs","sockets","switches"],0,"Water under a sink comes from a leaking \"pipe\". A \"plug\" closes the sink or connects a device to electricity, and \"sockets\" and \"switches\" are electrical, so they do not leak."],["uoe-set-15:21","After the storm, the whole street was left without ______ for two days.",["force","power","energy","strength"],1,"\"Power\" here means the electricity supply (\"a power cut\", \"without power\"). \"Without energy\" and \"without strength\" describe a tired person, and \"force\" is physical pressure."],["uoe-set-15:22","I bought this coat in the ______ in January; it was half price.",["sales","offers","bargains","discounts"],0,"British \"the sales\" is the period when shops reduce prices (\"in the January sales\"). An item can be \"on offer\" or \"a bargain\" and can have \"a discount\", but none of them takes \"in the\" for a season."],["uoe-set-15:23","The flight was overbooked, so the airline asked for volunteers to give up their ______.",["places","chairs","seats","sits"],2,"On a plane, train or bus you have a \"seat\". \"Chairs\" are furniture, \"sits\" is a verb form, and \"places\" is too general for a booked seat on a flight."],["uoe-set-15:24","Every Sunday the old square fills with stalls selling antiques, second-hand books and all kinds of curiosities, and people come from all over the city to hunt for bargains at the ______.",["supermarket","shopping centre","department store","flea market"],3,"An open-air market of second-hand goods and antiques is a \"flea market\". A supermarket sells food, and a shopping centre and a department store are indoor shops selling new goods."],["uoe-set-15:25","There ______ a lot of luggage on the belt, but none of it was mine.",["were","is being","have been","was"],3,"\"Luggage\" is uncountable, so it takes a singular verb, and \"none of it was mine\" sets the past. \"Were\" and \"have been\" are plural, and \"is being\" is a present continuous that does not fit the past narrative."],["uoe-set-16:1","Years of ______ have left the region's rivers and reservoirs almost empty.",["drought","famine","flood","erosion"],0,"A \"drought\" is a long period without rain, which empties rivers. A \"famine\" is a lack of food (often caused by drought or war), a \"flood\" is too much water, and \"erosion\" is the wearing away of soil or rock."],["uoe-set-16:2","The thief was ______ guilty and sentenced to two years in prison.",["declared","judged","found","made"],2,"A court \"finds someone guilty\" (passive: \"was found guilty\"). \"Declared guilty\", \"judged guilty\" and \"made guilty\" are not the legal collocation."],["uoe-set-16:3","She was arrested ______ suspicion of fraud.",["under","on","for","with"],1,"\"Arrested on suspicion of\" is the fixed legal phrase. \"Under suspicion\" exists, but only after verbs like \"be\", \"come\" or \"remain\" (\"she is under suspicion\"), and \"for suspicion\" and \"with suspicion\" do not form the phrase."],["uoe-set-16:4","The government plans to raise ______ on tobacco and alcohol.",["fines","fees","fares","taxes"],3,"Governments put \"taxes on\" goods. \"Fines\" are punishments, \"fees\" are paid for a service, and \"fares\" are paid for a journey."],["uoe-set-16:5","The country's ______ growth slowed to 1 % last year.",["economic","economical","economics","economist"],0,"\"Economic\" means relating to the economy (economic growth, economic crisis). \"Economical\" means saving money, \"economics\" is the academic subject, and an \"economist\" is a person."],["uoe-set-16:6","It is more ______ to buy a monthly pass than to pay for every journey.",["economic","economical","economy","economist"],1,"\"Economical\" means not costing much money. \"Economic\" relates to the economy as a whole, \"economy\" is a noun, and \"economist\" is a person."],["uoe-set-16:7","Most of the region's farmland is used to grow ______ such as wheat and barley.",["cattle","livestock","crops","harvests"],2,"Plants grown for food are \"crops\". \"Cattle\" and \"livestock\" are farm animals, and a \"harvest\" is the time or act of gathering crops, not what you \"grow\"."],["uoe-set-16:8","Voters will go to the ______ on 23 July to elect a new parliament.",["urns","votes","ballots","polls"],3,"\"Go to the polls\" means to vote in an election. \"Urns\" is a false friend of Spanish \"urnas\" (a ballot box is a \"ballot box\"), and \"go to the votes\" and \"go to the ballots\" are not English."],["uoe-set-16:9","The charity provides food and shelter for ______ people living on the streets.",["homesick","homeless","houseless","roofless"],1,"\"Homeless\" people have no home. \"Homesick\" means missing your home, \"houseless\" is rare (a recent US advocacy term), and \"roofless\" is not used for people."],["uoe-set-16:10","The district is one of the most ______ in the city, with large villas and expensive cars everywhere.",["deprived","affluent","run-down","impoverished"],1,"\"Affluent\" means wealthy, which matches villas and expensive cars. \"Deprived\", \"run-down\" and \"impoverished\" all describe poor areas, the opposite of the clue."],["uoe-set-16:11","The police are asking anyone who ______ the accident to come forward.",["assisted","attended","witnessed","testified"],2,"To \"witness\" an event is to see it happen. \"Assist\" means to help (false friend of \"asistir a\"), \"attend\" is used for going to a meeting or for emergency services going to a scene, and \"testify\" needs \"about\" or \"to\" and is done in court."],["uoe-set-16:12","The protesters refused to ______ until the minister agreed to meet them.",["back up","back out of","back off from","back down"],3,"\"Back down\" means to stop insisting on a demand. \"Back up\" means to support or copy data, and \"back out of\" and \"back off from\" need an object after the particle, which the sentence does not have."],["uoe-set-16:13","Never ______ such a large demonstration in the capital.",["has the city seen","the city has seen","the city saw","saw the city"],0,"\"Never\" at the start of a sentence requires auxiliary inversion: \"Never has the city seen\". B and C keep normal order, and D inverts the main verb, which modern English does not allow."],["uoe-set-16:14","Unemployment ______ further next year, according to the latest forecast.",["expects to rise","is expected rising","is expected to rise","is expecting to raise"],2,"Passive reporting structure: \"be expected + to-infinitive\". Unemployment cannot \"expect\" anything (A, D), the passive needs \"to\" + verb, not -ing (B), and D also uses \"raise\", which needs an object."],["uoe-set-16:15","If the government ______ more in renewable energy ten years ago, we would not depend so much on imported gas now.",["invested","had invested","would have invested","has invested"],1,"A mixed conditional: past condition (\"ten years ago\", so \"if + past perfect\") with a present result (\"would not depend now\"). The past simple would make a present condition, \"would\" does not go in the if-clause, and the present perfect is not a conditional form."],["uoe-set-16:16","Smoking is ______ in all enclosed public spaces.",["avoided","prevented","refused","banned"],3,"A law \"bans\" an activity (passive: \"is banned\"). \"Avoid\" means to keep away from something by choice, \"prevent\" means to stop something happening (it takes \"from\" with a person), and \"refuse\" means to say no to an offer or request."],["uoe-set-16:17","Hundreds of families were ______ from their homes when the river burst its banks.",["evacuated","evicted","expelled","exiled"],0,"People are \"evacuated\" when moved away from danger. \"Evicted\" means forced out by a landlord, \"expelled\" means sent away from a school or a country as a punishment, and \"exiled\" means forced to live abroad."],["uoe-set-16:18","After three days of heavy rain, the river burst its ______.",["shores","banks","edges","coasts"],1,"A river has \"banks\", and \"burst its banks\" is the fixed phrase for flooding. Lakes and seas have \"shores\", the sea has a \"coast\", and \"edges\" is too general."],["uoe-set-16:19","The ______ toys were all over the floor.",["childrens'","childrens","children's","childs'"],2,"\"Children\" is an irregular plural without -s, so the possessive adds 's: \"children's\". \"Childrens'\" and \"childrens\" add an -s that does not exist, and \"childs'\" is not a plural of \"child\"."],["uoe-set-16:20","The company was accused ______ dumping toxic waste into the river.",["of","for","with","about"],0,"\"Accuse someone of + -ing\" (passive: \"was accused of dumping\"). \"Blame someone for\" takes \"for\", \"charge someone with\" takes \"with\", and \"about\" does not follow \"accuse\"."],["uoe-set-16:21","The minister has been ______ fire for her handling of the crisis.",["on","under","in","below"],1,"\"Under fire\" (or \"come under fire\") means strongly criticised. \"On fire\" means burning, and \"in fire\" and \"below fire\" are not English."],["uoe-set-16:22","Someone ______ my wallet on the train yesterday.",["robbed","mugged","burgled","stole"],3,"You \"steal\" a thing (steal a wallet). You \"rob\" a person or a bank, \"mug\" a person in the street with violence, and \"burgle\" a building."],["uoe-set-16:23","Two men ______ a bank at gunpoint in the city centre yesterday morning and escaped with 50,000 euros.",["robbed","stole","burgled","theft"],0,"You \"rob\" a bank or a person: take from them by force or threat (\"at gunpoint\"). You \"steal\" the money, not the bank, \"burgle\" means breaking into a building (usually a home) to steal, and \"theft\" is a noun."],["uoe-set-16:24","Critics of the new airport say its benefits are exaggerated, whereas its ______ claim that it will create thousands of jobs and attract investment to the region.",["opponents","detractors","supporters","sceptics"],2,"\"Whereas\" sets up a contrast with the critics, and the claim is positive, so the gap needs people in favour: \"supporters\" (or proponents). \"Opponents\", \"detractors\" and \"sceptics\" are all critics."],["uoe-set-16:25","Very ______ people turned out to vote, so the result was not considered representative.",["a few","little","less","few"],3,"\"Few\" (without \"a\") with a countable plural means hardly any, which matches \"not representative\"; \"very few\" is the natural intensified form. \"A few\" is positive and cannot take \"very\", and \"little\" and \"less\" go with uncountable nouns."],["uoe-set-17:1","We're not really friends; she's more of an ______ from the gym.",["ancestor","inheritor","accomplice","acquaintance"],3,"An \"acquaintance\" is someone you know a little, less than a friend. An \"ancestor\" is a relative from long ago, an \"inheritor\" receives property after a death, and an \"accomplice\" helps someone commit a crime."],["uoe-set-17:2","My grandfather is very ______; he never forgets a birthday and always sends a card.",["thoughtless","thoughtful","considerable","sensible"],1,"\"Thoughtful\" means kind and attentive to others. \"Thoughtless\" is the opposite, \"considerable\" means large (\"considerate\" would fit), and \"sensible\" means reasonable (false friend of \"sensible\")."],["uoe-set-17:3","She's very ______; she gets upset whenever anyone criticises her work.",["sensible","sensitive","sensational","sensory"],1,"\"Sensitive\" means easily upset (Spanish \"sensible\"). \"Sensible\" means practical and reasonable, \"sensational\" means very exciting or shocking, and \"sensory\" relates to the senses."],["uoe-set-17:4","Breaking a mirror is supposed to bring seven years of bad ______.",["chance","fate","luck","destiny"],2,"\"Bad luck\" is the fixed phrase in this superstition. \"Chance\" is probability, and \"fate\" and \"destiny\" are not qualified as \"bad\" in this saying."],["uoe-set-17:5","I have a ______ that something is wrong; she hasn't answered my calls all day.",["dilemma","query","paradox","hunch"],3,"A \"hunch\" is a feeling that something is true without proof. A \"dilemma\" is a difficult choice, a \"query\" is a question, and a \"paradox\" is a statement that seems to contradict itself."],["uoe-set-17:6","She ______ the news of his death very badly.",["took","got","had","made"],0,"\"Take news well/badly\" means to react to it well or badly. \"Get the news\" means to receive it, and \"had\" and \"made\" do not combine with \"badly\" in this sense."],["uoe-set-17:7","\"I'm really looking forward to the holidays.\" \"So ______ I!\"",["do","am","have","will"],1,"\"So + auxiliary + subject\" repeats the auxiliary of the first sentence: \"I'm (am) looking forward\" gives \"So am I\". \"Do\", \"have\" and \"will\" would answer other verbs."],["uoe-set-17:8","\"She can't swim.\" \"Neither ______ her brother.\"",["does","is","can","could"],2,"The auxiliary must match the first sentence (\"can't\"), in the same tense: \"Neither can her brother\". \"Does\" and \"is\" belong to other verbs, and \"could\" changes the tense."],["uoe-set-17:9","The comedian ______ the audience laughing within seconds.",["had","made","let","caused"],0,"\"Have + object + -ing\" means to cause people to be doing something (\"had everyone laughing\"). \"Make\" and \"let\" take a bare infinitive (\"made them laugh\"), and \"cause\" takes a to-infinitive (\"caused them to laugh\")."],["uoe-set-17:10","I ______ an old school friend at the airport yesterday; I hadn't seen her for years.",["ran over","ran out","ran into","ran through"],2,"\"Run into someone\" means to meet them by chance. \"Run over\" means to hit with a vehicle, \"run out\" means to have none left, and \"run through\" means to rehearse or explain quickly."],["uoe-set-17:11","My brother and I fell ______ years ago and haven't spoken since.",["off","down","through","out"],3,"\"Fall out (with someone)\" means to argue and stop being friendly. \"Fall off\" and \"fall down\" are physical falls, and \"fall through\" means a plan fails to happen."],["uoe-set-17:12","She ______ her grandmother; they have the same eyes and the same sense of humour.",["looks after","takes after","takes over","looks up to"],1,"\"Take after\" a relative means to look or behave like them. \"Look after\" means to care for, \"take over\" means to take control, and \"look up to\" means to admire, which does not explain shared eyes."],["uoe-set-17:13","I was ______ when I heard I had passed; I couldn't stop smiling for days.",["thrilled","thrilling","frightened","ashamed"],0,"\"-ed\" adjectives describe how a person feels: \"thrilled\" = very pleased. \"Thrilling\" describes the thing that causes the feeling, and \"frightened\" and \"ashamed\" contradict the smiling."],["uoe-set-17:14","Her ______ to help others is what makes her such a good doctor.",["willing","willingly","willingness","willed"],2,"After a possessive (\"Her\") a noun is needed: \"willingness to + verb\". \"Willing\" is an adjective, \"willingly\" an adverb, and \"willed\" a past form of the verb."],["uoe-set-17:15","He's ______ to the idea of moving abroad; he says he'll think about it.",["open","opened","opening","opener"],0,"\"Open to an idea\" means willing to consider it. \"Opened\" describes something physically opened, \"opening\" is an -ing form or a noun, and an \"opener\" is a tool."],["uoe-set-17:16","Well, ______ goes, \"better late than never\".",["like the saying","as the saying","as they say it","the saying as"],1,"\"As the saying goes\" is the fixed phrase to introduce a proverb (also \"as they say\", without \"it\"). \"Like the saying goes\" is non-standard, \"as they say it goes\" adds an extra object, and D has the wrong word order."],["uoe-set-17:17","So ______ that she couldn't sleep the night before the interview.",["was she nervous","nervous she was","she was nervous","nervous was she"],3,"\"So + adjective\" at the start of a sentence is followed by inversion of \"be\" and the subject: \"So nervous was she that...\". A puts the adjective after the inversion, and B and C keep normal order."],["uoe-set-17:18","I wish you ______ interrupting me all the time; it's really annoying.",["would stop","stopped","had stopped","will stop"],0,"\"Wish + would\" complains about someone's repeated behaviour that you want to change. \"Stopped\" expresses a wish about a state, \"had stopped\" a regret about the past, and \"will\" is never used after \"wish\"."],["uoe-set-17:19","She's very proud ______ her children's achievements.",["about","of","for","with"],1,"\"Proud of\" is the fixed dependent preposition. \"About\", \"for\" and \"with\" are not used after \"proud\"."],["uoe-set-17:20","Why are you so angry ______ me? I didn't do anything.",["for","on","of","with"],3,"\"Angry with\" a person (American English also \"angry at\"); \"angry about\" a situation. \"For\", \"on\" and \"of\" are not used after \"angry\"."],["uoe-set-17:21","My parents ______ me to study medicine, but I chose engineering.",["insisted","suggested","wanted","proposed"],2,"\"Want + person + to-infinitive\". \"Insist\" takes \"on\" + -ing, \"suggest\" takes -ing or a that-clause (never \"suggest me to\"), and \"propose\" does not take a person + to-infinitive."],["uoe-set-17:22","They got ______ last spring and are getting married next year.",["engaged","married","divorced","separated"],0,"\"Get engaged\" is to agree formally to marry. \"Married\" contradicts \"are getting married next year\", and \"divorced\" and \"separated\" describe the end of a marriage."],["uoe-set-17:23","She's an only ______; she has no brothers or sisters.",["sibling","child","offspring","relative"],1,"\"An only child\" has no brothers or sisters. A \"sibling\" is a brother or sister, \"offspring\" is a formal word for someone's children (not used with \"an only\"), and a \"relative\" is any family member."],["uoe-set-17:24","Although she was only a distant ______ whom he had met once at a wedding, she left him her entire fortune in her will.",["ancestor","descendant","heir","relative"],3,"A \"distant relative\" is a family member who is not closely related. An \"ancestor\" lived long ago and could not meet him at a wedding, a \"descendant\" comes after you in the family line, and the \"heir\" here is him, not her."],["uoe-set-17:25","I've got only ______ close friends, but they're very loyal.",["little","few","a few","a little"],2,"\"Only a few\" + countable plural means a small number. \"Only few\" is not idiomatic, and \"little\" and \"a little\" go with uncountable nouns."],["uoe-set-18:1","We spent the weekend at ______ in the mountains.",["my parents","my parents'","my parents's","my parent's's"],1,"\"At my parents'\" is the plural possessive with the noun left out (= my parents' house): regular plural, apostrophe after the s. \"My parents\" without the apostrophe names the people, not the place, and \"parents's\" and \"parent's's\" are not English forms."],["uoe-set-18:2","Hardly ______ the stadium when it started to pour with rain.",["we had left","did we leave","had we left","we left"],2,"\"Hardly... when\" takes the past perfect with inversion: \"Hardly had we left... when\". A and D keep normal order, and B uses the past simple, which does not fit the \"hardly... when\" sequence."],["uoe-set-18:3","Ice hockey is played on a ______.",["court","pitch","course","rink"],3,"Ice sports are played on a \"rink\". Tennis and basketball use a \"court\", football and rugby a \"pitch\", and golf a \"course\"."],["uoe-set-18:4","The referee showed him a red card and sent him ______ the pitch.",["off","out","away","down"],0,"\"Send someone off\" is the football phrase for making a player leave the game. \"Send out\" means to post or emit, \"send away\" means to make someone leave a place, and \"send down\" means to send to prison (British) or expel from university."],["uoe-set-18:5","After a week in bed with flu, she's still feeling a bit ______ the weather.",["below","beneath","under","over"],2,"\"Under the weather\" is the fixed idiom for slightly ill. The other prepositions do not form the idiom."],["uoe-set-18:6","Several problems have ______ since the new system was introduced.",["aroused","raised","risen","arisen"],3,"\"Arise, arose, arisen\" means that a problem or situation appears. \"Aroused\" is used for feelings and interest, \"raised\" needs an object (problems are raised by someone), and \"risen\" means gone up."],["uoe-set-18:7","Thousands of people died in the ______ that followed three years of failed harvests.",["flood","famine","drought","earthquake"],1,"A \"famine\" is a serious lack of food, which follows failed harvests. A \"drought\" causes failed harvests rather than following them, and floods and earthquakes are not consequences of harvests."],["uoe-set-18:8","The minister refused to ______ responsibility for the failure.",["take","make","do","give"],0,"\"Take (or accept) responsibility for\" is the collocation. \"Make\", \"do\" and \"give\" do not combine with \"responsibility\" in this sense."],["uoe-set-18:9","After all his hard work, he deserves ______.",["being rewarded","be rewarded","to be rewarded","to reward"],2,"\"Deserve + to-infinitive\"; the passive is \"deserve to be rewarded\". British English also allows \"deserves rewarding\", but \"deserves being rewarded\" is not used, B lacks \"to\", and \"to reward\" would mean that he should reward someone else."],["uoe-set-18:10","The company employs 200 people, most of ______ work from home.",["who","whom","whose","which"],1,"After a quantifier + \"of\" (\"most of\", \"some of\", \"many of\") the relative pronoun for people is \"whom\". \"Who\" cannot follow a preposition, \"whose\" needs a noun after it (\"most of whose children\"), and \"which\" is for things."],["uoe-set-18:11","The project ______ serious difficulties when the funding was cut.",["came up to","came down to","came round to","came up against"],3,"\"Come up against\" a problem means to have to deal with it. \"Come up to\" means to approach or reach a standard, \"come down to\" means to depend in the end on, and \"come round to\" means to finally accept an idea."],["uoe-set-18:12","I can't see the cars behind me; the ______ on the driver's side is broken.",["wing mirror","windscreen","bonnet","steering wheel"],0,"The \"wing mirror\" (American \"side mirror\") shows the cars behind on each side. The \"windscreen\" is the front window, the \"bonnet\" covers the engine, and the \"steering wheel\" turns the car."],["uoe-set-18:13","After months of negotiations, the two sides finally reached a ______.",["commitment","promise","compromise","compromising"],2,"\"Reach a compromise\" (an agreement in which both sides give something up) is the collocation. You \"make\" a commitment or a promise but do not \"reach\" one, and \"compromising\" is a verb form or adjective."],["uoe-set-18:14","I ______ dinner when the lights suddenly went out.",["have cooked","was cooking","had been cooked","cook"],1,"The past continuous gives the action in progress when a shorter past event happened. The present perfect and the present simple do not fit a past narrative, and \"had been cooked\" is passive (the dinner was cooked, not \"I\")."],["uoe-set-18:15","He ______ while he was on holiday in Rome.",["stole his wallet","had stolen his wallet","got stolen his wallet","had his wallet stolen"],3,"\"Have + object + past participle\" also describes something bad that happened to you (\"he had his wallet stolen\"). A and B say he stole it himself, and C has the wrong word order."],["uoe-set-18:16","We'll have to make ______ with the old computer until the new one arrives.",["do","due","done","doing"],0,"\"Make do with\" something means to manage with what you have, though it is not ideal. The fixed phrase always uses the base form \"do\"."],["uoe-set-18:17","Before the car was invented, the village ______ spent his days shoeing horses and repairing iron tools in his forge.",["locksmith","goldsmith","blacksmith","silversmith"],2,"A \"blacksmith\" works iron in a forge and shoes horses. A \"locksmith\" makes and repairs locks, and a \"goldsmith\" and a \"silversmith\" make objects of precious metal."],["uoe-set-18:18","Many residents object ______ the new motorway being built so close to their homes.",["to","against","at","with"],0,"\"Object to\" + noun or -ing (\"object to something being done\"). \"Against\" is used with \"protest\" or \"be against\", not with \"object\", and \"at\" and \"with\" do not follow \"object\"."],["uoe-set-18:19","The view from the top of the tower was absolutely ______.",["breathless","breathing","breathable","breathtaking"],3,"\"Breathtaking\" means extremely beautiful and goes with \"absolutely\". A person is \"breathless\" after running, \"breathing\" is the verb form, and \"breathable\" describes fabric or air."],["uoe-set-18:20","The doctor told me to stay at home and keep my leg ______ to reduce the swelling.",["risen","raised","rose","arisen"],1,"\"Keep + object + past participle\": the leg is lifted by someone, so the transitive \"raise, raised, raised\". \"Rise\" and \"arise\" are intransitive (things rise by themselves), and \"rose\" is a past simple."],["uoe-set-18:21","Take an umbrella, ______ you'll get soaked.",["unless","provided","otherwise","in case"],2,"\"Otherwise\" (= if not) introduces the consequence of not following the advice. \"Unless\" and \"provided\" introduce conditions and would change the meaning, and \"in case\" is followed by a present tense without \"will\" and gives a reason for a precaution."],["uoe-set-18:22","The government has promised to create more jobs in ______ areas, where unemployment is twice the national average.",["deprived","depraved","derived","deprecated"],0,"\"Deprived areas\" lack money, jobs and services. \"Depraved\" means morally evil, \"derived\" means taken from a source, and \"deprecated\" means disapproved of or no longer recommended."],["uoe-set-18:23","\"I didn't enjoy the film at all.\" \"______ I. It was far too long.\"",["So did","Neither I did","Either did","Nor did"],3,"Agreement with a negative statement: \"Nor / Neither + auxiliary + subject\" (\"Nor did I\"). \"So did I\" agrees with a positive, B lacks inversion, and \"either\" goes at the end (\"I didn't either\")."],["uoe-set-18:24","Could you ______ an eye on my bag while I go to the toilet?",["put","keep","hold","have"],1,"\"Keep an eye on\" something means to watch it so that nothing happens to it. \"Have an eye for\" means to be good at noticing, and \"put\" and \"hold\" do not form the idiom."],["uoe-set-18:25","Although she trained as a nurse, she later qualified as a doctor and now works as a general ______, seeing patients of all ages at her local health centre.",["practitioner","practician","practiser","practitioner's"],0,"A \"general practitioner\" (GP) is a family doctor. \"Practician\" and \"practiser\" are not the term, and \"practitioner's\" is a possessive that would need a noun after it."]];

const lsSet=(k,v)=>{try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=x=>Math.round(x*100)/100;
const num=x=>r2(x).toFixed(2).replace('.',',');
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
const dateEs=ts=>new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
let R=lsGet(RUN),tickId=null,onKey=null;
if(R&&(R.v!==1||!R.tok||!R.kn||!R.en||!R.ap))R=null;
// banco reconstruido entre medias: fuera las preguntas que ya no existen
if(R)['kn','en'].forEach(k=>{const p=R[k],keep=p.q.map((id,i)=>POOL[k][id]?i:-1).filter(i=>i>=0);
  if(keep.length!==p.q.length){p.o=keep.map(i=>p.o[i]);p.a=keep.map(i=>p.a[i]);p.q=keep.map(i=>p.q[i]);p.cur=0}});
const save=()=>lsSet(RUN,R);
function stop(){if(tickId){clearInterval(tickId);tickId=null}onKey=null}
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function lim(k){return R[k].q.length*SPQ}

/* ---------- sorteo ---------- */
function drawKn(){
  const by={};Object.values(KQ).forEach(q=>{(by[q.t]=by[q.t]||[]).push(q)});
  const ts=Object.keys(by).map(Number).sort((a,b)=>a-b);if(!ts.length)return[];
  const base=Math.floor(P.kn.n/ts.length),plus={};shuffle(ts).slice(0,P.kn.n-base*ts.length).forEach(t=>plus[t]=1);
  let out=[];ts.forEach(t=>{out=out.concat(shuffle(by[t]).slice(0,base+(plus[t]||0)))});
  if(out.length<P.kn.n){const have=new Set(out.map(q=>q.id));out=out.concat(shuffle(Object.values(KQ).filter(q=>!have.has(q.id))).slice(0,P.kn.n-out.length))}
  return out.sort((a,b)=>a.t-b.t).map(q=>q.id)}
function part(ids){return{q:ids,o:ids.map(()=>shuffle([0,1,2,3]).join('')),a:ids.map(()=>-1),cur:0,ts:0,te:0}}
function newDay(){
  const now=Date.now();
  R={v:1,tok:now.toString(36),t0:now,st:'kn',kn:part(drawKn()),en:part(shuffle(Object.keys(EQ)).slice(0,P.en.n)),ap:{ts:0}};
  R.kn.ts=now;save();route()}

/* ---------- puntuación (fallo −0,33, en blanco 0) ---------- */
function score(k){const p=R[k],Q=POOL[k];let c=0,w=0,b=0;p.q.forEach((id,i)=>{const q=Q[id];if(!q)return;const a=p.a[i];if(a<0)b++;else if(a===q.a)c++;else w++});return{c,w,b,net:r2(c-PEN*w)}}
function pts(k,s){return k==='ap'?r2(Math.min(P.ap.max,Math.max(0,s.net*P.ap.max/BEST))):r2(Math.max(0,s.net))}

/* ---------- lo contestado cuenta como estudio ---------- */
function feedTrainer(){
  const S=lsGet(TRK);const T=S&&S.res?S:{res:{},hist:[]};T.hist=T.hist||[];
  let right=0,bad=0;
  R.kn.q.forEach((id,i)=>{const q=KQ[id],a=R.kn.a[i];if(!q||a<0)return;const ok=a===q.a;ok?right++:bad++;
    const r=T.res[id]||{box:0,seen:0,right:0};r.seen++;if(ok){r.right++;r.box=Math.min(5,r.box+1)}else r.box=0;r.ok=ok;r.last=Date.now();T.res[id]=r});
  T.hist.unshift({t:Date.now(),mode:'exam',n:R.kn.q.length,right:right,bad:bad,label:'Día de la Fase 1'});T.hist=T.hist.slice(0,40);
  lsSet(TRK,T)}
function feedEnglish(){
  const by={};
  R.en.q.forEach((id,i)=>{const q=EQ[id],a=R.en.a[i];if(!q||a<0)return;const s=id.split(':'),k='atcquiz:ingles/'+s[0]+'.html';
    by[k]=by[k]||lsGet(k)||{};by[k][s[1]]={pick:a,ok:a===q.a,idx:R.en.o[i].split('').map(Number)}});
  Object.keys(by).forEach(k=>lsSet(k,by[k]))}

/* ---------- pantallas ---------- */
function steps(){
  const order=['kn','en','ap'],cur={kn:0,p1:1,en:1,p2:2,ap:2,done:3}[R?R.st:'x'];
  const dur={kn:fmt(P.kn.n*SPQ),en:fmt(P.en.n*SPQ),ap:fmt(AP_LIM)};
  return '<ol class="steps">'+order.map((k,i)=>`<li class="${cur===undefined?'':i<cur?'done':i===cur?'cur':''}">${P[k].name}<small>${P[k].n} · ${dur[k]}</small></li>`).join('')+'</ol>'}
function wclock(){return R?`<div class="wclk" id="wc">${fmt((Date.now()-R.t0)/1000)}</div>`:''}
function tickW(){const e=$('#wc');if(e&&R)e.textContent=fmt((Date.now()-R.t0)/1000)}
function dblBtn(el,label,ask,fn){let armed=0;el.onclick=()=>{if(armed){fn();return}armed=1;el.textContent=typeof ask==='function'?ask():ask;setTimeout(()=>{armed=0;if(el.isConnected)el.textContent=label},3000)}}

function home(){
  stop();
  show(`<h1>Día de la Fase 1</h1>${steps()}<div class="btns"><button class="go" id="go">Empezar</button></div>${histHtml()}`);
  $('#go').onclick=newDay;$('#go').focus({preventScroll:true})}

function route(){
  stop();
  if(!R){home();return}
  if(R.st==='kn'||R.st==='en'){if(!R[R.st].ts){R[R.st].ts=Date.now();save()}
    if(!R[R.st].q.length||Date.now()>=R[R.st].ts+lim(R.st)*1000){handIn(R.st);return}partView(R.st);return}
  if(R.st==='p1'||R.st==='p2'){pauseView();return}
  if(R.st==='ap'){const rec=apRecord();if(rec){finishDay(rec);return}apView();return}
  if(R.st==='done'&&R.res){resultView();return}
  R=null;lsSet(RUN,null);home()}

function pauseView(){
  const nx=R.st==='p1'?'en':'ap',since=R.st==='p1'?R.kn.te:R.en.te;
  show(`<h1>Día de la Fase 1</h1>${steps()}${wclock()}<div class="runbar"><span>Pausa</span><span id="pz">${fmt((Date.now()-since)/1000)}</span></div>
<div class="btns"><button class="go" id="nx">${P[nx].name}</button><button class="sec" id="drop">Descartar</button></div>`);
  tickId=setInterval(()=>{tickW();const e=$('#pz');if(e)e.textContent=fmt((Date.now()-since)/1000)},500);
  $('#nx').onclick=()=>{if(nx==='en'){R.st='en';R.en.ts=Date.now();save();route()}else launchAp()};
  dblBtn($('#drop'),'Descartar','¿Descartar el día?',discard);
  $('#nx').focus({preventScroll:true})}

function discard(){R=null;lsSet(RUN,null);home()}

function apView(){
  show(`<h1>Día de la Fase 1</h1>${steps()}${wclock()}<div class="btns"><button class="go" id="nx">${R.ap.ts?'Continuar · ':''}${P.ap.name}</button><button class="sec" id="drop">Descartar</button></div>`);
  tickId=setInterval(tickW,500);
  $('#nx').onclick=launchAp;dblBtn($('#drop'),'Descartar','¿Descartar el día?',discard);$('#nx').focus({preventScroll:true})}
function launchAp(){if(!R.ap.ts)R.ap.ts=Date.now();R.st='ap';save();location.href=MOCK+'?dia='+R.tok}
function apRecord(){
  const f=lsGet(DK)||{},ss=((lsGet(APK)||{}).sessions)||[];
  if(!R.ap.ts)return null;
  let rec=null;
  if(f.tok===R.tok&&typeof f.a==='string'&&f.ts)rec=ss.find(s=>s&&s.ts===f.ts)||null;
  if(!rec)for(let i=ss.length-1;i>=0;i--){const s=ss[i];if(s&&!s.paper&&s.ts>=R.ap.ts){rec=s;break}}
  return rec}

/* ---------- una parte (conocimientos o inglés) ---------- */
function partView(k){
  const p=R[k],Q=POOL[k];
  const draw=()=>{
    const i=p.cur,q=Q[p.q[i]],na=p.a.filter(x=>x>=0).length;
    let h=`<div class="runbar"><span>${P[k].name} · ${i+1} de ${p.q.length}</span><span class="clk"><span id="pc">${fmt(p.ts/1000+lim(k)-Date.now()/1000)}</span><small id="wc">${fmt((Date.now()-R.t0)/1000)}</small></span></div>
<div class="prog"><i id="pb" style="width:${100*na/p.q.length}%"></i></div>
<section class="q"><div class="qn">${k==='kn'?'Tema '+q.t:'Use of English'}</div><div class="stem">${q.stem}</div><div id="opts"></div></section>
<div class="btns"><button class="sec" id="prev" aria-label="Anterior"${i===0?' disabled':''}>←</button><button class="sec" id="clr"${p.a[i]<0?' disabled':''}>En blanco</button><button class="go" id="next" aria-label="Siguiente"${i===p.q.length-1?' disabled':''}>→</button><button class="sec" id="end">Entregar</button></div>
<div class="nav" id="nav">${p.q.map((_,j)=>`<button class="nv${p.a[j]>=0?' a':''}${j===i?' cur':''}" data-n="${j}" aria-label="Pregunta ${j+1}">${j+1}</button>`).join('')}</div>`;
    app.innerHTML=h;
    const box=$('#opts');
    p.o[i].split('').map(Number).forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt'+(p.a[i]===oi?' sel':'');b.setAttribute('aria-pressed',String(p.a[i]===oi));b.dataset.oi=oi;b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.o[oi]}</span>`;b.onclick=()=>choose(oi);box.appendChild(b)});
    $('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#clr').onclick=()=>choose(-1);
    $('#nav').onclick=e=>{const b=e.target.closest('.nv');if(b)go(+b.dataset.n)};
    dblBtn($('#end'),'Entregar',()=>{const b=p.a.filter(x=>x<0).length;return b?`¿Entregar? ${b} en blanco`:'¿Entregar?'},()=>handIn(k));
  };
  const choose=oi=>{const i=p.cur;p.a[i]=(oi===p.a[i])?-1:oi;save();
    $$('#opts .opt').forEach(b=>{const on=+b.dataset.oi===p.a[i];b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on))});
    const nb=$(`#nav .nv[data-n="${i}"]`);if(nb)nb.classList.toggle('a',p.a[i]>=0);
    $('#clr').disabled=p.a[i]<0;$('#pb').style.width=(100*p.a.filter(x=>x>=0).length/p.q.length)+'%'};
  const go=n=>{if(n<0||n>=p.q.length||n===p.cur)return;p.cur=n;save();draw();window.scrollTo(0,0)};
  draw();window.scrollTo(0,0);
  tickId=setInterval(()=>{const left=p.ts/1000+lim(k)-Date.now()/1000,e=$('#pc');
    if(e){e.textContent=fmt(left);e.className=left<=60?'over':left<=300?'late':''}tickW();
    if(left<=0)handIn(k)},250);
  onKey=e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;const ix='abcd'.indexOf(key),nx='1234'.indexOf(key);
    if(key.length===1&&ix>=0)choose(+p.o[p.cur][ix]);else if(key.length===1&&nx>=0)choose(+p.o[p.cur][nx]);
    else if(key==='Backspace'||key==='Delete'||key==='0'){if(p.a[p.cur]>=0)choose(p.a[p.cur])}
    else if(key==='ArrowLeft')go(p.cur-1);else if(key==='ArrowRight'||(key==='Enter'&&!(e.target&&e.target.tagName==='BUTTON')))go(p.cur+1);
    else return;e.preventDefault()}}

function handIn(k){
  stop();const p=R[k];p.te=Math.min(Date.now(),p.ts+lim(k)*1000);
  if(k==='kn'){feedTrainer();R.st='p1'}else{feedEnglish();R.st='p2'}
  save();route()}

/* ---------- final ---------- */
function finishDay(rec){
  const now=Date.now(),kn=score('kn'),en=score('en');
  const ap={c:+rec.correct||0,w:+rec.wrong||0,b:+rec.blank||0};ap.net=r2(ap.c-PEN*ap.w);
  const pt={kn:pts('kn',kn),en:pts('en',en),ap:pts('ap',ap)};pt.total=r2(pt.kn+pt.en+pt.ap);
  const secs={kn:Math.round((R.kn.te-R.kn.ts)/1000),en:Math.round((R.en.te-R.en.ts)/1000),ap:Math.round(+rec.secs||0),all:Math.round((now-R.t0)/1000)};
  const ses={ts:now,kn,en,ap,pts:pt,secs};
  const H=lsGet(HIST);const D=H&&Array.isArray(H.sessions)?H:{sessions:[]};D.sessions.push(ses);D.sessions=D.sessions.slice(-30);lsSet(HIST,D);
  R.st='done';R.res=ses;save();resultView()}

function block(k,s,p,secs){
  const m=P[k]||TOT,pass=m.max/2,cls=p>=m.top?'ok':p>=pass?'':'bad',pc=x=>Math.max(0,Math.min(100,100*x/m.max));
  return `<div class="sc"><div class="sch"><span>${m.name||'Total'}</span><span><b class="${cls==='ok'?'good':cls}">${num(p)}</b><small> / ${m.max}</small></span></div>
<div class="sbar ${cls}" role="img" aria-label="${num(p)} de ${m.max}; apto ${pass}; 1.º ${m.top}"><i style="width:${pc(p)}%"></i><u style="left:${pc(pass)}%"></u><u style="left:${pc(m.top)}%"></u><em style="left:${pc(pass)}%">apto ${pass}</em><em class="r" style="left:${pc(m.top)}%">1.º ${m.top}</em></div>
${s?`<div class="scn"><span>✓ <b>${s.c}</b></span><span>✗ <b>${s.w}</b></span><span>– <b>${s.b}</b></span><span>neta <b>${num(s.net)}</b></span><span>⏱ <b>${fmt(secs)}</b></span></div>`:`<div class="scn"><span>⏱ <b>${fmt(secs)}</b></span></div>`}</div>`}

function reviewHtml(k){
  const p=R[k],Q=POOL[k];const miss=[];p.q.forEach((id,i)=>{const q=Q[id];if(q&&p.a[i]!==q.a)miss.push([q,p.a[i],i])});
  if(!miss.length)return'';
  return `<details><summary>${P[k].name} · ${miss.length}</summary>`+miss.map(([q,a,i])=>`<div class="miss"><div class="qn">${i+1}${k==='kn'?' · Tema '+q.t:''}</div><div class="stem">${q.stem}</div><div>${a<0?'<span class="badt">En blanco</span>':'<span class="badt">✗</span> '+q.o[a]}</div><div><span class="okt">✓</span> ${q.o[q.a]}</div>${q.why||q.src?`<div class="exp">${q.why||''}${q.src?`<div class="src">${q.src}</div>`:''}</div>`:''}</div>`).join('')+'</details>'}

function resultView(){
  stop();const s=R.res,apt=['kn','en','ap'].every(k=>s.pts[k]>=P[k].max/2);
  const f=lsGet(DK)||{},rev=f.tok===R.tok&&typeof f.a==='string';
  let h=`<h1>Día de la Fase 1</h1><div class="tot"><b>${num(s.pts.total)}</b><small>/ 120 · 1.º ${TOT.top}</small><span class="verd ${apt?'good':'bad'}">${apt?'Apto':'No apto'}</span></div>
<div class="scn"><span>${dateEs(s.ts)}</span><span>⏱ <b>${fmt(s.secs.all)}</b></span></div>`;
  h+=block('kn',s.kn,s.pts.kn,s.secs.kn)+block('en',s.en,s.pts.en,s.secs.en)+block('ap',s.ap,s.pts.ap,s.secs.ap)+block('tot',null,s.pts.total,s.secs.all);
  h+='<h2>Repasar</h2>'+reviewHtml('kn')+reviewHtml('en')+(rev?`<div class="btns"><button class="sec" id="aprev">${P.ap.name} · revisión →</button></div>`:'');
  h+=`<div class="btns"><button class="go" id="go">Otro día</button></div>`+histHtml();
  show(h);$('#go').onclick=newDay;
  // botón y no enlace: el comprobador de enlaces de build_opo.py leería un href con variables como enlace roto
  if($('#aprev'))$('#aprev').onclick=()=>{location.href=MOCK+'?dia='+R.tok+'&rev=1'}}

function histHtml(){
  const ss=((lsGet(HIST)||{}).sessions||[]).filter(x=>x&&x.pts);if(!ss.length)return'';
  const W=300,H=90,y=v=>H-6-(H-14)*Math.max(0,Math.min(120,v))/120,x=i=>ss.length<2?W/2:14+(W-28)*i/(ss.length-1);
  const line=ss.map((s,i)=>`${x(i).toFixed(1)},${y(s.pts.total).toFixed(1)}`).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total por día"><line class="rf" x1="0" x2="${W}" y1="${y(TOT.top)}" y2="${y(TOT.top)}"/><line class="rf" x1="0" x2="${W}" y1="${y(60)}" y2="${y(60)}"/><text x="2" y="${y(TOT.top)-3}">${TOT.top}</text><text x="2" y="${y(60)-3}">60</text>`;
  if(ss.length>1)svg+=`<polyline class="ln" points="${line}"/>`;
  svg+=ss.map((s,i)=>`<circle class="dt" cx="${x(i).toFixed(1)}" cy="${y(s.pts.total).toFixed(1)}" r="3"/>`).join('')+'</svg>';
  const rows=ss.slice(-5).reverse().map(s=>`<tr><td>${dateEs(s.ts)}</td><td>${num(s.pts.kn)}</td><td>${num(s.pts.en)}</td><td>${num(s.pts.ap)}</td><td><b>${num(s.pts.total)}</b></td></tr>`).join('');
  return `<h2>Historial</h2><div class="trend">${svg}</div><table class="res"><tr><th></th><th>Con.</th><th>Ing.</th><th>Apt.</th><th>Total</th></tr>${rows}</table>`}

document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||!onKey)return;const t=e.target&&e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;onKey(e)});
window.addEventListener('pageshow',e=>{if(e.persisted){R=lsGet(RUN);route()}});
route();
})();
</script></main><script src="../assets/search.js" defer></script><script src="../assets/config.js"></script><script src="../assets/account.js" defer></script><script src="../assets/progress.js" defer></script></body></html>
