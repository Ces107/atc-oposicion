<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réplica de la Fase 1</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Simulacros</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Réplica de la Fase 1</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "It goes without ______ that safety comes first in aviation.", "opts": ["telling", "saying", "speaking", "knowing"], "ans": 1, "why": "\"It goes without saying that\" means it is obvious.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 2, "stem": "We had a lot of ______ information about the new procedures.", "opts": ["an useful", "many useful", "useful", "usefuls"], "ans": 2, "why": "\"Information\" is uncountable: no plural, no \"a/an\", and \"many\" cannot be used with it. \"A lot of useful information\" is correct.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 3, "stem": "The south of the city has long been its most ______ area, with incomes well below average.", "opts": ["loaded", "affluent", "impoverished", "wealthy"], "ans": 2, "why": "\"Impoverished\" (poor) matches \"incomes well below average\"; the other three options all mean the opposite (rich).", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 4, "stem": "El timón de dirección controla:", "opts": ["el alabeo", "la sustentación", "el cabeceo", "la guiñada"], "ans": 3, "why": "El timón de dirección actúa alrededor del eje vertical y produce guiñada.", "src": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/aircraft-rotations/ <span class=\"b vs\" title=\"leído solo en un resumen\">V*</span>", "note": ""}, {"n": 5, "stem": "I would have phoned you yesterday if I ______ your number.", "opts": ["had", "had had", "would have", "have had"], "ans": 1, "why": "Third conditional: if + past perfect, would have + past participle. \"Had had\" is the past perfect of \"have\" (possess).", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 6, "stem": "La fase final del programa CISM es:", "opts": ["la evaluación periódica del programa", "la comunicación", "la selección de los <em>peers</em>", "la derivación a un médico"], "ans": 0, "why": "Cuestionarios anónimos e informe anual.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 58", "note": ""}, {"n": 7, "stem": "El QNH es:", "opts": ["La presión atmosférica del aeródromo medida por el barómetro de la oficina meteorológica", "La presión en el nivel de transición", "La presión estándar a nivel del mar, 1013,25 hPa", "La presión atmosférica del aeródromo reducida al nivel del mar en condiciones ISA"], "ans": 3, "why": "Con QNH el altímetro indica la altitud respecto al nivel medio del mar. C es el QFE y A, el QNE.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 8, "stem": "¿Qué categoría AFTN se define como los mensajes «originados para obtener información o verificación sobre otros mensajes que parecen haberse transmitido de forma incorrecta»?", "opts": ["Mensajes de los servicios de información aeronáutica (AIS)", "Mensajes de regularidad de vuelo", "Mensajes aeronáuticos administrativos", "Mensajes de servicio"], "ans": 3, "why": "Esta es la definición de los «mensajes de servicio», una categoría AFTN distinta de los mensajes de regularidad de vuelo, los administrativos y los AIS, aunque varios de ellos compartan la prioridad GG o KK.", "src": "SKYbrary/AFTN", "note": ""}, {"n": 9, "stem": "Según SERA.6001(b), ¿qué clasificación de espacio aéreo debe aplicarse en toda la UE a todo el espacio aéreo por encima del FL195, sea cual sea su designación local?", "opts": ["Clase A", "Clase E", "Clase B", "Clase C"], "ans": 3, "why": "SERA.6001(b) exige expresamente que todo el espacio aéreo por encima del FL195 se clasifique como clase C, con prevalencia sobre cualquier otro esquema de clases local que pudiera aplicarse.", "src": "Regulation (EU) 923/2012 (SERA), SERA.6001(b)", "note": ""}, {"n": 10, "stem": "I'm not used to ______ on the left; it took me a week to feel comfortable in London.", "opts": ["drive", "driving", "have driven", "be driving"], "ans": 1, "why": "In \"be used to\" (accustomed to), \"to\" is a preposition, so it takes a noun or -ing form. A, C and D treat \"to\" as part of an infinitive, which is the pattern of \"used to\" for past habits.", "src": "Pattern: be used to + -ing. Swan, <em>Practical English Usage</em>, used to.", "note": ""}, {"n": 11, "stem": "En la Figura 13 del manual («velocidades en aterrizaje»), la altura de 50 ft a la que se indica V_REF ≈ 1,3 V_SO equivale a:", "opts": ["50 m", "35 m", "15,2 m", "10,7 m"], "ans": 2, "why": "La figura rotula «h = 50 ft (15,2 m)». Los 10,7 m son los 35 ft de la Figura 12 (despegue).", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 23 (Figura 13)", "note": ""}, {"n": 12, "stem": "The ______ was so dirty that I could hardly see the road ahead.", "opts": ["windscreen", "boot", "bonnet", "bumper"], "ans": 0, "why": "You look through the \"windscreen\" (American \"windshield\"). The \"bonnet\" (American \"hood\") covers the engine, the \"boot\" (American \"trunk\") is for luggage, and the \"bumper\" protects the front and back.", "src": "Pattern: car parts (uoe-real-dic2024 Q12). Cambridge Dictionary, \"windscreen\".", "note": ""}, {"n": 13, "stem": "Según el manual, el WGS84 se desarrolló porque:", "opts": ["el Anexo 4 de la OACI obligaba a un sistema único para las cartas", "la Comisión Europea lo exigió en su mandato de 1999", "la deriva entre ETRS89 y REGCAN95 superaba la exactitud requerida", "la ambigüedad en el cálculo de coordenadas por el uso de diferentes datums exigía un modelo único"], "ans": 3, "why": "«La ambigüedad en el cálculo de coordenadas, ocasionada por el uso de diferentes datums, puso de manifiesto la necesidad de normalizar un modelo único de referencia.»", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 20", "note": ""}, {"n": 14, "stem": "Según el mapa normativo de la p. 8, ¿qué contenidos asocia el manual a la normativa nacional (RD 517/24)?", "opts": ["Diseño y fabricación de UAS, marcado de clase, comercialización y operadores de terceros países", "Zonificación, operaciones EASA y NO EASA, clubes y asociaciones de aeromodelismo y ENAIRE como sCISP", "Categorías operacionales, operadores y pilotos, condiciones de registro y formación y riesgo (SORA)", "Protección de datos, espectro radioeléctrico, compatibilidad electromagnética y juguetes"], "ans": 1, "why": "El recuadro bajo «Normativa Nacional UAS RD0517/24» dice: «Zonificación, Operaciones EASA, NO EASA, clubes y asociaciones de aeromodelismo y ENAIRE como sCISP». B es el 2019/945, C el 2019/947 y D «Otras normativas».", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 15, "stem": "La proyección estereográfica es:", "opts": ["Cónica equivalente", "Pseudocilíndrica", "Cilíndrica equivalente", "Acimutal conforme"], "ans": 3, "why": "La proyección estereográfica es una proyección acimutal (plana) que es conforme.", "src": "W Stereographic (https://en.wikipedia.org/wiki/Stereographic_map_projection) <span class=\"b vs\" title=\"leído solo en un resumen\">V*</span>", "note": ""}, {"n": 16, "stem": "Very ______ people turned out to vote, so the result was not considered representative.", "opts": ["few", "little", "less", "a few"], "ans": 0, "why": "\"Few\" (without \"a\") with a countable plural means hardly any, which matches \"not representative\"; \"very few\" is the natural intensified form. \"A few\" is positive and cannot take \"very\", and \"little\" and \"less\" go with uncountable nouns.", "src": "Pattern: quantifiers (uoe-real-nov2025 Q19). Swan, <em>Practical English Usage</em>, few, a few.", "note": ""}, {"n": 17, "stem": "Which word is the most formal equivalent of \"to find out\" in an official report?", "opts": ["to spot", "to work out", "to ascertain", "to discover"], "ans": 2, "why": "\"Ascertain\" is a formal verb meaning to establish for certain. \"Discover\" is neutral, and \"spot\" and \"work out\" are informal or neutral.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 18, "stem": "¿Cuál de las siguientes asignaciones VHF se mantuvo expresamente con separación de 25 kHz (sin convertir a 8,33 kHz)?", "opts": ["Cualquier frecuencia de torre asignada nueva después de 2018", "118,025 MHz, una frecuencia ordinaria de ACC", "132,035 MHz, una frecuencia de sector de 8,33 kHz", "121,5 MHz, la frecuencia de emergencia"], "ans": 3, "why": "El Reglamento VCS eximió expresamente de la conversión a 121,5 MHz (emergencia), 123,1 MHz (SAR) y las asignaciones de ACARS/VDL.", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), Executive Summary", "note": ""}, {"n": 19, "stem": "¿Por debajo de qué altura quedan inhibidas las alertas acústicas de TA del TCAS, según la Guía ACAS v5.0 de EUROCONTROL?", "opts": ["500 pies (±100 ft) AGL", "1000 pies AGL", "1550 pies AGL", "1100 pies AGL"], "ans": 0, "why": "Las anunciaciones acústicas de TA quedan inhibidas por debajo de 500 pies (±100 ft) AGL, el más bajo de los cuatro umbrales de inhibición que trata la Guía.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §8.2 / §3.1", "note": ""}, {"n": 20, "stem": "Según el recuadro «Formación como Piloto» de la p. 10, el examen accesible en la web de AESA corresponde a las subcategorías:", "opts": ["A2 y A3", "A1 y A3", "A1 y A2", "A1, A2 y A3"], "ans": 1, "why": "«Formación mínima acreditable según la categoría operacional. Examen accesible en la web de AESA para subcategorías A1 y A3.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 21, "stem": "The Magic Box is a famous tennis ______ in Madrid.", "opts": ["rink", "court", "course", "pitch"], "ans": 1, "why": "Tennis is played on a \"court\"; \"pitch\" is for football/rugby, \"rink\" for ice sports, \"course\" for golf.", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 22, "stem": "Según el RD 1001/2010, ¿cuál es la duración máxima de un periodo continuo en posición operativa y qué pausa le sigue?", "opts": ["4 horas, seguidas de 1 hora", "3 horas, seguidas de 45 minutos", "2 horas, seguidas de un descanso parcial de al menos 30 minutos", "1 hora, seguida de 15 minutos"], "ans": 2, "why": "El art. 7 fija el máximo ordinario en 2 horas continuas de actividad operacional, seguidas de un descanso parcial de al menos 30 minutos (que puede fraccionarse dentro del periodo de 2 horas).", "src": "RD 1001/2010, art. 7", "note": ""}, {"n": 23, "stem": "¿Cuál de estos contenidos corresponde al Paquete legislativo Cielo Único Europeo I (y no al II)?", "opts": ["La interoperabilidad de la red europea de gestión del tráfico aéreo", "El establecimiento de Bloques Funcionales de Espacio Aéreo (FAB)", "La constitución de un Gestor de Red Europeo", "El establecimiento de un Sistema de Evaluación de Rendimientos"], "ans": 0, "why": "SES I: marco para su creación, prestación de servicios, organización y utilización del espacio aéreo e interoperabilidad. Las otras tres opciones son del SES II.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 24, "stem": "The company ______ a new design for the cockpit.", "opts": ["came round", "came across", "came through", "came up with"], "ans": 3, "why": "\"Come up with\" means to produce an idea or plan. \"Come across\" means to find by chance.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 25, "stem": "La homosfera comprende:", "opts": ["La troposfera, la estratosfera y la mesosfera", "La termosfera y la exosfera", "La mesosfera y la termosfera", "Solo la troposfera y la estratosfera"], "ans": 0, "why": "Es la zona de composición homogénea de los gases, hasta la mesopausa.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 19", "note": ""}, {"n": 26, "stem": "The minister refused to ______ responsibility for the failure.", "opts": ["make", "take", "give", "do"], "ans": 1, "why": "\"Take (or accept) responsibility for\" is the collocation. \"Make\", \"do\" and \"give\" do not combine with \"responsibility\" in this sense.", "src": "Pattern: uoe-real-dic2024 Q27 (take action). Cambridge Dictionary, \"responsibility\".", "note": ""}, {"n": 27, "stem": "La RNAV 5 puede cumplirse con el VOR hasta:", "opts": ["60 NM de la ayuda (75 NM para el VOR Doppler)", "10 NM", "25 NM", "200 NM"], "ans": 0, "why": "El Manual PBN limita la RNAV 5 basada en el VOR a 60 NM del VOR, o a 75 NM en el caso del VOR Doppler.", "src": "Doc 9613, II-B-2, 2.3.3.2.2 <span class=\"b vs\" title=\"leído solo en un resumen\">V*</span>", "note": ""}, {"n": 28, "stem": "¿Cuál es el indicador de lugar de Barcelona-El Prat?", "opts": ["LEBA", "LEBL", "LEBB", "LEBG"], "ans": 1, "why": "LEBL; LEBB es Bilbao, LEBA Córdoba y LEBG Burgos/Villafría.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 29, "stem": "It took her weeks to ______ the flu; she was exhausted for a long time afterwards.", "opts": ["get round to", "get over", "get through to", "get by"], "ans": 1, "why": "\"Get over\" an illness means to recover from it. \"Get by\" means to manage with little money, \"get through to\" means to make someone understand or reach them by phone, and \"get round to\" means to finally find time to do something.", "src": "Pattern: phrasal verbs (uoe-real-dic2024 Q8, Q26, Q37, Q38). Cambridge Dictionary, \"get over\".", "note": ""}, {"n": 30, "stem": "¿Cuál es el número máximo de aeródromos de alternativa de destino que pueden anotarse en la casilla 16?", "opts": ["Dos", "Uno", "No hay límite", "Tres"], "ans": 0, "why": "El AIP permite los indicadores OACI de 4 letras de no más de dos aeródromos de alternativa de destino, separados por un espacio.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 31, "stem": "The supervisor suggested ______ the shift pattern.", "opts": ["changing", "us to change", "that we to change", "to change"], "ans": 0, "why": "\"Suggest\" is followed by a gerund or a that-clause; it never takes \"to + infinitive\" or \"object + to-infinitive\".", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 32, "stem": "¿Qué periodo abarcaba el Plan de Vuelo 2020 según la cronología del manual 7?", "opts": ["2017-2020", "2016-2020", "2015-2020", "2018-2020"], "ans": 0, "why": "«2017-2020 Plan de Vuelo 2020», con las palabras +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos. Le sigue el Plan de Vuelo 2025 (2021-2025).", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 33, "stem": "Según el manual, el coeficiente de sustentación C_L:", "opts": ["disminuye progresivamente al aumentar el ángulo de ataque, hasta anularse en la pérdida", "es independiente del ángulo de ataque y depende solo de la forma del perfil", "aumenta progresivamente con el ángulo de ataque hasta alcanzar el coeficiente de sustentación máximo", "es máximo con ángulo de ataque cero y disminuye a partir de ahí"], "ans": 2, "why": "C_L aumenta progresivamente con el ángulo de ataque hasta el máximo; a partir de ahí la distribución de presiones que generaba la succión deja de existir y el perfil entra en pérdida.", "src": "Manual 9 (nov. 2026), capítulo 7, p. 13", "note": ""}, {"n": 34, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito se sitúan los operadores de drones?", "opts": ["Partners / Proveedores", "Clientes", "Personas", "Sociedad"], "ans": 1, "why": "El «Ámbito CLIENTES» incluye las asociaciones de compañías de aviación comercial, las compañías aéreas y sus pilotos, los gestores aeroportuarios, las asociaciones de aviación no comercial y los operadores de drones.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 35, "stem": "Según el manual 7 (nov. 2026), ¿por qué supondrá el RP4 (2025-2029) un importante reto?", "opts": ["Porque los objetivos planteados en las cuatro áreas de rendimientos son bastante ambiciosos", "Porque desaparece el esquema de incentivos y penalizaciones", "Porque las áreas de rendimiento se reducen de cuatro a dos", "Porque el periodo se alarga de cinco a siete años"], "ans": 0, "why": "«RP4 (2025-2029) supondrá un importante reto en cuanto a que los objetivos planteados en las cuatro áreas de rendimientos son bastante ambiciosos». La edición anterior decía que «se prevé que» fueran ambiciosos.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 36, "stem": "En la tabla 1, ¿qué enfoque y qué fila sostienen que todos los eventos suceden de la misma forma, independientemente de su resultado final?", "opts": ["Safety-II, en la fila de investigación de accidentes", "Safety-I, en la fila de evaluación del riesgo", "Safety-I, en la fila de investigación de accidentes", "Safety-II, en la fila de definición del término"], "ans": 0, "why": "En Safety-II el propósito de la investigación es entender cómo las cosas normalmente salen bien. En Safety-I los accidentes ocurren por fallos y mal funcionamiento y se buscan las causas.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, tabla 1, p. 14", "note": ""}, {"n": 37, "stem": "Según el Convenio de Montreal de 1999, ¿cuál es el umbral de responsabilidad objetiva por pasajero en caso de muerte o lesión (según la última revisión, de 2024)?", "opts": ["151 880 DEG", "26 DEG", "6303 DEG", "1519 DEG"], "ans": 0, "why": "151 880 DEG (derechos especiales de giro) es el umbral vigente de responsabilidad objetiva por muerte o lesión; por encima de él rige un régimen de culpa presunta sin límite. 26 DEG/kg es el límite de la carga; 1519 DEG es el del equipaje y 6303 DEG, el del retraso.", "src": "«Detailed Information for States on Ratification of Key Treaties» (30 de enero de 2026)", "note": ""}, {"n": 38, "stem": "En el sistema de planos acotados, la cota de un punto es:", "opts": ["su distancia horizontal al plano de referencia", "la distancia vertical constante entre los planos que cortan el terreno", "su distancia vertical al plano del cuadro, con signo + o - según esté por encima o por debajo", "su latitud medida sobre el plano del cuadro"], "ans": 2, "why": "Un punto queda definido por sus coordenadas planas en el cuadro y su cota. La B es la equidistancia.", "src": "Manual 4 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 39, "stem": "La configuración dinámica proporciona más capacidad al sistema porque permite:", "opts": ["Abrir todos los sectores posibles durante toda la jornada", "Asignar CTOT sin necesidad de coordinar con el NMOC", "Cerrar sectores en cuanto se aplica una regulación", "Reservar recursos en baja demanda para usarlos cuando la demanda aumente"], "ans": 3, "why": "La aplicación de esta técnica permite reservar los recursos disponibles durante los periodos de baja demanda para utilizarlos cuando esta aumente, proveyendo así al sistema de una mayor capacidad.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 40, "stem": "¿Durante qué período se define el «tiempo reciente» (el grupo RE), según WMO-49?", "opts": ["Desde el último informe ordinario, o la última hora, el período que sea más corto, sin incluir el momento de la propia observación", "Solo los 10 minutos anteriores a la observación", "Las 24 horas completas desde el informe de medianoche del día anterior", "Las 3 horas anteriores, con independencia de la frecuencia de los informes"], "ans": 0, "why": "WMO-49, apartado 4.8.1.1, define el tiempo reciente como los fenómenos observados desde el último informe ordinario emitido, o durante la última hora, el período que sea más corto, pero excluye expresamente los fenómenos que se producen en el momento de la propia observación (estos van en el grupo de tiempo presente).", "src": "WMO49, apartado 4.8.1.1", "note": ""}, {"n": 41, "stem": "En la región Sur, además del ACC de Sevilla, ¿qué aeropuerto recibe ATS directamente de ENAIRE?", "opts": ["Badajoz", "Córdoba", "Málaga", "Jerez"], "ans": 2, "why": "ENAIRE presta ATS en Almería, Granada, Málaga y Melilla en la región Sur; Córdoba, Jerez y Badajoz reciben de ENAIRE solo CNS.", "src": "ENAIRE, página web de la Red ENAIRE", "note": ""}, {"n": 42, "stem": "¿En qué modalidad de vuelo hay observadores que mantienen contacto visual con la aeronave y transmiten información al piloto a distancia, permitiendo operar a mayores distancias sin perder la conciencia situacional?", "opts": ["VLOS", "En todas las operaciones de categoría abierta", "BVLOS", "EVLOS"], "ans": 3, "why": "Es la descripción de las EVLOS (Extended Visual Line of Sight). En BVLOS no hay observación visual continua ni del piloto ni de observadores.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 43, "stem": "¿Qué significa la sigla DAR en el manual 10?", "opts": ["Declaración de Actividad de Riesgo (Declared Activity Risk)", "Restricción de Espacio Aéreo Designado (Designated Airspace Restriction)", "Reconfiguración Dinámica del Espacio Aéreo (Dynamic Airspace Reconfiguration)", "Datos de Autorización de Ruta (Data for Authorised Routes)"], "ans": 2, "why": "«Reconfiguración Dinámica del Espacio Aéreo (Dynamic Airspace Reconfiguration, DAR)».", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 44, "stem": "La resistencia de interferencia, el tercer subtipo de resistencia parásita junto con la resistencia de forma y la resistencia por fricción, es:", "opts": ["la que se reduce aumentando el ángulo con el que se cruzan dos superficies", "la resistencia originada por la intersección de flujos de aire (por ejemplo, en la unión ala-fuselaje), que es máxima cuando dos superficies se encuentran en ángulo recto y se reduce con carenados", "significativa únicamente por encima de Mach 1", "la resistencia causada exclusivamente por las ondas de choque supersónicas"], "ans": 1, "why": "PHAK: la resistencia de interferencia aparece donde se encuentran los flujos de aire alrededor de distintas partes de la estructura y crean remolinos o turbulencia por encima de lo que produciría cada superficie por separado; es máxima en las uniones en ángulo recto y se minimiza con carenados aerodinámicos.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 45, "stem": "Un mensaje MAN (mensaje manual) del IFPS al originador indica que:", "opts": ["El plan se ha cancelado automáticamente", "El plan ha sido rechazado", "El plan requiere tratamiento manual por el personal de planes de vuelo (FP) del IFPS", "El plan ha sido aceptado"], "ans": 2, "why": "IFPS-UM cap. 2: el personal FP procesa manualmente los mensajes no válidos; el cap. 1 enumera las respuestas ORM ACK, MAN y REJ. MAN significa tratamiento manual; REJ es el rechazo.", "src": "IFPS-UM ch. 2 and ch. 1 (ORM ACK, MAN, REJ) <span class=\"b v\" title=\"leído en el texto completo de la fuente\">V</span>", "note": ""}, {"n": 46, "stem": "Según el principio «Demanda y presión» de EUROCONTROL, el binomio demanda-presión afecta de forma directa a:", "opts": ["la elección del aeropuerto", "la edad de jubilación", "el color de las pantallas", "el desempeño, en relación con la eficiencia y la capacidad"], "ans": 3, "why": "El manual dice que el binomio demanda-presión, en relación con la eficiencia y la capacidad, afecta de forma directa y fundamental al desempeño.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 47, "stem": "She ______ her ankle when she slipped on the wet stairs.", "opts": ["twisted", "folded", "bent", "curved"], "ans": 0, "why": "You \"twist\" (or \"sprain\") an ankle when you injure it by turning it suddenly. \"Bend\" a knee is a normal movement, \"fold\" is for paper or clothes, and \"curve\" describes a shape.", "src": "Pattern: injury verbs. Cambridge Dictionary, \"twist\".", "note": ""}, {"n": 48, "stem": "¿Aproximadamente cuánta financiación movilizó entre 2021 y 2025 el PERTE Aeroespacial, aprobado por el Consejo de Ministros en marzo de 2022?", "opts": ["180 M€", "25 M€", "601,2 M€", "4533 M€"], "ans": 3, "why": "El PERTE Aeroespacial movilizó aproximadamente 4533 M€ entre 2021 y 2025 (unos 2193 M€ públicos y unos 2340 M€ privados), con el objetivo de convertir la industria aeroespacial española en un actor clave de la transformación sectorial.", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 49, "stem": "We're going to ______ by a professional before we put the house up for sale.", "opts": ["get it paint", "get painted it", "get it painted", "get it to paint"], "ans": 2, "why": "Causative \"get + object + past participle\" (= have it painted). A puts the object in the wrong place, B needs the participle, and \"get it to paint\" would mean persuade the house to paint something.", "src": "Pattern: causative have/get (uoe-real-dic2024 Q22). Swan, <em>Practical English Usage</em>, get something done.", "note": ""}, {"n": 50, "stem": "¿Qué envergadura da el catálogo al Boeing 747-8 (B748)?", "opts": ["68,5 m", "71,8 m", "64,8 m", "73,3 m"], "ans": 0, "why": "B748 68,5 m; B744 y 777 64,8 m; 777X 71,8 m; A124 73,3 m.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 30", "note": ""}, {"n": 51, "stem": "Según el manual, la prolongación del eje de rotación de la Tierra pasa por un punto fijo del universo llamado:", "opts": ["punto vernal", "Sol", "estrella polar", "Polo Norte Magnético"], "ans": 2, "why": "«De los infinitos ejes que tiene la Tierra, el más importante es el de rotación, cuya prolongación pasa por un punto fijo del universo, llamado estrella polar.»", "src": "Manual 4 (nov. 2026), capítulo 2.2, p. 6", "note": ""}, {"n": 52, "stem": "Según el manual, las alas son:", "opts": ["perfiles aerodinámicos unidos a cada lado del fuselaje y las principales superficies sustentadoras", "las superficies de control primarias que controlan el alabeo del avión", "las superficies estabilizadoras situadas en la sección de cola del avión", "los dispositivos hipersustentadores situados en el borde de ataque del ala"], "ans": 0, "why": "«Las alas son perfiles aerodinámicos unidos a cada lado del fuselaje y son las principales superficies sustentadoras que mantienen al avión en vuelo».", "src": "Manual 9 (nov. 2026), capítulo 8, p. 14", "note": ""}, {"n": 53, "stem": "Never ______ such a large demonstration in the capital.", "opts": ["has the city seen", "the city has seen", "the city saw", "saw the city"], "ans": 0, "why": "\"Never\" at the start of a sentence requires auxiliary inversion: \"Never has the city seen\". B and C keep normal order, and D inverts the main verb, which modern English does not allow.", "src": "Pattern: inversion (uoe-real-dic2024 Q16, Q17, Q40). Swan, <em>Practical English Usage</em>, inversion.", "note": ""}, {"n": 54, "stem": "¿Qué marca corresponde a Mónaco?", "opts": ["MC", "3A", "M", "4X"], "ans": 1, "why": "Mónaco 3A; 4X es Israel.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 55, "stem": "¿En qué fecha entró en vigor el Convenio EUROCONTROL, tras firmarse el 13 de diciembre de 1960?", "opts": ["1 de marzo de 1963", "4 de abril de 1967", "1 de marzo de 1970", "1 de enero de 1961"], "ans": 0, "why": "El Convenio entró en vigor el 1 de marzo de 1963; la propia página «About us» de EUROCONTROL da 1963 como su año de fundación («Founded»).", "src": "Página oficial de EUROCONTROL «About us», leída completa", "note": ""}, {"n": 56, "stem": "The comedian ______ the audience laughing within seconds.", "opts": ["made", "let", "caused", "had"], "ans": 3, "why": "\"Have + object + -ing\" means to cause people to be doing something (\"had everyone laughing\"). \"Make\" and \"let\" take a bare infinitive (\"made them laugh\"), and \"cause\" takes a to-infinitive (\"caused them to laugh\").", "src": "Pattern: uoe-real-nov2025 Q2 (had everyone laughing). Swan, <em>Practical English Usage</em>, have.", "note": ""}, {"n": 57, "stem": "En el manual, el indicador GCXM identifica:", "opts": ["El aeródromo de Tenerife Norte/Ciudad de La Laguna", "El FIC/ACC de Canarias", "El helipuerto de Tenerife Norte/Los Rodeos", "El aeródromo de Tenerife Sur"], "ans": 2, "why": "GCXM es el helipuerto TENERIFE NORTE/Los Rodeos; el aeródromo de Tenerife Norte es GCXO, el FIC/ACC de Canarias GCCC y Tenerife Sur GCTS.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 9", "note": ""}, {"n": 58, "stem": "¿Qué pareja organización - número de miembros es correcta según el manual?", "opts": ["EUROCAE - 400 organizaciones", "RTCA - 400 organizaciones", "ESA - 27 Estados Miembros", "IATA - más de 500 aerolíneas"], "ans": 1, "why": "EUROCAE tiene más de 500 miembros, la IATA más de 350 aerolíneas y la ESA 23 Estados Miembros.", "src": "Manual 1 (nov. 2026), capítulo 2.5, pp. 24-25", "note": ""}, {"n": 59, "stem": "I have ______ my children with meticulous care and unwavering dedication.", "opts": ["rose", "raise", "risen", "raised"], "ans": 3, "why": "\"Raise\" (raised/raised) is the transitive verb for bringing up children; \"rise\" (rose/risen) is intransitive and doesn't take a direct object like \"my children\".", "src": "Real paper of the 2025 call (sat 7-8 February 2026); key check in the file header.", "note": ""}, {"n": 60, "stem": "¿Cuál es el número máximo de entradas de error que puede contener un REJ ORM?", "opts": ["5", "10", "3", "Ilimitado"], "ans": 1, "why": "Cada REJ ORM contiene una lista de errores de hasta 10 entradas como máximo, con la naturaleza del error y el campo o campos erróneos.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 61, "stem": "¿Qué fase del sueño es «poco o nada reparadora» y en ella todavía se perciben la mayoría de los estímulos auditivos y táctiles?", "opts": ["Fase II", "Fase REM", "Fase III", "Fase I"], "ans": 3, "why": "Fase I, sueño ligero, con tono muscular reducido y movimientos oculares lentos.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 62, "stem": "Según el manual, los niveles de vuelo son niveles de crucero que siempre quedan:", "opts": ["Por encima de los 20 000 ft", "Por encima de la altitud de transición", "Dentro de la capa de transición", "Por debajo de la altitud de transición"], "ans": 1, "why": "Son superficies de presión constante situadas a una distancia determinada de la superficie de 1013,25 hPa, calculadas a partir de la atmósfera estándar de la OACI.", "src": "Manual 3 (nov. 2026), capítulo 2.10.4, p. 25", "note": ""}, {"n": 63, "stem": "El reglaje QNE es:", "opts": ["1000 hPa", "La presión local al nivel del mar", "La presión en el aeródromo", "1013,25 hPa, que se utiliza para los niveles de vuelo"], "ans": 3, "why": "En ruta todas las aeronaves vuelan con la misma presión de referencia, el QNE (1013,25 hPa); de ahí los niveles de vuelo.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 64, "stem": "I got lost in the city, ______ being quite good at navigating unfamiliar places.", "opts": ["although", "however", "despite", "even if"], "ans": 2, "why": "\"Despite\" + gerund (\"despite being good at...\") is the correct concessive structure; \"although/even if\" need a full clause with a subject and verb.", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 65, "stem": "En la figura «Rumbo geográfico y magnético» del manual, ¿qué valores aparecen?", "opts": ["rumbo geográfico 081º, rumbo magnético 084º y declinación magnética 3ºE", "rumbo geográfico 078º, rumbo magnético 081º y declinación magnética 3ºW", "rumbo geográfico 122º, rumbo magnético 125º y declinación magnética 3ºW", "rumbo geográfico 081º, rumbo magnético 078º y declinación magnética 3ºE"], "ans": 3, "why": "La figura ilustra el primer ejemplo: 081º geográfico, 3ºE, 078º magnético.", "src": "Manual 4 (nov. 2026), capítulo 2.4.3, figura de la p. 15", "note": ""}, {"n": 66, "stem": "El Doc 7030 (SUPPS regionales de EUR) declara que es suplementario de cuál de los s e": ""}, {"n": 70, "stem": "The airport authority has ______ a new procedure to reduce noise at night.", "opts": ["taken over", "brought in", "set off", "put up with"], "ans": 1, "why": "\"Bring in\" means to introduce (a rule, a law). \"Take over\" is to assume control, \"set off\" is to start a journey or trigger, and \"put up with\" is to tolerate.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"simulacros/replica-fase-1.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
