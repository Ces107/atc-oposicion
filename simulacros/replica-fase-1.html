<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réplica de la Fase 1</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:nowrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em;flex:none;white-space:nowrap}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem;min-width:0;flex:0 1 auto}
header.top a.back>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}
header.top .hd-end{display:flex;align-items:center;justify-content:flex-end;gap:1.1rem;flex:none;min-width:8.4rem;margin-left:auto}
header.top #acct-slot{min-width:28px;min-height:28px;justify-content:flex-end}
header.top .hbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
header.top .hbtn:hover,header.top .hbtn[aria-expanded=true]{color:var(--acc)}
@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}
@media (max-width:640px){
  header.top{gap:0;padding:2px .4rem 2px .6rem;min-height:49px}
  header.top a.home{min-height:44px;padding-right:.5rem}
  header.top.hb a.home .brand{display:none}
  header.top a.back{min-height:44px;flex:1 1 auto;padding-right:.3rem}
  header.top .cmdk-btn .lbl,header.top .cmdk-btn .kbd{display:none}
  header.top .cmdk-btn,header.top .nextbtn{width:44px;height:44px;justify-content:center;padding:0;gap:0;flex:none}
  header.top .nextbtn{font-size:0;margin:0}
  header.top .cmdk-btn svg.i,header.top .hbtn svg.i{width:20px;height:20px}
  header.top .nextbtn svg.i{width:18px;height:18px}
  header.top .hd-end{gap:0;min-width:88px;margin-left:0}
  header.top #acct-slot{min-width:44px;min-height:44px}
}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}
nav.toc a.active{color:var(--acc);font-weight:600}
@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}
  #toc>b{padding:.6rem 0 .3rem}
  #toc a{display:block;padding:.8rem 0;line-height:1.35}
}
@media (max-width:900px),(pointer:coarse){table.src td.act a{min-height:44px;min-width:44px;padding:0 .35rem;margin-right:.3rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
.reading-progress{position:fixed;top:calc(var(--hh,49px) - 2px);left:0;right:0;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;z-index:6;pointer-events:none}
@supports (animation-timeline:scroll()){.reading-progress{animation:rp-grow linear both;animation-timeline:scroll(root block)}}
@keyframes rp-grow{to{transform:scaleX(1)}}
.figcap{font:600 13px var(--sans);color:var(--mut);margin:1rem 0 .2rem}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);margin:0 0 .4rem}
.figs>div{flex:1 1 6.2rem;padding:.5rem .8rem .55rem 0}
.figs b{display:block;font:700 1.55rem/1.15 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.figs b small{font-size:.6em;color:var(--mut);font-weight:600}
.figs span{display:block;color:var(--mut);font:.8rem/1.3 var(--sans)}

-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Simulacros</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Réplica de la Fase 1</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "The company ______ a new design for the cockpit.", "opts": ["came through", "came up with", "came round", "came across"], "ans": 1, "why": "\"Come up with\" means to produce an idea or plan. \"Come across\" means to find by chance.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 2, "stem": "The comedian ______ the audience laughing within seconds.", "opts": ["made", "caused", "had", "let"], "ans": 2, "why": "\"Have + object + -ing\" means to cause people to be doing something (\"had everyone laughing\"). \"Make\" and \"let\" take a bare infinitive (\"made them laugh\"), and \"cause\" takes a to-infinitive (\"caused them to laugh\").", "src": "Pattern: uoe-real-nov2025 Q2 (had everyone laughing). Swan, <em>Practical English Usage</em>, have.", "note": ""}, {"n": 3, "stem": "The south of the city has long been its most ______ area, with incomes well below average.", "opts": ["loaded", "affluent", "impoverished", "wealthy"], "ans": 2, "why": "\"Impoverished\" (poor) matches \"incomes well below average\"; the other three options all mean the opposite (rich).", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 4, "stem": "La intensidad de los torbellinos de punta de ala es:", "opts": ["inversamente proporcional al peso y directamente proporcional a la velocidad", "independiente del peso", "directamente proporcional a la envergadura y a la velocidad", "directamente proporcional al peso e inversamente proporcional a la envergadura y a la velocidad"], "ans": 3, "why": "El manual establece que es directamente proporcional al peso de la aeronave e inversamente proporcional a la envergadura y a la velocidad.", "src": "Manual 9 (nov. 2026), capítulo 5, p. 10", "note": ""}, {"n": 5, "stem": "She ______ her ankle when she slipped on the wet stairs.", "opts": ["bent", "twisted", "folded", "curved"], "ans": 1, "why": "You \"twist\" (or \"sprain\") an ankle when you injure it by turning it suddenly. \"Bend\" a knee is a normal movement, \"fold\" is for paper or clothes, and \"curve\" describes a shape.", "src": "Pattern: injury verbs. Cambridge Dictionary, \"twist\".", "note": ""}, {"n": 6, "stem": "Según ATS.OR.300, ¿para qué tres fines establece la sección 3 requisitos sobre el desempeño humano?", "opts": ["Sustancias psicoactivas, estrés y fatiga", "Turnos, descansos y periodos de vacaciones", "Licencias, formación y evaluación de la competencia", "Comunicación, TRM y conciencia situacional"], "ans": 0, "why": "Prevenir y limitar: a) el uso problemático de sustancias psicoactivas; b) los efectos negativos del estrés; c) los efectos negativos de la fatiga.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 7, "stem": "Según el manual, la temperatura anual media de la Tierra y de la atmósfera varía muy poco porque:", "opts": ["El ozono bloquea toda la radiación solar", "La radiación solar es constante en todas las latitudes", "Todas las latitudes absorben la misma radiación que emiten", "Cada año el sistema atmósfera-Tierra envía al espacio tanta energía como recibe del Sol"], "ans": 3, "why": "En algunas latitudes se absorbe más de lo que se emite y en otras ocurre lo contrario, pero el balance anual del conjunto se mantiene.", "src": "Manual 3 (nov. 2026), capítulo 3.2, p. 29", "note": ""}, {"n": 8, "stem": "La AMC España asigna temporalmente el espacio aéreo en función de las peticiones de los usuarios. ¿Cuál NO figura entre los usuarios que enumera el apartado 3.2?", "opts": ["Las unidades gestoras de zonas militares", "Los ACC", "Las FMP", "El IFPS"], "ans": 3, "why": "3.2: peticiones realizadas por los usuarios (ACC, FMP, unidades gestoras de zonas militares y otras agencias acreditadas). El IFPS es el sistema de tratamiento de planes de vuelo del NM.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 9, "stem": "¿Qué componente del ILS materializa la senda de descenso?", "opts": ["LOC", "CDI", "OM", "GP"], "ans": 3, "why": "Los tres componentes terrestres del ILS son el localizador (LOC), la senda de descenso (GP) y las radiobalizas (OM, MM, IM). La GP emite señales que materializan un plano oblicuo que nace de la zona de toma de contacto, con un ángulo aproximado de tres grados. El LOC materializa el plano vertical del eje, la OM es la radiobaliza exterior y el CDI es el indicador del VOR. El examen real de 2026 preguntó este dato.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, pp. 32-33", "note": ""}, {"n": 10, "stem": "It goes without ______ that safety comes first in aviation.", "opts": ["speaking", "saying", "knowing", "telling"], "ans": 1, "why": "\"It goes without saying that\" means it is obvious.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 11, "stem": "Según el manual, la flecha del ala es el ángulo que forman las alas respecto:", "opts": ["del horizonte, visto el avión de frente", "del eje longitudinal del avión", "del eje transversal del avión", "de la dirección del viento relativo"], "ans": 2, "why": "«La flecha del ala es el ángulo que forman las alas respecto del eje transversal del avión». El diedro es el ángulo en «V» con el eje lateral visto de frente y el ángulo de ataque se mide respecto del viento relativo.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 12, "stem": "I would have phoned you yesterday if I ______ your number.", "opts": ["had had", "would have", "had", "have had"], "ans": 0, "why": "Third conditional: if + past perfect, would have + past participle. \"Had had\" is the past perfect of \"have\" (possess).", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 13, "stem": "La función principal de la carta OACI 1:500 000 es atender:", "opts": ["los vuelos IFR a alta velocidad, a gran distancia y a gran altitud", "el rodaje y los movimientos en tierra de los aeródromos no controlados", "la guía vectorial con sistemas de vigilancia en las áreas de control terminal", "la navegación visual a baja velocidad, a distancias cortas o medias y a altitudes bajas e intermedias"], "ans": 3, "why": "«Atender a las necesidades de la navegación aérea visual en vuelos a baja velocidad, a distancias cortas o medias y a altitudes bajas e intermedias».", "src": "Manual 4 (nov. 2026), capítulo 4.4.15, p. 43", "note": ""}, {"n": 14, "stem": "Según el capítulo 5.4.2, las medidas DAR adaptan temporalmente las condiciones operacionales del espacio aéreo:", "opts": ["Mediante la publicación de una nueva zona geográfica UAS permanente", "Sin necesidad de modificar permanentemente su estructura", "Mediante una nueva designación de espacio U-space por el Estado miembro", "Mediante la modificación del Reglamento de Ejecución (UE) 2021/664"], "ans": 1, "why": "«Mediante estos mecanismos es posible adaptar temporalmente las condiciones operacionales del espacio aéreo para mantener niveles adecuados de seguridad y eficiencia sin necesidad de modificar permanentemente su estructura.»", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 15, "stem": "¿Cuál de estas es una proyección «modificada» citada en el manual?", "opts": ["Ortográfica", "Escenográfica", "Gnomónica", "Mercator"], "ans": 3, "why": "La gnomónica, la ortográfica y la escenográfica son proyecciones puras (planas o perspectivas). El recuadro de proyecciones modificadas cita como más populares las de Bonne, Lambert, Mercator, Mollweide, Goode o Boggs (frase de la capa de texto del recuadro, tapada por su borde en la página impresa).", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, pp. 27-28", "note": ""}, {"n": 16, "stem": "I have ______ my children with meticulous care and unwavering dedication.", "opts": ["raised", "risen", "raise", "rose"], "ans": 0, "why": "\"Raise\" (raised/raised) is the transitive verb for bringing up children; \"rise\" (rose/risen) is intransitive and doesn't take a direct object like \"my children\".", "src": "Real paper of the 2025 call (sat 7-8 February 2026); key check in the file header.", "note": ""}, {"n": 17, "stem": "We're going to ______ by a professional before we put the house up for sale.", "opts": ["get it paint", "get painted it", "get it painted", "get it to paint"], "ans": 2, "why": "Causative \"get + object + past participle\" (= have it painted). A puts the object in the wrong place, B needs the participle, and \"get it to paint\" would mean persuade the house to paint something.", "src": "Pattern: causative have/get (uoe-real-dic2024 Q22). Swan, <em>Practical English Usage</em>, get something done.", "note": ""}, {"n": 18, "stem": "We had a lot of ______ information about the new procedures.", "opts": ["an useful", "many useful", "usefuls", "useful"], "ans": 3, "why": "\"Information\" is uncountable: no plural, no \"a/an\", and \"many\" cannot be used with it. \"A lot of useful information\" is correct.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 19, "stem": "Según el manual, ¿qué principio de funcionamiento utiliza el SMR?", "opts": ["El del radar primario: el eco reflejado en el blanco da su distancia y acimut", "El de la multilateración: diferencia horaria de llegada", "El del radar secundario: interrogación y respuesta del transpondedor", "El de la ADS-B: radiodifusión de la posición"], "ans": 0, "why": "El SMR es un radar primario particularizado para las superficies de los aeropuertos; su equipo, como el del PSR, es una antena transmisora-receptora con el equipamiento de proceso y presentación.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.5, p. 59", "note": ""}, {"n": 20, "stem": "¿Cómo denomina el manual 10, con la sigla RCS, al equipo utilizado para controlar la aeronave y supervisar el vuelo?", "opts": ["Enlace de mando y control", "Estación de control remoto", "Sistema de comunicaciones del piloto", "Sistema de control de ruta"], "ans": 1, "why": "«Estación de control remoto (RCS): equipo utilizado para controlar la aeronave y supervisar el vuelo.» El enlace de mando y control es el C2.", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 21, "stem": "I'm not used to ______ on the left; it took me a week to feel comfortable in London.", "opts": ["drive", "driving", "have driven", "be driving"], "ans": 1, "why": "In \"be used to\" (accustomed to), \"to\" is a preposition, so it takes a noun or -ing form. A, C and D treat \"to\" as part of an infinitive, which is the pattern of \"used to\" for past habits.", "src": "Pattern: be used to + -ing. Swan, <em>Practical English Usage</em>, used to.", "note": ""}, {"n": 22, "stem": "Según el manual, a efectos de estadística el programa CISM lleva un control de:", "opts": ["las horas de servicio de cada <em>peer</em>", "las sanciones derivadas de cada activación", "las activaciones frente al número de incidencias", "los nombres de los controladores atendidos"], "ans": 2, "why": "La evaluación periódica usa cuestionarios totalmente anónimos y se recoge en un informe anual.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 58", "note": ""}, {"n": 23, "stem": "¿Qué apéndice del Anexo de SERA contiene las tablas de niveles de crucero?", "opts": ["Apéndice 3", "Apéndice 2", "Apéndice 1", "Apéndice 4"], "ans": 0, "why": "Apéndice 1 señales, 2 globos libres no tripulados, 3 tablas de niveles de crucero, 4 clasificación de los espacios aéreos ATS, 5 requisitos ANS (observaciones por voz) y 6 modo de completar el plan de vuelo.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, pp. 42-43", "note": ""}, {"n": 24, "stem": "Which word is the most formal equivalent of \"to find out\" in an official report?", "opts": ["to work out", "to spot", "to discover", "to ascertain"], "ans": 3, "why": "\"Ascertain\" is a formal verb meaning to establish for certain. \"Discover\" is neutral, and \"spot\" and \"work out\" are informal or neutral.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 25, "stem": "Los transmisómetros (visibilímetros) del RVR se colocan:", "opts": ["A 2,5 m sobre el suelo, a unos 100 m del eje, en la zona de toma de contacto", "A 2,5 m sobre el suelo, en el umbral de la pista, a unos 10 m del eje", "A 5 m sobre el suelo, a unos 100 m del eje, al final de la pista", "A 5 m sobre el suelo, sobre el eje de la pista, en la zona de toma de contacto"], "ans": 0, "why": "Los 5 m son la altura del piloto que se usa en la definición del RVR, no la altura del sensor.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 54", "note": ""}, {"n": 26, "stem": "The minister refused to ______ responsibility for the failure.", "opts": ["make", "take", "give", "do"], "ans": 1, "why": "\"Take (or accept) responsibility for\" is the collocation. \"Make\", \"do\" and \"give\" do not combine with \"responsibility\" in this sense.", "src": "Pattern: uoe-real-dic2024 Q27 (take action). Cambridge Dictionary, \"responsibility\".", "note": ""}, {"n": 27, "stem": "El indicador TO/FROM del VOR marca FROM cuando la aeronave está:", "opts": ["En el semiplano que contiene el radial seleccionado, independientemente del rumbo", "Justo sobre la estación, únicamente", "Fuera de la cobertura del VOR", "En el semiplano que contiene la prolongación del radial seleccionado"], "ans": 0, "why": "FROM = semiplano del radial seleccionado; TO = semiplano de su prolongación; en ambos casos con independencia del rumbo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 25", "note": ""}, {"n": 28, "stem": "¿Qué categoría ATA/IATA da el manual al Airbus 340-300?", "opts": ["3J", "4J", "2J", "J4"], "ans": 1, "why": "Airbus 340-300: 340 / 343 / 4J, igual que el 340-500 y el 340-600.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 29, "stem": "The supervisor suggested ______ the shift pattern.", "opts": ["that we to change", "changing", "us to change", "to change"], "ans": 1, "why": "\"Suggest\" is followed by a gerund or a that-clause; it never takes \"to + infinitive\" or \"object + to-infinitive\".", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 30, "stem": "The ______ was so dirty that I could hardly see the road ahead.", "opts": ["windscreen", "bonnet", "bumper", "boot"], "ans": 0, "why": "You look through the \"windscreen\" (American \"windshield\"). The \"bonnet\" (American \"hood\") covers the engine, the \"boot\" (American \"trunk\") is for luggage, and the \"bumper\" protects the front and back.", "src": "Pattern: car parts (uoe-real-dic2024 Q12). Cambridge Dictionary, \"windscreen\".", "note": ""}, {"n": 31, "stem": "Never ______ such a large demonstration in the capital.", "opts": ["has the city seen", "the city has seen", "the city saw", "saw the city"], "ans": 0, "why": "\"Never\" at the start of a sentence requires auxiliary inversion: \"Never has the city seen\". B and C keep normal order, and D inverts the main verb, which modern English does not allow.", "src": "Pattern: inversion (uoe-real-dic2024 Q16, Q17, Q40). Swan, <em>Practical English Usage</em>, inversion.", "note": ""}, {"n": 32, "stem": "¿Cuál de las siguientes NO es una de las palabras con «+» del Plan de Vuelo 2020 en la cronología del manual 7?", "opts": ["+Eficientes", "+Valorados", "+Comprometidos", "+Ecológicos"], "ans": 0, "why": "Las seis son +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos. «Eficientes» no está.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 33, "stem": "La densidad del aire disminuye cuando:", "opts": ["aumenta la temperatura y disminuyen la altitud y la humedad", "disminuye la temperatura y aumenta la altitud", "aumentan la temperatura, la altitud y la humedad", "disminuye la humedad y aumenta la temperatura"], "ans": 2, "why": "El manual establece que la densidad del aire decrece cuando la temperatura, la altitud y la humedad aumentan.", "src": "Manual 9 (nov. 2026), capítulo 3.4, p. 6", "note": ""}, {"n": 34, "stem": "Según el manual 7, ¿de conformidad con qué plan se imparte la formación continua (actualización y conversión)?", "opts": ["El plan de formación de la unidad", "El plan de capacitación de unidad", "El Plan de contingencia ATS (PCATS)", "El plan de carrera profesional"], "ans": 1, "why": "«Formación continua: Formación de actualización y conversión que se impartirá de conformidad con los requisitos incluidos en el plan de capacitación de unidad, dirigida a mantener la cualificación». Par fácil de confundir con el «plan de formación de la unidad» de la Formación de Unidad.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 35, "stem": "¿Qué objetivo del manual 7 aspira a la «movilidad sostenible en el sector», minimizando el impacto medioambiental e impulsando la descarbonización?", "opts": ["El objetivo 3", "El objetivo 6", "El objetivo 1", "El objetivo 2"], "ans": 0, "why": "Objetivo 3: «Contribuir a la movilidad sostenible en el sector, minimizando el impacto de la actividad de ENAIRE en el medioambiente e impulsando su descarbonización».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 36, "stem": "ATS.OR.310 trata de:", "opts": ["el estrés, incluido un programa de gestión del estrés en incidentes críticos", "la fatiga", "los sistemas de turnos", "el ámbito de aplicación"], "ans": 0, "why": "ATS.OR.300, ámbito de aplicación; 305, sustancias psicoactivas; 310, estrés; 315, fatiga; 320, sistemas de turnos.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17", "note": ""}, {"n": 37, "stem": "La fase de despliegue de SESAR se inició formalmente en:", "opts": ["2014", "2007", "2004", "2018"], "ans": 0, "why": "En 2014, año en que la Comisión Europea publicó el Proyecto Común Piloto.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, p. 21", "note": ""}, {"n": 38, "stem": "Para el estudio de puntos y líneas, el manual define la Tierra como:", "opts": ["el geoide, por ser la forma real del planeta", "el elipsoide GRS80 asociado a ETRS89 y REGCAN95", "una esfera perfecta cuyo radio medio se mide desde el centro de la Tierra hasta la superficie del mar", "el elipsoide WGS84, con sus semiejes de 6 378 137 m y 6 356 752 m"], "ans": 2, "why": "«Se define la Tierra, para el estudio de puntos y líneas, como una esfera perfecta cuyo radio medio se mide desde el centro de la Tierra hasta la superficie del mar», porque facilita y simplifica el estudio.", "src": "Manual 4 (nov. 2026), capítulos 2.1-2.2, p. 6", "note": ""}, {"n": 39, "stem": "Los pronósticos meteorológicos, las observaciones, los mensajes de regularidad de vuelo y los mensajes AIS llevan el indicador de prioridad:", "opts": ["FF", "KK", "DD", "GG"], "ans": 3, "why": "El grupo GG contiene los pronósticos, los pronósticos de área y de ruta, las observaciones e informes, los mensajes de regularidad de vuelo y los mensajes AIS. KK es administrativo.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 10", "note": ""}, {"n": 40, "stem": "Según el manual, en la estratosfera la presión:", "opts": ["Sigue bajando y es solo alrededor del 0,1 % de la del nivel del mar", "Aumenta con la altitud por efecto de la abundancia de ozono", "Se mantiene constante desde la tropopausa hasta la estratopausa", "Es aproximadamente la mitad de la del nivel del mar"], "ans": 0, "why": "Su contenido de vapor de agua es pequeño y apenas hay nubes.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 18", "note": ""}, {"n": 41, "stem": "Según la Visión («nuestra ambición») del manual 7, ¿en qué quiere convertir ENAIRE?", "opts": ["En el primer proveedor de Europa por volumen de tráfico", "En el gestor de red europeo del Cielo Único", "En un operador global, líder del sector de la navegación aérea", "En el principal operador aeroportuario del mundo"], "ans": 2, "why": "«Queremos convertir a ENAIRE en un operador global, líder del sector de la navegación aérea, basándonos en las personas, la innovación y la digitalización». Hoy es el cuarto de Europa por tráfico.", "src": "Manual 7 (nov. 2026), capítulo 1.2.3, p. 11", "note": ""}, {"n": 42, "stem": "En el mapa normativo de la p. 8, el bloque del Reglamento de Ejecución (UE) 2019/947 incluye, junto a las categorías operacionales, los operadores y pilotos y las condiciones de registro y formación:", "opts": ["Los operadores de terceros países", "La comercialización", "El marcado de clase", "El riesgo (SORA)"], "ans": 3, "why": "El bloque del 2019/947 lista: categorías operacionales (abierta, específica, certificada), operadores y pilotos, condiciones de registro y formación, «Riesgo (SORA)». Las otras tres opciones son del bloque del 2019/945.", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 43, "stem": "Según el capítulo 5.2, en España el marco europeo del U-space se complementa con el Real Decreto 517/2024, que desarrolla aspectos como la utilización de UAS, las zonas geográficas UAS, la designación de espacios aéreos U-space y:", "opts": ["La certificación de los fabricantes de UAS", "La licencia de los pilotos de la categoría certificada", "El Servicio de Información Común", "Las tasas de los servicios U-space"], "ans": 2, "why": "El RD 517/2024 «desarrolla determinados aspectos nacionales relacionados con la utilización de UAS, las zonas geográficas UAS, la designación de espacios aéreos U-space y el Servicio de Información Común».", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 21", "note": ""}, {"n": 44, "stem": "El trim tab (tab de compensación) se deflecta:", "opts": ["simétricamente, para aumentar la resistencia", "en dirección opuesta al control primario, para anular el momento de charnela y el esfuerzo sobre el mando", "en la misma dirección que el control primario, para aumentar la sustentación", "solo en los alerones"], "ans": 1, "why": "El tab se deflecta en dirección opuesta al control primario y se utiliza para anular el momento de charnela y, por tanto, la fuerza en palanca o mando de vuelo.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 19", "note": ""}, {"n": 45, "stem": "Un vuelo que puede estar sujeto a medidas ATFM debe presentar su plan de vuelo, como mínimo:", "opts": ["6 horas antes de la salida", "30 minutos antes de la puesta en marcha", "3 horas antes de la hora prevista de fuera calzos", "60 minutos antes de la hora prevista de fuera calzos"], "ans": 2, "why": "Punto 2: al menos tres horas antes de la EOBT para los vuelos que puedan estar sujetos a medidas de gestión de afluencia del tránsito aéreo.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 6", "note": ""}, {"n": 46, "stem": "En el apartado 1.3.3, ¿a quién atribuye el manual la idea de que los conceptos de diseño son solo hipótesis sobre la relación futura entre la tecnología y lo humano?", "opts": ["Rasmussen (1986)", "Simon (1957)", "Steven Shorrock", "Woods y Dekker (2002)"], "ans": 3, "why": "«De acuerdo con Woods y Dekker (2002), los conceptos de diseño son sólo hipótesis [...] y la automatización transforma realmente las prácticas cotidianas». (La bibliografía no recoge una obra de Woods y Dekker de 2002.)", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 15", "note": ""}, {"n": 47, "stem": "I got lost in the city, ______ being quite good at navigating unfamiliar places.", "opts": ["despite", "even if", "although", "however"], "ans": 0, "why": "\"Despite\" + gerund (\"despite being good at...\") is the correct concessive structure; \"although/even if\" need a full clause with a subject and verb.", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 48, "stem": "Completa el Propósito del Plan de Vuelo 2025: «Cuidamos de tu vuelo para que sea seguro, ___, eficiente y sostenible».", "opts": ["competitivo", "puntual", "digital", "rápido"], "ans": 3, "why": "Los cuatro adjetivos son seguro, rápido, eficiente y sostenible.", "src": "Manual 7 (nov. 2026), capítulo 1.2.1, p. 11", "note": ""}, {"n": 49, "stem": "It took her weeks to ______ the flu; she was exhausted for a long time afterwards.", "opts": ["get through to", "get round to", "get over", "get by"], "ans": 2, "why": "\"Get over\" an illness means to recover from it. \"Get by\" means to manage with little money, \"get through to\" means to make someone understand or reach them by phone, and \"get round to\" means to finally find time to do something.", "src": "Pattern: phrasal verbs (uoe-real-dic2024 Q8, Q26, Q37, Q38). Cambridge Dictionary, \"get over\".", "note": ""}, {"n": 50, "stem": "¿Cuáles son los designadores telegráfico y telefónico de British Airways?", "opts": ["BAW / SPEEDBIRD", "BRA / BRITISH", "BA / SPEEDBIRD", "BAW / AIRFRANS"], "ans": 0, "why": "BAW / SPEEDBIRD (BA es el código IATA).", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 51, "stem": "En la figura «Ejemplos de diferentes tipos de escala» del manual, ¿qué escala NO aparece?", "opts": ["1:250.000", "1:50.000", "1:500.000", "1:1.000.000"], "ans": 2, "why": "La figura muestra el mismo lugar a escalas a) 1:50.000, b) 1:100.000, c) 1:250.000 y d) 1:1.000.000.", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, figura de la p. 24", "note": ""}, {"n": 52, "stem": "¿En qué orden aparecen las velocidades a lo largo de la pista en la Figura 12 del manual («velocidades en despegue»)?", "opts": ["V0, V_S, V1, V_R, V_LOF, V_TR, V2", "V0, V1, V_S, V_R, V2, V_LOF, V_TR", "V1, V0, V_S, V_R, V_TR, V_LOF, V2", "V_S, V0, V1, V_LOF, V_R, V_TR, V2"], "ans": 0, "why": "La Figura 12 rotula, de izquierda a derecha, V0, V_S, V1, V_R, V_LOF, V_TR y V2, con una cota de 35 ft (10,7 m). El texto no define V0 ni V_TR.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 21 (Figura 12)", "note": ""}, {"n": 53, "stem": "¿Qué indicador tiene el TACC de Santiago?", "opts": ["LEST", "LECG", "LECS", "LECO"], "ans": 1, "why": "Santiago TACC LECG; LEST es el aeródromo de Santiago/Rosalía de Castro, LECS el FIC/ACC de Sevilla y LECO A Coruña.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7-8", "note": ""}, {"n": 54, "stem": "Entre las funciones de AESA figura:", "opts": ["Prestar el servicio de control de área", "Gestionar el Registro de matrícula de aeronaves", "Presidir la CIDETRA", "Gestionar 46 aeropuertos"], "ans": 1, "why": "La Dirección de seguridad de aeronaves (DSA) gestiona el Registro. La B corresponde a ENAIRE, la C a Aena y la D a la DGAC.", "src": "Manual 1 (nov. 2026), capítulos 3.4.1-3.4.2, p. 29", "note": ""}, {"n": 55, "stem": "The Magic Box is a famous tennis ______ in Madrid.", "opts": ["court", "rink", "course", "pitch"], "ans": 0, "why": "Tennis is played on a \"court\"; \"pitch\" is for football/rugby, \"rink\" for ice sports, \"course\" for golf.", "src": "Real paper of the 2024 call (sat 15-16 February 2025), as transcribed; no official key held.", "note": ""}, {"n": 56, "stem": "¿Qué dos aeronaves de los grupos de pasajeros y de carga tienen el régimen máximo de ascenso inicial más bajo (1000 ft/min)?", "opts": ["B744 y B748", "A388 y A124", "A338 y A339", "A124 y A337"], "ans": 3, "why": "A124 y Beluga XL (A337) 1000 ft/min; B744 1500; A338/A339 2000; A388 2500; B748 2800.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 28-32", "note": ""}, {"n": 57, "stem": "¿Qué Real Decreto regula el procedimiento de certificación de los proveedores civiles de servicios y funciones ATM/ANS y su control normativo continuado?", "opts": ["Real Decreto 310/2022", "Real Decreto 98/2009", "Real Decreto 515/2020", "Real Decreto 1133/2010"], "ans": 2, "why": "Desarrolla el Reglamento (UE) 2017/373: expedición, modificación, suspensión, limitación o revocación del certificado.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 58, "stem": "Very ______ people turned out to vote, so the result was not considered representative.", "opts": ["a few", "few", "less", "little"], "ans": 1, "why": "\"Few\" (without \"a\") with a countable plural means hardly any, which matches \"not representative\"; \"very few\" is the natural intensified form. \"A few\" is positive and cannot take \"very\", and \"little\" and \"less\" go with uncountable nouns.", "src": "Pattern: quantifiers (uoe-real-nov2025 Q19). Swan, <em>Practical English Usage</em>, few, a few.", "note": ""}, {"n": 59, "stem": "Según el manual, ¿con cuánta antelación máxima respecto a la EOBT puede presentarse un plan de vuelo?", "opts": ["24 horas", "240 horas", "48 horas", "120 horas"], "ans": 3, "why": "Punto 1 del tiempo de presentación: no más de 120 horas antes de la hora prevista de fuera calzos.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 5", "note": ""}, {"n": 60, "stem": "Según la definición de fatiga del Doc. 9966 recogida en el manual, ¿cuál NO es una causa de la reducción de la capacidad de desempeño?", "opts": ["La fase circadiana", "La falta de motivación", "La falta de sueño o los periodos prolongados de vigilia", "La carga de trabajo, mental y/o física"], "ans": 1, "why": "La definición cita la falta de sueño o vigilia prolongada, la fase circadiana y/o la carga de trabajo. La motivación aparece en el manual como factor del cansancio (elemento subjetivo).", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 61, "stem": "Según el manual, un microrreventón genera vientos que pueden alcanzar:", "opts": ["Hasta 60 kt en superficie, sin ningún efecto sobre los instrumentos", "Hasta 25 kt, desplazándose a lo largo de un frente frío", "Más de 270 kt, con un diámetro de hasta 1 km", "Hasta 150 kt, con variaciones de más de 50 kt y cambios de presión que alteran los instrumentos"], "ans": 3, "why": "60 kt es la corriente descendente; más de 270 kt son los vientos en superficie de un tornado.", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 68", "note": ""}, {"n": 62, "stem": "Según el manual, las oficinas meteorológicas de aeródromo (OMAe) de España realizan principalmente:", "opts": ["Los sondeos aerológicos de las 00 y 12 UTC", "El TAF, el TREND y los avisos de aeródromo", "Los pronósticos mundiales reticulares de viento y temperatura", "Los informes METAR y SPECI de las observaciones ordinarias y especiales"], "ans": 1, "why": "Las OMAe hacen la vigilancia y las predicciones de los aeródromos bajo su responsabilidad; los METAR/SPECI los hacen las estaciones meteorológicas aeronáuticas (EMAe).", "src": "Manual 3 (nov. 2026), capítulo 1.2, p. 8", "note": ""}, {"n": 63, "stem": "Según el manual, la centralización de la información en una única base de datos permite garantizar, de los datos que usan los sistemas del NM, su:", "opts": ["Trazabilidad, auditoría y cifrado", "Confidencialidad, integridad y disponibilidad", "Rapidez, bajo coste y redundancia", "Coherencia, homogeneidad y compatibilidad"], "ans": 3, "why": "3.4: la base de datos única garantiza «la coherencia, homogeneidad y compatibilidad de los datos»; la fiabilidad de los sistemas se asienta en la exactitud de los datos aportados a la base de datos ENV.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 20", "note": ""}, {"n": 64, "stem": "¿Cuál NO es uno de los cuatro «paralelos más importantes» que cita el manual?", "opts": ["Círculo Polar Ártico", "Trópico de Capricornio", "Paralelo de Greenwich", "Círculo Polar Antártico"], "ans": 2, "why": "Los cuatro son los Círculos Polares Ártico y Antártico y los Trópicos de Cáncer y de Capricornio. No existe un «paralelo de Greenwich».", "src": "Manual 4 (nov. 2026), capítulo 2.2, p. 8", "note": ""}, {"n": 65, "stem": "Según el manual, la misión final de la Unión Europea consiste en:", "opts": ["La armonización y normalización de los métodos de operación de los servicios aéreos", "La creación de un sistema uniforme de gestión del tráfico aéreo para usuarios civiles y militares", "Garantizar los más altos niveles comunes de seguridad de la aviación civil", "La convergencia política y económica del continente mediante la libre circulación de mercancías, capitales, personas y servicios"], "ans": 3, "why": "La A es la misión de EUROCONTROL, la B de EASA y la D de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.3.2, p. 15", "note": ""}, {"n": 66, "stem": "Según la tabla de modalidades de vuelo (p. 12), ¿qué modalidad constituye el tipo de operación más habitual y la base de la mayoría de las operaciones en categoría abierta?", "opts": ["BVLOS", "EVLOS", "VLOS", "Vuelo automático programado"], "ans": 2, "why": "De las VLOS: «Constituyen el tipo de operación más habitual y la base de la mayoría de las operaciones realizadas en categoría abierta.» Las BVLOS suelen ir a la categoría específica.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 67, "stem": "¿Cuál de estos NO es uno de los grupos del catálogo de reconocimiento?", "opts": ["Aviones comerciales de carga", "Aeronaves ligeras de motor de pistón (RECIPROCATING)", "Turbohélices de transporte militar", "Commuter y regional jet para líneas de corto alcance"], "ans": 2, "why": "El grupo militar se llama «Aeronaves militares» (6.4.7) e incluye reactores, turbohélices, helicópteros y un avión no tripulado.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 a 6.4.7, p. 26-43", "note": ""}, {"n": 68, "stem": "Según el manual, ¿en qué banda de frecuencias trabaja la senda de descenso del ILS?", "opts": ["VHF", "LF", "UHF", "HF"], "ans": 2, "why": "El localizador y las radiobalizas trabajan en VHF; la senda de descenso, en UHF.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 69, "stem": "The airport authority has ______ a new procedure to reduce noise at night.", "opts": ["set off", "brought in", "taken over", "put up with"], "ans": 1, "why": "\"Bring in\" means to introduce (a rule, a law). \"Take over\" is to assume control, \"set off\" is to start a journey or trigger, and \"put up with\" is to tolerate.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 70, "stem": "Según el manual, ¿qué es el umbral de la pista, al que dan distancia las radiobalizas?", "opts": ["La zona de toma de contacto de la pista", "El comienzo de la parte de pista utilizable para el aterrizaje", "El punto situado a 3,9 NM de la pista", "El final de la parte de pista utilizable para el aterrizaje"], "ans": 1, "why": "«… distancia al umbral de la pista (comienzo de la parte de pista utilizable para el aterrizaje).» Las aeronaves reciben la radiobaliza al pasar por su vertical.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 34", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"simulacros/replica-fase-1.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
