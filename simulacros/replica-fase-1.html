<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réplica de la Fase 1</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

ymbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i const Q=[{"n": 1, "stem": "The RQS message (request supplementary information) is sent to:", "opts": ["The area control centre of the destination", "The ARO of the departure aerodrome, or the ATS unit specified in a plan filed in flight", "The previous ATS unit along the route", "The NMOC"], "ans": 1, "why": "RQS goes to the ARO of the departure aerodrome or, for a plan filed during flight, to the unit specified in that flight plan message.", "src": "Manual 2.10, M p.15", "note": ""}, {"n": 2, "stem": "How is the channel \"118.000 MHz\" (25 kHz spacing) pronounced in radiotelephony under the ICAO 8.33 kHz naming convention?", "opts": ["\"ONE ONE EIGHT DECIMAL ZERO ZERO ZERO\"", "\"ONE EIGHTEEN POINT ZERO\"", "\"ONE ONE EIGHT DECIMAL ZERO\"", "\"ONE ONE EIGHT ZERO\""], "ans": 2, "why": "When the 5th and 6th digits are both zero, only the first four digits are pronounced, so 118.000 is \"ONE ONE EIGHT DECIMAL ZERO\".", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), §5.2", "note": ""}, {"n": 3, "stem": "A heading in aviation is written with:", "opts": ["three digits, measured anti-clockwise", "two digits, measured anti-clockwise", "three digits, measured clockwise", "four digits, measured clockwise"], "ans": 2, "why": "Three figures, clockwise from north.", "src": "Manual 2.4.3, p.14", "note": ""}, {"n": 4, "stem": "Never before ______ such a large number of aircraft in the sector.", "opts": ["the controller handled", "handled the controller", "the controller has handled", "has the controller handled"], "ans": 3, "why": "\"Never before\" as a negative adverbial at the start of a sentence requires inversion (auxiliary before subject).", "src": "Swan, Practical English Usage, inversion", "note": ""}, {"n": 5, "stem": "______ the cost, the project is not worth continuing.", "opts": ["To give", "Given", "Giving", "Gave"], "ans": 1, "why": "\"Given + noun\" means \"considering\" (a participle used like a preposition).", "src": "Cambridge Dictionary, \"given\"", "note": ""}, {"n": 6, "stem": "The engineer denied ______ the warning light.", "opts": ["ignoring", "having ignore", "to ignore", "ignore"], "ans": 0, "why": "\"Deny\" is followed by a gerund (\"denied ignoring\" or \"denied having ignored\").", "src": "Swan, Practical English Usage, verbs + gerund", "note": ""}, {"n": 7, "stem": "According to ENAIRE's press release on the PV2030 approval, how many tonnes of CO2 had ENAIRE avoided emitting over the preceding five years through airspace optimisation?", "opts": ["68,315 tonnes", "77,000 tonnes", "40,000 tonnes", "300,000 tonnes"], "ans": 3, "why": "The PR on PV2030's approval (Dec 2025) states ENAIRE avoided emitting 300,000 tonnes of CO2 over the past five years through airspace optimisation, and foresees an additional 40,000-tonne reduction during PV2030's implementation. The 68,315 T and 77,000 T figures are two different, mutually inconsistent 2024-only figures from the Memoria de Sostenibilidad 2024.", "src": "PR_Board_approves_Strategic_Plan_2030_EN.txt", "note": ""}, {"n": 8, "stem": "Which front (frente) usually produces bands of thunderstorms and cumulonimbus and moves faster?", "opts": ["Stationary", "Warm", "Occluded", "Cold"], "ans": 3, "why": "Cold fronts move faster and produce thunderstorm bands and cumulonimbus.", "src": "https://en.wikipedia.org/wiki/Weather_front", "note": ""}, {"n": 9, "stem": "The plan fell ______ because of the lack of funding.", "opts": ["across", "into", "along", "through"], "ans": 3, "why": "\"Fall through\" means to fail to happen. The other particles do not form a phrasal verb with that meaning.", "src": "Cambridge Dictionary, \"fall through\"", "note": ""}, {"n": 10, "stem": "Density altitude is best described as:", "opts": ["Pressure altitude corrected for non-standard temperature", "True altitude corrected for non-standard pressure", "The altitude at which air density equals sea-level standard density", "The altitude shown by the altimeter set to QFE"], "ans": 0, "why": "Density altitude is pressure altitude further corrected for temperature deviation from the standard atmosphere. C describes a different, unrelated concept (there is no single fixed altitude of standard density); B and D describe other settings.", "src": "FAA-H-8083-28B §8.4.1.5.", "note": ""}, {"n": 11, "stem": "Which surveillance category does ADS belong to, per the manual?", "opts": ["Primary", "Independent cooperative", "Dependent", "Independent non-cooperative"], "ans": 2, "why": "ADS data are generated directly on the aircraft's own on-board equipment: a dependent surveillance system.", "src": "Manual p.56", "note": ""}, {"n": 12, "stem": "\"How long ______ English?\" \"Since I was fifteen.\"", "opts": ["have you been studying", "are you studying", "do you study", "did you study"], "ans": 0, "why": "\"Since\" + a point in the past requires a present perfect (continuous here, for an activity in progress up to now). Simple present and past do not link the past to now.", "src": "Swan, Practical English Usage, present perfect with \"since\"", "note": ""}, {"n": 13, "stem": "The stereographic projection (proyección estereográfica) is:", "opts": ["Equivalent conic", "Pseudocylindrical", "Equivalent cylindrical", "Conformal azimuthal"], "ans": 3, "why": "The stereographic projection is an azimuthal (planar) projection that is conformal.", "src": "W Stereographic (https://en.wikipedia.org/wiki/Stereographic_map_projection)", "note": ""}, {"n": 14, "stem": "Which IATA resolution governs the assignment of airport codes?", "opts": ["Resolution 500", "Resolution 763", "Resolution 656", "Resolution 1000"], "ans": 1, "why": "IATA Resolution 763 is the one governing airport code assignment; the other numbers are distractors.", "src": "WIKI-IATA", "note": ""}, {"n": 15, "stem": "Increasing the aspect ratio (alargamiento) of the wing:", "opts": ["does not affect it", "increases induced drag", "eliminates parasite drag", "reduces it"], "ans": 3, "why": "Cdi is inversely proportional to AR, so a higher aspect ratio reduces induced drag (as do an elliptical wing and winglets).", "src": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/induced-drag-coefficient/", "note": ""}, {"n": 16, "stem": "\"I will call you as soon as the aircraft lands,\" she said. She said that she ______ me as soon as the aircraft landed.", "opts": ["would call", "had called", "calls", "will call"], "ans": 0, "why": "In reported speech after a past reporting verb, \"will\" backshifts to \"would\".", "src": "Swan, Practical English Usage, indirect speech", "note": ""}, {"n": 17, "stem": "Small circles divide the Earth into two unequal parts called:", "opts": ["zones (husos)", "segments (gajos)", "spherical caps (casquetes esféricos)", "hemispheres (hemisferios)"], "ans": 2, "why": "Great circles give two equal hemispheres; small circles give unequal spherical caps.", "src": "Manual 2.2, p.8", "note": ""}, {"n": 18, "stem": "The airspace controlled by ENAIRE has an area of:", "opts": ["3.5 million km²", "1.19 million km²", "2.5 million km²", "2.19 million km²"], "ans": 3, "why": "2.19 million km²; 2.5 million is the number of flights in 2024.", "src": "Manual sec. 3.6.2, p. 29", "note": ""}, {"n": 19, "stem": "Typical duration of a vortex:", "opts": ["1-3 minutes", "10-20 seconds", "30 minutes", "10 minutes"], "ans": 0, "why": "A vortex typically lasts 1 to 3 minutes; longer in stable air and light wind.", "src": "https://skybrary.aero/articles/wake-vortex-turbulence", "note": ""}, {"n": 20, "stem": "The meeting has been put ______ until next week because of illness.", "opts": ["away", "off", "out", "down"], "ans": 1, "why": "\"Put off\" means to postpone.", "src": "Cambridge Dictionary, \"put off\"", "note": ""}, {"n": 21, "stem": "The two aircraft came ______ close to colliding.", "opts": ["peril", "perilously", "perils", "perilous"], "ans": 1, "why": "An adverb modifies \"close\": \"perilously close\".", "src": "Cambridge Dictionary, \"perilously\"", "note": ""}, {"n": 22, "stem": "What is ICAO's (2001) definition of a \"readback\", as quoted in the SKYbrary radiotelephony readback article?", "opts": ["A pilot's written log of all clearances received", "A mandatory recording of all radio transmissions", "A procedure whereby the receiving station repeats a received message, or an appropriate part, back to the transmitting station to confirm correct reception", "A procedure whereby ATC repeats every instruction twice"], "ans": 2, "why": "ICAO (2001) defines readback exactly as: a procedure whereby the receiving station repeats a received message or an appropriate part thereof back to the transmitting station to obtain confirmation of correct reception.", "src": "SKYbrary, Radiotelephony Readback Compliance", "note": ""}, {"n": 23, "stem": "Per Article 16(10) of Regulation (EU) 376/2014, which of the following is an exception where reporter protection does NOT apply?", "opts": ["A manifest, significant and serious breach of the duty of care causing foreseeable damage or serious safety risk", "An occurrence reported more than once by different people", "Any occurrence involving a foreign-registered aircraft", "An occurrence involving weather-related delay"], "ans": 0, "why": "Article 16(10) excludes from protection (a) deliberate misconduct and (b) a manifest, significant and serious breach of the duty of care with foreseeable damage or serious safety risk.", "src": "AESA, Cultura justa / Regulation (EU) 376/2014 art. 16(10)", "note": ""}, {"n": 24, "stem": "How does the NDB ground station transmit its signal, per the manual?", "opts": ["By satellite relay", "Only toward the aircraft that requested it", "Directionally, in a narrow beam", "Omnidirectionally, over 360 degrees"], "ans": 3, "why": "The manual describes a conventional transmitter emitting an omnidirectional signal in all directions.", "src": "Manual p.20", "note": ""}, {"n": 25, "stem": "The airline has decided to ______ all flights until the fog clears.", "opts": ["call off", "turn over", "set aside", "put through"], "ans": 0, "why": "\"Call off\" means to cancel. \"Put through\" is to connect (a call), \"turn over\" is to hand over or flip, and \"set aside\" is to reserve or ignore.", "src": "Cambridge Dictionary, phrasal verb \"call off\"", "note": ""}, {"n": 26, "stem": "Suppose you ______ the chance again, would you do the same?", "opts": ["get", "got", "will get", "had got"], "ans": 1, "why": "\"Suppose\" with a past simple expresses a hypothetical present or future situation.", "src": "Cambridge Dictionary, \"suppose\"", "note": ""}, {"n": 27, "stem": "Which is NOT one of the tail types of section 6.2.3?", "opts": ["Cola en V", "Cola en T", "Cola doble", "Cola en cruz"], "ans": 0, "why": "The manual lists T, cruciform, fuselage-mounted and twin tails.", "src": "M2 p. 19", "note": ""}, {"n": 28, "stem": "Which organization has \"full members\" (ANSPs) and \"associate members\"?", "opts": ["IATA", "CANSO", "ACI", "EUROCAE"], "ans": 1, "why": "CANSO, the Civil Air Navigation Services Organisation.", "src": "Manual sec. 2.5, p. 22", "note": ""}, {"n": 29, "stem": "The current basic Regulation of EASA is:", "opts": ["Regulation (EC) No 549/2004", "Regulation (EU) 2018/1139", "Regulation (EU) 2015/340", "Regulation (EC) No 1592/2002"], "ans": 1, "why": "Regulation (EU) 2018/1139 (in force since 11-9-2018) is the current basic Regulation; 1592/2002 was the original one, 2015/340 concerns ATCO licences and 549/2004 is the SES framework.", "src": "https://www.easa.europa.eu/en/the-agency/the-agency (Reg. 2018/1139)", "note": ""}, {"n": 30, "stem": "The altitude (altitud) is the vertical distance between a point in the air and:", "opts": ["The mean sea level", "The ground", "The 1013.25 hPa surface", "The aerodrome reference point"], "ans": 0, "why": "Height is measured from the ground, altitude from MSL, and elevation is the MSL distance of a terrain point.", "src": "Manual 3, 2.10.2, p. 23", "note": ""}, {"n": 31, "stem": "What must the pilot do before using the INS to navigate, per the manual?", "opts": ["Enter the initial coordinate (origin airport)", "Align the compass with magnetic north manually", "Tune a VOR frequency", "Nothing; it self-calibrates"], "ans": 0, "why": "The INS requires the pilot to enter the starting coordinate before use, since it computes position by integration from that point.", "src": "Manual p.52", "note": ""}, {"n": 32, "stem": "This is the airport ______ I used to work.", "opts": ["where", "that", "which", "what"], "ans": 0, "why": "\"Where\" is a relative adverb of place, replacing \"in which\".", "src": "Cambridge Dictionary, \"where\" (relative)", "note": ""}, {"n": 33, "stem": "He apologised ______ being late for the briefing.", "opts": ["of", "about that", "for", "to"], "ans": 2, "why": "\"Apologise for + gerund\"; the person apologised to is introduced with \"to\" (\"apologise to the captain for being late\").", "src": "Cambridge Dictionary, \"apologize\"", "note": ""}, {"n": 34, "stem": "Which speed is obtained once instrument, position AND compressibility errors have been corrected?", "opts": ["GS", "EAS", "IAS", "CAS"], "ans": 1, "why": "Equivalent airspeed (EAS) also corrects compressibility; it equals CAS at sea level in the standard atmosphere.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 35, "stem": "The maximum crosswind component tolerated by aircraft, according to the manual, varies between:", "opts": ["15 and 35 kt", "40 and 60 kt", "5 and 10 kt", "10 and 20 kt"], "ans": 0, "why": "It depends on aircraft type and runway conditions.", "src": "Manual 3, 8.4, p. 51", "note": ""}, {"n": 36, "stem": "Which service is described as making available to airspace users all the relevant air navigation information, updated and with the quality needed for safe and efficient operations?", "opts": ["AIS", "ATFM", "CNS", "FPD"], "ans": 0, "why": "Aeronautical Information Service (AIS), chapter 1.4.3.", "src": "Manual 7, chapter 1.4.3, p. 13", "note": ""}, {"n": 37, "stem": "Explosive decompression is generally defined as a cabin pressure change occurring:", "opts": ["In less than about 0.5 seconds, faster than the lungs can decompress", "Over more than 5 seconds", "Only during descent", "Only above FL410"], "ans": 0, "why": "PHAK: most authorities consider any decompression occurring in less than 0.5 seconds to be explosive and potentially dangerous, since the normal time for unrestricted lung decompression is about 0.2 seconds.", "src": "FAA PHAK 8083-25C ch. 7, \"Pressurized Aircraft\"", "note": ""}, {"n": 38, "stem": "What is \"Common Project One\" (CP1) under the SES/SESAR framework?", "opts": ["A plan for U-space services only", "ENAIRE's own internal digitalisation plan", "The EU regulation tied to SESAR, mandating synchronised, interoperable ATM functionality deployment across Europe", "The predecessor of the ATM Master Plan"], "ans": 2, "why": "CP1 mandates synchronised, interoperable ATM functionality deployment across Europe to improve safety, efficiency and capacity and reduce environmental impact; CP2, linked to the ATM Master Plan's SDOs, is upcoming.", "src": "Plan_Vuelo_2030.txt (§6.2)", "note": ""}, {"n": 39, "stem": "The distress phase does NOT apply when:", "opts": ["The aircraft is on an IFR flight plan", "The alert phase lasted less than 30 minutes", "The aircraft has already landed at an alternate", "There is reasonable certainty that the aircraft and occupants are not threatened by grave and imminent danger and need no immediate assistance"], "ans": 3, "why": "The manual excludes the distress phase when there is reasonable certainty that aircraft and occupants face no grave and imminent danger and do not need immediate assistance.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 40, "stem": "The ATFM slot is allocated, and the SAM (Slot Allocation Message) is sent, at the moment called SIT1, which corresponds to:", "opts": ["EOBT minus 2 hours", "EOBT minus 30 minutes", "EOBT minus 1 hour", "EOBT minus 6 hours"], "ans": 0, "why": "The FLS message defines \"SIT1 (EOBT - 2 hours)\" and the SAM is \"sent to AOs / ATS 2 hours before the last received EOBT\".", "src": "ATFCM-OM, FLS message \"SIT1 (EOBT - 2 hours)\" and SAM", "note": ""}, {"n": 41, "stem": "Per ICAO Doc 9966, what is the maximum aggregate duty-period hours within a defined 30-day/720-hour period?", "opts": ["250 hours", "175 hours", "200 hours", "150 hours"], "ans": 2, "why": "Doc 9966 gives 200 hours as the aggregate duty-hours ceiling within 720 consecutive hours (30 consecutive days).", "src": "ICAO Doc 9966, quoted in the EUROCONTROL 2023 guideline", "note": ""}, {"n": 42, "stem": "What is the European Central Repository (ECR), created under Regulation (EU) 376/2014?", "opts": ["A database of EASA-certified maintenance organisations", "A list of ATCO licences issued across the EU", "A EUROCONTROL flight-plan archive", "A repository managed by the Commission holding occurrence data transferred by Member States"], "ans": 3, "why": "The Commission manages the European Central Repository, into which Member States must transfer collected occurrence data for use by competent authorities, EASA and the Commission.", "src": "Regulation (EU) 376/2014, read in full", "note": ""}, {"n": 43, "stem": "Which NOTAM series in AIP España covers RPAS (unmanned aircraft) activity at low altitude?", "opts": ["Series G", "Series B", "Series R", "Series E"], "ans": 2, "why": "GEN 3.1 defines Series R as referring to unmanned aircraft (RPAS) activity at low altitude.", "src": "AIP España GEN 3.1, sect. 3.4.1", "note": ""}, {"n": 44, "stem": "After the merger, the two companies found themselves ______ odds over the management structure.", "opts": ["on", "at", "by", "in"], "ans": 1, "why": "\"At odds (with each other) over/about\" means in disagreement.", "src": "Cambridge Dictionary, \"at odds\"", "note": ""}, {"n": 45, "stem": "What does RETSRA indicate?", "opts": ["Thunderstorm in the vicinity", "Forecast rain shower", "Recent thunderstorm with rain", "Thunderstorm with rain at the time of observation"], "ans": 2, "why": "The prefix RE means recent weather, so RETSRA is a recent thunderstorm with rain.", "src": "AEMET p. 25 and p. 22 (RE = recent weather)", "note": ""}, {"n": 46, "stem": "Per the ATFCM Operations Manual's internal-procedure section, does internal (within-ACC) level capping require individual coordination with the NMOC?", "opts": ["Only during the strategic phase", "Yes, always", "Only if it affects two or more adjacent ACCs", "No, individual coordination with the NMOC is not required"], "ans": 3, "why": "The manual states that individual coordination of such internal measures with the NMOC is not required (though inter-ACC coordination is still needed).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.9.1.1", "note": ""}, {"n": 47, "stem": "The authorities are reluctant to comply ______ the new regulations.", "opts": ["with", "for", "to", "by"], "ans": 0, "why": "\"Comply with\" is the dependent preposition.", "src": "Cambridge Dictionary, \"comply with\"", "note": ""}, {"n": 48, "stem": "The airline's reputation has taken a serious ______ following the data leak.", "opts": ["stroke", "knock", "wound", "hit"], "ans": 3, "why": "\"Take a hit\" (suffer damage) is the natural collocation with \"reputation\". \"Wound\" is not used with \"take\" in this way, and \"take a stroke\" and \"take a knock\" do not fit here.", "src": "Cambridge Dictionary, \"hit\" (noun)", "note": ""}, {"n": 49, "stem": "In the Austin-Bergstrom case, what did the NTSB cite as a contributory factor for the tower controller?", "opts": ["Equipment malfunction of the ILS", "Fatigue after a long shift", "Expectation bias regarding the Southwest aircraft's position", "Failure to use standard phraseology"], "ans": 2, "why": "The NTSB report cited the tower controller's expectation bias — believing the Southwest 737 was already at the hold-short line — as a contributory factor.", "src": "SKYbrary, ATC Expectation Bias (Austin case) / NTSB", "note": ""}, {"n": 50, "stem": "What is the key difference between the RNAV specification and the RNP specification?", "opts": ["RNP includes the requirement for on-board performance monitoring and alerting; RNAV does not", "RNAV is only used oceanically; RNP is only used continentally", "RNAV requires satellite navigation; RNP does not", "There is no difference; they are synonyms"], "ans": 0, "why": "This on-board monitoring/alerting requirement is the manual's defining distinction between RNP and RNAV.", "src": "Manual p.10", "note": ""}, {"n": 51, "stem": "PHAK's example of interference drag states that a jet fighter carrying two identical external wing fuel tanks has:", "opts": ["exactly the same total drag as carrying one tank", "reduced induced drag compared with a clean wing", "more total drag than twice the drag of a single tank alone, because of interference between the two tank flow fields", "less total drag than a single tank, because the tanks cancel each other's wake"], "ans": 2, "why": "PHAK's cited example: the two tanks' flow fields interact, adding interference drag on top of each tank's own drag, so total drag exceeds simply doubling one tank's drag.", "src": "FAA PHAK 8083-25C, ch. 5", "note": ""}, {"n": 52, "stem": "What does PCATS stand for in manual 7?", "opts": ["Plan de contingencia ATS", "Plan de Capacitación de Aeródromo y Torre de Sector", "Programa de control aéreo en tiempo de situación", "Plan de coordinación de aeronaves en tránsito seguro"], "ans": 0, "why": "\"PCATS (Plan de contingencia ATS)\", listed under refresher training.", "src": "Manual 7, chapter 1.5.A, p. 14", "note": ""}, {"n": 53, "stem": "In which year was ENAIRE designated Operador de Servicios Esenciales (essential services operator)?", "opts": ["2015", "2019", "2023", "2016"], "ans": 1, "why": "2019 (the Operador de Infraestructuras Críticas designation was in 2015).", "src": "Manual 7, chapter 1.1, p. 5", "note": ""}, {"n": 54, "stem": "A flight approved for exemption from ATFM measures indicates it in Item 18 with:", "opts": ["RFP/Q1", "STS/ATFMX", "DLE/ATFM", "RMK/NOATFM"], "ans": 1, "why": "The STS/ATFMX indicator in Item 18 marks an ATFM-exempted flight. The other indicators are invented or refer to other purposes (RFP = replacement flight plan, DLE = en-route delay).", "src": "AIP ENR 1.10 Item 18 STS/ATFMX", "note": ""}, {"n": 55, "stem": "It is ______ to check the weather before every flight.", "opts": ["essential", "essence", "essentials", "essentially"], "ans": 0, "why": "\"It is + adjective + to-infinitive\": \"essential\". \"Essentially\" is an adverb.", "src": "Cambridge Dictionary, \"essential\"", "note": ""}, {"n": 56, "stem": "I wish I ______ speak Japanese; it would help me in my new job.", "opts": ["can", "will", "would", "could"], "ans": 3, "why": "A wish about a present situation takes the past form of the verb: \"could\". \"Can\" and \"will\" are present forms, and \"would\" is used to express annoyance about someone else's behaviour.", "src": "Swan, Practical English Usage, \"wish\"", "note": ""}, {"n": 57, "stem": "Slant (oblique) visibility is normally:", "opts": ["Greater than vertical and horizontal visibility", "Measured with a balloon", "Lower than vertical and horizontal visibility", "Equal to horizontal visibility"], "ans": 2, "why": "The segment aircraft-object is longer than its horizontal and vertical projections.", "src": "Manual 3, 8.2, p. 47", "note": ""}, {"n": 58, "stem": "Which is NOT one of the four states of stress in control tasks?", "opts": ["Hypostress", "Parastress", "Hyperstress", "Eustress"], "ans": 1, "why": "The four are hypostress, eustress, hyperstress and distress.", "src": "ENAIRE manual 8, sec. 6.3, p.51-52", "note": ""}, {"n": 59, "stem": "Please ______ in mind that the deadline cannot be extended.", "opts": ["hold", "put", "take", "keep"], "ans": 3, "why": "\"Keep/bear in mind\" is the collocation. \"Put in mind\" is archaic, and \"hold\" and \"take\" do not combine with \"in mind\" in this sense.", "src": "Cambridge Dictionary, \"keep in mind\"", "note": ""}, {"n": 60, "stem": "What is the RECAT-EU category of the Embraer 190 (E190)?", "opts": ["CAT-D", "CAT-E", "CAT-C", "CAT-F"], "ans": 1, "why": "E190 and E195 are CAT-E (Lower Medium); the E190-E2 (E290) and E195-E2 (E295) are CAT-D.", "src": "EASA RECAT-EU assignment Issue 2021-12", "note": ""}, {"n": 61, "stem": "When did Spain accept the International Air Services Transit Agreement (IASTA)?", "opts": ["11 October 2011", "4 April 1947", "21 February 1947", "30 November 1945"], "ans": 3, "why": "IASTA's own parties list shows Spain's acceptance dated 30 November 1945 — earlier than the Chicago Convention's own entry into force (4 April 1947) or the manual's date for Spain's ratification of the Chicago Convention itself (21 Feb 1947). (D) is an unreliable, likely misaligned row from the Chicago Convention's own status table and should not be used as a fact.", "src": "IASTA parties list, UNTS 84", "note": ""}, {"n": 62, "stem": "The Montreal Convention of 28 May 1999 repeals and replaces the:", "opts": ["Rome Convention of 1933", "Warsaw Convention of 1929", "Chicago Convention", "Tokyo Convention"], "ans": 1, "why": "The Warsaw Convention (12 October 1929) as amended by The Hague, Guadalajara and Montreal protocols.", "src": "Manual sec. 4.2.1, p. 32", "note": ""}, {"n": 63, "stem": "What is the format of a Spanish test registration (matrícula de prueba) under RD 384/2015?", "opts": ["EC, a hyphen and three letters", "EC-T followed by two numbers", "EC, a hyphen and four numbers", "EC, a hyphen and three numbers"], "ans": 3, "why": "Art. 36: \"la marca de nacionalidad EC seguida por un guion y a continuación tres números\".", "src": "Real Decreto 384/2015, art. 36", "note": ""}, {"n": 64, "stem": "How many aircraft types have WTC J in the ICAO Doc 8643 database?", "opts": ["Five", "None", "One: the A388 (Airbus A380-800)", "Three"], "ans": 2, "why": "The database has 2 model rows with WTC J, both the A388 (A-380-800 and A-380-800 Prestige). J is defined as \"types specified as such in Doc 8643\", not by a mass.", "src": "ICAO Doc 8643 database; FAA JO 7360.1K 2-6", "note": ""}, {"n": 65, "stem": "What is the maximum certificated take-off mass of a Heavy (H) aircraft in the ICAO WTC classification of the manual?", "opts": ["More than 7,000 kg", "Less than 136,000 kg", "560,000 kg or more", "136,000 kg or more"], "ans": 3, "why": "H is 136,000 kg or more; J is exclusive to the A380-800.", "src": "M2 p. 33", "note": ""}, {"n": 66, "stem": "The manager was ______ with the trainee's attitude.", "opts": ["disappoint", "disappointment", "disappointed", "disappointing"], "ans": 2, "why": "Adjectives in \"-ed\" describe how someone feels (\"was disappointed with\"), while \"-ing\" describes the thing causing the feeling (\"a disappointing result\").", "src": "Swan, Practical English Usage, -ed and -ing adjectives", "note": ""}, {"n": 67, "stem": "What three individual services does a VORTAC provide from one site?", "opts": ["VOR azimuth, VOR distance, TACAN azimuth", "NDB bearing, VOR azimuth, DME distance", "VOR azimuth, TACAN azimuth, TACAN distance", "TACAN azimuth, TACAN distance, ILS glide path"], "ans": 2, "why": "A VORTAC combines VOR and TACAN to give VOR azimuth, TACAN azimuth and TACAN distance (used by civil aircraft as DME) from a single site.", "src": "FAA AIM 1-1-5", "note": ""}, {"n": 68, "stem": "In a stereographic projection the projection focus is located:", "opts": ["inside the cone", "at infinity", "on the Earth's surface", "at the centre of the Earth"], "ans": 2, "why": "\"Cuando el foco de proyección se encuentra sobre la superficie terrestre\".", "src": "Manual 3.2.2, p.27", "note": ""}, {"n": 69, "stem": "His ______ to admit the mistake made the situation worse.", "opts": ["reluctantly", "reluctance", "reluctances", "reluctant"], "ans": 1, "why": "After a possessive adjective (\"His\") a noun is required, and \"reluctance\" is uncountable, so no plural form.", "src": "Cambridge Dictionary, \"reluctance\"", "note": ""}, {"n": 70, "stem": "In the UTM system, what central-meridian scale factor is used, and why was that specific value chosen?", "opts": ["1.0004, to compensate for Earth curvature", "0.9996, to minimize the maximum scale variation within a zone", "1.0000, to keep the central meridian at true scale", "0.9990, matching the Mercator secant factor at the equator"], "ans": 1, "why": "USGS explains k0 = 0.9996 (a 1:2500 reduction) was chosen to minimize scale variation across a zone, so the true-scale lines fall about 180 km either side of the central meridian.", "src": "USGS PP1395, \"Universal Transverse Mercator Projection\"", "note": ""}],U={"lang": "en", "contents": "Contents", "index": "Index", "words": "words", "min_read": "min read", "quiz": "quiz", "article": "article", "score": "correct of", "answered": "answered", "questions": "questions", "shuffle_q": "Shuffle questions", "shuffle_o": "Shuffle options", "hide": "Hide answered", "mistakes": "Only my mistakes", "reset": "Reset", "correct": "Correct.", "wrong": "Wrong.", "note": "Note", "source": "Source", "confirm": "Clear your answers for this quiz?", "badge": {"V": "read in the full source", "V*": "read in a summary", "V-W": "Wikipedia (secondary)", "NV": "not verified", "D": "derived / calculated", "X": "not found"}},KEY='atcquiz:'+"simulacros/replica-fase-1.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
