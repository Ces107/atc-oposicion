const Q=[{"n": 1, "stem": "El Network Manager Directorate es un Directorado que pertenece a la estructura ejecutiva de:", "opts": ["OACI", "RCTA", "SESAR", "EUROCONTROL"], "ans": 3, "why": "La estructura ejecutiva de EUROCONTROL incluye el Network Manager Directorate junto con Air Traffic Management, Pan-European Single Sky, etc.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1", "note": "La opción B conserva la grafía «RCTA» del manual anterior; el manual de noviembre 2026 imprime «RTCA» (Radio Technical Commission for Aeronautics, p. 25). La respuesta no cambia."}, {"n": 2, "stem": "El documento de OACI que complementa las normas y métodos recomendados en los Anexos 2 y 11, en relación a la Gestión del Tránsito Aéreo es:", "opts": ["Doc 8169", "Doc 9859", "Doc 7383", "Doc 4444"], "ans": 3, "why": "El Doc 4444 (PANS-ATM) desarrolla los Anexos 2 y 11 en gestión del tránsito aéreo. Doc 9859 es el manual de gestión de la seguridad operacional, Doc 8169 PANS-OPS y Doc 7383 tarifas.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «edición del Anexo 11 del Convenio de OACI y la 16ª edición del Doc. 4444 (PANS-ATM).»", "note": ""}, {"n": 3, "stem": "El Real Decreto 184/2008 desarrolló un nuevo modelo de gestión de la aviación civil, que se caracteriza por un desdoblamiento de la autoridad aeronáutica. En este contexto, entre las competencias de la Agencia Española de Seguridad Aérea están:", "opts": ["La inspección aeronáutica", "La formulación de propuestas sectoriales y de la política estratégica en materia de aviación civil", "La representación y coordinación con otras administraciones", "Realizar la investigación de los accidentes e incidentes de aviación civil que se producen en territorio español"], "ans": 0, "why": "A AESA le corresponde la inspección aeronáutica y la potestad sancionadora. Las propuestas de política estratégica y la representación son de la DGAC, y la investigación de accidentes de la CIAIAC.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «es el organismo al que compete el ejercicio de las potestades inspectoras y sancionadoras en materia de aviación civil»", "note": ""}, {"n": 4, "stem": "La Entidad Pública Empresarial ENAIRE, adscrita al Ministerio de Transportes y Movilidad Sostenible, es:", "opts": ["Certificador del control del tránsito aéreo, de la información aeronáutica y de las redes de comunicación, navegación y vigilancia", "Gestor del control del tránsito aéreo y el certificador de la información aeronáutica y de las redes de comunicación, navegación y vigilancia", "Gestor del control del tránsito aéreo, de la información aeronáutica y de las redes de comunicación, navegación y vigilancia", "Ninguna de las anteriores"], "ans": 2, "why": "ENAIRE es gestor (no certificador) del control del tránsito aéreo, de la información aeronáutica y de las redes CNS; la certificación corresponde a AESA.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «es el gestor del control del tránsito aéreo, de la información aeronáutica y de las redes de comunicación, navegación y»", "note": ""}, {"n": 5, "stem": "Las Circulares Aeronáuticas son publicaciones de:", "opts": ["La OACI", "La DGAC", "EUROCONTROL", "EASA"], "ans": 1, "why": "Las Circulares Aeronáuticas son disposiciones secundarias aprobadas por la DGAC, no por OACI, EUROCONTROL ni EASA.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «Aprobadas por la Dirección General de Aviación Civil.»", "note": ""}, {"n": 6, "stem": "El principal mecanismo de armonización puesto en marcha por la Comisión de Regulación de seguridad de EUROCONTROL son las normas:", "opts": ["ECAC", "JAR", "ESARR", "EASA"], "ans": 2, "why": "Las normas ESARR (EUROCONTROL Safety Regulation Requirements) son el mecanismo de armonización de la seguridad de la Comisión de Regulación de seguridad.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «Las normas ESARR son adoptadas por el Consejo Provisional y aprobadas por la Comisión de EUROCONTROL.»", "note": ""}, {"n": 7, "stem": "EAD es una base de datos AIS desarrollada por los Estados miembros de:", "opts": ["Unión Europea", "EUROCONTROL", "ECAC", "OACI"], "ans": 1, "why": "EAD es la base de datos AIS europea desarrollada por los Estados miembros de EUROCONTROL.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «la base de datos AIS desarrollada por los estados miembros de EUROCONTROL»", "note": ""}, {"n": 8, "stem": "EUROCAE es una organización que:", "opts": ["Tiene como misión armonizar e integrar los servicios de navegación aérea en Europa", "Tiene por único fin la implantación para 2020 de una red de gestión del tráfico aéreo europeo de altas prestaciones", "Tiene por misión promover los más altos niveles comunes de seguridad y de protección del medio ambiente de la aviación civil", "Intenta proporcionar un foro europeo para la resolución de problemas y creación de estándares para la electrónica en la aviación"], "ans": 3, "why": "EUROCAE es el foro europeo de estándares para la electrónica en aviación. Las otras opciones describen EUROCONTROL, SESAR y EASA.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «Intentaba proporcionar un foro europeo para la resolución de problemas y creación de estándares para la electrónica en la aviación»", "note": ""}, {"n": 9, "stem": "Dentro de las libertades del aire que fueron recogidas por primera vez en el Convenio de Chicago, la Octava Libertad es la de:", "opts": ["Libertad de Transporte Externo Consecutivo", "Libertad de Cabotaje Consecutivo", "Libertad de Transporte Externo-Interno", "Ninguna de las anteriores"], "ans": 1, "why": "La octava libertad es la de cabotaje consecutivo; la de transporte externo consecutivo es la quinta.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «Octava Libertad: Llamada Libertad de Cabotaje Consecutivo.»", "note": ""}, {"n": 10, "stem": "¿Por qué Reglamento Europeo se rige la EASA?", "opts": ["(UE) Nº 2021/664", "(CE) Nº 2099/2005", "(CE) Nº 1592/2002", "(CE) Nº 2099/2002"], "ans": 2, "why": "EASA se creó con el Reglamento (CE) 1592/2002, que fue su base original; hoy se rige por el Reglamento (UE) 2018/1139, que no figura entre las opciones.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «se creó en 2002 y actualmente se rige por el Reglamento UE 2018/1139.»", "note": "Desactualizada respecto a 2017: la respuesta vigente (Reg. UE 2018/1139) no aparece entre las opciones."}, {"n": 11, "stem": "El Anexo 19 de OACI trata sobre:", "opts": ["Las normas y métodos recomendados para el otorgamiento de licencias al personal", "Gestión de la seguridad operacional", "Normas y métodos recomendados internacionales relativos a la investigación de accidentes e incidentes de aviación", "Normas y métodos recomendados relativos a las cartas aeronáuticas"], "ans": 1, "why": "El Anexo 19 trata de la gestión de la seguridad operacional. Licencias es el Anexo 1, investigación de accidentes el 13 y cartas el 4.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «19 Gestión de la seguridad operacional.»", "note": ""}, {"n": 12, "stem": "El anexo de OACI que regula los Servicios de Tránsito Aéreo es:", "opts": ["Anexo 1", "Anexo 10", "Anexo 11", "Anexo 14"], "ans": 2, "why": "El Anexo 11 regula los servicios de tránsito aéreo. El 10 es telecomunicaciones y el 14 aeródromos.", "src": "Examen real ENAIRE 2017, test A (adaptado a 2025). Manual ENAIRE, tema 1: «OACI, Anexo 11, Servicios de Tránsito Aéreo»", "note": ""}, {"n": 13, "stem": "La Organización Europea para la Seguridad de la Navegación Aérea es:", "opts": ["EUROCONTROL", "EASA", "JAA", "SESAR"], "ans": 0, "why": "EUROCONTROL es la Organización Europea para la Seguridad de
