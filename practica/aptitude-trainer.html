<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATC Aptitude Trainer</title>
<style>
:root{
  --bg:#12151a; --panel:#1b2028; --panel2:#232a34; --borde:#3a4452;
  --texto:#eef2f7; --suave:#aab5c4; --acento:#4fc3f7; --bien:#7bd88f; --mal:#ff8a80; --aviso:#ffcc80;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.45}
#app{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2rem 0 .6rem}
h2{font-size:1.25rem;margin:1.2rem 0 .5rem}
h3{font-size:1.02rem;margin:.8rem 0 .3rem}
p{margin:.4rem 0}
.suave{color:var(--suave)} .peq{font-size:.85rem}
.bien{color:var(--bien)} .mal{color:var(--mal)} .aviso{color:var(--aviso)}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:18px;margin-bottom:14px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tarjeta{background:var(--panel);border:2px solid var(--borde);border-radius:10px;padding:16px;text-align:left;color:var(--texto);font:inherit;cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.tarjeta:hover,.tarjeta:focus-visible{border-color:var(--acento)}
.tarjeta .num{display:inline-block;background:var(--acento);color:#06202c;font-weight:700;border-radius:6px;padding:0 9px;margin-right:6px}
.tarjeta h2{margin:.2rem 0 .4rem;font-size:1.2rem}
.tarjeta .datos{margin-top:auto;padding-top:.6rem;font-size:.85rem;color:var(--suave)}
button,select,input{font:inherit}
.btn{background:var(--panel2);color:var(--texto);border:2px solid var(--borde);border-radius:8px;padding:10px 18px;min-height:46px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--acento)}
.btn.primario{background:var(--acento);color:#06202c;border-color:var(--acento);font-weight:700}
.btn.peligro{border-color:var(--mal);color:var(--mal)}
.enlace{background:none;border:none;color:var(--acento);cursor:pointer;padding:6px 0;text-decoration:underline}
input[type=text],select{background:#0d1014;color:var(--texto);border:2px solid var(--borde);border-radius:8px;padding:10px 12px;min-height:46px;width:100%}
input[type=range]{width:100%}
input[type=text]:focus,select:focus,input[type=range]:focus-visible,.btn:focus-visible,.tarjeta:focus-visible,.enlace:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
label.et{display:block;margin:.9rem 0 .3rem;font-weight:600}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fila>*{flex:0 0 auto}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:.8rem 0}
.cifra{background:var(--panel2);border-radius:8px;padding:10px 12px}
.cifra b{display:block;font-size:1.6rem}
.cifra span{color:var(--suave);font-size:.85rem}
.barra{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:.5rem 0}
.barra>div{height:100%;background:var(--acento);width:0}
.barra.tarde>div{background:var(--mal)}
.pregunta{font-size:3.4rem;text-align:center;margin:1.2rem 0;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.entrada{font-size:2rem;text-align:center;max-width:280px;margin:0 auto;display:block}
.retro{min-height:2.2rem;text-align:center;font-size:1.2rem;margin-top:.8rem}
.cabecera{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--suave)}
.cabecera b{color:var(--texto)}
.aviso-caja{border-left:5px solid var(--aviso);background:var(--panel2);padding:10px 14px;border-radius:6px;margin:.8rem 0}
.bien-caja{border-left:5px solid var(--bien);background:var(--panel2);padding:10px 14px;border-radius:6px;margin:.8rem 0}
.record{font-size:1.3rem;color:#1b1400;background:var(--aviso);display:inline-block;padding:4px 14px;border-radius:6px;font-weight:700;margin:.4rem 0}
.dual{background:var(--panel);border:2px solid var(--borde);border-radius:10px;padding:8px 14px;text-align:center;margin-bottom:12px;display:flex;align-items:center;gap:16px;justify-content:center}
.dual .dg{font-size:2.2rem;font-weight:700;line-height:1.1}
/* d2 */
.fila-d2{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:1rem 0;background:#f4f1e8;color:#111;padding:14px 8px;border-radius:8px}
.d2c{width:30px;height:52px;border-radius:4px;border:2px solid transparent;background:transparent}
.d2c.pasado{opacity:.5}
.d2c.ok{background:#b8e6bf;opacity:1}
.d2c.mal{background:#ffb4ab;opacity:1}
.d2c.omitido{border-color:#e08a00;opacity:1}
.d2c.actual{border-color:#0b6bcb;background:#cfe5ff}
/* n-back */
.cuadricula{display:grid;grid-template-columns:repeat(3,92px);gap:8px;justify-content:center;margin:1rem auto}
.cuadricula div{width:92px;height:92px;background:var(--panel2);border:2px solid var(--borde);border-radius:8px}
.cuadricula div.on{background:var(--acento);border-color:#fff}
.tecla{display:inline-block;min-width:46px;text-align:center;padding:8px 14px;border:2px solid var(--borde);border-radius:8px;background:var(--panel2);font-weight:700}
.tecla.pulsada{background:var(--bien);color:#06200f;border-color:var(--bien)}
.letra-grande{font-size:3rem;text-align:center;min-height:4rem;font-weight:700}
/* left/right figure */
.figbox{position:relative;width:min(340px,42vh);aspect-ratio:1;margin:0 auto;background:#0d1014;border-radius:10px;overflow:hidden}
.figbox #fig{position:absolute;inset:0}
.figura{position:absolute;inset:0;margin:auto;width:100%;height:auto}
.oculto-fig{position:absolute;inset:0;background:#0d1014;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--aviso);text-align:center;padding:10px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--aviso);color:#1b1400;font-weight:700;padding:12px 22px;border-radius:8px;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.fb-ok{color:var(--bien)} .fb-mal{color:var(--mal)}
.entrada.sacude{animation:sacude .25s;border-color:var(--mal)}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pasos{margin:.4rem 0 .4rem 1.2rem;padding:0}
.pasos li{margin:.25rem 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:.6rem 0}
.tabs .btn{min-height:40px;padding:6px 14px}
.tabs .btn[aria-pressed=true]{background:var(--acento);color:#06202c;border-color:var(--acento);font-weight:700}
.tendencia{font-weight:700}
/* table */
.tabla-caja{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border-bottom:1px solid var(--borde);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--suave);position:sticky;top:0;background:var(--panel)}
.leyenda span{margin-right:14px;white-space:nowrap}
details{margin:.6rem 0}
summary{cursor:pointer;color:var(--acento)}
kbd{background:var(--panel2);border:1px solid var(--borde);border-radius:4px;padding:0 6px}
@media (max-width:640px){
  html{font-size:17px}
  .pregunta{font-size:2.5rem}
  .cuadricula{grid-template-columns:repeat(3,72px)} .cuadricula div{width:72px;height:72px}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ==== LOGICA PURA INICIO ====
// (Marker kept in Spanish on purpose: the test script extracts the pure logic between "LOGICA PURA INICIO" and "LOGICA PURA FIN".)
function entero(rnd, a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function elegir(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }
function barajar(rnd, arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function limitar(v, a, b){ return Math.max(a, Math.min(b, v)); }
// Number format: English decimal point (input parsing elsewhere accepts both "." and ",").
function fmt(x, d){
  if (x === null || x === undefined || isNaN(x)) return '—';
  return Number(x).toFixed(d === undefined ? 1 : d);
}

/* ==================================================================
   Difficulty system shared by all four modules (mandatory, see the
   task card): a 10-level manual ladder, an Adaptive mode with a
   complexity level and a speed level (the speed level only rises
   while recent accuracy stays at PRECISION_MINIMA or above, guarding
   against speeding up before accuracy is solid), a Custom
   mode built on top of one level's content plus independent sliders,
   and hint levels 0-3 available only up to HINT_MAX_LEVEL.
   ================================================================== */
const MAX_NIVEL = 10;
const HINT_MAX_LEVEL = 6;          // hints are off from level 7 up
const PRECISION_MINIMA = 96;       // anti-acceleration rule: never speed up below this accuracy
function esValida(precision){ return precision >= PRECISION_MINIMA; }

// Adaptive engine: complexity level goes up after 5 consecutive correct answers and down
// after 2 consecutive failures. The speed level follows the complexity level but is capped
// by speedCap, which only rises when the last 10 answers are at least PRECISION_MINIMA % accurate.
function adaptivaIniciar(nivelInicial){
  const l = limitar(nivelInicial, 1, MAX_NIVEL);
  return { nivel:l, racha:0, fallos:0, techoVel:l, recientes:[] };
}
function adaptivaNivelVelocidad(s){ return limitar(Math.min(s.nivel, s.techoVel), 1, MAX_NIVEL); }
function adaptivaPaso(s, ok){
  const n = { nivel:s.nivel, racha:s.racha, fallos:s.fallos, techoVel:s.techoVel, recientes:s.recientes.slice() };
  n.recientes.push(ok ? 1 : 0);
  if (n.recientes.length > 10) n.recientes.shift();
  if (ok){
    n.fallos = 0; n.racha += 1;
    if (n.racha >= 5){ n.racha = 0; if (n.nivel < MAX_NIVEL) n.nivel += 1; }
  } else {
    n.racha = 0; n.fallos += 1;
    if (n.fallos >= 2){ n.fallos = 0; if (n.nivel > 1) n.nivel -= 1; }
  }
  if (n.recientes.length >= 10){
    const acc = n.recientes.reduce(function(a, b){ return a + b; }, 0) / n.recientes.length * 100;
    if (acc >= PRECISION_MINIMA && n.techoVel < n.nivel){ n.techoVel += 1; n.recientes = []; }
  }
  if (n.techoVel > n.nivel) n.techoVel = n.nivel;
  return n;
}
function hintMaxDeNivel(nivel, hintElegido){
  return nivel <= HINT_MAX_LEVEL ? limitar(hintElegido || 0, 0, 3) : 0;
}

// Shared optional dual task: a digit appears every interval; press D when it repeats the previous one.
const DUAL_INTERVALO_MS = [0, 3000, 2200, 1600];
function dualSiguienteDigito(rnd, prev){
  if (prev !== null && rnd() < 0.28) return prev;
  let d; do { d = entero(rnd, 1, 9); } while (d === prev);
  return d;
}

function nivelStatement(nivel){
  if (nivel <= 3) return 'Level ' + nivel + ' is below the target: use it to build the method, then move up.';
  if (nivel === 4) return 'Level 4 = a solid, standard candidate. One step below the target.';
  if (nivel === 5) return 'Level 5 = the target for Phase 2: what a well-prepared candidate should master.';
  if (nivel === 6) return 'Level 6 = above the target; a comfortable margin over most candidates.';
  return 'Level ' + nivel + ' is beyond the competition: do not expect a high accuracy here; it trains your ceiling.';
}
function recomendacion(nivel, precision){
  if (precision < 60) return 'Accuracy is low: go down one level and slow down before the next session.';
  if (precision < PRECISION_MINIMA) return 'Accuracy is below ' + PRECISION_MINIMA + ' %: do NOT speed up. Repeat this level at the same pace and aim for accuracy first.';
  if (nivel >= MAX_NIVEL) return 'You hold accuracy at the top level. There is nothing above: repeat to consolidate.';
  return 'Accuracy is at or above ' + PRECISION_MINIMA + ' %: you may try level ' + (nivel + 1) + ' next.';
}

/* ---- 1. Mental arithmetic: 10-level ladder ---- */
// terms = operands in an add/subtract chain (2 to 5); mulA/mulB = multiplication factor ranges;
// divB/divQ = division divisor/quotient ranges; decimals = decimal places in the add/sub chain;
// mixto = probability of a compound "a x b +/- c" item instead of a plain chain/mul/div item;
// itemLimit = seconds allowed per item in "timed item" mode; dual = dual-task load (0-3).
const CALC_NIVELES = [null,
  { name:'Warm-up',     terms:2, add:[1,9],      mulA:[2,5],   mulB:[2,5],   divB:[2,5],   divQ:[2,5],   decimals:0, mixto:0,   itemLimit:12,  dual:0 },
  { name:'Easy',        terms:2, add:[5,20],     mulA:[2,9],   mulB:[2,9],   divB:[2,9],   divQ:[2,9],   decimals:0, mixto:0,   itemLimit:10,  dual:0 },
  { name:'Steady',      terms:2, add:[10,50],    mulA:[2,12],  mulB:[2,9],   divB:[2,9],   divQ:[2,12],  decimals:0, mixto:.15, itemLimit:9,   dual:0 },
  { name:'Standard',    terms:3, add:[20,99],    mulA:[2,12],  mulB:[2,12],  divB:[2,12],  divQ:[2,12],  decimals:0, mixto:.25, itemLimit:8,   dual:0 },
  { name:'Competitive', terms:3, add:[50,200],   mulA:[10,30], mulB:[2,9],   divB:[10,30], divQ:[2,12],  decimals:0, mixto:.35, itemLimit:7,   dual:0 },
  { name:'Hard',        terms:4, add:[100,500],  mulA:[11,25], mulB:[11,19], divB:[11,40], divQ:[3,15],  decimals:0, mixto:.45, itemLimit:6,   dual:0 },
  { name:'Elite',       terms:4, add:[200,999],  mulA:[12,50], mulB:[6,20],  divB:[12,60], divQ:[6,19],  decimals:1, mixto:.55, itemLimit:5,   dual:1 },
  { name:'Extreme',     terms:4, add:[500,2500], mulA:[25,99], mulB:[11,29], divB:[12,99], divQ:[11,29], decimals:1, mixto:.65, itemLimit:4.5, dual:1 },
  { name:'Superhuman',  terms:5, add:[1000,5000],mulA:[30,120],mulB:[12,40], divB:[13,99], divQ:[12,40], decimals:2, mixto:.8,  itemLimit:4,   dual:2 },
  { name:'Impossible',  terms:5, add:[2000,9999],mulA:[40,150],mulB:[15,60], divB:[14,99], divQ:[13,60], decimals:2, mixto:1,   itemLimit:3,   dual:3 }
];
function calcCadena(c, rnd){
  const escala = Math.pow(10, c.decimals);
  const lo = Math.round(c.add[0] * escala), hi = Math.round(c.add[1] * escala);
  let cur = entero(rnd, lo, hi);
  const valores = [cur], ops = [];
  for (let k = 1; k < c.terms; k++){
    const sePuedeRestar = cur > Math.max(1, Math.floor(lo / 3));
    const restar = sePuedeRestar && rnd() < 0.5;
    let operando;
    if (restar){
      const minOp = Math.max(1, Math.floor(lo / 3)), maxOp = Math.min(cur, hi);
      operando = entero(rnd, minOp, Math.max(minOp, maxOp));
      cur -= operando; ops.push('−');
    } else {
      operando = entero(rnd, lo, hi);
      cur += operando; ops.push('+');
    }
    valores.push(operando);
  }
  let texto = fmt(valores[0] / escala, c.decimals);
  for (let k = 0; k < ops.length; k++) texto += ' ' + ops[k] + ' ' + fmt(valores[k + 1] / escala, c.decimals);
  return { terms:c.terms, ops:ops, texto:texto, resultado:cur / escala };
}
function calcGenerar(nivel, rnd, opForzada){
  nivel = limitar(nivel, 1, MAX_NIVEL);
  const c = CALC_NIVELES[nivel];
  const op = opForzada || (rnd() < c.mixto ? 'mixto' : elegir(rnd, ['suma', 'mul', 'div']));
  if (op === 'suma'){
    const ch = calcCadena(c, rnd);
    return { op:'suma', terms:ch.terms, ops:ch.ops, texto:ch.texto, respuesta:ch.resultado, decimales:c.decimals };
  }
  if (op === 'mul'){
    const a = entero(rnd, c.mulA[0], c.mulA[1]), b = entero(rnd, c.mulB[0], c.mulB[1]);
    return { op:'mul', a:a, b:b, texto:a + ' × ' + b, respuesta:a * b, decimales:0 };
  }
  if (op === 'div'){
    const b = entero(rnd, c.divB[0], c.divB[1]), q = entero(rnd, c.divQ[0], c.divQ[1]), a = b * q;
    return { op:'div', a:a, b:b, texto:a + ' ÷ ' + b, respuesta:q, decimales:0 };
  }
  // mixto: a x b, then +/- a smaller third term
  const a = entero(rnd, c.mulA[0], c.mulA[1]), b = entero(rnd, c.mulB[0], c.mulB[1]), base = a * b;
  const cLo = Math.max(1, Math.round(c.add[0] / 5)), cHi = Math.max(cLo + 1, Math.round(c.add[1] / 5));
  const c3 = entero(rnd, cLo, cHi);
  let signo = rnd() < 0.5 ? 1 : -1;
  if (signo < 0 && c3 > base) signo = 1;
  const r = base + signo * c3;
  return { op:'mixto', a:a, b:b, c:c3, signo:signo, texto:a + ' × ' + b + (signo > 0 ? ' + ' : ' − ') + c3, respuesta:r, decimales:0 };
}
function calcParseRespuesta(s){
  const t = String(s).trim().replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}
function calcRespuestaCorrecta(preg, valor){
  if (isNaN(valor)) return false;
  return fmt(valor, preg.decimales) === fmt(preg.respuesta, preg.decimales);
}
function calcManualParams(nivel, hint){
  const n = limitar(nivel, 1, MAX_NIVEL);
  const c = CALC_NIVELES[n];
  return Object.assign({}, c, { nivel:n, etiqueta:String(nivel), hintMax:hintMaxDeNivel(n, hint) });
}
function calcCustomParams(cfg){
  const nivel = limitar(cfg.nivel, 1, MAX_NIVEL);
  const c = CALC_NIVELES[nivel];
  return Object.assign({}, c, { nivel:nivel, etiqueta:'Custom', itemLimit:cfg.itemLimit, items:limitar(cfg.items, 5, 40),
    dual:limitar(cfg.dual, 0, 3), hintMax:hintMaxDeNivel(nivel, cfg.hint) });
}
function calcAdaptiveParams(s, hint){
  const cx = CALC_NIVELES[s.nivel], sp = CALC_NIVELES[adaptivaNivelVelocidad(s)];
  return Object.assign({}, cx, { nivel:s.nivel, etiqueta:'Adaptive', itemLimit:sp.itemLimit, dual:0, hintMax:hintMaxDeNivel(s.nivel, hint) });
}

/* ---- 2. d2-style attention cancellation: 10-level ladder ---- */
const D2_COMBOS = [[0,1],[1,0],[0,2],[2,0],[1,1],[1,2],[2,1],[2,2]]; // [above, below]
function d2EsObjetivo(it){ return it.c === 'd' && (it.arriba + it.abajo) === 2; }
// "Near" distractors are the classic d2 lookalikes: a d with 1 or 3 total dashes (right letter,
// wrong count) and a p with exactly 2 dashes (right count, wrong letter). "Far" distractors are
// everything else (0 or 4 dashes, or a p with 0, 1, 3 or 4 dashes).
function d2Pools(){
  const near = [], far = [];
  D2_COMBOS.forEach(function(x){ const s = x[0] + x[1]; if (s === 2) return; const it = { c:'d', arriba:x[0], abajo:x[1] }; (s === 1 || s === 3 ? near : far).push(it); });
  D2_COMBOS.forEach(function(x){ const s = x[0] + x[1]; const it = { c:'p', arriba:x[0], abajo:x[1] }; (s === 2 ? near : far).push(it); });
  return { near:near, far:far };
}
const D2_POOLS = d2Pools();
const D2_NIVELES = [null,
  { name:'Warm-up',     rows:10, len:36, sec:26, pObj:.35, near:0,   dual:0 },
  { name:'Easy',        rows:12, len:40, sec:24, pObj:.33, near:.15, dual:0 },
  { name:'Steady',      rows:14, len:44, sec:22, pObj:.32, near:.30, dual:0 },
  { name:'Standard',    rows:14, len:47, sec:20, pObj:.30, near:.45, dual:0 },
  { name:'Competitive', rows:16, len:50, sec:18, pObj:.30, near:.55, dual:0 },
  { name:'Hard',        rows:16, len:54, sec:16, pObj:.28, near:.65, dual:0 },
  { name:'Elite',       rows:18, len:58, sec:14, pObj:.28, near:.75, dual:1 },
  { name:'Extreme',     rows:18, len:62, sec:12, pObj:.26, near:.85, dual:1 },
  { name:'Superhuman',  rows:20, len:66, sec:10, pObj:.25, near:.93, dual:2 },
  { name:'Impossible',  rows:20, len:70, sec:8,  pObj:.25, near:1,   dual:3 }
];
function d2GenerarFila(rnd, n, pObj, near){
  n = n || D2_NIVELES[4].len; pObj = pObj === undefined ? 0.3 : pObj; near = near === undefined ? 0.5 : near;
  const objCombos = D2_COMBOS.filter(function(x){ return x[0] + x[1] === 2; });
  let fila, cuenta, intentos = 0;
  do {
    fila = []; cuenta = 0;
    for (let i = 0; i < n; i++){
      if (rnd() < pObj){ const x = elegir(rnd, objCombos); fila.push({ c:'d', arriba:x[0], abajo:x[1] }); cuenta++; }
      else { const pool = rnd() < near ? D2_POOLS.near : D2_POOLS.far; const o = elegir(rnd, pool); fila.push({ c:o.c, arriba:o.arriba, abajo:o.abajo }); }
    }
    intentos++;
  } while (cuenta < Math.floor(n * 0.15) && intentos < 50);
  return fila;
}
function d2PuntuarFila(fila, marcas, procesados){
  let aciertos = 0, comisiones = 0, omisiones = 0;
  for (let i = 0; i < procesados && i < fila.length; i++){
    const obj = d2EsObjetivo(fila[i]), m = !!marcas[i];
    if (obj && m) aciertos++;

  t.concentracion = t.aciertos - t.comisiones;
  const den = t.aciertos + t.comisiones + t.omisiones;
  t.precision = den === 0 ? 0 : t.aciertos / den * 100;

// Balanced sequence: half facing you, half back turned; half left, half right. rotSpec is either
// an array of allowed rotation angles (degrees, applied to the whole figure on screen) or 'free'
// for a random angle every 15 degrees: rotating the picture does not change which is the figure's
// own left/right hand, but it forces a real mental-rotation step before the reversal rule can be applied.
function lrSecuencia(n, rnd, rotSpec){
  rotSpec = rotSpec || [0];
  const base = [['frente','izquierda'],['frente','derecha'],['espalda','izquierda'],['espalda','derecha']];
  let lista = [];
  for (let i = 0; i < n; i++) lista.push(base[i % 4]);
  lista = barajar(rnd, lista);
  return lista.map(function(p){
    const rot = rotSpec === 'free' ? Math.floor(rnd() * 24) * 15 : elegir(rnd, rotSpec);
    return { mira:p[0], lado:p[1], tipo: rnd() < 0.7 ? 'mano' : 'punto', ladoPantalla: lrLadoPantalla(p[0], p[1]), rot:rot };
  });

  const spi = n ? ms / n / 1000 : null;
  const precision = n ? ok / n * 100 : 0;
  return { n:n, aciertos:ok, fallos:n - ok, spi:spi, precision:precision,

const NB_LETRAS = ['C','H','K','L','Q','R','S','W'];
const NB_NIVELES = [null,

function nbCanal(rnd, n, len, pMatch, opciones){
  const v = [];
  for (let i = 0; i < len; i++){
    if (i >= n && rnd() < pMatch) v.push(v[i - n]);
    else { let x; do { x = elegir(rnd, opciones); } while (i >= n && x === v[i - n]); v.push(x); }
  }
  return v;
}
function nbObjetivos(arr, n){
  return arr.map(function(x, i){ return i >= n && x === arr[i - n]; });
}
function nbGenerar(n, rnd, pMatch, len){
  pMatch = pMatch === undefined ? 0.3 : pMatch;
  len = len || (20 + n);
  let pos, let_, intentos = 0;
  const cuenta = function(a){ return nbObjetivos(a, n).filter(Boolean).length; };
  do {
    pos = nbCanal(rnd, n, len, pMatch, [0,1,2,3,4,5,6,7,8]);
    let_ = nbCanal(rnd, n, len, pMatch, NB_LETRAS);
    intentos++;
  } while ((cuenta(pos) < 3 || cuenta(let_) < 3) && intentos < 100);
  return { n:n, len:len, pos:pos, let:let_ };
}
function nbPuntuarCanal(arr, n, pulsadas){
  const obj = nbObjetivos(arr, n);
  let aciertos = 0, falsas = 0, omisiones = 0, rechazos = 0;
  for (let i = 0; i < arr.length; i++){
    const p = !!pulsadas[i];
    if (obj[i] && p) aciertos++;
    else if (!obj[i] && p) falsas++;
    else if (obj[i] && !p) omisiones++;
    else rechazos++;
  }
  return { aciertos:aciertos, falsas:falsas, omisiones:omisiones, rechazos:rechazos, objetivos: obj.filter(Boolean).length };
}
function nbPuntuar(seq, n, pulsaciones){
  const p = nbPuntuarCanal(seq.pos, n, pulsaciones.pos);
  const l = nbPuntuarCanal(seq.let, n, pulsaciones.let);
  const t = { pos:p, let:l,
    aciertos: p.aciertos + l.aciertos, falsas: p.falsas + l.falsas, omisiones: p.omisiones + l.omisiones,
    rechazos: p.rechazos + l.rechazos };
  const decisiones = t.aciertos + t.falsas + t.omisiones + t.rechazos;
  t.precision = decisiones ? (t.aciertos + t.rechazos) / decisiones * 100 : 0;

}

/* ---- Goal, anti-speed-up rule, records, CSV (shared) ---- */
// Returns true / false, or null if the goal text cannot be interpreted.
// Recognised patterns: "96 %" (accuracy), "2.0 s" / "2,0 seconds" (seconds per item), "30 correct" / "30 hits" (correct answers).
function evaluarObjetivo(texto, r){
  const t = String(texto || '').replace(/\s+/g, ' ');
  const num = function(x){ return parseFloat(x.replace(',', '.')); };
  let res = null;
  const mp = t.match(/(\d+(?:[.,]\d+)?)\s*%/);
  if (mp) res = r.precision >= num(mp[1]);
  const ms = t.match(/(\d+(?:[.,]\d+)?)\s*(?:seconds|second|secs|sec|s)(?![a-z])/i);
  if (ms && r.spi !== null && r.spi !== undefined){ const ok = r.spi <= num(ms[1]); res = res === null ? ok : (res && ok); }
  const ma = t.match(/(\d+)\s*(?:correct|hits)/i);
  if (ma){ const ok = r.aciertos >= parseInt(ma[1], 10); res = res === null ? ok : (res && ok); }
  // d2: "concentration over 40" / "concentration 40"
  const mc = t.match(/concentration\D{0,14}?(\d+)/i);
  if (mc && r.concentracion !== undefined && r.concentracion !== null){ const ok = r.concentracion >= parseInt(mc[1], 10); res = res === null ? ok : (res && ok); }
  return res;
}
// A record requires a manual session with no hints used (so speed/accuracy are not inflated by help).
function esRecord(previas, nueva){
  if (!nueva.valida || nueva.modo !== 'manual' || nueva.ayudados > 0) return false;
  const comp = previas.filter(function(s){ return s.modulo === nueva.modulo && s.clave === nueva.clave && s.nivel === nueva.nivel && s.valida && s.modo === 'manual' && !s.ayudados; });
  if (!comp.length) return false;
  const vals = comp.map(function(s){ return s.puntos; });
  return nueva.mayorEsMejor ? nueva.puntos > Math.max.apply(null, vals) : nueva.puntos < Math.min.apply(null, vals);
}
function mejorPersonal(sesiones, modulo, clave, nivel, mayorEsMejor){
  let best = null;
  sesiones.forEach(function(s){
    if (s.modulo !== modulo || s.clave !== clave || s.nivel !== nivel || !s.valida || s.modo !== 'manual' || s.ayudados) return;
    if (!best || (mayorEsMejor ? s.puntos > best.puntos : s.puntos < best.puntos)) best = s;
  });
  return best;
}
function rachaModulo(sesiones, modulo){
  const ses = sesiones.filter(function(s){ return s.modulo === modulo; });
  let n = 0;
  for (let i = ses.length - 1; i >= 0; i--){ if (ses[i].cumplido === true) n++; else break; }
  return n;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
// Date format dd/mm/yyyy hh:mm (kept unambiguous; the exam and the rest of the material use the Spanish order)
function fechaES(iso){
  const d = new Date(iso);
  return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function csvCampo(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
// Column order is the one fixed by the task card: Level is the third column.
function aCSV(sesiones){
  const cab = ['Date','Module','Level','Correct','Wrong','Blank','Seconds per item','Accuracy %','Goal','Met'];
  const filas = sesiones.map(function(s){
    return [fechaES(s.ts), s.modulo, s.etiquetaNivel || '', s.aciertos, s.fallos, s.blanco,
      (s.spi === null || s.spi === undefined) ? '' : fmt(s.spi, 2), fmt(s.precision, 1), s.objetivo,
      s.cumplido === true ? 'Yes' : (s.cumplido === false ? 'No' : '')].map(csvCampo).join(';');
  });
  return '﻿' + [cab.join(';')].concat(filas).join('\r\n') + '\r\n';
}
// ---- Endurance ("thirds", wave 5 U1): identical copy in every ATC game; see coord/SCHEMA-thirds.md ----
// results = [{ok, blank, sec, t}] (optional n/c/b give weighted counts, e.g. one d2 row or one n-back stimulus).
// durationSec > 0: time thirds (group = min(2, floor(t*3/duration))); otherwise index thirds (min(2, floor(i*3/N))).
// Fewer than 9 results: null. Returns [{n,c,b,s} x3]; wrong = n - c - b.
function atcThirds(results, durationSec){
  const N = results ? results.length : 0;
  if (N < 9) return null;
  const th = [{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0}];
  results.forEach(function(r, i){
    const g = durationSec > 0 ? Math.max(0, Math.min(2, Math.floor((r.t || 0) * 3 / durationSec))) : Math.min(2, Math.floor(i * 3 / N));
    th[g].n += r.n === undefined ? 1 : r.n;
    th[g].c += r.c === undefined ? (r.ok ? 1 : 0) : r.c;
    th[g].b += r.b === undefined ? (r.blank ? 1 : 0) : r.b;
    th[g].s += r.sec || 0;
  });
  th.forEach(function(x){ x.s = Math.round(x.s * 100) / 100; });
  return th;
}
// One result-screen line: accuracy per third and the fade (third 3 minus third 1); fade only when both thirds have n >= 8.
function atcThirdsLine(th){
  if (!th || th.length !== 3) return '';
  const acc = function(x){ return x.n > 0 ? x.c / x.n * 100 : null; };
  const a = th.map(acc);
  const txt = a.map(function(v){ return v === null ? '—' : String(Math.round(v)); }).join(' / ');
  let fade = ' (too few items per third for a fade estimate)';
  if (th[0].n >= 8 && th[2].n >= 8){
    const f = Math.round(a[2]) - Math.round(a[0]);
    fade = ' → fade ' + (f > 0 ? '+' : (f < 0 ? '−' : '')) + Math.abs(f) + ' pts';
  }
  return 'Accuracy by thirds: ' + txt + ' %' + fade;
}

const MODULOS_ANTIGUOS = { 'Cálculo mental':'Mental arithmetic', 'Cancelación de atención':'Attention cancellation', 'Izquierda/derecha':'Left/right' };
const CLAVE_ALMACEN = 'atc_entrenador_v1';

function cargar(){
  if (memoria) return memoria;
  let d = null;
  try {
    const r = localStorage.getItem(CLAVE_ALMACEN);
    if (r){ d = JSON.parse(r); }
  } catch (e) { almacenOk = false; }
  if (!d || typeof d !== 'object' || !Array.isArray(d.sesiones)) d = { sesiones:[], ultimo:{} };
  if (!d.ultimo || typeof d.ultimo !== 'object') d.ultimo = {};
  d.sesiones = d.sesiones.filter(function(s){ return s && typeof s === 'object' && !isNaN(new Date(s.ts).getTime()); });
  // Migrate the old single-integer level memory (calc/nback only) into the new per-module "last used" config.
  if (d.niveles){
    if (d.niveles.calc && !d.ultimo.calc) d.ultimo.calc = { modo:'manual', nivel:d.niveles.calc };
    if (d.niveles.nback && !d.ultimo.nback) d.ultimo.nback = { modo:'manual', nivel:d.niveles.nback };
  }
  d.sesiones.forEach(function(s){
    if (MODULOS_ANTIGUOS[s.modulo]) s.modulo = MODULOS_ANTIGUOS[s.modulo];

    if (s.modo === undefined) s.modo = s.nivel === null ? 'manual' : s.modo;

// Saved per-module config (d.ultimo.<mod>) may come from an older version or be partial/corrupt: always merge it onto the defaults.
function mezcla(def, u){
  const o = JSON.parse(JSON.stringify(def));
  if (u && typeof u === 'object' && !Array.isArray(u)) Object.keys(u).forEach(function(k){
    if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) o[k] = mezcla(o[k], u[k]);
    else if (u[k] !== undefined && u[k] !== null) o[k] = u[k];

}

function pedirSalida(){

/* ---------- Shared dual task (calc, d2, left/right) ---------- */
let dualState = null;
function dualIniciar(rnd, nivelDual){
  dualDetener(); dualUltimo = null;
  if (!nivelDual) return;
  dualState = { prev:null, cur:null, objetivo:false, respondido:false, rnd:rnd, hits:0, misses:0, falsos:0 };
  const tick = function(){
    if (!dualState) return;
    if (dualState.objetivo && !dualState.respondido) dualState.misses += 1;
    const dg = dualSiguienteDigito(dualState.rnd, dualState.cur);
    dualState.objetivo = dualState.cur !== null && dg === dualState.cur;
    dualState.respondido = false; dualState.prev = dualState.cur; dualState.cur = dg;
    dualState.total += 1; if (dualState.objetivo) dualState.repeticiones += 1;
    const el = $('dualdig'); if (el) { el.textContent = ''; tempo(setTimeout(function(){ const e2 = $('dualdig'); if (e2) e2.textContent = dg; }, 150)); } /* blank for 150 ms so that a repeated digit is still visible as a new flash */
  };
  dualState.total = 0; dualState.repeticiones = 0;
  tick();
  dualState.timer = setInterval(tick, DUAL_INTERVALO_MS[nivelDual]);
  tempo(dualState.timer);
}
let dualUltimo = null;   // summary of the last finished dual task, shown on the result screen
function dualDetener(){
  if (dualState){
    if (dualState.timer) clearInterval(dualState.timer);
    const misses = dualState.misses + (dualState.objetivo && !dualState.respondido ? 1 : 0);
    dualUltimo = { hits:dualState.hits, misses:misses, falsos:dualState.falsos, repeticiones:dualState.repeticiones, total:dualState.total };
  }
  dualState = null;
}
function endDual(){ dualDetener(); }
function dualPulsar(){
  if (!dualState) return;
  const caja = $('dualbox');
  const flash = function(col){ if (caja){ caja.style.borderColor = col; tempo(setTimeout(function(){ caja.style.borderColor = ''; }, 250)); } };
  if (dualState.respondido) return;
  dualState.respondido = true;
  if (dualState.objetivo){ dualState.hits++; flash('#7bd88f'); }
  else { dualState.falsos++; flash('#ff8a80'); }
}

function calcHintTexts(preg){
  if (preg.op === 'suma'){
    return [
      'Work through the chain in order; round the next term to the nearest ten if that helps, then correct by the small remainder.',
      'Keep a running total after each + or −, left to right. Do not try to add everything at once.',
      'Full working: ' + preg.texto + ' = ' + fmt(preg.respuesta, preg.decimales) + '.'
    ];
  }
  if (preg.op === 'mul'){
    // Split whichever factor is 10 or more into tens and units. If both are single digits there is nothing to split:
    // give times-table tricks instead (splitting 5 into "0 + 5" is not a hint).
    const big = preg.b >= 10 ? preg.b : (preg.a >= 10 ? preg.a : 0), other = big === preg.b ? preg.a : preg.b;
    if (!big){
      return [
        'Single-digit product: use the times table, or a neighbour you know (×5 is half of ×10, ×9 is ×10 minus one lot).',
        'Rewrite it from a fact you know: for example ' + preg.a + ' × ' + preg.b + ' = ' + preg.a + ' × ' + (preg.b - 1) + ' + ' + preg.a + '.',
        'Full working: ' + preg.a + ' × ' + preg.b + ' = ' + preg.respuesta + '.'
      ];
    }
    const t0 = Math.floor(big / 10) * 10, u0 = big - t0;
    if (u0 === 0){
      return [
        'The factor ' + big + ' is a round ten: multiply by ' + (big / 10) + ' first, then by 10.',
        preg.a + ' × ' + preg.b + ' = ' + other + ' × ' + (big / 10) + ' × 10.',
        'Full working: ' + other + ' × ' + (big / 10) + ' = ' + (other * big / 10) + '; times 10 = ' + preg.respuesta + '.'
      ];
    }
    return [
      'Split the larger factor (' + big + ') into tens and units.',
      preg.a + ' × ' + preg.b + ' = ' + other + ' × ' + t0 + ' + ' + other + ' × ' + u0 + '.',
      'Full working: ' + other + ' × ' + t0 + ' = ' + (other * t0) + '; ' + other + ' × ' + u0 + ' = ' + (other * u0) + '; total ' + preg.respuesta + '.'
    ];
  }
  if (preg.op === 'div'){
    return [
      'Think in easy multiples of the divisor (×10, ×5, ×2) and subtract them from the dividend.',
      'Subtract multiples of ' + preg.b + ' from ' + preg.a + ' until 0 remains; add up how many times you subtracted.',
      'Full working: ' + preg.a + ' ÷ ' + preg.b + ' = ' + preg.respuesta + ' (because ' + preg.b + ' × ' + preg.respuesta + ' = ' + preg.a + ').'
    ];
  }
  return [
    'Do the multiplication first, then apply the + or − at the end.',
    preg.a + ' × ' + preg.b + ' = ' + (preg.a * preg.b) + ', then ' + (preg.signo > 0 ? '+ ' : '− ') + preg.c + '.',
    'Full working: ' + preg.texto + ' = ' + preg.respuesta + '.'
  ];
}
// Shared: level to start the next adaptive session at. Modules that adapt inside the session (calc, d2, lr) keep the level
// reached (it already rose/fell during play); n-back cannot change n mid-stream, so it moves between sessions.
function inicioAdaptativo(nivel, precision, sube){
  if (precision < 60) return Math.max(1, nivel - 1);
  if (sube && precision >= PRECISION_MINIMA) return Math.min(MAX_NIVEL, nivel + 1);
  return Math.max(1, nivel);
}
function iniciarCalc(cfg){
  limpiar(); iniciarSesionUI();
  const d = cargar();
  const practice = !!cfg.practice;
  let params, adapt = null, adaptInicio = 0, submodo = cfg.submodo || 'n20', items = 20;
  if (practice){ params = calcManualParams(1, 0); submodo = 'n20'; items = 3; }
  else if (cfg.modo === 'manual'){ params = calcManualParams(cfg.nivel, cfg.hint); }
  else if (cfg.modo === 'custom'){ params = calcCustomParams(cfg.custom); submodo = 'titem'; items = params.items; }
  else { adaptInicio = d.ultimo.calcAdaptStart || 2; adapt = adaptivaIniciar(adaptInicio); params = calcAdaptiveParams(adapt, cfg.hint); submodo = 'titem'; items = 20; }
  const modo = practice ? 'manual' : cfg.modo;
  let ac = 0, fa = 0, bl = 0, ayudados = 0, preg = null, t0 = 0, fin = false, curHint = 0, idx = 0;
  const tiempos = [], resT = [];
  const inicio = performance.now();
  // A limit of 0 (Custom slider) means "no time limit": never time out.
  const conLimite = function(){ return submodo === 'titem' && params.itemLimit > 0; };
  function etiquetaNivel(){ return modo === 'manual' ? String(practice ? 1 : cfg.nivel) : (modo === 'custom' ? 'Custom ' + params.nivel : 'Adaptive'); }
  function nivelActual(){ return modo === 'adaptive' ? adapt.nivel : params.nivel; }
  pantalla(
    dualBoxHtml(params.dual) +
    '<div class="panel">' + (practice ? '<div class="aviso-caja"><b>Practice</b>: 3 easy items, nothing is saved. Type the answer, press Enter.</div>' : '') +
    '<div class="cabecera"><span>' + (submodo === 't60' ? 'Time: <b id="crono">60.0</b> s' : 'Question <b id="prog">1</b> / ' + items) +
    (conLimite() ? ' · item <b id="itl">' + fmt(params.itemLimit, 1) + '</b> s' : '') +
    '</span><span>Level <b id="niv">' + nivelActual() + '</b></span><span>Correct <b id="ac">0</b></span><span>Wrong <b id="fa">0</b></span></div>' +
    '<div class="barra" id="barra"><div id="bar"></div></div>' +
    '<div class="pregunta" id="q"></div>' +
    '<input class="entrada" id="resp" type="text" inputmode="decimal" autocomplete="off" aria-label="Answer">' +
    '<div class="retro" id="retro" aria-live="polite"></div>' +
    (params.hintMax ? '<p class="fila" style="justify-content:center"><button class="btn" id="hintbtn">Hint (H)</button></p><div id="hinttext"></div>' : '') +
    '<p class="suave peq" style="text-align:center">Enter to answer' + (params.hintMax ? ' · H for a hint' : '') + (params.dual ? ' · D for the side task' : '') + ' · Esc twice quits without saving</p></div>'
  );
  const inp = $('resp');
  inp.addEventListener('input', function(){ const c = inp.value.replace(/[^0-9.,\-]/g, ''); if (c !== inp.value) inp.value = c; });
  function pintar(){
    $('niv').textContent = nivelActual(); $('ac').textContent = ac; $('fa').textContent = fa + bl;
    if (submodo !== 't60'){ $('prog').textContent = Math.min(items, idx + 1); $('bar').style.width = (idx / items * 100) + '%'; }
  }
  function nueva(){
    if (modo === 'adaptive') params = calcAdaptiveParams(adapt, cfg.hint);
    preg = calcGenerar(nivelActual(), Math.random);
    curHint = 0; if ($('hinttext')) $('hinttext').innerHTML = '';
    if ($('hintbtn')) $('hintbtn').disabled = false;
    $('q').textContent = preg.texto + ' = ?';
    inp.value = ''; inp.focus(); t0 = performance.now(); pintar();
    if (conLimite() && $('itl')) $('itl').textContent = fmt(params.itemLimit, 1);
  }
  function acabar(){
    if (fin) return; fin = true; dualDetener();
    const n = tiempos.length;
    const spi = n ? tiempos.reduce(function(s, x){ return s + x; }, 0) / n / 1000 : null;
    const nivelFinal = nivelActual();
    const total = ac + fa + bl + ayudados;
    const rec = {
      id:'calc', clave:'calc-' + (modo === 'manual' ? submodo : modo), modo:modo, nivel:nivelFinal, etiquetaNivel:etiquetaNivel(), practice:practice,
      params:'Mode ' + modo + ' (' + ({ t60:'60 seconds', n20:'20 questions, untimed', titem:items + ' questions, timed item' }[submodo]) + ')' + (modo === 'adaptive' ? ' · started at level ' + adaptInicio : ''),
      aciertos:ac, fallos:fa + ayudados, blanco:bl, ayudados:ayudados, spi:spi, precision: total ? ac / total * 100 : 0,
      objetivo:cfg.goal, puntos:ac, mayorEsMejor:true, thirds:atcThirds(resT, submodo === 't60' ? 60 : 0)
    };
    if (modo === 'adaptive' && total) d.ultimo.calcAdaptStart = inicioAdaptativo(adapt.nivel, rec.precision, false);
    mostrarResultado(rec, '', function(){ iniciarCalc(cfg); }, configCalc);
  }
  function fin1(){   // called after every item: decide whether the session is over
    if (submodo === 't60'){ if (performance.now() - inicio >= 60000){ pintar(); acabar(); return; } }
    else if (idx >= items){ pintar(); acabar(); return; }
    nueva();
  }
  function responder(valor){
    if (fin) return;
    const ms = performance.now() - t0;
    const ok = calcRespuestaCorrecta(preg, valor);
    tiempos.push(ms);
    resT.push({ ok: ok && curHint === 0, blank:false, sec:ms / 1000, t:(performance.now() - inicio) / 1000 });
    if (curHint > 0) ayudados++;
    else if (ok) ac++; else fa++;
    if (modo === 'adaptive') adapt = adaptivaPaso(adapt, ok && curHint === 0);
    const retro = $('retro');
    if (curHint > 0) retro.innerHTML = '<span class="aviso">Hint used, counts as wrong · ' + esc(preg.texto) + ' = ' + fmt(preg.respuesta, preg.decimales) + '</span>';
    else if (ok) retro.innerHTML = '<span class="bien">✓ Correct · ' + fmt(ms / 1000, 2) + ' s</span>';
    else retro.innerHTML = '<span class="mal">✗ Wrong · ' + esc(preg.texto) + ' = ' + fmt(preg.respuesta, preg.decimales) + '</span>';
    idx++;
    fin1();
  }
  function enviar(){
    if (fin) return;
    const v = calcParseRespuesta(inp.value);
    if (isNaN(v)){
      $('retro').innerHTML = '<span class="aviso">Type a number first (digits, one decimal point, optional minus), then Enter.</span>';
      inp.classList.remove('sacude'); void inp.offsetWidth; inp.classList.add('sacude');

    responder(v);
  }
  function darPista(){
    if (fin || !params.hintMax || curHint >= params.hintMax) return;
    curHint += 1;
    const textos = calcHintTexts(preg);
    const nombres = ['', 'Hint 1 (nudge)', 'Hint 2 (method)', 'Hint 3 (full worked solution)'];
    $('hinttext').innerHTML = '<div class="aviso-caja"><b>' + nombres[curHint] + '.</b> ' + esc(textos[curHint - 1]) + '</div>';
    if (curHint >= params.hintMax) $('hintbtn').disabled = true;
    inp.focus();
  }
  onKey = function(e){
    if (e.key === 'Enter'){ e.preventDefault(); enviar(); }
    else if ((e.key === 'h' || e.key === 'H') && params.hintMax){ e.preventDefault(); darPista(); }
    else if (e.key === 'd' || e.key === 'D'){ e.preventDefault(); dualPulsar(); }   // never let the letter reach the answer field
  };

  if (submodo === 't60'){
    tempo(setInterval(function(){

      $('bar').style.width = ((60 - rest) / 60 * 100) + '%';
    }, 100));
  } else if (conLimite()){
    tempo(setInterval(function(){
      if (fin || !preg) return;
      const el = $('itl'); if (!el) return;
      const rest = params.itemLimit - (performance.now() - t0) / 1000;
      el.textContent = fmt(Math.max(0, rest), 1);
      if (rest <= 0){
        tiempos.push(params.itemLimit * 1000); bl++; idx++;

  }
  dualIniciar(Math.random, practice ? 0 : params.dual);
  nueva();

function lrHintTexts(it){

function iniciarLR(cfg){

  const modo = practice ? 'manual' : cfg.modo;

  else if (cfg.modo === 'manual') params = lrManualParams(cfg.nivel, cfg.hint);
  else if (cfg.modo === 'custom') params = lrCustomParams(cfg.custom);
  else { adapt = adaptivaIniciar(d.ultimo.lrAdaptStart || 2); params = lrAdaptiveParams(adapt, cfg.hint); }
  const N = practice ? 3 : (modo === 'manual' ? params.n : (modo === 'custom' ? params.n : 20));
  let seq = lrSecuencia(N, Math.random, params.rot);
  const resps = [];
  let i = 0, t0 = 0, fin = false, curHint = 0, hidden = false;
  pantalla(
    dualBoxHtml(params.dual) +
    '<div class="panel">' + (practice ? '<div class="aviso-caja"><b>Practice</b>: 3 items, nothing is saved. Facing you = reversed, back turned = same side as you see it.</div>' : '') +
    '<div class="cabecera"><span>Item <b id="n">1</b> / ' + N + '</span><span>Level <b>' + params.nivel + '</b></span><span>Average <b id="med">—</b> s</span><span>Accuracy <b id="pre">—</b></span>' +
    (params.itemLimit ? '<span>Time <b id="tm">' + fmt(params.itemLimit, 1) + '</b> s</span>' : '') + '</div>' +
    '<div class="barra" id="barra"><div id="bar"></div></div><p class="suave" style="text-align:center;margin:.2rem 0">Is the orange object on the left or on the right <b>OF THE FIGURE</b>? &nbsp;<span class="tecla">←</span> <span class="tecla">→</span></p>' +
    '<div class="figbox" id="figbox"><div id="fig"></div></div><div class="retro" id="retro" aria-live="polite"></div>' +
    (params.hintMax ? '<p class="fila" style="justify-content:center"><button class="btn" id="hintbtn">Hint (H)</button></p><div id="hinttext"></div>' : '') +
    '<p class="fila" style="justify-content:center"><button class="btn" id="bi">← Left</button><button class="btn" id="bd">Right →</button></p></div>'
  );
  function mostrar(){
    if (modo === 'adaptive'){ params = lrAdaptiveParams(adapt, cfg.hint); }

    const ov = $('figbox').querySelector('.oculto-fig'); if (ov) ov.remove();

    if ($('hinttext')) $('hinttext').innerHTML = '';

    if ($('tm')) $('tm').textContent = fmt(params.itemLimit, 1);
  }
  function darPista(){
    if (fin || !params.hintMax || curHint >= params.hintMax) return;
    curHint += 1;
    const textos = lrHintTexts(seq[i]);
    const nombres = ['', 'Hint 1 (nudge)', 'Hint 2 (method)', 'Hint 3 (full solution)'];
    $('hinttext').innerHTML = '<div class="aviso-caja"><b>' + nombres[curHint] + '.</b> ' + esc(textos[curHint - 1]) + '</div>';
    if (curHint >= params.hintMax) $('hintbtn').disabled = true;
  }
  function responder(lado, timeout){
    if (fin) return;
    const ms = timeout ? params.itemLimit * 1000 : performance.now() - t0;
    const it = seq[i], ok = !timeout && lado === it.lado && curHint === 0;
    resps.push({ ok:ok, ms:ms, mira:it.mira, ayudado:curHint > 0, blanco:!!timeout });
    if (modo === 'adaptive') adapt = adaptivaPaso(adapt, ok);
    const r = lrResumen(resps.filter(function(x){ return !x.ayudado; }));
    $('med').textContent = fmt(r.spi, 2); $('pre').textContent = fmt(resps.filter(function(x){ return x.ok; }).length / resps.length * 100, 0) + ' %';
    if (timeout) $('retro').innerHTML = '<span class="mal">Time is up · it was ' + LADO_TXT[it.lado] + '</span>';
    else if (curHint > 0) $('retro').innerHTML = '<span class="aviso">Hint used · counts as wrong</span>';
    else $('retro').innerHTML = ok ? '<span class="bien">✓ ' + fmt(ms / 1000, 2) + ' s</span>' : '<span class="mal">✗ it was ' + LADO_TXT[it.lado] + '</span> <span class="suave">' + fmt(ms / 1000, 2) + ' s</span>';
    i++;

  }
  function acabar(){
    fin = true; dualDetener();
    const clean = resps.filter(function(x){ return !x.ayudado; });
    const r = lrResumen(clean);
    const ayudados = resps.length - clean.length;
    const por = function(m){ const a = clean.filter(function(x){ return x.mira === m; }); return a.length ? lrResumen(a) : null; };
    const f = por('frente'), e = por('espalda');
    const extra = '<div class="' + (r.cumple ? 'bien-caja' : 'aviso-caja') + '"><b>Baseline (' + fmt(LR_OBJ_SEG, 1) + ' s with ≥' + LR_OBJ_PREC + ' %):</b> ' +
      (r.cumple ? 'reached.' : (r.precision < LR_OBJ_PREC ? 'first recover accuracy; speed comes afterwards.' : 'accuracy is sufficient, you are ' + fmt(r.spi - LR_OBJ_SEG, 2) + ' s per item short.')) + '</div>' +
      '<p>Facing you (reverse): ' + (f ? fmt(f.spi, 2) + ' s · ' + fmt(f.precision, 0) + ' %' : '—') +
      '<br>Back turned (coincides): ' + (e ? fmt(e.spi, 2) + ' s · ' + fmt(e.precision, 0) + ' %' : '—') + '</p>' + REGLA_LR;
    const nivelFinal = modo === 'adaptive' ? adapt.nivel : params.nivel;
    const blancos = resps.filter(function(x){ return x.blanco; }).length;
    const aciertosTot = resps.filter(function(x){ return x.ok; }).length;
    // Accuracy counts every item shown (hinted and timed-out ones are wrong); seconds/item uses only unassisted answers.
    const precisionTot = resps.length ? aciertosTot / resps.length * 100 : 0;
    const rec = { id:'lr', clave:'lr', modo:modo, nivel:nivelFinal, practice:practice,
      etiquetaNivel: modo === 'manual' ? String(practice ? 1 : cfg.nivel) : (modo === 'custom' ? 'Custom ' + params.nivel : 'Adaptive'),
      params:resps.length + ' items · baseline ' + fmt(LR_OBJ_SEG, 1) + ' s with ≥' + LR_OBJ_PREC + ' %',
      aciertos:aciertosTot, fallos:resps.length - aciertosTot - blancos, blanco:blancos, ayudados:ayudados, spi:r.spi, precision:precisionTot,
      objetivo:cfg.goal, puntos:Math.round((r.spi || 0) * 100) / 100, mayorEsMejor:false, extra:extra,
      thirds:atcThirds(resps.map(function(x){ return { ok:x.ok, blank:x.blanco, sec:x.ms / 1000 }; }), 0) };
    if (modo === 'adaptive' && resps.length) d.ultimo.lrAdaptStart = inicioAdaptativo(adapt.nivel, rec.precision, false);
    mostrarResultado(rec, extra, function(){ iniciarLR(cfg); }, configLR);
  }
  onKey = function(e){
    if (e.repeat){ e.preventDefault(); return; }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); responder('izquierda'); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); responder('derecha'); }
    else if ((e.key === 'h' || e.key === 'H') && params.hintMax){ e.preventDefault(); darPista(); }
    else if (e.key === 'd' || e.key === 'D'){ e.preventDefault(); dualPulsar(); }
  };
  $('bi').addEventListener('click', function(){ responder('izquierda'); this.blur(); });
  $('bd').addEventListener('click', function(){ responder('derecha'); this.blur(); });
  if ($('hintbtn')) $('hintbtn').addEventListener('click', darPista);
  tempo(setInterval(function(){
    if (fin) return;
    const el = $('tm');
    const elapsed = (performance.now() - t0) / 1000;
    if (params.exposure && elapsed >= params.exposure && !hidden){
      hidden = true;
      $('figbox').insertAdjacentHTML('beforeend', '<div class="oculto-fig">Figure hidden after ' + fmt(params.exposure, 1) + ' s: answer from memory.</div>');
    }
    if (params.itemLimit){
      const rest = params.itemLimit - elapsed;
      if (el) el.textContent = fmt(Math.max(0, rest), 1);
      if (rest <= 0){ responder(null, true); return; }
    }
  }, 100));
  dualIniciar(Math.random, params.dual);
  mostrar();
}

function iniciarNback(cfg){
  limpiar(); iniciarSesionUI();
  const d = cargar();
  const practice = !!cfg.practice;
  let params, adapt = null;
  const modo = practice ? 'manual' : cfg.modo;
  if (practice) params = Object.assign(nbManualParams(1, 0), { interval:3000 });
  else if (cfg.modo === 'manual') params = nbManualParams(cfg.nivel, cfg.hint);
  else if (cfg.modo === 'custom') params = nbCustomParams(cfg.custom);
  else { adapt = adaptivaIniciar(d.ultimo.nbAdaptStart || 2); params = nbAdaptiveParams(adapt, cfg.hint); }
  const n = params.n, intervalo = params.interval, voz = cfg.voz === 'voz';
  const seq = practice ? nbGenerar(n, Math.random, 0.3, 10) : nbGenerar(n, Math.random);
  dualIniciar(Math.random, 0);   // no side task here; this also clears the summary of an aborted earlier session
  const puls = { pos:[], let:[] };
  const obj = { pos:nbObjetivos(seq.pos, n), let:nbObjetivos(seq.let, n) };
  let i = -1, fin = false;
  const tips = !practice && cfg.hint > 0 && params.hintMax ? '<details class="aviso-caja" open><summary>Strategy tips (hint level ' + cfg.hint + ')</summary>' + NB_TIPS.slice(0, cfg.hint).map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('') + '</details>' : '';
  pantalla(
    tips +
    '<div class="panel">' + (practice ? '<div class="aviso-caja"><b>Practice</b>: n = 1, nothing is saved. Press <b>A</b> if the square is where the previous one was, <b>L</b> if the letter repeats the previous one.</div>' : '') +
    '<div class="cabecera"><span>Stimulus <b id="k">0</b> / ' + seq.len + '</span><span>Level <b>' + params.nivel + '</b></span><span>n = <b>' + n + '</b></span></div>' +
    '<div class="barra" id="barra"><div id="bar"></div></div>' +
    '<div class="cuadricula" id="cuad">' + [0,1,2,3,4,5,6,7,8].map(function(x){ return '<div data-p="' + x + '"></div>'; }).join('') + '</div>' +
    '<div class="letra-grande" id="letra" aria-live="off"></div>' +
    '<p class="fila" style="justify-content:center"><span class="tecla" id="ka">A · position</span><span class="tecla" id="kl">L · letter</span></p>' +
    '<div class="retro suave" id="retro" aria-live="polite">Get ready…</div>' +
    '<p class="suave peq" style="text-align:center">A = position repeats · L = letter repeats · Esc twice quits without saving</p></div>'
  );
  const celdas = Array.prototype.slice.call($('cuad').children);
  function textoJuicio(j){
    const partes = [];
    [['pos','Position'],['let','Letter']].forEach(function(c){
      const o = obj[c[0]][j], p = !!puls[c[0]][j];
      if (o && p) partes.push('<span class="bien">' + c[1] + ' ✓</span>');
      else if (!o && p) partes.push('<span class="mal">' + c[1] + ': false alarm</span>');
      else if (o && !p) partes.push('<span class="aviso">' + c[1] + ': omission</span>');
    });

  }
  function siguiente(){
    if (fin) return;
    if (i >= 0) $('retro').innerHTML = textoJuicio(i) || '<span class="suave">—</span>';
    else $('retro').innerHTML = '';
    i++;
    if (i >= seq.len){ acabar(); return; }
    $('k').textContent = i + 1; $('bar').style.width = (i / seq.len * 100) + '%';
    celdas.forEach(function(c){ c.classList.remove('on'); });
    celdas[seq.pos[i]].classList.add('on');
    $('letra').textContent = voz ? '' : seq.let[i];
    if (voz) hablar(seq.let[i]);
    tempo(setTimeout(function(){ celdas[seq.pos[i]].classList.remove('on'); if (!voz) $('letra').textContent = ''; }, Math.min(800, intervalo * 0.4)));
    tempo(setTimeout(siguiente, intervalo));
  }

    if (fin || i < 0 || i >= seq.len) return;
    if (puls[canal][i]) return;     // one press per channel per stimulus
    puls[canal][i] = true;
    const el = $(id); el.classList.remove('bien-tecla', 'mal-tecla'); el.classList.add('pulsada');
    // immediate verdict on the key itself (green = it really was a repeat n back, red = false alarm)
    const acierto = obj[canal][i];
    el.style.background = acierto ? 'var(--bien)' : 'var(--mal)'; el.style.color = '#06200f'; el.style.borderColor = 'transparent';
    tempo(setTimeout(function(){ el.classList.remove('pulsada'); el.style.background = ''; el.style.color = ''; el.style.borderColor = ''; }, 350));
  }
  function acabar(){

    const t = nbPuntuar(seq, n, puls);
    const extra = '<div class="cifras">' +

      statCard(t.let.aciertos + ' / ' + t.let.objetivos, 'Letter: hits / targets') +
      statCard(t.pos.falsas + t.let.falsas, 'False alarms (' + t.pos.falsas + ' pos., ' + t.let.falsas + ' letter)') +
      statCard(t.pos.omisiones + t.let.omisiones, 'Omissions (' + t.pos.omisiones + ' pos., ' + t.let.omisiones + ' letter)') +
      '</div><p class="suave peq">Accuracy counts all correct decisions (hits and correct rejections) out of the ' + (2 * seq.len) + ' judgements of the session.</p>';
    const resNB = [];
    for (let k = 0; k < seq.len; k++){
      let c = 0, b = 0;
      ['pos','let'].forEach(function(ch){
        const o = obj[ch][k], p = !!puls[ch][k];
        if (o === p) c++; else if (o && !p) b++;
      });
      resNB.push({ n:2, c:c, b:b, sec:intervalo / 1000 });
    }
    const nivelFinal = params.nivel;
    const rec = { id:'nback', clave:'nback-' + n, modo:modo, nivel:nivelFinal, practice:practice,
      etiquetaNivel: modo === 'manual' ? String(practice ? 1 : cfg.nivel) : (modo === 'custom' ? 'Custom ' + params.nivel : 'Adaptive'),
      params:'n = ' + n + ' · ' + seq.len + ' stimuli · ' + fmt(intervalo / 1000, 1) + ' s · ' + (voz ? 'spoken letter' : 'visual only'),
      aciertos:t.aciertos, fallos:t.falsas, blanco:t.omisiones, ayudados:0, spi:intervalo / 1000, precision:t.precision,
      etiquetaPrecision:'correct decisions',
      objetivo:cfg.goal, puntos:t.aciertos, mayorEsMejor:true, extra:extra, thirds:atcThirds(resNB, 0) };
    // n cannot change mid-stream, so adaptive n-back moves between sessions (it used to stay at the start level forever).
    if (modo === 'adaptive') d.ultimo.nbAdaptStart = inicioAdaptativo(params.nivel, rec.precision, true);
    mostrarResultado(rec, extra, function(){ iniciarNback(cfg); }, configNback);
  }
  onKey = function(e){
    if (e.repeat) return;
    if (e.key === 'a' || e.key === 'A'){ e.preventDefault(); pulsar('pos', 'ka'); }
    else if (e.key === 'l' || e.key === 'L'){ e.preventDefault(); pulsar('let', 'kl'); }
  };
  tempo(setTimeout(siguiente, 1500));
}

  if (r.practice || intentos === 0){
    const msg = r.practice
      ? '<p class="bien-caja"><b>Practice complete.</b> ' + r.aciertos + ' of ' + intentos + ' right. Nothing was saved. When the keys feel natural, start a real session at level 1 or 2.</p>'
      : '<p class="aviso-caja"><b>No answers were given</b>, so this session was not saved (it would only add a 0 % line to your history).</p>';
    pantalla('<div class="panel"><h1>' + (r.practice ? 'Practice · ' : 'Session not saved · ') + MODULOS[r.id] + '</h1>' + msg + dualHtml +
      '<p class="fila" style="margin-top:14px"><button class="btn primario" id="rep">' + (r.practice ? 'Practice again (Enter)' : 'Try again (Enter)') + '</button><button class="btn" id="cam">' + (r.practice ? 'Set up a real session' : 'Settings') + '</button><button class="btn" id="men">Menu (Esc)</button></p></div>');
    finResultado(repetirFn, cambiarFn);
    return;
  }
  const valida = esValida(r.precision);
  const cumplido = evaluarObjetivo(r.objetivo, { precision:r.precision, spi:r.spi, aciertos:r.aciertos, concentracion: r.id === 'd2' ? r.puntos : undefined });
  const ses = { ts:new Date().toISOString(), modulo:MODULOS[r.id], clave:r.clave, modo:r.modo, nivel:r.nivel, etiquetaNivel:r.etiquetaNivel,
    params:r.params, aciertos:r.aciertos, fallos:r.fallos, blanco:r.blanco, ayudados:r.ayudados || 0, spi:r.spi, precision:r.precision,
    objetivo:r.objetivo, cumplido:cumplido, valida:valida, puntos:r.puntos, mayorEsMejor:r.mayorEsMejor,
    thirds:r.thirds || null };
  const record = esRecord(d.sesiones, ses);
  const mejorAntes = r.nivel !== null ? mejorPersonal(d.sesiones, ses.modulo, ses.clave, r.nivel, r.mayorEsMejor) : null;
  const previas = d.sesiones.filter(function(s){ return s.modulo === ses.modulo && s.etiquetaNivel === ses.etiquetaNivel; }).slice(-4);
  d.sesiones.push(ses);
  const guardado = guardar();
  const streak = rachaModulo(d.sesiones, ses.modulo);
  const unidad = r.id === 'lr' ? ' s' : '';
  let objetivoHtml;
  if (cumplido === true) objetivoHtml = '<div class="bien-caja"><b class="bien">Goal met.</b> “' + esc(r.objetivo) + '”</div>';
  else if (cumplido === false) objetivoHtml = '<div class="aviso-caja"><b class="aviso">Goal not met.</b> “' + esc(r.objetivo) + '”</div>';
  else objetivoHtml = '<div class="aviso-caja" id="cajaobj">I could not interpret your goal “' + esc(r.objetivo) + '”. Did you meet it? ' +
    '<button class="btn" id="siobj">Yes</button> <button class="btn" id="noobj">No</button></div>';
  // Best line: state whether this session beat the previous best, instead of showing a stale number.
  let mejorHtml = '';
  if (r.nivel !== null){
    if (record) mejorHtml = '<p class="bien">New personal best at level ' + esc(r.etiquetaNivel) + ': ' + fmt(r.puntos, r.id === 'lr' ? 2 : 0) + unidad + ' (previous: ' + fmt(mejorAntes.puntos, r.id === 'lr' ? 2 : 0) + unidad + ').</p>';
    else if (mejorAntes) mejorHtml = '<p class="suave">Personal best at this level (manual, no hints): ' + fmt(mejorAntes.puntos, r.id === 'lr' ? 2 : 0) + unidad + '.</p>';
    else mejorHtml = '<p class="suave">' + (r.modo === 'manual' && !r.ayudados && valida ? 'First hint-free manual session at this level: this is now your reference.' : 'No hint-free manual record yet at this level (records need a manual session at ' + PRECISION_MINIMA + ' %+ with no hints).') + '</p>';
  }
  const tend = previas.length ? '<p class="suave">Accuracy trend at this level: ' + previas.map(function(s){ return fmt(s.precision, 0); }).concat([fmt(r.precision, 0)]).join(' → ') + ' %</p>' : '';
  const sig = r.modo === 'adaptive' ? d.ultimo[(r.id === 'nback' ? 'nb' : r.id) + 'AdaptStart'] : null;
  pantalla(
    '<div class="panel"><h1>Result · ' + MODULOS[r.id] + '</h1>' +
    '<p class="suave">' + esc(r.params) + ' · level ' + esc(r.etiquetaNivel) + '</p>' +
    (guardado ? '' : '<div class="aviso-caja">This session could not be written to the browser storage; it is kept only while this tab stays open.</div>') +
    (record ? '<p><span class="record">Personal record!</span></p>' : '') +
    '<div class="cifras">' +
      statCard(r.aciertos, 'Correct') + statCard(r.fallos, 'Wrong') + statCard(r.blanco, 'Blank / timed out') +
      (r.ayudados ? statCard(r.ayudados, 'Assisted (hint used)') : '') +
      statCard(fmt(r.spi, 2), r.id === 'nback' ? 's per stimulus' : 's per item') +
      '<div class="cifra"><b class="' + (valida ? 'bien' : 'mal') + '">' + fmt(r.precision, 1) + ' %</b><span>Accuracy' + (r.etiquetaPrecision ? ' (' + r.etiquetaPrecision + ')' : '') + '</span></div>' +
      statCard(streak, 'goals met in a row') +
    '</div>' + objetivoHtml + dualHtml + mejorHtml + tend +
    (ses.thirds ? '<p class="suave" id="terciosLinea">' + esc(atcThirdsLine(ses.thirds)) + '</p>' : '') +
    '<div class="bien-caja">' + esc(nivelStatement(r.nivel === null ? 5 : r.nivel)) + '</div>' +
    '<div class="' + (valida ? 'bien-caja' : 'aviso-caja') + '"><b>Next:</b> ' + esc(recomendacion(r.nivel === null ? 5 : r.nivel, r.precision)) + '</div>' +
    (sig ? '<p class="suave">Adaptive: the next adaptive session of this module starts at level ' + sig + '.</p>' : '') +
    (extraHtml || '') +
    '<p class="fila" style="margin-top:14px"><button class="btn primario" id="rep">Repeat same session (Enter)</button><button class="btn" id="cam">Change settings</button><button class="btn" id="men">Menu (Esc)</button><button class="btn" id="his">Stats (H)</button></p></div>'
  );
  if (cumplido === null){
    const idx = d.sesiones.length - 1;
    const marcar = function(v){
      d.sesiones[idx].cumplido = v; guardar();
      $('cajaobj').innerHTML = 'Recorded: ' + (v ? '<b class="bien">met</b>' : '<b class="aviso">not met</b>') + '.';
    };
    $('siobj').addEventListener('click', function(){ marcar(true); });
    $('noobj').addEventListener('click', function(){ marcar(false); });
  }
  finResultado(repetirFn, cambiarFn);
}
// Buttons and keys of a result screen. Keys are ignored for the first 0.8 s: the player is usually still hammering
// Space / Enter / arrows when the session ends, and that must not restart or leave the screen by accident.
function finResultado(repetirFn, cambiarFn){
  const bloqueoHasta = Date.now() + 800;
  const libre = function(){ return Date.now() >= bloqueoHasta; };
  $('rep').addEventListener('click', function(){ if (libre()) repetirFn(); });
  $('cam').addEventListener('click', function(){ if (libre()) cambiarFn(); });
  $('men').addEventListener('click', menu);
  if ($('his')) $('his').addEventListener('click', historial);
  onKey = function(e){
    if (!libre()){ e.preventDefault(); return; }
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); repetirFn(); }
    else if ((e.key === 'h' || e.key === 'H') && $('his')){ e.preventDefault(); historial(); }
  };
  // Focus after the lock so a trailing key-up cannot "click" the focused button.
  tempo(setTimeout(function(){ const b = $('rep'); if (b) b.focus(); }, 800));
}

/* ================= STATS AND HISTORY ================= */
function marcador(idx, x, y, col){
  const r = 5;
  if (idx === 0) return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '"/>';
  if (idx === 1) return '<rect x="' + (x - r) + '" y="' + (y - r) + '" width="' + 2 * r + '" height="' + 2 * r + '" fill="' + col + '"/>';
  if (idx === 2) return '<polygon points="' + x + ',' + (y - r - 1) + ' ' + (x - r - 1) + ',' + (y + r) + ' ' + (x + r + 1) + ',' + (y + r) + '" fill="' + col + '"/>';
  return '<polygon points="' + x + ',' + (y - r - 1) + ' ' + (x + r + 1) + ',' + y + ' ' + x + ',' + (y + r + 1) + ' ' + (x - r - 1) + ',' + y + '" fill="' + col + '"/>';
}
const MOD_IDS = ['calc', 'd2', 'lr', 'nback'];
const MOD_COLS = ['#4fc3f7', '#ffb74d', '#81c784', '#ce93d8'];
const PUNTOS_ROT = { calc:'correct answers', d2:'concentration', lr:'s per item (lower is better)', nback:'correct decisions' };
function media(a){ return a.length ? a.reduce(function(s, x){ return s + x; }, 0) / a.length : null; }
function rachaMaxima(sesiones, modulo){
  let m = 0, c = 0;
  sesiones.forEach(function(s){ if (s.modulo !== modulo) return; if (s.cumplido === true){ c++; if (c > m) m = c; } else c = 0; });
  return m;
}
// Trend = mean accuracy of the last 5 sessions minus the mean of the 5 before them.
function tendenciaTxt(ses){
  if (ses.length < 2) return '';
  const ult = ses.slice(-5).map(function(s){ return s.precision; });
  const ant = ses.slice(-10, -5).map(function(s){ return s.precision; });
  if (!ant.length) return '';
  const dif = media(ult) - media(ant);
  if (Math.abs(dif) < 0.5) return '<span class="tendencia">→ flat</span>';
  return dif > 0 ? '<span class="tendencia bien">↑ +' + fmt(dif, 1) + ' pts</span>' : '<span class="tendencia mal">↓ ' + fmt(dif, 1) + ' pts</span>';
}
function mejorDe(ses, mayor){
  let b = null;
  ses.forEach(function(s){ if (typeof s.puntos !== 'number') return; if (b === null || (mayor ? s.puntos > b : s.puntos < b)) b = s.puntos; });
  return b;
}
function graficoTendencia(ses, moduloTxt){
  if (!ses.length) return '<p class="suave">No sessions to plot yet.</p>';
  const pts = ses.slice(-40);
  const W = 720, H = 260, ml = 44, mr = 14, mt = 12, mb = 30;
  const minP = Math.min(90, Math.floor(Math.min.apply(null, pts.map(function(p){ return p.precision; })) / 5) * 5);
  const x = function(k){ return pts.length === 1 ? ml + (W - ml - mr) / 2 : ml + k / (pts.length - 1) * (W - ml - mr); };
  const y = function(v){ return mt + (100 - Math.max(minP, v)) / (100 - minP) * (H - mt - mb); };
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Accuracy per session, ' + esc(moduloTxt) + '" style="background:#0d1014;border-radius:8px;max-height:280px">';
  const paso = (100 - minP) > 20 ? 10 : 5;
  for (let v = minP; v <= 100; v += paso){
    s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#2c3440"/><text x="' + (ml - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#aab5c4">' + v + '</text>';
  }
  s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(PRECISION_MINIMA) + '" y2="' + y(PRECISION_MINIMA) + '" stroke="#7bd88f" stroke-dasharray="6 4"/><text x="' + (W - mr) + '" y="' + (y(PRECISION_MINIMA) - 4) + '" text-anchor="end" font-size="11" fill="#7bd88f">minimum ' + PRECISION_MINIMA + ' %</text>';
  MOD_IDS.forEach(function(id, idx){
    const a = []; pts.forEach(function(p, k){ if (p.modulo === MODULOS[id]) a.push({ k:k, p:p }); });
    if (a.length > 1) s += '<polyline fill="none" stroke="' + MOD_COLS[idx] + '" stroke-width="1.5" opacity=".6" points="' + a.map(function(o){ return x(o.k) + ',' + y(o.p.precision); }).join(' ') + '"/>';
    a.forEach(function(o){ s += marcador(idx, x(o.k), y(o.p.precision), MOD_COLS[idx]); });
  });
  s += '<text x="' + (ml + (W - ml - mr) / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#aab5c4">last ' + pts.length + ' sessions, oldest to newest</text></svg>';
  return s + '<p class="leyenda peq">' + MOD_IDS.map(function(id, idx){
    return '<span><svg width="14" height="14" viewBox="-7 -7 14 14" aria-hidden="true">' + marcador(idx, 0, 0, MOD_COLS[idx]) + '</svg> ' + MODULOS[id] + '</span>';
  }).join('') + '</p>';
}
function statsFiltro(){ return statsFiltro.v || 'all'; }
function historial(filtro){
  limpiar();
  const d = cargar();
  if (typeof filtro === 'string') statsFiltro.v = filtro;
  const f = statsFiltro();
  const todas = d.sesiones;
  const ses = f === 'all' ? todas : todas.filter(function(s){ return s.modulo === MODULOS[f]; });
  const tabs = '<div class="tabs" role="group" aria-label="Filter by module"><button class="btn" data-f="all" aria-pressed="' + (f === 'all') + '">All modules</button>' +
    MOD_IDS.map(function(id, k){ return '<button class="btn" data-f="' + id + '" aria-pressed="' + (f === id) + '">' + (k + 1) + ' ' + MODULOS[id] + '</button>'; }).join('') + '</div>';
  let resumen = '';
  if (f === 'all'){
    resumen = '<div class="tabla-caja"><table><thead><tr><th>Module</th><th>Sessions</th><th>Avg accuracy (last 5)</th><th>Best accuracy</th><th>Trend</th><th>Goals met in a row</th><th>Best run</th><th>Last session</th></tr></thead><tbody>' +
      MOD_IDS.map(function(id){
        const m = todas.filter(function(s){ return s.modulo === MODULOS[id]; });
        if (!m.length) return '<tr><td>' + MODULOS[id] + '</td><td colspan="7" class="suave">No sessions yet</td></tr>';
        return '<tr><td>' + MODULOS[id] + '</td><td>' + m.length + '</td><td>' + fmt(media(m.slice(-5).map(function(s){ return s.precision; })), 1) + ' %</td><td>' + fmt(Math.max.apply(null, m.map(function(s){ return s.precision; })), 1) + ' %</td><td>' + (tendenciaTxt(m) || '—') + '</td><td>' + rachaModulo(todas, MODULOS[id]) + '</td><td>' + rachaMaxima(todas, MODULOS[id]) + '</td><td>' + fechaES(m[m.length - 1].ts) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  } else if (ses.length){
    const niveles = {};
    ses.forEach(function(s){ const k = s.etiquetaNivel || '—'; (niveles[k] = niveles[k] || []).push(s); });
    const orden = Object.keys(niveles).sort(function(a, b){
      const na = parseInt(a, 10), nb = parseInt(b, 10);
      if (!isNaN(na) && !isNaN(nb) && String(na) === a && String(nb) === b) return na - nb;
      if (String(na) === a) return -1; if (String(nb) === b) return 1;
      return a < b ? -1 : 1;
    });
    const mayor = f !== 'lr';
    resumen = '<div class="cifras">' +
      statCard(ses.length, 'sessions') + statCard(fmt(media(ses.slice(-5).map(function(s){ return s.precision; })), 1) + ' %', 'avg accuracy, last 5') +
      statCard(fmt(Math.max.apply(null, ses.map(function(s){ return s.precision; })), 1) + ' %', 'best accuracy') +
      statCard(rachaModulo(todas, MODULOS[f]), 'goals met in a row (now)') + statCard(rachaMaxima(todas, MODULOS[f]), 'best run of goals met') + '</div>' +
      '<p>Trend (last 5 vs the 5 before): ' + (tendenciaTxt(ses) || '<span class="suave">needs 6+ sessions</span>') + '</p>' +
      '<h3>By level</h3><div class="tabla-caja"><table><thead><tr><th>Level</th><th>Sessions</th><th>Avg accuracy</th><th>Best accuracy</th><th>Best ' + PUNTOS_ROT[f] + '</th><th>Trend</th><th>Last</th></tr></thead><tbody>' +
      orden.map(function(k){
        const g = niveles[k];
        const b = mejorDe(g, mayor);
        return '<tr><td>' + esc(k) + '</td><td>' + g.length + '</td><td>' + fmt(media(g.map(function(s){ return s.precision; })), 1) + ' %</td><td>' + fmt(Math.max.apply(null, g.map(function(s){ return s.precision; })), 1) + ' %</td><td>' + (b === null ? '—' : fmt(b, f === 'lr' ? 2 : 0)) + '</td><td>' + (tendenciaTxt(g) || '—') + '</td><td>' + fmt(g[g.length - 1].precision, 1) + ' %</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  const filas = ses.slice().reverse().slice(0, 100).map(function(s){
    return '<tr><td>' + fechaES(s.ts) + '</td><td>' + esc(s.modulo) + '</td><td title="' + esc(s.params) + '">' + esc(s.etiquetaNivel || '—') + '</td><td>' + s.aciertos + '</td><td>' + s.fallos + '</td><td>' + s.blanco + '</td><td>' +
      fmt(s.spi, 2) + '</td><td>' + fmt(s.precision, 1) + '</td><td class="goalcell">' + esc(s.objetivo) + '</td><td>' +
      (s.cumplido === true ? 'Yes' : (s.cumplido === false ? 'No' : '—')) + '</td><td>' + (s.valida ? 'Yes' : 'No') + '</td></tr>';
  }).join('');
  pantalla(
    '<div class="panel"><button class="enlace" id="volver">← Menu (Esc)</button><h1>Stats and history</h1>' + tabs +
    (todas.length ? resumen : '') +
    '<h2>Accuracy per session</h2>' + graficoTendencia(ses, f === 'all' ? 'all modules' : MODULOS[f]) +
    '<h2>Sessions (' + ses.length + (ses.length > 100 ? ', showing the last 100' : '') + ')</h2>' +
    (ses.length ? '<div class="tabla-caja"><table><thead><tr><th>Date</th><th>Module</th><th>Level</th><th>Correct</th><th>Wrong</th><th>Blank</th><th>s/item</th><th>Accuracy %</th><th>Goal</th><th>Met</th><th>Valid</th></tr></thead><tbody>' + filas + '</tbody></table></div>' : '<p class="suave">There are no sessions yet. Play one and it appears here.</p>') +
    '<p class="fila" style="margin-top:14px"><button class="btn primario" id="csv">Export CSV (all sessions)</button><button class="btn peligro" id="borrar">Delete history</button><span id="conf"></span></p>' +
    '<p class="suave peq">Valid = accuracy of at least ' + PRECISION_MINIMA + ' %. Hover the Level cell for the session parameters. The CSV uses “;” as the separator, a decimal point, and UTF-8 with BOM: it opens directly in Excel. Columns: Date;Module;Level;Correct;Wrong;Blank;Seconds per item;Accuracy %;Goal;Met.</p></div>'
  );
  Array.prototype.forEach.call(app.querySelectorAll('.tabs .btn'), function(b){ b.addEventListener('click', function(){ historial(b.dataset.f); }); });
  $('volver').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    try {
      const blob = new Blob([aCSV(d.sesiones)], { type:'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      const fh = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = 'aptitude-trainer-' + fh.getFullYear() + pad2(fh.getMonth() + 1) + pad2(fh.getDate()) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      $('conf').innerHTML = '<span class="bien">CSV downloaded (' + d.sesiones.length + ' sessions).</span>';
    } catch (e) { $('conf').innerHTML = '<span class="mal">The file could not be generated.</span>'; }
  });
  $('borrar').addEventListener('click', function(){
    $('conf').innerHTML = '<span class="aviso">Are you sure? All sessions and saved settings will be deleted.</span> <button class="btn peligro" id="si">Yes, delete</button> <button class="btn" id="no">Cancel</button>';
    $('no').addEventListener('click', function(){ $('conf').innerHTML = ''; $('borrar').focus(); });
    $('si').addEventListener('click', function(){
      memoria = { sesiones:[], ultimo:{} }; guardar(); statsFiltro.v = 'all'; historial();
    });
    $('no').focus();
  });
  onKey = function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'h' || e.key === 'H') menu();
    else if (e.key === '0') historial('all');
    else if (e.key >= '1' && e.key <= '4') historial(MOD_IDS[parseInt(e.key, 10) - 1]);
  };
}

try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}
cargar();
menu();
</script>
