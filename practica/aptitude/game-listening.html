<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprensión auditiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4d8f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9.2'/%3E%3Ccircle cx='12' cy='12' r='4.6'/%3E%3Cpath d='M12 12L19 6.2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --soft:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --on-accent:#ffffff; --good:#2d6a3e; --bad:#a3241c; --warn:#b3450d;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --soft:#a19c90; --rule:#3a3935;
  --accent:#7fb0e8; --accent-h:#a4c6ef; --on-accent:#161615; --good:#7cbf8a; --bad:#e5766d; --warn:#e08a55;
}}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45}
#app{max-width:920px;margin:0 auto;padding:20px 16px 56px}
h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;margin:0 0 .5rem;font-weight:700}
h2{font-family:var(--serif);font-size:1.3rem;margin:1.6rem 0 .6rem;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:700}
h3{font-family:var(--serif);font-size:1.05rem;margin:1.1rem 0 .3rem;font-weight:700}
p{margin:.4rem 0}
.soft{color:var(--soft)} .small{font-size:.85rem}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.center{text-align:center}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .i{width:34px;height:34px;color:var(--accent);stroke-width:1.5}
.brand h1{margin:0}
.list{border-top:2px solid var(--text);margin:14px 0}
.card{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:16px 4px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.card:hover{background:var(--stripe)}
.card .i.lead{width:30px;height:30px;color:var(--accent)}
.card .nm{font-family:var(--serif);font-size:1.3rem;font-weight:700;flex:1}
.card .data{color:var(--soft);font-size:.86rem;text-align:right}
.card .go{color:var(--accent)}
button,select,input{font:inherit}
.btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;transition:background-color .12s,color .12s}
.btn:hover:not(:disabled){background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);color:var(--on-accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:4px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 0;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--accent-h);text-decoration:underline}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;min-height:42px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:auto;min-height:auto;vertical-align:middle}
input:focus-visible,select:focus-visible,.btn:focus-visible,.card:focus-visible,.link:focus-visible,.optBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.lab{display:block;margin:.9rem 0 .3rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.row>*{flex:0 0 auto}
.figures{display:flex;flex-wrap:wrap;margin:.8rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.figure{padding:10px 26px 10px 0}
.figure b{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1.1}
.figure span{color:var(--soft);font-size:.82rem}
.bar{height:3px;background:var(--stripe);margin:.5rem 0}
.bar>div{height:100%;background:var(--accent);width:0}
.fb{min-height:2.2rem;font-size:1.05rem;margin-top:.6rem}
.head{display:flex;flex-wrap:wrap;gap:4px 24px;color:var(--soft);font-size:.9rem}
.head b{color:var(--text)}
.head .link{margin-left:auto;padding:0 4px;min-width:40px;justify-content:center}
.notice{font-weight:700;margin:.5rem 0}
.hint{border-top:1px solid var(--rule);color:var(--soft);padding:8px 0;margin:.5rem 0}
.hint code{background:var(--stripe);padding:1px 6px;border-radius:2px}
.tbox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;border-top:1px solid var(--text);border-bottom:1px solid var(--text)}
th,td{border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--soft);font-weight:600;font-size:.82rem}
tr.me td{font-weight:700}
td.mod{white-space:normal;min-width:180px}
.playbox{border-top:2px solid var(--text);border-bottom:1px solid var(--rule);padding:22px 0;text-align:center;margin:.8rem 0}
.playbox .i.big{width:36px;height:36px;color:var(--accent)}
.playword{font-family:var(--serif);font-size:2.1rem;font-weight:700;min-height:2.6rem;letter-spacing:.02em}
.keys{color:var(--soft);font-size:.8rem;text-align:center}
@media (pointer:coarse){.keys{display:none}}
.elems{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;margin:.8rem 0}
.elemBox label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:4px}
.dual{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:1px solid var(--rule);padding:0 0 10px;margin:0 0 10px}
.dual input{width:140px;min-height:38px}
.passageQ{border-top:1px solid var(--rule);padding:12px 0}
.optsList{display:grid;gap:6px;margin-top:.5rem}
.optBtn{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:9px 12px;min-height:44px;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.optBtn:hover:not(:disabled){border-color:var(--accent)}
.optBtn.ok{border-color:var(--good);color:var(--good);font-weight:700}
.optBtn.bad{border-color:var(--bad);color:var(--bad)}
.optBtn:disabled{color:var(--text);cursor:default}
.optBtn.ok:disabled{color:var(--good)} .optBtn.bad:disabled{color:var(--bad)}
.optBtn.sel{border-color:var(--accent);background:var(--stripe);box-shadow:inset 4px 0 0 var(--accent)}
.ptext{font-family:var(--serif);font-size:1.06rem;line-height:1.6;text-align:left;margin:.7rem 0;overflow-wrap:anywhere}
.gbar{max-width:320px;margin:.6rem auto}
details.rev{border-top:1px solid var(--rule);padding:4px 0}
details.rev summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.rev summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rq{padding:6px 0}
.rq p{margin:.2rem 0}
.key{display:inline-block;padding:0 6px;border:1px solid var(--rule);border-radius:2px;font-size:.78rem;background:var(--surface);color:var(--text)}
.voice{color:var(--soft);font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:10px 0}
.voice .link{padding:2px 8px;font-size:.86rem}
#toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:2px;z-index:10;max-width:90vw}
.tags{margin:.4rem 0;color:var(--soft)}
.tags b{color:var(--text)}
@media (max-width:640px){
  html{font-size:16px}
  #app{padding:14px 16px 44px}
  h1{font-size:1.6rem}
  .playword{font-size:1.5rem}
  .card .data{display:none}
  .figure{padding-right:18px}
}
</style>

<main id="app"></main>

<script>

// ==== PURE LOGIC START ====
/* ---------- RNG helpers ---------- */
function randInt(rnd, a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function pick(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(rnd, arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function fmt(x, d){ if (x === null || x === undefined || isNaN(x)) return '—'; return Number(x).toFixed(d === undefined ? 1 : d); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function padN(n, len){ let s = String(n); while (s.length < len) s = '0' + s; return s; }

/* ---------- ICAO alphabet and aviation number words (CAP 413, sec. 2.12) ---------- */
const ICAO_ALPHA = { A:'Alfa', B:'Bravo', C:'Charlie', D:'Delta', E:'Echo', F:'Foxtrot', G:'Golf', H:'Hotel',
  I:'India', J:'Juliett', K:'Kilo', L:'Lima', M:'Mike', N:'November', O:'Oscar', P:'Papa', Q:'Quebec',
  R:'Romeo', S:'Sierra', T:'Tango', U:'Uniform', V:'Victor', W:'Whiskey', X:'X-ray', Y:'Yankee', Z:'Zulu' };
const ICAO_LETTERS = Object.keys(ICAO_ALPHA);
const NUM_WORD = ['Zero','Wun','Too','Tree','Fower','Fife','Six','Seven','Ait','Niner'];
function digitsToWords(str){ return String(str).split('').map(function(c){ return NUM_WORD[+c]; }); }
// Text-to-speech engines mispronounce the ICAO respellings (Wun, Too, Fower, Fife, Ait...), so the
// synthesiser gets ordinary English digit words; the visual fallback and the Tips page keep the ICAO forms.
const TTS_WORD = { Zero:'zero', Wun:'one', Too:'two', Tree:'three', Fower:'four', Fife:'five', Six:'six', Seven:'seven', Ait:'eight', Niner:'nine', Juliett:'Juliet', 'X-ray':'X ray', Decimal:'decimal' };
function toTTS(words){ return words.map(function(w){ return TTS_WORD[w] || w; }); }
const DIGIT_EN = ['zero','one','two','three','four','five','six','seven','eight','nine'];
function say(str){ return String(str).split('').map(function(c){ return /\d/.test(c) ? DIGIT_EN[+c] : c; }).join(' '); } // "1013" -> "one zero one three"
function ordinal(n){ const m = n % 100; if (m >= 11 && m <= 13) return n + 'th'; const r = n % 10; return n + (r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th'); }
function sayRunway(r){ const side = /[LCR]$/.test(r) ? { L:'left', C:'centre', R:'right' }[r.slice(-1)] : ''; return say(r.replace(/[LCR]$/, '')) + (side ? ' ' + side : ''); }
function sayNum(n){ return n < 0 ? 'minus ' + Math.abs(n) : String(n); }
function octal4(rnd){ let s = ''; for (let i = 0; i < 4; i++) s += String(randInt(rnd, 0, 7)); return s; }

const AIRLINES = [
  ['Speedbird','BAW'], ['Ryanair','RYR'], ['Vueling','VLG'], ['Iberia','IBE'], ['Easy','EZY'],
  ['Norshuttle','NOZ'], ['Lufthansa','DLH'], ['Airfrans','AFR'], ['Klim','KLM'], ['Shamrock','EIN'],
  ['Wizzair','WZZ'], ['Jetstream','TOM']
];

/* ---------- Element generators (single dictation items) ---------- */
function normAns(s){ return String(s || '').toUpperCase().replace(/[\s\-.]/g, ''); }

function genCallsign(rnd){
  if (rnd() < 0.5){
    const letters = [pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS)];
    const spoken = ['Golf'].concat(letters.map(function(l){ return ICAO_ALPHA[l]; }));
    const answer = 'G' + letters.join('');
    return { kind:'callsign', sub:'registration', spoken:spoken, label:'Matrícula de aeronave', answer:answer,
      accept:function(v){ return normAns(v) === normAns(answer) || normAns(v) === normAns('G-' + letters.join('')); },
      display:'G-' + letters.join('') };
  }
  const al = pick(rnd, AIRLINES);
  const n = randInt(rnd, 1, 4);
  let digs = '';
  for (let i = 0; i < n; i++) digs += String(randInt(rnd, 0, 9));
  const spoken = [al[0]].concat(digitsToWords(digs));
  const answer = al[0].toUpperCase() + ' ' + digs;
  return { kind:'callsign', sub:'airline', spoken:spoken, label:'Indicativo', answer:answer,
    accept:function(v){ return normAns(v) === normAns(answer); }, display:al[0] + ' ' + digs };
}
function genHeading(rnd){
  const v = randInt(rnd, 1, 360);
  const s = padN(v, 3);
  return { kind:'heading', spoken:digitsToWords(s), label:'Rumbo (3 dígitos)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s };
}
function genFlightLevel(rnd){
  const v = randInt(rnd, 10, 41) * 10;
  const s = padN(v, 3);
  return { kind:'flightlevel', spoken:digitsToWords(s), label:'Nivel de vuelo (3 dígitos, sin «FL»)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:'FL' + s };
}
function genAltimeter(rnd){
  const v = randInt(rnd, 950, 1050);
  const s = padN(v, 4);
  return { kind:'altimeter', spoken:digitsToWords(s), label:'QNH (4 dígitos, hPa)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s + ' hPa' };
}
function genFrequency(rnd){
  const whole = randInt(rnd, 118, 136);
  const decOpts = ['005','010','025','050','075','100','125','150','175','200','225','250','275','300','325','350','375','400','425','450','475','500','525','550','575','600','625','650','675','700','725','750','775','800','825','850','875','900','925','950','975'];
  const dec = pick(rnd, decOpts);
  const s = whole + '.' + dec;
  const spoken = digitsToWords(String(whole)).concat(['Decimal']).concat(digitsToWords(dec));
  return { kind:'frequency', spoken:spoken, label:'Frecuencia (p. ej. 127.350)', answer:s,
    accept:function(x){ const n = normAns(x); return n === normAns(s) || n === normAns(s).slice(1); }, display:s + ' MHz' };
}
function genSquawk(rnd){
  let s = '';
  for (let i = 0; i < 4; i++) s += String(randInt(rnd, 0, 7));
  return { kind:'squawk', spoken:digitsToWords(s), label:'Código transpondedor (4 dígitos octales)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s };
}
function genRunway(rnd){
  const v = randInt(rnd, 1, 36);
  const s = padN(v, 2);
  const side = rnd() < 0.4 ? pick(rnd, ['L','C','R']) : '';
  const sideWord = { L:'Left', C:'Centre', R:'Right' }[side] || '';
  const spoken = digitsToWords(s).concat(sideWord ? [sideWord] : []);
  const answer = s + side;
  return { kind:'runway', spoken:spoken, label:'Pista (p. ej. 27 o 27L)', answer:answer,
    accept:function(x){ return normAns(x) === normAns(answer); }, display:answer };
}
const ELEMENT_GENS = { callsign:genCallsign, heading:genHeading, flightlevel:genFlightLevel,
  altimeter:genAltimeter, frequency:genFrequency, squawk:genSquawk, runway:genRunway };
const ELEMENT_KINDS = Object.keys(ELEMENT_GENS);

function connectorFor(kind){
  return { heading:'turn heading', flightlevel:'climb flight level', frequency:'contact on',
    runway:'cleared runway', altimeter:'QNH', squawk:'squawk' }[kind] || 'and';
}
// A "clearance" item chains a callsign with 1+ further elements, connector words spoken
// in between; scored per element (partial credit), as required for the dictation drill.
function genClearanceChain(rnd, nParts){
  nParts = Math.max(2, Math.min(6, nParts || 3));
  const cs = genCallsign(rnd);
  const parts = [cs];
  const kinds = ['heading','flightlevel','frequency','runway','altimeter','squawk'];
  const chosen = shuffle(rnd, kinds).slice(0, nParts - 1);
  chosen.forEach(function(k){ parts.push(ELEMENT_GENS[k](rnd)); });
  let spoken = cs.spoken.slice();
  parts.slice(1).forEach(function(p){ spoken = spoken.concat(connectorFor(p.kind).split(' ')).concat(p.spoken); });
  return { kind:'clearance', parts:parts, spoken:spoken };
}
function makeDictationItem(rnd, chainLen){
  if (chainLen <= 1){
    const kind = pick(rnd, ELEMENT_KINDS);
    const el = ELEMENT_GENS[kind](rnd);
    return { kind:'single', parts:[el], spoken:el.spoken };
  }
  return genClearanceChain(rnd, chainLen);
}
function scoreItem(item, userAnswers){
  let ok = 0, blank = 0;
  const detail = item.parts.map(function(p, i){
    const u = (userAnswers[i] || '').trim();
    const isBlank = u === '';
    const good = !isBlank && p.accept(u);
    if (good) ok++; else if (isBlank) blank++;
    return { kind:p.kind, label:p.label, expected:p.display || p.answer, got:u, ok:good, blank:isBlank };
  });
  const wrong = item.parts.length - ok - blank;
  return { ok:ok, wrong:wrong, blank:blank, total:item.parts.length, detail:detail,
    pct: item.parts.length ? ok / item.parts.length * 100 : 0 };
}

/* ---------- Difficulty ladder (10 levels) ---------- */

/* ---------- Adaptive engine ---------- */
const ADAPT_TARGET = 96;
function adaptBlockResult(block){
  const n = block.length, ok = block.filter(Boolean).length;
  const acc = n ? ok / n * 100 : 0;
  return { n:n, ok:ok, acc:acc, clean: acc >= ADAPT_TARGET };
}
function adaptStep(state, blockResult, needClean){
  let level = state.level, cleanStreak = state.cleanStreak, failStreak = state.failStreak, ev = null;
  if (blockResult.clean){
    cleanStreak++; failStreak = 0;
    if (cleanStreak >= (needClean || 2)){
      if (level < MAX_LEVEL){ level++; ev = 'up'; } else ev = 'max';
      cleanStreak = 0;
    }
  } else {
    failStreak++; cleanStreak = 0;
    if (failStreak >= 2){ if (level > 1){ level--; ev = 'down'; } failStreak = 0; }
  }
  return { level:level, cleanStreak:cleanStreak, failStreak:failStreak, ev:ev };
}

/* ---------- Anti-acceleration rule ---------- */
function isAcceleration(lastSession, reqRate, reqReplays){
  if (!lastSession || lastSession.accuracy === undefined) return false;
  if (lastSession.accuracy >= ADAPT_TARGET) return false;
  const fasterRate = reqRate > lastSession.rate + 1e-9;
  const fewerReplays = reqReplays < lastSession.replays;
  return fasterRate || fewerReplays;
}

/* ---------- Dual-task: light mental arithmetic run in parallel ---------- */
function genDualTaskSum(rnd, load){
  const range = [ [1,9], [2,15], [5,25], [10,50] ][Math.max(0, Math.min(3, load - 1))];
  const a = randInt(rnd, range[0], range[1]), b = randInt(rnd, range[0], range[1]);
  const op = rnd() < 0.5 ? '+' : '-';
  const r = op === '+' ? a + b : Math.max(a, b) - Math.min(a, b);
  const x = op === '+' ? a : Math.max(a, b), y = op === '+' ? b : Math.min(a, b);
  return { text: x + ' ' + op + ' ' + y, answer:r };
}

function genWeatherPassage(rnd){
  const dir = pick(rnd, WIND_DIRS), spd = randInt(rnd, 2, 45);
  const gust = rnd() < 0.35 ? spd + randInt(rnd, 5, 15) : null;
  const visKm = pick(rnd, [2,4,6,8,10,15,20]);
  const cloud = pick(rnd, ['few clouds at two thousand feet','scattered at one thousand five hundred feet','broken at eight hundred feet','overcast at five hundred feet','sky clear']);
  const temp = randInt(rnd, -5, 30), dew = temp - randInt(rnd, 0, 8);
  const qnh = randInt(rnd, 985, 1035);
  const text = 'Wind ' + padN(dir,3) + ' degrees ' + spd + (gust ? ' gusting ' + gust : '') + ' knots. ' +

  const speech = 'Wind ' + say(padN(dir,3)) + ' degrees ' + spd + (gust ? ' gusting ' + gust : '') + ' knots. ' +

// Builds one multiple-choice question from data the caller already has; the correct option's
// text is derived straight from that data, and verifyMCQ() re-checks the result independently
// before it is ever shown, so every generated item is guaranteed to have exactly one right answer.
function mkMCQ(rnd, q, correctValue, formatFn, distractorFn, nWrong){
  const correctText = formatFn(correctValue);
  const wrongTexts = [];
  let guard = 0;
  while (wrongTexts.length < nWrong && guard < 200){
    guard++;
    const w = distractorFn(rnd);
    const wt = formatFn(w);
    if (wt !== correctText && wrongTexts.indexOf(wt) === -1) wrongTexts.push(wt);
  }
  const options = shuffle(rnd, [correctText].concat(wrongTexts));
  const correctIndex = options.indexOf(correctText);
  if (options.filter(function(o){ return o === correctText; }).length !== 1 || correctIndex < 0){
    throw new Error('mkMCQ: question does not have exactly one correct option: ' + q);
  }
  return { q:q, options:options, correctIndex:correctIndex };
}
function verifyMCQ(mcq){
  const dupCount = {};
  mcq.options.forEach(function(o){ dupCount[o] = (dupCount[o] || 0) + 1; });
  const noDup = Object.keys(dupCount).every(function(k){ return dupCount[k] === 1; });
  return mcq.correctIndex >= 0 && mcq.correctIndex < mcq.options.length && noDup && mcq.options.length >= 2;
}

{ id:'a11', l:1, k:'instr', t:"From the first of June, recycling collection in the town will change. Paper and cardboard go in the blue bin, which will be collected every second Tuesday. Plastic bottles and cans go in the yellow bag, collected every Friday. Glass must now be taken to the bottle banks at supermarkets, because it will no longer be collected from homes. Food waste goes in the small brown bin, also on Fridays. Please put your bins out after seven in the evening the night before collection.", q:[
  ["How often is the blue bin collected?", ["Every two weeks","Every week","Every Friday","Once a month"], "«every second Tuesday» = cada dos semanas."],
  ["What happens to glass from June?", ["Residents take it to bottle banks","It goes in the yellow bag with cans","It is collected every second Tuesday","It goes in the brown bin on Fridays"], "«Glass must now be taken to the bottle banks»."],

{ id:'a12', l:1, k:'travel', t:"Due to strong winds, the 11:30 ferry to Pellham Island has been cancelled. Passengers with tickets for this crossing can travel on the 2:00 ferry at no extra cost, or ask for a full refund at the ticket office. Please note that the 2:00 ferry is expected to be very busy, so passengers travelling with a car are advised to arrive at least forty-five minutes before departure. The café in the terminal building is open until four.", q:[

{ id:'a13', l:1, k:'weather', t:"Today will be the hottest day of the week, with temperatures reaching thirty-four degrees inland and around twenty-nine on the coast. The heat will be strongest between two and five in the afternoon, so people are advised to avoid physical exercise at that time and to drink plenty of water. A light sea breeze will make the coast more comfortable. Tomorrow, temperatures will drop by about six degrees, and there is a small chance of a thunderstorm in the mountains.", q:[

  ["What will happen tomorrow?", ["It will be about six degrees cooler","It will be hotter on the coast","There will be storms on the coast","The sea breeze will stop"], "«temperatures will drop by about six degrees»."]]},

  ["After what time should people avoid coffee?", ["About two o'clock","About eight o'clock","Midday","Six in the evening"], "«avoid coffee and tea after about two o'clock»."],
  ["How long can caffeine stay in the body?", ["Up to eight hours","Up to two hours","Up to eighteen hours","Up to two days"], "«can stay in your body for up to eight hours»."],
  ["What bedroom temperature is recommended?", ["About 18 degrees","About 8 degrees","About 22 degrees","About 28 degrees"], "«around eighteen degrees is ideal»."]]},

  ["From tomorrow, what time will the store open on a Monday?", ["7:00","6:00","8:00","9:00"], "«one hour earlier, at seven in the morning, every day except Sunday»."]]},

{ id:'b01', l:2, k:'news', t:"The city's bike-sharing scheme has had its busiest year since it began in 2019. More than 1.2 million journeys were made, an increase of almost a third compared with last year. The council believes the main reason is the new electric bikes, which were added in March and now make up about forty percent of the fleet. Most trips are short: the average journey lasts just eleven minutes. However, not everyone is happy. Residents in the old town have complained that bikes are often left on narrow pavements, blocking the way for wheelchairs and prams. From next month, users who leave a bike outside an official parking area will be charged a fee of five euros.", q:[
  ["How many journeys were made this year?", ["More than 1.2 million","Just under 1.2 million","About 400,000","Exactly 2.1 million"], "«More than 1.2 million journeys were made»."],
  ["According to the council, why did use increase?", ["The new electric bikes","Lower prices","New parking areas","More bike lanes in the old town"], "«the main reason is the new electric bikes»."],
  ["What is the problem in the old town?", ["Bikes left on pavements block the way","There are not enough bikes for residents","Electric bikes go too fast in narrow streets","Bikes are often stolen from parking areas"], "«bikes are often left on narrow pavements, blocking the way»."],
  ["What will happen from next month?", ["Users who park badly will pay a fee","Electric bikes will cost five euros more","Bikes will be banned from the old town","Trips will be limited to eleven minutes"], "«users who leave a bike outside an official parking area will be charged a fee»."]]},

{ id:'b03', l:2, k:'weather', t:"Here is the mountain forecast for tomorrow. Conditions will be good in the morning, with light winds and clear skies above about 1,500 metres, although valleys may have patches of low cloud until nine o'clock. From early afternoon, cloud will build quickly over the western peaks, and there is a high risk of thunderstorms between three and six, with possible hail. Winds on the summits will increase to fifty kilometres per hour by evening. The freezing level will be at around 3,200 metres. Walkers are strongly advised to plan routes that allow them to be off high ground by early afternoon.", q:[
  ["What may affect the valleys early in the morning?", ["Low cloud","Hail","Strong winds","Thunderstorms"], "«valleys may have patches of low cloud until nine o'clock»."],
  ["When is the thunderstorm risk highest?", ["Between three and six","Before nine","Late in the evening","Between noon and two"], "«a high risk of thunderstorms between three and six»."],
  ["How strong will the summit winds become?", ["50 km/h","15 km/h","32 km/h","100 km/h"], "«increase to fifty kilometres per hour by evening»."],
  ["What is the main advice for walkers?", ["Be off high ground by early afternoon","Start walking only after nine o'clock","Avoid the valleys in the early morning","Stay below 1,500 metres all day"], "«be off high ground by early afternoon»."]]},
{ id:'b04', l:2, k:'announce', t:"Welcome to the university open day. A few practical points before you start. The main talks take place in the Great Hall, beginning at ten with an introduction from the head of admissions. Subject talks run every hour from eleven, in the buildings listed in your programme. Student guides in green T-shirts lead campus tours from the main entrance every thirty minutes; each tour takes about forty minutes. Please note that the science labs can only be visited on a tour, not on your own. Lunch is available in the student café, which accepts cards only. Finally, if you would like to talk to someone about grants and fees, the finance team is in Room 104 all day.", q:[
  ["Where does the introduction take place?", ["In the Great Hall","In Room 104","At the main entrance","In the student café"], "«The main talks take place in the Great Hall, beginning at ten with an introduction»."],
  ["How often do campus tours leave?", ["Every thirty minutes","Every forty minutes","Every hour","Every fifteen minutes"], "«every thirty minutes; each tour takes about forty minutes»."],
  ["How can visitors see the science labs?", ["Only by joining a tour","On their own after eleven","By asking in Room 104","During the subject talks"], "«can only be visited on a tour, not on your own»."],
  ["What should visitors know about the café?", ["It does not take cash","It is closed at lunchtime","It only serves students","It is in Room 104"], "«which accepts cards only»."]]},
{ id:'b05', l:2, k:'talk', t:"Thank you for coming on this walking tour. We're standing in Market Square, which has hosted a weekly market for more than six hundred years. Originally, farmers came here every Wednesday to sell cattle and grain, but in the nineteenth century, when the railway arrived, the cattle market moved to a site near the station, and this square became a place for food and household goods. The clock on the building opposite was a gift from a local wool merchant in 1862, and it's said that he paid for it so that traders could no longer argue about when the market had to close. Today, the market runs on Saturdays, and in December there's a night market on Fridays as well.", q:[
  ["On which day was the original market held?", ["Wednesday","Saturday","Friday","Sunday"], "«farmers came here every Wednesday»."],
  ["What happened when the railway arrived?", ["The cattle market moved near the station","The square was closed for almost a century","The weekly market moved to Saturdays","Farmers stopped selling grain in the square"], "«when the railway arrived, the cattle market moved to a site near the station»."],
  ["Why did the merchant reportedly pay for the clock?", ["To stop arguments about closing time","To celebrate the arrival of the railway","To advertise his wool business","To replace an older clock in the square"], "«so that traders could no longer argue about when the market had to close»."],
  ["When is the night market held?", ["On Fridays in December","On Saturdays all year","On Wednesdays in winter","Every Friday"], "«in December there's a night market on Fridays»."]]},

{ id:'b07', l:2, k:'news', t:"Train services across the northern region will be reduced on Monday and Tuesday because of a strike by maintenance staff. The rail company says about half of the usual services will run, mainly on the main lines between large cities. Branch lines, including the coastal line to Sandhaven, will have no trains at all, and replacement buses will run instead, taking roughly twice as long as the train. Passengers with tickets for these days can use them on Wednesday instead, or claim a refund online. The union says the strike is about safety rules, not pay, and talks will continue at the end of the week.", q:[
  ["Who is going on strike?", ["Maintenance staff","Train drivers","Bus drivers","Ticket office staff"], "«a strike by maintenance staff»."],

  ["According to the union, what is the strike about?", ["Safety rules","Pay","Working hours","Job cuts"], "«the strike is about safety rules, not pay»."]]},
{ id:'b08', l:2, k:'instr', t:"Thanks for buying the HomeLink router. Setting it up takes about ten minutes. First, connect the grey cable from the wall socket to the port marked 'Line', not to the yellow ports, which are for computers. Then plug in the power and wait until the light on the front stops flashing and turns solid white; this can take up to five minutes. Don't press the reset button on the back during this time. The network name and password are printed on the card attached to the bottom of the router. If the light turns red, switch the router off, wait thirty seconds, and try again before calling our helpline.", q:[
  ["Where should the grey cable go?", ["Into the port marked 'Line'","Into one of the yellow ports","Into the back of the computer","Into the socket by the reset button"], "«to the port marked 'Line', not to the yellow ports»."],
  ["What shows that the router is ready?", ["A solid white light","A flashing white light","A red light","A yellow light"], "«stops flashing and turns solid white»."],
  ["Where is the password?", ["On a card on the bottom of the router","On a label on the front of the router","In the instruction booklet","On the back, by the reset button"], "«printed on the card attached to the bottom of the router»."],
  ["What should you do first if the light turns red?", ["Switch it off and wait thirty seconds","Press the reset button on the back","Call the helpline straight away","Change the grey cable for a new one"], "«switch the router off, wait thirty seconds, and try again before calling»."]]},
{ id:'b09', l:2, k:'travel', t:"The Hop-On city bus runs two routes. The red route goes around the historic centre and takes about an hour if you stay on the bus; the blue route goes out to the harbour and the science museum and takes ninety minutes. One ticket is valid on both routes for twenty-four hours from the moment you first use it, not from the time you buy it. Buses leave every fifteen minutes in summer and every half hour from November to March. Audio commentary is available in eight languages through the headphones provided. Tickets bought online are ten percent cheaper than tickets bought from the driver.", q:[
  ["Which route goes to the harbour?", ["The blue route","The red route","Both routes","Neither route"], "«the blue route goes out to the harbour and the science museum»."],
  ["When does the ticket start to be valid?", ["When you first use it","When you buy it","At midnight","When the first bus leaves"], "«from the moment you first use it, not from the time you buy it»."],
  ["How often do the buses run in January?", ["Every half hour","Every fifteen minutes","Every hour","Every ninety minutes"], "«every half hour from November to March»."],
  ["How can you pay less?", ["Buy the ticket online","Buy it from the driver","Use only the red route","Travel in summer"], "«Tickets bought online are ten percent cheaper»."]]},
{ id:'b10', l:2, k:'weather', t:"The national weather service has issued an orange warning for the east coast from midnight tonight until midday tomorrow. A deep area of low pressure will bring gusts of up to one hundred and ten kilometres per hour on exposed coasts, and waves of six to eight metres. Inland, winds will be weaker, but heavy rain could cause local flooding, particularly in low-lying areas near rivers. Ferry companies have already cancelled tomorrow's early crossings, and drivers of high vehicles are advised not to use the coastal motorway. Conditions are expected to improve quickly in the afternoon, with sunny spells and much lighter winds.", q:[
  ["How long does the warning last?", ["From midnight until midday","From midday until midnight","All day tomorrow","Until tomorrow evening"], "«from midnight tonight until midday tomorrow»."],
  ["What is the main risk inland?", ["Flooding after heavy rain","Waves of six to eight metres","Gusts of 110 km/h","Snow on high ground"], "«Inland, winds will be weaker, but heavy rain could cause local flooding»."],
  ["Who should avoid the coastal motorway?", ["Drivers of high vehicles","All drivers on the coast","Cyclists and motorcyclists","Passengers of early ferries"], "«drivers of high vehicles are advised not to use the coastal motorway»."],
  ["What will the afternoon be like?", ["Better, with sun and lighter winds","Still stormy on the exposed coast","Wet, with flooding near rivers","Calm, but with fog in low areas"], "«improve quickly in the afternoon, with sunny spells and much lighter winds»."]]},

{ id:'b12', l:2, k:'talk', t:"Today's talk is about trees in cities. Most people know that trees make streets more pleasant, but they also have measurable effects. On a hot summer day, a street with a full line of trees can be up to five degrees cooler than a similar street without them. Trees also slow down rainwater, which reduces pressure on drains during storms. However, planting the wrong tree in the wrong place causes problems. Some species have roots that lift pavements, and others drop sticky fruit on parked cars. That is why our department now chooses species carefully, and why we plant young trees in autumn, when the soil is still warm but the air is cool.", q:[
  ["How much cooler can a tree-lined street be?", ["Up to five degrees","Up to ten degrees","About two degrees","Up to fifteen degrees"], "«can be up to five degrees cooler»."],
  ["How do trees help during storms?", ["They slow down rainwater","They protect cars from the wind","They keep drains clean","They stop all flooding"], "«Trees also slow down rainwater, which reduces pressure on drains»."],
  ["Which problem does the speaker mention?", ["Roots that lift pavements","Leaves that block drains","Trees that need too much water","Branches that fall on cars"], "«Some species have roots that lift pavements»."],
  ["Why are young trees planted in autumn?", ["The soil is warm and the air is cool","It rains more often in autumn","Young trees are cheaper to buy in autumn","The streets are quieter in autumn"], "«when the soil is still warm but the air is cool»."]]},
{ id:'b13', l:2, k:'announce', t:"Good evening and welcome to the City Concert Hall. Tonight's performance will begin in about ten minutes. Please make sure your mobile phones are switched off; photography and recording are not permitted during the concert. The first half lasts around fifty minutes and will be followed by a twenty-minute interval. Drinks for the interval can be ordered now at the bars on the ground and second floors and will be waiting for you. Latecomers will only be admitted during a suitable pause in the music. In case of emergency, exits are clearly marked on each level, and staff in black jackets will guide you.", q:[
  ["How long is the interval?", ["Twenty minutes","Ten minutes","Fifty minutes","Fifteen minutes"], "«a twenty-minute interval»."],
  ["Where can interval drinks be ordered?", ["On the ground and second floors","Only on the ground floor","On the first and second floors","At the main entrance"], "«at the bars on the ground and second floors»."],
  ["When can latecomers go in?", ["During a suitable pause in the music","Only after the twenty-minute interval","At any time, through the side doors","Not at all once the concert starts"], "«only be admitted during a suitable pause in the music»."],
  ["How can you recognise the staff?", ["They wear black jackets","They carry torches","They wear name badges","They stand by the bars"], "«staff in black jackets will guide you»."]]},
{ id:'b14', l:2, k:'news', t:"Schools in the Valley district will start serving lunches made mainly with local produce from September. Under the new plan, at least sixty percent of the ingredients must come from farms within a hundred kilometres. The district says this will support local farmers and reduce transport, although the cost per meal is expected to rise by about thirty cents. Parents will not pay more, because the difference will be covered by the regional government for the first two years. After that, the district will review the scheme. Some head teachers have welcomed the plan but warned that kitchens in older schools are too small to cook fresh food for every pupil.", q:[
  ["What share of the ingredients must be local?", ["At least sixty percent","About thirty percent","Exactly half","At least eighty percent"], "«at least sixty percent of the ingredients must come from farms within a hundred kilometres»."],
  ["What will happen to the cost of a meal?", ["It will rise by about thirty cents","It will fall by about thirty cents","It will stay exactly the same","It will rise by about sixty cents"], "«expected to rise by about thirty cents»."],
  ["Who will pay the extra cost at first?", ["The regional government","The parents of the pupils","The local farmers","The district's schools"], "«covered by the regional government for the first two years»."],
  ["What concern do some head teachers have?", ["Some kitchens are too small","Local food is of lower quality","Pupils won't like the food","Farmers can't supply enough"], "«kitchens in older schools are too small»."]]},
{ id:'b15', l:2, k:'travel', t:"Good afternoon, ladies and gentlemen, this is your captain speaking. We've now reached our cruising altitude, and our flight time to Dublin is expected to be two hours and ten minutes, so we should land about fifteen minutes ahead of schedule. The weather in Dublin is cloudy, with a temperature of nine degrees and some light rain. In about an hour we may pass through an area of turbulence, so whenever the seat-belt sign is on, please return to your seat. The cabin crew will shortly be coming through the cabin with drinks and snacks, and a selection of hot meals is available to buy.", q:[
  ["How long is the flight expected to take?", ["2 hours 10 minutes","2 hours 15 minutes","1 hour 50 minutes","2 hours 50 minutes"], "«two hours and ten minutes»."],
  ["When will they land compared with the schedule?", ["About fifteen minutes early","On time","About ten minutes late","About fifteen minutes late"], "«about fifteen minutes ahead of schedule»."],
  ["What is the weather in Dublin?", ["Cloudy, light rain, nine degrees","Sunny and dry, nine degrees","Cloudy and dry, nineteen degrees","Heavy rain and strong wind"], "«cloudy, with a temperature of nine degrees and some light rain»."],
  ["What should passengers do when the seat-belt sign is on?", ["Return to their seats","Stop eating","Switch off their phones","Call the cabin crew"], "«whenever the seat-belt sign is on, please return to your seat»."]]},

{ id:'c01', l:3, k:'talk', t:"When our museum stopped charging for entry three years ago, many people predicted disaster, including some of our own trustees. They said visitors wouldn't value what they didn't pay for, and that we'd lose the income we needed to look after the building. Well, the numbers tell a different story. Visitor figures have more than doubled, and, more interestingly, the share of visitors from the poorer neighbourhoods around us has gone from about one in twenty to almost one in five. It's true that ticket income disappeared, but spending in the café and shop has risen so much that it covers roughly two-thirds of what we lost. The rest comes from a new membership scheme, which now has more than four thousand members. I won't pretend it's been easy for the staff, because busier galleries mean more work, but I don't think anyone here would want to go back.", q:[
  ["What did critics predict?", ["That visitors wouldn't value it and income would fall","That the galleries would become too crowded","That staff would leave because of the extra workload","That members would stop paying their fees"], "«visitors wouldn't value what they didn't pay for, and that we'd lose the income»."],
  ["Which result does the speaker find most interesting?", ["More visitors from poorer neighbourhoods","The doubling of visitor numbers overall","The rise in spending in the café and shop","The success of the new membership scheme"], "«more interestingly, the share of visitors from the poorer neighbourhoods … almost one in five»."],
  ["How much of the lost ticket income do the café and shop cover?", ["About two-thirds","All of it","About one-fifth","About half"], "«covers roughly two-thirds of what we lost»."],
  ["What is the speaker's attitude to free entry?", ["Positive, while admitting it has costs","Enthusiastic, with no reservations","Doubtful, because income has fallen","Worried that staff will leave"], "Actitud: defiende el cambio y admite «I won't pretend it's been easy for the staff»."]]},

{ id:'c03', l:3, k:'news', t:"Divers exploring the bottom of Lake Arden have found the remains of a wooden boat that experts believe is around eight hundred years old. Tests on a small sample of the wood are expected to confirm its age by the spring. The boat, about nine metres long, was discovered last month during a survey carried out because of unusually low water levels after the dry summer. Archaeologists say it is too fragile to be lifted at present. Instead, they plan to make a detailed 3D scan this winter and decide next year whether it can be raised safely. 'If we moved it now, it would almost certainly fall apart,' said the project leader, Dr Hana Ruiz. 'Leaving it under water is actually the best way to protect it until we have a proper plan.' The exact location is being kept secret to prevent damage by amateur divers, some of whom have already been seen in the area.", q:[
  ["Why was the survey carried out?", ["Water levels were unusually low","A diver had reported seeing a boat","The lake was being cleaned after summer","A new bridge was being planned"], "«a survey carried out because of unusually low water levels»."],

  ["Why does Dr Ruiz want to leave the boat under water?", ["The water protects it for now","It is too heavy to lift","The lake will be drained next year","Divers want to visit it"], "«Leaving it under water is actually the best way to protect it»."],
  ["Why is the location secret?", ["To protect the boat from amateur divers","Because the survey has not finished yet","Because the lake belongs to a private owner","To stop people fishing in that part of the lake"], "«to prevent damage by amateur divers»."]]},
{ id:'c04', l:3, k:'talk', t:"A common question from students is whether it's better to take notes on a laptop or by hand. Several studies have compared the two, and the results are more interesting than a simple 'paper wins'. In a typical experiment, students watch a short lecture, take notes in one of the two ways, and are tested on it later. Students who type tend to write down much more, often almost word for word. Students who write by hand can't keep up, so they're forced to summarise, and that extra processing seems to help them understand the ideas. In tests of facts a day later, the two groups often do about equally well. The difference appears in questions about concepts, where hand-writers usually score higher. Now, does that mean you should throw away your laptop? Not necessarily. If you type, the lesson is simply to resist the temptation to copy everything, and to put things in your own words.", q:[
  ["What do students who type tend to do?", ["Write down almost everything word for word","Write down less than students using paper","Summarise the ideas in their own words","Remember more facts the next day"], "«write down much more, often almost word for word»."],
  ["Why do hand-writers summarise?", ["They can't write fast enough to copy it all","Their teachers ask them to write summaries","They understand the ideas more quickly","They want to save paper and time"], "«can't keep up, so they're forced to summarise»."],
  ["In which questions do hand-writers usually do better?", ["Questions about concepts","Questions about facts","All questions","Questions a week later"], "«The difference appears in questions about concepts»."],
  ["What is the speaker's main advice?", ["Whatever you use, put ideas in your own words","Always take notes by hand rather than typing","Stop using laptops in class altogether","Type everything so that nothing is missed"], "«resist the temptation to copy everything, and to put things in your own words»."]]},

{ id:'c07', l:3, k:'weather', t:"Looking further ahead to next week, the picture is less certain than usual. Most computer models suggest that high pressure will build from the south by Tuesday, bringing several dry, settled days and temperatures a few degrees above average for the time of year. Nights, however, could be quite cold under the clear skies, with a risk of frost in sheltered valleys. At the same time, a minority of models keep a slow-moving area of low pressure close to the north-west, which would mean cloud and showers there, possibly lasting until Thursday. On balance, the south and east look most likely to stay dry, while the north-west is the area where the forecast could change. If you are planning outdoor events up there, it would be wise to check again on Sunday, when we should have a much clearer idea.", q:[

{ id:'c09', l:3, k:'talk', t:"Before we go inside the castle, a word about what you're about to see. Much of what visitors think is medieval was actually built in the 1890s, when the owner, a wealthy businessman, decided the ruins weren't romantic enough. He added the towers you can see on the left, the great hall, and most of the furniture, all designed to look five hundred years older than it was. His builders even reused stone from a ruined church nearby, which makes dating some of the walls surprisingly difficult. For a long time, historians dismissed this as a fake. Today we're more generous. The Victorian rebuilding tells us a lot about how people in that period imagined the Middle Ages, and the original walls, which you'll see in the courtyard, are still here underneath it all. So enjoy the great hall, but do keep an eye out for the older stones.", q:[

{ id:'c12', l:3, k:'news', t:"A new study suggests that households throw away nearly a fifth of the food they buy, and that the biggest single cause is not cooking too much but buying too much. Researchers followed four hundred families for a year and found that those who wrote a shopping list and checked their fridge before going out wasted about thirty percent less. The families also kept a diary of everything they threw away, and bread, salad and fruit were the items wasted most often. Interestingly, special offers such as 'buy one, get one free' made things worse, because the extra items were often forgotten until they went off. The researchers don't blame the shops alone, though. 'Offers aren't the problem in themselves,' said the lead author. 'The problem is that we treat a bargain as a reason to buy, rather than asking whether we'll actually eat it.'", q:[

{ id:'c15', l:3, k:'talk', t:"You may have noticed that flying from Europe to North America usually takes longer than the return journey, sometimes by more than an hour. A flight from London to New York, for example, often takes around eight hours, while the flight back can take less than seven. The reason isn't the rotation of the Earth, as many people assume, since the atmosphere rotates with the planet. It's the jet stream: a band of strong wind, often more than two hundred kilometres per hour, which blows from west to east at about the height where airliners cruise. Flying east, pilots try to stay inside it to get a free push. Flying west, they try to avoid it, which can mean taking a route that looks longer on a map but is actually faster. In winter, when the jet stream is usually strongest, the difference between the two directions is greatest.", q:[

const GEN_LEVELS = [null,
  { n:1, name:'Básico',   rate:0.92, eq:3 },
  { n:2, name:'Estándar', rate:1.0,  eq:5 },
  { n:3, name:'Exigente', rate:1.12, eq:7 }
];
const GEN_KINDS = { news:'Noticia', announce:'Anuncio', talk:'Charla', conv:'Conversación', instr:'Instrucciones', weather:'Tiempo', travel:'Viaje' };
function genSpoken(p){ return Array.isArray(p.t) ? p.t.map(function(x){ return x[1]; }).join(' ') : p.t; }
function genWordCount(p){ return genSpoken(p).split(/\s+/).filter(function(w){ return /[A-Za-z0-9]/.test(w); }).length; }
// Transcript lines: one per speaker turn for a conversation, one paragraph otherwise.
function genLines(p){ return Array.isArray(p.t) ? p.t.map(function(x){ return x[0] + ': ' + x[1]; }) : [p.t]; }
// Sentence chunks for speech (short utterances avoid the engines' cut-off on long texts); spk = speaker or ''.
function genChunks(p){
  const out = [];
  const turns = Array.isArray(p.t) ? p.t : [['', p.t]];
  turns.forEach(function(turn, ti){
    const parts = String(turn[1]).split(/(?<=[.!?]['’]?)\s+/).filter(Boolean);
    parts.forEach(function(s, si){ out.push({ text:s, spk:turn[0], gap: si === 0 && ti > 0 ? 450 : 160 }); });
  });
  return out;
}
// Problems of one bank entry (empty list = valid). Used by the tests and, defensively, before building.
function genCheck(p){
  const errs = [];
  if (!p || !p.id) return ['sin id'];
  if (!(p.l >= 1 && p.l <= 3)) errs.push(p.id + ': nivel');
  if (!GEN_KINDS[p.k]) errs.push(p.id + ': tipo');
  const w = genWordCount(p);
  if (w < 60 || w > 170) errs.push(p.id + ': ' + w + ' palabras');
  if (!Array.isArray(p.q) || p.q.length < 3 || p.q.length > 5) errs.push(p.id + ': preguntas');
  (p.q || []).forEach(function(q, i){
    if (!q[0] || !Array.isArray(q[1]) || q[1].length !== 4) { errs.push(p.id + ' Q' + (i + 1) + ': opciones'); return; }
    const norm = q[1].map(function(o){ return String(o).trim().toLowerCase(); });
    if (norm.some(function(o){ return !o; }) || norm.filter(function(o, j){ return norm.indexOf(o) === j; }).length !== 4) errs.push(p.id + ' Q' + (i + 1) + ': opciones repetidas');
    if (!q[2]) errs.push(p.id + ' Q' + (i + 1) + ': explicación');
  });
  return errs;
}
// Builds the playable form: options shuffled, correctIndex points at the option written first in the bank.
function genBuild(p, rnd){
  return { id:p.id, kind:p.k, level:p.l, lines:genLines(p), chunks:genChunks(p), words:genWordCount(p),
    qs: p.q.map(function(q){
      const order = shuffle(rnd, [0, 1, 2, 3]);
      return { q:q[0], options:order.map(function(i){ return q[1][i]; }), correctIndex:order.indexOf(0), why:q[2] };
    }) };
}
// Picks n passages of a level: never-seen first, then the least recently seen; random among equals.
function genPick(bank, level, n, seen, rnd){
  const pool = shuffle(rnd, bank.filter(function(p){ return p.l === level; }));
  const rank = function(p){ return (seen || []).lastIndexOf(p.id); };
  pool.sort(function(a, b){ return rank(a) - rank(b); });
  return pool.slice(0, Math.max(1, Math.min(n, pool.length)));
}
// Reading-practice time for a passage: the time the voice would take (about 160 words a minute at 1.0x) plus 5 s.
function genReadSec(words, rate){ return Math.round(words / (160 * (rate || 1)) * 60) + 5; }
// Voice gender guessed from the installed voice name, used only to give the two people of a conversation different voices.
function voiceGender(v){
  const n = (v && v.name) || '';
  if (/female|woman|zira|hazel|susan|libby|sonia|jenny|aria|samantha|karen|moira|tessa|fiona|serena|victoria|kate|emma|amy|natasha|clara|catherine|linda|olivia|ava|allison|joanna|kimberly|salli|nicole|michelle|heera|maisie|ana\b/i.test(n)) return 'f';
  if (/\bmale\b|\bman\b|david|mark|george|ryan|guy|daniel|alex|fred|oliver|thomas|james|william|brian|matthew|justin|joey|russell|ravi|sean|liam|eric|christopher|roger|richard|arthur|rishi/i.test(n)) return 'm';
  return '';
}
// Voice and pitch for a speaker: the chosen voice for a monologue; in a conversation a voice of the speaker's
// gender if one is installed, otherwise the chosen voice with a raised or lowered pitch.
function genVoiceFor(spk, chosen, voices){
  if (!spk) return { v:chosen, pitch:1 };
  const want = /^wom/i.test(spk) ? 'f' : (/^man/i.test(spk) ? 'm' : '');
  if (!want || voiceGender(chosen) === want) return { v:chosen, pitch:1 };
  const alt = (voices || []).filter(function(x){ return voiceGender(x) === want; });
  const best = alt.filter(function(x){ return chosen && x.lang === chosen.lang; })[0] || alt[0];
  if (best) return { v:best, pitch:1 };
  return { v:chosen, pitch: want === 'f' ? 1.25 : 0.8 };
}
// Score of a finished session. answers[i][j] = chosen option index or undefined (blank).
function genScore(items, answers){
  let correct = 0, wrong = 0, blank = 0;
  items.forEach(function(it, i){ it.qs.forEach(function(q, j){ const a = answers[i] ? answers[i][j] : undefined; if (a === undefined || a === null) blank++; else if (a === q.correctIndex) correct++; else wrong++; }); });
  return { correct:correct, wrong:wrong, blank:blank, total:correct + wrong + blank };
}

/* ---------- CSV / goal / records ---------- */
function csvField(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function dateEU(iso){
  const d = new Date(iso);
  return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function toCSV(sessions){
  const head = ['Date','Module','Level','Correct','Wrong','Blank','Seconds per item','Accuracy %','Goal','Met'];
  const rows = sessions.map(function(s){
    return [dateEU(s.ts), s.module, s.level, s.correct, s.wrong, s.blank,
      (s.spi === null || s.spi === undefined) ? '' : fmt(s.spi, 2), fmt(s.accuracy, 1), s.goal || '',
      s.met === true ? 'Yes' : (s.met === false ? 'No' : '')].map(csvField).join(';');
  });
  return '﻿' + [head.join(';')].concat(rows).join('\r\n') + '\r\n';
}
function evaluateGoal(text, r){
  const t = String(text || '').replace(/\s+/g, ' ');
  const num = function(x){ return parseFloat(x.replace(',', '.')); };
  let res = null;
  const mp = t.match(/(\d+(?:[.,]\d+)?)\s*%/);
  if (mp) res = r.accuracy >= num(mp[1]);
  const ms = t.match(/(\d+(?:[.,]\d+)?)\s*(?:seconds|second|secs|sec|segundos|segundo|segs|seg|s)(?![a-zá-ú])/i);
  if (ms && r.spi !== null && r.spi !== undefined){ const ok = r.spi <= num(ms[1]); res = res === null ? ok : (res && ok); }
  const mc = t.match(/(\d+)\s*(?:correct|correctas|aciertos)/i);
  if (mc){ const ok = r.correct >= parseInt(mc[1], 10); res = res === null ? ok : (res && ok); }
  return res;
}
function personalBest(sessions, level, module){
  const s = sessions.filter(function(x){ return x.level === level && x.module === module && x.accuracy >= ADAPT_TARGET; });
  if (!s.length) return { n:0 };
  let bestAcc = s[0], bestSpi = s[0];
  s.forEach(function(x){
    if (x.accuracy > bestAcc.accuracy) bestAcc = x;
    if (x.spi !== null && x.spi !== undefined && (bestSpi.spi === null || bestSpi.spi === undefined || x.spi < bestSpi.spi)) bestSpi = x;
  });
  return { n:s.length, bestAcc:bestAcc.accuracy, bestSpi:bestSpi.spi };
}
function currentStreak(sessions, module){
  let streak = 0;
  for (let i = sessions.length - 1; i >= 0; i--){
    if (sessions[i].module !== module) continue;
    if (sessions[i].accuracy >= ADAPT_TARGET) streak++; else break;
  }
  return streak;
}

/* ---------- Voice selection / no-voice fallback ---------- */
function pickEnglishVoices(voices){
  return (voices || []).filter(function(v){ return /^en(-|_|$)/i.test(v.lang || ''); });
}
function chooseVoice(englishVoices, wantAccentVariety, seedIndex){
  if (!englishVoices || !englishVoices.length) return null;
  if (!wantAccentVariety || englishVoices.length === 1) return englishVoices[0];
  const locales = {};
  englishVoices.forEach(function(v){ const loc = (v.lang || '').toLowerCase(); if (!locales[loc]) locales[loc] = v; });
  const distinct = Object.keys(locales).map(function(k){ return locales[k]; });
  return distinct[seedIndex % distinct.length];
}
// ~150 wpm at rate 1.0, used for the word-by-word visual fallback timer.
function wordDelayMs(rate){ return Math.max(160, Math.round(60000 / (150 * (rate || 1)))); }

function tmr(t){ timers.push(t); return t; }

/* ---------- Speech engine: real TTS with noise, or visual word-by-word fallback ---------- */
const Speech = { ready:false, englishVoices:[], hasVoice:false, forcedVisual:false, failures:0, cur:null };
function refreshVoices(){
  try { Speech.englishVoices = pickEnglishVoices(speechSynthesis.getVoices()); } catch (e) { Speech.englishVoices = []; }
  Speech.hasVoice = Speech.englishVoices.length > 0;
}
function initSpeech(cb){
  let synth = null;
  try { synth = ('speechSynthesis' in window) ? window.speechSynthesis : null; } catch (e) { synth = null; }
  if (!synth){ Speech.ready = true; Speech.hasVoice = false; cb(); return; }
  let called = false;
  const finish = function(){ refreshVoices(); Speech.ready = true; if (!called){ called = true; cb(); } };
  try {
    // Chrome loads its voice list asynchronously and may report it after our first look, so keep listening.
    speechSynthesis.onvoiceschanged = function(){ const had = Speech.hasVoice; refreshVoices(); Speech.ready = true; if (!called){ called = true; cb(); } else if (Speech.hasVoice !== had && app.querySelector('.card')) menu(); else if (Speech.hasVoice !== had && $('genCfg')) genConfig(); };
    if (speechSynthesis.getVoices().length){ finish(); return; }
  } catch (e) { Speech.ready = true; Speech.hasVoice = false; cb(); return; }
  setTimeout(finish, 500);
}
function useVisualFallback(){ return Speech.forcedVisual || !Speech.hasVoice || Speech.failures >= 2; }
function ensureAudioCtx(){
  if (audioCtx){ try { if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} return audioCtx; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
  return audioCtx;
}
function startNoise(level){
  if (!level || level <= 0) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  try {
    const bufSize = 2 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    noiseNode = ctx.createBufferSource(); noiseNode.buffer = buf; noiseNode.loop = true;
    noiseGain = ctx.createGain(); noiseGain.gain.value = Math.min(0.6, level) * 0.25;
    noiseNode.connect(noiseGain); noiseGain.connect(ctx.destination);
    noiseNode.start();
  } catch (e) { /* Web Audio unavailable: silently skip the noise layer */ }
}
// Speaks `words` (array of strings). Calls onDone() exactly once, when the item has been spoken or
// (visual fallback) when the last word has been shown. If the speech engine is missing, silent or
// broken (no start event within 3 s, an error, or no end event), the item falls back to the visual
// word-by-word display instead of hanging. `accentSeed` rotates the voice when the level wants accent variety.
function speakItem(words, level, accentSeed, onWord, onDone){
  // Late callbacks from an old utterance must not touch a screen that has already moved on:
  // clear() bumps genCounter, and every callback below checks it.
  const myGen = genCounter;
  let finished = false, fellBack = false;
  const done = function(){ if (finished || myGen !== genCounter) return; finished = true; stopAudio(); onDone(); };
  const visual = function(){
    if (fellBack || finished || myGen !== genCounter) return;
    fellBack = true; stopAudio();
    let i = 0;
    const delay = wordDelayMs(level.rate);
    (function step(){
      if (myGen !== genCounter || finished) return;
      if (i >= words.length){ done(); return; }
      onWord('', i); // a short blank gap: two identical words in a row ("Tree Tree") must look like two words
      tmr(setTimeout(function(){ if (myGen !== genCounter || finished) return; onWord(words[i], i); i++; tmr(setTimeout(step, delay)); }, 130));
    })();
  };
  if (useVisualFallback()){ visual(); return; }
  startNoise(level.noise);
  let started = false;
  const fail = function(){
    if (finished || fellBack || myGen !== genCounter) return;
    try { speechSynthesis.cancel(); } catch (e) {}
    Speech.failures++;
    visual();
  };
  try {
    const u = new SpeechSynthesisUtterance(toTTS(words).join(' '));
    Speech.cur = u; // keep a reference: Chrome can garbage-collect a running utterance and never fire onend
    const voice = chooseVoice(Speech.englishVoices, level.accent, accentSeed || 0);
    if (voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-GB'; }
    u.rate = Math.max(0.5, Math.min(2, level.rate));
    u.onstart = function(){ started = true; };
    u.onend = function(){ if (!fellBack) done(); };
    u.onerror = function(){ if (myGen !== genCounter || finished) return; if (started) done(); else fail(); };
    tmr(setTimeout(function(){ if (!started) fail(); }, 3000));
    tmr(setTimeout(function(){ if (started && !finished && !fellBack) done(); }, 5000 + words.length * wordDelayMs(level.rate) * 2.5)); // safety net if onend never arrives
    speechSynthesis.cancel();
    tmr(setTimeout(function(){ if (myGen !== genCounter || finished || fellBack) return; try { speechSynthesis.speak(u); } catch (e) { fail(); } }, 60));
  } catch (e) { fail(); }
}

/* ---------- Endurance (wave 5, schema coord/SCHEMA-thirds.md): identical copy in every game ---------- */
function atcThirds(results, durationSec){
  var N = results ? results.length : 0; if (N < 9) return null;
  var g = [{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0}];
  for (var i = 0; i < N; i++){ var r = results[i]; var k = durationSec > 0 ? Math.min(2, Math.floor(Math.max(0, +r.t || 0) * 3 / durationSec)) : Math.min(2, Math.floor(i * 3 / N));
    g[k].n++; if (r.blank) g[k].b++; else if (r.ok) g[k].c++; g[k].s += (isFinite(+r.sec) ? +r.sec : 0); }
  for (var j = 0; j < 3; j++) g[j].s = Math.round(g[j].s * 100) / 100;
  return g;
}
function atcEnduranceLine(th){
  if (!th) return '';

  passage.questions.forEach(function(q, i){ const r = qResults[i]; state.thirdRes.push({ ok:r === true, blank:r === undefined, sec:(ms / 1000) / Math.max(1, passage.questions.length), t:0 }); });

  state.adaptBlock.push(passage.questions.length > 0 && ok === passage.questions.length);
  state.idx++;
  if (state.run.mode === 'adaptive' && state.adaptBlock.length >= state.run.block){
    const br = adaptBlockResult(state.adaptBlock);
    const step = adaptStep(state.adaptState, br, state.run.need);
    state.adaptState = step; state.adaptBlock = [];
    if (step.ev){
      state.levelBanner = step.ev === 'up' ? 'Subes de nivel: L' + step.level + ' ' + LEVELS[step.level].name
        : step.ev === 'down' ? 'Bajas de nivel: L' + step.level + ' ' + LEVELS[step.level].name : 'Nivel 10 superado';

function finishPassage(state){

  const kinds = Object.keys(state.missKinds).sort(function(a, b){ return state.missKinds[b] - state.missKinds[a]; });
  const reviewHtml = '<h2>Revisión</h2><div class="tbox"><table><tr><th>#</th><th>Tipo</th><th>Correctas</th><th>Incorrectas</th></tr>' +
    state.reviewRows.map(function(r, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(KIND_ES[r.kind] || r.kind) + '</td><td>' + r.ok + '</td><td>' + r.wrong + '</td></tr>'; }).join('') + '</table></div>' +
    (kinds.length ? '<h3>Transcripciones</h3>' + state.misses.slice(0, 12).map(function(m){ return '<div class="hint"><b>#' + m.n + ' ' + esc(m.label) + ':</b> ' + esc(m.text) + '</div>'; }).join('') : '<p class="good">Sin fallos</p>') +
    (state.levelBanner ? '<p class="notice">' + esc(state.levelBanner) + '</p>' : '');

    rate:state.rate, replays:state.replays, thirds:atcThirds(state.thirdRes, 0), goal:state.run.goal, dualOk:state.dualOk, dualTotal:state.dualTotal,
    reviewHtml:reviewHtml, repeat:function(){ config('passage'); } });
}

/* ================= MODULE 3: GENERAL-ENGLISH COMPREHENSION (FEAST English listening) =================
   One play per passage, no replay; questions after the passage; no right/wrong marks until the review.
   Stored in the same sessions list; comp:'general' marks these sessions, cl = level 1-3, and level holds the
   equivalent rung of the 10-level ladder (3 / 5 / 7) that the dashboard and "Siguiente" already read.
   Reading practice (no English voice) is stored with mode 'reading', level null and count:false so that it
   never counts as listening. */
const GEN_TARGET = 90;
function genPrefs(){
  const d = load();
  if (!d.comp || typeof d.comp !== 'object' || Array.isArray(d.comp)) d.comp = {};
  const c = d.comp;
  if (!(c.cl >= 1 && c.cl <= 3)) c.cl = 2;
  if (!(c.n >= 1 && c.n <= 15)) c.n = 4;
  if (!Array.isArray(c.seen)) c.seen = [];
  return c;
}
function genAudio(){ return Speech.ready && !useVisualFallback(); }
function genSummary(){
  const d = load(), c = genPrefs();
  const ses = d.sessions.filter(function(s){ return s.comp === 'general'; });
  if (!ses.length) return 'N' + c.cl;
  const u = ses[ses.length - 1];
  return 'N' + c.cl + ' · ' + ses.length + (ses.length === 1 ? ' sesión' : ' sesiones') + ' · última ' + fmt(u.accuracy, 1) + ' %';
}
function genChosenVoice(idx){ const v = Speech.englishVoices; return v[idx] || v[0] || null; }
// Speaks the chunks one after another. onDone once at the end; onFail if the engine never starts (the caller then
// switches the item to reading). A chunk whose end event never arrives is closed by a timer so the item cannot hang.
function genSpeak(chunks, chosen, rate, onProg, onDone, onFail){
  const myGen = genCounter;
  let i = 0, startedAny = false, over = false;
  const alive = function(){ return myGen === genCounter && !over; };
  const fail = function(){ if (!alive()) return; over = true; try { speechSynthesis.cancel(); } catch (e) {} Speech.failures++; onFail(); };
  const next = function(){
    if (!alive()) return;
    if (i >= chunks.length){ over = true; onDone(); return; }
    const idx = i, ch = chunks[idx];
    let started = false, ended = false;
    onProg(idx, chunks.length);
    const end = function(){ if (ended || !alive() || idx !== i) return; ended = true; i++; tmr(setTimeout(next, ch.gap)); };
    let u;
    try { u = new SpeechSynthesisUtterance(ch.text); } catch (e) { fail(); return; }
    Speech.cur = u; // keep a reference: Chrome can garbage-collect a running utterance and never fire onend
    const vf = genVoiceFor(ch.spk, chosen, Speech.englishVoices);
    try { if (vf.v){ u.voice = vf.v; u.lang = vf.v.lang; } else u.lang = 'en-GB'; } catch (e) { u.lang = 'en-GB'; }
    u.rate = Math.max(0.5, Math.min(2, rate)); u.pitch = vf.pitch;
    u.onstart = function(){ started = true; startedAny = true; };
    u.onend = end;
    u.onerror = function(){ if (!alive()) return; if (startedAny) end(); else fail(); };
    if (!startedAny) tmr(setTimeout(function(){ if (!started && alive() && idx === i) fail(); }, 3000));
    tmr(setTimeout(function(){ if (alive() && idx === i && !ended) end(); }, 4000 + ch.text.split(/\s+/).length * wordDelayMs(rate) * 2.5));
    try { speechSynthesis.speak(u); } catch (e) { fail(); }
  };
  try { speechSynthesis.cancel(); } catch (e) {}
  tmr(setTimeout(next, 60));
}
function genConfig(){

    '<label class="lab" for="glevel">Nivel</label><select id="glevel">' + [1, 2, 3].map(function(l){ return '<option value="' + l + '"' + (l === c.cl ? ' selected' : '') + '>' + l + ' - ' + GEN_LEVELS[l].name + (l === 2 ? ' (objetivo)' : '') + '</option>'; }).join('') + '</select>' +
    (audio
      ? '<label class="lab" for="gvoice">Voz</label><div class="row"><select id="gvoice" style="flex:1 1 200px;width:auto;min-width:0">' + voices.map(function(v, i){ return '<option value="' + i + '"' + (i === vIdx ? ' selected' : '') + '>' + esc(v.name) + ' (' + esc(v.lang) + ')</option>'; }).join('') + '</select><button class="btn small" id="gtest" type="button">' + ic('play') + 'Probar</button></div>' +
        '<label class="lab" for="grate">Velocidad <span id="grateV"></span>×</label><input type="range" id="grate" min="0.6" max="1.6" step="0.02">'

    '<p id="err" class="bad" role="alert"></p>' +

  $('back').addEventListener('click', menu);
  const uv = $('useVoice'); if (uv) uv.addEventListener('click', function(){ Speech.forcedVisual = false; Speech.failures = 0; genConfig(); });
  const setRate = function(r){ const g = $('grate'); if (!g) return; g.value = r; $('grateV').textContent = (+g.value).toFixed(2); };
  setRate(GEN_LEVELS[c.cl].rate);

  if ($('grate')) $('grate').addEventListener('input', function(){ $('grateV').textContent = (+this.value).toFixed(2); });
  if ($('gtest')) $('gtest').addEventListener('click', function(){
    const b = $('gtest'); b.disabled = true;
    genSpeak([{ text:'Good morning. This is the voice you will hear in the passages.', spk:'', gap:0 }], genChosenVoice(+$('gvoice').value), +$('grate').value,

  });

    c.cl = cl; c.n = n; if (run.audio && voices[run.voiceIdx]) c.voice = voices[run.voiceIdx].name;

function genStart(run){
  clear();
  sessionActive = true;
  const c = genPrefs();
  const items = genPick(GEN_BANK, run.cl, run.n, c.seen, Math.random).filter(function(p){ return genCheck(p).length === 0; }).map(function(p){ return genBuild(p, Math.random); });
  genItem({ run:run, items:items, idx:0, answers:[], read:[], activeMs:0, thirdRes:[] });
}
function genItem(state){
  clear();
  const it = state.items[state.idx];
  const audio = state.run.audio && !useVisualFallback();
  const ans = [];
  let phase = 'ready', shown = false;
  const t0 = performance.now();
  screen(
    '<div class="head"><span>Pasaje <b>' + (state.idx + 1) + '</b> / ' + state.items.length + '</span><span>' + esc(GEN_KINDS[it.kind]) + '</span><span>' + (audio ? '1 escucha' : 'Lectura') + '</span><button class="link" id="quit" type="button">Salir</button></div>' +
    '<div class="bar"><div style="width:' + (state.idx / state.items.length * 100) + '%"></div></div>' +
    '<div class="playbox" id="pbox"></div>' +
    '<p class="keys"><span class="key">Enter</span> ' + (audio ? 'escuchar' : 'leer') + ' / siguiente · <span class="key">A-D</span> responder · <span class="key">Esc Esc</span> salir</p>' +
    '<div id="qs"></div>'
  );

  const box = $('pbox');
  function readyBox(isAudio){
    box.innerHTML = ic(isAudio ? 'headphones' : 'doc', 'big') + '<div class="playword" id="pw" aria-live="polite">' + esc(GEN_KINDS[it.kind]) + '</div>' +
      '<div class="bar gbar"><div id="pbar"></div></div>' +
      '<button class="btn primary" id="play" style="margin-top:10px">' + ic('play') + (isAudio ? 'Escuchar' : 'Leer') + '</button>';

  }
  function listen(){
    if (phase !== 'ready') return;

    box.innerHTML = ic('headphones', 'big') + '<div class="playword" id="pw" aria-live="polite">Escuchando</div><div class="bar gbar"><div id="pbar"></div></div>';
    genSpeak(it.chunks, genChosenVoice(state.run.voiceIdx), state.run.rate,
      function(i, n){ const b = $('pbar'); if (b) b.style.width = (i / n * 100) + '%'; },
      function(){ const b = $('pbar'); if (b) b.style.width = '100%'; const w = $('pw'); if (w) w.textContent = 'Fin'; showQuestions(); },
      function(){ state.read[state.idx] = true; phase = 'ready'; startReading(); });
  }
  function startReading(){
    if (phase === 'reading' || shown) return;
    phase = 'reading'; state.read[state.idx] = true;
    let left = genReadSec(it.words, state.run.rate);
    box.innerHTML = '<div class="playword small" id="pw"><span id="tleft">' + left + '</span> s</div>' +
      '<div class="ptext">' + it.lines.map(esc).join('<br>') + '</div>' +
      '<button class="btn primary" id="toQs">' + ic('arrow') + 'Preguntas</button>';

        q.options.map(function(o, oi){ return '<button class="optBtn" aria-pressed="false" data-q="' + qi + '" data-o="' + oi + '"><b>' + 'ABCD'[oi] + ')</b> ' + esc(o) + '</button>'; }).join('') +
        '</div></div>';
    }).join('') + '<p class="row"><button class="btn primary" id="next">' + ic('arrow') + (state.idx + 1 < state.items.length ? 'Siguiente' : 'Terminar') + '</button></p>';
    Array.prototype.forEach.call($('qs').querySelectorAll('.optBtn'), function(b){ b.addEventListener('click', function(){ choose(+b.dataset.q, +b.dataset.o); }); });

          '<p class="soft small">' + esc(q.why) + '</p></div>';

  screen(
    '<h1>' + MODULES_ES.general + '</h1>' +
    '<p class="soft">N' + run.cl + ' ' + GEN_LEVELS[run.cl].name + ' · ' + (listened ? fmt(run.rate, 2) + '× · 1 escucha' : 'lectura') + '</p>' +
    '<div class="figures">' +
      '<div class="figure"><b>' + sc.correct + '</b><span>Correctas</span></div>' +
      '<div class="figure"><b>' + sc.wrong + '</b><span>Incorrectas</span></div>' +
      '<div class="figure"><b>' + sc.blank + '</b><span>En blanco</span></div>' +
      '<div class="figure"><b class="' + (accuracy >= GEN_TARGET ? 'good' : 'bad') + '">' + fmt(accuracy, 1) + ' %</b><span>Precisión</span></div>' +
      '<div class="figure"><b>' + fmt(spi, 1) + '</b><span>s por pregunta</span></div>' +

    '<tr><td>Tendencia</td><td><code>↑</code> ascenso, <code>↓</code> descenso, <code>→</code> directo</td></tr>' +
    '<tr><td>Abreviaturas</td><td><code>hdg</code> <code>clrd</code> <code>twy</code> <code>appr</code> <code>sqwk</code> <code>c/s</code></td></tr></table></div>' +
    '<h2>Bajo carga</h2><ul><li>Anota el indicativo en cuanto lo captes.</li><li>Si pierdes un dígito, deja un guion y sigue escuchando.</li><li>Orden de la colación: nivel, rumbo, QNH, pista, frecuencia, código transpondedor.</li></ul>'
  );
  $('back').addEventListener('click', menu);
}
/* ---------- History and CSV ---------- */
function historyPage(){
  clear(); sessionActive = false;
  const d = load();
  const rows = d.sessions.slice(-60).reverse();
  screen(
    '<button class="link" id="back">' + ic('back') + 'Menú</button><h1>Historial</h1>' +
    (rows.length ? '' : '<p class="soft">Sin sesiones</p>') +
    (rows.length ? '<div class="tbox"><table><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Aciertos</th><th>Errores</th><th>Blanco</th><th>s/ítem</th><th>Precisión</th><th>Objetivo</th><th>Cumplido</th></tr>' +
      rows.map(function(s){ return '<tr><td>' + dateEU(s.ts) + '</td><td class="mod">' + esc(modES(s.module)) + '</td><td>' + (s.comp === 'general' ? 'N' + esc(s.cl) + (s.mode === 'reading' ? ' lectura' : '') : (s.level || 'personalizado')) + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td><td>' + s.blank + '</td><td>' + fmt(s.spi,2) + '</td><td>' + fmt(s.accuracy,1) + ' %</td><td>' + esc(s.goal||'') + '</td><td>' + (s.met === true ? 'Sí' : s.met === false ? 'No' : '—') + '</td></tr>'; }).join('') +
      '</table></div>' : '') +
    '<p class="row" style="margin-top:12px"><button class="btn primary" id="csv">' + ic('download') + 'Exportar</button><button class="btn danger" id="clr">' + ic('trash') + 'Borrar</button></p>'
  );
  $('back').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    const blob = new Blob([toCSV(d.sessions)], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'atc-listening-history.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $('clr').addEventListener('click', function(){
    if (!confirm('¿Borrar el historial?')) return;
    d.sessions = []; save(); historyPage();
  });
}
/* ---------- Boot ---------- */
menu();
initSpeech(function(){ if (!onKey || app.querySelector('.card')) menu(); });
</script>
