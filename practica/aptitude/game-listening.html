<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprensión auditiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4d8f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9.2'/%3E%3Ccircle cx='12' cy='12' r='4.6'/%3E%3Cpath d='M12 12L19 6.2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --soft:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --on-accent:#ffffff; --good:#2d6a3e; --bad:#a3241c; --warn:#b3450d;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --soft:#a19c90; --rule:#3a3935;
  --accent:#7fb0e8; --accent-h:#a4c6ef; --on-accent:#161615; --good:#7cbf8a; --bad:#e5766d; --warn:#e08a55;
}}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45}
#app{max-width:920px;margin:0 auto;padding:20px 16px 56px}
h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;margin:0 0 .5rem;font-weight:700}
h2{font-family:var(--serif);font-size:1.3rem;margin:1.6rem 0 .6rem;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:700}
h3{font-family:var(--serif);font-size:1.05rem;margin:1.1rem 0 .3rem;font-weight:700}
p{margin:.4rem 0}
.soft{color:var(--soft)} .small{font-size:.85rem}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.center{text-align:center}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .i{width:34px;height:34px;color:var(--accent);stroke-width:1.5}
.brand h1{margin:0}
.list{border-top:2px solid var(--text);margin:14px 0}
.card{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:16px 4px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.card:hover{background:var(--stripe)}
.card .i.lead{width:30px;height:30px;color:var(--accent)}
.card .nm{font-family:var(--serif);font-size:1.3rem;font-weight:700;flex:1}
.card .data{color:var(--soft);font-size:.86rem;text-align:right}
.card .go{color:var(--accent)}
button,select,input{font:inherit}
.btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;transition:background-color .12s,color .12s}
.btn:hover:not(:disabled){background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);color:var(--on-accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:4px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 0;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--accent-h);text-decoration:underline}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;min-height:42px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:auto;min-height:auto;vertical-align:middle}
input:focus-visible,select:focus-visible,.btn:focus-visible,.card:focus-visible,.link:focus-visible,.optBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.lab{display:block;margin:.9rem 0 .3rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.row>*{flex:0 0 auto}
.figures{display:flex;flex-wrap:wrap;margin:.8rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.figure{padding:10px 26px 10px 0}
.figure b{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1.1}
.figure span{color:var(--soft);font-size:.82rem}
.bar{height:3px;background:var(--stripe);margin:.5rem 0}
.bar>div{height:100%;background:var(--accent);width:0}
.fb{min-height:2.2rem;font-size:1.05rem;margin-top:.6rem}
.head{display:flex;flex-wrap:wrap;gap:4px 24px;color:var(--soft);font-size:.9rem}
.head b{color:var(--text)}
.head .link{margin-left:auto;padding:0 4px;min-width:40px;justify-content:center}
.notice{font-weight:700;margin:.5rem 0}
.hint{border-top:1px solid var(--rule);color:var(--soft);padding:8px 0;margin:.5rem 0}
.hint code{background:var(--stripe);padding:1px 6px;border-radius:2px}
.tbox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;border-top:1px solid var(--text);border-bottom:1px solid var(--text)}
th,td{border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--soft);font-weight:600;font-size:.82rem}
tr.me td{font-weight:700}
td.mod{white-space:normal;min-width:180px}
.playbox{border-top:2px solid var(--text);border-bottom:1px solid var(--rule);padding:22px 0;text-align:center;margin:.8rem 0}
.playbox .i.big{width:36px;height:36px;color:var(--accent)}
.playword{font-family:var(--serif);font-size:2.1rem;font-weight:700;min-height:2.6rem;letter-spacing:.02em}
.keys{color:var(--soft);font-size:.8rem;text-align:center}
@media (pointer:coarse){.keys{display:none}}
.elems{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;margin:.8rem 0}
.elemBox label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:4px}
.dual{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:1px solid var(--rule);padding:0 0 10px;margin:0 0 10px}
.dual input{width:140px;min-height:38px}
.passageQ{border-top:1px solid var(--rule);padding:12px 0}
.optsList{display:grid;gap:6px;margin-top:.5rem}
.optBtn{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:9px 12px;min-height:44px;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.optBtn:hover:not(:disabled){border-color:var(--accent)}
.optBtn.ok{border-color:var(--good);color:var(--good);font-weight:700}
.optBtn.bad{border-color:var(--bad);color:var(--bad)}
.optBtn:disabled{color:var(--text);cursor:default}
.optBtn.ok:disabled{color:var(--good)} .optBtn.bad:disabled{color:var(--bad)}
.key{display:inline-block;padding:0 6px;border:1px solid var(--rule);border-radius:2px;font-size:.78rem;background:var(--surface);color:var(--text)}
.voice{color:var(--soft);font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:10px 0}
.voice .link{padding:2px 8px;font-size:.86rem}
#toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:2px;z-index:10;max-width:90vw}
.tags{margin:.4rem 0;color:var(--soft)}
.tags b{color:var(--text)}
@media (max-width:640px){
  html{font-size:16px}
  #app{padding:14px 16px 44px}
  h1{font-size:1.6rem}
  .playword{font-size:1.5rem}
  .card .data{display:none}
  .figure{padding-right:18px}
}
</style>
</head>

<script>

// ==== PURE LOGIC START ====
/* ---------- RNG helpers ---------- */
function randInt(rnd, a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function pick(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(rnd, arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function fmt(x, d){ if (x === null || x === undefined || isNaN(x)) return '—'; return Number(x).toFixed(d === undefined ? 1 : d); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function padN(n, len){ let s = String(n); while (s.length < len) s = '0' + s; return s; }

/* ---------- ICAO alphabet and aviation number words (CAP 413, sec. 2.12) ---------- */
const ICAO_ALPHA = { A:'Alfa', B:'Bravo', C:'Charlie', D:'Delta', E:'Echo', F:'Foxtrot', G:'Golf', H:'Hotel',
  I:'India', J:'Juliett', K:'Kilo', L:'Lima', M:'Mike', N:'November', O:'Oscar', P:'Papa', Q:'Quebec',
  R:'Romeo', S:'Sierra', T:'Tango', U:'Uniform', V:'Victor', W:'Whiskey', X:'X-ray', Y:'Yankee', Z:'Zulu' };
const ICAO_LETTERS = Object.keys(ICAO_ALPHA);
const NUM_WORD = ['Zero','Wun','Too','Tree','Fower','Fife','Six','Seven','Ait','Niner'];
function digitsToWords(str){ return String(str).split('').map(function(c){ return NUM_WORD[+c]; }); }
// Text-to-speech engines mispronounce the ICAO respellings (Wun, Too, Fower, Fife, Ait...), so the
// synthesiser gets ordinary English digit words; the visual fallback and the Tips page keep the ICAO forms.
const TTS_WORD = { Zero:'zero', Wun:'one', Too:'two', Tree:'three', Fower:'four', Fife:'five', Six:'six', Seven:'seven', Ait:'eight', Niner:'nine', Juliett:'Juliet', 'X-ray':'X ray', Decimal:'decimal' };
function toTTS(words){ return words.map(function(w){ return TTS_WORD[w] || w; }); }
const DIGIT_EN = ['zero','one','two','three','four','five','six','seven','eight','nine'];
function say(str){ return String(str).split('').map(function(c){ return /\d/.test(c) ? DIGIT_EN[+c] : c; }).join(' '); } // "1013" -> "one zero one three"
function ordinal(n){ const m = n % 100; if (m >= 11 && m <= 13) return n + 'th'; const r = n % 10; return n + (r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th'); }
function sayRunway(r){ const side = /[LCR]$/.test(r) ? { L:'left', C:'centre', R:'right' }[r.slice(-1)] : ''; return say(r.replace(/[LCR]$/, '')) + (side ? ' ' + side : ''); }
function sayNum(n){ return n < 0 ? 'minus ' + Math.abs(n) : String(n); }
function octal4(rnd){ let s = ''; for (let i = 0; i < 4; i++) s += String(randInt(rnd, 0, 7)); return s; }

const AIRLINES = [
  ['Speedbird','BAW'], ['Ryanair','RYR'], ['Vueling','VLG'], ['Iberia','IBE'], ['Easy','EZY'],
  ['Norshuttle','NOZ'], ['Lufthansa','DLH'], ['Airfrans','AFR'], ['Klim','KLM'], ['Shamrock','EIN'],
  ['Wizzair','WZZ'], ['Jetstream','TOM']
];

/* ---------- Element generators (single dictation items) ---------- */
function normAns(s){ return String(s || '').toUpperCase().replace(/[\s\-.]/g, ''); }

function genCallsign(rnd){
  if (rnd() < 0.5){
    const letters = [pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS), pick(rnd, ICAO_LETTERS)];
    const spoken = ['Golf'].concat(letters.map(function(l){ return ICAO_ALPHA[l]; }));
    const answer = 'G' + letters.join('');
    return { kind:'callsign', sub:'registration', spoken:spoken, label:'Matrícula de aeronave', answer:answer,
      accept:function(v){ return normAns(v) === normAns(answer) || normAns(v) === normAns('G-' + letters.join('')); },
      display:'G-' + letters.join('') };
  }
  const al = pick(rnd, AIRLINES);
  const n = randInt(rnd, 1, 4);
  let digs = '';
  for (let i = 0; i < n; i++) digs += String(randInt(rnd, 0, 9));
  const spoken = [al[0]].concat(digitsToWords(digs));
  const answer = al[0].toUpperCase() + ' ' + digs;
  return { kind:'callsign', sub:'airline', spoken:spoken, label:'Indicativo', answer:answer,
    accept:function(v){ return normAns(v) === normAns(answer); }, display:al[0] + ' ' + digs };
}
function genHeading(rnd){
  const v = randInt(rnd, 1, 360);
  const s = padN(v, 3);
  return { kind:'heading', spoken:digitsToWords(s), label:'Rumbo (3 dígitos)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s };
}
function genFlightLevel(rnd){
  const v = randInt(rnd, 10, 41) * 10;
  const s = padN(v, 3);
  return { kind:'flightlevel', spoken:digitsToWords(s), label:'Nivel de vuelo (3 dígitos, sin «FL»)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:'FL' + s };
}
function genAltimeter(rnd){
  const v = randInt(rnd, 950, 1050);
  const s = padN(v, 4);
  return { kind:'altimeter', spoken:digitsToWords(s), label:'QNH (4 dígitos, hPa)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s + ' hPa' };
}
function genFrequency(rnd){
  const whole = randInt(rnd, 118, 136);
  const decOpts = ['005','010','025','050','075','100','125','150','175','200','225','250','275','300','325','350','375','400','425','450','475','500','525','550','575','600','625','650','675','700','725','750','775','800','825','850','875','900','925','950','975'];
  const dec = pick(rnd, decOpts);
  const s = whole + '.' + dec;
  const spoken = digitsToWords(String(whole)).concat(['Decimal']).concat(digitsToWords(dec));
  return { kind:'frequency', spoken:spoken, label:'Frecuencia (p. ej. 127.350)', answer:s,
    accept:function(x){ const n = normAns(x); return n === normAns(s) || n === normAns(s).slice(1); }, display:s + ' MHz' };
}
function genSquawk(rnd){
  let s = '';
  for (let i = 0; i < 4; i++) s += String(randInt(rnd, 0, 7));
  return { kind:'squawk', spoken:digitsToWords(s), label:'Código transpondedor (4 dígitos octales)', answer:s,
    accept:function(x){ return normAns(x) === s; }, display:s };
}
function genRunway(rnd){
  const v = randInt(rnd, 1, 36);
  const s = padN(v, 2);
  const side = rnd() < 0.4 ? pick(rnd, ['L','C','R']) : '';
  const sideWord = { L:'Left', C:'Centre', R:'Right' }[side] || '';
  const spoken = digitsToWords(s).concat(sideWord ? [sideWord] : []);
  const answer = s + side;
  return { kind:'runway', spoken:spoken, label:'Pista (p. ej. 27 o 27L)', answer:answer,
    accept:function(x){ return normAns(x) === normAns(answer); }, display:answer };
}
const ELEMENT_GENS = { callsign:genCallsign, heading:genHeading, flightlevel:genFlightLevel,
  altimeter:genAltimeter, frequency:genFrequency, squawk:genSquawk, runway:genRunway };
const ELEMENT_KINDS = Object.keys(ELEMENT_GENS);

function connectorFor(kind){
  return { heading:'turn heading', flightlevel:'climb flight level', frequency:'contact on',
    runway:'cleared runway', altimeter:'QNH', squawk:'squawk' }[kind] || 'and';
}
// A "clearance" item chains a callsign with 1+ further elements, connector words spoken
// in between; scored per element (partial credit), as required for the dictation drill.
function genClearanceChain(rnd, nParts){
  nParts = Math.max(2, Math.min(6, nParts || 3));
  const cs = genCallsign(rnd);
  const parts = [cs];
  const kinds = ['heading','flightlevel','frequency','runway','altimeter','squawk'];
  const chosen = shuffle(rnd, kinds).slice(0, nParts - 1);
  chosen.forEach(function(k){ parts.push(ELEMENT_GENS[k](rnd)); });
  let spoken = cs.spoken.slice();
  parts.slice(1).forEach(function(p){ spoken = spoken.concat(connectorFor(p.kind).split(' ')).concat(p.spoken); });
  return { kind:'clearance', parts:parts, spoken:spoken };
}
function makeDictationItem(rnd, chainLen){
  if (chainLen <= 1){
    const kind = pick(rnd, ELEMENT_KINDS);
    const el = ELEMENT_GENS[kind](rnd);
    return { kind:'single', parts:[el], spoken:el.spoken };
  }
  return genClearanceChain(rnd, chainLen);
}
function scoreItem(item, userAnswers){
  let ok = 0, blank = 0;
  const detail = item.parts.map(function(p, i){
    const u = (userAnswers[i] || '').trim();
    const isBlank = u === '';
    const good = !isBlank && p.accept(u);
    if (good) ok++; else if (isBlank) blank++;
    return { kind:p.kind, label:p.label, expected:p.display || p.answer, got:u, ok:good, blank:isBlank };
  });
  const wrong = item.parts.length - ok - blank;
  return { ok:ok, wrong:wrong, blank:blank, total:item.parts.length, detail:detail,
    pct: item.parts.length ? ok / item.parts.length * 100 : 0 };
}

/* ---------- Difficulty ladder (10 levels) ---------- */
const LEVELS = [null,
  { n:1,  name:'Calentamiento',     rate:0.72, replays:3, noise:0.00, accent:false, dual:0, hints:3, chain:1, items:8  },
  { n:2,  name:'Fácil',       rate:0.82, replays:3, noise:0.00, accent:false, dual:0, hints:3, chain:1, items:10 },
  { n:3,  name:'Constante',       rate:0.92, replays:2, noise:0.06, accent:false, dual:0, hints:2, chain:2, items:10 },
  { n:4,  name:'Estándar',     rate:1.00, replays:2, noise:0.10, accent:true,  dual:0, hints:2, chain:2, items:12 },
  { n:5,  name:'Competitivo',  rate:1.05, replays:1, noise:0.16, accent:true,  dual:1, hints:1, chain:3, items:12 },

// Builds one multiple-choice question from data the caller already has; the correct option's

    const wt = formatFn(w);

  }

  const correctIndex = options.indexOf(correctText);
  if (options.filter(function(o){ return o === correctText; }).length !== 1 || correctIndex < 0){

  const mp = t.match(/(\d+(?:[.,]\d+)?)\s*%/);

  const ms = t.match(/(\d+(?:[.,]\d+)?)\s*(?:seconds|second|secs|sec|segundos|segundo|segs|seg|s)(?![a-zá-ú])/i);

  if (!ctx) return;
  try {
    const bufSize = 2 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    noiseNode = ctx.createBufferSource(); noiseNode.buffer = buf; noiseNode.loop = true;
    noiseGain = ctx.createGain(); noiseGain.gain.value = Math.min(0.6, level) * 0.25;
    noiseNode.connect(noiseGain); noiseGain.connect(ctx.destination);
    noiseNode.start();
  } catch (e) { /* Web Audio unavailable: silently skip the noise layer */ }
}
// Speaks `words` (array of strings). Calls onDone() exactly once, when the item has been spoken or
// (visual fallback) when the last word has been shown. If the speech engine is missing, silent or
// broken (no start event within 3 s, an error, or no end event), the item falls back to the visual
// word-by-word display instead of hanging. `accentSeed` rotates the voice when the level wants accent variety.
function speakItem(words, level, accentSeed, onWord, onDone){
  // Late callbacks from an old utterance must not touch a screen that has already moved on:
  // clear() bumps genCounter, and every callback below checks it.
  const myGen = genCounter;
  let finished = false, fellBack = false;
  const done = function(){ if (finished || myGen !== genCounter) return; finished = true; stopAudio(); onDone(); };
  const visual = function(){
    if (fellBack || finished || myGen !== genCounter) return;
    fellBack = true; stopAudio();
    let i = 0;
    const delay = wordDelayMs(level.rate);
    (function step(){
      if (myGen !== genCounter || finished) return;
      if (i >= words.length){ done(); return; }
      onWord('', i); // a short blank gap: two identical words in a row ("Tree Tree") must look like two words
      tmr(setTimeout(function(){ if (myGen !== genCounter || finished) return; onWord(words[i], i); i++; tmr(setTimeout(step, delay)); }, 130));
    })();
  };
  if (useVisualFallback()){ visual(); return; }
  startNoise(level.noise);
  let started = false;
  const fail = function(){
    if (finished || fellBack || myGen !== genCounter) return;
    try { speechSynthesis.cancel(); } catch (e) {}
    Speech.failures++;
    visual();
  };
  try {
    const u = new SpeechSynthesisUtterance(toTTS(words).join(' '));
    Speech.cur = u; // keep a reference: Chrome can garbage-collect a running utterance and never fire onend
    const voice = chooseVoice(Speech.englishVoices, level.accent, accentSeed || 0);
    if (voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-GB'; }
    u.rate = Math.max(0.5, Math.min(2, level.rate));
    u.onstart = function(){ started = true; };
    u.onend = function(){ if (!fellBack) done(); };
    u.onerror = function(){ if (myGen !== genCounter || finished) return; if (started) done(); else fail(); };
    tmr(setTimeout(function(){ if (!started) fail(); }, 3000));
    tmr(setTimeout(function(){ if (started && !finished && !fellBack) done(); }, 5000 + words.length * wordDelayMs(level.rate) * 2.5)); // safety net if onend never arrives
    speechSynthesis.cancel();
    tmr(setTimeout(function(){ if (myGen !== genCounter || finished || fellBack) return; try { speechSynthesis.speak(u); } catch (e) { fail(); } }, 60));
  } catch (e) { fail(); }
}

/* ---------- Endurance (wave 5, schema coord/SCHEMA-thirds.md): identical copy in every game ---------- */
function atcThirds(results, durationSec){
  var N = results ? results.length : 0; if (N < 9) return null;
  var g = [{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0}];
  for (var i = 0; i < N; i++){ var r = results[i]; var k = durationSec > 0 ? Math.min(2, Math.floor(Math.max(0, +r.t || 0) * 3 / durationSec)) : Math.min(2, Math.floor(i * 3 / N));
    g[k].n++; if (r.blank) g[k].b++; else if (r.ok) g[k].c++; g[k].s += (isFinite(+r.sec) ? +r.sec : 0); }
  for (var j = 0; j < 3; j++) g[j].s = Math.round(g[j].s * 100) / 100;
  return g;
}
function atcEnduranceLine(th){
  if (!th) return '';
  if (th[0].n < 8 || th[2].n < 8) return '';
  var f = 100 * th[2].c / th[2].n - 100 * th[0].c / th[0].n;
  return 'Resistencia: último tercio ' + (f >= 0 ? '+' : '') + Math.round(f) + ' pts frente al primero (' + th[0].n + ' / ' + th[2].n + ' ítems)' + (f <= -5 ? ', decae' : (f <= -3 ? ', ligera caída' : ''));
}

  }).join('');
  const firstInput = $('f0');
  const speakParams = function(){ return state.L.n ? state.L : { rate:state.run.custom.rate, accent:state.run.custom.accent, noise:state.run.custom.noise }; };
  function playIt(){
    if (playing || submitted) return;
    if (played && replaysLeft <= 0) return;
    if (played) replaysLeft--;
    played = true; playing = true;
    $('repl').textContent = replaysLeft >= 99 ? '∞' : replaysLeft;
    $('play').disabled = true;
    speakItem(item.spoken, speakParams(), state.idx, function(w){ const e = $('pw'); if (e) e.textContent = w === '' ? ' ' : w; }, function(){
      playing = false;
      const e = $('pw'); if (e) e.textContent = 'Hecho';
      const pb = $('play'); if (pb){ pb.disabled = replaysLeft <= 0; pb.innerHTML = ic('repeat') + (replaysLeft > 0 ? 'Repetir' + (replaysLeft >= 99 ? '' : ' (' + replaysLeft + ')') : 'Sin repeticiones'); }
      const ae = document.activeElement;
      if (firstInput && !(ae && ae.tagName === 'INPUT')) firstInput.focus();
    });
  }
  $('play').addEventListener('click', playIt);
  if (timeLimit > 0){
    let timeLeft = timeLimit;
    tmr(setInterval(function(){ timeLeft -= 0.2; const tl = $('tleft'); if (tl) tl.textContent = Math.max(0, Math.ceil(timeLeft)); if (timeLeft <= 0) submit(); }, 200));
  }
  function readHint(level){
    const box = $('hintBox');
    if (level === 1) box.innerHTML = '<div class="hint">' + item.parts.length + ': ' + item.parts.map(function(p){ return p.label; }).join(', ') + '</div>';
    else if (level === 2) box.innerHTML = '<div class="hint">Zero Wun Too Tree Fower Fife Six Seven Ait Niner · punto = Decimal</div>';
    else box.innerHTML = '<div class="hint">' + item.parts.map(function(p){ return p.label + ' = ' + p.display; }).join(' · ') + '</div>';
  }
  function useHint(){
    if (submitted || hintsUsed >= hcap) return;
    hintsUsed++; readHint(hintsUsed);
    if (hintsUsed >= hcap) $('hintBtn').disabled = true;
    // give the focus back to the answer boxes (a disabled button would keep it and swallow Enter)
    const empty = Array.prototype.filter.call(fields.querySelectorAll('input'), function(el){ return !el.value; })[0] || firstInput;
    if (empty) empty.focus();
  }
  if (hcap > 0) $('hintBtn').addEventListener('click', useHint);
  function submit(){
    if (submitted) return;
    submitted = true;
    state.activeMs += performance.now() - itemStart;
    clear();
    const dualEl = $('dualAns');
    if (dual && dualEl){
      const v = parseInt(dualEl.value, 10);
      state.dualTotal++;
      if (!isNaN(v) && v === dual.answer) state.dualOk++;
    }
    const showedSolution = hintsUsed >= 3;
    const answers = item.parts.map(function(p, i){ const el = $('f' + i); return showedSolution ? '' : (el ? el.value : ''); });
    const sc = scoreItem(item, answers);
    state.correct += sc.ok; state.wrong += sc.wrong; state.blank += sc.blank;
    state.reviewRows.push(sc);
    { const per = ((performance.now() - itemStart) / 1000) / Math.max(1, sc.detail.length); sc.detail.forEach(function(x){ state.thirdRes.push({ ok:!!x.ok, blank:!!x.blank, sec:per, t:0 }); }); }
    sc.detail.forEach(function(x){ if (!x.ok){ state.missKinds[x.kind] = (state.missKinds[x.kind] || 0) + 1; state.misses.push({ n:state.idx + 1, label:x.label, expected:x.expected, got:x.got }); } });
    state.adaptBlock.push(sc.pct >= ADAPT_TARGET || (sc.total > 0 && sc.ok === sc.total));
    Array.prototype.forEach.call(app.querySelectorAll('input,button'), function(el){ el.disabled = true; });
    const allOk = sc.ok === sc.total;
    const fb = $('fb');
    if (allOk) fb.innerHTML = '<span class="good">' + ic('check') + ' Correcto</span>';
    else fb.innerHTML = '<span class="bad">' + sc.ok + '/' + sc.total + (showedSolution ? ' (en blanco)' : '') + ' · ' + sc.detail.filter(function(x){ return !x.ok; }).map(function(x){ return esc(x.label) + ': <b>' + esc(x.expected) + '</b>' + (x.got ? ', escribiste ' + esc(x.got) : ' (en blanco)'); }).join('; ') + '</span>';
    state.idx++;
    const goNext = function(){
      if (advanced) return; advanced = true;
      clear();
      if (state.run.mode === 'adaptive' && state.adaptBlock.length >= state.run.block){
        const br = adaptBlockResult(state.adaptBlock);
        const step = adaptStep(state.adaptState, br, state.run.need);
        state.adaptState = step;
        state.adaptBlock = [];
        if (step.ev){
          state.levelBanner = step.ev === 'up' ? 'Subes de nivel: L' + step.level + ' ' + LEVELS[step.level].name
            : step.ev === 'down' ? 'Bajas de nivel: L' + step.level + ' ' + LEVELS[step.level].name : 'Nivel 10 superado';
          state.notice = state.levelBanner;
        }
      }
      if (state.idx >= state.itemCount) finishDictation(state); else runDictationItem(state);
    };
    tmr(setTimeout(goNext, allOk ? 700 : 7000));
    const sb = $('submit'); if (sb && !allOk){ sb.disabled = false; sb.innerHTML = ic('arrow') + 'Siguiente'; sb.addEventListener('click', goNext); }
    onKey = function(e){ if (e.key === 'Enter'){ e.preventDefault(); goNext(); } };
  }
  $('submit').addEventListener('click', function(){ if (!played){ playIt(); } else submit(); });
  onKey = function(e){
    if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON') return; // Enter on a focused button presses that button
    if (e.key === 'Enter'){ e.preventDefault(); if (e.shiftKey || !played) playIt(); else submit(); }
    else if (e.key === 'F2' && hcap > 0){ e.preventDefault(); useHint(); }
    else if ((e.key === 'h' || e.key === 'H') && hcap > 0 && document.activeElement.tagName !== 'INPUT'){ useHint(); }
  };
  if (firstInput) firstInput.focus();
}
function missedHtml(state){
  const kinds = Object.keys(state.missKinds).sort(function(a, b){ return state.missKinds[b] - state.missKinds[a]; });
  if (!kinds.length) return '<p class="good">Sin fallos</p>';
  return '<p class="tags">' + kinds.map(function(k){ return esc(KIND_ES[k] || k) + ' <b>' + state.missKinds[k] + '</b>'; }).join(' &nbsp;·&nbsp; ') + '</p>' +
    '<div class="tbox"><table><tr><th>Ítem</th><th>Elemento</th><th>Esperado</th><th>Escribiste</th></tr>' +
    state.misses.slice(0, 40).map(function(m){ return '<tr><td>' + m.n + '</td><td>' + esc(m.label) + '</td><td>' + esc(m.expected) + '</td><td>' + (m.got ? esc(m.got) : '-') + '</td></tr>'; }).join('') + '</table></div>';
}
function finishDictation(state){
  clear();
  const elapsedSec = state.activeMs / 1000;
  const finalLevel = state.run.mode === 'adaptive' ? state.adaptState.level : (state.run.mode === 'ladder' ? state.run.level : 0);
  const reviewHtml = '<h2>Revisión</h2>' + missedHtml(state) +
    (state.levelBanner ? '<p class="notice">' + esc(state.levelBanner) + '</p>' : '');
  resultScreen({ mod:'dictation', runMode:state.run.mode, level:finalLevel,
    correct:state.correct, wrong:state.wrong, blank:state.blank, itemCount:state.itemCount, elapsedSec:elapsedSec,
    rate:state.rate, replays:state.replays, thirds:atcThirds(state.thirdRes, 0), goal:state.run.goal, dualOk:state.dualOk, dualTotal:state.dualTotal,
    reviewHtml:reviewHtml, repeat:function(){ config('dictation'); } });
}

/* ================= MODULE 2: PASSAGE COMPREHENSION ================= */
function startPassage(run){
  clear();
  sessionActive = true;
  const L = levelFromRun(run);
  const itemCount = run.mode === 'custom' ? run.custom.items : (run.items || passageItemCount(run.level || 1));
  runPassageItem(newState(run, itemCount, L));
}
function runPassageItem(state){
  clear();
  // See the matching comment in runDictationItem(): keep state.L in sync with the live adaptive level.
  if (state.run.mode === 'adaptive') state.L = LEVELS[state.adaptState.level];
  const rnd = Math.random;
  const kind = pick(rnd, PASSAGE_KINDS);
  const passage = PASSAGE_GENS[kind](rnd);
  passage.questions.forEach(function(q){ if (!verifyMCQ(q)) throw new Error('Generated an invalid question at runtime'); });
  let replaysLeft = state.run.mode === 'custom' ? 99 : state.L.replays;
  let played = false, playing = false, shown = false, finished = false;
  const dualLoad = state.run.mode === 'custom' ? state.run.custom.dual : state.L.dual;
  const dual = dualLoad > 0 ? genDualTaskSum(rnd, dualLoad) : null;
  const notice = state.notice; state.notice = '';
  const itemStart = performance.now();
  const qResults = [];
  screen(
    '<div>' +
    (dual ? '<div class="dual"><label for="dualAns">Suma: ' + esc(dual.text) + '</label><input type="text" id="dualAns" inputmode="numeric" autocomplete="off"></div>' : '') +
    '<div class="head"><span>Pasaje <b>' + (state.idx + 1) + '</b> / ' + state.itemCount + '</span><span>Correctas <b>' + state.correct + '</b></span><span>Incorrectas <b>' + state.wrong + '</b></span><span>Repeticiones <b id="repl">' + (replaysLeft >= 99 ? '∞' : replaysLeft) + '</b></span><button class="link" id="quit" type="button">Salir</button></div>' +
    '<div class="bar"><div style="width:' + (state.idx / state.itemCount * 100) + '%"></div></div>' +
    (notice ? '<p class="notice" role="status">' + esc(notice) + '</p>' : '') +
    fallbackNote() +
    '<div class="playbox">' + ic('headphones', 'big') + '<div class="playword" id="pw" aria-live="polite">' + esc(passage.label) + '</div>' +
    '<button class="btn primary" id="play" style="margin-top:10px">' + ic('play') + 'Reproducir</button></div>' +
    '<p class="keys"><span class="key">A-D</span> responder · <span class="key">Enter</span> reproducir / siguiente · <span class="key">Shift+Enter</span> repetir · <span class="key">Esc Esc</span> salir</p>' +
    '<div id="qs"></div></div>'
  );
  $('quit').addEventListener('click', quitSession);
  function playIt(){
    if (playing || finished) return;
    if (played && replaysLeft <= 0) return;
    if (played) replaysLeft--;
    played = true; playing = true; $('repl').textContent = replaysLeft >= 99 ? '∞' : replaysLeft;
    $('play').disabled = true;
    speakItem(passage.speech.split(' '), state.L.n ? state.L : { rate:state.run.custom.rate, accent:state.run.custom.accent, noise:state.run.custom.noise },
      state.idx, function(w){ const e = $('pw'); if (e) e.textContent = w === '' ? ' ' : w; }, function(){
        playing = false;
        const e = $('pw'); if (e) e.textContent = 'Hecho';
        const pb = $('play'); if (pb){ pb.disabled = replaysLeft <= 0; pb.innerHTML = ic('repeat') + (replaysLeft > 0 ? 'Repetir' + (replaysLeft >= 99 ? '' : ' (' + replaysLeft + ')') : 'Sin repeticiones'); }
        showQuestions();
      });
  }
  $('play').addEventListener('click', playIt);
  function chooseOption(qi, oi){
    if (qResults[qi] !== undefined) return;
    const q = passage.questions[qi];
    qResults[qi] = oi === q.correctIndex;
    const box = $('opt' + qi);
    Array.prototype.forEach.call(box.querySelectorAll('.optBtn'), function(bb, bi){
      bb.disabled = true;
      if (bi === q.correctIndex) bb.classList.add('ok');
      else if (bi === oi) bb.classList.add('bad');
    });
    if (passage.questions.every(function(x, i){ return qResults[i] !== undefined; })){
      $('next').disabled = false; $('next').focus();
      $('next').parentNode.insertAdjacentHTML('beforebegin', '<div class="hint"><b>Transcripción:</b> ' + esc(passage.text) + '</div>');
    }
  }
  function nextPassage(){
    if (finished || !$('next') || $('next').disabled) return;
    finished = true; finishPassageItem(state, passage, qResults, dual, performance.now() - itemStart);
  }
  function showQuestions(){
    if (shown) return; // replays must not rebuild the questions (that used to wipe the answers and lock the Next button)
    shown = true;
    const qs = $('qs');
    qs.innerHTML = passage.questions.map(function(q, qi){
      return '<div class="passageQ"><p><b>Q' + (qi + 1) + '.</b> ' + esc(q.q) + '</p><div class="optsList" id="opt' + qi + '">' +
        q.options.map(function(o, oi){ return '<button class="optBtn" data-q="' + qi + '" data-o="' + oi + '"><b>' + 'ABCD'[oi] + ')</b> ' + esc(o) + '</button>'; }).join('') +
        '</div></div>';
    }).join('') + '<p class="row"><button class="btn primary" id="next" disabled>' + ic('arrow') + 'Siguiente</button></p>';
    Array.prototype.forEach.call(qs.querySelectorAll('.optBtn'), function(b){
      b.addEventListener('click', function(){ chooseOption(+b.dataset.q, +b.dataset.o); });
    });
    $('next').addEventListener('click', nextPassage);
    try { qs.scrollIntoView({ block:'nearest' }); } catch (e) {}
  }
  onKey = function(e){
    if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON') return; // Enter on a focused button presses that button
    if (e.key === 'Enter'){
      e.preventDefault();
      if (e.shiftKey || !played) playIt();
      else if (shown && !$('next').disabled) nextPassage();
      return;
    }
    const k = e.key.length === 1 ? 'ABCD'.indexOf(e.key.toUpperCase()) : -1;
    if (k >= 0 && shown && document.activeElement.tagName !== 'INPUT'){
      const qi = passage.questions.findIndex(function(x, i){ return qResults[i] === undefined; });
      if (qi >= 0 && k < passage.questions[qi].options.length){ e.preventDefault(); chooseOption(qi, k); }
    }
  };
}
function finishPassageItem(state, passage, qResults, dual, ms){
  clear();
  state.activeMs += ms;
  const dualEl = $('dualAns');
  if (dual && dualEl){
    const v = parseInt(dualEl.value, 10);
    state.dualTotal++;
    if (!isNaN(v) && v === dual.answer) state.dualOk++;
  }
  let ok = 0, blank = 0;
  passage.questions.forEach(function(q, i){ const r = qResults[i]; if (r === undefined) blank++; else if (r) ok++; });
  const wrong = passage.questions.length - ok - blank;
  state.correct += ok; state.wrong += wrong; state.blank += blank;
  passage.questions.forEach(function(q, i){ const r = qResults[i]; state.thirdRes.push({ ok:r === true, blank:r === undefined, sec:(ms / 1000) / Math.max(1, passage.questions.length), t:0 }); });
  state.reviewRows.push({ kind:passage.kind, ok:ok, wrong:wrong, total:passage.questions.length, text:passage.text });
  if (wrong + blank > 0){ state.missKinds[passage.kind] = (state.missKinds[passage.kind] || 0) + wrong + blank; state.misses.push({ n:state.idx + 1, label:passage.label, expected:'', got:'', text:passage.text }); }
  state.adaptBlock.push(passage.questions.length > 0 && ok === passage.questions.length);
  state.idx++;
  if (state.run.mode === 'adaptive' && state.adaptBlock.length >= state.run.block){
    const br = adaptBlockResult(state.adaptBlock);
    const step = adaptStep(state.adaptState, br, state.run.need);
    state.adaptState = step; state.adaptBlock = [];
    if (step.ev){
      state.levelBanner = step.ev === 'up' ? 'Subes de nivel: L' + step.level + ' ' + LEVELS[step.level].name
        : step.ev === 'down' ? 'Bajas de nivel: L' + step.level + ' ' + LEVELS[step.level].name : 'Nivel 10 superado';
      state.notice = state.levelBanner;
    }
  }
  if (state.idx >= state.itemCount) finishPassage(state); else runPassageItem(state);
}
function finishPassage(state){
  clear();
  const elapsedSec = state.activeMs / 1000;
  const finalLevel = state.run.mode === 'adaptive' ? state.adaptState.level : (state.run.mode === 'ladder' ? state.run.level : 0);
  const kinds = Object.keys(state.missKinds).sort(function(a, b){ return state.missKinds[b] - state.missKinds[a]; });
  const reviewHtml = '<h2>Revisión</h2><div class="tbox"><table><tr><th>#</th><th>Tipo</th><th>Correctas</th><th>Incorrectas</th></tr>' +
    state.reviewRows.map(function(r, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(KIND_ES[r.kind] || r.kind) + '</td><td>' + r.ok + '</td><td>' + r.wrong + '</td></tr>'; }).join('') + '</table></div>' +
    (kinds.length ? '<h3>Transcripciones</h3>' + state.misses.slice(0, 12).map(function(m){ return '<div class="hint"><b>#' + m.n + ' ' + esc(m.label) + ':</b> ' + esc(m.text) + '</div>'; }).join('') : '<p class="good">Sin fallos</p>') +
    (state.levelBanner ? '<p class="notice">' + esc(state.levelBanner) + '</p>' : '');
  resultScreen({ mod:'passage', runMode:state.run.mode, level:finalLevel,
    correct:state.correct, wrong:state.wrong, blank:state.blank, itemCount:state.itemCount, elapsedSec:elapsedSec,
    rate:state.rate, replays:state.replays, thirds:atcThirds(state.thirdRes, 0), goal:state.run.goal, dualOk:state.dualOk, dualTotal:state.dualTotal,
    reviewHtml:reviewHtml, repeat:function(){ config('passage'); } });
}
