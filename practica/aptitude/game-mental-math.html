<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo mental</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4d8f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='5' y='3' width='14' height='18' rx='1.5'/%3E%3Cpath d='M8 7h8v3H8z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onaccent:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a3c6ef; --onaccent:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d}
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
#app{max-width:880px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
h3{font-size:1.02rem;margin:18px 0 6px}
p{margin:.5rem 0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.muted{color:var(--muted)} .ok{color:var(--ok)} .err{color:var(--err)} .warnc{color:var(--warn)}
.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.top .logo{width:32px;height:32px;color:var(--accent);stroke-width:1.5}
.top h1{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s;line-height:1.2}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{background:var(--accent-h);color:var(--onaccent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.mod:focus-visible,.opt:focus-visible,.ico:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{background:none;border:0;color:var(--muted);padding:4px;min-width:40px;min-height:40px;align-items:center;justify-content:center;cursor:pointer;display:inline-flex;border-radius:2px}
.ico:hover{color:var(--text)}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:7px 10px;width:100%;min-height:40px}
input[type=range]{width:100%;min-height:32px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.setup{display:grid;grid-template-columns:250px 1fr;gap:6px 36px;align-items:start}
.mods{border-top:1px solid var(--rule)}
.mod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 8px;cursor:pointer;color:var(--text);border-radius:0}
.mod:hover{background:var(--stripe)}
.mod[aria-checked=true]{background:var(--stripe);color:var(--accent);font-weight:600}
.form{border-top:1px solid var(--rule)}
.fr{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.fr>label{color:var(--muted);font-size:.92rem}
.fr .chk{display:flex;align-items:center;gap:10px}
.msg{min-height:1.4em;margin-top:12px;font-weight:600}
.head{display:flex;align-items:center;gap:16px;padding-bottom:10px;margin-bottom:22px;border-bottom:1px solid var(--rule);color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.head .hm{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
.head .sp{flex:1}
.head .pr{color:var(--warn);font-weight:700}
.cd{display:flex;align-items:center;gap:14px;margin-top:18px}
.cd .bar{flex:1;height:4px;background:var(--stripe);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cd .bar i{display:block;height:100%;width:100%;background:var(--accent)}
.cd .timer{font-family:var(--mono);min-width:3.4em;text-align:right}
.timer{font-variant-numeric:tabular-nums}
.timer.late{color:var(--warn)} .timer.over{color:var(--err)}
.bignum{font-family:var(--mono);font-size:3.4rem;text-align:center;padding:28px 0;font-weight:600}
.stim{font-family:var(--mono);font-size:3rem;font-weight:600;text-align:center;padding:24px 8px;min-height:110px;display:flex;align-items:center;justify-content:center;margin:0}
.stim.word{font-family:var(--sans);letter-spacing:.04em}
.center{text-align:center}
.q{font-family:var(--serif);font-size:1.3rem;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:1.02rem;min-height:44px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--err);color:var(--err);text-decoration:line-through}
.opt[disabled]{cursor:default}
.key{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:.82rem;color:var(--muted);background:var(--bg)}
.foot{display:flex;align-items:center;gap:14px;margin-top:16px}
.foot .sp{flex:1}
.hinttxt{color:var(--warn);margin:10px 0 0;min-height:1.2em}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
tbody tr:nth-child(even){background:var(--stripe)}
.tab-box{overflow-x:auto;max-width:100%;border-top:1px solid var(--rule);margin-bottom:18px}
table.strips{font-family:var(--mono);font-size:1.15rem}
table.strips td{padding:9px 12px}
table.strips td:first-child{font-weight:700}
table.rb th{width:110px;background:none}
table.rb td{font-family:var(--mono);white-space:normal}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.kv th{font-weight:400}
.big{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:18px 0}
.big>div{flex:1 1 140px;padding:14px 16px 12px 0}
.big b{display:block;font-family:var(--serif);font-size:2.3rem;line-height:1.1}
.big span{color:var(--muted);font-size:.85rem}
.fb{min-height:1.8em;text-align:center;font-weight:700;margin:12px 0}
.pad{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pad .btn{min-width:130px;justify-content:center;padding:12px 16px}
.stimbox{min-height:130px;text-align:center;display:flex;align-items:center;justify-content:center;margin:0 0 6px}
.rule{text-align:center;font-weight:700;min-height:1.5em}
.chart{display:block;width:100%;height:auto;margin-bottom:14px}
.chart .g{stroke:var(--rule);stroke-width:1}
.chart .t{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .l{fill:none;stroke:var(--accent);stroke-width:2}
.chart .p{fill:var(--accent)}
.chart .m{stroke:var(--ok);stroke-dasharray:6 4;fill:none}
.chart .mt{fill:var(--ok);font-size:11px}
.sh-c{fill:var(--muted)} .sh-s{fill:var(--warn)} .sh-t{fill:var(--accent)}
.swatch{width:12px;height:12px;border-radius:1px;display:inline-block;flex:none}
.back{display:inline-flex;margin-bottom:14px}
@media (max-width:720px){
  html{font-size:16px}
  .setup{grid-template-columns:1fr}
  .mods{display:grid;grid-template-columns:1fr 1fr}
  .mod{border-right:1px solid var(--rule)}
  h1{font-size:1.6rem}
  .stim{font-size:2.4rem}
}
@media (max-width:420px){
  .fr{grid-template-columns:82px 1fr;gap:8px}
  .opts{grid-template-columns:1fr}
}
.stim .ic{width:52px;height:52px;stroke-width:1.8}
.small{font-size:.85rem}
.top+.form,.top+.list,.top+.setup{border-top:0}
.top>.ic:not(.logo){width:26px;height:26px}
.head span{white-space:nowrap}
@media (max-width:420px){.head{gap:10px;font-size:.82rem}}
.list{border-top:1px solid var(--rule)}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 8px;cursor:pointer;color:var(--text);border-radius:0}
.li:hover{background:var(--stripe);color:var(--accent)}
.li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.li .nm{flex:1}
.li .dt{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.form.narrow{max-width:620px}
.bar{height:4px;background:var(--stripe);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:-12px 0 18px}
.bar>div{height:100%;width:100%;background:var(--accent)}
.bar.late>div{background:var(--warn)}
.question{font-family:var(--mono);font-size:2.8rem;text-align:center;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.question.long{font-family:var(--serif);font-size:1.4rem;line-height:1.5}
.answer{font-family:var(--mono);font-size:1.9rem;text-align:center;max-width:300px}
.optrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.optrow .btn{min-width:84px;justify-content:center;font-size:1.3rem}
.dist{list-style:none;margin:0 0 6px;padding:0;text-align:center;color:var(--muted);font-size:.92rem}
.banner{text-align:center;margin:0 0 8px}
.coach{max-width:640px;margin:8px auto}
.coach .ans{font-size:1.5rem;margin:.2rem 0 .8rem;font-family:var(--mono)}
.mono{font-family:var(--mono);font-size:.92rem}
.hinttxt{margin:8px auto;max-width:640px}
.lnk{color:var(--accent);text-decoration:underline;display:inline-block;padding:10px 0}
canvas#cv{touch-action:none}
.radar{display:block;margin:0 auto;max-width:300px;width:100%;height:auto}
.rd-g{stroke:var(--rule);stroke-width:1}.rd-a{stroke:var(--muted);stroke-width:1}
.rd-t{fill:var(--muted);font-size:10px}.rd-tf{fill:var(--warn);font-size:10px}.rd-f{fill:none;stroke:var(--warn);stroke-width:1.4}
.rd-v{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}.rd-c{fill:var(--accent)}.rd-l{fill:var(--text);font-size:13px;font-weight:700}
#app.dual{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
#sec{border-left:1px solid var(--rule);padding-left:22px}
#sec canvas{display:block;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:2px;max-width:100%;cursor:crosshair}
.tiles{display:flex;gap:8px;justify-content:center;margin:.6rem 0}
.tile{width:70px;padding:10px 0;text-align:center;font-family:var(--mono);font-size:1.4rem;border:1px solid var(--rule);border-radius:2px;background:var(--surface)}
.tile.alert{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.msgbox{font-family:var(--mono);text-align:center;min-height:3rem;border:1px solid var(--rule);border-radius:2px;padding:10px;background:var(--surface)}
#sec .bignum{font-size:2.6rem;padding:10px 0}
label.chk{display:inline-flex;align-items:center;gap:10px;min-height:40px}
td.mod{white-space:normal;min-width:240px;max-width:360px}
@media (max-width:1000px){#app.dual{display:block}#sec{border-left:0;border-top:1px solid var(--rule);padding:16px 0 0;margin-top:20px}}
@media (max-width:720px){.question{font-size:2.1rem}}
</style>
</head>

<script>
// ==== PURE LOGIC START ====
/* ---------- Basics ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ri(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }
function pick(r, a){ return a[Math.floor(r() * a.length)]; }
function shuffle(r, a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function span(d, lo1, hi1, lo10, hi10){ const k = (Math.max(1, Math.min(10, d)) - 1) / 9; return [Math.round(lo1 + (lo10 - lo1) * k), Math.round(hi1 + (hi10 - hi1) * k)]; }
function rs(r, d, lo1, hi1, lo10, hi10){ const s = span(d, lo1, hi1, lo10, hi10); return ri(r, s[0], s[1]); }
function fnum(x){ if (!isFinite(x)) return '?'; return String(Math.round(x * 100000) / 100000); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function retry(fn, n){ for (let i = 0; i < (n || 300); i++){ const it = fn(); if (it) return it; } throw new Error('generator could not produce a valid item'); }
function isInt(x){ return Math.abs(x - Math.round(x)) < 1e-9; }
function hhmm(min){ const m = ((min % 1440) + 1440) % 1440; return pad2(Math.floor(m / 60)) + pad2(m % 60); }
function dr9(x){ return x % 9; } // digit root modulo 9 (0 stands for 9)
function roundSig(x, s){ const p = Math.pow(10, Math.floor(Math.log10(Math.abs(x))) - s + 1); return Math.round(x / p) * p; }

/* ---------- Difficulty ladder (10 levels) ---------- */
const PASS_ACC = 96;
const LEVELS = [null,
  { n:1,  name:'Calentamiento',      sec:60,  items:10, dist:0, hints:3, dual:1 },
  { n:2,  name:'Fácil',         sec:45,  items:12, dist:0, hints:3, dual:1 },
  { n:3,  name:'Constante',       sec:32,  items:15, dist:0, hints:3, dual:2 },
  { n:4,  name:'Estándar',     sec:22,  items:15, dist:1, hints:2, dual:2 },
  { n:5,  name:'Competitivo',  sec:14,  items:20, dist:1, hints:1, dual:2 },
  { n:6,  name:'Difícil',         sec:9,   items:20, dist:2, hints:1, dual:3 },
  { n:7,  name:'Élite',        sec:7,   items:25, dist:2, hints:0, dual:3 },
  { n:8,  name:'Extremo',      sec:5.5, items:25, dist:3, hints:0, dual:3 },
  { n:9,  name:'Sobrehumano',   sec:4.5, items:30, dist:3, hints:0, dual:4 },
  { n:10, name:'Imposible',   sec:3.5, items:30, dist:4, hints:0, dual:4 }
];
function levelStatement(l){
  if (l <= 2) return 'El nivel ' + l + ' está por debajo del nivel de la oposición: úsalo para aprender y ganar precisión.';
  if (l <= 4) return 'El nivel ' + l + ' sigue por debajo del objetivo: el nivel 5 es el objetivo de la Fase 2 (lo que debe dominar un candidato bien preparado).';
  if (l === 5) return 'Nivel 5 = objetivo de la Fase 2: el nivel que debe dominar un candidato bien preparado. Alcanzarlo con un 96 % o más es la meta.';
  if (l === 6) return 'El nivel 6 está por encima del objetivo: un margen de seguridad sobre el nivel 5, pero aún dentro de lo que puede hacer un candidato muy bueno.';
  if (l <= 8) return 'Nivel ' + l + ' (7+ = más allá de la oposición): entrenas por encima de lo que el examen debería pedir.';
  return 'El nivel ' + l + ' está muy por encima de la oposición (calibrado para que fallarlo sea normal): es entrenamiento de estrés, no un objetivo.';
}
// Anti-acceleration rule: never recommend more speed (higher level or shorter time) after a session below 96 %.
function antiAccel(last, req){
  if (!last || last.acc === null || last.acc === undefined) return { warn:false, msg:'' };
  if (last.acc >= PASS_ACC) return { warn:false, msg:'' };
  const faster = (req.level > last.lvl) || (req.sec !== undefined && last.sec !== undefined && req.sec < last.sec - 1e-9);
  if (!faster) return { warn:false, msg:'' };
  return { warn:true, msg:'Última sesión ' + fnum(Math.round(last.acc * 10) / 10) + ' %: aún sin acelerar.' };
}

const LBL = ['A', 'B', 'C', 'D'];
function acCount(r, d){ return d <= 3 ? ri(r, 1, 2) : (d <= 6 ? ri(r, 2, 3) : ri(r, 3, 4)); }
function velPick(r, d){ // returns [vx, vy] in NM per minute
  const s = d <= 3 ? ri(r, 2, 6) : ri(r, 2, 8);
  if (d >= 6 && r() < .4){ const tri = pick(r, [[3, 4], [4, 3], [6, 8], [8, 6], [5, 12], [12, 5]]); return [tri[0] * (r() < .5 ? 1 : -1), tri[1] * (r() < .5 ? 1 : -1)]; }
  return pick(r, [[s, 0], [-s, 0], [0, s], [0, -s]]);
}
function velText(v){
  if (v[1] === 0) return 'volando hacia el ' + (v[0] > 0 ? 'este' : 'oeste') + ' a GS ' + Math.abs(v[0]) * 60 + ' kt (' + Math.abs(v[0]) + ' NM/min)';
  if (v[0] === 0) return 'volando hacia el ' + (v[1] > 0 ? 'norte' : 'sur') + ' a GS ' + Math.abs(v[1]) * 60 + ' kt (' + Math.abs(v[1]) + ' NM/min)';
  return 'moviéndose ' + Math.abs(v[0]) + ' NM/min hacia el ' + (v[0] > 0 ? 'este' : 'oeste') + ' y ' + Math.abs(v[1]) + ' NM/min hacia el ' + (v[1] > 0 ? 'norte' : 'sur') + ' (GS ' + Math.round(Math.hypot(v[0], v[1]) * 60) + ' kt)';
}

/* ---------- Answer parsing and checking ---------- */

  if ($('wk')) $('wk').addEventListener('click', function(){ setup('ladder', { focus:'weak' }); });
  onKey = function(e){ if (e.key === 'Escape') menu(); else if ((e.key === 'w' || e.key === 'W') && weak){ e.preventDefault(); setup('ladder', { focus:'weak' }); } };
}

/* ---------- History and CSV ---------- */
function history(){
  stopAll(); S = null; const ses = store.sessions;
  const rows = ses.slice(-300).reverse().map(function(s){ return '<tr><td>' + dateES(s.ts) + '</td><td class="mod">' + esc(s.mod) + '</td><td>' + s.lvl + '</td><td>' + s.ok + '</td><td>' + s.bad + '</td><td>' + s.blank + '</td><td>' + (s.spi === null || s.spi === undefined ? '' : f2(s.spi)) + '</td><td>' + f1(s.acc) + '</td><td>' + esc(s.goal) + '</td><td>' + (s.met === true ? 'Sí' : (s.met === false ? 'No' : '')) + '</td></tr>'; }).join('');
  const pbs = []; for (let l = 1; l <= 10; l++){ const b = personalBest(ses, l); if (b.n) pbs.push('<tr><td>' + l + ' ' + LEVELS[l].name + '</td><td>' + f1(b.acc) + ' %</td><td>' + f2(b.spi) + ' s</td><td>' + b.n + '</td></tr>'); }
  show(backBtn() + topBar('history', 'Historial') +
    (pbs.length ? '<h2>Mejores</h2><div class="tab-box"><table><thead><tr><th>Nivel</th><th>Precisión</th><th>s / elem.</th><th>Válidas</th></tr></thead><tbody>' + pbs.join('') + '</tbody></table></div>' : '') +
    '<h2>Sesiones</h2>' + (rows ? '<div class="tab-box" style="max-height:420px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Aciertos</th><th>Fallos</th><th>Blanco</th><th>s/elem.</th><th>Prec. %</th><th>Objetivo</th><th>Cumplido</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">Sin sesiones</p>') +
    '<div class="actions"><button class="btn primary" id="csv">' + IC('download') + 'CSV</button><button class="btn danger" id="del">' + IC('trash') + 'Borrar</button><span id="conf" style="display:inline-flex;gap:10px;align-items:center"></span></div>');
  $('back').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    try { const blob = new Blob([toCSV(ses)], { type:'text/csv;charset=utf-8' }); const a = document.createElement('a'); const d = new Date(); a.href = URL.createObjectURL(blob); a.download = 'calculo-mental-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
    catch (e){ $('conf').innerHTML = '<span class="err">Error</span>'; }
  });
  $('del').addEventListener('click', function(){
    $('conf').innerHTML = '<span class="warnc">¿Borrar todo?</span> <button class="btn danger" id="y">Sí</button> <button class="btn" id="n">No</button>';
    $('y').addEventListener('click', function(){ store = { sessions:[], tech:{}, settings:store.settings }; save(); history(); }); $('n').addEventListener('click', function(){ $('conf').innerHTML = ''; });
  });
  onKey = function(e){ if (e.key === 'Escape') menu(); };
}

menu();

</script>
