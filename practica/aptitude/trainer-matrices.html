<html lang="es">

<title>Entrenador de matrices</title>

<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onacc:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a6c8f0; --onacc:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
.top{display:flex;align-items:center;gap:10px;margin:0 auto;padding:14px 16px 10px}
.top .logo{width:30px;height:30px;color:var(--accent);flex:none}
.top .brand{font:700 20px/1 var(--serif);letter-spacing:.01em}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.logo{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 28px/1.2 var(--serif);margin:.3em 0 .5em}
h2{font:700 20px/1.3 var(--serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:1.6em 0 .6em}
h3{font:700 17px var(--serif);margin:1em 0 .3em}
p{margin:.4rem 0}
.soft{color:var(--muted)} .small{font-size:14px}
.good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onacc)}
.btn.primary:hover{background:var(--accent-h);color:var(--onacc)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.4;cursor:default}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;margin-bottom:6px;min-height:40px}
.link:hover{color:var(--accent-h);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;width:100%;max-width:420px}
input[type=range]{width:100%;max-width:420px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px;margin-right:8px}
label.lb{display:block;margin:1rem 0 .3rem;font-weight:600}
label.lb.inline{font-weight:400}
kbd,.key{font:12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:2px 6px;background:var(--surface);color:var(--muted);display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted);font-size:15px;padding:6px 0;border-bottom:1px solid var(--rule)}
.head b{color:var(--text)}
.head .ic{margin-right:4px}
.bar{height:3px;background:var(--rule);margin:0 0 12px}
.bar>div{height:100%;background:var(--accent);width:0}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.fig{padding:10px 26px 10px 0}
.fig b{display:block;font:700 28px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.tbl,.tbl-box,.tab-box,.tabla-caja{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--text);padding:6px 12px 6px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
.list{border-top:1px solid var(--text);margin:8px 0 16px}
.card{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;cursor:pointer;color:var(--text)}
.card:hover{background:var(--stripe)}
.card .ic{width:30px;height:30px;color:var(--accent);stroke-width:1.5}
.card .nm{display:block;font:700 20px/1.2 var(--serif)}
.card .dt{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hintbox{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
@media (max-width:640px){.fig{padding-right:18px}.fig b{font-size:24px}h1{font-size:25px}}

#app{max-width:1000px;margin:0 auto;padding:8px 16px 56px}
.top{max-width:1000px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 32px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.timer.late{color:var(--warn)}
.timer.over{color:var(--err)}
svg.cell{display:block;width:100%;height:auto}
.mat{display:grid;grid-template-columns:repeat(3,minmax(0,112px));gap:6px;justify-content:center;margin:14px auto}
.seq{display:grid;grid-template-columns:repeat(6,minmax(0,100px));gap:6px;justify-content:center;margin:14px auto}
.ana{display:grid;grid-template-columns:repeat(2,minmax(0,112px));gap:6px 40px;justify-content:center;margin:14px auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,108px));gap:10px;justify-content:center;margin:18px auto}
.opt{position:relative;background:var(--surface);border:2px solid var(--rule);border-radius:2px;padding:5px;cursor:pointer;color:var(--text)}
.opt:hover{border-color:var(--accent)}
.opt .let{position:absolute;left:5px;top:3px;font:12px/1 ui-monospace,Consolas,monospace;color:#5f5b53}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--err)}
.opt.hinted{border-color:var(--warn)}
.opt[disabled]{cursor:default}
.lamp{display:inline-block;width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--muted);vertical-align:-2px}
.lamp.on{background:var(--err);border-color:var(--err)}
ul.rules{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--rule)}
ul.rules li{padding:5px 0;border-bottom:1px solid var(--rule)}
.hintbox:empty{display:none}
.chart{display:block;width:100%;height:auto;margin:8px 0}
.status{font-size:18px;margin:12px 0 0}
.slider{max-width:420px}
.cust{border-top:1px solid var(--rule);margin-top:14px}
td .ic{margin-right:6px;color:var(--muted)}
@media (max-width:640px){
  .mat{grid-template-columns:repeat(3,minmax(0,92px))}
  .seq{grid-template-columns:repeat(3,minmax(0,92px))}
}
</style>
</head>

<script>
'use strict';
// ==== PURE LOGIC START ====
/* =====================================================================
   PURE LOGIC (no DOM). Everything here is deterministic given a seed and is
   tested with node (see trainer-matrices-README.md).
   ===================================================================== */

/* ---------- Seeded random numbers ---------- */
function makeRng(seed){
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let a = h;
  function next(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next: next,
    int: function(n){ return Math.floor(next() * n); },
    range: function(lo, hi){ return lo + Math.floor(next() * (hi - lo + 1)); },
    pick: function(arr){ return arr[Math.floor(next() * arr.length)]; },
    chance: function(p){ return next() < p; },
    shuffle: function(arr){
      const b = arr.slice();
      for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(next() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
      return b;
    }
  };
}
function mod(a, n){ return ((a % n) + n) % n; }
function uniq(arr){ const seen = {}; const out = []; arr.forEach(function(x){ if (!seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
function fill3(x){ return [[x, x, x], [x, x, x], [x, x, x]]; }
function transpose3(g){ return [[g[0][0], g[1][0], g[2][0]], [g[0][1], g[1][1], g[2][1]], [g[0][2], g[1][2], g[2][2]]]; }
function range(n){ const r = []; for (let i = 0; i < n; i++) r.push(i); return r; }

/* ---------- Attribute model ---------- */
const SHAPES = ['circle','square','triangle','diamond','pentagon','star','cross','hexagon','arrow','ell','halfdisc','rtri'];
const SYM_IDX = [0,1,2,3,4,5,6,7];
const ASYM_IDX = [8,9,10,11];              // shapes with no rotational symmetry: the only ones used when rotation is a rule
const ALL_SHAPES = range(12);
const ATTRS = ['shape','count','shade','size','rot','pos'];
const ATTR_KIND = { shape:'cat', count:'ord', shade:'ord', size:'ord', rot:'cyc', pos:'cyc' };
const ATTR_D = { shape:12, count:5, shade:4, size:3, rot:8, pos:8 };
const ATTR_LABEL = { shape:'Forma', count:'Número de figuras', shade:'Sombreado', size:'Tamaño', rot:'Rotación', pos:'Posición' };
const SHAPE_ES = ['círculo','cuadrado','triángulo','rombo','pentágono','estrella','cruz','hexágono','flecha','ele','semicírculo','triángulo rectángulo'];
const SHAPE_ES_PL = ['círculos','cuadrados','triángulos','rombos','pentágonos','estrellas','cruces','hexágonos','flechas','eles','semicírculos','triángulos rectángulos'];
const DIRW = { row:'fila', column:'columna' };
const SHADE_NAMES = ['blanco','rayado','gris','negro'];
const SIZE_NAMES = ['pequeño','mediano','grande'];
function valName(a, v){
  if (a === 'shape') return SHAPE_ES[v];
  if (a === 'count') return String(v + 1);
  if (a === 'shade') return SHADE_NAMES[v];
  if (a === 'size') return SIZE_NAMES[v];
  if (a === 'rot') return (v * 45) + ' grados';
  if (a === 'pos') return 'posición ' + (v + 1);
  return String(v);
}
function mkCell(o){ return { t:'a', shape:o.shape, count:o.count, shade:o.shade, size:o.size, rot:o.rot, pos:o.pos }; }
function sig(c){
  if (c === null || c === undefined) return '?';
  if (c.t === 'l') return 'l' + c.slots.map(function(x){ return x ? 1 : 0; }).join('');
  return 'a' + [c.shape, c.count, c.shade, c.size, c.rot, c.pos].join(',');
}
function hamming(c1, c2){ let n = 0; ATTRS.forEach(function(a){ if (c1[a] !== c2[a]) n++; }); return n; }

/* Context: which attributes are "alive" in an item, and the fixed values of the rest. */
function makeCtx(chosen){
  const hasPos = chosen.indexOf('pos') >= 0, hasRot = chosen.indexOf('rot') >= 0;
  const active = hasPos ? ['shape','shade','pos'] : ['shape','count','shade','size'];
  if (hasRot) active.push('rot');
  const fixed = { count:0, size:(hasPos ? 2 : 1), rot:0, pos:-1 };
  if (hasPos){ fixed.count = 0; fixed.size = 2; }
  return { active: active, fixed: fixed, shapeDom: hasRot ? ASYM_IDX : ALL_SHAPES };
}
function domainOf(ctx, a){ return a === 'shape' ? ctx.shapeDom : range(ATTR_D[a]); }
function cellFrom(ctx, vals){
  const o = {};
  ATTRS.forEach(function(a){ o[a] = (vals[a] !== undefined && ctx.active.indexOf(a) >= 0) ? vals[a] : ctx.fixed[a]; });
  return mkCell(o);
}
// count and size conflict with position (a lone small shape moves round the cell)
function pickAttrs(rng, pool, n){
  const order = rng.shuffle(pool);
  const out = [];
  for (let i = 0; i < order.length && out.length < n; i++){
    const a = order[i];
    const hasPos = out.indexOf('pos') >= 0;
    if (a === 'pos' && (out.indexOf('count') >= 0 || out.indexOf('size') >= 0)) continue;
    if ((a === 'count' || a === 'size') && hasPos) continue;
    out.push(a);
  }
  return out.length === n ? out : null;
}

/* ---------- Levels (the ladder) ---------- */
const LEVEL_NAMES = ['', 'Calentamiento', 'Fácil', 'Estable', 'Estándar', 'Competitivo', 'Difícil', 'Élite', 'Extremo', 'Sobrehumano', 'Imposible'];
// prompt = seconds after which the 15-second style prompt appears; hard = automatic skip (0 = none)
const TIMING = [null,
  { prompt:40, hard:0 }, { prompt:30, hard:0 }, { prompt:24, hard:0 }, { prompt:18, hard:0 }, { prompt:15, hard:0 },
  { prompt:13, hard:22 }, { prompt:11, hard:16 }, { prompt:9, hard:12 }, { prompt:7, hard:9 }, { prompt:5, hard:6 }];
const HINT_MAX_LEVEL = 6;                 // hints are unavailable from level 7 up
const PASS_ACCURACY = 96;                 // the anti-acceleration threshold
function levelStatement(l){
  if (l <= 2) return 'El nivel ' + l + ' es de aprendizaje, muy por debajo del examen. Úsalo para ver las reglas, no para medirte.';
  if (l <= 4) return 'El nivel ' + l + ' está por debajo del objetivo. Nivel 5 = objetivo de la Fase 2; sigue hasta que el 96 % te resulte fácil.';
  if (l === 5) return 'Nivel 5 = objetivo de la Fase 2 (lo que debe dominar un candidato bien preparado).';
  if (l === 6) return 'El nivel 6 está por encima del objetivo: margen cómodo sobre la mayoría de competidores.';
  return 'El nivel ' + l + ' supera el de la competición (7+). Es entrenamiento de estrés: no te juzgues por su precisión.';
}
const MATRIX_P = [null,
  { nVar:1, attrs:['shade','size','count','shape'],                rules:['rowconst','prog1'],                                   opts:4,  transp:0,  close:0 },
  { nVar:1, attrs:['shade','size','count','shape'],                rules:['rowconst','prog1','dist3'],                           opts:5,  transp:0,  close:0 },
  { nVar:2, attrs:['shade','size','count','shape'],                rules:['rowconst','prog1','dist3'],                           opts:6,  transp:.4, close:.1 },
  { nVar:2, attrs:['shade','size','count','shape','rot'],          rules:['rowconst','prog1','prog2','dist3'],                   opts:6,  transp:.5, close:.2 },
  { nVar:3, attrs:['shade','size','count','shape','rot','pos'],    rules:['rowconst','prog1','prog2','dist3','arith'],           opts:8,  transp:.5, close:.35 },
  { nVar:3, attrs:['shade','size','count','shape','rot','pos'],    rules:['rowconst','prog1','prog2','prog3','dist3','arith'],   opts:8,  transp:.5, close:.5 },
  { nVar:3, attrs:['shade','size','count','shape','rot','pos'],    rules:['prog1','prog2','prog3','dist3','arith'],              opts:8,  transp:.5, close:.65 },
  { nVar:4, attrs:['shade','size','count','shape','rot'],          rules:['prog1','prog2','prog3','dist3','arith'],              opts:9,  transp:.5, close:.8 },
  { nVar:4, attrs:['shade','size','count','shape','rot'],          rules:['prog1','prog2','prog3','dist3','arith'],              opts:10, transp:.5, close:.95 },
  { nVar:5, attrs:['shade','size','count','shape','rot'],          rules:['prog1','prog2','prog3','dist3','arith'],              opts:10, transp:.5, close:1 }];
const SERIES_P = [null,
  { nVar:1, attrs:['shade','size','count','shape'],                rules:['prog1','alt2'],                          opts:4,  close:0 },
  { nVar:1, attrs:['shade','size','count','shape'],                rules:['prog1','alt2','cyc3'],                   opts:5,  close:0 },
  { nVar:2, attrs:['shade','size','count','shape'],                rules:['prog1','alt2','cyc3'],                   opts:6,  close:.1 },
  { nVar:2, attrs:['shade','size','count','shape','rot'],          rules:['prog1','prog2','alt2','cyc3'],           opts:6,  close:.2 },
  { nVar:2, attrs:['shade','size','count','shape','rot','pos'],    rules:['prog1','prog2','alt2','cyc3','lag2'],    opts:8,  close:.35 },
  { nVar:3, attrs:['shade','size','count','shape','rot','pos'],    rules:['prog1','prog2','alt2','cyc3','lag2','bounce'], opts:8, close:.5 },
  { nVar:3, attrs:['shade','size','count','shape','rot'],          rules:['prog2','prog3','cyc3','lag2','bounce'], opts:8,  close:.65 },
  { nVar:4, attrs:['shade','size','count','shape','rot'],          rules:['prog2','prog3','cyc3','lag2','bounce'], opts:9,  close:.8 },
  { nVar:4, attrs:['shade','size','count','shape','rot'],          rules:['prog2','prog3','cyc3','lag2','bounce'], opts:10, close:.95 },
  { nVar:5, attrs:['shade','size','count','shape','rot'],          rules:['prog2','prog3','cyc3','lag2','bounce'], opts:10, close:1 }];
const ANALOGY_P = [null,
  { changes:1, maxD:1, attrs:['shade','size','count'],                opts:4,  close:0 },
  { changes:1, maxD:1, attrs:['shade','size','count','rot'],          opts:5,  close:0 },
  { changes:2, maxD:1, attrs:['shade','size','count','rot'],          opts:6,  close:.1 },
  { changes:2, maxD:1, attrs:['shade','size','count','rot','pos'],    opts:6,  close:.2 },
  { changes:2, maxD:2, attrs:['shade','size','count','rot','pos'],    opts:8,  close:.35 },
  { changes:3, maxD:2, attrs:['shade','size','count','rot'],          opts:8,  close:.5 },
  { changes:3, maxD:2, attrs:['shade','size','count','rot'],          opts:8,  close:.65 },

/* ---------- Rule descriptions ---------- */
function stepText(a, s, wrap){
  const n = Math.abs(s), w = wrap ? ' (vuelve al principio al llegar al final de la escala)' : '';
  if (a === 'count') return (s > 0 ? 'gana ' : 'pierde ') + n + ' figura' + (n > 1 ? 's' : '') + w;
  if (a === 'shade') return 'se hace ' + (s > 0 ? 'más oscuro' : 'más claro') + ' en ' + n + ' paso' + (n > 1 ? 's' : '') + w;
  if (a === 'size')  return (s > 0 ? 'crece' : 'se reduce') + ' en ' + n + ' paso' + (n > 1 ? 's' : '') + w;
  if (a === 'rot')   return 'gira ' + (n * 45) + ' grados en sentido ' + (s > 0 ? 'horario' : 'antihorario');
  if (a === 'pos')   return 'avanza ' + n + (n > 1 ? ' posiciones' : ' posición') + (s > 0 ? ' en sentido horario' : ' en sentido antihorario') + ' por el borde de la celda';
  return 'cambia';
}
function matrixRuleText(a, spec, g, dirWord){
  const L = ATTR_LABEL[a], along = dirWord === 'row' ? 'a lo largo de cada fila' : 'hacia abajo en cada columna', dw = DIRW[dirWord];
  const vals = function(x){ return valName(a, x); };
  if (spec.type === 'const') return L + ': constante, igual en las nueve celdas (' + vals(g[0][0]) + ').';
  if (spec.type === 'rowconst') return L + ': constante dentro de cada ' + dw + ' y distinta en cada ' + dw + '.';
  if (spec.type === 'prog') return L + ': progresión. De una celda a la siguiente ' + along + ', ' + stepText(a, spec.s, false) + '.';
  if (spec.type === 'dist3'){
    const set = uniq([g[0][0], g[0][1], g[0][2], g[1][0], g[1][1], g[1][2]]).map(vals).join(', ');
    return L + ': distribución de tres. Los tres valores (' + set + ') aparecen una vez en cada ' + dw + ', desplazados una posición de una ' + dw + ' a la siguiente.';
  }
  if (spec.type === 'arith') return L + ': aritmética. En cada ' + dw + ' la tercera celda tiene el número de la primera ' + (spec.op === 'add' ? 'MÁS' : 'MENOS') + ' el de la segunda.';
  return L + ': ' + spec.type;
}
function seqRuleText(a, spec, seq){
  const L = ATTR_LABEL[a], wrap = ATTR_KIND[a] !== 'cyc';
  if (spec.type === 'const') return L + ': constante (' + valName(a, seq[0]) + ').';
  if (spec.type === 'prog1' || spec.type === 'prog2' || spec.type === 'prog3') return L + ': progresión. En cada paso ' + stepText(a, spec.s, wrap) + '.';
  if (spec.type === 'alt2') return L + ': alterna entre ' + valName(a, seq[0]) + ' y ' + valName(a, seq[1]) + '.';
  if (spec.type === 'cyc3') return L + ': recorre tres valores (' + [0,1,2].map(function(i){ return valName(a, seq[i]); }).join(', ') + ') y se repite.';
  if (spec.type === 'lag2'){
    const de = spec.de, dO = spec.dO;
    const t = function(d){ return d === 0 ? 'se mantiene igual' : stepText(a, d > (ATTR_D[a] / 2) ? d - ATTR_D[a] : d, wrap); };
    return L + ': dos secuencias intercaladas. Figuras 1, 3, 5: en cada paso ' + t(de) + '; figuras 2, 4, 6: en cada paso ' + t(dO) + '.';
  }
  if (spec.type === 'bounce') return L + ': sube o baja un paso cada vez e invierte el sentido al llegar al final de la escala (rebote).';
  return L + ': ' + spec.type;
}

/* ---------- Matrix: rule generation ---------- */
function tierToSpec(rng, tier){
  if (tier === 'rowconst') return { type:'rowconst' };
  if (tier === 'dist3') return { type:'dist3' };
  if (tier === 'arith') return { type:'arith', op: rng.pick(['add','sub']) };
  if (tier === 'prog1') return { type:'prog', s: rng.pick([1, -1]) };
  if (tier === 'prog2') return { type:'prog', s: rng.pick([2, -2]) };
  if (tier === 'prog3') return { type:'prog', s: rng.pick([3, -3]) };
  return { type:'const' };
}
function compatRule(a, tier){
  const kind = ATTR_KIND[a];
  if (a === 'shape') return tier === 'rowconst' || tier === 'dist3';
  if (tier === 'arith') return a === 'count';
  if (tier === 'prog3') return kind === 'cyc';
  return true;
}
const ADD_TRIPLES = [[1,1,2],[1,2,3],[2,1,3],[2,2,4],[1,3,4],[3,1,4],[1,4,5],[4,1,5],[2,3,5],[3,2,5]];
const SUB_TRIPLES = [[2,1,1],[3,1,2],[3,2,1],[4,1,3],[4,2,2],[4,3,1],[5,1,4],[5,2,3],[5,3,2],[5,4,1]];
function genGrid(rng, a, spec, dom){
  const D = ATTR_D[a], kind = ATTR_KIND[a];
  if (spec.type === 'const') return fill3(rng.pick(dom));
  if (spec.type === 'rowconst'){
    if (dom.length < 3) return null;
    const v = rng.shuffle(dom).slice(0, 3);
    return [[v[0], v[0], v[0]], [v[1], v[1], v[1]], [v[2], v[2], v[2]]];
  }
  if (spec.type === 'prog'){
    const s = spec.s;
    const starts = range(D).filter(function(x){ return kind === 'cyc' || (x + 2 * s >= 0 && x + 2 * s < D); });
    if (!starts.length) return null;
    const sh = rng.shuffle(starts), rows = [];
    for (let r = 0; r < 3; r++){
      const x = sh[r % sh.length];
      rows.push(kind === 'cyc' ? [x, mod(x + s, D), mod(x + 2 * s, D)] : [x, x + s, x + 2 * s]);
    }
    return rows;
  }
  if (spec.type === 'dist3'){
    if (dom.length < 3) return null;
    const t = rng.shuffle(dom).slice(0, 3), k = rng.pick([1, 2]), rows = [];
    for (let r = 0; r < 3; r++) rows.push([t[mod(0 + r * k, 3)], t[mod(1 + r * k, 3)], t[mod(2 + r * k, 3)]]);
    return rows;
  }
  if (spec.type === 'arith'){
    const tr = rng.shuffle(spec.op === 'add' ? ADD_TRIPLES : SUB_TRIPLES).slice(0, 3);
    return tr.map(function(t){ return [t[0] - 1, t[1] - 1, t[2] - 1]; });
  }
  return null;
}

/* ---------- Matrix: independent solver ---------- */
// g: 3x3 grid of attribute values with g[2][2] === null. Lines are rows. Returns every prediction
// of the hypotheses in the catalogue that fit the eight visible cells.
function lineHyps(g, a){
  const kind = ATTR_KIND[a], D = ATTR_D[a], preds = [];
  const l0 = g[0], l1 = g[1], l2 = g[2];
  const eq3 = function(l){ return l[0] === l[1] && l[1] === l[2]; };
  if (eq3(l0) && eq3(l1) && l0[0] === l1[0] && l2[0] === l0[0] && l2[1] === l0[0]) preds.push({ n:'const', p:l0[0] });
  if (eq3(l0) && eq3(l1) && l2[0] === l2[1]) preds.push({ n:'rowconst', p:l2[0] });
  if (kind !== 'cat'){
    const steps = kind === 'cyc' ? [1, -1, 2, -2, 3, -3] : [1, -1, 2, -2];
    steps.forEach(function(s){
      const ok = function(l){
        return kind === 'cyc' ? (mod(l[1] - l[0], D) === mod(s, D) && mod(l[2] - l[1], D) === mod(s, D)) : (l[1] - l[0] === s && l[2] - l[1] === s);
      };
      if (ok(l0) && ok(l1)){
        const fits = kind === 'cyc' ? mod(l2[1] - l2[0], D) === mod(s, D) : l2[1] - l2[0] === s;
        if (fits){
          const p = kind === 'cyc' ? mod(l2[1] + s, D) : l2[1] + s;
          if (kind === 'cyc' || (p >= 0 && p < D)) preds.push({ n:'prog' + s, p:p });
        }
      }
    });
  }
  const d3 = function(l){ return l[0] !== l[1] && l[1] !== l[2] && l[0] !== l[2]; };
  const sameSet = function(x, y){ return x.every(function(v){ return y.indexOf(v) >= 0; }); };
  if (d3(l0) && d3(l1) && sameSet(l0, l1) && l2[0] !== l2[1] && l0.indexOf(l2[0]) >= 0 && l0.indexOf(l2[1]) >= 0){
    preds.push({ n:'dist3', p: l0.filter(function(v){ return v !== l2[0] && v !== l2[1]; })[0] });
  }
  if (a === 'count'){
    const addOk = function(l){ return (l[0] + 1) + (l[1] + 1) === l[2] + 1; };
    const subOk = function(l){ return (l[0] + 1) - (l[1] + 1) === l[2] + 1; };
    if (addOk(l0) && addOk(l1)){ const p = (l2[0] + 1) + (l2[1] + 1) - 1; if (p < D) preds.push({ n:'add', p:p }); }
    if (subOk(l0) && subOk(l1)){ const p = (l2[0] + 1) - (l2[1] + 1) - 1; if (p >= 0) preds.push({ n:'sub', p:p }); }
  }
  return preds;
}
function solveMatrix(cells, ctx){
  const vals = {};
  for (let k = 0; k < ctx.active.length; k++){
    const a = ctx.active[k];
    const g = [[0,0,0],[0,0,0],[0,0,null]];
    for (let i = 0; i < 8; i++) g[Math.floor(i / 3)][i % 3] = cells[i][a];
    const preds = lineHyps(g, a).concat(lineHyps(transpose3(g), a));
    const set = uniq(preds.map(function(h){ return h.p; }));
    if (set.length === 0) return { ok:false, why:'no rule fits attribute ' + a };
    if (set.length > 1) return { ok:false, why:'ambiguous attribute ' + a };
    vals[a] = set[0];
  }
  return { ok:true, cell: cellFrom(ctx, vals) };
}

/* ---------- Distractors ---------- */
function cycDist(a, x, y){ const D = ATTR_D[a]; const d = Math.abs(x - y); return ATTR_KIND[a] === 'cyc' ? Math.min(d, D - d) : d; }
// Builds nOpts options: the answer plus distractors that each differ from it in exactly ONE attribute
// (one broken rule). hints[a] = preferred wrong values (values that appear nearby, or the step before/after).
function buildOptions(rng, answer, ctx, nOpts, hints, closeP, varying){
  const per = {};
  ctx.active.forEach(function(a){
    const dom = domainOf(ctx, a).filter(function(v){ return v !== answer[a]; });
    const pref = uniq((hints[a] || []).filter(function(v){ return dom.indexOf(v) >= 0; }));
    let rest = dom.filter(function(v){ return pref.indexOf(v) < 0; });
    if (ATTR_KIND[a] !== 'cat' && rng.chance(closeP)){
      rest = rng.shuffle(rest).sort(function(x, y){ return cycDist(a, x, answer[a]) - cycDist(a, y, answer[a]); });
    } else rest = rng.shuffle(rest);
    let order = pref.concat(rest);
    if (ATTR_KIND[a] !== 'cat' && closeP >= 0.5 && rng.chance(closeP)){
      order = order.slice().sort(function(x, y){ return cycDist(a, x, answer[a]) - cycDist(a, y, answer[a]); });
    }
    per[a] = { vals: order, i: 0 };
  });
  const vary = ctx.active.filter(function(a){ return varying.indexOf(a) >= 0; });
  const rest = ctx.active.filter(function(a){ return varying.indexOf(a) < 0; });
  const attrOrder = rng.shuffle(vary).concat(rng.shuffle(rest));
  const opts = [{ cell: answer, attr: null, from: null, to: null }];
  const seen = {}; seen[sig(answer)] = 1;
  let progress = true;
  while (opts.length < nOpts && progress){
    progress = false;
    for (let k = 0; k < attrOrder.length && opts.length < nOpts; k++){
      const a = attrOrder[k], p = per[a];
      while (p.i < p.vals.length){
        const v = p.vals[p.i++];
        const cell = Object.assign({}, answer); cell[a] = v;
        if (!seen[sig(cell)]){ seen[sig(cell)] = 1; opts.push({ cell: cell, attr: a, from: answer[a], to: v }); progress = true; break; }
      }
    }
  }
  if (opts.length < nOpts) return null;
  const shuffled = rng.shuffle(opts);
  return { options: shuffled.map(function(o){ return o.cell; }), notes: shuffled.map(function(o){ return o.attr === null ? null : { attr:o.attr, from:o.from, to:o.to }; }), answer: shuffled.findIndex(function(o){ return o.attr === null; }) };
}
function noteText(n, kindWord){
  if (!n) return '';
  return 'Difiere de la figura correcta solo en ' + (ATTR_LABEL[n.attr].toLowerCase()) + ': muestra ' + valName(n.attr, n.to) + ' donde ' + (kindWord === 'analogy' ? 'la analogía' : 'la regla') + ' exige ' + valName(n.attr, n.from) + '.';
}

/* ---------- Hints ---------- */
function makeHints(kind, varying, typeTexts, rulesText, answerLetterFn){
  const names = varying.map(function(a){ return ATTR_LABEL[a].toLowerCase(); }).join(', ');
  let h1, h2;
  const nv = varying.length, chg = nv === 1 ? '1 atributo cambia' : nv + ' atributos cambian';
  if (kind === 'matrix') h1 = chg + ' entre las figuras: ' + names + '. Ignora el resto, que nunca cambia.';
  else if (kind === 'series') h1 = chg + ' a lo largo de la serie: ' + names + '. Sigue cada uno por separado.';
  else if (kind === 'analogy') h1 = 'El cambio de A a B afecta a: ' + names + '. Todo lo demás se mantiene.';
  else if (kind === 'odd') h1 = 'La figura distinta rompe una regla sobre: ' + names + '. Compara esos atributos en todas las figuras.';
  else h1 = 'Toma las dos primeras celdas de una fila (o columna) y mira qué marcas aparecen en la tercera. Hazlo marca por marca.';
  if (kind === 'matrix') h2 = 'Método: toma un atributo cada vez y léelo a lo largo de las filas y hacia abajo en las columnas. Tipo de regla por atributo: ' + typeTexts.join('; ') + '.';
  else if (kind === 'series') h2 = 'Método: escribe el valor de un atributo para cada figura y busca un paso constante, una alternancia, un ciclo de tres o dos secuencias intercaladas. Tipos de regla: ' + typeTexts.join('; ') + '.';
  else if (kind === 'analogy') h2 = 'Método: describe de A a B una lista de cambios (cada atributo: igual, o un paso arriba/abajo) y aplica exactamente la misma lista a C. Tipos de cambio: ' + typeTexts.join('; ') + '.';
  else if (kind === 'odd') h2 = 'Método: para cada atributo pregúntate si todas las figuras menos una comparten un valor o una relación. Tipos de regla: ' + typeTexts.join('; ') + '.';
  else h2 = 'Método: deduce el operador lógico con las filas 1 y 2 y aplícalo marca por marca a la fila 3. Tipo: ' + typeTexts.join('; ') + '.';
  return [h1, h2, 'Solución paso a paso:\n' + rulesText.join('\n') + '\nLa figura correcta es la opción ' + answerLetterFn() + '.'];
}

/* ---------- Matrix builder ---------- */
function buildMatrix(rng, level, ov){
  const P = MATRIX_P[level], nOpts = (ov && ov.opts) || P.opts;
  const chosen = pickAttrs(rng, P.attrs, P.nVar);
  if (!chosen) return null;
  const ctx = makeCtx(chosen);
  const grids = {}, specs = {}, tiersUsed = {};
  for (let k = 0; k < ctx.active.length; k++){
    const a = ctx.active[k];
    if (chosen.indexOf(a) >= 0){
      const tiers = rng.shuffle(P.rules.filter(function(t){ return compatRule(a, t); }));
      let done = false;
      for (let j = 0; j < tiers.length && !done; j++){
        const spec = tierToSpec(rng, tiers[j]);
        const g = genGrid(rng, a, spec, domainOf(ctx, a));
        if (g){ grids[a] = g; specs[a] = spec; tiersUsed[a] = tiers[j]; done = true; }
      }
      if (!done) return null;
    } else { grids[a] = fill3(rng.pick(domainOf(ctx, a))); specs[a] = { type:'const' }; tiersUsed[a] = 'const'; }
  }
  const transposed = rng.chance(P.transp);
  const cells = [];
  for (let i = 0; i < 9; i++){
    const r = Math.floor(i / 3), c = i % 3, vals = {};
    ctx.active.forEach(function(a){ vals[a] = transposed ? grids[a][c][r] : grids[a][r][c]; });
    cells.push(cellFrom(ctx, vals));
  }
  const answer = cells[8];
  const prompt = cells.slice(0, 8).concat([null]);
  const hints = {};
  chosen.forEach(function(a){
    const h = [];
    [cells[6], cells[7], cells[2], cells[5]].forEach(function(x){ h.push(x[a]); });
    if (ATTR_KIND[a] !== 'cat'){ h.push(answer[a] + 1, answer[a] - 1); if (ATTR_KIND[a] === 'cyc'){ h.push(mod(answer[a] + 2, ATTR_D[a]), mod(answer[a] - 2, ATTR_D[a])); } }
    hints[a] = h.map(function(v){ return ATTR_KIND[a] === 'cyc' ? mod(v, ATTR_D[a]) : v; });
  });
  const built = buildOptions(rng, answer, ctx, nOpts, hints, P.close, chosen);
  if (!built) return null;
  const dirWord = transposed ? 'column' : 'row';
  const rules = ctx.active.map(function(a){ return matrixRuleText(a, specs[a], grids[a], dirWord); });
  let score = 0;
  chosen.forEach(function(a){ score += RULE_WEIGHT[tiersUsed[a]] || 1; });
  score += nOpts * 0.3 + P.close * 2;
  const typeTexts = chosen.map(function(a){ return ATTR_LABEL[a].toLowerCase() + ' = ' + ruleKindName(specs[a]); });
  const item = { kind:'matrix', level:level, prompt:prompt, options:built.options, answer:built.answer, notes:built.notes, ctx:ctx, rules:rules,
    varying:chosen, dir:dirWord, score:score, nOpts:nOpts };
  item.hints = makeHints('matrix', chosen, typeTexts, rules, function(){ return String(item.answer + 1); });
  return item;
}
function ruleKindName(spec){
  if (spec.type === 'prog') return 'progresión de paso ' + (spec.s > 0 ? '+' : '') + spec.s;
  if (spec.type === 'rowconst') return 'constante por línea';
  if (spec.type === 'dist3') return 'distribución de tres';
  if (spec.type === 'arith') return spec.op === 'add' ? 'suma' : 'resta';
  return spec.type;
}

/* ---------- Series ---------- */
function seqHyps(v, a){
  const kind = ATTR_KIND[a], D = ATTR_D[a], preds = [];
  [1, 2, 3].forEach(function(p){
    let ok = true;
    for (let i = p; i < 5; i++) if (v[i] !== v[i - p]) ok = false;
    if (ok) preds.push({ n:'period' + p, p: v[5 - p] });
  });
  if (kind !== 'cat'){
    const d = mod(v[1] - v[0], D);
    let ok = true;
    for (let i = 1; i < 5; i++) if (mod(v[i] - v[i - 1], D) !== d) ok = false;
    if (ok && d !== 0) preds.push({ n:'step', p: mod(v[4] + d, D) });
    const de = mod(v[2] - v[0], D);
    if (mod(v[4] - v[2], D) === de){
      const dO = mod(v[3] - v[1], D);
      preds.push({ n:'lag2', p: mod(v[3] + dO, D) });
    }
    if (kind === 'ord' && Math.abs(v[1] - v[0]) === 1){
      let pos = v[0], dir = v[1] - v[0], ok2 = true;
      for (let i = 1; i < 5 && ok2; i++){
        let nx = pos + dir;
        if (nx < 0 || nx >= D){ dir = -dir; nx = pos + dir; }
        if (nx !== v[i]) ok2 = false;

  else if (mode === 'adaptive') cfg.level = 2;
  else {
    cfg.level = +$('cLevel').value; cfg.promptSec = +$('cTime').value; cfg.items = +$('cItems').value; cfg.opts = +$('cOpts').value; cfg.enforce = $('cHard').checked;
  }
  if (mode !== 'custom') cfg.items = 20;
  if (cfg.level > HINT_MAX_LEVEL) cfg.hintMax = 0;
  Object.assign(p, { mode:mode, type:cfg.type, goal:goal, dual:cfg.dual, hint:cfg.hintMax, level:mode === 'manual' ? cfg.level : p.level });
  if (mode === 'custom') Object.assign(p, { level:cfg.level, cTime:cfg.promptSec, cItems:cfg.items, cOpts:cfg.opts, cHard:cfg.enforce });
  save();
  startSession(cfg);
}

/* ---------- Session ---------- */
function timingFor(cfg, level){
  if (cfg.mode === 'custom') return { prompt:cfg.promptSec, hard: cfg.enforce ? Math.round(cfg.promptSec * 1.5) : 0 };
  return TIMING[level];
}
function startSession(cfg){
  clearAll();
  S = { cfg:cfg, idx:0, results:[], items:[], done:false, adapt:{ level:cfg.level, ups:0, downs:0 }, hintTier:0, prompted:false, t0:0, phase:'item',
    dual:{ rng:makeRng(cfg.seed + '|dual'), next:0, until:0, hits:0, misses:0, falsePress:0, responded:false, on:false } };
  S.dual.next = performance.now() + 5000 + S.dual.rng.int(5000);
  tickId = setInterval(tick, 100);
  nextItem();
}
function levelNow(){ return S.cfg.mode === 'adaptive' ? S.adapt.level : S.cfg.level; }
function nextItem(){
  const cfg = S.cfg, i = S.idx, level = levelNow();
  const kind = kindFor(cfg.type, cfg.seed, i);
  let item;
  try { item = genItem(cfg.seed, kind, level, i, cfg.mode === 'custom' ? { opts:cfg.opts } : null); }
  catch (e) { show('<p class="bad">' + esc(e.message) + '</p>'); return; }
  item.playLevel = level;
  S.items[i] = item; S.hintTier = 0; S.prompted = false; S.phase = 'item'; S.t0 = performance.now();
  renderItem();
}
function optionLabel(i){ return String(i + 1); }
function figuresHTML(item, mode, chosen){
  let h = '';
  if (item.kind === 'matrix' || item.kind === 'logic'){
    h += '<div class="mat">' + item.prompt.map(function(c){ return '<div>' + cellSVG(c) + '</div>'; }).join('') + '</div>';
  } else if (item.kind === 'series'){
    h += '<div class="seq">' + item.prompt.map(function(c){ return '<div>' + cellSVG(c) + '</div>'; }).join('') + '<div>' + cellSVG(null) + '</div></div>';
  } else if (item.kind === 'analogy'){
    h += '<div class="ana"><div>' + cellSVG(item.prompt[0]) + '</div><div>' + cellSVG(item.prompt[1]) + '</div><div>' + cellSVG(item.prompt[2]) + '</div><div>' + cellSVG(null) + '</div></div>';
  }
  h += '<div class="opts" id="opts">' + item.options.map(function(c, i){
    let cls = 'opt';
    if (mode === 'review'){ if (i === item.answer) cls += ' right'; else if (i === chosen) cls += ' wrong'; }
    return '<button class="' + cls + '" data-i="' + i + '"' + (mode === 'review' ? ' disabled' : '') + ' aria-label="Opción ' + optionLabel(i) + '"><span class="let">' + optionLabel(i) + '</span>' + cellSVG(c) + '</button>';
  }).join('') + '</div>';
  return h;
}
const INSTR = { matrix:'', logic:'', series:'', analogy:'A : B = C : ?', odd:'La figura distinta' };
function dualHTML(){
  if (!S.cfg.dual) return '';
  return '<p class="soft small" id="dualp" style="cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px"><span class="lamp" id="lamp"></span> <kbd>K</kbd> <span id="dstat"></span></p>';
}
function headerHTML(item){
  const done = S.results.length, correct = S.results.filter(function(r){ return r.ok; }).length;
  return '<div class="head"><span><b>' + (S.idx + 1) + '</b> / ' + S.cfg.items + '</span><span>' + ic(KIND_ICON[item.kind]) + KIND_LABEL[item.kind] + '</span><span>N<b>' + item.playLevel + '</b> ' + LEVEL_NAMES[item.playLevel] + '</span>' +
    '<span>' + ic('check') + '<b>' + correct + '</b> / ' + done + '</span><span class="timer" id="tm">0.0 s</span></div>' +
    '<div class="bar"><div style="width:' + Math.round(done / S.cfg.items * 100) + '%"></div></div>' + dualHTML();
}
function hintAllowed(){ return S.cfg.hintMax > 0 && S.items[S.idx].playLevel <= HINT_MAX_LEVEL; }
function renderItem(){
  const item = S.items[S.idx];
  show(headerHTML(item) + (INSTR[item.kind] ? '<p><b>' + INSTR[item.kind] + '</b></p>' : '') +
    figuresHTML(item, 'play') +
    '<div id="banner"></div>' +
    '<p class="row"><button class="btn" id="skip">' + ic('skip') + 'Saltar <kbd>S</kbd></button>' + (hintAllowed() ? '<button class="btn" id="hintb">' + ic('hint') + 'Pista <kbd>H</kbd></button>' : '') + '</p>' +
    '<div id="hintbox" class="hintbox"></div>');
  $('opts').addEventListener('click', function(e){
    const b = e.target.closest ? e.target.closest('button.opt') : null;
    if (b) answer(+b.getAttribute('data-i'), 'pick');
  });
  $('skip').addEventListener('click', function(){ answer(-1, 'skip'); });
  if ($('hintb')) $('hintb').addEventListener('click', giveHint);
  onKey = function(e){
    const k = e.key;
    if (/^[0-9]$/.test(k)){ const i = k === '0' ? 9 : (+k - 1); if (i < item.options.length) answer(i, 'pick'); return; }
    if (k === 's' || k === 'S') answer(-1, 'skip');
    else if (k === 'h' || k === 'H') giveHint();
    else if (k === 'g' || k === 'G'){ if (S.prompted) answer(S.dual.rng.int(item.options.length), 'guess'); }
    else if (k === 'k' || k === 'K') dualPress();
  };
}
function giveHint(){
  if (!hintAllowed() || S.phase !== 'item') return;
  const item = S.items[S.idx];
  if (S.hintTier >= Math.min(3, S.cfg.hintMax)) return;
  S.hintTier++;
  let h = '';
  for (let t = 0; t < S.hintTier; t++) h += '<p>' + esc(item.hints[t]).replace(/\n/g, '<br>') + '</p>';
  $('hintbox').innerHTML = '<p><b>' + S.hintTier + ' / ' + Math.min(3, S.cfg.hintMax) + '</b>' + (S.hintTier === 3 ? ' · en blanco' : '') + '</p>' + h;
  if (S.hintTier === 3){
    const b = document.querySelectorAll('button.opt')[item.answer];
    if (b) b.classList.add('hinted');
  }
}
function tick(){
  if (!S || S.done) return;
  const now = performance.now();
  if (S.phase === 'item'){
    const item = S.items[S.idx], tm = timingFor(S.cfg, item.playLevel);
    const el = now - S.t0, t = $('tm');
    if (t){
      t.textContent = fmt(el / 1000, 1) + ' s';
      t.className = 'timer' + (el >= tm.prompt * 1000 ? (tm.hard && el >= tm.hard * 1000 * 0.85 ? ' over' : ' late') : '');
    }
    if (el >= tm.prompt * 1000 && !S.prompted){
      S.prompted = true;
      const bn = $('banner');
      if (bn) bn.innerHTML = '<p class="warn"><b>' + tm.prompt + ' s</b> · <kbd>G</kbd> adivinar' + (tm.hard ? ' · se salta a los ' + tm.hard + ' s' : '') + '</p>';
    }
    if (tm.hard && el >= tm.hard * 1000) answer(-1, 'timeout');
  }
  // dual task lamp
  if (S && S.cfg.dual){
    const d = S.dual;
    if (!d.on && now >= d.next){ d.on = true; d.responded = false; d.until = now + 2500; }
    if (d.on && now >= d.until){ d.on = false; if (!d.responded) d.misses++; d.next = now + 6000 + d.rng.int(6000); }
    const l = $('lamp'); if (l) l.className = 'lamp' + (d.on ? ' on' : '');
    const s = $('dstat'); if (s) s.textContent = d.hits + ' / ' + d.misses;
  }
}
function dualPress(){
  if (!S || !S.cfg.dual) return;
  const d = S.dual;
  if (d.on && !d.responded){ d.responded = true; d.hits++; d.on = false; d.next = performance.now() + 6000 + d.rng.int(6000); }
  else d.falsePress++;
}
function answer(i, how){
  if (!S || S.phase !== 'item') return;
  S.phase = 'feedback';
  const item = S.items[S.idx], ms = performance.now() - S.t0;
  const revealed = S.hintTier >= 3;
  const blank = i < 0 || revealed;
  const ok = !blank && i === item.answer;
  S.results.push({ ok:ok, blank:blank, ms:ms, kind:item.kind, level:item.playLevel, chosen:i, how:how, hints:S.hintTier, guessed:how === 'guess', rule:item.rules[0], score:item.score });
  renderFeedback(item, i, how, ok, revealed);
}
function renderFeedback(item, chosen, how, ok, revealed){
  const r = S.results[S.results.length - 1];
  let status;
  if (revealed) status = '<p class="status warn"><b>En blanco</b></p>';
  else if (how === 'timeout') status = '<p class="status warn"><b>Tiempo agotado</b></p>';
  else if (chosen < 0) status = '<p class="status warn"><b>Saltada</b></p>';
  else if (ok) status = '<p class="status good"><b>Correcta</b></p>';
  else status = '<p class="status bad"><b>Fallo</b> · ' + optionLabel(item.answer) + '</p>';
  let why = '';
  if (chosen >= 0 && !ok && !revealed){
    const n = item.notes[chosen];
    if (n) why = '<p class="soft">' + optionLabel(chosen) + ': ' + esc(n.text || noteText(n, item.kind === 'analogy' ? 'analogy' : 'rule')) + '</p>';
  }
  let adapt = '';
  const cfg = S.cfg;
  const last = S.idx + 1 >= cfg.items;
  if (cfg.mode === 'adaptive' && (S.idx + 1) % ADAPT.block === 0){
    const blk = S.results.slice(-ADAPT.block);
    const acc = blk.filter(function(x){ return x.ok; }).length / blk.length * 100;
    const st = adaptiveStep(S.adapt, acc);
    S.adapt = { level:st.level, ups:st.ups, downs:st.downs };
    adapt = '<p><b>' + fmt(acc, 0) + ' %</b> · ' +
      (st.moved > 0 ? 'sube a ' + st.level + ' ' + LEVEL_NAMES[st.level] : st.moved < 0 ? 'baja a ' + st.level + ' ' + LEVEL_NAMES[st.level] :
       acc >= PASS_ACCURACY ? st.ups + ' / ' + ADAPT.upAfter : acc < ADAPT.failBelow ? st.downs + ' / ' + ADAPT.downAfter : 'se mantiene en ' + st.level) + '</p>';
  }
  show(headerHTML(item) + status +
    figuresHTML(item, 'review', chosen) +
    '<p class="row"><button class="btn primary" id="next">' + ic('next') + (last ? 'Resultados' : 'Siguiente') + '</button><span class="soft">' + fmt(r.ms / 1000, 1) + ' s</span></p>' +
    '<ul class="rules">' + item.rules.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' + why + adapt);
  const tm = $('tm'); if (tm) tm.textContent = fmt(r.ms / 1000, 1) + ' s';
  const go = function(){ S.idx++; if (S.idx >= cfg.items) finish(); else nextItem(); };
  $('next').addEventListener('click', go);
  $('next').focus({ preventScroll:true });
  onKey = function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    else if (e.key === 'k' || e.key === 'K') dualPress();
  };
}
function finish(){
  const cfg = S.cfg, res = S.results;
  S.done = true; stopTick();
  const correct = res.filter(function(r){ return r.ok; }).length, blank = res.filter(function(r){ return r.blank; }).length, wrong = res.length - correct - blank;
  const accuracy = correct / res.length * 100;
  const spi = res.reduce(function(a, r){ return a + r.ms; }, 0) / res.length / 1000;
  const lv = cfg.mode === 'adaptive' ? Math.round(res.reduce(function(a, r){ return a + r.level; }, 0) / res.length) : cfg.level;
  const met = evaluateGoal(cfg.goal, { accuracy:accuracy, spi:spi, correct:correct });
  const d = load();
  const timing = timingFor(cfg, lv);
  const rec = recommend(accuracy, spi, lv, timing.prompt);
  const before = d.sessions.slice();
  const rec0 = {
    ts: new Date().toISOString(), module: MODULE_LABEL[cfg.type] + (cfg.mode === 'manual' ? '' : ' [' + cfg.mode + ']'), level: lv, mode: cfg.mode,
    correct:correct, wrong:wrong, blank:blank, spi:spi, accuracy:accuracy, goal:cfg.goal, met:met,
    params: 'seed ' + cfg.seed + ', ' + cfg.items + ' items, hints<=' + cfg.hintMax + (cfg.dual ? ', dual task' : '') + (cfg.mode === 'custom' ? ', limit ' + cfg.promptSec + ' s, ' + cfg.opts + ' options' : ''),
    thirds: atcThirds(res.map(function(r){ return { ok:r.ok, blank:r.blank, sec:r.ms / 1000 }; }), 0)
  };
  d.sessions.push(rec0); save();
  const pbPrev = cfg.mode === 'manual' ? personalBest(before, lv) : null;
  const newPB = cfg.mode === 'manual' && accuracy >= PASS_ACCURACY && (pbPrev === null || spi < pbPrev);
  const streak = currentStreak(d.sessions);
  // by kind
  const kinds = {};
  res.forEach(function(r){ const k = kinds[r.kind] = kinds[r.kind] || { n:0, ok:0, ms:0 }; k.n++; if (r.ok) k.ok++; k.ms += r.ms; });
  const kindRows = Object.keys(kinds).map(function(k){ const x = kinds[k]; return '<tr><td>' + ic(KIND_ICON[k]) + KIND_LABEL[k] + '</td><td>' + x.n + '</td><td>' + x.ok + '</td><td>' + fmt(x.ok / x.n * 100, 0) + ' %</td><td>' + fmt(x.ms / x.n / 1000, 1) + ' s</td></tr>'; }).join('');
  const itemRows = res.map(function(r, i){
    return '<tr><td>' + (i + 1) + '</td><td>' + ic(KIND_ICON[r.kind]) + KIND_LABEL[r.kind] + '</td><td>' + r.level + '</td><td>' + (r.ok ? '<span class="good">correcta</span>' : (r.blank ? '<span class="warn">en blanco</span>' : '<span class="bad">fallo</span>')) + '</td><td>' + fmt(r.ms / 1000, 1) + ' s</td><td>' + (r.hints || '') + '</td></tr>';
  }).join('');
  const dual = cfg.dual ? '<div class="fig"><b>' + S.dual.hits + ' / ' + (S.dual.hits + S.dual.misses) + '</b><span>Lámpara</span></div>' : '';
  show('<h1>' + esc(moduleEs(rec0.module)) + '</h1><p class="soft">N' + lv + ' ' + LEVEL_NAMES[lv] + (cfg.mode === 'adaptive' ? ' → ' + S.adapt.level : '') + ' · ' + esc(cfg.seed) + '</p>' +
    '<div class="figs"><div class="fig"><b>' + fmt(accuracy, 1) + ' %</b><span>' + correct + ' / ' + wrong + ' / ' + blank + '</span></div>' +
    '<div class="fig"><b>' + fmt(spi, 1) + ' s</b><span>por ítem</span></div>' +
    '<div class="fig"><b>' + (met === true ? '<span class="good">Cumplido</span>' : (met === false ? '<span class="bad">No cumplido</span>' : '–')) + '</b><span>' + esc(cfg.goal) + '</span></div>' +
    '<div class="fig"><b>' + streak + '</b><span>Racha</span></div>' + dual + '</div>' +
    (newPB ? '<p class="good"><b>' + ic('check') + 'Récord</b> · ' + fmt(spi, 2) + ' s</p>' : '') +
    (rec0.thirds ? '<p class="soft" id="thirdsLine">' + esc(atcThirdsLine(rec0.thirds)) + '</p>' : '') +
    '<div class="tab-box"><table><thead><tr><th>Tipo</th><th>Ítems</th><th>Aciertos</th><th>Precisión</th><th>Ritmo</th></tr></thead><tbody>' + kindRows + '</tbody></table></div>' +
    '<h2>Ítems</h2><div class="tab-box"><table><thead><tr><th>#</th><th>Tipo</th><th>Nivel</th><th></th><th>Tiempo</th><th>Pistas</th></tr></thead><tbody>' + itemRows + '</tbody></table></div>' +
    '<p class="row" style="margin-top:18px"><button class="btn primary" id="again">' + ic('repeat') + 'Repetir</button><button class="btn" id="replay">' + ic('repeat') + 'Misma serie</button><button class="btn" id="menu">' + ic('back') + 'Menú</button><button class="btn" id="hist">' + ic('history') + 'Historial</button></p>');
  const again = function(){ const c = Object.assign({}, cfg); c.seed = 's' + Math.floor(Math.random() * 1e9).toString(36); if (c.mode === 'adaptive') c.level = 2; startSession(c); };
  $('again').addEventListener('click', again);
  $('replay').addEventListener('click', function(){ const c = Object.assign({}, cfg); if (c.mode === 'adaptive') c.level = 2; startSession(c); });
  $('menu').addEventListener('click', menu);
  $('hist').addEventListener('click', showHistory);
  onKey = function(e){ if (e.key === 'Enter'){ e.preventDefault(); again(); } else if (e.key === 'h' || e.key === 'H') showHistory(); };
}

/* ---------- History and CSV ---------- */
function trendChart(ses){
  const pts = ses.slice(-30);
  if (pts.length < 2) return '';
  const W = 640, H = 200, ml = 36, mr = 10, mt = 10, mb = 24;
  const x = function(i){ return ml + i * (W - ml - mr) / (pts.length - 1); };
  const y = function(v){ return mt + (100 - v) * (H - mt - mb) / 100; };
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Precisión" style="font-family:system-ui,sans-serif">';
  [0, 25, 50, 75, 100].forEach(function(v){ s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--rule)"/><text x="' + (ml - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">' + v + '</text>'; });
  s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(PASS_ACCURACY) + '" y2="' + y(PASS_ACCURACY) + '" stroke-dasharray="5 4" style="stroke:var(--ok)"/><text x="' + (W - mr) + '" y="' + (y(PASS_ACCURACY) - 4) + '" text-anchor="end" font-size="11" style="fill:var(--ok)">96</text>';
  s += '<polyline fill="none" stroke-width="1.6" style="stroke:var(--accent)" points="' + pts.map(function(p, i){ return f1(x(i)) + ',' + f1(y(p.accuracy)); }).join(' ') + '"/>';
  pts.forEach(function(p, i){ s += '<circle cx="' + f1(x(i)) + '" cy="' + f1(y(p.accuracy)) + '" r="3" style="fill:var(--accent)"/><text x="' + f1(x(i)) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + esc(p.level) + '</text>'; });
  return s + '</svg>';
}
function showHistory(){
  clearAll(); S = null;
  const d = load(), ses = d.sessions;
  const rows = ses.slice().reverse().slice(0, 100).map(function(s){
    return '<tr><td>' + dateES(s.ts) + '</td><td>' + esc(moduleEs(s.module)) + '</td><td>' + esc(s.level) + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td><td>' + s.blank + '</td><td>' + fmt(s.spi, 2) + '</td><td>' + fmt(s.accuracy, 1) + '</td><td>' + esc(s.goal) + '</td><td>' + (s.met === true ? 'Sí' : (s.met === false ? 'No' : '-')) + '</td><td>' + esc(paramsEs(s.params)) + '</td></tr>';
  }).join('');
  show('<button class="link" id="back">' + ic('back') + 'Menú</button><h1>Historial</h1>' + trendChart(ses) +
    '<h2>Sesiones</h2>' +
    (ses.length ? '<div class="tab-box"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Aciertos</th><th>Fallos</th><th>Blanco</th><th>s/ítem</th><th>Precisión %</th><th>Objetivo</th><th>Cumplido</th><th>Parámetros</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="soft">Sin sesiones</p>') +
    '<p class="row" style="margin-top:18px"><button class="btn primary" id="csv">' + ic('download') + 'CSV</button><button class="btn danger" id="del">' + ic('trash') + 'Borrar</button><span id="conf"></span></p>');
  $('back').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    try {
      const blob = new Blob([toCSV(d.sessions)], { type:'text/csv;charset=utf-8' });
      const a = document.createElement('a'), f = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = 'trainer-matrices-' + f.getFullYear() + pad2(f.getMonth() + 1) + pad2(f.getDate()) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { $('conf').innerHTML = '<span class="bad">Error</span>'; }
  });
  $('del').addEventListener('click', function(){
    $('conf').innerHTML = '<span class="warn">¿Borrar todo?</span> <button class="btn danger" id="yes">Borrar</button> <button class="btn" id="no">Cancelar</button>';
    $('no').addEventListener('click', function(){ $('conf').innerHTML = ''; });
    $('yes').addEventListener('click', function(){ d.sessions = []; save(); showHistory(); });
  });
  onKey = null;
}
menu();
</script>
