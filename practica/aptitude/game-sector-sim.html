<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onacc:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a6c8f0; --onacc:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
.top{display:flex;align-items:center;gap:10px;margin:0 auto;padding:14px 16px 10px}
.top .logo{width:30px;height:30px;color:var(--accent);flex:none}
.top .brand{font:700 20px/1 var(--serif);letter-spacing:.01em}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.logo{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 28px/1.2 var(--serif);margin:.3em 0 .5em}
h2{font:700 20px/1.3 var(--serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:1.6em 0 .6em}
h3{font:700 17px var(--serif);margin:1em 0 .3em}
p{margin:.4rem 0}
.soft{color:var(--muted)} .small{font-size:14px}
.good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onacc)}
.btn.primary:hover{background:var(--accent-h);color:var(--onacc)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.4;cursor:default}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;min-height:40px;margin-bottom:6px}
.link:hover{color:var(--accent-h);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;min-height:40px;width:100%;max-width:420px}
input[type=range]{width:100%;max-width:420px;min-height:32px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px;margin-right:8px}
label.lb{display:block;margin:1rem 0 .3rem;font-weight:600}
label.lb.inline{font-weight:400}
kbd,.key{font:12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:2px 6px;background:var(--surface);color:var(--muted);display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted);font-size:15px;padding:6px 0;border-bottom:1px solid var(--rule)}
.head b{color:var(--text)}
.head .ic{margin-right:4px}
.bar{height:3px;background:var(--rule);margin:0 0 12px}
.bar>div{height:100%;background:var(--accent);width:0}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.fig{padding:10px 26px 10px 0}
.fig b{display:block;font:700 28px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.tbl,.tbl-box,.tab-box,.tabla-caja{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--text);padding:6px 12px 6px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
.list{border-top:1px solid var(--text);margin:8px 0 16px}
.card{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;cursor:pointer;color:var(--text)}
.card:hover{background:var(--stripe)}
.card .ic{width:30px;height:30px;color:var(--accent);stroke-width:1.5}
.card .nm{display:block;font:700 20px/1.2 var(--serif)}
.card .dt{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hintbox{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
@media (max-width:640px){.fig{padding-right:18px}.fig b{font-size:24px}h1{font-size:25px}}

#app{max-width:1560px;margin:0 auto;padding:8px 16px 48px}
.top{max-width:1560px}
.suave{color:var(--muted)} .peq{font-size:14px}
.bien{color:var(--ok)} .mal{color:var(--err)} .aviso{color:var(--warn)}
.tecla{font:12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:2px 6px;background:var(--surface);color:var(--muted);display:inline-block}
.btn.primario{background:var(--accent);color:var(--onacc)}
.btn.primario:hover{background:var(--accent-h);color:var(--onacc)}
.btn.peligro{color:var(--err);border-color:var(--err)}
.btn.mini{padding:3px 10px;min-height:40px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cifras{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.cifra{padding:10px 24px 10px 0}
.cifra b{display:block;font:700 26px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.cifra span{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap}
.seg .btn{border-radius:0;margin-right:-1px}
.seg .btn:first-child{border-radius:2px 0 0 2px}
.seg .btn:last-child{border-radius:0 2px 2px 0;margin-right:0}
.btn.sel{background:var(--accent);color:var(--onacc)}
.lvls{border-top:1px solid var(--text);margin:8px 0 4px}
.lv{display:grid;grid-template-columns:28px 1fr auto 20px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:7px 4px;min-height:40px;cursor:pointer;color:var(--text)}
.lv:hover:not(:disabled){background:var(--stripe)}
.lv.sel{background:var(--stripe);font-weight:600}
.lv:disabled{cursor:default;opacity:.55}
.lv .n{font:700 18px var(--serif)}
.lv .m{color:var(--muted);font-size:13px;font-weight:400}
.lv .ic{width:16px;height:16px}
.rejilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 32px}
.run{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
#radar{width:min(100%, max(520px, calc((100vh - 230px) * 1.3939)));height:auto;background:#09110c;border:1px solid #2b3a30;border-radius:0;display:block;cursor:crosshair}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;color:var(--muted);font-size:14px;margin-bottom:6px}
.hud b{color:var(--text)}
.lado{display:flex;flex-direction:column;gap:12px;min-width:0}
.caja{border-top:1px solid var(--text);padding-top:4px}
.caja h4{margin:0 0 4px;font:600 13px var(--sans);color:var(--muted)}
.strips{max-height:250px;overflow:auto;font-size:13px}
.strip{display:grid;grid-template-columns:20px 62px 44px 52px 1fr;gap:4px;padding:2px 4px;align-items:center;min-height:30px;border-bottom:1px solid var(--rule);cursor:pointer;white-space:nowrap}
.strip.sel{background:var(--stripe);font-weight:600}
.strip.emg{color:var(--warn)}
.strip.conf{color:var(--err)}
.strip.inb{color:var(--muted);cursor:default}
.tarea{padding:4px 0;border-bottom:1px solid var(--rule);font-size:14px}
.tarea.urg{color:var(--err);font-weight:600}
.kv{font-size:13px}
.kv td{padding:2px 8px 2px 0;border-bottom:1px solid var(--rule)}
.kv td:first-child{color:var(--muted)}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cmds .btn{justify-content:center;padding:6px 4px;min-height:44px;font-size:14px;gap:4px}
.cmds .ic{width:16px;height:16px}
.msg{min-height:1.4rem;font-size:15px;margin-top:4px}
.log{font-size:12.5px;color:var(--muted);max-height:96px;overflow:auto}
.hintbox:empty{display:none}
@media (max-width:1100px){.run{grid-template-columns:1fr}.strips{max-height:170px}}
@media (max-width:560px){.cmds{grid-template-columns:repeat(3,1fr)}}
@media (pointer:coarse){.strip{min-height:40px}#tasks .tecla{display:inline-block;min-width:40px;min-height:40px;line-height:34px;text-align:center;font-size:14px;cursor:pointer}.tarea{line-height:2}}

<script>
'use strict';
// ==== PURE LOGIC START ====
/* Everything between the START and END markers is DOM-free and deterministic; it is tested with node.
   Units: distance NM, speed kt (velocities in NM/s), level FL (1 FL = 100 ft), heading degrees true (0 = north, clockwise), time = 1 s ticks. */
const SEP_LAT = 5;          // NM
const SEP_VERT = 10;        // FL = 1000 ft
const VEPS = 1e-6;
const BOUND = { x0:-40, x1:40, y0:-28, y1:28 };
const WP = {
  ROSAS:{x:-40,y:14}, LUNAR:{x:-40,y:-14}, MIRLO:{x:-14,y:28}, TAJO:{x:16,y:28},
  BRAVA:{x:40,y:12}, ONDAS:{x:40,y:-16}, SIRIO:{x:-12,y:-28}, PLAYA:{x:18,y:-28},
  MIDAS:{x:0,y:0}, ALTEA:{x:-20,y:5}, CUMBRE:{x:19,y:-5}, NIMBO:{x:-6,y:14}, OASIS:{x:-12,y:-9}
};
const BOUNDARY_FIXES = ['ROSAS','LUNAR','MIRLO','TAJO','BRAVA','ONDAS','SIRIO','PLAYA'];
const ROUTES = {
  R1:['ROSAS','ALTEA','MIDAS','CUMBRE','ONDAS'],
  R2:['LUNAR','OASIS','MIDAS','BRAVA'],
  R3:['MIRLO','NIMBO','MIDAS','PLAYA'],
  R4:['TAJO','CUMBRE','SIRIO']
};
// every boundary fix is the entry of exactly one directed route
const ENTRY_ROUTE = (function(){
  const m = {};
  Object.keys(ROUTES).forEach(function(k){
    const r = ROUTES[k];
    m[r[0]] = r.slice();
    m[r[r.length - 1]] = r.slice().reverse();
  });
  return m;
})();
// speeds kt (min/max/cruise), vertical rates FL/s (2000 fpm = 0.333 FL/s), acceleration kt/s
const TYPES = {
  A320:{ min:300, max:480, cruise:440, climb:0.30, desc:0.35, acc:0.7, cat:'M', lo:240, hi:380 },
  B738:{ min:300, max:480, cruise:430, climb:0.30, desc:0.35, acc:0.7, cat:'M', lo:240, hi:380 },
  E190:{ min:280, max:450, cruise:410, climb:0.30, desc:0.33, acc:0.7, cat:'M', lo:240, hi:380 },
  A333:{ min:300, max:490, cruise:450, climb:0.25, desc:0.33, acc:0.6, cat:'H', lo:260, hi:380 },
  AT72:{ min:200, max:290, cruise:260, climb:0.17, desc:0.20, acc:0.4, cat:'M', lo:200, hi:280 }
};
const TYPE_LIST = ['A320','A320','B738','B738','E190','A333','AT72'];
const CALLS = ['IBE','VLG','RYR','AEA','EZY','TAP','AFR','DLH','BAW','KLM','SAS','NAX'];
const LEVEL_MIN = 200, LEVEL_MAX = 400;

function clamp(x, a, b){ return x < a ? a : (x > b ? b : x); }
function norm360(a){ a = a % 360; if (a < 0) a += 360; return a; }
function angDiff(a, b){ let d = norm360(b - a); if (d > 180) d -= 360; return d; }   // signed shortest turn from a to b, (-180,180]
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function pad3(n){ n = Math.round(n); return (n < 10 ? '00' : (n < 100 ? '0' : '')) + n; }
function fmt(x, d){ if (x === null || x === undefined || !isFinite(x)) return '—'; return Number(x).toFixed(d === undefined ? 1 : d); }

/* ---- seeded random numbers (mulberry32) ---- */
function makeRng(seed){
  let s = (seed >>> 0) || 1;
  const r = function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return r;
}
function rInt(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }
function rPick(r, arr){ return arr[Math.floor(r() * arr.length)]; }

/* ---- geometry ---- */
function hdgVec(h){ const q = h * Math.PI / 180; return { x:Math.sin(q), y:Math.cos(q) }; }
// ground velocity in NM/s from air heading, true airspeed and wind ({from:deg, spd:kt}; wind blows FROM "from")
function groundVel(hdg, tas, wind){
  const u = hdgVec(hdg), w = hdgVec(wind.from + 180);
  return { x:(u.x * tas + w.x * wind.spd) / 3600, y:(u.y * tas + w.y * wind.spd) / 3600 };
}
function bearingTo(p, q){ return norm360(Math.atan2(q.x - p.x, q.y - p.y) * 180 / Math.PI); }
// air heading needed to make good a ground course in the given wind
function headingForCourse(course, tas, wind){
  const rel = (wind.from + 180 - course) * Math.PI / 180;
  const s = clamp(wind.spd * Math.sin(rel) / Math.max(tas, 1), -1, 1);
  return norm360(course - Math.asin(s) * 180 / Math.PI);
}
// Closest point of approach of two constant-velocity points (velocities in NM/s): time t >= 0 and distance d
function cpa(p1, v1, p2, v2){
  const rx = p2.x - p1.x, ry = p2.y - p1.y, vx = v2.x - v1.x, vy = v2.y - v1.y;
  const vv = vx * vx + vy * vy;
  let t = vv < 1e-12 ? 0 : -(rx * vx + ry * vy) / vv;
  if (t < 0) t = 0;
  return { t:t, d:Math.hypot(rx + vx * t, ry + vy * t) };
}
// Times when the relative distance is below R: returns [t1,t2] (t1 may be negative) or null
function sepWindowRel(rx, ry, vx, vy, R){
  const a = vx * vx + vy * vy, b = 2 * (rx * vx + ry * vy), c = rx * rx + ry * ry - R * R;
  if (a < 1e-12) return c < 0 ? [-Infinity, Infinity] : null;
  const disc = b * b - 4 * a * c;
  if (disc <= 0) return null;
  const sq = Math.sqrt(disc);
  return [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
}
// Same, for two aircraft, restricted to t >= 0 (window of horizontal separation loss)
function sepLossWindow(p1, v1, p2, v2, R){
  const w = sepWindowRel(p2.x - p1.x, p2.y - p1.y, v2.x - v1.x, v2.y - v1.y, R);
  if (!w || w[1] < 0) return null;
  return [Math.max(w[0], 0), w[1]];
}
// Where do two straight tracks cross, and when does each aircraft reach that point? (null if parallel or already past)
function crossingInfo(pa, va, pb, vb){
  const dx = pb.x - pa.x, dy = pb.y - pa.y;
  const det = -va.x * vb.y + vb.x * va.y;
  if (Math.abs(det) < 1e-12) return null;
  const t = (dx * (-vb.y) + vb.x * dy) / det;
  const s = (va.x * dy - va.y * dx) / det;
  if (t <= 0 || s <= 0) return null;
  return { x:pa.x + va.x * t, y:pa.y + va.y * t, tA:t, tB:s };
}
// Rate of change of the bearing from A to B in degrees per second, and range rate (NM/s, negative = closing).
function bearingRate(pa, va, pb, vb){
  const rx = pb.x - pa.x, ry = pb.y - pa.y, vx = vb.x - va.x, vy = vb.y - va.y;
  const r2 = rx * rx + ry * ry;
  if (r2 < 1e-12) return { rate:0, range:0, rangeRate:0 };
  return { rate:((rx * vy - ry * vx) / r2) * 180 / Math.PI, range:Math.sqrt(r2), rangeRate:(rx * vx + ry * vy) / Math.sqrt(r2) };
}
function segSeg(p, p2, q, q2){
  const rx = p2.x - p.x, ry = p2.y - p.y, sx = q2.x - q.x, sy = q2.y - q.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-12) return null;
  const t = ((q.x - p.x) * sy - (q.y - p.y) * sx) / den;
  const u = ((q.x - p.x) * ry - (q.y - p.y) * rx) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { x:p.x + rx * t, y:p.y + ry * t, ta:t, tb:u };
}
function routePts(names){ return names.map(function(n){ return WP[n]; }); }
function routeLen(names){
  let d = 0; const p = routePts(names);
  for (let i = 1; i < p.length; i++) d += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
  return d;
}
function distAlong(names, pt){ // distance from the start of the route to the point pt (assumed on the route)
  const p = routePts(names); let acc = 0;
  for (let i = 1; i < p.length; i++){
    const L = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
    const s = segSeg(p[i - 1], p[i], { x:pt.x - 1e-6, y:pt.y - 1e-6 }, { x:pt.x + 1e-6, y:pt.y + 1e-6 });
    const ex = Math.abs((pt.x - p[i - 1].x) * (p[i].y - p[i - 1].y) - (pt.y - p[i - 1].y) * (p[i].x - p[i - 1].x)) / (L || 1);
    const along = ((pt.x - p[i - 1].x) * (p[i].x - p[i - 1].x) + (pt.y - p[i - 1].y) * (p[i].y - p[i - 1].y)) / (L || 1);
    if (ex < 1e-3 && along >= -1e-3 && along <= L + 1e-3 && s !== undefined) return acc + along;
    acc += L;
  }
  return null;
}
// First place where two routes cross (or share the named waypoint "via"), with the distance flown along each route.
function routeCross(rA, rB, via){
  if (via && rA.indexOf(via) >= 0 && rB.indexOf(via) >= 0){
    const pt = WP[via];
    return { x:pt.x, y:pt.y, dA:distAlong(rA, pt), dB:distAlong(rB, pt) };
  }
  const a = routePts(rA), b = routePts(rB); let accA = 0, best = null;
  for (let i = 1; i < a.length; i++){
    const La = Math.hypot(a[i].x - a[i - 1].x, a[i].y - a[i - 1].y); let accB = 0;
    for (let j = 1; j < b.length; j++){
      const Lb = Math.hypot(b[j].x - b[j - 1].x, b[j].y - b[j - 1].y);
      const s = segSeg(a[i - 1], a[i], b[j - 1], b[j]);
      if (s){ const c = { x:s.x, y:s.y, dA:accA + s.ta * La, dB:accB + s.tb * Lb }; if (!best || c.dA < best.dA) best = c; }
      accB += Lb;
    }
    accA += La;
  }
  return best;
}

/* ---- aircraft dynamics ---- */
function turnRate(tas){ return Math.min(3, 1091 * Math.tan(25 * Math.PI / 180) / Math.max(tas, 1)); }  // deg/s at 25 deg bank, capped at rate one (3 deg/s)
function stepHeading(cur, tgt, rate, dt){
  const d = angDiff(cur, tgt), m = rate * dt;
  if (Math.abs(d) <= m) return norm360(tgt);
  return norm360(cur + (d > 0 ? m : -m));
}
function approach(cur, tgt, m){ return Math.abs(tgt - cur) <= m ? tgt : cur + (tgt > cur ? m : -m); }
function cloneAc(a){
  return { id:a.id, cs:a.cs, type:a.type, x:a.x, y:a.y, hdg:a.hdg, tas:a.tas, tgtSpd:a.tgtSpd, fl:a.fl, tgtFl:a.tgtFl,
    mode:a.mode, tgtHdg:a.tgtHdg, route:a.route, wp:a.wp, lastD:a.lastD, closing:a.closing, exitFl:a.exitFl, emg:a.emg };
}
function outside(a){ return a.x < BOUND.x0 - 1e-9 || a.x > BOUND.x1 + 1e-9 || a.y < BOUND.y0 - 1e-9 || a.y > BOUND.y1 + 1e-9; }
function chooseWp(a){ // "resume own navigation": first waypoint ahead (within 90 deg of the heading), else the exit fix
  for (let j = a.wp; j < a.route.length; j++){
    if (Math.abs(angDiff(a.hdg, bearingTo(a, WP[a.route[j]]))) <= 90) return j;
  }
  return a.route.length - 1;
}
function stepAc(a, wind, dt){
  let tgt = a.tgtHdg;
  if (a.mode === 'NAV'){
    let w = WP[a.route[a.wp]];
    let d = Math.hypot(w.x - a.x, w.y - a.y);
    while (a.wp < a.route.length - 1){
      let passed = false;
      if (d < 2) passed = true;
      else if (a.lastD !== null){
        if (d < a.lastD - 1e-9) a.closing = true;
        else if (d > a.lastD && a.closing && d < 10) passed = true;
      }
      if (!passed) break;
      a.wp++; a.lastD = null; a.closing = false;
      w = WP[a.route[a.wp]]; d = Math.hypot(w.x - a.x, w.y - a.y);
    }
    a.lastD = d;
    tgt = headingForCourse(bearingTo(a, w), a.tas, wind);
    a.tgtHdg = tgt;
  }
  a.hdg = stepHeading(a.hdg, tgt, turnRate(a.tas), dt);
  const T = TYPES[a.type];
  a.tas = approach(a.tas, a.tgtSpd, T.acc * dt);
  a.fl = approach(a.fl, a.tgtFl, (a.tgtFl > a.fl ? T.climb : T.desc) * dt);
  const v = groundVel(a.hdg, a.tas, wind);
  a.x += v.x * dt; a.y += v.y * dt;
}
// Forward simulation under the current clearance; stops when the aircraft leaves the sector.
function predictTrack(a, wind, horizon, step){
  const pts = [], c = cloneAc(a);
  for (let t = 0; t <= horizon + 1e-9; t += step){
    pts.push({ t:t, x:c.x, y:c.y, fl:c.fl });
    stepAc(c, wind, step);
    if (outside(c)) break;
  }
  return pts;
}
// Compare two predicted tracks (same time grid): first time of separation loss (lateral < 5 NM AND vertical < 1000 ft).
function detectPair(tA, tB, step){
  const n = Math.min(tA.length, tB.length);
  let loss = false, tLoss = null, minLat = Infinity;
  for (let i = 0; i < n - 1; i++){
    const a0 = tA[i], a1 = tA[i + 1], b0 = tB[i], b1 = tB[i + 1];
    const rx = b0.x - a0.x, ry = b0.y - a0.y;
    const vx = ((b1.x - a1.x) - rx) / step, vy = ((b1.y - a1.y) - ry) / step;
    const f0 = b0.fl - a0.fl, vf = ((b1.fl - a1.fl) - f0) / step;
    // vertical window (in segment seconds) where |dfl| < SEP_VERT
    let v1 = 0, v2 = step;
    if (Math.abs(vf) < 1e-9){ if (Math.abs(f0) >= SEP_VERT - VEPS) continue; }
    else {
      const q1 = (-SEP_VERT - f0) / vf, q2 = (SEP_VERT - f0) / vf;
      v1 = Math.max(0, Math.min(q1, q2)); v2 = Math.min(step, Math.max(q1, q2));
      if (v1 >= v2 - 1e-9) continue;
    }
    // lateral minimum inside the vertical window
    const vv = vx * vx + vy * vy;
    let tc = vv < 1e-12 ? v1 : -(rx * vx + ry * vy) / vv;
    tc = clamp(tc, v1, v2);
    const d = Math.hypot(rx + vx * tc, ry + vy * tc);
    if (d < minLat) minLat = d;
    const w = sepWindowRel(rx, ry, vx, vy, SEP_LAT);
    if (!w) continue;
    const lo = Math.max(w[0], v1), hi = Math.min(w[1], v2);
    if (lo < hi - 1e-9 || (w[0] === -Infinity && v1 < v2)){
      const tt = tA[i].t + lo;
      if (!loss || tt < tLoss){ loss = true; tLoss = tt; }
    }
  }
  return { loss:loss, t:tLoss, minLat:minLat };
}
// Smallest single heading change (10..90 deg, either aircraft, either direction) that removes the conflict with a margin.
function minResolvingTurn(order, wind, horizon){
  const step = 5, margin = 5.5;
  const other = {};
  const base = order.map(function(a){ return predictTrack(a, wind, horizon, step); });
  for (let deg = 10; deg <= 90; deg += 10){
    for (let k = 0; k < order.length; k++){
      for (let dir = 1; dir >= -1; dir -= 2){
        const m = cloneAc(order[k]);
        m.mode = 'HDG'; m.tgtHdg = norm360(Math.round(m.hdg) + dir * deg);
        const tm = predictTrack(m, wind, horizon, step);
        const r = k === 0 ? detectPair(tm, base[1], step) : detectPair(base[0], tm, step);
        if (!r.loss && r.minLat >= margin) return { deg:deg, ac:order[k].id, cs:order[k].cs, dir:dir, hdg:m.tgtHdg, minLat:r.minLat };
      }
    }
  }
  return null;
}
// Smallest level change (10..30 FL, either aircraft) that gives vertical separation
function minResolvingLevel(order, wind, horizon){
  const step = 5;
  const base = order.map(function(a){ return predictTrack(a, wind, horizon, step); });
  for (let d = 10; d <= 30; d += 10){
    for (let k = 0; k < order.length; k++){
      for (let dir = 1; dir >= -1; dir -= 2){
        const m = cloneAc(order[k]);
        m.tgtFl = clamp(Math.round(m.fl / 10) * 10 + dir * d, LEVEL_MIN, LEVEL_MAX);
        if (m.tgtFl === Math.round(order[k].tgtFl)) continue;
        const tm = predictTrack(m, wind, horizon, step);
        const r = k === 0 ? detectPair(tm, base[1], step) : detectPair(base[0], tm, step);
        if (!r.loss) return { fl:m.tgtFl, ac:order[k].id, cs:order[k].cs, dir:dir };
      }
    }
  }
  return null;
}
// Order a conflicting pair as [aircraft that reaches the crossing point second, the one that reaches it first]
function orderByCrossing(a, b, wind){
  const va = groundVel(a.hdg, a.tas, wind), vb = groundVel(b.hdg, b.tas, wind);
  const ci = crossingInfo(a, va, b, vb);
  if (!ci) return { order:[a, b], ci:null };
  return { order: ci.tA > ci.tB ? [a, b] : [b, a], ci:ci };
}

/* ---- handoff logic ---- */
function checkHandoff(a, exitPos){
  const offset = Math.hypot(a.x - exitPos.x, a.y - exitPos.y);
  const lvlErr = Math.abs(a.fl - a.exitFl);
  const ok = lvlErr <= 1 && offset <= 5;
  const score = clamp(100 - 8 * Math.max(0, offset - 1) - 5 * Math.max(0, lvlErr - 0.5), 0, 100);
  return { ok:ok, offset:offset, lvlErr:lvlErr, score:score };
}

const AID_HORIZON = [0, 120, 240, 360];

const TRACK_HORIZON = 360;
const MIN_ACCURACY = 96;
const TASK_WALL_DEADLINE = { alert:6, freq:10, readback:8, req:20, fuel:15 };  // real seconds

const TASKNAME = { alert:'Alerta', freq:'Frecuencia', readback:'Colacionado', req:'Petición', fuel:'Combustible' };

function levelStatement(n){
  if (n <= 4) return 'El nivel ' + n + ' está por debajo del objetivo: úsalo para ganar precisión. Nivel 5 = objetivo de la Fase 2 (FEAST / PDEA); 7+ = más allá de la oposición.';
  if (n === 5) return 'Nivel 5 = objetivo de la Fase 2: un candidato bien preparado debería dominarlo con un 96 % o más. 7+ = más allá de la oposición.';
  if (n === 6) return 'El nivel 6 está por encima del objetivo. Nivel 5 = objetivo de la Fase 2; 7+ = más allá de la oposición.';
  if (n < 10) return 'El nivel ' + n + ' está más allá de la oposición (7+): un margen de entrenamiento, no un requisito. Nivel 5 = objetivo de la Fase 2.';
  return 'El nivel 10 es casi imposible a propósito; úsalo para practicar la calma y la estabilidad, no para esperar una partida limpia. Nivel 5 = objetivo de la Fase 2; 7+ = más allá de la oposición.';
}
function customToP(c){
  const dual = !!c.dual, rate = dual ? c.rate : 0;
  const count = clamp(Math.round(c.count), 1, 60);
  return { n:0, name:'Personalizado', count:count, dur:clamp(count * 20, 120, 600), ts:clamp(c.ts, 1, 12), wind:clamp(c.wind, 0, 50),
    entries:clamp(Math.round(c.entries), 1, 8), bias:clamp(c.bias, 0, 1), late:clamp(c.late, 0, 1), notice:Math.round(240 * (1 - clamp(c.late, 0, 1))),
    reqProb:dual ? Math.min(0.4, rate * 0.06) : 0, rate:rate, readback:dual ? Math.min(0.7, rate * 0.1) : 0,
    fuel:dual ? (rate >= 3 ? 1 : 0) + (rate >= 5 ? 1 : 0) + (rate >= 6.5 ? 1 : 0) : 0,
    aid:clamp(Math.round(c.aid), 0, 3), hint:clamp(Math.round(c.hint), 0, 3), pause:c.aid >= 2,
    kinds:dual ? ['alert','freq'] : [], loadThr:12 };
}

/* ---- traffic generation ---- */
function windFromSeed(seed, kt){
  const r = makeRng((seed ^ 0x51ED270B) >>> 0);
  return { from:rInt(r, 0, 35) * 10, spd:kt };
}
function makeCallsign(r, used){
  for (let k = 0; k < 200; k++){
    const cs = rPick(r, CALLS) + rInt(r, 10, 999);
    if (!used[cs]){ used[cs] = 1; return cs; }
  }
  return 'ZZZ' + Object.keys(used).length;
}
function speedFor(type, r){ const T = TYPES[type]; return clamp(T.cruise + rInt(r, -25, 25), T.min + 20, T.max - 20); }
function flChoices(type){ const T = TYPES[type], o = []; for (let f = T.lo; f <= T.hi; f += 10) o.push(f); return o; }
function pickExitFl(fl, type, r){
  if (r() < 0.45) return fl;
  const opts = [-30,-20,-10,10,20,30].map(function(d){ return fl + d; }).filter(function(f){ return f >= TYPES[type].lo && f <= TYPES[type].hi; });
  return opts.length ? rPick(r, opts) : fl;
}
// Time (s) an aircraft needs to reach the point at route distance d (straight ground speed, wind ignored for the synchronisation).
function timeToDist(d, spd){ return d / spd * 3600; }
/* Fairness: with no instruction at all, the first separation loss between two generated aircraft must come at least minLead simulated
   seconds after the LATER of the two appears (about 10 s of real time), otherwise no player could have seen it coming (a head-on pair spawning
   on the same airway was measured at 0-20 s). Idle tracks do not depend on other aircraft, so they are computed once per aircraft. */
function idleTrack(spec, wind){
  const a = makeAircraft(spec, 0, wind), pts = [];
  for (let k = 0; k < 3200; k++){ pts.push({ x:a.x, y:a.y, fl:a.fl }); stepAc(a, wind, 1); if (outside(a)) break; }
  return pts;
}
function firstIdleLoss(A, B){   // A, B: { t, tr } -> first absolute time of loss or null
  const t0 = Math.max(A.t, B.t), t1 = Math.min(A.t + A.tr.length, B.t + B.tr.length);
  for (let T = t0; T < t1; T++){
    const p = A.tr[T - A.t], q = B.tr[T - B.t];
    const dx = p.x - q.x, dy = p.y - q.y;
    if (dx * dx + dy * dy < SEP_LAT * SEP_LAT && Math.abs(p.fl - q.fl) < SEP_VERT - VEPS) return T;
  }
  return null;
}
function enforceFairness(list, wind, minLead){
  const order = list.slice().sort(function(a, b){ return a.t - b.t; }), placed = [], lastOn = {};
  order.forEach(function(spec){
    for (let tries = 0; tries < 16; tries++){
      const lo = lastOn[spec.entry];
      if (lo !== undefined){ const gap = Math.max(75, Math.ceil(6.5 / lo.spd * 3600)); if (spec.t < lo.t + gap) spec.t = lo.t + gap; }
      const me = { t:spec.t, tr:idleTrack(spec, wind) };
      let bad = false;
      for (let i = 0; i < placed.length && !bad; i++){
        const T = firstIdleLoss(placed[i], me);
        if (T !== null && T - Math.max(placed[i].t, me.t) < minLead) bad = true;
      }
      if (!bad){ placed.push(me); break; }
      spec.t += 30;
      if (tries === 15) placed.push(me);
    }
    lastOn[spec.entry] = { t:spec.t, spd:spec.spd };
  });
}
// Traffic list [{t,cs,type,entry,fl,exitFl,spd,notice}] sorted by t. opts.hub forces the crossing point to be MIDAS.
function genTraffic(seed, P, opts){
  opts = opts || {};
  const r = makeRng(seed >>> 0), used = {};
  const ent = BOUNDARY_FIXES.slice();
  for (let i = ent.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = ent[i]; ent[i] = ent[j]; ent[j] = t; }
  let entries = ent.slice(0, clamp(P.entries, 1, 8));
  if (opts.hub){
    const hubEntries = ['ROSAS','LUNAR','MIRLO','ONDAS','BRAVA','PLAYA'];
    entries = ent.filter(function(e){ return hubEntries.indexOf(e) >= 0; }).slice(0, Math.max(2, Math.min(P.entries, 6)));
  }
  const list = [];
  const n = P.count;
  for (let i = 0; i < n; i++){
    const type = rPick(r, TYPE_LIST);
    let entry = rPick(r, entries);
    let fl = rPick(r, flChoices(type));
    let t = Math.round(P.dur * (i + r()) / n);
    if (i > 0 && r() < P.bias){
      const partner = list[rInt(r, Math.max(0, i - 6), i - 1)];
      const cand = entries.filter(function(e){ return e !== partner.entry; });
      const e2 = rPick(r, cand.length ? cand : entries);
      const rA = ENTRY_ROUTE[partner.entry], rB = ENTRY_ROUTE[e2];
      const cx = routeCross(rA, rB, opts.hub ? 'MIDAS' : null);
      if (cx && cx.dA !== null && cx.dB !== null){
        const spd = speedFor(type, r);
        const tt = Math.round(partner.t + timeToDist(cx.dA, partner.spd) - timeToDist(cx.dB, spd) + rInt(r, -25, 25));
        if (tt >= 0 && tt <= P.dur + 200){
          entry = e2; t = tt;
          const f2 = partner.fl + (r() < 0.75 ? 0 : (r() < 0.5 ? 10 : -10));
          if (f2 >= TYPES[type].lo && f2 <= TYPES[type].hi) fl = f2;
          list.push({ t:t, cs:makeCallsign(r, used), type:type, entry:entry, fl:fl, exitFl:pickExitFl(fl, type, r), spd:spd, notice:0 });
          continue;
        }
      }
    }
    list.push({ t:t, cs:makeCallsign(r, used), type:type, entry:entry, fl:fl, exitFl:pickExitFl(fl, type, r), spd:speedFor(type, r), notice:0 });
  }
  // Two aircraft on the same entry must not start closer than 6.5 NM (else a loss can exist at the very moment the follower appears,
  // which no player could have prevented): at least 75 s, and long enough for the leader to be 6.5 NM ahead at its own speed.
  const byEntry = {};
  list.slice().sort(function(a, b){ return a.t - b.t; }).forEach(function(a){
    const p = byEntry[a.entry];
    if (p !== undefined){
      const gap = Math.max(75, Math.ceil(6.5 / p.spd * 3600));
      if (a.t < p.t + gap) a.t = p.t + gap;
    }
    byEntry[a.entry] = { t:a.t, spd:a.spd };
  });
  enforceFairness(list, opts.wind || windFromSeed(seed, P.wind), 45 + 6 * P.ts);
  list.forEach(function(a){ a.notice = r() < P.late ? 0 : P.notice; });
  list.sort(function(a, b){ return a.t - b.t || a.cs.localeCompare(b.cs); });
  return list;
}
function genTasks(seed, P){
  const r = makeRng(((seed ^ 0x5bd1e995) >>> 0) || 7), plan = [];
  const wallMin = (P.dur + 600) / P.ts / 60;
  const n = Math.round(P.rate * wallMin), kinds = P.kinds || [];
  if (kinds.length) for (let i = 0; i < n; i++) plan.push({ t:rInt(r, 40, P.dur + 400), kind:rPick(r, kinds) });
  const nreq = Math.round(P.reqProb * P.count);
  for (let i = 0; i < nreq; i++) plan.push({ t:rInt(r, 60, P.dur + 300), kind:'req' });
  for (let i = 0; i < P.fuel; i++) plan.push({ t:rInt(r, 90, P.dur + 250), kind:'fuel' });
  plan.sort(function(a, b){ return a.t - b.t; });
  return plan;
}

function makeAircraft(spec, id, wind){

  const a = { id:id, cs:spec.cs, type:spec.type, x:p.x, y:p.y, hdg:0, tas:spec.spd, tgtSpd:spec.spd, fl:spec.fl, tgtFl:spec.fl,
    mode:'NAV', tgtHdg:0, route:route, wp:1, lastD:null, closing:false, exitFl:spec.exitFl, emg:false,
    spawnT:spec.t, entry:spec.entry, exit:route[route.length - 1], trail:[], hadLoss:false, cmds:0, lastLead:null };

}

function computeAlerts(w){

  const S = 2, tr = w.ac.map(function(a){ return predictTrack(a, w.wind, TRACK_HORIZON, S); });

      if (Math.abs(w.ac[i].x - w.ac[j].x) > 90 && Math.abs(w.ac[i].y - w.ac[j].y) > 90) continue;
      const r = detectPair(tr[i], tr[j], S);
      if (r.loss && r.t <= ALERT_HORIZON){
        res.push({ a:w.ac[i].id, b:w.ac[j].id, t:r.t, minLat:r.minLat });
        set[w.ac[i].id] = 1; set[w.ac[j].id] = 1;

    const A = findAc(w, al.a), B = findAc(w, al.b);
    if (!rec){
      rec = w.confs[k] = { key:k, a:al.a, b:al.b, csA:A.cs, csB:B.cs, firstT:w.t, firstLead:al.t, snapA:cloneAc(A), snapB:cloneAc(B),

function checkSeparation(w){

        const rec = w.confs[k];

function resolveTask(w, task, outcome, resp){

function freqDistractors(f, r){
  const parts = f.split('.'), s = parts[1];
  const c = {}; c[f] = 1;
  const out = [];
  const tries = [
    parts[0] + '.' + s[1] + s[0],
    (parseInt(parts[0], 10) + (r() < 0.5 ? 1 : -1)) + '.' + s,
    parts[0] + '.' + pad2((parseInt(s, 10) + 15) % 100),
    (parseInt(parts[0], 10) + 10) + '.' + s,
    parts[0] + '.' + pad2((parseInt(s, 10) + 5) % 100)
  ];
  for (let i = 0; i < tries.length && out.length < 2; i++){ if (!c[tries[i]]){ c[tries[i]] = 1; out.push(tries[i]); } }

  else if (c === 'lvl'){ [10, -10, 20, -20].forEach(function(d){ cands.push(v + d); }); }
  else { [10, -10, 20, -20].forEach(function(d){ cands.push(v + d); }); }

function readbackCorrect(issued, heard){ return issued.c === heard.c && issued.v === heard.v; }
function spawnTask(w, pl){
  const P = w.P, ts = w.ts, r = w.rng;
  const dl = function(kind){ return Math.max(3, Math.ceil(TASK_WALL_DEADLINE[kind] * ts)); };
  const task = { id:w.nextTaskId++, kind:pl.kind, t0:w.t, deadline:0, data:{}, outcome:null, resp:null };
  if (pl.kind === 'alert'){
    task.deadline = w.t + dl('alert'); task.data = { code:rInt(r, 10, 99) };
  } else if (pl.kind === 'freq'){
    const f = rInt(r, 119, 135) + '.' + pad2(rInt(r, 0, 19) * 5);
    const opts = [f].concat(freqDistractors(f, r));
    for (let i = opts.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
    task.deadline = w.t + dl('freq'); task.data = { target:f, options:opts, sector:rPick(r, BOUNDARY_FIXES) + ' CTL' };
  } else if (pl.kind === 'req'){
    const cand = w.ac.filter(function(a){ return !a.emg && !a.reqPending && Math.abs(a.fl - a.tgtFl) < 0.5; });
    if (!cand.length) return false;
    const a = rPick(r, cand);
    const opts = [-30,-20,-10,10,20,30].map(function(d){ return Math.round(a.exitFl) + d; }).filter(function(f){ return f >= TYPES[a.type].lo && f <= TYPES[a.type].hi; });

    a.reqPending = true;
    task.deadline = w.t + dl('req'); task.data = { id:a.id, cs:a.cs, fl:rPick(r, opts) };
  } else if (pl.kind === 'fuel'){
    const far = w.ac.filter(function(a){ return !a.emg; });
    if (!far.length) return false;
    const a = rPick(r, far);
    a.emg = true;
    const remaining = Math.hypot(a.x - WP[a.exit].x, a.y - WP[a.exit].y);
    task.deadline = w.t + dl('fuel'); task.data = { id:a.id, cs:a.cs, acked:false, limit:w.t + Math.ceil(remaining / Math.max(a.gs0, 100) * 3600 * 1.25 + 40 + 20) };

function requestSafe(w, a, fl){
  const S = 5, H = 420;
  const others = w.ac.filter(function(x){ return x.id !== a.id; });
  const base = predictTrack(a, w.wind, H, S);
  const mod = cloneAc(a); mod.tgtFl = fl;
  const tm = predictTrack(mod, w.wind, H, S);
  for (let i = 0; i < others.length; i++){
    const to = predictTrack(others[i], w.wind, H, S);
    const before = detectPair(base, to, S), after = detectPair(tm, to, S);

function noteCommandForConfs(w, a, text, turn){
  Object.keys(w.confs).forEach(function(k){
    const rec = w.confs[k];
    if (rec.status !== 'active' || (rec.a !== a.id && rec.b !== a.id)) return;
    if (!rec.actions.length){
      rec.actSnap = [cloneAc(findAc(w, rec.a) || rec.snapA), cloneAc(findAc(w, rec.b) || rec.snapB)];

function applyCmd(w, id, c, v){
  const a = findAc(w, id);
  if (!a) return { ok:false, msg:'No existe esa aeronave' };
  const T = TYPES[a.type];
  let text = '', redundant = false, turn = null, necessary;
  const inConf = !!w.alertSet[a.id];
  if (c === 'hdg'){
    v = norm360(Math.round(v));
    const before = a.mode === 'HDG' ? a.tgtHdg : a.hdg;
    turn = Math.abs(angDiff(before, v));
    redundant = a.mode === 'HDG' && Math.round(a.tgtHdg) === v;
    a.mode = 'HDG'; a.tgtHdg = v; a.lastD = null; a.closing = false;
    text = a.cs + ' heading ' + pad3(v);
    necessary = inConf;
  } else if (c === 'lvl'){
    v = clamp(Math.round(v / 10) * 10, LEVEL_MIN, LEVEL_MAX);
    redundant = v === Math.round(a.tgtFl);
    a.tgtFl = v;
    text = a.cs + (v > a.fl ? ' climb FL' : ' descend FL') + v;
    necessary = inConf || v === Math.round(a.exitFl) || Math.abs(a.fl - a.exitFl) > 0.5 || !!a.emg;
  } else if (c === 'spd'){
    v = clamp(Math.round(v), T.min, T.max);
    redundant = v === Math.round(a.tgtSpd);
    a.tgtSpd = v;
    text = a.cs + ' speed ' + v;
    necessary = inConf;
  } else {
    redundant = a.mode === 'NAV';
    a.mode = 'NAV'; a.wp = chooseWp(a); a.lastD = null; a.closing = false;
    text = a.cs + ' resume own navigation';
    necessary = inConf || !redundant;
  }

    const tk = a.fuelTask;
    tk.data.acked = true; tk.data.ackT = w.t; tk.ackResp = (w.t - tk.t0) / w.ts;
  }
  if (!necessary){ w.unnecessary++; }
  if (redundant) w.redundant++;
  noteCommandForConfs(w, a, text, turn);
  a.cmds++;
  w.cmds.push({ t:w.t, id:a.id, cs:a.cs, c:c, v:v, text:text, necessary:necessary, redundant:redundant, turn:turn });
  w.cmdTicks = (w.cmdTicks || []); w.cmdTicks.push(w.t);

  if (w.P.readback > 0 && c !== 'dct' && !redundant && w.rng() < w.P.readback && w.tasks.filter(function(x){ return x.kind === 'readback'; }).length < 2){
    const wrong = w.rng() < 0.3;

    w.tasks.push({ id:w.nextTaskId++, kind:'readback', t0:w.t, deadline:w.t + Math.max(3, Math.ceil(TASK_WALL_DEADLINE.readback * w.ts)), outcome:null, resp:null,
      data:{ cs:a.cs, issued:{ c:c, v:v }, heard:{ c:c, v:heardV } } });

function answerTask(w, key){
  const cand = w.tasks.filter(function(t){ return TASK_KEYS[t.kind] && TASK_KEYS[t.kind].indexOf(key) >= 0; }).sort(function(a, b){ return a.id - b.id; });
  if (!cand.length) return { ok:false, msg:'Ninguna tarea espera esa tecla' };
  const t = cand[0], resp = (w.t - t.t0) / w.ts;
  let good = false;
  if (t.kind === 'alert') good = true;
  else if (t.kind === 'freq') good = t.data.options.indexOf(t.data.target) === ['Z','X','C'].indexOf(key);
  else if (t.kind === 'readback') good = (key === 'Y') === readbackCorrect(t.data.issued, t.data.heard);

    const a = findAc(w, t.data.id);
    if (!a){ resolveTask(w, t, 'missed'); return { ok:true, msg:'La aeronave ya ha salido' }; }
    a.reqPending = false;
    const safe = requestSafe(w, a, t.data.fl);
    good = (key === 'A') === safe;
    t.data.safe = safe;
    if (key === 'A'){ a.tgtFl = t.data.fl; a.exitFl = t.data.fl; computeAlerts(w); }
  }
  resolveTask(w, t, good ? 'correct' : 'wrong', resp);

    if (lossNow) col = (Math.floor(Date.now() / 250) % 2) ? '#ff4a3a' : '#ffffff';
    if (a.id === run.sel) col = '#ffe27a';
    // trail
    g.fillStyle = 'rgba(120,180,140,.45)';
    (a.trail || []).forEach(function(p, i){ g.fillRect(wx(p.x) - 1.5, wy(p.y) - 1.5, 3, 3); });
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2;
    g.strokeRect(px - 5 * k, py - 5 * k, 10 * k, 10 * k);
    // heading line
    const hv = hdgVec(a.hdg);
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + hv.x * 16 * k, py - hv.y * 16 * k); g.stroke();
    const arrow = Math.abs(a.tgtFl - a.fl) > 0.5 ? (a.tgtFl > a.fl ? '↑' : '↓') + Math.round(a.tgtFl) : '';
    g.font = Math.round(12 * k) + 'px ' + MONO; g.textBaseline = 'alphabetic';
    g.fillText(a.cs + (a.emg ? ' EMG' : ''), px + 10 * k, py - 10 * k);
    g.fillText(Math.round(a.fl) + ' ' + arrow + ' ' + Math.round(a.tas), px + 10 * k, py + 3 * k);
    if (a.id === run.sel){ g.fillText('> ' + a.exit + ' FL' + Math.round(a.exitFl), px + 10 * k, py + 16 * k); }
    g.textBaseline = 'middle';
  });
  if (run.paused){ g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, CW, CH); g.fillStyle = '#f2b84b'; g.font = Math.round(36 * k) + 'px ' + MONO; g.textAlign = 'center'; g.fillText('PAUSA', CW / 2, CH / 2); g.textAlign = 'left'; }
  // wind
  g.fillStyle = '#6fae7c'; g.font = Math.round(13 * k) + 'px ' + MONO; g.textBaseline = 'alphabetic';
  g.fillText('VIENTO ' + pad3(w.wind.from) + '/' + w.wind.spd, 12, 18 * k);
  updateSide();
}
let sideTick = 0;
function updateSide(){
  const w = run.w, P = w.P;
  if (sideTick++ % 3) return;
  const wall = w.t / w.ts;
  const nloss = w.losses.length + Object.keys(w.lossActive).length;
  $('hud').innerHTML = '<span>' + esc(run.cfg.label) + (run.replay ? ' · repetición' : '') + '</span><span>' + ic('timer') + '<b>' + Math.floor(wall / 60) + ':' + pad2(Math.floor(wall % 60)) + '</b> · ' + P.ts + '×</span><span>' + ic('check') + '<b>' + w.done.length + '</b> / ' + w.plan.length + '</span><span>' + ic('conflict') + '<b class="' + (nloss ? 'mal' : 'bien') + '">' + nloss + '</b></span>' +
    (run.buf ? '<span class="aviso">' + run.buf.c + ' <b>' + esc(run.buf.s) + '_</b></span>' : '');
  $('msg').innerHTML = run.msg || '&nbsp;';
  $('hintbox').innerHTML = run.hintText ? '<p>' + esc(run.hintText) + '</p>' : '';
  const a = selAc();
  if (a){
    const T = TYPES[a.type];
    $('selbox').innerHTML = '<p style="margin:0 0 4px"><b>' + esc(a.cs) + '</b> ' + a.type + (a.emg ? ' <b class="aviso">EMG</b>' : '') + '</p><table class="kv"><tbody>' +
      '<tr><td>HDG</td><td>' + pad3(a.hdg) + (a.mode === 'HDG' ? ' → ' + pad3(a.tgtHdg) : ' nav') + '</td></tr>' +
      '<tr><td>FL</td><td>' + Math.round(a.fl) + (Math.abs(a.tgtFl - a.fl) > 0.5 ? ' → ' + Math.round(a.tgtFl) : '') + ' · salida ' + Math.round(a.exitFl) + '</td></tr>' +
      '<tr><td>kt</td><td>' + Math.round(a.tas) + (Math.abs(a.tgtSpd - a.tas) > 0.5 ? ' → ' + Math.round(a.tgtSpd) : '') + ' · ' + T.min + '–' + T.max + '</td></tr>' +
      '<tr><td>Salida</td><td>' + a.exit + ' · ' + a.cmds + '</td></tr></tbody></table>';
  } else $('selbox').textContent = '';
  // strips
  const list = w.ac.slice().sort(function(x, y){ return x.id - y.id; });
  let sh = list.map(function(x, i){
    const conflict = P.aid >= 2 && w.alertSet[x.id];
    return '<div class="strip' + (x.id === run.sel ? ' sel' : '') + (x.emg ? ' emg' : '') + (conflict ? ' conf' : '') + '" data-id="' + x.id + '"><span>' + (i < 10 ? (i + 1) % 10 : '') + '</span><span>' + esc(x.cs) + '</span><span>' + x.type + '</span><span>' + x.exit + '</span><span>FL' + Math.round(x.fl) + (Math.abs(x.exitFl - x.fl) > 0.5 ? '→' + Math.round(x.exitFl) : '') + ' ' + Math.round(x.tas) + '</span></div>';
  }).join('');
  w.plan.slice(w.planIdx).forEach(function(p){
    if (p.notice > 0 && p.t - p.notice <= w.t) sh += '<div class="strip inb"><span></span><span>' + esc(p.cs) + '</span><span>' + p.type + '</span><span>' + p.entry + '</span><span>' + Math.max(0, Math.round((p.t - w.t) / w.ts)) + ' s → ' + ENTRY_ROUTE[p.entry][ENTRY_ROUTE[p.entry].length - 1] + '</span></div>';
  });
  $('strips').innerHTML = sh;
  // tasks
  $('tasks').innerHTML = w.tasks.map(function(t){
    const left = Math.max(0, (t.deadline - w.t) / w.ts), urg = left < 3;
    let txt = '';
    if (t.kind === 'alert') txt = 'Alerta ' + t.data.code + ' <span class="tecla">Espacio</span>';
    else if (t.kind === 'freq') txt = esc(t.data.sector) + ' <b>' + t.data.target + '</b> ' + t.data.options.map(function(o, i){ return '<span class="tecla">' + 'ZXC'[i] + '</span> ' + o; }).join(' &nbsp; ');
    else if (t.kind === 'readback') txt = esc(t.data.cs) + ' ' + (t.data.heard.c === 'hdg' ? 'hdg ' + pad3(t.data.heard.v) : (t.data.heard.c === 'lvl' ? 'FL ' + t.data.heard.v : 'kt ' + t.data.heard.v)) + ' <span class="tecla">Y</span> ' + ic('check') + ' <span class="tecla">N</span> ' + ic('x');
    else if (t.kind === 'req') txt = esc(t.data.cs) + ' FL' + t.data.fl + ' <span class="tecla">A</span> ' + ic('check') + ' <span class="tecla">D</span> ' + ic('x');
    else if (t.kind === 'fuel') txt = 'Combustible ' + esc(t.data.cs) + (t.data.acked ? '' : ' !');
    return '<div class="tarea' + (urg ? ' urg' : '') + '">' + txt + ' <span class="suave">' + Math.ceil(left) + ' s</span></div>';
  }).join('');
  // alerts
  $('alerts').innerHTML = P.aid >= 2 ? w.alerts.slice(0, 5).map(function(al){
    const A = findAc(w, al.a), B = findAc(w, al.b);
    return '<div class="mal">' + esc(A ? A.cs : '?') + ' / ' + esc(B ? B.cs : '?') + ' · ' + Math.round(al.t / w.ts) + ' s</div>';
  }).join('') : '';
  $('log').innerHTML = w.log.slice(-8).reverse().map(function(l){ return '<div class="' + l.cls + '">' + Math.floor(l.t / w.ts) + ' s · ' + esc(l.txt) + '</div>'; }).join('');
}

/* ---------------- report ---------------- */
function finishRun(){
  const w = run.w, cfg = run.cfg;
  const sum = summarize(w);
  run.summary = sum;
  if (run.replay){ showReport(sum, cfg, true); return; }
  const met = evalGoal(cfg.goal, sum);
  const d = cargar();
  const level = cfg.P.n;
  const rec = { ts:new Date().toISOString(), modulo:cfg.modulo, level:level, mode:cfg.mode, seed:cfg.seed, speed:cfg.P.ts,
    correct:sum.correct, wrong:sum.wrong, blank:sum.blank, spi:sum.spi, accuracy:sum.accuracy, score:sum.score,
    goal:cfg.goal, met:met, losses:sum.lossEpisodes, label:cfg.label, hint:sum.hintMax, thirds:sum.thirds };
  d.sesiones.push(rec);
  if (d.sesiones.length > 500) d.sesiones.shift();
  const prevBest = d.pb[level];
  let newRecord = false;
  if (level > 0 && sum.success && betterRun(prevBest, sum)){ d.pb[level] = { score:sum.score, accuracy:sum.accuracy, spi:sum.spi, losses:sum.lossEpisodes }; newRecord = !!prevBest || true; }
  else if (level > 0 && !prevBest) d.pb[level] = { score:sum.score, accuracy:sum.accuracy, spi:sum.spi, losses:sum.lossEpisodes, unclean:true };
  else if (level > 0 && prevBest && prevBest.unclean && sum.score > prevBest.score) d.pb[level] = { score:sum.score, accuracy:sum.accuracy, spi:sum.spi, losses:sum.lossEpisodes, unclean:!sum.success };
  d.streak = sum.success ? (d.streak || 0) + 1 : 0;
  let adv = '';
  if (cfg.mode === 'adaptive'){
    const nx = adaptiveNext(d.adaptive, sum); d.adaptive = { level:nx.level, up:nx.up, down:nx.down }; adv = nx.advice;
  }
  guardar();
  run.rec = rec; run.met = met; run.newRecord = newRecord && sum.success; run.adv = adv;
  run.cfgSaved = cfg;
  showReport(sum, cfg, false);
}
function taskRow(name, o){
  if (!o.n) return '';
  const avg = o.resp.length ? o.resp.reduce(function(a, b){ return a + b; }, 0) / o.resp.length : null, mx = o.resp.length ? Math.max.apply(null, o.resp) : null;
  return '<tr><td>' + name + '</td><td>' + o.n + '</td><td>' + o.correct + '</td><td>' + o.wrong + '</td><td>' + o.missed + '</td><td>' + (avg === null ? '–' : fmt(avg, 1) + ' s') + '</td><td>' + (mx === null ? '–' : fmt(mx, 1) + ' s') + '</td></tr>';
}
function showReport(sum, cfg, isReplay){
  const w = run.w, d = cargar(), P = cfg.P;
  const level = P.n;
  const met = run.met;
  const pb = level > 0 ? d.pb[level] : null;
  const conf = Object.keys(w.confs).map(function(k){ return w.confs[k]; }).sort(function(a, b){ return a.firstT - b.firstT; });
  const wall = function(t){ return fmt(t / w.ts, 0) + ' s'; };
  const deg = function(x){ return x ? x.deg + '°' : '>90°'; };
  let html = '<h1>' + (isReplay ? 'Repetición' : 'Informe') + '</h1><p class="suave">' + esc(cfg.label) + ' · ' + P.count + ' · ' + P.ts + '×</p>';
  html += '<p><b class="' + (sum.success ? 'bien' : 'mal') + '">' + (sum.success ? 'Partida limpia' : 'No limpia') + '</b>' +
    (isReplay ? '' : ' · ' + (met === true ? '<b class="bien">Objetivo cumplido</b>' : (met === false ? '<b class="aviso">Objetivo no cumplido</b> ' : '') ) + (met === null ? '–' : '') + ' ' + esc(cfg.goal)) + '</p>';
  html += '<div class="cifras"><div class="cifra"><b>' + fmt(sum.score, 0) + '</b><span>Puntuación</span></div><div class="cifra"><b>' + fmt(sum.accuracy, 1) + ' %</b><span>' + sum.correct + ' / ' + sum.wrong + ' / ' + sum.blank + '</span></div>' +
    '<div class="cifra"><b class="' + (sum.lossEpisodes ? 'mal' : 'bien') + '">' + sum.lossEpisodes + '</b><span>Pérdidas</span></div><div class="cifra"><b>' + fmt(sum.handoffMean, 0) + '</b><span>Transferencia</span></div>' +
    '<div class="cifra"><b>' + fmt(sum.spi, 1) + ' s</b><span>por elemento</span></div><div class="cifra"><b>' + sum.unnecessary + ' / ' + sum.cmdCount + '</b><span>Órdenes extra</span></div>' +
    '<div class="cifra"><b>' + sum.workload.peaks + '</b><span>Picos</span></div><div class="cifra"><b>' + fmt(sum.delaySecMean, 0) + ' s</b><span>Retraso</span></div>' +
    (isReplay ? '' : '<div class="cifra"><b>' + (d.streak || 0) + '</b><span>Racha</span></div>') + '</div>';
  if (!isReplay){
    if (pb) html += '<p class="suave">Mejor · ' + fmt(pb.score, 0) + ' · ' + fmt(pb.accuracy, 1) + ' %' + (run.newRecord ? ' <b class="bien">' + ic('check') + 'Récord</b>' : '') + '</p>';
    if (cfg.mode === 'adaptive') html += '<p class="suave">Adaptativo → L' + d.adaptive.level + '</p>';
  }
  if (sum.thirds && sum.thirds[0].n >= 8 && sum.thirds[2].n >= 8){
    html += '<p class="suave">' + sum.thirds.map(function(x){ return x.n ? Math.round(100 * x.c / x.n) : '–'; }).join(' / ') + ' %</p>';
  }
  html += '<h2>Puntuación</h2><div class="tabla-caja"><table><thead><tr><th>Inicio</th><th>Separación</th><th>Transferencia</th><th>Retraso</th><th>Órdenes extra</th><th>Ráfagas</th><th>Tareas</th></tr></thead><tbody><tr><td>100</td><td>' + fmt(sum.penalties.separation, 1) + '</td><td>' + fmt(sum.penalties.handoff, 1) + '</td><td>' + fmt(sum.penalties.delay, 1) + '</td><td>' + fmt(sum.penalties.unnecessary, 1) + '</td><td>' + fmt(sum.penalties.bursts, 1) + ' (' + sum.bursts + ')</td><td>' + fmt(sum.penalties.tasks, 1) + '</td></tr></tbody></table></div>';
  // conflicts
  if (conf.length){
    html += '<h2>Conflictos</h2><div class="tabla-caja"><table><thead><tr><th>Pareja</th><th>Alerta</th><th>Acciones</th><th>Resultado</th><th>Viraje en la alerta</th><th>Viraje al actuar</th></tr></thead><tbody>';
    conf.forEach(function(rec){
      const an = rec.unseen ? { atAlert:null, atAct:null } : analyzeConf(rec, w.wind);
      const acts = rec.actions.length ? rec.actions.map(function(x){ return wall(x.t) + ' ' + esc(x.text) + (x.turn !== null && x.turn !== undefined ? ' ' + Math.round(x.turn) + '°' : '') + ' · ' + (x.lead === null || x.lead === undefined ? '?' : Math.round(x.lead)) + ' s'; }).join('<br>') : '<span class="mal">–</span>';
      const out = rec.lost ? '<span class="mal">Pérdida · ' + fmt(rec.minLat, 1) + ' NM · ' + fmt(rec.minVert * 100, 0) + ' ft</span>' : (rec.status === 'resolved' ? '<span class="bien">Resuelto</span>' : '<span class="aviso">' + esc(STATUSNAME[rec.status] || rec.status) + '</span>');
      html += '<tr><td>' + esc(rec.csA) + ' / ' + esc(rec.csB) + '</td><td>' + wall(rec.firstT) + '</td><td>' + acts + '</td><td>' + out + '</td><td>' + (rec.unseen ? 'no vista' : deg(an.atAlert)) + '</td><td>' + (rec.unseen || !rec.actSnap ? '–' : deg(an.atAct)) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  // tasks
  const tk = sum.tasks;
  const rows = taskRow(TASKNAME.alert, tk.alert) + taskRow(TASKNAME.freq, tk.freq) + taskRow(TASKNAME.readback, tk.readback) + taskRow(TASKNAME.req, tk.req) + taskRow(TASKNAME.fuel, tk.fuel);
  if (rows) html += '<h2>Tareas</h2><div class="tabla-caja"><table><thead><tr><th>Tarea</th><th>Nº</th><th>Aciertos</th><th>Fallos</th><th>Perdidas</th><th>Media</th><th>Más lenta</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  // handoffs
  html += '<h2>Transferencias</h2><div class="tabla-caja"><table><thead><tr><th>Aeronave</th><th>Salida</th><th>Desvío</th><th>Nivel</th><th></th><th>Retraso</th><th>Órdenes</th></tr></thead><tbody>' +
    w.done.map(function(x){ return '<tr><td>' + esc(x.cs) + '</td><td>' + x.exit + '</td><td>' + fmt(x.offset, 1) + ' NM</td><td>' + fmt(x.lvlErr * 100, 0) + ' ft</td><td class="' + (x.correct ? 'bien' : 'mal') + '">' + (x.okHand ? (x.hadLoss ? 'ok · pérdida' : 'ok') : 'mal') + '</td><td>' + fmt(x.delay, 0) + ' s</td><td>' + x.cmds + '</td></tr>'; }).join('') +
    (sum.unhandled ? '<tr><td colspan="7" class="mal">' + sum.unhandled + ' sin transferir</td></tr>' : '') + '</tbody></table></div>';
  html += '<p class="fila" style="margin-top:18px">' + (isReplay ? '<button class="btn primario" id="back">' + ic('back') + 'Menú</button>' : '<button class="btn primario" id="again">' + ic('repeat') + 'Repetir <kbd>R</kbd></button><button class="btn" id="menu">' + ic('back') + 'Menú <kbd>M</kbd></button><button class="btn" id="watch">' + ic('play') + 'Repetición</button><button class="btn" id="hist">' + ic('history') + 'Historial</button>') + '</p>';
  app.innerHTML = html; window.scrollTo(0, 0); menuFresh = true;
  const kd = function(e){
    if (e.target && (e.target.tagName === 'INPUT' || (e.target.tagName === 'BUTTON' && e.key === 'Enter'))) return;
    const k = e.key.toLowerCase();
    if (k === 'm' || (k === 'enter' && isReplay)) $('menu') ? $('menu').click() : $('back').click();
    else if (k === 'r' && !isReplay) $('again').click();
    else if (k === 'h' && !isReplay) $('hist').click();
  };
  window.onkeydown = kd;
  if ($('again')) $('again').addEventListener('click', function(){
    const c = run.cfgSaved || cfg;
    const c2 = { P:c.P, wind:c.wind, traffic:c.traffic, seed:c.seed, scenario:c.scenario, taskPlan:c.taskPlan, label:c.label, modulo:c.modulo, goal:c.goal, mode:c.mode };
    startRun(c2, false);
  });
  if ($('menu')) $('menu').addEventListener('click', function(){ showMenu(); });
  if ($('back')) $('back').addEventListener('click', function(){ showMenu(); });
  if ($('hist')) $('hist').addEventListener('click', showHistory);
  if ($('watch')) $('watch').addEventListener('click', function(){
    const c = run.cfgSaved || cfg;
    const c2 = { P:Object.assign({}, c.P, { pause:false }), wind:c.wind, traffic:c.traffic, seed:c.seed, scenario:c.scenario, taskPlan:c.taskPlan, label:c.label, modulo:c.modulo, goal:c.goal, mode:c.mode, replayEvents:run.w.events.slice() };
    startRun(c2, true); run.rspeed = 2;
  });
}

/* ---------------- history ---------------- */
function showHistory(){
  const d = cargar();
  const s = d.sesiones.slice().reverse().slice(0, 60);
  const pbs = Object.keys(d.pb).sort(function(a, b){ return a - b; });
  let html = '<button class="link" id="volver">' + ic('back') + 'Menú</button><h1>Historial</h1>' + (s.length ? '<div class="tabla-caja"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Puntuación</th><th>Aciertos</th><th>Fallos</th><th>Blanco</th><th>Precisión %</th><th>Pérdidas</th><th>Objetivo</th><th>Cumplido</th></tr></thead><tbody>' +
    s.map(function(x){ return '<tr><td>' + fechaES(x.ts) + '</td><td>' + esc(x.modulo) + '</td><td>' + x.level + '</td><td>' + fmt(x.score, 0) + '</td><td>' + x.correct + '</td><td>' + x.wrong + '</td><td>' + x.blank + '</td><td>' + fmt(x.accuracy, 1) + '</td><td>' + (x.losses === undefined ? '' : x.losses) + '</td><td>' + esc(x.goal) + '</td><td>' + (x.met === true ? 'Sí' : (x.met === false ? 'No' : '')) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="suave">Sin sesiones</p>') +
    (pbs.length ? '<h2>Mejores</h2><div class="tabla-caja"><table><thead><tr><th>Nivel</th><th>Puntuación</th><th>Precisión %</th></tr></thead><tbody>' + pbs.map(function(k){ const p = d.pb[k]; return '<tr><td>' + k + ' ' + LEVELS[k].name + '</td><td>' + fmt(p.score, 0) + '</td><td>' + fmt(p.accuracy, 1) + (p.unclean ? ' *' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
    '<p class="fila" style="margin-top:18px"><button class="btn primario" id="csv">' + ic('download') + 'CSV</button><button class="btn peligro" id="borrar">' + ic('trash') + 'Borrar</button><span id="conf"></span></p>';
  app.innerHTML = html; window.scrollTo(0, 0); menuFresh = true;
  $('volver').addEventListener('click', showMenu);
  window.onkeydown = function(e){ if (e.key === 'Escape') showMenu(); };
  $('csv').addEventListener('click', function(){
    try {
      const blob = new Blob([aCSV(d.sesiones)], { type:'text/csv;charset=utf-8' });
      const a = document.createElement('a'), f = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = 'simulador-sector-' + f.getFullYear() + pad2(f.getMonth() + 1) + pad2(f.getDate()) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      $('conf').textContent = '';
    } catch (e) { $('conf').textContent = ' Error'; }
  });
  $('borrar').addEventListener('click', function(){
    if (!confirm('¿Borrar el historial?')) return;
    memoria.sesiones = []; memoria.pb = {}; memoria.streak = 0; guardar(); showHistory();
  });
}
showMenu();
</script>
