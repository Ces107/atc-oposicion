<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro de aptitudes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4d8f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='3' width='16' height='18'/%3E%3Ccircle cx='8.5' cy='8' r='1.3'/%3E%3Ccircle cx='8.5' cy='12.5' r='1.3'/%3E%3Cpath d='M12 8h4.5M12 12.5h4.5M8 17h8.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onacc:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a6c8f0; --onacc:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
.top{display:flex;align-items:center;gap:10px;margin:0 auto;padding:14px 16px 10px}
.top .logo{width:30px;height:30px;color:var(--accent);flex:none}
.top .brand{font:700 20px/1 var(--serif);letter-spacing:.01em}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.logo{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 28px/1.2 var(--serif);margin:.3em 0 .5em}
h2{font:700 20px/1.3 var(--serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:1.6em 0 .6em}
h3{font:700 17px var(--serif);margin:1em 0 .3em}
p{margin:.4rem 0}
.soft{color:var(--muted)} .small{font-size:14px}
.good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s;min-height:40px}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onacc)}
.btn.primary:hover{background:var(--accent-h);color:var(--onacc)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.on{background:var(--warn);border-color:var(--warn);color:var(--onacc)}
.btn:disabled{opacity:.4;cursor:default}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;margin-bottom:6px;min-height:40px}
.link:hover{color:var(--accent-h);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text]{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;width:100%;max-width:420px}
label.lb{display:block;margin:1rem 0 .3rem;font-weight:600}
kbd{font:12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:2px 6px;background:var(--surface);color:var(--muted);display:inline-block}
.btn kbd{background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted);font-size:15px;padding:6px 0;border-bottom:1px solid var(--rule)}
.head b{color:var(--text)}
.head .ic{margin-right:4px}
.bar{height:3px;background:var(--rule);margin:0 0 12px}
.bar>div{height:100%;background:var(--accent);width:0}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.fig{padding:10px 26px 10px 0}
.fig b{display:block;font:700 28px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--text);padding:6px 12px 6px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top;font-variant-numeric:tabular-nums}
td .ic,th .ic{color:var(--muted)}
.list{border-top:1px solid var(--text);margin:8px 0 16px}
.card{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;cursor:pointer;color:var(--text)}
.card:hover{background:var(--stripe)}
.card .ic{width:30px;height:30px;color:var(--accent);stroke-width:1.5}
.card .nm{display:block;font:700 20px/1.2 var(--serif)}
.card .dt{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
details{margin:10px 0}
summary{cursor:pointer;color:var(--accent);min-height:32px}
ul.rules{list-style:none;margin:6px 0;padding:0;border-top:1px solid var(--rule)}
ul.rules li{padding:5px 0;border-bottom:1px solid var(--rule)}
@media (max-width:640px){.fig{padding-right:18px}.fig b{font-size:24px}h1{font-size:25px}}

#app{max-width:1040px;margin:0 auto;padding:8px 16px 56px}
.top{max-width:1040px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);font-size:18px}
.timer .ic{color:var(--muted)}
.timer.late{color:var(--warn)}
.timer.over{color:var(--err)}
.pr{font-weight:700;margin:10px 0 4px;text-align:center}
svg.cell{display:block;width:100%;height:auto}
.mat{display:grid;grid-template-columns:repeat(3,minmax(0,112px));gap:6px;justify-content:center;margin:12px auto}
.seq{display:grid;grid-template-columns:repeat(6,minmax(0,100px));gap:6px;justify-content:center;margin:12px auto}
.ana{display:grid;grid-template-columns:repeat(2,minmax(0,112px));gap:6px 40px;justify-content:center;margin:12px auto}
.svgbox{background:#fbfaf6;border:1px solid var(--rule);border-radius:2px;padding:6px}
.svgbox svg{display:block;margin:0 auto;width:100%;height:auto;max-height:320px}
.cap{font-size:13px;color:var(--muted);text-align:center;margin:.3rem 0}
.panels{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.panels figure{margin:0;width:140px;text-align:center;font-size:13px;color:var(--muted)}
.panels svg{width:140px;height:140px;background:#fbfaf6;border:1px solid var(--rule)}
.lbox{background:#fbfaf6;color:#1b1b1b;border:1px solid var(--rule);border-radius:2px;padding:8px;margin:10px auto;max-width:760px}
.d2row{display:flex;flex-wrap:wrap;gap:2px 5px;justify-content:center}
.d2c{width:22px;height:auto;display:block}
table.cmp{width:auto;margin:0 auto;font:600 18px/1.3 ui-monospace,Consolas,monospace}
table.cmp td{padding:4px 16px;border-bottom:1px solid #d9d4c7;color:#1b1b1b}
table.cmp td.cn{font:12px/1 var(--sans);color:#5f5b53;padding-right:6px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px auto;max-width:860px}
.opts.mx{grid-template-columns:repeat(4,minmax(0,112px));justify-content:center}
.opts.at{max-width:520px}
.opt{position:relative;background:#fbfaf6;border:2px solid var(--rule);border-radius:2px;padding:6px;color:#1b1b1b;cursor:pointer;text-align:center;min-height:44px}
button.opt:hover{border-color:var(--accent)}
.opt .lt{position:absolute;left:4px;top:3px;font:700 13px/1 ui-monospace,Consolas,monospace;color:#5f5b53;padding:2px 4px;border-radius:2px;z-index:1}
.opt svg{display:block;margin:0 auto;width:100%;height:auto;max-height:200px}
.opt.num{font:700 28px/1 var(--sans);font-variant-numeric:lining-nums tabular-nums;padding:22px 8px}
.opt.txt{font-size:16px;padding:24px 8px}
.opt.sel{border-color:#1a4d8f;box-shadow:0 0 0 2px #1a4d8f}
.opt.sel .lt{background:#1a4d8f;color:#fff}
.opt.right{border-color:#2d6a3e;box-shadow:0 0 0 2px #2d6a3e}
.opt.right .lt{background:#2d6a3e;color:#fff}
.opt.wrong{border-color:#a3241c;box-shadow:0 0 0 2px #a3241c}
.opt.wrong .lt{background:#a3241c;color:#fff}
.ctl{margin:8px 0 0}
.ctl .grow{flex:1}
.nav{margin:18px 0 0;border-top:1px solid var(--rule);padding-top:10px}
.navf{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px}
.navf>.ic{margin-top:9px;color:var(--muted)}
.navg{display:grid;grid-template-columns:repeat(13,minmax(0,44px));gap:4px;flex:1}
.nv{position:relative;height:36px;border:1px solid var(--rule);background:var(--surface);color:var(--text);font:13px/1 var(--sans);font-variant-numeric:tabular-nums;border-radius:2px;cursor:pointer;padding:0}
.nv.a{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.nv.f::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--warn) transparent transparent}
.nv.cur{outline:2px solid var(--text);outline-offset:1px}
.scale{position:relative;height:10px;background:var(--stripe);border:1px solid var(--rule);margin:18px 0 4px;max-width:520px}
.scale>div{height:100%;background:var(--accent)}
.scale i{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text)}
.scl{position:relative;height:18px;max-width:520px;font-size:12px;color:var(--muted)}
.scl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rq{border-bottom:1px solid var(--rule);padding:10px 0 14px}
.rq .head{border:0}
.why{margin:.3rem 0}
.sheet{columns:4 150px;column-gap:22px;margin:10px 0}
.sr{display:flex;align-items:center;gap:5px;break-inside:avoid;padding:3px 0}
.sr b{width:2.2em;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;margin-right:2px}
.bub{width:22px;height:22px;border:1px solid var(--text);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:11px/1 var(--sans);color:var(--muted);background:transparent;padding:0;flex:none}
button.bub{width:30px;height:30px;cursor:pointer}
button.bub.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.phead{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between;border-bottom:2px solid var(--text);padding:4px 0;margin:6px 0;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.pitem{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;border-top:1px solid var(--rule);padding:8px 0;break-inside:avoid}
.pn{font:700 15px/1.4 var(--serif)}
.pitem .pr{font-size:13px;margin:0 0 4px;text-align:left}
.pitem .mat{grid-template-columns:repeat(3,56px);gap:3px;justify-content:start;margin:4px 0}
.pitem .seq{grid-template-columns:repeat(6,46px);gap:3px;justify-content:start;margin:4px 0}
.pitem .ana{grid-template-columns:repeat(2,56px);gap:3px 20px;justify-content:start;margin:4px 0}
.pitem .svgbox{max-width:190px!important;margin:0!important;padding:2px}
.pitem .svgbox svg{max-height:130px}
.pitem .panels{justify-content:flex-start;gap:4px;margin:2px 0}
.pitem .panels figure{width:70px;font-size:10px}
.pitem .panels svg{width:70px;height:70px}
.pitem .cap{text-align:left;font-size:10px}
.pitem .lbox{margin:2px 0;padding:4px;max-width:none}
.pitem .d2c{width:15px}
.pitem table.cmp{font-size:13px;margin:0}
.pitem table.cmp td{padding:1px 10px}
.popts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px;max-width:330px}
.popt{position:relative;border:1px solid #8a8578;background:#fbfaf6;color:#1b1b1b;padding:2px;text-align:center;min-height:30px}
.popt .lt{position:absolute;left:3px;top:2px;font:700 10px/1 ui-monospace,Consolas,monospace;z-index:1}
.popt svg{display:block;width:100%;height:auto;max-height:80px}
.popt.num{font:700 18px/1 var(--sans);font-variant-numeric:lining-nums tabular-nums;padding:14px 2px 6px}
.popt.txt{font-size:11px;padding:14px 2px 4px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:2px 8px;font:13px/1.6 ui-monospace,Consolas,monospace}
@media screen{.pkey{display:none}}
@media (max-width:700px){.pgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .mat{grid-template-columns:repeat(3,minmax(0,92px))}
  .seq{grid-template-columns:repeat(3,minmax(0,92px))}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.mx{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .ctl .btn{padding:8px 11px}
  .ctl kbd{display:none}
  .navg{grid-template-columns:repeat(9,minmax(0,1fr))}
}
@media print{
  @page{margin:12mm}
  :root{--bg:#fff;--stripe:#eee;--surface:#fff;--text:#000;--muted:#333;--rule:#999;--accent:#000;--onacc:#fff;color-scheme:light}
  body{background:#fff;color:#000;font-size:11pt}
  .top,.noprint{display:none!important}
  #app{max-width:none;padding:0}
  .pkey{display:block}
  .psheet,.pkey{break-before:page}
  .pitem{break-inside:avoid}
  .bub{color:#333;border-color:#000}
}
</style>

<script>
'use strict';
// ==== PURE LOGIC START ====
/* =====================================================================
   PURE LOGIC (no DOM). Item generators copied from trainer-matrices.html (MX) and trainer-spatial.html (SP);
   attention items (AT) built on the d2 symbol pools of aptitude-trainer.html. Only hints and difficulty scores
   were removed from the copies (they use no random numbers), so a seed gives the same item as the trainer.
   ===================================================================== */

/* ---------------------------------------------------------------- MX: abstract reasoning (trainer-matrices.html) */
const MX = (function(){
'use strict';
function makeRng(seed){
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let a = h;
  function next(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next: next,
    int: function(n){ return Math.floor(next() * n); },
    range: function(lo, hi){ return lo + Math.floor(next() * (hi - lo + 1)); },
    pick: function(arr){ return arr[Math.floor(next() * arr.length)]; },
    chance: function(p){ return next() < p; },
    shuffle: function(arr){
      const b = arr.slice();
      for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(next() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
      return b;
    }
  };
}
function mod(a, n){ return ((a % n) + n) % n; }
function uniq(arr){ const seen = {}; const out = []; arr.forEach(function(x){ if (!seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
function fill3(x){ return [[x, x, x], [x, x, x], [x, x, x]]; }
function transpose3(g){ return [[g[0][0], g[1][0], g[2][0]], [g[0][1], g[1][1], g[2][1]], [g[0][2], g[1][2], g[2][2]]]; }
function range(n){ const r = []; for (let i = 0; i < n; i++) r.push(i); return r; }

/* ---------- Attribute model ---------- */
const SHAPES = ['circle','square','triangle','diamond','pentagon','star','cross','hexagon','arrow','ell','halfdisc','rtri'];
const ASYM_IDX = [8,9,10,11];              // shapes with no rotational symmetry: the only ones used when rotation is a rule
const ALL_SHAPES = range(12);
const ATTRS = ['shape','count','shade','size','rot','pos'];
const ATTR_KIND = { shape:'cat', count:'ord', shade:'ord', size:'ord', rot:'cyc', pos:'cyc' };
const ATTR_D = { shape:12, count:5, shade:4, size:3, rot:8, pos:8 };
const ATTR_LABEL = { shape:'Forma', count:'Número de figuras', shade:'Sombreado', size:'Tamaño', rot:'Rotación', pos:'Posición' };
const SHAPE_ES = ['círculo','cuadrado','triángulo','rombo','pentágono','estrella','cruz','hexágono','flecha','ele','semicírculo','triángulo rectángulo'];
const SHAPE_ES_PL = ['círculos','cuadrados','triángulos','rombos','pentágonos','estrellas','cruces','hexágonos','flechas','eles','semicírculos','triángulos rectángulos'];
const DIRW = { row:'fila', column:'columna' };
const SHADE_NAMES = ['blanco','rayado','gris','negro'];
const SIZE_NAMES = ['pequeño','mediano','grande'];
function valName(a, v){
  if (a === 'shape') return SHAPE_ES[v];
  if (a === 'count') return String(v + 1);

/* ---------- Matrix: independent solver ---------- */
function lineHyps(g, a){

  if (eq3(l0) && eq3(l1) && l2[0] === l2[1]) preds.push({ n:'rowconst', p:l2[0] });

    const steps = kind === 'cyc' ? [1, -1, 2, -2, 3, -3] : [1, -1, 2, -2];
    steps.forEach(function(s){
      const ok = function(l){
        return kind === 'cyc' ? (mod(l[1] - l[0], D) === mod(s, D) && mod(l[2] - l[1], D) === mod(s, D)) : (l[1] - l[0] === s && l[2] - l[1] === s);
      };

        const fits = kind === 'cyc' ? mod(l2[1] - l2[0], D) === mod(s, D) : l2[1] - l2[0] === s;
        if (fits){

    const dom = domainOf(ctx, a).filter(function(v){ return v !== answer[a]; });
    const pref = uniq((hints[a] || []).filter(function(v){ return dom.indexOf(v) >= 0; }));
    let rest = dom.filter(function(v){ return pref.indexOf(v) < 0; });
    if (ATTR_KIND[a] !== 'cat' && rng.chance(closeP)){
      rest = rng.shuffle(rest).sort(function(x, y){ return cycDist(a, x, answer[a]) - cycDist(a, y, answer[a]); });

function optsClass(q){ return q.src === 'mx' ? 'mx' : (q.src === 'at' ? 'at' : 'sp'); }
// mode: 'run' (buttons, chosen = selected), 'review' (right/wrong marks)
function optsHTML(q, mode, chosen){
  let h = '<div class="opts ' + optsClass(q) + '" id="opts">';
  for (let i = 0; i < 4; i++){
    const o = optInner(q, i);
    let cls = 'opt ' + o.cls;
    if (mode === 'run'){
      if (i === chosen) cls += ' sel';
      h += '<button class="' + cls + '" data-i="' + i + '" aria-label="Opción ' + LETTERS[i] + '" aria-pressed="' + (i === chosen) + '"><span class="lt">' + LETTERS[i] + '</span>' + o.h + '</button>';
    } else {
      if (i === q.it.answer) cls += ' right'; else if (i === chosen) cls += ' wrong';
      h += '<div class="' + cls + '"><span class="lt">' + LETTERS[i] + '</span>' + o.h + '</div>';
    }
  }
  return h + '</div>';
}
function whyOf(q, i){
  const it = q.it;
  if (q.src === 'mx'){ const n = it.notes[i]; return n ? (n.text || MX.noteText(n, it.kind)) : 'Correcta.'; }
  return it.whys[i] || '';
}
function kindName(q){ return KIND_ES[q.src === 'mx' ? q.it.kind : q.it.type]; }

/* ---------- home ---------- */
function card(id, icon, name, detail){
  return '<button class="card" id="' + id + '">' + ic(icon) + '<span><span class="nm">' + name + '</span><span class="dt">' + detail + '</span></span>' + ic('next') + '</button>';
}
function home(){
  stop(); S = null;
  const run = lsGet(RUN_KEY);
  const hasRun = run && normCode(run.code) && typeof run.a === 'string';
  const hist = (lsGet(STORE_KEY) || {}).sessions;
  let h = '<div class="list">' + card('go', 'play', 'Simulacro', N_ITEMS + ' ítems · 60 min · A-D');
  if (hasRun) h += card('cont', 'repeat', 'Continuar', run.a.replace(/-/g, '').length + ' / ' + N_ITEMS + ' · ' + clock(LIMIT - (run.el || 0)));
  h += card('prt', 'print', 'Imprimir', 'Modelo · hoja · plantilla') + card('fix', 'sheet', 'Corregir hoja', 'Código del modelo') + '</div>';
  if (hasRun) h += '<p><button class="btn danger" id="drop">' + ic('trash') + 'Descartar el simulacro abierto</button></p>';
  h += '<details><summary>Puntuación</summary><ul class="rules">' +
    '<li>Neta = aciertos − errores / 3 · en blanco = 0</li>' +
    '<li>/50 = neta × 50 / ' + num(BEST_NET) + ' (mejor neta de 2025)</li>' +
    '<li>Apto: 25 = ' + num(PASS_PTS * BEST_NET / MAX_PTS, 1) + ' netas · cabeza del ranking ≈ ' + TOP_NET + ' netas</li></ul></details>';
  if (Array.isArray(hist) && hist.length){
    h += '<h2>' + ic('history') + ' Historial</h2><div class="tbl"><table><thead><tr><th>Fecha</th><th>Neta</th><th>/50</th><th>' + ic('check') + '</th><th>' + ic('x') + '</th><th>' + ic('dash') + '</th><th>' + ic('timer') + '</th></tr></thead><tbody>' +
      hist.slice().reverse().map(function(r){
        return '<tr><td>' + dateEs(r.ts) + '</td><td><b>' + num(r.net) + '</b></td><td>' + num(toPts(r.net)) + '</td><td>' + r.correct + '</td><td>' + r.wrong + '</td><td>' + r.blank + '</td><td>' + (r.paper ? ic('print') : clock(r.secs)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  show(h);
  $('go').addEventListener('click', function(){ startRun(newCode(), null); });
  if (hasRun){
    $('cont').addEventListener('click', function(){ startRun(normCode(run.code), run); });
    $('drop').addEventListener('click', function(){ if (window.confirm('¿Descartar?')){ lsSet(RUN_KEY, null); home(); } });
  }
  $('prt').addEventListener('click', function(){ printView(newCode()); });
  $('fix').addEventListener('click', function(){ fixView(''); });
}

/* ---------- timed run ---------- */
function elapsed(){ return S.el + (performance.now() - S.t0) / 1000; }
function saveRun(){
  if (!S || S.mode !== 'run') return;
  lsSet(RUN_KEY, { code:S.form.code, a:S.ans.map(function(x){ return x < 0 ? '-' : LETTERS[x]; }).join(''), f:S.flag.map(function(b){ return b ? 1 : 0; }).join(''), el:Math.round(elapsed()), ts:Date.now() });
}
function busy(){ show('<p class="soft">…</p>'); }
function startRun(code, run){
  stop(); busy();
  setTimeout(function(){
    let form;
    try { form = buildForm(code); } catch (e) { show('<p class="bad">' + escH(e.message) + '</p>'); return; }
    const ans = [], flag = [];
    for (let i = 0; i < N_ITEMS; i++){
      const ch = run && run.a ? run.a[i] : '-';
      ans.push(LETTERS.indexOf(ch));
      flag.push(!!(run && run.f && run.f[i] === '1'));
    }
    S = { mode:'run', form:form, ans:ans, flag:flag, cur:0, el:run ? (run.el || 0) : 0, t0:performance.now(), lastSave:0 };
    if (run){ const firstBlank = ans.indexOf(-1); S.cur = firstBlank >= 0 ? firstBlank : 0; }
    saveRun();
    tickId = setInterval(tick, 250);
    renderRun();
  }, 20);
}
function counts(){ return { a:S.ans.filter(function(x){ return x >= 0; }).length, f:S.flag.filter(Boolean).length }; }
function navHTML(){
  let h = '<div class="nav" id="nav">';
  FAMS.forEach(function(f){
    h += '<div class="navf">' + ic('f-' + f) + '<div class="navg">';
    S.form.items.forEach(function(q, i){
      if (q.fam !== f) return;
      h += '<button class="nv' + (S.ans[i] >= 0 ? ' a' : '') + (S.flag[i] ? ' f' : '') + (i === S.cur ? ' cur' : '') + '" data-n="' + i + '" aria-label="Ítem ' + (i + 1) + '">' + (i + 1) + '</button>';
    });
    h += '</div></div>';
  });
  return h + '</div>';
}
function renderRun(){
  const q = S.form.items[S.cur], c = counts(), lb = label(q);
  show('<div class="head"><span class="timer" id="tm">' + ic('timer') + ' ' + clock(LIMIT - elapsed()) + '</span><span><b>' + (S.cur + 1) + '</b> / ' + N_ITEMS + '</span>' +
    '<span>' + ic('f-' + q.fam) + FAM_LABEL[q.fam] + '</span><span>' + ic('check') + '<b id="na">' + c.a + '</b></span><span>' + ic('flag') + '<b id="nf">' + c.f + '</b></span></div>' +
    '<div class="bar"><div id="bar" style="width:' + Math.round(c.a / N_ITEMS * 100) + '%"></div></div>' +
    (lb ? '<p class="pr">' + escH(lb) + '</p>' : '') + stemHTML(q) + optsHTML(q, 'run', S.ans[S.cur]) +
    '<div class="row ctl"><button class="btn" id="prev" aria-label="Anterior"' + (S.cur === 0 ? ' disabled' : '') + '>' + ic('back') + '</button>' +
    '<button class="btn' + (S.flag[S.cur] ? ' on' : '') + '" id="flag" aria-pressed="' + S.flag[S.cur] + '">' + ic('flag') + 'Marcar <kbd>M</kbd></button>' +
    '<button class="btn" id="clr"' + (S.ans[S.cur] < 0 ? ' disabled' : '') + '>' + ic('x') + 'Borrar</button>' +
    '<button class="btn primary" id="next" aria-label="Siguiente"' + (S.cur === N_ITEMS - 1 ? ' disabled' : '') + '>' + ic('next') + '</button>' +
    '<span class="grow"></span><button class="btn" id="end">' + ic('check') + 'Entregar</button></div>' + navHTML());
  $('opts').addEventListener('click', function(e){ const b = e.target.closest('button.opt'); if (b) choose(+b.getAttribute('data-i')); });
  $('prev').addEventListener('click', function(){ go(S.cur - 1); });
  $('next').addEventListener('click', function(){ go(S.cur + 1); });
  $('flag').addEventListener('click', toggleFlag);
  $('clr').addEventListener('click', function(){ choose(-1); });
  $('end').addEventListener('click', function(){ submit(false); });
  $('nav').addEventListener('click', function(e){ const b = e.target.closest('button.nv'); if (b) go(+b.getAttribute('data-n')); });
  onKey = function(e){
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k.length === 1 && 'abcd'.indexOf(k) >= 0) choose('abcd'.indexOf(k));
    else if (k.length === 1 && '1234'.indexOf(k) >= 0) choose(+k - 1);
    else if (k === 'Backspace' || k === 'Delete' || k === '0') choose(-1);
    else if (k === 'ArrowLeft') go(S.cur - 1);
    else if (k === 'ArrowRight' || k === 'Enter') go(S.cur + 1);
    else if (k === 'm') toggleFlag();
    else return;
    e.preventDefault();
  };
}
function refreshRun(){
  const c = counts(), cur = S.cur, a = S.ans[cur];
  document.querySelectorAll('#opts button.opt').forEach(function(b){ const i = +b.getAttribute('data-i'); b.classList.toggle('sel', i === a); b.setAttribute('aria-pressed', String(i === a)); });
  const nb = document.querySelector('#nav button[data-n="' + cur + '"]');
  if (nb){ nb.classList.toggle('a', a >= 0); nb.classList.toggle('f', S.flag[cur]); }
  $('na').textContent = c.a; $('nf').textContent = c.f;
  $('bar').style.width = Math.round(c.a / N_ITEMS * 100) + '%';
  $('clr').disabled = a < 0;
  $('flag').classList.toggle('on', S.flag[cur]); $('flag').setAttribute('aria-pressed', String(S.flag[cur]));
}
function choose(i){
  if (!S || S.mode !== 'run') return;
  S.ans[S.cur] = (i === S.ans[S.cur]) ? -1 : i;
  refreshRun(); saveRun();
}
function toggleFlag(){ S.flag[S.cur] = !S.flag[S.cur]; refreshRun(); saveRun(); }
function go(n){ if (n < 0 || n >= N_ITEMS || n === S.cur) return; S.cur = n; renderRun(); }
function tick(){
  if (!S || S.mode !== 'run') return;
  const left = LIMIT - elapsed(), tm = $('tm');
  if (tm){
    tm.innerHTML = ic('timer') + ' ' + clock(left);
    tm.className = 'timer' + (left <= 60 ? ' over' : (left <= 300 ? ' late' : ''));
  }
  if (left <= 0){ submit(true); return; }
  if (performance.now() - S.lastSave > 10000){ S.lastSave = performance.now(); saveRun(); }
}
function submit(auto){
  if (!S || S.mode !== 'run') return;
  if (!auto){
    const blank = S.ans.filter(function(x){ return x < 0; }).length;
    if (!window.confirm('¿Entregar?' + (blank ? ' En blanco: ' + blank : ''))) return;
  }
  const secs = Math.min(LIMIT, Math.round(elapsed()));
  const form = S.form, ans = S.ans.slice();
  stop(); lsSet(RUN_KEY, null);
  finish(form, ans, secs, false);
}
function finish(form, ans, secs, paper){
  const r = scoreForm(form, ans);
  const ok = lsSet(STORE_KEY, pushRecord(lsGet(STORE_KEY), makeRecord(r, secs, paper, Date.now())));
  results(form, ans, r, secs, paper, ok);
}

/* ---------- results ---------- */
function results(form, ans, r, secs, paper, saved){
  S = { mode:'results' };
  const pts = toPts(r.net), pct = function(x){ return Math.max(0, Math.min(100, x / N_ITEMS * 100)).toFixed(1); };
  const passNet = PASS_PTS * BEST_NET / MAX_PTS;
  let h = '<button class="link" id="back">' + ic('back') + 'Inicio</button>' +
    '<div class="figs"><div class="fig"><b>' + num(r.net) + '</b><span>Neta</span></div>' +
    '<div class="fig"><b>' + num(pts) + '</b><span>/50 si el mejor saca 72</span></div>' +
    '<div class="fig"><b class="good">' + r.c + '</b><span>Aciertos</span></div>' +
    '<div class="fig"><b class="bad">' + r.w + '</b><span>Errores</span></div>' +
    '<div class="fig"><b>' + r.b + '</b><span>En blanco</span></div>' +
    '<div class="fig"><b>' + (paper ? '—' : clock(secs)) + '</b><span>Tiempo</span></div></div>' +
    '<div class="scale" aria-hidden="true"><div style="width:' + pct(r.net) + '%"></div><i style="left:' + pct(passNet) + '%"></i><i style="left:' + pct(TOP_NET) + '%"></i></div>' +
    '<div class="scl"><span style="left:' + pct(passNet) + '%">Apto</span><span style="left:' + pct(TOP_NET) + '%">Cabeza</span></div>' +
    (saved ? '' : '<p class="warn">Sin guardar</p>') +
    '<div class="tbl"><table><thead><tr><th></th><th>' + ic('check') + '</th><th>' + ic('x') + '</th><th>' + ic('dash') + '</th><th>Neta</th></tr></thead><tbody>' +
    FAMS.map(function(f){ const x = r.fam[f]; return '<tr><td>' + ic('f-' + f) + ' ' + FAM_LABEL[f] + '</td><td>' + x.c + '</td><td>' + x.w + '</td><td>' + x.b + '</td><td><b>' + num(x.c - 0.33 * x.w) + '</b></td></tr>'; }).join('') +
    '</tbody></table></div>';
  const miss = form.items.filter(function(q, i){ return ans[i] !== q.it.answer; });
  if (miss.length){
    h += '<h2>Revisión · ' + miss.length + '</h2>';
    miss.forEach(function(q){
      const i = q.n, ch = ans[i], it = q.it, lb = label(q);
      const rules = q.src === 'mx' ? it.rules.map(function(t){ return t.split('§').join(LETTERS[it.answer]); }) : [whyOf(q, it.answer)];
      h += '<div class="rq"><div class="head"><span><b>' + (i + 1) + '</b></span><span>' + ic('f-' + q.fam) + kindName(q) + '</span>' +
        (ch >= 0 ? '<span class="bad">' + ic('x') + LETTERS[ch] + '</span>' : '<span>' + ic('dash') + '</span>') + '<span class="good">' + ic('check') + LETTERS[it.answer] + '</span></div>' +
        (lb ? '<p class="pr">' + escH(lb) + '</p>' : '') + stemHTML(q) + optsHTML(q, 'review', ch) +
        (ch >= 0 ? '<p class="why"><b class="bad">' + LETTERS[ch] + '</b> · ' + escH(whyOf(q, ch)) + '</p>' : '') +
        '<details><summary>Regla</summary><ul class="rules">' + rules.map(function(t){ return '<li>' + escH(t) + '</li>'; }).join('') + '</ul></details></div>';
    });
  }
  h += '<p class="row" style="margin-top:18px"><button class="btn primary" id="again">' + ic('play') + 'Otro simulacro</button><button class="btn" id="home2">' + ic('back') + 'Inicio</button></p>';
  show(h);
  $('back').addEventListener('click', home); $('home2').addEventListener('click', home);
  $('again').addEventListener('click', function(){ startRun(newCode(), null); });
}

/* ---------- paper: print a form, correct a sheet ---------- */
function sheetHTML(ans){
  let h = '<div class="sheet" id="sheet">';
  for (let i = 0; i < N_ITEMS; i++){
    h += '<div class="sr"><b>' + (i + 1) + '</b>';
    for (let j = 0; j < 4; j++){
      if (ans) h += '<button class="bub' + (ans[i] === j ? ' on' : '') + '" data-n="' + i + '" data-j="' + j + '" aria-label="' + (i + 1) + ' ' + LETTERS[j] + '">' + LETTERS[j] + '</button>';
      else h += '<span class="bub">' + LETTERS[j] + '</span>';
    }
    h += '</div>';
  }
  return h + '</div>';
}
function printView(code){
  stop(); busy();
  setTimeout(function(){
    let form;
    try { form = buildForm(code); } catch (e) { show('<p class="bad">' + escH(e.message) + '</p>'); return; }
    S = { mode:'print', form:form };
    const C = code.toUpperCase();
    const head = function(t, extra){ return '<div class="phead"><span>' + t + '</span><span>Modelo <b>' + C + '</b></span><span>' + (extra || '') + '</span></div>'; };
    let h = '<div class="noprint row" style="margin:0 0 10px"><button class="link" id="back">' + ic('back') + 'Inicio</button><button class="btn primary" id="pp">' + ic('print') + 'Imprimir</button><button class="btn" id="fx">' + ic('sheet') + 'Corregir</button></div>' +
      head('Simulacro de aptitudes', N_ITEMS + ' · 60 min · ✓ − ✗/3') + '<div class="pgrid">';
    form.items.forEach(function(q){
      const lb = label(q);
      h += '<div class="pitem"><div class="pn">' + (q.n + 1) + '</div><div>' + (lb ? '<p class="pr">' + escH(lb) + '</p>' : '') + stemHTML(q) + '<div class="popts">';
      for (let i = 0; i < 4; i++){ const o = optInner(q, i); h += '<div class="popt ' + o.cls + '"><span class="lt">' + LETTERS[i] + '</span>' + o.h + '</div>'; }
      h += '</div></div></div>';
    });
    h += '</div><section class="psheet">' + head('Hoja de respuestas', '✓ − ✗/3') + sheetHTML(null) + '</section>' +
      '<section class="pkey">' + head('Plantilla', '') + '<div class="pk">' + form.items.map(function(q){ return '<span>' + (q.n + 1) + ' ' + LETTERS[q.it.answer] + '</span>'; }).join('') + '</div></section>';
    show(h);
    $('back').addEventListener('click', home);
    $('pp').addEventListener('click', function(){ window.print(); });
    $('fx').addEventListener('click', function(){ sheetView(code); });
  }, 20);
}
function fixView(pre){
  stop(); S = { mode:'fix' };
  show('<button class="link" id="back">' + ic('back') + 'Inicio</button><label class="lb" for="code">Modelo</label>' +
    '<div class="row"><input type="text" id="code" value="' + escH(pre) + '" autocomplete="off" spellcheck="false" maxlength="8" style="max-width:180px;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace">' +
    '<button class="btn primary" id="open" aria-label="Abrir">' + ic('next') + '</button></div><div id="err"></div>');
  const open = function(){ const c = normCode($('code').value); if (!c){ $('err').innerHTML = '<p class="bad">Código no válido</p>'; $('code').focus(); return; } sheetView(c); };
  $('back').addEventListener('click', home);
  $('open').addEventListener('click', open);
  $('code').focus();
  onKey = function(e){ if (e.key === 'Enter'){ e.preventDefault(); open(); } };
}
function sheetView(code){
  stop(); busy();
  setTimeout(function(){
    let form;
    try { form = buildForm(code); } catch (e) { show('<p class="bad">' + escH(e.message) + '</p>'); return; }
    const ans = []; for (let i = 0; i < N_ITEMS; i++) ans.push(-1);
    S = { mode:'sheet', form:form, ans:ans };
    show('<button class="link" id="back">' + ic('back') + 'Inicio</button><div class="head"><span>' + ic('sheet') + 'Modelo <b>' + code.toUpperCase() + '</b></span><span>' + ic('check') + '<b id="na">0</b> / ' + N_ITEMS + '</span></div>' +
      sheetHTML(ans) + '<p class="row"><button class="btn primary" id="score">' + ic('check') + 'Corregir</button></p>');
    $('back').addEventListener('click', home);
    $('sheet').addEventListener('click', function(e){
      const b = e.target.closest('button.bub'); if (!b) return;
      const n = +b.getAttribute('data-n'), j = +b.getAttribute('data-j');
      S.ans[n] = S.ans[n] === j ? -1 : j;
      document.querySelectorAll('#sheet button.bub[data-n="' + n + '"]').forEach(function(x){ x.classList.toggle('on', +x.getAttribute('data-j') === S.ans[n]); });
      $('na').textContent = S.ans.filter(function(x){ return x >= 0; }).length;
    });
    $('score').addEventListener('click', function(){ const f = S.form, a = S.ans.slice(); finish(f, a, 0, true); });
  }, 20);
}

/* ---------- keys and start ---------- */
document.addEventListener('keydown', function(e){
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA'){ if (e.key === 'Enter' && onKey) onKey(e); return; }
  if (e.key === 'Escape'){ e.preventDefault(); if (S && S.mode === 'run') saveRun(); home(); return; }
  if (S && S.mode === 'run' && (e.key === ' ' || e.key.indexOf('Arrow') === 0)) e.preventDefault();
  if (onKey) onKey(e);
});
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveRun(); });
window.addEventListener('pagehide', saveRun);

/* ---------- Día de la Fase 1 (simulacros/dia-fase-1.html): ?dia=<id> empieza o sigue el simulacro de ese día y, al
   entregar, guarda el registro como siempre y vuelve allí; ?dia=<id>&rev=1 enseña la revisión del simulacro entregado.
   Sin ?dia la página funciona igual que antes. */
const DIA_KEY = 'atc_aptmock_dia_v1', DIA_BACK = '../../simulacros/dia-fase-1.html';
const DIA = (function(){
  try { const p = new URLSearchParams(location.search), t = p.get('dia'); return t && /^[0-9a-z]{1,20}$/.test(t) ? { tok:t, rev:p.get('rev') === '1' } : null; }
  catch (e) { return null; }
})();
if (DIA){
  const finish0 = finish;
  home = function(){ if (S && S.mode === 'run') saveRun(); stop(); location.replace(DIA_BACK); };
  finish = function(form, ans, secs, paper){
    if (paper) return finish0(form, ans, secs, paper);
    const r = scoreForm(form, ans), ts = Date.now();
    lsSet(STORE_KEY, pushRecord(lsGet(STORE_KEY), makeRecord(r, secs, false, ts)));
    lsSet(DIA_KEY, { tok:DIA.tok, code:form.code, a:ans.map(function(x){ return x < 0 ? '-' : LETTERS[x]; }).join(''), secs:secs, ts:ts });
    location.replace(DIA_BACK);
  };
  const dk = lsGet(DIA_KEY) || {}, mine = dk.tok === DIA.tok && !!normCode(dk.code), handed = mine && typeof dk.a === 'string';
  if (DIA.rev){
    let form = null;
    if (handed && dk.a.length === N_ITEMS){ try { form = buildForm(normCode(dk.code)); } catch (e) { form = null; } }
    if (form){
      const ans = dk.a.split('').map(function(ch){ return LETTERS.indexOf(ch); });
      results(form, ans, scoreForm(form, ans), dk.secs || 0, false, true);
      const again = $('again'); if (again) again.remove();
    } else home();
  } else if (handed) home();
  else {
    const run = lsGet(RUN_KEY);
    if (mine && run && normCode(run.code) === normCode(dk.code) && typeof run.a === 'string') startRun(normCode(run.code), run);
    else { const c = newCode(); lsSet(DIA_KEY, { tok:DIA.tok, code:c }); startRun(c, null); }
  }
} else home();
</script>
