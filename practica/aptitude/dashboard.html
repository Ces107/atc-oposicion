<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progreso</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4d8f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9.2'/%3E%3Ccircle cx='12' cy='12' r='4.6'/%3E%3Cpath d='M12 12L19 6.2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --soft:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --on-accent:#ffffff; --good:#2d6a3e; --bad:#a3241c; --warn:#b3450d;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --soft:#a19c90; --rule:#3a3935;
  --accent:#7fb0e8; --accent-h:#a4c6ef; --on-accent:#161615; --good:#7cbf8a; --bad:#e5766d; --warn:#e08a55;
}}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45}
#app{max-width:1120px;margin:0 auto;padding:16px 16px 48px}
h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;margin:0;font-weight:700}
h2{font-family:var(--serif);font-size:1.35rem;margin:1.6rem 0 .6rem;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:700}
h3{font-family:var(--serif);font-size:1.06rem;margin:1.1rem 0 .3rem;font-weight:700}
p{margin:.3rem 0}
.soft{color:var(--soft)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .i{width:34px;height:34px;color:var(--accent);stroke-width:1.5}
.meta{color:var(--soft);font-size:.86rem}
button,select,input{font:inherit}
.btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;line-height:1.2;transition:background-color .12s,color .12s}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);color:var(--on-accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.86rem}
a{color:var(--accent)}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;min-height:34px}
input[type=number]{width:72px}
input:focus-visible,select:focus-visible,.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:0;margin:0 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--soft);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--text);font-weight:700}
section.tab{display:none} section.tab.on{display:block}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-top:2px solid var(--text);border-bottom:1px solid var(--rule)}
.next .i.lead{width:30px;height:30px;color:var(--accent)}
.next .nm{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.15;flex:1 1 220px}
.next .lv{color:var(--soft);font-size:.95rem}
.figs{display:flex;gap:0;flex-wrap:wrap;margin:0 0 4px;border-bottom:1px solid var(--rule)}
.fig{padding:12px 28px 12px 0;margin-right:28px}
.fig .n{display:block;font-family:var(--serif);font-size:2.6rem;line-height:1;font-weight:700}
.fig .l{display:block;color:var(--soft);font-size:.82rem;margin-top:4px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:0 40px}
.axis{display:grid;grid-template-columns:200px 1fr 84px 96px;gap:10px;color:var(--soft);font-size:.74rem;padding:0 0 2px}
.axis .scale{position:relative;height:1em}
.axis .scale span{position:absolute;transform:translateX(-50%)}
.ab{display:grid;grid-template-columns:200px 1fr 84px 96px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);grid-template-areas:"nm bar v tr"}
.ab .nm{font-weight:600;grid-area:nm}
.ab .bar-w{grid-area:bar}
.ab.weak .nm{color:var(--warn)}
.ab .v{grid-area:v;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ab .tr{grid-area:tr;font-size:.84rem;text-align:right;white-space:nowrap}
.ab .cf{font-weight:400;color:var(--soft);font-size:.8rem;display:block}
.bar{position:relative;height:14px;background:var(--stripe);border-radius:0}
.bar .ci{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.22}
.bar .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent)}
.bar .fill.dim{opacity:.5}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1px solid var(--soft)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.days .d{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--soft)}
.days .d .b{width:60%;min-height:2px;background:var(--accent)}
.days .d.today{color:var(--text);font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;border-top:1px solid var(--text);border-bottom:1px solid var(--text)}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:transparent}
th{color:var(--soft);font-weight:600;font-size:.82rem}
td.num,th.num{text-align:right;padding-right:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.chart{padding:10px 0 6px;border-top:1px solid var(--rule)}
.chart svg{width:100%;height:auto;display:block}
.chart .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.chart .h span{color:var(--soft);font-weight:400;font-size:.84rem}
.sv .gl{stroke:var(--rule)} .sv .gk{stroke:var(--soft);stroke-dasharray:4 3}
.sv text{fill:var(--soft);font-size:9px;font-family:var(--sans)}
.sv .ln{fill:none;stroke:var(--accent);stroke-width:1.6}
.sv .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.sv .bm{fill:none;stroke:var(--warn);stroke-width:1.4}
.drop{border:1px dashed var(--soft);padding:20px;text-align:center;color:var(--soft);display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);color:var(--text)}
.drop .i{width:24px;height:24px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--rule)}
.check input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.check .t{flex:1}
.check.done .t{color:var(--soft);text-decoration:line-through}
.check .t a{white-space:nowrap}
.banner{padding:8px 0;border-bottom:1px solid var(--rule);margin-bottom:14px;font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}
.banner.err b{color:var(--bad)}
.pass{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}
.trio{display:flex;gap:3px;align-items:flex-end;height:26px}
.trio i{display:block;width:10px;background:var(--accent)}
details{margin:.6rem 0}
summary{cursor:pointer;color:var(--accent);display:flex;align-items:center;gap:7px}
label.inl{display:inline-flex;align-items:center;gap:6px}
@media (max-width:900px){.cols,.grid2{grid-template-columns:1fr}}
@media (max-width:640px){
  #app{padding:12px 16px 40px}
  h1{font-size:1.55rem}
  .axis{display:none}
  .ab{grid-template-columns:1fr auto;grid-template-areas:"nm v" "bar bar" "tr tr";gap:4px 10px}
  .ab .tr{text-align:left}
  .fig{margin-right:20px;padding-right:0}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto}
  nav.tabs button{padding:9px 9px;white-space:nowrap;font-size:.92rem}
  nav.tabs button .i{display:none}
  .ab.nd{grid-template-areas:"nm v"}
  .ab.nd .bar-w,.ab.nd .tr{display:none}
}
</style>
</head>

<script>
/* =====================================================================================================
   CORE (pure functions, no DOM). Extracted and unit-tested in node by dashboard-test/core.test.js.
   Model = research/wave5-phase2-design-spec.md sections 3.1-3.4, 4.2, 2.1-2.4. Internal scale only: not stanines.
   ===================================================================================================== */
//==CORE START==
const Z80 = 1.2815515655446004;           // two-sided 80 % normal quantile
const DAY = 86400000;
const WINDOW_DAYS = 42;
const clamp = function(x, a, b){ return Math.min(b, Math.max(a, x)); };

function wilson(c, n, z){
  z = z || Z80;
  if (!(n > 0)) return null;
  const p = c / n, z2 = z * z, den = 1 + z2 / n;
  const centre = (p + z2 / (2 * n)) / den;
  const half = z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / den;
  return { p: p, lo: Math.max(0, centre - half), hi: Math.min(1, centre + half) };
}
// Newcombe hybrid-score interval for p2 - p1 (each proportion carries its own Wilson interval).
function diffInterval(c1, n1, c3, n3){
  const a = wilson(c1, n1), b = wilson(c3, n3);
  if (!a || !b) return null;
  const d = b.p - a.p;
  return { d: d, lo: d - Math.sqrt(Math.pow(b.p - b.lo, 2) + Math.pow(a.hi - a.p, 2)), hi: d + Math.sqrt(Math.pow(b.hi - b.p, 2) + Math.pow(a.p - a.lo, 2)), a: a, b: b };
}
// 3.1: effective level and session score
function effLevel(L, acc){ return L + clamp((acc - 96) / 8, -1.5, 0.5); }
function sessionScore(L, acc){
  const el = effLevel(L, acc);
  const s = el <= 5 ? 14 * el : 70 + 10 * (el - 5);
  return clamp(s, 0, 100);
}
function levelFromScore(S){ return S <= 70 ? S / 14 : 5 + (S - 70) / 10; }   // inverse of sessionScore at accuracy 96
function median(a){ if (!a.length) return null; const s = a.slice().sort(function(x, y){ return x - y; }); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
// 3.3: Theil-Sen slope; pts = [{t (ms), y}], result in y-units per week; null if fewer than 5 points or span < 10 days
function theilSen(pts){
  if (pts.length < 5) return null;
  const ts = pts.map(function(p){ return p.t; });
  if ((Math.max.apply(null, ts) - Math.min.apply(null, ts)) < 10 * DAY) return null;
  const sl = [];
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++){
    const dt = pts[j].t - pts[i].t;
    if (dt !== 0) sl.push((pts[j].y - pts[i].y) / (dt / (7 * DAY)));
  }
  return sl.length ? median(sl) : null;
}

/* ---------- modules, abilities, weights (spec 3.2) ---------- */
const MODNAME = {
  'rad.cat':'Categorización rápida', 'rad.conf':'Detección de conflictos en radar', 'rad.arith':'Aritmética de rumbos',
  'at.lr':'Izquierda/derecha', 'at.calc':'Cálculo mental', 'at.d2':'Cancelación de atención', 'at.nback':'N-back doble',
  'sp.rot3d':'Rotación mental 3D', 'sp.net':'Desarrollos de cubos', 'sp.view':'Vistas (planta, alzado, perfil)', 'sp.fold':'Plegado de papel', 'sp.shape2d':'Rotación y simetría 2D', 'sp.mixed':'Espacial mixto',
  'mat.matrix':'Matrices', 'mat.logic':'Matrices lógicas', 'mat.series':'Series de figuras', 'mat.analogy':'Analogías', 'mat.odd':'El elemento distinto', 'mat.mixed':'Razonamiento abstracto mixto',
  'mem.m1':'Memoria de tiras de vuelo', 'mem.m2':'Amplitud de dígitos y letras', 'mem.m3':'Verificador de colacionado', 'mem.m4':'Ejecución de instrucciones', 'mem.m5':'Vigilancia', 'mem.m6':'Cambio de tarea', 'mem.m7':'Interferencia tipo Stroop',
  'lis.dictation':'Dictado de elementos', 'lis.passage':'Comprensión de pasajes',
  'mm.single':'Cálculo mental (tarea única)', 'mm.dual':'Cálculo mental (doble tarea)',
  'ss.sim':'Simulador de sector (HTML)', 'sim':'Simulador radar en Python',
  'sim.audio':'Sim: tarea hablada', 'sim.strips':'Sim: planificador de fichas', 'sim.plan':'Sim: separación/transferencia/nivel/zona', 'sim.worst':'Sim: peor componente', 'sim.comms':'Sim: colacionado/transferencia/alerta', 'sim.num':'Sim: tiempo al conflicto/ETA', 'sim.alert':'Sim: alerta', 'endur':'Resistencia (último tercio)'
};
// Spanish display names for the sim component keys (the keys themselves stay English: they come from the sim JSON)
const COMPNAME = { 'Separation':'Separación', 'Handoff':'Transferencia', 'Level request':'Petición de nivel', 'Restricted area':'Zona restringida', 'Read-back check':'Comprobación de colacionado', 'Transfer of communication':'Transferencia de comunicaciones', 'Alert (vigilance)':'Alerta (vigilancia)', 'Time to conflict':'Tiempo al conflicto', 'ETA estimate':'Estimación de ETA' };
function compName(k){ return COMPNAME[k] || k; }
const CONFNAME = { 'None':'Ninguna', 'Low':'Baja', 'Medium':'Media', 'High':'Alta' };
const TRENDNAME = { 'rising':'subiendo', 'falling':'bajando', 'flat':'estable', 'n/a':'n/d' };
const VERDNAME = { 'fading':'cae', 'small fade':'caída leve', 'improving':'mejora', 'no clear fade':'sin caída clara' };
const MODLINK = {
  rad:'trainer-radar.html', at:'../aptitude-trainer.html', sp:'trainer-spatial.html', mat:'trainer-matrices.html',
  mem:'game-memory-attention.html', lis:'game-listening.html', mm:'game-mental-math.html', ss:'game-sector-sim.html', sim:'../sim/README.txt'
};
function linkFor(mod){ return MODLINK[String(mod).split('.')[0]] || null; }
const ABILITIES = [
  { id:'H1', name:'Visualización (3D)', head:true,  w:{ 'sp.rot3d':.35, 'sp.net':.35, 'sp.view':.15, 'sp.fold':.15, 'sp.mixed':.25 } },
  { id:'H2', name:'Capacidad de clasificación', head:true,  w:{ 'rad.cat':.45, 'mem.m6':.25, 'at.d2':.15, 'mat.logic':.075, 'mat.series':.075 } },
  { id:'H3', name:'Planificación ATC',  head:true,  w:{ 'rad.conf':.30, 'sim.plan':.40, 'ss.sim':.20, 'rad.arith':.10 } },
  // Weight 0 = listed but never scored (b1123, AAPT section 3): no description of the real tests names dual n-back or a
  // Stroop-type task (M7), and their far transfer is about nil, so they no longer move readiness, gates or recommendations.
  { id:'H4', name:'Multitarea',         head:true,  w:{ 'sim.worst':.35, 'sim.comms':.25, 'mm.dual':.20, 'ss.sim':.10, 'mem.m7':0 } },
  { id:'H5', name:'Comprensión oral en inglés',  head:true,  w:{ 'lis.dictation':.5, 'lis.passage':.5 } },
  { id:'S1', name:'Memoria de trabajo', head:false, w:{ 'mem.m1':.35, 'mem.m2':.25, 'mem.m4':.25, 'mem.m3':.15, 'at.nback':0 } },
  { id:'S2', name:'Aritmética numérica y de rumbos', head:false, w:{ 'mm.single':.5, 'rad.arith':.25, 'at.calc':.15, 'sim.num':.10 } },
  { id:'S3', name:'Dirección (izquierda/derecha)', head:false, w:{ 'at.lr':.6, 'rad.arith':.2, 'sp.shape2d':.2 } },
  { id:'S4', name:'Vigilancia y resistencia', head:false, w:{ 'mem.m5':.5, 'sim.alert':.2, 'endur':.3 } },
  { id:'S5', name:'Razonamiento abstracto', head:false, w:{ 'mat.matrix':.2, 'mat.series':.2, 'mat.analogy':.2, 'mat.odd':.2, 'mat.logic':.2, 'mat.mixed':.2 } }
];
const ABIL = {}; ABILITIES.forEach(function(a){ ABIL[a.id] = a; });
const MODMAP = {};

      const m = mergeRecords(state.imported, c.records); state.imported = m.records;
      const rj = {}; c.rejected.forEach(function(r){ rj[r] = (rj[r] || 0) + 1; });
      msg = name + ': CSV, ' + m.added + ' sesiones nuevas, ' + m.dup + ' duplicadas omitidas' + (c.rejected.length ? ', ' + c.rejected.length + ' filas rechazadas (' + Object.keys(rj).slice(0, 3).join('; ') + ')' : '') + '.';
    } else return name + ': no reconocido (se esperaba el CSV estándar de diez columnas).';
  }
  state.importLog.push(name + ' ' + fdate(NOW())); state.importLog = state.importLog.slice(-20);
  saveState();
  return msg;
}
function guessGame(first, hint){
  if ('aciertos' in first) return 'atc_entrenador_v1';
  if ('ok' in first && 'lvl' in first) return 'atc_mentalmath_v1';
  if ('losses' in first && 'seed' in first) return 'atc_sectorsim_v1';
  if ('within15' in first) return 'atc_spatial_v1';
  if ('moduleKey' in first) return 'atc_memattn_v1';
  if ('rate' in first && 'replays' in first) return 'atc_listening_v1';
  if ('hinted' in first && 'valid' in first) return 'atc_radar_v2';
  if (/Matrices|Logic|l.gicas|series|Analog|Odd|distinto|intruso|Abstract|abstracto/i.test(first.module || '')) return 'atc_matrices_v1';
  return hint;
}
function handleFiles(files){
  const list = Array.prototype.slice.call(files || []);
  if (!list.length) return Promise.resolve();
  const msgs = [];
  return Promise.all(list.map(function(f){ return f.text().then(function(t){ msgs.push(importText(f.name, t)); }, function(){ msgs.push(f.name + ': no se pudo leer'); }); })).then(function(){
    recompute(); renderAll();
    const el = $('impmsg'); if (el) el.innerHTML = msgs.map(esc).join('<br>');
    window.__lastImport = msgs;
  });
}
function renderBanners(now){
  const b = [];
  if (!storeOk) b.push('<div class="banner err"><b>Almacenamiento bloqueado</b> Exporta antes de cerrar.</div>');
  Object.keys(HEALTH).forEach(function(k){ if (HEALTH[k].found && !HEALTH[k].ok) b.push('<div class="banner err"><b>No se pudo leer el historial de ' + esc(HEALTH[k].name) + '</b> ' + esc(HEALTH[k].error) + '</div>'); });
  if (APTMOCK.found && !APTMOCK.ok) b.push('<div class="banner err"><b>No se pudo leer el historial de ' + esc(APTMOCK.name) + '</b> ' + esc(APTMOCK.error) + '</div>');
  const anyFound = Object.keys(HEALTH).some(function(k){ return HEALTH[k].found; });
  if (!anyFound && !state.imported.length) b.push('<div class="banner"><b>No hay historial de juegos</b></div>');
  if (ALL.length && (!state.lastBackup || now - state.lastBackup > 7 * DAY)) b.push('<div class="banner"><b>Última copia: ' + (state.lastBackup ? ago(state.lastBackup, now) : 'nunca') + '</b><button class="btn small" data-goto="data">' + ic('download') + 'Hacer copia</button></div>');
  $('banners').innerHTML = b.join('');
  Array.prototype.forEach.call($('banners').querySelectorAll('[data-goto]'), function(x){ x.addEventListener('click', function(){ curTab = 'data'; renderTabs(); renderAll(); }); });
}
function renderAll(){
  const now = NOW();
  $('sub').textContent = new Date(now).toDateString();
  const last = ALL.length ? ALL[ALL.length - 1].ts : null;
  $('topchips').innerHTML = ALL.length + ' sesiones' + (last ? ' &middot; última ' + ago(last, now) : '');
  renderBanners(now);
  const rd = renderHero(now);
  renderOverviewRest(now, rd);
  renderTrends(now); renderEndurance(now); renderMaxLoad(now); renderData(now);
}
function initDrop(){
  let depth = 0;
  window.addEventListener('dragenter', function(e){ e.preventDefault(); depth++; const d = $('drop'); if (d) d.classList.add('over'); });
  window.addEventListener('dragleave', function(){ depth = Math.max(0, depth - 1); if (!depth){ const d = $('drop'); if (d) d.classList.remove('over'); } });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); depth = 0; const d = $('drop'); if (d) d.classList.remove('over'); if (curTab !== 'data'){ curTab = 'data'; renderTabs(); } handleFiles(e.dataTransfer && e.dataTransfer.files); });
  $('filepick').addEventListener('change', function(e){ handleFiles(e.target.files); e.target.value = ''; });
}
function init(){
  loadState();
  try { const t = sessionStorage.getItem('atc_dash_tab'); if (t && TABS.some(function(x){ return x[0] === t; })) curTab = t; } catch (e) {}
  recompute(); renderTabs(); renderAll(); initDrop();
  window.addEventListener('storage', function(e){ if (e.key && (GAMES[e.key] || e.key === APTMOCK_KEY)){ recompute(); renderAll(); } });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ recompute(); renderAll(); } });
  window.App = { recompute:recompute, renderAll:renderAll, handleFiles:handleFiles, importText:importText, get all(){ return ALL; }, get model(){ return MODEL; }, get state(){ return state; }, get health(){ return HEALTH; }, get aptmock(){ return APTMOCK; }, targets:function(){ return targetRows(ALL, APTMOCK.list, NOW()); } };
}
if (typeof document !== 'undefined' && document.getElementById('app')) init();
