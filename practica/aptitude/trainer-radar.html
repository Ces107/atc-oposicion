<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar: entrenador</title>

<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onacc:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style",serif; --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a6c8f0; --onacc:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
.top{display:flex;align-items:center;gap:10px;margin:0 auto;padding:14px 16px 10px}
.top .logo{width:30px;height:30px;color:var(--accent);flex:none}
.top .brand{font:700 20px/1 var(--serif);letter-spacing:.01em}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.logo{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 28px/1.2 var(--serif);margin:.3em 0 .5em}
h2{font:700 20px/1.3 var(--serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:1.6em 0 .6em}
h3{font:700 17px var(--serif);margin:1em 0 .3em}
p{margin:.4rem 0}
.soft{color:var(--muted)} .small{font-size:14px}
.good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onacc)}
.btn.primary:hover{background:var(--accent-h);color:var(--onacc)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.4;cursor:default}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;margin-bottom:6px;min-height:40px}
.link:hover{color:var(--accent-h);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;width:100%;max-width:420px}
input[type=range]{width:100%;max-width:420px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px;margin-right:8px}
label.lb{display:block;margin:1rem 0 .3rem;font-weight:600}
label.lb.inline{font-weight:400}
kbd,.key{font:12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:2px 6px;background:var(--surface);color:var(--muted);display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted);font-size:15px;padding:6px 0;border-bottom:1px solid var(--rule)}
.head b{color:var(--text)}
.head .ic{margin-right:4px}
.bar{height:3px;background:var(--rule);margin:0 0 12px}
.bar>div{height:100%;background:var(--accent);width:0}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.fig{padding:10px 26px 10px 0}
.fig b{display:block;font:700 28px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.tbl,.tbl-box,.tab-box,.tabla-caja{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--text);padding:6px 12px 6px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
.list{border-top:1px solid var(--text);margin:8px 0 16px}
.card{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;cursor:pointer;color:var(--text)}
.card:hover{background:var(--stripe)}
.card .ic{width:30px;height:30px;color:var(--accent);stroke-width:1.5}
.card .nm{display:block;font:700 20px/1.2 var(--serif)}
.card .dt{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hintbox{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
@media (max-width:640px){.fig{padding-right:18px}.fig b{font-size:24px}h1{font-size:25px}}

#app{max-width:1000px;margin:0 auto;padding:8px 16px 56px}
.top{max-width:1000px}
.question{font:600 38px/1.25 var(--serif);text-align:center;margin:28px 0;font-variant-numeric:tabular-nums}
.entry{font:600 30px var(--sans);text-align:center;max-width:280px;margin:0 auto;display:block}
.fb{min-height:2.2rem;text-align:center;font-size:18px;margin-top:10px}
.fbbig{font-size:30px;font-weight:700;min-height:44px}
.thin{font-size:14px;color:var(--muted)}
.slider-row{display:grid;grid-template-columns:1fr 64px;gap:2px 10px;align-items:center;max-width:420px;margin-top:12px}
.slider-row output{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;max-width:700px;height:auto;margin:0 auto;background:#09110c;border:1px solid #2b3a30;border-radius:0}
.radar-wrap{display:grid;grid-template-columns:min(700px,max(380px,calc(100vh - 150px))) minmax(210px,1fr);gap:20px;align-items:start;margin-top:12px}
@media (max-width:900px){.radar-wrap{grid-template-columns:1fr}}
tr.conf td{color:var(--err);font-weight:600}
.rules{display:flex;flex-wrap:wrap;border-top:1px solid var(--text);border-bottom:1px solid var(--rule);margin:14px 0}
.rules:empty{border:0;margin:0}
.rule .key{font-size:16px;padding:3px 9px}
.rule{display:flex;align-items:center;gap:8px;padding:9px 22px 9px 0;font-size:17px}
.rule svg{display:block}
.key.hl{background:var(--warn);color:#fff;border-color:var(--warn)}
.stage{display:flex;justify-content:center;align-items:center;height:210px;margin-top:10px}
.stage.rev{outline:4px solid var(--warn);outline-offset:-4px}
.rev-sample{display:inline-block;width:24px;height:16px;border:3px solid var(--warn);vertical-align:-3px}
.tbar{height:3px;background:var(--rule);margin:6px 0 4px}
.tbar>div{height:100%;width:100%;background:var(--accent);transform-origin:left center}
.keys{display:flex;gap:10px;justify-content:center;margin-top:8px}
.keys .key{min-width:60px;min-height:44px;line-height:28px;text-align:center;font-size:20px;padding:8px 10px;cursor:pointer;user-select:none}
.flash-bad{color:var(--err)} .flash-good{color:var(--ok)}
.mon{display:inline-block;padding:1px 10px;border:1px solid var(--rule);color:var(--muted)}
.mon.sig{background:var(--warn);color:#fff;border-color:var(--warn)}
.rec{font-weight:700;color:var(--ok);margin:8px 0}
.rec .ic{margin-right:6px}
td.k{font-weight:700;padding-right:24px}
h2.ttl{font:700 28px/1.2 var(--serif);border:0;padding:0;margin:.3em 0 .5em}
@media (max-width:640px){h2.ttl{font-size:25px}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){.question{font-size:28px}}

<script>
// ==== PURE LOGIC START ====
// Everything between the START and END markers has no DOM dependency and is executed by node for testing (see the README).
// Conventions: x = east (NM), y = north (NM); heading 0 = north, clockwise; speed in kt; flight level FL in hundreds of ft;
// times in minutes. Separation minimum: 5 NM lateral OR 1000 ft vertical. Loss = lateral < 5 NM AND vertical < 1000 ft
// (exactly 5.0 NM or exactly 1000 ft counts as separated).
const SEP_NM = 5, SEP_FT = 1000, MIN_ACCURACY = 96;
const LEVEL_NAMES = ['Calentamiento', 'Fácil', 'Constante', 'Estándar', 'Competitivo', 'Difícil', 'Élite', 'Extremo', 'Sobrehumano', 'Imposible'];
const HINT_MAX = [3, 3, 3, 3, 2, 1, 0, 0, 0, 0]; // highest hint tier available at each level (none from level 7 up)

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randInt(rnd, a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function pick(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(rnd, arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function fmt(x, d){
  if (x === null || x === undefined || isNaN(x)) return '—';
  return Number(x).toFixed(d === undefined ? 1 : d);
}
function mod360(x){ return ((x % 360) + 360) % 360; }
function pad3(n){ n = Math.round(n); return (n < 100 ? (n < 10 ? '00' : '0') : '') + n; }
function clamp(x, a, b){ return Math.min(b, Math.max(a, x)); }

/* ---- 0. Difficulty ladder: 10 manual levels per module, plus custom parameters ---- */
// conf: n aircraft | window minutes | limit = seconds per picture (0 = untimed) | pictures | traps = minimum number of trap pairs
//       (a pair saved only by 1000 ft vertical, or a lateral near miss of 6-9 NM) | exposure = seconds the picture stays visible (0 = always)
const CONF_LEVELS = [
  { n: 2, window: 5,  limit: 0,  pictures: 8,  traps: 0, exposure: 0 },
  { n: 3, window: 6,  limit: 90, pictures: 8,  traps: 0, exposure: 0 },
  { n: 3, window: 8,  limit: 60, pictures: 10, traps: 1, exposure: 0 },
  { n: 4, window: 8,  limit: 50, pictures: 10, traps: 1, exposure: 0 },
  { n: 4, window: 10, limit: 40, pictures: 10, traps: 2, exposure: 0 },
  { n: 5, window: 10, limit: 35, pictures: 12, traps: 2, exposure: 0 },
  { n: 6, window: 10, limit: 28, pictures: 12, traps: 3, exposure: 0 },
  { n: 6, window: 12, limit: 20, pictures: 12, traps: 4, exposure: 0 },
  { n: 6, window: 12, limit: 14, pictures: 12, traps: 5, exposure: 10 },
  { n: 6, window: 15, limit: 9,  pictures: 15, traps: 6, exposure: 6 }
];
// arith: step = granularity of angles (10, 5 or 1 degree) | kinds | limit = seconds per question (0 = untimed) | items |
//        comboShare = share of multi-step questions | comboSteps = steps in those | tdsWide = harder time/distance/speed numbers | dual = monitor task
const ARITH_LEVELS = [
  { step: 10, kinds: ['recip', 'turn'], limit: 0, items: 15, comboShare: 0, comboSteps: 2, tdsWide: false, dual: false },
  { step: 10, kinds: ['recip', 'turn'], limit: 35, items: 15, comboShare: 0, comboSteps: 2, tdsWide: false, dual: false },
  { step: 10, kinds: ['recip', 'turn', 'wind'], limit: 25, items: 20, comboShare: 0, comboSteps: 2, tdsWide: false, dual: false },
  { step: 5,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 18, items: 20, comboShare: 0, comboSteps: 2, tdsWide: false, dual: false },
  { step: 5,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 12, items: 20, comboShare: 0, comboSteps: 2, tdsWide: false, dual: false },
  { step: 5,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 7, items: 25, comboShare: 0.15, comboSteps: 2, tdsWide: true, dual: false },
  { step: 1,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 6, items: 25, comboShare: 0.3, comboSteps: 2, tdsWide: true, dual: false },
  { step: 1,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 5, items: 25, comboShare: 0.5, comboSteps: 3, tdsWide: true, dual: false },
  { step: 1,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 4, items: 30, comboShare: 0.8, comboSteps: 3, tdsWide: true, dual: true },
  { step: 1,  kinds: ['recip', 'turn', 'wind', 'drift', 'tds'], limit: 3, items: 30, comboShare: 1, comboSteps: 3, tdsWide: true, dual: true }
];
// cat: rule = rule-set complexity 1-4 | speed = seconds allowed per object | per = objects per round | rounds | reversal = share of objects
//      shown in an orange frame (answer with the MIRRORED key) | dual = monitor task | rulesVisible = rule bar stays on screen
const CAT_LEVELS = [
  { rule: 1, speed: 5,   per: 10, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 1, speed: 4,   per: 12, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 2, speed: 3.5, per: 15, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 2, speed: 3,   per: 15, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 3, speed: 2.2, per: 15, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 4, speed: 1.8, per: 20, rounds: 2, reversal: 0,    dual: false, rulesVisible: true },
  { rule: 4, speed: 1.5, per: 20, rounds: 2, reversal: 0.25, dual: false, rulesVisible: false },
  { rule: 4, speed: 1.2, per: 20, rounds: 3, reversal: 0.3,  dual: false, rulesVisible: false },
  { rule: 4, speed: 1.0, per: 25, rounds: 3, reversal: 0.4,  dual: true,  rulesVisible: false },
  { rule: 4, speed: 0.7, per: 30, rounds: 3, reversal: 0.5,  dual: true,  rulesVisible: false }
];
const LEVEL_TABLES = { conf: CONF_LEVELS, arith: ARITH_LEVELS, cat: CAT_LEVELS };
function paramsForLevel(module, level){
  const t = LEVEL_TABLES[module], L = clamp(Math.round(level), 1, 10);
  return Object.assign({ level: L, maxHint: HINT_MAX[L - 1] }, t[L - 1]);
}
// Custom parameters come from sliders and are clamped to safe ranges. v = raw slider values.
function customParams(module, v){
  const num = function(x, a, b, d){ x = parseFloat(x); return isNaN(x) ? d : clamp(x, a, b); };
  const p = { level: 'Custom', maxHint: Math.round(num(v.hint, 0, 3, 3)) };
  if (module === 'conf') return Object.assign(p, { n: Math.round(num(v.n, 2, 6, 3)), window: Math.round(num(v.window, 4, 15, 8)), limit: Math.round(num(v.limit, 0, 120, 0)),
    pictures: Math.round(num(v.pictures, 3, 20, 8)), traps: Math.round(num(v.traps, 0, 6, 0)), exposure: Math.round(num(v.exposure, 0, 30, 0)) });
  if (module === 'arith'){
    const step = [1, 5, 10].indexOf(parseInt(v.step, 10)) >= 0 ? parseInt(v.step, 10) : 5;
    const kinds = v.kinds && v.kinds !== 'all' ? String(v.kinds).split(',') : ['recip', 'turn', 'wind', 'drift', 'tds'];
    return Object.assign(p, { step: step, kinds: kinds, limit: Math.round(num(v.limit, 0, 30, 0)), items: Math.round(num(v.items, 5, 40, 20)),
      comboShare: num(v.comboShare, 0, 100, 0) / 100, comboSteps: Math.round(num(v.comboSteps, 2, 3, 2)), tdsWide: !!v.tdsWide, dual: !!v.dual });
  }
  return Object.assign(p, { rule: Math.round(num(v.rule, 1, 4, 2)), speed: Math.round(num(v.speed, 0.5, 8, 3) * 10) / 10, per: Math.round(num(v.per, 5, 40, 15)),
    rounds: Math.round(num(v.rounds, 1, 4, 2)), reversal: num(v.reversal, 0, 60, 0) / 100, dual: !!v.dual, rulesVisible: p.maxHint >= 1 || !!v.rulesVisible });
}
// Adaptive / progression rule. One state per module: {level, streak, fails, unlocked}.
// Up after THREE consecutive valid sessions (>= 96 %) played at the current level; down after TWO consecutive failures (< 96 %).
// Sessions that used hints, or were played at another level, or in Custom mode, never change the state.
function newProgress(){ return { level: 1, streak: 0, fails: 0, unlocked: 1 }; }
function advanceLevel(st, played, accuracy, hinted){
  const s = { level: st.level, streak: st.streak, fails: st.fails, unlocked: st.unlocked };
  if (hinted || played !== s.level) return s;
  if (accuracy >= MIN_ACCURACY){
    s.streak++; s.fails = 0;
    if (s.streak >= 3){
      if (s.level < 10){ s.level++; s.streak = 0; s.unlocked = Math.max(s.unlocked, s.level); } else s.streak = 3;
    }
  } else {
    s.streak = 0; s.fails++;
    if (s.fails >= 2){ if (s.level > 1) s.level--; s.fails = 0; }
  }
  return s;
}
// Wave 5 (U8 subset): pooled + thirds-aware promotion, layered on top of advanceLevel (which stays unchanged: streak of 3 valid sessions,
// two failures go down). sess = { n, c, t3n, t3c } of one hint-free session played at the current level (t3* = last third, 0 if no thirds).
// - PROMOTE (pooled): the last 2, 3 or 4 sessions at this level (since the last level change) pool to >= 60 items with pooled accuracy >= 96 %,
//   no single session below 90 %, and (when thirds exist in all of them) pooled last-third accuracy >= 90 %.
// - The classic 3-valid-in-a-row promotion still works but is cancelled when the last-third accuracy of those sessions is below 90 % (fading run).
// Anti-acceleration is preserved: pooled accuracy is always >= 96 %, hinted / other-level / Custom sessions change nothing.
// Returns a state {level, streak, fails, unlocked, pool, why}; why = 'pooled' | 'gated' | ''.
const POOL_MIN_ITEMS = 60, POOL_MIN_SESSION = 90, POOL_LAST_THIRD = 90;
function poolQualifies(pool){
  for (let k = 2; k <= Math.min(4, pool.length); k++){
    const w = pool.slice(-k);
    let n = 0, c = 0, t3n = 0, t3c = 0, allT = true, minAcc = 100;
    w.forEach(function(x){ n += x.n; c += x.c; t3n += x.t3n; t3c += x.t3c; if (!(x.t3n > 0)) allT = false; minAcc = Math.min(minAcc, x.n ? x.c / x.n * 100 : 0); });

  if (level === 4) return 'El nivel 4 se acerca al objetivo: el nivel 5 es lo que un candidato bien preparado debe dominar para la Fase 2.';

/* ---- 1. Geometry ---- */
function velocity(ac){
  const r = ac.hdg * Math.PI / 180;
  return { x: ac.spd / 60 * Math.sin(r), y: ac.spd / 60 * Math.cos(r) }; // NM per minute
}
function position(ac, t){
  const v = velocity(ac);
  return { x: ac.x + v.x * t, y: ac.y + v.y * t };
}
// Full analysis of one pair over [0, windowMin]. a, b = {x,y,hdg,spd,fl}.
function pairGeometry(a, b, windowMin){
  const va = velocity(a), vb = velocity(b);
  const rx = b.x - a.x, ry = b.y - a.y, vx = vb.x - va.x, vy = vb.y - va.y;
  const vv = vx * vx + vy * vy, rv = rx * vx + ry * vy, rr = rx * rx + ry * ry;
  const still = vv < 1e-9;
  const tcpaRaw = still ? 0 : -rv / vv;                     // time of closest approach, may be < 0 (already diverging)
  const tcpa = Math.max(0, tcpaRaw);                         // future CPA, unbounded
  const cpa = still ? Math.sqrt(rr) : Math.sqrt(Math.max(0, rr + 2 * rv * tcpa + vv * tcpa * tcpa));
  const tw = Math.min(windowMin, tcpa);                      // time of closest approach inside the window
  const dWin = Math.sqrt(Math.max(0, rr + 2 * rv * tw + vv * tw * tw));
  const dz = Math.abs(a.fl - b.fl) * 100;
  const vertLoss = dz < SEP_FT;
  let lossFrom = null, lossTo = null;
  if (still){ if (rr < SEP_NM * SEP_NM){ lossFrom = 0; lossTo = windowMin; } }
  else {
    const disc = rv * rv - vv * (rr - SEP_NM * SEP_NM);
    if (disc > 0){
      const s = Math.sqrt(disc), t1 = (-rv - s) / vv, t2 = (-rv + s) / vv;
      const f = Math.max(0, t1), e = Math.min(windowMin, t2);
      if (f < e){ lossFrom = f; lossTo = e; }
    }
  }
  const lateralLoss = lossFrom !== null;
  const dist0 = Math.sqrt(rr);
  const bearingRate = rr > 1e-9 ? (rx * vy - ry * vx) / rr * 180 / Math.PI : 0; // deg/min, bearing from a to b
  const rangeRate = dist0 > 1e-9 ? rv / dist0 : 0;                              // NM/min, negative = closing
  const cpaCross = still ? dist0 : Math.abs(rx * vy - ry * vx) / Math.sqrt(vv); // |r x v| / |v| = distance at CPA
  return { dist0: dist0, tcpaRaw: tcpaRaw, tcpa: tcpa, cpa: cpa, cpaCross: cpaCross, tw: tw, dWin: dWin, dz: dz,
    vertLoss: vertLoss, lateralLoss: lateralLoss, lossFrom: lossFrom, lossTo: lossTo,
    conflict: vertLoss && lateralLoss, bearingRate: bearingRate, rangeRate: rangeRate,
    cbdr: rangeRate < -1e-9 && Math.abs(bearingRate) < 0.2 };
}
const LETTERS = 'ABCDEF';
function analyze(acs, windowMin){
  const pairs = [];
  for (let i = 0; i < acs.length; i++) for (let j = i + 1; j < acs.length; j++){
    const g = pairGeometry(acs[i], acs[j], windowMin);
    g.i = i; g.j = j; g.key = LETTERS[i] + LETTERS[j];
    g.trap = isTrap(g);
    pairs.push(g);
  }
  return pairs;
}
// A pair is "clear" if the answer cannot hinge on rounding: a vertically-eroded pair must have its closest approach
// inside the window either < 4 NM or > 6 NM, and no pair may start closer than 8 NM (nobody is already in loss).
function pairIsClear(g){
  if (g.dist0 < 8) return false;
  if (g.vertLoss && g.dWin >= 4 && g.dWin <= 6) return false;
  return true;
}
// Trap pair (distractor): would be a conflict but for 1000 ft or more of vertical separation, or a lateral near miss of 6 to 9 NM.
function isTrap(g){
  return (!g.vertLoss && g.lateralLoss) || (g.vertLoss && !g.lateralLoss && g.dWin > 6 && g.dWin < 9);
}

/* ---- 2. Scenario generator ---- */
function makeScenario(rnd, P){
  const n = P.n, windowMin = P.window, flBase = [240, 260, 280, 300, 320, 340, 360, 380];
  const nPairs = n * (n - 1) / 2, minTraps = Math.min(P.traps || 0, nPairs);
  const designProb = Math.min(0.95, 0.5 + 0.08 * (P.traps || 0)), maxConf = Math.max(1, Math.ceil(nPairs / 2));
  for (let attempt = 0; attempt < 60000; attempt++){
    const acs = [];
    for (let i = 0; i < n; i++){
      let ac = null;
      if (i > 0 && rnd() < designProb){
        const j = randInt(rnd, 0, i - 1), other = acs[j];
        const tm = 2 + rnd() * (windowMin - 2.5);
        const type = pick(rnd, ['conflict', 'conflict', 'vsave', 'near']);
        const hdg = mod360(other.hdg + pick(rnd, [-1, 1]) * randInt(rnd, 30, 150));
        const spd = randInt(rnd, 20, 48) * 10;
        const off = type === 'near' ? 6.5 + rnd() * 2.5 : rnd() * 3, ang = rnd() * 2 * Math.PI;
        const om = position(other, tm);
        const mx = om.x + off * Math.cos(ang), my = om.y + off * Math.sin(ang);
        const hr = hdg * Math.PI / 180;
        let fl;
        if (type === 'conflict') fl = other.fl + pick(rnd, [0, 0, 0, 5, -5]);
        else if (type === 'vsave') fl = other.fl + pick(rnd, [10, -10, 20, -20]);
        else fl = other.fl + pick(rnd, [0, 0, 5, -5]);
        ac = { x: mx - spd / 60 * Math.sin(hr) * tm, y: my - spd / 60 * Math.cos(hr) * tm, hdg: hdg, spd: spd, fl: fl };
      } else {
        ac = { x: (rnd() * 2 - 1) * 40, y: (rnd() * 2 - 1) * 40, hdg: randInt(rnd, 0, 359), spd: randInt(rnd, 20, 48) * 10, fl: pick(rnd, flBase) };
      }
      ac.x = Math.round(ac.x); ac.y = Math.round(ac.y);
      ac.hdg = Math.round(ac.hdg / 5) * 5 % 360; ac.spd = Math.round(ac.spd / 10) * 10;
      if (Math.abs(ac.x) > 45 || Math.abs(ac.y) > 45 || ac.fl < 100 || ac.fl > 400) { acs.length = 0; break; }
      acs.push(ac);
    }
    if (acs.length !== n) continue;
    const pairs = analyze(acs, windowMin);
    if (!pairs.every(pairIsClear)) continue;
    const conflicts = pairs.filter(function(p){ return p.conflict; }).length;
    const traps = pairs.filter(function(p){ return p.trap; }).length;
    if (conflicts > maxConf || traps < minTraps) continue;
    if (n >= 2 && conflicts === 0 && rnd() < 0.7) continue; // "no conflict" happens, but rarely
    return { aircraft: acs, windowMin: windowMin, pairs: pairs };
  }
  return null;
}
// Parses "AC BD", "ac,bd", "0", "none", "-" -> sorted unique keys, or null if invalid. n = number of aircraft.
function parsePairs(text, n){
  const t = String(text || '').trim().toUpperCase();
  if (t === '0' || t === 'NONE' || t === '-') return [];
  if (!t) return null;
  const s = t.replace(/[^A-Z]/g, '');
  if (!s.length || s.length % 2) return null;
  const out = {};
  for (let k = 0; k < s.length; k += 2){
    const a = LETTERS.indexOf(s[k]), b = LETTERS.indexOf(s[k + 1]);
    if (a < 0 || b < 0 || a >= n || b >= n || a === b) return null;
    out[LETTERS[Math.min(a, b)] + LETTERS[Math.max(a, b)]] = 1;
  }
  return Object.keys(out).sort();
}
function scoreConflicts(scenario, given){
  const exp = scenario.pairs.filter(function(p){ return p.conflict; }).map(function(p){ return p.key; }).sort();
  return { expected: exp, correct: exp.length === given.length && exp.every(function(k, i){ return k === given[i]; }) };
}
// Hint tiers for a picture: 1 nudge, 2 method, 3 full solution (the picture then counts as blank).
function conflictHint(sc, tier){
  const conf = sc.pairs.filter(function(p){ return p.conflict; }), cand = sc.pairs.filter(function(p){ return p.vertLoss; });
  if (tier === 1) return (conf.length === 1 ? 'Hay 1 par en conflicto' : 'Hay ' + conf.length + ' pares en conflicto') + ' en esta imagen' + (conf.length ? '.' : ' (escribe 0).');
  if (tier === 2) return 'Método: descarta primero todo par que ya tenga 1000 ft o más de separación vertical. Candidatos restantes: ' +
    (cand.length ? cand.map(function(p){ return p.key + ' (demora ' + fmt(p.bearingRate, 2) + '°/min, ' + (p.rangeRate < 0 ? 'se acercan' : 'se alejan') + ')'; }).join('; ') : 'ninguno') +
    '. Un cambio pequeño de demora mientras se acercan (CBDR) implica un CPA pequeño.';
  return 'Solución: ' + (conf.length ? conf.map(function(p){ return p.key + ' (CPA ' + fmt(p.cpa, 1) + ' NM, pérdida desde el min ' + fmt(p.lossFrom, 1) + ')'; }).join('; ') : 'sin conflicto (escribe 0)') + '.';
}

/* ---- 3. Heading and speed arithmetic ---- */
const TECH = {
  recip: 'Recíproco: suma 200 y resta 20 (o ±180).',
  turn: 'Derecha suma grados, izquierda resta; da la vuelta en 360.',
  drift: 'Regla 1 en 60: deriva = 60 × viento cruzado / TAS; el viento por la derecha empuja la aeronave a la izquierda, así que trayectoria = rumbo − deriva (por la izquierda: +).',
  wind: 'Velocidad respecto al suelo = TAS − viento de cara, o TAS + viento de cola.',
  tds: 'NM por minuto = velocidad respecto al suelo / 60 (360 kt = 6 NM/min); tiempo = distancia / (GS/60).',
  combo: 'Hazlo paso a paso y anota el rumbo tras cada paso.'
};
function driftChoices(tas){
  const opts = [];
  for (let xw = 5; xw <= 60; xw++){ const d = 60 * xw / tas; if (Number.isInteger(d) && d >= 2 && d <= 12) opts.push(xw); }
  return opts;
}
function applyStep(h, s){

}
function stepText(s){
  if (s.op === 'turn') return 'vira a la ' + (s.right ? 'DERECHA ' : 'IZQUIERDA ') + s.deg + '°';
  if (s.op === 'recip') return 'invierte el rumbo (recíproco)';
  return 'viento cruzado por la ' + (s.right ? 'DERECHA' : 'IZQUIERDA') + ' de ' + s.xw + ' kt con TAS ' + s.tas + ' (trayectoria por 1 en 60)';
}
function makeArith(rnd, P){

    const h = angle(10, 350);
    return out({ text: 'Rumbo recíproco de ' + pad3(h) + '°', answer: mod360(h + 180) || 360, heading: true, unit: '°',
      spec: { h: h }, solution: pad3(h) + ' ' + (h >= 180 ? '− 180' : '+ 180') + ' = ' + pad3(mod360(h + 180)) });
  }

      answer: a, heading: true, unit: '°', spec: { h: h, tas: tas, xw: xw, right: right },

  }

    const tas = randInt(rnd, 9, 48) * 10, w = randInt(rnd, 1, 8) * 10, head = rnd() < 0.5, a = head ? tas - w : tas + w;
    return out({ text: 'TAS ' + tas + ' kt, ' + w + ' kt de viento ' + (head ? 'DE CARA' : 'DE COLA') + '. ¿Velocidad respecto al suelo (GS)?', answer: a, heading: false, unit: 'kt',

  if (v === 'dist') return out({ text: min + ' min a ' + gs + ' kt de velocidad respecto al suelo. ¿Distancia en NM?', answer: d, heading: false, unit: 'NM', spec: { gs: gs, min: min, d: d, v: v }, solution: base + '; × ' + min + ' min = ' + d + ' NM' });
  return out({ text: d + ' NM recorridas en ' + min + ' min. ¿Velocidad respecto al suelo en kt?', answer: gs, heading: false, unit: 'kt', spec: { gs: gs, min: min, d: d, v: v }, solution: d + ' / ' + min + ' = ' + fmt(d / min, 2).replace(/\.?0+$/, '') + ' NM/min × 60 = ' + gs + ' kt' });

// Independent evaluation of an item's answer from its spec (used by the tests, and a guard for the generator).
function arithFromSpec(it){
  const s = it.spec;

  if (it.kind === 'turn') return mod360(s.right ? s.h + s.t : s.h - s.t) || 360;
  if (it.kind === 'drift') return mod360(s.right ? s.h - 60 * s.xw / s.tas : s.h + 60 * s.xw / s.tas) || 360;
  if (it.kind === 'wind') return s.head ? s.tas - s.w : s.tas + s.w;
  if (it.kind === 'combo'){
    let h = s.h0;
    s.steps.forEach(function(x){
      if (x.op === 'turn') h += x.right ? x.deg : -x.deg;
      else if (x.op === 'recip') h += 180;
      else h += x.right ? -(60 * x.xw / x.tas) : 60 * x.xw / x.tas;
      h = ((h % 360) + 360) % 360;
    });
    return h || 360;
  }

function parseNumber(text){
  const t = String(text || '').trim().replace(',', '.');

  return parseFloat(t);
}
function checkArith(item, text){

function arithHint(item, tier){
  if (tier === 1) return 'Técnica: ' + item.tech;
  if (tier === 2) return 'Método: ' + item.tech + ' Cifras: ' + item.solution.replace(/[\d.]+\s*$/, '…');

}

/* ---- 4. Fast categorization (FEAST-style) ---- */
const COLORS = ['red', 'blue', 'green', 'yellow'];
const SHAPES = ['circle', 'square', 'triangle', 'diamond'];
// Display names (Spanish); the internal values above are never shown or stored.
const VALUE_ES = { red: 'rojo', blue: 'azul', green: 'verde', yellow: 'amarillo', circle: 'círculo', square: 'cuadrado', triangle: 'triángulo', diamond: 'rombo' };
function valueEs(v){ return VALUE_ES[v] || v; }
function allObjects(){
  const o = [];
  COLORS.forEach(function(c){ SHAPES.forEach(function(s){ o.push({ color: c, shape: s }); }); });
  return o;
}
function predMatches(pred, obj){ return pred.values.indexOf(obj[pred.attr]) >= 0; }
// keysMatching returns the list of keys whose rule fires for the object. An unambiguous object fires exactly one.
function keysMatching(rule, obj){
  return rule.keys.filter(function(k){ return predMatches(k.pred, obj); }).map(function(k){ return k.key; });
}
// level 1: 2 keys, colours only | 2: 2 keys, one colour vs one shape | 3: 4 keys, colours only | 4: 4 keys, 2 colours + 2 shapes
function makeRuleSet(rnd, level){
  const c = shuffle(rnd, COLORS), s = shuffle(rnd, SHAPES);
  let keys;
  if (level <= 1) keys = [['F', 'left', 'color', [c[0], c[1]]], ['J', 'right', 'color', [c[2], c[3]]]];
  else if (level === 2) keys = [['F', 'left', 'color', [c[0]]], ['J', 'right', 'shape', [s[0]]]];
  else if (level === 3) keys = [['D', 'far left', 'color', [c[0]]], ['F', 'left', 'color', [c[1]]], ['J', 'right', 'color', [c[2]]], ['K', 'far right', 'color', [c[3]]]];
  else keys = [['D', 'far left', 'color', [c[0]]], ['F', 'left', 'color', [c[1]]], ['J', 'right', 'shape', [s[0]]], ['K', 'far right', 'shape', [s[1]]]];
  const rule = { level: level, keys: keys.map(function(k){ return { key: k[0], side: k[1], pred: { attr: k[2], values: k[3] } }; }) };
  // Pool = objects that fire EXACTLY one key. Everything drawn later comes from this pool, so no item is ambiguous or unassigned.
  rule.pool = allObjects().filter(function(o){ return keysMatching(rule, o).length === 1; });
  rule.byKey = {};
  rule.keys.forEach(function(k){ rule.byKey[k.key] = rule.pool.filter(function(o){ return keysMatching(rule, o)[0] === k.key; }); });
  return rule;
}
function ruleIsUsable(rule){
  return rule.keys.every(function(k){ return rule.byKey[k.key].length >= 2; });
}
function ruleText(rule){
  return rule.keys.map(function(k){
    return k.pred.values.map(valueEs).join(' o ').toUpperCase() + (k.pred.attr === 'shape' ? ' (forma)' : '') + ' → ' + k.key + ' (' + ({ 'far left': 'extremo izquierdo', left: 'izquierda', right: 'derecha', 'far right': 'extremo derecho' }[k.side] || k.side) + ')';
  });
}
// Mirror mapping used by the orange frame: first key <-> last key, second <-> second-to-last (F<->J, D<->K). A bijection, so never ambiguous.
function mirrorKey(rule, key){
  const i = rule.keys.findIndex(function(k){ return k.key === key; });
  return rule.keys[rule.keys.length - 1 - i].key;
}
function mirrorText(rule){
  return rule.keys.length === 2 ? 'F ↔ J' : 'D ↔ K, F ↔ J';
}
function nextItem(rnd, rule, prev, reversal){
  let it = null;
  for (let t = 0; t < 50 && !it; t++){
    const k = pick(rnd, rule.keys).key, o = pick(rnd, rule.byKey[k]);
    if (!prev || o.color !== prev.obj.color || o.shape !== prev.obj.shape) it = { obj: o, key: k };
  }
  if (!it){ const k2 = pick(rnd, rule.keys).key; it = { obj: pick(rnd, rule.byKey[k2]), key: k2 }; }
  it.reversed = !!reversal && rnd() < reversal;

/* ---- 5. Goal, records, CSV ---- */
function isValid(acc, hinted){ return acc >= MIN_ACCURACY && !hinted; }
function evaluateGoal(text, r){
  const t = String(text || '').replace(/\s+/g, ' ');
  const num = function(x){ return parseFloat(x.replace(',', '.')); };
  let res = null;
  const mp = t.match(/(\d+(?:[.,]\d+)?)\s*%/);
  if (mp) res = r.accuracy >= num(mp[1]);
  const ms = t.match(/(\d+(?:[.,]\d+)?)\s*(?:segundos|segundo|seg|seconds|second|secs|sec|s)(?![a-zA-Z])/i);
  if (ms && r.spi !== null && r.spi !== undefined){ const ok = r.spi <= num(ms[1]); res = res === null ? ok : (res && ok); }
  const ma = t.match(/(\d+)\s*(?:aciertos|acierto|correctas|correctos|correct|hits)/i);
  if (ma){ const ok = r.correct >= parseInt(ma[1], 10); res = res === null ? ok : (res && ok); }
  return res;
}
// Personal best = lowest seconds per item among valid sessions of the same module and level (Custom sessions never count).
function bestAtLevel(prev, module, level){
  const comp = prev.filter(function(x){ return x.module === module && String(x.level) === String(level) && x.valid && x.level !== 'Custom' && x.spi !== null && x.spi !== undefined; });
  if (!comp.length) return null;
  return { spi: Math.min.apply(null, comp.map(function(x){ return x.spi; })), accuracy: Math.max.apply(null, comp.map(function(x){ return x.accuracy; })), sessions: comp.length };
}
function isRecord(prev, s){
  if (!s.valid || s.level === 'Custom' || s.spi === null || s.spi === undefined) return false;
  const b = bestAtLevel(prev, s.module, s.level);
  return !!b && s.spi < b.spi;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dateES(iso){
  const d = new Date(iso);
  return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function csvField(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(sessions){
  const head = ['Date', 'Module', 'Level', 'Correct', 'Wrong', 'Blank', 'Seconds per item', 'Accuracy %', 'Goal', 'Met'];
  const rows = sessions.map(function(s){
    return [dateES(s.ts), s.module, s.level, s.correct, s.wrong, s.blank,
      (s.spi === null || s.spi === undefined) ? '' : fmt(s.spi, 2), fmt(s.accuracy, 1), s.goal,
      s.met === true ? 'Yes' : (s.met === false ? 'No' : '')].map(csvField).join(';');
  });
  return '﻿' + [head.join(';')].concat(rows).join('\r\n') + '\r\n';
}

    if (r2.level > 4) badPool++;

  // Endurance thirds (wave 5 U1)
  const t12 = atcThirds(Array.from({ length: 12 }, function(_, i){ return { ok: i < 8, blank: i === 11, sec: 2 }; }), 0);
  ok('thirds 12 items -> 4/4/4', t12 && t12.map(function(x){ return x.n; }).join() === '4,4,4' && t12[0].c === 4 && t12[1].c === 4 && t12[2].c === 0 && t12[2].b === 1 && t12[0].s === 8);
  ok('thirds <9 items -> null', atcThirds(Array.from({ length: 8 }, function(){ return { ok: true, sec: 1 }; }), 0) === null);
  ok('thirds 10 items index rule', atcThirds(Array.from({ length: 10 }, function(){ return { ok: true, sec: 1 }; }), 0).map(function(x){ return x.n; }).join() === '4,3,3');

// ---- Endurance ("thirds", wave 5 U1): identical copy in every ATC game; see coord/SCHEMA-thirds.md ----
// results = [{ok, blank, sec, t}] (optional n/c/b give weighted counts, e.g. one d2 row or one n-back stimulus).
// durationSec > 0: time thirds (group = min(2, floor(t*3/duration))); otherwise index thirds (min(2, floor(i*3/N))).
// Fewer than 9 results: null. Returns [{n,c,b,s} x3]; wrong = n - c - b.
function atcThirds(results, durationSec){
  const N = results ? results.length : 0;
  if (N < 9) return null;
  const th = [{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0},{n:0,c:0,b:0,s:0}];
  results.forEach(function(r, i){
    const g = durationSec > 0 ? Math.max(0, Math.min(2, Math.floor((r.t || 0) * 3 / durationSec))) : Math.min(2, Math.floor(i * 3 / N));
    th[g].n += r.n === undefined ? 1 : r.n;
    th[g].c += r.c === undefined ? (r.ok ? 1 : 0) : r.c;
    th[g].b += r.b === undefined ? (r.blank ? 1 : 0) : r.b;
    th[g].s += r.sec || 0;
  });
  th.forEach(function(x){ x.s = Math.round(x.s * 100) / 100; });
  return th;
}
// One result-screen line: accuracy per third and the fade (third 3 minus third 1); fade only when both thirds have n >= 8.
function atcThirdsLine(th){
  if (!th || th.length !== 3) return '';
  const acc = function(x){ return x.n > 0 ? x.c / x.n * 100 : null; };
  const a = th.map(acc);
  const txt = a.map(function(v){ return v === null ? '—' : String(Math.round(v)); }).join(' / ');
  let fade = ' (muy pocos elementos por tercio para estimar la caída)';
  if (th[0].n >= 8 && th[2].n >= 8){
    const f = Math.round(a[2]) - Math.round(a[0]);
    fade = ' → caída ' + (f > 0 ? '+' : (f < 0 ? '−' : '')) + Math.abs(f) + ' pts';
  }
  return 'Precisión por tercios: ' + txt + ' %' + fade;
}

    '<div class="tbl"><table><thead><tr><th>Módulo</th><th>Nivel</th><th>Racha</th><th>Desbloqueado</th></tr></thead><tbody>' + prog + '</tbody></table></div>' +
    '<h2>Sesiones</h2>' +
    (ses.length ? '<div class="tbl-box"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Aciertos</th><th>Fallos</th><th>En blanco</th><th>s/elemento</th><th>Precisión %</th><th>Objetivo</th><th>Cumplido</th><th>Válida</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="soft">Sin sesiones</p>') +
    '<p class="row" style="margin-top:16px"><button class="btn primary" id="csv">' + ic('download') + 'CSV</button><button class="btn danger" id="del">' + ic('trash') + 'Borrar</button><span id="conf"></span></p>');
  $('back').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    try {
      const blob = new Blob([toCSV(d.sessions)], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a'), f = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = 'radar-trainer-' + f.getFullYear() + pad2(f.getMonth() + 1) + pad2(f.getDate()) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { $('conf').innerHTML = '<span class="bad">Error</span>'; }
  });
  $('del').addEventListener('click', function(){
    $('conf').innerHTML = '<span class="warn">¿Borrar todo?</span> <button class="btn danger" id="yes">Borrar</button> <button class="btn" id="no">Cancelar</button>';
    $('no').addEventListener('click', function(){ $('conf').innerHTML = ''; });
    $('yes').addEventListener('click', function(){ memory = null; try { localStorage.removeItem(STORE_KEY); } catch (e) {} load(); save(); history(); });
  });
}

if (typeof document !== 'undefined' && document.getElementById('app')){ load(); menu(); }
</script>
