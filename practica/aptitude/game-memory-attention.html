<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;
  --accent:#1a4d8f; --accent-h:#123a6e; --onaccent:#ffffff; --warn:#b3450d; --ok:#2d6a3e; --err:#a3241c;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a3c6ef; --onaccent:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d}
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
#app{max-width:880px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
h3{font-size:1.02rem;margin:18px 0 6px}
p{margin:.5rem 0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.muted{color:var(--muted)} .ok{color:var(--ok)} .err{color:var(--err)} .warnc{color:var(--warn)}
.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.top .logo{width:32px;height:32px;color:var(--accent);stroke-width:1.5}
.top h1{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;transition:background-color .12s,color .12s;line-height:1.2}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{background:var(--accent-h);color:var(--onaccent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.mod:focus-visible,.opt:focus-visible,.ico:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{background:none;border:0;color:var(--muted);padding:4px;min-width:40px;min-height:40px;align-items:center;justify-content:center;cursor:pointer;display:inline-flex;border-radius:2px}
.ico:hover{color:var(--text)}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:7px 10px;width:100%;min-height:40px}
input[type=range]{width:100%;min-height:32px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.setup{display:grid;grid-template-columns:250px 1fr;gap:6px 36px;align-items:start}
.mods{border-top:1px solid var(--rule)}
.mod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 8px;cursor:pointer;color:var(--text);border-radius:0}
.mod:hover{background:var(--stripe)}
.mod[aria-checked=true]{background:var(--stripe);color:var(--accent);font-weight:600}
.form{border-top:1px solid var(--rule)}
.fr{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.fr>label{color:var(--muted);font-size:.92rem}
.fr .chk{display:flex;align-items:center;gap:10px}
.msg{min-height:1.4em;margin-top:12px;font-weight:600}
.head{display:flex;align-items:center;gap:16px;padding-bottom:10px;margin-bottom:22px;border-bottom:1px solid var(--rule);color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.head .hm{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
.head .sp{flex:1}
.head .pr{color:var(--warn);font-weight:700}
.cd{display:flex;align-items:center;gap:14px;margin-top:18px}
.cd .bar{flex:1;height:4px;background:var(--stripe);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cd .bar i{display:block;height:100%;width:100%;background:var(--accent)}
.cd .timer{font-family:var(--mono);min-width:3.4em;text-align:right}
.timer{font-variant-numeric:tabular-nums}
.timer.late{color:var(--warn)} .timer.over{color:var(--err)}
.bignum{font-family:var(--mono);font-size:3.4rem;text-align:center;padding:28px 0;font-weight:600}
.stim{font-family:var(--mono);font-size:3rem;font-weight:600;text-align:center;padding:24px 8px;min-height:110px;display:flex;align-items:center;justify-content:center;margin:0}
.stim.word{font-family:var(--sans);letter-spacing:.04em}
.center{text-align:center}
.q{font-family:var(--serif);font-size:1.3rem;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:1.02rem;min-height:44px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--err);color:var(--err);text-decoration:line-through}
.opt[disabled]{cursor:default}
.key{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:.82rem;color:var(--muted);background:var(--bg)}
.foot{display:flex;align-items:center;gap:14px;margin-top:16px}
.foot .sp{flex:1}
.hinttxt{color:var(--warn);margin:10px 0 0;min-height:1.2em}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
tbody tr:nth-child(even){background:var(--stripe)}
.tab-box{overflow-x:auto;max-width:100%;border-top:1px solid var(--rule);margin-bottom:18px}
table.strips{font-family:var(--mono);font-size:1.15rem}
table.strips td{padding:9px 12px}
table.strips td:first-child{font-weight:700}
table.rb th{width:110px;background:none}
table.rb td{font-family:var(--mono);white-space:normal}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.kv th{font-weight:400}
.big{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:18px 0}
.big>div{flex:1 1 140px;padding:14px 16px 12px 0}
.big b{display:block;font-family:var(--serif);font-size:2.3rem;line-height:1.1}
.big span{color:var(--muted);font-size:.85rem}
.fb{min-height:1.8em;text-align:center;font-weight:700;margin:12px 0}
.pad{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pad .btn{min-width:130px;justify-content:center;padding:12px 16px}
.stimbox{min-height:130px;text-align:center;display:flex;align-items:center;justify-content:center;margin:0 0 6px}
.rule{text-align:center;font-weight:700;min-height:1.5em}
.chart{display:block;width:100%;height:auto;margin-bottom:14px}
.chart .g{stroke:var(--rule);stroke-width:1}
.chart .t{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .l{fill:none;stroke:var(--accent);stroke-width:2}
.chart .p{fill:var(--accent)}
.chart .m{stroke:var(--ok);stroke-dasharray:6 4;fill:none}
.chart .mt{fill:var(--ok);font-size:11px}
@media (max-width:640px){.chart .t,.chart .mt{font-size:17px}}
.sh-c{fill:var(--muted)} .sh-s{fill:var(--warn)} .sh-t{fill:var(--accent)}
.swatch{width:12px;height:12px;border-radius:1px;display:inline-block;flex:none}
.back{display:inline-flex;margin-bottom:14px}
@media (max-width:720px){
  html{font-size:16px}
  .setup{grid-template-columns:1fr}
  .mods{display:grid;grid-template-columns:1fr 1fr}
  .mod{border-right:1px solid var(--rule)}
  h1{font-size:1.6rem}
  .stim{font-size:2.4rem}
}
@media (max-width:420px){
  .fr{grid-template-columns:82px 1fr;gap:8px}
  .opts{grid-template-columns:1fr}
}
.stim .ic{width:52px;height:52px;stroke-width:1.8}
.small{font-size:.85rem}
.top+.form,.top+.list,.top+.setup{border-top:0}
.top>.ic:not(.logo){width:26px;height:26px}
.head span{white-space:nowrap}
@media (max-width:420px){.head{gap:10px;font-size:.82rem}}
</style>

<script>
'use strict';
// ==== PURE LOGIC START ====
/* =====================================================================
   PURE LOGIC (no DOM). Deterministic given a seed. Tested with node
   (see game-memory-attention-README.md, "What was tested").
   ===================================================================== */

/* ---------- Seeded RNG ---------- */
function makeRng(seed){
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let a = h;
  function next(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next: next,
    int: function(n){ return Math.floor(next() * n); },
    range: function(lo, hi){ return lo + Math.floor(next() * (hi - lo + 1)); },
    pick: function(arr){ return arr[Math.floor(next() * arr.length)]; },
    chance: function(p){ return next() < p; },
    shuffle: function(arr){
      const b = arr.slice();
      for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(next() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
      return b;
    }
  };
}
function uniq(arr){ const seen = {}; const out = []; arr.forEach(function(x){ if (!seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function fmt(x, d){ if (x === null || x === undefined || isNaN(x)) return '-'; return Number(x).toFixed(d === undefined ? 1 : d); }

/* ---------- Levels (shared naming and pass threshold) ---------- */
const LEVEL_NAMES = ['', 'Calentamiento', 'Fácil', 'Constante', 'Estándar', 'Competitivo', 'Difícil', 'Élite', 'Extremo', 'Sobrehumano', 'Imposible'];
const HINT_MAX_LEVEL = 6;
const PASS_ACCURACY = 96;
function levelStatement(l){ return 'Nivel ' + l; }

/* =====================================================================
   MODULE 1: Flight strip recall
   ===================================================================== */
const CALLSIGN_AIRLINES = ['IBE','VLG','RYR','EZY','AFR','DLH','BAW','KLM','TAP','AEA','UAE','THY','EIN','WZZ','NOZ'];
const FIXES = ['DEGOS','LASPO','GEMAX','TOSVA','ROBIL','BUSTA','SOKOR','MEDAS','BEGAS','VAXOS','NUBLA','ORVEN','ASBOT','KUVAL','TIMBA'];
function m1Callsign(rng){
  const a = rng.pick(CALLSIGN_AIRLINES);
  const n = rng.range(100, 9999);
  return a + String(n);
}
function m1SimilarCallsign(rng, cs){
  const m = cs.match(/^([A-Z]{3})(\d+)$/);
  if (!m) return cs;
  const airline = m[1], num = m[2];
  if (rng.chance(0.5) && num.length >= 2){
    const i = rng.int(num.length - 1);
    const arr = num.split('');
    const t = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = t;
    return airline + arr.join('');
  }
  return rng.pick(CALLSIGN_AIRLINES.filter(function(x){ return x !== airline; })) + num;
}
const M1_P = [null,
  { n:3, dispSec:5.0, distract:'wait',  distractSec:3,  probes:1, similar:0 },
  { n:3, dispSec:4.0, distract:'wait',  distractSec:5,  probes:2, similar:0 },
  { n:4, dispSec:3.2, distract:'arith', distractSec:6,  probes:2, similar:.2 },
  { n:5, dispSec:2.6, distract:'arith', distractSec:8,  probes:3, similar:.3 },
  { n:5, dispSec:1.9, distract:'arith', distractSec:9,  probes:3, similar:.4 },
  { n:6, dispSec:1.7, distract:'arith', distractSec:10, probes:4, similar:.5 },
  { n:7, dispSec:1.5, distract:'arith', distractSec:11, probes:4, similar:.6 },
  { n:8, dispSec:1.3, distract:'arith', distractSec:12, probes:5, similar:.7 },
  { n:9, dispSec:1.1, distract:'arith', distractSec:13, probes:5, similar:.85 },
  { n:10,dispSec:1.0, distract:'arith', distractSec:14, probes:6, similar:1 }];
const M1_FIELDS = ['callsign','level','heading','fix'];
function m1Flight(rng, usedCS){
  let cs; do { cs = m1Callsign(rng); } while (usedCS[cs]);
  usedCS[cs] = 1;
  return { callsign:cs, level:rng.range(1, 39) * 10, heading:rng.range(0, 35) * 10, fix:rng.pick(FIXES) };
}
// Builds one flight-strip-recall round: n flights + q probes (each with 4 options, exactly 1 correct).
// ov (optional): { distract:true|false } forces the distractor harder/lighter than the level default (custom mode).
function buildFlightRound(rng, level, ov){
  const p = Object.assign({}, M1_P[level]);
  if (ov && ov.distract === true){ p.distract = 'arith'; p.similar = Math.max(p.similar, .6); }
  else if (ov && ov.distract === false){ p.distract = 'wait'; p.similar = 0; }
  const used = {};
  const flights = []; for (let i = 0; i < p.n; i++) flights.push(m1Flight(rng, used));
  const probes = [];
  for (let i = 0; i < p.probes; i++){
    const fi = rng.int(flights.length);
    const flight = flights[fi];
    const field = rng.pick(M1_FIELDS);
    const correct = flight[field];
    let options = [correct];
    if (field === 'callsign'){
      while (options.length < 4){
        const opt = rng.chance(p.similar) ? m1SimilarCallsign(rng, correct) : m1Callsign(rng);
        if (options.indexOf(opt) === -1) options.push(opt);
      }
    } else if (field === 'level'){
      while (options.length < 4){ const opt = rng.range(1, 39) * 10; if (options.indexOf(opt) === -1) options.push(opt); }
    } else if (field === 'heading'){
      while (options.length < 4){ const opt = rng.range(0, 35) * 10; if (options.indexOf(opt) === -1) options.push(opt); }
    } else {
      while (options.length < 4){ const opt = rng.pick(FIXES); if (options.indexOf(opt) === -1) options.push(opt); }
    }
    options = rng.shuffle(options);
    probes.push({ flightIndex:fi, field:field, correct:correct, options:options, answerIndex:options.indexOf(correct) });
  }
  return { level:level, flights:flights, distract:p.distract, distractSec:p.distractSec, dispSec:p.dispSec, probes:probes };
}
function checkFlightProbe(probe, chosenIndex){ return chosenIndex === probe.answerIndex; }
function m1Arith(rng){
  const a = rng.range(2, 19), b = rng.range(2, 19), op = rng.pick(['+','-']);
  const val = op === '+' ? a + b : a - b;
  return { text:a + ' ' + op + ' ' + b + ' =', answer:val };
}

/* =====================================================================
   MODULE 2: Digit / letter span
   ===================================================================== */
const DIGITS = '0123456789'.split('');
const LETTERS = 'BCDFGHJKLMNPQRSTVWXYZ'.split(''); // no vowels: avoids accidental words
const M2_P = [null,
  { len:3, alphabet:'digit',  order:'forward',   distract:false },
  { len:4, alphabet:'digit',  order:'forward',   distract:false },
  { len:5, alphabet:'digit',  order:'forward',   distract:true  },

const M4_P = [null,

const M4_KINDS = ['level','heading','freq','speed','squawk','direct'];
function m4Label(step){

const M5_P = [null,

  { nTrials:240, isiMs:750,  targetP:.06, subtle:true  },
  { nTrials:280, isiMs:700,  targetP:.05, subtle:true  },
  { nTrials:320, isiMs:650,  targetP:.04, subtle:true  }];
function buildVigilanceStream(rng, level, ov){

    if (tset[i] || tset[i - 1] || tset[i + 1] || tset[i - 2] || tset[i + 2]) continue;

function scoreVigilance(trials){
  let hits = 0, misses = 0, falseAlarms = 0, correctRejections = 0, rtSum = 0, rtN = 0;
  trials.forEach(function(t){

const M6_P = [null,
  { nTrials:24, switchP:.3, isiMs:0,    respMs:4000 },

const M7_WORDS = [
  { word:'ASCENDER', cat:'up' },

/* ---------- Shared: goals, recommendations, adaptive, CSV, personal best ---------- */
function parseGoal(text){
  const t = String(text || '').replace(/\s+/g, ' ');
  const num = function(x){ return parseFloat(x.replace(',', '.')); };
  const g = { acc:null, sec:null, correct:null };
  const mp = t.match(/(\d+(?:[.,]\d+)?)\s*%/); if (mp) g.acc = num(mp[1]);
  const ms = t.match(/(\d+(?:[.,]\d+)?)\s*(?:seconds|second|secs|sec|segundos|segundo|segs|seg|s)(?![a-zá-ú])/i); if (ms) g.sec = num(ms[1]);
  const ma = t.match(/(\d+)\s*(?:correct|hits|correctas|correcta|aciertos|acierto)/i); if (ma) g.correct = parseInt(ma[1], 10);
  return (g.acc === null && g.sec === null && g.correct === null) ? null : g;
}

  const g = parseGoal(text);
  if (!g) return null;
  let ok = true;
  if (g.acc !== null) ok = ok && r.accuracy >= g.acc;
  if (g.sec !== null && r.spi !== null) ok = ok && r.spi <= g.sec;
  if (g.correct !== null) ok = ok && r.correct >= g.correct;
  return ok;
}

}

function adaptiveStep(state, blockAccuracy){
  const s = { level:state.level, ups:state.ups, downs:state.downs, moved:0 };
  if (blockAccuracy >= PASS_ACCURACY){ s.ups++; s.downs = 0; }
  else if (blockAccuracy < ADAPT.failBelow){ s.downs++; s.ups = 0; }
  else { s.ups = 0; s.downs = 0; }
  if (s.ups >= ADAPT.upAfter && s.level < 10){ s.level++; s.ups = 0; s.moved = 1; }
  else if (s.downs >= ADAPT.downAfter && s.level > 1){ s.level--; s.downs = 0; s.moved = -1; }

}
function csvField(v){

}

  const ok = sessions.filter(function(s){ return s.mode === 'manual' && s.moduleKey === module && s.level === level && s.accuracy >= PASS_ACCURACY && s.spi !== null && s.spi !== undefined; });
  if (!ok.length) return null;

  let n = 0;
  for (let i = filtered.length - 1; i >= 0; i--){ if (filtered[i].accuracy >= PASS_ACCURACY) n++; else break; }
  return n;
}

/* ---------- Session bookkeeping shared by every module ---------- */
function startSession(cfg){
  clearAll();
  S = { cfg:cfg, results:[], adapt:{ level:cfg.level, ups:0, downs:0 }, timers:[], done:false, lastTask:null, m1Distract:{ ok:0, n:0 }, practice:!!cfg.practice };
  ({ m1:runM1, m2:runM2, m3:runM3, m4:runM4, m5:runM5, m6:runM6, m7:runM7 })[cfg.module]();
}
function levelNow(){ return S.cfg.mode === 'adaptive' ? S.adapt.level : S.cfg.level; }
function pushResult(ok, blank, ms, level){
  S.results.push({ ok:!!ok, blank:!!blank, ms:ms, level:level });
  if (S.cfg.mode === 'adaptive'){
    const bs = S.cfg.blockSize;
    if (S.results.length % bs === 0){
      const blk = S.results.slice(-bs);
      const acc = blk.filter(function(r){ return r.ok; }).length / bs * 100;
      S.adapt = adaptiveStep(S.adapt, acc);
    }
  }
}
// Every timer is bound to the session that created it: if the session was abandoned or replaced, the callback does nothing.
function setTimer(fn, ms){
  const my = S;
  const id = setTimeout(function(){ if (S !== my || !S || S.done) return; fn(); }, ms);
  S.timers.push(id);
  if (S.timers.length > 400) S.timers = S.timers.slice(-200);
  return id;
}
/* One monotonic clock (performance.now) for every phase. The deadline is fixed when the phase starts; the
   completion callback is scheduled against that deadline (re-armed if the timer fires early), so a throttled or
   late timer cannot stretch or shorten a phase. The on-screen number and bar are only a view of the same deadline. */
function cdView(){
  const left = Math.max(0, S.cdEnd - performance.now());
  const cd = $('cd'); if (cd) cd.textContent = fmt(left / 1000, 1);
  const bar = $('cdBar'); if (bar) bar.style.width = (S.cdTotal > 0 ? Math.min(100, left / S.cdTotal * 100) : 0) + '%';
}
function cdHTML(){
  const left = Math.max(0, S.cdEnd - performance.now());
  return '<div class="cd"><div class="bar"><i id="cdBar" style="width:' + (S.cdTotal > 0 ? Math.min(100, left / S.cdTotal * 100) : 0) + '%"></i></div><span id="cd" class="timer">' + fmt(left / 1000, 1) + '</span></div>';
}
function countdown(sec, cb){
  const my = S;
  if (S.intervalId){ clearInterval(S.intervalId); S.intervalId = null; }
  if (S.cdTimer){ clearTimeout(S.cdTimer); S.cdTimer = null; }
  S.cdTotal = sec * 1000; S.cdEnd = performance.now() + S.cdTotal;
  const fire = function(){
    if (S !== my || !S || S.done) return;
    const left = S.cdEnd - performance.now();
    if (left > 1){ S.cdTimer = setTimeout(fire, left); return; }
    S.cdTimer = null;
    if (S.intervalId){ clearInterval(S.intervalId); S.intervalId = null; }
    cdView();
    cb();
  };
  S.cdTimer = setTimeout(fire, S.cdTotal);
  S.intervalId = setInterval(function(){ if (S !== my || !S){ return; } cdView(); }, 100);
  cdView();
}
function headBar(module, idx, total, level){
  return '<div class="head"><span class="hm">' + IC(MODULE_ICON[module]) + MODULE_LABEL_ES[module] + '</span>' + (S.practice ? '<span class="pr">Práctica</span>' : '') + '<span class="sp"></span>' +
    (idx != null ? '<span>' + (idx + 1) + ' / ' + total + '</span>' : '') + '<span>L' + level + '</span><button class="ico" data-quit type="button" aria-label="Salir">' + IC('x','sm') + '</button></div>';
}
function headBarStream(module, done, total, level){ return headBar(module, done, total, level); }

/* ---------- Generic MCQ runner (used by modules 1, 3 and 4) ---------- */
function renderMCQ(o){
  const timing = timingFor(o.level);
  let hintTier = 0, answered = false;
  const optHTML = o.options.map(function(t, i){ return '<button class="opt" data-i="' + i + '"><span class="key">' + (i + 1) + '</span>' + esc(String(t)) + '</button>'; }).join('');
  show((o.sub || '') + (o.prompt ? '<p class="q">' + esc(o.prompt) + '</p>' : '') +
    '<div id="optWrap" class="opts">' + optHTML + '</div>' +
    '<div class="foot">' + (o.hint ? '<button class="btn" id="hintBtn" type="button" title="H">' + IC('bulb','sm') + 'Pista</button>' : '') + '<span class="sp"></span><span class="muted"><span id="tm" class="timer">0.0</span> s</span></div>' +
    '<p id="hintTxt" class="hinttxt"></p>');
  const t0 = performance.now();
  const myS = S;
  const finishAnswer = function(idx, blank){
    if (answered || S !== myS) return; answered = true;
    const ms = performance.now() - t0; onKey = null;
    if (S.intervalId){ clearInterval(S.intervalId); S.intervalId = null; }
    document.querySelectorAll('.opt').forEach(function(b, i){
      b.disabled = true;
      if (o.correctIndex !== undefined){ if (i === o.correctIndex) b.classList.add('right'); else if (i === idx) b.classList.add('wrong'); }
    });
    setTimer(function(){ o.onAnswer(idx, ms, blank); }, blank ? 150 : 650);
  };
  document.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click', function(){ finishAnswer(+b.dataset.i, false); }); });
  if (o.hint && $('hintBtn')){
    $('hintBtn').addEventListener('click', function(){
      if (answered || hintTier >= 3 || hintTier >= S.cfg.hintMax) return;
      hintTier++; $('hintTxt').textContent = o.hint[hintTier - 1];
      if (hintTier >= 3) finishAnswer(-1, true);
    });
  }
  if (S.intervalId){ clearInterval(S.intervalId); S.intervalId = null; }
  S.intervalId = setInterval(function(){
    if (S !== myS || !S){ return; }
    const sec = (performance.now() - t0) / 1000; const el = $('tm');
    if (el){ el.textContent = fmt(sec, 1); el.className = 'timer' + (timing.prompt && sec > timing.prompt ? ' late' : ''); }
  }, 100);
  // hard limit fires from its own deadline timer (not from the 100 ms display poll)
  if (timing.hard) setTimer(function(){ finishAnswer(-1, true); }, Math.max(0, t0 + timing.hard * 1000 - performance.now()));
  onKey = function(e){
    if (e.repeat) return;
    const n = parseInt(e.key, 10);
    if (!isNaN(n) && n >= 1 && n <= o.options.length){ finishAnswer(n - 1, false); return; }
    if (e.key === 's' || e.key === 'S'){ finishAnswer(-1, true); return; }
    if ((e.key === 'h' || e.key === 'H') && o.hint && $('hintBtn')) $('hintBtn').click();
  };
}

/* =====================================================================
   MODULE 1 RUNNER: Flight strip recall
   Timing source of truth = M1_P: dispSec is seconds PER STRIP (memorise time = n x dispSec);
   distractSec is the total length of the filled delay.
   ===================================================================== */
function runM1(){ S.roundIdx = 0; S.total = S.cfg.count; nextM1(); }
function nextM1(){
  if (S.roundIdx >= S.total){ return finishSession(); }
  const level = levelNow();
  const rng = makeRng(S.cfg.seed + '|m1|' + S.roundIdx);
  const ov = S.cfg.mode === 'custom' ? { distract:S.cfg.cDistract } : null;
  const round = buildFlightRound(rng, level, ov);
  S.round = round; S.probeI = 0; S.roundLevel = level;
  encodeM1(round);
}
function encodeM1(round){
  const rows = round.flights.map(function(f){ return '<tr><td>' + esc(f.callsign) + '</td><td>FL' + f.level + '</td><td>' + pad3(f.heading) + '&deg;</td><td>' + esc(f.fix) + '</td></tr>'; }).join('');
  const total = round.dispSec * round.flights.length;
  S.cdTotal = total * 1000; S.cdEnd = performance.now() + S.cdTotal;
  show(headBar('m1', S.roundIdx, S.total, S.roundLevel) +
    '<div class="tab-box"><table class="strips"><tbody>' + rows + '</tbody></table></div>' + cdHTML());
  onKey = null;
  countdown(total, function(){ afterEncodeM1(round); });
}
function afterEncodeM1(round){
  if (round.distract === 'wait') return renderFillerM1(round.distractSec, function(){ askM1(round); });
  return renderArithM1(round.distractSec, function(){ askM1(round); });
}
function renderFillerM1(sec, cb){
  S.cdTotal = sec * 1000; S.cdEnd = performance.now() + S.cdTotal;
  show(headBar('m1', S.roundIdx, S.total, S.roundLevel) + '<div class="bignum" id="cdBig">&middot;&middot;&middot;</div>' + cdHTML());
  onKey = null; countdown(sec, cb);
}
// Filled delay: sums are shown one after another for exactly `sec` seconds (single deadline), then recall starts.
function renderArithM1(sec, cb){
  const my = { done:false, i:0 };
  const end = function(){ if (my.done) return; my.done = true; cb(); };
  S.cdTotal = sec * 1000; S.cdEnd = performance.now() + S.cdTotal;
  showArithM1(my);
  countdown(sec, end);
}
function showArithM1(my){
  if (my.done) return;
  const rng = makeRng(S.cfg.seed + '|arith|' + S.roundIdx + '|' + my.i);
  const pr = m1Arith(rng);
  show(headBar('m1', S.roundIdx, S.total, S.roundLevel) +
    '<p class="stim">' + pr.text + '</p><p class="center"><input type="text" inputmode="numeric" id="ans" autocomplete="off" aria-label="Respuesta" style="max-width:160px;text-align:center;font-size:1.3rem"> ' +
    '<button class="btn primary" id="ok" type="button" title="Enter">' + IC('arrow') + '</button></p>' + cdHTML());
  $('ans').focus();
  const submit = function(){
    if (my.done) return;
    const v = parseInt($('ans').value, 10); S.m1Distract.n++; if (v === pr.answer) S.m1Distract.ok++;
    my.i++; showArithM1(my);
  };
  $('ok').addEventListener('click', submit);
  onKey = function(e){ if (e.target && e.target.id === 'ans' && e.key === 'Enter'){ e.preventDefault(); submit(); } };
}
function askM1(round){
  if (S.probeI >= round.probes.length){ S.roundIdx++; return nextM1(); }
  const probe = round.probes[S.probeI];
  const flight = round.flights[probe.flightIndex];
  const promptTxt = probe.field === 'callsign'
    ? ('Indicativo a FL' + flight.level + ', ' + pad3(flight.heading) + '°, ' + flight.fix)
    : (({ level:'Nivel', heading:'Rumbo', fix:'Siguiente punto' })[probe.field] + ' de ' + flight.callsign);
  const fmtOpt = function(o){ return probe.field === 'level' ? ('FL' + o) : probe.field === 'heading' ? (pad3(o) + '°') : String(o); };
  renderMCQ({
    sub: headBar('m1', S.roundIdx, S.total, S.roundLevel),
    prompt: promptTxt,
    options: probe.options.map(fmtOpt),
    correctIndex: probe.answerIndex,
    level: S.roundLevel,
    hint: S.cfg.hintMax > 0 ? [
      'Campo: ' + fieldLabel(probe.field).toLowerCase(),
      'Agrupa cada tira como una sola frase: indicativo, nivel, rumbo, punto.',
      fmtOpt(probe.correct)
    ] : null,
    onAnswer:function(idx, ms, blank){
      const ok = !blank && checkFlightProbe(probe, idx);
      pushResult(ok, blank, ms, S.roundLevel);
      S.probeI++; askM1(round);
    }
  });
}

/* =====================================================================
   MODULE 2 RUNNER: Digit / letter span
   ===================================================================== */
const ORDER_WORD = { forward:'Directo', backward:'Inverso', sequenced:'Ascendente' };
function runM2(){ S.trialIdx = 0; S.total = S.cfg.count; nextM2(); }
function nextM2(){
  if (S.trialIdx >= S.total){ return finishSession(); }
  const level = levelNow();
  const rng = makeRng(S.cfg.seed + '|m2|' + S.trialIdx);
  const ov = S.cfg.mode === 'custom' ? { distract:S.cfg.cDistract } : null;
  const item = m2Sequence(rng, level, ov);
  S.item = item; S.itemLevel = level; S.presentI = 0; S.symAt = null;
  showM2Symbol(item);
}
function showM2Symbol(item){
  if (S.presentI >= item.seq.length){ return afterEncodeM2(item); }
  const sym = item.seq[S.presentI];
  show(headBar('m2', S.trialIdx, S.total, S.itemLevel) +
    '<p class="center muted">' + ORDER_WORD[item.order] + ' &middot; ' + (S.presentI + 1) + ' / ' + item.seq.length + '</p>' +
    '<p class="stim">' + esc(sym) + '</p>');
  onKey = null;
  // symbols are scheduled on absolute deadlines (900 ms each) so rendering time cannot accumulate
  const now = performance.now();
  if (S.symAt === null) S.symAt = now;
  S.symAt += 900;
  setTimer(function(){ S.presentI++; showM2Symbol(item); }, Math.max(0, S.symAt - performance.now()));
}
function afterEncodeM2(item){
  if (!item.distract) return askM2(item);
  renderArithM2(function(){ askM2(item); });
}
function renderArithM2(cb){
  const rng = makeRng(S.cfg.seed + '|m2arith|' + S.trialIdx);
  const pr = m1Arith(rng);
  show(headBar('m2', S.trialIdx, S.total, S.itemLevel) +
    '<p class="stim">' + pr.text + '</p><p class="center"><input type="text" inputmode="numeric" id="ans" autocomplete="off" aria-label="Respuesta" style="max-width:160px;text-align:center;font-size:1.3rem"> ' +
    '<button class="btn primary" id="ok" type="button" title="Enter">' + IC('arrow') + '</button></p>');
  $('ans').focus();
  let sent = false;
  const submit = function(){
    if (sent) return; sent = true;
    const v = parseInt($('ans').value, 10); S.m1Distract.n++; if (v === pr.answer) S.m1Distract.ok++;
    cb();
  };
  $('ok').addEventListener('click', submit);

function runM5(){ S.queue = []; S.produced = 0; S.totalPlanned = S.cfg.count; S.chunkIdx = 0; S.trialResults = []; S.m5Frame = false; S.m5Fb = null; S.m5Next = null; nextM5Trial(); }

function streamFrame(ruleHTML, buttons){

function setFb(text, cls){ const el = $('fb'); if (el){ el.className = 'fb ' + (cls || ''); el.textContent = text; } }

/* =====================================================================

function runM6(){ S.queue = []; S.produced = 0; S.totalPlanned = S.cfg.count; S.chunkIdx = 0; S.trialResults = []; S.lastTask = null; S.frameOn = false; nextM6Trial(); }
function ensureM6Queue(){

    function(key, rt, ok){

// One timed trial: waits for one of `keys` (or a button), then shows Correct / Wrong / Too slow for 220 ms (+ the level's ISI), then calls done().
function timedTrial(t, keys, isOk, done){
  const t0 = performance.now(); let responded = false;
  const advance = function(key){
    if (responded) return; responded = true; onKey = null;
    const rt = key ? performance.now() - t0 : null, ok = key ? isOk(key) : false;
    setFb(ok ? 'Correcto' : (key ? 'Incorrecto' : 'Muy lento'), ok ? 'ok' : (key ? 'err' : 'warnc'));
    const st = $('stim'); if (st) st.innerHTML = '';

  };
  S.trialAdvance = advance;
  onKey = function(e){ if (e.repeat) return; const k = e.key.toLowerCase(); if (keys.indexOf(k) >= 0){ e.preventDefault(); advance(k); } };

function atcThirds(results, durationSec){

  for (var i = 0; i < N; i++){ var r = results[i]; var k = durationSec > 0 ? Math.min(2, Math.floor(Math.max(0, +r.t || 0) * 3 / durationSec)) : Math.min(2, Math.floor(i * 3 / N));
    g[k].n++; if (r.blank) g[k].b++; else if (r.ok) g[k].c++; g[k].s += (isFinite(+r.sec) ? +r.sec : 0); }
  for (var j = 0; j < 3; j++) g[j].s = Math.round(g[j].s * 100) / 100;
  return g;
}

    return kvRow('Coste del cambio', e.switchCostMs !== null ? fmt(e.switchCostMs, 0) + ' ms' : '-') + kvRow('Repetición / cambio', fmt(e.accRep, 0) + ' % / ' + fmt(e.accSwi, 0) + ' %');
  }
  if (cfg.module === 'm7' && S.extra){
    const e = S.extra;
    return kvRow('Interferencia', e.interferenceMs !== null ? fmt(e.interferenceMs, 0) + ' ms' : '-') + kvRow('Congruente / incongruente', fmt(e.accCong, 0) + ' % / ' + fmt(e.accIncong, 0) + ' %');
  }
  return '';
}
function personalBestForModule(sessions, moduleKey, level){ return personalBest(sessions, moduleKey, level); }
function finishPractice(){
  const cfg = S.cfg, res = S.results, real = cfg.after;
  const correct = res.filter(function(r){ return r.ok; }).length;
  show('<div class="top">' + IC(MODULE_ICON[cfg.module]) + '<h1>Práctica</h1></div>' +
    '<div class="big"><div><b>' + correct + ' / ' + res.length + '</b><span>Correctas</span></div></div>' +
    '<div class="actions"><button class="btn primary" id="real" title="Enter">' + IC('play') + 'Iniciar</button><button class="btn" id="again">' + IC('repeat') + 'Otra vez</button><button class="btn" id="menu">' + IC('back') + 'Menú</button></div>');
  const goReal = function(){ if (parseGoal(real.goal)) startSession(real); else menu(); };
  $('real').addEventListener('click', goReal);
  $('again').addEventListener('click', function(){ startSession(practiceCfg(real)); });
  $('menu').addEventListener('click', menu);
  onKey = function(e){ if (e.target.tagName === 'BUTTON') return; if (e.key === 'Enter'){ e.preventDefault(); goReal(); } };
}
function finishSession(){
  S.done = true; clearAll();
  if (S.cfg.practice) return finishPractice();
  const cfg = S.cfg, res = S.results;
  const correct = res.filter(function(r){ return r.ok; }).length, blank = res.filter(function(r){ return r.blank; }).length, wrong = res.length - correct - blank;
  const accuracy = res.length ? correct / res.length * 100 : 0;
  const msVals = res.filter(function(r){ return r.ms !== null && r.ms !== undefined; }).map(function(r){ return r.ms; });
  const spi = msVals.length ? (msVals.reduce(function(a, b){ return a + b; }, 0) / msVals.length / 1000) : null;
  const lv = (cfg.mode === 'adaptive' && res.length) ? Math.round(res.reduce(function(a, r){ return a + r.level; }, 0) / res.length) : cfg.level;
  const met = evaluateGoal(cfg.goal, { accuracy:accuracy, spi:spi, correct:correct });
  const d = load();
  const timing = TIMING[lv] || { prompt:null };
  const rec = recommend(accuracy, spi, lv, timing.prompt);
  const before = d.sessions.slice();
  const thirds = thirdsOf(res);
  const endur = atcThirds(res.map(function(r){ return { ok:r.ok, blank:r.blank, sec:(r.ms === null || r.ms === undefined) ? 0 : r.ms / 1000, t:0 }; }), 0);
  const rec0 = {
    ts: new Date().toISOString(), module: MODULE_LABEL[cfg.module] + (cfg.mode === 'manual' ? '' : ' [' + cfg.mode + ']'), moduleKey: cfg.module,
    level:lv, mode:cfg.mode, correct:correct, wrong:wrong, blank:blank, spi:spi, accuracy:accuracy, goal:cfg.goal, met:met,
    params: 'seed ' + cfg.seed + ', ' + res.length + ' items' + (cfg.hintMax ? (', hints<=' + cfg.hintMax) : '') + (cfg.mode === 'custom' ? ', custom' : ''),
    thirds: endur
  };
  d.sessions.push(rec0); save();
  const pbPrev = cfg.mode === 'manual' ? personalBestForModule(before, cfg.module, lv) : null;
  const newPB = cfg.mode === 'manual' && accuracy >= PASS_ACCURACY && (pbPrev === null || (spi !== null && spi < pbPrev));
  const streak = currentStreak(d.sessions, cfg.module);
  show('<div class="top">' + IC(MODULE_ICON[cfg.module]) + '<h1>Resultado</h1></div>' +
    '<p class="muted">' + esc(modDisp(cfg.module, cfg.mode)) + ' &middot; L' + lv + ' ' + LEVEL_NAMES[lv] + (cfg.mode === 'adaptive' ? (' &rarr; L' + S.adapt.level) : '') + ' &middot; ' + esc(cfg.seed) + '</p>' +
    '<div class="big"><div><b>' + fmt(accuracy, 1) + ' %</b><span>Precisión</span></div>' +
    '<div><b>' + (spi !== null ? fmt(spi, 1) + ' s' : '-') + '</b><span>Por ítem</span></div>' +
    '<div><b class="' + (met === true ? 'ok' : (met === false ? 'err' : '')) + '">' + (met === true ? 'Cumplido' : (met === false ? 'No cumplido' : '-')) + '</b><span>' + esc(cfg.goal) + '</span></div></div>' +
    '<div class="tab-box"><table class="kv"><tbody>' +
    kvRow('Correctas', correct) + kvRow('Incorrectas', wrong) + kvRow('En blanco', blank) + kvRow('Racha', streak) + extraRows(cfg) +
    (cfg.mode === 'manual' ? kvRow(newPB ? 'Nuevo récord' : 'Récord', newPB ? (spi !== null ? fmt(spi, 2) + ' s' : '-') : (pbPrev === null ? '-' : fmt(pbPrev, 2) + ' s')) : '') +
    kvRow('Siguiente', '<b>' + esc(rec.text) + '</b>') + '</tbody></table></div>' +
    (storeOk ? '' : '<p class="err"><b>No guardado</b></p>') +
    thirdsHTML(thirds) +
    '<div class="actions"><button class="btn primary" id="again" title="Enter">' + IC('arrow') + 'Otra vez</button><button class="btn" id="replay">' + IC('repeat') + 'Repetir</button><button class="btn" id="menu">' + IC('back') + 'Menú</button><button class="btn" id="hist" title="H">' + IC('history') + 'Historial</button></div>');
  const again = function(){ const c = Object.assign({}, cfg); c.seed = 's' + Math.floor(Math.random() * 1e9).toString(36); if (c.mode === 'adaptive') c.level = 2; startSession(c); };
  $('again').addEventListener('click', again);
  $('replay').addEventListener('click', function(){ const c = Object.assign({}, cfg); if (c.mode === 'adaptive') c.level = 2; startSession(c); });
  $('menu').addEventListener('click', menu);
  $('hist').addEventListener('click', showHistory);
  onKey = function(e){ if (e.target && e.target.tagName === 'BUTTON') return; if (e.key === 'Enter'){ e.preventDefault(); again(); } else if (e.key === 'h' || e.key === 'H') showHistory(); };
}

/* ---------- History and CSV ---------- */
function trendChart(ses){
  const pts = ses.slice(-30);
  if (pts.length < 2) return '';
  const W = 640, H = 200, ml = 36, mr = 10, mt = 10, mb = 24;
  const x = function(i){ return ml + i * (W - ml - mr) / (pts.length - 1); };
  const y = function(v){ return mt + (100 - v) * (H - mt - mb) / 100; };
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Precisión">';
  [0, 25, 50, 75, 100].forEach(function(v){ s += '<line class="g" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="t" x="' + (ml - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  s += '<line class="m" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(PASS_ACCURACY) + '" y2="' + y(PASS_ACCURACY) + '"/><text class="mt" x="' + (W - mr) + '" y="' + (y(PASS_ACCURACY) - 4) + '" text-anchor="end">96 %</text>';
  s += '<polyline class="l" points="' + pts.map(function(p, i){ return x(i).toFixed(1) + ',' + y(p.accuracy).toFixed(1); }).join(' ') + '"/>';
  pts.forEach(function(p, i){ s += '<circle class="p" cx="' + x(i).toFixed(1) + '" cy="' + y(p.accuracy).toFixed(1) + '" r="3.2"/><text class="t" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + (i % Math.ceil(pts.length / 10) === 0 ? 'L' + esc(p.level) : '') + '</text>'; });
  return s + '</svg>';
}
function showHistory(){
  clearAll(); S = null;
  const d = load(), ses = d.sessions;
  const rows = ses.slice().reverse().slice(0, 150).map(function(s){
    return '<tr><td>' + dateES(s.ts) + '</td><td>' + esc(s.moduleKey ? modDisp(s.moduleKey, s.mode) : s.module) + '</td><td>' + esc(s.level) + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td><td>' + s.blank + '</td><td>' + fmt(s.spi, 2) + '</td><td>' + fmt(s.accuracy, 1) + '</td><td>' + esc(s.goal) + '</td><td>' + (s.met === true ? 'Sí' : (s.met === false ? 'No' : '-')) + '</td></tr>';
  }).join('');
  show('<button class="btn back" id="back" title="Esc">' + IC('back') + 'Menú</button><div class="top">' + IC('history') + '<h1>Historial</h1></div>' + trendChart(ses) +
    (ses.length ? '<div class="tab-box"><table><thead><tr><th>Fecha</th><th>Módulo</th><th>Nivel</th><th>Aciertos</th><th>Errores</th><th>Blanco</th><th>s/ítem</th><th>Prec. %</th><th>Objetivo</th><th>Cumplido</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">Sin sesiones</p>') +
    '<div class="actions"><button class="btn primary" id="csv">' + IC('download') + 'CSV</button><button class="btn danger" id="del">' + IC('trash') + 'Borrar</button><span id="conf" style="display:inline-flex;gap:10px;align-items:center"></span></div>');
  $('back').addEventListener('click', menu);
  $('csv').addEventListener('click', function(){
    try {
      const blob = new Blob([toCSV(d.sessions)], { type:'text/csv;charset=utf-8' });
      const a = document.createElement('a'), f = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = 'game-memory-attention-' + f.getFullYear() + pad2(f.getMonth() + 1) + pad2(f.getDate()) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { $('conf').innerHTML = '<span class="err">Error</span>'; }
  });
  $('del').addEventListener('click', function(){
    $('conf').innerHTML = '<span class="warnc">¿Borrar todo?</span> <button class="btn danger" id="yes">Sí</button> <button class="btn" id="no">No</button>';
    $('no').addEventListener('click', function(){ $('conf').innerHTML = ''; });
    $('yes').addEventListener('click', function(){ d.sessions = []; save(); showHistory(); });
  });
  onKey = null;
}
menu();
</script>
