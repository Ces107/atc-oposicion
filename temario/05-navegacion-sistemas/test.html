@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}

}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}

nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}

.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}
nav.toc a.active{color:var(--acc);font-weight:600}
@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}

@media (max-width:900px),(pointer:coarse){table.src td.act a{min-height:44px;min-width:44px;padding:0 .35rem;margin-right:.3rem}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}

4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Navegación, equipos y sistemas</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Navegación, equipos y sistemas</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el manual, el SNA (sistema de navegación aérea) se define como:", "opts": ["El conjunto de medios técnicos de comunicaciones, navegación y vigilancia que actúan como soporte del ATM", "El conjunto de elementos jurídicos, organizativos, técnicos y operativos que permiten operaciones aéreas seguras, fluidas y eficientes", "El conjunto de servicios de organización del espacio aéreo, gestión de afluencia y control del tráfico aéreo", "El conjunto de métodos que permiten volar entre un origen y un destino conociendo siempre la posición"], "ans": 1, "why": "Es la definición literal del SNA. La A es el CNS, la C es el ATM y la D es el concepto inicial de navegación aérea.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 2, "stem": "¿Cuál de los siguientes NO figura entre los elementos que, según el manual, componen el SNA?", "opts": ["Jurídicos", "Organizativos", "Económicos", "Operativos"], "ans": 2, "why": "El SNA es el conjunto de elementos jurídicos, organizativos, técnicos y operativos (cuatro); los económicos no se citan.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 3, "stem": "Según el manual, ¿a qué se refería en sus inicios el concepto de navegación aérea?", "opts": ["A la organización del espacio aéreo y a la gestión de afluencia del tráfico", "Al conjunto de elementos jurídicos y técnicos de las operaciones aéreas", "A la vigilancia en tiempo real de todas las aeronaves de un entorno", "A los métodos para volar entre un origen y un destino conociendo siempre la posición"], "ans": 3, "why": "«En sus inicios» se refería exclusivamente a los métodos que permitían volar entre origen y destino con conocimiento permanente de la posición; después evolucionó hacia el SNA.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 4, "stem": "Según el manual, ¿con qué está relacionada la parte jurídica y organizativa del SNA?", "opts": ["Con el marco regulador: principios y normas de las operaciones y requisitos y responsabilidades de las personas", "Con los servicios de comunicaciones, navegación y vigilancia que actúan como soporte del ATM", "Con la organización del espacio aéreo, la gestión de afluencia y el control del tráfico aéreo", "Con las infraestructuras terrestres de radioayudas y los equipos de a bordo de la aeronave"], "ans": 0, "why": "La parte jurídica y organizativa es el marco regulador; los aspectos técnicos y operativos se engloban en el concepto CNS-ATM.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 5, "stem": "Dentro del concepto CNS-ATM, ¿qué servicios se relacionan con la organización del espacio aéreo, la gestión de afluencia, el control del tráfico aéreo y el suministro de información y alerta?", "opts": ["CNS", "AIS", "SAR", "ATM"], "ans": 3, "why": "Son los servicios de gestión de tránsito aéreo (ATM); el CNS son los medios técnicos que actúan como soporte del ATM.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 6, "stem": "¿Cuál de los siguientes NO es uno de los tres servicios CNS que describe el manual?", "opts": ["Meteorología", "Comunicaciones", "Navegación", "Vigilancia"], "ans": 0, "why": "CNS = comunicaciones, navegación y vigilancia; la meteorología no forma parte del CNS en el manual.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 7, "stem": "Según el manual, ¿qué servicio CNS se define como los medios que permiten conocer, en tiempo real, la posición de todas las aeronaves que operan en un entorno determinado?", "opts": ["Comunicaciones", "Navegación", "Vigilancia", "Gestión de afluencia"], "ans": 2, "why": "Es la vigilancia. La navegación son los medios que permiten a las aeronaves conocer su posición y navegar; las comunicaciones, la difusión de los datos de interés.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 8, "stem": "Según el manual, la ruta que sigue una aeronave se planifica antes del vuelo y se determina mediante:", "opts": ["Una serie de puntos de recorrido delimitados entre el origen y el destino", "Los radiales de las estaciones VOR que hay entre el origen y el destino", "Las instrucciones que da el controlador en cada fase del vuelo", "Las coordenadas de los aeropuertos de origen y de destino solamente"], "ans": 0, "why": "«La ruta a seguir … debe ser planificada antes de la realización del vuelo y se determina mediante una serie de puntos de recorrido, delimitados entre el origen y el destino.»", "src": "Manual 5 (nov. 2026), capítulo 2.2, p. 6", "note": ""}, {"n": 9, "stem": "En el apartado 2.2, ¿en cuántas fases dice el manual que se puede dividir el vuelo de una aeronave?", "opts": ["Cuatro", "Tres", "Seis", "Ocho"], "ans": 2, "why": "El texto dice «seis fases», aunque la lista solo tiene cinco viñetas (aproximación y aterrizaje van juntas); la figura muestra las seis: despegue, salida (SID), ruta, llegada (STAR), aproximación y aterrizaje.", "src": "Manual 5 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 10, "stem": "En la figura de las fases de vuelo del manual, ¿qué sigla acompaña a la fase de «Llegada»?", "opts": ["SID", "FAF", "APV", "STAR"], "ans": 3, "why": "La figura rotula «Salida (SID)» y «Llegada (STAR)»; en el texto son el ascenso (salida) y el descenso (llegada).", "src": "Manual 5 (nov. 2026), capítulo 2.2, figura, p. 7", "note": ""}, {"n": 11, "stem": "¿En qué fase del vuelo dice el manual que la aeronave «completa la mayor parte del trayecto, realizando el vuelo de manera estable y nivelada»?", "opts": ["Aproximación", "Ascenso (salida)", "Descenso (llegada)", "Ruta"], "ans": 3, "why": "Es la definición de la fase de ruta.", "src": "Manual 5 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 12, "stem": "Según el manual, ¿qué fase del vuelo termina al alcanzar el punto donde se inicia la fase de ruta, siguiendo las rutas de salida establecidas?", "opts": ["Despegue", "Ascenso (salida)", "Descenso (llegada)", "Aproximación"], "ans": 1, "why": "En el ascenso (salida) la aeronave continúa el ascenso por las rutas de salida «hasta alcanzar el punto donde se inicia la fase de ruta». El despegue es la fase en que comienza el ascenso abandonando el aeropuerto.", "src": "Manual 5 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 13, "stem": "La «función de guiado» de la navegación aérea se define en el manual como aquella en la que el piloto debe:", "opts": ["Conocer, en todo momento, la situación de la aeronave respecto a la ruta establecida", "Seleccionar la altitud de crucero más adecuada para la ruta establecida", "Dirigir convenientemente la aeronave para mantener la ruta establecida, según los datos de posición", "Comunicar su posición al control de tránsito aéreo en los puntos de notificación"], "ans": 2, "why": "Las dos funciones son posicionamiento (la A) y guiado (dirigir la aeronave para mantener la ruta según los datos de posición).", "src": "Manual 5 (nov. 2026), capítulo 2.3, p. 7", "note": ""}, {"n": 14, "stem": "Según el manual, las exigencias de precisión y eficacia de la navegación son mayores en las fases iniciales y finales que en ruta porque:", "opts": ["Son críticas por las condiciones de vuelo y por el riesgo de colisión con otras aeronaves y con obstáculos", "Requieren más comunicaciones con el control de tránsito aéreo que la fase de ruta", "La aeronave vuela a mayor velocidad que en la fase de ruta", "El tiempo meteorológico es siempre peor cerca del suelo que en ruta"], "ans": 0, "why": "En ruta el vuelo es nivelado, a velocidad constante, y solo hay conflicto potencial con otras aeronaves; en las fases iniciales y finales también con obstáculos.", "src": "Manual 5 (nov. 2026), capítulo 2.3, p. 8", "note": ""}, {"n": 15, "stem": "Según la tabla de técnicas de navegación, ¿de qué depende considerablemente la eficacia de la navegación visual?", "opts": ["De la cobertura de las radioayudas de la ruta", "Del grado de pericia que muestre el piloto", "De la precisión de la brújula de a bordo", "Del número de puntos de recorrido de la ruta"], "ans": 1, "why": "Es «un modo de navegación muy elemental cuya eficacia depende considerablemente del grado de pericia que muestre el piloto»; además obliga a volar próximo al terreno y depende mucho de la meteorología y la visibilidad.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 8", "note": ""}, {"n": 16, "stem": "La navegación a estima se basa en tres parámetros. ¿Cuáles son?", "opts": ["Altitud, presión y temperatura", "Velocidad, tiempo y rumbo", "Distancia, combustible y peso", "Frecuencia, potencia y alcance"], "ans": 1, "why": "«Es una técnica basada en el uso de tres parámetros: la velocidad, el tiempo y el rumbo de la aeronave.»", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 17, "stem": "En la navegación a estima, ¿con qué mantiene el piloto el rumbo establecido en la ruta, según el manual?", "opts": ["Con el CDI del equipo VOR", "Con la aguja del ADF", "Con la brújula", "Con el indicador RMI"], "ans": 2, "why": "El piloto se dirige al siguiente punto «manteniendo -a través de la brújula- el rumbo establecido en la ruta»; con velocidad constante estima la posición midiendo el tiempo.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 18, "stem": "¿Qué factores dice el manual que NO se tienen en cuenta en la navegación a estima, lo que provoca imprecisión?", "opts": ["El consumo de combustible y el peso de la aeronave", "Las interferencias de radio y la línea de vista", "La declinación magnética y la convergencia de meridianos", "La presencia de viento y los errores de pilotaje e instrumentales"], "ans": 3, "why": "Las posiciones calculadas son solo una estimación porque no se tienen en cuenta el viento ni los errores de pilotaje e instrumentales.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 19, "stem": "Según el manual, el principio de funcionamiento de la navegación a estima se utiliza, de manera perfeccionada, en un sistema más sofisticado. ¿Cuál cita la tabla de técnicas?", "opts": ["El VOR", "La multilateración", "El ILS", "La navegación inercial"], "ans": 3, "why": "La tabla cita «determinados sistemas de ayuda a la navegación más sofisticados, como la navegación inercial».", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 20, "stem": "¿Qué técnica define el manual como «una técnica de navegación instrumental basada en el vuelo hacia o desde radioayudas»?", "opts": ["Navegación de área", "Navegación radioeléctrica convencional", "Navegación a estima", "Navegación visual"], "ans": 1, "why": "Es la navegación radioeléctrica convencional; la de área también es instrumental, pero permite cualquier trayectoria deseada.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 21, "stem": "Según el manual, ¿qué red de rutas determina la navegación radioeléctrica convencional dentro de un espacio aéreo?", "opts": ["Una red fija, supeditada a la configuración existente de radioayudas", "Una red flexible, definida por las coordenadas de los puntos de recorrido", "Una red fija, supeditada a la cobertura de los satélites GNSS", "Una red libre, que el piloto define durante el vuelo"], "ans": 0, "why": "La red fija limita la utilización de la capacidad disponible; la imposibilidad de trayectorias flexibles aumenta la complejidad y los costes operativos y medioambientales.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 9", "note": ""}, {"n": 22, "stem": "Según la tabla de técnicas, ¿qué técnica permite a la aeronave desplazarse en cualquier trayectoria deseada?", "opts": ["La navegación visual", "La navegación a estima", "La navegación de área", "La navegación radioeléctrica convencional"], "ans": 2, "why": "La navegación de área es «una técnica de navegación instrumental que permite a la aeronave desplazarse en cualquier trayectoria deseada».", "src": "Manual 5 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 23, "stem": "Según el manual, ¿cómo se define la ruta en la navegación de área?", "opts": ["Mediante radiales VOR que unen estaciones terrestres consecutivas", "Mediante marcaciones NDB tomadas sobre estaciones de la ruta", "Mediante aerovías fijas definidas entre radioayudas terrestres", "Mediante la latitud y la longitud de los puntos de recorrido, que no tienen que coincidir con radioayudas"], "ans": 3, "why": "«La ruta se define mediante las coordenadas de latitud y longitud de los puntos de recorrido … sin necesidad de que éstos coincidan con instalaciones terrestres de radioayudas.»", "src": "Manual 5 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 24, "stem": "En la navegación de área, ¿qué determina de forma automática los datos de posición y guiado?", "opts": ["El controlador, mediante vectores radar", "Las estaciones terrestres de radioayudas de la ruta", "Los equipos RNAV o RNP de a bordo, con la información de los dispositivos de ayuda de la aeronave", "El piloto, mediante el cálculo a estima entre puntos de recorrido"], "ans": 2, "why": "El piloto sigue las instrucciones de los equipos RNAV o RNP de a bordo, que calculan posición y guiado a partir de los dispositivos de la aeronave, autónomos o apoyados en radioayudas.", "src": "Manual 5 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 25, "stem": "Según el manual, ¿qué tres conceptos se han desarrollado con la navegación de área?", "opts": ["Especificación RNAV, especificación RNP y concepto SBAS", "Especificación RNAV, especificación RNP y concepto PBN", "Navegación visual, navegación a estima y navegación radioeléctrica", "Especificación PBN, concepto RNP y concepto GNSS"], "ans": 1, "why": "El manual enumera la especificación RNAV, la especificación RNP y el concepto PBN, «que engloba los dos puntos anteriores».", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 10", "note": ""}, {"n": 26, "stem": "¿Cuál es la diferencia que establece el manual entre la especificación RNAV y la especificación RNP?", "opts": ["La RNP incluye el requisito de vigilancia y alerta de la performance a bordo; la RNAV no", "La RNAV requiere navegación por satélite; la RNP no", "La RNAV solo se usa en espacio oceánico; la RNP solo en espacio continental", "La RNP es un concepto de la OACI que engloba a la RNAV"], "ans": 0, "why": "Ambas son navegación basada en la navegación de área; la RNP incluye la vigilancia y alerta de la performance a bordo. El concepto que engloba a ambas es la PBN (la D).", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 11", "note": ""}, {"n": 27, "stem": "Según el manual, la PBN es un concepto definido por:", "opts": ["EUROCONTROL, que sustituye a las especificaciones RNAV", "La OACI, que se aplica solo a las especificaciones RNP", "La Unión Europea, para la fase de ruta continental", "La OACI, que engloba tanto las especificaciones RNAV como las RNP"], "ans": 3, "why": "«Es un concepto definido por OACI que engloba tanto a las especificaciones RNAV como a las RNP», ligado al cumplimiento de unas prestaciones de navegación.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 11", "note": ""}, {"n": 28, "stem": "Según la tabla de tipos de RNAV del manual, ¿qué añade la RNAV 3D respecto a la RNAV 2D?", "opts": ["Guiado en el plano vertical", "Previsiones de tiempo de vuelo entre puntos de la ruta", "Guiado en el plano horizontal", "Capacidad de posicionamiento"], "ans": 0, "why": "RNAV 2D: posicionamiento y guiado horizontal; RNAV 3D: añade guiado vertical; RNAV 4D: añade además previsiones de tiempo de vuelo.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, tabla, p. 11", "note": ""}, {"n": 29, "stem": "Según la tabla de tipos de RNAV, ¿qué tipo es el único con capacidad para proporcionar previsiones de tiempo de vuelo entre puntos de la ruta?", "opts": ["RNAV 2D", "RNAV 3D", "RNAV 4D", "RNAV 10"], "ans": 2, "why": "Solo la fila RNAV 4D tiene «SI» en las cuatro columnas, incluida la de previsiones de tiempo de vuelo.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, tabla, p. 11", "note": ""}, {"n": 30, "stem": "¿Qué parámetro básico de la PBN define el manual como «la diferencia entre la posición indicada por el sistema de navegación y la posición real de la aeronave»?", "opts": ["Integridad", "Exactitud", "Continuidad", "Disponibilidad"], "ans": 1, "why": "Es la definición de exactitud.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 11", "note": ""}, {"n": 31, "stem": "¿Qué parámetro básico de la PBN es la capacidad del sistema para desconectarse automáticamente, o advertir al usuario, cuando no deba utilizarse, y se suele expresar como el número de veces que el sistema se apaga -o avisa- en un intervalo de tiempo o por operación?", "opts": ["Continuidad", "Disponibilidad", "Exactitud", "Integridad"], "ans": 3, "why": "Es la integridad. No confundir con la continuidad, que se expresa como número de interrupciones por intervalo de tiempo o por operación.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 11", "note": ""}, {"n": 32, "stem": "¿Qué parámetro básico de la PBN define el manual como «la capacidad del sistema para realizar sus funciones durante una determinada operación aérea, sin sufrir interrupciones imprevistas en el servicio»?", "opts": ["Exactitud", "Continuidad", "Integridad", "Disponibilidad"], "ans": 1, "why": "Es la continuidad, que se expresa como número de interrupciones por intervalo de tiempo o por operación.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 11", "note": ""}, {"n": 33, "stem": "Según el apartado 3.1.1 del manual, ¿qué parámetro básico de la PBN es la capacidad del sistema para realizar sus funciones al inicio de una operación, expresada como el porcentaje de tiempo en que está operativo?", "opts": ["Integridad", "Continuidad", "Exactitud", "Disponibilidad"], "ans": 3, "why": "Es la disponibilidad: porcentaje de tiempo en que el sistema está operativo cumpliendo a la vez exactitud, integridad y continuidad. Clave: disponibilidad = al inicio; continuidad = durante la operación.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, p. 12", "note": ""}, {"n": 34, "stem": "¿Cuál de los siguientes NO figura entre los cuatro parámetros básicos de la PBN que enumera el manual (apartado 3.1.1)?", "opts": ["Exactitud", "Integridad", "Funcionalidad", "Continuidad"], "ans": 2, "why": "El manual enumera exactitud, integridad, continuidad y disponibilidad. El Doc 9613 de la OACI habla de «funcionalidad», pero el examen sigue al manual.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, pp. 11-12", "note": ""}, {"n": 35, "stem": "En la designación RNAV X o RNP X, ¿qué representa el número X?", "opts": ["La altitud máxima de crucero, en miles de pies", "El número de puntos de recorrido de la ruta", "El número mínimo de satélites que debe recibir el receptor", "La precisión de navegación lateral (TSE), en NM, que se espera lograr al menos el 95 % del tiempo de vuelo"], "ans": 3, "why": "Así, la RNAV 5 requiere una precisión de navegación lateral de 5 NM.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 36, "stem": "Según el manual, la precisión de navegación lateral que expresa la «X» de RNAV X / RNP X se debe lograr en por lo menos:", "opts": ["El 99,9 % del tiempo de vuelo", "El 90 % del tiempo de vuelo", "El 99 % del tiempo de vuelo", "El 95 % del tiempo de vuelo"], "ans": 3, "why": "«… en millas náuticas que se espera que logre, en por lo menos el 95% del tiempo de vuelo.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 37, "stem": "Según el manual, ¿en qué documento de la OACI se definen las especificaciones de navegación (RNAV 10, RNAV 5, RNP 4, etc.)?", "opts": ["Doc 9613, Manual de navegación basada en prestaciones (PBN)", "Doc 9849, Manual sobre el sistema mundial de navegación por satélite (GNSS)", "Anexo 10, Radioayudas para la navegación", "Anexo 4, Cartas aeronáuticas"], "ans": 0, "why": "«De acuerdo con el Doc. 9613 de OACI \"Manual de Navegación Basada en Prestaciones PBN\", se definen las siguientes Especificaciones de Navegación.» Las otras tres obras figuran en la bibliografía.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 38, "stem": "Según el manual, ¿para qué se utiliza la RNAV 10?", "opts": ["Para operaciones RNAV en SID y STAR con tránsito de baja densidad", "Para la aproximación final con guiado vertical baro-VNAV", "En ruta, en espacio aéreo oceánico o áreas remotas, para mantener mínimas de separación longitudinal basadas en la distancia", "En ruta, en espacio aéreo continental"], "ans": 2, "why": "La RNAV 10 es para ruta oceánica o remota; la RNAV 5 (la D) es para ruta continental.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 39, "stem": "¿Qué especificación se designa a veces, por motivos históricos, como «RNP 10», aunque no cuente con el requisito de vigilancia y alerta de la performance a bordo?", "opts": ["RNP 4", "RNAV 5", "RNP APCH", "RNAV 10"], "ans": 3, "why": "El manual lo dice de la RNAV 10.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 40, "stem": "Según el manual, ¿dónde se usa la RNAV 5?", "opts": ["Solo en ruta oceánica o remota", "Solo en la aproximación final", "En ruta, en espacio aéreo continental", "Solo en SID y STAR"], "ans": 2, "why": "La RNAV 5 apoya operaciones RNAV en ruta en espacio aéreo continental.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 41, "stem": "Según el manual, ¿en qué fases se utilizan la RNAV 1 y la RNAV 2?", "opts": ["En ruta, SID, STAR y aproximaciones (solo tramos inicial, intermedio o de frustrada)", "Solo en ruta oceánica, con separación longitudinal basada en la distancia", "Solo en la aproximación final, con guiado vertical baro-VNAV", "En SID y STAR para helicópteros, excepto en la aproximación final"], "ans": 0, "why": "Es el uso del Doc 9613 que recoge el manual; en la UE no está previsto el uso de la RNAV 2 ni el de la RNAV 1 en ruta.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 42, "stem": "Según el manual, ¿qué NO está previsto en la Unión Europea en relación con la RNAV 1 y la RNAV 2?", "opts": ["El uso de la RNAV 1 en SID y STAR", "El uso de la RNAV 1 en tramos de aproximación frustrada", "El uso de la RNAV 1 en aproximaciones iniciales", "El uso de la RNAV 2, ni el de la RNAV 1 en fase de ruta"], "ans": 3, "why": "«En la Unión Europea no está previsto el uso de RNAV 2, ni el de RNAV 1 en fase de ruta.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 43, "stem": "Según el manual, ¿para qué se utiliza la RNP 4?", "opts": ["En ruta, en espacio aéreo oceánico o de áreas remotas, para mantener mínimas de separación longitudinal basadas en distancia", "En SID, STAR y aproximaciones con vigilancia ATS limitada o sin ella", "Principalmente en operaciones de helicópteros", "En aproximaciones con tramos curvos de radio fijo en la aproximación final"], "ans": 0, "why": "La RNP 4, como la RNAV 10, es para ruta oceánica o remota.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 44, "stem": "Según el manual, ¿en qué condiciones se usa la RNP 1?", "opts": ["En SID, STAR y aproximaciones (tramos inicial, intermedio o de frustrada), con vigilancia ATS limitada o sin ella y tránsito de baja a media densidad", "En ruta oceánica y remota, para mantener mínimas de separación longitudinal basadas en la distancia", "En ruta continental, con alta densidad de tránsito y cobertura radar completa", "En la aproximación final, con tramos curvos de radio fijo y guiado vertical baro-VNAV"], "ans": 0, "why": "El manual añade que la RNP 1 puede utilizar tramos curvos de radio fijo.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 45, "stem": "Según el manual, ¿hasta qué valor de RNP apoya operaciones de aproximación la especificación RNP APCH?", "opts": ["Hasta RNP 1 NM", "Hasta RNP 0,1 NM", "Hasta RNP 0,3 NM", "Hasta RNP 2 NM"], "ans": 2, "why": "«RNP APCH: Se utiliza para apoyar operaciones de aproximación RNP de hasta RNP 0,3 NM.» El 0,1 corresponde a la RNP AR APCH.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 46, "stem": "Según el manual, ¿dónde puede usar la RNP APCH tramos curvos de radio fijo?", "opts": ["En cualquier parte del procedimiento, incluida la aproximación final", "Solo en la aproximación inicial o intermedia, o en algunas partes de la aproximación frustrada", "En ninguna parte: solo admite tramos rectos", "Solo en la aproximación final"], "ans": 1, "why": "La RNP APCH restringe los tramos curvos de radio fijo a esos tramos; la RNP AR APCH los admite en cualquier parte, incluida la final.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 12", "note": ""}, {"n": 47, "stem": "Según el manual, ¿qué requisitos puede incluir la especificación RNP APCH?", "opts": ["Capacidades como la función baro-VNAV o la utilización de sistemas SBAS en aproximación final", "La utilización de radiobalizas OM y MM en la aproximación final", "La sintonización simultánea de dos estaciones DME y un VOR", "La utilización de un GBAS de categoría II/III"], "ans": 0, "why": "«Se pueden incluir requisitos para capacidades como la función baro-VNAV, o la utilización de sistemas SBAS en aproximación final.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, pp. 12-13", "note": ""}, {"n": 48, "stem": "¿Qué especificación permite tramos curvos de radio fijo en cualquier parte del procedimiento, incluida la aproximación final?", "opts": ["RNP APCH", "RNP 4", "RNP AR APCH", "RNAV 5"], "ans": 2, "why": "La RNP AR APCH está diseñada para tramos rectos y/o curvos de radio fijo en cualquier parte del procedimiento, incluida la aproximación final.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 49, "stem": "Según el manual, ¿qué valores de RNP tiene la RNP AR APCH en la aproximación final?", "opts": ["Entre RNP 1 y 0,1", "Entre RNP 2 y 0,3", "Hasta RNP 0,3", "Entre RNP 0,3 y 0,1"], "ans": 3, "why": "RNP AR APCH: entre 1 y 0,1 en los tramos inicial, intermedio y de frustrada; entre 0,3 y 0,1 en la aproximación final.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 50, "stem": "Según el manual, ¿qué valores de RNP tiene la RNP AR APCH en los tramos inicial, intermedio y de frustrada?", "opts": ["Entre RNP 1 y 0,1", "Entre RNP 0,3 y 0,1", "Entre RNP 2 y 0,3", "Hasta RNP 0,3"], "ans": 0, "why": "En la aproximación final los valores son entre 0,3 y 0,1; «entre 2 y 0,3» es la A-RNP.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 51, "stem": "Según el manual, ¿qué función utiliza el guiado vertical final de la RNP AR APCH?", "opts": ["SBAS", "GBAS", "Baro-VNAV", "La senda de descenso del ILS"], "ans": 2, "why": "«El guiado vertical final utiliza función baro-VNAV.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 52, "stem": "Según el manual, ¿a qué operaciones se dirige principalmente la RNP 0.3?", "opts": ["Operaciones de helicópteros", "Travesías oceánicas", "Crucero en espacio aéreo continental", "Aproximaciones de precisión CAT I"], "ans": 0, "why": "«La especificación RNP 0.3 está principalmente dirigida a operaciones de helicópteros.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 53, "stem": "Según el manual, ¿en qué fase NO puede usarse la RNP 0.3?", "opts": ["En ruta", "En SID", "En STAR", "En la aproximación final"], "ans": 3, "why": "La RNP 0.3 puede usarse en ruta, SID, STAR y aproximación, «excepto aproximación final».", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 54, "stem": "Según el manual, ¿qué valores de RNP aplica la A-RNP (RNP avanzada)?", "opts": ["Valores entre 1 y 0,1, según el tramo", "Valores escalables entre 2 y 0,3, según la fase", "Un valor fijo de 4 en todas las fases", "Entre 0,3 y 0,1, solo en aproximación final"], "ans": 1, "why": "La A-RNP es una especificación universal que aplica valores de RNP diferentes y escalables, entre 2 y 0,3, según se use en ruta, SID, STAR o aproximación.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 55, "stem": "¿Qué dice el manual sobre el uso de la A-RNP (RNP avanzada) en la Unión Europea?", "opts": ["Es obligatoria en todas las fases", "Sustituye a la RNP 4 en espacio oceánico", "Solo se usa en aproximación en la UE", "No está previsto su uso en la UE"], "ans": 3, "why": "«No está previsto su uso en la Unión Europea.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 56, "stem": "Según la nota 1 a pie de página del manual, ¿qué es la función baro-VNAV?", "opts": ["Un sistema de navegación de reserva basado en referencias visuales", "Un sistema de aumentación basado en tierra", "Un modo del transpondedor que transmite la altitud", "Un sistema que proporciona guiado vertical a través de información baroaltimétrica"], "ans": 3, "why": "Nota 1: «Sistema que proporciona guiado vertical a través de información baroaltimétrica.»", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, nota 1, p. 13", "note": ""}, {"n": 57, "stem": "Según el manual, además de unas prestaciones en los equipos de a bordo, ¿qué pueden imponer los requisitos de las especificaciones PBN?", "opts": ["La instalación de radiobalizas en todas las pistas", "La presencia de radar primario en toda la ruta", "Limitaciones operacionales a los sistemas de apoyo que se utilicen", "Un segundo piloto certificado en navegación de área"], "ans": 2, "why": "El cumplimiento PBN afecta a todos los aspectos de la navegación: además de prestaciones en los equipos de a bordo, puede imponer limitaciones operacionales a los sistemas de apoyo o un nivel de precisión en los sistemas de referencia geográficos.", "src": "Manual 5 (nov. 2026), capítulo 3.1.2, p. 13", "note": ""}, {"n": 58, "stem": "¿Cuál de estas ventajas de la RNAV, la RNP y la PBN figura en el manual?", "opts": ["Mayor flexibilidad en el diseño de la red de rutas", "La eliminación de todos los errores de navegación", "La supresión de toda infraestructura terrestre de radioayudas", "La separación vertical reducida en todo el espacio aéreo"], "ans": 0, "why": "El manual cita tres beneficios: mayor flexibilidad en el diseño de la red de rutas, reducción de las distancias de vuelo y mejora de la eficiencia y la seguridad operacional.", "src": "Manual 5 (nov. 2026), capítulo 3.1.3, p. 14", "note": ""}, {"n": 59, "stem": "¿Cuál de los siguientes NO figura entre los beneficios de la RNAV, la RNP y la PBN que enumera el manual?", "opts": ["Reducción de las distancias de vuelo y de los costes operativos y medioambientales", "Mejora de la eficiencia y la seguridad operacional en las diferentes fases del vuelo", "Mayor flexibilidad en el diseño de la red de rutas", "Eliminación de la necesidad de equipos de a bordo certificados"], "ans": 3, "why": "Las otras tres son los tres beneficios del apartado 3.1.3.", "src": "Manual 5 (nov. 2026), capítulo 3.1.3, p. 14", "note": ""}, {"n": 60, "stem": "Según el manual, un sistema de ayuda a la navegación considerado «medio principal o primario» debe satisfacer:", "opts": ["Los requisitos de precisión e integridad, sin necesidad de cumplir los de disponibilidad y continuidad", "Los cuatro requisitos de prestación del sistema", "Los requisitos de disponibilidad y continuidad, sin necesidad de precisión", "Solo el requisito de precisión, y debe usarse con un medio único"], "ans": 0, "why": "Primario y suplementario: precisión e integridad; único: los cuatro; el suplementario además debe usarse junto con un medio único.", "src": "Manual 5 (nov. 2026), capítulo 3.2.2, p. 14", "note": ""}, {"n": 61, "stem": "Una ayuda a la navegación clasificada como «medio único» debe satisfacer, según el manual:", "opts": ["Solo la precisión y la integridad", "Los cuatro requisitos de prestación del sistema", "Solo la disponibilidad", "Los requisitos que fije cada piloto"], "ans": 1, "why": "Solo el medio único debe cumplir los cuatro requisitos; el primario y el suplementario, solo precisión e integridad.", "src": "Manual 5 (nov. 2026), capítulo 3.2.2, p. 14", "note": ""}, {"n": 62, "stem": "¿Con qué debe utilizarse una ayuda a la navegación de «medio suplementario»?", "opts": ["Con otro medio suplementario", "Con ningún otro sistema; funciona sola", "Juntamente con un sistema considerado como medio único", "Solo con un sistema hiperbólico"], "ans": 2, "why": "Es la diferencia entre el suplementario y el primario, que tienen los mismos requisitos (precisión e integridad).", "src": "Manual 5 (nov. 2026), capítulo 3.2.2, p. 14", "note": ""}, {"n": 63, "stem": "Según el manual, ¿qué define a un sistema de navegación «no autónomo»?", "opts": ["Un equipo de a bordo que calcula la información de navegación a partir de datos suministrados por una infraestructura externa a la aeronave", "Un equipo de a bordo que calcula la posición midiendo parámetros de vuelo y actitud sin infraestructura externa", "Un sistema cuya información de navegación la elabora el control de tránsito aéreo", "Un sistema basado únicamente en referencias visuales del terreno"], "ans": 0, "why": "La B es la definición de sistema autónomo.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 15", "note": ""}, {"n": 64, "stem": "En la clasificación por técnicas y elementos (apartado 3.2.3), ¿en qué dos grupos se dividen los sistemas no autónomos?", "opts": ["Radioayudas y visuales", "Terrestres y espaciales", "Primarios y suplementarios", "Cooperativos y no cooperativos"], "ans": 1, "why": "Los terrestres se subdividen en radioayudas y visuales; los espaciales son las constelaciones GNSS y los sistemas de aumentación. La tabla de la edición de noviembre de 2026 los rotula «A) TERRESTRES» y «B) ESPACIALES».", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, pp. 15-16", "note": ""}, {"n": 65, "stem": "¿Qué cuatro sistemas enumera el manual como tipos de sistemas terrestres «por radioayudas»?", "opts": ["NDB, VOR, DME e ILS", "PSR, SSR, MLAT y ADS", "GPS, GLONASS, Galileo y BeiDou", "PAPI, APAPI, T-VASIS y ALS"], "ans": 0, "why": "Son los tipos de la fila «Por radioayudas» de la tabla del apartado 3.2.3.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 15", "note": ""}, {"n": 66, "stem": "Según la tabla de clasificación, ¿en qué sistemas no autónomos terrestres no existe un dispositivo de a bordo específico, de modo que es el piloto quien interpreta la información?", "opts": ["Por radioayudas", "Espaciales", "Visuales", "Autónomos"], "ans": 2, "why": "En los visuales la infraestructura son agrupamientos de luces (disposición sobre el terreno y códigos de colores); sus tipos son los indicadores de pendiente de descenso y las luces de aproximación.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 15", "note": ""}, {"n": 67, "stem": "Según el manual, aparte de los satélites, todos los sistemas espaciales incluyen infraestructuras terrestres auxiliares, excepto:", "opts": ["Los de aumentación SBAS", "Los de aumentación GBAS", "Las constelaciones principales GNSS", "Los de aumentación ABAS"], "ans": 3, "why": "«Todos los sistemas espaciales (excepto los de aumentación ABAS) incluyen infraestructuras terrestres auxiliares.»", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 68, "stem": "Según el manual, ¿qué sistemas son la base de la implantación del concepto PBN?", "opts": ["Los sistemas espaciales o GNSS, en sus diferentes variantes", "Las radioayudas VOR y DME", "Los sistemas inerciales INS", "Los radares primario y secundario"], "ans": 0, "why": "Los sistemas GNSS (constelaciones básicas más sistemas de aumentación) «son la base de la implantación del concepto PBN».", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 69, "stem": "Según el manual, ¿de cuántos satélites debe recibir señales simultáneamente el equipo de a bordo para proporcionar al piloto datos de posición y guiado?", "opts": ["De 2 o más", "De 3 o más", "De 4 o más", "De 6 o más"], "ans": 2, "why": "«Cuando las recibe simultáneamente de 4 satélites o más, puede proporcionar al piloto los datos de posición y guiado.»", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 70, "stem": "Según el manual, ¿qué incluyen todos los receptores GNSS certificados en aeronaves para alcanzar los requisitos de prestaciones mínimos de la OACI?", "opts": ["Un receptor GBAS para la aproximación", "Sistemas de aumentación ABAS integrados", "Un receptor SBAS obligatorio en ruta", "Una plataforma inercial de respaldo"], "ans": 1, "why": "«Todos los receptores certificados GNSS en aeronaves … incluyen sistemas de aumentación ABAS integrados.»", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 71, "stem": "¿Qué constelación principal GNSS asocia el manual a China?", "opts": ["GLONASS", "Galileo", "GPS", "BeiDou / BDS"], "ans": 3, "why": "GPS (EE. UU.), GLONASS (Rusia), Galileo (Unión Europea) y BeiDou / BDS (China).", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 72, "stem": "Entre los sistemas SBAS que destaca el manual, ¿cuál corresponde a la India?", "opts": ["MSAS", "WAAS", "EGNOS", "GAGAN"], "ans": 3, "why": "WAAS (EE. UU.), EGNOS (Unión Europea), MSAS (Japón) y GAGAN (India).", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 17", "note": ""}, {"n": 73, "stem": "Según el manual, en un sistema SBAS, ¿cómo se envían a las aeronaves las correcciones y la información de integridad?", "opts": ["Mediante satélites en órbita geoestacionaria (GEO)", "Mediante radiodifusión de datos en VHF (VDB) desde el aeropuerto", "Mediante las estaciones DME de la ruta", "Mediante el enlace de datos de modo S"], "ans": 0, "why": "El SBAS calcula correcciones con una red de estaciones de referencia terrestres y las envía por satélites GEO; la VDB es del GBAS.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 17", "note": ""}, {"n": 74, "stem": "Según el manual, ¿qué transmite la estación GBAS a las aeronaves en el área terminal?", "opts": ["Correcciones de pseudodistancia, parámetros de integridad y datos de definición de aproximaciones", "Interrogaciones de modo S para obtener la identificación de las aeronaves", "Correcciones de alcance regional enviadas por satélites geoestacionarios", "Una señal horaria para sincronizar el reloj de los receptores"], "ans": 0, "why": "La estación, situada en el aeropuerto, monitoriza una constelación GNSS y transmite esos datos, localmente pertinentes, por radiodifusión de datos en VHF (VDB).", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 17", "note": ""}, {"n": 75, "stem": "En la definición de sistemas autónomos, ¿qué llama el manual «actitud» de una aeronave?", "opts": ["Su altitud respecto al nivel medio del mar", "Su rumbo magnético en un instante dado", "Su posición respecto a sus ejes principales", "Su velocidad respecto al suelo"], "ans": 2, "why": "«Se denomina actitud de una aeronave a su posición respecto a sus ejes principales.»", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 18", "note": ""}, {"n": 76, "stem": "¿Qué dos sistemas enumera el manual como sistemas de navegación «autónomos»?", "opts": ["VOR y NDB", "GBAS y SBAS", "PSR y SSR", "Radar Doppler y equipos inerciales (INS)"], "ans": 3, "why": "Son los dos tipos de la fila «Sistemas autónomos» de la tabla.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 18", "note": ""}, {"n": 77, "stem": "Según el manual, ¿dónde se suelen utilizar los sistemas autónomos?", "opts": ["En zonas donde no existe la cobertura de otro tipo de ayudas", "Solo en la aproximación final a pistas con ILS", "Solo en áreas terminales con radar", "Solo en el área de movimiento de los aeropuertos"], "ans": 0, "why": "Al no requerir infraestructura externa, estos sistemas de altas prestaciones se suelen usar donde no hay cobertura de otras ayudas.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 18", "note": ""}, {"n": 78, "stem": "Según el manual, ¿qué proporciona el NDB (radiofaro no direccional) a una aeronave debidamente equipada?", "opts": ["Guiado horizontal y vertical de precisión", "Solo la distancia oblicua a la estación", "Guiado horizontal, es decir, rumbos", "La posición en latitud y longitud"], "ans": 2, "why": "«Proporciona a una aeronave debidamente equipada guiado horizontal, es decir, rumbos.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.1, p. 18", "note": ""}, {"n": 79, "stem": "Según el manual, ¿cómo se define la marcación que obtiene la aeronave con el sistema NDB?", "opts": ["Por la desviación de su eje longitudinal respecto al eje aeronave-estación", "Por el radial magnético de la estación en que se encuentra la aeronave", "Por la diferencia de tiempos de llegada de las señales de dos estaciones", "Por la distancia oblicua entre la aeronave y la estación"], "ans": 0, "why": "La señal de la estación se capta a bordo y se obtiene «una marcación definida por la desviación de su eje longitudinal respecto al eje aeronave-estación».", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.1, p. 18", "note": ""}, {"n": 80, "stem": "Según el manual, ¿cómo emite su señal el equipo de tierra del NDB?", "opts": ["De forma direccional, en un haz estrecho orientado a la ruta", "De forma omnidireccional, a los 360º", "Solo hacia la aeronave que lo interroga", "A través de un satélite repetidor"], "ans": 1, "why": "Un transmisor convencional emite una señal omnidireccional; la información se envía a los 360º.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.2, p. 19", "note": ""}, {"n": 81, "stem": "Según el apartado 3.3.1.3, ¿qué es el ADF?", "opts": ["El equipo antena/receptor de a bordo que procesa la señal NDB y la presenta en un indicador", "El transmisor terrestre del sistema NDB", "Una de las radiobalizas del ILS", "Un sistema de aumentación por satélite"], "ans": 0, "why": "El ADF es el componente de a bordo del sistema NDB. (El texto del apartado lo glosa como «Radiofaro no direccional»; la lista de acrónimos, como «Equipo radiogoniométrico automático».)", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.3, p. 19", "note": ""}, {"n": 82, "stem": "Según la lista de acrónimos del manual (capítulo 5), ¿qué significa ADF?", "opts": ["Radiofaro no direccional", "Indicador radiomagnético", "Equipo radiogoniométrico automático", "Equipo medidor de distancia"], "ans": 2, "why": "La lista de acrónimos da «Equipo radiogoniométrico automático / Automatic direction-finding equipment». El texto del apartado 3.3.1.3 lo glosa como «Radiofaro no direccional», que es el significado de NDB.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 83, "stem": "Para volar HACIA una estación NDB, según el manual, el piloto debe:", "opts": ["Virar hacia el mismo lado que indica la aguja, hasta que la cabeza de la aguja quede alineada con la proa del avión del indicador", "Virar hacia el lado contrario al que indica la aguja, hasta que la cola de la aguja quede alineada con la proa", "Maniobrar hasta que la cabeza de la aguja quede alineada con la cola del avión del indicador", "Mantener la aguja perpendicular al eje del avión del indicador"], "ans": 0, "why": "La C es el procedimiento para alejarse de la estación.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 19", "note": ""}, {"n": 84, "stem": "Para ALEJARSE de una estación NDB, según el manual, el piloto debe maniobrar de modo que:", "opts": ["La cabeza de la aguja se alinee con la proa del avión del indicador", "La aguja quede perpendicular al eje longitudinal del avión", "El indicador TO/FROM pase a FROM", "La cabeza de la aguja se alinee con la cola del avión del indicador"], "ans": 3, "why": "Hacia la estación, cabeza con la proa; desde la estación, cabeza con la cola. El indicador TO/FROM es del VOR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 19", "note": ""}, {"n": 85, "stem": "Según el manual, ¿cómo conoce el piloto la frecuencia de la estación NDB que sintoniza en el ADF?", "opts": ["A través de la carta de navegación", "Se la comunica el controlador en cada caso", "La selecciona el ADF automáticamente", "Por la identificación del radar secundario"], "ans": 0, "why": "El piloto sintoniza la frecuencia, «la cual conoce a través de la carta de navegación»; tras confirmar el indicativo, la información de guiado le llega por un indicador visual.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 19", "note": ""}, {"n": 86, "stem": "¿Qué indicador del ADF tiene una rosa de rumbos fija, con el cero alineado con el eje longitudinal del símbolo del avión?", "opts": ["RMI", "CDI", "RBI", "HSI"], "ans": 2, "why": "El RBI tiene rosa fija; su aguja marca la dirección de procedencia de la señal NDB respecto al eje longitudinal del avión. El RMI tiene rosa móvil.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 20", "note": ""}, {"n": 87, "stem": "¿Qué indicador combina la indicación de rumbo de la aeronave con la aguja del ADF mediante una rosa de rumbos móvil?", "opts": ["RBI", "RMI", "CDI", "OBS"], "ans": 1, "why": "El RMI (indicador radiomagnético) tiene una rosa que gira con el avión y siempre indica su rumbo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 20", "note": ""}, {"n": 88, "stem": "En el ejemplo del RMI que da el manual, ¿qué rumbo de la aeronave indica la rosa y qué rumbo marca la aguja para ir a la estación NDB?", "opts": ["Rumbo de la aeronave 170º; aguja 240º", "Rumbo de la aeronave 240º; aguja 060º", "Rumbo de la aeronave 060º; aguja 350º", "Rumbo de la aeronave 240º; aguja 170º"], "ans": 3, "why": "«… indique el rumbo de la aeronave (240º) y la aguja del indicador marcará el rumbo que debería seguir la aeronave para ir a la estación NDB (170º).»", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.4, p. 20", "note": ""}, {"n": 89, "stem": "Según el manual, ¿en qué banda de frecuencias trabaja el NDB?", "opts": ["VHF", "UHF", "LF-MF", "Banda X"], "ans": 2, "why": "«La banda de frecuencias en la que trabaja este sistema es LF-MF (baja-media frecuencia).»", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.5, p. 21", "note": ""}, {"n": 90, "stem": "Según el manual, ¿de qué depende principalmente el alcance de un NDB?", "opts": ["De la altura de la antena del transmisor", "Del número de aeronaves que lo sintonizan", "De la frecuencia con la que se emita la señal", "De que haya línea de vista con la aeronave"], "ans": 2, "why": "Depende principalmente de la frecuencia; también influyen la potencia de transmisión y las condiciones atmosféricas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.5, p. 21", "note": ""}, {"n": 91, "stem": "Según el manual, en condiciones normales de propagación de la señal NDB, el margen de error del ADF no es superior a:", "opts": ["± 5º", "± 1º", "± 2º", "± 10º"], "ans": 0, "why": "El error no supera ± 5º, pero la señal LF-MF se ve fácilmente interferida por las condiciones atmosféricas, las señales de radio comerciales o las corrientes estáticas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.5, p. 21", "note": ""}, {"n": 92, "stem": "Según el manual, ¿en qué tipo de aproximaciones instrumentales se emplea el NDB?", "opts": ["De precisión CAT I", "De no precisión", "De precisión CAT II/III", "Con guiado vertical APV SBAS"], "ans": 1, "why": "Como solo da guiado horizontal, su aplicación va de la navegación en ruta continental a la aproximación de no precisión.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.5, p. 21", "note": ""}, {"n": 93, "stem": "Según la nota 2 a pie de página, ¿cómo se usa hoy el NDB?", "opts": ["Como sistema principal de navegación en ruta continental y oceánica", "Solo en aproximaciones de precisión, siempre con un DME coemplazado", "Casi solo en apoyo a aproximaciones y salidas, y como alternativa para evitar radioayudas críticas", "Solo en la navegación oceánica, donde no llegan las radioayudas VHF"], "ans": 2, "why": "Es el texto de la nota 2.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.5, nota 2, p. 21", "note": ""}, {"n": 94, "stem": "Según el manual, ¿qué proporciona el VOR?", "opts": ["Información de la distancia oblicua entre la aeronave y la estación", "Información de guiado vertical de precisión hasta la altura de decisión", "Información de guiado horizontal (rumbos) respecto a una línea de situación magnética", "Información de posición en latitud y longitud respecto a la estación"], "ans": 2, "why": "El VOR da guiado horizontal referido a líneas de situación magnética (radiales).", "src": "Manual 5 (nov. 2026), capítulo 3.3.2, p. 21", "note": ""}, {"n": 95, "stem": "Según la figura de los radiales VOR del manual, ¿con qué está alineado el radial 0º?", "opts": ["Con el Norte Magnético", "Con el Norte geográfico", "Con el eje de la pista principal", "Con el Norte de cuadrícula"], "ans": 0, "why": "La figura rotula «Radial 0º. Alineado con el Norte Magnético»; los radiales son líneas de situación magnética.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.1, figura, p. 22", "note": ""}, {"n": 96, "stem": "Según la figura de los radiales VOR, ¿qué resolución ofrece en realidad el VOR?", "opts": ["Un radial cada 10 grados", "Un radial cada 5 grados", "Un radial cada 0,25 grados", "Un radial cada grado"], "ans": 3, "why": "La figura indica: «En realidad la resolución que se ofrece es un radial cada grado.» 0,25 grados es la resolución en acimut del SMR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.1, figura, p. 22", "note": ""}, {"n": 97, "stem": "¿Cuál de las siguientes NO figura entre las informaciones que, según el manual, obtiene el equipo de a bordo VOR?", "opts": ["El radial de posición de la aeronave", "La posición relativa de la aeronave respecto al radial", "La posición relativa de la aeronave respecto a la estación", "La distancia oblicua a la estación"], "ans": 3, "why": "El manual enumera a, b y c (las tres primeras opciones); la distancia oblicua la da el DME.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.1, p. 22", "note": ""}, {"n": 98, "stem": "En la figura de la información transmitida por el sistema VOR, ¿qué indicación recibe una aeronave situada a la izquierda del curso?", "opts": ["Indicación de volar a la izquierda", "Indicación de volar a la derecha", "Indicación en alejamiento «FROM»", "Indicación de mantener el rumbo"], "ans": 1, "why": "La figura rotula: «Aeronave a la izquierda del curso; indicación de volar a la derecha» y «Aeronave a la derecha del curso; indicación de volar a la izquierda».", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.1, figura, p. 23", "note": ""}, {"n": 99, "stem": "Según el manual, ¿cómo es el código de identificación de una estación VOR?", "opts": ["Un tono de audio de tres letras en Morse", "Dos o tres letras en Morse emitidas mediante un tono de audio", "Un código de cuatro dígitos del transpondedor", "Una luz azul parpadeante a bordo"], "ans": 0, "why": "VOR: tono de audio de tres letras en Morse. DME: dos o tres letras en Morse (la B).", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.2, p. 23", "note": ""}, {"n": 100, "stem": "En la figura del indicador VOR del manual, ¿qué elemento se rotula como «Selector de Radiales»?", "opts": ["El CDI", "El indicador TO/FROM", "La regla giratoria", "El OBS"], "ans": 3, "why": "La figura rotula OBS = Selector de Radiales; CDI = Indicador de Desviación de Curso; la regla giratoria da el rumbo magnético de la aeronave.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.3, figura, p. 24", "note": ""}, {"n": 101, "stem": "Según el manual, ¿qué muestra el CDI del indicador VOR?", "opts": ["La distancia oblicua de la aeronave a la estación sintonizada", "El rumbo magnético de la aeronave, mediante una rosa giratoria", "Si la aeronave vuela hacia (TO) o desde (FROM) la estación terrestre", "Mando: lo que debe hacer el piloto para mantenerse sobre el radial seleccionado"], "ans": 3, "why": "El CDI indica mando (aguja centrada = sobre el radial); la C es el indicador TO/FROM.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.3, p. 24", "note": ""}, {"n": 102, "stem": "Al seleccionar un radial con el OBS, ¿en qué se divide el plano de situación horizontal?", "opts": ["En dos semiplanos solamente", "En cuatro cuadrantes", "En ocho sectores", "En un único sector"], "ans": 1, "why": "«Cuando se realiza esta operación, el plano de situación horizontal se divide en cuatro cuadrantes.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 25", "note": ""}, {"n": 103, "stem": "El indicador TO/FROM del VOR marca FROM cuando la aeronave está:", "opts": ["Justo sobre la estación, únicamente", "En el semiplano que contiene la prolongación del radial seleccionado", "Fuera de la cobertura del VOR", "En el semiplano que contiene el radial seleccionado, independientemente del rumbo"], "ans": 3, "why": "FROM = semiplano del radial seleccionado; TO = semiplano de su prolongación; en ambos casos con independencia del rumbo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 25", "note": ""}, {"n": 104, "stem": "Según el manual, ¿cuándo aparece TO en la ventanilla del indicador VOR?", "opts": ["Cuando está en el semiplano que contiene la prolongación del radial seleccionado", "Cuando la aeronave está en el semiplano que contiene el radial seleccionado", "Solo cuando la proa de la aeronave apunta hacia la estación", "Solo cuando la aeronave está sobre la vertical de la estación"], "ans": 0, "why": "TO aparece cuando el receptor está en cualquier punto del semiplano que contiene la prolongación del radial seleccionado, independientemente del rumbo; la B corresponde a FROM.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 25", "note": ""}, {"n": 105, "stem": "Según el manual, ¿cómo queda reflejado el paso de la aeronave por la estación VOR?", "opts": ["Por el cambio en el indicador TO/FROM", "Por el centrado de la aguja del CDI", "Por una luz azul parpadeante", "Por el tono Morse de la estación"], "ans": 0, "why": "«El paso por la estación queda reflejado por el cambio en el indicador TO/FROM.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 25", "note": ""}, {"n": 106, "stem": "Según el manual, ¿qué determina la indicación del CDI?", "opts": ["El semiplano de situación de la aeronave", "El radial de posición de la aeronave", "El cuadrante de situación, dentro del semiplano de situación", "La distancia de la aeronave a la estación"], "ans": 2, "why": "TO-FROM determina el semiplano; el CDI, el cuadrante dentro de ese semiplano, con independencia del rumbo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 26", "note": ""}, {"n": 107, "stem": "Al volar HACIA una estación VOR (radiales de acercamiento), ¿qué relación hay entre la ruta magnética (Rm) y el radial (RDL)?", "opts": ["Rm = RDL", "Rm = RDL + 180º", "Rm = RDL - 90º", "Rm = RDL + 90º"], "ans": 1, "why": "Hacia la estación (TO) la diferencia es de 180º; desde la estación (FROM) coinciden.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 27", "note": ""}, {"n": 108, "stem": "En el ejemplo del manual, una aeronave vuela con RDL-090 hacia la estación VOR. ¿Cuál es su ruta magnética?", "opts": ["090º", "180º", "000º", "270º"], "ans": 3, "why": "Rm = RDL + 180º = 090º + 180º = 270º.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, figura, p. 27", "note": ""}, {"n": 109, "stem": "Al volar DESDE una estación VOR (radiales de alejamiento), ¿qué relación hay entre la ruta magnética y el radial?", "opts": ["Rm = RDL + 180º", "Rm = RDL - 180º", "Rm = RDL (coinciden)", "No hay una relación fija"], "ans": 2, "why": "En alejamiento (FROM) la ruta magnética y el radial coinciden.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, p. 28", "note": ""}, {"n": 110, "stem": "En el ejemplo del manual, una aeronave vuela con RDL-342 desde la estación VOR. ¿Cuál es su ruta magnética?", "opts": ["162º", "342º", "252º", "072º"], "ans": 1, "why": "Desde la estación, Rm = RDL = 342º.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, figura, p. 28", "note": ""}, {"n": 111, "stem": "¿Cuál es el alcance nominal del VOR que indica el manual?", "opts": ["Unas 20 NM", "Unas 200 NM", "Unas 60 NM", "Unas 500 NM"], "ans": 1, "why": "Sistema de corto y medio alcance «con valores nominales de unas 200 NM» (el DME también tiene unas 200 NM).", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.5, p. 28", "note": ""}, {"n": 112, "stem": "Según el manual, ¿en qué fases de vuelo se utiliza el VOR?", "opts": ["En ruta, llegada, salida y aproximación", "Solo en ruta oceánica", "Solo en la aproximación de precisión", "Solo en ruta y salida"], "ans": 0, "why": "«… utilizado para las fases de vuelo en ruta, llegada, salida y aproximación.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.5, p. 28", "note": ""}, {"n": 113, "stem": "Según el manual, ¿qué ventaja y qué inconveniente tiene la banda VHF en la que trabaja el VOR?", "opts": ["No le afectan las interferencias estáticas ni las perturbaciones atmosféricas, pero necesita línea de vista", "Tiene alcance ilimitado, pero le afectan mucho las interferencias estáticas", "No necesita línea de vista, pero le afectan las perturbaciones atmosféricas", "No le afectan los obstáculos, pero sí las señales de radio comerciales"], "ans": 0, "why": "La necesidad de línea de vista originó el desarrollo del DVOR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.5, p. 28", "note": ""}, {"n": 114, "stem": "En comparación con el VOR convencional (CVOR), ¿qué es cierto del DVOR (VOR Doppler), según el manual?", "opts": ["Mismas frecuencias y equipo de a bordo, pero mejor señal con obstáculos", "Usa frecuencias de transmisión distintas y un equipo de a bordo distinto", "Da la misma información, pero con un equipo de a bordo específico", "Usa las mismas técnicas de transmisión, pero en la banda UHF"], "ans": 0, "why": "El DVOR se basa en el mismo principio pero usa técnicas de transmisión diferentes; mismas frecuencias, mismo equipo de a bordo y misma información, con mejores prestaciones y menos errores de precisión.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.5, p. 28", "note": ""}, {"n": 115, "stem": "Según el manual, ¿qué mide el DME?", "opts": ["La distancia horizontal a la estación", "La velocidad vertical", "La distancia oblicua a la estación", "El rumbo de la aeronave"], "ans": 2, "why": "El DME proporciona la distancia oblicua, no la horizontal.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3, p. 29", "note": ""}, {"n": 116, "stem": "En el sistema DME, ¿cómo denomina el manual a la estación de tierra y al equipo de a bordo?", "opts": ["Tierra = interrogador; aeronave = transpondedor", "Tierra = transpondedor; aeronave = interrogador", "Ambos se denominan transpondedores", "Ambos se denominan interrogadores"], "ans": 1, "why": "Al revés que en el SSR, donde el transpondedor va a bordo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.1, p. 29", "note": ""}, {"n": 117, "stem": "Según el manual, ¿cómo se calcula la distancia DME?", "opts": ["A partir del desplazamiento de frecuencia Doppler", "Por triangulación con dos estaciones terrestres", "A partir de la altitud barométrica", "Con el tiempo de ida y vuelta de la señal"], "ans": 3, "why": "El cálculo se realiza con el tiempo que emplea la señal en hacer el viaje de ida y vuelta; la información se obtiene automáticamente en millas náuticas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.1, p. 29", "note": ""}, {"n": 118, "stem": "Según el manual, ¿cómo es la identificación de una estación DME?", "opts": ["Tres letras en Morse, siempre", "Cuatro letras en Morse", "Dos o tres letras en Morse, con un tono de audio", "Un código de transpondedor de cuatro dígitos"], "ans": 2, "why": "DME: dos o tres letras codificadas en Morse emitidas mediante un tono de audio; VOR: tres letras.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.2, p. 30", "note": ""}, {"n": 119, "stem": "Según el manual, ¿a cuántos usuarios puede servir una estación DME?", "opts": ["A un número determinado, que depende del tipo y de las características operacionales de la instalación", "A un número ilimitado, porque cada aeronave calcula la distancia por sí misma", "A una sola aeronave a la vez, que debe liberar la estación al terminar", "A un máximo de dos aeronaves por frecuencia, una en cada sentido"], "ans": 0, "why": "«La estación DME sólo puede servir a un número determinado de usuarios, aunque dependerá del tipo y de las características operacionales de la instalación.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.2, p. 30", "note": ""}, {"n": 120, "stem": "Según el manual, ¿sirve el DME por sí solo para la navegación?", "opts": ["No: no proporciona ni radiales ni rumbos, solo distancias", "Sí: proporciona radiales y rumbos", "Solo por encima de 10 000 ft", "Solo si se combina con un NDB"], "ans": 0, "why": "«No sirve para la navegación, no proporciona ni radiales ni rumbos, solo distancias.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.3, p. 30", "note": ""}, {"n": 121, "stem": "Según el manual, la línea de vista que requiere el DME limita:", "opts": ["La cobertura a ángulos altos y el alcance a unas 60 NM", "La cobertura a ángulos bajos y el alcance a unas 20 NM", "La cobertura a ángulos bajos y el alcance a unas 200 NM", "La cobertura a ángulos altos y el alcance a unas 500 NM"], "ans": 2, "why": "«… lo cual limita la cobertura a ángulos bajos y el alcance a unas 200 NM.» Como ventaja, no le influyen las interferencias atmosféricas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.5, p. 31", "note": ""}, {"n": 122, "stem": "¿Qué instalación coemplazada describe el manual como «la más típica»?", "opts": ["NDB/DME", "ILS/DME", "VOR/NDB", "VOR/DME"], "ans": 3, "why": "El VOR/DME materializa puntos en el espacio mediante la intersección de un radial y una distancia.", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.5, p. 31", "note": ""}, {"n": 123, "stem": "Según el manual, ¿qué se dice de la instalación NDB/DME en comparación con la VOR/DME?", "opts": ["Aplicación similar, con menores prestaciones y menos instalaciones", "Tiene mejores prestaciones y es la más numerosa", "Solo se usa en aproximaciones de precisión", "Sustituye al ILS/DME en la aproximación final"], "ans": 0, "why": "«Su aplicación es similar a la del VOR/DME aunque las prestaciones son menores. Es una instalación que se presenta en menor número que la anterior.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.5, p. 31", "note": ""}, {"n": 124, "stem": "Según el manual, ¿cómo se usan los equipos DME de forma individual en la navegación basada en prestaciones (PBN)?", "opts": ["Una sola estación da una posición completa en tres dimensiones", "El DME no puede usarse para la PBN", "Solo en combinación con un NDB coemplazado", "Sintonizando a la vez dos o más estaciones y triangulando"], "ans": 3, "why": "«… para la que es necesaria sintonizar simultáneamente dos o más estaciones y realizar triangulación con ellas.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.3.5, p. 32", "note": ""}, {"n": 125, "stem": "Según el manual, ¿qué información proporciona el ILS?", "opts": ["Guiado de precisión horizontal y vertical en aproximación y aterrizaje", "Solo guiado horizontal en ruta y aproximación", "Solo la distancia al umbral de la pista", "Guiado horizontal y vertical en todas las fases del vuelo"], "ans": 0, "why": "Información de precisión para guiado horizontal y vertical en la fase de aproximación y aterrizaje. El guiado es de azimut (dirección) y de trayectoria de planeo (descenso), hasta los mínimos de cada categoría.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4, p. 32", "note": ""}, {"n": 126, "stem": "¿Cuál de los siguientes NO es uno de los tres componentes terrestres del ILS que enumera el apartado 3.3.4.2?", "opts": ["Localizador (LOC)", "Senda de descenso (GP)", "Radiobalizas (OM, IM, MM)", "Radiofaro omnidireccional (VOR)"], "ans": 3, "why": "Los tres componentes son LOC, GP y radiobalizas; el ILS puede estar coemplazado con un VOR o un DME, pero no son componentes suyos.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 32", "note": ""}, {"n": 127, "stem": "Según el manual, ¿qué ha sustituido al sistema de radiobalizas del ILS?", "opts": ["Un segundo localizador", "Un DME coemplazado con la senda de planeo", "Un sistema PAPI", "Un VOR situado en el umbral"], "ans": 1, "why": "El DME da información constante de distancia al umbral.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, pp. 32 y 34", "note": ""}, {"n": 128, "stem": "Según la figura del emplazamiento de los equipos de tierra del ILS (dimensiones aproximadas), ¿a qué distancia del umbral está la radiobaliza exterior (OM)?", "opts": ["1.050 m", "75-450 m", "3,9 NM", "300 m"], "ans": 2, "why": "Figura: IM a 75-450 m, MM a 1.050 m y OM a 3,9 NM del umbral.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, figura, p. 32", "note": ""}, {"n": 129, "stem": "Según la misma figura, ¿a qué distancia del umbral está la radiobaliza intermedia (MM)?", "opts": ["3,9 NM", "1.050 m", "75-450 m", "120 m"], "ans": 1, "why": "La interior (IM) está a 75-450 m y la exterior (OM) a 3,9 NM.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, figura, p. 32", "note": ""}, {"n": 130, "stem": "Según la figura del emplazamiento de los equipos de tierra del ILS, ¿dónde se sitúa la antena de la senda de descenso (GP)?", "opts": ["Unos 300 m más allá del extremo de pista opuesto a la aproximación, en el eje", "A 1.050 m antes del umbral, en la prolongación del eje", "A 3,9 NM del umbral, en la prolongación del eje", "A unos 300 m del umbral hacia el interior de la pista y desplazada unos 120 m del eje"], "ans": 3, "why": "La A es el emplazamiento del localizador (LOC); la B y la C, de las radiobalizas MM y OM.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, figura, p. 32", "note": ""}, {"n": 131, "stem": "Según la misma figura, ¿dónde se sitúa el localizador (LOC)?", "opts": ["A unos 300 m del umbral y desplazado 120 m del eje", "A unos 300 m más allá del extremo de pista opuesto a la aproximación", "Entre 75 y 450 m antes del umbral", "Junto a la radiobaliza exterior"], "ans": 1, "why": "El LOC está en la prolongación del eje, unos 300 m tras el extremo de pista; la A es la senda de descenso y la C la radiobaliza interior.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, figura, p. 32", "note": ""}, {"n": 132, "stem": "Según el manual, ¿con qué pendiente aproximada desciende el avión guiado por el ILS?", "opts": ["Unos 3º, aunque no necesariamente", "Exactamente 5º, fijados por norma", "Unos 1º, para reducir el ruido", "Exactamente 3º, sin excepciones"], "ans": 0, "why": "«… descienda con una pendiente aproximada de 3º (pero no necesariamente).»", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 33", "note": ""}, {"n": 133, "stem": "Según el manual, ¿qué tipo de plano materializan las señales del localizador (LOC)?", "opts": ["Un plano oblicuo que nace de la zona de toma de contacto", "Un plano horizontal a la altura de decisión", "Un cono invertido sobre la radiobaliza", "Un plano vertical que permite mantenerse alineado con el eje de pista"], "ans": 3, "why": "LOC: plano vertical (alineación con el eje). GP: plano oblicuo (la A).", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 33", "note": ""}, {"n": 134, "stem": "Según el manual, ¿qué línea de color del indicador refleja las desviaciones a derecha o izquierda respecto al localizador del ILS?", "opts": ["Azul", "Roja", "Verde", "Ámbar"], "ans": 0, "why": "LOC: línea azul; senda de descenso: línea roja.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 33", "note": ""}, {"n": 135, "stem": "La senda de descenso del ILS materializa un plano oblicuo que nace de:", "opts": ["La antena del localizador", "El extremo lejano de la pista", "El emplazamiento de la radiobaliza exterior", "La zona de toma de contacto de la pista"], "ans": 3, "why": "El plano oblicuo nace de la zona de toma de contacto, con un ángulo aproximado de tres grados.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 33", "note": ""}, {"n": 136, "stem": "Según el manual, ¿qué es el umbral de la pista, al que dan distancia las radiobalizas?", "opts": ["El final de
