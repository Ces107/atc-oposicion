uda a la navegación aprobado para una determinada operación o fase de vuelo que debe utilizarse juntamente con un sistema considerado como medio único». El manual solo clasifica en primario, único y suplementario. El examen real de 2017 dio esta definición y pidió el término.", "src": "Manual 5 (nov. 2026), capítulo 3.2.2, p. 14", "note": ""}, {"n": 297, "stem": "¿En qué banda de frecuencias trabaja el VOR?", "opts": ["LF-MF", "UHF", "VHF", "Banda L"], "ans": 2, "why": "«La banda de frecuencias en la que trabaja (VHF)» no está afectada por interferencias estáticas, pero necesita línea de vista. El NDB trabaja en LF-MF, la senda de descenso del ILS en UHF y el PSR en las bandas L y S. El examen real de 2017 preguntó la banda del VOR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.5, p. 28", "note": ""}, {"n": 298, "stem": "En la clasificación por técnicas y elementos, el GLONASS es un sistema:", "opts": ["no autónomo terrestre por radioayudas", "no autónomo espacial", "autónomo", "no autónomo terrestre visual"], "ans": 1, "why": "En la tabla del apartado 3.2.3, los sistemas no autónomos «B) ESPACIALES» incluyen las constelaciones principales GNSS: GPS (EE. UU.), GLONASS (Rusia), Galileo (Unión Europea) y BeiDou / BDS (China). Los autónomos son el radar Doppler y los INS; las radioayudas terrestres, NDB, VOR, DME e ILS. El examen real de 2017 preguntó este dato.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 16", "note": ""}, {"n": 299, "stem": "¿Qué transmite la estación de tierra del VOR?", "opts": ["Señales electromagnéticas que generan un haz de líneas de situación magnética", "Una señal de navegación omnidireccional, desde un transmisor convencional", "Las señales recibidas del avión, devueltas para que este calcule la distancia", "Señales que materializan un plano vertical alineado con el eje de la pista"], "ans": 0, "why": "«La estación de tierra transmite un conjunto de señales electromagnéticas de navegación que generan un haz de líneas de situación magnética (radiales)». B describe el equipo de tierra del NDB, C el del DME y D el localizador del ILS. El examen real de 2017 preguntó este dato con esos mismos tipos de distractor.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.1, p. 22", "note": ""}, {"n": 300, "stem": "¿Cómo se llama la función de navegación en la que el piloto debe conocer, en todo momento, la situación de la aeronave respecto a la ruta establecida?", "opts": ["Función de guiado", "Función de vigilancia", "Función de posicionamiento", "Función de seguimiento de ruta"], "ans": 2, "why": "Las dos funciones principales de la navegación son la de posicionamiento («conocer, en todo momento, la situación de la aeronave respecto a la ruta establecida») y la de guiado («dirigir convenientemente la aeronave, con objeto de mantener la ruta establecida»). El examen real de 2017 dio la definición y pidió el nombre.", "src": "Manual 5 (nov. 2026), capítulo 2.3, p. 7", "note": ""}, {"n": 301, "stem": "Los sistemas no autónomos espaciales son aquellos:", "opts": ["cuya infraestructura externa a la aeronave incluye satélites", "cuya infraestructura externa está constituida exclusivamente por estaciones terrestres fijas", "que calculan la posición midiendo directamente parámetros de vuelo y actitud", "cuya infraestructura externa son agrupamientos de luces con códigos de colores"], "ans": 0, "why": "«B) ESPACIALES. Definición: Aquellos cuya infraestructura externa a la aeronave incluye satélites». B define las radioayudas terrestres, C los sistemas autónomos y D los sistemas visuales. El examen real de 2017 pidió esta definición.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, pp. 15-16", "note": ""}, {"n": 302, "stem": "¿Qué sistemas dan al piloto información visual para la aproximación, relacionada con la altura de decisión y la posición respecto al eje y la cabecera de pista?", "opts": ["Los sistemas PAPI y APAPI", "Los sistemas visuales indicadores de pendiente de aproximación", "Las radiobalizas del ILS", "Los sistemas de luces de aproximación (ALS)"], "ans": 3, "why": "«Los sistemas de luces de aproximación (ALS / Approach Lighting System) proporcionan al piloto información visual para la fase de aproximación, relacionada con la altura de decisión y la posición de la aeronave respecto al eje y cabecera de pista». Los indicadores de pendiente (PAPI, APAPI) dan una guía de descenso visual. El examen real de 2017 dio la definición y pidió el sistema.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, p. 42", "note": ""}, {"n": 303, "stem": "¿Qué significa PBN?", "opts": ["Navegación de precisión basada en balizas", "Navegación basada en la performance", "Procedimiento básico de navegación", "Navegación basada en el posicionamiento"], "ans": 1, "why": "Lista de acrónimos: «PBN Navegación basada en la performance / Performance-based navigation». Es el concepto de la OACI que engloba las especificaciones RNAV y RNP.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 70", "note": ""}, {"n": 304, "stem": "En la lista de acrónimos del manual, ¿qué significa TSE?", "opts": ["Rumbo verdadero", "Velocidad respecto al suelo", "Selector de radial", "Precisión de navegación lateral"], "ans": 3, "why": "«TSE Precisión de navegación lateral». La «X» de RNAV X o RNP X es esa precisión lateral, en NM, que se espera lograr al menos el 95 % del tiempo de vuelo. Rumbo verdadero es THDG, velocidad respecto al suelo GS y selector de radial OBS.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 70; capítulo 3.1.2, p. 12", "note": ""}, {"n": 305, "stem": "En la lista de acrónimos del manual, ¿qué significa GS?", "opts": ["Velocidad respecto al suelo", "Senda de planeo", "Velocidad indicada", "Segmento terrestre GNSS"], "ans": 0, "why": "«GS Velocidad respecto al suelo / Ground speed»; el INS la obtiene al integrar la aceleración. La senda de planeo es GP (Glide path) y la velocidad indicada IAS.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 306, "stem": "¿Qué es un APV?", "opts": ["Un punto de aproximación final para procedimientos ILS", "Un indicador simplificado de trayectoria de aproximación", "Un procedimiento de aproximación con guía vertical", "Una aproximación de precisión visual con PAPI"], "ans": 2, "why": "«APV Procedimiento de aproximación con guía vertical / Approach procedure with vertical guidance». A es el FAP y B el APAPI. El SBAS puede habilitar APV SBAS y el ABAS, APV con baro-VNAV.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 307, "stem": "¿Qué significa CDI?", "opts": ["Indicador radiomagnético", "Indicador de desviación de curso", "Radio indicador de rumbo", "Indicador de distancia y curso a la estación"], "ans": 1, "why": "«CDI Indicador de desviación de curso». En el VOR indica mando (lo que debe hacer el piloto para mantenerse sobre el radial) y determina el cuadrante de situación. El indicador radiomagnético es el RMI y el radio indicador de rumbo, el RBI.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 308, "stem": "¿Qué sistema SBAS corresponde a Japón?", "opts": ["WAAS", "EGNOS", "MSAS", "GAGAN"], "ans": 2, "why": "Tipos de SBAS que destaca la tabla: WAAS (EE. UU.), EGNOS (Unión Europea), MSAS (Japón) y GAGAN (India). La lista de acrónimos glosa MSAS como «Sistema de aumentación satelital multifunción (Japón)».", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 17", "note": ""}, {"n": 309, "stem": "La senda de descenso del ILS trabaja en una banda cuyo intervalo de frecuencias, según la lista de acrónimos, es:", "opts": ["de 30 a 300 MHz", "de 3 a 30 MHz", "de 8 a 12 GHz", "de 300 a 3000 MHz"], "ans": 3, "why": "La senda de descenso trabaja en UHF (el localizador y las radiobalizas, en VHF), y la lista de acrónimos da «UHF Frecuencia ultra alta (300 a 3000 MHz)». 30 a 300 MHz es la VHF y 8 a 12 GHz la banda X del SMR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37; capítulo 5, p. 70", "note": ""}, {"n": 310, "stem": "¿Qué radar es un radar primario particularizado para detectar aeronaves en las superficies de los aeropuertos?", "opts": ["El SMR", "El PSR", "El SSR", "El radar meteorológico embarcado"], "ans": 0, "why": "«El radar de vigilancia en superficie, SMR (Surface Movement Radar), es un tipo de radar primario particularizado para la detección de aeronaves en las superficies de los aeropuertos». El radar meteorológico embarcado también es primario, pero va en el morro del avión.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 311, "stem": "¿Qué sistemas proporcionan posición, pero nunca rumbo ni guiado si no se dispone de un ordenador de navegación de a bordo?", "opts": ["Los radiofaros NDB", "Los radiofaros VOR", "Los radares Doppler", "Los sistemas hiperbólicos"], "ans": 3, "why": "Los sistemas hiperbólicos «proporcionan posición, nunca rumbo ni guiado (si no se dispone de un ordenador de navegación de a bordo)». Con el NDB y el VOR se vuela en acercamiento o alejamiento a la estación (guiado), y el radar Doppler da la distancia transversal a la ruta preseleccionada y la que queda por recorrer.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, p. 38", "note": ""}, {"n": 312, "stem": "¿Qué equipo antena/receptor de a bordo procesa la señal del NDB?", "opts": ["El ADF", "El RMI", "El OBS", "El DME"], "ans": 0, "why": "«El ADF (Automatic Direction Finder) es el componente de a bordo del sistema. Se trata de un equipo antena/receptor instalado en la aeronave, encargado de procesar la señal NDB que se presenta al piloto mediante un instrumento indicador»; el RMI es uno de esos indicadores. El OBS es el selector de radiales del VOR.", "src": "Manual 5 (nov. 2026), capítulo 3.3.1.3, p. 19", "note": ""}, {"n": 313, "stem": "Los sistemas que utilizan una infraestructura auxiliar constituida exclusivamente por instalaciones fijas terrestres son los:", "opts": ["no autónomos espaciales", "sistemas autónomos", "no autónomos terrestres", "sistemas de vigilancia dependiente"], "ans": 2, "why": "En la tabla del apartado 3.2.3: «A) TERRESTRES. Definición: Son aquellos que utilizan una infraestructura auxiliar constituida exclusivamente por instalaciones fijas terrestres», divididos en radioayudas y visuales. Los espaciales incluyen satélites y los autónomos no requieren infraestructura externa.", "src": "Manual 5 (nov. 2026), capítulo 3.2.3, tabla, p. 15", "note": ""}, {"n": 314, "stem": "En el apartado 3.3.4.5 (características operacionales del ILS), «altura de la base del techo de nubes» es la definición de:", "opts": ["RVR", "DH", "FAF", "APV"], "ans": 1, "why": "«DH (Decision Height): Altura de la base del techo de nubes. La referencia visual requerida se obtendrá cuando el avión vuele por debajo de la base de nubes». El RVR es la distancia hasta la que el piloto ve las señales o luces de la pista.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 315, "stem": "¿Qué sistema de vigilancia se basa en la diferencia horaria de llegada (TDOA)?", "opts": ["El radar secundario monopulso", "La ADS-C", "El PSR", "La multilateración"], "ans": 3, "why": "La multilateración «se basa en una metodología conocida como diferencia horaria de llegada (TDOA)». La técnica monopulso del SSR mejora la marcación angular; la ADS-C transmite por contrato y el PSR mide el tiempo de ida y vuelta del eco.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 316, "stem": "¿Qué sistema autónomo dirige hacia el suelo tres o cuatro haces de ondas electromagnéticas?", "opts": ["El radar Doppler", "El sistema inercial láser", "El radar meteorológico embarcado", "El sistema ABAS"], "ans": 0, "why": "«El Radar Doppler consiste en un transmisor de señales localizado en el avión que dirige hacia el suelo tres o cuatro haces de ondas electromagnéticas». El inercial láser usa tres giróscopos láser y tres acelerómetros; el radar meteorológico embarcado es un radar primario situado en el morro.", "src": "Manual 5 (nov. 2026), capítulo 3.6.2.2, p. 53</p>\n<hr />\n<h2>Clave rápida</h2>\n<p>1B 2C 3D 4A 5D 6A 7C 8A 9C 10D 11D 12B 13C 14A 15B 16B 17C 18D 19D 20B 21A 22C 23D 24C 25B 26A 27D 28A 29C 30B 31D 32B 33D 34C 35D 36D 37A 38C 39D 40C 41A 42D 43A 44A 45C 46B 47A 48C 49D 50A 51C 52A 53D 54B 55D 56D 57C 58A 59D 60A 61B 62C 63A 64B 65A 66C 67D 68A 69C 70B 71D 72D 73A 74A 75C 76D 77A 78C 79A 80B 81A 82C 83A 84D 85A 86C 87B 88D 89C 90C 91A 92B 93C 94C 95A 96D 97D 98B 99A 100D 101D 102B 103D 104A 105A 106C 107B 108D 109C 110B 111B 112A 113A 114A 115C 116B 117D 118C 119A 120A 121C 122D 123A 124D 125A 126D 127B 128C 129B 130D 131B 132A 133D 134A 135D 136B 137D 138C 139B 140C 141C 142B 143D 144C 145A 146D 147C 148B 149A 150A 151B 152C 153D 154A 155C 156C 157B 158A 159C 160D 161D 162C 163A 164B 165C 166A 167D 168B 169A 170C 171C 172B 173B 174D 175B 176C 177C 178D 179B 180A 181B 182C 183A 184B 185B 186A 187C 188D 189D 190B 191B 192A 193A 194C 195B 196A 197B 198D 199B 200C 201A 202D 203B 204D 205C 206A 207D 208B 209D 210C 211B 212A 213D 214C 215A 216D 217C 218B 219C 220A 221C 222C 223A 224A 225C 226D 227B 228B 229B 230A 231B 232D 233C 234B 235B 236B 237A 238C 239B 240D 241C 242D 243B 244D 245A 246B 247A 248C 249B 250D 251B 252A 253D 254D 255B 256B 257D 258A 259A 260C 261B 262C 263D 264D 265B 266B 267B 268D 269A 270C 271B 272B 273C 274B 275B 276D 277C 278C 279B 280D 281C 282A 283C 284C 285A 286D 287C 288A 289B 290D 291A 292B 293D 294C 295B 296D 297C 298B 299A 300C 301A 302D 303B 304D 305A 306C 307B 308C 309D 310A 311D 312A 313C 314B 315D 316A</p>\n<h2>Notas</h2>\n<ul>\n<li>El manual de noviembre de 2026 repite el texto, las figuras y las tablas del de agosto de 2023; solo cambian la paginación (desde la p. 10) y los rótulos de la tabla del apartado 3.2.3, que ahora dice «A) TERRESTRES» y «B) ESPACIALES».</li>\n<li>Rarezas del propio manual que el examen puede reproducir, y cómo las trata este banco: «seis fases» con cinco viñetas (Q9); ADF glosado como «Radiofaro no direccional» en el texto y «Equipo radiogoniométrico automático» en los acrónimos (Q81-Q82); «disponibilidad» como cuarto parámetro PBN donde la OACI dice «funcionalidad» (Q33-Q34); «tres categorías» con una tabla de cinco filas (Q147); DH definida como «altura de la base del techo de nubes» (Q149); «Longitud máx.: Como min 420 M» en el ALS sencillo (Q185); casilla truncada «Medida de tiempos y» del LORAN-C (ninguna pregunta depende de ella); «4.1.2.6» numerado dos veces (Q268).</li>\n<li>El manual no da frecuencias concretas (MHz o kHz) de NDB, VOR, DME o ILS, ni frecuencias GNSS, ACAS/TCAS o códigos de emergencia del transpondedor; esas cifras están en los bancos <code>questions/ext/T05a-test.md</code> y <code>questions/ext/T05b-test.md</code>.</li>\n<li>Q287-Q316 se añadieron después del cotejo con los exámenes reales (2017, 2023 y 2026) y no siguen el orden del manual. Q287-Q302 preguntan hechos que esos exámenes preguntaron, desde la misma dirección; Q303-Q316 aplican los mismos patrones (siglas de la lista de acrónimos, sistema identificado por una propiedad, término a partir de su definición) a otros datos del manual.</li>\n</ul>", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/05-navegacion-sistemas/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
