la parte de pista utilizable para el aterrizaje", "El comienzo de la parte de pista utilizable para el aterrizaje", "La zona de toma de contacto de la pista", "El punto situado a 3,9 NM de la pista"], "ans": 1, "why": "«… distancia al umbral de la pista (comienzo de la parte de pista utilizable para el aterrizaje).» Las aeronaves reciben la radiobaliza al pasar por su vertical.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 34", "note": ""}, {"n": 137, "stem": "Según el manual, ¿cómo presenta el equipo de a bordo del ILS la información recibida?", "opts": ["Solo mediante indicaciones visuales", "Solo mediante indicaciones acústicas", "Mediante un enlace de datos al FMS", "Mediante indicaciones visuales y acústicas"], "ans": 3, "why": "«… presentada por medio de indicaciones visuales y acústicas.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.3, p. 34", "note": ""}, {"n": 138, "stem": "En el indicador de a bordo del ILS, ¿qué indica la aguja horizontal (raya roja)?", "opts": ["Hacia dónde dirigirse para alinearse con el eje de pista", "La distancia al umbral", "Hacia dónde dirigirse para interceptar la pendiente correcta de descenso", "El paso sobre la radiobaliza exterior"], "ans": 2, "why": "Horizontal (roja) = pendiente de descenso; vertical (azul) = eje de pista (la A).", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, p. 35", "note": ""}, {"n": 139, "stem": "En el indicador de a bordo del ILS, ¿qué indica la aguja vertical (raya azul)?", "opts": ["Hacia dónde dirigirse para interceptar la pendiente correcta de descenso", "Hacia dónde dirigirse para alinearse con el eje de pista", "La altura de decisión", "Si se vuela hacia o desde la estación"], "ans": 1, "why": "Para volar la trayectoria correcta, el piloto mantiene centradas las dos agujas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, p. 35", "note": ""}, {"n": 140, "stem": "Según la figura de la indicación a bordo de la senda de planeo, ¿cuándo se muestra la «indicación de DESCENDER»?", "opts": ["Cuando la aeronave está por debajo de la senda de descenso", "Cuando la aeronave ha pasado la altura de paso sobre el umbral", "Cuando la aeronave está por encima de la senda de descenso", "Cuando la aeronave está desviada a la derecha del eje"], "ans": 2, "why": "La figura muestra «indicación de DESCENDER» con la aeronave por encima de la senda, «indicación de PENDIENTE CORRECTA DE DESCENSO» sobre ella e «indicación de ASCENDER» por debajo.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, figura, p. 35", "note": ""}, {"n": 141, "stem": "Según el manual, ¿qué radiobaliza da un tono de rayas continuas y una luz azul parpadeante?", "opts": ["La interna (IM)", "La intermedia (MM)", "La exterior (OM)", "Ninguna: todas usan luz blanca"], "ans": 2, "why": "OM: rayas continuas, luz azul; MM: puntos y rayas alternados, ámbar; IM: puntos continuos, blanca.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, p. 36", "note": ""}, {"n": 142, "stem": "¿Qué radiobaliza da un tono de puntos y rayas alternados y una luz ámbar parpadeante?", "opts": ["La exterior (OM)", "La intermedia (MM)", "La interna (IM)", "El localizador (LOC)"], "ans": 1, "why": "Es la radiobaliza intermedia.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, p. 36", "note": ""}, {"n": 143, "stem": "Según el manual, ¿qué indicación da la radiobaliza interna (IM)?", "opts": ["Rayas continuas y luz azul parpadeante", "Puntos y rayas alternados y luz ámbar parpadeante", "Rayas continuas y luz blanca parpadeante", "Puntos continuos y luz blanca parpadeante"], "ans": 3, "why": "IM: puntos continuos y luz blanca.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.4, p. 36", "note": ""}, {"n": 144, "stem": "Según el manual, ¿en qué banda de frecuencias trabaja la senda de descenso del ILS?", "opts": ["VHF", "LF", "UHF", "HF"], "ans": 2, "why": "El localizador y las radiobalizas trabajan en VHF; la senda de descenso, en UHF.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 145, "stem": "Según el manual, ¿en qué banda de frecuencias trabajan el localizador y las radiobalizas del ILS?", "opts": ["VHF", "UHF", "LF-MF", "Banda X"], "ans": 0, "why": "Solo la senda de descenso trabaja en UHF.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 146, "stem": "Según el manual, ¿cuántas frecuencias hay que seleccionar para sintonizar los receptores del localizador y de la senda de planeo?", "opts": ["Dos, una para cada receptor", "Tres, contando la del DME", "Ninguna, se sintonizan automáticamente", "Una sola, porque sus frecuencias están emparejadas"], "ans": 3, "why": "«Las frecuencias del localizador y la senda de planeo están emparejadas de manera que sólo se requiere seleccionar una frecuencia.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 147, "stem": "El apartado 3.3.4.5 dice que se han definido «tres categorías de actuación» de las instalaciones ILS. Sin contar la fila de encabezado, ¿cuántas filas de categoría tiene la tabla que publica a continuación?", "opts": ["Tres", "Cuatro", "Cinco", "Seis"], "ans": 2, "why": "La tabla tiene cinco filas: I, II, III A, III B y III C (tres categorías, la III con tres subcategorías).", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 148, "stem": "¿Qué define el manual como la distancia hasta la cual el piloto de una aeronave que se encuentra sobre el eje de una pista puede ver las señales de superficie de la pista o las luces que la delimitan o que señalan su eje?", "opts": ["DH", "RVR", "Visibilidad de vuelo", "Altura de paso sobre el umbral"], "ans": 1, "why": "Es el RVR (Runway Visual Range, alcance visual en pista).", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 149, "stem": "En el apartado 3.3.4.5, ¿cómo define el manual la DH (Decision Height)?", "opts": ["Altura de la base del techo de nubes", "Altura de paso de la senda sobre el umbral de la pista", "Altitud mínima de descenso de una aproximación de no precisión", "Distancia hasta la que se ven las luces del eje de pista"], "ans": 0, "why": "El manual dice «Altura de la base del techo de nubes. La referencia visual requerida se obtendrá cuando el avión vuele por debajo de la base de nubes.» No es la definición de la OACI, pero el examen sigue al manual.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 150, "stem": "Según la tabla de categorías del manual, ¿cuáles son los mínimos de la categoría I?", "opts": ["RVR &gt; 550 m; DH &gt; 60 m/200 ft", "RVR &gt; 300 m; DH &gt; 30 m/100 ft", "RVR &gt; 175 m; DH 0 a 30 m/100 ft", "RVR 175 &gt; x &gt; 50 m; DH 0 a 15 m/50 ft"], "ans": 0, "why": "I: &gt; 550 / &gt; 60-200; II: &gt; 300 / &gt; 30-100; III A: &gt; 175 / 0 a 30-100; III B: 175-50 / 0 a 15-50; III C: 0 / 0.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 151, "stem": "Según la tabla de categorías del manual, ¿cuáles son los mínimos de la categoría II?", "opts": ["RVR &gt; 550 m; DH &gt; 60 m/200 ft", "RVR &gt; 300 m; DH &gt; 30 m/100 ft", "RVR &gt; 175 m; DH 0 a 30 m/100 ft", "RVR 175 &gt; x &gt; 50 m; DH 0 a 15 m/50 ft"], "ans": 1, "why": "La III A comparte el 30 m/100 ft, pero como intervalo «0 a 30/100» y con RVR &gt; 175 m.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 152, "stem": "Según la tabla de categorías del manual, ¿cuáles son los mínimos de la categoría III A?", "opts": ["RVR &gt; 300 m; DH &gt; 30 m/100 ft", "RVR 175 &gt; x &gt; 50 m; DH 0 a 15 m/50 ft", "RVR &gt; 175 m; DH 0 a 30 m/100 ft", "RVR 0; DH 0"], "ans": 2, "why": "La A es la II, la B la III B y la D la III C.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 153, "stem": "Según la tabla de categorías del manual, ¿qué categoría tiene un RVR entre 175 y 50 m y una DH de 0 a 15 m/50 ft?", "opts": ["II", "III A", "III C", "III B"], "ans": 3, "why": "III B: 175 &gt; x &gt; 50 m; 0 a 15/50.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 154, "stem": "Según la tabla de categorías del manual, ¿cuáles son los mínimos de la categoría III C?", "opts": ["RVR 0 y DH 0", "RVR &gt; 175 m; DH 0 a 30 m", "RVR 175 &gt; x &gt; 50 m; DH 0 a 15 m", "RVR &gt; 550 m; DH &gt; 60 m"], "ans": 0, "why": "La fila III C muestra 0 en ambas columnas.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, tabla, p. 37", "note": ""}, {"n": 155, "stem": "Según el manual, ¿qué radiobalizas se instalan cuando la pista va a soportar operaciones de categoría I?", "opts": ["Solo la interna", "La interna y la intermedia", "La intermedia y la exterior", "Las tres"], "ans": 2, "why": "Categoría I: intermedia y exterior; en las categorías II y III se instala además la interna.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 156, "stem": "Según el manual, ¿qué radiobaliza se instala además en las pistas con operaciones de categoría II y III?", "opts": ["La exterior", "La intermedia", "La interna", "Ninguna más"], "ans": 2, "why": "«… en los casos de operaciones de Categoría II y III además se instala la radiobaliza Interna.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.5, p. 37", "note": ""}, {"n": 157, "stem": "Según el manual, ¿por qué se desarrollaron los sistemas hiperbólicos?", "opts": ["Para sustituir al VOR en el espacio aéreo continental de alta densidad", "Para navegar a larga distancia donde las radioayudas no tenían alcance, sobre todo en la navegación oceánica", "Para proporcionar guiado de aproximación de precisión en pistas sin ILS", "Para calibrar en vuelo los receptores GNSS y las estaciones VOR"], "ans": 1, "why": "Es el objetivo que da el manual para los sistemas hiperbólicos.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, p. 38", "note": ""}, {"n": 158, "stem": "Según el manual, ¿por qué han quedado prácticamente en desuso los sistemas hiperbólicos?", "opts": ["Por la aparición del sistema inercial y de los sistemas basados en satélite", "Por la implantación general del VOR/DME", "Por la prohibición de la OACI de usar la banda VLF", "Por la extensión de la cobertura del radar secundario"], "ans": 0, "why": "«Los sistemas hiperbólicos han quedado prácticamente en desuso con la aparición del sistema inercial y de los sistemas basados en satélite.»", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, p. 38", "note": ""}, {"n": 159, "stem": "Según el manual, ¿qué proporcionan los sistemas hiperbólicos si no se dispone de un ordenador de navegación de a bordo?", "opts": ["Rumbo y guiado", "Solo distancia a la estación principal", "Posición, nunca rumbo ni guiado", "Solo la hora exacta"], "ans": 2, "why": "«Estos sistemas proporcionan posición, nunca rumbo ni guiado (si no se dispone de un ordenador de navegación de a bordo).»", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, p. 38", "note": ""}, {"n": 160, "stem": "En los sistemas hiperbólicos, ¿qué se mantiene constante en todos los puntos de la línea de situación de la aeronave?", "opts": ["La suma de las distancias a dos referencias fijas", "La distancia a una única estación", "La marcación respecto a una estación", "La diferencia de distancias a dos referencias fijas"], "ans": 3, "why": "Esa línea es, por definición geométrica, una hipérbola; la posición se obtiene por intersección de hipérbolas de una red fija de estaciones terrestres.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, p. 38", "note": ""}, {"n": 161, "stem": "Según el cuadro de sistemas hiperbólicos del manual, ¿qué sistema trabaja en VLF y tiene el mayor alcance (6000 NM - 10000 NM)?", "opts": ["DECCA", "LORAN-A", "LORAN-C", "OMEGA"], "ans": 3, "why": "La figura de la p. 39 muestra además un «Receptor de un sistema hiperbólico tipo Omega».", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, tabla, p. 39", "note": ""}, {"n": 162, "stem": "Según el cuadro de sistemas hiperbólicos, ¿qué sistema tiene el alcance expresado en kilómetros (1000 km de día, 2500 km de noche)?", "opts": ["DECCA", "LORAN-C", "LORAN-A", "OMEGA"], "ans": 2, "why": "El LORAN-A (medida de tiempos, MF) es el único con alcance en km y distinto de día y de noche.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, tabla, p. 39", "note": ""}, {"n": 163, "stem": "Según el cuadro de sistemas hiperbólicos, ¿qué sistema emplea medida de fases en LF, con un alcance de 1500 NM?", "opts": ["DECCA", "LORAN-C", "OMEGA", "LORAN-A"], "ans": 0, "why": "DECCA: fases, LF, 1500 NM. OMEGA también mide fases, pero en VLF.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, tabla, p. 39", "note": ""}, {"n": 164, "stem": "Según el cuadro de sistemas hiperbólicos, ¿qué alcance tiene el LORAN-C?", "opts": ["1500 NM", "1200 NM - 3400 NM", "6000 NM - 10000 NM", "1000 km de día y 2500 km de noche"], "ans": 1, "why": "LORAN-C trabaja en LF con alcance de 1200 a 3400 NM.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, tabla, p. 39", "note": ""}, {"n": 165, "stem": "Según el cuadro de sistemas hiperbólicos, ¿qué dos sistemas emplean «medida de fases»?", "opts": ["LORAN-A y OMEGA", "DECCA y LORAN-A", "DECCA y OMEGA", "Ninguno: todos emplean medida de tiempos"], "ans": 2, "why": "DECCA y OMEGA: medida de fases; LORAN-A: medida de tiempos.", "src": "Manual 5 (nov. 2026), capítulo 3.3.5, tabla, p. 39", "note": ""}, {"n": 166, "stem": "Según el manual, ¿qué dos tipos de sistemas visuales existen para las fases de aproximación y aterrizaje?", "opts": ["Sistemas indicadores de pendiente de aproximación y sistemas de luces de aproximación", "PAPI y radiobalizas", "Luces de borde de pista y luces de eje de calle de rodaje", "Sistemas de luces de aproximación y radar de superficie"], "ans": 0, "why": "Son los dos tipos del apartado 3.4.", "src": "Manual 5 (nov. 2026), capítulo 3.4, p. 39", "note": ""}, {"n": 167, "stem": "Según el manual, ¿cuál es el convenio de colores de los sistemas luminosos de ayuda a la aproximación?", "opts": ["Todo rojo, muy alto; todo blanco, muy cerca de pista o muy bajo", "Todo ámbar, en la pendiente correcta", "Todo verde, en la pendiente correcta; todo rojo, muy alto", "Todo rojo, muy cerca de pista o muy bajo; todo blanco, muy alto"], "ans": 3, "why": "«Todo rojo para indicar muy cerca de pista o muy bajo. Todo blanco para indicar muy alto.»", "src": "Manual 5 (nov. 2026), capítulo 3.4, p. 40", "note": ""}, {"n": 168, "stem": "En la fotografía de los sistemas luminosos de ayuda a la aproximación y aterrizaje (apartado 3.4), ¿qué sistema se rotula como «sistema visual indicador de pendiente de aproximación»?", "opts": ["PAPI", "T-VASIS", "APAPI", "ALS"], "ans": 1, "why": "La fotografía rotula el T-VASIS y el «sistema de luces de aproximación». El texto dice después que el T-VASIS está en desuso en los aeródromos civiles.", "src": "Manual 5 (nov. 2026), capítulo 3.4, figura, p. 40", "note": ""}, {"n": 169, "stem": "Según el manual, ¿cuántos elementos luminosos tiene la barra de ala del PAPI?", "opts": ["4", "2", "6", "8"], "ans": 0, "why": "PAPI: 4 elementos; APAPI (Abbreviated PAPI): 2.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 40", "note": ""}, {"n": 170, "stem": "Según el manual, ¿cuántos elementos luminosos tiene la barra de ala del APAPI?", "opts": ["4", "3", "2", "6"], "ans": 2, "why": "El APAPI es el PAPI abreviado: dos elementos.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 40", "note": ""}, {"n": 171, "stem": "Según el manual, ¿en qué lado de la pista se sitúan el PAPI y el APAPI?", "opts": ["En el lado derecho", "Sobre el eje de la pista", "En el lado izquierdo, a menos que sea materialmente imposible", "En cualquiera de los dos lados, a criterio del aeródromo"], "ans": 2, "why": "Ambos se sitúan al lado izquierdo de la pista, salvo imposibilidad material.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 40", "note": ""}, {"n": 172, "stem": "Según el manual, ¿cuándo puede proporcionarse una segunda barra de ala del PAPI en el lado opuesto de la pista?", "opts": ["Siempre que la pista tenga operaciones de categoría II o III", "Si la usan aeronaves que necesitan guía visual de balanceo y no hay otro medio que la dé", "Cuando la pista mida más de 3000 m de longitud", "Solo de noche, para reforzar la intensidad luminosa"], "ans": 1, "why": "Es el único caso que cita el manual.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 40", "note": ""}, {"n": 173, "stem": "Según la figura de guiado del PAPI, ¿qué ve el piloto cuando la aeronave está en pendiente?", "opts": ["4 luces blancas", "2 luces blancas y 2 rojas", "4 luces rojas", "1 luz blanca y 3 rojas"], "ans": 1, "why": "Muy alto: 4 blancas; alto: 3 blancas y 1 roja; en pendiente: 2 y 2; bajo: 1 blanca y 3 rojas; muy bajo: 4 rojas.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, figura, p. 41", "note": ""}, {"n": 174, "stem": "Según la figura de guiado del PAPI, ¿qué indicación corresponde a la posición «Alto» (no «Muy alto»)?", "opts": ["4 luces blancas", "2 luces blancas y 2 rojas", "1 luz blanca y 3 rojas", "3 luces blancas y 1 roja"], "ans": 3, "why": "«Muy alto» son las 4 blancas; «Alto», 3 blancas y 1 roja.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, figura, p. 41", "note": ""}, {"n": 175, "stem": "Según la figura de guiado del PAPI, ¿qué posición indican 1 luz blanca y 3 rojas?", "opts": ["Muy bajo", "Bajo", "En pendiente", "Alto"], "ans": 1, "why": "«Muy bajo» son las 4 rojas.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, figura, p. 41", "note": ""}, {"n": 176, "stem": "Según la figura de guiado del APAPI, ¿qué ve el piloto cuando la aeronave está en pendiente?", "opts": ["2 luces blancas", "2 luces rojas", "1 luz blanca y 1 roja", "2 luces blancas y 2 rojas"], "ans": 2, "why": "APAPI: alto, 2 blancas; en pendiente, 1 blanca y 1 roja; bajo, 2 rojas.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, figura, p. 41", "note": ""}, {"n": 177, "stem": "Según el manual, cuando el PAPI actúa como medio suplementario de un sistema de aproximación instrumental:", "opts": ["Se apaga mientras funciona el ILS", "Solo se enciende de noche", "Su pendiente visual se ajusta a la senda de planeo instrumental", "Sustituye a las radiobalizas del ILS"], "ans": 2, "why": "Estos sistemas pueden ser la única ayuda a la aproximación de la pista o actuar como medio suplementario; en ese caso la pendiente visual se ajusta a la senda de planeo instrumental.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 42", "note": ""}, {"n": 178, "stem": "Según el manual, ¿cuándo se utilizan los sistemas visuales indicadores de pendiente de aproximación?", "opts": ["Solo en operaciones nocturnas", "Solo en operaciones diurnas", "Solo en condiciones de vuelo instrumental", "Tanto en operaciones diurnas como nocturnas"], "ans": 3, "why": "Se usan de día y de noche y disponen de control de intensidad luminosa según las condiciones predominantes.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.1, p. 42", "note": ""}, {"n": 179, "stem": "Según el manual, ¿se siguen utilizando los sistemas T-VASIS y AT-VASIS en los aeródromos civiles?", "opts": ["Sí, en todos los aeropuertos con ILS", "No: ya no hay ninguno; en España está en alguna base aérea militar", "Solo en los aeropuertos de categoría II/III", "Solo como medio suplementario del PAPI"], "ans": 1, "why": "El manual no los explica por estar en desuso en los aeródromos civiles.", "src": "Manual 5 (nov. 2026), capítulo 3.4.1.2, p. 42", "note": ""}, {"n": 180, "stem": "Según el manual, ¿con qué está relacionada la información visual que proporcionan los sistemas de luces de aproximación (ALS)?", "opts": ["Con la altura de decisión y la posición de la aeronave respecto al eje y la cabecera de pista", "Con la velocidad de la aeronave y el viento en superficie", "Con la frecuencia del ILS y el código del transpondedor", "Con la pendiente de descenso y la distancia a la radiobaliza exterior"], "ans": 0, "why": "Los ALS ayudan en el tramo final antes del umbral; la pendiente la indican el PAPI/APAPI.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, p. 42", "note": ""}, {"n": 181, "stem": "Según el manual, ¿qué indican al piloto las barretas (barras transversales) de un sistema de luces de aproximación?", "opts": ["La pendiente correcta de descenso", "A cuánto está del umbral", "La dirección del viento", "La categoría del ILS"], "ans": 1, "why": "Las barretas, por su disposición, «le indican al piloto a cuanto están del umbral».", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, p. 42", "note": ""}, {"n": 182, "stem": "Según el manual, ¿qué necesita el piloto para interpretar un sistema de luces de aproximación?", "opts": ["Un receptor específico a bordo", "La frecuencia del localizador sintonizada", "Estar en contacto visual con el terreno", "Autorización expresa del controlador"], "ans": 2, "why": "No se requiere un dispositivo de a bordo específico, pero sí contacto visual con el terreno.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, p. 42", "note": ""}, {"n": 183, "stem": "En la figura de los elementos de un sistema de luces de aproximación, ¿cómo se rotulan las luces rojas situadas a ambos lados de la línea central junto al umbral?", "opts": ["Filas laterales", "Barretas", "Barra transversal", "Luces de destello"], "ans": 0, "why": "La figura rotula luces puntiformes, barretas, luces de destello, línea central, barra transversal y filas laterales (las rojas).", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, figura, p. 43", "note": ""}, {"n": 184, "stem": "Según el manual, ¿en cuántos tipos se clasifican los ALS?", "opts": ["Dos: sencillo y de precisión", "Tres: sencillo, CAT I y CAT II/III", "Cuatro: sencillo, CAT I, CAT II y CAT III", "Cinco, uno por cada categoría del ILS"], "ans": 1, "why": "«… los ALS se clasifican en tres tipos.»", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 44", "note": ""}, {"n": 185, "stem": "En la tabla del ALS «Sencillo», ¿qué valor figura en la fila «Longitud máx.»?", "opts": ["Como máximo 900 m", "Como mínimo 420 m", "Exactamente 300 m", "Como máximo 420 m"], "ans": 1, "why": "La fila se rotula «Longitud máx.», pero su valor es «Como min 420 M» (la figura rotula «420 m mín.»). El máximo de 900 m es del CAT I.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 44", "note": ""}, {"n": 186, "stem": "Según la tabla del manual, ¿cuántas barretas tiene el ALS sencillo?", "opts": ["1 transversal a 300 m", "1 cada 150 m", "1 cada 300 m, obligatoria", "Ninguna"], "ans": 0, "why": "Sencillo: 1 barreta transversal a 300 m. CAT I: obligatoria 1 cada 300 m y recomendable 1 cada 150 m.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 44", "note": ""}, {"n": 187, "stem": "Según la tabla del manual, ¿para qué aproximaciones es el ALS sencillo?", "opts": ["De precisión CAT I", "De precisión CAT II/III", "Visuales y de no precisión", "Solo visuales nocturnas"], "ans": 2, "why": "Sencillo: visuales y de no precisión; CAT I: precisión CAT I; CAT II/III: precisión CAT II/III.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 44", "note": ""}, {"n": 188, "stem": "Según la tabla del manual, ¿cuál es la longitud máxima del ALS CAT I?", "opts": ["420 m", "600 m", "1200 m", "900 m"], "ans": 3, "why": "«Como máximo 900 m.» El sencillo da «Como min 420 M».", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 45", "note": ""}, {"n": 189, "stem": "Según la tabla del manual, ¿cómo es la línea central del ALS CAT I?", "opts": ["Una sola luz en toda su longitud", "3 luces los primeros 300 m, 2 los siguientes 300 m y 1 los últimos 300 m", "2 luces en toda su longitud", "1 sola luz los primeros 300 m, 2 luces otros 300 m y, por último, 300 m con 3 luces"], "ans": 3, "why": "Es la fila «Línea central» del CAT I (3 tramos de 300 m = 900 m máximo).", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 45", "note": ""}, {"n": 190, "stem": "Según la tabla del ALS CAT I, ¿qué se dice de las barretas?", "opts": ["Obligatoria 1 barreta cada 150 m; recomendable 1 cada 300 m", "Obligatoria 1 barreta cada 300 m; recomendable 1 cada 150 m", "1 sola barreta transversal a 300 m", "Barretas rojas a ambos lados en los últimos 300 m"], "ans": 1, "why": "La C es el ALS sencillo y la D lo que añade el CAT II/III.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 45", "note": ""}, {"n": 191, "stem": "Según el manual, ¿en qué se diferencia el ALS CAT II/III del CAT I?", "opts": ["Su línea central tiene 3 luces en todo su recorrido, sin los tramos de 1 y de 2 luces", "En los 300 m más cercanos al umbral tiene barretas rojas a ambos lados de la línea central", "Su longitud máxima pasa a 1200 m, con una barreta obligatoria cada 150 m", "Sus barretas son verdes y se sitúan a ambos lados de la línea central en toda su longitud"], "ans": 1, "why": "«Es exactamente igual que el de CAT I, con excepción de que los 300 m más cercanos al umbral tiene barretas rojas a ambos lados de la línea central.»", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, tabla, p. 46", "note": ""}, {"n": 192, "stem": "Según el manual, ¿de qué constituyen una parte complementaria los sistemas de luces de aproximación?", "opts": ["De los sistemas de aproximación y aterrizaje (ILS)", "De los radares de movimiento en superficie de la torre", "De los sistemas de aumentación GBAS del aeropuerto", "De los sistemas PAPI, a los que sustituyen de noche"], "ans": 0, "why": "«Constituyen una parte complementaria de los sistemas de aproximación y aterrizaje (ILS)» y ayudan al piloto en la transición del vuelo instrumental al visual; facilitan la aproximación, especialmente con visibilidad limitada.", "src": "Manual 5 (nov. 2026), capítulo 3.4.2, p. 46", "note": ""}, {"n": 193, "stem": "Según el manual, los sistemas GNSS proporcionan con mucha exactitud la posición y el tiempo en todo el mundo, con un orden de:", "opts": ["Metros y nanosegundos", "Centímetros y milisegundos", "Kilómetros y segundos", "Metros y microsegundos"], "ans": 0, "why": "«… proporcionan con mucha exactitud la posición (metros) y el tiempo (nanosegundos) en todo el mundo.»", "src": "Manual 5 (nov. 2026), capítulo 3.5.1, p. 46", "note": ""}, {"n": 194, "stem": "Según el manual, ¿en qué se basa el principio de funcionamiento de las constelaciones principales GNSS?", "opts": ["En la variación de frecuencia de la señal reflejada en el suelo", "En la diferencia de fase entre dos estaciones terrestres", "En la medida del tiempo que tarda la señal del satélite en llegar al receptor", "En la interrogación del receptor y la respuesta del satélite"], "ans": 2, "why": "Es el principio del apartado 3.5.1.1.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.1, p. 46", "note": ""}, {"n": 195, "stem": "Según el manual, ¿con cuántos satélites se determina la posición del receptor y por qué se requiere en la práctica uno más?", "opts": ["Con 2; el tercero confirma la altitud", "Con 3; en la práctica se requiere un cuarto para sincronizar el reloj del receptor", "Con 4; el quinto aporta integridad", "Con 3; el cuarto sustituye a la estación de control"], "ans": 1, "why": "Midiendo la distancia a tres satélites se determina la posición; el cuarto sincroniza el reloj del receptor para medir las distancias con precisión. La posición de los satélites la controlan las estaciones de tierra.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.1, p. 47", "note": ""}, {"n": 196, "stem": "Según el manual, ¿cuáles son los tres segmentos operativos de las constelaciones GPS, GLONASS, Galileo y BeiDou/BDS?", "opts": ["Espacial, terrestre o de control, y de usuario", "Aéreo, marítimo y terrestre", "Primario, secundario y de aumentación", "Civil, militar y comercial"], "ans": 0, "why": "Así lo dice el texto, y la figura «Segmentos de los sistemas GNSS» rotula segmento espacial, de control y de usuario.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.2, p. 47", "note": ""}, {"n": 197, "stem": "Según el manual, ¿qué servicios de valor añadido puede proporcionar el segmento terrestre o de control de un sistema GNSS?", "opts": ["Correcciones por radiodifusión en VHF a las aeronaves", "Datos de integridad y servicios de búsqueda y rescate", "Comunicaciones de voz con el control de tránsito aéreo", "Vigilancia radar de las aeronaves equipadas"], "ans": 1, "why": "Su misión principal es controlar y supervisar la constelación, «aunque también puede proporcionar servicios de valor añadido como datos de integridad, y servicios de búsqueda y rescate».", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.2, p. 48", "note": ""}, {"n": 198, "stem": "¿Qué segmento GNSS está formado por los receptores que captan y procesan las señales de los satélites, proporcionando la posición y el tiempo a las aeronaves?", "opts": ["Segmento espacial", "Segmento de control", "Segmento de aumentación", "Segmento de usuario"], "ans": 3, "why": "El espacial son los satélites; el terrestre o de control, las estaciones que supervisan la constelación.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.2, p. 48", "note": ""}, {"n": 199, "stem": "Según el manual, ¿en qué pueden diferir las constelaciones principales GNSS, aunque su principio de funcionamiento sea similar?", "opts": ["En el número de segmentos operativos", "En las frecuencias de las señales, su modulación y la codificación del mensaje de navegación", "En que unas miden tiempos y otras fases", "En que unas necesitan 4 satélites y otras 2"], "ans": 1, "why": "Es el texto del apartado 3.5.1.3.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.3, p. 48", "note": ""}, {"n": 200, "stem": "Según el manual, ¿qué requiere el uso de cada tipo de sistema de aumentación?", "opts": ["Una autorización expresa del proveedor de servicios", "Una estación GBAS en el aeropuerto de destino", "Capacidades específicas en los receptores o equipos de a bordo", "Al menos dos constelaciones principales"], "ans": 2, "why": "Cada sistema de aumentación tiene su área de servicio, y su uso requiere capacidades específicas a bordo.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, p. 48", "note": ""}, {"n": 201, "stem": "¿Qué área de servicio asigna el manual al SBAS?", "opts": ["Amplia (región, continente)", "Global", "Local (cerca del aeropuerto en que se instala)", "Limitada al espacio aéreo oceánico"], "ans": 0, "why": "SBAS: área amplia; GBAS: local; ABAS: global.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 202, "stem": "Según el manual, ¿qué es EGNOS?", "opts": ["La constelación principal GNSS de la Unión Europea", "El sistema GBAS de los aeropuertos europeos", "El sistema ABAS de las aeronaves europeas", "El sistema SBAS desarrollado en Europa"], "ans": 3, "why": "La constelación europea es Galileo (la A); EGNOS es el SBAS europeo.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 203, "stem": "Según el manual, ¿qué relación tiene el SBAS con la PBN en las fases de ruta, SID, STAR y aproximaciones de no precisión?", "opts": ["Es obligatorio en todas ellas", "Es compatible, aunque no obligatorio", "Es incompatible con la PBN", "Solo es compatible en ruta"], "ans": 1, "why": "«El sistema SBAS es compatible, aunque no obligatorio, con PBN en las fases de ruta, SID, STAR y aproximaciones de no precisión.»", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 204, "stem": "Según el manual, ¿para qué aproximaciones puede habilitar el SBAS y resulta necesario?", "opts": ["Para aproximaciones de precisión CAT II/III", "Para aproximaciones de no precisión", "Para aproximaciones RNP AR APCH", "Para aproximaciones APV o de precisión CAT I"], "ans": 3, "why": "Según dónde se esté dentro de su área de servicio, el SBAS puede habilitar aproximaciones con guiado vertical APV SBAS o de precisión CAT I, «para las cuales sí resulta necesario». En ruta, SID, STAR y no precisión es compatible, pero no obligatorio.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 205, "stem": "Según el manual, ¿cómo emite el GBAS la información de aumentación?", "opts": ["Mediante satélites geoestacionarios", "Mediante estaciones terrestres en HF", "Mediante una o varias antenas VHF en tierra", "Mediante la red de radares secundarios"], "ans": 2, "why": "El GBAS emite por antenas VHF en tierra (radiodifusión de datos VDB); el SBAS usa satélites geoestacionarios.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 206, "stem": "Según el manual, ¿qué aproximaciones habilita el GBAS?", "opts": ["De precisión: actualmente CAT I y en el futuro CAT II/III", "De precisión: actualmente CAT III y en el futuro CAT I", "Solo de no precisión, ahora y en el futuro", "Solo APV con guiado vertical baro-VNAV"], "ans": 0, "why": "«Habilita aproximaciones de precisión, actualmente CAT I y en el futuro CAT II/III.»", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 49", "note": ""}, {"n": 207, "stem": "Según el manual, ¿qué área de servicio tiene el ABAS y en qué datos se basa?", "opts": ["Local; en las correcciones que emiten una o varias antenas VHF del aeropuerto", "Regional; en correcciones de estaciones de referencia enviadas por satélites GEO", "Global; en las correcciones que el segmento de control envía a cada aeronave", "Global; en los sistemas autónomos de la aeronave o en la redundancia de señales de satélites"], "ans": 3, "why": "El ABAS va embarcado: usa el IRS o el sistema de datos aire, o la redundancia de señales (solo hacen falta 4 satélites, pero se reciben muchos más).", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 50", "note": ""}, {"n": 208, "stem": "Según el manual, ¿hasta qué aproximaciones habilita la PBN el ABAS?", "opts": ["Hasta las de precisión CAT I", "Hasta las de no precisión y las APV con guiado vertical baro-VNAV", "Hasta las APV SBAS", "Hasta las de precisión CAT II/III"], "ans": 1, "why": "El ABAS habilita PBN en todas las fases, pero en aproximación solo hasta no precisión y APV baro-VNAV.", "src": "Manual 5 (nov. 2026), capítulo 3.5.1.4, tabla, p. 50", "note": ""}, {"n": 209, "stem": "Según el manual, ¿qué información proporciona el INS además de la situación de la aeronave?", "opts": ["La altitud barométrica, la temperatura exterior y la velocidad indicada", "El combustible restante, el peso y el centro de gravedad", "Los ecos meteorológicos y la distancia a la tormenta más próxima", "La velocidad respecto a tierra, la posición instantánea y la distancia a un destino preestablecido"], "ans": 3, "why": "Es la lista del apartado 3.6.1.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1, p. 50", "note": ""}, {"n": 210, "stem": "Según el manual, ¿cómo se orientan los dos ejes de la plataforma estabilizada del INS?", "opts": ["Hacia el Norte magnético y la vertical del lugar", "Según los ejes longitudinal y transversal del avión", "Permanentemente hacia el Norte y el Este geográficos", "Hacia la estación VOR de actualización"], "ans": 2, "why": "El INS detecta las aceleraciones «mediante una plataforma estabilizada en dos ejes orientados permanentemente hacia el Norte y Este geográfico».", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.1, p. 50", "note": ""}, {"n": 211, "stem": "En el INS, ¿qué se obtiene al integrar a lo largo del tiempo la aceleración detectada?", "opts": ["La distancia recorrida", "La velocidad de la aeronave respecto al suelo (GS)", "La nueva posición geográfica", "La actitud de la aeronave"], "ans": 1, "why": "Aceleración integrada = velocidad (GS); velocidad integrada = distancia recorrida; sumada a la coordenada inicial = nueva posición.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.1, pp. 50-51", "note": ""}, {"n": 212, "stem": "Según el manual, ¿qué debe hacer el piloto antes de empezar a navegar con el INS?", "opts": ["Introducir la coordenada inicial (aeropuerto de origen)", "Nada, porque el sistema se autocalibra", "Alinear la brújula con el Norte magnético", "Sintonizar una estación VOR"], "ans": 0, "why": "El INS calcula la posición sumando incrementos a la coordenada inicial, que hay que conocer.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.1, p. 51", "note": ""}, {"n": 213, "stem": "Según el manual, ¿cuáles son los cuatro componentes básicos de un INS convencional?", "opts": ["Transmisor, receptor, antena e indicador", "Receptor GPS, barómetro, giróscopo y altímetro", "Localizador, senda de descenso, radiobaliza y DME", "Acelerómetros, plataforma inercial, integradores y computador"], "ans": 3, "why": "Son los cuatro componentes del apartado 3.6.1.2.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.2, p. 51", "note": ""}, {"n": 214, "stem": "¿Qué componente del INS convencional mantiene los acelerómetros paralelos a la superficie terrestre, proporcionando una referencia direccional?", "opts": ["Los integradores", "El computador", "La plataforma inercial", "El giróscopo láser"], "ans": 2, "why": "Los integradores transforman la salida de los acelerómetros en velocidad y distancia; el computador las transforma en posición y velocidad sobre el suelo.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.2, p. 51", "note": ""}, {"n": 215, "stem": "¿Qué componente del INS convencional transforma la señal de salida de los acelerómetros en señales de velocidad y de distancia recorrida?", "opts": ["Los integradores", "La plataforma inercial", "El computador", "El radar Doppler"], "ans": 0, "why": "El computador recibe la salida de los integradores y la convierte en latitud, longitud, velocidad sobre el suelo y otras informaciones.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.2, p. 51", "note": ""}, {"n": 216, "stem": "Según el manual, ¿por qué el INS necesita actualizarse periódicamente con otro sistema (VOR, VOR/DME, GPS, etc.)?", "opts": ["Porque no tiene fuente de energía propia", "Porque sus acelerómetros se desgastan con el uso", "Porque lo exige la normativa, sea cual sea su exactitud", "Porque está sujeto a un error sistemático que crece con el tiempo desde la última actualización"], "ans": 3, "why": "Es la explicación del apartado 3.6.1.3.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.3, p. 51", "note": ""}, {"n": 217, "stem": "Según el manual, ¿qué miden, a diferencia de los INS convencionales, los sistemas inerciales de tipo láser de los aviones de nueva tecnología?", "opts": ["Solo la presión barométrica", "La declinación magnética", "Velocidades angulares", "La intensidad de la señal de los satélites"], "ans": 2, "why": "«… a diferencia de los anteriores mede velocidades angulares»; constan de tres giróscopos láser y tres acelerómetros. Cada giróscopo y acelerómetro se orienta hacia uno de los tres ejes principales del avión, para «sentir» la rotación y la aceleración.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.3, p. 52", "note": ""}, {"n": 218, "stem": "Según la nota de la figura «Ejes principales del avión», ¿cómo se denomina el movimiento alrededor del eje longitudinal (eje «x»)?", "opts": ["Cabeceo", "Alabeo", "Guiñada", "Deriva"], "ans": 1, "why": "Longitudinal (x, del morro a la cola): alabeo; transversal (y, de punta a punta de ala): cabeceo; vertical (z): guiñada.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.3, figura, p. 52", "note": ""}, {"n": 219, "stem": "Según la nota de la figura «Ejes principales del avión», ¿alrededor de qué eje se produce el cabeceo (morro arriba o morro abajo)?", "opts": ["El eje longitudinal («x»)", "El eje vertical («z»)", "El eje transversal («y»)", "El eje de la ruta"], "ans": 2, "why": "El eje transversal va del extremo de un ala al de la otra; la guiñada es alrededor del vertical.", "src": "Manual 5 (nov. 2026), capítulo 3.6.1.3, figura, p. 52", "note": ""}, {"n": 220, "stem": "Según el manual, ¿qué proporciona el radar Doppler al piloto?", "opts": ["La posición del avión respecto a una ruta seleccionada", "La altitud de la aeronave sobre el nivel del mar", "Los ecos de precipitación delante del avión", "La verificación del código del transpondedor"], "ans": 0, "why": "Su computador presenta la distancia transversal a la ruta preseleccionada y la distancia por recorrer a lo largo de ella.", "src": "Manual 5 (nov. 2026), capítulo 3.6.2, p. 52", "note": ""}, {"n": 221, "stem": "Según el manual, ¿por qué proceso determina el radar Doppler la situación del avión respecto a la superficie terrestre?", "opts": ["Por intersección de las hipérbolas de situación de varias estaciones", "Por la diferencia horaria de llegada (TDOA) de su señal a varias estaciones", "Por navegación a estima: sumas sucesivas de velocidades por incrementos de tiempo", "Por la medida de la distancia a tres satélites, más un cuarto para el reloj"], "ans": 2, "why": "«… se realiza por el clásico proceso de la navegación a estima»; la energía la emite la aeronave y la recibe tras reflejarse en el suelo.", "src": "Manual 5 (nov. 2026), capítulo 3.6.2.1, p. 52", "note": ""}, {"n": 222, "stem": "Según el manual, ¿cuántos haces de ondas electromagnéticas dirige hacia el suelo el radar Doppler?", "opts": ["Uno solo, vertical", "Dos", "Tres o cuatro", "Seis"], "ans": 2, "why": "La figura muestra cuatro haces: delantero izquierdo y derecho, posterior izquierdo y derecho.", "src": "Manual 5 (nov. 2026), capítulo 3.6.2.2, p. 53", "note": ""}, {"n": 223, "stem": "Según la nota 3 del manual, ¿por qué sufre una variación de frecuencia la energía reflejada que recibe el radar Doppler?", "opts": ["Por la velocidad relativa entre el avión y la superficie terrestre (efecto Doppler)", "Por la absorción de la energía en la atmósfera", "Por la rotación de la antena del avión", "Por la reflexión en las nubes"], "ans": 0, "why": "Es el texto de la nota 3; el sistema se basa en la variación de frecuencia entre las señales emitidas y las recibidas.", "src": "Manual 5 (nov. 2026), capítulo 3.6.2.2, nota 3, p. 53", "note": ""}, {"n": 224, "stem": "Según el manual, ¿cuál es el objetivo de la función de vigilancia?", "opts": ["Obtener un conocimiento exacto y en tiempo real de la ubicación de las aeronaves en un determinado entorno operativo", "Dirigir la aeronave de un lugar geográfico a otro a través de una ruta establecida", "Difundir los datos de interés para las operaciones aéreas", "Asignar automáticamente los códigos de transpondedor"], "ans": 0, "why": "La B es el objetivo de la navegación (apartado 2.2) y la C, de las comunicaciones.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 225, "stem": "Según el manual, ¿en función de qué se distinguen las tres tipologías de sistemas de vigilancia?", "opts": ["De la banda de frecuencias en que trabajan", "Del alcance de sus antenas", "De cómo se determina la información de posición", "Del tipo de espacio aéreo en que se usan"], "ans": 2, "why": "«En función de cómo se determina la información de posición, existen tres tipologías de sistemas»: independiente no cooperativa, independiente cooperativa y dependiente.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 226, "stem": "¿Qué tipología de vigilancia asigna el manual al PSR y al SMR?", "opts": ["Dependiente", "Independiente cooperativa", "Híbrida", "Independiente no cooperativa"], "ans": 3, "why": "Los datos se determinan en las instalaciones terrestres sin la colaboración de la aeronave.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 227, "stem": "Según el manual, ¿requiere el PSR la colaboración activa de la aeronave?", "opts": ["Sí: la aeronave debe llevar un transpondedor", "No: no requiere equipos específicos a bordo", "Sí, pero solo por encima del FL245", "Solo a menos de 50 NM de la antena"], "ans": 1, "why": "El PSR detecta la parte de las ondas que se refleja en la aeronave.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54; capítulo 4.1.1.2, p. 56", "note": ""}, {"n": 228, "stem": "Según el manual, además de la vigilancia de aeronaves, ¿para qué puede emplearse la técnica del radar primario?", "opts": ["Para obtener la identificación y la altitud de las aeronaves", "Para la detección de movimientos en tierra y de determinados fenómenos meteorológicos", "Para las comunicaciones tierra-aire con el piloto", "Para enviar correcciones de integridad GNSS"], "ans": 1, "why": "Lo dice el capítulo 4 y lo repite el apartado 4.1.1.4.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 229, "stem": "Según el manual, ¿dónde se suele situar el radar meteorológico embarcado y de qué tipo de radar se trata?", "opts": ["En la cola; es un tipo de radar secundario", "En el morro; es un tipo de radar primario", "Bajo las alas; es un tipo de radar Doppler de navegación", "En el techo de la cabina; es un tipo de radar de superficie"], "ans": 1, "why": "Es un radar primario que indica la intensidad del clima y detecta el movimiento de las gotas de lluvia y la intensidad de la precipitación.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54", "note": ""}, {"n": 230, "stem": "¿Qué tipología de vigilancia asigna el manual al SSR y a la multilateración?", "opts": ["Independiente cooperativa", "Independiente no cooperativa", "Dependiente", "Dependiente automática"], "ans": 0, "why": "Los datos se determinan en tierra con la colaboración de la aeronave, que debe estar convenientemente equipada.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 55", "note": ""}, {"n": 231, "stem": "Según el manual, ¿a qué tipología de vigilancia pertenece la ADS?", "opts": ["Independiente no cooperativa", "Dependiente", "Independiente cooperativa", "Primaria"], "ans": 1, "why": "Los datos de vigilancia se generan directamente en los equipos de a bordo.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 55", "note": ""}, {"n": 232, "stem": "Según el manual, ¿qué es la WAM?", "opts": ["Un radar primario de vigilancia de área extensa, sin colaboración de la aeronave", "La multilateración utilizada solo en la superficie de los aeropuertos", "La vigilancia dependiente automática utilizada en las zonas oceánicas", "La multilateración utilizada para la vigilancia de áreas más amplias del espacio aéreo"], "ans": 3, "why": "La multilateración puede usarse tanto en la superficie de los aeropuertos y su entorno como en áreas más amplias del espacio aéreo; en este último caso recibe el nombre de multilateración de área extensa, WAM (Wide Area Multilateration).", "src": "Manual 5 (nov. 2026), capítulo 4, p. 55", "note": ""}, {"n": 233, "stem": "Según el manual, ¿cómo transmite la aeronave los datos de vigilancia en la ADS?", "opts": ["Solo cuando la interroga una estación de tierra", "Solo cuando el piloto lo activa manualmente", "Automáticamente, sin interrogación externa", "Solo en situaciones de emergencia"], "ans": 2, "why": "La aeronave determina los datos con sus dispositivos de navegación y los transmite automáticamente, «sin requerirse una interrogación externa o intervención alguna por parte del piloto». Esto extiende la vigilancia a zonas sin cobertura radar, como las oceánicas.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 55", "note": ""}, {"n": 234, "stem": "¿Cómo denomina el manual los impulsos de radiofrecuencia que transmite a intervalos regulares la antena giratoria del PSR?", "opts": ["Señales de respuesta", "Señales de interrogación", "Señales de identificación", "Ecos de superficie"], "ans": 1, "why": "«… una serie de impulsos de radiofrecuencia (denominados señales de interrogación) que -al ser reflejados en el blanco- vuelven a ser recibidos y procesados.»", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.2, p. 56", "note": ""}, {"n": 235, "stem": "Según el manual, ¿qué tres datos proporciona el PSR a partir de la señal reflejada en el blanco?", "opts": ["Identidad, altitud y velocidad", "Distancia, marcación angular y tiempo de la detección", "Combustible, peso e indicativo", "Código de transpondedor, identificación y altitud"], "ans": 1, "why": "El PSR no puede dar identidad ni altitud, que requieren la colaboración de la aeronave (SSR).", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.2, p. 57", "note": ""}, {"n": 236, "stem": "¿A partir de qué obtiene el PSR la marcación angular del blanco?", "opts": ["Del tiempo transcurrido entre la interrogación y la recepción del eco", "Del ángulo de posición de la antena en el instante de recepción de la señal reflejada", "De la respuesta del transpondedor de la aeronave", "De la variación de frecuencia del eco"], "ans": 1, "why": "La distancia sale del tiempo transcurrido (la A); la marcación, del ángulo de la antena.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.2, p. 57", "note": ""}, {"n": 237, "stem": "En la figura «Representación del Sistema Radar», ¿qué significa la presentación PPI?", "opts": ["Pantalla Indicadora de Radar", "Posición Primaria de Interrogación", "Procesador de Plots Integrado", "Precisión de Posición Instantánea"], "ans": 0, "why": "La figura rotula «PRESENTACIÓN PPI (Pantalla Indicadora de Radar)», con haz de barrido, marcación de azimut y círculo de distancia (10 NM).", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.2, figura, p. 57", "note": ""}, {"n": 238, "stem": "Según el manual, ¿en qué bandas de frecuencia trabaja el PSR?", "opts": ["Banda X (de 8 a 12 GHz) solamente", "Banda L (de 1 a 2 GHz) y banda X (de 8 a 12 GHz)", "Banda L (de 1 a 2 GHz) y banda S (de 2 a 4 GHz)", "Banda S (de 2 a 4 GHz) y banda X (de 8 a 12 GHz)"], "ans": 2, "why": "PSR: bandas L y S; SMR: banda X (de 8 a 12 GHz).", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.4, p. 58", "note": ""}, {"n": 239, "stem": "¿Qué inconvenientes atribuye el manual al PSR?", "opts": ["Su elevado coste y su escaso alcance", "Imprecisiones en la identificación y reflejos del terreno", "Que no puede detectar fenómenos meteorológicos", "Que requiere un transpondedor en cada aeronave"], "ans": 1, "why": "«… imprecisiones en la identificación y pérdidas de señales como consecuencia de reflejos producidos por el terreno.» El PSR sí detecta fenómenos meteorológicos y no necesita equipo a bordo.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.4, p. 59", "note": ""}, {"n": 240, "stem": "Según el manual, ¿para qué está diseñado específicamente el SMR (radar de movimiento en superficie)?", "opts": ["Para detectar frentes meteorológicos que se acercan al aeropuerto", "Para resolver conflictos de tránsito en ruta", "Para detectar bandadas de aves", "Para detectar el tráfico de aeronaves y vehículos en la superficie de un aeropuerto"], "ans": 3, "why": "Presenta la imagen completa en una consola de la torre de control y se usa para mejorar la observación visual del personal de la torre en pistas y calles de rodaje.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.5, p. 59", "note": ""}, {"n": 241, "stem": "Según el manual, ¿qué principio de funcionamiento utiliza el SMR?", "opts": ["El del radar secundario: interrogación y respuesta del transpondedor", "El de la multilateración: diferencia horaria de llegada", "El del radar primario: el eco reflejado en el blanco da su distancia y acimut", "El de la ADS-B: radiodifusión de la posición"], "ans": 2, "why": "El SMR es un radar primario particularizado para las superficies de los aeropuertos; su equipo, como el del PSR, es una antena transmisora-receptora con el equipamiento de proceso y presentación.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.5, p. 59", "note": ""}, {"n": 242, "stem": "Según el manual, ¿en qué banda de frecuencia opera el SMR?", "opts": ["Banda L (de 1 a 2 GHz)", "Banda S (de 2 a 4 GHz)", "Banda VHF", "Banda X (de 8 a 12 GHz)"], "ans": 3, "why": "El PSR usa las bandas L y S.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.6, p. 60", "note": ""}, {"n": 243, "stem": "Según el manual, ¿a qué velocidad gira normalmente la antena del SMR en comparación con la del PSR?", "opts": ["SMR, 6-15 revoluciones por minuto; PSR, 1 revolución por segundo", "SMR, 1 revolución por segundo; PSR, 6-15 revoluciones por minuto", "Ambas, 1 revolución por segundo", "Ambas, 6-15 revoluciones por minuto"], "ans": 1, "why": "La antena del SMR, más pequeña y liviana, gira más rápido y da una tasa de actualización más rápida.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.6, p. 60", "note": ""}, {"n": 244, "stem": "¿Qué precisión en acimut da el manual para el SMR en comparación con el PSR?", "opts": ["SMR 1-2 grados; PSR 0,25 grados", "Ambos, 1 grado", "SMR 5 grados; PSR 1 grado", "SMR 0,25 grados; PSR 1-2 grados"], "ans": 3, "why": "La mejora se debe al haz más delgado, que se logra por la mayor frecuencia utilizada.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.6, p. 60", "note": ""}, {"n": 245, "stem": "Según el manual, ¿qué resolución en distancia alcanza el SMR gracias al uso de pulsos más cortos?", "opts": ["Unos 20 m", "Unos 2 m", "Unos 200 m", "Unos 0,25 m"], "ans": 0, "why": "Su alcance operativo, mucho menor, permite pulsos más cortos y una resolución en distancia de unos 20 m.", "src": "Manual 5 (nov. 2026), capítulo 4.1.1.6, p. 60", "note": ""}, {"n": 246, "stem": "Según el manual, ¿sustituye el SSR al PSR?", "opts": ["Sí, el SSR sustituye por completo al PSR", "No: no son sustitutos uno del otro, sino complementarios", "Es el PSR el que sustituye al SSR", "Ninguno de los dos se usa ya"], "ans": 1, "why": "El SSR se desarrolló para aumentar las prestaciones del PSR, pero «no significa que uno sea sustituto del otro, sino más bien complementarios».", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.1, p. 61", "note": ""}, {"n": 247, "stem": "¿Qué técnica dice el manual que mejora la precisión de la marcación angular del SSR?", "opts": ["La técnica monopulso", "La corrección del desplazamiento Doppler", "La triangulación con dos receptores", "La corrección barométrica"], "ans": 0, "why": "El SSR también presenta mayor inmunidad a los fenómenos atmosféricos y facilita la vigilancia en cualquier condición meteorológica.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.1, p. 61", "note": ""}, {"n": 248, "stem": "Según el manual, ¿qué ventaja presenta el SSR frente a los fenómenos atmosféricos?", "opts": ["Ninguna: le afectan más que al PSR", "Solo funciona sin precipitación", "Mayor inmunidad a esos fenómenos", "Detecta la intensidad de la precipitación"], "ans": 2, "why": "«… presenta mayor inmunidad a los fenómenos atmosféricos y facilita la vigilancia en cualquier condición meteorológica». Es una de las mejoras del SSR sobre el PSR, junto con la precisión angular por monopulso.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.1, p. 61", "note": ""}, {"n": 249, "stem": "Según el manual, ¿cómo se llama el equipo de a bordo del SSR?", "opts": ["Interrogador", "Transpondedor o respondedor", "Radiogoniómetro", "ADF"], "ans": 1, "why": "El transpondedor permite que el avión sea seguido e identificado desde tierra. En el DME, en cambio, el de a bordo es el interrogador.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.2, p. 61; capítulo 4.1.2.4, p. 62", "note": ""}, {"n": 250, "stem": "¿Cuál de las siguientes NO figura en la lista de informaciones que, según el manual, proporciona el SSR?", "opts": ["Altitud de la aeronave", "Situaciones de emergencia (fallo, secuestro, etc.)", "Identificación de la aeronave, incluyendo compañía y número de vuelo", "Combustible remanente a bordo"], "ans": 3, "why": "La lista es: distancia, tiempo de la detección, marcación angular, altitud, emergencias, identificación e información de intención.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.2, p. 61", "note": ""}, {"n": 251, "stem": "Según el manual, ¿qué comprende la «información relativa a la intención de la aeronave» que proporciona el SSR?", "opts": ["El plan de vuelo completo y el aeródromo de alternativa", "Nivel de vuelo seleccionado, reporte de giro, rumbo y velocidad", "La próxima frecuencia de comunicaciones", "El tiempo estimado de llegada al destino"], "ans": 1, "why": "Es el último punto de la lista del apartado 4.1.2.2.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.2, p. 61", "note": ""}, {"n": 252, "stem": "Según la tabla de modos del transpondedor, ¿qué ocurre cuando el control de tierra requiere la señal de identificación del modo 3/A?", "opts": ["Se ilumina con mayor intensidad en la pantalla radar el blanco que representa el avión", "Aparece en pantalla el nivel de vuelo del avión", "El transpondedor transmite información a todos los respondedores", "El avión recibe una llamada selectiva"], "ans": 0, "why": "La B es el modo C.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, tabla, p. 62", "note": ""}, {"n": 253, "stem": "Según la tabla del manual, ¿qué debe estar seleccionado para que el transpondedor transmita la señal de altitud del modo C?", "opts": ["Nada más", "El modo S desactivado", "Solo el Intermodo", "También el modo 3/A"], "ans": 3, "why": "«Con este modo conectado, además de estar seleccionado el Modo 3/A, el equipo transmite una señal de altitud (lo que equivale al nivel de vuelo).»", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, tabla, p. 62", "note": ""}, {"n": 254, "stem": "¿Qué modo del transpondedor dice el manual que es «el de mayor uso»?", "opts": ["Modo 3/A", "Modo C", "Intermodo", "Modo S"], "ans": 3, "why": "«En la siguiente tabla se especifican los diferentes modos de trabajo del transpondedor siendo el modo S el de mayor uso.»", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, p. 62", "note": ""}, {"n": 255, "stem": "Según la tabla de modos del transpondedor, ¿qué dos tipos de interrogación incluye el Intermodo?", "opts": ["General, radiodifusión y llamada selectiva", "Interrogación en modos A, C y S, e interrogación en modos A y C solamente", "Interrogación en modo 3/A y en modo C, con respuesta de altitud", "Interrogación en modo S general y llamada selectiva"], "ans": 1, "why": "La A son las tres interrogaciones del modo S.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, tabla, p. 63", "note": ""}, {"n": 256, "stem": "Según la tabla del manual, ¿qué interrogación en modo S no obtiene ninguna respuesta?", "opts": ["La llamada selectiva", "La radiodifusión", "La interrogación en modo S general", "El Intermodo"], "ans": 1, "why": "La radiodifusión transmite información a todos los respondedores en modo S sin obtener respuestas.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, tabla, p. 63", "note": ""}, {"n": 257, "stem": "¿Qué interrogación en modo S obtiene respuesta solo del respondedor al que se ha dirigido una interrogación exclusiva?", "opts": ["La interrogación en modo S general", "La radiodifusión", "El Intermodo", "La llamada selectiva"], "ans": 3, "why": "La llamada selectiva sirve para la vigilancia de determinados respondedores y para la comunicación con ellos.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, tabla, p. 63", "note": ""}, {"n": 258, "stem": "Según el manual, ¿qué permite la operación en modo S?", "opts": ["Controlar muchas aeronaves con más exactitud y rapidez, e intercambiar información específica mediante llamadas selectivas", "Prescindir de las estaciones de tierra, porque las aeronaves se vigilan entre sí", "Obtener la posición de aeronaves sin transpondedor mediante el eco reflejado", "Enviar a cada aeronave la imagen del radar meteorológico de tierra"], "ans": 0, "why": "Además, el modo S mejora la capacidad de suministrar información adicional, como indicadores de emergencia.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.4, p. 63", "note": ""}, {"n": 259, "stem": "¿Cuál de los siguientes es uno de los tres efectos que el manual atribuye al carácter cooperativo del «blanco» en el SSR?", "opts": ["No se requieren potencias tan elevadas como las del radar primario", "Se requieren potencias mayores que las del radar primario", "Todas las respuestas deben ir cifradas", "Se eliminan los receptores de tierra"], "ans": 0, "why": "Los tres efectos: potencias menores que las del primario, receptor sin grandes sensibilidades e intercambio de información iniciado desde tierra o desde el aire.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.5, p. 63", "note": ""}, {"n": 260, "stem": "¿Cuál de los siguientes NO es uno de los tres efectos del carácter cooperativo del «blanco» en el SSR?", "opts": ["No se requieren potencias tan elevadas como las del radar primario", "El receptor no requiere sensibilidades grandes", "Mejor detección de los fenómenos meteorológicos", "Puede intercambiarse información, iniciada desde tierra o desde el aire"], "ans": 2, "why": "La detección de fenómenos meteorológicos es una aplicación del radar primario.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.5, p. 63", "note": ""}, {"n": 261, "stem": "Según el manual, ¿dónde pueden ubicarse los sensores de un sistema de multilateración (MLAT)?", "opts": ["Solo en lo alto de la torre de control, como la antena del SMR", "Dentro del aeropuerto, en y cerca de él, o sobre un área extensa sin radar práctico", "Solo a bordo de las aeronaves y vehículos que se quieren vigilar", "En satélites geoestacionarios que cubren el área de vigilancia"], "ans": 1, "why": "La MLAT se usa para vigilar el tráfico terrestre del aeródromo, el de llegada y salida y, en área extensa, el tráfico en ruta.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, pp. 63-64", "note": ""}, {"n": 262, "stem": "Según el manual, ¿en qué metodología se basa la multilateración?", "opts": ["En el desplazamiento de frecuencia Doppler", "En la triangulación barométrica", "En la diferencia horaria de llegada (TDOA)", "En la comparación de la intensidad de la señal"], "ans": 2, "why": "TDOA (Time Difference of Arrival): la señal de un móvil se mide en varias ubicaciones fijas, o las de varias ubicaciones fijas en un receptor móvil.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 263, "stem": "Según el manual, ¿qué genera matemáticamente conocer el tiempo que tarda la señal en llegar a UNA estación MLAT?", "opts": ["Una posición única calculada", "Una curva hiperbólica de posiciones posibles", "Dos posibles puntos de ubicación", "Una esfera donde podría encontrarse la aeronave"], "ans": 3, "why": "1 estación: esfera; 2: curva hiperbólica; 3: dos puntos; 4: una única posición.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 264, "stem": "Según el manual, ¿qué genera la intersección de las esferas de DOS estaciones MLAT?", "opts": ["Un único punto", "Nada: dos estaciones son insuficientes", "Un círculo perfecto", "Una curva hiperbólica"], "ans": 3, "why": "La aeronave podría situarse sobre esa curva.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 265, "stem": "Según el manual, ¿qué resultado da añadir una TERCERA estación receptora MLAT?", "opts": ["Una posición única calculada", "Dos posibles puntos, uno de ellos normalmente descartable", "Una curva hiperbólica", "Una esfera de posiciones posibles"], "ans": 1, "why": "La posición única exige un cuarto punto de recepción.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 266, "stem": "Según el manual, ¿cuántos puntos de recepción MLAT dan una única posición calculada para el emisor?", "opts": ["Dos", "Cuatro", "Tres", "Seis"], "ans": 1, "why": "Con tres siguen quedando dos puntos posibles.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64", "note": ""}, {"n": 267, "stem": "Según el manual, ¿de qué consta el equipo de tierra de un sistema de multilateración (MLAT)?", "opts": ["De un único radar giratorio situado en la torre de control", "De varias estaciones distribuidas por el área de vigilancia", "De una red de satélites geoestacionarios y sus estaciones de control", "De una antena VHF que radiodifunde correcciones a las aeronaves"], "ans": 1, "why": "«Equipo de tierra MLAT»: varias estaciones distribuidas por el área de vigilancia, que emiten las interrogaciones y procesan las respuestas, más el equipamiento que completa el procesado y presenta la información al usuario; la figura de la página siguiente muestra una «Estación de tierra de un sistema de multilateración».", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6, p. 64; figura, p. 65", "note": ""}, {"n": 268, "stem": "Según el manual, ¿qué equipo de a bordo necesitan las aeronaves o los vehículos para participar en un sistema MLAT?", "opts": ["Un radar Doppler que mide su propia velocidad", "Una plataforma inercial que calcula su posición", "Un receptor GBAS que envía correcciones a tierra", "Un transpondedor, igual que en el radar secundario"], "ans": 3, "why": "Es el apartado de equipo de a bordo de la MLAT (que el manual numera «4.1.2.6» por segunda vez).", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.6 (Equipo de a bordo), p. 66", "note": ""}, {"n": 269, "stem": "Según el manual, ¿cómo se pueden minimizar las áreas sin cobertura de un sistema de multilateración?", "opts": ["Añadiendo o modificando la posición de las estaciones de tierra", "Aumentando la potencia de los transpondedores", "Sustituyendo las estaciones por un radar primario", "Reduciendo el número de aeronaves vigiladas"], "ans": 0, "why": "Como en el SSR, al ser vigilancia cooperativa las respuestas son claras y potentes y se minimiza la pérdida de información.", "src": "Manual 5 (nov. 2026), capítulo 4.1.2.7, p. 66", "note": ""}, {"n": 270, "stem": "Según el manual, ¿qué transmite una aeronave en la ADS (vigilancia dependiente automática)?", "opts": ["Las imágenes del radar meteorológico embarcado, por enlace de datos", "Las comunicaciones de voz del piloto, por un canal VHF dedicado", "Parámetros de sus sistemas de navegación y posicionamiento, por enlace de datos", "Las respuestas de su transpondedor a las interrogaciones del radar secundario"], "ans": 2, "why": "Es la definición de ADS del apartado 4.1.3.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3, p. 67", "note": ""}, {"n": 271, "stem": "Según el manual, ¿qué requiere la técnica ADS a bordo del avión?", "opts": ["Un transpondedor de modo S y un radar meteorológico", "Un sistema de posicionamiento y navegación y un enlace de datos", "Un receptor GBAS y un indicador RMI", "Una plataforma inercial láser solamente"], "ans": 1, "why": "En tierra requiere estaciones que reciban la información ADS para los sistemas de tratamiento de datos de vigilancia. La ADS proporciona identificación, posición e información adicional, como la velocidad.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.1, p. 67", "note": ""}, {"n": 272, "stem": "Según el manual, ¿qué caracteriza a la ADS-C (contrato)?", "opts": ["La radiodifusión a cualquier usuario equipado, sin acuerdo previo", "Un acuerdo entre la aeronave y el sistema de tierra", "Una única transmisión en el despegue", "Un intercambio de datos solo entre estaciones de tierra"], "ans": 1, "why": "Se establece un acuerdo («contrato») entre la aeronave y el sistema de tierra que fija las condiciones en que se transmite la información. La A es la ADS-B.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.2, p. 67", "note": ""}, {"n": 273, "stem": "Según el manual, ¿en qué condiciones se transmite la información de la ADS-C?", "opts": ["Una sola vez por vuelo, al salir del espacio aéreo con cobertura radar", "Solo cuando el piloto lo solicita, mediante una acción manual en cabina", "De forma periódica y/o ante una circunstancia, y también bajo demanda", "Solo en emergencias, junto con el código de transpondedor correspondiente"], "ans": 2, "why": "«… forma periódica y/o bajo la ocurrencia de una determinada circunstancia, como puede ser el sobrevuelo de fijos» del plan de vuelo; el sistema de tierra también puede obtener información en cualquier momento con los «contratos bajo demanda».", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.2, p. 67", "note": ""}, {"n": 274, "stem": "Según el manual, ¿qué caracteriza a la ADS-B (radiodifusión)?", "opts": ["Un contrato punto a punto entre la aeronave y un sistema de tierra concreto", "Parámetros transmitidos en radiodifusión, para cualquier usuario equipado en el aire o en tierra", "Un sistema de uso exclusivamente militar, cifrado y sin receptores civiles", "La transmisión de datos solo cuando la aeronave es interrogada desde tierra"], "ans": 1, "why": "La A es la ADS-C.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.2, p. 67", "note": ""}, {"n": 275, "stem": "Según el manual, ¿cuáles son las dos características definitorias fundamentales de la ADS?", "opts": ["Manual e independiente", "Automática y dependiente", "Cooperativa y no cooperativa", "Primaria y secundaria"], "ans": 1, "why": "Automática: no necesita la intervención del piloto; dependiente: la información se genera en la aeronave y depende de sus sistemas de a bordo.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.3, p. 68", "note": ""}, {"n": 276, "stem": "Según el manual, ¿qué técnica ADS se usa hoy para la vigilancia en zonas oceánicas y cuál se está considerando?", "opts": ["Hoy ADS-B; se considera la ADS-C vía satélite", "Ninguna se usa en zonas oceánicas", "Hoy el PSR; se considera la ADS-C", "Hoy ADS-C; se considera la ADS-B vía satélite"], "ans": 3, "why": "«… zonas oceánicas (a día de hoy mediante ADS-C, aunque se está considerando el uso de ADS-B vía satélite).»", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.3, p. 68", "note": ""}, {"n": 277, "stem": "Según el manual, además de en las zonas oceánicas, ¿dónde es esencial la ADS para mejorar la vigilancia?", "opts": ["Solo en el área de maniobras de los aeropuertos, en sustitución del SMR", "Solo en zonas de ejercicios militares sin cobertura de radar secundario", "En zonas continentales sin radar, y para racionalizar la vigilancia de zonas con radar mediante ADS-B", "En ninguna otra: en las zonas continentales se mantiene solo el radar"], "ans": 2, "why": "Es el texto del apartado 4.1.3.3.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.3, p. 68", "note": ""}, {"n": 278, "stem": "Según la lista de acrónimos del manual, ¿qué significa FAF y para qué procedimientos se indica?", "opts": ["Punto de aproximación final; procedimientos de precisión ILS", "Referencia de altitud de vuelo; todos los procedimientos", "Punto de referencia de aproximación final; procedimientos de no precisión como VOR, NDB, LOC", "Frecuencia fija de aproximación; solo radioayudas"], "ans": 2, "why": "FAF (Final approach fix) es para no precisión; FAP (Final approach point, la A), para precisión ILS.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 279, "stem": "Según la lista de acrónimos del manual, ¿para qué procedimientos se indica el FAP (punto de aproximación final)?", "opts": ["Para procedimientos de no precisión como VOR, NDB y LOC", "Para procedimientos de precisión ILS", "Para salidas normalizadas por instrumentos", "Para procedimientos de llegada RNAV"], "ans": 1, "why": "FAP: precisión (ILS); FAF: no precisión (VOR, NDB, LOC).", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 280, "stem": "Según la lista de acrónimos del manual, ¿qué significa THDG?", "opts": ["Rumbo magnético", "Ruta magnética", "Velocidad respecto al suelo", "Rumbo verdadero"], "ans": 3, "why": "THDG: Rumbo verdadero / True heading; HDG: Rumbo / Heading; GS: velocidad respecto al suelo.", "src": "Manual 5 (nov. 2026), capítulo 5, pp. 69-70", "note": ""}, {"n": 281, "stem": "Según la lista de acrónimos del manual, ¿qué significa EGNOS?", "opts": ["Sistema europeo de navegación por satélite Galileo", "Sistema de aumentación basado en tierra europeo", "Servicio europeo de complemento geoestacionario de navegación", "Sistema global de navegación por satélite de Rusia"], "ans": 2, "why": "EGNOS = European Geostationary Navigation Overlay Service. La D es GLONASS.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 69", "note": ""}, {"n": 282, "stem": "¿Qué intervalo de frecuencias da la lista de acrónimos del manual para la UHF?", "opts": ["De 300 a 3000 MHz", "De 30 a 300 MHz", "De 3 a 30 MHz", "De 3000 a 30000 MHz"], "ans": 0, "why": "UHF: 300 a 3000 MHz; VHF: 30 a 300 MHz.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 70", "note": ""}, {"n": 283, "stem": "¿Qué intervalo de frecuencias da la lista de acrónimos del manual para la VHF?", "opts": ["De 300 a 3000 MHz", "De 3 a 30 MHz", "De 30 a 300 MHz", "De 0,3 a 3 MHz"], "ans": 2, "why": "VHF: 30 a 300 MHz (localizador, radiobalizas, VOR); UHF: 300 a 3000 MHz (senda de descenso).", "src": "Manual 5 (nov. 2026), capítulo 5, p. 70", "note": ""}, {"n": 284, "stem": "Según la lista de acrónimos del manual, ¿qué significa WAAS?", "opts": ["Multilateración de área extensa", "Sistema de aumentación satelital multifunción (Japón)", "Sistema de aumentación de área amplia (EE. UU.)", "Servicio europeo de complemento geoestacionario de navegación"], "ans": 2, "why": "WAAS = Wide Area Augmentation System, el SBAS de EE. UU. La A es WAM (Wide Area Multilateration, capítulo 4), la B es MSAS y la D es EGNOS.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 71", "note": ""}, {"n": 285, "stem": "¿Qué norma española cita la bibliografía del manual 5?", "opts": ["El Real Decreto 57/2002, por el que se aprueba el Reglamento de Circulación Aérea", "El Real Decreto 1180/2018, que desarrolla el reglamento SERA", "La Ley 48/1960, sobre Navegación Aérea", "La Ley 21/2003, de Seguridad Aérea"], "ans": 0, "why": "La bibliografía cita «España. Real Decreto 57/2002, de 18 de enero, por el que se aprueba el Reglamento de Circulación Aérea»; las otras normas no aparecen en ella.", "src": "Manual 5 (nov. 2026), capítulo 6, p. 72", "note": ""}, {"n": 286, "stem": "Según la bibliografía del manual, ¿qué documento de la OACI es el «Manual sobre el sistema mundial de navegación por satélite (GNSS)»?", "opts": ["Doc 9613", "Anexo 10", "Anexo 4", "Doc 9849"], "ans": 3, "why": "Doc 9613: PBN; Anexo 10: radioayudas; Anexo 4: cartas aeronáuticas; Doc 9849: GNSS.", "src": "Manual 5 (nov. 2026), capítulo 6, p. 72", "note": ""}, {"n": 287, "stem": "¿Qué sistema de vigilancia no requiere la colaboración activa de la aeronave?", "opts": ["El radar secundario (SSR)", "La multilateración (MLAT)", "El radar primario (PSR)", "La vigilancia ADS-B"], "ans": 2, "why": "El manual define el PSR como «un sistema que no requiere la colaboración activa de la aeronave» y, en 4.1.1.2, como sistema independiente no cooperativo que «no requiere de equipos específicos a bordo». El SSR y la MLAT son independientes cooperativos (necesitan transpondedor) y la ADS-B es dependiente. Un examen real (8-feb-2026, convocatoria 2025) preguntó este dato desde esta dirección.", "src": "Manual 5 (nov. 2026), capítulo 4, p. 54; capítulo 4.1.1.2, p. 56", "note": ""}, {"n": 288, "stem": "¿Qué significa RNAV?", "opts": ["Navegación de área", "Navegación radioeléctrica convencional", "Performance de navegación requerida", "Navegación por satélite"], "ans": 0, "why": "Lista de acrónimos: «RNAV Navegación de área / Area navigation». «Performance de navegación requerida» es la RNP y la navegación radioeléctrica convencional es otra técnica (vuelo hacia o desde radioayudas). El examen real de 2026 preguntó el significado de RNAV.", "src": "Manual 5 (nov. 2026), capítulo 5, p. 70", "note": ""}, {"n": 289, "stem": "¿Qué componente del ILS materializa la senda de descenso?", "opts": ["LOC", "GP", "OM", "CDI"], "ans": 1, "why": "Los tres componentes terrestres del ILS son el localizador (LOC), la senda de descenso (GP) y las radiobalizas (OM, MM, IM). La GP emite señales que materializan un plano oblicuo que nace de la zona de toma de contacto, con un ángulo aproximado de tres grados. El LOC materializa el plano vertical del eje, la OM es la radiobaliza exterior y el CDI es el indicador del VOR. El examen real de 2026 preguntó este dato.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, pp. 32-33", "note": ""}, {"n": 290, "stem": "¿Qué técnica transmite la posición y la identificación de la aeronave en modo de radiodifusión, para cualquier usuario equipado?", "opts": ["ADS-C", "WAM", "SSR", "ADS-B"], "ans": 3, "why": "La ADS-B (radiodifusión) transmite parámetros de la aeronave, «como posición e identificación, a través de un enlace de datos en modo de radiodifusión, para ser utilizados por cualquier usuario convenientemente equipado en el aire y/o en tierra». La ADS-C funciona por contrato con un sistema de tierra concreto; la WAM es multilateración de área extensa y el SSR responde a interrogaciones. El examen real de 2026 preguntó este dato.", "src": "Manual 5 (nov. 2026), capítulo 4.1.3.2, p. 67", "note": ""}, {"n": 291, "stem": "¿Qué significa CNS?", "opts": ["Comunicaciones, navegación y vigilancia", "Control, navegación y seguridad", "Coordinación, navegación y separación", "Comunicaciones, navegación y supervisión"], "ans": 0, "why": "Servicios de Comunicaciones, Navegación y Vigilancia (CNS / Communications, Navigation and Surveillance), que actúan como soporte del ATM; la lista de acrónimos da la misma expansión. El examen real de 2026 preguntó el significado de CNS.", "src": "Manual 5 (nov. 2026), capítulo 2.1, p. 6; capítulo 5, p. 69", "note": ""}, {"n": 292, "stem": "El DME que hoy sustituye a las radiobalizas del ILS da información constante de distancia:", "opts": ["a la antena del localizador", "al umbral de la pista", "a la radiobaliza exterior", "al extremo de parada de la pista"], "ans": 1, "why": "«En la actualidad, las radiobalizas han sido sustituidas por DME coemplazado con la senda planeo, ya que da información constante de distancia al umbral»; el umbral es el «comienzo de la parte de pista utilizable para el aterrizaje». El examen real de 2023 preguntó a qué da distancia el DME instalado con un ILS.", "src": "Manual 5 (nov. 2026), capítulo 3.3.4.2, p. 34", "note": ""}, {"n": 293, "stem": "En la PBN, la exactitud se define como:", "opts": ["la capacidad del sistema para desconectarse automáticamente, o advertir al usuario, cuando no deba usarse", "la capacidad del sistema para realizar sus funciones durante una operación, sin interrupciones imprevistas", "la capacidad del sistema para realizar sus funciones al inicio de una operación", "la diferencia entre la posición indicada por el sistema de navegación y la posición real de la aeronave"], "ans": 3, "why": "Exactitud: «la diferencia entre la posición indicada por el sistema de navegación y la posición real de la aeronave». A es la integridad, B la continuidad y C la disponibilidad. El examen real de 2017 preguntó la definición a partir del término.", "src": "Manual 5 (nov. 2026), capítulo 3.1.1, tabla, p. 11", "note": ""}, {"n": 294, "stem": "En el indicador VOR, ¿qué elemento determina el cuadrante de situación de la aeronave?", "opts": ["El indicador TO/FROM", "El selector de radiales (OBS)", "El CDI", "La aguja del RMI"], "ans": 2, "why": "«La indicación del CDI determina el cuadrante de situación (dentro del semiplano de situación)». El TO/FROM determina el semiplano, el OBS sirve para seleccionar el radial y el RMI es un indicador del ADF. El examen real de 2017 preguntó qué elemento indica el cuadrante.", "src": "Manual 5 (nov. 2026), capítulo 3.3.2.4, pp. 25-26", "note": ""}, {"n": 295, "stem": "En el apartado 3.2.2, la definición completa «Sistema de ayuda a la navegación aprobado para una determinada operación o fase de vuelo que debe satisfacer los requisitos establecidos de precisión e integridad, sin necesidad de cumplir las condiciones de disponibilidad y continuidad en el servicio» corresponde al:", "opts": ["medio único", "medio principal o primario", "medio suplementario", "medio secundario o de apoyo"], "ans": 1, "why": "Es la definición literal y completa de «medio principal o primario». El medio único debe cumplir los cuatro requisitos; el suplementario repite esa frase como segunda oración, pero su definición empieza por que «debe utilizarse juntamente con un sistema considerado como medio único», condición que no está en la definición citada. «Medio secundario o de apoyo» no figura en el manual. El examen real de 2017 dio esta definición y pidió el término (clave: primario).", "src": "Manual 5 (nov. 2026), capítulo 3.2.2, p. 14", "note": ""}, {"n": 296, "stem": "Una ayuda a la navegación aprobada para una operación o fase de vuelo que debe utilizarse juntamente con un sistema considerado como medio único es un:", "opts": ["medio principal o primario", "medio secundario", "medio complementario", "medio suplementario"], "ans": 3, "why": "«Medio suplementario: Sistema de ay
