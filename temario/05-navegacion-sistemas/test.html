<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Navegación, equipos y sistemas</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id const Q=[{"n": 1, "stem": "Según el manual de ENAIRE, el SNA (Sistema de Navegación Aérea) se define como:", "opts": ["Solo los equipos técnicos que se utilizan para la navegación", "El conjunto de elementos jurídicos, organizativos, técnicos y operativos que permiten llevar a cabo las operaciones aéreas de una manera segura, fluida y eficiente", "El anexo de la OACI que regula la navegación aérea", "El departamento de planificación de vuelos de la propia compañía aérea"], "ans": 1, "why": "El manual define el SNA exactamente como «el conjunto de elementos jurídicos, organizativos, técnicos y operativos»; las demás opciones reducen o desvirtúan la definición.", "src": "Manual p.5", "note": ""}, {"n": 2, "stem": "Dentro del concepto CNS-ATM, ¿qué grupo de servicios se relaciona con la organización del espacio aéreo, la gestión de afluencia y el control del tránsito aéreo?", "opts": ["CNS", "AIS", "SAR", "ATM"], "ans": 3, "why": "El ATM (gestión del tránsito aéreo) abarca la organización del espacio aéreo, la gestión de afluencia, el control y el suministro de información y alerta; el CNS son los servicios técnicos de soporte.", "src": "Manual p.6", "note": ""}, {"n": 3, "stem": "¿Cuál de los siguientes NO es uno de los tres servicios CNS que describe el manual?", "opts": ["Comunicaciones", "Navegación", "Vigilancia", "Meteorología"], "ans": 3, "why": "El CNS abarca únicamente comunicaciones, navegación y vigilancia; la meteorología no forma parte del CNS en el manual.", "src": "Manual p.6", "note": ""}, {"n": 4, "stem": "Según el manual, ¿en cuántas fases se divide el vuelo de una aeronave?", "opts": ["Cuatro", "Cinco", "Ocho", "Seis"], "ans": 3, "why": "El texto del manual dice seis fases (aunque en la lista de viñetas solo enumera cinco; la figura que la acompaña confirma seis: despegue, SID, ruta, STAR, aproximación y aterrizaje).", "src": "Manual p.6-7", "note": ""}, {"n": 5, "stem": "¿En qué fase del vuelo dice el manual que la aeronave «completa la mayor parte del trayecto, realizando el vuelo de manera estable y nivelada»?", "opts": ["Aproximación", "Ascenso (salida)", "Aterrizaje", "Ruta"], "ans": 3, "why": "El manual define la fase de ruta como el vuelo estable y nivelado durante la mayor parte del trayecto.", "src": "Manual p.7", "note": ""}, {"n": 6, "stem": "La «función de guiado» en la navegación aérea se define como:", "opts": ["Conocer la posición de la aeronave en todo momento", "Seleccionar la altitud de crucero", "Dirigir la aeronave para mantener la ruta establecida, según los datos de posición", "Comunicarse con el control de tránsito aéreo"], "ans": 2, "why": "El manual divide la navegación en posicionamiento (conocer la posición) y guiado (dirigir la aeronave para mantener la ruta). La A es la función de posicionamiento; la B y la D no guardan relación con la definición.", "src": "Manual p.7", "note": ""}, {"n": 7, "stem": "Según el manual, las exigencias de navegación son mayores en las fases inicial y final del vuelo que en ruta porque:", "opts": ["Lo exigen las condiciones de vuelo y el riesgo de colisión con otras aeronaves y con obstáculos", "Se requiere más comunicación con el control de tránsito aéreo", "La aeronave vuela más rápido", "El tiempo meteorológico es siempre peor cerca del suelo"], "ans": 0, "why": "El manual atribuye expresamente las mayores exigencias a las condiciones de vuelo y al riesgo de colisión con aeronaves Y obstáculos, frente a solo el riesgo con otras aeronaves en ruta.", "src": "Manual p.7", "note": ""}, {"n": 8, "stem": "La navegación a estima se basa en tres parámetros. ¿Cuáles son?", "opts": ["Altitud, presión y temperatura", "Velocidad, tiempo y rumbo", "Distancia, combustible y peso", "Frecuencia, potencia y alcance"], "ans": 1, "why": "El manual define la navegación a estima como la técnica basada en la velocidad, el tiempo y el rumbo de la aeronave.", "src": "Manual p.9", "note": ""}, {"n": 9, "stem": "¿Qué factores dice el manual que NO se tienen en cuenta en la navegación a estima, lo que provoca imprecisión?", "opts": ["El consumo de combustible y el peso", "Las interferencias de radio", "Solo la declinación magnética", "El viento y los errores de pilotaje e instrumentales"], "ans": 3, "why": "Las observaciones del manual sobre la navegación a estima citan expresamente el viento y los errores de pilotaje e instrumentales como factores no considerados.", "src": "Manual p.9", "note": ""}, {"n": 10, "stem": "Según el manual, ¿qué tipo de red de rutas determina la navegación radioeléctrica convencional?", "opts": ["Una red de rutas fija, supeditada a la configuración existente de radioayudas", "Una red de rutas libre y flexible", "Una red de rutas exclusivamente por satélite", "Ninguna red de rutas"], "ans": 0, "why": "El manual indica que esta técnica determina una red de rutas fija, ligada al emplazamiento de las radioayudas, que limita la utilización de la capacidad disponible.", "src": "Manual p.9", "note": ""}, {"n": 11, "stem": "Según el manual, ¿cómo se definen las rutas RNAV?", "opts": ["Mediante las coordenadas de latitud y longitud de los puntos de recorrido, sin necesidad de que coincidan con instalaciones terrestres de radioayudas", "Solo mediante radiales VOR", "Exclusivamente mediante marcaciones NDB", "Mediante aerovías fijas publicadas solo en cartas de papel"], "ans": 0, "why": "Los puntos de recorrido de la RNAV se definen por coordenadas de latitud y longitud y no tienen por qué coincidir con las instalaciones de radioayudas en tierra.", "src": "Manual p.9-10", "note": ""}, {"n": 12, "stem": "Según el manual, ¿qué tres conceptos se han desarrollado dentro de la navegación de área?", "opts": ["VOR, DME, NDB", "Especificación RNAV, especificación RNP y concepto PBN", "SID, STAR, aproximación", "PSR, SSR, ADS"], "ans": 1, "why": "El manual enumera expresamente estos tres conceptos desarrollados con la navegación de área.", "src": "Manual p.10", "note": ""}, {"n": 13, "stem": "¿Cuál es la diferencia clave entre la especificación RNAV y la especificación RNP?", "opts": ["La RNAV requiere navegación por satélite; la RNP no", "La RNP incluye el requisito de vigilancia y alerta de la performance a bordo; la RNAV no", "La RNAV solo se usa en espacio oceánico; la RNP solo en espacio continental", "No hay diferencia; son sinónimos"], "ans": 1, "why": "Este requisito de vigilancia y alerta a bordo es la distinción que define el manual entre la RNP y la RNAV.", "src": "Manual p.10", "note": ""}, {"n": 14, "stem": "Según la tabla del manual, ¿qué añade la RNAV 3D respecto a la RNAV 2D?", "opts": ["Guiado en el plano vertical", "Previsiones de tiempo de vuelo", "Guiado en el plano horizontal", "Capacidad de posicionamiento"], "ans": 0, "why": "La RNAV 2D da posicionamiento y guiado horizontal; la RNAV 3D añade guiado en el plano vertical; la RNAV 4D añade además previsiones de tiempo.", "src": "Manual p.11, figura", "note": ""}, {"n": 15, "stem": "¿Qué parámetro PBN define el manual como «la capacidad del sistema para realizar sus funciones durante una determinada operación aérea, sin sufrir interrupciones imprevistas en el servicio»?", "opts": ["Exactitud", "Continuidad", "Integridad", "Disponibilidad"], "ans": 1, "why": "Es la definición literal de continuidad del manual, que se expresa como número de interrupciones por intervalo de tiempo o por operación.", "src": "Manual p.11-12", "note": ""}, {"n": 16, "stem": "¿Qué parámetro PBN se define como «la capacidad del sistema para realizar sus funciones al inicio de una operación», expresada como porcentaje de tiempo operativo?", "opts": ["Integridad", "Continuidad", "Exactitud", "Disponibilidad"], "ans": 3, "why": "La disponibilidad, según el manual, se juzga al inicio de la operación y se expresa como el porcentaje de tiempo en que el sistema cumple todos los requerimientos.", "src": "Manual p.12", "note": ""}, {"n": 17, "stem": "En la RNAV X / RNP X, el número X representa:", "opts": ["La altitud máxima de crucero en miles de pies", "El número de puntos de recorrido de la ruta", "La precisión de navegación lateral (TSE) en NM que se espera lograr al menos durante el 95 % del tiempo de vuelo", "El número mínimo de satélites requerido"], "ans": 2, "why": "El manual indica que X es la precisión lateral, en millas náuticas, que se logra al menos durante el 95 % del tiempo de vuelo.", "src": "Manual p.12", "note": ""}, {"n": 18, "stem": "Según la tabla del manual basada en el Doc. 9613, la RNAV 10 se usa para apoyar operaciones:", "opts": ["Solo en áreas de maniobras terminales", "Solo durante la aproximación final", "En ruta, en espacio aéreo oceánico o áreas remotas, para mantener mínimos de separación longitudinal basados en la distancia", "Solo en SID y STAR"], "ans": 2, "why": "La RNAV 10 apoya operaciones en ruta oceánicas o remotas con separación basada en la distancia; históricamente se la designa también «RNP 10».", "src": "Manual p.12", "note": ""}, {"n": 19, "stem": "Según el manual, ¿dónde se usa la RNAV 5?", "opts": ["Solo en ruta oceánica", "Solo en aproximación final", "En ruta, en espacio aéreo continental", "Solo en SID"], "ans": 2, "why": "La RNAV 5 apoya operaciones RNAV en ruta en espacio aéreo continental, según la tabla del manual.", "src": "Manual p.12-13", "note": ""}, {"n": 20, "stem": "Según el manual, ¿qué NO tiene previsto la Unión Europea para la RNAV 1 y la RNAV 2?", "opts": ["El uso de la RNAV 1 en cualquier parte", "El uso de la RNAV 2 en SID/STAR", "No hay restricciones en la UE", "El uso de la RNAV 2, ni el de la RNAV 1 en fase de ruta"], "ans": 3, "why": "El manual indica expresamente que en la UE no está previsto el uso de la RNAV 2, ni el de la RNAV 1 en fase de ruta.", "src": "Manual p.13", "note": ""}, {"n": 21, "stem": "Según el manual, la RNP 4 se usa para apoyar operaciones:", "opts": ["En ruta, en espacio aéreo oceánico o áreas remotas, para mantener mínimos de separación longitudinal basados en la distancia", "Solo en SID y STAR", "Solo en el área terminal", "En todas las fases por igual"], "ans": 0, "why": "La RNP 4, como la RNAV 10, se limita a la ruta oceánica o remota con separación basada en la distancia.", "src": "Manual p.13", "note": ""}, {"n": 22, "stem": "Según el manual, ¿en qué condiciones se usa la RNP 1?", "opts": ["En SID, STAR y aproximaciones (tramos inicial, intermedio y de frustrada), con vigilancia ATS limitada o sin ella y tránsito de baja a media densidad", "Solo para helicópteros", "Solo en operaciones oceánicas", "Solo para la RNP AR APCH"], "ans": 0, "why": "El manual especifica estas condiciones exactas para la RNP 1, e indica además que puede utilizar tramos curvos de radio fijo.", "src": "Manual p.13", "note": ""}, {"n": 23, "stem": "Según el manual, ¿cuál es el valor de RNP en el tramo final de una aproximación RNP APCH?", "opts": ["1 NM", "4 NM", "0,3 NM", "2 NM"], "ans": 2, "why": "La RNP APCH apoya operaciones de aproximación de hasta RNP 0,3 NM, según el manual.", "src": "Manual p.13", "note": ""}, {"n": 24, "stem": "Según el manual, ¿dónde puede usar la RNP APCH tramos curvos de radio fijo?", "opts": ["En cualquier parte del procedimiento, incluida la aproximación final", "Solo en la aproximación inicial o intermedia, o en algunas partes de la aproximación frustrada", "Nunca", "Solo en la aproximación final"], "ans": 1, "why": "A diferencia de la RNP AR APCH, la RNP APCH restringe los tramos curvos de radio fijo a los segmentos inicial, intermedio y de frustrada.", "src": "Manual p.13", "note": ""}, {"n": 25, "stem": "¿Qué especificación RNP permite tramos curvos de radio fijo en cualquier parte del procedimiento, incluida la aproximación final?", "opts": ["RNP APCH", "RNP 4", "RNP AR APCH", "RNAV 5"], "ans": 2, "why": "La RNP AR APCH está diseñada para tramos rectos y/o curvos de radio fijo en cualquier parte del procedimiento, incluida la aproximación final.", "src": "Manual p.13", "note": ""}, {"n": 26, "stem": "Según el manual, ¿a qué operaciones se dirige principalmente la RNP 0,3?", "opts": ["Operaciones de helicópteros", "Travesías oceánicas", "Crucero a gran altitud", "Solo aeronaves de carga"], "ans": 0, "why": "El manual indica que la RNP 0,3 se dirige principalmente a operaciones de helicópteros.", "src": "Manual p.13", "note": ""}, {"n": 27, "stem": "¿Qué dice el manual sobre el uso de la A-RNP (RNP avanzada) en la Unión Europea?", "opts": ["Es obligatorio", "Sustituye a la RNP 4", "Solo se usa en operaciones oceánicas en la UE", "No está previsto su uso en la UE"], "ans": 3, "why": "El manual indica expresamente que no está previsto el uso de la A-RNP en la Unión Europea.", "src": "Manual p.13-14", "note": ""}, {"n": 28, "stem": "Según la nota a pie de página del manual, ¿qué significa baro-VNAV?", "opts": ["Un sistema de navegación de reserva que usa referencias visuales", "Un sistema de aumentación basado en tierra", "Un tipo de modo del transpondedor", "Un sistema que proporciona guiado vertical a través de información baroaltimétrica"], "ans": 3, "why": "La nota 1 define la baro-VNAV como guiado vertical obtenido a partir de información baroaltimétrica.", "src": "Manual p.13 (nota 1)", "note": ""}, {"n": 29, "stem": "¿Cuál de estas ventajas de la RNAV, la RNP y la PBN figura en el manual?", "opts": ["La eliminación de todos los errores de navegación", "Mayor flexibilidad en el diseño de la red de rutas, que permite optimizar la capacidad del espacio aéreo", "La supresión de toda necesidad de infraestructura terrestre", "La reducción garantizada del tiempo de vuelo a cero"], "ans": 1, "why": "El manual enumera como ventaja declarada la flexibilidad en el diseño de la red de rutas y la mejor capacidad y utilización del espacio aéreo.", "src": "Manual p.14", "note": ""}, {"n": 30, "stem": "Una ayuda a la navegación clasificada como «medio único» debe satisfacer, según el manual:", "opts": ["Solo exactitud e integridad", "Los cuatro requisitos de prestación: exactitud, integridad, continuidad y disponibilidad", "Solo disponibilidad", "Ningún requisito específico"], "ans": 1, "why": "Solo la clasificación de medio único exige los cuatro parámetros de performance de la PBN; el medio primario y el suplementario solo necesitan exactitud e integridad.", "src": "Manual p.15", "note": ""}, {"n": 31, "stem": "¿Con qué debe utilizarse una ayuda a la navegación de «medio suplementario»?", "opts": ["Con otro medio suplementario", "Con ningún otro sistema; funciona sola", "Con un sistema de medio único", "Solo con un sistema hiperbólico"], "ans": 2, "why": "El manual define el medio suplementario como aquel que debe utilizarse juntamente con un sistema considerado como medio único.", "src": "Manual p.15", "note": ""}, {"n": 32, "stem": "Según el manual, ¿qué define a un sistema de navegación «no autónomo»?", "opts": ["Un equipo de a bordo que proporciona información de navegación a partir de datos suministrados por una infraestructura externa a la aeronave", "Un sistema que no requiere ninguna infraestructura", "Un sistema que solo utiliza el control de tránsito aéreo", "Un sistema basado únicamente en referencias visuales"], "ans": 0, "why": "Los sistemas no autónomos dependen de datos de una infraestructura externa (terrestre o espacial), a diferencia de los sistemas autónomos.", "src": "Manual p.16", "note": ""}, {"n": 33, "stem": "¿Qué dos sistemas enumera el manual como sistemas de navegación «autónomos»?", "opts": ["VOR y NDB", "GBAS y SBAS", "PSR y SSR", "Radar Doppler y equipos inerciales (INS)"], "ans": 3, "why": "La clasificación del manual enumera exactamente el radar Doppler y el INS como sistemas autónomos.", "src": "Manual p.19", "note": ""}, {"n": 34, "stem": "¿Qué cuatro sistemas enumera el manual como sistemas terrestres de «radioayudas»?", "opts": ["NDB, VOR, DME, ILS", "PSR, SSR, MLAT, ADS", "GPS, GLONASS, Galileo, BeiDou", "PAPI, APAPI, T-VASIS, ALS"], "ans": 0, "why": "Estos cuatro son los tipos de radioayudas del manual dentro de «no autónomos, terrestres, por radioayudas».", "src": "Manual p.16", "note": ""}, {"n": 35, "stem": "Según el manual, ¿cuántos satélites debe captar simultáneamente un receptor GNSS para obtener datos de posición y guiado?", "opts": ["2 o más", "3 o más", "4 o más", "6 o más"], "ans": 2, "why": "El manual indica que se proporcionan datos de posición y guiado cuando se reciben simultáneamente señales de 4 satélites o más.", "src": "Manual p.17", "note": ""}, {"n": 36, "stem": "Según el manual, ¿qué proporciona el NDB (radiofaro no direccional)?", "opts": ["Guiado horizontal y vertical de precisión", "Solo distancia", "Solo guiado horizontal (rumbos)", "Posición en latitud/longitud"], "ans": 2, "why": "El manual indica que el NDB proporciona solo guiado horizontal (rumbos), no distancia ni guiado vertical.", "src": "Manual p.20", "note": ""}, {"n": 37, "stem": "Según el manual, ¿cómo transmite su señal la estación terrestre del NDB?", "opts": ["De forma direccional, en un haz estrecho", "De forma omnidireccional, en los 360 grados", "Solo hacia la aeronave que la ha solicitado", "Mediante un repetidor por satélite"], "ans": 1, "why": "El manual describe un transmisor convencional que emite una señal omnidireccional en todas direcciones.", "src": "Manual p.20", "note": ""}, {"n": 38, "stem": "Según la descripción del manual, ¿qué es el ADF?", "opts": ["La antena/receptor de a bordo que procesa la señal del NDB para el piloto", "El transmisor terrestre del sistema NDB", "Un tipo de radiobaliza del ILS", "Un sistema de aumentación por satélite"], "ans": 0, "why": "El ADF (equipo radiogoniométrico automático) es el componente de a bordo que procesa la señal del NDB.", "src": "Manual p.21", "note": ""}, {"n": 39, "stem": "Para volar HACIA una estación NDB, según el manual, el piloto debe:", "opts": ["Virar hacia el mismo lado que indica la aguja del ADF, hasta que la cabeza de la aguja quede alineada con la proa de la aeronave", "Virar en sentido contrario a la indicación de la aguja", "Mantener solo una altitud constante", "Ignorar la aguja y usar el GPS"], "ans": 0, "why": "Es el procedimiento exacto del manual para volar hacia una estación NDB con la aguja del ADF.", "src": "Manual p.21", "note": ""}, {"n": 40, "stem": "¿Qué indicador del NDB tiene una rosa de rumbos fija, con una aguja que muestra la dirección de la señal respecto al eje longitudinal de la aeronave?", "opts": ["RMI", "CDI", "RBI", "Panel ADF"], "ans": 2, "why": "El RBI (radioindicador de rumbo) tiene una rosa fija; el RMI tiene una rosa giratoria combinada con el rumbo.", "src": "Manual p.21-22", "note": ""}, {"n": 41, "stem": "¿Qué indicador del NDB combina el rumbo de la aeronave con la aguja del ADF en una rosa giratoria?", "opts": ["RBI", "RMI", "CDI", "OBS"], "ans": 1, "why": "El RMI (indicador radiomagnético) gira con el rumbo de la aeronave mientras su aguja señala la estación NDB.", "src": "Manual p.22", "note": ""}, {"n": 42, "stem": "Según el manual, ¿en qué banda de frecuencias opera el NDB?", "opts": ["VHF", "UHF", "LF-MF", "SHF"], "ans": 2, "why": "El manual sitúa el funcionamiento del NDB en la banda de baja-media frecuencia (LF-MF).", "src": "Manual p.22", "note": ""}, {"n": 43, "stem": "Según el manual, ¿cuál es el margen de error del ADF en condiciones normales de propagación?", "opts": ["± 5 grados", "± 1 grado", "± 15 grados", "± 30 grados"], "ans": 0, "why": "El manual indica que el margen de error del ADF no es superior a ± 5 grados en condiciones normales de propagación.", "src": "Manual p.22", "note": ""}, {"n": 44, "stem": "Según la nota a pie de página del manual, ¿cómo se usa hoy en su mayor parte el NDB?", "opts": ["Como sistema principal de navegación en ruta", "Exclusivamente para la navegación oceánica", "Prácticamente ya no se usa en ruta; solo en apoyo a procedimientos de aproximación y salida o como alternativa para evitar radioayudas críticas", "Como sustituto del GNSS"], "ans": 2, "why": "La nota rebaja expresamente el papel actual del NDB al apoyo de procedimientos de aproximación y salida y a su uso como ayuda alternativa.", "src": "Manual p.22 (nota 2)", "note": ""}, {"n": 45, "stem": "Según el manual, ¿qué proporciona el VOR?", "opts": ["Solo información de distancia", "Guiado vertical de precisión", "Guiado horizontal (rumbos) respecto a una línea de situación magnética", "Sincronización horaria para los receptores GNSS"], "ans": 2, "why": "El VOR da guiado horizontal referido a una línea de situación magnética (radial), no distancia ni guiado vertical.", "src": "Manual p.23", "note": ""}, {"n": 46, "stem": "Según el manual, ¿qué muestra el CDI (indicador de desviación de curso) al piloto?", "opts": ["La distancia a la estación", "La altitud de la aeronave", "El código de transpondedor en uso", "Información de mando: lo que debe hacer para mantener la aeronave sobre el radial seleccionado"], "ans": 3, "why": "El manual describe el CDI como el que da información de mando para permanecer sobre el radial seleccionado.", "src": "Manual p.25", "note": ""}, {"n": 47, "stem": "Al seleccionar un radial con el OBS (selector de radiales), el plano de situación horizontal se divide en:", "opts": ["Solo dos semiplanos", "Cuatro cuadrantes", "Ocho sectores", "Un único sector"], "ans": 1, "why": "El manual indica que esta selección divide el plano en cuatro cuadrantes.", "src": "Manual p.26", "note": ""}, {"n": 48, "stem": "El indicador TO/FROM del VOR muestra FROM cuando la aeronave está:", "opts": ["Justo sobre la estación, únicamente", "En el semiplano que contiene la prolongación del radial", "Fuera de la cobertura del VOR", "En el semiplano que contiene el radial seleccionado, independientemente del rumbo"], "ans": 3, "why": "FROM indica que la aeronave está en el semiplano que contiene el propio radial seleccionado, con independencia del rumbo.", "src": "Manual p.26", "note": ""}, {"n": 49, "stem": "Al volar HACIA una estación VOR (radiales de acercamiento), la relación entre la ruta magnética (Rm) y el radial (RDL) es:", "opts": ["Rm = RDL", "Rm = RDL + 180 grados", "Rm = RDL - 90 grados", "Rm = 2 x RDL"], "ans": 1, "why": "El manual da Rm = RDL + 180 grados para volar hacia la estación.", "src": "Manual p.28", "note": ""}, {"n": 50, "stem": "Ejemplo del manual: una aeronave vuela con RDL-090 hacia una estación VOR. ¿Cuál es su ruta magnética?", "opts": ["090 grados", "180 grados", "000 grados", "270 grados"], "ans": 3, "why": "Con Rm = RDL + 180, 090 + 180 = 270 grados, como indica el ejemplo resuelto del manual.", "src": "Manual p.28", "note": ""}, {"n": 51, "stem": "Al volar DESDE una estación VOR (radiales de alejamiento), la relación entre la ruta magnética y el radial es:", "opts": ["Rm = RDL + 180", "Rm = RDL / 2", "Rm = RDL (coinciden)", "No hay una relación fija"], "ans": 2, "why": "En los radiales de alejamiento, la ruta magnética es igual al radial volado, según el manual.", "src": "Manual p.29", "note": ""}, {"n": 52, "stem": "¿Cuál es el alcance nominal del VOR que indica el manual?", "opts": ["Unas 20 NM", "Unas 200 NM", "Unas 60 NM", "Unas 500 NM"], "ans": 1, "why": "El manual describe el VOR como un sistema de corto y medio alcance con valores nominales de unas 200 NM.", "src": "Manual p.29", "note": ""}, {"n": 53, "stem": "En comparación con el VOR convencional (CVOR), ¿qué es cierto del DVOR (VOR Doppler), según el manual?", "opts": ["Usa frecuencias de transmisión distintas y un equipo de a bordo distinto", "No puede usarse para la RNAV", "Usa las mismas frecuencias y el mismo equipo de a bordo, pero mejora la calidad de la señal en presencia de obstáculos", "Sustituyó por completo al VOR por ley"], "ans": 2, "why": "El DVOR comparte frecuencias y equipo de a bordo con el CVOR, pero utiliza técnicas de transmisión distintas para lograr mejores prestaciones.", "src": "Manual p.29", "note": ""}, {"n": 54, "stem": "Según el manual, ¿qué mide el DME (equipo medidor de distancia)?", "opts": ["Solo la distancia horizontal", "La velocidad vertical", "La distancia oblicua entre la aeronave y la estación terrestre", "El rumbo de la aeronave"], "ans": 2, "why": "El DME mide expresamente la distancia oblicua, no la horizontal.", "src": "Manual p.29", "note": ""}, {"n": 55, "stem": "En el sistema DME, ¿cuáles son las funciones de la estación terrestre y del equipo de a bordo, según el manual?", "opts": ["Tierra = interrogador; aeronave = transpondedor", "Tierra = transpondedor; aeronave = interrogador", "Ambos se denominan transpondedores", "Ambos se denominan interrogadores"], "ans": 1, "why": "El manual denomina específicamente transpondedor a la estación terrestre e interrogador al equipo de a bordo.", "src": "Manual p.30", "note": ""}, {"n": 56, "stem": "Según el manual, ¿cómo se calcula la distancia DME?", "opts": ["A partir del desplazamiento de frecuencia Doppler", "Por triangulación con dos estaciones terrestres", "A partir de la altitud barométrica", "A partir del tiempo de ida y vuelta de los impulsos entre la aeronave y la estación terrestre"], "ans": 3, "why": "La distancia DME se obtiene del tiempo que emplea el viaje de ida y vuelta de la interrogación y la respuesta, convertido a millas náuticas.", "src": "Manual p.30", "note": ""}, {"n": 57, "stem": "Según el manual, ¿puede el DME por sí solo proporcionar guiado de navegación (radiales o rumbos)?", "opts": ["No; solo proporciona distancia", "Sí, da radiales y rumbos", "Solo por encima de 10 000 ft", "Solo si se combina con un NDB"], "ans": 0, "why": "El manual indica expresamente que el DME no sirve para la navegación por sí solo: no da radiales ni rumbos, solo distancias.", "src": "Manual p.31", "note": ""}, {"n": 58, "stem": "¿Qué instalación coemplazada describe el manual como «la más típica»?", "opts": ["VOR/DME", "NDB/DME", "ILS/DME", "VOR/NDB"], "ans": 0, "why": "El manual destaca el VOR/DME como la instalación coemplazada más típica, útil para materializar puntos mediante la intersección de un radial y una distancia.", "src": "Manual p.32", "note": ""}, {"n": 59, "stem": "Según el manual, ¿cómo se usa el DME de forma individual para las operaciones PBN?", "opts": ["Una sola estación DME da una posición 3D completa", "El DME no puede usarse para la PBN", "Solo en combinación con el NDB", "Se sintonizan simultáneamente dos o más estaciones DME y se realiza una triangulación"], "ans": 3, "why": "El manual describe el uso PBN del DME/DME como la sintonización simultánea de dos o más estaciones con triangulación.", "src": "Manual p.32-33", "note": ""}, {"n": 60, "stem": "Según el manual, ¿qué guiado proporciona el ILS (sistema de aterrizaje por instrumentos)?", "opts": ["Guiado horizontal y vertical de precisión en la aproximación y el aterrizaje", "Solo guiado horizontal", "Solo distancia", "Solo previsiones de tiempo"], "ans": 0, "why": "El ILS da guiado de precisión en acimut (horizontal) y de senda de descenso (vertical) para la aproximación y el aterrizaje.", "src": "Manual p.33", "note": ""}, {"n": 61, "stem": "Según el manual, ¿qué ha sustituido al sistema de radiobalizas del ILS en la mayoría de las instalaciones?", "opts": ["Un segundo localizador", "Un DME", "Un PAPI", "Un VOR adicional"], "ans": 1, "why": "El manual indica que el sistema de radiobalizas está hoy en gran parte en desuso, sustituido por un DME.", "src": "Manual p.33", "note": ""}, {"n": 62, "stem": "Según la descripción de la figura del manual, ¿qué línea de color indica al piloto la desviación del localizador del ILS?", "opts": ["Azul", "Roja", "Verde", "Ámbar"], "ans": 0, "why": "La desviación del localizador se refleja en el movimiento de la línea azul del indicador; la senda de descenso usa la roja.", "src": "Manual p.34", "note": ""}, {"n": 63, "stem": "La senda de descenso del ILS materializa un plano que nace en:", "opts": ["La antena del localizador", "El extremo lejano de la pista", "La ubicación de la radiobaliza exterior", "La zona de toma de contacto de la pista"], "ans": 3, "why": "El manual indica que el plano oblicuo de la senda de descenso nace de la zona de toma de contacto.", "src": "Manual p.34", "note": ""}, {"n": 64, "stem": "Según el manual, ¿qué radiobaliza transmite rayas continuas con una luz azul parpadeante?", "opts": ["Radiobaliza interna (IM)", "Radiobaliza intermedia (MM)", "Radiobaliza exterior (OM)", "Ninguna; todas usan luz blanca"], "ans": 2, "why": "La OM se define por rayas continuas y luz azul parpadeante; la MM usa punto-raya y ámbar, y la IM, puntos y blanca.", "src": "Manual p.37", "note": ""}, {"n": 65, "stem": "¿Qué radiobaliza transmite puntos y rayas alternados con una luz ámbar parpadeante?", "opts": ["Radiobaliza exterior (OM)", "Radiobaliza intermedia (MM)", "Radiobaliza interna (IM)", "Radiofaro de localización (<em>compass locator</em>)"], "ans": 1, "why": "La señal de la MM es punto-raya en Morse y luz ámbar parpadeante.", "src": "Manual p.37", "note": ""}, {"n": 66, "stem": "En el indicador de a bordo del ILS, ¿qué muestra la aguja horizontal (raya roja)?", "opts": ["La alineación con el eje de pista", "La distancia al umbral", "Hacia dónde debe dirigirse la aeronave para interceptar la pendiente de descenso correcta", "El modo de transpondedor en uso"], "ans": 2, "why": "La aguja horizontal (roja) indica el guiado de la senda de descenso; la aguja vertical (azul) muestra la alineación con el localizador/eje de pista.", "src": "Manual p.36", "note": ""}, {"n": 67, "stem": "Según la figura del manual, ¿qué significa «DESCENDER» en la indicación de la senda de descenso del ILS?", "opts": ["La aeronave está por debajo de la senda de descenso", "La aeronave ha aterrizado", "La aeronave está por encima de la senda de descenso y debe descender", "El localizador ha fallado"], "ans": 2, "why": "La figura muestra la «indicación de DESCENDER» cuando la aeronave está por encima de la pendiente correcta.", "src": "Manual p.36 (figura)", "note": ""}, {"n": 68, "stem": "Según el manual, ¿qué banda de frecuencias usa la senda de descenso del ILS?", "opts": ["VHF", "LF", "UHF", "HF"], "ans": 2, "why": "El manual indica que el localizador y las radiobalizas usan VHF, mientras que la senda de descenso usa UHF.", "src": "Manual p.38", "note": ""}, {"n": 69, "stem": "Según la tabla de categorías del manual, ¿cuáles son los mínimos del ILS de categoría I?", "opts": ["RVR &gt; 550 m; DH &gt; 200 ft", "RVR &gt; 300 m; DH &gt; 100 ft", "RVR &gt; 175 m; DH 0-100 ft", "RVR 0; DH 0"], "ans": 0, "why": "La categoría I de la tabla del manual exige un alcance visual en pista (RVR) superior a 550 m y una altura de decisión (DH) superior a 60 m/200 ft.", "src": "Manual p.38 (tabla)", "note": ""}, {"n": 70, "stem": "Según la tabla de categorías del manual, los mínimos del ILS de categoría IIIC son:", "opts": ["Sin DH ni RVR (ambos 0)", "RVR &gt; 175 m; DH 0-30 m", "RVR 175-50 m; DH 0-15 m", "RVR &gt; 550 m; DH &gt; 60 m"], "ans": 0, "why": "La categoría IIIC de la tabla del manual muestra 0 tanto para el RVR como para la DH.", "src": "Manual p.38 (tabla)", "note": ""}, {"n": 71, "stem": "Según el manual, ¿qué radiobalizas se instalan en las pistas que soportan solo operaciones de categoría I?", "opts": ["Solo la interna", "La interna y la intermedia", "La intermedia y la exterior", "Las tres"], "ans": 2, "why": "La categoría I requiere las radiobalizas intermedia y exterior; la radiobaliza interna se añade para las categorías II/III.", "src": "Manual p.38", "note": ""}, {"n": 72, "stem": "Según el manual, ¿por qué se desarrollaron los sistemas hiperbólicos?", "opts": ["Para sustituir al VOR en espacio aéreo continental", "Para encontrar una solución de navegación radioeléctrica de larga distancia en zonas donde las radioayudas no tenían alcance (especialmente en la navegación oceánica)", "Para proporcionar guiado de aproximación de precisión", "Para calibrar los receptores GNSS"], "ans": 1, "why": "Los sistemas hiperbólicos abordaron la falta de alcance de las radioayudas para la navegación de larga distancia, sobre todo oceánica.", "src": "Manual p.39", "note": ""}, {"n": 73, "stem": "Según la tabla del manual, ¿qué sistema hiperbólico usa VLF y tiene el mayor alcance indicado (6000-10 000 NM)?", "opts": ["DECCA", "LORAN-A", "LORAN-C", "OMEGA"], "ans": 3, "why": "El OMEGA figura con la banda VLF y el mayor alcance de los cuatro sistemas de la tabla.", "src": "Manual p.40 (tabla)", "note": ""}, {"n": 74, "stem": "Según la tabla del manual, ¿qué sistema hiperbólico tiene su alcance expresado en kilómetros y no en millas náuticas?", "opts": ["DECCA", "LORAN-C", "LORAN-A", "OMEGA"], "ans": 2, "why": "El alcance del LORAN-A se da como 1000 km de día y 2500 km de noche, a diferencia de los otros tres sistemas (NM).", "src": "Manual p.40 (tabla)", "note": ""}, {"n": 75, "stem": "Según el manual, ¿qué proporcionan los sistemas hiperbólicos si no se dispone de un ordenador de navegación de a bordo?", "opts": ["Solo la posición, nunca rumbo ni guiado", "Rumbo y guiado", "Solo distancia", "Solo tiempo"], "ans": 0, "why": "El manual indica que los sistemas hiperbólicos proporcionan posición, nunca rumbo ni guiado, salvo que se disponga de un ordenador de navegación.", "src": "Manual p.39", "note": ""}, {"n": 76, "stem": "Según el manual, ¿cuál es el convenio de colores de las luces indicadoras de pendiente de aproximación (PAPI/APAPI)?", "opts": ["Todo rojo = demasiado alto; todo blanco = demasiado bajo", "Todo ámbar = en la pendiente correcta", "No hay convenio de colores", "Todo rojo = demasiado cerca de la pista o demasiado bajo; todo blanco = demasiado alto"], "ans": 3, "why": "El manual indica que todo rojo señala demasiado bajo o cerca, y todo blanco, demasiado alto.", "src": "Manual p.41", "note": ""}, {"n": 77, "stem": "Según el manual, ¿cuántos elementos luminosos componen la barra de ala del PAPI?", "opts": ["4", "2", "6", "8"], "ans": 0, "why": "El PAPI tiene 4 elementos luminosos; el APAPI (abreviado) tiene 2.", "src": "Manual p.41", "note": ""}, {"n": 78, "stem": "Según el manual, ¿en qué lado de la pista se sitúan normalmente los sistemas PAPI/APAPI?", "opts": ["En el lado derecho", "Directamente sobre el eje", "En el lado izquierdo", "En cualquiera de los dos lados, al azar"], "ans": 2, "why": "El manual indica que se sitúan en el lado izquierdo, a menos que sea materialmente imposible.", "src": "Manual p.41", "note": ""}, {"n": 79, "stem": "Según la figura del manual, ¿qué patrón de luces muestra el PAPI cuando la aeronave está en la pendiente de aproximación correcta?", "opts": ["4 luces blancas", "2 luces blancas + 2 rojas", "4 luces rojas", "1 luz blanca + 3 rojas"], "ans": 1, "why": "La indicación del PAPI en pendiente es exactamente la mitad blancas y la mitad rojas (2+2), según la figura.", "src": "Manual p.42 (figura)", "note": ""}, {"n": 80, "stem": "Según el manual, ¿se siguen utilizando los sistemas T-VASIS/AT-VASIS en los aeródromos civiles de España?", "opts": ["Sí, en todos los aeropuertos importantes", "No, están en desuso; solo se encuentran en alguna base aérea militar", "Solo en Madrid-Barajas", "Nunca se usaron en España"], "ans": 1, "why": "El manual indica que el T-VASIS/AT-VASIS está obsoleto en los aeródromos civiles y que solo existe en alguna base militar española.", "src": "Manual p.43", "note": ""}, {"n": 81, "stem": "Según el manual, ¿qué longitud mínima tiene un sistema de luces de aproximación (ALS) de tipo «Sencillo»?", "opts": ["Como mínimo 420 m", "Como mínimo 900 m", "Exactamente 300 m", "No se indica ninguna longitud mínima"], "ans": 0, "why": "La tabla del manual para el ALS de tipo Sencillo especifica una longitud mínima de 420 m.", "src": "Manual p.45 (tabla)", "note": ""}, {"n": 82, "stem": "Según el manual, ¿cuál es la longitud máxima de un sistema de luces de aproximación CAT I?", "opts": ["900 m", "420 m", "600 m", "1200 m"], "ans": 0, "why": "La tabla del ALS CAT I da una longitud máxima de 900 m.", "src": "Manual p.46 (tabla)", "note": ""}, {"n": 83, "stem": "Según el manual, ¿en qué se diferencia el sistema de luces de aproximación CAT II/III del CAT I?", "opts": ["No tiene barretas en absoluto", "Los 300 m más cercanos al umbral tienen barretas rojas a ambos lados del eje", "Usa solo 1 luz en el eje en todo su recorrido", "Es más corto que el tipo Sencillo"], "ans": 1, "why": "El manual indica que el CAT II/III es idéntico al CAT I, salvo por las barretas rojas en los últimos 300 m antes del umbral.", "src": "Manual p.47 (tabla)", "note": ""}, {"n": 84, "stem": "Según el manual, ¿cuántos satélites se necesitan para determinar la posición y por qué suele requerirse un cuarto?", "opts": ["3 satélites para la posición; en la práctica se necesita un cuarto para sincronizar el reloj del receptor", "2 satélites; el cuarto confirma la altitud", "6 satélites; no hace falta un cuarto", "Basta 1 satélite con aumentación"], "ans": 0, "why": "La distancia a 3 satélites da la posición; se necesita un cuarto para sincronizar el reloj del receptor y así medir con precisión las distancias.", "src": "Manual p.47-48", "note": ""}, {"n": 85, "stem": "Según el manual, ¿cuáles son los tres segmentos operativos de una constelación GNSS?", "opts": ["Espacial, terrestre o de control, y de usuario", "Aéreo, marítimo y terrestre", "Primario, secundario y terciario", "Civil, militar y comercial"], "ans": 0, "why": "El manual describe exactamente estos tres segmentos para GPS, GLONASS, Galileo y BeiDou.", "src": "Manual p.48-49", "note": ""}, {"n": 86, "stem": "¿Qué área de servicio asigna el manual a la aumentación SBAS?", "opts": ["Área amplia (región/continente)", "Global", "Local (cerca del aeropuerto)", "Ninguna; es universal"], "ans": 0, "why": "El SBAS mejora las prestaciones del GNSS en un área de servicio amplia (regional o continental), a diferencia del GBAS (local) o del ABAS (global).", "src": "Manual p.50", "note": ""}, {"n": 87, "stem": "Según el manual, ¿cómo emite el GBAS su información de aumentación?", "opts": ["Mediante satélites geoestacionarios", "Mediante estaciones terrestres HF", "Mediante una o varias antenas VHF (VDB) en tierra", "Mediante la red SSR"], "ans": 2, "why": "El GBAS radiodifunde las correcciones localmente mediante antenas de radiodifusión de datos en VHF (VDB) en el aeropuerto, a diferencia del SBAS, que usa satélites GEO.", "src": "Manual p.50", "note": ""}, {"n": 88, "stem": "Según el manual, ¿qué categorías de aproximación habilita actualmente el GBAS y qué está previsto para el futuro?", "opts": ["Actualmente CAT I; en el futuro CAT II/III", "Actualmente CAT III; en el futuro CAT I", "Solo aproximaciones de no precisión, ahora y en el futuro", "El GBAS no habilita ninguna categoría de aproximación"], "ans": 0, "why": "El manual indica que el GBAS habilita aproximaciones de precisión, actualmente CAT I, con CAT II/III previstas para el futuro.", "src": "Manual p.50", "note": ""}, {"n": 89, "stem": "Según el manual, ¿qué área de servicio y qué fuente de datos utiliza el ABAS?", "opts": ["Área local, con antenas VHF en tierra", "Regional, con satélites geoestacionarios", "Global, solo con radar terrestre", "Global, con datos de los sistemas autónomos de la propia aeronave o con la redundancia de las señales de los satélites"], "ans": 3, "why": "El ABAS va embarcado, utiliza información del IRS/sistema de datos aire o señales redundantes de los satélites, y tiene cobertura global.", "src": "Manual p.51", "note": ""}, {"n": 90, "stem": "Según el manual, ¿qué información proporciona el INS (sistema de navegación inercial) además de la posición?", "opts": ["Frecuencias del control de tránsito aéreo", "Combustible restante", "Ecos del radar meteorológico", "Velocidad respecto al suelo, posición instantánea y distancia a un destino preestablecido"], "ans": 3, "why": "El manual enumera como salidas del INS la velocidad respecto al suelo, la posición instantánea y la distancia a un destino u objeto preestablecido.", "src": "Manual p.51", "note": ""}, {"n": 91, "stem": "Según el manual, ¿qué debe hacer el piloto antes de usar el INS para navegar?", "opts": ["Introducir la coordenada inicial (aeropuerto de origen)", "Nada; se autocalibra", "Alinear manualmente la brújula con el norte magnético", "Sintonizar una frecuencia VOR"], "ans": 0, "why": "El INS exige que el piloto introduzca la coordenada de partida antes de usarlo, porque calcula la posición por integración a partir de ese punto.", "src": "Manual p.52", "note": ""}, {"n": 92, "stem": "Según el manual, ¿cuáles son los cuatro componentes básicos de un INS convencional?", "opts": ["Transmisor, receptor, antena, indicador", "Receptor GPS, barómetro, giróscopo, altímetro", "Localizador, senda de descenso, radiobaliza, DME", "Acelerómetros, plataforma inercial, integradores, computador"], "ans": 3, "why": "El manual enumera exactamente estos cuatro componentes para un INS convencional.", "src": "Manual p.52", "note": ""}, {"n": 93, "stem": "Según el manual, ¿por qué un INS requiere una actualización periódica desde otro sistema como el VOR, el VOR/DME o el GPS?", "opts": ["No tiene fuente de energía interna", "Sus acelerómetros se desgastan físicamente", "La normativa lo exige sea cual sea la exactitud", "Sufre un error sistemático que crece a medida que aumenta el tiempo desde la última actualización"], "ans": 3, "why": "El manual explica que el error de posición del INS es sistemático y crece con el tiempo transcurrido desde la última actualización.", "src": "Manual p.52-53", "note": ""}, {"n": 94, "stem": "Según el manual, ¿qué miden los sistemas inerciales láser modernos que los diferencia de un INS convencional?", "opts": ["Solo la presión barométrica", "La declinación magnética", "Velocidades angulares, mediante tres giróscopos láser y tres acelerómetros", "La intensidad de la señal de los satélites"], "ans": 2, "why": "Los equipos INS láser miden velocidades angulares mediante tres giróscopos láser más tres acelerómetros orientados según los ejes principales de la aeronave.", "src": "Manual p.53", "note": ""}, {"n": 95, "stem": "Según el manual, ¿qué proporciona el radar Doppler al piloto?", "opts": ["La posición de la aeronave respecto a una ruta seleccionada", "La altitud de la aeronave sobre el nivel del mar", "Solo los ecos del radar meteorológico", "La verificación del código del transpondedor"], "ans": 0, "why": "El radar Doppler da la distancia transversal a la ruta y la distancia por recorrer a lo largo de ella respecto a una ruta preseleccionada, con base en los principios de la navegación a estima.", "src": "Manual p.53</p>\n<hr />\n<h2>Clave rápida</h2>\n<p>1B 2D 3D 4D 5D 6C 7A 8B 9D 10A 11A 12B 13B 14A 15B 16D 17C 18C 19C 20D 21A 22A 23C 24B 25C 26A 27D 28D 29B 30B 31C 32A 33D 34A 35C 36C 37B 38A 39A 40C 41B 42C 43A 44C 45C 46D 47B 48D 49B 50D 51C 52B 53C 54C 55B 56D 57A 58A 59D 60A 61B 62A 63D 64C 65B 66C 67C 68C 69A 70A 71C 72B 73D 74C 75A 76D 77A 78C 79B 80B 81A 82A 83B 84A 85A 86A 87C 88A 89D 90D 91A 92D 93D 94C 95A</p>\n<h2>Nota de cobertura</h2>\n<p>Este banco tiene <strong>130 preguntas</strong> en total (Q1-Q130), muy por encima del mínimo de 90, repartidas entre los capítulos del manual aproximadamente en proporción a su extensión: introducción y conceptos (Q1-9), RNAV/RNP/PBN (Q10-29), clasificación de las ayudas (Q30-35), NDB (Q36-44), VOR (Q45-53), DME (Q54-59), ILS (Q60-71), sistemas hiperbólicos (Q72-75), ayudas visuales (Q76-83), GNSS y aumentación (Q84-89), sistemas autónomos INS/Doppler (Q90-95) y vigilancia - PSR/SMR/SSR/MLAT/ADS, capítulo 4 del manual (Q96-130).", "note": ""}, {"n": 96, "stem": "Según el manual, ¿cuál es el objetivo de la función de vigilancia?", "opts": ["Obtener un conocimiento exacto y en tiempo real de la ubicación de las aeronaves en un determinado entorno operativo", "Calcular el consumo de combustible", "Emitir previsiones meteorológicas", "Asignar códigos de transpondedor automáticamente"], "ans": 0, "why": "El manual define el objetivo de la función de vigilancia como el conocimiento exacto y en tiempo real de la ubicación de las aeronaves.", "src": "Manual p.55", "note": ""}, {"n": 97, "stem": "¿Qué categoría de vigilancia asigna el manual al PSR y al SMR?", "opts": ["Dependiente", "Independiente cooperativa", "Híbrida", "Independiente no cooperativa"], "ans": 3, "why": "El PSR y el SMR determinan la posición en instalaciones terrestres sin la colaboración de la aeronave: independiente no cooperativa.", "src": "Manual p.55", "note": ""}, {"n": 98, "stem": "¿Qué categoría de vigilancia asigna el manual al SSR y a la multilateración?", "opts": ["Independiente cooperativa", "Independiente no cooperativa", "Dependiente", "Ninguna; no están clasificados"], "ans": 0, "why": "El SSR y la MLAT requieren que la aeronave esté convenientemente equipada y colabore: independiente cooperativa.", "src": "Manual p.56", "note": ""}, {"n": 99, "stem": "Según el manual, ¿a qué categoría pertenece la ADS?", "opts": ["Independiente no cooperativa", "Dependiente", "Independiente cooperativa", "Primaria"], "ans": 1, "why": "Los datos ADS se generan directamente en los equipos de a bordo de la propia aeronave: es un sistema de vigilancia dependiente.", "src": "Manual p.56", "note": ""}, {"n": 100, "stem": "Según el manual, ¿requiere el PSR la colaboración activa de la aeronave?", "opts": ["Sí, siempre", "No, no requiere colaboración activa", "Solo por encima del FL245", "Solo a menos de 50 NM del radar"], "ans": 1, "why": "El PSR solo necesita un componente terrestre y detecta el eco reflejado sin que intervenga ningún equipo de la aeronave.", "src": "Manual p.57", "note": ""}, {"n": 101, "stem": "Según el manual, ¿qué tres datos devuelve un PSR a partir de un impulso reflejado?", "opts": ["Identidad, altitud, velocidad", "Distancia, marcación angular, tiempo de la detección", "Estado del combustible, peso, indicativo", "Código de transpondedor, ident, altitud"], "ans": 1, "why": "El PSR da la distancia (a partir del tiempo transcurrido), la marcación angular (a partir del ángulo de la antena) y el tiempo de la detección; no puede dar identidad ni altitud.", "src": "Manual p.57-58", "note": ""}, {"n": 102, "stem": "Según el manual, ¿en qué bandas de frecuencia opera el PSR?", "opts": ["VHF y UHF", "Solo la banda X", "Banda L (1-2 GHz) y banda S (2-4 GHz)", "LF y MF"], "ans": 2, "why": "El manual especifica que el PSR opera en la banda L (1-2 GHz) y en la banda S (2-4 GHz).", "src": "Manual p.59", "note": ""}, {"n": 103, "stem": "¿Qué inconvenientes atribuye el manual al PSR?", "opts": ["Solo el coste elevado", "Imprecisiones en la identificación y pérdidas de señal por reflejos del terreno", "No puede detectar fenómenos meteorológicos", "Requiere un transpondedor en cada aeronave"], "ans": 1, "why": "Son los dos inconvenientes que el manual atribuye al PSR.", "src": "Manual p.60", "note": ""}, {"n": 104, "stem": "Según el manual, ¿para detectar qué está diseñado el SMR (radar de movimiento en superficie)?", "opts": ["Frentes meteorológicos que se aproximan al aeropuerto", "Conflictos de tránsito en ruta", "Colisiones con aves", "El tráfico de aeronaves y vehículos en la superficie de un aeropuerto"], "ans": 3, "why": "El SMR está diseñado específicamente para detectar el tráfico en superficie (aeronaves y vehículos) de un aeropuerto, presentado en la torre.", "src": "Manual p.60", "note": ""}, {"n": 105, "stem": "Según el manual, ¿en qué banda de frecuencias opera el SMR?", "opts": ["Banda L", "Banda S", "Banda VHF", "Banda X (8-12 GHz)"], "ans": 3, "why": "El manual indica que el SMR usa la banda X, de 8 a 12 GHz.", "src": "Manual p.61", "note": ""}, {"n": 106, "stem": "Según el manual, ¿cómo se compara la velocidad de rotación de la antena del SMR con la del PSR?", "opts": ["El SMR gira más despacio que el PSR", "El SMR gira normalmente a 1 revolución por segundo, más rápido que las 6-15 rpm del PSR", "Ambos giran a la misma velocidad", "El SMR no gira; es una agrupación fija"], "ans": 1, "why": "El manual indica que la antena más pequeña y ligera del SMR permite una rotación más rápida (unas 1 rev/s) frente a las 6-15 rpm del PSR.", "src": "Manual p.61", "note": ""}, {"n": 107, "stem": "¿Qué resolución en acimut da el manual para el SMR en comparación con el PSR?", "opts": ["SMR 5 grados frente a PSR 1 grado", "Ambos tienen resolución idéntica", "El SMR no tiene capacidad en acimut", "SMR 0,25 grados frente a PSR 1-2 grados"], "ans": 3, "why": "La mayor frecuencia y el haz más estrecho del SMR dan una mejor resolución en acimut (0,25 grados) que la del PSR (1-2 grados).", "src": "Manual p.61", "note": ""}, {"n": 108, "stem": "Según el manual, ¿dónde se sitúa normalmente el radar meteorológico embarcado y de qué tipo de radar se trata?", "opts": ["En la cola; un tipo de radar secundario", "En el morro; un tipo de radar primario", "Bajo las alas; un tipo de radar Doppler", "En el techo de la cabina; no es un radar en absoluto"], "ans": 1, "why": "El manual describe el radar meteorológico embarcado como un tipo de radar primario, situado normalmente en el morro de la aeronave.", "src": "Manual p.55-56", "note": ""}, {"n": 109, "stem": "Según el manual, ¿sustituye el SSR al PSR?", "opts": ["Sí, el SSR sustituye por completo al PSR", "No; son complementarios", "El PSR sustituyó al SSR", "Ninguno de los dos se usa ya"], "ans": 1, "why": "El manual indica expresamente que el SSR no sustituye al PSR: ambos son sistemas complementarios.", "src": "Manual p.62", "note": ""}, {"n": 110, "stem": "¿Qué técnica dice el manual que mejora la precisión de la marcación angular del SSR?", "opts": ["La técnica monopulso", "La corrección del desplazamiento Doppler", "La triangulación con dos receptores", "La corrección barométrica"], "ans": 0, "why": "El manual atribuye la mejora de la precisión angular del SSR a la técnica monopulso.", "src": "Manual p.62", "note": ""}, {"n": 111, "stem": "Según el manual, ¿cómo se llama el componente de a bordo del SSR?", "opts": ["Interrogador", "Transpondedor (o respondedor)", "Unidad de squitter", "ADF"], "ans": 1, "why": "El equipo de a bordo que permite las r lo la comparación de la intensidad de la señal"], "ans": 2, "why": "La MLAT se basa expresamente en la metodología TDOA, según el manual.", "src": "Manual p.64", "note": ""}, {"n": 117, "stem": "Según el manual, ¿qué genera matemáticamente el conocimiento del tiempo de llegada de la señal a UNA sola estación terrestre MLAT?", "opts": ["Un único punto fijo", "Una curva hiperbólica", "Nada útil", "Una esfera en la que podría encontrarse la aeronave"], "ans": 3, "why": "El tiempo medido en una sola estación genera una esfera de posibles ubicaciones, según la explicación del manual.", "src": "Manual p.65", "note": ""}, {"n": 118, "stem": "Según el manual, ¿qué genera la intersección de las esferas de DOS estaciones MLAT?", "opts": ["Un único punto", "Nada; dos estaciones son insuficientes", "Un círculo perfecto", "Una curva hiperbólica"], "ans": 3, "why": "Las esferas de dos estaciones se cortan y forman una curva hiperbólica de posiciones posibles.", "src": "Manual p.65", "note": ""}, {"n": 119, "stem": "Según el manual, ¿cuántas estaciones terrestres MLAT se necesitan para obtener una única posición calculada?", "opts": ["Dos", "Cuatro", "Tres", "Seis"], "ans": 1, "why": "El manual indica que un cuarto punto de recepción da una única posición calculada; con tres estaciones siguen quedando dos puntos posibles.", "src": "Manual p.65", "note": ""}, {"n": 120, "stem": "Según el manual, ¿qué es el WAM (multilateración de área extensa, <em>Wide Area Multilateration</em>)?", "opts": ["Una forma de PSR utilizada solo en aeropuertos", "Un sistema de aumentación basado en satélite", "La multilateración utilizada para vigilar áreas más amplias del espacio aéreo donde el PSR/SSR no es práctico", "Un tipo de radiobaliza del ILS"], "ans": 2, "why": "El WAM extiende la MLAT a áreas amplias del espacio aéreo que un radar convencional no cubre de forma práctica.", "src": "Manual p.56", "note": ""}, {"n": 121, "stem": "Según el manual, ¿qué equipo de a bordo deben llevar las aeronaves
