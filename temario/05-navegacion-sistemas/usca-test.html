<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test USCA: Navegación, equipos y sistemas</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id const Q=[{"n": 1, "stem": "¿Cuál es el objetivo fundamental de un Sistema de Navegación Aérea (SNA)?", "opts": ["Facilitar únicamente el guiado lateral durante el vuelo.", "Permitir operaciones aéreas seguras, fluidas y eficientes mediante elementos jurídicos, técnicos y operativos.", "Reducir el consumo de combustible en rutas comerciales.", "Aumentar la velocidad de las aeronaves mediante ayudas electrónicas."], "ans": 1, "why": "El SNA es el conjunto de elementos jurídicos, organizativos, técnicos y operativos que permiten operar de forma segura, fluida y eficiente.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «conjunto de elementos jurídicos, organizativos, técnicos y operativos que permiten llevar a cabo»", "note": ""}, {"n": 2, "stem": "¿Qué servicio pertenece al concepto CNS?", "opts": ["Gestión de afluencia.", "Información aeronáutica.", "Comunicaciones aeronáuticas.", "Control de tránsito aéreo."], "ans": 2, "why": "CNS es Comunicaciones, Navegación y Vigilancia. Gestión de afluencia y control pertenecen a ATM.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Servicios de Comunicaciones, Navegación y Vigilancia (CNS / Communications,»", "note": ""}, {"n": 3, "stem": "En la técnica de navegación a estima, ¿qué permite estimar la posición?", "opts": ["La triangulación entre dos radioayudas.", "La integración del viento en la ecuación de movimiento.", "El producto velocidad × tiempo manteniendo rumbo constante.", "La diferencia entre dos señales GNSS."], "ans": 2, "why": "La estima usa velocidad, tiempo y rumbo: espacio = velocidad x tiempo con rumbo constante, sin tener en cuenta el viento.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «recorrido es el producto de la velocidad por el tiempo»", "note": ""}, {"n": 4, "stem": "Una limitación clave de la navegación visual es:", "opts": ["No permite volar a muy baja altura porque necesita referencias visuales.", "Depende fuertemente de las condiciones meteorológicas.", "Depende de las radioayudas.", "No puede emplearse en ascensos."], "ans": 1, "why": "La navegación visual depende mucho de la meteorología y la visibilidad. La opción A invierte el sentido: obliga a volar cerca del terreno, no lo impide.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Presenta muchas limitaciones, desde tener que volar próximo al terreno, hasta la alta dependencia de las condiciones»", "note": "A y B defendibles; B es la limitación principal."}, {"n": 5, "stem": "En RNAV, la designación “X” hace referencia a:", "opts": ["El número de satélites necesarios para la navegación.", "La tolerancia del error vertical requerido.", "La precisión lateral esperada en millas náuticas.", "La desviación máxima del CDI."], "ans": 2, "why": "La X de RNAV X/RNP X es la precisión de navegación lateral en NM que se logra el 95% del tiempo de vuelo.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «precisión de navegación lateral (TSE) en millas náuticas que se espera que logre, en por lo menos el»", "note": ""}, {"n": 6, "stem": "En el contexto del concepto PBN, una operación RNP APCH puede incluir tramos curvos de radio fijo en determinadas fases. ¿En cuál de las siguientes combinaciones de fases sí está permitido el uso de estos tramos curvos según la especificación, y qué limitación existe respecto a la aproximación final?", "opts": ["Inicial, intermedia y final; sin ninguna limitación en la fase final.", "Inicial e intermedia; pero en la fase final solo si se utiliza SBAS.", "Inicial, intermedia y algunas partes de la frustrada; pero no están permitidos tramos curvos en la fase de aproximación final.", "Intermedia y final; únicamente si la aeronave dispone de baro-VNAV."], "ans": 2, "why": "En RNP APCH los tramos curvos de radio fijo se permiten en inicial, intermedia y partes de la frustrada, pero no en la aproximación final (eso es RNP AR APCH).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «diseñadas con tramos rectos, o curvos de radio fijo (estos últimos, sólo los tramos de aproximación inicial o intermedia, o en…»", "note": ""}, {"n": 7, "stem": "¿Cuál es un beneficio directo del concepto PBN?", "opts": ["Aumento de la potencia de los transmisores en tierra.", "Menor dependencia de los pilotos en fases críticas.", "Mayor flexibilidad en el diseño de rutas y reducción de distancias.", "Eliminación del uso de GNSS."], "ans": 2, "why": "PBN da más flexibilidad en el diseño de rutas y reduce las distancias de vuelo. No elimina el GNSS ni aumenta potencia en tierra.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Mayor flexibilidad en el diseño de la red de rutas, permitiendo optimizar la capacidad del espacio»", "note": ""}, {"n": 8, "stem": "¿Qué tipo de sistema se clasifica como medio único?", "opts": ["Aquel que solo debe cumplir precisión e integridad.", "El que debe cumplir los requisitos de precisión, integridad, disponibilidad y continuidad.", "El que solo sirve de respaldo.", "El que no necesita equipo a bordo."], "ans": 1, "why": "El medio único debe cumplir los cuatro requisitos: precisión, integridad, disponibilidad y continuidad. El medio primario solo precisión e integridad.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Medio único: Sistema de ayuda a la navegación aprobado para una determinada operación»", "note": ""}, {"n": 9, "stem": "¿Cuál es la banda de frecuencias de un NDB?", "opts": ["HF", "VHF", "LF–MF", "UHF"], "ans": 2, "why": "El NDB trabaja en la banda LF-MF (baja-media frecuencia). HF, VHF y UHF corresponden a otros sistemas (comunicaciones, VOR/ILS LOC, GP/DME).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «es LF-MF (baja-media frecuencia)»", "note": ""}, {"n": 10, "stem": "El indicador RMI del ADF se caracteriza por:", "opts": ["Tener una rosa fija y aguja móvil.", "Integrar rumbo real y marcación NDB en una rosa móvil.", "Ser exclusivo para navegación en ruta.", "No mostrar información de rumbo."], "ans": 1, "why": "El RMI combina el rumbo de la aeronave con la aguja ADF sobre una rosa móvil que gira con el avión. La rosa fija con aguja móvil es el RBI.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «la indicación de rumbo de la aeronave con la indicación de la aguja del ADF. Para ello, dispone de una rosa de rumbos móvil»", "note": ""}, {"n": 11, "stem": "¿Qué relación existe entre radial de vuelo y ruta magnética al volar hacia la estación VOR?", "opts": ["Coinciden (Rm = RDL).", "El radial es 90° mayor que la ruta.", "La ruta es el radial + 180°.", "La ruta es el radial – 90°."], "ans": 2, "why": "Volando hacia (TO) la estación la ruta magnética es el radial + 180º. La coincidencia Rm=RDL solo se da alejándose (FROM).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «la ruta magnética y el radial es de 180º (Rm=RDL+180º)»", "note": ""}, {"n": 12, "stem": "¿Qué tipo de información proporciona un DME?", "opts": ["Distancia verdadera entre aeronave y estación.", "Guiado horizontal y vertical.", "Distancia oblicua entre aeronave y estación.", "Radiales y distancias simultáneamente."], "ans": 2, "why": "El DME mide distancia oblicua (slant range) aeronave-estación, no distancia horizontal verdadera; no da radiales ni guiado.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «proporciona información de la distancia oblicua entre una aeronave y una»", "note": ""}, {"n": 13, "stem": "En un ILS, el localizador proporciona:", "opts": ["Guiado vertical.", "Guiado lateral respecto al eje de pista.", "Distancia al umbral.", "Correcciones de integridad GNSS."], "ans": 1, "why": "El localizador da guiado lateral respecto al eje de pista; el vertical lo da la senda de planeo (GP).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «materializan un plano vertical, con información que permite a las aeronaves mantenerse alineadas con el eje de pista»", "note": ""}, {"n": 14, "stem": "Las radiobalizas del ILS hoy día son sustituidas principalmente por:", "opts": ["GPS", "DMEs coemplazados", "SBAS", "VOR de baja potencia"], "ans": 1, "why": "Las radiobalizas se sustituyen por un DME coemplazado con la senda de planeo, que da distancia al umbral de forma continua.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «En la actualidad, las radiobalizas han sido sustituidas por DME coemplazado con la senda»", "note": ""}, {"n": 15, "stem": "¿Qué categoría ILS exige instalar radiobalizas OM y MM?", "opts": ["Solo CAT III C", "CAT I", "CAT II y III exclusivamente", "No existe tal requisito"], "ans": 1, "why": "Las radiobalizas exterior e intermedia (OM y MM) se instalan para CAT I; en CAT II y III se añade la interna (IM).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Las radiobalizas Intermedia y Exterior se instalan cuando la pista va a soportar operaciones de Categoría I»", "note": "Redacción de C excluiría CAT I; B es la mejor."}, {"n": 16, "stem": "Los sistemas hiperbólicos determinan la posición mediante:", "opts": ["Diferencias de fase y/o tiempo entre señales recibidas de estaciones terrestres.", "El cálculo directo del rumbo magnético.", "Marcaciones ADF combinadas.", "Intersección de radiales y distancias."], "ans": 0, "why": "Los sistemas hiperbólicos usan la diferencia de distancia a dos estaciones fijas, medida como diferencia de fase o de tiempo (Decca, Loran, Omega), y se intersectan hipérbolas.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «situación de una aeronave, los puntos en los que la diferencia de distancia a dos referencias»", "note": "Tratado brevemente en el tema 5."}, {"n": 17, "stem": "En un sistema PAPI, ¿qué indica ver todas las luces blancas?", "opts": ["Que está muy bajo.", "Que está alineado correctamente.", "Que está demasiado alto.", "Que debe iniciar frustrada inmediatamente."], "ans": 2, "why": "Todo blanco en el PAPI indica que la aeronave esta muy alta; todo rojo, muy baja.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Todo rojo para indicar muy cerca de pista o muy bajo. o Todo blanco para indicar muy alto.»", "note": ""}, {"n": 18, "stem": "Durante una aproximación ILS, el piloto recibe información de guiado lateral y vertical procedente del LOC y del GP. Considerando el emparejamiento de frecuencias y la ubicación física de los equipos terrestres, ¿cuál de las siguientes afirmaciones describe con mayor precisión la lógica de selección y recepción de señales a bordo?", "opts": ["El piloto debe seleccionar manualmente dos frecuencias distintas: una para el localizador y otra para la senda de planeo.", "La aeronave recibe automáticamente la señal del GP al sintonizar la frecuencia del LOC, porque ambas están emparejadas.", "La senda de planeo se activa cuando la aeronave entra en un corredor de captura definido por el ILS ya que es una señal omnidireccional.", "El localizador transmite simultáneamente información de senda de planeo mediante un lóbulo secundario."], "ans": 1, "why": "LOC y GP tienen frecuencias emparejadas: al seleccionar una sola frecuencia se sintonizan ambos receptores. No hay que elegir dos frecuencias ni el LOC transmite senda.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Las frecuencias del localizador y la senda de planeo están emparejadas de manera que sólo se»", "note": ""}, {"n": 19, "stem": "En el sistema VOR, la indicación TO/FROM depende exclusivamente de la posición relativa de la aeronave respecto al radial seleccionado, independientemente del rumbo que lleve. Considerando esto, ¿cuál de las siguientes situaciones produciría una indicación TO, aunque el avión esté volando con rumbo opuesto al que llevaría para interceptar el radial seleccionado?", "opts": ["La aeronave se encuentra en el semiplano que contiene al radial seleccionado, pero su CDI está completamente desplazado a la derecha.", "La aeronave está situada en cualquier punto del semiplano que contiene la prolongación del radial seleccionado, independientemente de su rumbo.", "La aeronave sobrevuela la estación VOR con el CDI centrado, lo cual invierte automáticamente la indicación TO/FROM en cualquier dirección.", "La aeronave está a menos de 5 NM del VOR, donde las indicaciones TO/FROM se anulan por proximidad."], "ans": 1, "why": "TO/FROM depende solo del semiplano en que esta el receptor respecto al radial seleccionado, no del rumbo. En la prolongacion del radial aparece TO.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «en cualquier punto del semiplano que contiene a la prolongación del radial seleccionado,»", "note": ""}, {"n": 20, "stem": "Durante una aproximación instrumental basada en VOR/DME, la aeronave está utilizando simultáneamente el radial seleccionado y la distancia DME para materializar un punto de la trayectoria. Sin embargo, en el tramo final, la aeronave entra momentáneamente en sombra de la estación debido a un relieve elevado, lo que provoca pérdida intermitente de la señal DME pero no pérdida completa del radial VOR. Considerando las características operacionales de ambos sistemas, ¿cuál es la limitación real que afecta a la capacidad de continuar la aproximación utilizando únicamente el VOR, y cuál es la razón técnica?", "opts": ["La aproximación no puede continuar porque el VOR pierde precisión lateral sin la distancia DME.", "La aproximación puede continuar sin restricciones, porque el radial VOR es completamente independiente de la señal DME y no requiere línea de vista.", "La aproximación queda limitada porque, aunque el radial VOR sigue indicando rumbo, no es posible determinar con precisión la posición longitudinal sin DME.", "La aproximación solo puede continuar si el CDI está centrado, porque el CDI compensa automáticamente la ausencia de DME mediante corrección angular."], "ans": 2, "why": "El VOR solo da guiado angular (radial); el punto a lo largo de la trayectoria se materializa con la distancia DME. Sin DME se pierde la posicion longitudinal, aunque el radial siga.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «puntos en el espacio mediante la intersección de un radial VOR y una distancia DME.»", "note": "Pregunta rebuscada; las demás opciones son claramente falsas."}, {"n": 1, "stem": "¿Qué parámetro fundamental permite determinar la posición en un sistema GNSS?", "opts": ["La variación del rumbo respecto a norte.", "La medida del tiempo que tarda la señal en llegar desde el satélite al receptor.", "La intensidad relativa de las señales recibidas.", "El ángulo entre la aeronave y el plano ecuatorial."], "ans": 1, "why": "El GNSS se basa en medir el tiempo de propagación de la señal, que da la distancia satélite-receptor.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «tiempo que tarda una señal en llegar desde el emisor (satélite) al receptor (aeronave),»", "note": ""}, {"n": 2, "stem": "¿Cuántos satélites son necesarios, en la práctica, para calcular posición y sincronizar el reloj del receptor GNSS?", "opts": ["2", "3", "4", "6"], "ans": 2, "why": "Tres satélites dan la posición, pero en la práctica hace falta un cuarto para sincronizar el reloj del receptor.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «En la práctica se requiere un cuarto satélite para sincronizar el reloj del receptor»", "note": ""}, {"n": 3, "stem": "¿Qué misión cumple el segmento terrestre de una constelación GNSS?", "opts": ["Transportar los satélites en sus órbitas.", "Emitir señales de navegación adicionales a las de los satélites.", "Controlar el funcionamiento de los satélites y proporcionar datos de integridad.", "Convertirse en respaldo cuando falla el segmento espacial."], "ans": 2, "why": "El segmento de control supervisa la constelación y puede dar datos de integridad. No lanza ni sustituye a los satélites.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «principal es la de controlar y supervisar el buen funcionamiento de la constelación de»", "note": ""}, {"n": 4, "stem": "En un procedimiento de navegación que utiliza INS actualizado con GNSS, ¿qué ocurre si se pierde temporalmente la señal GNSS mientras el INS continúa operando sin recalibración externa?", "opts": ["El INS mantiene precisión indefinida.", "El INS sigue funcionando, pero su error crece con el tiempo.", "El INS deja de funcionar inmediatamente.", "El INS pasa a usar datos ADS-B para corregirse."], "ans": 1, "why": "El INS sigue funcionando pero su error crece con el tiempo desde la ultima actualizacion externa.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «el error va creciendo a medida que aumenta el tiempo desde su última actualización»", "note": ""}, {"n": 5, "stem": "¿Cuál es el objetivo de los sistemas SBAS?", "opts": ["Proporcionar navegación sin necesidad de satélites.", "Aumentar la precisión mediante correcciones recibidas desde estaciones VHF.", "Mejorar exactitud, integridad y continuidad usando satélites geoestacionarios.", "Sustituir a los sistemas GNSS básicos."], "ans": 2, "why": "El SBAS mejora exactitud, integridad, continuidad y disponibilidad con correcciones via satelites geoestacionarios; no usa VHF ni sustituye al GNSS.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Enviando al usuario correcciones e información de integridad a través de satélites geoestacionarios.»", "note": ""}, {"n": 6, "stem": "¿Qué sistema SBAS se utiliza en Europa?", "opts": ["WAAS", "MSAS", "GAGAN", "EGNOS"], "ans": 3, "why": "EGNOS es el SBAS europeo; WAAS es de EEUU, MSAS de Japon y GAGAN de India.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «través de satélites geoestacionarios. EGNOS es el SBAS desarrollado»", "note": ""}, {"n": 7, "stem": "¿Qué aproximaciones puede habilitar un sistema GBAS actualmente?", "opts": ["Solo aproximaciones visuales.", "Aproximaciones CAT I.", "Aproximaciones CAT II y III.", "Aproximaciones RNP AR."], "ans": 1, "why": "El GBAS habilita hoy aproximaciones de precision CAT I; CAT II/III queda para el futuro.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Habilita aproximaciones de precisión, actualmente CAT I y en el futuro CAT II/III.»", "note": ""}, {"n": 8, "stem": "El sistema ABAS funciona mediante:", "opts": ["Datos redundantes recibidos de múltiples satélites GNSS o IRS.", "Señales enviadas desde estaciones terrestres.", "Correcciones de fase provenientes de un DME.", "Estaciones radiobaliza de precisión."], "ans": 0, "why": "El ABAS se basa en la aeronave: usa la redundancia de senales de satelites y datos de sistemas autonomos como el IRS. No depende de estaciones terrestres.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «redundancia de las señales recibidas de los satélites del sistemas»", "note": ""}, {"n": 9, "stem": "¿Qué información debe introducir el piloto antes de iniciar el uso de un INS?", "opts": ["La altitud del aeropuerto de destino.", "El rumbo magnético inicial.", "Las coordenadas del punto inicial del vuelo.", "La velocidad respecto al suelo."], "ans": 2, "why": "Antes de usar el INS el piloto introduce las coordenadas del punto inicial (aeropuerto de origen); el sistema integra aceleraciones desde ahi.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Es importante indicar la necesidad de conocer las coordenadas del punto inicial del vuelo»", "note": ""}, {"n": 10, "stem": "Los INS láser utilizan:", "opts": ["Acelerómetros de torsión exclusivamente.", "Tres giróscopos láser y tres acelerómetros.", "Un giróscopo y cuatro acelerómetros.", "Un péndulo inercial estabilizado."], "ans": 1, "why": "Los INS laser llevan tres giroscopos laser y tres acelerometros, uno por cada eje principal del avion.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Este tipo de Inerciales constan de tres giróscopos láser y tres acelerómetros»", "note": ""}, {"n": 11, "stem": "¿Qué técnica utiliza el radar Doppler para determinar la posición respecto a una ruta seleccionada?", "opts": ["Medición de tiempo de vuelo de señales.", "Medición de variación de frecuencia entre señal emitida y recibida.", "Triangulación entre radioayudas de tierra.", "Integración de pseudodistancias."], "ans": 1, "why": "El radar Doppler mide la variacion de frecuencia entre la senal emitida y la reflejada (efecto Doppler).", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Por la técnica utilizada (basada en la variación de frecuencia entre señales emitidas y recibidas),»", "note": ""}, {"n": 12, "stem": "¿Qué limita el alcance del radar Doppler?", "opts": ["Saturación de banda VHF.", "La dependencia de línea de vista con antenas terrestres.", "El rango de velocidades donde el cálculo de aceleración no es ambiguo.", "El número de haces utilizados."], "ans": 2, "why": "El alcance queda limitado porque solo en cierto rango de velocidades el calculo no es ambiguo. El sistema es autonomo, no depende de antenas terrestres.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «la aceleración sólo puede ser calculada sin ambigüedad en un determinado rango de velocidades de la aeronave»", "note": ""}, {"n": 13, "stem": "¿Qué determina la distancia en un radar primario PSR?", "opts": ["La potencia reflejada.", "El tiempo entre interrogación y eco recibido.", "El ángulo de rotación de la antena.", "La frecuencia de la portadora transmitida."], "ans": 1, "why": "La distancia en radar se obtiene del tiempo entre emision y recepcion del eco. La potencia reflejada no determina la distancia y el angulo de la antena da la marcacion.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «medida del tiempo transcurrido desde que se envía la señal de interrogación hasta que recibe»", "note": ""}, {"n": 14, "stem": "¿En qué banda trabaja normalmente un radar PSR?", "opts": ["HF", "VHF", "Bandas L y S", "Banda X"], "ans": 2, "why": "El PSR de vigilancia en ruta y aproximacion opera en banda L (ruta) y S (terminal). HF y VHF no se usan, la banda X es propia de radares de superficie y meteorologicos.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": ""}, {"n": 15, "stem": "¿Qué banda usa el radar de superficie SMR?", "opts": ["Banda S", "Banda X", "Banda HF", "Banda UHF"], "ans": 1, "why": "El radar de movimiento en superficie (SMR) trabaja normalmente en banda X (y a veces Ku) para obtener alta resolucion.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Conocimiento general (OACI/EASA/normativa); el manual del tema no lo recoge de forma citable", "note": ""}, {"n": 16, "stem": "En comparación con un PSR, el SMR tiene:", "opts": ["Menor tasa de actualización.", "Haz más ancho y menor precisión angular.", "Mayor rapidez de giro y mejor resolución en azimut.", "Menor capacidad para detectar objetos en tierra."], "ans": 2, "why": "El SMR usa antena más pequeña que gira más rápido (1 rev/s frente a 6-15 rpm) y mejora la resolución en acimut por su haz más delgado. La opción B es falsa: el haz es más estrecho, no más ancho.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «la antena es mucho más pequeña y liviana, lo que permite una rotación más rápida»", "note": ""}, {"n": 17, "stem": "¿Qué elemento requiere un radar secundario SSR que no necesita un PSR?", "opts": ["Antena giratoria.", "Transpondedor a bordo.", "Módulo de eco de onda.", "Conversor de banda."], "ans": 1, "why": "El SSR es cooperativo: necesita el transpondedor a bordo que responde a las interrogaciones. El PSR solo usa el eco pasivo de la aeronave.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «El SSR consta de un componente terrestre y un equipo de a bordo en la aeronave, denominado transpondedor.»", "note": ""}, {"n": 18, "stem": "¿Qué modo del transpondedor permite identificación y transmisión de altitud?", "opts": ["Modo A", "Modo C", "Modo S radiodifusión", "Modo S llamada selectiva"], "ans": 1, "why": "El Modo C, con el 3/A seleccionado, transmite la altitud además de la identificación. El Modo A solo da identificación.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «Con este modo conectado, además de estar seleccionado el Modo 3/A, el equipo transmite una señal de altitud»", "note": "Ambigua: identificación es modo A y altitud modo C; B es la mejor opción por incluir la altitud."}, {"n": 19, "stem": "¿En qué se basa la técnica de multilateración (MLAT)?", "opts": ["En la diferencia horaria de llegada (TDOA) de las señales.", "En la intensidad relativa de señales GNSS.", "En la combinación de radiales y distancias.", "En la modulación Doppler."], "ans": 0, "why": "La MLAT se basa en la diferencia horaria de llegada (TDOA) de las señales a varias estaciones fijas, no en GNSS ni Doppler.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «diferencia horaria de llegada (TDOA, por las siglas en inglés de Time Difference of Arrival»", "note": ""}, {"n": 20, "stem": "¿Qué característica distingue a ADS de los sistemas de vigilancia independientes?", "opts": ["La aeronave debe recibir interrogaciones para transmitir datos.", "Utiliza exclusivamente señales de radar primario.", "Los datos se generan a bordo y se transmiten automáticamente.", "Requiere una red de antenas GBAS."], "ans": 2, "why": "ADS es automática y dependiente: los datos se generan en los sistemas de a bordo y se envían sin interrogación ni intervención del piloto. La opción A describe un sistema con interrogación como el SSR.", "src": "Test de ayuda al estudio USCA (convocatoria 2025). Manual ENAIRE, tema 5: «es dependiente, porque la información necesaria es generada en la misma aeronave»", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/05-navegacion-sistemas/usca-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
