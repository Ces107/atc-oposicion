<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Vigilancia, comunicaciones y sistemas ATC (ampliado) - Tema 5 (T05b)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:nowrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em;flex:none;white-space:nowrap}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem;min-width:0;flex:0 1 auto}
header.top a.back>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}
header.top .hd-end{display:flex;align-items:center;justify-content:flex-end;gap:1.1rem;flex:none;min-width:8.4rem;margin-left:auto}
header.top #acct-slot{min-width:28px;min-height:28px;justify-content:flex-end}
header.top .hbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
header.top .hbtn:hover,header.top .hbtn[aria-expanded=true]{color:var(--acc)}
@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}
@media (max-width:640px){
  header.top{gap:0;padding:2px .4rem 2px .6rem;min-height:49px}
  header.top a.home{min-height:44px;padding-right:.5rem}
  header.top.hb a.home .brand{display:none}
  header.top a.back{min-height:44px;flex:1 1 auto;padding-right:.3rem}
  header.top .cmdk-btn .lbl,header.top .cmdk-btn .kbd{display:none}
  header.top .cmdk-btn,header.top .nextbtn{width:44px;height:44px;justify-content:center;padding:0;gap:0;flex:none}
  header.top .nextbtn{font-size:0;margin:0}
  header.top .cmdk-btn svg.i,header.top .hbtn svg.i{width:20px;height:20px}
  header.top .nextbtn svg.i{width:18px;height:18px}
  header.top .hd-end{gap:0;min-width:88px;margin-left:0}
  header.top #acct-slot{min-width:44px;min-height:44px}
}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
@media (max-width:640px){.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:.5rem;white-space:nowrap;font-size:13px}.bar::-webkit-scrollbar{display:none}.bar>*{flex:0 0 auto}.bar button{padding:6px 9px}.bar #score{margin-right:.2rem}}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}
nav.toc a.active{color:var(--acc);font-weight:600}
@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}
  #toc>b{padding:.6rem 0 .3rem}
  #toc a{display:block;padding:.8rem 0;line-height:1.35}
}
@media (max-width:900px),(pointer:coarse){table.src td.act a{min-height:44px;min-width:44px;padding:0 .35rem;margin-right:.3rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}

details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
.reading-progress{position:fixed;top:calc(var(--hh,49px) - 2px);left:0;right:0;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;z-index:6;pointer-events:none}

.figcap{font:600 13px var(--sans);color:var(--mut);margin:1rem 0 .2rem}
.figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);margin:0 0 .4rem}
.figs>div{flex:1 1 6.2rem;padding:.5rem .8rem .55rem 0}
.figs b{display:block;font:700 1.55rem/1.15 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.figs b small{font-size:.6em;color:var(--mut);font-weight:600}

c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Navegación, equipos y sistemas</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Vigilancia, comunicaciones y sistemas ATC (ampliado) - Tema 5 (T05b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Qué frecuencia usa un interrogador SSR/modo S para interrogar a las aeronaves, según el Concepto de Operaciones del modo S de EUROCONTROL?", "opts": ["978 MHz", "1030 MHz", "1090 MHz", "121,5 MHz"], "ans": 1, "why": "El modo S mantuvo la frecuencia de interrogación del SSR existente (1030 MHz) para facilitar la transición desde el SSR clásico; las respuestas usan 1090 MHz (la opción C es la frecuencia de respuesta, un distractor habitual).", "src": "EUROCONTROL Mode S Concept of Operations (1996), §2.1", "note": ""}, {"n": 2, "stem": "¿Cuántos códigos de identificador de interrogador (II) hay disponibles para el uso operacional del modo S?", "opts": ["4", "8", "15", "24"], "ans": 2, "why": "El Concepto de Operaciones del modo S indica que hay 15 códigos II disponibles para uso operacional, lo que por diseño limita el intercambio de datos tierra-aire sin ambigüedad y puede provocar escasez que obligue a recurrir a los códigos de identificador de vigilancia (SI).", "src": "EUROCONTROL Mode S Concept of Operations (1996), §1.4", "note": ""}, {"n": 3, "stem": "¿Cuál es el alcance máximo nominal de un interrogador de modo S, según el Concepto de Operaciones de EUROCONTROL?", "opts": ["60 NM", "100 NM", "200 NM", "256 NM"], "ans": 3, "why": "El documento indica un alcance máximo nominal de 256 NM dentro de la cobertura en línea de vista.", "src": "EUROCONTROL Mode S Concept of Operations (1996), §3.1", "note": ""}, {"n": 4, "stem": "¿Qué cifra de fiabilidad de la vigilancia atribuye al sistema el Concepto de Operaciones del modo S de EUROCONTROL?", "opts": ["Al menos el 90 %", "Al menos el 95 %", "Al menos el 99 %", "El 100 %"], "ans": 2, "why": "El documento indica una fiabilidad global de la vigilancia de al menos el 99 por ciento, porque un blanco puede interrogarse dentro de un único ciclo de interrogación.", "src": "EUROCONTROL Mode S Concept of Operations (1996), §3.1", "note": ""}, {"n": 5, "stem": "¿Qué nivel de servicio del modo S añade la extracción de parámetros adicionales (altitud seleccionada, rumbo, velocidad aerodinámica, velocidad vertical) mediante el enlace descendente Comm-B?", "opts": ["Vigilancia elemental (ELS)", "Interrogación general (<em>all-call</em>)", "Intermodo", "Vigilancia mejorada (EHS)"], "ans": 3, "why": "El ELS es la capacidad básica; el EHS añade específicamente la extracción de parámetros adicionales de a bordo mediante Comm-B (registros BDS), como confirma la tabla de parámetros con código de colores del DAP/ADD Handbook.", "src": "EUROCONTROL DAP/ADD Handbook ed.1.0 (2024), p.29-30; Regulation (EU) 2023/1770 AUR.SUR.2005", "note": ""}, {"n": 6, "stem": "Según el Reglamento (UE) 2023/1770, ¿qué aeronaves deben llevar ADS-B Out (1090ES) y vigilancia mejorada de modo S?", "opts": ["Todas las aeronaves que vuelen IFR en el espacio aéreo del SES, sea cual sea su tamaño", "Las aeronaves con MTOW superior a 5700 kg o con TAS máxima de crucero superior a 250 kt (certificadas por primera vez el 7 de junio de 1995 o después)", "Solo las aeronaves por encima del FL285", "Solo las aeronaves basadas en España"], "ans": 1, "why": "AUR.SUR.2005(1)(b)-(c) fija exactamente este umbral; lo que se aplica a prácticamente todas las aeronaves GAT que vuelan IFR es solo el ELS (no el EHS ni el ADS-B Out): la opción A describe el ELS, una trampa habitual.", "src": "Regulation (EU) 2023/1770, AUR.SUR.2005", "note": ""}, {"n": 7, "stem": "Según AUR.SUR.2010 del Reglamento (UE) 2023/1770, ¿durante cuánto tiempo puede una aeronave seguir volando con la capacidad ADS-B Out/EHS temporalmente inoperativa?", "opts": ["1 día", "30 días", "7 días", "3 días consecutivos"], "ans": 3, "why": "El Reglamento concede un máximo de 3 días consecutivos de tolerancia para la capacidad inoperativa.", "src": "Regulation (EU) 2023/1770, AUR.SUR.2010", "note": ""}, {"n": 8, "stem": "¿A qué vuelos se aplica el requisito del Reglamento (UE) 2023/1770 de que un transpondedor de modo S funcione con una dirección de aeronave OACI de 24 bits (AUR.SUR.2015)?", "opts": ["Solo a las aeronaves de más de 5700 kg de MTOW", "Solo a las aeronaves equipadas con ADS-B Out", "A todos los vuelos que operan como tránsito aéreo general", "Solo a las aeronaves de Estado (militares)"], "ans": 2, "why": "A diferencia de los umbrales del ADS-B Out/EHS, AUR.SUR.2015 (dirección de 24 bits) se aplica a todos los vuelos GAT, sin umbral de tamaño ni de velocidad.", "src": "Regulation (EU) 2023/1770, AUR.SUR.2015", "note": ""}, {"n": 9, "stem": "¿Qué cuatro reglamentos de ejecución de la UE se derogaron y se refundieron en el Reglamento (UE) 2023/1770?", "opts": ["(CE) 216/2008, (UE) 748/2012, (UE) 965/2012, (UE) 1178/2011", "(UE) 1048/2018, (UE) 2019/123, (UE) 2021/116, (UE) 2021/664", "(UE) 923/2012, (UE) 2017/373, (UE) 2019/317, (UE) 139/2014", "(CE) 29/2009, (UE) 1206/2011, (UE) 1207/2011, (UE) 1079/2012"], "ans": 3, "why": "El artículo 5 del Reglamento 2023/1770 deroga exactamente los reglamentos sobre enlace de datos (29/2009), identificación de aeronaves (1206/2011), vigilancia (1207/2011) y 8,33 kHz (1079/2012), y los refunde en la Parte COM y la Parte SUR.", "src": "Regulation (EU) 2023/1770, Article 5", "note": ""}, {"n": 10, "stem": "¿En qué banda VHF se aplica el título del Reglamento (UE) 2023/1770 sobre separación de canales de voz (8,33 kHz)?", "opts": ["108-117,95 MHz", "225-400 MHz", "121,5-123,1 MHz", "117,975-137 MHz"], "ans": 3, "why": "AUR.COM.3001 delimita expresamente el título a las comunicaciones de voz en la banda de 117,975-137 MHz, con exclusión de la FIR/UIR Canarias.", "src": "Regulation (EU) 2023/1770, AUR.COM.3001", "note": ""}, {"n": 11, "stem": "¿Qué FIR/UIR queda excluida del ámbito del título del Reglamento (UE) 2023/1770 sobre separación de canales de voz (8,33 kHz)?", "opts": ["Madrid", "Barcelona", "Canarias", "Ninguna; se aplica en toda España"], "ans": 2, "why": "AUR.COM.3001 excluye expresamente la FIR/UIR Canarias del ámbito de este título concreto.", "src": "Regulation (EU) 2023/1770, AUR.COM.3001", "note": ""}, {"n": 12, "stem": "Según el antiguo Reglamento (UE) 1079/2012, ¿a partir de qué fecha un operador de aeronaves no podía volar en el espacio aéreo ATS de la UE sin capacidad de separación de canales de 8,33 kHz?", "opts": ["1 de enero de 2015", "1 de enero de 2018", "31 de diciembre de 2018", "1 de enero de 2020"], "ans": 1, "why": "El manual del usuario VCS de 8,33 kHz indica que este requisito de equipamiento de las aeronaves entró en vigor el 1 de enero de 2018; el 31 de diciembre de 2018 fue, en cambio, el plazo para la conversión de las asignaciones de frecuencia en tierra (una trampa habitual, la opción C).", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), Executive Summary", "note": ""}, {"n": 13, "stem": "¿Cuál de las siguientes asignaciones VHF se mantuvo expresamente con separación de 25 kHz (sin convertir a 8,33 kHz)?", "opts": ["118,025 MHz, una frecuencia ordinaria de ACC", "Cualquier frecuencia de torre asignada nueva después de 2018", "132,035 MHz, una frecuencia de sector de 8,33 kHz", "121,5 MHz, la frecuencia de emergencia"], "ans": 3, "why": "El Reglamento VCS eximió expresamente de la conversión a 121,5 MHz (emergencia), 123,1 MHz (SAR) y las asignaciones de ACARS/VDL.", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), Executive Summary", "note": ""}, {"n": 14, "stem": "A una aeronave se le indica que sintonice el designador de canal de 8,33 kHz «132.035». ¿Qué frecuencia real sintoniza la radio?", "opts": ["Exactamente 132,0350 MHz", "132,0300 MHz", "132,3500 MHz", "132,0333 MHz"], "ans": 3, "why": "El ejemplo resuelto del manual VCS de 8,33 kHz indica que el canal 132.035 sintoniza la frecuencia real de 132,0333 MHz: la trama de 8,33 kHz subdivide cada canal de 25 kHz en tres, por lo que el designador y la frecuencia real difieren ligeramente.", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), §5.2", "note": ""}, {"n": 15, "stem": "¿Cómo se pronuncia en radiotelefonía el canal «118.000 MHz» (separación de 25 kHz) según la convención de denominación de 8,33 kHz de la OACI?", "opts": ["\"ONE ONE EIGHT DECIMAL ZERO ZERO ZERO\"", "\"ONE ONE EIGHT ZERO\"", "\"ONE EIGHTEEN POINT ZERO\"", "\"ONE ONE EIGHT DECIMAL ZERO\""], "ans": 3, "why": "Cuando las cifras quinta y sexta son ambas cero, solo se pronuncian las cuatro primeras, así que 118.000 se dice \"ONE ONE EIGHT DECIMAL ZERO\".", "src": "EUROCONTROL 8.33 kHz VCS User Handbook v1.1 (2017), §5.2", "note": ""}, {"n": 16, "stem": "Según el AIP de España GEN 3.4, ¿qué cuatro servicios componen la prestación del enlace de datos ATN B1 en España?", "opts": ["ADS-C, CPDLC, ACARS, VDL", "FIS, ALRS, AS, ATC", "TCPV, TLPV, SACTA, ICARO", "DLIC, ACL, ACM, AMC"], "ans": 3, "why": "El GEN 3.4 §3.5.1 nombra exactamente estos cuatro servicios CPDLC del ATN B1 (capacidad de inicio del enlace de datos, autorizaciones ATC, gestión de las comunicaciones ATC y comprobación del micrófono ATC).", "src": "AIP Spain, GEN 3.4 §3.5.1", "note": ""}, {"n": 17, "stem": "Según el AIP de España, ¿a partir de qué nivel de vuelo está disponible en general el servicio de enlace de datos ATN B1 en la UIR de Madrid y la de Barcelona?", "opts": ["FL195", "FL245", "FL285", "FL350"], "ans": 2, "why": "El GEN 3.4 §3.5.1 indica que los servicios de enlace de datos ATN están disponibles a partir del FL285 en la UIR de Madrid (ACC de Madrid y ACC de Sevilla) y en la UIR de Barcelona (ACC de Barcelona).", "src": "AIP Spain, GEN 3.4 §3.5.1", "note": ""}, {"n": 18, "stem": "Una aeronave equipada solo con aviónica FANS-1/A quiere usar CPDLC en la TMA de Madrid por debajo del FL285. Según el AIP de España, ¿es posible?", "opts": ["Sí, el FANS-1/A es totalmente interoperable con el servicio ATN B1 de España", "No, en España no se ofrece CPDLC en ningún lugar", "Sí, pero solo por encima del FL195", "No, la aplicación CPDLC del ATN no está disponible para aeronaves equipadas únicamente con FANS-1/A"], "ans": 3, "why": "El GEN 3.4 indica expresamente que la aplicación CPDLC del ATN «no está disponible para aeronaves equipadas solo con FANS1/A» («is not available for aircraft with just FANS1/A equipment»): requiere aviónica CPDLC ATN VDL Modo 2.", "src": "AIP Spain, GEN 3.4 §3.5.1", "note": ""}, {"n": 19, "stem": "¿En qué FIR/UIR de España está disponible el servicio de enlace de datos FANS (ADS-C más CPDLC), según el AIP de España?", "opts": ["Solo en la FIR de Madrid", "Solo en la FIR de Barcelona", "En el área de servicio ATS oceánica de la FIR/UIR Canarias", "En todas las FIR españolas por igual"], "ans": 2, "why": "El GEN 3.4 §3.5.2 restringe el enlace de datos FANS (basado en el estándar GOLD de la OACI) al área de servicio ATS oceánica de la FIR/UIR Canarias.", "src": "AIP Spain, GEN 3.4 §3.5.2", "note": ""}, {"n": 20, "stem": "Según el AIP de España GEN 3.4, ¿qué ocurre con el intervalo de notificación del acuerdo ADS-C en el ACC de Canarias durante una emergencia ADS-C?", "opts": ["Se duplica respecto al intervalo preestablecido", "Pasa a un intervalo de 5 minutos", "Se desactiva el ADS-C y solo queda activo el CPDLC", "Cambia automáticamente a 64 segundos"], "ans": 3, "why": "El GEN 3.4 §3.5.2.1 indica que el intervalo del acuerdo cambia automáticamente a 64 segundos durante una emergencia ADS-C y vuelve al valor anterior cuando cesa la emergencia.", "src": "AIP Spain, GEN 3.4 §3.5.2.1", "note": ""}, {"n": 21, "stem": "Según el AIP de España ENR 1.6 §6.1, ¿qué mínimo de separación horizontal se aplica entre dos trazas solo de radar primario (PSR) en el espacio aéreo TMA/APP/TWR?", "opts": ["3 NM", "15 NM", "10 NM", "5 NM"], "ans": 3, "why": "El ENR 1.6 §6.1 fija en 5 NM las separaciones PSR&lt;-&gt;PSR, PSR&lt;-&gt;SSR y PSR&lt;-&gt;ADS en el espacio aéreo TMA/APP/TWR.", "src": "AIP Spain, ENR 1.6 §6.1", "note": ""}, {"n": 22, "stem": "Según el AIP de España ENR 1.6, ¿cuál es la regla del mínimo de separación entre una traza de vigilancia secundaria (SSR) y una traza ADS-B?", "opts": ["Es siempre exactamente 5 NM", "Es siempre exactamente 3 NM", "Es el mayor (más estricto) de los mínimos aplicables al SSR y al ADS-B", "Es el menor (más laxo) de los mínimos aplicables al SSR y al ADS-B"], "ans": 2, "why": "La nota a pie de página repetida del ENR 1.6 indica que el mínimo de separación SSR&lt;-&gt;ADS es el mayor de los mínimos aplicables a cada tipo de traza de vigilancia.", "src": "AIP Spain, ENR 1.6 §6.2-6.4 footnotes", "note": ""}, {"n": 23, "stem": "Según el AIP de España ENR 1.6, ¿qué mínimo de separación reducido especial se aplica entre aeronaves sucesivas en la misma trayectoria de aproximación final, a menos de 10 NM del umbral, en condiciones HIRO en la aproximación (APP) de Barcelona?", "opts": ["2,5 NM", "3 NM", "4 NM", "5 NM"], "ans": 0, "why": "La nota (e) del ENR 1.6 §6.3 fija un mínimo especial de 2,5 NM entre aeronaves sucesivas en la misma trayectoria de aproximación final, a menos de 10 NM del umbral, en condiciones HIRO.", "src": "AIP Spain, ENR 1.6 §6.3", "note": ""}, {"n": 24, "stem": "Según el AIP de España ENR 1.6, ¿qué modo y código de transpondedor debe seleccionar un piloto en una emergencia general, salvo instrucciones en contrario?", "opts": ["Modo A/3, código 7600", "Modo C, código 7500", "Modo A/3, código 2000", "Modo A/3, código 7700"], "ans": 3, "why": "El ENR 1.6 §4.1 indica que el piloto debe seleccionar el modo A/3, código 7700, en situaciones de emergencia, y que también puede transmitir la alerta de emergencia general del ADS-B.", "src": "AIP Spain, ENR 1.6 §4.1", "note": ""}, {"n": 25, "stem": "Según el AIP de España ENR 1.6 §2.1, ¿qué código de modo A/3 por defecto usan los vuelos controlados que entran en la FIR/UIR de Madrid, Barcelona o Canarias, si no hay instrucciones específicas del ATC?", "opts": ["7000", "2000", "1000", "7700"], "ans": 1, "why": "El ENR 1.6 §2.1(a) da el código 20 (2000) para los vuelos controlados; el código 70 (7000) es, en cambio, el que se usa por defecto para los vuelos no controlados (la opción A, una trampa habitual).", "src": "AIP Spain, ENR 1.6 §2.1", "note": ""}, {"n": 26, "stem": "Según el AIP de España ENR 1.6, ¿qué debe hacer un piloto si el equipo ADS-B de la aeronave no cumple los requisitos de precisión e integridad del Reglamento (UE) 2023/1770?", "opts": ["Transmitir siempre un valor cero en los indicadores de calidad de la posición, o desactivar la transmisión ADS-B", "Transmitir los datos ADS-B de todos modos, con una nota de advertencia", "Pasar permanentemente al modo A/3, código 7000", "Solicitar por radio una exención al ATC antes de cada vuelo"], "ans": 0, "why": "El ENR 1.6 §3 indica que las aeronaves que no cumplan «transmitirán siempre un valor 0 (cero) en los indicadores de calidad de la posición o desactivarán la transmisión ADS-B» («shall always transmit a value of 0 (zero) on the position quality indicators or disable ADS-B transmission»).", "src": "AIP Spain, ENR 1.6 §3", "note": ""}, {"n": 27, "stem": "En la leyenda de estaciones de vigilancia del AIP de España ENR 1.6, ¿qué significa el código de tecnología «(SM)»?", "opts": ["Movimiento en superficie (radar)", "SSR monopulso", "Modo S", "Multilateración espacial"], "ans": 2, "why": "El ENR 1.6 §7 define por separado (S) como SSR monopulso y (SM) como modo S; (SM) denota específicamente una estación de modo S.", "src": "AIP Spain, ENR 1.6 §7", "note": ""}, {"n": 28, "stem": "En la leyenda de estaciones de vigilancia del AIP de España ENR 1.6, ¿qué denota el código de tipo de estación «WAM»?", "opts": ["Multilateración de área extensa (<em>Wide Area Multilateration</em>)", "Vigilancia de áreas meteorológicas (<em>Weather Area Monitoring</em>)", "Baliza de zona de aviso (<em>Warning Area Marker</em>)", "Módulo de acceso VHF (<em>VHF Access Module</em>)"], "ans": 0, "why": "El ENR 1.6 §7 define el WAM como multilateración de área extensa, uno de los «tipos» de estación por su finalidad, junto con LRR, TAR, SMR y SMMS.", "src": "AIP Spain, ENR 1.6 §7", "note": ""}, {"n": 29, "stem": "¿Qué servicio de radionavegación, no incluido entre los cuatro tipos de radioayudas del manual (NDB, VOR, DME, ILS), figura como disponible en España en el AIP GEN 3.4?", "opts": ["TACAN", "LORAN-C", "OMEGA", "SELCAL"], "ans": 0, "why": "El GEN 3.4 §3.1 enumera PAR, NDB, VDF, ILS, VOR, DME, TACAN y GBAS como servicios de radionavegación disponibles en España; el TACAN (una ayuda militar en UHF) no es uno de los cuatro tipos de «radioayudas» del manual. El LORAN-C y el OMEGA son sistemas hiperbólicos que el manual trata como históricos u obsoletos y que el GEN 3.4 no enumera como disponibles actualmente en España.", "src": "AIP Spain, GEN 3.4 §3.1", "note": ""}, {"n": 30, "stem": "¿Qué estándar de interoperabilidad VoIP usa el SCV (sistema de comunicaciones de voz) de ENAIRE?", "opts": ["EUROCAE ED-137", "ARINC 429", "RTCA DO-260", "OACI, Anexo 10, Vol. II"], "ans": 0, "why": "La propia descripción web de ENAIRE indica que su SCV usa tecnología VoIP conforme al estándar internacional de interoperabilidad EUROCAE ED-137.", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 31, "stem": "¿Por qué despliega ENAIRE sus sistemas de comunicaciones de voz (SCV) como un «sistema dual»?", "opts": ["Dos sistemas con la misma funcionalidad pero con software crítico distinto, por redundancia de seguridad", "Un sistema para el tráfico civil y otro para el militar", "Un sistema para la voz y otro distinto para los datos", "Un sistema principal y otro solo para formación"], "ans": 0, "why": "La descripción de ENAIRE indica expresamente que el diseño dual usa la misma funcionalidad pero un software crítico diferente «por razones de seguridad».", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 32, "stem": "¿Qué significa SACTA?", "opts": ["Sistema Automatizado de Control de Tránsito Aéreo", "Sistema Aeronáutico de Comunicación por Tránsito Aéreo", "Sistema de Apoyo al Control de Torres y Aeropuertos", "Servicio de Análisis y Control de Tráfico Aéreo"], "ans": 0, "why": "SACTA es el Sistema Automatizado de Control de Tránsito Aéreo de ENAIRE.", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 33, "stem": "¿Qué componente del SACTA se encarga del tratamiento de los planes de vuelo, dividido en una unidad central y varias locales, según la propia descripción de ENAIRE?", "opts": ["TCPV (central) y TLPV (local)", "FDPS (central) y RDPS (local)", "ICARO (central) y SCV (local)", "A-CDM (central) y AMAN (local)"], "ans": 0, "why": "ENAIRE llama a sus componentes de tratamiento de planes de vuelo TCPV (Tratamiento Central de Planes de Vuelo) y TLPV (Tratamientos Locales de Planes de Vuelo); FDPS/RDPS son las siglas inglesas estándar de la misma función, pero no son los términos que usa ENAIRE.", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 34, "stem": "¿Qué automatiza ICARO, según la propia descripción de ENAIRE?", "opts": ["La gestión de NOTAM/AIS/AIP, la presentación inicial de planes de vuelo y las tareas de las oficinas ARO", "Solo las previsiones meteorológicas para AEMET", "Solo el seguimiento de blancos radar", "Solo el sistema de nóminas de ENAIRE"], "ans": 0, "why": "ICARO (<em>Integrated COM/AIS/AIP &amp; Reporting Office Automated System</em>) automatiza las tareas de la Oficina NOTAM española (NOF), los proyectos de NOTAM de aeropuerto y la presentación y el seguimiento iniciales de planes de vuelo en las oficinas ARO.", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 35, "stem": "¿Con qué programa de EUROCONTROL se interconecta ICARO, a través de los sistemas de Aena, para enviar la mensajería aeroportuaria?", "opts": ["La Empresa Común SESAR", "El Centro de Operaciones del Gestor de Red", "Toma de decisiones colaborativa en aeropuertos (A-CDM)", "El registro SWIM"], "ans": 2, "why": "ENAIRE indica que ICARO «es el encargado de ofrecer a EUROCONTROL la mensajería generada por los aeropuertos dentro del programa Airport Collaborative Decision Making (A-CDM)».", "src": "ENAIRE web, \"Sistemas de gestión del tránsito aéreo (ATM)\"", "note": ""}, {"n": 36, "stem": "¿Cuándo se lanzó el programa iTEC SkyNex, según la propia página web de ENAIRE en inglés?", "opts": ["2015", "2018", "2021", "2024"], "ans": 2, "why": "La página de ENAIRE sobre iTEC SkyNex indica que los miembros «decidieron en 2021 lanzar el programa iTEC SkyNex» («decided in 2021 to launch the iTEC SkyNex programme»).", "src": "ENAIRE web, \"iTEC SkyNex\" (EN)", "note": ""}, {"n": 37, "stem": "¿Qué empresa figura como socio tecnológico de iTEC SkyNex?", "opts": ["Thales", "Indra", "Leonardo", "Raytheon"], "ans": 1, "why": "La página de ENAIRE sobre iTEC nombra a Indra como socio tecnológico de la Alianza.", "src": "ENAIRE web, \"iTEC SkyNex\" (EN)", "note": ""}, {"n": 38, "stem": "Según las cifras de la propia ENAIRE, ¿cuánto espacio aéreo supervisa aproximadamente la alianza iTEC?", "opts": ["2,6 millones de kilómetros cuadrados", "12 millones de kilómetros cuadrados", "Más de 26 millones de kilómetros cuadrados", "100 millones de kilómetros cuadrados"], "ans": 2, "why": "ENAIRE indica que la colaboración iTEC «supervisa más de 26 millones de kilómetros cuadrados de espacio aéreo... y gestiona más de 12 millones de vuelos al año desde 27 centros de control» («oversees more than 26 million square kilometres of airspace... managing over 12 million flights per year from 27 control centres»); los 12 millones son la cifra de vuelos al año, una trampa habitual para la opción B.", "src": "ENAIRE web, \"iTEC SkyNex\" (EN)", "note": ""}, {"n": 39, "stem": "¿Es ENAIRE miembro de la alianza COOPANS?", "opts": ["Sí, junto con iTEC", "No, ENAIRE es miembro de iTEC, no de COOPANS", "ENAIRE fundó COOPANS", "COOPANS e iTEC se fusionaron en 2021, con ENAIRE como miembro principal"], "ans": 1, "why": "Según la comprobación cruzada del propio mapa de lectura del proyecto, ENAIRE pertenece a la alianza iTEC y se anota expresamente que no es miembro de COOPANS.", "src": "<code>state/atc/sources-index/DL05-map.md</code> §B5; ENAIRE iTEC SkyNex page (positive fact)", "note": ""}, {"n": 40, "stem": "¿Qué constelación de satélites aloja la carga útil ADS-B espacial de Aireon?", "opts": ["GPS", "Galileo", "Iridium", "Starlink"], "ans": 2, "why": "La carga útil receptora ADS-B de Aireon vuela en la constelación de satélites Iridium (NEXT).", "src": "EUROCONTROL, ADS-B implementation status (2018)", "note": ""}, {"n": 41, "stem": "Según el concepto GADSS de la OACI que se comenta en el informe de EUROCONTROL de 2018 sobre el estado del ADS-B, ¿con qué frecuencia mínima debe actualizarse la posición de una aeronave que opera con normalidad?", "opts": ["Cada 1 minuto", "Cada 15 minutos", "Cada 30 minutos", "Cada hora"], "ans": 1, "why": "El GADSS recomienda actualizar la posición al menos cada 15 minutos en condiciones normales, y solo la reduce a cada 1 minuto (opción A) cuando la aeronave está en estado de peligro.", "src": "EUROCONTROL, ADS-B implementation status (2018)", "note": ""}, {"n": 42, "stem": "¿Desde cuándo es obligatorio el TCAS II versión 7.1 para las operaciones en Europa?", "opts": ["1 de enero de 2005", "1 de diciembre de 2015", "1 de enero de 2017", "Marzo de 2025"], "ans": 1, "why": "La Guía ACAS v5.0 de EUROCONTROL indica que el TCAS II v7.1 es obligatorio en Europa desde el 1 de diciembre de 2015 para las aeronaves que entran en su ámbito; marzo de 2025 es, en cambio, cuando se aprobó además el ACAS Xa/Xo (opción D, una trampa).", "src": "EUROCONTROL ACAS Guide v5.0 (2025), Introduction", "note": ""}, {"n": 43, "stem": "¿A partir de qué MTOW o configuración de asientos se aplica la obligación europea del TCAS II v7.1, según la Guía ACAS?", "opts": ["MTOW superior a 5700 kg o más de 19 asientos de pasajeros aprobados", "MTOW superior a 15 000 kg o más de 50 asientos de pasajeros aprobados", "Cualquier aeronave con motor de turbina, sea cual sea su tamaño", "Solo las aeronaves con velocidad de crucero superior a 250 kt"], "ans": 0, "why": "La Guía ACAS indica que la obligación se aplica a las aeronaves civiles de ala fija con motor de turbina con MTOW superior a 5700 kg o con una configuración de más de 19 asientos; la opción D describe el umbral (distinto) del ADS-B Out/EHS, una trampa habitual para confundir las dos obligaciones.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), Introduction", "note": ""}, {"n": 44, "stem": "¿Qué segundo sistema anticolisión de a bordo quedó aprobado para operar en el espacio aéreo europeo en marzo de 2025, junto con el TCAS II v7.1?", "opts": ["TCAS I", "ACAS Xa/Xo", "ACAS Xu", "STCA"], "ans": 1, "why": "La Guía ACAS indica que, tras la enmienda 91 del Anexo 10, Vol. IV, de la OACI, el ACAS Xa/Xo se aprobó para las operaciones europeas en marzo de 2025 junto con el TCAS II v7.1.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §3.1", "note": ""}, {"n": 45, "stem": "¿Por debajo de qué altura quedan inhibidos todos los avisos de resolución (RA) del TCAS II, según la Guía ACAS v5.0 de EUROCONTROL?", "opts": ["500 pies AGL", "1000 pies (±100 ft) AGL", "1100 pies AGL", "1550 pies AGL"], "ans": 1, "why": "La Guía ACAS indica que todos los RA quedan inhibidos por debajo de 1000 pies (±100 ft) AGL; 1100 ft es específicamente el umbral de inhibición del RA de descenso (<em>Descend</em>) y 1550 ft el del RA de aumento de descenso (<em>Increase Descent</em>) (las opciones C y D son los umbrales más específicos y más altos, una buena pregunta discriminante).", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §8.2", "note": ""}, {"n": 46, "stem": "¿Por debajo de qué altura quedan inhibidos específicamente los RA de «aumento de descenso» (<em>Increase Descent</em>), según la Guía ACAS v5.0 de EUROCONTROL?", "opts": ["500 pies AGL", "1000 pies AGL", "1100 pies AGL", "1550 pies (±100 ft) AGL"], "ans": 3, "why": "La Guía ACAS v5.0 vigente da 1550 ft AGL para la inhibición del RA de aumento de descenso; nótese que esto corrige una cifra anterior no verificada, de 1450 ft, que figura en algunas notas del proyecto.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §8.2", "note": ""}, {"n": 47, "stem": "¿Por debajo de qué altura quedan inhibidas las alertas acústicas de TA del TCAS, según la Guía ACAS v5.0 de EUROCONTROL?", "opts": ["500 pies (±100 ft) AGL", "1000 pies AGL", "1100 pies AGL", "1550 pies AGL"], "ans": 0, "why": "Las anunciaciones acústicas de TA quedan inhibidas por debajo de 500 pies (±100 ft) AGL, el más bajo de los cuatro umbrales de inhibición que trata la Guía.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §8.2 / §3.1", "note": ""}, {"n": 48, "stem": "¿Cuál es la frase radiotelefónica estándar de la OACI que usa un piloto para notificar un aviso de resolución al ATC?", "opts": ["\"[callsign] ACAS RA\"", "\"[callsign] TCAS RA\"", "\"[callsign] AVOIDING TRAFFIC\"", "\"[callsign] EMERGENCY DESCENT\""], "ans": 1, "why": "La fraseología estándar usa siempre el término \"TCAS\" y no \"ACAS\", incluso para los RA del ACAS Xa.", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §9.3.2", "note": ""}, {"n": 49, "stem": "¿Qué debe notificar un piloto al anunciar un RA, según la fraseología estándar?", "opts": ["El indicativo y \"TCAS RA\", pero no el sentido (ascender o descender)", "El indicativo, \"TCAS RA\" y la velocidad vertical exacta ordenada", "Solo el sentido (ascender o descender)", "Nada; los RA son silenciosos para el ATC por diseño"], "ans": 0, "why": "La Guía especifica que notificar el sentido no es adecuado porque puede cambiar durante el encuentro; solo se notifica \"[callsign] TCAS RA\".", "src": "EUROCONTROL ACAS Guide v5.0 (2025), §9.3.2", "note": ""}, {"n": 50, "stem": "Una vez que un piloto ha notificado que sigue un RA, ¿qué ocurre con la responsabilidad de separación del ATC en ese encuentro?", "opts": ["El ATC sigue siendo plenamente responsable hasta que la aeronave
