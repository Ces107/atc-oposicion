c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Navegación, equipos y sistemas</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Radioayudas, GNSS y PBN (T05a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según la guía para alumnos de CNATRA «Introduction to Air Navigation», ¿cuáles son los cuatro componentes básicos de la navegación a estima?", "opts": ["Velocidad, tiempo, rumbo y combustible", "Ruta, rumbo, viento y velocidad respecto al suelo", "Latitud, longitud, altitud y velocidad", "Posición, dirección, tiempo y velocidad"], "ans": 3, "why": "CNATRA indica que la navegación a estima se basa en posición, dirección, tiempo y velocidad; si se conocen tres, puede deducirse la cuarta. La redacción del propio manual de ENAIRE, con tres parámetros (velocidad, tiempo y rumbo), no incluye la «posición» como elemento aparte.", "src": "CNATRA Intro to Air Navigation, Information Sheet 6-1-2", "note": ""}, {"n": 2, "stem": "En el triángulo del viento (triángulo de navegación), ¿qué vector representa el rumbo verdadero y la velocidad verdadera (TAS)?", "opts": ["El vector tierra", "El vector viento", "El vector aire", "El vector de ruta"], "ans": 2, "why": "El vector aire es el rumbo y la velocidad propios de la aeronave respecto a la masa de aire; al sumarle el vector viento se obtiene el vector tierra resultante (ruta y velocidad respecto al suelo).", "src": "CNATRA, Information Sheet 6-5-2", "note": ""}, {"n": 3, "stem": "¿Qué relación hay entre el ángulo de deriva y el ángulo de corrección de deriva (<em>crab angle</em>)?", "opts": ["Son iguales en valor y de sentido contrario", "Son magnitudes sin relación entre sí", "El ángulo de corrección es siempre el doble del ángulo de deriva", "El ángulo de deriva solo se aplica con viento de cola"], "ans": 0, "why": "La deriva es la desviación sin corregir que causa el viento; el ángulo de corrección (<em>crab</em>) es la corrección que aplica el piloto hacia el viento, numéricamente igual pero de sentido contrario.", "src": "CNATRA, Information Sheet 6-5-2", "note": ""}, {"n": 4, "stem": "Según la regla del 10 % que se usa en los cálculos de viento previos al vuelo, si la componente de viento cruzado equivale al 10 % de la TAS, el ángulo de corrección de deriva es aproximadamente de:", "opts": ["3 grados", "9 grados", "12 grados", "6 grados"], "ans": 3, "why": "La guía de CNATRA establece la relación: un viento cruzado del 10 % de la TAS da un ángulo de corrección de unos 6 grados, y se escala de forma aproximadamente lineal (5 % -&gt; 3; 15 % -&gt; 9).", "src": "CNATRA, Information Sheet 6-5-2", "note": ""}, {"n": 5, "stem": "¿Qué exactitud global del error de alcance del usuario de la señal en el espacio (SIS URE, <em>Signal-in-Space User Range Error</em>), al 95 %, en operación normal y para todos los valores de edad de los datos (<em>Age of Data</em>), garantiza la norma de prestaciones GPS SPS (5.ª edición)?", "opts": ["3,0 m", "7,0 m", "16,0 m", "30,0 m"], "ans": 1, "why": "La Tabla 3.4-1 del GPS SPS PS indica 7,0 m como estadístico global del URE al 95 % en operación normal para todos los AOD; solo con AOD cero se aplica el valor más estricto de 3,8 m.", "src": "GPS SPS Performance Standard, 5th ed., Table 3.4-1", "note": ""}, {"n": 6, "stem": "La norma de prestaciones GPS SPS señala que, en los últimos años, el GPS ha logrado en la práctica una exactitud superior a la comprometida. ¿Cuál?", "opts": ["3 m en horizontal y 5 m en vertical, o mejor", "7 m en horizontal y 9,7 m en vertical", "30 m en horizontal y 15 m en vertical", "388 m en horizontal en todas las condiciones"], "ans": 0, "why": "El documento distingue expresamente la norma comprometida (URE de 7,0 m al 95 %) de las prestaciones reales observadas: 3 m en horizontal y 5 m en vertical, o mejor.", "src": "GPS SPS Performance Standard, 5th ed.", "note": ""}, {"n": 7, "stem": "La constelación GPS de referencia se describe como formada por:", "opts": ["24 posiciones en 6 planos orbitales, con 4 posiciones por plano", "30 satélites en 3 planos orbitales", "27 satélites en 9 planos orbitales", "21 posiciones en 7 planos orbitales"], "ans": 0, "why": "El GPS SPS PS define la constelación de referencia de 24 posiciones como 6 planos orbitales con 4 posiciones cada uno; 6 de las 24 posiciones son ampliables.", "src": "GPS SPS Performance Standard, 5th ed.", "note": ""}, {"n": 8, "stem": "¿Cuántos satélites nominales de Galileo hay en órbita terrestre media (MEO) y en cuántos planos orbitales?", "opts": ["24 satélites en 3 planos", "30 satélites en 6 planos", "21 satélites en 3 planos", "27 satélites en 9 planos"], "ans": 0, "why": "El Galileo OS SDD indica 24 posiciones nominales de satélites MEO repartidas en 3 planos orbitales, con 8 posiciones por plano y una inclinación de 56 grados.", "src": "Galileo OS SDD v1.3", "note": ""}, {"n": 9, "stem": "¿En qué frecuencia está centrada la señal E1 de Galileo?", "opts": ["1176,45 MHz", "1207,14 MHz", "1278,75 MHz", "1575,42 MHz"], "ans": 3, "why": "La E1 está centrada en 1575,42 MHz, la misma frecuencia que la L1 del GPS, lo que permite receptores de frecuencia combinada.", "src": "Galileo OS SDD v1.3", "note": ""}, {"n": 10, "stem": "¿Qué pareja asocia correctamente una frecuencia del servicio abierto de Galileo con su señal?", "opts": ["E5a - 1278,75 MHz", "E5b - 1176,45 MHz", "E6 - 1278,75 MHz", "E1 - 1207,14 MHz"], "ans": 2, "why": "La E6 está centrada en 1278,75 MHz; la E5a está en 1176,45 MHz y la E5b en 1207,14 MHz (multiplexadas en 1191,795 MHz); la E1 está en 1575,42 MHz.", "src": "Galileo OS SDD v1.3", "note": ""}, {"n": 11, "stem": "Según el Documento de Definición del Servicio de Seguridad de la Vida (SoL SDD) de EGNOS, ¿qué exactitud horizontal (95 %) ofrece EGNOS para APV-I y LPV-200?", "opts": ["200 m", "16,0 m", "3 m", "0,3 NM"], "ans": 2, "why": "La Tabla 8 del EGNOS SoL SDD indica que la exactitud horizontal que EGNOS ofrece realmente para APV-I y LPV-200 es de 3 m al 95 %, muy por dentro del requisito mínimo de la OACI de 16,0 m de la Tabla 7.", "src": "EGNOS SoL SDD, Issue 3.6, Table 8", "note": ""}, {"n": 12, "stem": "¿Qué exactitud vertical (95 %) garantiza EGNOS en las operaciones APV-I y LPV-200?", "opts": ["4 m", "6-20 m", "20 m", "50 m"], "ans": 0, "why": "La Tabla 8 indica una exactitud vertical de 4 m al 95 % para APV-I y LPV-200, más estricta que el límite de 20 m que exige la OACI para APV-I en la Tabla 7.", "src": "EGNOS SoL SDD, Issue 3.6, Table 8", "note": ""}, {"n": 13, "stem": "¿Qué disponibilidad garantiza EGNOS para el servicio APV-I y LPV-200?", "opts": ["0,999 en toda la CEAC", "0,90 a escala mundial", "0,99 en la mayor parte de las zonas terrestres de la CEAC", "1,0 sin excepciones"], "ans": 2, "why": "La Tabla 8 indica una disponibilidad de 0,99 en la mayor parte de las zonas terrestres de la CEAC para APV-I y LPV-200 (el NPA alcanza la mayor, 0,999, en toda la CEAC).", "src": "EGNOS SoL SDD, Issue 3.6, Table 8", "note": ""}, {"n": 14, "stem": "En el LPV-200, ¿cuál es la probabilidad máxima admitida de un error del sistema de navegación vertical (VNSE) superior a 10 m, en condiciones nominales?", "opts": ["Menos de 10^-3 por aproximación", "Menos de 10^-5 por aproximación", "Menos de 10^-7 por aproximación", "Menos de 10^-9 por aproximación"], "ans": 2, "why": "El EGNOS SoL SDD establece expresamente este requisito adicional del LPV-200: la probabilidad de un VNSE &gt; 10 m debe ser inferior a 10^-7 por aproximación en condiciones nominales (e inferior a 10^-5 por aproximación para un VNSE &gt; 15 m en condiciones degradadas).", "src": "EGNOS SoL SDD, Issue 3.6", "note": ""}, {"n": 15, "stem": "¿Cuándo se declaró por primera vez el servicio de seguridad de la vida (SoL) de EGNOS para la aviación, con los niveles de servicio NPA y APV-I?", "opts": ["Octubre de 2009", "Diciembre de 2016", "Julio de 2005", "Marzo de 2011"], "ans": 3, "why": "El EGNOS SoL SDD v1.0, que declaraba el NPA y el APV-I, es de marzo de 2011; el LPV-200 se añadió más tarde como nivel de servicio adicional.", "src": "EGNOS SoL SDD, Issue 3.6", "note": ""}, {"n": 16, "stem": "¿Qué elementos GNSS enumera el AIP de España (ENR 4.3) en «Sistema mundial de navegación por satélite»?", "opts": ["GPS, GLONASS y Galileo", "Solo EGNOS y GPS", "Solo Galileo y EGNOS", "GPS, EGNOS, Galileo y BeiDou"], "ans": 1, "why": "El AIP España ENR 4.3 enumera únicamente EGNOS (operador ESSP, autoridad de operación EASA) y GPS (operador: Gobierno de los Estados Unidos), ambos en L1, como elementos GNSS reconocidos para el espacio aéreo español.", "src": "AIP España ENR 4.3", "note": ""}, {"n": 17, "stem": "¿Qué frecuencia y canal usa la estación DVOR/DME de ALBACETE VAB, según el AIP España ENR 4.1 vigente?", "opts": ["115,80 MHz, canal 105X", "114,65 MHz, canal 93Y", "112,40 MHz, canal 71X", "111,40 MHz, canal 88X"], "ans": 0, "why": "El ENR 4.1 enumera el DVOR/DME de ALBACETE VAB en 115,80 MHz, canal 105X, coemplazado con un TACAN militar (TAB) en el canal 17X.", "src": "AIP España ENR 4.1", "note": ""}, {"n": 18, "stem": "La estación de Alcantarilla (TRL) en la tabla de radioayudas en ruta del AIP de España es:", "opts": ["Un VOR/DME civil", "Un DVOR coemplazado con un NDB", "Una estación militar solo TACAN, sin VOR coemplazado", "Un localizador ILS"], "ans": 2, "why": "El ENR 4.1 enumera Alcantarilla TRL como un TACAN militar en el canal 113X sin VOR en el mismo emplazamiento, a diferencia de Albacete, que combina su TACAN con un DVOR/DME civil.", "src": "AIP España ENR 4.1", "note": ""}, {"n": 19, "stem": "Según el AIP España GEN 3.4, ¿cuál de los siguientes NO figura entre los tipos de radioayudas a la navegación que España indica como disponibles?", "opts": ["TACAN", "GBAS", "MLS", "VDF (estación radiogoniométrica VHF)"], "ans": 2, "why": "La lista del GEN 3.4 es PAR, NDB, VDF, ILS, VOR, DME, TACAN y GBAS; el MLS no aparece.", "src": "AIP España GEN 3.4", "note": ""}, {"n": 20, "stem": "¿Qué entidad figura como autoridad responsable de las comunicaciones aeronáuticas en España, según el AIP GEN 3.4?", "opts": ["AESA", "EUROCONTROL", "EASA", "ENAIRE"], "ans": 3, "why": "El GEN 3.4 nombra a ENAIRE como autoridad responsable de las comunicaciones en España, a través de su División de Comunicaciones.", "src": "AIP España GEN 3.4", "note": ""}, {"n": 21, "stem": "¿Qué aeropuerto español tiene una estación GBAS operativa que da soporte a tráfico comercial regular, según las preguntas frecuentes de la FAA sobre GBAS?", "opts": ["Madrid-Barajas", "Barcelona-El Prat", "Málaga", "Valencia"], "ans": 2, "why": "Las preguntas frecuentes de la FAA sobre GBAS citan Málaga (España), junto con Bremen y Fráncfort (Alemania), Sídney (Australia) y Zúrich (Suiza), como emplazamientos GBAS operativos con tráfico comercial.", "src": "FAA GBAS FAQ, TC16-0005", "note": ""}, {"n": 22, "stem": "¿Qué soporta el GAST-C, un tipo de servicio de aproximación GBAS (<em>GBAS Approach Service Type</em>)?", "opts": ["Los mínimos de aproximación de precisión de categoría I", "Solo los mínimos de categoría II", "Los mínimos de categoría III", "Solo aproximaciones de no precisión"], "ans": 0, "why": "El GAST-C define requisitos basados en la aumentación monofrecuencia que soporta los mínimos de categoría I; el GAST-D está previsto para hasta la categoría III.", "src": "FAA GBAS FAQ, TC16-0005", "note": ""}, {"n": 23, "stem": "¿Cuántos procedimientos de aproximación individuales puede soportar una única asignación VHF de GBAS, según las preguntas frecuentes de la FAA sobre GBAS?", "opts": ["Hasta 4", "Hasta 12", "Hasta 48", "Ilimitados"], "ans": 2, "why": "A diferencia del ILS, que necesita una frecuencia por sistema, una única asignación VHF de GBAS puede soportar hasta 48 procedimientos de aproximación individuales.", "src": "FAA GBAS FAQ, TC16-0005", "note": ""}, {"n": 24, "stem": "¿Qué es el GLS, según la definición de las preguntas frecuentes de la FAA sobre GBAS?", "opts": ["Un sinónimo del propio GBAS", "El nombre del procedimiento de aproximación por instrumentos o capacidad que proporciona el GBAS", "Otro nombre del GPS", "Un tipo de aproximación solo SBAS"], "ans": 1, "why": "GBAS es el nombre del sistema de navegación; GLS (<em>GBAS Landing System</em>) es el nombre asignado al procedimiento de aproximación por instrumentos o capacidad que proporciona el GBAS, y figura en la carta de aproximación.", "src": "FAA GBAS FAQ, TC16-0005", "note": ""}, {"n": 25, "stem": "¿Cómo llegan las correcciones GBAS a la aeronave, en comparación con las correcciones SBAS/WAAS?", "opts": ["El GBAS usa la radiodifusión de datos en VHF (VDB); el SBAS/WAAS usa un satélite geoestacionario en L1", "Ambos usan un satélite geoestacionario en L1", "El GBAS usa un satélite geoestacionario; el SBAS usa VHF", "Ambos usan enlaces terrestres en UHF"], "ans": 0, "why": "Las correcciones SBAS/WAAS proceden de estaciones de referencia muy separadas y se retransmiten mediante un satélite geoestacionario en la frecuencia L1 del GPS; el GBAS calcula las correcciones localmente en el aeropuerto y las radiodifunde por VHF (VDB).", "src": "FAA GBAS FAQ, TC16-0005", "note": ""}, {"n": 26, "stem": "¿Por qué se desarrolló el TACAN en lugar de usar el VOR/DME con fines militares?", "opts": ["El VOR/DME era demasiado caro", "El VOR/DME no podía medir distancias", "El VOR/DME aún no existía", "El VOR/DME (basado en la amplitud) se consideraba demasiado voluminoso o poco preciso para el uso militar y naval a bordo de buques"], "ans": 3, "why": "El AIM de la FAA explica que el sistema VOR/DME, basado en la amplitud, se consideró inadecuado para el uso militar y naval, lo que llevó a desarrollar el sistema TACAN, basado en impulsos y en UHF.", "src": "FAA AIM 1-1-5", "note": ""}, {"n": 27, "stem": "¿Qué tres servicios individuales proporciona un VORTAC desde un mismo emplazamiento?", "opts": ["Acimut VOR, distancia VOR y acimut TACAN", "Marcación NDB, acimut VOR y distancia DME", "Acimut VOR, acimut TACAN y distancia TACAN", "Acimut TACAN, distancia TACAN y senda de descenso ILS"], "ans": 2, "why": "Un VORTAC combina el VOR y el TACAN para dar el acimut VOR, el acimut TACAN y la distancia TACAN (que las aeronaves civiles utilizan como DME) desde un solo emplazamiento.", "src": "FAA AIM 1-1-5", "note": ""}, {"n": 28, "stem": "¿Por qué están «entrelazadas» las señales VOR y TACAN en un VORTAC?", "opts": ["Para ahorrar espectro de frecuencias", "Para que un piloto que combine el acimut VOR con la distancia TACAN tenga la garantía de que ambos proceden de la misma estación terrestre", "Para que cualquiera de los dos pueda fallar sin afectar al otro", "Solo para sincronizar la temporización de sus identificaciones en Morse"], "ans": 1, "why": "El AIM indica que el entrelazado garantiza que, cuando un piloto usa el acimut VOR con la distancia obtenida del TACAN, ambas señales proceden con certeza de la misma estación.", "src": "FAA AIM 1-1-5", "note": ""}, {"n": 29, "stem": "¿Qué significan las siglas RF en un tipo de tramo de un procedimiento PBN?", "opts": ["Radiofrecuencia (<em>Radio Frequency</em>)", "Punto de referencia (<em>Reference Fix</em>)", "Función requerida (<em>Required Function</em>)", "Radio hasta el punto de referencia (<em>Radius to Fix</em>)"], "ans": 3, "why": "El RF (<em>radius to fix</em>) es un tramo de trayectoria curva definido por un radio fijo, un punto de referencia y un centro, a diferencia de un tramo recto de ruta hasta el punto (<em>track to fix</em>).", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 30, "stem": "¿En qué edición del Manual PBN se introdujo por primera vez la funcionalidad de radio hasta el punto de referencia (RF) y dentro de qué especificación de navegación?", "opts": ["En la 4.ª edición, dentro de la RNP AR APCH", "En la 3.ª edición, dentro de la RNAV 1", "En la 5.ª edición, dentro de la RNP 4", "En la 1.ª edición, dentro de la A-RNP"], "ans": 0, "why": "La 4.ª edición del Manual PBN (2013) incluyó por primera vez la funcionalidad de trayectoria RF, inicialmente como capacidad dentro de la RNP AR APCH.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 31, "stem": "Según la 5.ª edición del Manual PBN y el Doc 8168 (PANS-OPS, Vol. II), ¿se limita el uso de tramos RF exclusivamente a la RNP AR APCH?", "opts": ["Sí, siempre", "No, se ha aclarado que el RF también puede usarse en especificaciones de navegación distintas de la RNP AR APCH", "Los tramos RF se han eliminado por completo del manual", "Los tramos RF se limitan ahora solo a la RNAV 5"], "ans": 1, "why": "La 5.ª edición y el Volumen II del Doc 8168 aclaran que el RF es una capacidad más amplia, utilizable en especificaciones distintas de la RNP AR APCH, y que su ubicación permitida depende de cada especificación.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 32, "stem": "¿Qué dos documentos complementan la especificación de navegación RNP AR APCH para implantar los procedimientos de salida (DP) RNP AR?", "opts": ["El Doc 9905 (diseño de procedimientos) y el Doc 8697 (Manual de cartas aeronáuticas)", "El Doc 4444 y el Doc 7030", "Solo el Doc 8168", "El Anexo 10 y el Anexo 11"], "ans": 0, "why": "Las salidas RNP AR se complementan con el Manual de diseño de procedimientos RNP AR (Doc 9905) y con los requisitos de cartografía del Manual de cartas aeronáuticas (Doc 8697).", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 33, "stem": "¿Qué nivel de autorización exigen la RNP AR APCH y las salidas RNP AR (RNP AR DP), en comparación con la mayoría de las demás operaciones PBN?", "opts": ["No se requiere autorización para ninguna operación PBN", "La misma aprobación general que las demás operaciones PBN", "Solo la autorización del fabricante de la aeronave", "Una aprobación específica, frente a una aprobación general en la mayoría de las demás operaciones PBN"], "ans": 3, "why": "La mayoría de las operaciones PBN solo necesitan una aprobación operacional general; la RNP AR APCH y las salidas RNP AR, por su mayor exigencia de precisión y sus márgenes de contención reducidos, requieren una aprobación específica.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 34, "stem": "¿Qué convención de denominación de puntos de recorrido usa el AIP España ENR 4.4 para los puntos significativos en ruta?", "opts": ["Códigos numéricos de cuatro dígitos", "Designadores pronunciables de cinco letras («nombre en clave»)", "Solo identificadores de estación de tres letras", "Coordenadas de latitud/longitud sin nombre"], "ans": 1, "why": "El ENR 4.4 enumera designadores pronunciables de cinco letras (convención de punto designado de OACI/AIXM), p. ej. ABOSI, ABRIX, ABUPI, ADINO.", "src": "AIP España ENR 4.4", "note": ""}, {"n": 35, "stem": "Históricamente, ¿a qué correspondía el término «B-RNAV» (RNAV básica) una vez adoptada la PBN en Europa?", "opts": ["Al precursor de la RNAV 5 en espacio aéreo en ruta", "Al precursor de la RNAV 1 en espacio aéreo terminal", "A un sinónimo de RNP AR APCH", "A una técnica de navegación visual"], "ans": 0, "why": "La B-RNAV era la especificación europea de navegación en ruta anterior a la PBN, que después se asimiló a la RNAV 5; la P-RNAV (RNAV de precisión) era su equivalente en espacio aéreo terminal, asimilada a la RNAV 1.", "src": "EUROCONTROL P-RNAV Safety Argument; correspondencia entre especificaciones PBN", "note": ""}, {"n": 36, "stem": "Según el documento de EUROCONTROL «Introducing PBN and A-RNP», ¿es la RNP escalable una función obligatoria u opcional dentro de la RNP avanzada (A-RNP)?", "opts": ["Obligatoria para todas las aeronaves certificadas A-RNP", "Obligatoria solo en operaciones oceánicas", "No existe dentro de la A-RNP", "Opcional, incluso dentro de la A-RNP"], "ans": 3, "why": "La guía indica que la RNP escalable sigue siendo una función opcional incluso dentro de la RNP avanzada; una aeronave certificada A-RNP no tiene garantizados automáticamente todos los valores escalables.", "src": "EUROCONTROL, Introducing PBN and A-RNP", "note": ""}, {"n": 37, "stem": "¿En qué dos secciones divide el Manual PBN las operaciones RNP APCH en el Volumen II, Parte C, Capítulo 5?", "opts": ["Sección A: mínimos LNAV/LNAV-VNAV; Sección B: mínimos LP/LPV", "Sección A: RNP AR; Sección B: RNP 1", "Sección A: oceánica; Sección B: continental", "Sección A: solo SBAS; Sección B: solo GBAS"], "ans": 0, "why": "La Sección A del Capítulo 5 abarca las operaciones RNP APCH hasta los mínimos LNAV y LNAV/VNAV; la Sección B, las operaciones hasta los mínimos LP y LPV, que requieren SBAS.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 38, "stem": "¿Cuál es la diferencia operacional clave entre los mínimos LP y LPV?", "opts": ["El LP requiere SBAS y da guiado vertical; el LPV no", "El LP se usa solo en alta mar; el LPV solo en tierra", "El LP es solo lateral (sin guiado vertical); el LPV añade guiado vertical derivado del SBAS", "Son idénticos y solo se diferencian en el nombre"], "ans": 2, "why": "Ambos se basan en SBAS, pero el LP proporciona solo guiado lateral (se usa cuando no se puede publicar una trayectoria vertical estabilizada, p. ej. por obstáculos), mientras que el LPV añade el guiado vertical del SBAS.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 39, "stem": "¿Hasta qué altura de decisión pueden llegar los mínimos LPV, comparable a la de un ILS de categoría I?", "opts": ["30 m (100 ft)", "60 m (200 ft)", "90 m (300 ft)", "15 m (50 ft)"], "ans": 1, "why": "Los mínimos LPV pueden llegar hasta una DH de 60 m (200 ft), según la geometría concreta del tramo de aproximación final y el nivel de servicio SBAS, equivalente a la altura de decisión de un ILS de categoría I.", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 40, "stem": "Según el texto consolidado del Reglamento de Ejecución (UE) 2018/1048 de la Comisión, ¿a partir de qué fecha se aplica el Reglamento con carácter general (antes de las excepciones para requisitos PBN concretos)?", "opts": ["1 de enero de 2016", "25 de enero de 2024", "6 de junio de 2030", "3 de diciembre de 2020"], "ans": 3, "why": "El artículo 7, apartado 2, establece que el Reglamento se aplica a partir del 3 de diciembre de 2020. Las fechas posteriores son excepciones: 25 de enero de 2024 (RNP APCH en los aeródromos indicados y en los extremos de pista de precisión; una SID/STAR; rutas ATS por debajo del FL150) y 6 de junio de 2030 (artículo 5; todas las rutas SID/STAR). (Corregido en la auditoría de la oleada 4: la clave anterior, «31 de diciembre de 2020», no figura en el Reglamento.)", "src": "(EU) 2018/1048, consolidated text", "note": ""}, {"n": 41, "stem": "Según el Reglamento (UE) 2018/1048, cuando aún no hay cobertura SBAS adecuada en un extremo de pista de instrumentos, ¿qué deben hacer los proveedores de ATM/ANS?", "opts": ["Implantar los mínimos LNAV y LNAV/VNAV y añadir el LPV en un plazo de 18 meses desde que haya cobertura SBAS", "No implantar nada hasta que haya cobertura SBAS", "Implantar únicamente la RNP AR APCH", "Esperar indefinidamente sin ninguna obligación"], "ans": 0, "why": "El Reglamento exige implantar en todo caso el LNAV y el LNAV/VNAV, y añadir el LPV a más tardar 18 meses después de que haya cobertura SBAS adecuada.", "src": "(EU) 2018/1048, consolidated text", "note": ""}, {"n": 42, "stem": "Según el Reglamento (UE) 2018/1048, ¿qué especificación de navegación deben usar las rutas ATS en el FL150 o por encima, cuando existan esas rutas en ruta?", "opts": ["RNAV 1", "RNAV 5", "RNP 4", "A-RNP"], "ans": 1, "why": "El punto (6) del Anexo exige que las rutas ATS en ruta que los proveedores hayan establecido se implanten conforme a la especificación RNAV 5; la excepción solo retrasa esta exigencia para las rutas por debajo del FL150 (25 de enero de 2024), por lo que en el FL150 o por encima se aplica desde el 3 de diciembre de 2020.", "src": "(EU) 2018/1048, consolidated text", "note": ""}, {"n": 43, "stem": "Según el Reglamento (UE) 2018/1048, ¿entre qué especificaciones de navegación puede elegir un ANSP para las rutas SID/STAR de aeronaves de ala giratoria?", "opts": ["RNAV 10, RNP 4, RNP 2", "RNP 0,3, RNAV 1 o RNP 1", "Solo RNP AR APCH", "Solo A-RNP"], "ans": 1, "why": "El punto (7) permite que el ANSP decida cuál de las especificaciones RNP 0,3, RNAV 1 o RNP 1 implanta para las rutas ATS, SID o STAR de aeronaves de ala giratoria.", "src": "(EU) 2018/1048, consolidated text", "note": ""}, {"n": 44, "stem": "Según el Instrument Procedures Handbook de la FAA, ¿qué intervalo de velocidad indicada define a las aeronaves de la categoría de aproximación B?", "opts": ["Menos de 91 nudos", "121 nudos o más, pero menos de 141 nudos", "141 nudos o más, pero menos de 166 nudos", "91 nudos o más, pero menos de 121 nudos"], "ans": 3, "why": "La categoría A es inferior a 91 kt, la B va de 91 a menos de 121 kt y la C, de 121 a menos de 141 kt.", "src": "FAA Instrument Procedures Handbook", "note": ""}, {"n": 45, "stem": "Si una aeronave de categoría B realiza una aproximación en circuito (<em>circling</em>) a 145 nudos de IAS, ¿los mínimos de qué categoría debe usar el piloto?", "opts": ["Los mínimos de categoría B (la categoría normal de la aeronave)", "Los mínimos de categoría A", "Los mínimos de categoría D, que corresponden a la velocidad realmente volada", "No se aplican mínimos por encima de 140 nudos"], "ans": 2, "why": "Los mínimos de circuito se basan en la velocidad de la categoría de aproximación realmente volada, no en la categoría nominal de la aeronave; 145 kt cae en el intervalo de velocidad de la categoría D, por lo que deben usarse los mínimos de categoría D.", "src": "FAA Instrument Procedures Handbook", "note": ""}, {"n": 46, "stem": "¿Entre qué niveles de vuelo se aplica la RVSM (separación vertical mínima reducida)?", "opts": ["FL180 a FL290", "FL100 a FL290", "FL290 a FL410", "FL410 a FL600"], "ans": 2, "why": "El espacio aéreo RVSM abarca del FL290 al FL410, donde las aeronaves que cumplen los requisitos pueden separarse verticalmente 1000 ft en lugar de los 2000 ft que se usan por encima del FL410 o para las aeronaves que no los cumplen.", "src": "FAA Instrument Procedures Handbook", "note": ""}, {"n": 47, "stem": "¿Qué separación vertical se aplica entre aeronaves con aprobación RVSM dentro de la banda RVSM?", "opts": ["1000 pies", "500 pies", "1500 pies", "2000 pies"], "ans": 0, "why": "Las aeronaves con aprobación RVSM entre el FL290 y el FL410 se separan 1000 ft, el mismo mínimo que se usa por debajo del FL290; las aeronaves sin aprobación en el FL290 o por encima usan 2000 ft.", "src": "FAA Instrument Procedures Handbook", "note": ""}, {"n": 48, "stem": "¿Qué mide un radioaltímetro, a diferencia de un altímetro barométrico?", "opts": ["La altura sobre el nivel medio del mar", "Solo la altitud de presión", "La velocidad verdadera", "La altura sobre el terreno situado justo debajo de la aeronave"], "ans": 3, "why": "Un radioaltímetro envía una señal al suelo y mide el tiempo de retorno para calcular la altura de la aeronave sobre el terreno situado justo debajo, a diferencia de un altímetro barométrico, que se refiere a un plano de presión.", "src": "FAA Instrument Flying Handbook", "note": ""}, {"n": 49, "stem": "¿Qué sistema de seguridad combina la altura del radioaltímetro con la velocidad y otros parámetros para avisar de una aproximación peligrosa al terreno?", "opts": ["TCAS", "GPWS", "STCA", "MSAW (en tierra)"], "ans": 1, "why": "El GPWS (<em>Ground Proximity Warning System</em>) usa la altura del radioaltímetro junto con la velocidad y otros parámetros de vuelo para generar avisos acústicos y visuales de aproximación al terreno.", "src": "FAA Instrument Flying Handbook", "note": ""}, {"n": 50, "stem": "¿Quién concibió por primera vez, a mediados de los años setenta, el concepto de «Master Navigation System» que evolucionó hasta el FMS actual?", "opts": ["Ed King Jr.", "Hubert Naimer, de Universal Avionics", "El Centro Técnico de la FAA", "La división de ensayos en vuelo de Boeing"], "ans": 1, "why": "Hubert Naimer, de Universal Avionics, concibió la fusión de todos los sensores de navegación de a bordo en una única «mejor posición calculada» (<em>Best Computed Position</em>), controlada mediante una sola unidad de control y visualización (CDU).", "src": "FAA Instrument Flying Handbook", "note": ""}, {"n": 51, "stem": "¿Cuál fue el primer sistema que recibió realmente el nombre de «sistema de gestión de vuelo (FMS)» y en qué año salió al mercado?", "opts": ["El FMC de Boeing, 1978", "El Universal UNS-1, 1982", "El Honeywell Pegasus, 1990", "El Collins Proline, 1985"], "ans": 1, "why": "Universal Avionics lanzó el UNS-1 en 1982; fue el primer sistema que se denominó realmente «sistema de gestión de vuelo».", "src": "FAA Instrument Flying Handbook", "note": ""}, {"n": 52, "stem": "¿Cómo puede un FMS moderno calcular una posición casi tan precisa como la del GPS, incluso sin señal de satélite?", "opts": ["Solo por navegación a estima, sin sensores de radio", "Solicitando la posición al ATC por enlace de datos", "Basándose únicamente en las entradas manuales del piloto", "Interrogando automáticamente a varias estaciones DME de su base de datos de navegación y combinando las distancias"], "ans": 3, "why": "El FMS selecciona los emplazamientos DME adecuados de la base de datos de navegación según la posición estimada de la aeronave, compensa la altitud y combina varias distancias DME para calcular una posición casi tan precisa como la del GPS.", "src": "FAA Instrument Flying Handbook", "note": ""}, {"n": 53, "stem": "En términos de error total del sistema (TSE), ¿cómo trata normalmente el Doc 9613 el error de definición de trayectoria (PDE)?", "opts": ["Como la fuente de error dominante", "Como despreciable", "Como igual en magnitud al NSE", "Como relevante solo para la navegación oceánica"], "ans": 1, "why": "El Doc 9613 trata el PDE como despreciable en las trayectorias RNAV/RNP codificadas en la base de datos, de modo que el TSE depende en la práctica del NSE (error del sistema de navegación) y del FTE (error técnico de vuelo).", "src": "ICAO Doc 9613 PBN Manual, 5th ed.", "note": ""}, {"n": 54, "stem": "Al convertir a metros el requisito de precisión lateral de la aproximación final de la RNP APCH, RNP 0,3 (0,3 NM), se obtiene aproximadamente:", "opts": ["300 m", "926 m", "556 m", "1852 m"], "ans": 2, "why": "0,3 NM x 1852 m/NM = 555,6 m, unos 556 m, la misma cifra que el EGNOS SoL SDD indica como límite de alerta horizontal para las operaciones de aproximación NPA/inicial/intermedia y de salida.", "src": "cálculo, contrastado con EGNOS SoL SDD Table 7", "note": ""}, {"n": 55, "stem": "¿Están incluidos los errores del modelo de retardo ionosférico monofrecuencia en la norma básica de precisión GPS SPS SIS URE (la cifra de 7,0 m al 95 %)?", "opts": ["Sí, totalmente incluidos", "No, se excluyen expresamente y se tratan con un modelo de corrección difundido aparte", "Solo para los usuarios de L2", "Solo durante operaciones prolongadas"], "ans": 1, "why": "El GPS SPS PS afirma expresamente que los errores del modelo de retardo ionosférico monofrecuencia (SF) quedan excluidos de la norma SPS SIS URE, aunque los parámetros de corrección ionosférica formen parte de la señal difundida; se corrigen por separado.", "src": "GPS SPS Performance Standard, 5th ed.", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/05-navegacion-sistemas/ampliacion/T05a-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
