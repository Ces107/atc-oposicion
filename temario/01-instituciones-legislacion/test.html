*{box-sizing:border-box}html{scroll-behavior:smooth}

@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}

}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}

nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
@media (max-width:640px){.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:.5rem;white-space:nowrap;font-size:13px}.bar::-webkit-scrollbar{display:none}.bar>*{flex:0 0 auto}.bar button{padding:6px 9px}.bar #score{margin-right:.2rem}}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}

@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}

.figs span{display:block;color:var(--mut);font:.8rem/1.3 var(--sans)}

tuciones y legislación aeronáutica</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "A la Conferencia de Chicago de 1944 asistieron representantes de un determinado número de países. ¿Cuántos asistieron y cuántos habían firmado el Convenio el día de la clausura?", "opts": ["Asistieron 52 y firmaron 54", "Asistieron 54 y firmaron todos", "Asistieron 48 y firmaron 44", "Asistieron 54 y firmaron 52"], "ans": 3, "why": "Se reunieron 54 países entre el 1 de noviembre y el 7 de diciembre de 1944, y el día de la clausura habían firmado 52. La opción A invierte las cifras.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, pp. 5-6", "note": ""}, {"n": 2, "stem": "¿En qué fecha pasó oficialmente la OACIP (PICAO) a ser la OACI?", "opts": ["El 7 de diciembre de 1944", "El 21 de febrero de 1947", "El 1 de noviembre de 1944", "El 4 de abril de 1947"], "ans": 3, "why": "Al obtenerse las ratificaciones necesarias el 4 de abril de 1947, los aspectos provisionales de la PICAO decayeron y pasó a denominarse OACI. El 7 de diciembre de 1944 es la fecha del Convenio y el 21 de febrero de 1947, la de ratificación que recoge la tabla de acuerdos multilaterales de 4.2.1.", "src": "Manual 1 (nov. 2026), capítulos 2.1.2, p. 6, y 4.2.1, p. 35", "note": ""}, {"n": 3, "stem": "¿Dónde y cuándo se celebró la primera Asamblea oficial de la OACI?", "opts": ["Chicago, diciembre de 1944", "París, 1950", "Montreal, mayo de 1947", "Washington, abril de 1947"], "ans": 2, "why": "El manual indica que la primera Asamblea oficial tuvo lugar en Montreal en mayo de 1947.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 6", "note": ""}, {"n": 4, "stem": "¿Cuál de los siguientes NO es uno de los cinco objetivos estratégicos de la OACI que recoge el manual?", "opts": ["Protección del medio ambiente", "Seguridad y facilitación", "Capacidad y eficiencia de la navegación aérea", "Armonización de las tarifas aéreas"], "ans": 3, "why": "Los cinco son seguridad operacional, capacidad y eficiencia de la navegación aérea, seguridad y facilitación, desarrollo económico del transporte aéreo y protección del medio ambiente. La armonización de tarifas no figura entre ellos.", "src": "Manual 1 (nov. 2026), capítulo 2.1.4, p. 7", "note": ""}, {"n": 5, "stem": "Según el manual, ¿con qué frecuencia se reúne la Asamblea de la OACI?", "opts": ["Todos los años", "Cada dos años, alternando con el Consejo", "Cada cinco años", "Al menos una vez cada tres años"], "ans": 3, "why": "La Asamblea se reúne al menos una vez cada tres años, convocada por el Consejo.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 6, "stem": "¿Cuántos Estados componen el Consejo de la OACI y por cuánto tiempo son elegidos?", "opts": ["19 Estados, cuatro años", "27 Estados, cinco años", "36 Estados, tres años", "193 Estados, tres años"], "ans": 2, "why": "El Consejo está integrado por representantes de 36 Estados contratantes elegidos por la Asamblea para un mandato de tres años. El 19 es el número de Anexos y el 193, el de Estados miembros.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 7, "stem": "¿Qué órgano de la OACI oficia de árbitro entre los Estados Miembros en la aplicación del Convenio?", "opts": ["La Asamblea", "La Secretaría", "La Oficina de navegación aérea", "El Consejo"], "ans": 3, "why": "Oficiar de árbitro entre los Estados Miembros es una de las cinco funciones principales del Consejo.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 8, "stem": "¿Cuántas oficinas tiene la Secretaría de la OACI?", "opts": ["Tres", "Nueve", "Siete", "Cinco"], "ans": 3, "why": "Oficina de navegación aérea, de transporte aéreo, de desarrollo de capacidades e implementación, de asuntos jurídicos y relaciones externas, y de administración y servicios. Siete es el número de oficinas regionales y nueve, el de regiones.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 8", "note": ""}, {"n": 9, "stem": "¿Dónde está la Oficina de la OACI para Europa y el Atlántico Norte?", "opts": ["Bruselas", "Montreal", "El Cairo", "París"], "ans": 3, "why": "Las regiones EUR y NAT dependen de la oficina de París (Francia).", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 10, "stem": "¿Qué ciudad alberga la oficina de la OACI que abarca las regiones de Norteamérica, Centroamérica y el Caribe?", "opts": ["Ciudad de México", "Lima", "Nairobi", "Bangkok"], "ans": 0, "why": "Las regiones NAM y CAR se dirigen desde Ciudad de México. Lima atiende Sudamérica, Nairobi el África oriental y meridional, y Bangkok Asia y el Pacífico.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 11, "stem": "La OACI organiza la navegación aérea en un número determinado de regiones, dirigidas a través de un número determinado de oficinas. ¿Cuáles son?", "opts": ["Siete regiones, nueve oficinas", "Cinco regiones, siete oficinas", "Nueve regiones, nueve oficinas", "Nueve regiones, siete oficinas"], "ans": 3, "why": "El manual establece nueve regiones dirigidas a través de siete oficinas.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 12, "stem": "Según el manual, el Anexo 5 de la OACI trata de:", "opts": ["Las cartas aeronáuticas", "La facilitación", "Las marcas de nacionalidad y matrícula de las aeronaves", "Las unidades de medida que se emplearán en las operaciones aéreas y terrestres"], "ans": 3, "why": "El Anexo 4 son las cartas, el Anexo 7 las marcas y el Anexo 9 la facilitación.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 13, "stem": "¿Qué Anexo de la OACI trata de la búsqueda y salvamento?", "opts": ["Anexo 11", "Anexo 15", "Anexo 13", "Anexo 12"], "ans": 3, "why": "El Anexo 12 es búsqueda y salvamento. El 11 son los servicios de tránsito aéreo, el 13 la investigación de accidentes e incidentes de aviación y el 15 los servicios de información aeronáutica.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 14, "stem": "¿Qué Anexo de la OACI se titula «Operación de aeronaves»?", "opts": ["Anexo 6", "Anexo 8", "Anexo 10", "Anexo 14"], "ans": 0, "why": "El Anexo 8 es Aeronavegabilidad, el 10 Telecomunicaciones aeronáuticas y el 14 Aeródromos.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 15, "stem": "¿Qué Anexo de la OACI trata del transporte sin riesgos de mercancías peligrosas por vía aérea?", "opts": ["Anexo 16", "Anexo 17", "Anexo 19", "Anexo 18"], "ans": 3, "why": "El Anexo 16 es protección del medio ambiente, el 17 seguridad (protección contra actos de interferencia ilícita) y el 19 gestión de la seguridad operacional.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 16, "stem": "Según la tabla «Anexo / manual que lo desarrolla», ¿qué documento desarrolla el Anexo 2 (Reglamento del aire)?", "opts": ["Doc. 8168", "Doc. 9750", "Doc. 8697", "Doc. 4444"], "ans": 3, "why": "En la tabla, el Anexo 2 lo desarrollan dos manuales: el Doc. 4444 (Gestión del Tránsito Aéreo) y el Doc. 7030 (Procedimientos suplementarios regionales). El Doc. 8697 (Manual de cartas aeronáuticas) desarrolla el Anexo 4, el 8168 es PANS-OPS y el 9750, el GANP.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 10", "note": ""}, {"n": 17, "stem": "El Plan Mundial de Navegación Aérea (GANP) se publica como:", "opts": ["Doc. 9750 de la OACI", "Doc. 8126 de la OACI", "Circular 247 de la OACI", "Doc. 8697 de la OACI"], "ans": 0, "why": "Es el Doc. 9750, que abarca el periodo 2016-2030. El Doc. 8126 es el manual AIS y el Doc. 8697, el manual de cartas aeronáuticas.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 18, "stem": "La Circular 247 de la OACI trata de:", "opts": ["Las operaciones simultáneas en pistas paralelas", "El Reglamento del aire", "Los aspectos económicos de la navegación por satélite", "Los factores humanos, la gestión y la organización"], "ans": 3, "why": "La Circular 207 trata de SOIR y la 257, de los aspectos económicos de la navegación por satélite.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.3, p. 11", "note": ""}, {"n": 19, "stem": "El Volumen II de los PANS-OPS (Doc. 8168) está destinado a:", "opts": ["Los controladores de tránsito aéreo que aplican las separaciones", "Los especialistas en procedimientos que diseñan procedimientos de vuelo visuales e instrumentales", "Las oficinas meteorológicas", "Los gestores de aeropuertos que certifican aeródromos"], "ans": 1, "why": "El Volumen II (Construcción de procedimientos de vuelo visual y por instrumentos) sirve de guía a los especialistas en procedimientos; el Volumen I se dirige al personal de operaciones de vuelo.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 20, "stem": "¿Cuántos Estados Miembros tiene EUROCONTROL y qué dos Estados tienen un Acuerdo Global?", "opts": ["42; Israel y Marruecos", "44; Israel y Egipto", "27; Marruecos y Túnez", "42; Israel y Turquía"], "ans": 0, "why": "El manual habla de 42 Estados Miembros más 2 Estados del Acuerdo Global, Israel y Marruecos.", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 21, "stem": "Según el manual, ¿desde cuándo es España miembro de EUROCONTROL?", "opts": ["1960", "1986", "1997", "2002"], "ans": 2, "why": "1960 es la creación de EUROCONTROL, 1986 la adhesión de España a la UE y 2002 la firma del protocolo de adhesión de la UE al Convenio Revisado.", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 22, "stem": "El órgano de decisión más alto de EUROCONTROL, compuesto por representantes a nivel ministerial, es:", "opts": ["El Consejo Provisional", "La Comisión Permanente", "La Agencia", "La Comisión de evaluación de resultados (PRC)"], "ans": 1, "why": "La Comisión Permanente nombra al Director General y aprueba el presupuesto anual y el programa de cinco años. El Consejo Provisional está formado por Directores Generales de Aviación Civil.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 12", "note": ""}, {"n": 23, "stem": "¿Qué órgano de EUROCONTROL está formado por representantes a nivel de Directores Generales de Aviación Civil?", "opts": ["La Comisión Permanente", "La Junta de los Servicios de Navegación Aérea (ANSB)", "El Consejo Provisional", "La Junta de la Gestión de Tráfico Aéreo Militar (MAB)"], "ans": 2, "why": "El Consejo Provisional aplica la política general fijada por la Comisión Permanente y supervisa el trabajo de la Agencia.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, pp. 12-13", "note": ""}, {"n": 24, "stem": "¿Cuál de los siguientes NO es un componente de la Agencia ejecutiva de EUROCONTROL?", "opts": ["La Dirección del Gestor de Red (Network Manager Directorate)", "La Dirección de la Oficina Central de Tasas de Ruta", "El Centro de Control de Área Superior de Maastricht", "La Comisión de Regulación de seguridad (SRC)"], "ans": 3, "why": "La SRC forma parte de la estructura consultiva, no de la Agencia.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 25, "stem": "Las normas ESARR son adoptadas por el/la:", "opts": ["Director General de la Agencia, sin aprobación posterior", "Consejo Provisional y aprobadas por la Comisión de EUROCONTROL", "Comisión de evaluación de resultados y aprobadas por el Consejo de la UE", "Comisión de Cuentas y aprobadas por la OACI"], "ans": 1, "why": "Son adoptadas por el Consejo Provisional, aprobadas por la Comisión y luego incorporadas por los Estados miembros a sus regulaciones internas.", "src": "Manual 1 (nov. 2026), capítulo 2.2.5, p. 13", "note": ""}, {"n": 26, "stem": "¿Qué ESARR trata de la «supervisión de la seguridad operacional en ATM» (<em>Safety Oversight in ATM</em>)?", "opts": ["ESARR 1", "ESARR 2", "ESARR 4", "ESARR 6"], "ans": 0, "why": "La ESARR 2 trata de la notificación y evaluación de sucesos, la 4 de la evaluación y mitigación del riesgo y la 6 del software.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 14", "note": ""}, {"n": 27, "stem": "¿Cuántas ESARR se han aprobado?", "opts": ["Cuatro", "Cinco", "Ocho", "Seis"], "ans": 3, "why": "De la ESARR 1 a la ESARR 6, que se han ido integrando en Reglamentos, Directivas y Leyes.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 14", "note": ""}, {"n": 28, "stem": "El EAD (Base de Datos AIS Europea) proporciona una fuente única de referencia de:", "opts": ["Predicciones meteorológicas", "Datos de NOTAM y de AIP", "Planes de vuelo", "Trazas radar"], "ans": 1, "why": "También permite generar boletines de información previa al vuelo (PIB).", "src": "Manual 1 (nov. 2026), capítulo 2.2.7, p. 14", "note": ""}, {"n": 29, "stem": "El MUAC presta servicios en el espacio aéreo superior de:", "opts": ["Francia, España y Portugal", "Bélgica, Luxemburgo, los Países Bajos y el noroeste de Alemania", "Suiza, Austria e Italia", "Dinamarca, Suecia y Noruega"], "ans": 1, "why": "Así lo indica el manual para el centro de control de EUROCONTROL en Maastricht.", "src": "Manual 1 (nov. 2026), capítulo 2.2.8, p. 14", "note": ""}, {"n": 30, "stem": "¿En qué grupos consultivos de EUROCONTROL participa ENAIRE?", "opts": ["PRC y SRC", "SCF y MAB", "ANSB y AAB", "ESAC y CMSC"], "ans": 2, "why": "ENAIRE participa en la Junta de los Servicios de Navegación Aérea (ANSB) y en el Órgano Asesor de la Agencia (AAB), en este último como Proveedor de Servicios de Navegación Aérea.", "src": "Manual 1 (nov. 2026), capítulo 2.2.10, pp. 14-15", "note": ""}, {"n": 31, "stem": "Según el manual, ¿cuántos Estados miembros tiene la UE y desde cuándo pertenece España?", "opts": ["27; 1 de enero de 1986", "28; 1 de enero de 1986", "27; 1 de enero de 1999", "25; 1 de enero de 1957"], "ans": 0, "why": "Lo indica el apartado 2.3.1.", "src": "Manual 1 (nov. 2026), capítulo 2.3.1, p. 15", "note": ""}, {"n": 32, "stem": "Según el manual, ¿cuántos miembros tiene el Parlamento Europeo?", "opts": ["705", "751", "720", "27"], "ans": 2, "why": "El manual habla de 720 eurodiputados.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 33, "stem": "¿Qué institución de la UE está formada por los Jefes de Estado o de Gobierno, el Presidente de la Comisión y el Alto Representante?", "opts": ["El Consejo de la Unión Europea", "El Consejo Europeo", "El Parlamento Europeo", "El Tribunal de Justicia"], "ans": 1, "why": "El Consejo Europeo define la orientación y las prioridades políticas generales; el Consejo de la UE está formado por ministros.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 34, "stem": "¿Qué órgano de la UE garantiza que el Derecho de la UE se interprete y se aplique de la misma manera en todos los Estados miembros?", "opts": ["El Tribunal de Justicia de la UE (TJUE)", "El Tribunal de Cuentas Europeo", "La Comisión Europea", "El Defensor del Pueblo Europeo"], "ans": 0, "why": "El TJUE también garantiza que los países miembros y las instituciones europeas cumplan la legislación de la UE.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 35, "stem": "¿En qué año propuso la Comisión Europea el Cielo Único Europeo?", "opts": ["1999", "2004", "2009", "2014"], "ans": 0, "why": "Se propuso en 1999; los cuatro reglamentos entraron en vigor en abril de 2004.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.1, p. 19", "note": ""}, {"n": 36, "stem": "¿Cuál de estos fue uno de los objetivos clave iniciales del Cielo Único Europeo (SES)?", "opts": ["Crear una única compañía aérea europea de servicios regulares", "Reestructurar el espacio aéreo europeo en función de los flujos de tráfico", "Fusionar todos los proveedores de navegación aérea en uno solo", "Suprimir el espacio aéreo reservado al uso militar en Europa"], "ans": 1, "why": "El manual dice «reestructurar el espacio aéreo europeo en función de los flujos de tráfico aéreo, sin perjuicio de las fronteras nacionales». Los otros eran generar capacidad adicional para atender a la demanda futura y aumentar la eficiencia global del sistema europeo de gestión de tránsito aéreo.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.1, p. 19", "note": ""}, {"n": 37, "stem": "¿Qué reglamentos cita el manual como los vigentes que sustituyen a los reglamentos SES originales?", "opts": ["549/2004 y 550/2004", "216/2008 y 2015/340", "2018/1139 y 2024/2803", "923/2012 y 996/2010"], "ans": 2, "why": "El Reglamento UE 2018/1139 (normas comunes y Agencia de la Unión Europea para la Seguridad Aérea) y el 2024/2803 (relativo a la realización del Cielo Único Europeo).", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.1, p. 19", "note": ""}, {"n": 38, "stem": "¿Qué autoridad designó España como Autoridad Nacional de Supervisión de los servicios de navegación aérea civil?", "opts": ["La DGAC", "ENAIRE", "AESA", "La CIAIAC"], "ans": 2, "why": "AESA, para los servicios civiles de navegación excluyendo los servicios meteorológicos.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 19", "note": ""}, {"n": 39, "stem": "¿Quién asume la función de regulador comunitario en el SES?", "opts": ["EASA", "EUROCONTROL", "El Comité del Cielo Único", "La Comisión Europea"], "ans": 3, "why": "El manual dice que esta función la asume la Comisión Europea.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 20", "note": ""}, {"n": 40, "stem": "La fase de despliegue de SESAR se inició formalmente en:", "opts": ["2004", "2007", "2014", "2018"], "ans": 2, "why": "En 2014, año en que la Comisión Europea publicó el Proyecto Común Piloto.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, p. 21", "note": ""}, {"n": 41, "stem": "Según el manual, ¿desde qué mes y año está operativo el NMOC?", "opts": ["Abril de 2004", "Marzo de 1996", "Diciembre de 2014", "Enero de 2018"], "ans": 1, "why": "El programa NMOC comenzó a estar operativo en marzo de 1996.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 42, "stem": "¿En el marco de qué legislación se creó el Gestor de Red Europeo?", "opts": ["SES I", "SES II", "El Reglamento 2018/1139", "El Convenio de Chicago"], "ans": 1, "why": "El manual dice «dentro de la legislación del SES II».", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.5, p. 21", "note": ""}, {"n": 43, "stem": "¿Cuál de las siguientes es una función del Gestor de Red?", "opts": ["Certificar a los controladores de tránsito aéreo", "Coordinar la mejora del proceso de atribución de códigos de transpondedor SSR", "Investigar accidentes", "Fijar las tasas aeroportuarias en España"], "ans": 1, "why": "También desempeña la función central de coordinación de las radiofrecuencias y elabora el diseño integrado de la red europea de rutas.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.5, p. 21", "note": ""}, {"n": 44, "stem": "La Alianza de Despliegue de SESAR (SDA) fue designada por la Comisión en:", "opts": ["Diciembre de 2014", "Marzo de 1996", "Enero de 2018", "2002"], "ans": 0, "why": "El Consorcio SDA evoluciona a Asociación Internacional sin ánimo de lucro el 1 de enero de 2018.", "src": "Manual 1 (nov. 2026), capítulo 2.3.7, p. 22", "note": ""}, {"n": 45, "stem": "Según el manual, ¿en qué año se creó EASA?", "opts": ["1960", "1999", "2002", "2018"], "ans": 2, "why": "Se creó en 2002 y hoy se rige por el Reglamento UE 2018/1139.", "src": "Manual 1 (nov. 2026), capítulo 2.4.1, p. 22", "note": ""}, {"n": 46, "stem": "¿Cuál es la duración del mandato de los miembros del Consejo de Administración de EASA?", "opts": ["Tres años, no renovable", "Cinco años, renovable", "Cuatro años, renovable una vez", "Dos años, renovable"], "ans": 1, "why": "La duración de los mandatos es de cinco años renovables.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 23", "note": ""}, {"n": 47, "stem": "¿Qué dirección de EASA es responsable de la normalización y de las normas sobre mantenimiento, operaciones aéreas, tripulaciones, aspectos médicos, ATM/ANS y aeródromos?", "opts": ["La Dirección de normas de vuelo", "La Dirección de certificación", "La Dirección de recursos y apoyo", "La Dirección de gestión de estrategia y seguridad"], "ans": 0, "why": "La Dirección de normas de vuelo armoniza las normas y es responsable de la normalización (supervisión nacional).", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 24", "note": ""}, {"n": 48, "stem": "SAFA, programa coordinado por EASA, significa:", "opts": ["Evaluación de la seguridad de aeronaves extranjeras (<em>Safety Assessment of Foreign Aircraft</em>)", "Marco normalizado de aeronavegabilidad para la aviación (<em>Standard Airworthiness Framework for Aviation</em>)", "Autoridad de seguridad para compañías aéreas (<em>Safety Authority for Airlines</em>)", "Sistema de análisis de vuelos aeronáuticos (<em>System for Aeronautical Flight Analysis</em>)"], "ans": 0, "why": "Es un programa de la Comunidad Europea que la Agencia coordina por orden de la Comisión Europea.", "src": "Manual 1 (nov. 2026), capítulo 2.4.3, p. 23", "note": ""}, {"n": 49, "stem": "En el proceso normativo de EASA, tras la consulta, los proyectos de reglamentos de ejecución se envían a:", "opts": ["El Consejo de la OACI", "La Comisión Europea", "El Tribunal de Justicia", "EUROCONTROL"], "ans": 1, "why": "Si superan la revisión del Parlamento Europeo y del Consejo, se publican en el Diario Oficial de la UE.", "src": "Manual 1 (nov. 2026), capítulo 2.4.5, p. 24", "note": ""}, {"n": 50, "stem": "¿Dónde se constituyó EUROCAE?", "opts": ["París", "Washington D. C.", "La Habana", "Lucerna"], "ans": 3, "why": "Organización sin ánimo de lucro formada en Lucerna (Suiza). RTCA tiene su sede en Washington D.C. y la IATA se fundó en La Habana.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 24", "note": ""}, {"n": 51, "stem": "La IATA se fundó en:", "opts": ["La Habana, Cuba", "Montreal", "Ginebra", "Lucerna"], "ans": 0, "why": "Organismo no gubernamental con más de 350 aerolíneas que comprenden el 80 % del tráfico aéreo total.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 52, "stem": "¿Qué organización cuenta con «miembros de pleno derecho» (ANSP) y «miembros asociados»?", "opts": ["ACI", "IATA", "CANSO", "EUROCAE"], "ans": 2, "why": "CANSO, la Organización de proveedores de Servicios de Navegación Aérea (<em>Civil Air Navigation Service Organization</em>): miembro de pleno derecho es cualquier proveedor de servicio de navegación aérea; asociado, cualquier otra organización.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 53, "stem": "Según el manual, ACI (Consejo Internacional de Aeropuertos) agrupa:", "opts": ["830 aeropuertos pertenecientes a 2181 operadores en 170 países", "2181 aeropuertos pertenecientes a 830 operadores en 170 países", "2181 aeropuertos pertenecientes a 830 operadores en 193 países", "1281 aeropuertos pertenecientes a 380 operadores en 170 países"], "ans": 1, "why": "El manual da para ACI (<em>Airports Council International</em>) 2181 aeropuertos principales del mundo pertenecientes a 830 operadores en 170 países. La A invierte las dos primeras cifras; 193 es el número de Estados miembros de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 54, "stem": "¿Qué organismo español representa la máxima autoridad aeronáutica civil en el ámbito nacional?", "opts": ["AESA", "ENAIRE", "El Ministerio de Transportes y Movilidad Sostenible", "CIDETRA"], "ans": 2, "why": "Dentro de la Administración General del Estado; distintas entidades realizan sus funciones de ordenación, supervisión y control.", "src": "Manual 1 (nov. 2026), capítulo 3.1, p. 25", "note": ""}, {"n": 55, "stem": "El «desdoblamiento de la autoridad aeronáutica» en España se estableció mediante:", "opts": ["La Ley 21/2003", "El Real Decreto 184/2008", "La Ley 9/2010", "El Real Decreto 160/2023"], "ans": 1, "why": "Separa la DGAC (política estratégica, representación, circulares) y AESA (inspección, sanción, evaluación de riesgos).", "src": "Manual 1 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 56, "stem": "¿Qué organismo aprueba las circulares aeronáuticas?", "opts": ["AESA", "La DGAC", "ENAIRE", "El Consejo de Ministros"], "ans": 1, "why": "La DGAC aprueba las circulares aeronáuticas de seguridad aérea por propia iniciativa o a propuesta de AESA.", "src": "Manual 1 (nov. 2026), capítulos 3.2 y 3.3.1, p. 26, y 4.2.3.1, p. 39", "note": ""}, {"n": 57, "stem": "¿Qué comisión preside la DGAC?", "opts": ["CIPAI", "SCA", "CIAIAC", "CIDETRA"], "ans": 3, "why": "La Comisión Interministerial entre Defensa y Transportes; la CIPAI está adscrita al Ministerio de Asuntos Exteriores.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, pp. 26-27", "note": ""}, {"n": 58, "stem": "Las dos Subdirecciones Generales de la DGAC son:", "opts": ["Transporte Aéreo, y Aeropuertos y Navegación Aérea", "Seguridad de Aeronaves, y Navegación Aérea", "Estrategia, y Regulación", "Aeropuertos, y Recursos Humanos"], "ans": 0, "why": "Además de una Unidad de Apoyo.", "src": "Manual 1 (nov. 2026), capítulo 3.3.2, pp. 27-28", "note": ""}, {"n": 59, "stem": "La CIAIAC está adscrita a:", "opts": ["La Subsecretaría del Ministerio de Transportes y Movilidad Sostenible", "AESA", "La DGAC", "El Ministerio de Defensa"], "ans": 0, "why": "Investiga los accidentes e incidentes de aviación civil que se producen en territorio español.", "src": "Manual 1 (nov. 2026), capítulo 3.3.3, p. 28", "note": ""}, {"n": 60, "stem": "¿Cuál NO es un componente de un informe de la CIAIAC?", "opts": ["La información factual", "El análisis", "La determinación del responsable", "Las recomendaciones de seguridad"], "ans": 2, "why": "La investigación es exclusivamente técnica y no determina culpa ni responsabilidad. El informe contiene información factual, análisis, conclusiones y recomendaciones.", "src": "Manual 1 (nov. 2026), capítulo 3.3.3, p. 28", "note": ""}, {"n": 61, "stem": "Entre las funciones de AESA figura:", "opts": ["Gestionar el Registro de matrícula de aeronaves", "Prestar el servicio de control de área", "Gestionar 46 aeropuertos", "Presidir la CIDETRA"], "ans": 0, "why": "La Dirección de seguridad de aeronaves (DSA) gestiona el Registro. La B corresponde a ENAIRE, la C a Aena y la D a la DGAC.", "src": "Manual 1 (nov. 2026), capítulos 3.4.1-3.4.2, p. 29", "note": ""}, {"n": 62, "stem": "¿En qué dirección de AESA se integra la Oficina de Seguridad en Vuelo (OSV)?", "opts": ["Dirección de Navegación Aérea", "Dirección de Seguridad de Aeronaves (DSA)", "Dirección de Aeropuertos y Seguridad de la Aviación Civil", "Dirección de Gestión de la Seguridad y Personal de Vuelo"], "ans": 1, "why": "La OSV está integrada en la DSA.", "src": "Manual 1 (nov. 2026), capítulo 3.4.2, pp. 29-30", "note": ""}, {"n": 63, "stem": "¿Qué dirección de AESA es el «órgano sustantivo» en la evaluación ambiental?", "opts": ["Dirección de Seguridad de Aeronaves", "Dirección de Navegación Aérea", "Dirección de Gestión de la Seguridad y Personal de Vuelo", "Dirección de Aeropuertos y Seguridad de la Aviación Civil"], "ans": 3, "why": "También ejerce las competencias en aeropuertos, frente a los actos de interferencia ilícita y en facilitación.", "src": "Manual 1 (nov. 2026), capítulo 3.4.2, p. 30", "note": ""}, {"n": 64, "stem": "Aena S.M.E., S.A. gestiona en España:", "opts": ["46 aeropuertos y 2 helipuertos", "32 aeropuertos y 46 helipuertos", "48 aeropuertos", "21 aeropuertos y 5 helipuertos"], "ans": 0, "why": "Además, participa en la gestión de otros 32 aeropuertos en el extranjero.", "src": "Manual 1 (nov. 2026), capítulos 3.5, p. 30, y 3.5.2, p. 31", "note": ""}, {"n": 65, "stem": "Según el apartado sobre los orígenes de Aena (3.5.1), AENA (Aeropuertos Españoles y Navegación Aérea) se constituyó como ente público mediante qué Real Decreto?", "opts": ["Real Decreto 184/2008", "Real Decreto-ley 13/2010", "Real Decreto 905/1991", "Real Decreto 160/2023"], "ans": 2, "why": "El apartado 3.5.1 dice que AENA se constituyó por el Real Decreto 905/1991. El RDL 13/2010 liberalizó después los servicios aeroportuarios; el RD 184/2008 es el Estatuto de AESA y el RD 160/2023, el de ENAIRE. (El apartado 4.4.2 atribuye por separado a la Ley 4/1990, art. 82, la creación del ente, véase Q98; esa ley se ha quitado de las opciones para evitar dos respuestas defendibles.)", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 30", "note": ""}, {"n": 66, "stem": "¿Qué porcentaje de capital privado tenía Aena Aeropuertos, S.A. cuando se creó por el RDL 13/2010?", "opts": ["51 %", "25 %", "100 %", "49 %"], "ans": 3, "why": "49 % de capital privado; el 51 % es la participación de Aena en el capital del aeropuerto de Luton.", "src": "Manual 1 (nov. 2026), capítulos 3.5.1, p. 30, y 3.5.2, p. 31", "note": ""}, {"n": 67, "stem": "El Documento de Regulación Aeroportuaria (DORA) se estableció en:", "opts": ["2014", "2010", "1991", "2017"], "ans": 0, "why": "Nuevo marco de regulación de 2014 que fija la calidad del servicio, el régimen de inversiones y los ingresos máximos por pasajero.", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 31", "note": ""}, {"n": 68, "stem": "Aena, S.A. cotiza en bolsa desde:", "opts": ["El 1 de enero de 1986", "El 11 de febrero de 2015", "Abril de 2017", "Julio de 2014"], "ans": 1, "why": "Julio de 2014 fue el cambio de denominación a Aena, S.A. y abril de 2017, la incorporación de la abreviatura S.M.E.", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 31", "note": ""}, {"n": 69, "stem": "En 2024, el récord de Aena fue de:", "opts": ["1,5 millones de operaciones y 200 millones de pasajeros", "3 millones de operaciones y 400 millones de pasajeros", "2,5 millones de operaciones y 309,3 millones de pasajeros", "2,19 millones de operaciones y 96,7 millones de pasajeros"], "ans": 2, "why": "Cifras del manual para Aena. No confundir con ENAIRE, que en 2024 gestionó más de 2,4 millones de vuelos.", "src": "Manual 1 (nov. 2026), capítulo 3.5.2, p. 31", "note": ""}, {"n": 70, "stem": "ENAIRE es la empresa designada para prestar los servicios de tránsito aéreo en ruta y en aproximación en virtud de:", "opts": ["La Ley 9/2010", "La Ley 48/1960", "La Ley 21/2003", "La Ley 18/2014"], "ans": 0, "why": "Así se indica en 3.6.1.", "src": "Manual 1 (nov. 2026), capítulo 3.6.1, p. 32", "note": ""}, {"n": 71, "stem": "El espacio aéreo controlado por ENAIRE tiene una superficie de:", "opts": ["1,19 millones de km²", "2,19 millones de km²", "3,5 millones de km²", "2,5 millones de km²"], "ans": 1, "why": "2,19 millones de km². Las otras cifras cercanas del manual no son superficies: 2,5 millones son las operaciones de Aena en 2024 y ENAIRE gestionó en 2024 más de 2,4 millones de vuelos.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 72, "stem": "¿Qué pareja asocia correctamente una Dirección regional de Navegación Aérea con la sede de su ACC?", "opts": ["Este - Sevilla", "Sur - Barcelona", "Baleares - Madrid", "Centro Norte - Madrid"], "ans": 3, "why": "Este - Barcelona, Sur - Sevilla, Baleares - Palma de Mallorca, Canaria - Canarias.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 73, "stem": "Los dos TACC de ENAIRE están ubicados en:", "opts": ["Madrid y Barcelona", "Sevilla y Palma", "Santiago y Valencia", "Bilbao y Málaga"], "ans": 2, "why": "Además de las cinco direcciones regionales y veintiuna torres de control.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 74, "stem": "Según el manual, ¿cuántas torres de control gestiona ENAIRE?", "opts": ["21", "16", "5", "46"], "ans": 0, "why": "Cinco direcciones regionales, dos TACC y veintiuna torres de control.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 75, "stem": "¿Qué asociación se fundó en 2004 y cuenta entre sus miembros con Iberia, Vueling y Binter Canarias?", "opts": ["AECA", "ALA", "AOC", "ACETA"], "ans": 3, "why": "AECA se fundó en 1988; ALA se registró hace más de 50 años.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 76, "stem": "La CIDETRA se creó en:", "opts": ["1946", "1977", "1979", "1986"], "ans": 2, "why": "1946 es la CIPAI, 1977 el Ministerio de Transportes, Turismo y Comunicaciones y 1986 el Comité de Coordinación Operativa.", "src": "Manual 1 (nov. 2026), capítulo 3.8, pp. 33-34", "note": ""}, {"n": 77, "stem": "La CIPAI está adscrita al:", "opts": ["Ministerio de Defensa", "Ministerio de Transportes", "Ministerio de Asuntos Exteriores", "Ministerio del Interior"], "ans": 2, "why": "Creada en 1946 como Comisión Interministerial de Política Aérea Internacional.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 78, "stem": "¿Quiénes participan en el Subcomité de la Circulación Aérea (SCA)?", "opts": ["ENAIRE, la DGAC, la AEMET y las compañías aéreas españolas", "AESA, Aena, la AEMET y las compañías aéreas españolas", "ENAIRE, la DGAC, AESA y el Ministerio de Defensa", "ENAIRE, Aena, la CIAIAC y la IATA"], "ans": 0, "why": "El manual dice que participan ENAIRE, la DGAC, la AEMET y las compañías aéreas españolas. Coordina todos los requisitos operacionales identificados y justificados por los usuarios.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 79, "stem": "¿Qué rama del Derecho contiene las normas sobre el contrato de transporte aéreo?", "opts": ["El Derecho administrativo", "El Derecho laboral", "El Derecho penal", "El Derecho mercantil"], "ans": 3, "why": "Derecho mercantil; el Derecho laboral regula las condiciones de trabajo de las tripulaciones.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 80, "stem": "En España, los convenios internacionales forman parte del ordenamiento jurídico como normas de obligado cumplimiento solo si:", "opts": ["Los ha firmado el Ministro", "Han sido ratificados y publicados en el BOE", "Son Anexos de la OACI", "Los ha aprobado EASA"], "ans": 1, "why": "Así se indica para los acuerdos multilaterales.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 81, "stem": "El Convenio de Montreal de 28 de mayo de 1999 deroga y sustituye al:", "opts": ["Convenio de Chicago", "Convenio de Varsovia de 1929", "Convenio de Tokio", "Convenio de Roma de 1933"], "ans": 1, "why": "El Convenio de Varsovia (12 de octubre de 1929), modificado por los protocolos de La Haya, Guadalajara y Montreal.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 82, "stem": "El Tratado sobre cielos abiertos es de:", "opts": ["24 de marzo de 1992", "7 de diciembre de 1944", "13 de diciembre de 1960", "16 de diciembre de 1971"], "ans": 0, "why": "BOE n.º 230, de 24 de septiembre de 1992.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 83, "stem": "¿Qué libertad del aire es el derecho a sobrevolar otro Estado sin aterrizar?", "opts": ["La primera", "La segunda", "La tercera", "La séptima"], "ans": 0, "why": "La primera es la Libertad de Sobrevuelo; la segunda, la de Escala Técnica.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 84, "stem": "¿Qué libertad permite a una compañía aérea del Estado A transportar tráfico comercial entre los Estados B y C siempre que haga escala en su propio territorio?", "opts": ["La quinta", "La séptima", "La octava", "La sexta"], "ans": 3, "why": "Sexta libertad (Transporte Externo-Interno); la séptima es enteramente fuera de su territorio.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 85, "stem": "La novena libertad del aire es:", "opts": ["El cabotaje consecutivo", "El cabotaje autónomo", "La escala técnica", "El transporte entre terceros países"], "ans": 1, "why": "La octava es el cabotaje consecutivo.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 86, "stem": "¿Qué instrumento jurídico de la UE necesita un mecanismo de transposición?", "opts": ["El reglamento", "La decisión dirigida a una persona", "La directiva", "El reglamento de ejecución"], "ans": 2, "why": "La directiva persigue resultados u objetivos concretos en un plazo determinado y deja a cada Estado la elección de la forma y los medios.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 87, "stem": "La Directiva 2006/23/CE trata de:", "opts": ["Las tasas aeroportuarias", "La licencia comunitaria de controlador de tránsito aéreo", "Los derechos de los pasajeros", "Las aeronaves no tripuladas"], "ans": 1, "why": "Se cita como ejemplo de directiva en la tabla (de 5 de abril de 2006).", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 88, "stem": "Orden de importancia de las normas nacionales españolas según el manual:", "opts": ["Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas, Resoluciones de la DGAC", "Reales Decretos, Leyes, Circulares Aeronáuticas, Órdenes Ministeriales, Resoluciones de la DGAC", "Leyes, Órdenes Ministeriales, Reales Decretos, Resoluciones de la DGAC, Circulares Aeronáuticas", "Leyes, Reales Decretos, Circulares Aeronáuticas, Órdenes Ministeriales, Resoluciones de la DGAC"], "ans": 0, "why": "Se enumeran «por orden de importancia»: Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de la Dirección General de Aviación Civil. La D adelanta las circulares a las órdenes ministeriales.", "src": "Manual 1 (nov. 2026), capítulo 4.2.3, p. 39", "note": ""}, {"n": 89, "stem": "El Reglamento (CE) 549/2004 se conoce como:", "opts": ["El reglamento de prestación de servicios", "El reglamento marco del SES", "El reglamento del espacio aéreo", "El reglamento de interoperabilidad"], "ans": 1, "why": "El 550/2004 es el «Reglamento de prestación de servicios».", "src": "Manual 1 (nov. 2026), capítulo 4.3.1, p. 39", "note": ""}, {"n": 90, "stem": "En el Proyecto Común Uno (Reglamento 2021/116), la funcionalidad AF 3 es:", "opts": ["La gestión ampliada de llegadas", "La integración y productividad de los aeropuertos", "La gestión flexible del espacio aéreo y el encaminamiento libre", "La gestión colaborativa de la red"], "ans": 2, "why": "AF 1 gestión ampliada de llegadas e integración AMAN/DMAN, AF 2 aeropuertos, AF 4 gestión colaborativa de la red, AF 5 gestión de la información del sistema en su conjunto, AF 6 intercambio de información sobre trayectorias.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, pp. 40-41", "note": ""}, {"n": 91, "stem": "El Reglamento (UE) 923/2012 establece:", "opts": ["El sistema de evaluación del rendimiento", "Las normas de ATFM", "El reglamento del aire y disposiciones operativas comunes (SERA)", "El marco regulador del U-Space"], "ans": 2, "why": "El 255/2010 es ATFM, el 2019/317, evaluación del rendimiento y tarificación, y el 2021/664, U-Space.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 92, "stem": "El Anexo de SERA se divide en un número determinado de secciones. ¿Cuántas?", "opts": ["8", "12", "10", "15"], "ans": 3, "why": "La sección 15 es CPDLC; además hay 6 apéndices.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, pp. 41-43", "note": ""}, {"n": 93, "stem": "El Reglamento (UE) 2017/373 establece:", "opts": ["Las licencias de controlador (ATCO)", "Los requisitos comunes para los proveedores de ATM/ANS y otras funciones de la red", "La certificación de aeródromos", "La investigación de accidentes"], "ans": 1, "why": "El 2015/340 son las licencias ATCO, el 139/2014 los aeródromos y el 996/2010 la investigación.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 94, "stem": "La Empresa Común SESAR 3 se crea por un período que finaliza el:", "opts": ["31 de diciembre de 2027", "31 de diciembre de 2031", "31 de diciembre de 2050", "1 de enero de 2018"], "ans": 1, "why": "Creada por el Reglamento 2021/2085, con sede en Bruselas y financiación con cargo al Marco Financiero Plurianual 2021-2027.", "src": "Manual 1 (nov. 2026), capítulo 4.3.7, p. 46", "note": ""}, {"n": 95, "stem": "¿Qué ley establece que el espacio aéreo situado sobre el territorio español y su mar territorial está sujeto a la soberanía española?", "opts": ["Ley 21/2003", "Ley 9/2010", "Ley 48/1960", "Ley 8/2011"], "ans": 2, "why": "Ley 48/1960 de Navegación Aérea.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 47", "note": ""}, {"n": 96, "stem": "¿Cuál NO es una de las «facultades indisponibles» del proveedor de servicios ATS según la Ley 9/2010?", "opts": ["Efectuar la selección y formación de los CTA", "Organizar los turnos, horarios y descansos del personal", "Vigilar el trabajo del personal e imponer sanciones", "Fijar la tarifa de ruta"], "ans": 3, "why": "Las cuatro son: configuración operativa, instalaciones, servicios técnicos, personal y organización directiva; selección y formación de CTA; turnos, horarios y descansos; y vigilancia y sanciones.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, pp. 47-48", "note": ""}, {"n": 97, "stem": "El Real Decreto 160/2023 aprueba el Estatuto de:", "opts": ["AESA", "AEMET", "ENAIRE", "Aena"], "ans": 2, "why": "El RD 184/2008 es el de AESA y el RD 186/2008, el de AEMET.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 50", "note": ""}, {"n": 98, "stem": "¿Qué ley creó la entidad «Aeropuertos Españoles y Navegación Aérea» (art. 82)?", "opts": ["Ley 4/1990", "Ley 18/2014", "Ley 25/1998", "Ley 24/2001"], "ans": 0, "why": "Ley 4/1990 de Presupuestos Generales del Estado para 1990.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 48", "note": ""}, {"n": 99, "stem": "¿Qué Real Decreto regula los tiempos de actividad y los requisitos de descanso de los ATCO?", "opts": ["RD 1516/2009", "RD 1001/2010", "RD 1133/2010", "RD 57/2002"], "ans": 1, "why": "El RD 1516/2009 establece disposiciones complementarias sobre licencias y certificados de CTA.", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, p. 54", "note": ""}, {"n": 100, "stem": "¿Qué nivel mínimo de competencia lingüística exigen el RD 1133/2010 y el RD 1238/2011 al personal AFIS y SDP?", "opts": ["Nivel 3", "Nivel 5", "Nivel 6", "Nivel 4"], "ans": 3, "why": "Nivel mínimo de competencia lingüística operacional 4.", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, p. 55", "note": ""}, {"n": 101, "stem": "¿Qué Real Decreto aprobó el Reglamento de Circulación Aérea?", "opts": ["RD 57/2002", "RD 1180/2018", "RD 426/2021", "RD 517/2024"], "ans": 0, "why": "El RD 1180/2018 desarrolla SERA; el RD 426/2021 modificó el Reglamento en lo relativo a las pistas paralelas.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, pp. 55-56", "note": ""}, {"n": 102, "stem": "La Ley 25/1998 establece que las prestaciones patrimoniales de carácter público del dominio público aeroportuario comprenden un número de tarifas cuyos elementos solo pueden fijarse por ley. ¿Cuántas son?", "opts": ["12", "46", "26", "21"], "ans": 2, "why": "26 tarifas, cuyos elementos esenciales (número, identidad y criterios de cuantificación) solo pueden establecerse por Ley.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, p. 58", "note": ""}, {"n": 103, "stem": "¿Qué ley regula la tarifa de aproximación?", "opts": ["Ley 25/1998", "Ley 24/2001", "Ley 37/2003", "Ley 7/2021"], "ans": 1, "why": "La Ley 24/2001 la cataloga como una tasa, retribución de los servicios de navegación aérea prestados para la seguridad de la circulación aérea y la fluidez de sus movimientos en esa fase de vuelo.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, pp. 58-59", "note": ""}, {"n": 104, "stem": "Según la introducción del manual, ¿mediante qué actividades preserva la regulación de los servicios de navegación aérea el orden, la seguridad y los derechos de los usuarios?", "opts": ["Certificación, inspección y sanción", "Planificación, explotación y conservación", "Ordenación, supervisión y control", "Normalización, armonización y auditoría"], "ans": 2, "why": "La regulación preserva el orden y la seguridad en la provisión de los servicios y los derechos e intereses legítimos de los usuarios «mediante la ordenación, supervisión y control de sus diferentes sectores de actividad».", "src": "Manual 1 (nov. 2026), capítulo 1, p. 5", "note": ""}, {"n": 105, "stem": "Según el manual, las organizaciones internacionales:", "opts": ["Se crean por medio de un tratado, están compuestas por Estados y se dotan de órganos para cumplir sus fines", "Se crean por acuerdo de las compañías aéreas y están compuestas por sus asociaciones nacionales", "Se crean por resolución de la Asamblea de la ONU y están compuestas por Estados y empresas", "Se crean por reglamento de la UE y están compuestas por las autoridades nacionales de supervisión"], "ans": 0, "why": "Se crean para gestionar intereses colectivos por medio de un tratado, dotadas de órganos para cumplir sus fines; están compuestas por Estados y su organización y fines se determinan mediante tratados, cartas, convenciones, etc.", "src": "Manual 1 (nov. 2026), capítulo 2, p. 5", "note": ""}, {"n": 106, "stem": "¿Para qué crearon los Estados la OACI en 1944, según el manual?", "opts": ["Para prestar el control de tránsito aéreo en el espacio aéreo sobre alta mar", "Para representar los intereses de las compañías aéreas ante los gobiernos", "Para certificar el diseño de aeronaves, motores y componentes", "Para ejercer la administración y velar por la aplicación del Convenio de Chicago"], "ans": 3, "why": "La OACI es un organismo especializado de la ONU creado por los Estados en 1944 «para ejercer la administración y velar por la aplicación del Convenio sobre Aviación Civil Internacional». Representar a las aerolíneas es propio de la IATA y la certificación de tipo, de EASA.", "src": "Manual 1 (nov. 2026), capítulo 2.1.1, p. 5", "note": ""}, {"n": 107, "stem": "¿Sobre qué busca la OACI el consenso de los 193 Estados miembros del Convenio y de grupos de la industria?", "opts": ["Sobre las tarifas y los fletes de los servicios aéreos internacionales", "Sobre las normas y métodos recomendados (SARPs) y sobre políticas para el sector", "Sobre la asignación de franjas horarias en los aeropuertos coordinados", "Sobre el reparto de los derechos de tráfico de los convenios bilaterales"], "ans": 1, "why": "La OACI trabaja con los 193 Estados y la industria para alcanzar un consenso sobre las SARPs para la aviación civil internacional y sobre políticas para el sector.", "src": "Manual 1 (nov. 2026), capítulo 2.1.1, p. 5", "note": ""}, {"n": 108, "stem": "La OACI busca políticas que hagan posible que el sector de la aviación civil sea operacionalmente seguro y otras cualidades. ¿Cuál de estas NO figura en la enumeración del manual?", "opts": ["Eficiente y protegido", "Económicamente sostenible", "Tecnológicamente autosuficiente", "Ambientalmente responsable"], "ans": 2, "why": "El manual enumera: operacionalmente seguro, eficiente, protegido, económicamente sostenible y ambientalmente responsable.", "src": "Manual 1 (nov. 2026), capítulo 2.1.1, p. 5", "note": ""}, {"n": 109, "stem": "¿A iniciativa de qué Gobierno se convocó la Conferencia de Chicago de 1944?", "opts": ["Estados Unidos", "Reino Unido", "Canadá", "Francia"], "ans": 0, "why": "Fue convocada a iniciativa del Gobierno de Estados Unidos para reunificar los acuerdos vigentes y lograr una legislación internacional sobre navegación aérea.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 5", "note": ""}, {"n": 110, "stem": "¿Entre qué fechas se reunieron en Chicago los representantes de los países convocados?", "opts": ["Del 7 de diciembre de 1944 al 4 de abril de 1947", "Del 1 de octubre al 7 de noviembre de 1944", "Del 4 de abril al 31 de mayo de 1947", "Del 1 de noviembre al 7 de diciembre de 1944"], "ans": 3, "why": "Representantes de 54 países se reunieron en Chicago entre el 1 de noviembre y el 7 de diciembre de 1944. El 4 de abril de 1947 la PICAO pasó a ser la OACI y en mayo de 1947 se celebró la primera Asamblea.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 5", "note": ""}, {"n": 111, "stem": "¿Cuál de estas era una de las intenciones de los países reunidos en la Conferencia de Chicago?", "opts": ["Fijar unas tarifas aéreas comunes para todas las rutas internacionales", "Establecer una junta interina que recogiera y estudiara datos de la aviación internacional", "Crear un centro internacional de control del espacio aéreo superior", "Fundar una compañía aérea internacional bajo bandera de la ONU"], "ans": 1, "why": "Las dos intenciones fueron llegar a acuerdos para establecer rutas y servicios aéreos provisionales a nivel mundial y establecer una junta o grupo interino que recogiera, registrara y estudiara datos de la aviación internacional e hiciera recomendaciones.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 6", "note": ""}, {"n": 112, "stem": "Según el manual, el Convenio de Chicago consta de:", "opts": ["Diecinueve partes, una por cada anexo", "Una parte de normas y otra de métodos recomendados", "Una parte sobre la navegación internacional y otra sobre la OACI", "Tres partes: navegación, transporte y controversias"], "ans": 2, "why": "Consta de una primera parte dedicada a regular la navegación internacional y una segunda que se centra en las características y funcionamiento de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 6", "note": ""}, {"n": 113, "stem": "Según el Convenio de Chicago, los servicios de transporte aéreo internacional deben establecerse:", "opts": ["Sobre una base de igualdad de oportunidades y realizarse de modo sólido y económico", "En régimen de libre competencia y con libertad de tarifas entre las compañías", "Mediante acuerdos bilaterales aprobados previamente por el Consejo de la OACI", "Con prioridad para las compañías aéreas de los Estados firmantes en 1944"], "ans": 0, "why": "El Convenio establece que la aviación civil internacional debe desarrollarse «de manera segura y ordenada» y que los servicios de transporte aéreo deben establecerse «sobre una base de igualdad de oportunidades y realizarse de modo sólido y económico».", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 6", "note": ""}, {"n": 114, "stem": "¿Por qué la Conferencia de Chicago firmó un Acuerdo Interino que preveía una OACI Provisional (PICAO)?", "opts": ["Porque varios Estados se negaron a firmar el Convenio", "Porque todavía no existía la Organización de las Naciones Unidas", "Porque no se había decidido la sede permanente de la Organización", "Por los retrasos en la ratificación del Convenio"], "ans": 3, "why": "Debido a los retrasos en la ratificación, se previó la PICAO como órgano asesor y coordinador temporal; el 4 de abril de 1947, con las ratificaciones suficientes, pasó a denominarse oficialmente OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.1.2, p. 6", "note": ""}, {"n": 115, "stem": "¿Cuál de las siguientes NO forma parte de la misión de la OACI según el manual?", "opts": ["Desarrollar los principios y técnicas de la navegación aérea internacional", "Prestar los servicios de tránsito aéreo en el espacio aéreo sobre alta mar", "Fomentar la organización y desarrollo del transporte aéreo internacional", "Velar por la armonización y normalización de los métodos de operación de los servicios aéreos civiles internacionales"], "ans": 1, "why": "La misión tiene tres puntos: armonización y normalización de los métodos de operación, desarrollo de los principios y técnicas de la navegación aérea internacional y fomento del transporte aéreo internacional mediante principios, acuerdos, normas y reglamentos. La OACI no presta servicios de tránsito aéreo.", "src": "Manual 1 (nov. 2026), capítulo 2.1.3, p. 6", "note": ""}, {"n": 116, "stem": "La red mundial de transporte aéreo que apoya la OACI debe reconocer la clara necesidad de prever y manejar la duplicación proyectada de la capacidad del transporte aéreo mundial para el año:", "opts": ["2025", "2050", "2030", "2035"], "ans": 2, "why": "El manual habla de la duplicación proyectada de la capacidad «para 2030».", "src": "Manual 1 (nov. 2026), capítulo 2.1.4, p. 7", "note": ""}, {"n": 117, "stem": "¿Qué objetivo estratégico de la OACI se describe como «Fomentar el desarrollo de un sistema de aviación civil sólido y económicamente viable»?", "opts": ["Capacidad y eficiencia de la navegación aérea", "Desarrollo económico del transporte aéreo", "Seguridad y facilitación", "Seguridad operacional"], "ans": 1, "why": "Seguridad operacional es fortalecer la seguridad operacional; capacidad y eficiencia, aumentar la capacidad y mejorar la eficiencia; seguridad y facilitación, fortalecer la facilitación y la seguridad.", "src": "Manual 1 (nov. 2026), capítulo 2.1.4, p. 7", "note": ""}, {"n": 118, "stem": "¿Qué objetivo estratégico de la OACI consiste en «Aumentar la capacidad y mejorar la eficiencia del sistema de la aviación civil mundial»?", "opts": ["Desarrollo económico del transporte aéreo", "Seguridad operacional", "Protección del medio ambiente", "Capacidad y eficiencia de la navegación aérea"], "ans": 3, "why": "Protección del medio ambiente es minimizar los efectos ambientales adversos de las actividades de la aviación civil.", "src": "Manual 1 (nov. 2026), capítulo 2.1.4, p. 7", "note": ""}, {"n": 119, "stem": "Según el manual, ¿cómo se toman las decisiones en la Asamblea de la OACI?", "opts": ["Por mayoría de los votos emitidos, salvo cuando el Consejo establezca lo contrario", "Por unanimidad de los Estados representados en la sesión", "Por mayoría de dos tercios de todos los Estados miembros", "Por voto ponderado según el tráfico aéreo de cada Estado"], "ans": 0, "why": "Cada Estado tiene derecho a un voto y las decisiones se toman por mayoría de los votos emitidos, salvo cuando el Consejo establezca lo contrario.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 120, "stem": "¿Cómo define el manual el Consejo de la OACI?", "opts": ["Como el órgano soberano, constituido por todos los Estados Miembros", "Como el órgano consultivo que asesora a la Secretaría General", "Como un órgano ejecutivo permanente, responsable ante la Asamblea", "Como un órgano técnico dependiente de la Oficina de navegación aérea"], "ans": 2, "why": "El órgano soberano, con todos los Estados Miembros, es la Asamblea; el Consejo es el órgano ejecutivo permanente, responsable ante ella e integrado por 36 Estados.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 121, "stem": "Según el manual, en la Asamblea de la OACI:", "opts": ["Los Estados del Consejo tienen derecho a un voto doble", "Ninguna persona podrá representar a más de un Estado", "Cada región de navegación aérea dispone de un voto", "Solo están representados los 36 Estados del Consejo"], "ans": 1, "why": "Todos los Estados tienen igual derecho a estar representados, ninguna persona podrá representar a más de un Estado y cada Estado tiene un voto.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 122, "stem": "¿Qué órgano de la OACI adopta las normas internacionales y métodos recomendados y los incorpora a los Anexos al Convenio?", "opts": ["La Asamblea", "La Secretaría General", "La Oficina de navegación aérea", "El Consejo"], "ans": 3, "why": "Es una de las cinco funciones principales del Consejo, junto con convocar a la Asamblea, oficiar de árbitro, investigar obstáculos evitables y tomar medidas para mantener la seguridad operacional y la regularidad.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 123, "stem": "¿Qué órgano de la OACI revisa y adopta las prioridades del programa de trabajo y el presupuesto para el trienio próximo?", "opts": ["La Asamblea", "El Consejo", "La Secretaría General", "La Oficina de administración y servicios"], "ans": 0, "why": "La Asamblea revisa y adopta las prioridades del programa de trabajo y el presupuesto, establece políticas y objetivos y respalda la planificación estratégica global desarrollada por la Secretaría.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 7", "note": ""}, {"n": 124, "stem": "¿De qué órgano de la OACI dice expresamente el manual que España forma parte?", "opts": ["De la Comisión Permanente", "Del Consejo Provisional", "Del Consejo", "De la Secretaría General"], "ans": 2, "why": "«España forma parte del Consejo.» La Comisión Permanente y el Consejo Provisional son órganos de EUROCONTROL, en los que España también está representada.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 8", "note": ""}, {"n": 125, "stem": "¿Qué órgano de la OACI oficia de Secretaría del Consejo y le prepara informes periódicos sobre el desarrollo de sus actividades?", "opts": ["La Asamblea", "La Secretaría General", "La Oficina de transporte aéreo", "La Oficina Europa y Atlántico Norte"], "ans": 1, "why": "La Secretaría General ejerce el liderazgo del personal internacional especializado, oficia de Secretaría del Consejo, lleva a cabo las funciones que este le asigna y le prepara informes periódicos.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 8", "note": ""}, {"n": 126, "stem": "¿Cuál de las siguientes NO es una de las cinco oficinas de la Secretaría General de la OACI?", "opts": ["Oficina de navegación aérea", "Oficina de desarrollo de capacidades e implementación", "Oficina de seguridad operacional y auditoría", "Oficina de asuntos jurídicos y relaciones externas"], "ans": 2, "why": "Las cinco son: navegación aérea; transporte aéreo; desarrollo de capacidades e implementación; asuntos jurídicos y relaciones externas; y administración y servicios.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 a), p. 8", "note": ""}, {"n": 127, "stem": "¿Qué región de navegación aérea de la OACI se dirige desde dos oficinas, una en Nairobi y otra en Dakar?", "opts": ["África-Océano Índico (AFI)", "Oriente Medio (MID)", "América del Sur (SAM)", "Europa (EUR)"], "ans": 0, "why": "La región AFI depende de la Oficina África oriental y meridional (Nairobi, Kenia) y de la Oficina África occidental y central (Dakar, Senegal). MID depende de El Cairo, SAM de Lima y EUR de París.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 128, "stem": "¿Qué pareja región de la OACI - oficina que la dirige es INCORRECTA?", "opts": ["Atlántico Norte (NAT) - París", "Caribe (CAR) - Ciudad de México", "Oriente Medio (MID) - El Cairo", "América del Sur (SAM) - Dakar"], "ans": 3, "why": "SAM se dirige desde la Oficina América del Sur, en Lima (Perú). Dakar es una de las dos oficinas de la región AFI.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 129, "stem": "¿Qué regiones de la OACI dirige la oficina de Bangkok (Tailandia)?", "opts": ["Asia (ASIA) y Oriente Medio (MID)", "Pacífico (PAC) y Asia (ASIA)", "Pacífico (PAC) y África-Océano Índico (AFI)", "Asia (ASIA) y Europa (EUR)"], "ans": 1, "why": "La Oficina Asia y Pacífico, en Bangkok, dirige las regiones PAC y ASIA.", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 130, "stem": "¿Con qué objetivo se configura la OACI en regiones de navegación aérea?", "opts": ["Para repartir los 36 puestos del Consejo entre los continentes", "Para cobrar las tasas de navegación aérea en cada zona del mundo", "Para descentralizar la gestión y estar más próxima a los problemas de cada zona", "Para que cada región elabore sus propios anexos al Convenio"], "ans": 2, "why": "El manual dice que lo hace «con el objetivo de descentralizar la gestión y estar más próxima a los problemas de las diferentes zonas del mundo».", "src": "Manual 1 (nov. 2026), capítulo 2.1.5 b), p. 8", "note": ""}, {"n": 131, "stem": "Según el manual, la documentación de la OACI se compone de:", "opts": ["Anexos, documentos y circulares", "Anexos, reglamentos y directivas", "Convenios, protocolos y anexos", "Normas ESARR, anexos y circulares"], "ans": 0, "why": "«Se compone de anexos, documentos y circulares.» Reglamentos y directivas son normas de la UE; las ESARR son de EUROCONTROL.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6, p. 8", "note": ""}, {"n": 132, "stem": "Según el manual, los anexos de la OACI tienen por objeto:", "opts": ["Servir de textos de orientación sobre determinados aspectos de la navegación aérea", "Desarrollar al detalle el contenido de los documentos de la OACI", "Regular las relaciones de transporte público entre dos Estados concretos", "Establecer niveles mínimos de actuación y prestación de servicios mediante normas y métodos recomendados"], "ans": 3, "why": "Los anexos establecen niveles mínimos mediante SARPs y buscan uniformidad en su aplicación. Los textos de orientación son las circulares, y son los documentos los que desarrollan al detalle el contenido de los anexos (no al revés).", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 9", "note": ""}, {"n": 133, "stem": "Según la tabla del manual, ¿qué dos documentos desarrollan el Anexo 2 (Reglamento del aire)?", "opts": ["Doc. 4444 y Doc. 8697", "Doc. 4444 y Doc. 7030", "Doc. 7030 y Doc. 8697", "Doc. 8168 y Doc. 8126"], "ans": 1, "why": "La tabla «Anexo / manual que lo desarrolla» pone bajo el Anexo 2 el Doc. 4444 (Gestión del Tránsito Aéreo) y el Doc. 7030 (Procedimientos suplementarios regionales), y bajo el Anexo 4 solo el Doc. 8697.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 10", "note": ""}, {"n": 134, "stem": "En la tabla «Anexo / manual que lo desarrolla», el Doc. 8697 (Manual de cartas aeronáuticas) desarrolla el:", "opts": ["Anexo 2", "Anexo 15", "Anexo 4", "Anexo 11"], "ans": 2, "why": "El Anexo 4 (Cartas aeronáuticas) lo desarrolla el Doc. 8697; el Anexo 2 lo desarrollan los Doc. 4444 y 7030.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 10", "note": ""}, {"n": 135, "stem": "El Doc. 7030 de la OACI se titula:", "opts": ["Procedimientos suplementarios regionales", "Gestión del tránsito aéreo", "Manual de cartas aeronáuticas", "Plan mundial de navegación aérea"], "ans": 0, "why": "Gestión del tránsito aéreo es el Doc. 4444, el Manual de cartas aeronáuticas el Doc. 8697 y el Plan mundial de navegación aérea el Doc. 9750.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 10", "note": ""}, {"n": 136, "stem": "¿Qué Anexo de la OACI trata de la investigación de accidentes e incidentes de aviación?", "opts": ["Anexo 11", "Anexo 17", "Anexo 19", "Anexo 13"], "ans": 3, "why": "El 11 son los servicios de tránsito aéreo, el 17 la seguridad frente a actos de interferencia ilícita y el 19 la gestión de la seguridad operacional.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 137, "stem": "El Anexo 19 de la OACI trata de:", "opts": ["La seguridad: protección de la aviación civil contra actos de interferencia ilícita", "La gestión de la seguridad operacional", "La investigación de accidentes e incidentes de aviación", "El transporte sin riesgos de mercancías peligrosas por vía aérea"], "ans": 1, "why": "La A es el Anexo 17, la C el Anexo 13 y la D el Anexo 18.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 138, "stem": "¿Qué Anexo de la OACI trata de los servicios de información aeronáutica?", "opts": ["Anexo 10", "Anexo 11", "Anexo 15", "Anexo 4"], "ans": 2, "why": "El Anexo 10 son las telecomunicaciones aeronáuticas, el 11 los servicios de tránsito aéreo y el 4 las cartas aeronáuticas.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 139, "stem": "¿Qué Anexo de la OACI se titula «Aeronavegabilidad»?", "opts": ["Anexo 8", "Anexo 7", "Anexo 6", "Anexo 1"], "ans": 0, "why": "El 7 son las marcas de nacionalidad y de matrícula, el 6 la operación de aeronaves y el 1 las licencias al personal.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 140, "stem": "¿Qué pareja Anexo de la OACI - materia es INCORRECTA?", "opts": ["Anexo 3 - Servicio meteorológico para la navegación aérea internacional", "Anexo 9 - Facilitación", "Anexo 14 - Aeródromos", "Anexo 16 - Licencias al personal"], "ans": 3, "why": "El Anexo 16 es la protección del medio ambiente; las licencias al personal son el Anexo 1.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 141, "stem": "¿Qué Anexo de la OACI trata de las marcas de nacionalidad y de matrícula de las aeronaves?", "opts": ["Anexo 1", "Anexo 7", "Anexo 10", "Anexo 5"], "ans": 1, "why": "El Anexo 1 son las licencias al personal, el 10 las telecomunicaciones aeronáuticas y el 5 las unidades de medida.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 142, "stem": "Según la tabla de ejemplos de documentos, los PANS-ATM (Doc. 4444) complementan las normas y métodos recomendados de los Anexos:", "opts": ["2 y 4", "11 y 15", "2 y 11", "6 y 11"], "ans": 2, "why": "«Estos procedimientos complementan las normas y métodos recomendados contenidos en los Anexos 2 y 11» y especifican los procedimientos que aplican las dependencias ATS.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 143, "stem": "¿Qué número tiene el Manual para los servicios de información aeronáutica (AIS) de la OACI?", "opts": ["Doc. 8126", "Doc. 8168", "Doc. 8697", "Doc. 9750"], "ans": 0, "why": "Su objetivo es explicar las funciones básicas del AIS, describir la organización que requiere y ayudar a instruir al personal AIS. El 8168 es PANS-OPS, el 8697 el manual de cartas y el 9750 el GANP.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 144, "stem": "El GANP (Doc. 9750) incluye los principios clave de la política de aviación civil para el periodo:", "opts": ["2020-2040", "2013-2028", "2021-2027", "2016-2030"], "ans": 3, "why": "Es un marco general para el periodo 2016-2030 que ayuda a las Regiones, subregiones y Estados a preparar sus planes de navegación aérea.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 145, "stem": "Según el manual, el objetivo del GANP es:", "opts": ["Fijar las tarifas de navegación aérea en ruta de los Estados de la OACI", "Aumentar la capacidad y mejorar la eficiencia del sistema mundial de aviación civil", "Sustituir los planes regionales de navegación aérea por un único plan mundial obligatorio", "Describir las funciones básicas del AIS y el tipo de organización que este requiere"], "ans": 1, "why": "Su objetivo es aumentar la capacidad y mejorar la eficiencia del sistema mundial de aviación civil mejorando o, al menos, manteniendo la seguridad operacional. El GANP incluye además estrategias para abordar los otros Objetivos Estratégicos de la OACI. La D es el objetivo del Doc. 8126.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 146, "stem": "El Volumen I del Doc. 8168 (PANS-OPS), «Procedimientos de vuelo»:", "opts": ["Describe las áreas esenciales y los márgenes de franqueamiento de obstáculos de los vuelos por instrumentos", "Orienta a los Estados y organismos que editan cartas de vuelo por instrumentos", "Describe los procedimientos operacionales recomendados para guía del personal de operaciones de vuelo", "Especifica los procedimientos que aplican las dependencias ATS al tráfico aéreo"], "ans": 2, "why": "El Volumen I se dirige al personal de operaciones de vuelo y a las tripulaciones. A y B describen el Volumen II (construcción de procedimientos); la D, el Doc. 4444.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.2, p. 11", "note": ""}, {"n": 147, "stem": "¿Qué circular de la OACI trata de las operaciones simultáneas en pistas instrumentales paralelas o casi paralelas (SOIR)?", "opts": ["Circular 207", "Circular 247", "Circular 257", "Doc. 4444"], "ans": 0, "why": "La Circular 247 trata de los factores humanos, la gestión y la organización; la 257, de los aspectos económicos de la navegación por satélite.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.3, p. 11", "note": ""}, {"n": 148, "stem": "Según el manual, las circulares de la OACI funcionan como:", "opts": ["Normas de obligado cumplimiento para los Estados contratantes una vez publicadas", "Desarrollo al detalle del contenido de los anexos en forma de manuales técnicos", "Enmiendas provisionales al Convenio de Chicago aprobadas por el Consejo", "Textos de orientación sobre determinados aspectos de navegación aérea y aviación civil"], "ans": 3, "why": "El desarrollo detallado de los anexos lo hacen los documentos.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.3, p. 11", "note": ""}, {"n": 149, "stem": "La Circular 257 de la OACI trata de:", "opts": ["Los factores humanos, la gestión y la organización", "Los aspectos económicos de la navegación por satélite", "Las operaciones simultáneas en pistas paralelas", "La gestión de la seguridad operacional"], "ans": 1, "why": "La A es la Circular 247 y la C la Circular 207; la gestión de la seguridad operacional es el Anexo 19.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.3, p. 11", "note": ""}, {"n": 150, "stem": "Según el manual, EUROCONTROL es:", "opts": ["Una agencia de la Unión Europea con personalidad jurídica propia", "Un organismo especializado de las Naciones Unidas para Europa", "Una organización intergubernamental civil y militar dedicada a apoyar la aviación europea", "Una asociación sin ánimo de lucro de proveedores de servicios de navegación aérea"], "ans": 2, "why": "Es la Organización Europea para la Seguridad de la Navegación Aérea, creada en 1960. La A describe a EASA, la B a la OACI y la D se parece a CANSO.", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 151, "stem": "Además de su sede en Bruselas, ¿en qué países tiene EUROCONTROL oficinas especializadas según el manual?", "opts": ["Países Bajos, Francia y Luxemburgo", "Alemania, Francia y España", "Países Bajos, Alemania y Suiza", "Francia, Italia y Luxemburgo"], "ans": 0, "why": "«Su sede está en Bruselas, con oficinas especializadas en otros tres países europeos (Países Bajos, Francia y Luxemburgo).»", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 152, "stem": "El protocolo de adhesión de la Unión Europea al Convenio Revisado de EUROCONTROL se firmó el ___ y lo ratificó el parlamento español en ___.", "opts": ["13 de diciembre de 1960; 1997", "8 de octubre de 2002; 1997", "1 de enero de 1986; 2002", "8 de octubre de 2002; 2016"], "ans": 3, "why": "Firmado el 8 de oc
