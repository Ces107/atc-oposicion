 "why": "BOE n.º 122, de 20 de mayo de 2004; deroga y sustituye al Convenio de Varsovia (12 de octubre de 1929). El de 23 de septiembre de 1971 es el otro Convenio de Montreal (actos ilícitos) y 1975, el protocolo de Montreal que modificó Varsovia.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 297, "stem": "El Convenio de Montreal de 23 de septiembre de 1971 trata de:", "opts": ["La unificación de ciertas reglas sobre el transporte aéreo internacional", "La regulación de daños a terceros", "La represión de actos ilícitos contra la seguridad de la aviación civil", "Las infracciones y ciertos actos cometidos a bordo de aeronaves"], "ans": 2, "why": "BOE n.º 9, de 10 de enero de 1974. La A es el Convenio de Montreal de 1999, la B el de Roma de 1933 y la D el de Tokio de 1963.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 298, "stem": "Según el manual, el Convenio de Varsovia de 1929 fue modificado por varios protocolos. ¿Cuál NO es uno de ellos?", "opts": ["El de Bruselas (1938)", "El de La Haya (1955)", "El de Guadalajara (1961)", "El de Montreal (1975)"], "ans": 0, "why": "Bruselas (1938) es uno de los protocolos adicionales del Convenio de Roma de 1933.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, pp. 35-36", "note": ""}, {"n": 299, "stem": "¿Qué convenio trata de las infracciones y ciertos actos cometidos a bordo de aeronaves?", "opts": ["El Convenio de La Haya de 1971", "El Convenio de Roma de 1933", "El Convenio de Montreal de 1971", "El Convenio de Tokio de 1963"], "ans": 3, "why": "BOE n.º 308, de 25 de octubre de 1969.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 300, "stem": "Según el manual, el Convenio de La Haya de 16 de diciembre de 1971 trata de:", "opts": ["La represión de actos ilícitos contra la seguridad de la aviación civil", "El delito de interferencia y represión del apoderamiento ilícito de aeronaves", "Las infracciones cometidas a bordo de aeronaves", "La regulación de daños a terceros"], "ans": 1, "why": "BOE n.º 13, de 15 de enero de 1973. La A es el Convenio de Montreal de 1971.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 301, "stem": "¿Qué convenio regula los daños a terceros y fue modificado por sus protocolos adicionales de Bruselas (1938), Roma (1952) y Montreal (1978)?", "opts": ["El Convenio de Varsovia de 1929", "El Convenio de Tokio de 1963", "El Convenio de Roma de 1933", "El Convenio de Bruselas de 1960"], "ans": 2, "why": "El protocolo de Roma es de 7 de octubre de 1952.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 302, "stem": "¿De qué fecha es el Convenio de Bruselas relativo a la seguridad de la navegación aérea «EUROCONTROL»?", "opts": ["13 de diciembre de 1960", "24 de marzo de 1992", "8 de octubre de 2002", "26 de junio de 1997"], "ans": 0, "why": "El 26 de junio de 1997 es la fecha del BOE n.º 152 que lo publica; el 24 de marzo de 1992, el Tratado sobre cielos abiertos; el 8 de octubre de 2002, el protocolo de adhesión de la UE.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 303, "stem": "¿Qué reglamento comunitario afecta a la negociación de los convenios bilaterales, al otorgar a la UE la facultad de negociar con terceros Estados en las materias con competencias transferidas?", "opts": ["Reglamento 549/2004", "Reglamento 550/2004", "Reglamento 2150/2005", "Reglamento 847/2004"], "ans": 3, "why": "Por ejemplo, en tarifas. El 549/2004 es el reglamento marco del SES, el 550/2004 el de prestación de servicios y el 2150/2005 el de FUA.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 304, "stem": "Según el manual, los convenios bilaterales entre un Estado miembro y otro país:", "opts": ["Prevalecen sobre los reglamentos comunitarios", "Quedan limitados a la regulación de servicios extracomunitarios", "Solo regulan las tarifas de los servicios aéreos", "Necesitan la aprobación del Consejo de la OACI"], "ans": 1, "why": "Regulan rutas, capacidad, número de compañías designadas y sus requisitos, tarifas, etc.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 305, "stem": "En la tabla de libertades del aire del manual, ¿qué libertades se agrupan como «técnicas»?", "opts": ["De la 1.ª a la 3.ª", "De la 1.ª a la 5.ª", "La 1.ª y la 2.ª", "La 8.ª y la 9.ª"], "ans": 2, "why": "Técnicas: 1.ª (sobrevuelo) y 2.ª (escala técnica). Comerciales: 3.ª a 5.ª. Otras libertades: 6.ª a 9.ª.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 306, "stem": "En la tabla de libertades del aire del manual, ¿qué libertades se agrupan como «comerciales»?", "opts": ["De la 3.ª a la 5.ª", "De la 3.ª a la 7.ª", "La 3.ª y la 4.ª", "De la 3.ª a la 9.ª"], "ans": 0, "why": "La 6.ª y la 7.ª no son «comerciales» en la tabla, sino «otras libertades», junto con la 8.ª y la 9.ª.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 307, "stem": "En la tabla de libertades del aire del manual, la sexta y la séptima libertad se agrupan como:", "opts": ["Técnicas", "Comerciales", "De cabotaje", "Otras libertades"], "ans": 3, "why": "«Otras libertades» comprende de la 6.ª a la 9.ª.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 308, "stem": "La cuarta libertad del aire (Libertad de Transporte al Interior) es el derecho de una aeronave del Estado A a:", "opts": ["Desembarcar en el Estado B pasajeros, correo y carga tomados en el Estado A", "Embarcar en el Estado B pasajeros, correo y carga con destino al Estado A", "Embarcar en el Estado B tráfico con destino a un tercer Estado C", "Aterrizar en el Estado B por razones técnicas no comerciales"], "ans": 1, "why": "La A es la tercera (Transporte al Exterior), la C la quinta y la D la segunda.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 309, "stem": "¿Cómo llama el manual a la quinta libertad del aire?", "opts": ["Libertad de Transporte Externo-Interno", "Libertad de Transporte Externo", "Libertad de Transporte Externo Consecutivo", "Libertad de Cabotaje Consecutivo"], "ans": 2, "why": "Transporte Externo-Interno es la sexta, Transporte Externo la séptima y Cabotaje Consecutivo la octava.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 310, "stem": "Una aeronave del Estado A aterriza en el Estado B solo para repostar combustible, sin embarcar ni desembarcar tráfico. ¿Qué libertad ejerce?", "opts": ["La segunda", "La primera", "La tercera", "La quinta"], "ans": 0, "why": "La segunda libertad (Escala Técnica) permite aterrizar en B por razones técnicas no comerciales: repostar, mantenimiento, emergencias, etc.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 311, "stem": "¿Qué libertad del aire da a una aeronave del Estado A el derecho a efectuar transporte comercial entre dos Estados B y C enteramente fuera de su territorio?", "opts": ["La quinta", "La sexta", "La octava", "La séptima"], "ans": 3, "why": "Séptima libertad (Transporte Externo). La sexta exige hacer escala en el propio territorio.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 312, "stem": "La octava libertad (Cabotaje Consecutivo) se diferencia de la novena (Cabotaje autónomo) en que en la octava el servicio de cabotaje en el otro Estado:", "opts": ["Se limita al transporte de carga y correo", "Parte o culmina en el país al que pertenece la línea aérea", "Exige una escala técnica en un tercer Estado", "Solo puede hacerse entre aeropuertos de interés general"], "ans": 1, "why": "La octava permite el cabotaje en otro Estado «partiendo (o culminando el servicio) en el país al que pertenece la línea aérea»; la novena, el cabotaje en otro Estado sin esa condición.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 313, "stem": "Según el manual, el cabotaje consiste en:", "opts": ["El transporte entre dos Estados extranjeros haciendo escala en el Estado propio", "El sobrevuelo de un Estado sin aterrizar en él", "El transporte aéreo de personas, mercancías o equipajes entre lugares del territorio de un Estado sin abandonarlo", "El transporte entre el Estado propio y un tercer Estado como continuación de un vuelo"], "ans": 2, "why": "Es la nota de la tabla de libertades. La A es la sexta libertad, la B la primera y la D la quinta.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 314, "stem": "¿Qué libertad del aire otorga a una aeronave del Estado A el derecho de desembarcar en el Estado B pasajeros, correo y carga tomados en el territorio del Estado A?", "opts": ["La tercera", "La cuarta", "La quinta", "La sexta"], "ans": 0, "why": "Tercera libertad (Transporte al Exterior); la cuarta es el camino inverso, de B hacia A.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 315, "stem": "Según el manual, la liberalización comunitaria del transporte aéreo, por la que se aplicarían las normas sobre defensa de la competencia en el sector, comenzó a concretarse:", "opts": ["Con el Tratado de la Comunidad Económica Europea de 1957", "Con la adhesión de España en 1986", "Con la propuesta del Cielo Único Europeo en 1999", "Al finalizar la década de 1980"], "ans": 3, "why": "El Tratado de la CEE de 1957 ya tenía entre sus objetivos una política común en el transporte, pero la liberalización comenzó a concretarse al finalizar la década de 1980.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 36", "note": ""}, {"n": 316, "stem": "¿Qué norma comunitaria vincula únicamente a sus destinatarios, aunque goza de primacía y de eficacia directa?", "opts": ["La decisión", "El reglamento", "La directiva", "La circular aeronáutica"], "ans": 0, "why": "El reglamento vincula a todos los Estados miembros; la directiva, a los Estados de la Unión o al Estado destinatario, y necesita transposición. La circular aeronáutica es una norma nacional.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 317, "stem": "Según el manual, el reglamento comunitario:", "opts": ["Vincula solo al Estado destinatario y necesita transposición", "Vincula a sus destinatarios, y su rango lo determina cada Estado", "Vincula a todos los Estados miembros y es directamente aplicable en toda la Unión", "Es una disposición de carácter secundario que aprueba la DGAC"], "ans": 2, "why": "Goza de primacía, es superior a cualquier norma de los Estados miembros y tiene eficacia directa en todo el territorio de la Unión.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 318, "stem": "¿De qué fecha es el Reglamento (CE) n.º 550/2004, relativo a la prestación de servicios de navegación aérea en el cielo único europeo?", "opts": ["20 de febrero de 2008", "10 de marzo de 2004", "17 de octubre de 2011", "1 de marzo de 2017"], "ans": 1, "why": "El 20 de febrero de 2008 es el Reglamento 216/2008, el 17 de octubre de 2011 el 1035/2011 y el 1 de marzo de 2017 el 2017/373.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 319, "stem": "Según el manual, el Reglamento de Ejecución (UE) 2017/373 deroga:", "opts": ["El Reglamento 550/2004 y los Reglamentos de Ejecución 1034/2011, 1035/2011 y 390/2013", "El Reglamento 216/2008 y los Reglamentos de Ejecución 1035/2011, 390/2013 y 2015/340", "El Reglamento 677/2011 y los Reglamentos de Ejecución 1034/2011, 1035/2011 y 2016/1377", "El Reglamento 482/2008 y los Reglamentos de Ejecución 1034/2011, 1035/2011 y 2016/1377"], "ans": 3, "why": "Además modifica (no deroga) el Reglamento 677/2011.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 320, "stem": "¿Qué reglamento modifica, sin derogarlo, el Reglamento de Ejecución (UE) 2017/373?", "opts": ["El Reglamento (UE) 677/2011", "El Reglamento (UE) 1035/2011", "El Reglamento (CE) 482/2008", "El Reglamento (UE) 2016/1377"], "ans": 0, "why": "Los otros tres los deroga, junto con el 1034/2011.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 321, "stem": "¿Qué reglamento, citado como ejemplo en la tabla de reglamentos comunitarios, establece un sistema de evaluación del rendimiento de los servicios de navegación aérea y de las funciones de red?", "opts": ["Reglamento de Ejecución (UE) 1035/2011", "Reglamento (UE) 2015/340", "Reglamento de Ejecución (UE) 390/2013", "Reglamento (CE) 550/2004"], "ans": 2, "why": "Es de 3 de mayo de 2013. No confundir con el 2019/317 (4.3.1), que establece el sistema de evaluación del rendimiento y de tarificación.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 322, "stem": "¿Qué dos reglamentos de la tabla de reglamentos comunitarios llevan fecha de 20 de febrero, en años distintos?", "opts": ["550/2004 y 1035/2011", "216/2008 y 2015/340", "390/2013 y 2017/373", "216/2008 y 390/2013"], "ans": 1, "why": "El 216/2008 es de 20 de febrero de 2008 y el 2015/340, de 20 de febrero de 2015. El 550/2004 es de 10 de marzo de 2004, el 1035/2011 de 17 de octubre de 2011, el 390/2013 de 3 de mayo de 2013 y el 2017/373 de 1 de marzo de 2017.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 323, "stem": "El Reglamento de Ejecución (UE) n.º 1035/2011, de 17 de octubre de 2011:", "opts": ["Crea la Agencia Europea de Seguridad Aérea", "Regula las licencias de los controladores de tránsito aéreo", "Establece el sistema de evaluación del rendimiento", "Establece requisitos comunes para la prestación de servicios de navegación aérea"], "ans": 3, "why": "Fue derogado después por el 2017/373. La A es el 216/2008, la B el 2015/340 y la C el 390/2013.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 324, "stem": "Según el manual, la directiva comunitaria:", "opts": ["Vincula a los Estados destinatarios y les deja elegir la forma y los medios", "Es directamente aplicable desde su publicación en el Diario Oficial", "Vincula únicamente a las personas destinatarias", "Tiene rango superior a la ley nacional sin necesidad de transposición"], "ans": 0, "why": "Su rango y efecto los determinan los Estados y necesita un mecanismo de transposición.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 325, "stem": "¿De qué fecha es la Directiva 2006/23/CE, relativa a la licencia comunitaria de controlador de tránsito aéreo?", "opts": ["20 de febrero de 2006", "10 de marzo de 2006", "5 de abril de 2006", "17 de octubre de 2006"], "ans": 2, "why": "Directiva del Parlamento Europeo y del Consejo de 5 de abril de 2006, único ejemplo de directiva del manual.", "src": "Manual 1 (nov. 2026), capítulo 4.2.2, p. 38", "note": ""}, {"n": 326, "stem": "Según el manual, las Circulares Aeronáuticas:", "opts": ["Tienen rango superior a las Órdenes Ministeriales", "Son disposiciones de carácter secundario que aprueba la DGAC", "Las aprueba AESA por delegación del Ministerio", "Son meras recomendaciones sin carácter obligatorio"], "ans": 1, "why": "Las aprueba la DGAC, tienen contenido técnico que completa y asegura la aplicación eficaz de las normas de seguridad y orden del tránsito y transporte aéreos, y son obligatorias para las actividades que enumera el manual.", "src": "Manual 1 (nov. 2026), capítulo 4.2.3.1, p. 39", "note": ""}, {"n": 327, "stem": "Las Circulares Aeronáuticas son obligatorias para quienes ejecuten actividades y presten servicios vinculados a varios ámbitos de la aviación civil. ¿Cuál NO figura en la lista del manual?", "opts": ["La formación del personal aeronáutico", "La gestión de los sistemas aeroportuarios y de navegación aérea", "Los trabajos aéreos y la aviación general y deportiva", "Las operaciones de la aviación militar"], "ans": 3, "why": "La lista es: formación del personal aeronáutico; diseño, producción, mantenimiento y explotación de aeronaves y productos; gestión de sistemas aeroportuarios y de navegación aérea; prestación de servicios para la navegación aérea; y transporte aéreo, trabajos aéreos, aviación general y deportiva.", "src": "Manual 1 (nov. 2026), capítulo 4.2.3.1, p. 39", "note": ""}, {"n": 328, "stem": "En la jerarquía del Derecho nacional que recoge el manual, las Circulares Aeronáuticas se sitúan:", "opts": ["Por debajo de las Órdenes Ministeriales y por encima de las Resoluciones de la DGAC", "Por debajo de las Resoluciones de la DGAC, en el último lugar", "Entre las Leyes y los Reales Decretos, por encima de las Órdenes", "Por encima de las Órdenes Ministeriales y por debajo de los Reales Decretos"], "ans": 0, "why": "Por orden de importancia: Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de la DGAC.", "src": "Manual 1 (nov. 2026), capítulo 4.2.3, p. 39", "note": ""}, {"n": 329, "stem": "¿Cuál es el objetivo del Reglamento (CE) 549/2004 según el manual?", "opts": ["Establecer requisitos comunes para una prestación segura y eficaz de servicios ANS", "Establecer las medidas de los sistemas de evaluación del rendimiento y de tarificación", "Establecer un marco regulador armonizado para la creación del SES", "Establecer normas comunes para la utilización flexible del espacio aéreo"], "ans": 2, "why": "Con el objetivo de reforzar la seguridad del tránsito aéreo, contribuir al desarrollo sostenible y mejorar el rendimiento global. La A es el 550/2004, la B el 2019/317 y la D el 2150/2005.", "src": "Manual 1 (nov. 2026), capítulo 4.3.1, pp. 39-40", "note": ""}, {"n": 330, "stem": "¿Qué reglamento establece un sistema de evaluación del rendimiento y de tarificación en el SES, dentro del apartado «Marco para la creación del Cielo Único Europeo»?", "opts": ["Reglamento (UE) 2019/123", "Reglamento (UE) 2019/317", "Reglamento (UE) 255/2010", "Reglamento (UE) 409/2013"], "ans": 1, "why": "Su objetivo es establecer las medidas para el funcionamiento de los sistemas de evaluación del rendimiento y de tarificación de los servicios ANS y funciones de red. El 2019/123 trata de las funciones de la red ATM.", "src": "Manual 1 (nov. 2026), capítulo 4.3.1, p. 40", "note": ""}, {"n": 331, "stem": "¿Qué reglamento regula la información previa que debe facilitarse con miras al establecimiento y modificación de un FAB?", "opts": ["Reglamento (CE) 2150/2005", "Reglamento (UE) 409/2013", "Reglamento (UE) 2021/116", "Reglamento (UE) 176/2011"], "ans": 3, "why": "Los Estados la facilitan a la Comisión, a AESA, a los demás Estados miembros y a las otras partes interesadas antes de notificar el FAB a la Comisión.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, p. 40", "note": ""}, {"n": 332, "stem": "Según el Reglamento (UE) 176/2011, ¿cuándo se considera modificado un FAB?", "opts": ["Cuando una modificación propuesta produce cambios en sus dimensiones definidas", "Cuando cambia el proveedor de servicios de navegación aérea designado", "Cuando se incorpora un nuevo Estado miembro al acuerdo que lo establece", "Cuando varía su sistema de tarificación o sus objetivos de rendimiento"], "ans": 0, "why": "Así lo precisa el resumen del manual.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, p. 40", "note": ""}, {"n": 333, "stem": "El Reglamento (UE) 409/2013 define los proyectos comunes a que se refiere el artículo 15 bis de:", "opts": ["El Reglamento (CE) 549/2004", "El Reglamento (UE) 2018/1139", "El Reglamento (CE) 550/2004", "El Convenio de Chicago"], "ans": 2, "why": "El 409/2013 trata de la definición de proyectos comunes, su gobernanza y los incentivos de apoyo a la ejecución del Plan Maestro ATM.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, p. 40", "note": ""}, {"n": 334, "stem": "¿Qué reglamento crea el Proyecto Común Uno (PC1) de apoyo a la ejecución del Plan Maestro ATM europeo?", "opts": ["Reglamento (UE) 409/2013", "Reglamento (UE) 2021/116", "Reglamento (UE) 2021/2085", "Reglamento (UE) 2019/123"], "ans": 1, "why": "El PC1 incluye seis funcionalidades ATM (AF 1 a AF 6). El 2021/2085 crea las empresas comunes de Horizonte Europa (SESAR 3).", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, pp. 40-41", "note": ""}, {"n": 335, "stem": "En el Proyecto Común Uno (PC1), la funcionalidad AF 1 es:", "opts": ["La integración y productividad de los aeropuertos", "La gestión colaborativa de la red", "La fase inicial del intercambio de información sobre trayectorias", "La gestión ampliada de llegadas e integración AMAN/DMAN en las TMA de alta densidad"], "ans": 3, "why": "La A es AF 2, la B AF 4 y la C AF 6.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, pp. 40-41", "note": ""}, {"n": 336, "stem": "¿Qué funcionalidad del PC1 es la «Gestión de la información del sistema en su conjunto»?", "opts": ["AF 5", "AF 4", "AF 6", "AF 2"], "ans": 0, "why": "AF 4 es la gestión colaborativa de la red, AF 6 el intercambio inicial de información sobre trayectorias y AF 2 la integración y productividad de los aeropuertos.", "src": "Manual 1 (nov. 2026), capítulo 4.3.2, p. 41", "note": ""}, {"n": 337, "stem": "En el resumen de normativa de la UE aplicable a ENAIRE, el Reglamento (UE) 2024/2803, relativo a la realización del Cielo Único Europeo, figura en el apartado:", "opts": ["Prestación de servicios de navegación aérea", "Normas comunes en aviación civil y constitución de EASA", "Organización y utilización del espacio aéreo", "Investigación de accidentes e incidentes"], "ans": 2, "why": "Su objetivo es reforzar la seguridad del tránsito aéreo, contribuir al desarrollo sostenible y mejorar el rendimiento global de la ATM y los ANS para el tránsito aéreo general en Europa.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 338, "stem": "¿Qué reglamento establece normas comunes para la utilización flexible del espacio aéreo (FUA) y en qué reglamento se definió ese concepto?", "opts": ["El 255/2010; el concepto se definió en el 549/2004", "El 2150/2005; el concepto se definió en el 551/2004", "El 551/2004; el concepto se definió en el 2150/2005", "El 2019/123; el concepto se definió en el 550/2004"], "ans": 1, "why": "El Reglamento (CE) 2150/2005 refuerza y armoniza dentro del SES el concepto FUA definido en el Reglamento (CE) 551/2004.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 339, "stem": "¿Cuál es el objetivo del Reglamento (UE) 255/2010 sobre gestión de afluencia de tránsito aéreo (ATFM)?", "opts": ["Establecer las reglas de las funciones de la red ATM y de la gestión de crisis", "Establecer el reglamento del aire y las disposiciones operativas comunes", "Establecer el sistema de evaluación del rendimiento y de tarificación", "Optimizar la capacidad disponible de la Red Europea ATM y mejorar los procesos ATFM"], "ans": 3, "why": "La A es el 2019/123, la B el 923/2012 (SERA) y la C el 2019/317.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 340, "stem": "¿A qué tránsito se aplica el Reglamento (UE) 923/2012 (SERA)?", "opts": ["Al tránsito aéreo general (GAT), en el ámbito de aplicación del Reglamento (CE) 551/2004", "Al tránsito aéreo operativo (OAT), en el ámbito de aplicación del Reglamento (CE) 551/2004", "Al tránsito aéreo general (GAT), solo en el espacio aéreo superior de la Unión", "Al tránsito aéreo general y al operativo, solo en el espacio aéreo controlado de la Unión"], "ans": 0, "why": "Se aplica a los usuarios y aeronaves dedicados a GAT que operen con destino, dentro o con origen en la Unión, y a las que tengan nacionalidad y matrícula de un Estado miembro, en cualquier espacio aéreo siempre que no infrinjan las normas del país sobrevolado.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 341, "stem": "Según el manual, el Reglamento SERA también es aplicable a:", "opts": ["Las organizaciones militares, de aduanas y de policía en sus vuelos", "Los fabricantes de aeronaves y de sus componentes y sistemas", "Las autoridades competentes, los ANSP, el Gestor de red y los operadores de aeródromos", "Solo los pilotos de aeronaves con matrícula de un Estado miembro"], "ans": 2, "why": "«También aplicable a las autoridades competentes de los Estados miembros, a los ANSPs, al Gestor de red, a los operadores de aeródromos y al personal de tierra dedicado a la operación de aeronaves.»", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 41", "note": ""}, {"n": 342, "stem": "¿Qué sección del Anexo de SERA trata del transpondedor SSR y de los transmisores ADS-B?", "opts": ["Sección 12", "Sección 13", "Sección 14", "Sección 15"], "ans": 1, "why": "La 12 son los servicios MET (observaciones e informes de aeronave por voz), la 14 la coordinación oral y la 15 CPDLC.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 343, "stem": "La sección 1 del «Reglamento del Aire» del Anexo de SERA trata de:", "opts": ["La aplicabilidad y el cumplimiento", "Las normas generales y anticolisión", "Los planes de vuelo", "Los vuelos sobre alta mar"], "ans": 3, "why": "La sección 2 es aplicabilidad y cumplimiento, la 3 normas generales y anticolisión y la 4 planes de vuelo.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 344, "stem": "¿Cuál de los siguientes NO es un capítulo de la sección 3 (Normas generales y anticolisión) del Anexo de SERA?", "opts": ["Planes de vuelo", "Protección de personas y propiedad", "Prevención de colisiones", "Hora"], "ans": 0, "why": "Los capítulos son: 1 protección de personas y propiedad, 2 prevención de colisiones, 3 señales y 4 hora. Los planes de vuelo son la sección 4.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 345, "stem": "¿Qué apéndice del Anexo de SERA contiene las tablas de niveles de crucero?", "opts": ["Apéndice 1", "Apéndice 2", "Apéndice 3", "Apéndice 4"], "ans": 2, "why": "Apéndice 1 señales, 2 globos libres no tripulados, 3 tablas de niveles de crucero, 4 clasificación de los espacios aéreos ATS, 5 requisitos ANS (observaciones por voz) y 6 modo de completar el plan de vuelo.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, pp. 42-43", "note": ""}, {"n": 346, "stem": "En el Anexo de SERA, la clasificación del espacio aéreo es la sección ___ y la clasificación de los espacios aéreos ATS (servicios suministrados y requisitos de vuelo) es el apéndice ___.", "opts": ["5; 3", "6; 4", "7; 4", "6; 2"], "ans": 1, "why": "La sección 5 es VMC, VFR, VFR especial e IFR y la 7, ATS; el apéndice 3 son las tablas de niveles de crucero y el 2, los globos libres no tripulados.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 347, "stem": "¿Qué sección del Anexo de SERA trata de los procedimientos de coordinación oral?", "opts": ["Sección 8", "Sección 11", "Sección 15", "Sección 14"], "ans": 3, "why": "La sección 8 es ATC, la 11 interferencia, emergencias e intercepción y la 15 CPDLC.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 348, "stem": "La sección 11 del Anexo de SERA trata de:", "opts": ["Interferencia, casos de emergencia e intercepción", "Servicio de alerta", "Servicio de información de vuelo (FIS)", "Control de tránsito aéreo (ATC)"], "ans": 0, "why": "La sección 8 es ATC, la 9 FIS y la 10 servicio de alerta.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 42", "note": ""}, {"n": 349, "stem": "¿Qué reglamento establece las reglas de las funciones de la red ATM y las normas para la gestión de las crisis de la red?", "opts": ["Reglamento (UE) 255/2010", "Reglamento (UE) 2019/317", "Reglamento (UE) 2019/123", "Reglamento (UE) 2023/203"], "ans": 2, "why": "La red incluye aeropuertos, estructuras de espacio aéreo e interfaces que las conectan, infraestructura y capacidades operativas de la EATMN.", "src": "Manual 1 (nov. 2026), capítulo 4.3.3, p. 43", "note": ""}, {"n": 350, "stem": "¿Cuál de los siguientes NO figura entre los objetivos del Reglamento (UE) 2018/1139 que recoge el manual?", "opts": ["Fomentar la aceptación mutua de certificados", "Fijar las tarifas de ruta de los servicios de navegación aérea", "Asistir a los Estados para garantizar una interpretación común y aplicación uniforme del Convenio de OACI", "Promover la I+D+i y la interoperabilidad técnica y operativa"], "ans": 1, "why": "Sus objetivos incluyen además un nivel elevado y uniforme de seguridad y protección, la libre circulación, la cooperación con terceros países, la protección medioambiental y las reglas de atribución de reglamentación, certificación y supervisión.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 43", "note": ""}, {"n": 351, "stem": "¿Qué reglamento establece los métodos de trabajo que debe aplicar EASA en las inspecciones de normalización?", "opts": ["Reglamento (UE) 139/2014", "Reglamento (UE) 376/2014", "Reglamento (UE) 2023/203", "Reglamento (UE) 628/2013"], "ans": 3, "why": "Su título se refiere a la supervisión de la aplicación del Reglamento (CE) 216/2008, pero su objetivo, en el manual, se refiere al Reglamento (UE) 2018/1139 (incoherencia del propio manual).", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 43", "note": ""}, {"n": 352, "stem": "Además de la certificación y supervisión de aeródromos, el Reglamento (UE) 139/2014 regula el procedimiento para la validez de las declaraciones de:", "opts": ["Los proveedores SDP (dirección en la plataforma)", "Los proveedores de servicios de información común", "Los proveedores de servicios de datos aeronáuticos", "Los operadores de aeronaves no tripuladas"], "ans": 0, "why": "«Se regula el procedimiento para la validez de las declaraciones de proveedores SDP, sus funciones y organización, así como las operaciones de dirección en la plataforma.»", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 43", "note": ""}, {"n": 353, "stem": "Según el manual, en España la autoridad nacional competente para certificar y supervisar los aeródromos y sus operadores conforme al Reglamento (UE) 139/2014 es:", "opts": ["Aena S.M.E., S.A.", "La DGAC", "AESA", "ENAIRE"], "ans": 2, "why": "El manual lo indica entre paréntesis: «(AESA para España)».", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 43", "note": ""}, {"n": 354, "stem": "¿En cuál de estas materias NO articula requisitos el Reglamento (UE) 2015/340, según el manual?", "opts": ["Competencia lingüística", "Tiempos de actividad y descanso de los controladores", "Formación, cualificación y aptitud", "Evaluación médica a cargo de médicos examinadores y centros médicos aeronáuticos"], "ans": 1, "why": "Los tiempos de actividad y descanso de los CTA los regula el Real Decreto 1001/2010.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 355, "stem": "Según el manual, el Reglamento (UE) 2015/340 establece los requisitos de un sistema de administración y gestión operado por las autoridades competentes de conformidad con:", "opts": ["El Plan Maestro ATM europeo", "El Plan Director de Navegación Aérea", "El Esquema Nacional de Seguridad", "El Programa de Seguridad Estatal de OACI"], "ans": 3, "why": "Además articula los requisitos de certificación de las organizaciones de formación.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 356, "stem": "Además de los ANSP, el Reglamento (UE) 2017/373 dispone los requisitos para la certificación y supervisión de las organizaciones proveedoras de:", "opts": ["Servicios DAT y del Gestor de Red (NM)", "Servicios meteorológicos y AFIS", "Servicios U-space y CISP", "Diseño y producción de sistemas ATM/ANS"], "ans": 0, "why": "La C corresponde al 2021/664 y la D al 2023/1769.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 357, "stem": "El Reglamento (UE) 2020/469, que modifica el 2017/373, adapta la provisión ATS a:", "opts": ["La 15.ª edición del Anexo 10 (Vol. II), la 7.ª del Anexo 11 y la 9.ª del Doc. 4444", "La 16.ª edición del Anexo 11, la 15.ª del Anexo 15 y la 7.ª del Doc. 4444", "La 7.ª edición del Anexo 10 (Vol. II), la 15.ª del Anexo 11 y la 16.ª del Doc. 4444", "La 16.ª edición del Anexo 10 (Vol. II), la 7.ª del Anexo 11 y la 15.ª del Doc. 4444"], "ans": 2, "why": "Anexo 10 (Vol. II) 7.ª edición, Anexo 11 15.ª edición y Doc. 4444 (PANS-ATM) 16.ª edición.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 358, "stem": "Según el manual, el Reglamento (UE) 2020/469 sustituye los requisitos de la provisión AIS de acuerdo con las SARPs de:", "opts": ["La 7.ª edición del Anexo 15 y la enmienda 9 del Anexo 3", "La 16.ª edición del Anexo 15 y la enmienda 77-B del Anexo 3", "La 15.ª edición del Anexo 11 y la enmienda 77-B del Anexo 10", "La 16.ª edición del Doc. 4444 y la enmienda 9 del Anexo 15"], "ans": 1, "why": "Así reflejan el estado actual de la técnica e incluyen disposiciones sobre la calidad de los datos e información aeronáuticos. La enmienda 9 es la del Doc. 4444 que cita el RD 426/2021.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 359, "stem": "¿A qué da contenido el Reglamento (UE) 2020/469 en el Anexo XI del 2017/373?", "opts": ["A los requisitos de los proveedores de servicios U-space y de información común", "A la notificación de sucesos de los proveedores ATS y su clasificación", "A los requisitos lingüísticos del personal AFIS y de dirección en plataforma", "A normas comunes para el diseño de estructuras del espacio aéreo y requisitos para proveedores FDP"], "ans": 3, "why": "Frase final del resumen del 2017/373 en el manual.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 360, "stem": "¿Qué reglamento establece los requisitos de utilización del espacio aéreo y los procedimientos operativos en relación con la navegación PBN?", "opts": ["Reglamento (UE) 2018/1048", "Reglamento (UE) 2018/1139", "Reglamento (UE) 2019/947", "Reglamento (UE) 2023/1768"], "ans": 0, "why": "El 2018/1139 son las normas comunes y EASA, el 2019/947 los UAS y el 2023/1768 la certificación de sistemas ATM/ANS.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 44", "note": ""}, {"n": 361, "stem": "Según el manual, el Reglamento (UE) 2019/947 sobre aeronaves no tripuladas NO aplica a:", "opts": ["Los operadores de UAS de la categoría abierta y de la categoría específica", "El personal y las organizaciones que participan en operaciones UAS civiles", "Las organizaciones con autoridad pública en actividades militares, de aduanas, policía o SAR", "Los UAS que vuelan dentro del espacio aéreo U-Space definido por los Estados"], "ans": 2, "why": "Establece disposiciones para la utilización de UAS, su personal y organizaciones, con esa exclusión expresa.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, pp. 44-45", "note": ""}, {"n": 362, "stem": "Según el manual, el marco regulador del U-Space del Reglamento (UE) 2021/664 está destinado a:", "opts": ["Los ANSP, los proveedores DAT y el Gestor de Red", "Los operadores UAS y los proveedores USSP y CISP", "Los fabricantes de UAS y las escuelas de pilotos", "Las organizaciones de diseño y producción de sistemas ATM/ANS"], "ans": 1, "why": "Dentro de las zonas geográficas de UAS definidas como espacio aéreo U-Space por los Estados miembros.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 45", "note": ""}, {"n": 363, "stem": "¿Qué reglamento establece requisitos para la gestión de los riesgos de seguridad de la información que puedan repercutir sobre la seguridad aérea?", "opts": ["Reglamento (UE) 2023/1768", "Reglamento (UE) 2023/1769", "Real Decreto 311/2022", "Reglamento (UE) 2023/203"], "ans": 3, "why": "Detectar y gestionar esos riesgos, detectar eventos e incidentes de seguridad de la información y responder a ellos. El RD 311/2022 es el Esquema Nacional de Seguridad, de las Administraciones públicas.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 45", "note": ""}, {"n": 364, "stem": "¿Qué reglamento establece normas detalladas para la certificación o declaración de conformidad del diseño de sistemas y componentes ATM/ANS?", "opts": ["Reglamento (UE) 2023/1768", "Reglamento (UE) 2023/1769", "Reglamento (UE) 2023/203", "Reglamento (UE) 2017/373"], "ans": 0, "why": "El 2023/1769 trata de la aprobación de las organizaciones de diseño y producción de esos sistemas y componentes.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 45", "note": ""}, {"n": 365, "stem": "El Reglamento (UE) 2023/1769 establece requisitos técnicos y procedimientos administrativos para:", "opts": ["La certificación de aeródromos y de sus operadores", "La notificación de sucesos en la aviación civil", "La aprobación de organizaciones de diseño y producción de sistemas y componentes ATM/ANS", "Las licencias de los controladores de tránsito aéreo"], "ans": 2, "why": "Sistemas y componentes sujetos a certificación. La certificación del diseño en sí es el 2023/1768.", "src": "Manual 1 (nov. 2026), capítulo 4.3.4, p. 45", "note": ""}, {"n": 366, "stem": "Según el manual, el Reglamento (UE) 996/2010 sobre investigación y prevención de accidentes e incidentes en la aviación civil:", "opts": ["Atribuye a EASA la investigación de todos los accidentes en la UE", "Crea una red europea de autoridades de investigación de accidentes e incidentes", "Establece una lista de clasificación de los sucesos de notificación obligatoria", "Determina las responsabilidades civiles derivadas de los accidentes"], "ans": 1, "why": "Fija normas comunes para investigar sin determinar responsabilidades y normas sobre la información de personas y productos peligrosos a bordo. La C es el 2015/1018.", "src": "Manual 1 (nov. 2026), capítulo 4.3.5, p. 45", "note": ""}, {"n": 367, "stem": "¿Qué reglamento establece una lista de clasificación de los sucesos en la aviación civil de notificación obligatoria?", "opts": ["Reglamento (UE) 376/2014", "Reglamento (UE) 996/2010", "Real Decreto 1088/2020", "Reglamento (UE) 2015/1018"], "ans": 3, "why": "El 376/2014 es el reglamento general de notificación de sucesos y el RD 1088/2020 lo desarrolla en España.", "src": "Manual 1 (nov. 2026), capítulo 4.3.6, p. 46", "note": ""}, {"n": 368, "stem": "El Reglamento (UE) 376/2014 tiene por objetivo:", "opts": ["Garantizar la notificación, recogida, análisis y difusión de la información sobre seguridad", "Establecer una red europea de autoridades de investigación de accidentes", "Clasificar los sucesos de la aviación civil de notificación obligatoria", "Mantener el sistema de notificación de sucesos establecido en AESA"], "ans": 0, "why": "La B es el 996/2010, la C el 2015/1018 y la D el RD 1088/2020.", "src": "Manual 1 (nov. 2026), capítulo 4.3.6, p. 46", "note": ""}, {"n": 369, "stem": "Según el manual, la Empresa Común SESAR 3 se financia con cargo al:", "opts": ["Presupuesto de EUROCONTROL", "Mecanismo Conectar Europa 2014-2020", "Marco Financiero Plurianual 2021-2027", "Programa Horizonte 2020"], "ans": 2, "why": "Creada por el Reglamento 2021/2085 hasta el 31 de diciembre de 2031, con sede en Bruselas.", "src": "Manual 1 (nov. 2026), capítulo 4.3.7, p. 46", "note": ""}, {"n": 370, "stem": "Según el manual, la Empresa Común SESAR 3 debe ser financiada conjuntamente por:", "opts": ["La UE y EUROCONTROL, a partes iguales entre ambas", "La UE, los miembros distintos de la UE y los socios contribuyentes", "Los Estados miembros de la UE y sus proveedores ANSP", "La Comisión Europea en exclusiva, con fondos propios"], "ans": 1, "why": "Mediante contribuciones financieras y contribuciones en especie a actividades operativas.", "src": "Manual 1 (nov. 2026), capítulo 4.3.7, p. 46", "note": ""}, {"n": 371, "stem": "Según el manual, las fuentes de financiación de los servicios de navegación aérea prestados por ENAIRE son fundamentalmente:", "opts": ["Las subvenciones del Estado y de la UE", "Las tasas aeroportuarias y los alquileres", "Los dividendos de Aena y la tarifa de aproximación", "La tarifa de ruta y la tasa de aproximación"], "ans": 3, "why": "Así se define el grupo «Regulación económica» del resumen de normativa nacional.", "src": "Manual 1 (nov. 2026), capítulo 4.4, p. 47", "note": ""}, {"n": 372, "stem": "Dentro de cada grupo del resumen de normativa nacional, ¿cómo se ordenan las normas?", "opts": ["Primero por su valor normativo y después por el orden cronológico de entrada en vigor", "Solo por orden cronológico de publicación", "Primero por orden alfabético y después por fecha", "Primero por orden cronológico y después por su valor normativo"], "ans": 0, "why": "Primero Leyes, después Reales Decretos y por último Órdenes ministeriales y Resoluciones; dentro de cada rango, por orden de entrada en vigor.", "src": "Manual 1 (nov. 2026), capítulo 4.4, p. 47", "note": ""}, {"n": 373, "stem": "En el resumen de normativa nacional, ¿qué grupo analiza las normas que regulan el funcionamiento de las principales instituciones que realizan funciones de provisión, certificación, designación y supervisión?", "opts": ["Normativa de primer nivel", "Supervisión, designación y certificación", "Marco institucional", "Operaciones y sistemas"], "ans": 2, "why": "«Normativa de primer nivel» son las leyes esenciales que fijan el marco general; «Supervisión, designación y certificación», los requisitos específicos de esas actividades; «Operaciones y sistemas», la normativa estrictamente técnica.", "src": "Manual 1 (nov. 2026), capítulo 4.4, pp. 46-47", "note": ""}, {"n": 374, "stem": "Según el resumen de la Ley 48/1960 de Navegación Aérea, los dueños y ocupantes de bienes subyacentes tienen derecho:", "opts": ["A prohibir el sobrevuelo de sus propiedades a baja altura", "Al resarcimiento de los daños derivados de su deber de soportar la navegación aérea", "A cobrar una tasa por cada sobrevuelo autorizado sobre sus bienes", "A ser consultados antes de aprobar cada ruta que pase sobre sus bienes"], "ans": 1, "why": "La ley pide un justo equilibrio entre los intereses de la economía nacional y los derechos de las personas afectadas.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 47", "note": ""}, {"n": 375, "stem": "¿Qué ley tiene por objetivo determinar las competencias de la AGE en aviación civil, regular la investigación técnica de accidentes e incidentes aéreos civiles y establecer el régimen de la inspección aeronáutica y de infracciones y sanciones?", "opts": ["Ley 48/1960", "Ley 9/2010", "Ley 18/2014", "Ley 21/2003"], "ans": 3, "why": "Ley 21/2003 de Seguridad Aérea, según la presenta la edición de noviembre de 2026 del manual.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 47", "note": ""}, {"n": 376, "stem": "Según el resumen de la Ley 9/2010, la designación de los proveedores civiles de servicios de tránsito aéreo se realiza por:", "opts": ["El Ministerio TMA, a propuesta del gestor aeroportuario", "AESA, a propuesta de ENAIRE", "La DGAC, a propuesta de AESA", "La Comisión Europea, a propuesta del Gestor de Red"], "ans": 0, "why": "La Ley 9/2010 regula la prestación ATS, las obligaciones de los proveedores civiles y determinadas condiciones laborales de los CTA.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 47", "note": ""}, {"n": 377, "stem": "¿Cuál de estas es una de las «facultades indisponibles» del proveedor de servicios de tránsito aéreo según la Ley 9/2010?", "opts": ["Designar a los proveedores civiles ATS de aeródromo", "Aprobar las circulares aeronáuticas de su ámbito", "Determinar la configuración operativa, las instalaciones y el personal necesario", "Fijar el importe de la tasa de aproximación"], "ans": 2, "why": "Las otras facultades son la selección y formación de CTA, la organización de turnos, horarios y descansos y la vigilancia del trabajo con imposición de sanciones.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 48", "note": ""}, {"n": 378, "stem": "Según la Ley 8/2011 de protección de infraestructuras críticas, los «operadores críticos» son:", "opts": ["Los controladores que trabajan en dependencias declaradas críticas", "Las entidades responsables de las inversiones o del funcionamiento diario de una infraestructura crítica", "Las compañías aéreas que operan en aeropuertos de interés general", "Las autoridades que inspeccionan las infraestructuras críticas"], "ans": 1, "why": "Definición literal del resumen de la Ley 8/2011.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 48", "note": ""}, {"n": 379, "stem": "Según el manual, la aplicación de la Ley 8/2011 complementa lo previsto en:", "opts": ["El Esquema Nacional de Seguridad del Real Decreto 311/2022", "El Programa Estatal de Seguridad Operacional del RD 995/2013", "El Reglamento (UE) 2023/203 sobre seguridad de la información", "El Programa Nacional de Seguridad de la Aviación Civil de la Ley 21/2003"], "ans": 3, "why": "El Programa Estatal de Seguridad Operacional (PESO) lo desarrolla el RD 995/2013.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 48", "note": ""}, {"n": 380, "stem": "¿Qué norma regula la seguridad de las redes y sistemas de información utilizados para la provisión de servicios esenciales y servicios digitales, con un sistema de notificación de incidentes?", "opts": ["Real Decreto-ley 12/2018", "Real Decreto 311/2022", "Ley 8/2011", "Reglamento (UE) 2023/203"], "ans": 0, "why": "Se aplica, entre otros, a los servicios esenciales de los sectores estratégicos definidos en el anexo de la Ley 8/2011.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 48", "note": ""}, {"n": 381, "stem": "Según el resumen de la Ley 4/1990, el ente «Aeropuertos Españoles y Navegación Aérea» se regirá por el ordenamiento jurídico privado en:", "opts": ["Todas sus actividades, sin excepción", "Sus funciones públicas de navegación aérea", "Sus relaciones patrimoniales y su contratación", "La selección de su personal controlador"], "ans": 2, "why": "Ente de Derecho Público con personalidad jurídica propia; en sus funciones públicas se ajusta a la Ley de Procedimiento Administrativo.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 48", "note": ""}, {"n": 382, "stem": "Según el resumen del Real Decreto-ley 13/2010, tras la creación de «Aena Aeropuertos, S. A.», la entidad pública empresarial «Aeropuertos Españoles y Navegación Aérea»:", "opts": ["Se extinguió y sus funciones pasaron al Ministerio de Fomento", "Continúa existiendo y conserva las competencias de navegación aérea", "Se transformó en una sociedad mercantil estatal cotizada", "Se fusionó con AESA y perdió su personalidad jurídica propia"], "ans": 1, "why": "Aena Aeropuertos asume las funciones de gestión y explotación de los servicios aeroportuarios.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 49", "note": ""}, {"n": 383, "stem": "¿Qué norma cambió la denominación de AENA a ENAIRE y estableció el Plan Director de navegación aérea?", "opts": ["El Real Decreto-ley 13/2010", "El Real Decreto 160/2023", "La Ley 9/2010", "La Ley 18/2014"], "ans": 3, "why": "Ley 18/2014 de medidas urgentes para el crecimiento, la competitividad y la eficiencia, de contenido heterogéneo.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 49", "note": ""}, {"n": 384, "stem": "¿Cuál de estos contenidos NO es una de las disposiciones de la Ley 18/2014 que afectan al Sistema de Navegación Aérea?", "opts": ["La creación de la Agencia Estatal de Seguridad Aérea", "El régimen de la red de aeropuertos de interés general", "La actualización del régimen de infracciones de la Ley 21/2003 en materia de gestión de afluencia", "La reorganización de competencias sobre espacio aéreo y bases aéreas abiertas al tráfico civil entre Defensa y Transportes"], "ans": 0, "why": "El Estatuto de AESA lo aprueba el RD 184/2008. La Ley 18/2014 también actualiza las funciones de la CIDETMA y cambia la denominación de AENA a ENAIRE.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 49", "note": ""}, {"n": 385, "stem": "Según el resumen del Real Decreto 184/2008, AESA es un organismo público asistido legalmente por:", "opts": ["Los servicios jurídicos de ENAIRE", "La DGAC", "La Abogacía del Estado", "El Consejo de Estado"], "ans": 2, "why": "Organismo público de Derecho público que actúa con autonomía, control y responsabilidad por resultados, adscrito al Ministerio de Transportes.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 49", "note": ""}, {"n": 386, "stem": "Según el resumen del Real Decreto 186/2008, AEMET es un organismo público adscrito al:", "opts": ["Ministerio de Transportes y Movilidad Sostenible", "Ministerio para la Transición Ecológica", "Ministerio de Defensa", "Ministerio de Ciencia"], "ans": 1, "why": "Su objeto es desarrollar, implantar y prestar los servicios meteorológicos de competencia del Estado.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, pp. 49-50", "note": ""}, {"n": 387, "stem": "Según el resumen del Real Decreto 253/2024, ENAIRE es una entidad pública empresarial adscrita a:", "opts": ["La Subsecretaría del Ministerio", "La Dirección General de Aviación Civil", "La Secretaría General de Transportes Aéreo y Marítimo", "La Secretaría de Estado de Transportes y Movilidad Sostenible"], "ans": 3, "why": "El mismo resumen sitúa a AESA a través de la Secretaría General de Transportes Aéreo y Marítimo. El RD 253/2024 desarrolla la estructura orgánica básica del Ministerio e instituye a la DGAC.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 50", "note": ""}, {"n": 388, "stem": "Según el resumen del Real Decreto 253/2024, AESA está adscrita al Ministerio de Transportes y Movilidad Sostenible a través de:", "opts": ["La Secretaría General de Transportes Aéreo y Marítimo", "La Subsecretaría del Ministerio", "La Dirección General de Aviación Civil", "La Secretaría de Estado de Transportes y Movilidad Sostenible"], "ans": 0, "why": "Así lo dice el resumen del RD 253/2024. Ojo: el apartado 3.4 dice que AESA está adscrita a la Secretaría de Estado de Transporte; si una pregunta no cita el apartado, conviene fijarse en qué otras opciones ofrece.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 50", "note": ""}, {"n": 389, "stem": "Según el Real Decreto 160/2023, a Enaire E.P.E. le corresponden los derechos derivados de:", "opts": ["Las tasas aeroportuarias de la red de Aena", "Su participación en EUROCONTROL", "Su participación accionarial en Aena, S.M.E., S.A.", "La concesión del aeropuerto de Luton"], "ans": 2, "why": "El RD 160/2023 aprueba el Estatuto de ENAIRE y define su régimen jurídico y económico-patrimonial, objeto, funciones, organización y funcionamiento.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 50", "note": ""}, {"n": 390, "stem": "Según el Real Decreto 160/2023, Enaire E.P.E. puede promocionar o participar en sociedades mercantiles:", "opts": ["Libremente, sin autorización", "Previa conformidad del Ministerio TMA", "Solo si lo aprueba la Comisión Europea", "Solo en el extranjero"], "ans": 1, "why": "Frase del régimen jurídico del Estatuto; ENAIRE es un organismo público adscrito al Ministerio TMA.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 50", "note": ""}, {"n": 391, "stem": "Según el Real Decreto 160/2023, en los ámbitos de navegación aérea y estructuración del espacio aéreo, ¿cuál de estas funciones ejerce Enaire E.P.E.?", "opts": ["La certificación de los proveedores civiles de servicios ATM/ANS", "La aprobación de las circulares aeronáuticas", "La investigación técnica de los incidentes ATM", "El ejercicio de funciones en materia ATFM y ASM"], "ans": 3, "why": "Es la función iii de la lista i-xiv. La certificación la regula el RD 515/2020 (AESA), las circulares son de la DGAC y la investigación técnica, de la CIAIAC.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, pp. 50-51", "note": ""}, {"n": 392, "stem": "En el Real Decreto 160/2023, las propuestas de modificación o creación de estructuras de espacio aéreo y su clasificación aparecen dos veces. ¿Cómo se distinguen?", "opts": ["Entre las funciones figuran las distintas de FABs; entre los servicios, las asociadas a FABs", "Entre las funciones figuran las asociadas a FABs; entre los servicios, las distintas de FABs", "Las funciones se refieren al espacio aéreo superior y los servicios, al inferior", "Las funciones son civiles y los servicios, militares"], "ans": 0, "why": "Función iv: estructuras «distintos de FABs»; servicio f): estructuras «asociados a FABs». El servicio g) añade las propuestas de procedimientos de vuelo asociados a FABs.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, pp. 51-52", "note": ""}, {"n": 393, "stem": "¿Cuál de los siguientes NO figura entre los servicios de Enaire E.P.E. según el Real Decreto 160/2023?", "opts": ["Prestación AIS y AIP en nombre del Estado", "Prestación CNS", "Prestación de los servicios meteorológicos aeronáuticos", "Prestación ATS de aeródromo y SDP que le correspondan"], "ans": 2, "why": "Los servicios son: ATS de área y aproximación, FIS, alerta y asesoramiento; AIS y AIP; CNS; ATS de aeródromo y SDP; sistemas ANS; y propuestas de estructuras y procedimientos asociados a FABs. Los servicios meteorológicos son de AEMET.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, pp. 51-52", "note": ""}, {"n": 394, "stem": "Según el Real Decreto 160/2023, ¿quién propone el Plan Director de Navegación Aérea?", "opts": ["La DGAC", "Enaire E.P.E.", "AESA", "La CIDETRA"], "ans": 1, "why": "Función xiii: «Propuesta del Plan Director de Navegación aérea y elaboración de informes sobre instrumentos de ordenación afectos». El Plan Director lo estableció la Ley 18/2014.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 51", "note": ""}, {"n": 395, "stem": "¿Qué norma crea y regula la Comisión Interministerial Defensa-Transportes (CIDETRA)?", "opts": ["El Real Decreto 1342/2003", "La Ley 48/1960", "El Real Decreto 905/1991", "La Orden de 8 de noviembre de 1979"], "ans": 3, "why": "El RD 1342/2003 modificó la CIPAI.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 52", "note": ""}, {"n": 396, "stem": "Según la Orden de 8 de noviembre de 1979, la competencia de la CIDETRA sobre las materias que enumera es de:", "opts": ["Estudio e informe", "Aprobación definitiva", "Inspección y sanción", "Certificación"], "ans": 0, "why": "«Competencia. Estudio e informe de las siguientes materias», de la a) a la l).", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 52", "note": ""}, {"n": 397, "stem": "¿Qué norma acuerda el inicio del ejercicio efectivo de las funciones y obligaciones de gestión aeroportuaria por «Aena Aeropuertos, SA»?", "opts": ["Real Decreto-ley 13/2010", "Orden FOM/3352/2010", "Orden FOM/1525/2011", "Ley 18/2014"], "ans": 2, "why": "El RDL 13/2010 creó la sociedad; la Orden FOM/1525/2011 acuerda el inicio efectivo de sus funciones. La FOM/3352/2010 trata de los aeropuertos para seleccionar nuevos proveedores ATC de aeródromo.", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, pp. 52-53", "note": ""}, {"n": 398, "stem": "¿Qué ley regula los requisitos de validez y eficacia de los actos administrativos y el procedimiento administrativo común, incluidos el sancionador y el de reclamación de responsabilidad?", "opts": ["Ley 21/2003", "Ley 39/2015", "Ley 9/2010", "Ley 25/1998"], "ans": 1, "why": "Ley 39/2015 del Procedimiento Administrativo Común de las Administraciones Públicas, en el grupo «Supervisión y certificación».", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 399, "stem": "¿Qué Real Decreto completa el régimen jurídico para la aprobación de los cambios de espacio aéreo y de los procedimientos civiles de vuelo?", "opts": ["Real Decreto 311/2022", "Real Decreto 515/2020", "Real Decreto 1180/2018", "Real Decreto 310/2022"], "ans": 3, "why": "Desarrolla el Reglamento (UE) 2017/373 para el diseño y establecimiento o modificación de estructuras del espacio aéreo. El 311/2022 es el Esquema Nacional de Seguridad.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 400, "stem": "¿Qué Real Decreto regula el procedimiento de certificación de los proveedores civiles de servicios y funciones ATM/ANS y su control normativo continuado?", "opts": ["Real Decreto 515/2020", "Real Decreto 310/2022", "Real Decreto 98/2009", "Real Decreto 1133/2010"], "ans": 0, "why": "Desarrolla el Reglamento (UE) 2017/373: expedición, modificación, suspensión, limitación o revocación del certificado.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 401, "stem": "¿Qué Real Decreto aprueba el Reglamento de inspección aeronáutica?", "opts": ["Real Decreto 184/2008", "Real Decreto 862/2009", "Real Decreto 98/2009", "Real Decreto 995/2013"], "ans": 2, "why": "Aplicable a las inspecciones de AESA, directamente o por medio de organismos o sociedades que sean medio propio de la Administración.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 402, "stem": "¿Qué Real Decreto regula la provisión del servicio AFIS y los criterios para determinar la necesidad y suficiencia de su prestación?", "opts": ["Real Decreto 1238/2011", "Real Decreto 1001/2010", "Real Decreto 1516/2009", "Real Decreto 1133/2010"], "ans": 3, "why": "También regula los estudios aeronáuticos de seguridad y el régimen jurídico del AFIS. El 1238/2011 es el SDP.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53", "note": ""}, {"n": 403, "stem": "Según el resumen de la Orden FOM/3352/2010, la Ley 9/2010 reserva a ENAIRE:", "opts": ["Todos los servicios de tránsito aéreo, incluidos los de aeródromo", "La prestación ATS de control de área y de aproximación", "Solo los servicios ATS de aeródromo", "Los servicios AFIS de los aeródromos de uso público"], "ans": 1, "why": "Los servicios ATS de aeródromo pueden prestarlos otros proveedores certificados por una autoridad nacional de supervisión de la UE.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 54", "note": ""}, {"n": 404, "stem": "¿Qué determina la Orden FOM/3352/2010?", "opts": ["Los aeropuertos de ENAIRE en los que esta debe seleccionar otros proveedores ATS de aeródromo", "Las directrices de los planes de actuaciones inspectoras de AESA y su periodicidad", "El régimen de competencia lingüística del personal aeronáutico y del personal AFIS", "Los aeropuertos cuya gestión pasa de ENAIRE a la sociedad Aena Aeropuertos, S.A."], "ans": 0, "why": "ENAIRE valoró criterios como el tipo y volumen de tráfico, la complejidad de la dependencia y de la transición y las características del servicio. La B es la Orden FOM/922/2013 y la C la FOM/1146/2019.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 54", "note": ""}, {"n": 405, "stem": "¿Qué norma establece las directrices para determinar el contenido de los planes de actuaciones inspectoras de AESA, su periodicidad y su forma de aprobación y ejecución?", "opts": ["Real Decreto 98/2009", "Orden FOM/1146/2019", "Orden FOM/922/2013", "Ley 39/2015"], "ans": 2, "why": "Dentro de los ámbitos de la función inspectora de la Ley 21/2003. El RD 98/2009 aprueba el Reglamento de inspección aeronáutica.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 54", "note": ""}, {"n": 406, "stem": "El Real Decreto 1516/2009 establece disposiciones complementarias al Reglamento (UE) 2015/340 sobre la licencia y el ejercicio de la actividad de CTA y, además, en materia de:", "opts": ["Tiempos de actividad y descanso", "Competencia lingüística del personal AFIS", "Inspección aeronáutica", "Certificación de proveedores civiles de formación"], "ans": 3, "why": "Los tiempos de actividad y descanso son el RD 1001/2010.", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, p. 54", "note": ""}, {"n": 407, "stem": "¿Qué norma completa el régimen del personal aeronáutico en materia de competencia lingüística, incluidos el método de evaluación y los requisitos de los centros evaluadores?", "opts": ["Real Decreto 1516/2009", "Orden FOM/1146/2019", "Reglamento (UE) 2015/340", "Resolución de AESA de 11 de octubre de 2011"], "ans": 1, "why": "También regula el certificado de los centros, la anotación en la licencia de pilotos, CTA, alumnos, personal AFIS y SDP, y la validez de la certificación del personal AFIS y SDP.", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, pp. 54-55", "note": ""}, {"n": 408, "stem": "Según la Resolución de la Dirección de AESA de 11 de octubre de 2011, ¿antes de qué fecha debía AESA proceder de oficio al canje de las licencias, habilitaciones y anotaciones de los CTA?", "opts": ["15 de enero de 2012", "31 de diciembre de 2011", "11 de octubre de 2012", "1 de enero de 2012"], "ans": 0, "why": "El canje se hace en relación con el RD 1516/2009, solicitando a ENAIRE la información de los CTA a su servicio.", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, p. 55", "note": ""}, {"n": 409, "stem": "Según la misma Resolución de AESA de 11 de octubre de 2011, una vez efectuado el canje, AESA debía entregar las nuevas licencias:", "opts": ["Directamente a cada CTA en su domicilio", "A la DGAC, para su registro", "A ENAIRE, para que esta las entregara a los CTA a su servicio", "A los centros de formación certificados"], "ans": 2, "why": "Después, los CTA pueden solicitar nuevas anotaciones o modificaciones; se mantienen las atribuciones de que fueran titulares (disposición transitoria primera del RD 1516/2009).", "src": "Manual 1 (nov. 2026), capítulo 4.4.4, p. 55", "note": ""}, {"n": 410, "stem": "Según el resumen del Real Decreto 57/2002, el Reglamento de Circulación Aérea se aplica, dentro de la circulación aérea general:", "opts": ["A las aeronaves españolas y extranjeras solo mientras vuelan en espacio aéreo de soberanía española", "A las aeronaves extranjeras en espacio aéreo asignado a España, pero no a las españolas fuera de él", "Solo a las aeronaves que vuelan en espacio aéreo controlado español, sean españolas o extranjeras", "A las españolas en cualquier espacio si no se opone a las normas del Estado con jurisdicción, y a las extranjeras en espacio español o asignado a España"], "ans": 3, "why": "Regula el diseño, planificación y gestión del tráfico aéreo y los servicios y procedimientos de navegación aérea del tránsito aéreo general.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, p. 55", "note": ""}, {"n": 411, "stem": "¿Qué Real Decreto regula el servicio de dirección en plataforma (SDP) y completa el Manual del aeropuerto en lo que atañe a ese servicio?", "opts": ["Real Decreto 1133/2010", "Real Decreto 1238/2011", "Real Decreto 862/2009", "Real Decreto 1189/2011"], "ans": 1, "why": "Su fin es garantizar la operación segura de las aeronaves en las plataformas del aeropuerto. El 1133/2010 es el AFIS.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, p. 56", "note": ""}, {"n": 412, "stem": "Además de desarrollar el Reglamento (UE) 923/2012, el Real Decreto 1180/2018 establece el régimen de:", "opts": ["Restricciones de espacio aéreo, exenciones de franjas de salida ATFM y operaciones especiales", "Certificación de proveedores ATM/ANS y su control normativo continuado", "Servidumbres aeronáuticas de protección de la navegación aérea y su aprobación", "Notificación de sucesos de aviación civil en el sistema establecido en AESA"], "ans": 0, "why": "En el espacio aéreo español. La B es el RD 515/2020, la C el RD 369/2023 y la D el RD 1088/2020.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, p. 56", "note": ""}, {"n": 413, "stem": "El Real Decreto 426/2021, de 15 de junio, que modifica el Reglamento de Circulación Aérea en lo relativo a las pistas paralelas y las separaciones mínimas en salidas y llegadas, introduce conceptos de:", "opts": ["La 16.ª edición del Doc. 4444", "La enmienda 77-B del Anexo 3", "La 15.ª edición del Anexo 11", "La enmienda 9 del Doc. 4444"], "ans": 3, "why": "«Introduce conceptos de la enmienda 9 del Doc 4444 de OACI.» La 16.ª edición del Doc. 4444 es la que cita el Reglamento 2020/469.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, p. 56", "note": ""}, {"n": 414, "stem": "¿Qué Real Decreto desarrolla el régimen jurídico para la utilización civil de UAS y regula los UAS en actividades de aduanas, policía, búsqueda y salvamento, lucha contra incendios, control fronterizo o vigilancia costera?", "opts": ["Real Decreto 1180/2018", "Real Decreto 1088/2020", "Real Decreto 517/2024", "Real Decreto 369/2023"], "ans": 2, "why": "También modifica diversas normas, entre ellas la del Reglamento del aire y disposiciones operativas comunes para servicios y procedimientos ANS y la de notificación de sucesos.", "src": "Manual 1 (nov. 2026), capítulo 4.4.5, p. 56", "note": ""}, {"n": 415, "stem": "¿Qué Real Decreto regula las servidumbres aeronáuticas de protección de la navegación aérea?", "opts": ["Real Decreto 862/2009", "Real Decreto 369/2023", "Real Decreto 1189/2011", "Real Decreto 310/2022"], "ans": 1, "why": "Regula sus características, alcance y efectos y los procedimientos para aprobarlas; figura en «Seguridad operacional».", "src": "Manual 1 (nov. 2026), capítulo 4.4.6, p. 56", "note": ""}, {"n": 416, "stem": "¿Qué Real Decreto regula la investigación de los accidentes e incidentes de aviación civil, con la prevención como finalidad última y sin búsqueda de culpa?", "opts": ["Real Decreto 389/1998", "Real Decreto 995/2013", "Real Decreto 1088/2020", "Real Decreto 98/2009"], "ans": 0, "why": "El 995/2013 es el PESO, el 1088/2020 la notificación de sucesos y el 98/2009 la inspección aeronáutica.", "src": "Manual 1 (nov. 2026), capítulo 4.4.6, p. 56", "note": ""}, {"n": 417, "stem": "¿Qué Real Decreto desarrolla la regulación del Programa Estatal de Seguridad Operacional (PESO) para la Aviación Civil?", "opts": ["Real Decreto 389/1998", "Real Decreto 311/2022", "Real Decreto 1088/2020", "Real Decreto 995/2013"], "ans": 3, "why": "El PESO está previsto en la Ley 21/2003 de Seguridad Aérea.", "src": "Manual 1 (nov. 2026), capítulo 4.4.6, p. 56", "note": ""}, {"n": 418, "stem": "¿Qué Real Decreto desarrolla el Reglamento (UE) 376/2014 para mantener el sistema de notificación de sucesos de la aviación civil establecido en AESA?", "opts": ["Real Decreto 995/2013", "Real Decreto 389/1998", "Real Decreto 1088/2020", "Real Decreto 517/2024"], "ans": 2, "why": "Completa el régimen aplicable a la notificación de sucesos de aviación civil.", "src": "Manual 1 (nov. 2026), capítulo 4.4.6, p. 57", "note": ""}, {"n": 419, "stem": "Según el resumen del Real Decreto 311/2022 (Esquema Nacional de Seguridad), las medidas de seguridad del Anexo II se formalizan en:", "opts": ["Una «Declaración de Aplicabilidad» del responsable de seguridad", "Un certificado de conformidad expedido por AESA", "Un plan de actuaciones inspectoras aprobado por la DGAC", "Un informe vinculante de la DGAC sobre cada sistema"], "ans": 0, "why": "Las medidas son organizativas, operacionales y de protección; la norma fija además una metodología para determinar la categoría de seguridad de los sistemas.", "src": "Manual 1 (nov. 2026), capítulo 4.4.6, p. 57", "note": ""}, {"n": 420, "stem": "Según el resumen del Real Decreto 862/2009, ¿qué obligación del gestor certificado de un aeropuerto destaca el manual?", "opts": ["Prestar directamente los servicios de tránsito aéreo de aeródromo", "Elaborar y publicar las cartas aeronáuticas del aeropuerto", "Fijar las tasas aeroportuarias de los servicios que presta", "Cooperar y coordinarse con el proveedor de navegación aérea en seguridad operacional"], "ans": 3, "why": "El RD 862/2009 aprueba las normas técnicas de diseño y operación de aeródromos de uso público y el Reglamento de certificación y verificación de aeropuertos.", "src": "Manual 1 (nov. 2026), capítulo 4.4.7, p. 57", "note": ""}, {"n": 421, "stem": "¿Qué Real Decreto regula el procedimiento de emisión de los informes previos al establecimiento, modificación y apertura al tráfico de los aeródromos de competencia autonómica?", "opts": ["Real Decreto 862/2009", "Real Decreto 1189/2011", "Real Decreto 369/2023", "Real Decreto 1238/2011"], "ans": 1, "why": "También de los certificados de compatibilidad previstos en la Ley 21/2003 y de los informes a los instrumentos de planificación aeroportuaria autonómica.", "src": "Manual 1 (nov. 2026), capítulo 4.4.7, p. 58", "note": ""}, {"n": 422, "stem": "¿Qué norma aprueba las tarifas por el uso de la Red de Ayudas a la Navegación Aérea (Eurocontrol), actualizadas mediante Órdenes ministeriales según las decisiones de la Comisión Ampliada de Eurocontrol?", "opts": ["Ley 24/2001", "Ley 25/1998", "Decreto 1675/1972", "Acuerdo Multilateral de 1981"], "ans": 2, "why": "Sus Anexos contienen la tarifa y las fórmulas de los precios que percibe el Estado por cada vuelo que sobrevuela el espacio aéreo español.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, p. 58", "note": ""}, {"n": 423, "stem": "¿De qué fecha es el Acuerdo Multilateral relativo a las tarifas por ayudas a la navegación aérea?", "opts": ["12 de febrero de 1981", "13 de diciembre de 1960", "24 de marzo de 1992", "20 de febrero de 1981"], "ans": 0, "why": "El 13 de diciembre de 1960 es el Convenio de Bruselas (EUROCONTROL) y el 24 de marzo de 1992, el Tratado sobre cielos abiertos.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, p. 58", "note": ""}, {"n": 424, "stem": "El Acuerdo Multilateral de 1981 adopta una política común sobre las tarifas por las instalaciones y servicios de navegación aérea:", "opts": ["De aeródromo, en los aeropuertos de interés general", "De aproximación exclusivamente, en las TMA de los Estados firmantes", "Del espacio aéreo superior, por encima de un nivel de vuelo fijado", "En ruta (y, si se acuerda, de aproximación) en los FIR bajo su competencia"], "ans": 3, "why": "Frase del objetivo del Acuerdo en el manual.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, p. 58", "note": ""}, {"n": 425, "stem": "Según la Ley 25/1998, las tarifas por el uso de la red de ayudas a la navegación aérea se rigen por:", "opts": ["La Ley 24/2001, de Medidas Fiscales y Administrativas", "El Acuerdo Multilateral de 12 de febrero de 1981", "El Reglamento (UE) 2019/317", "La Ley 18/2014, de medidas urgentes"], "ans": 1, "why": "La Ley 25/1998 las cataloga como prestaciones patrimoniales de carácter público con naturaleza de tasa. La Ley 24/2001 regula la tarifa de aproximación.", "src": "Manual 1 (nov. 2026), capítulo 4.4.8, p. 58", "note": ""}, {"n": 426, "stem": "¿Qué ley tiene por objetivo evitar y mitigar los daños que produce la contaminación acústica, con incidencia en el diseño de procedimientos de vuelo?", "opts": ["Ley 42/2007", "Ley 21/2013", "Ley 37/2003", "Ley 7/2021"], "ans": 2, "why": "Ley 37/2003 del Ruido, en el grupo «Regulación ambiental».", "src": "Manual 1 (nov. 2026), capítulo 4.4.9, p. 60", "note": ""}, {"n": 427, "stem": "¿Qué ley es la norma omnicomprensiva del régimen jurídico básico para la conservación, uso sostenible, mejora y restauración del patrimonio natural y de la biodiversidad?", "opts": ["Ley 42/2007", "Ley 37/2003", "Ley 21/2013", "Ley 7/2021"], "ans": 0, "why": "Para ENAIRE destaca el vocabulario necesario para presentar una evaluación de impacto ambiental.", "src": "Manual 1 (nov. 2026), capítulo 4.4.9, p. 60", "note": ""}, {"n": 428, "stem": "¿Qué ley establece las bases que deben regir la evaluación ambiental de los planes, programas o proyectos que puedan tener efectos significativos sobre el medio ambiente?", "opts": ["Ley 42/2007", "Ley 7/2021", "Ley 37/2003", "Ley 21/2013"], "ans": 3, "why": "La evaluación ambiental es el proceso que analiza esos efectos antes de la adopción, aprobación o autorización del plan, programa o proyecto.", "src": "Manual 1 (nov. 2026), capítulo 4.4.9, p. 60", "note": ""}, {"n": 429, "stem": "La Ley 7/2021 de cambio climático y transición energética busca asegurar el cumplimiento de los objetivos de:", "opts": ["El Protocolo de Kioto", "El Pacto Verde Europeo", "El Acuerdo de París", "La Agenda 2030 de Naciones Unidas"], "ans": 2, "why": "El Acuerdo de París, publicado en el BOE en febrero de 2017. También fija objetivos de reducción de emisiones de gases de efecto invernadero, de energías renovables y de eficiencia energética.", "src": "Manual 1 (nov. 2026), capítulo 4.4.9, p. 60", "note": ""}, {"n": 430, "stem": "En la tabla de normativa de la UE en aviación, los acuerdos de servicio de transporte aéreo entre Estados miembros y países terceros pertenecen al campo:", "opts": ["Dimensión internacional", "Mercado interior", "Protección de la aviación", "Prestación de servicios y licencias"], "ans": 0, "why": "«Dimensión internacional» también incluye desarrollar la agenda de la política exterior comunitaria en el sector de la aviación.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 431, "stem": "¿Qué organismo es competente para el reconocimiento y la aceptación de los títulos, licencias, autorizaciones o certificados expedidos por otras autoridades y requeridos para el ejercicio de profesiones aeronáuticas?", "opts": ["La DGAC", "AESA", "ENAIRE", "EASA"], "ans": 1, "why": "Figura en el grupo «Licencias y registro» de las competencias de AESA, junto con la expedición, renovación, suspensión y revocación de títulos y la gestión del Registro de matrícula.", "src": "Manual 1 (nov. 2026), capítulo 3.4.1, p. 29", "note": ""}, {"n": 432, "stem": "La protección de las infraestructuras críticas se regula en la:", "opts": ["Ley 9/2010", "Ley 8/2011", "Ley 21/2003", "Ley 18/2014"], "ans": 1, "why": "El manual recoge la «Ley 8/2011 que establece medidas para la protección de infraestructuras críticas». La Ley 9/2010 regula la prestación ATS, la 21/2003 es la de Seguridad Aérea y la 18/2014 la de medidas urgentes para el crecimiento. Pregunta de examen real (2026): se preguntó qué ley protege las infraestructuras críticas, con otras leyes del sector como distractores.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 48", "note": ""}, {"n": 433, "stem": "¿Qué significan las siglas ESARR?", "opts": ["European Safety and Airspace Regulation Requirements", "EUROCONTROL Standard ATM Rules and Recommendations", "EUROCONTROL Safety Regulation Requirements", "European Safety Assessment of Regulated Routes"], "ans": 2, "why": "Las normas ESARR son los «EUROCONTROL Safety Regulation Requirements / Requerimientos reglamentarios de seguridad de Eurocontrol», principal mecanismo de armonización de la Comisión de Regulación de seguridad. Pregunta de examen real (2026, reserva): se pidió el desarrollo de la sigla ESARR, con variantes inventadas como distractores.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 13", "note": ""}, {"n": 434, "stem": "La función de CANSO es:", "opts": ["Ofrecer una plataforma mundial para impulsar los Servicios de Navegación Aérea civiles eficaces, seguros y rentables", "Ser el primer vehículo para la cooperación entre las aerolíneas en la promoción de un transporte aéreo seguro y económico", "Desarrollar a escala mundial una política aeroportuaria común para los aeropuertos miembros y presentarla ante los organismos", "Proporcionar un foro europeo para la resolución de problemas y la creación de estándares para la electrónica en la aviación"], "ans": 0, "why": "En el cuadro de organizaciones, la función de CANSO «es proporcionar una plataforma mundial para los clientes y aquéllos interesados en impulsar los Servicios de Navegación Aérea civiles (SNA), con el fin de prestar un servicio eficaz, seguro, eficiente y rentable». B es IATA, C es ACI y D es EUROCAE. Pregunta de examen real (2023): función de CANSO con las funciones de otras organizaciones del mismo cuadro como distractores.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 435, "stem": "El Derecho nacional en materia aeronáutica está compuesto por:", "opts": ["Leyes, Reales Decretos, Órdenes Ministeriales, Cartas aeronáuticas y Resoluciones de la DGAC", "Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de AESA", "Leyes, Reales Decretos, Circulares Aeronáuticas, Directivas y Resoluciones de la Comisión Europea", "Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de la DGAC"], "ans": 3, "why": "El Derecho nacional «está compuesto por orden de importancia» por Leyes, Reales Decretos, Órdenes Ministeriales, Circulares Aeronáuticas y Resoluciones de la Dirección General de Aviación Civil. Las cartas aeronáuticas no son normas, AESA no dicta esas resoluciones y las Directivas son Derecho comunitario. Pregunta de examen real (2023): composición del Derecho nacional, con un elemento cambiado en cada distractor.", "src": "Manual 1 (nov. 2026), capítulo 4.2.3, p. 39", "note": ""}, {"n": 436, "stem": "¿De qué organización forma parte el Network Manager Directorate?", "opts": ["EUROCONTROL", "EASA", "OACI", "RTCA"], "ans": 0, "why": "La Agencia, estructura ejecutiva de EUROCONTROL, se compone del Director General, Network Manager Directorate, Directorate Air Traffic Management, Directorate Pan-European Single Sky, Directorate Central Route Charges Office y el MUAC. Pregunta de examen real (2017): a qué organización pertenece el Network Manager Directorate.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 437, "stem": "Con el desdoblamiento de la autoridad aeronáutica (RD 184/2008), corresponde a AESA:", "opts": ["La formulación de la política estratégica en materia de aviación civil", "El ejercicio de las potestades inspectoras y sancionadoras", "La representación ante la Unión Europea en política de transporte aéreo", "La investigación técnica de los accidentes e incidentes de aviación civil"], "ans": 1, "why": "A AESA «compete el ejercicio de las potestades inspectoras y sancionadoras en materia de aviación civil». La política estratégica y la representación ante la UE son de la DGAC; la investigación de accidentes, de la CIAIAC. Pregunta de examen real (2017): competencia de AESA frente a las de la DGAC y la CIAIAC.", "src": "Manual 1 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 438, "stem": "La entidad pública empresarial ENAIRE es:", "opts": ["El certificador del control del tránsito aéreo, de la información aeronáutica y de las redes CNS", "El gestor del control del tránsito aéreo y el supervisor de la información aeronáutica y de las redes CNS", "El gestor del control del tránsito aéreo, de la información aeronáutica y de las redes CNS", "El supervisor del control del tránsito aéreo, de la información aeronáutica y de las redes CNS"], "ans": 2, "why": "ENAIRE «es el gestor del control del tránsito aéreo, de la información aeronáutica y de las redes de comunicación, navegación y vigilancia». Certificar y supervisar no son funciones suyas. Pregunta de examen real (2017): gestor frente a certificador.", "src": "Manual 1 (nov. 2026), capítulo 3.6, p. 32", "note": ""}, {"n": 439, "stem": "¿Cuál es la función de EUROCAE?", "opts": ["Armonizar e integrar los servicios de navegación aérea en Europa hacia un sistema ATM uniforme", "Realizar recomendaciones para la comunicación, navegación y vigilancia de la gestión del tráfico aéreo", "Garantizar los más altos niveles comunes de seguridad y de protección del medio ambiente de la aviación civil", "Proporcionar un foro europeo para resolver problemas y crear estándares para la electrónica en la aviación"], "ans": 3, "why": "EUROCAE «intentaba proporcionar un foro europeo para la resolución de problemas y creación de estándares para la electrónica en la aviación». A es la misión de EUROCONTROL, B la función de RTCA y C la misión de EASA. Pregunta de examen real (2017): función de EUROCAE con misiones de otros organismos como distractores.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 24", "note": ""}, {"n": 440, "stem": "¿Cómo se llama la octava libertad del aire?", "opts": ["Libertad de Cabotaje Consecutivo", "Libertad de Cabotaje autónomo", "Libertad de Transporte Externo Consecutivo", "Libertad de Transporte Externo-Interno"], "ans": 0, "why": "«Octava Libertad: Llamada Libertad de Cabotaje Consecutivo». La de Cabotaje autónomo es la novena, la de Transporte Externo Consecutivo la quinta y la de Transporte Externo-Interno la sexta. Pregunta de examen real (2017): nombre de la octava libertad.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 441, "stem": "¿Por qué reglamento se rige actualmente EASA?", "opts": ["Reglamento (UE) 2024/2803", "Reglamento (UE) 2018/1139", "Reglamento (UE) 2017/373", "Reglamento (UE) 376/2014"], "ans": 1, "why":
