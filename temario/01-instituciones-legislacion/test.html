tubre de 2002 y ratificado por el parlamento español en 2016. 1997 es el año en que España es miembro de EUROCONTROL y el 13 de diciembre de 1960, la fecha del Convenio de Bruselas.", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 153, "stem": "¿Cuál es la misión de EUROCONTROL según el manual?", "opts": ["Elaborar la legislación de seguridad aérea de la Unión Europea y dar apoyo técnico a la Comisión Europea", "Armonizar e integrar los servicios de navegación aérea en Europa, hacia un sistema ATM uniforme para usuarios civiles y militares", "Representar los intereses de los proveedores de servicios de navegación aérea en todo el mundo", "Velar por la aplicación del Convenio de Chicago y de sus anexos por los Estados de la región europea"], "ans": 1, "why": "Con el fin de lograr el desarrollo seguro, ordenado, rápido y económico del flujo de tráfico aéreo en Europa, minimizando el impacto medioambiental adverso. La A es tarea de EASA, la C de CANSO y la D de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.2.2, p. 12", "note": ""}, {"n": 154, "stem": "¿Cuál de los siguientes NO figura entre los objetivos y prioridades estratégicas de EUROCONTROL?", "opts": ["Continuar con la gestión eficiente de funciones paneuropeas como la función centralizada ATFCM", "Proporcionar control regional de los servicios de tráfico aéreo cuando lo soliciten los Estados", "La certificación de tipo de aeronavegabilidad de aeronaves, motores y componentes", "Asegurar el éxito del programa SESAR"], "ans": 2, "why": "La certificación de tipo es una tarea de EASA. EUROCONTROL también lidera el diseño de la futura red ATM y apoya las actividades de regulación ATM.", "src": "Manual 1 (nov. 2026), capítulo 2.2.3, p. 12", "note": ""}, {"n": 155, "stem": "Según el manual, la Comisión Permanente de EUROCONTROL aprueba, entre otros, el presupuesto anual y un programa de:", "opts": ["Cinco años", "Tres años", "Diez años", "Cuatro años"], "ans": 0, "why": "Aprueba el presupuesto anual, el programa de cinco años, las normas contractuales, financieras y de personal, y nombra al Director General.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 12", "note": ""}, {"n": 156, "stem": "¿Qué órgano de EUROCONTROL se encarga de supervisar el trabajo de la Agencia?", "opts": ["La Comisión Permanente", "La Comisión de Cuentas (Audit Board)", "El Director General", "El Consejo Provisional"], "ans": 3, "why": "El Consejo Provisional se encarga de la aplicación de la política general establecida por la Comisión Permanente y de supervisar el trabajo de la Agencia.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 157, "stem": "En la estructura ejecutiva de EUROCONTROL, ¿quién es el responsable de la gestión de la Agencia?", "opts": ["El Presidente de la Comisión Permanente", "El Director General", "El Director del MUAC", "El Comité de Coordinación del Consejo Provisional"], "ans": 1, "why": "La Agencia se compone del Director General («responsable de su gestión»), cuatro direcciones y el MUAC. Al Director General lo nombra la Comisión Permanente.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 158, "stem": "En la estructura consultiva de EUROCONTROL, la PRC (<em>Performance Review Commission</em>) es la:", "opts": ["Comisión de Regulación de seguridad", "Comisión de Cuentas", "Comisión de evaluación de resultados", "Comité Permanente de Finanzas"], "ans": 2, "why": "La Comisión de Regulación de seguridad es la SRC, la Comisión de Cuentas el Audit Board y el Comité Permanente de Finanzas el SCF.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 159, "stem": "¿Qué órgano consultivo de EUROCONTROL corresponde a las siglas MAB?", "opts": ["Junta de la Gestión de Tráfico Aéreo Militar", "Órgano Asesor de la Agencia", "Comité de partes interesadas Civil-Militar", "Junta de los Servicios de Navegación Aérea"], "ans": 0, "why": "MAB es <em>Military ATM Board</em>. El Órgano Asesor de la Agencia es el AAB, el Comité Civil-Militar el CMSC y la Junta de los Servicios de Navegación Aérea el ANSB.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 160, "stem": "¿Cuál de los siguientes NO pertenece a la estructura consultiva de EUROCONTROL?", "opts": ["La Comisión de Cuentas (Audit Board)", "La Auditoría Interna (Internal Audit)", "Los Consejos Supervisores (Supervisory Boards)", "La Directorate Central Route Charges Office"], "ans": 3, "why": "La Directorate Central Route Charges Office es una de las direcciones de la Agencia (estructura ejecutiva).", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 161, "stem": "En la estructura consultiva de EUROCONTROL, la ESAC es la:", "opts": ["Comisión de Regulación de seguridad", "Conferencia de Representantes de Personal ATM europeo", "Junta de los Servicios de Navegación Aérea", "Comité Permanente de Finanzas"], "ans": 1, "why": "ESAC es <em>European ATM Staff Representatives Conference</em>.", "src": "Manual 1 (nov. 2026), capítulo 2.2.4, p. 13", "note": ""}, {"n": 162, "stem": "Según el manual, el principal mecanismo de armonización puesto en marcha por la Comisión de Regulación de seguridad (SRC) de EUROCONTROL son:", "opts": ["Las normas y métodos recomendados (SARPs)", "Las Soluciones SESAR", "Las normas ESARR", "Los reglamentos de ejecución"], "ans": 2, "why": "Las ESARR son los <em>EUROCONTROL Safety Regulation Requirements</em> (requerimientos reglamentarios de seguridad de Eurocontrol). Las SARPs son de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 13", "note": ""}, {"n": 163, "stem": "Una vez aprobadas las ESARR:", "opts": ["Los Estados miembros deben incorporarlas a sus regulaciones internas y se recomienda a los no miembros que hagan lo mismo", "Son directamente aplicables en todos los Estados contratantes de la OACI, sin necesidad de incorporarlas", "Solo obligan a los proveedores de servicios que participan en el ANSB y que votaron a favor de ellas", "Se incorporan automáticamente a los Anexos del Convenio de Chicago como métodos recomendados"], "ans": 0, "why": "Así lo dice el apartado de normativa de EUROCONTROL.", "src": "Manual 1 (nov. 2026), capítulo 2.2.5, p. 13", "note": ""}, {"n": 164, "stem": "¿Qué ESARR trata del personal de los servicios ATM (<em>ATM Services' Personnel</em>)?", "opts": ["ESARR 3", "ESARR 1", "ESARR 6", "ESARR 5"], "ans": 3, "why": "ESARR 1 supervisión de la seguridad, 3 uso de SMS por los proveedores, 6 software en los sistemas funcionales ATM.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 14", "note": ""}, {"n": 165, "stem": "¿Qué ESARR trata del uso de sistemas de gestión de la seguridad (SMS) por los proveedores de servicios ATM?", "opts": ["ESARR 2", "ESARR 3", "ESARR 4", "ESARR 5"], "ans": 1, "why": "ESARR 3, <em>Use of Safety Management System by ATM Service Providers</em>. La 2 es la notificación de sucesos, la 4 el riesgo y la 5 el personal.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 14", "note": ""}, {"n": 166, "stem": "¿Qué pareja ESARR - materia es correcta?", "opts": ["ESARR 2 - <em>Software in ATM Functional Systems</em>", "ESARR 6 - <em>Risk Assessment and Mitigation in ATM</em>", "ESARR 4 - <em>Risk Assessment and Mitigation in ATM</em>", "ESARR 1 - <em>Reporting and Assessment of Safety Occurrences in ATM</em>"], "ans": 2, "why": "ESARR 1 es <em>Safety Oversight in ATM</em>, ESARR 2 <em>Reporting and Assessment of Safety Occurrences in ATM</em> y ESARR 6 <em>Software in ATM Functional Systems</em>.", "src": "Manual 1 (nov. 2026), capítulo 2.2.6, p. 14", "note": ""}, {"n": 167, "stem": "¿Quién desarrolló la EAD, la base de datos AIS a nivel europeo?", "opts": ["Los Estados miembros de EUROCONTROL", "La Comisión Europea, dentro del SES II", "EASA, con las autoridades nacionales de supervisión", "La OACI, a través de su Oficina de París"], "ans": 0, "why": "La EAD es la base de datos AIS desarrollada por los Estados miembros de EUROCONTROL para asegurar la calidad de los datos aeronáuticos y destinada a su uso compartido por todos los usuarios del espacio aéreo.", "src": "Manual 1 (nov. 2026), capítulo 2.2.7, p. 14", "note": ""}, {"n": 168, "stem": "Según el manual, España, como miembro de EUROCONTROL, pertenece y tiene representación en:", "opts": ["La Agencia, el MUAC y la Dirección del Gestor de Red (Network Manager Directorate)", "La Junta de los Servicios de Navegación Aérea y el Órgano Asesor de la Agencia", "La Comisión Permanente y el Consejo Provisional, y participa en el Comité de Coordinación de este", "La Comisión de Regulación de seguridad y la Comisión de evaluación de resultados"], "ans": 2, "why": "Además participa con expertos en los órganos consultivos. En el ANSB y el AAB participa ENAIRE.", "src": "Manual 1 (nov. 2026), capítulos 2.2.9-2.2.10, pp. 14-15", "note": ""}, {"n": 169, "stem": "En el ANSB de EUROCONTROL se coordina el punto de vista de proveedores de servicio de navegación aérea, aerolíneas, aeropuertos y militares. ¿Quiénes lo hacen sin derecho a voto?", "opts": ["Los aeropuertos", "Los militares", "Las aerolíneas", "Los proveedores de servicio"], "ans": 1, "why": "El manual precisa «Militares (estos últimos, sin derecho a voto)».", "src": "Manual 1 (nov. 2026), capítulo 2.2.10, p. 14", "note": ""}, {"n": 170, "stem": "¿Qué órgano de EUROCONTROL creó el ANSB como Consejo Asesor?", "opts": ["La Comisión Permanente", "El Director General de la Agencia", "La Comisión Europea", "El Consejo Provisional"], "ans": 3, "why": "El ANSB es el Consejo Asesor creado por el Consejo Provisional sobre los objetivos estratégicos, el plan de negocios y los presupuestos de EUROCONTROL.", "src": "Manual 1 (nov. 2026), capítulo 2.2.10, p. 14", "note": ""}, {"n": 171, "stem": "El AAB (<em>Agency Advisory Body</em>), en el que participa ENAIRE, es el órgano asesor de:", "opts": ["El Director General de la Agencia", "La Comisión Permanente", "El Comité de Cielo Único", "El Gestor de Red"], "ans": 0, "why": "Asesora al Director General en temas de objetivos estratégicos del Consejo Provisional y de operación de la red ATM europea; ENAIRE participa como Proveedor de Servicios de Navegación Aérea.", "src": "Manual 1 (nov. 2026), capítulo 2.2.10, p. 15", "note": ""}, {"n": 172, "stem": "Según el manual, la misión final de la Unión Europea consiste en:", "opts": ["La creación de un sistema uniforme de gestión del tráfico aéreo para usuarios civiles y militares", "Garantizar los más altos niveles comunes de seguridad de la aviación civil", "La convergencia política y económica del continente mediante la libre circulación de mercancías, capitales, personas y servicios", "La armonización y normalización de los métodos de operación de los servicios aéreos"], "ans": 2, "why": "La A es la misión de EUROCONTROL, la B de EASA y la D de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.3.2, p. 15", "note": ""}, {"n": 173, "stem": "¿Qué dos libertades incluye el objetivo «económico» de la UE en materia de transporte y navegación aérea?", "opts": ["Libertad de sobrevuelo y libertad de escala técnica", "Libertad de acceso al mercado y libertad de tarifas", "Libertad de establecimiento y libertad de cabotaje", "Libertad de circulación de pilotos y de aeronaves"], "ans": 1, "why": "Libertad de acceso al mercado y libertad de tarifas en el campo de los transportes aéreos. Sobrevuelo y escala técnica son libertades del aire.", "src": "Manual 1 (nov. 2026), capítulo 2.3.3, p. 15", "note": ""}, {"n": 174, "stem": "¿Cuál de los siguientes NO es uno de los cuatro objetivos principales de la UE en transporte y navegación aérea que recoge el manual?", "opts": ["Desarrollo e implantación de las redes transeuropeas del transporte", "Desarrollo de las políticas de seguridad", "Impulso de la investigación y desarrollo", "Gestión directa de los aeropuertos de interés general"], "ans": 3, "why": "Los cuatro son: económicos (acceso al mercado y tarifas), redes transeuropeas, políticas de seguridad (operacional y contra actos de interferencia ilícita, entre otras) e investigación y desarrollo.", "src": "Manual 1 (nov. 2026), capítulo 2.3.3, pp. 15-16", "note": ""}, {"n": 175, "stem": "Según la nota del manual, la red transeuropea de transporte es:", "opts": ["Un conjunto planificado de redes prioritarias de transporte para facilitar la comunicación de personas y mercancías en toda la UE", "Un bloque de espacio aéreo basado en exigencias operativas, con independencia de las fronteras nacionales", "La red ATM europea de altas prestaciones que persigue el programa SESAR", "La red de ayudas a la navegación aérea cuyas tarifas se cobran a cada vuelo"], "ans": 0, "why": "La B es la definición de bloque funcional de espacio aéreo (FAB) de la otra nota del manual.", "src": "Manual 1 (nov. 2026), capítulo 2.3.3, nota 1, p. 15", "note": ""}, {"n": 176, "stem": "Según el manual, el transporte aéreo es el medio de transporte que experimenta mayor crecimiento, pero debe afrontar:", "opts": ["La escasez de controladores de tránsito aéreo", "La subida del precio del combustible", "El problema de la saturación de sus infraestructuras", "La competencia del ferrocarril de alta velocidad"], "ans": 2, "why": "Por eso la UE pretende modernizar y adaptar las infraestructuras al creciente flujo de pasajeros, reforzando sus derechos y su seguridad, y trabaja para unificar el cielo europeo.", "src": "Manual 1 (nov. 2026), capítulo 2.3.3, pp. 15-16", "note": ""}, {"n": 177, "stem": "Según el manual, la introducción de tecnologías que favorecen la gestión óptima del tráfico permite conciliar:", "opts": ["La capacidad, la puntualidad y el precio de los billetes", "La rentabilidad económica, la seguridad y el respeto del medio ambiente", "Los intereses civiles, militares y deportivos", "La soberanía nacional, la eficiencia y la libre competencia"], "ans": 1, "why": "Frase literal del apartado de objetivos de la UE (impulso de la investigación y desarrollo).", "src": "Manual 1 (nov. 2026), capítulo 2.3.3, p. 16", "note": ""}, {"n": 178, "stem": "¿Qué institución de la UE está constituida por ministros de cada país, en función del tema que se vaya a tratar?", "opts": ["El Consejo Europeo", "La Comisión Europea", "El Parlamento Europeo", "El Consejo de la Unión Europea"], "ans": 3, "why": "El Consejo de la UE representa a los Gobiernos, adopta la legislación europea y coordina las políticas. El Consejo Europeo lo forman los Jefes de Estado o de Gobierno, el presidente de la Comisión y el alto representante.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 179, "stem": "¿Qué institución de la UE está constituida por un equipo de comisarios, uno por cada país, y vela por los intereses generales de la Unión proponiendo legislación y comprobando su cumplimiento?", "opts": ["La Comisión Europea", "El Consejo de la Unión Europea", "El Tribunal de Cuentas Europeo", "El Consejo Europeo"], "ans": 0, "why": "La Comisión también aplica las políticas y el presupuesto de la UE.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 180, "stem": "Según el manual, el Parlamento Europeo es un órgano elegido por sufragio directo con responsabilidades:", "opts": ["Ejecutivas, judiciales y monetarias", "Consultivas y de representación regional", "Legislativas, de supervisión y presupuestarias", "Diplomáticas y de política exterior"], "ans": 2, "why": "Está constituido por 720 eurodiputados. La política exterior la dirige el SEAE y la representación regional corresponde al Comité Europeo de las Regiones.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 181, "stem": "¿Qué órgano consultivo de la UE representa a los entes regionales y locales de Europa?", "opts": ["El Comité Económico y Social Europeo (CESE)", "El Comité Europeo de las Regiones (CDR)", "El Servicio Europeo de Acción Exterior (SEAE)", "El Supervisor Europeo de Protección de Datos (SEPD)"], "ans": 1, "why": "El CESE representa a las organizaciones de trabajadores y empresarios y a otros grupos de interés.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 182, "stem": "¿Qué órgano consultivo de la UE representa a las organizaciones de trabajadores y empresarios y a otros grupos de interés?", "opts": ["El Comité Europeo de las Regiones", "El Defensor del Pueblo Europeo", "El Banco Europeo de Inversiones", "El Comité Económico y Social Europeo"], "ans": 3, "why": "El Comité Europeo de las Regiones representa a los entes regionales y locales.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 183, "stem": "¿Qué organismo de la UE concede financiación para proyectos que contribuyan a lograr los objetivos de la UE, tanto dentro como fuera de ella?", "opts": ["El Banco Europeo de Inversiones (BEI)", "El Banco Central Europeo (BCE)", "El Tribunal de Cuentas Europeo (TCE)", "La Comisión Europea"], "ans": 0, "why": "El BCE gestiona el euro y la política monetaria; el TCE comprueba que los fondos se perciben y utilizan correctamente.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 184, "stem": "¿Qué pareja institución de la UE - función es INCORRECTA?", "opts": ["Servicio Europeo de Acción Exterior - gestionar las relaciones diplomáticas de la UE", "Defensor del Pueblo Europeo - investigar las reclamaciones contra las instituciones de la UE", "Tribunal de Cuentas Europeo - garantizar que la legislación se interpreta igual en cada país", "Supervisor Europeo de Protección de Datos - velar por la intimidad en el tratamiento de datos personales"], "ans": 2, "why": "Garantizar la interpretación y aplicación uniforme de la legislación es función del TJUE; el Tribunal de Cuentas comprueba que los fondos se perciben y utilizan correctamente.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 185, "stem": "Según el manual, ¿qué institución gestiona el euro, mantiene la estabilidad de los precios y lleva adelante la política económica y monetaria de la UE?", "opts": ["El Banco Europeo de Inversiones", "El Banco Central Europeo", "El Consejo de la Unión Europea", "El Tribunal de Cuentas Europeo"], "ans": 1, "why": "El BEI concede financiación para proyectos.", "src": "Manual 1 (nov. 2026), capítulo 2.3.4, p. 17", "note": ""}, {"n": 186, "stem": "En la tabla de normativa de la UE en aviación, ¿en qué campo se incluyen el marco común de tasas aeroportuarias, la asignación de franjas horarias y las licencias del personal de aviación civil y del controlador?", "opts": ["Mercado interior", "Seguridad aérea", "Cielo único y gestión del tráfico aéreo", "Prestación de servicios y licencias"], "ans": 3, "why": "«Mercado interior» recoge las normas comunes de explotación, tarifas y fletes y las licencias a las compañías aéreas.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 187, "stem": "En la tabla de normativa de la UE en aviación, los sistemas informatizados de reserva aparecen en el campo:", "opts": ["Derechos de los pasajeros", "Mercado interior", "Dimensión internacional", "Protección de la aviación"], "ans": 0, "why": "Junto con la protección de los pasajeros aéreos y los derechos de las personas de movilidad reducida.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 188, "stem": "¿Cuál de estos contenidos corresponde al Paquete legislativo Cielo Único Europeo I (y no al II)?", "opts": ["La constitución de un Gestor de Red Europeo", "El establecimiento de Bloques Funcionales de Espacio Aéreo (FAB)", "La interoperabilidad de la red europea de gestión del tráfico aéreo", "El establecimiento de un Sistema de Evaluación de Rendimientos"], "ans": 2, "why": "SES I: marco para su creación, prestación de servicios, organización y utilización del espacio aéreo e interoperabilidad. Las otras tres opciones son del SES II.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 189, "stem": "¿Qué paquete legislativo amplió las competencias de EASA a los ámbitos de aeródromos, control de tránsito aéreo y servicios de navegación aérea?", "opts": ["Cielo Único Europeo I", "Cielo Único Europeo II", "Reglamento 2024/2803", "Reglamento 2021/2085"], "ans": 1, "why": "El SES II incluye también la evaluación de rendimientos, la tarificación común, el Gestor de Red, la participación militar y los FAB.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 190, "stem": "En la tabla de normativa de la UE en aviación, Clean Sky y la gestión del ruido en los aeropuertos de la UE aparecen dentro de:", "opts": ["Seguridad aérea", "Protección de la aviación", "Dimensión internacional", "Colaboración de la industria, compañías aéreas y proveedores de servicio de navegación aérea"], "ans": 3, "why": "Ese campo cubre la definición de nuevas soluciones tecnológicas a través de SESAR y la protección del medio ambiente.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 191, "stem": "En la tabla de normativa de la UE en aviación, las normas comunes sobre la seguridad de la aviación civil y el uso de escáneres de protección en los aeropuertos pertenecen al campo:", "opts": ["Protección de la aviación", "Seguridad aérea", "Derechos de los pasajeros", "Mercado interior"], "ans": 0, "why": "«Seguridad aérea» recoge la aviación civil y EASA, los accidentes e incidentes, la notificación de sucesos y las aeronaves de terceros países.", "src": "Manual 1 (nov. 2026), capítulo 2.3.5, p. 18", "note": ""}, {"n": 192, "stem": "¿Cuándo entraron en vigor los cuatro reglamentos comunitarios que fueron los pilares normativos de la iniciativa de Cielo Único Europeo?", "opts": ["En 1999", "En 2000", "En abril de 2004", "En diciembre de 2014"], "ans": 2, "why": "La Comisión propuso el SES en 1999, las instituciones comenzaron el desarrollo legislativo en 2000 y los cuatro reglamentos entraron en vigor en abril de 2004. Después fueron modificados y derogados por los actuales 2018/1139 y 2024/2803.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.1, p. 19", "note": ""}, {"n": 193, "stem": "¿En qué año comenzaron las instituciones europeas el desarrollo del conjunto de medidas legislativas y de cooperación para lograr los objetivos SES?", "opts": ["1996", "1999", "2004", "2000"], "ans": 3, "why": "1999 es la propuesta de la Comisión y 2004 la entrada en vigor de los cuatro reglamentos.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.1, p. 19", "note": ""}, {"n": 194, "stem": "En el marco institucional del Cielo Único Europeo, ¿dónde están representados la industria, los operadores aéreos y los proveedores de servicio?", "opts": ["En el Comité de Cielo Único", "En el Órgano Consultivo del Sector", "En el diálogo social", "En el Consejo Provisional"], "ans": 1, "why": "El marco institucional abarca el Comité de Cielo Único (Estados miembros), el Órgano Consultivo del Sector (industria), el diálogo social (organizaciones profesionales y de trabajadores) y EUROCONTROL.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 19", "note": ""}, {"n": 195, "stem": "En el marco institucional del Cielo Único Europeo, ¿quién está representado en el Comité de Cielo Único?", "opts": ["Los Estados miembros", "Las organizaciones profesionales y de trabajadores", "La industria y los operadores aéreos", "Los proveedores de servicios de navegación aérea"], "ans": 0, "why": "Las organizaciones profesionales y de trabajadores participan en el diálogo social; la industria, en el Órgano Consultivo del Sector.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 19", "note": ""}, {"n": 196, "stem": "En el Cielo Único Europeo, ¿quién certifica a los proveedores de servicios de navegación aérea?", "opts": ["EASA", "EUROCONTROL", "Las Autoridades Nacionales de Supervisión (ANS)", "El Gestor de Red"], "ans": 2, "why": "Los proveedores están sujetos a certificación por parte de las ANS, que fijan los requisitos comunes y el nivel exigible de calidad; es la separación entre provisión y supervisión.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 19", "note": ""}, {"n": 197, "stem": "España designó a AESA como Autoridad Nacional de Supervisión para los servicios civiles de navegación aérea, con una exclusión. ¿Cuál?", "opts": ["Los servicios de tránsito aéreo de aeródromo", "Los servicios de comunicaciones, navegación y vigilancia", "Los servicios de información aeronáutica", "Los servicios meteorológicos"], "ans": 3, "why": "«Para los servicios civiles de navegación excluyendo los servicios meteorológicos.»", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 19", "note": ""}, {"n": 198, "stem": "El sistema de evaluación de rendimientos del Cielo Único fija niveles de rendimiento para todos los actores del sector respecto a:", "opts": ["La puntualidad, la calidad, el precio y la satisfacción del usuario", "La seguridad, el medio ambiente, la capacidad y la rentabilidad", "La seguridad, la protección, la facilitación y la conectividad", "El ruido, las emisiones, el consumo y la eficiencia de vuelo"], "ans": 1, "why": "Así lo enumera el manual en «Sistemas de evaluación».", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 20", "note": ""}, {"n": 199, "stem": "Según el manual, el espacio aéreo «europeo» se considera un único elemento continuo, gestionado empezando por:", "opts": ["El espacio aéreo superior, de forma coherente con el espacio aéreo inferior", "El espacio aéreo inferior, de forma coherente con el superior", "Las áreas terminales de los grandes aeropuertos", "Los espacios aéreos fronterizos entre Estados"], "ans": 0, "why": "Gestionado en aras de la eficiencia global del sistema, «empezando por el espacio aéreo superior y de forma coherente con el espacio aéreo inferior».", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 20", "note": ""}, {"n": 200, "stem": "Según la nota del manual, un bloque funcional de espacio aéreo (FAB) se puede definir como:", "opts": ["Un conjunto planificado de redes prioritarias de transporte para comunicar personas y mercancías en toda la UE", "Un espacio aéreo reservado temporalmente para uso militar y gestionado según el uso flexible del espacio aéreo", "Un bloque de espacio aéreo basado en exigencias operativas, para una gestión más integrada con independencia de las fronteras nacionales", "La zona de responsabilidad de un centro de control de área, delimitada por las fronteras de cada Estado miembro"], "ans": 2, "why": "Los FAB transfronterizos se diseñan en base a requisitos operacionales e independientemente de las fronteras estatales, mediante una cooperación reforzada de los proveedores. La A es la red transeuropea de transporte.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, nota 2, p. 20", "note": ""}, {"n": 201, "stem": "El sistema común de tarificación del Cielo Único garantiza la transparencia de las tasas de navegación aérea porque:", "opts": ["Fija una tasa única para todo el espacio aéreo europeo, igual para todos los proveedores de servicios", "Traspasa el cobro de las tasas a la Comisión Europea, que publica cada año el desglose por Estado", "Prohíbe a los proveedores repercutir a los usuarios del espacio aéreo sus costes de inversión", "Obliga a notificar las bases de costes de los proveedores y a consultar a los usuarios del espacio aéreo"], "ans": 3, "why": "Frase del apartado «Tasas» de los principales objetivos alcanzados del SES.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, p. 20", "note": ""}, {"n": 202, "stem": "¿Qué documento marca la hoja de ruta del Programa SESAR?", "opts": ["El Plan mundial de navegación aérea (GANP)", "El Plan Maestro Europeo para la Gestión del Tránsito Aéreo", "El Plan estratégico de la red del Gestor de Red", "El Plan Director de Navegación Aérea"], "ans": 1, "why": "El Programa SESAR, pilar tecnológico del Cielo Único, define, desarrolla y despliega nuevas tecnologías y procedimientos ATM según el Plan Maestro Europeo ATM.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, p. 20", "note": ""}, {"n": 203, "stem": "Según el manual, el Programa SESAR consta actualmente de:", "opts": ["Dos fases que transcurren en paralelo: investigación y desarrollo, y despliegue", "Tres fases sucesivas: definición, desarrollo y despliegue", "Una única fase de despliegue iniciada en 2004", "Cuatro fases, una por cada reglamento del SES I"], "ans": 0, "why": "«El Programa SESAR consta actualmente de dos fases que transcurren en paralelo»: I+D y despliegue (este, iniciado formalmente en 2014).", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, pp. 20-21", "note": ""}, {"n": 204, "stem": "En la fase de investigación y desarrollo de SESAR, ¿cómo se denominan las soluciones que se consideran listas para ser desplegadas?", "opts": ["Proyectos comunes", "Funcionalidades ATM (AF)", "Soluciones SESAR", "Proyectos piloto"], "ans": 2, "why": "En esa fase se desarrollan y validan los nuevos componentes tecnológicos hasta un nivel de madurez que permite su puesta en servicio, y se van generando las «Soluciones SESAR».", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, p. 20", "note": ""}, {"n": 205, "stem": "El Proyecto Común Piloto que publicó la Comisión Europea en 2014:", "opts": ["Creó la Empresa Común SESAR 3", "Designó al Consorcio SDA como Gestor de Despliegue de SESAR", "Definió los bloques funcionales del espacio aéreo europeo", "Estableció una relación de funcionalidades esenciales del Plan Maestro ATM"], "ans": 3, "why": "Con su publicación se inició formalmente la fase de despliegue de SESAR. La Empresa Común SESAR 3 la crea el Reglamento 2021/2085.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.3, p. 21", "note": ""}, {"n": 206, "stem": "La última fase del NMOC contempla la implantación de un sistema integrado o uniforme europeo. ¿Cuál?", "opts": ["La EAD (<em>European AIS Database</em>)", "El EATMS (<em>European Air Traffic Management System</em>)", "El MUAC (<em>Maastricht Upper Area Control Centre</em>)", "El PC1 (Proyecto Común Uno)"], "ans": 1, "why": "El EATMS es el Sistema europeo de gestión del tráfico aéreo.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 207, "stem": "Según el manual, el NMOC centraliza y ejecuta los servicios de gestión del flujo de tráfico aéreo (ATFCM) y de la capacidad en el área comprendida por los países miembros de:", "opts": ["La CEAC (Conferencia Europea de Aviación Civil)", "La Unión Europea", "La Oficina Europa y Atlántico Norte de la OACI", "El Acuerdo Global de EUROCONTROL"], "ans": 0, "why": "La edición de noviembre de 2026 desarrolla la sigla: «países miembros de la CEAC (Conferencia Europea de Aviación Civil)».", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 208, "stem": "Dentro del proceso de gestión de afluencia, las posiciones de gestión de afluencia (FMP) se encargan de:", "opts": ["Asignar los códigos de transpondedor SSR a cada vuelo que entra en su área de responsabilidad", "Certificar a los proveedores de servicios de navegación aérea de su área de responsabilidad", "Funcionar como enlace entre la Unidad Central de Gestión del ACC y los aeródromos asociados", "Elaborar el diseño integrado de la red europea de rutas junto con el Gestor de Red"], "ans": 2, "why": "Proporcionan la información local necesaria para cada fase del control de la afluencia; el NMOC actúa en coordinación con los operadores aéreos y las FMP.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 209, "stem": "¿Cuál es uno de los principales objetivos del NMOC?", "opts": ["Prestar el control de área en el espacio aéreo superior del Benelux y del noroeste de Alemania", "Generar boletines de información previa al vuelo (PIB) a partir de los NOTAM y datos AIP", "Investigar los incidentes relacionados con la capacidad y emitir recomendaciones", "Equilibrar la demanda y la capacidad disponible de espacio aéreo, reduciendo la congestión"], "ans": 3, "why": "La A es el MUAC y la B, la EAD.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 210, "stem": "Según el manual, ¿quién creó el Gestor de Red Europeo (NM)?", "opts": ["EUROCONTROL, por decisión del Consejo Provisional", "La Comisión Europea, dentro de la legislación del SES II", "EASA, en virtud del Reglamento 2018/1139", "La OACI, a propuesta de la Oficina de París"], "ans": 1, "why": "La Comisión Europea lo creó dentro de la legislación del SES II como entidad imparcial y competente para desarrollar y ejecutar las funciones de la red ATM europea; su objetivo principal es mejorar el rendimiento de esa red.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.5, p. 21", "note": ""}, {"n": 211, "stem": "¿Cuál de estas funciones del Gestor de Red figura en el apartado «Planes y programas»?", "opts": ["Elaborar, mantener y aplicar el Plan estratégico de la red", "Desempeñar la función central de coordinación de las radiofrecuencias", "Elaborar el diseño integrado de la red europea de rutas", "Proporcionar apoyo en la gestión de las crisis de la red"], "ans": 0, "why": "La B está en «Frecuencias y códigos», la C en «Gestión del tráfico aéreo» y la D en «Red ATM». «Planes y programas» incluye también contribuir al despliegue de SESAR y elaborar el Plan de Rendimiento de la Red.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.5, pp. 21-22", "note": ""}, {"n": 212, "stem": "El Gestor de Red proporciona un sistema de aviso o de alerta, basado en el análisis de los planes de vuelo, para controlar el cumplimiento de la prohibición de explotación aplicada a las compañías aéreas. ¿A quién se lo proporciona?", "opts": ["A EASA", "A las Autoridades Nacionales de Supervisión", "A la Comisión", "A EUROCONTROL"], "ans": 2, "why": "Es una de las funciones de «Apoyo a entidades», junto con asistir a las entidades de investigación de accidentes e incidentes cuando lo soliciten.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.5, p. 22", "note": ""}, {"n": 213, "stem": "En el desarrollo de la regulación de Cielo Único, ¿en qué comité participa la DGAC, donde se discuten las políticas comunitarias y los proyectos de reglamentación?", "opts": ["La Junta de los Servicios de Navegación Aérea (ANSB)", "El Órgano Asesor de la Agencia (AAB)", "El Órgano Consultivo del Sector", "El Comité de Cielo Único (<em>Single Sky Committee</em>)"], "ans": 3, "why": "ANSB y AAB son grupos consultivos de EUROCONTROL en los que participa ENAIRE.", "src": "Manual 1 (nov. 2026), capítulo 2.3.7, p. 22", "note": ""}, {"n": 214, "stem": "Según el manual, en el ámbito del transporte aéreo de la UE participan funcionarios de:", "opts": ["Solo la Agencia Estatal de Seguridad Aérea", "El Ministerio de Asuntos Exteriores y el Ministerio de Transportes y Movilidad Sostenible", "El Ministerio de Defensa y el de Transportes, a través de la CIDETRA", "ENAIRE y Aena, como proveedores del Estado"], "ans": 1, "why": "Los del Ministerio de Transportes proceden principalmente de la DGAC y de AESA.", "src": "Manual 1 (nov. 2026), capítulo 2.3.7, p. 22", "note": ""}, {"n": 215, "stem": "¿Qué función ejerce el Consorcio SESAR Deployment Alliance (SDA), del que ENAIRE es miembro desde su creación?", "opts": ["Gestor de Despliegue de SESAR (SDM)", "Gestor de Red Europeo (NM)", "Empresa Común SESAR 3", "Centro de Operaciones del Gestor de Red (NMOC)"], "ans": 0, "why": "La Comisión lo designó en diciembre de 2014 para ejercer la función de SDM; el 1 de enero de 2018 evoluciona a Asociación Internacional sin ánimo de lucro.", "src": "Manual 1 (nov. 2026), capítulo 2.3.7, p. 22", "note": ""}, {"n": 216, "stem": "Según el manual, EASA tiene estatus de organismo comunitario y personalidad jurídica propia, mediante la que puede:", "opts": ["Imponer sanciones directamente a las compañías aéreas de los Estados miembros", "Certificar a los proveedores de servicios de navegación aérea en lugar de las ANS", "Establecer sus propias sedes locales en los Estados miembros, previo consentimiento de estos", "Negociar acuerdos bilaterales de transporte aéreo con terceros Estados"], "ans": 2, "why": "Frase literal de los orígenes de EASA, que es el componente esencial de la estrategia de seguridad aérea de la UE.", "src": "Manual 1 (nov. 2026), capítulo 2.4.1, p. 22", "note": ""}, {"n": 217, "stem": "¿Cuál de los siguientes NO forma parte de la misión de EASA según el manual?", "opts": ["Garantizar los más altos niveles comunes de seguridad y de protección del medio ambiente", "Un proceso único de reglamentación y certificación entre los Estados miembros", "Facilitar el mercado único interno de la aviación y crear igualdad de condiciones", "Gestionar de forma centralizada los flujos de tráfico aéreo y la capacidad (ATFCM)"], "ans": 3, "why": "La función centralizada ATFCM es un objetivo de EUROCONTROL. La cuarta parte de la misión de EASA es colaborar con otras organizaciones y reguladores internacionales.", "src": "Manual 1 (nov. 2026), capítulo 2.4.2, p. 23", "note": ""}, {"n": 218, "stem": "Entre las principales tareas de EASA figura la certificación y supervisión de los productos aeronáuticos y de las organizaciones que participen en su diseño, producción y mantenimiento en:", "opts": ["Los Estados miembros que lo soliciten", "Países terceros", "Los Estados del Acuerdo Global", "Los aeropuertos de interés general"], "ans": 1, "why": "Así figura entre sus tareas, junto con la normativa, las inspecciones y la estandarización, la certificación de tipo, la recogida de datos y la coordinación del programa SAFA.", "src": "Manual 1 (nov. 2026), capítulo 2.4.3, p. 23", "note": ""}, {"n": 219, "stem": "El Consejo de Administración de EASA cuenta con:", "opts": ["Un representante de cada Estado miembro y un representante de la Comisión", "Representantes de 36 Estados elegidos por la Asamblea", "Los ministros de transportes de los Estados miembros", "Los Directores Generales de Aviación Civil y el director ejecutivo"], "ans": 0, "why": "Cada Estado miembro y la Comisión nombran un miembro y un suplente; los mandatos son de cinco años renovables. La B es el Consejo de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 23", "note": ""}, {"n": 220, "stem": "¿Quién puede convocar al director ejecutivo de EASA para que rinda cuentas acerca del ejercicio de su cometido?", "opts": ["El Consejo de Administración o cualquier Estado miembro", "La Comisión Permanente de EUROCONTROL", "El Tribunal de Justicia de la UE", "El Parlamento Europeo o el Consejo"], "ans": 3, "why": "El director ejecutivo es totalmente independiente y no pide ni recibe instrucciones de ningún Gobierno u organismo, pero el Parlamento Europeo o el Consejo pueden convocarlo.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 23", "note": ""}, {"n": 221, "stem": "¿Qué dirección de EASA estrecha relaciones de trabajo con la OACI, la Administración Federal de Aviación de Estados Unidos y las autoridades de Canadá, Brasil, Israel, China y Rusia?", "opts": ["La Dirección de certificación", "La Dirección de normas de vuelo", "La Dirección de gestión de estrategia y seguridad", "La Dirección de recursos y apoyo"], "ans": 2, "why": "Es responsable de programas, investigación, análisis y acciones sobre la seguridad y de la cooperación internacional.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, pp. 23-24", "note": ""}, {"n": 222, "stem": "La certificación de tipo de aeronavegabilidad, es decir, la de modelos concretos de aeronaves, motores o componentes aprobados para su explotación en la UE, corresponde en EASA a la:", "opts": ["Dirección de normas de vuelo", "Dirección de certificación", "Dirección de gestión de estrategia y seguridad", "Sala de recursos"], "ans": 1, "why": "Así describe el manual las competencias de la Dirección de certificación.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 24", "note": ""}, {"n": 223, "stem": "¿Qué dirección de EASA se encarga de las finanzas y contratación, los recursos humanos, la informática y los servicios empresariales?", "opts": ["La Dirección de recursos y apoyo", "La Dirección de gestión de estrategia y seguridad", "La Dirección de normas de vuelo", "La Dirección de certificación"], "ans": 0, "why": "Las otras tres tienen competencias de seguridad, normalización y certificación.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 24", "note": ""}, {"n": 224, "stem": "¿Quién decide el número de salas de recursos de EASA y el reparto de tareas entre ellas?", "opts": ["El Consejo de Administración", "El director ejecutivo", "El Parlamento Europeo", "La Comisión"], "ans": 3, "why": "«La Comisión decidirá el número de salas de recursos y el reparto de tareas.» Las salas se pronuncian sobre los recursos contra decisiones como las de certificación de aeronavegabilidad y medioambiental.", "src": "Manual 1 (nov. 2026), capítulo 2.4.4, p. 24", "note": ""}, {"n": 225, "stem": "En el proceso de elaboración de normas de EASA, las siglas NPA corresponden a:", "opts": ["Los documentos de respuesta a comentarios", "Los términos de referencia", "Los avisos de modificación propuesta", "Los medios aceptables de cumplimiento"], "ans": 2, "why": "Los términos de referencia son los ToR y los documentos de respuesta a comentarios, los CRD.", "src": "Manual 1 (nov. 2026), capítulo 2.4.5, p. 24", "note": ""}, {"n": 226, "stem": "Según el manual, EASA elabora material normativo en forma de:", "opts": ["Directivas, decisiones y recomendaciones dirigidas a las autoridades nacionales de supervisión", "Reglamentos de ejecución, medios aceptables de cumplimiento, material guía y especificaciones de certificación", "Normas ESARR y circulares aeronáuticas, sometidas antes a consulta de los Estados miembros", "Normas y métodos recomendados incorporados a los anexos y desarrollados en documentos técnicos"], "ans": 1, "why": "Las ESARR son de EUROCONTROL, las circulares aeronáuticas de la DGAC y las SARPs de la OACI.", "src": "Manual 1 (nov. 2026), capítulo 2.4.5, p. 24", "note": ""}, {"n": 227, "stem": "Las normas recogidas en los documentos de EUROCAE son:", "opts": ["De carácter voluntario", "Recomendaciones adoptadas por la FAA", "Obligatorias en toda la Unión Europea", "Incorporadas a los Anexos de la OACI"], "ans": 0, "why": "La B describe las normas de RTCA, recomendaciones adoptadas por las autoridades federales estadounidenses (FAA) y por empresas privadas.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 24", "note": ""}, {"n": 228, "stem": "¿Qué organización intentaba proporcionar un foro europeo para la resolución de problemas y la creación de estándares para la electrónica en la aviación?", "opts": ["CANSO", "ESA", "RTCA", "EUROCAE"], "ans": 3, "why": "EUROCAE (Organización Europea para el Equipamiento en la Aviación Civil), con más de 500 miembros.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 24", "note": ""}, {"n": 229, "stem": "¿Qué organización estadounidense sin ánimo de lucro, con sede en Washington D.C., realiza recomendaciones para la comunicación, navegación y vigilancia de la gestión del tráfico aéreo (CNS/ATM)?", "opts": ["EUROCAE", "CANSO", "RTCA", "ACI"], "ans": 2, "why": "RTCA, <em>Radio Technical Commission for Aeronautics</em> (Comisión Radiotécnica para la aeronáutica). La edición de 2026 corrige la errata «RCTA» de la anterior.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 230, "stem": "¿Qué pareja organización - número de miembros es correcta según el manual?", "opts": ["EUROCAE - 400 organizaciones", "RTCA - 400 organizaciones", "IATA - más de 500 aerolíneas", "ESA - 27 Estados Miembros"], "ans": 1, "why": "EUROCAE tiene más de 500 miembros, la IATA más de 350 aerolíneas y la ESA 23 Estados Miembros.", "src": "Manual 1 (nov. 2026), capítulo 2.5, pp. 24-25", "note": ""}, {"n": 231, "stem": "¿Qué organización se define como el primer vehículo para la cooperación entre las aerolíneas en la promoción de servicios de transporte aéreo seguro, fiable y económico?", "opts": ["IATA", "ACI", "CANSO", "ALA"], "ans": 0, "why": "La IATA, fundada en La Habana; sus más de 350 aerolíneas comprenden el 80 % del tráfico aéreo total.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 232, "stem": "¿Para qué se fundó CANSO, según el manual?", "opts": ["Para representar a los operadores de aeropuertos de todo el mundo", "Para crear estándares voluntarios para la electrónica en la aviación", "Para elaborar el programa espacial europeo", "Para representar los intereses de los proveedores de servicio de navegación aérea"], "ans": 3, "why": "«Fundada para representar los intereses de los proveedores de servicio de navegación aérea (ANSP) en todo el mundo, así como la gestión del tráfico aéreo.» La A es ACI, la B EUROCAE y la C la ESA.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 233, "stem": "¿Qué organización tiene como funciones desarrollar a escala mundial una política aeroportuaria común y promover el intercambio de información técnica, financiera, comercial, de marketing o de medio ambiente?", "opts": ["IATA", "AOC", "ACI", "CANSO"], "ans": 2, "why": "ACI (Consejo Internacional de Aeropuertos) fue creada por los operadores de aeropuertos como la primera asociación mundial que representa sus intereses.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 234, "stem": "Según el manual, la ESA (Agencia Espacial Europea) fue establecida en:", "opts": ["Lucerna, y tiene 23 Estados Miembros", "París, y tiene 23 Estados Miembros", "Bruselas, y tiene 27 Estados Miembros", "París, y tiene 42 Estados Miembros"], "ans": 1, "why": "Fue establecida en París por el Convenio de creación de una Agencia Espacial Europea; elabora y lleva a cabo el programa espacial europeo.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 235, "stem": "Según el apartado sobre el desdoblamiento de la autoridad aeronáutica, durante los quince últimos años el tráfico aéreo se ha multiplicado por:", "opts": ["2", "1,5", "2,5", "3"], "ans": 2, "why": "«Durante los quince últimos años el tráfico aéreo se ha multiplicado por 2,5, y las previsiones apuntan a que se doblará en los próximos años.» No confundir con los 2,5 millones de operaciones de Aena en 2024.", "src": "Manual 1 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 236, "stem": "En el desdoblamiento de la autoridad aeronáutica del Real Decreto 184/2008, ¿cuál de estas competencias corresponde a la DGAC y no a AESA?", "opts": ["La adopción de circulares aeronáuticas", "El ejercicio de las potestades inspectoras", "El ejercicio de las potestades sancionadoras", "La evaluación de riesgos en materia de seguridad de la aviación civil"], "ans": 0, "why": "La DGAC formula propuestas sectoriales y la política estratégica, representa y coordina con otras administraciones y con la UE, y adopta las circulares aeronáuticas. Las otras tres son de AESA.", "src": "Manual 1 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 237, "stem": "Según el apartado sobre el desdoblamiento de la autoridad aeronáutica, la iniciativa para aprobar la normativa reguladora en los ámbitos de la seguridad aérea y la protección del usuario corresponde a:", "opts": ["La DGAC, que la aprueba directamente", "ENAIRE, como proveedor designado", "La CIDETRA, a propuesta del Ministerio de Defensa", "AESA, para su elevación a los órganos competentes del Ministerio"], "ans": 3, "why": "AESA tiene esa iniciativa «para su elevación a los órganos competentes del Ministerio de Transportes y Movilidad Sostenible», además de las potestades inspectoras y sancionadoras y la evaluación de riesgos.", "src": "Manual 1 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 238, "stem": "Según el manual, la DGAC es el órgano mediante el cual el Ministerio de Transportes y Movilidad Sostenible:", "opts": ["Presta los servicios de tránsito aéreo de ruta y aproximación en el espacio aéreo español", "Diseña la estrategia, dirige la política aeronáutica y ejerce de regulador en el sector aéreo", "Inspecciona y sanciona las infracciones de las normas de aviación civil", "Investiga los accidentes e incidentes de aviación civil ocurridos en territorio español"], "ans": 1, "why": "Para ello coordina a los organismos, entes y entidades adscritos al Departamento con funciones en aviación civil. La A es ENAIRE, la C AESA y la D la CIAIAC.", "src": "Manual 1 (nov. 2026), capítulo 3.3, p. 26", "note": ""}, {"n": 239, "stem": "¿Cuál de las siguientes figura entre las funciones «específicas» de la DGAC?", "opts": ["La gestión del Registro de matrícula de aeronaves y la inscripción de las aeronaves civiles", "La expedición, renovación y revocación de licencias y habilitaciones aeronáuticas", "La máxima representación del Departamento ante los organismos nacionales e internacionales de aviación civil", "La investigación técnica de los accidentes e incidentes de aviación civil en territorio español"], "ans": 2, "why": "Las específicas son la aprobación de circulares, la coordinación Defensa-Transportes presidiendo la CIDETRA, la máxima representación del Departamento y el fomento del desarrollo sostenible del transporte aéreo. A y B son de AESA; D, de la CIAIAC.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 26", "note": ""}, {"n": 240, "stem": "¿Qué órgano negocia los convenios internacionales de transporte aéreo y asigna los derechos de tráfico derivados de ellos?", "opts": ["La DGAC", "AESA", "La CIPAI", "El Ministerio de Asuntos Exteriores"], "ans": 0, "why": "Es función de la DGAC en materia de promoción del transporte aéreo, sin perjuicio de las competencias del Ministerio de Asuntos Exteriores y del apoyo técnico de AESA.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 27", "note": ""}, {"n": 241, "stem": "En materia de promoción del transporte aéreo y continuidad de los servicios, ¿qué órgano propone las obligaciones de servicio público y gestiona los créditos para subvenciones al transporte aéreo?", "opts": ["AESA", "ENAIRE", "Aena S.M.E., S.A.", "La DGAC"], "ans": 3, "why": "Ambas son funciones de la DGAC, junto con la negociación de los convenios internacionales de transporte aéreo.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 27", "note": ""}, {"n": 242, "stem": "El informe de la DGAC a los planes directores y planes especiales de los aeropuertos de interés general es vinculante:", "opts": ["Siempre, cualquiera que sea el aeropuerto de interés general afectado", "Cuando se afecten competencias de la Administración General del Estado", "Solo para los aeropuertos gestionados por Aena S.M.E., S.A.", "Solo si lo solicita la comunidad autónoma en la que se ubica el aeropuerto"], "ans": 1, "why": "«Este informe será vinculante en el caso de que se afecten competencias de la Administración General del Estado.»", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 27", "note": ""}, {"n": 243, "stem": "¿Qué emite la DGAC en el caso de los helipuertos de competencia autonómica?", "opts": ["Su certificado de aeródromo", "La autorización de puesta en funcionamiento", "La certificación de compatibilidad del espacio aéreo", "El informe vinculante de su plan director"], "ans": 2, "why": "Junto con el informe previo sobre el establecimiento, modificación y apertura al tráfico de los aeródromos y aeropuertos autonómicos.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 27", "note": ""}, {"n": 244, "stem": "¿Qué órgano tiene atribuidas las actuaciones expropiatorias en materia de infraestructuras aeroportuarias y de navegación aérea cuya gestión esté reservada al Estado?", "opts": ["La DGAC", "ENAIRE", "AESA", "La CIDETRA"], "ans": 0, "why": "Es una función de la DGAC en materia de política de infraestructuras aeronáuticas; en su estructura existe un Servicio de Expropiaciones.", "src": "Manual 1 (nov. 2026), capítulos 3.3.1-3.3.2, pp. 27-28", "note": ""}, {"n": 245, "stem": "Según el manual, la DGAC ejerce además cualesquiera otras funciones en el ámbito de la aviación civil que:", "opts": ["Le encomiende la Comisión Europea en el marco del Cielo Único", "Le delegue ENAIRE como proveedor designado por el Estado", "Le atribuya la CIDETRA en la coordinación civil-militar", "No estén atribuidas a AESA de acuerdo con su estatuto"], "ans": 3, "why": "Es la cláusula final de las funciones de la DGAC.", "src": "Manual 1 (nov. 2026), capítulo 3.3.1, p. 27", "note": ""}, {"n": 246, "stem": "En la estructura de la DGAC, la Unidad de Ordenación y Normativa Aeronáutica y los Servicios de Gestión Económico-Financiera y de Gestión de Recursos Humanos forman parte de:", "opts": ["La Subdirección General de Transporte Aéreo", "La Unidad de Apoyo", "La Subdirección General de Aeropuertos y Navegación Aérea", "La Secretaría General de Transportes Aéreo y Marítimo"], "ans": 1, "why": "La estructura de la DGAC es: Unidad de Apoyo, Subdirección General de Transporte Aéreo y Subdirección General de Aeropuertos y Navegación Aérea.", "src": "Manual 1 (nov. 2026), capítulo 3.3.2, p. 27", "note": ""}, {"n": 247, "stem": "¿En qué parte de la DGAC se encuadra el Servicio de Expropiaciones?", "opts": ["En la Unidad de Apoyo", "En la Subdirección General de Transporte Aéreo", "En la Subdirección General de Aeropuertos y Navegación Aérea", "En el Área de Convenios Internacionales"], "ans": 2, "why": "Esa Subdirección incluye también las Áreas de Política de Estrategia de Navegación Aérea y de Estrategia Aeroportuaria, el Servicio de Planificación y Representación Institucional y el Servicio Civil de la comisión Defensa-Transportes.", "src": "Manual 1 (nov. 2026), capítulo 3.3.2, p. 28", "note": ""}, {"n": 248, "stem": "El Área de Convenios Internacionales y la Oficina de Relaciones Internacionales de la DGAC pertenecen a:", "opts": ["La Subdirección General de Transporte Aéreo", "La Subdirección General de Aeropuertos y Navegación Aérea", "La Unidad de Apoyo", "La Dirección de seguridad de aeronaves de AESA"], "ans": 0, "why": "La Subdirección General de Transporte Aéreo comprende la Unidad de Política Estratégica del Transporte Aéreo, el Área de Explotación, el Área de Convenios Internacionales, la Oficina de Relaciones Internacionales y el Área de Estudios Estratégicos y Análisis de Mercados.", "src": "Manual 1 (nov. 2026), capítulo 3.3.2, p. 28", "note": ""}, {"n": 249, "stem": "¿Qué accidentes e incidentes investiga la CIAIAC según el manual?", "opts": ["Los de cualquier aeronave matriculada en España, ocurran donde ocurran", "Solo los que afectan a compañías aéreas comerciales", "Los de aviación civil y militar ocurridos en la UE", "Los de aviación civil que se producen en territorio español"], "ans": 3, "why": "Es «el organismo oficial encargado de realizar la investigación de los accidentes e incidentes de aviación civil que se producen en territorio español». La edición de noviembre de 2026 la sigue presentando así.", "src": "Manual 1 (nov. 2026), capítulo 3.3.3, p. 28", "note": ""}, {"n": 250, "stem": "Según el manual, tras una investigación de la CIAIAC, ¿cuál es el medio que se considera más adecuado para proponer medidas que permitan aumentar la seguridad aérea?", "opts": ["Las sanciones a los responsables", "Las recomendaciones en materia de seguridad", "Las circulares aeronáuticas", "Las inspecciones de normalización"], "ans": 1, "why": "El informe contempla información factual, análisis, conclusiones y recomendaciones en materia de seguridad, que «constituyen el medio que se considera más adecuado». La CIAIAC cuenta con personal y medios propios y con la colaboración puntual de especialistas externos.", "src": "Manual 1 (nov. 2026), capítulo 3.3.3, p. 28", "note": ""}, {"n": 251, "stem": "Según el apartado 3.4 del manual, AESA está adscrita a:", "opts": ["La Subsecretaría del Ministerio de Transportes y Movilidad Sostenible", "La Dirección General de Aviación Civil", "La Secretaría de Estado de Transporte del Ministerio de Transportes y Movilidad Sostenible", "El Ministerio para la Transición Ecológica"], "ans": 2, "why": "A la Subsecretaría está adscrita la CIAIAC y al Ministerio para la Transición Ecológica, AEMET. Ojo: el resumen del RD 253/2024 (4.4.2) dice que AESA está adscrita a través de la Secretaría General de Transportes Aéreo y Marítimo; el manual no es coherente, por eso el enunciado cita el apartado.", "src": "Manual 1 (nov. 2026), capítulo 3.4, p. 28", "note": ""}, {"n": 252, "stem": "Según el manual, AESA tiene las misiones de supervisión, inspección y ordenación de:", "opts": ["El transporte aéreo, la navegación aérea y la seguridad aeroportuaria", "Los aeropuertos de interés general y sus servidumbres", "La política estratégica del transporte aéreo", "Los servicios meteorológicos aeronáuticos"], "ans": 0, "why": "Además evalúa los riesgos en la seguridad del transporte y tiene potestad sancionadora ante las infracciones de las normas de aviación civil.", "src": "Manual 1 (nov. 2026), capítulo 3.4.1, p. 28", "note": ""}, {"n": 253, "stem": "En la tabla de competencias de AESA, «la autorización, acreditación e inspección a personas físicas y jurídicas para su actuación como entidades colaboradoras en materia de inspección aeronáutica» se encuadra en:", "opts": ["Licencias y registro", "Aprobación y aplicación de normas", "Colaboración", "Inspección y sanción"], "ans": 3, "why": "«Inspección y sanción» incluye la inspección aeronáutica, las entidades colaboradoras, la gestión de riesgos y la potestad sancionadora.", "src": "Manual 1 (nov. 2026), capítulo 3.4.1, p. 29", "note": ""}, {"n": 254, "stem": "¿Cuál de estas competencias corresponde a AESA?", "opts": ["La negociación de los convenios internacionales de transporte aéreo y la asignación de los derechos de tráfico", "La aprobación previa de los programas internos de autoverificación y control de explotadores y prestadores de servicios", "La presidencia de la Comisión Interministerial entre Defensa y Transportes", "La aprobación de las circulares aeronáuticas de seguridad aérea, por propia iniciativa o a propuesta de otro órgano"], "ans": 1, "why": "Figura en «Aprobación y aplicación de normas». A, C y D son funciones de la DGAC.", "src": "Manual 1 (nov. 2026), capítulo 3.4.1, p. 29", "note": ""}, {"n": 255, "stem": "Según sus competencias de colaboración, AESA colabora con la Unión Europea y la Agencia Europea de Seguridad Aérea para:", "opts": ["Elaborar las normas ESARR", "Certificar el tipo de las aeronaves fabricadas en España", "Realizar inspecciones e investigaciones en territorio español", "Negociar los acuerdos bilaterales con terceros Estados"], "ans": 2, "why": "Además presta asistencia técnica y colabora con el Ministerio en el ejercicio de sus competencias de aviación civil.", "src": "Manual 1 (nov. 2026), capítulo 3.4.1, p. 29", "note": ""}, {"n": 256, "stem": "¿Qué dirección de AESA tiene competencias en materia de derechos de emisión de gases de efecto invernadero?", "opts": ["La Dirección de seguridad de aeronaves (DSA)", "La Dirección de aeropuertos y seguridad de la aviación civil", "La Dirección de gestión de la seguridad y personal de vuelo", "La Dirección de navegación aérea"], "ans": 0, "why": "La DSA es responsable de la seguridad de la operación y el mantenimiento, la certificación de aeronaves, la explotación del transporte aéreo y los permisos comerciales, gestiona el Registro de matrícula e integra la OSV.", "src": "Manual 1 (nov. 2026), capítulo 3.4.2, p. 29", "note": ""}, {"n": 257, "stem": "¿Qué dirección de AESA tiene competencias sobre el personal de vuelo, las escuelas de vuelo y la medicina aeronáutica, y supervisa los planes de asistencia a las víctimas de accidentes y a sus familiares?", "opts": ["La Dirección de seguridad de aeronaves", "La Dirección de aeropuertos y seguridad de la aviación civil", "La Dirección de navegación aérea", "La Dirección de gestión de la seguridad y personal de vuelo"], "ans": 3, "why": "Esa dirección también ejerce la gestión de riesgos en materia de seguridad de la aviación civil y la protección del usuario.", "src": "Manual 1 (nov. 2026), capítulo 3.4.2, p. 30", "note": ""}, {"n": 258, "stem": "¿Qué dirección de AESA ejerce las competencias frente a los actos de interferencia ilícita en la aviación civil y las funciones de facilitación en el transporte aéreo?", "opts": ["La Dirección de seguridad de aeronaves", "La Dirección de aeropuertos y seguridad de la aviación civil", "La Dirección de gestión de la seguridad y personal de vuelo", "La Dirección de navegación aérea"], "ans": 1, "why": "También ejerce las competencias en aeropuertos y es órgano sustantivo en la evaluación ambiental.", "src": "Manual 1 (nov. 2026), capítulo 3.4.2, p. 30", "note": ""}, {"n": 259, "stem": "¿En qué año nace AENA Internacional y cuál fue el primer paso de AENA en el ámbito internacional?", "opts": ["En 1991; la gestión del aeropuerto de Luton", "En 1997; la concesión del aeropuerto de Barranquilla (Colombia) en 1998", "En 1998; la concesión del aeropuerto de Barranquilla (Colombia) en 1997", "En 2014; la compra del 51 % del aeropuerto de Luton"], "ans": 2, "why": "«En 1998 nace AENA Internacional [...], siendo el primer paso de AENA en el ámbito internacional en 1997 con el contrato de concesión del aeropuerto de Barranquilla (Colombia).»", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 30", "note": ""}, {"n": 260, "stem": "Entre 2000 y 2010 se amplió la red de Aena con nuevos aeropuertos. ¿Cuál de estos NO figura en esa lista del manual?", "opts": ["Logroño", "Albacete", "Huesca-Pirineos", "Castellón"], "ans": 3, "why": "Los nuevos aeropuertos citados son Logroño, Albacete, Burgos y Huesca-Pirineos.", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 30", "note": ""}, {"n": 261, "stem": "¿Qué tres grandes aeropuertos se mejoraron y ampliaron entre 2000 y 2010 mediante planes específicos?", "opts": ["Madrid-Barajas, Palma y Gran Canaria", "Madrid-Barajas, Barcelona y Málaga", "Barcelona, Valencia y Bilbao", "Málaga, Sevilla y Alicante"], "ans": 1, "why": "El Plan Barajas, el Plan Barcelona y el Plan Málaga.", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 30", "note": ""}, {"n": 262, "stem": "Según el manual, Aena S.M.E., S.A. es:", "opts": ["Una sociedad mercantil estatal que gestiona aeropuertos y helipuertos españoles de interés general", "Una entidad pública empresarial adscrita al Ministerio que gestiona el control del tránsito aéreo", "Un organismo público con potestades inspectoras y sancionadoras", "Una asociación de las compañías aéreas que operan en cada aeropuerto"], "ans": 0, "why": "Antes Aena Aeropuertos, S.A. La B es ENAIRE E.P.E., la C AESA y la D las AOC.", "src": "Manual 1 (nov. 2026), capítulo 3.5, p. 30", "note": ""}, {"n": 263, "stem": "¿Cuándo se añadió a la denominación de Aena la abreviatura S.M.E., por su condición de sociedad mercantil estatal?", "opts": ["En julio de 2014", "El 11 de febrero de 2015", "En abril de 2017", "En 2010, con el Real Decreto-ley 13/2010"], "ans": 2, "why": "En julio de 2014 pasó a denominarse Aena, S.A. y desde el 11 de febrero de 2015 cotiza en Bolsa.", "src": "Manual 1 (nov. 2026), capítulo 3.5.1, p. 31", "note": ""}, {"n": 264, "stem": "¿De qué aeropuerto extranjero posee Aena el 51 % del capital, según el manual?", "opts": ["Barranquilla", "Lima", "Ciudad de México", "Luton (Londres)"], "ans": 3, "why": "Aena participa directa e indirectamente en la gestión de otros 32 aeropuertos en Europa y América, entre ellos el londinense de Luton, del que posee el 51 %.", "src": "Manual 1 (nov. 2026), capítulo 3.5.2, p. 31", "note": ""}, {"n": 265, "stem": "Según el manual, Aena es el primer operador aeroportuario del mundo por:", "opts": ["Número de aeropuertos gestionados", "Número de pasajeros", "Volumen de carga", "Capitalización bursátil"], "ans": 1, "why": "«Aena es el primer operador aeroportuario del mundo por número de pasajeros.»", "src": "Manual 1 (nov. 2026), capítulo 3.5.2, p. 31", "note": ""}, {"n": 266, "stem": "Según su objeto social, ¿cuál de estas funciones corresponde a Aena S.M.E., S.A.?", "opts": ["Las inversiones en infraestructuras aeroportuarias y en bienes destinados a los servicios de tránsito aéreo de aeródromo adscritos a ellas", "La prestación de los servicios de tránsito aéreo de control de área y de aproximación en el espacio aéreo español", "La gestión del Registro de matrícula de aeronaves y la expedición de los certificados de aeronavegabilidad", "La elaboración de propuestas de modificación de la estructura y la ordenación del espacio aéreo español"], "ans": 0, "why": "Figura en «Infraestructuras e instalaciones». B y D son de ENAIRE; C, de AESA.", "src": "Manual 1 (nov. 2026), capítulo 3.5.3, p. 31", "note": ""}, {"n": 267, "stem": "Según el manual, Aena S.M.E., S.A. tiene también por objeto la gestión de:", "opts": ["Las bases aéreas militares de utilización exclusiva y sus zonas de servicio", "Los helipuertos de competencia autonómica y sus servidumbres aeronáuticas", "Las zonas civiles de las bases aéreas abiertas al tráfico civil y de los aeropuertos de utilización conjunta", "Los aeródromos privados autorizados por la CIDETRA y sus instalaciones"], "ans": 2, "why": "Y la participación, gestión y dirección, directa o indirectamente, en aeropuertos extranjeros.", "src": "Manual 1 (nov. 2026), capítulo 3.5.3, p. 31", "note": ""}, {"n": 268, "stem": "Según la edición de noviembre de 2026 del manual, ¿cuántos vuelos gestionó ENAIRE en 2024?", "opts": ["2,5 millones de vuelos", "Más de 2,4 millones de vuelos", "2,19 millones de vuelos", "Más de 309 millones de vuelos"], "ans": 1, "why": "La edición de 2026 dice «más de 2,4 millones de vuelos» (la de 2025 decía 2,5). Los 2,5 millones son las operaciones de Aena en 2024, 2,19 millones son los km² del espacio aéreo de ENAIRE y 309,3 millones, los pasajeros de Aena.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 269, "stem": "Según el manual, ¿qué eficiencia de vuelo en ruta alcanzó ENAIRE en 2024?", "opts": ["96,7 %", "80 %", "99,5 %", "49 %"], "ans": 0, "why": "«Más de 2,4 millones de vuelos, con una eficiencia de vuelo en ruta del 96,7 %.»", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 270, "stem": "El manual sitúa a ENAIRE como uno de los ___ mayores gestores de navegación aérea de Europa.", "opts": ["dos", "tres", "cuatro", "cinco"], "ans": 2, "why": "Por los vuelos gestionados en 2024, «uno de los cuatro mayores gestores de navegación aérea de Europa».", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 271, "stem": "¿Cuál de estas zonas NO forma parte del espacio aéreo que controla ENAIRE según el manual?", "opts": ["El Sáhara Occidental", "Parte del oeste del Mediterráneo", "Parte del Atlántico norte", "Portugal continental"], "ans": 3, "why": "Comprende la península Ibérica (excepto Portugal), Canarias, Baleares, parte del Atlántico norte, del oeste del Mediterráneo y el Sáhara Occidental: 2,19 millones de km².", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 272, "stem": "¿En qué ciudad tiene su sede la Dirección regional Sur de Navegación Aérea de ENAIRE?", "opts": ["Palma de Mallorca", "Sevilla", "Barcelona", "Valencia"], "ans": 1, "why": "En el ACC de Sevilla. Barcelona es la Dirección Este, Palma la de Baleares y Valencia es uno de los dos TACC.", "src": "Manual 1 (nov. 2026), capítulo 3.6.2, p. 32", "note": ""}, {"n": 273, "stem": "Según el manual, ENAIRE E.P.E. es el gestor de:", "opts": ["El control del tránsito aéreo, la información aeronáutica y las redes de comunicación, navegación y vigilancia", "Los aeropuertos de interés general, sus helipuertos y los servicios aeroportuarios afectos a ellos", "La supervisión, la inspección y la ordenación de la navegación aérea y de la seguridad aeroportuaria", "La investigación técnica de los accidentes e incidentes de aviación civil ocurridos en territorio español"], "ans": 0, "why": "Es una entidad pública empresarial adscrita al Ministerio de Transportes y Movilidad Sostenible.", "src": "Manual 1 (nov. 2026), capítulo 3.6, p. 32", "note": ""}, {"n": 274, "stem": "¿Cuál de estas figura entre las funciones de ENAIRE en navegación aérea según el apartado 3.6.3?", "opts": ["La expedición, renovación y revocación de las licencias de controlador de tránsito aéreo", "La aprobación de las circulares aeronáuticas de seguridad aérea, por propia iniciativa o a propuesta de AESA", "La evaluación de necesidades y propuestas de nuevas infraestructuras y de modificaciones en la ordenación del espacio aéreo", "La gestión de las zonas civiles de las bases aéreas abiertas al tráfico civil y de los aeropuertos de utilización conjunta"], "ans": 2, "why": "También la planificación, dirección y explotación del tráfico aéreo y de sus redes, los proyectos e inversiones y la participación en la formación aeronáutica sujeta a licencias. A es AESA, B la DGAC y D Aena.", "src": "Manual 1 (nov. 2026), capítulo 3.6.3, p. 32", "note": ""}, {"n": 275, "stem": "¿Qué asociación se fundó en 1988 como asociación de compañías privadas de aviación para ser nexo entre el sector privado de aviación y las administraciones públicas?", "opts": ["ALA", "ACETA", "AOC", "AECA"], "ans": 3, "why": "AECA, Asociación Española de Compañías Aéreas. ACETA se fundó en 2004 y ALA se registró hace más de 50 años.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 276, "stem": "Según el manual, ¿qué empresas pueden pertenecer a ALA (Asociación de Líneas Aéreas)?", "opts": ["Solo las compañías aéreas regulares con bandera española que transporten pasajeros", "Las empresas de transporte aéreo de pasajeros, carga y correo que lo deseen, siempre que estén legalmente registradas en España", "Las compañías aéreas que operan en un aeropuerto concreto, agrupadas después a escala nacional", "Ocho compañías: Air Europa, Air Nostrum, Binter, Gestair, Iberia, Naysa, Orbest y Vueling"], "ans": 1, "why": "ALA está constituida por la inmensa mayoría de las compañías regulares que operan en España, nacionales e internacionales. La C son las AOC y la D, los miembros de ACETA.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 277, "stem": "¿Cuál de estas compañías NO figura entre los miembros de ACETA que cita el manual?", "opts": ["Air Nostrum", "Naysa", "Volotea", "Orbest"], "ans": 2, "why": "Los miembros son Air Europa, Air Nostrum, Binter Canarias, Gestair, Iberia, Naysa, Orbest y Vueling.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 278, "stem": "¿Qué asociaciones tienen como función mejorar la coordinación entre las compañías aéreas y las autoridades aeroportuarias (Aena S.M.E., S.A.)?", "opts": ["Las AOC (Asociaciones de Operadores de Compañías) locales", "AECA", "ACETA", "ACI"], "ans": 0, "why": "Las compañías que operan en cada aeropuerto se agrupan en AOC locales, que a su vez se agrupan en la AOC de España.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 279, "stem": "¿Cuántas compañías asociadas tiene AECA según el manual?", "opts": ["Ocho", "Más de 350", "Más de 50", "Más de 30"], "ans": 3, "why": "Más de 30 compañías de los sectores regular, chárter, carga, aerotaxis, helicópteros, trabajos aéreos y empresas del sector. Ocho son los miembros de ACETA; más de 350, las aerolíneas de la IATA; más de 50, los años de ALA.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 280, "stem": "Tras la creación en 1977 del Ministerio de Transportes, Turismo y Comunicaciones, las competencias en aeronáutica civil se traspasaron desde:", "opts": ["El Ministerio de Asuntos Exteriores", "El Ministerio de Defensa", "El Ministerio de Industria", "El Ministerio de Fomento"], "ans": 1, "why": "Residían hasta entonces en el Ministerio de Defensa; en 1979 se creó la CIDETRA para coordinar la aeronáutica civil y militar.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 33", "note": ""}, {"n": 281, "stem": "¿Cuál es el orden cronológico correcto de las denominaciones de la comisión interministerial entre Defensa y Transportes?", "opts": ["CIDEFO → CIDETRA → CIDETMA → CIDETRA", "CIDETRA → CIDETMA → CIDEFO → CIDETRA", "CIDETRA → CIDEFO → CIDETMA → CIDETRA", "CIDETMA → CIDEFO → CIDETRA → CIDETMA"], "ans": 2, "why": "CIDETRA (1979), CIDEFO (Defensa y Fomento), CIDETMA (acuerdo de 1 de abril de 2020) y, en 2024, con el Ministerio de Transportes y Movilidad Sostenible, de nuevo CIDETRA.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 282, "stem": "¿Cuándo se adoptó, mediante acuerdo de la Comisión, el cambio de denominación a «Comisión Interministerial entre Defensa y Transportes, Movilidad y Agenda Urbana» (CIDETMA)?", "opts": ["El 1 de abril de 2020", "El 8 de noviembre de 1979", "En 2024", "En 1977"], "ans": 0, "why": "El 8 de noviembre de 1979 es la Orden que crea la CIDETRA; en 2024 recupera el nombre CIDETRA.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 283, "stem": "¿Cuál de las siguientes NO figura entre las competencias de la CIDETRA?", "opts": ["La estructura del espacio aéreo", "La concesión de autorización de aeródromos privados", "La organización y reglamentación de la búsqueda y salvamento", "La investigación técnica de los accidentes de aviación civil"], "ans": 3, "why": "La investigación técnica corresponde a la CIAIAC. Las otras tres son competencias de la CIDETRA (espacios aéreos, aeródromos y reglamentación).", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 284, "stem": "¿Para qué se creó en 1979 la Comisión Interministerial Defensa-Transportes (CIDETRA)?", "opts": ["Para negociar los convenios internacionales de transporte aéreo", "Para permitir y asegurar la coordinación entre la aeronáutica civil y militar", "Para investigar los accidentes de aviación civil y militar", "Para gestionar las bases aéreas abiertas al tráfico civil"], "ans": 1, "why": "Así lo dice el manual en el origen de la CIDETRA.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 285, "stem": "Entre las competencias de navegación aérea de la CIDETRA figuran los requerimientos de la navegación aérea en relación con:", "opts": ["La Agencia Estatal de Seguridad Aérea", "El Gestor de Red Europeo", "El Instituto Nacional de Meteorología", "La Organización de Aviación Civil Internacional"], "ans": 2, "why": "Junto con la planificación de la red de ayudas a la navegación, control y telecomunicaciones y la información de los asuntos de navegación aérea de congresos internacionales.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 286, "stem": "¿Qué Real Decreto modificó en 2003 la CIPAI para ajustarla a la situación actual?", "opts": ["Real Decreto 1342/2003", "Real Decreto 184/2008", "Real Decreto 905/1991", "Real Decreto 1516/2009"], "ans": 0, "why": "El 184/2008 es el Estatuto de AESA, el 905/1991 constituye AENA y el 1516/2009 trata de las licencias de CTA.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 287, "stem": "¿Cuál es la denominación actual de la CIPAI y cuál fue la original de 1946?", "opts": ["Comisión Interministerial de Política Aérea Internacional; antes, de Política Aeroespacial Internacional", "Comisión Interministerial de Política Aeronáutica Internacional; antes, de Aviación Civil", "Comisión Interministerial de Política Aeroportuaria; antes, de Política Aérea", "Comisión Interministerial de Política Aeroespacial Internacional; antes, de Política Aérea Internacional"], "ans": 3, "why": "Es un órgano colegiado de la AGE, adscrito al Ministerio de Asuntos Exteriores, creado en 1946 como Comisión Interministerial de Política Aérea Internacional.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 288, "stem": "¿Cuál es la finalidad de la CIPAI según el manual?", "opts": ["Coordinar la aeronáutica civil y militar en materia de espacio aéreo, aeródromos y cartas aeronáuticas", "Asesorar a la Administración General del Estado y coordinar sus departamentos en política aérea y espacial internacional", "Coordinar los requisitos operacionales identificados y justificados por los usuarios del sistema de navegación aérea", "Investigar los incidentes de aviación civil con implicaciones internacionales y emitir recomendaciones de seguridad"], "ans": 1, "why": "Emite opiniones, propuestas e informes sobre tratados de política aérea y espacial, respetando las competencias de Asuntos Exteriores. La A es la CIDETRA y la C el SCA.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 289, "stem": "El Comité de Coordinación Operativa, fundado en 1986, se dividió en el momento de su creación en:", "opts": ["Dos subcomités", "Tres subcomités", "Cinco subcomités", "Siete subcomités"], "ans": 2, "why": "Uno de los cinco es el Subcomité de Circulación Aérea (SCA).", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 290, "stem": "¿Qué órgano tiene como competencia coordinar todos los requisitos operacionales identificados y justificados por los usuarios?", "opts": ["El Subcomité de la Circulación Aérea (SCA)", "La CIDETRA", "La CIPAI", "El Comité de Cielo Único"], "ans": 0, "why": "En el SCA participan ENAIRE, la DGAC, la AEMET y las compañías aéreas españolas.", "src": "Manual 1 (nov. 2026), capítulo 3.8, p. 34", "note": ""}, {"n": 291, "stem": "Las normas que regulan o autorizan la apertura de aeródromos, las licencias de vuelo o la imposición de sanciones pertenecen al:", "opts": ["Derecho mercantil", "Derecho internacional público", "Derecho penal", "Derecho administrativo"], "ans": 3, "why": "Así lo clasifica la tabla de ramas del Derecho del apartado 4.1.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 292, "stem": "¿Qué pareja rama del Derecho - normas aeronáuticas es INCORRECTA?", "opts": ["Derecho laboral - condiciones de trabajo de las tripulaciones", "Derecho mercantil - delitos aeronáuticos", "Derecho internacional público - normas y organizaciones derivadas de acuerdos internacionales", "Derecho administrativo - imposición de sanciones"], "ans": 1, "why": "Los delitos aeronáuticos proceden del Derecho penal; el Derecho mercantil contiene las normas del contrato de transporte aéreo.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 293, "stem": "Según el manual, el «Derecho Aeronáutico» es el conjunto de normas jurídicas que regulan la navegación aérea y el establecimiento y uso de sus infraestructuras con fines:", "opts": ["Exclusivamente civiles comerciales", "Civiles, pero no militares", "Civiles (comerciales o no) o militares", "Exclusivamente internacionales"], "ans": 2, "why": "Sus normas pertenecen a diversas ramas del Derecho, aunque se agrupen por su objeto aeronáutico.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 294, "stem": "¿Cuál de las siguientes NO es una de las tres fuentes del Derecho aeronáutico según el manual?", "opts": ["El Derecho autonómico", "El Derecho internacional", "El Derecho comunitario", "El Derecho nacional"], "ans": 0, "why": "«El derecho aeronáutico se encuentra regulado por tres fuentes»: internacional, comunitario y nacional.", "src": "Manual 1 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 295, "stem": "Según la tabla de acuerdos multilaterales, el Convenio de Chicago sobre Aviación Civil Internacional es de ___ y fue ratificado el ___.", "opts": ["1 de noviembre de 1944; 4 de abril de 1947", "7 de diciembre de 1944; 4 de abril de 1947", "4 de abril de 1947; mayo de 1947", "7 de diciembre de 1944; 21 de febrero de 1947"], "ans": 3, "why": "El 4 de abril de 1947 es la fecha en que la PICAO pasó a ser la OACI y mayo de 1947, la primera Asamblea. El Convenio sienta las bases del derecho aeronáutico y crea la OACI.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 35", "note": ""}, {"n": 296, "stem": "El Convenio de Montreal para la unificación de ciertas reglas sobre el transporte aéreo internacional es de:", "opts": ["23 de septiembre de 1971", "28 de mayo de 1999", "12 de octubre de 1929", "1975"], "ans": 1,
