<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Instituciones y legislación aeronáutica</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id const Q=[{"n": 1, "stem": "A la Conferencia de Chicago de 1944 asistieron representantes de un determinado número de países. ¿Cuántos asistieron y cuántos habían firmado el Convenio el día de la clausura?", "opts": ["Asistieron 52 y firmaron 54", "Asistieron 54 y firmaron todos", "Asistieron 48 y firmaron 44", "Asistieron 54 y firmaron 52"], "ans": 3, "why": "Se reunieron 54 países entre el 1 de noviembre y el 7 de diciembre de 1944, y el día de la clausura habían firmado 52. La opción A invierte las cifras.", "src": "Manual ap. 2.1.2, pp. 5-6", "note": ""}, {"n": 2, "stem": "¿En qué fecha pasó oficialmente la OACIP (PICAO) a ser la OACI?", "opts": ["El 7 de diciembre de 1944", "El 21 de febrero de 1947", "El 1 de noviembre de 1944", "El 4 de abril de 1947"], "ans": 3, "why": "Al obtenerse las ratificaciones necesarias el 4 de abril de 1947, los aspectos provisionales de la PICAO decayeron y pasó a denominarse OACI. El 7 de diciembre de 1944 es la fecha de la firma y el 21 de febrero de 1947, la de la ratificación española que figura en 4.2.1.", "src": "Manual ap. 2.1.2, p. 6 y 4.2.1, p. 32", "note": ""}, {"n": 3, "stem": "¿Dónde y cuándo se celebró la primera Asamblea oficial de la OACI?", "opts": ["Chicago, diciembre de 1944", "París, 1950", "Montreal, mayo de 1947", "Washington, abril de 1947"], "ans": 2, "why": "El manual indica que la primera Asamblea oficial tuvo lugar en Montreal en mayo de 1947.", "src": "Manual ap. 2.1.2, p. 6", "note": ""}, {"n": 4, "stem": "¿Cuál de los siguientes NO es uno de los cinco objetivos estratégicos de la OACI que recoge el manual?", "opts": ["Protección del medio ambiente", "Seguridad y facilitación", "Capacidad y eficiencia de la navegación aérea", "Armonización de las tarifas aéreas"], "ans": 3, "why": "Los cinco son seguridad operacional, capacidad y eficiencia, seguridad y facilitación, desarrollo económico del transporte aéreo y protección del medio ambiente. La armonización de tarifas no figura entre ellos.", "src": "Manual ap. 2.1.4, p. 7", "note": ""}, {"n": 5, "stem": "Según el manual, ¿con qué frecuencia se reúne la Asamblea de la OACI?", "opts": ["Todos los años", "Cada dos años, alternando con el Consejo", "Cada cinco años", "Al menos una vez cada tres años"], "ans": 3, "why": "La Asamblea se reúne al menos una vez cada tres años, convocada por el Consejo.", "src": "Manual ap. 2.1.5, p. 7", "note": ""}, {"n": 6, "stem": "¿Cuántos Estados componen el Consejo de la OACI y por cuánto tiempo son elegidos?", "opts": ["19 Estados, cuatro años", "27 Estados, cinco años", "36 Estados, tres años", "193 Estados, tres años"], "ans": 2, "why": "El Consejo está formado por representantes de 36 Estados contratantes elegidos por la Asamblea por un periodo de tres años. El 19 es el número de Anexos y el 193, el de Estados miembros.", "src": "Manual ap. 2.1.5, p. 7", "note": ""}, {"n": 7, "stem": "¿Qué órgano de la OACI oficia de árbitro entre los Estados Miembros en la aplicación del Convenio?", "opts": ["La Asamblea", "La Secretaría", "La Oficina de navegación aérea", "El Consejo"], "ans": 3, "why": "Oficiar de árbitro entre los Estados Miembros es una de las cinco funciones principales del Consejo.", "src": "Manual ap. 2.1.5, p. 7", "note": ""}, {"n": 8, "stem": "¿Cuántas oficinas tiene la Secretaría de la OACI?", "opts": ["Tres", "Nueve", "Siete", "Cinco"], "ans": 3, "why": "Oficina de navegación aérea, de transporte aéreo, de desarrollo de capacidades e implementación, de asuntos jurídicos y relaciones externas, y de administración y servicios. Siete es el número de oficinas regionales y nueve, el de regiones.", "src": "Manual ap. 2.1.5, p. 8", "note": ""}, {"n": 9, "stem": "¿Dónde está la Oficina de la OACI para Europa y el Atlántico Norte?", "opts": ["Bruselas", "Montreal", "El Cairo", "París"], "ans": 3, "why": "Las regiones EUR y NAT dependen de la oficina de París (Francia).", "src": "Manual ap. 2.1.5 b), p. 8", "note": ""}, {"n": 10, "stem": "¿Qué ciudad alberga la oficina de la OACI que abarca las regiones de Norteamérica, Centroamérica y el Caribe?", "opts": ["Ciudad de México", "Lima", "Nairobi", "Bangkok"], "ans": 0, "why": "Las regiones NAM y CAR se dirigen desde Ciudad de México. Lima atiende Sudamérica, Nairobi el África oriental y meridional, y Bangkok Asia y el Pacífico.", "src": "Manual ap. 2.1.5 b), p. 8", "note": ""}, {"n": 11, "stem": "La OACI organiza la navegación aérea en un número determinado de regiones, dirigidas a través de un número determinado de oficinas. ¿Cuáles son?", "opts": ["Siete regiones, nueve oficinas", "Cinco regiones, siete oficinas", "Nueve regiones, nueve oficinas", "Nueve regiones, siete oficinas"], "ans": 3, "why": "El manual establece nueve regiones dirigidas a través de siete oficinas.", "src": "Manual ap. 2.1.5 b), p. 8", "note": ""}, {"n": 12, "stem": "Según el manual, el Anexo 5 de la OACI trata de:", "opts": ["Las cartas aeronáuticas", "La facilitación", "Las marcas de nacionalidad y matrícula de las aeronaves", "Las unidades de medida que se emplearán en las operaciones aéreas y terrestres"], "ans": 3, "why": "El Anexo 4 son las cartas, el Anexo 7 las marcas y el Anexo 9 la facilitación.", "src": "Manual ap. 2.1.6.1, p. 9", "note": ""}, {"n": 13, "stem": "¿Qué Anexo de la OACI trata de la búsqueda y salvamento?", "opts": ["Anexo 11", "Anexo 15", "Anexo 13", "Anexo 12"], "ans": 3, "why": "El Anexo 12 es SAR (búsqueda y salvamento). El 11 son los servicios de tránsito aéreo, el 13 la investigación de accidentes y el 15 los servicios de información aeronáutica (AIS).", "src": "Manual ap. 2.1.6.1, p. 9", "note": ""}, {"n": 14, "stem": "¿Qué Anexo de la OACI se titula «Operación de aeronaves»?", "opts": ["Anexo 6", "Anexo 8", "Anexo 10", "Anexo 14"], "ans": 0, "why": "El Anexo 8 es Aeronavegabilidad, el 10 Telecomunicaciones aeronáuticas y el 14 Aeródromos.", "src": "Manual ap. 2.1.6.1, p. 9", "note": ""}, {"n": 15, "stem": "¿Qué Anexo de la OACI trata del transporte sin riesgos de mercancías peligrosas por vía aérea?", "opts": ["Anexo 16", "Anexo 17", "Anexo 19", "Anexo 18"], "ans": 3, "why": "El Anexo 16 es protección del medio ambiente, el 17 seguridad de la aviación (AVSEC) y el 19 gestión de la seguridad operacional.", "src": "Manual ap. 2.1.6.1, p. 9", "note": ""}, {"n": 16, "stem": "Según el manual, ¿qué documento desarrolla el Anexo 2 (Reglamento del aire)?", "opts": ["Doc. 8168", "Doc. 9750", "Doc. 7030", "Doc. 4444"], "ans": 3, "why": "El Doc. 4444 (Gestión del tránsito aéreo) desarrolla el Anexo 2. Los Doc. 7030 y 8697 se relacionan con el Anexo 4, el 8168 es PANS-OPS y el 9750, el GANP.", "src": "Manual ap. 2.1.6.2, p. 9", "note": ""}, {"n": 17, "stem": "El Plan Mundial de Navegación Aérea (GANP) se publica como:", "opts": ["Doc. 9750 de la OACI", "Doc. 8126 de la OACI", "Circular 247 de la OACI", "Doc. 8697 de la OACI"], "ans": 0, "why": "Es el Doc. 9750, que abarca el periodo 2016-2030. El Doc. 8126 es el manual AIS y el Doc. 8697, el manual de cartas aeronáuticas.", "src": "Manual ap. 2.1.6.2, p. 10", "note": ""}, {"n": 18, "stem": "La Circular 247 de la OACI trata de:", "opts": ["Las operaciones simultáneas en pistas paralelas", "El Reglamento del aire", "Los aspectos económicos de la navegación por satélite", "Los factores humanos, la gestión y la organización"], "ans": 3, "why": "La Circular 207 trata de SOIR y la 257, de la economía de la navegación por satélite.", "src": "Manual ap. 2.1.6.3, p. 10", "note": ""}, {"n": 19, "stem": "El Volumen II de los PANS-OPS (Doc. 8168) está destinado a:", "opts": ["Los controladores de tránsito aéreo que aplican las separaciones", "Los especialistas en procedimientos que diseñan procedimientos de vuelo visuales e instrumentales", "Las oficinas meteorológicas", "Los gestores de aeropuertos que certifican aeródromos"], "ans": 1, "why": "El Volumen II es una guía para los especialistas en procedimientos sobre los márgenes de franqueamiento de obstáculos; el Volumen I se dirige al personal de operaciones de vuelo.", "src": "Manual ap. 2.1.6.2, p. 10", "note": ""}, {"n": 20, "stem": "¿Cuántos Estados Miembros tiene EUROCONTROL y qué dos Estados tienen un Acuerdo Global?", "opts": ["42; Israel y Marruecos", "44; Israel y Egipto", "27; Marruecos y Túnez", "42; Israel y Turquía"], "ans": 0, "why": "El manual habla de 42 Estados Miembros más 2 Estados del Acuerdo Global, Israel y Marruecos.", "src": "Manual ap. 2.2.1, p. 11", "note": ""}, {"n": 21, "stem": "Según el manual, ¿desde cuándo es España miembro de EUROCONTROL?", "opts": ["1960", "1986", "1997", "2002"], "ans": 2, "why": "1960 es la creación de EUROCONTROL, 1986 la adhesión de España a la UE y 2002 el protocolo de adhesión de la UE.", "src": "Manual ap. 2.2.1, p. 11", "note": ""}, {"n": 22, "stem": "El órgano de decisión más alto de EUROCONTROL, compuesto por representantes a nivel ministerial, es:", "opts": ["El Consejo Provisional", "La Comisión Permanente", "La Agencia", "La Comisión de Revisión del Rendimiento"], "ans": 1, "why": "La Comisión Permanente nombra al Director General y aprueba el presupuesto y el programa quinquenal. El Consejo Provisional está formado por Directores Generales de Aviación Civil.", "src": "Manual ap. 2.2.4, p. 11", "note": ""}, {"n": 23, "stem": "¿Qué órgano de EUROCONTROL está formado por representantes a nivel de Directores Generales de Aviación Civil?", "opts": ["La Comisión Permanente", "El Consejo de Servicios de Navegación Aérea", "El Consejo Provisional", "El Consejo Militar de ATM"], "ans": 2, "why": "El Consejo Provisional aplica la política fijada por la Comisión Permanente.", "src": "Manual ap. 2.2.4, p. 11", "note": ""}, {"n": 24, "stem": "¿Cuál de los siguientes NO es un componente de la Agencia ejecutiva de EUROCONTROL?", "opts": ["La Dirección del Gestor de Red", "La Dirección de la Oficina Central de Tasas de Ruta", "El Centro de Control de Área Superior de Maastricht", "La Comisión de Regulación de la Seguridad"], "ans": 3, "why": "La SRC forma parte de la estructura consultiva, no de la Agencia.", "src": "Manual ap. 2.2.4, p. 12", "note": ""}, {"n": 25, "stem": "Las normas ESARR son adoptadas por el/la:", "opts": ["Director General en solitario", "Consejo Provisional y aprobadas por la Comisión de EUROCONTROL", "Comisión de Revisión del Rendimiento y aprobadas por el Consejo de la UE", "Consejo de Auditoría y aprobadas por la OACI"], "ans": 1, "why": "Son adoptadas por el Consejo Provisional, aprobadas por la Comisión y luego incorporadas por los Estados miembros.", "src": "Manual ap. 2.2.5, p. 12", "note": ""}, {"n": 26, "stem": "¿Qué ESARR trata de la «supervisión de la seguridad operacional en ATM»?", "opts": ["ESARR 1", "ESARR 2", "ESARR 4", "ESARR 6"], "ans": 0, "why": "La ESARR 2 trata de la notificación de sucesos, la 4 de la evaluación y mitigación del riesgo y la 6 del software.", "src": "Manual ap. 2.2.6, pp. 12-13", "note": ""}, {"n": 27, "stem": "¿Cuántas ESARR se han aprobado?", "opts": ["Cuatro", "Cinco", "Ocho", "Seis"], "ans": 3, "why": "De la ESARR 1 a la ESARR 6.", "src": "Manual ap. 2.2.6, p. 12", "note": ""}, {"n": 28, "stem": "El EAD (Base de Datos AIS Europea) proporciona una fuente única de referencia de:", "opts": ["Predicciones meteorológicas", "Datos de NOTAM y de AIP", "Planes de vuelo", "Trazas radar"], "ans": 1, "why": "También permite generar boletines de información previa al vuelo (PIB).", "src": "Manual ap. 2.2.7, p. 13", "note": ""}, {"n": 29, "stem": "El MUAC presta servicios en el espacio aéreo superior de:", "opts": ["Francia, España y Portugal", "Bélgica, Luxemburgo, los Países Bajos y el noroeste de Alemania", "Suiza, Austria e Italia", "Dinamarca, Suecia y Noruega"], "ans": 1, "why": "Así lo indica el manual para el centro de EUROCONTROL en Maastricht.", "src": "Manual ap. 2.2.8, p. 13", "note": ""}, {"n": 30, "stem": "¿En qué grupos consultivos de EUROCONTROL participa ENAIRE?", "opts": ["PRC y SRC", "SCF y MAB", "ANSB y AAB", "ESAC y CMSC"], "ans": 2, "why": "ENAIRE participa, como proveedor de servicios de navegación aérea (ANSP), en el Consejo de Servicios de Navegación Aérea (ANSB) y en el Órgano Consultivo de la Agencia (AAB).", "src": "Manual ap. 2.2.10, p. 13", "note": ""}, {"n": 31, "stem": "Según el manual, ¿cuántos Estados miembros tiene la UE y desde cuándo pertenece España?", "opts": ["27; 1 de enero de 1986", "28; 1 de enero de 1986", "27; 1 de enero de 1999", "25; 1 de enero de 1957"], "ans": 0, "why": "Lo indica el apartado 2.3.1.", "src": "Manual ap. 2.3.1, p. 14", "note": ""}, {"n": 32, "stem": "Según el manual, ¿cuántos miembros tiene el Parlamento Europeo?", "opts": ["705", "751", "720", "27"], "ans": 2, "why": "El manual habla de 720 eurodiputados.", "src": "Manual ap. 2.3.4, p. 15", "note": ""}, {"n": 33, "stem": "¿Qué institución de la UE está formada por los Jefes de Estado o de Gobierno, el Presidente de la Comisión y el Alto Representante?", "opts": ["El Consejo de la Unión Europea", "El Consejo Europeo", "El Parlamento Europeo", "El Tribunal de Justicia"], "ans": 1, "why": "El Consejo Europeo define la orientación política general; el Consejo de la UE está formado por ministros.", "src": "Manual ap. 2.3.4, p. 15", "note": ""}, {"n": 34, "stem": "¿Qué órgano de la UE garantiza que el Derecho de la UE se interprete y se aplique de la misma manera en todos los Estados miembros?", "opts": ["El Tribunal de Justicia de la UE (TJUE)", "El Tribunal de Cuentas Europeo", "La Comisión Europea", "El Defensor del Pueblo Europeo"], "ans": 0, "why": "El TJUE también vela por que los Estados miembros y las instituciones cumplan el Derecho de la UE.", "src": "Manual ap. 2.3.4, p. 15", "note": ""}, {"n": 35, "stem": "¿En qué año propuso la Comisión Europea el Cielo Único Europeo?", "opts": ["1999", "2004", "2009", "2014"], "ans": 0, "why": "Se propuso en 1999; los cuatro reglamentos entraron en vigor en abril de 2004.", "src": "Manual ap. 2.3.6.1, pp. 16-17", "note": ""}, {"n": 36, "stem": "¿Cuál de estos fue uno de los objetivos clave iniciales del Cielo Único Europeo (SES)?", "opts": ["Crear una única compañía aérea europea", "Reestructurar el espacio aéreo en función de los flujos de tráfico, con independencia de las fronteras nacionales", "Fusionar todos los ANSP en una sola empresa", "Suprimir el espacio aéreo militar"], "ans": 1, "why": "Los otros eran generar capacidad adicional y aumentar la eficiencia global.", "src": "Manual ap. 2.3.6.1, p. 17", "note": ""}, {"n": 37, "stem": "¿Qué reglamentos cita el manual como los vigentes que sustituyen a los reglamentos SES originales?", "opts": ["549/2004 y 550/2004", "216/2008 y 2015/340", "2018/1139 y 2024/2803", "923/2012 y 996/2010"], "ans": 2, "why": "El Reglamento (UE) 2018/1139 (normas comunes y EASA) y el 2024/2803 (consecución del SES).", "src": "Manual ap. 2.3.6.1, p. 17", "note": ""}, {"n": 38, "stem": "¿Qué autoridad designó España como Autoridad Nacional de Supervisión de los servicios de navegación aérea civil?", "opts": ["La DGAC", "ENAIRE", "AESA", "La CIAIAC"], "ans": 2, "why": "AESA, con exclusión de los servicios meteorológicos.", "src": "Manual ap. 2.3.6.2, p. 17", "note": ""}, {"n": 39, "stem": "¿Quién asume la función de regulador comunitario en el SES?", "opts": ["EASA", "EUROCONTROL", "El Comité del Cielo Único", "La Comisión Europea"], "ans": 3, "why": "El manual dice que esta función la asume la Comisión Europea.", "src": "Manual ap. 2.3.6.2, p. 17", "note": ""}, {"n": 40, "stem": "La fase de despliegue de SESAR se inició formalmente en:", "opts": ["2004", "2007", "2014", "2018"], "ans": 2, "why": "En 2014, cuando la Comisión publicó el Proyecto Piloto Común.", "src": "Manual ap. 2.3.6.3, p. 18", "note": ""}, {"n": 41, "stem": "Según el manual, ¿desde qué mes y año está operativo el NMOC?", "opts": ["Abril de 2004", "Marzo de 1996", "Diciembre de 2014", "Enero de 2018"], "ans": 1, "why": "El programa NMOC entró en funcionamiento en marzo de 1996.", "src": "Manual ap. 2.3.6.4, p. 18", "note": ""}, {"n": 42, "stem": "¿En el marco de qué legislación se creó el Gestor de Red Europeo?", "opts": ["SES I", "SES II", "El Reglamento 2018/1139", "El Convenio de Chicago"], "ans": 1, "why": "El manual dice «dentro de la legislación del SES II».", "src": "Manual ap. 2.3.6.5, p. 19", "note": ""}, {"n": 43, "stem": "¿Cuál de las siguientes es una función del Gestor de Red?", "opts": ["Certificar a los controladores de tránsito aéreo", "Coordinar la asignación de códigos de transpondedor SSR", "Investigar accidentes", "Fijar las tasas aeroportuarias en España"], "ans": 1, "why": "También coordina de forma centralizada las radiofrecuencias y diseña la red europea integrada de rutas.", "src": "Manual ap. 2.3.6.5, p. 19", "note": ""}, {"n": 44, "stem": "La Alianza de Despliegue de SESAR (SDA) fue designada por la Comisión en:", "opts": ["Diciembre de 2014", "Marzo de 1996", "Enero de 2018", "2002"], "ans": 0, "why": "La SDA se constituyó como asociación internacional sin ánimo de lucro el 1 de enero de 2018.", "src": "Manual ap. 2.3.7, p. 20", "note": ""}, {"n": 45, "stem": "Según el manual, ¿en qué año se creó EASA?", "opts": ["1960", "1999", "2002", "2018"], "ans": 2, "why": "Se creó en 2002 y hoy se rige por el Reglamento (UE) 2018/1139.", "src": "Manual ap. 2.4.1, p. 20", "note": ""}, {"n": 46, "stem": "¿Cuál es la duración del mandato de los miembros del Consejo de Administración de EASA?", "opts": ["Tres años, no renovable", "Cinco años, renovable", "Cuatro años, renovable una vez", "Dos años, renovable"], "ans": 1, "why": "Los mandatos duran cinco años y son renovables.", "src": "Manual ap. 2.4.4, p. 21", "note": ""}, {"n": 47, "stem": "¿Qué dirección de EASA es responsable de la normalización y de las normas sobre mantenimiento, operaciones aéreas, tripulaciones, aspectos médicos, ATM/ANS y aeródromos?", "opts": ["La Dirección de Normas de Vuelo (Flight Standards)", "La Dirección de Certificación", "La Dirección de Recursos y Apoyo", "La Dirección de Estrategia y Gestión de la Seguridad"], "ans": 0, "why": "La Dirección de Normas de Vuelo armoniza las normas y es responsable de la normalización de la supervisión nacional.", "src": "Manual ap. 2.4.4, p. 21", "note": ""}, {"n": 48, "stem": "SAFA, programa coordinado por EASA, significa:", "opts": ["Evaluación de la seguridad de aeronaves extranjeras (<em>Safety Assessment of Foreign Aircraft</em>)", "Marco normalizado de aeronavegabilidad para la aviación (<em>Standard Airworthiness Framework for Aviation</em>)", "Autoridad de seguridad para compañías aéreas (<em>Safety Authority for Airlines</em>)", "Sistema de análisis de vuelos aeronáuticos (<em>System for Aeronautical Flight Analysis</em>)"], "ans": 0, "why": "Es un programa comunitario coordinado por encargo de la Comisión.", "src": "Manual ap. 2.4.3, p. 21", "note": ""}, {"n": 49, "stem": "En el proceso normativo de EASA, tras la consulta, los proyectos de normas de aplicación se envían a:", "opts": ["El Consejo de la OACI", "La Comisión Europea", "El Tribunal de Justicia", "EUROCONTROL"], "ans": 1, "why": "Si superan la revisión del Parlamento Europeo y del Consejo, se publican en el Diario Oficial de la UE.", "src": "Manual ap. 2.4.5, p. 22", "note": ""}, {"n": 50, "stem": "¿Dónde se constituyó EUROCAE?", "opts": ["París", "Washington D. C.", "La Habana", "Lucerna"], "ans": 3, "why": "Organización sin ánimo de lucro constituida en Lucerna (Suiza). RTCA está en Washington y la IATA se fundó en La Habana.", "src": "Manual ap. 2.5, p. 22", "note": ""}, {"n": 51, "stem": "La IATA se fundó en:", "opts": ["La Habana, Cuba", "Montreal", "Ginebra", "Lucerna"], "ans": 0, "why": "Organismo no gubernamental con más de 350 compañías aéreas que representan el 80 % del tráfico aéreo.", "src": "Manual ap. 2.5, p. 22", "note": ""}, {"n": 52, "stem": "¿Qué organización cuenta con «miembros de pleno derecho» (ANSP) y «miembros asociados»?", "opts": ["ACI", "IATA", "CANSO", "EUROCAE"], "ans": 2, "why": "CANSO, la Organización de Servicios de Navegación Aérea Civil (<em>Civil Air Navigation Services Organisation</em>).", "src": "Manual ap. 2.5, p. 22", "note": ""}, {"n": 53, "stem": "Según el manual, ACI agrupa:", "opts": ["350 compañías aéreas", "2181 aeropuertos pertenecientes a 830 operadores en 170 países", "500 empresas de electrónica", "23 agencias espaciales"], "ans": 1, "why": "ACI es el Consejo Internacional de Aeropuertos (<em>Airports Council International</em>).", "src": "Manual ap. 2.5, p. 23", "note": ""}, {"n": 54, "stem": "¿Qué organismo español es la máxima autoridad aeronáutica civil?", "opts": ["AESA", "ENAIRE", "El Ministerio de Transportes y Movilidad Sostenible", "CIDETRA"], "ans": 2, "why": "Dentro de la Administración General del Estado; varias entidades ejercen sus funciones.", "src": "Manual ap. 3.1, p. 23", "note": ""}, {"n": 55, "stem": "El «desdoblamiento de la autoridad aeronáutica» en España se estableció mediante:", "opts": ["La Ley 21/2003", "El Real Decreto 184/2008", "La Ley 9/2010", "El Real Decreto 160/2023"], "ans": 1, "why": "Separa la DGAC (política y circulares) y AESA (inspección y sanción).", "src": "Manual ap. 3.2, p. 23", "note": ""}, {"n": 56, "stem": "¿Qué organismo aprueba las circulares aeronáuticas?", "opts": ["AESA", "La DGAC", "ENAIRE", "El Consejo de Ministros"], "ans": 1, "why": "La DGAC aprueba las circulares por iniciativa propia o a propuesta de AESA.", "src": "Manual aps. 3.2, 3.3.1 y 4.2.3.1, pp. 23, 24, 35", "note": ""}, {"n": 57, "stem": "¿Qué comisión preside la DGAC?", "opts": ["CIPAI", "SCA", "CIAIAC", "CIDETRA"], "ans": 3, "why": "La Comisión Interministerial Defensa-Transportes; la CIPAI está adscrita a Asuntos Exteriores.", "src": "Manual ap. 3.3.1, p. 24", "note": ""}, {"n": 58, "stem": "Las dos Subdirecciones Generales de la DGAC son:", "opts": ["Transporte Aéreo, y Aeropuertos y Navegación Aérea", "Seguridad de Aeronaves, y Navegación Aérea", "Estrategia, y Regulación", "Aeropuertos, y Recursos Humanos"], "ans": 0, "why": "Además de una Unidad de Apoyo.", "src": "Manual ap. 3.3.2, p. 25", "note": ""}, {"n": 59, "stem": "La CIAIAC está adscrita a:", "opts": ["La Subsecretaría del Ministerio de Transportes y Movilidad Sostenible", "AESA", "La DGAC", "El Ministerio de Defensa"], "ans": 0, "why": "Investiga los accidentes e incidentes ocurridos en territorio español.", "src": "Manual ap. 3.3.3, p. 25", "note": ""}, {"n": 60, "stem": "¿Cuál NO es un componente de un informe de la CIAIAC?", "opts": ["La información factual", "El análisis", "La determinación del responsable", "Las recomendaciones de seguridad"], "ans": 2, "why": "La investigación es exclusivamente técnica y no determina culpa ni responsabilidad.", "src": "Manual ap. 3.3.3, p. 25", "note": ""}, {"n": 61, "stem": "Entre las funciones de AESA figura:", "opts": ["Gestionar el Registro de matrícula de aeronaves", "Prestar el servicio de control de área", "Gestionar 46 aeropuertos", "Presidir la CIDETRA"], "ans": 0, "why": "La DSA gestiona el Registro. La B corresponde a ENAIRE, la C a Aena y la D a la DGAC.", "src": "Manual aps. 3.4.1-3.4.2, pp. 26-27", "note": ""}, {"n": 62, "stem": "¿En qué dirección de AESA se integra la Oficina de Seguridad en Vuelo (OSV)?", "opts": ["Dirección de Navegación Aérea", "Dirección de Seguridad de Aeronaves (DSA)", "Dirección de Aeropuertos y Seguridad de la Aviación Civil", "Dirección de Gestión de la Seguridad y Personal de Vuelo"], "ans": 1, "why": "La OSV está integrada en la DSA.", "src": "Manual ap. 3.4.2, p. 27", "note": ""}, {"n": 63, "stem": "¿Qué dirección de AESA es el «órgano sustantivo» en la evaluación ambiental?", "opts": ["Dirección de Seguridad de Aeronaves", "Dirección de Navegación Aérea", "Dirección de Gestión de la Seguridad y Personal de Vuelo", "Dirección de Aeropuertos y Seguridad de la Aviación Civil"], "ans": 3, "why": "También se ocupa de los aeropuertos, la interferencia ilícita y la facilitación.", "src": "Manual ap. 3.4.2, p. 27", "note": ""}, {"n": 64, "stem": "Aena S.M.E., S.A. gestiona en España:", "opts": ["46 aeropuertos y 2 helipuertos", "32 aeropuertos y 46 helipuertos", "48 aeropuertos", "21 aeropuertos y 5 helipuertos"], "ans": 0, "why": "Además de participar en 32 aeropuertos en el extranjero.", "src": "Manual aps. 3.5 y 3.5.2, pp. 27-28", "note": ""}, {"n": 65, "stem": "Según el apartado sobre los orígenes de Aena (3.5.1), AENA (Aeropuertos Españoles y Navegación Aérea) se constituyó como ente público mediante qué Real Decreto?", "opts": ["Real Decreto 184/2008", "Real Decreto-ley 13/2010", "Real Decreto 905/1991", "Real Decreto 160/2023"], "ans": 2, "why": "El apartado 3.5.1 dice que AENA se constituyó por el Real Decreto 905/1991. El RDL 13/2010 liberalizó después los servicios aeroportuarios; el RD 184/2008 es el Estatuto de AESA y el RD 160/2023, el de ENAIRE. (El apartado 4.4.2 atribuye por separado a la Ley 4/1990, art. 82, la creación del ente, véase Q98; esa ley se ha quitado de las opciones para evitar dos respuestas defendibles.)", "src": "Manual ap. 3.5.1, p. 27", "note": ""}, {"n": 66, "stem": "¿Qué porcentaje de capital privado tenía Aena Aeropuertos, S.A. cuando se creó por el RDL 13/2010?", "opts": ["51 %", "25 %", "100 %", "49 %"], "ans": 3, "why": "49 % de capital privado; la participación de Aena en Luton es del 51 %.", "src": "Manual ap. 3.5.1, p. 28", "note": ""}, {"n": 67, "stem": "El Documento de Regulación Aeroportuaria (DORA) se estableció en:", "opts": ["2014", "2010", "1991", "2017"], "ans": 0, "why": "Fija el régimen de inversiones y el ingreso máximo por pasajero.", "src": "Manual ap. 3.5.1, p. 28", "note": ""}, {"n": 68, "stem": "Aena, S.A. cotiza en bolsa desde:", "opts": ["El 1 de enero de 1986", "El 11 de febrero de 2015", "Abril de 2017", "Julio de 2014"], "ans": 1, "why": "Julio de 2014 fue el cambio de denominación y abril de 2017, la incorporación de S.M.E.", "src": "Manual ap. 3.5.1, p. 28", "note": ""}, {"n": 69, "stem": "En 2024, el récord de Aena fue de:", "opts": ["1,5 millones de operaciones y 200 millones de pasajeros", "3 millones de operaciones y 400 millones de pasajeros", "2,5 millones de operaciones y 309,3 millones de pasajeros", "2,19 millones de operaciones y 96,7 millones de pasajeros"], "ans": 2, "why": "Cifras del manual.", "src": "Manual ap. 3.5.2, p. 28", "note": ""}, {"n": 70, "stem": "ENAIRE es la empresa designada para prestar los servicios de tránsito aéreo en ruta y en aproximación en virtud de:", "opts": ["La Ley 9/2010", "La Ley 48/1960", "La Ley 21/2003", "La Ley 18/2014"], "ans": 0, "why": "Así se indica en 3.6.1.", "src": "Manual ap. 3.6.1, p. 29", "note": ""}, {"n": 71, "stem": "El espacio aéreo controlado por ENAIRE tiene una superficie de:", "opts": ["1,19 millones de km²", "2,19 millones de km²", "3,5 millones de km²", "2,5 millones de km²"], "ans": 1, "why": "2,19 millones de km²; 2,5 millones es el número de vuelos en 2024.", "src": "Manual ap. 3.6.2, p. 29", "note": ""}, {"n": 72, "stem": "¿Qué pareja asocia correctamente una Dirección regional de Navegación Aérea con la sede de su ACC?", "opts": ["Este - Sevilla", "Sur - Barcelona", "Baleares - Madrid", "Centro Norte - Madrid"], "ans": 3, "why": "Este - Barcelona, Sur - Sevilla, Baleares - Palma de Mallorca, Canaria - Canarias.", "src": "Manual ap. 3.6.2, p. 29", "note": ""}, {"n": 73, "stem": "Los dos TACC de ENAIRE están ubicados en:", "opts": ["Madrid y Barcelona", "Sevilla y Palma", "Santiago y Valencia", "Bilbao y Málaga"], "ans": 2, "why": "Además de 21 torres de control.", "src": "Manual ap. 3.6.2, p. 29", "note": ""}, {"n": 74, "stem": "Según el manual, ¿cuántas torres de control gestiona ENAIRE?", "opts": ["21", "16", "5", "46"], "ans": 0, "why": "Cinco direcciones regionales, dos TACC y 21 torres.", "src": "Manual ap. 3.6.2, p. 29", "note": ""}, {"n": 75, "stem": "¿Qué asociación se fundó en 2004 y cuenta entre sus miembros con Iberia, Vueling y Binter Canarias?", "opts": ["AECA", "ALA", "AOC", "ACETA"], "ans": 3, "why": "AECA se fundó en 1988; ALA tiene más de 50 años.", "src": "Manual ap. 3.7, p. 30", "note": ""}, {"n": 76, "stem": "La CIDETRA se creó en:", "opts": ["1946", "1977", "1979", "1986"], "ans": 2, "why": "1946 es la CIPAI, 1977 el Ministerio de Transportes, Turismo y Comunicaciones y 1986 el Comité de Coordinación Operativa.", "src": "Manual ap. 3.8, p. 31", "note": ""}, {"n": 77, "stem": "La CIPAI está adscrita al:", "opts": ["Ministerio de Defensa", "Ministerio de Transportes", "Ministerio de Asuntos Exteriores", "Ministerio del Interior"], "ans": 2, "why": "Creada en 1946 como Comisión Interministerial de Política Aérea Internacional.", "src": "Manual ap. 3.8, p. 31", "note": ""}, {"n": 78, "stem": "¿Quiénes participan en el Subcomité de la Circulación Aérea (SCA)?", "opts": ["ENAIRE, DGAC, AEMET y compañías aéreas españolas", "AESA, Aena e IATA", "Defensa, Asuntos Exteriores e Interior", "CIAIAC y EASA"], "ans": 0, "why": "Coordina los requisitos operativos identificados y justificados por los usuarios.", "src": "Manual ap. 3.8, p. 31", "note": ""}, {"n": 79, "stem": "¿Qué rama del Derecho contiene las normas sobre el contrato de transporte aéreo?", "opts": ["El Derecho administrativo", "El Derecho laboral", "El Derecho penal", "El Derecho mercantil"], "ans": 3, "why": "Derecho mercantil; el Derecho laboral regula las condiciones de trabajo de las tripulaciones.", "src": "Manual ap. 4.1, p. 32", "note": ""}, {"n": 80, "stem": "En España, los convenios internacionales forman parte del ordenamiento jurídico solo si:", "opts": ["Los ha firmado el Ministro", "Han sido ratificados y publicados en el BOE", "Son Anexos de la OACI", "Los ha aprobado EASA"], "ans": 1, "why": "Así se indica para los acuerdos multilaterales.", "src": "Manual ap. 4.2.1, p. 32", "note": ""}, {"n": 81, "stem": "El Convenio de Montreal de 28 de mayo de 1999 deroga y sustituye al:", "opts": ["Convenio de Chicago", "Convenio de Varsovia de 1929", "Convenio de Tokio", "Convenio de Roma de 1933"], "ans": 1, "why": "El Convenio de Varsovia (12 de octubre de 1929), modif
