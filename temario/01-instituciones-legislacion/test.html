 "EASA «se creó en 2002 y actualmente se rige por el Reglamento UE 2018/1139». El 2024/2803 es el relativo a la realización del Cielo Único Europeo, el 2017/373 fija requisitos para los proveedores ATM/ANS y el 376/2014 trata de la notificación de sucesos. Pregunta de examen real (2017): su clave era el Reglamento (CE) 1592/2002, que esta edición del manual ya no cita.", "src": "Manual 1 (nov. 2026), capítulo 2.4.1, p. 22", "note": ""}, {"n": 442, "stem": "¿Qué Anexo de la OACI trata de los servicios de tránsito aéreo?", "opts": ["Anexo 10", "Anexo 14", "Anexo 2", "Anexo 11"], "ans": 3, "why": "En la tabla de Anexos, el 11 es «Servicios de tránsito aéreo». El 10 es Telecomunicaciones aeronáuticas, el 14 Aeródromos y el 2 Reglamento del aire. Pregunta de examen real (2017): qué Anexo regula los servicios de tránsito aéreo.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 443, "stem": "La Organización Europea para la Seguridad de la Navegación Aérea es:", "opts": ["EASA", "CEAC", "EUROCONTROL", "EUROCAE"], "ans": 2, "why": "«EUROCONTROL es la Organización Europea para la Seguridad de la Navegación Aérea». EASA es la Agencia de Seguridad Aérea de la Unión Europea, la CEAC la Conferencia Europea de Aviación Civil y EUROCAE la Organización Europea para el Equipamiento en la Aviación Civil. Pregunta de examen real (2017): nombre completo de EUROCONTROL.", "src": "Manual 1 (nov. 2026), capítulo 2.2.1, p. 12", "note": ""}, {"n": 444, "stem": "¿Cómo se llama la tercera libertad del aire?", "opts": ["Libertad de Transporte al Exterior", "Libertad de Transporte al Interior", "Libertad de Escala Técnica", "Libertad de Transporte Externo Consecutivo"], "ans": 0, "why": "«Tercera libertad: Llamada Libertad de Transporte al Exterior»: desembarcar en el Estado B pasajeros, correo y carga tomados en el Estado A. La de Transporte al Interior es la cuarta, la de Escala Técnica la segunda y la de Transporte Externo Consecutivo la quinta. Pregunta de examen real (2017): nombre de la tercera libertad.", "src": "Manual 1 (nov. 2026), capítulo 4.2.1, p. 36", "note": ""}, {"n": 445, "stem": "¿De qué año es la Ley de Navegación Aérea?", "opts": ["1990", "1960", "2003", "2014"], "ans": 1, "why": "La normativa de primer nivel empieza por la «Ley 48/1960 de Navegación Aérea». 1990 es la Ley 4/1990 (creación de Aena), 2003 la Ley 21/2003 de Seguridad Aérea y 2014 la Ley 18/2014. Pregunta de examen real (2017): año de la Ley de Navegación Aérea vigente.", "src": "Manual 1 (nov. 2026), capítulo 4.4.1, p. 47", "note": ""}, {"n": 446, "stem": "¿Cuál NO figura entre los principales objetivos alcanzados por el Cielo Único Europeo?", "opts": ["La separación de las funciones de provisión de servicio de navegación aérea y de supervisión", "El establecimiento de un Gestor de Red Europeo", "La certificación de productos aeronáuticos diseñados en países terceros", "Un sistema común de tarificación con transparencia de las tasas"], "ans": 2, "why": "El cuadro de objetivos alcanzados del SES incluye la separación de provisión y supervisión, la certificación de los proveedores de servicio de tránsito aéreo, el regulador comunitario, el Gestor de Red Europeo, el sistema de evaluación de rendimientos, el espacio aéreo como elemento continuo y la transparencia de las tasas. La certificación de productos aeronáuticos en países terceros es una tarea de EASA (p. 23). Pregunta de examen real (2017): objetivo que no pertenece al SES.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.2, pp. 19-20", "note": ""}, {"n": 447, "stem": "El Anexo 10 de la OACI trata de:", "opts": ["Telecomunicaciones aeronáuticas", "Servicios de tránsito aéreo", "Servicio meteorológico para la navegación aérea internacional", "Servicios de información aeronáutica"], "ans": 0, "why": "En la tabla de Anexos, el 10 es «Telecomunicaciones aeronáuticas». Servicios de tránsito aéreo es el 11, el servicio meteorológico el 3 y los servicios de información aeronáutica el 15.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 448, "stem": "¿Qué Anexo de la OACI trata de los aeródromos?", "opts": ["Anexo 6", "Anexo 11", "Anexo 14", "Anexo 16"], "ans": 2, "why": "En la tabla de Anexos, el 14 es «Aeródromos». El 6 es Operación de aeronaves, el 11 Servicios de tránsito aéreo y el 16 Protección del medio ambiente.", "src": "Manual 1 (nov. 2026), capítulo 2.1.6.1, p. 10", "note": ""}, {"n": 449, "stem": "Las normas que regulan el contrato de transporte aéreo forman parte del:", "opts": ["Derecho administrativo", "Derecho internacional público", "Derecho laboral", "Derecho mercantil"], "ans": 3, "why": "En el cuadro de ramas del Derecho aeronáutico, el Derecho Mercantil es aquel «del que forman parte las normas que regulan el contrato de transporte aéreo». El administrativo regula aeródromos, licencias y sanciones; el internacional público, las normas derivadas de acuerdos internacionales; el laboral, las condiciones de trabajo de las tripulaciones.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 450, "stem": "Las normas que determinan y reprueban los delitos aeronáuticos proceden del:", "opts": ["Derecho administrativo", "Derecho penal", "Derecho mercantil", "Derecho internacional público"], "ans": 1, "why": "El Derecho Penal es aquel «del que proceden las normas que determinan y reprueban los delitos aeronáuticos». La imposición de sanciones administrativas es Derecho administrativo y el contrato de transporte, Derecho mercantil.", "src": "Manual 1 (nov. 2026), capítulo 4.1, p. 35", "note": ""}, {"n": 451, "stem": "¿Cuántos miembros tiene EUROCAE?", "opts": ["Más de 500", "Más de 350", "400", "23"], "ans": 0, "why": "EUROCAE tiene «más de 500 entre especialistas en aviación, universidades, laboratorios, fabricantes, reguladores, proveedores de servicios y/o usuarios». Más de 350 aerolíneas es IATA, 400 organizaciones es RTCA y 23 Estados Miembros es la ESA.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 24", "note": ""}, {"n": 452, "stem": "El Real Decreto 184/2008 aprueba el Estatuto de:", "opts": ["ENAIRE", "La CIAIAC", "Aena S.M.E., S.A.", "AESA"], "ans": 3, "why": "En el resumen de normativa nacional: «Real Decreto 184/2008 que aprueba el Estatuto de AESA». Es también la norma del desdoblamiento de la autoridad aeronáutica entre la DGAC y AESA (p. 26).", "src": "Manual 1 (nov. 2026), capítulo 4.4.2, p. 49", "note": ""}, {"n": 453, "stem": "¿Qué significan las siglas RTCA?", "opts": ["Regional Technical Committee for Aviation", "Radio Technical Commission for Aeronautics", "Radio Traffic Control Association", "Research and Technology Council for Air navigation"], "ans": 1, "why": "RTCA es la «Comisión Radiotécnica para la aeronáutica / Radio Technical Commission for Aeronautics», organización estadounidense sin ánimo de lucro con sede en Washington D.C.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}, {"n": 454, "stem": "¿Qué es la EAD?", "opts": ["La agencia europea de defensa aérea de la Unión Europea", "El sistema europeo de gestión del tráfico aéreo de EUROCONTROL", "La base de datos AIS a nivel europeo", "El directorado de EUROCONTROL que gestiona las tasas de ruta"], "ans": 2, "why": "EAD es la «European AIS Database / Base de datos AIS a nivel europeo», desarrollada por los Estados miembros de EUROCONTROL. El sistema europeo de gestión del tráfico aéreo es el EATMS y las tasas de ruta las gestiona la Directorate Central Route Charges Office.", "src": "Manual 1 (nov. 2026), capítulo 2.2.7, p. 14", "note": ""}, {"n": 455, "stem": "¿Qué significan las siglas NMOC?", "opts": ["Network Manager Operations Center", "Network Management Oversight Committee", "National Movement Operations Centre", "Network Monitoring and Optimisation Cell"], "ans": 0, "why": "NMOC es el «Network Manager Operations Center / Centro de Operaciones del Gestor de Red», operativo desde marzo de 1996, que centraliza el control de la afluencia en Europa.", "src": "Manual 1 (nov. 2026), capítulo 2.3.6.4, p. 21", "note": ""}, {"n": 456, "stem": "¿Qué significan las siglas AECA?", "opts": ["Asociación de Compañías Españolas de Transporte Aéreo", "Asociación Española de Compañías Aéreas", "Asociación de Líneas Aéreas", "Asociación Española de Controladores Aéreos"], "ans": 1, "why": "En el cuadro de asociaciones, AECA es la «Asociación Española de Compañías Aéreas», fundada en 1988. La Asociación de Compañías Españolas de Transporte Aéreo es ACETA y la Asociación de Líneas Aéreas es ALA.", "src": "Manual 1 (nov. 2026), capítulo 3.7, p. 33", "note": ""}, {"n": 457, "stem": "¿Qué significan las siglas ACI?", "opts": ["Asociación de Compañías Internacionales", "Asociación Internacional del Transporte Aéreo", "Agencia de Control Internacional", "Consejo Internacional de Aeropuertos"], "ans": 3, "why": "ACI es el «Consejo Internacional de Aeropuertos / Airports Council International». La Asociación Internacional del Transporte Aéreo es la IATA.", "src": "Manual 1 (nov. 2026), capítulo 2.5, p. 25", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/01-instituciones-legislacion/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
