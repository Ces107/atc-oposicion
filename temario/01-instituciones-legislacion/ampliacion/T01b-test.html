<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Europa: EASA, EUROCONTROL, la UE y el Cielo Único Europeo (T01b)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;

  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:nowrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em;flex:none;white-space:nowrap}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem;min-width:0;flex:0 1 auto}
header.top a.back>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}
header.top .hd-end{display:flex;align-items:center;justify-content:flex-end;gap:1.1rem;flex:none;min-width:8.4rem;margin-left:auto}
header.top #acct-slot{min-width:28px;min-height:28px;justify-content:flex-end}
header.top .hbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
header.top .hbtn:hover,header.top .hbtn[aria-expanded=true]{color:var(--acc)}
@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}
@media (max-width:640px){
  header.top{gap:0;padding:2px .4rem 2px .6rem;min-height:49px}
  header.top a.home{min-height:44px;padding-right:.5rem}
  header.top.hb a.home .brand{display:none}
  header.top a.back{min-height:44px;flex:1 1 auto;padding-right:.3rem}
  header.top .cmdk-btn .lbl,header.top .cmdk-btn .kbd{display:none}
  header.top .cmdk-btn,header.top .nextbtn{width:44px;height:44px;justify-content:center;padding:0;gap:0;flex:none}
  header.top .nextbtn{font-size:0;margin:0}
  header.top .cmdk-btn svg.i,header.top .hbtn svg.i{width:20px;height:20px}
  header.top .nextbtn svg.i{width:18px;height:18px}
  header.top .hd-end{gap:0;min-width:88px;margin-left:0}
  header.top #acct-slot{min-width:44px;min-height:44px}
}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
@media (max-width:640px){.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:.5rem;white-space:nowrap;font-size:13px}.bar::-webkit-scrollbar{display:none}.bar>*{flex:0 0 auto}.bar button{padding:6px 9px}.bar #score{margin-right:.2rem}}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}

@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}
  #toc>b{padding:.6rem 0 .3rem}
  #toc a{display:block;padding:.8rem 0;line-height:1.35}
}
@media (max-width:900px),(pointer:coarse){table.src td.act a{min-height:44px;min-width:44px;padding:0 .35rem;margin-right:.3rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}

.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}

.cmdk-overlay.open{display:block}

.figs b{display:block;font:700 1.55rem/1.15 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}

c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Instituciones y legislación aeronáutica</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Europa: EASA, EUROCONTROL, la UE y el Cielo Único Europeo (T01b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Qué reglamento estableció originalmente EASA, antes de ser sustituido por el Reglamento (CE) n.º 216/2008?", "opts": ["Reglamento (CE) n.º 1592/2002", "Reglamento (CE) n.º 549/2004", "Reglamento (UE) 2015/340", "Reglamento (CE) n.º 552/2004"], "ans": 0, "why": "EASA se estableció mediante el Reglamento (CE) n.º 1592/2002, de 15 de julio de 2002. El 549/2004 es el reglamento marco del SES, el 2015/340 regula las licencias ATCO y el 552/2004 fue el reglamento de interoperabilidad del SES.", "src": "Reglamento (UE) 2018/1139, considerando 51, leído completo", "note": ""}, {"n": 2, "stem": "¿Qué dos reglamentos derogó expresamente el Reglamento (UE) 2018/1139?", "opts": ["216/2008 y 552/2004", "549/2004 y 550/2004", "216/2008 y 923/2012", "1592/2002 y 2015/340"], "ans": 0, "why": "El 2018/1139 derogó el anterior reglamento base de EASA (216/2008) y el reglamento de interoperabilidad del SES (552/2004). Los reglamentos marco y de prestación de servicios del SES (549/2004 y 550/2004) fueron derogados más tarde por el Reglamento (UE) 2024/2803, no por el 2018/1139.", "src": "Reglamento (UE) 2018/1139, título y considerandos, leído completo", "note": ""}, {"n": 3, "stem": "¿Qué anexo del Reglamento (UE) 2018/1139 establece los requisitos esenciales de ATM/ANS y de los controladores de tránsito aéreo?", "opts": ["Anexo II", "Anexo III", "Anexo VII", "Anexo VIII"], "ans": 3, "why": "El anexo VIII trata de los requisitos esenciales de ATM/ANS y de los ATCO; el anexo VII, de los aeródromos; el anexo II, de la aeronavegabilidad y el anexo III, de la compatibilidad medioambiental de los productos.", "src": "Reglamento (UE) 2018/1139, leído completo", "note": ""}, {"n": 4, "stem": "¿Cuántos Estados miembros forman actualmente el Consejo de Administración de EASA y qué Estados no pertenecientes a la UE figuran entre ellos?", "opts": ["27; ningún Estado ajeno a la UE", "31; Islandia, Liechtenstein, Noruega y Suiza", "32; se incluye el Reino Unido", "42; los mismos que EUROCONTROL"], "ans": 1, "why": "EASA tiene 31 Estados miembros: los 27 de la UE más los cuatro Estados de la AELC (Islandia, Liechtenstein, Noruega y Suiza). La Comisión Europea también forma parte del Consejo, pero no es un «Estado miembro».", "src": "Página oficial de EASA «Management Board Members», leída completa", "note": ""}, {"n": 5, "stem": "¿Quién es el Director Ejecutivo de EASA según el Informe de actividad anual de 2025?", "opts": ["Raúl Medina", "Patrick Ky", "Ana Vieira da Mata", "Florian Guillermet"], "ans": 3, "why": "Florian Guillermet es el Director Ejecutivo de EASA; Raúl Medina es el Director General de EUROCONTROL y Ana Vieira da Mata preside el Consejo de Administración de EASA.", "src": "Informe consolidado de actividad anual de EASA 2025, leído completo", "note": ""}, {"n": 6, "stem": "¿Cuántos empleados en equivalente a tiempo completo (ETC) declaró EASA en 2025?", "opts": ["271", "471", "771", "1271"], "ans": 2, "why": "El Informe consolidado de actividad anual de 2025 indica que EASA empleó 771 ETC en 2025.", "src": "Informe consolidado de actividad anual de EASA 2025, leído completo", "note": ""}, {"n": 7, "stem": "¿Cuál de las siguientes es una de las cuatro direcciones ejecutivas actuales de EASA?", "opts": ["Dirección de Estrategia y Gestión de la Seguridad", "Dirección de Gestión de la Seguridad, Sostenibilidad y Relaciones Exteriores", "Dirección de Gestión de la Red", "Dirección del Cielo Único Paneuropeo"], "ans": 1, "why": "El organigrama vigente de EASA enumera Certificación, Normas de Vuelo, Gestión de la Seguridad/Sostenibilidad/Relaciones Exteriores, y Recursos y Apoyo; las demás opciones son un nombre antiguo o pertenecen a EUROCONTROL, no a EASA.", "src": "Página oficial de EASA «Agency Organisation Structure», leída completa", "note": ""}, {"n": 8, "stem": "En un proceso normativo de EASA, ¿qué sigue inmediatamente a una Notificación de propuesta de enmienda (NPA) y a la consulta pública, antes de enviar el asunto a la Comisión Europea?", "opts": ["Un Documento de respuesta a los comentarios (CRD) y un Dictamen", "Una Especificación de certificación (CS)", "Una resolución de la Sala de Recurso", "Un Medio aceptable de cumplimiento (AMC)"], "ans": 0, "why": "Tras la NPA y los comentarios, EASA emite un Documento de respuesta a los comentarios y un Dictamen, que pasa después a la Comisión; los AMC y las CS son productos distintos, no vinculantes, que EASA emite por sí misma.", "src": "Proceso normativo de EASA, contrastado con el manual y con la descripción pública de EASA", "note": ""}, {"n": 9, "stem": "¿Cuál de estos productos normativos de EASA NO es jurídicamente vinculante por sí mismo, de modo que un operador puede demostrar el cumplimiento mediante un Medio alternativo de cumplimiento (AltMoC)?", "opts": ["Un acto de ejecución publicado en el Diario Oficial", "Un acto delegado", "Los Medios aceptables de cumplimiento (AMC)", "El propio Reglamento base"], "ans": 2, "why": "Los AMC (y el material de orientación y las CS) son material de orientación de la propia EASA, no directamente vinculante; los actos de ejecución y delegados y el Reglamento base son Derecho de la UE directamente aplicable.", "src": "Estructura normativa del Reglamento (UE) 2018/1139", "note": ""}, {"n": 10, "stem": "¿Qué reglamento establece los requisitos comunes para los proveedores de ATM/ANS y otras funciones de la red ATM, y desarrolla los requisitos esenciales del anexo VIII del Reglamento base?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 923/2012", "Reglamento (UE) 376/2014", "Reglamento (UE) 2019/123"], "ans": 0, "why": "El Reglamento (UE) 2017/373 es el reglamento de requisitos comunes de ATM/ANS; el 923/2012 es SERA (reglas del aire), el 376/2014 trata de la notificación de sucesos y el 2019/123, de las funciones de red y del Gestor de Red.", "src": "Reglamento (UE) 2017/373, leído completo", "note": ""}, {"n": 11, "stem": "¿Qué Real Decreto español desarrolla el Reglamento (UE) 2017/373 en lo relativo al procedimiento de certificación de los ANSP y de las funciones ATM/ANS?", "opts": ["Real Decreto 184/2008", "Real Decreto 1516/2009", "Real Decreto 1180/2018", "Real Decreto 515/2020"], "ans": 3, "why": "El Real Decreto 515/2020 establece el procedimiento de certificación de los ANSP y de las funciones con arreglo al Reglamento 2017/373; el 184/2008 desdobla la autoridad aeronáutica, el 1516/2009 completa lo relativo a las licencias ATCO (2015/340) y el 1180/2018 desarrolla SERA.", "src": "Manual 1 (nov. 2026), capítulo 4.4.3, p. 53, contrastado con el ámbito del Reg. 2017/373", "note": ""}, {"n": 12, "stem": "¿Cuál es la edad mínima exigida para solicitar una licencia de alumno controlador de tránsito aéreo según el Reglamento (UE) 2015/340?", "opts": ["16 años", "18 años", "20 años", "21 años"], "ans": 1, "why": "ATCO.B.001(b)(1) exige que los solicitantes tengan al menos 18 años.", "src": "Reglamento (UE) 2015/340, ATCO.B.001, leído completo", "note": ""}, {"n": 13, "stem": "Según el Reglamento (UE) 2015/340, ¿qué ocurrió con las antiguas habilitaciones ADV y ADI el 4 de agosto de 2024?", "opts": ["Se fusionaron en una única habilitación de control de aeródromo (ADC)", "Se suprimieron sin sustitución", "Pasaron a ser anotaciones de unidad obligatorias en lugar de habilitaciones", "Se dividieron en ADV diurna y ADV nocturna"], "ans": 0, "why": "Desde el 4 de agosto de 2024, el texto consolidado vigente del Reglamento (UE) 2015/340 contiene una única habilitación de control de aeródromo (ADC) en lugar de las antiguas habilitaciones separadas ADV y ADI.", "src": "Reglamento (UE) 2015/340, consolidado a 13-05-2026, ATCO.B.010 y disposiciones transitorias, leído completo", "note": ""}, {"n": 14, "stem": "¿Cuál de las siguientes es una de las cinco habilitaciones ATC vigentes según el Reglamento (UE) 2015/340?", "opts": ["ADI (control de aeródromo por instrumentos)", "ADV (control de aeródromo visual)", "ACS (control de área con vigilancia)", "TWR (torre)"], "ans": 2, "why": "Las cinco habilitaciones vigentes son ADC, APP, APS, ACP y ACS; ADV y ADI ya no existen como habilitaciones separadas (se fusionaron en ADC en 2024) y «TWR» no es un código de habilitación del Reglamento.", "src": "Reglamento (UE) 2015/340, ATCO.B.010, leído completo", "note": ""}, {"n": 15, "stem": "¿Qué anotación puede llevar la habilitación de control de aproximación con vigilancia (APS) y acredita la competencia para prestar aproximaciones de precisión controladas desde tierra mediante equipo de radar de aproximación de precisión?", "opts": ["SUR", "OCN", "SRA", "PAR"], "ans": 3, "why": "PAR (radar de aproximación de precisión) es la anotación para las aproximaciones de precisión con equipo de radar de aproximación de precisión; SRA corresponde a las aproximaciones de vigilancia que no son de precisión, SUR es una anotación de ADC y OCN es para el control oceánico en ACP/ACS.", "src": "Reglamento (UE) 2015/340, ATCO.B.015, leído completo", "note": ""}, {"n": 16, "stem": "¿Cuál es el periodo máximo de validez que puede tener una anotación de unidad según el Reglamento (UE) 2015/340?", "opts": ["1 año", "2 años", "3 años", "5 años"], "ans": 2, "why": "ATCO.B.010(g) fija la validez de la anotación de unidad según lo definido en el plan de competencia de la unidad, sin exceder de 3 años.", "src": "Reglamento (UE) 2015/340, leído completo", "note": ""}, {"n": 17, "stem": "¿Durante cuánto tiempo es válida una anotación de competencia lingüística de nivel avanzado (nivel 5)?", "opts": ["3 años", "Ilimitadamente", "9 años", "6 años"], "ans": 3, "why": "El nivel operacional (4) es válido 3 años, el avanzado (5), 6 años, y el experto (6), 9 años para el inglés o sin límite para otros idiomas.", "src": "Reglamento (UE) 2015/340, ATCO.B.035, leído completo", "note": ""}, {"n": 18, "stem": "¿En qué caso es válida sin fecha de caducidad una anotación de competencia lingüística de nivel experto (nivel 6)?", "opts": ["El inglés, siempre", "Cualquier idioma distinto del inglés", "Solo el francés y el alemán", "En ninguno; el nivel 6 siempre caduca"], "ans": 1, "why": "El nivel 6 de inglés es válido 9 años; el nivel 6 de cualquier otro idioma es ilimitado.", "src": "Reglamento (UE) 2015/340, ATCO.B.035(a)(3), leído completo", "note": ""}, {"n": 19, "stem": "¿Cuál es el periodo de validez de un certificado médico de clase 3 de un ATCO menor de 40 años?", "opts": ["12 meses", "18 meses", "24 meses", "36 meses"], "ans": 2, "why": "ATCO.MED.A.045(a)(1) fija 24 meses; se reducen a 12 meses cuando el titular cumple 40 años, y un certificado expedido antes de los 40 deja de ser válido al cumplir los 41.", "src": "Reglamento (UE) 2015/340, leído completo", "note": ""}, {"n": 20, "stem": "Se expide un certificado médico de clase 3 a un controlador de 38 años. ¿Cuándo debe dejar de ser válido, a más tardar?", "opts": ["A los 24 meses de su expedición, con independencia de la edad", "Cuando el titular cumpla 39 años", "Cuando el titular cumpla 41 años", "A los 12 meses de su expedición"], "ans": 2, "why": "Un certificado expedido antes de que el titular cumpla 40 años deja de ser válido cuando este cumple 41, aunque sea antes de la caducidad nominal de 24 meses.", "src": "Reglamento (UE) 2015/340, ATCO.MED.A.045(a)(2), leído completo; ejemplo calculado en las notas de estudio de T01b §5", "note": ""}, {"n": 21, "stem": "¿Qué significa SERA (Reglamento (UE) 923/2012)?", "opts": ["Reglas del aire europeas normalizadas (<em>Standardised European Rules of the Air</em>)", "Agencia única de normativa europea (<em>Single European Rulemaking Agency</em>)", "Asignación estratégica de rutas europeas (<em>Strategic European Route Allocation</em>)", "Reglamento de seguridad y medio ambiente para la aviación (<em>Safety and Environmental Regulation for Aviation</em>)"], "ans": 0, "why": "SERA = <em>Standardised European Rules of the Air</em> (Reglas del Aire y Disposiciones Operativas Comunes); las demás expansiones son inventadas.", "src": "Reglamento (UE) 923/2012, título, leído completo", "note": ""}, {"n": 22, "stem": "¿Qué categoría de tránsito regula principalmente SERA?", "opts": ["Solo el tránsito aéreo operativo (OAT)", "Solo el tránsito VFR fuera del espacio aéreo controlado", "Solo los vuelos de transporte militar", "El tránsito aéreo general (GAT)"], "ans": 3, "why": "SERA se aplica al tránsito aéreo general (GAT), la categoría de tránsito con procedimientos OACI, frente al tránsito aéreo operativo (OAT), en su mayoría militar.", "src": "Reglamento (UE) 923/2012, ámbito de aplicación, leído completo", "note": ""}, {"n": 23, "stem": "¿En qué fecha entró en vigor el Convenio EUROCONTROL, tras firmarse el 13 de diciembre de 1960?", "opts": ["1 de enero de 1961", "1 de marzo de 1963", "4 de abril de 1967", "1 de marzo de 1970"], "ans": 1, "why": "El Convenio entró en vigor el 1 de marzo de 1963; la propia página «About us» de EUROCONTROL da 1963 como su año de fundación («Founded»).", "src": "Página oficial de EUROCONTROL «About us», leída completa", "note": ""}, {"n": 24, "stem": "¿Ha entrado formalmente en vigor para todas las Partes Contratantes el Convenio EUROCONTROL revisado de 1997?", "opts": ["Sí, en 2000, como estaba previsto", "Sí, pero solo en 2017", "No; nunca lo han ratificado todas las Partes y solo se aplica provisionalmente", "No; se retiró y nunca se aplicó"], "ans": 2, "why": "El artículo II.3 del propio Protocolo de 1997 exigía la ratificación de todos los Estados Partes antes del 1 de enero de 2000 para su entrada en vigor automática; no ocurrió, y en su lugar se aplican provisionalmente disposiciones clave desde 1998.", "src": "Protocolo consolidado de 1997 de EUROCONTROL, artículo II, leído completo; hecho de la aplicación provisional búsqueda web, contrastada con la página «Governing bodies» de EUROCONTROL", "note": ""}, {"n": 25, "stem": "¿En virtud de qué decisión y desde cuándo se han aplicado anticipadamente disposiciones del Convenio EUROCONTROL revisado de 1997 (incluido un Consejo Provisional)?", "opts": ["La Decisión n.º 72 de la Comisión Permanente, desde 1998", "El Reglamento 2018/1139 del Consejo, desde 2018", "Una resolución del Parlamento Europeo, desde 2004", "El Convenio de Chicago, desde 1947"], "ans": 0, "why": "La Decisión n.º 72 de la Comisión Permanente (anterior a 1997), adoptada el 9 de diciembre de 1997, permitió la aplicación anticipada de ciertas disposiciones del Convenio de 1997, entre ellas la creación de un Consejo Provisional, aplicada desde 1998.", "src": "Búsqueda web, contrastada con la página «Governing bodies» de EUROCONTROL", "note": ""}, {"n": 26, "stem": "¿Cómo denomina el artículo 5 del Convenio EUROCONTROL revisado de 1997 al órgano compuesto por representantes de las Partes Contratantes a nivel ministerial?", "opts": ["La Comisión Permanente", "El Consejo Provisional", "La Asamblea General", "El Consejo de la Agencia"], "ans": 2, "why": "El propio texto jurídico del Convenio llama al órgano de nivel ministerial «Asamblea General» («General Assembly»); «Comisión Permanente» es el nombre que se usa en la práctica institucional actual, conservado del Convenio anterior a 1997 por la situación de aplicación provisional.", "src": "Protocolo consolidado de 1997 de EUROCONTROL, artículo 5, leído completo", "note": ""}, {"n": 27, "stem": "¿Cuál es el Estado miembro de EUROCONTROL que se ha incorporado más recientemente, y en qué año?", "opts": ["Estonia, 2015", "Georgia, 2014", "Islandia, 2025", "Ucrania, 2004"], "ans": 2, "why": "Islandia se incorporó a EUROCONTROL en 2025, la última incorporación según la lista oficial de Estados miembros.", "src": "Página oficial de EUROCONTROL «About us», lista de miembros, leída completa", "note": ""}, {"n": 28, "stem": "¿Quién es el Director General de EUROCONTROL según la lista del Consejo de la Agencia de 2026?", "opts": ["Florian Guillermet", "Raúl Medina", "Peggy Devestel", "Iacopo Prissinotti"], "ans": 1, "why": "Raúl Medina es el Director General de EUROCONTROL; Guillermet dirige EASA, Devestel dirige el MUAC y Prissinotti dirige la Gestión de la Red.", "src": "Página oficial de EUROCONTROL «About us», lista del Consejo de la Agencia, leída completa", "note": ""}, {"n": 29, "stem": "¿En qué ciudad tiene su sede el organismo de formación de EUROCONTROL, el Centro de Aprendizaje de la Aviación (ALC)?", "opts": ["Bruselas", "Maastricht", "París", "Luxemburgo"], "ans": 3, "why": "El Centro de Aprendizaje de la Aviación (<em>Aviation Learning Centre</em>) tiene su sede en Luxemburgo, uno de los países con oficinas especializadas de EUROCONTROL, junto con los Países Bajos y Francia.", "src": "Informe anual 2024 del Gestor de Red de EUROCONTROL, leído completo", "note": ""}, {"n": 30, "stem": "¿En virtud de qué Decisión de Ejecución de la Comisión, y para qué periodo, se designó a EUROCONTROL como Gestor de Red?", "opts": ["Decisión (UE) 2019/709, 2020-2029", "Reglamento (UE) 2019/123, 2011-2020", "Reglamento (UE) 2024/2803, 2025-2034", "Decisión n.º 72, 1997-2007"], "ans": 0, "why": "La Decisión de Ejecución (UE) 2019/709 de la Comisión, de 6 de mayo de 2019, designó a EUROCONTROL Gestor de Red del 1 de enero de 2020 al 31 de diciembre de 2029.", "src": "Búsqueda web, contrastada con la nota al pie del artículo 58(4) del Reglamento (UE) 2024/2803 que cita la Decisión 2019/709, leído completo/", "note": ""}, {"n": 31, "stem": "¿Cuánto facturó la Oficina Central de Tasas de Ruta (CRCO) de EUROCONTROL en tasas de ruta, de terminal y de comunicación durante 2025?", "opts": ["1300 millones de euros", "4500 millones de euros", "13 200 millones de euros", "30 000 millones de euros"], "ans": 2, "why": "Las cifras «In 2025» de la propia CRCO indican 13 200 millones de euros facturados en tasas.", "src": "Página oficial de la CRCO de EUROCONTROL, leída completa", "note": ""}, {"n": 32, "stem": "¿En cuántos días desde la fecha de la factura debe pagar un usuario del espacio aéreo una factura de tasas de ruta de EUROCONTROL?", "opts": ["15 días", "60 días", "45 días", "30 días"], "ans": 3, "why": "El pago vence a los 30 días de la fecha de la factura; en cambio, una reclamación sobre la facturación puede presentarse en un plazo de 60 días.", "src": "Página oficial de la CRCO de EUROCONTROL, leída completa", "note": ""}, {"n": 33, "stem": "¿Qué órgano consultivo de EUROCONTROL publica el informe anual de comparación de la rentabilidad de ATM (<em>ATM Cost-Effectiveness Benchmarking Report</em>)?", "opts": ["La Comisión de Revisión del Rendimiento (PRC)", "El Comité de Partes Interesadas Civiles y Militares (CMSC)", "El Órgano Consultivo de la Agencia (AAB)", "El Consejo de Gestión de la Red"], "ans": 0, "why": "La Comisión de Revisión del Rendimiento (PRC) publica el informe de comparación de la rentabilidad de ATM; los demás órganos tienen otras funciones consultivas.", "src": "Noticias de la página oficial de la CRCO de EUROCONTROL, leídas completas", "note": ""}, {"n": 34, "stem": "¿Qué reglamento amplió las competencias de EASA a los aeródromos y a ATM/ANS y creó la función de Gestor de Red, y se conoce en general como «SES II»?", "opts": ["Reglamento (CE) n.º 549/2004", "Reglamento (CE) n.º 1070/2009", "Reglamento (UE) 2018/1139", "Reglamento (UE) 2024/2803"], "ans": 1, "why": "El Reglamento (CE) n.º 1070/2009 es el reglamento «SES II», que modificó los cuatro reglamentos del SES I para añadir estos elementos; el 549/2004 es el reglamento marco del SES I, el 2018/1139 es el Reglamento base de EASA y el 2024/2803 es la refundición de 2024.", "src": "Reglamento (UE) 1070/2009, finalidad confirmada en la biblioteca, contrastada con los considerandos del Reglamento (UE) 2024/2803", "note": ""}, {"n": 35, "stem": "¿Qué reglamento del SES I fue derogado por el Reglamento (UE) 2018/1139 y no por la refundición del SES de 2024?", "opts": ["Reglamento (CE) n.º 549/2004", "Reglamento (CE) n.º 550/2004", "Reglamento (CE) n.º 551/2004", "Reglamento (CE) n.º 552/2004"], "ans": 3, "why": "El Reglamento de interoperabilidad 552/2004 fue derogado por el Reglamento base de EASA (2018/1139); los reglamentos marco, de prestación de servicios y del espacio aéreo (549, 550 y 551/2004) fueron derogados después por el Reglamento (UE) 2024/2803.", "src": "Reglamento (UE) 2018/1139 y Reglamento (UE) 2024/2803, ambos leídos completos", "note": ""}, {"n": 36, "stem": "¿En qué fecha adoptaron el Parlamento Europeo y el Consejo el Reglamento (UE) 2024/2803?", "opts": ["11 de noviembre de 2024", "1 de diciembre de 2024", "2 de diciembre de 2026", "23 de octubre de 2024"], "ans": 3, "why": "El Reglamento está «hecho en Estrasburgo, el 23 de octubre de 2024»; se publicó en el Diario Oficial el 11 de noviembre de 2024 y entró en vigor aproximadamente el 1 de diciembre de 2024 (20 días después de su publicación).", "src": "Reglamento (UE) 2024/2803, disposiciones finales, leído completo", "note": ""}, {"n": 37, "stem": "¿Cuándo entró en vigor el Reglamento (UE) 2024/2803?", "opts": ["En la fecha de su adopción, el 23 de octubre de 2024", "El vigésimo día siguiente al de su publicación en el Diario Oficial", "El 2 de diciembre de 2026", "El 1 de enero de 2025"], "ans": 1, "why": "El artículo 59 fija la entrada en vigor a los 20 días de la publicación en el DO (11 de noviembre de 2024), es decir, hacia el 1 de diciembre de 2024; el 2 de diciembre de 2026 es, en cambio, la fecha en que empiezan a aplicarse varios artículos concretos.", "src": "Reglamento (UE) 2024/2803, artículo 59, leído completo", "note": ""}, {"n": 38, "stem": "¿Qué artículos del Reglamento (UE) 2024/2803 solo empiezan a aplicarse a partir del 2 de diciembre de 2026?", "opts": ["Los artículos 1 a 3", "Los artículos 4(3), 4(5), 36(3) y 53", "Los artículos 21 a 34", "Los artículos 13 a 16"], "ans": 1, "why": "El artículo 59 aplaza al 2 de diciembre de 2026 los artículos 4(3), 4(5), 36(3) y 53; los artículos 13 a 16 se aplican a los 6 meses de la entrada en vigor y los artículos 21 a 34 se aplican desde la entrada en vigor, pero solo a partir del RP5.", "src": "Reglamento (UE) 2024/2803, artículo 59, leído completo", "note": ""}, {"n": 39, "stem": "¿A partir de qué periodo de referencia rigen realmente la aplicación los nuevos artículos 21 a 34 del sistema de evaluación del rendimiento del Reglamento (UE) 2024/2803?", "opts": ["RP2 (2015-2019)", "RP3 (2020-2024)", "RP4 (2025-2029)", "RP5 y los periodos de referencia posteriores"], "ans": 3, "why": "El artículo 59 dice que los artículos 21 a 34 se aplican desde la entrada en vigor «a efectos de la aplicación de los sistemas de evaluación del rendimiento y de tarificación correspondientes al quinto periodo de referencia y a los posteriores»; el RP4 continúa bajo la antigua arquitectura de los Reglamentos 549/2004-550/2004 según el artículo transitorio 58.", "src": "Reglamento (UE) 2024/2803, artículos 58 y 59, leído completo", "note": ""}, {"n": 40, "stem": "¿Cuáles son las cuatro áreas clave de rendimiento (KPA) del sistema de evaluación del rendimiento y de tarificación del SES?", "opts": ["Seguridad operacional, medio ambiente, capacidad, rentabilidad", "Seguridad operacional, seguridad de la aviación, capacidad, puntualidad", "Medio ambiente, rentabilidad, puntualidad, seguridad de la aviación", "Seguridad operacional, capacidad, conectividad, resiliencia"], "ans": 0, "why": "El Reglamento (UE) 2019/317 estructura el sistema en torno a la seguridad operacional, el medio ambiente, la capacidad y la rentabilidad; las demás opciones sustituyen algunas áreas por otras de apariencia verosímil pero incorrectas.", "src": "Reglamento (UE) 2019/317, leído completo; contrastado con la descripción del ESPP4", "note": ""}, {"n": 41, "stem": "¿Qué años abarca el RP4, el periodo de referencia vigente del sistema de evaluación del rendimiento del SES?", "opts": ["2015-2019", "2020-2024", "2025-2029", "2030-2034"], "ans": 2, "why": "RP1 = 2012-2014, RP2 = 2015-2019, RP3 = 2020-2024, RP4 (vigente) = 2025-2029.", "src": "Páginas por RP del SES Performance Portal, búsqueda web", "note": ""}, {"n": 42, "stem": "¿Qué es el ESPP4?", "opts": ["El 4.º Plan del Programa SESAR de la UE", "Una especificación de certificación de EASA para la navegación basada en la performance", "La 4.ª edición del Programa Europeo de Progreso del Cielo", "El Plan de Rendimiento de España para el cuarto periodo de referencia (2025-2029)"], "ans": 3, "why": "El ESPP4 es el plan nacional de rendimiento de España para el RP4 (2025-2029), que fija los objetivos de ENAIRE en las cuatro KPA.", "src": "Plan de Rendimiento de España para el RP4, título oficial del documento, búsqueda web", "note": ""}, {"n": 43, "stem": "¿Qué dos Estados forman el Bloque Funcional de Espacio Aéreo Sudoeste (SW FAB)?", "opts": ["España y Francia", "Portugal y Marruecos", "España y Portugal", "España, Portugal y Francia"], "ans": 2, "why": "El SW FAB comprende España y Portugal (FIR de Lisboa) y es el único FAB bilateral al que pertenece España.", "src": "Página oficial «Establishment» del SW FAB, leída completa", "note": ""}, {"n": 44, "stem": "¿En qué mes y año se firmaron la Declaración Política y el Acuerdo del SW FAB?", "opts": ["Mayo de 2012", "Mayo de 2013", "Diciembre de 2012", "Enero de 2014"], "ans": 1, "why": "Los dos documentos de alto nivel fueron firmados por los ministros de Portugal y de España en mayo de 2013, según la propia página «Establishment» del SW FAB.", "src": "Página oficial «Establishment» del SW FAB, leída completa", "note": ""}, {"n": 45, "stem": "¿Qué tres niveles de gobernanza componen la estructura institucional del SW FAB?", "opts": ["Consejo, Comité, Asamblea", "Consejo del SW FAB, Comité de Autoridades de Supervisión (SAC), Consejo Operativo (OB)", "Consejo Político, Consejo Técnico, Consejo Militar", "Asamblea, Consejo, Agencia"], "ans": 1, "why": "El SW FAB tiene tres niveles interrelacionados: el Consejo (política institucional), el SAC (supervisión) y el OB (prestación de servicios, con ENAIRE y NAV Portugal).", "src": "Página oficial «Establishment» del SW FAB, leída completa", "note": ""}, {"n": 46, "stem": "¿Qué FAB comprende Francia, Alemania, Bélgica, los Países Bajos, Luxemburgo y Suiza?", "opts": ["FAB CE", "Blue Med", "NEFAB", "FABEC"], "ans": 3, "why": "FABEC (FAB Europe Central) es el bloque de los seis Estados citados; FAB CE abarca otros Estados, sobre todo de Europa central y sudoriental, NEFAB es nórdico y báltico, y Blue Med es mediterráneo.", "src": "Búsqueda web contrastada con el artículo «Functional airspace block» de Wikipedia", "note": ""}, {"n": 47, "stem": "¿Qué FAB comprende Bulgaria y Rumanía?", "opts": ["Danube FAB", "Baltic FAB", "Blue Med FAB", "DK-SE FAB"], "ans": 0, "why": "Danube FAB = Bulgaria y Rumanía; Baltic FAB = Polonia y Lituania; Blue Med = Italia, Malta, Grecia y Chipre; DK-SE = Dinamarca y Suecia.", "src": "Búsqueda web contrastada con el artículo «Functional airspace block» de Wikipedia", "note": ""}, {"n": 48, "stem": "¿En virtud de qué reglamento se creó la Empresa Común SESAR 3, y hasta cuándo funciona?", "opts": ["Reglamento (UE) 2021/2085, hasta el 31 de diciembre de 2031", "Reglamento (UE) 2021/116, hasta el 31 de diciembre de 2020", "Reglamento (UE) 2019/123, hasta 2029", "Reglamento (CE) n.º 219/2007, hasta 2016"], "ans": 0, "why": "La Empresa Común SESAR 3 se creó en virtud del Reglamento (UE) 2021/2085 (el acto base único de varias empresas comunes de Horizonte Europa) y funciona hasta el 31 de diciembre de 2031, con sede en Bruselas.", "src": "Reglamento (UE) 2021/2085, leído completo; fecha final confirmada por el Manual 1 (nov. 2026), capítulo 4.3.7, p. 46", "note": ""}, {"n": 49, "stem": "¿En torno a cuántos objetivos estratégicos de despliegue (SDO) organiza el despliegue el Plan Maestro ATM Europeo 2025?", "opts": ["6", "8", "10", "12"], "ans": 2, "why": "La edición de 2025 enumera 10 SDO, desde las alertas de riesgo de colisión en calle de rodaje y pista (SDO 1) hasta habilitar la movilidad aérea innovadora y las operaciones con drones (SDO 10).", "src": "SESAR, Plan Maestro ATM Europeo 2025, índice, leído completo", "note": ""}, {"n": 50, "stem": "¿Qué objetivo estratégico de despliegue (SDO) del Plan Maestro ATM Europeo 2025 abarca la transformación hacia las operaciones basadas en trayectorias (TBO)?", "opts": ["SDO 3", "SDO 9", "SDO 7", "SDO 5"], "ans": 3, "why": "El SDO 5 es «Transformación hacia las operaciones basadas en trayectorias (TBO)»; el SDO 3 es la configuración dinámica del espacio aéreo, el SDO 7 la conectividad multienlace aire-tierra y el SDO 9 la optimización, modernización y resiliencia de CNS.", "src": "SESAR, Plan Maestro ATM Europeo 2025, leído completo", "note": ""}, {"n": 51, "stem": "¿Cuántos servicios U-space obligatorios establece el Reglamento (UE) 2021/664 para el funcionamiento de un espacio aéreo U-space, y cuáles son?", "opts": ["Cuatro: identificación de red, geoconsciencia (<em>geo-awareness</em>), autorización de vuelo de UAS e información de tráfico", "Dos: identificación de red y geoconsciencia (<em>geo-awareness</em>)", "Cuatro: identificación de red, geoconsciencia, información meteorológica y seguimiento de la conformidad", "Tres: autorización de vuelo de UAS, información de tráfico y servicio de información común"], "ans": 0, "why": "El artículo 3, apartado 2, somete las operaciones de UAS en el espacio aéreo U-space, como mínimo, a cuatro servicios: identificación de red (art. 8), geoconsciencia (art. 9), autorización de vuelo de UAS (art. 10) e información sobre el tráfico (art. 11). El manual 10 (nov. 2026) recoge los mismos cuatro. La información meteorológica (art. 12) y el seguimiento de la conformidad (art. 13) son servicios adicionales que el Estado puede exigir según la evaluación del riesgo; el servicio de información común lo presta el CISP a los USSP y no es uno de los cuatro.", "src": "Reglamento (UE) 2021/664, artículos 3 y 8-13; Manual 10 (nov. 2026), capítulo 5.3.2, p. 22", "note": ""}, {"n": 52, "stem": "¿Puede un Estado miembro designar a un único proveedor del «servicio común de información» con carácter exclusivo para su(s) espacio(s) aéreo(s) U-space?", "opts": ["No; la competencia entre proveedores es obligatoria", "Sí, con carácter exclusivo para la totalidad o parte de sus espacios aéreos U-space", "Solo el Gestor de Red puede prestar este servicio", "Solo EASA puede prestar este servicio"], "ans": 1, "why": "El Reglamento (UE) 2021/664 permite a los Estados miembros designar a un único proveedor del servicio común de información con carácter exclusivo para la totalidad o parte de los espacios aéreos U-space, a fin de garantizar la seguridad y la coherencia. El manual 10 (nov. 2026) llama a ese proveedor único sCISP; en España, el Real Decreto 517/2024 designa a ENAIRE.", "src": "Reglamento (UE) 2021/664, considerandos, leído completo; Manual 10 (nov. 2026), capítulo 5.3.6, p. 24", "note": ""}, {"n": 53, "stem": "¿En cuántas horas debe notificar un suceso de notificación obligatoria una persona incluida en el artículo 4(6) del Reglamento (UE) 376/2014, salvo que circunstancias excepcionales se lo impidan?", "opts": ["24 horas", "48 horas", "72 horas", "7 días"], "ans": 2, "why": "El artículo 4(7) exige notificar en las 72 horas siguientes a tener conocimiento del suceso, salvo circunstancias excepcionales, en cuyo caso debe hacerse lo antes posible.", "src": "Reglamento (UE) 376/2014, leído completo", "note": ""}, {"n": 54, "stem": "¿Qué es el Repositorio Central Europeo (ECR), creado en virtud del Reglamento (UE) 376/2014?", "opts": ["Una base de datos de organizaciones de mantenimiento certificadas por EASA", "Un repositorio gestionado por la Comisión que contiene los datos de sucesos transferidos por los Estados miembros", "Un archivo de planes de vuelo de EUROCONTROL", "Una lista de las licencias ATCO expedidas en toda la UE"], "ans": 1, "why": "La Comisión gestiona el Repositorio Central Europeo, al que los Estados miembros deben transferir los datos de sucesos recopilados para que los utilicen las autoridades competentes, EASA y la Comisión.", "src": "Reglamento (UE) 376/2014, leído completo", "note": ""}, {"n": 55, "stem": "¿Dónde y cuándo celebró la Conferencia Europea de Aviación Civil (CEAC) su sesión inaugural?", "opts": ["Montreal, 1947", "Chicago, 1944", "Estrasburgo, 1955", "Bruselas, 1963"], "ans": 2, "why": "La sesión inaugural de la CEAC se celebró en Estrasburgo entre el 29 de noviembre y el 16 de diciembre de 1955; las demás ciudades y años pertenecen a la OACI (Chicago 1944, Montreal 1947) o a EUROCONTROL (Bruselas 1963).", "src": "Búsqueda web, páginas «About ECAC/History» de la CEAC", "note": ""}, {"n": 56, "stem": "¿Cuántos Estados fundadores tuvo la CEAC en 1955 y aproximadamente cuántos miembros tiene hoy?", "opts": ["6 Estados fundadores; 27 hoy", "12 Estados fundadores; 31 hoy", "42 Estados fundadores; 42 hoy", "19 Estados fundadores; 44 hoy"], "ans": 3, "why": "La CEAC empezó con 19 Estados fundadores y ha crecido hasta unos 44 Estados miembros, un conjunto que incluye a todos los Estados de la UE, a la mayoría de los de EASA y a todos los miembros de EUROCONTROL.", "src": "Búsqueda web, páginas de historia de la CEAC", "note": ""}, {"n": 57, "stem": "Según el artículo 93 del Reglamento (UE) 2018/1139 (modificado por el Reglamento (UE) 2024/2803), ¿con qué órgano debe cooperar EASA cuando contribuye al sistema de evaluación del rendimiento del SES?", "opts": ["El Órgano de Revisión del Rendimiento (PRB)", "El Consejo Provisional", "El Comité del Cielo Único", "El Gestor del Despliegue de SESAR"], "ans": 0, "why": "El artículo 93 encomienda a EASA contribuir al sistema de evaluación del rendimiento «en cooperación con el Órgano de Revisión del Rendimiento (PRB) mencionado en el artículo 13 del Reglamento (UE) 2024/2803».", "src": "Reglamento (UE) 2024/2803, artículo 57(6), que modifica el artículo 93 del Reglamento (UE) 2018/1139, leído completo", "note": ""}, {"n": 58, "stem": "¿En qué fecha se fir
