<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: La OACI, el Convenio de Chicago y los Anexos (T01a)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

 id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Instituciones y legislación aeronáutica</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: La OACI, el Convenio de Chicago y los Anexos (T01a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "De los 55 Estados invitados a la Conferencia de Chicago de 1944, ¿cuántos asistieron realmente?", "opts": ["54", "21", "26", "52"], "ans": 0, "why": "La página de historia de la propia OACI indica que asistieron 54 de los 55 Estados invitados. El 52 es el número de Estados que habían FIRMADO el Convenio el día de la clausura, no el de los que asistieron. El 21 es el tamaño del Consejo Interino de la PICAO y el 26, el número de ratificaciones necesarias para la entrada en vigor.", "src": "OACI, «History of ICAO and the Chicago Convention»", "note": ""}, {"n": 2, "stem": "¿Por representantes de cuántos Estados miembros estaba formado el Consejo Interino de la PICAO, reunido de forma continua en Montreal desde junio de 1945?", "opts": ["52", "21", "36", "12"], "ans": 1, "why": "La página de historia de la propia OACI indica que el Consejo Interino tenía 21 Estados miembros. El 12 fue el tamaño original (1944) de la Comisión de Aeronavegación; el 52 es el número de signatarios originales del Convenio y el 36, el tamaño actual del Consejo.", "src": "OACI, «History of ICAO and the Chicago Convention»", "note": ""}, {"n": 3, "stem": "Según el artículo 91 b) del Convenio de Chicago, el Convenio entró en vigor:", "opts": ["El día en que se reunió en Montreal la primera Asamblea oficial de la OACI", "El día en que lo firmó el último de los 55 Estados invitados", "A los 30 días del depósito del 26.º instrumento de ratificación o de adhesión", "De inmediato, al ser firmado por 52 Estados en Chicago"], "ans": 2, "why": "La nota al pie del preámbulo del propio Convenio cita el artículo 91 b): entrada en vigor a los 30 días del depósito de la 26.ª ratificación o adhesión (4 de abril de 1947). No fue automática con la firma, y la primera Asamblea (mayo de 1947) fue posterior a la entrada en vigor, no su causa.", "src": "Doc 7300, 9.ª ed., nota al pie del preámbulo", "note": ""}, {"n": 4, "stem": "¿Quién es el depositario del Convenio de Chicago?", "opts": ["El Secretario General de la propia OACI", "El Gobierno de Canadá", "La Secretaría de las Naciones Unidas", "El Gobierno de los Estados Unidos de América"], "ans": 3, "why": "La lista de estado del propio Convenio nombra al Gobierno de los Estados Unidos como depositario. Canadá acoge la sede de la OACI pero no es el depositario; la ONU es una organización relacionada pero distinta; el Secretario General de la OACI administra la Organización, no los registros de ratificación del tratado.", "src": "Doc 7300, encabezado de la lista de estado", "note": ""}, {"n": 5, "stem": "Según el artículo 7 del Convenio de Chicago, un Estado contratante no podrá nunca:", "opts": ["Negar derechos de cabotaje a una compañía aérea extranjera", "Conceder un privilegio de cabotaje EXCLUSIVO a un único Estado", "Exigir un aterrizaje en una aduana", "Restringir el vuelo sobre una zona militar"], "ans": 1, "why": "El artículo 7 permite a un Estado negar libremente el cabotaje a las compañías extranjeras, pero le prohíbe conceder un privilegio de cabotaje exclusivo a otro Estado o a sus compañías. La C y la D están permitidas por otros artículos (10 y 9); no están prohibidas.", "src": "Doc 7300, art. 7", "note": ""}, {"n": 6, "stem": "Según el artículo 9 b) del Convenio de Chicago, la restricción temporal, de efecto inmediato, que un Estado imponga al vuelo sobre su territorio debe aplicarse:", "opts": ["Sin distinción de nacionalidad, a las aeronaves de todos los demás Estados", "Solo en tiempo de paz", "Solo a los vuelos no regulares", "Solo a las aeronaves de los Estados con los que no tenga un acuerdo bilateral"], "ans": 0, "why": "El artículo 9 b) exige que estas restricciones por emergencia o seguridad pública se apliquen «sin distinción de nacionalidad» a las aeronaves de todos los demás Estados. Las zonas prohibidas permanentes del 9 a), en cambio, solo exigen no discriminar entre las aeronaves regulares del propio Estado y las de los demás.", "src": "Doc 7300, art. 9 b)", "note": ""}, {"n": 7, "stem": "Según el artículo 16 del Convenio de Chicago, las autoridades de un Estado contratante tienen derecho a:", "opts": ["Confiscar cualquier aeronave que infrinja una norma", "Inspeccionar la aeronave de otro Estado a la llegada o a la salida, sin demora injustificada, y examinar los documentos exigidos por el Convenio", "Denegar el aterrizaje a cualquier aeronave sin dar razones", "Retener de forma permanente el diario de a bordo de una aeronave"], "ans": 1, "why": "El artículo 16 concede un derecho de inspección de la aeronave y de sus documentos, que ha de ejercerse sin demora injustificada; no la confiscación, la denegación arbitraria del aterrizaje ni la retención permanente de documentos.", "src": "Doc 7300, art. 16", "note": ""}, {"n": 8, "stem": "Según el artículo 18 del Convenio de Chicago, la matrícula de una aeronave:", "opts": ["Puede mantenerse en dos Estados a la vez si ambos consienten", "No puede transferirse nunca una vez concedida", "No puede ser válida en más de un Estado, aunque sí puede transferirse de un Estado a otro", "La decide la OACI, no los Estados"], "ans": 2, "why": "El artículo 18 prohíbe terminantemente la doble matrícula, pero permite pasar la matrícula de un Estado a otro. No existe una decisión de matrícula a nivel de la OACI; cada Estado matricula sus aeronaves con arreglo al artículo 19.", "src": "Doc 7300, art. 18", "note": ""}, {"n": 9, "stem": "¿Cuál de estos documentos NO es uno de los siete que el artículo 29 del Convenio de Chicago exige a bordo de una aeronave dedicada a la navegación internacional?", "opts": ["Manifiesto de carga y declaraciones, si transporta carga", "Certificado de aeronavegabilidad", "Diario de a bordo", "Póliza de seguro de la aeronave"], "ans": 3, "why": "La lista del artículo 29 es: certificado de matrícula, certificado de aeronavegabilidad, licencias de la tripulación, diario de a bordo, licencia de la estación de radio (si va instalada), lista de pasajeros (si transporta pasajeros) y manifiesto y declaraciones de carga (si transporta carga). La póliza de seguro no figura en ella.", "src": "Doc 7300, art. 29", "note": ""}, {"n": 10, "stem": "Según el artículo 33 del Convenio de Chicago, los demás Estados contratantes deben reconocer como válido un certificado o licencia expedido por el Estado de matrícula cuando:", "opts": ["Los requisitos con que se expidió son iguales o superiores a las normas mínimas aplicables de la OACI", "La aeronave tiene menos de 10 años", "El titular acumula más de 1000 horas de vuelo", "Se ha traducido al inglés"], "ans": 0, "why": "El artículo 33 condiciona el reconocimiento a que los requisitos de expedición sean iguales o superiores a las normas mínimas que se establezcan en virtud del Convenio: es una prueba de equivalencia de normas, no de idioma, de antigüedad de la aeronave ni de experiencia de la tripulación.", "src": "Doc 7300, art. 33", "note": ""}, {"n": 11, "stem": "El artículo 37 del Convenio de Chicago enumera once materias para los SARPs. ¿En qué opción figuran las DOS materias en esa lista?", "opts": ["Tasas aeroportuarias y requisitos de seguro", "Mapas y cartas aeronáuticos, y formalidades de aduana e inmigración", "Fijación de tarifas de las compañías y asignación de franjas horarias (slots)", "Compensación a los pasajeros y fiscalidad medioambiental"], "ans": 1, "why": "La lista del artículo 37 (a-k) incluye los mapas y cartas aeronáuticos (i) y los formalidades de aduana e inmigración (j), entre otras materias (sistemas de comunicaciones y ayudas para la navegación, características de aeropuertos, reglas del aire, licencias, aeronavegabilidad, matrícula, información meteorológica, diarios de a bordo, aeronaves en peligro e investigación de accidentes). Las tarifas, tasas, franjas, compensaciones e impuestos no están en ella.", "src": "Doc 7300, art. 37", "note": ""}, {"n": 12, "stem": "Según el artículo 38 del Convenio de Chicago, cuando se enmienda una norma internacional, el Estado que no adopte la enmienda correspondiente en su reglamentación nacional debe notificarlo al Consejo en un plazo de:", "opts": ["30 días", "90 días", "60 días", "Un año"], "ans": 2, "why": "El artículo 38 fija un plazo de 60 días para la notificación, contado desde la adopción de la enmienda de la norma internacional.", "src": "Doc 7300, art. 38", "note": ""}, {"n": 13, "stem": "Según el artículo 45 del Convenio de Chicago, ¿qué mayoría de la Asamblea se exige para trasladar la sede permanente de la OACI, salvo que sea de forma temporal?", "opts": ["La unanimidad", "La mayoría simple de los votos emitidos", "Dos tercios de la Asamblea", "Al menos tres quintos del número total de Estados contratantes"], "ans": 3, "why": "El artículo 45 exige al menos tres quintos de TODOS los Estados contratantes (no solo de los presentes o votantes) para un traslado no temporal; el Consejo, por sí solo, puede aprobar un traslado temporal por decisión ordinaria.", "src": "Doc 7300, art. 45", "note": ""}, {"n": 14, "stem": "Según el artículo 46 del Convenio de Chicago, ¿qué órgano convocó la primera reunión de la Asamblea de la OACI?", "opts": ["El Consejo Interino de la Organización Provisional de Aviación Civil Internacional (PICAO)", "La Asamblea General de las Naciones Unidas", "El Secretario General de la OACI", "El Gobierno de los Estados Unidos, como depositario"], "ans": 0, "why": "El artículo 46 encomienda esta tarea al propio Consejo Interino de la PICAO, con la Asamblea reunida tan pronto como entrase en vigor el Convenio; la Asamblea y el Secretario General de la OACI aún no existían formalmente para hacerlo por sí mismos.", "src": "Doc 7300, art. 46", "note": ""}, {"n": 15, "stem": "Según el texto ORIGINAL de 1944 del artículo 48 a), sin enmendar, ¿con qué frecuencia debía reunirse la Asamblea de la OACI?", "opts": ["Una vez cada tres años", "Anualmente", "Una vez cada cinco años", "Solo cuando lo decidiera el Consejo"], "ans": 1, "why": "El texto original de 1944 exigía reuniones ANUALES; la fórmula «al menos una vez cada tres años», hoy vigente, solo entró en vigor en 1975, tras dos enmiendas sucesivas (1954 y 1962).", "src": "Doc 7300, art. 48, nota al pie", "note": ""}, {"n": 16, "stem": "Según el artículo 50 b) del Convenio de Chicago, al elegir a los miembros del Consejo la Asamblea debe dar representación adecuada a tres grupos de Estados. ¿Cuál de los siguientes es uno de ellos?", "opts": ["Los Estados con la puntuación EI más baja del USOAP", "Los Estados con las mayores academias de formación en aviación civil", "Los Estados que más contribuyan al suministro de instalaciones para la navegación aérea civil internacional", "Los Estados que alberguen una oficina regional de la OACI"], "ans": 2, "why": "Los tres grupos del art. 50 b) son: los Estados de mayor importancia en el transporte aéreo; los Estados (no incluidos de otro modo) que más contribuyan al suministro de instalaciones para la navegación aérea; y los Estados (no incluidos de otro modo) cuya designación asegure la representación de todas las grandes regiones geográficas. Las academias de formación, albergar una oficina regional y las puntuaciones del USOAP no son criterios del artículo.", "src": "Doc 7300, art. 50 b)", "note": ""}, {"n": 17, "stem": "Según el artículo 51 del Convenio de Chicago, el Presidente del Consejo:", "opts": ["Debe ser siempre un representante en activo en el Consejo", "Lo nombra directamente el Secretario General", "Es elegido por un mandato de cinco años no renovable", "No tiene voto y es elegido por tres años, con posibilidad de reelección"], "ans": 3, "why": "Artículo 51: mandato de tres años, reelegible, sin derecho a voto; no es necesario elegirlo entre los representantes del Consejo (si se elige a uno, su Estado cubre su puesto). El Secretario General no interviene en la elección del Presidente.", "src": "Doc 7300, art. 51", "note": ""}, {"n": 18, "stem": "Según el texto ORIGINAL de 1944 del Convenio de Chicago, sin enmendar, ¿de cuántos Estados contratantes se componía el Consejo de la OACI?", "opts": ["21", "36", "27", "33"], "ans": 0, "why": "El texto original de 1944 fijaba 21 puestos en el Consejo; este creció por etapas (27 en 1962, 30 en 1973, 33 en 1980, 36 en 2002) hasta los 36 actuales.", "src": "Doc 7300, art. 50, historial de las notas al pie", "note": ""}, {"n": 19, "stem": "La enmienda que amplió el Consejo de la OACI de 33 a los 36 miembros actuales fue adoptada por la Asamblea el:", "opts": ["16 de octubre de 1974", "26 de octubre de 1990", "12 de marzo de 1971", "21 de junio de 1961"], "ans": 1, "why": "La enmienda de 33 a 36 se adoptó en el 28.º periodo de sesiones (extraordinario) el 26 de octubre de 1990 y entró en vigor el 28 de noviembre de 2002. Las demás fechas corresponden a las etapas anteriores: 1961 (de 21 a 27), 1971 (de 27 a 30) y 1974 (de 30 a 33).", "src": "Doc 7300, art. 50, historial de las notas al pie", "note": ""}, {"n": 20, "stem": "¿A cuántos miembros ampliaría el Consejo de la OACI el Protocolo de 2016 (Doc 10077) y cuál es su situación?", "opts": ["40 miembros; ya en vigor", "38 miembros; ya en vigor", "40 miembros; aún no en vigor", "45 miembros; aún no en vigor"], "ans": 2, "why": "El Doc 10077 (Protocolo de enmienda del artículo 50 a)) propone 40 miembros del Consejo; requiere 128 ratificaciones y, en la fuente leída (30 de enero de 2026), solo se habían depositado 120, por lo que aún no está en vigor.", "src": "«Detailed Information for States on Ratification of Key Treaties» (30 de enero de 2026)", "note": ""}, {"n": 21, "stem": "Según el texto ORIGINAL de 1944 del Convenio de Chicago, sin enmendar, ¿de cuántos miembros se componía la Comisión de Aeronavegación?", "opts": ["21", "19", "15", "12"], "ans": 3, "why": "El texto original de 1944 fijaba 12 miembros en la Comisión de Aeronavegación; pasó a 15 en 1974 y a los 19 actuales en 2005.", "src": "Doc 7300, art. 56, historial de las notas al pie", "note": ""}, {"n": 22, "stem": "La enmienda que amplió la Comisión de Aeronavegación de 15 a los 19 miembros actuales entró en vigor el:", "opts": ["18 de abril de 2005", "4 de abril de 1947", "28 de noviembre de 2002", "19 de diciembre de 1974"], "ans": 0, "why": "La enmienda de 15 a 19 se adoptó el 6 de octubre de 1989 (27.º periodo de sesiones) y entró en vigor el 18 de abril de 2005. El 1974 es la entrada en vigor de la enmienda anterior (de 12 a 15) y el 2002, la de la enmienda del Consejo (de 33 a 36).", "src": "Doc 7300, art. 56, historial de las notas al pie", "note": ""}, {"n": 23, "stem": "A 23 de febrero de 2026, ¿quién era el candidato de España que ejercía como Primer Vicepresidente de la Comisión de Aeronavegación de la OACI?", "opts": ["Sr. Frédéric Fachinan", "Sr. Ismael Pacheco Serrano", "Sr. Toshiyuki Onuma", "Sr. Juan Carlos Salazar"], "ans": 1, "why": "La página de la propia OACI sobre la ANC cita al Sr. Ismael Pacheco Serrano, propuesto por España, como Primer Vicepresidente. Fachinan (Canadá) era el Presidente de la ANC; Onuma es el Presidente del Consejo y Salazar, el Secretario General de la OACI.", "src": "OACI, página «Air Navigation Commission», a 23 de febrero de 2026", "note": ""}, {"n": 24, "stem": "¿Quién es el séptimo y actual Presidente del Consejo de la OACI, elegido el 26 de noviembre de 2025 para un mandato que comienza el 1 de enero de 2026?", "opts": ["Juan Carlos Salazar", "Frédéric Fachinan", "Toshiyuki Onuma", "Ismael Pacheco Serrano"], "ans": 2, "why": "La página «Council President» de la OACI nombra al Sr. Toshiyuki Onuma como séptimo Presidente del Consejo. Salazar es el Secretario General; Fachinan preside la ANC y Pacheco Serrano es el Primer Vicepresidente de la ANC.", "src": "OACI, página «Council President»", "note": ""}, {"n": 25, "stem": "¿Qué cuatro Anexos de la OACI contienen ÚNICAMENTE normas, sin NINGUNA práctica recomendada?", "opts": ["3, 6, 10, 14", "4, 13, 15, 19", "1, 9, 11, 17", "2, 5, 7, 8"], "ans": 3, "why": "El artículo «ICAO Annexes and Doc Series» de SKYbrary indica que los Anexos 2, 5, 7 y 8 contienen solo normas; los otros 15 Anexos contienen normas y métodos recomendados.", "src": "SKYbrary, «ICAO Annexes and Doc Series»", "note": ""}, {"n": 26, "stem": "El Anexo 6 (Operación de aeronaves) se divide en tres partes. ¿Cuál de las siguientes opciones las enumera correctamente?", "opts": ["Transporte aéreo comercial internacional - aviones; aviación general internacional - aviones; operaciones internacionales - helicópteros", "Nacional, internacional, militar", "Licencias, certificación, supervisión", "Diseño, producción, mantenimiento"], "ans": 0, "why": "Son las tres partes que describe el resumen Anexo por Anexo consultado para este trabajo. Las demás opciones son categorías genéricas de la aviación que no se corresponden con la estructura real del Anexo 6.", "src": "Uniting Aviation, artículo «Setting the Standards»", "note": ""}, {"n": 27, "stem": "El Anexo 10 (Telecomunicaciones aeronáuticas) es singular entre los Anexos porque se publica en un número de volúmenes igual a:", "opts": ["4", "5", "2", "3"], "ans": 1, "why": "El Anexo 10 tiene 5 volúmenes: radioayudas para la navegación; procedimientos de comunicaciones; sistemas de comunicaciones (datos digitales y voz); radar de vigilancia y sistemas anticolisión; y utilización del espectro de radiofrecuencias aeronáuticas.", "src": "Uniting Aviation, artículo «Setting the Standards»", "note": ""}, {"n": 28, "stem": "El Consejo de la OACI adoptó formalmente el Anexo 17 (Seguridad) el 22 de marzo de 1974, tras un periodo extraordinario de sesiones de la Asamblea celebrado en:", "opts": ["Diciembre de 1969", "Marzo de 1974", "Junio de 1970", "Septiembre de 1974"], "ans": 2, "why": "Un periodo extraordinario de sesiones de la Asamblea en junio de 1970 (como reacción al aumento de los delitos de interferencia ilícita a finales de los años sesenta) pidió los SARPs que el Consejo adoptó después como Anexo 17 en marzo de 1974.", "src": "Uniting Aviation, artículo «Setting the Standards»", "note": ""}, {"n": 29, "stem": "¿Qué Anexo de la OACI se describe como el más reciente y se centra en el Programa estatal de seguridad operacional (SSP) y el Sistema de gestión de la seguridad operacional (SMS)?", "opts": ["Anexo 16", "Anexo 9", "Anexo 13", "Anexo 19"], "ans": 3, "why": "El Anexo 19 (Gestión de la seguridad operacional) es el Anexo más reciente de la OACI y engloba las disposiciones sobre SSP/SMS de los demás Anexos técnicos. El Anexo 13 es Investigación de accidentes, el 16 Protección del medio ambiente y el 9 Facilitación.", "src": "Uniting Aviation, artículo «Setting the Standards»", "note": ""}, {"n": 30, "stem": "El único objetivo declarado de una investigación realizada según el Anexo 13 (Investigación de accidentes e incidentes) es:", "opts": ["La prevención de futuros accidentes e incidentes", "Calcular las indemnizaciones de los seguros", "Determinar la responsabilidad civil del explotador", "Atribuir culpa penal a la tripulación de vuelo"], "ans": 0, "why": "El Anexo 13 subraya que la investigación tiene un fin exclusivamente preventivo, nunca el de determinar culpas o responsabilidades; coincide con el principio paralelo que rige para organismos como la CIAIAC a nivel nacional.", "src": "Uniting Aviation, artículo «Setting the Standards»", "note": ""}, {"n": 31, "stem": "¿Cuál es la diferencia jurídica clave entre una «norma» y un «método recomendado» en el sistema de SARPs de la OACI?", "opts": ["La norma se aplica solo en Europa; el método recomendado, en todo el mundo", "Se reconoce como necesaria la aplicación uniforme de una norma; la de un método recomendado, solo como conveniente", "La norma es voluntaria; el método recomendado es obligatorio", "No hay diferencia jurídica; los términos son intercambiables"], "ans": 1, "why": "Es la distinción clásica de la OACI en la que se basa la obligación de notificar «diferencias» del artículo 38: las normas exigen aplicación uniforme (con notificación obligatoria de las diferencias si no se siguen) y los métodos recomendados son meramente convenientes.", "src": "Doc 7300, arts. 37-38, leídos junto con un resumen de SKYbrary", "note": ""}, {"n": 32, "stem": "Los documentos PANS (Procedimientos para los servicios de navegación aérea), como el Doc 4444 y el Doc 8168:", "opts": ["Son tratados jurídicamente vinculantes que requieren ratificación", "Sustituyen por completo a los Anexos", "Son procedimientos operativos más detallados que complementan los SARPs de los Anexos correspondientes", "Solo se aplican dentro de una única región de la OACI"], "ans": 2, "why": "Los PANS complementan (no sustituyen) los SARPs de los Anexos con más detalle operativo; no son tratados que requieran ratificación y tienen alcance mundial, a diferencia de los SUPPS, que son regionales.", "src": "Manual de ENAIRE + texto del encabezado del Doc 7030 que confirma la relación de PANS-ATM y PANS-OPS con los Anexos", "note": ""}, {"n": 33, "stem": "Los SUPPS (Procedimientos suplementarios regionales), como el Doc 7030 para la región EUR, se diferencian de los PANS principalmente porque los SUPPS:", "opts": ["Son material de orientación opcional sin contenido operativo", "Solo abarcan los servicios meteorológicos", "Se aplican en todo el mundo, mientras que los PANS solo se aplican regionalmente", "Se aplican solo dentro de una región concreta de la OACI, para responder a necesidades regionales"], "ans": 3, "why": "Los SUPPS son expresamente regionales (EUR, AFI, ASIA, CAR, MID, NAM, NAT, PAC, SAM), a diferencia de los PANS, que son mundiales; son procedimientos operativos, no meras orientaciones no vinculantes, y abarcan mucho más que la meteorología.", "src": "Doc 7030, texto del encabezado", "note": ""}, {"n": 34, "stem": "El Doc 7030 (SUPPS regionales de EUR) declara que es suplementario de cuál de los siguientes documentos, entre otros?", "opts": ["Los Anexos 2, 6, 10, 11 y 15, además de los PANS-ATM (Doc 4444) y los PANS-OPS (Doc 8168)", "Solo el Reglamento base de EASA", "Exclusivamente los Anexos 17 y 18", "Solo el Anexo 6"], "ans": 0, "why": "El texto del encabezado del propio Doc 7030 enumera el Anexo 2, el Anexo 6 (Partes I-II), el Anexo 10 (Vols. IV-V), el Anexo 11, el Anexo 15, los PANS-ATM (Doc 4444) y los PANS-OPS (Doc 8168) como las disposiciones que complementa.", "src": "Doc 7030, texto del encabezado", "note": ""}, {"n": 35, "stem": "La visión declarada del GASP (Plan mundial para la seguridad operacional de la aviación, Doc 10004) en su edición 2026-2028 es:", "opts": ["«Triplicar la capacidad mundial para 2030»", "«Cero víctimas mortales en las operaciones comerciales en 2030 y después»", "«Cumplimiento del 100 % del USOAP en 2028»", "«Un sistema de navegación aérea interoperable a escala mundial»"], "ans": 1, "why": "El propio texto del GASP 2026-2028 enuncia esta visión, que se hace eco de la Agenda 2030 de la ONU. La D es en realidad la visión del GANP, no la del GASP: una trampa de examen clásica que empareja el plan equivocado con la visión equivocada.", "src": "GASP, Doc 10004, edición 2026-2028", "note": ""}, {"n": 36, "stem": "¿Cuántos objetivos estructuran la edición 2026-2028 del GASP?", "opts": ["5", "6", "3", "4"], "ans": 1, "why": "El GASP 2026-2028 se reestructuró en torno a seis objetivos: (1) reducir los riesgos para la seguridad operacional, (2) reforzar la supervisión de la seguridad operacional, (3) programas estatales de seguridad operacional, (4) colaboración regional y nacional, (5) planificación de la seguridad operacional (RASP/NASP) y (6) programas de evaluación de la industria y de intercambio de datos.", "src": "GASP, Doc 10004, edición 2026-2028", "note": ""}, {"n": 37, "stem": "La meta 1.1 del GASP (edición 2026-2028) mide la reducción de la tasa de accidentes hacia 2028 mediante:", "opts": ["Recuentos absolutos de accidentes, sin promediar", "Una instantánea de un solo año comparada con 2020", "Una media móvil de cinco años, con 2025 como año de referencia", "Una media móvil de diez años a partir de 2016"], "ans": 2, "why": "El texto del GASP especifica una media móvil de cinco años y 2025 como referencia, para suavizar la volatilidad interanual de las estadísticas de accidentes.", "src": "GASP, Doc 10004, §5.2.3.1", "note": ""}, {"n": 38, "stem": "El GASP (edición 2026-2028) fijó el 70 %, y no el 100 %, como puntuación mínima aceptable de una meta del Objetivo 2 sobre recursos financieros de las autoridades de supervisión de la seguridad operacional, porque:", "opts": ["La norma presupuestaria interna de la propia OACI exige el 70 %", "Es el mínimo que exige el Convenio de Chicago", "El 70 % fue la puntuación de la región con mejores resultados", "El 70 % representaba la puntuación media mundial en ese momento"], "ans": 3, "why": "El texto del GASP explica expresamente que se eligió el 70 % como mínimo realista porque reflejaba la media mundial actual, en lugar de una meta del 100 %, inalcanzable, que podría desanimar a los Estados con puntuaciones bajas.", "src": "GASP, Doc 10004, §5.2.4.2", "note": ""}, {"n": 39, "stem": "El GANP (Plan mundial de navegación aérea, Doc 9750) estructura las mejoras de la navegación aérea mundial mediante qué marco?", "opts": ["El marco de las mejoras por bloques del sistema de aviación (ASBU)", "El Manual de navegación basada en la performance (PBN)", "El enfoque de observación continua (CMA)", "El marco del sistema de gestión de la seguridad operacional (SMS)"], "ans": 0, "why": "La herramienta central del GANP es el ASBU, un conjunto estructurado de módulos de mejora operacional que los Estados y las regiones pueden adoptar de forma progresiva; el PBN es un manual distinto, el CMA es un método de auditoría del USOAP/USAP y el SMS pertenece al Anexo 19.", "src": "GANP, Doc 9750", "note": ""}, {"n": 40, "stem": "¿A qué documento de la OACI remite el GASP para obtener orientación detallada sobre la implantación eficaz del Programa estatal de seguridad operacional (SSP)?", "opts": ["Doc 4444", "Doc 9859, Manual de gestión de la seguridad operacional", "Doc 7300", "Doc 8168"], "ans": 1, "why": "La justificación de la meta 3.2 del GASP cita expresamente el Doc 9859 (SMM) y el Anexo 19 como fuentes de orientación sobre la implantación del SSP/SMS.", "src": "GASP, Doc 10004, resumen de enmiendas", "note": ""}, {"n": 41, "stem": "El GASeP (Plan mundial de seguridad de la aviación, Doc 10118, 2.ª edición) organiza su trabajo en parte en torno a cuál de las siguientes prioridades globales?", "opts": ["«Lograr un control de seguridad con cero emisiones de carbono»", "«Maximizar la rentabilidad de las compañías aéreas»", "«Mantener una cultura de seguridad sólida y eficaz»", "«Eliminar toda la reglamentación de la aviación»"], "ans": 2, "why": "Es una de las prioridades globales declaradas del GASeP, junto con «mejorar la concienciación sobre los riesgos y la respuesta», y subraya el paso a medidas de seguridad basadas en el riesgo (no meramente reactivas).", "src": "GASeP, Doc 10118, 2.ª ed.", "note": ""}, {"n": 42, "stem": "El USOAP evolucionó desde auditorías de ciclo fijo hasta qué enfoque actual, que publica una puntuación de «implantación eficaz» (EI) por cada área técnica?", "opts": ["El Plan mundial para la seguridad operacional de la aviación (GASP)", "Las mejoras por bloques del sistema de aviación (ASBU)", "El Programa universal de auditoría de la seguridad de la aviación (USAP)", "El enfoque de observación continua (USOAP CMA)"], "ans": 3, "why": "El USOAP CMA sustituyó a las auditorías de ciclo fijo por una observación continua y publica las puntuaciones EI por área técnica en un visor interactivo. El USAP es el programa paralelo de auditoría de la SEGURIDAD (AVSEC), no de la seguridad operacional.", "src": "OACI, página «Safety Audit Results: USOAP interactive viewer»", "note": ""}, {"n": 43, "stem": "Una «preocupación significativa de seguridad operacional» (SSC) señalada por el USOAP indica que:", "opts": ["Un Estado no ejerce una supervisión de la seguridad operacional suficiente para garantizar la implantación eficaz de los SARPs aplicables", "Un aeródromo debe cerrarse de inmediato", "La OACI ha revocado la condición de miembro del Estado", "Una compañía concreta tiene un tipo de aeronave inseguro"], "ans": 0, "why": "La propia página del USOAP de la OACI aclara expresamente que una SSC no indica necesariamente una deficiencia de un explotador, ANSP o aeródromo concreto, sino una supervisión insuficiente de la seguridad operacional a nivel del ESTADO.", "src": "OACI, página «Safety Audit Results: USOAP interactive viewer»", "note": ""}, {"n": 44, "stem": "El USAP-CMA audita la supervisión de la seguridad de la aviación de los Estados con respecto a qué dos Anexos?", "opts": ["El Anexo 13 y el Anexo 19", "El Anexo 17 y las normas del Anexo 9 relacionadas con la seguridad", "El Anexo 6 y el Anexo 8", "El Anexo 11 y el Anexo 14"], "ans": 1, "why": "La página del USAP de la OACI indica que el programa comprueba el cumplimiento de las normas del Anexo 17 (Seguridad) y de las normas del Anexo 9 (Facilitación) relacionadas con la seguridad.", "src": "OACI, página «USAP»", "note": ""}, {"n": 45, "stem": "Según el texto de estado del tratado de la propia OACI, el Convenio de La Haya contra el apoderamiento ilícito de aeronaves se FIRMÓ el:", "opts": ["16 de diciembre de 1971", "23 de septiembre de 1971", "16 de diciembre de 1970", "14 de octubre de 1971"], "ans": 2, "why": "La página de estado de la propia OACI dice «SIGNED AT THE HAGUE ON 16 DECEMBER 1970». El año 1971 es un distractor verosímil que coincide con el año de la entrada en vigor (14 de octubre de 1971) o con la fecha, posiblemente errónea, del propio manual de ENAIRE; el 23 de septiembre de 1971 es, en cambio, la fecha de la firma del Convenio de Montreal.", "src": "OACI, texto de estado del Convenio de La Haya", "note": ""}, {"n": 46, "stem": "El Convenio de Tokio de 1963, sobre las infracciones y ciertos otros actos cometidos a bordo de las aeronaves, entró en vigor con arreglo a qué regla?", "opts": ["En la fecha de su publicación en el BOE", "A los 30 días de la 26.ª ratificación", "De inmediato, con la firma", "A los 90 días de la 12.ª ratificación (artículo 21)"], "ans": 3, "why": "El propio texto del Convenio de Tokio especifica la entrada en vigor a los 90 días de que el 12.º Estado deposite su ratificación, según su artículo 21; es distinta de la regla de las 26 ratificaciones y 30 días del Convenio de Chicago.", "src": "Convenio de Tokio de 1963, UNTS 704", "note": ""}, {"n": 47, "stem": "¿Cuántas partes tiene el Convenio de Roma de 1952 (daños causados por aeronaves extranjeras a terceros en la superficie), según la lista de estado de la OACI leída para este trabajo?", "opts": ["51", "193", "187", "142"], "ans": 0, "why": "El texto de estado del Convenio de Roma de 1952 de la propia OACI da 51 partes. El 187 es el número de partes del Convenio de La Haya de 1970; el 142, el de Montreal 1999 y el 193, el del Convenio de Chicago.", "src": "Texto de estado del Convenio de Roma de 1952", "note": ""}, {"n": 48, "stem": "La verdadera relación jurídica del Convenio de Roma de 1952 con el anterior Convenio de Roma de 1933 es que:", "opts": ["Es un protocolo modificativo menor del texto de 1933", "Es un tratado independiente de sustitución que reemplazó al Convenio de 1933 (modificado en Bruselas en 1938)", "No tiene relación alguna; regulan materias distintas", "Fue ratificado por todos los Estados que ratificaron el texto de 1933"], "ans": 1, "why": "El Convenio de 1952 es un tratado nuevo e independiente que sustituye al texto de 1933 (modificado a su vez en Bruselas en 1938); fue enmendado después por el Protocolo de Montreal de 1978, que ratificaron pocos Estados.", "src": "Texto de estado del Convenio de Roma de 1952, contrastado con el planteamiento simplificado de «modificación» del manual de ENAIRE", "note": ""}, {"n": 49, "stem": "El Convenio de Montreal de 1999 (Doc 9740), que unifica las reglas del transporte aéreo internacional, entró en vigor el:", "opts": ["20 de mayo de 2004", "1 de julio de 2018", "4 de noviembre de 2003", "28 de mayo de 1999"], "ans": 2, "why": "El texto de la lista de partes de la propia OACI indica que entró en vigor el 4 de noviembre de 2003. El 28 de mayo de 1999 es la fecha de adopción y firma, no de entrada en vigor; el 20 de mayo de 2004 es la fecha de publicación del Convenio en el BOE y el 1 de julio de 2018 es la entrada en vigor del Convenio de Pekín de 2010.", "src": "Lista de partes del Convenio de Montreal de 1999", "note": ""}, {"n": 50, "stem": "Según el Convenio de Montreal de 1999, ¿cuál es el umbral de responsabilidad objetiva por pasajero en caso de muerte o lesión (según la última revisión, de 2024)?", "opts": ["26 DEG", "1519 DEG", "6303 DEG", "151 880 DEG"], "ans": 3, "why": "151 880 DEG (derechos especiales de giro) es el umbral vigente de responsabilidad objetiva por muerte o lesión; por encima de él rige un régimen de culpa presunta sin límite. 26 DEG/kg es el límite de la carga; 1519 DEG es el del equipaje y 6303 DEG, el del retraso.", "src": "«Detailed Information for States on Ratification of Key Treaties» (30 de enero de 2026)", "note": ""}, {"n": 51, "stem": "Según el Convenio de Montreal de 1999, el límite de responsabilidad por pérdida, destrucción o retraso de la carga se expresa como:", "opts": ["26 DEG por kilogramo", "6303 DEG por envío", "1519 DEG por kilogramo", "151 880 DEG por envío"], "ans": 0, "why": "El límite de responsabilidad por la carga es por kilogramo (26 DEG/kg), a diferencia de los límites de equipaje (1519 DEG) y de retraso (6303 DEG), que son por pasajero.", "src": "«Detailed Information for States on Ratification of Key Treaties» (30 de enero de 2026)", "note": ""}, {"n": 52, "stem": "El Convenio de Pekín de 2010 (Doc 9960) moderniza cuál o cuáles de los instrumentos anteriores?", "opts": ["El Anexo 17 del Convenio de Chicago", "El Convenio de Montreal de 1971 y su Protocolo suplementario de 1988", "El Convenio de Roma de 1952", "Solo el Convenio de Tokio de 1963"], "ans": 1, "why": "El Convenio de Pekín moderniza y refunde expresamente el Convenio de Montreal de 1971 sobre actos ilícitos contra la seguridad de la aviación civil y su Protocolo suplementario de 1988 sobre la violencia en los aeropuertos, y añade nuevos delitos, como el empleo de armas BQN y los ciberataques.", "src": "«Detailed Information for States on Ratification of Key Treaties»", "note": ""}, {"n": 53, "stem": "¿Qué NUEVAS categorías de delito tipifica el Convenio de Pekín de 2010 que no cubría el Convenio de Montreal de 1971?", "opts": ["Los vuelos no autorizados de drones cerca de aeródromos", "La conducta indisciplinada de los pasajeros y la intoxicación que causa disturbios", "El empleo de armas BQN (biológicas, químicas o nucleares) mediante aeronaves civiles y los ciberataques contra instalaciones de navegación aérea", "No abrocharse el cinturón durante una turbulencia"], "ans": 2, "why": "El Convenio de Pekín añadió específicamente los delitos con armas BQN y los ciberataques contra instalaciones de navegación aérea, en respuesta a las amenazas posteriores al 11-S y a las nuevas tecnologías. Los pasajeros insubordinados se abordan, en cambio, en el Protocolo de Montreal de 2014, que enmienda el Convenio de Tokio.", "src": "«Detailed Information for States on Ratification of Key Treaties»", "note": ""}, {"n": 54, "stem": "El Protocolo de Pekín de 2010 (Doc 9959) complementa qué convenio anterior?", "opts": ["El Convenio de Roma de 1952", "El Convenio de Tokio de 1963", "El Convenio de Montreal de 1999", "El Convenio de La Haya de 1970"], "ans": 3, "why": "El Protocolo de Pekín amplía el alcance del Convenio de La Haya de 1970 para abarcar los métodos modernos de apoderamiento ilícito, incluidos los ciberataques; es distinto del Convenio de Pekín (misma conferencia, mismo año), que moderniza en cambio el Convenio de Montreal de 1971.", "src": "«Detailed Information for States on Ratification of Key Treaties»", "note": ""}, {"n": 55, "stem": "El Protocolo de Montreal de 2014 (Doc 10034) enmienda el Convenio de Tokio de 1963 principalmente para:", "opts": ["Hacer obligatoria, con arreglo a criterios establecidos, la jurisdicción del Estado de aterrizaje y del Estado del explotador sobre los delitos de pasajeros insubordinados", "Abolir la autoridad del comandante de la aeronave sobre los pasajeros insubordinados", "Fusionar el Convenio de Tokio con el Convenio de Chicago", "Elevar los límites de responsabilidad frente a los pasajeros"], "ans": 0, "why": "El Protocolo de 2014 cerró una laguna de jurisdicción al hacer obligatoria (y no solo facultativa) la jurisdicción del Estado de aterrizaje o del explotador cuando se cumplen los criterios legales, con el fin expreso de afrontar el aumento de los incidentes con pasajeros insubordinados. No modifica los límites de responsabilidad (cuestión del Convenio de Montreal de 1999) ni suprime las facultades del comandante (parte esencial e inalterada del texto de 1963).", "src": "«Detailed Information for States on Ratification of Key Treaties»", "note": ""}, {"n": 56, "stem": "El Acuerdo relativo al tránsito de los servicios aéreos internacionales (IASTA), abierto a la firma en Chicago el 7 de diciembre de 1944, concede qué libertades del aire?", "opts": ["Las nueve libertades", "Solo la 1.ª y la 2.ª (técnica)", "La 6.ª, la 7.ª, la 8.ª y la 9.ª", "Solo la 3.ª y la 4.ª (comerciales)"], "ans": 1, "why": "El IASTA, el «Acuerdo de las dos libertades», concede solo el sobrevuelo sin aterrizar (1.ª) y las escalas técnicas sin fines comerciales (2.ª); las libertades comerciales (3.ª a 5.ª) quedaron recogidas en el Acuerdo de las cinco libertades, apenas ratificado, y las libertades 6.ª a 9.ª son ampliaciones doctrinales, no basadas en tratados.", "src": "Texto del IASTA, UNTS 84", "note": ""}, {"n": 57, "stem": "El IASTA entró en vigor por primera vez, el 30 de enero de 1945, entre qué dos Estados?", "opts": ["Estados Unidos y Reino Unido", "Francia y Bélgica", "Países Bajos y Noruega", "España y Portugal"], "ans": 2, "why": "La nota al pie del propio IASTA indica que entró en vigor entre los Países Bajos y Noruega el 30 de enero de 1945, fecha en que Estados Unidos (depositario) recibió la segunda notificación de aceptación (la notificación de los Países Bajos había llegado antes, el 12 de enero de 1945).", "src": "Texto del IASTA, UNTS 84", "note": ""}, {"n": 58, "stem": "¿Cuándo aceptó España el Acuerdo relativo al tránsito de los servicios aéreos internacionales (IASTA)?", "opts": ["21 de febrero de 1947", "4 de abril de 1947", "30 de noviembre de 1945", "11 de octubre de 2011"], "ans": 2, "why": "La lista de partes del propio IASTA muestra la aceptación de España con fecha de 30 de noviembre de 1945, anterior a la entrada en vigor del propio Convenio de Chicago (4 de abril de 1947) y a la fecha que da el manual para la ratificación española del Convenio de Chicago (21 de febrero de 1947). La D es una fila poco fiable, probablemente desalineada, de la tabla de estado del propio Convenio de Chicago, y no debe utilizarse como dato.", "src": "Lista de partes del IASTA, UNTS 84", "note": ""}, {"n": 59, "stem": "¿En qué moneda se expresa el Presupuesto ordinario de la OACI, y por qué?", "opts": ["En euros, para alinearse con la región que más contribuye", "En dólares estadounidenses, porque Estados Unidos es el depositario", "En derechos especiales de giro, para evitar las fluctuaciones de divisas", "En dólares canadienses, porque Montreal es la sede de la OACI"], "ans": 3, "why": "El Informe anual del Consejo 2025 presenta el Presupuesto ordinario en miles de CAD (dólares canadienses); la OACI tiene su sede en Montreal. (El informe indica la moneda pero no da un motivo, así que el vínculo con Montreal es la razón probable, no una razón citada.) No es USD, EUR ni DEG.", "src": "OACI, Informe anual del Consejo 2025, sección financiera", "note": ""}, {"n": 60, "stem": "¿Por qué periodo aprueba la OACI su Presupuesto ordinario?", "opts": ["Trienal", "Una vez por mandato del Consejo (indefinido)", "Anual", "Bienal"], "ans": 0, "why": "El Informe anual del Consejo 2025 indica que el Presupuesto ordinario se asigna para un periodo trienal, votado por la Asamblea a propuesta del Consejo y acorde con el ciclo de reuniones trienal de la Asamblea. (El art. 61 del Doc 7300 aún dice literalmente que el Consejo somete a la Asamblea «presupuestos anuales»; el ciclo trienal es práctica de la OACI, no texto del Convenio.)", "src": "Doc 7300, art. 61 + Informe anual del Consejo 2025", "note": ""}, {"n": 61, "stem": "¿Cuántos idiomas oficiales utiliza la OACI?", "opts": ["5", "6", "9", "4"], "ans": 1, "why": "Los seis idiomas oficiales de la OACI son el inglés, el francés, el español, el ruso, el árabe y el chino, en coincidencia con las opciones de idioma que ofrecen las propias páginas corporativas de la OACI.", "src": "Varias páginas corporativas de la OACI", "note": ""}, {"n": 62, "stem": "¿Qué dos protocolos hicieron igualmente auténticos los textos árabe y chino del Convenio de Chicago, y en qué años?", "opts": ["Protocolo de Buenos Aires, 1968 (árabe) y Protocolo de Montreal, 1977 (chino)", "Ni el árabe ni el chino han sido nunca textos auténticos", "Protocolo del texto quinquelingüe, 1995 (árabe) y Protocolo del texto en seis idiomas, 1998 (chino)", "Ambos se adoptaron en 1944, junto con el Convenio original"], "ans": 2, "why": "El Protocolo del texto quinquelingüe (1995, Doc 9663/9664) añadió el árabe; el Protocolo del texto en seis idiomas (1998, Doc 9721/9722) añadió el chino. Los protocolos de Buenos Aires (1968) y de Montreal (1977) establecieron, en cambio, los textos auténticos trilingüe (inglés/francés/español) y cuatrilingüe (con el ruso).", "src": "«Detailed Information for States on Ratification of Key Treaties» + índice del Doc 7300", "note": ""}, {"n": 63, "stem": "¿En qué porcentaje aproximado ha crecido el número total de miembros de la OACI desde los 52 signatarios originales del Convenio de Chicago hasta los 193 Estados actuales?", "opts": ["Alrededor del 500 %", "Alrededor del 71 %", "Alrededor del 100 %", "Alrededor del 271 %"], "ans": 3, "why": "193/52 ≈ 3,71, es decir, un aumento de alrededor del 271 % sobre el número original de signatarios; es un crecimiento relativo mayor que el de los puestos del propio Consejo (de 21 a 36, alrededor del 71 %) en el mismo periodo, que es el objeto de esta comparación resuelta.", "src": ", calculado a partir de la lista de estado del Doc 7300 (193) y de la página de historia de la OACI (52)", "note": ""}, {"n": 64, "stem": "A fecha de la fuente leída para este trabajo (30 de enero de 2026), ¿cuántas ratificaciones adicionales hacían falta para que entraran en vigor AMBOS protocolos de 2016, el de ampliación del Consejo (Doc 10077) y el de ampliación de la ANC (Doc 10076)?", "opts": ["8 cada uno", "20 cada uno", "128 cada uno", "4 cada uno"], "ans": 0, "why": "Ambos protocolos requieren 128 ratificaciones; ambos habían llegado a 120 en la fecha de la fuente, de modo que faltaban 128 − 120 = 8 ratificaciones para cada uno.", "src": ", calculado a partir de «Detailed Information for States on Ratification of Key Treaties»", "note": ""}, {"n": 65, "stem": "Con la regla de carga del Convenio de Montreal de 1999, de 26 DEG por kilogramo, ¿cuál es la responsabilidad máxima del transportista por una pieza de carga de 20 kg perdida?", "opts": ["151 880 DEG", "1519 DEG", "520 DEG", "26 DEG"], "ans": 2, "why": "20 kg × 26 DEG/kg = 520 DEG. Las demás cifras son el umbral por muerte o lesión, el límite del equipaje y la propia tarifa por kilogramo (sin multiplicar por el peso).", "src": ", calculado a partir de los límites de responsabilidad del Convenio de Montreal de 1999", "note": ""}, {"n": 66, "stem": "Con 193 Estados miembros de la OACI, ¿cuántos Estados deben solicitar conjuntamente un periodo extraordinario de sesiones de la Asamblea según la regla de «una quinta parte» del artículo 48 a)?", "opts": ["Al menos 96", "Exactamente 21", "Al menos 19", "Al menos 39"], "ans": 3, "why": "Una quinta parte de 193 es 38,6, que se redondea a al menos 39 Estados, ya que una fracción de Estado no puede solicitar nada; es el umbral actual (desde 1975), que sustituyó a la regla anterior de «diez Estados» fija.", "src": ", calculado a partir del Doc 7300, art. 48 a)", "note": ""}, {"n": 67, "stem": "Según la propia página resumen corporativa del Plan Estratégico 2026-2050 de la OACI, ¿cuántos miles de millones de pasajeros alcanzará el tráfico aéreo mundial en 2050, según las proyecciones?", "opts": ["12 400 millones", "20 000 millones", "4200 millones", "8700 millones"], "ans": 0, "why": "La propia página «Strategic Plan 2026-2050» de la OACI da esta proyección concreta de 12 400 millones de pasajeros, que se utiliza para justificar el largo horizonte del Plan hasta 2050.", "src": "OACI, página «Strategic Plan 2026-2050»", "note": ""}, {"n": 68, "stem": "¿Cuál de las siguientes es una de las «tres aspiraciones esenciales» del Plan Estratégico 2026-2050?", "opts": ["La privatización obligatoria de todos los ANSP", "El máximo valor para los accionistas de los ANSP", "Cero emisiones netas de carbono en 2050", "Derechos de cabotaje universales"], "ans": 2, "why": "Las tres aspiraciones esenciales son cero emisiones netas de carbono (en 2050), un sistema de transporte conectado y cero víctimas mortales; ninguna de las demás opciones figura en el Plan.", "src": "OACI, página «Strategic Plan 2026-2050»", "note": ""}, {"n": 69, "stem": "¿Cuál de las siguientes es uno de los cuatro «facilitadores de alta prioridad» del Plan Estratégico 2026-2050?", "opts": ["Duplicar el número de oficinas regionales", "Reducir la ANC a 12 miembros", "Suprimir el ciclo presupuestario trienal", "La igualdad de género y la atracción de nuevos talentos hacia la aviación"], "ans": 3, "why": "Los cuatro facilitadores de alta prioridad son la mejora organizativa continua de la OACI, la innovación, la igualdad de género y la atracción de nuevos talentos hacia la aviación, y las asociaciones, la movilización de recursos y la sostenibilidad financiera.", "src": "OACI, página «Strategic Plan 2026-2050»", "note": ""}, {"n": 70, "stem": "¿Cuál de las siguientes afirmaciones sobre la CEAC (Conferencia Europea de Aviación Civil, <em>ECAC</em>) es correcta?", "opts": ["La CEAC es un organismo intergubernamental de Estados europeos independiente, distinto de la OACI y de EUROCONTROL", "La CEAC ya no existe; se fusionó con EASA en 2002", "La CEAC es un comité interno de la OACI presidido por el Presidente de la ANC", "La CEAC es una dirección de EUROCONTROL"], "ans": 0, "why": "La CEAC coordina las posiciones de política de aviación civil europea e interactúa con la Oficina para Europa y el Atlántico Norte de la OACI, pero es organizativamente independiente de la OACI y de EUROCONTROL, y sigue existiendo (no se fusionó con EASA).", "src": "Lectura cruzada del material de las oficinas regionales de la OACI y de la estructura general de la CEAC/EUROCONTROL (el alcance de este trabajo no llega al detalle completo de EUROCONTROL, que cubre T01b)", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/01-instituciones-legislacion/ampliacion/T01a-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
