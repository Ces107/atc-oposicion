:root{color-scheme:light dark;

  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;

  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;

  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}

details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

bol><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Instituciones y legislación aeronáutica</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: España — legislación aeronáutica, AESA, ENAIRE, la CIAIAC y su sucesora (T01c)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Qué dos números del artículo 149.1 de la Constitución española cita conjuntamente la Ley 21/2003 como su fundamento constitucional?", "opts": ["149.1.1ª y 149.1.2ª", "149.1.13ª y 149.1.15ª", "149.1.4ª y 149.1.20ª", "149.1.20ª y 149.1.21ª"], "ans": 2, "why": "La disposición final primera de la Ley 21/2003 invoca el art. 149.1.4ª (defensa y Fuerzas Armadas) y el 20ª (aeropuertos de interés general, control del espacio aéreo, tránsito y transporte aéreo, servicio meteorológico, matriculación de aeronaves) como «títulos competenciales». Los demás pares no son los citados.", "src": "Ley 21/2003, texto consolidado, disposición final primera.", "note": ""}, {"n": 2, "stem": "Según el artículo 1 de la Ley 48/1960, la soberanía del Estado español sobre el espacio aéreo se extiende sobre qué territorio?", "opts": ["Solo el territorio terrestre", "Solo los aeropuertos de interés general", "El territorio y el mar territorial", "El territorio y la zona económica exclusiva"], "ans": 2, "why": "El artículo 1 dice «el espacio aéreo situado sobre el territorio español y su mar territorial está sujeto a la soberanía del Estado español»: la soberanía se extiende sobre el territorio Y el mar territorial.", "src": "Ley 48/1960, art. 1.", "note": ""}, {"n": 3, "stem": "¿Cuántos capítulos tiene la Ley 48/1960 sobre Navegación Aérea en su texto consolidado?", "opts": ["12", "15", "21", "19"], "ans": 3, "why": "El texto consolidado va del Capítulo I al Capítulo XIX (19 capítulos) y abarca desde las disposiciones generales hasta las sanciones.", "src": "Ley 48/1960, índice.", "note": ""}, {"n": 4, "stem": "¿Cuál es la situación actual del Capítulo XIX («De las sanciones») de la Ley 48/1960?", "opts": ["Plenamente vigente, sin cambios desde 1960", "Derogado por completo; las sanciones se rigen por la Ley 21/2003", "Solo derogado parcialmente (siguen vigentes los arts. 152 a 155)", "Derogado y sustituido por el RD 184/2008"], "ans": 1, "why": "Los artículos 152 a 159 de la Ley 48/1960 figuran todos como «(Derogado)» en el texto consolidado. Hoy las sanciones se rigen por la Ley 21/2003, no por la ley de 1960.", "src": "Ley 48/1960, arts. 152-159.", "note": ""}, {"n": 5, "stem": "Según el artículo 58 de la Ley 48/1960, ¿qué exige el ejercicio de una función que afecte al control, a la circulación o al transporte aéreos?", "opts": ["Solo un contrato de trabajo válido", "Una recomendación del director del aeropuerto", "Un título, licencia, autorización o certificado que habilite para esa función concreta", "Nada, si la persona es funcionario"], "ans": 2, "why": "El artículo 58 exige un título, licencia, autorización o certificado que habilite específicamente para la función, además del deber de no abandonarla sin causa justificada hasta ser relevado.", "src": "Ley 48/1960, art. 58.", "note": ""}, {"n": 6, "stem": "¿Cuántos títulos estructuran la Ley 21/2003 de Seguridad Aérea?", "opts": ["6", "4", "8", "5"], "ans": 0, "why": "La ley tiene 6 títulos: I Disposiciones generales, II Gestión en materia de seguridad operacional, III Inspección aeronáutica, IV Obligaciones por razones de seguridad, V Infracciones y sanciones, VI Ingresos de los gestores de aeropuertos.", "src": "Ley 21/2003, índice.", "note": ""}, {"n": 7, "stem": "¿Sobre qué real decreto-ley se apoyó y perfeccionó el Título I de la Ley 21/2003 en lo relativo al reparto de competencias aeronáuticas entre Defensa y Transportes?", "opts": ["RDL 12/1978", "RDL 13/2010", "RD 253/2024", "RD 184/2008"], "ans": 0, "why": "El preámbulo de la Ley 21/2003 explica que desarrolla y perfecciona el Real Decreto-ley 12/1978, de 27 de abril, que había fijado y delimitado originalmente las competencias entre los Ministerios de Defensa y de Transportes y Comunicaciones en materia de aviación.", "src": "Ley 21/2003, preámbulo.", "note": ""}, {"n": 8, "stem": "¿Cuál es la situación actual de los artículos 13 a 17 de la Ley 21/2003 (que definían la CIAIAC)?", "opts": ["Vigentes, sin cambios desde 2003", "Todos derogados", "Solo está derogado el artículo 13", "Suspendidos, a la espera de la entrada en vigor del RD 141/2026"], "ans": 1, "why": "Los artículos 13, 14, 15, 16 y 17 figuran todos como «(Derogado)» en el texto consolidado. La base legal propia de la CIAIAC en la Ley 21/2003 ya no existe.", "src": "Ley 21/2003, arts. 13-17.", "note": ""}, {"n": 9, "stem": "Según el artículo 11 de la Ley 21/2003, ¿cuándo puede utilizarse como prueba en un procedimiento administrativo la información de seguridad notificada voluntariamente?", "opts": ["Nunca, en ninguna circunstancia", "Siempre, si lo solicita un juez", "Solo si hubo dolo o negligencia grave", "Solo si lo autoriza el Director de AESA"], "ans": 2, "why": "El artículo 11.1 establece que esa información no puede utilizarse como prueba ni divulgarse, salvo que se aprecie dolo o negligencia grave; es el fundamento legal de la «cultura justa» (<em>just culture</em>) en España.", "src": "Ley 21/2003, art. 11.1.", "note": ""}, {"n": 10, "stem": "Según el régimen general del artículo 55.1 de la Ley 21/2003, ¿cuál es el intervalo de la multa por una infracción «muy grave»?", "opts": ["De 90 001 a 225 000 euros", "De 45 001 a 90 000 euros", "De 250 001 a 4 500 000 euros", "De 60 a 45 000 euros"], "ans": 0, "why": "El artículo 55.1.c fija de 90 001 a 225 000 euros para las infracciones muy graves en el régimen general (sujetos sin actividad comercial). Los demás intervalos corresponden a las infracciones graves o leves, o a la escala agravada comercial.", "src": "Ley 21/2003, art. 55.1.", "note": ""}, {"n": 11, "stem": "Según el régimen agravado del artículo 55.2 de la Ley 21/2003 (sujetos comerciales o profesionales, como los proveedores de ANS), ¿cuál es el intervalo de la multa por una infracción «muy grave»?", "opts": ["De 90 001 a 225 000 euros", "De 70 001 a 250 000 euros", "De 45 001 a 90 000 euros", "De 250 001 a 4 500 000 euros"], "ans": 3, "why": "El artículo 55.2.c fija de 250 001 a 4 500 000 euros para las infracciones muy graves cometidas por proveedores de ANS, compañías aéreas comerciales y otros sujetos profesionales similares: unas 20 veces el límite superior de la escala general.", "src": "Ley 21/2003, art. 55.2.", "note": ""}, {"n": 12, "stem": "Según el artículo 55.3 de la Ley 21/2003, ¿en cuánto puede aumentarse una multa «muy grave» cuando se conoce el beneficio bruto ilícito y este supera el intervalo normal?", "opts": ["Hasta la misma cuantía del beneficio, sin más", "Hasta el triple del beneficio obtenido", "No puede aumentarse en ninguna circunstancia", "Hasta diez veces el beneficio obtenido"], "ans": 1, "why": "El artículo 55.3.b permite elevar la multa hasta el triple («no superior al triple») del beneficio bruto obtenido en las infracciones muy graves (el doble en las graves).", "src": "Ley 21/2003, art. 55.3.", "note": ""}, {"n": 13, "stem": "Según el artículo 56.2 de la Ley 21/2003, ¿qué ocurre a quien comete dos o más infracciones «muy graves» en el plazo de un año?", "opts": ["Solo un apercibimiento formal", "La pérdida automática de los beneficios vinculados a la nacionalidad española", "Inhabilitación durante 3 años para ostentar títulos o derechos relacionados con la aviación", "Procesamiento penal inmediato"], "ans": 2, "why": "El artículo 56.2 impone una inhabilitación obligatoria de 3 años para ostentar cualquier derecho o título administrativo que habilite para funciones aeronáuticas, y para formar parte del órgano de administración de una persona jurídica titular de ellos.", "src": "Ley 21/2003, art. 56.2.", "note": ""}, {"n": 14, "stem": "Según el artículo 58 de la Ley 21/2003, ¿a quién corresponde la competencia para imponer las sanciones que establece la ley?", "opts": ["A quien ostente la Dirección de AESA", "Al Presidente de AESA", "Al Ministro de Transportes personalmente", "Al Director General de Aviación Civil"], "ans": 0, "why": "El artículo 58 atribuye la competencia sancionadora, en el ámbito del Ministerio de Transportes, a quien ostente la Dirección de AESA (su Director), y no al Presidente de AESA.", "src": "Ley 21/2003, art. 58.", "note": ""}, {"n": 15, "stem": "¿Qué aprueba el Real Decreto 57/2002 y qué tipo de tránsito regula principalmente?", "opts": ["El RCAO, que regula la circulación aérea operativa militar", "El Estatuto de AESA, que regula las sanciones", "El Estatuto de ENAIRE, que regula las tasas del espacio aéreo", "El Reglamento de Circulación Aérea (RCA), que regula la circulación aérea general (CAG)"], "ans": 3, "why": "El RD 57/2002 aprueba el RCA, las normas civiles básicas del aire para la circulación aérea general (CAG), estructurado en 8 Libros (del Libro Primero, definiciones, al Libro Octavo, servicio de información aeronáutica).", "src": "RD 57/2002, título e índice.", "note": ""}, {"n": 16, "stem": "¿Qué real decreto es el que aplica realmente en España el SERA (Reglamento (UE) 923/2012)?", "opts": ["RD 601/2016", "RD 1180/2018", "RD 184/2008", "RD 160/2023"], "ans": 1, "why": "El RD 1180/2018 desarrolla las reglas del aire y las disposiciones operativas comunes para los servicios de navegación aérea, es decir, aplica SERA en España, y modifica en consecuencia el RCA (RD 57/2002). El RD 601/2016 es otra norma, de carácter militar.", "src": "RD 1180/2018, preámbulo.", "note": ""}, {"n": 17, "stem": "¿Qué regula realmente el Real Decreto 601/2016?", "opts": ["La aplicación de SERA al tránsito civil", "El Reglamento de Circulación Aérea Operativa (RCAO), para la circulación aérea operativa militar", "Los procedimientos de licencias ATCO", "El régimen sancionador de AESA"], "ans": 1, "why": "El RD 601/2016 aprueba el RCAO, que regula la circulación aérea operativa (CAO), esencialmente vuelos militares, administrada por el Ejército del Aire. Es frecuente y erróneo suponer que es el real decreto de SERA; no lo es.", "src": "RD 601/2016, título y arts. 2.1.1-2.1.2.", "note": ""}, {"n": 18, "stem": "¿Qué real decreto anterior derogó el RD 601/2016?", "opts": ["RD 1489/1994", "RD 57/2002", "RD 552/2014", "RD 931/2010"], "ans": 0, "why": "La disposición derogatoria única del RD 601/2016 deroga expresamente el RD 1489/1994, de 1 de julio, que había aprobado la versión anterior del RCAO.", "src": "RD 601/2016, disposición derogatoria única.", "note": ""}, {"n": 19, "stem": "¿Qué autoridad administra la circulación aérea operativa (CAO) según el RD 601/2016?", "opts": ["AESA", "ENAIRE", "La DGAC", "El Ejército del Aire, Ministerio de Defensa"], "ans": 3, "why": "La disposición final segunda del RD 601/2016 atribuye al Ejército del Aire la función de proponer, elaborar y difundir las disposiciones técnicas y funcionales necesarias para ejecutar el RCAO.", "src": "RD 601/2016, disposición final segunda.", "note": ""}, {"n": 20, "stem": "Cite un ejemplo de tipo de misión que el RD 601/2016 enumera como propia de la circulación aérea operativa (CAO).", "opts": ["Vuelos comerciales regulares de pasajeros", "Reabastecimiento en vuelo", "Vuelos de instrucción de aviación general", "Vuelos del servicio de información de vuelo de aeródromo"], "ans": 1, "why": "El artículo 2.1.2.2 cita el reabastecimiento en vuelo, la patrulla y el reconocimiento, y los vuelos de prueba como misiones típicas de la CAO que no pueden ajustarse al RCA ni a la normativa de la UE.", "src": "RD 601/2016, art. 2.1.2.2.", "note": ""}, {"n": 21, "stem": "¿En qué fecha se aprobó la Ley 9/2010 (que regula la prestación de servicios de tránsito aéreo)?", "opts": ["2 de diciembre de 2016", "8 de febrero de 2008", "14 de abril de 2010", "7 de julio de 2003"], "ans": 2, "why": "La Ley 9/2010 es de 14 de abril de 2010; regula la prestación de servicios de tránsito aéreo, las obligaciones de los proveedores y ciertas condiciones de trabajo de los ATCO.", "src": "Ley 9/2010, encabezamiento.", "note": ""}, {"n": 22, "stem": "¿Cuántos artículos tiene la Ley 9/2010 (sin contar las disposiciones adicionales y finales)?", "opts": ["4", "10", "6", "2"], "ans": 0, "why": "La ley es breve: solo 4 artículos (designación de proveedores, garantía de la prestación, tiempos de actividad y descanso, incumplimientos), además de las disposiciones adicionales y finales.", "src": "Ley 9/2010, índice.", "note": ""}, {"n": 23, "stem": "Según el preámbulo de la Ley 9/2010, ¿desde qué fecha llevaba vencido el convenio colectivo de los ATCO, lo que motivó la ley?", "opts": ["1 de enero de 2010", "31 de diciembre de 1998", "15 de enero de 2012", "31 de diciembre de 2004"], "ans": 3, "why": "El preámbulo indica que la vigencia del convenio colectivo de los ATCO terminó el 31 de diciembre de 2004, tras lo cual AENA intentó en repetidas ocasiones, sin éxito, renegociar las condiciones de trabajo.", "src": "Ley 9/2010, preámbulo.", "note": ""}, {"n": 24, "stem": "Se enumeran las seis facultades indisponibles del proveedor civil de servicios ATS según el artículo 2 de la Ley 9/2010. ¿Cuál de las siguientes NO es una de ellas?", "opts": ["Determinar la configuración operativa", "Aprobar el presupuesto nacional de la infraestructura de navegación aérea", "Seleccionar y formar a los ATCO", "Organizar los turnos, horarios y descansos"], "ans": 1, "why": "Las seis facultades indisponibles son: configuración operativa; instalaciones, servicios técnicos y personal; organización directiva; selección y formación de los ATCO; turnos, horarios y descansos; y vigilancia y sanción del personal. Aprobar el presupuesto nacional no figura entre ellas.", "src": "Ley 9/2010, art. 2.2.", "note": ""}, {"n": 25, "stem": "Según el artículo 2.3 de la Ley 9/2010, ¿cuál es la consecuencia de que un proveedor de servicios ATS renuncie voluntariamente a una de sus facultades indisponibles?", "opts": ["Solo un apercibimiento formal de AESA", "Ninguna, ya que las facultades son opcionales", "La revocación de su designación como proveedor de servicios ATS", "Una multa de hasta 45 000 euros"], "ans": 2, "why": "El artículo 2.3 establece que estas facultades son «indisponibles»; la renuncia voluntaria del proveedor provoca la revocación de la designación obtenida con arreglo al artículo 1.2.", "src": "Ley 9/2010, art. 2.3.", "note": ""}, {"n": 26, "stem": "Según el artículo 3 de la Ley 9/2010, ¿cuál es la duración máxima de un turno de los controladores de tránsito aéreo civiles?", "opts": ["12 horas por servicio", "10 horas por servicio", "8 horas por servicio", "14 horas por servicio"], "ans": 0, "why": "El artículo 3.1 fija la duración del turno en un máximo de 12 horas por servicio.", "src": "Ley 9/2010, art. 3.1.", "note": ""}, {"n": 27, "stem": "Según el artículo 3 de la Ley 9/2010, ¿qué porcentaje de la duración del turno de noche debe ser tiempo de descanso?", "opts": ["20 %", "25 %", "50 %", "33 %"], "ans": 3, "why": "El artículo 3.3 fija el descanso en el 25 % del turno diurno y el 33 % del nocturno (en las torres monoposición se aplica en su lugar una hora fija por servicio).", "src": "Ley 9/2010, art. 3.3.", "note": ""}, {"n": 28, "stem": "Según el artículo 3 de la Ley 9/2010, ¿qué regla especial de descanso se aplica a los controladores que trabajan en torres de control monoposición?", "opts": ["No se exige descanso", "1 hora de descanso por servicio, con independencia de los porcentajes generales", "El 50 % de la duración del turno", "Descanso solo en los turnos de noche"], "ans": 1, "why": "Las torres monoposición tienen un descanso fijo de 1 hora por servicio en lugar de la regla porcentual del 25 %/33 % que se aplica en los demás casos.", "src": "Ley 9/2010, art. 3.3.", "note": ""}, {"n": 29, "stem": "Según el artículo 3 de la Ley 9/2010, ¿cuál es el máximo anual de horas extraordinarias permitido a los ATCO civiles?", "opts": ["100 horas al año", "80 horas al año", "120 horas al año", "60 horas al año"], "ans": 1, "why": "El artículo 3.2 limita las horas extraordinarias a 80 al año, conforme al Estatuto de los Trabajadores.", "src": "Ley 9/2010, art. 3.2.", "note": ""}, {"n": 30, "stem": "Según la disposición adicional primera de la Ley 9/2010, ¿qué medida extraordinaria puede adoptarse respecto a los controladores de tránsito aéreo de ENAIRE (entonces AENA)?", "opts": ["Sus licencias pueden revocarse de forma permanente", "Pueden pasar a la plantilla de AESA", "Pueden ponerse bajo la dirección del Ministerio de Defensa", "Puede suspenderse su representación sindical"], "ans": 2, "why": "Con remisión al art. 4.4.a) de la Ley 21/2003, esta disposición permite poner a los ATCO bajo la dirección de Defensa, que asume su organización, planificación, supervisión y control: la base legal empleada en la crisis de los controladores de diciembre de 2010.", "src": "Ley 9/2010, disposición adicional primera.", "note": ""}, {"n": 31, "stem": "¿Qué territorios destaca la disposición adicional primera de la Ley 9/2010 para una atención especial en cuanto a la seguridad y la continuidad de los servicios ATS?", "opts": ["Madrid y Barcelona", "El País Vasco y Cataluña", "Andalucía y Galicia", "Canarias, Baleares, Ceuta y Melilla"], "ans": 3, "why": "La disposición menciona expresamente estos territorios insulares y de enclave por su exposición al riesgo para la continuidad del servicio.", "src": "Ley 9/2010, disposición adicional primera.3.", "note": ""}, {"n": 32, "stem": "¿Cuál es la denominación oficial completa, en español, del organismo creado para sustituir a la CIAIAC, la CIAF y la CIAIM?", "opts": ["Agencia Estatal de Seguridad Aérea", "Autoridad Administrativa Independiente para la Investigación Técnica de Accidentes e Incidentes ferroviarios, marítimos y de aviación civil", "Comisión Nacional de Investigación de Accidentes", "Dirección General de Aviación Civil"], "ans": 1, "why": "Es la denominación legal exacta que da el artículo 1 de la Ley 2/2024: un único organismo para tres modos de transporte (ferroviario, marítimo y aviación civil).", "src": "Ley 2/2024, art. 1.", "note": ""}, {"n": 33, "stem": "¿En qué fecha se publicó en el BOE la Ley 2/2024 (que crea la nueva Autoridad de investigación)?", "opts": ["27 de febrero de 2026", "25 de febrero de 2026", "2 de agosto de 2024", "1 de agosto de 2024"], "ans": 2, "why": "La Ley 2/2024, de 1 de agosto, se publicó en el BOE núm. 186 de 2 de agosto de 2024 (la fecha impresa en la cabecera del BOE es la de publicación; la propia ley es «de 1 de agosto»).", "src": "Ley 2/2024, encabezamiento.", "note": ""}, {"n": 34, "stem": "¿Qué real decreto aprueba el Estatuto orgánico de la nueva Autoridad independiente de investigación?", "opts": ["RD 141/2026", "RD 160/2023", "RD 184/2008", "RD 253/2024"], "ans": 0, "why": "El Real Decreto 141/2026, de 25 de febrero (BOE núm. 52, de 27 de febrero de 2026), aprueba el Estatuto orgánico de la Autoridad.", "src": "RD 141/2026, encabezamiento.", "note": ""}, {"n": 35, "stem": "¿Qué TRES comisiones predecesoras suprime formalmente el RD 141/2026 al constituirse la nueva Autoridad?", "opts": ["CIAIAC, AESA y DGAC", "CIAF, CIAIM y CIAIAC", "CIDETRA, CIPAI y SCA", "CIAIAC, CIDETRA y CIPAI"], "ans": 1, "why": "La disposición adicional segunda nombra la Comisión de Investigación de Accidentes Ferroviarios (CIAF), la Comisión Permanente de Investigación de Accidentes e Incidentes Marítimos (CIAIM) y la CIAIAC.", "src": "RD 141/2026, disposición adicional segunda.", "note": ""}, {"n": 36, "stem": "Según el artículo 1 de la Ley 2/2024, ¿cuál es la naturaleza jurídica de la nueva Autoridad de investigación?", "opts": ["Una fundación privada sin ánimo de lucro", "Una Autoridad Administrativa Independiente con personalidad jurídica propia y plena independencia del Gobierno", "Un departamento de AESA", "Una agencia conjunta de la UE y España"], "ans": 1, "why": "El artículo 1 la crea como Autoridad Administrativa Independiente conforme al art. 109 de la Ley 40/2015, con autonomía orgánica y funcional y plena independencia del Gobierno y de las Administraciones Públicas, sometida a control parlamentario y judicial.", "src": "Ley 2/2024, art. 1.2.", "note": ""}, {"n": 37, "stem": "Según el RD 141/2026, ¿qué debe ocurrir para que la nueva Autoridad se considere «constituida y en funcionamiento efectivo»?", "opts": ["La sola publicación de su Estatuto orgánico en el BOE", "Un Real Decreto que nombre a su primer Presidente", "La sesión constitutiva de su Consejo", "Un voto de confianza parlamentario"], "ans": 2, "why": "La disposición adicional primera.2 establece que la constitución se produce con la celebración de la sesión constitutiva del Consejo, que ha de tener lugar en el plazo de 1 mes desde el nombramiento de los miembros del Consejo.", "src": "RD 141/2026, disposición adicional primera.2.", "note": ""}, {"n": 38, "stem": "En la sesión constitutiva de la nueva Autoridad, ¿qué se decide por sorteo?", "opts": ["La ciudad sede de la Autoridad", "El diseño del sello oficial de la Autoridad", "Qué tres miembros del Consejo tendrán un primer mandato reducido de 3 años", "La asignación del presupuesto anual"], "ans": 2, "why": "Según la disposición adicional cuarta de la Ley 2/2024, un sorteo en la sesión constitutiva determina qué 3 miembros del Consejo cumplen solo 3 años en lugar del mandato general de 6, de modo que las renovaciones futuras sean escalonadas.", "src": "RD 141/2026, disposición adicional primera.2.", "note": ""}, {"n": 39, "stem": "¿Por qué pudo el manual de ENAIRE del tema 1 (redactado en noviembre de 2025) describir con exactitud a la CIAIAC como el organismo «actual»?", "opts": ["Porque la CIAIAC nunca fue sustituida", "Porque la Ley 2/2024 fue derogada antes de entrar en vigor", "Porque el manual ignora deliberadamente la legislación vigente", "Porque la nueva Autoridad solo podía entrar en funcionamiento una vez aprobado su Estatuto orgánico (RD 141/2026, febrero de 2026) y celebrada la sesión constitutiva de su Consejo, pasos todos ellos posteriores a la redacción del manual"], "ans": 3, "why": "La ley habilitante (agosto de 2024) no bastó por sí sola para que la nueva Autoridad entrara en funcionamiento; hicieron falta el Estatuto orgánico (febrero de 2026) y la sesión constitutiva del Consejo, ambos posteriores a noviembre de 2025.", "src": "RD 141/2026, disposición adicional primera; <code>research/manual-audit-t01.md</code>.", "note": ""}, {"n": 40, "stem": "Según el artículo 1 del RD 184/2008, ¿cuál es la naturaleza jurídica de AESA?", "opts": ["Una sociedad mercantil cotizada", "Un organismo público, conforme al artículo 108 bis de la Ley 40/2015", "Una fundación privada", "Una organización intergubernamental creada por un tratado"], "ans": 1, "why": "AESA es un organismo público con personalidad jurídica pública propia, patrimonio y tesorería propios, y autonomía funcional y de gestión, salvo la potestad expropiatoria.", "src": "RD 184/2008, art. 1.", "note": ""}, {"n": 41, "stem": "Según el artículo 14 del RD 184/2008 (en su redacción consolidada vigente), ¿quién ostenta la Presidencia de AESA?", "opts": ["El Ministro de Transportes personalmente", "El Director General de Aviación Civil", "Quien ostente la Secretaría General de Transportes Aéreo y Marítimo", "El propio Director de AESA"], "ans": 2, "why": "El artículo 14, en su redacción consolidada vigente, atribuye la Presidencia a quien ostente la Secretaría General de Transportes Aéreo y Marítimo (el cargo creado por la reorganización ministerial de 2024).", "src": "RD 184/2008, art. 14.", "note": ""}, {"n": 42, "stem": "Históricamente, según el preámbulo original de 2008 del RD 184/2008, ¿quién era el Presidente no ejecutivo de AESA?", "opts": ["El Director General de Aviación Civil (DGAC)", "El Secretario de Estado de Transportes", "El Ministro de Defensa", "El propio Director de AESA"], "ans": 0, "why": "El preámbulo de 2008 describe un Presidente no ejecutivo que «a su vez es el Director General de Aviación Civil», fórmula que quedó superada por el artículo 14 en su redacción consolidada vigente.", "src": "RD 184/2008, preámbulo.", "note": ""}, {"n": 43, "stem": "¿Cuál es la composición del Consejo Rector de AESA según el artículo 16 del RD 184/2008?", "opts": ["Solo el Presidente y 5 consejeros", "El Presidente, 11 consejeros y un Secretario sin voto", "15 consejeros sin Presidente", "Solo el Presidente y el Director"], "ans": 1, "why": "El artículo 16 establece el Consejo Rector como el Presidente, once consejeros (vocalías) y un Secretario que asiste con voz pero sin voto.", "src": "RD 184/2008, art. 16.", "note": ""}, {"n": 44, "stem": "¿Quiénes son los dos miembros natos del Consejo Rector de AESA?", "opts": ["El Presidente de ENAIRE y el Presidente de Aena", "El Director de AESA y el Director General de Aviación Civil", "Los Ministros de Transportes y de Defensa", "Dos representantes de los trabajadores"], "ans": 1, "why": "El artículo 16.3 convierte en miembros natos del Consejo a quienes ostenten la Dirección de AESA y el cargo de Director General de Aviación Civil.", "src": "RD 184/2008, art. 16.3.", "note": ""}, {"n": 45, "stem": "¿En qué fecha celebró su sesión constitutiva el Consejo Rector de AESA?", "opts": ["8 de febrero de 2008", "1 de enero de 2009", "2 de junio de 2008", "15 de enero de 2012"], "ans": 2, "why": "Las disposiciones transitorias del RD 184/2008 recogen la sesión constitutiva del Consejo Rector de AESA el 2 de junio de 2008.", "src": "RD 184/2008, disposiciones transitorias.", "note": ""}, {"n": 46, "stem": "¿Qué potestad queda expresamente excluida de las potestades administrativas de AESA según el artículo 1 del RD 184/2008?", "opts": ["La potestad sancionadora", "La potestad de inspección", "La potestad expropiatoria", "La potestad de expedir licencias"], "ans": 2, "why": "AESA ejerce todas las potestades administrativas necesarias para el cumplimiento de sus fines «salvo la potestad expropiatoria».", "src": "RD 184/2008, art. 1.2.", "note": ""}, {"n": 47, "stem": "¿Qué artículo de la Ley 18/2014 es la fuente legal precisa del cambio de denominación de AENA a ENAIRE?", "opts": ["El artículo 82", "El artículo 7", "El artículo 55", "El artículo 18"], "ans": 3, "why": "El artículo 18, «Cambio de denominación», de la Ley 18/2014 cambia a la vez el nombre de «Aena Aeropuertos S.A.» a «Aena, S.A.» y el de la E.P.E. «Aeropuertos Españoles y Navegación Aérea (Aena)» a «Enaire E.P.E.».", "src": "Ley 18/2014, art. 18.", "note": ""}, {"n": 48, "stem": "¿En virtud de qué artículo de qué ley se creó originalmente ENAIRE (como AENA), naturaleza que conserva hoy?", "opts": ["El artículo 149.1.20ª CE", "El artículo 82 de la Ley 4/1990", "El artículo 6 del RD 184/2008", "El artículo 1 del RD 160/2023"], "ans": 1, "why": "El artículo 82 de la Ley 4/1990 (Ley de Presupuestos Generales del Estado para 1990) creó la entidad; la Ley 18/2014 y el RD 160/2023 confirman que ENAIRE mantiene la misma naturaleza jurídica y el mismo régimen allí establecidos.", "src": "RD 160/2023, art. 1; Ley 18/2014, art. 18.2.", "note": ""}, {"n": 49, "stem": "Además de las competencias de navegación aérea, ¿qué función inusual heredó ENAIRE según el artículo 18.2 de la Ley 18/2014?", "opts": ["La gestión de parques nacionales", "La conservación y gestión de su patrimonio histórico, cultural y artístico", "La expedición de pasaportes", "La gestión de la infraestructura ferroviaria nacional"], "ans": 1, "why": "El artículo 18.2 encomienda expresamente a ENAIRE la conservación, defensa, gestión y explotación de su patrimonio histórico-cultural-artístico, sin perjuicio de las competencias del Ministerio de Cultura conforme a la Ley 16/1985.", "src": "Ley 18/2014, art. 18.2.", "note": ""}, {"n": 50, "stem": "Según el RD 160/2023, ¿quién ostenta la Presidencia de ENAIRE?", "opts": ["Quien ostente la Secretaría de Estado con competencias en transportes", "Quien ostente la Secretaría General de Transportes Aéreo y Marítimo", "El Ministro de Transportes personalmente", "El propio Director General de ENAIRE"], "ans": 0, "why": "La Presidencia de ENAIRE corresponde al nivel de Secretaría de Estado, un rango por encima del Presidente de AESA (que es de nivel de Secretaría General).", "src": "RD 160/2023, art. 14.", "note": ""}, {"n": 51, "stem": "¿Qué dirección de ENAIRE es la responsable específicamente del FUA (uso flexible del espacio aéreo) y de la coordinación con EUROCONTROL?", "opts": ["La Secretaría General", "La Dirección de Comunicación", "La Dirección General", "La Dirección de Coordinación Civil-Militar"], "ans": 3, "why": "El RD 160/2023 encomienda a esta dirección representar los intereses de ENAIRE, asegurar la coordinación con el Ministerio de Defensa, actuar en el FUA y coordinarse con EUROCONTROL.", "src": "RD 160/2023, art. 17 (estructura ejecutiva).", "note": ""}, {"n": 52, "stem": "¿Cuál es la composición del Consejo Rector de ENAIRE según el artículo 9 del RD 160/2023?", "opts": ["El Presidente y 11 consejeros", "El Presidente y 5 consejeros", "15 consejeros con presidencia rotatoria", "El Presidente y 20 consejeros"], "ans": 0, "why": "Como el de AESA, el Consejo Rector de ENAIRE está formado por el Presidente y once consejeros, nombrados y cesados por el Ministro de Transportes con respeto a la paridad de género.", "src": "RD 160/2023, art. 9.", "note": ""}, {"n": 53, "stem": "¿En el apéndice 4 de qué reglamento de la UE se establece la clasificación del espacio aéreo ATS (clases A a G) que se aplica en España mediante el RD 1180/2018?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 2015/340", "Reglamento (UE) 923/2012 (SERA)", "Reglamento (UE) 139/2014"], "ans": 2, "why": "El apéndice 4 de SERA establece la clasificación del espacio aéreo ATS; el RD 1180/2018 aplica SERA (incluida esta clasificación) en España y modifica en consecuencia el RCA.", "src": "RD 1180/2018, preámbulo; manual §4.3.3.", "note": ""}, {"n": 54, "stem": "Según el preámbulo del RD 1180/2018, ¿qué comisión ostentaba históricamente la competencia sobre la clasificación del espacio aéreo en España?", "opts": ["CIDEFO", "AESA", "CIPAI", "El Consejo Asesor de Aviación Civil"], "ans": 0, "why": "El preámbulo atribuye la competencia de clasificación del espacio aéreo a la CIDEFO (Comisión Interministerial entre Defensa y Fomento, nombre anterior de la actual CIDETRA), en coherencia con las funciones de la Ley 21/2003.", "src": "RD 1180/2018, preámbulo.", "note": ""}, {"n": 55, "stem": "Según la Resolución de la Dirección de AESA de 11 de octubre de 2011, ¿antes de qué fecha debía completar AESA el canje de oficio de las licencias ATCO preexistentes al nuevo formato de la UE?", "opts": ["2 de junio de 2008", "1 de enero de 2018", "31 de diciembre de 2004", "15 de enero de 2012"], "ans": 3, "why": "La Resolución exigía que AESA completara el canje de oficio antes del 15 de enero de 2012, tras solicitar a ENAIRE los datos de la plantilla de ATCO.", "src": "Manual §4.4.4, que cita la Resolución de AESA de 11 de octubre de 2011.", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/01-instituciones-legislacion/ampliacion/T01c-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

let order=Q.map((_,i)=>i),shuffleOpts=false,hideDone=false;
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
  const box=$('#qs');box.innerHTML='';let done=0,right=0;
  Q.forEach((q,i)=>{const r=st[q.n];if(r){done++;if(r.ok)right++}});
  $('#score').textContent=`${right} ${U.score} ${done} ${U.answered} · ${Q.length} ${U.questions}`+(done?` · ${Math.round(100*right/done)}%`:'');
  order.forEach(i=>{
    const q=Q[i],r=st[q.n];if(hideDone&&r)return;
    const d=document.createElement('section');d.className='q';d.id='q'+q.n;d.tabIndex=-1;
    const idx=(r&&r.idx)?r.idx:(shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3]);
    d.innerHTML=`<div class="qn">Q${q.n}</div><div class="stem">${q.stem}</div>`;
    idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
</script><script src="../../../assets/search.js" defer></script><script src="../../../assets/config.js"></script><script src="../../../assets/account.js" defer></script><script src="../../../assets/progress.js" defer></script></body></html>
