@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}

}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}

nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}

.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}

@media (max-width:900px){
  #toc{display:none}

  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}

1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol><symbol id="i-flow" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="4"/><rect x="3" y="17" width="6" height="4"/><rect x="15" y="17" width="6" height="4"/><path d="M12 7v4M6 17v-3h12v3"/></symbol><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Aerodinámica y mecánica del vuelo</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Aerodinámica del vuelo (T09a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Por la tercera ley de Newton, un ala produce sustentación porque:", "opts": ["la presión sobre el ala es siempre exactamente cero", "el ala desvía el aire hacia abajo (downwash) y, por reacción, el aire empuja el ala hacia arriba", "la superficie del ala se calienta por fricción y dilata el aire que hay sobre ella", "el empuje del motor se transmite directamente a la estructura del ala"], "ans": 1, "why": "El PHAK y la NASA exponen la explicación de Newton (desviación del flujo): el ala desvía el aire hacia abajo y la reacción igual y de sentido contrario empuja el ala hacia arriba. A es físicamente errónea (la presión nunca es cero); C y D no son explicaciones aerodinámicas de la sustentación.", "src": "NASA Beginner's Guide to Aeronautics, \"Newton's Laws of Motion\"", "note": ""}, {"n": 2, "stem": "La ecuación de continuidad (ρ1<em>A1</em>V1 = ρ2<em>A2</em>V2) completa el principio de Bernoulli porque explica:", "opts": ["por qué la presión estática es siempre mayor que la presión dinámica", "por qué una aeronave entra en pérdida con un ángulo de ataque alto", "por qué la velocidad del flujo aumenta donde disminuye la sección del conducto o del tubo de corriente, cosa que Bernoulli por sí solo no explica", "por qué la resistencia aumenta con el cuadrado de la velocidad"], "ans": 2, "why": "La continuidad es la conservación de la masa; para flujo incompresible A1<em>V1 = A2</em>V2, de modo que una sección menor obliga a una velocidad mayor. Bernoulli solo relaciona la presión con la velocidad una vez conocido el cambio de velocidad, no explica por qué se produce. B y D son hechos no relacionados y A es falsa.", "src": "NASA SP-367, \"Ideal Fluid Flow\"", "note": ""}, {"n": 3, "stem": "En comparación con una capa límite turbulenta, una capa límite laminar es:", "opts": ["más lisa, con menos resistencia por fricción, pero menos estable (se desprende de forma más brusca)", "más rugosa, con más resistencia por fricción, pero más resistente al desprendimiento", "idéntica en resistencia, pero siempre más gruesa", "propia únicamente de la velocidad supersónica"], "ans": 0, "why": "PHAK: el flujo laminar es liso y produce menos fricción superficial, pero es menos estable que el turbulento, que resiste mejor el desprendimiento a costa de más resistencia por fricción.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 4, "stem": "Los generadores de vórtices son pequeños perfiles colocados delante de los alerones con un ángulo de unos 12-15 grados respecto al flujo local. Su finalidad es:", "opts": ["reducir la resistencia inducida a baja velocidad", "aumentar el ángulo de ataque crítico de todo el ala", "generar directamente sustentación adicional", "retrasar el desprendimiento de la capa límite provocado por las ondas de choque en vuelo transónico, mezclando aire de alta energía con la capa límite"], "ans": 3, "why": "El PHAK describe los generadores de vórtices como un medio de reenergizar la capa límite para retrasar el desprendimiento causado por las ondas de choque a velocidad transónica, conservando la eficacia de los alerones. No añaden sustentación directamente ni modifican el ángulo de ataque crítico.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 5, "stem": "Si se duplica la velocidad del aire manteniendo iguales el ángulo de ataque, la densidad del aire y la configuración del ala, la sustentación pasa a ser:", "opts": ["la misma, ya que C_L no cambia", "cuatro veces mayor, porque la sustentación varía con el cuadrado de la velocidad", "el doble, proporcional a la velocidad", "la mitad, porque disminuye la presión dinámica"], "ans": 1, "why": "L = C_L * (ρ*V^2/2) * S; al duplicar V se cuadruplica el término de presión dinámica y, por tanto, la sustentación, con C_L, ρ y S constantes.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 6, "stem": "Cuando un ala supera su ángulo de ataque crítico y entra en pérdida:", "opts": ["sigue produciendo sustentación, pero no la suficiente para mantener el vuelo nivelado", "produce al instante sustentación nula", "produce sustentación negativa (una fuerza hacia abajo)", "sigue produciendo exactamente la misma sustentación que antes de la pérdida"], "ans": 0, "why": "El PHAK es explícito: un ala en pérdida no deja de producir sustentación por completo; simplemente no puede generar la suficiente para mantener el vuelo nivelado. Una trampa habitual de examen es suponer que la sustentación cae a cero.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 7, "stem": "El ángulo de ataque crítico de un ala o configuración dados:", "opts": ["aumenta con el peso y disminuye con la altitud", "cambia con el ángulo de alabeo, pero no con el peso", "es una propiedad geométrica fija que no cambia con el peso, el alabeo, la temperatura, la altitud densidad ni la posición del CG", "es siempre exactamente de 15 grados en una aeronave de categoría de transporte"], "ans": 2, "why": "El PHAK establece que el ángulo de ataque crítico es fijo para un perfil o configuración dados; lo que cambia con el peso, el alabeo, etc. es la velocidad (o el factor de carga) a la que se alcanza ese ángulo fijo, no el ángulo en sí.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 8, "stem": "Una «pérdida acelerada» se define mejor como:", "opts": ["una pérdida que se produce solo a velocidades superiores a VNE", "una pérdida causada exclusivamente por el fallo de un motor", "una pérdida que se produce en menos tiempo que una pérdida normal", "una pérdida producida con un factor de carga superior a 1G (por ejemplo, en un viraje cerrado o en una recogida), alcanzada a una velocidad mayor que la velocidad de pérdida publicada a 1G"], "ans": 3, "why": "La velocidad de pérdida publicada solo es válida a 1G, en vuelo coordinado y con un único peso. Una pérdida acelerada alcanza el mismo ángulo de ataque crítico fijo a una velocidad mayor, porque el ala debe generar n veces el peso en sustentación.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 9, "stem": "Según el PHAK, apenas 0,8 mm de hielo en la superficie superior del ala pueden:", "opts": ["aumentar la sustentación un 25 % por la rugosidad añadida de la superficie", "reducir la sustentación en torno a un 25 % y aumentar la resistencia, al perturbar la capa límite", "no tener efecto aerodinámico medible por debajo de 3 mm de espesor", "afectar solo a la resistencia, nunca a la sustentación"], "ans": 1, "why": "El PHAK da esta cifra exacta: una capa de hielo muy fina puede reducir la sustentación aproximadamente una cuarta parte y aumentar la resistencia, porque perturba la capa límite y provoca un desprendimiento más temprano.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 10, "stem": "En la mayoría de las alas rectas (sin flecha), el ala se diseña deliberadamente (mediante torsión o listones de pérdida) para que la primera zona en entrar en pérdida sea:", "opts": ["el encastre del ala, conservando la eficacia de los alerones en las puntas", "la punta del ala, para dar el aviso de pérdida más temprano posible en los alerones", "el borde de ataque del estabilizador horizontal", "la sección que lleve la luz de aterrizaje"], "ans": 0, "why": "PHAK: las alas rectas suelen diseñarse para entrar en pérdida primero por el encastre (mediante torsión o washout, o listones de pérdida), de modo que los alerones próximos a las puntas sigan siendo eficaces durante la pérdida. Las alas con flecha se comportan al revés (primero la punta).", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 11, "stem": "El alabeo geométrico o torsión del ala (washout) es una característica de diseño en la que:", "opts": ["la punta del ala se construye con un ángulo de incidencia menor que el del encastre, de modo que el encastre alcanza primero el ángulo de ataque crítico", "la punta del ala se construye con un ángulo de incidencia mayor que el del encastre, de modo que la punta alcanza primero el ángulo de ataque crítico", "todo el ala se gira respecto al fuselaje para cambiar el diedro", "el borde de salida se engrosa solo cerca del encastre"], "ans": 0, "why": "El glosario del PHAK define el washout como dar a la punta un ángulo de ataque menor que al encastre, lo que retrasa la pérdida de punta y conserva la autoridad de los alerones durante la pérdida; el manual de ENAIRE no lo nombra en absoluto.", "src": "FAA PHAK 8083-25C, glosario", "note": ""}, {"n": 12, "stem": "En comparación con un ala de bajo alargamiento, un ala de alto alargamiento (por ejemplo, un ala de planeador) tiene:", "opts": ["mayor resistencia inducida y menor peso estructural", "menor resistencia inducida para un C_L dado, pero cuesta más peso estructural por la mayor envergadura", "exactamente la misma resistencia inducida, solo que más resistencia parásita", "una velocidad de pérdida menor, con independencia de la carga alar"], "ans": 1, "why": "PHAK: un ala larga y estrecha (alto alargamiento) reduce la resistencia inducida para un coeficiente de sustentación dado, pero la gran envergadura añade peso estructural; las alas cortas y anchas (bajo alargamiento) son más ligeras y rígidas, pero tienen más resistencia inducida.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 13, "stem": "En comparación con un ala rectangular, una ala de planta elíptica:", "opts": ["da un aviso de pérdida más claro y más temprano, y es más barata de fabricar", "tiene más resistencia inducida para el mismo alargamiento", "entra siempre en pérdida primero por las puntas", "es aerodinámicamente casi ideal (resistencia inducida mínima, sustentación uniforme a lo largo de la envergadura), pero da poco aviso previo de pérdida y es difícil de construir"], "ans": 3, "why": "PHAK: el ala elíptica minimiza la resistencia inducida para un alargamiento dado con una distribución uniforme de la sustentación, pero entra en pérdida con poco aviso y es difícil y cara de fabricar, a diferencia del ala rectangular (pérdida primero por el encastre, buen aviso).", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 14, "stem": "Como regla práctica aproximada del PHAK, ¿cuánta flecha equivale aerodinámicamente a aproximadamente 1 grado de diedro efectivo?", "opts": ["Unos 10 grados de flecha", "Alrededor de 1 grado de flecha", "Unos 45 grados de flecha", "La flecha no guarda relación con el diedro efectivo"], "ans": 0, "why": "Regla práctica del PHAK: aproximadamente 10 grados de flecha aportan cerca de 1 grado de diedro efectivo a la estabilidad lateral; además, una configuración de ala alta añade unos 5 grados de diedro efectivo respecto a un ala baja.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 15, "stem": "El «efecto quilla» (keel effect), que contribuye a la estabilidad lateral de una aeronave de ala alta en un derrape, funciona porque:", "opts": ["el ángulo de diedro del ala aumenta automáticamente por efecto del flujo de aire", "los alerones se deflectan automáticamente cuando la aeronave derrapa", "el fuselaje cuelga bajo el ala como la quilla de un barco: la presión del aire lateral sobre el área lateral situada por encima del CG hace rodar la aeronave de vuelta a alas niveladas", "la deriva vertical genera sustentación adicional durante el derrape"], "ans": 2, "why": "El PHAK describe el efecto quilla como la combinación fuselaje-ala actuando como la quilla de un barco: en un derrape, la presión sobre el «área de la quilla» por encima del CG produce un momento de alabeo restaurador hacia alas niveladas.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 16, "stem": "Entre los cuatro tipos habituales de flaps de borde de salida descritos por el PHAK, el flap Fowler se distingue porque:", "opts": ["solo deflecta la superficie inferior del ala", "primero se desliza hacia atrás sobre carriles (aumentando la superficie alar) y después se deflecta hacia abajo (aumentando la curvatura), con poco aumento inicial de la resistencia", "es una superficie fija, sin movimiento", "es un dispositivo de borde de ataque, no de borde de salida"], "ans": 1, "why": "PHAK: el flap Fowler se extiende primero hacia atrás para aumentar la superficie alar y después se deflecta, con grandes ganancias de sustentación y una penalización de resistencia comparativamente pequeña al principio; la mayor parte del aumento de resistencia llega más tarde en el recorrido. Los flaps partidos (split) deflectan solo la superficie inferior (otro tipo).", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 17, "stem": "¿Qué tipo de flap de borde de salida describe el PHAK como el más común, con un conducto o ranura que canaliza aire de alta energía desde la superficie inferior hasta la superior del flap?", "opts": ["Flap simple (plain)", "Flap partido (split)", "Flap Fowler", "Flap ranurado (slotted)"], "ans": 3, "why": "El PHAK identifica el flap ranurado como el tipo más utilizado; la ranura reenergiza la capa límite sobre el flap y da un C_Lmax notablemente mayor que los flaps simples o partidos. Las aeronaves grandes suelen emplear versiones de doble o triple ranura.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 18, "stem": "Los slats móviles de borde de ataque, según el PHAK, funcionan:", "opts": ["permaneciendo pegados al ala con ángulo de ataque bajo (mantenidos por la alta presión del borde de ataque) y moviéndose hacia delante con ángulo de ataque alto para abrir una ranura que reenergiza la capa límite", "permaneciendo siempre extendidos durante todo el vuelo", "deflectándose solo en crucero para reducir la resistencia", "aumentando la curvatura sin modificar en absoluto la capa límite"], "ans": 0, "why": "PHAK: con ángulo de ataque bajo, la región de alta presión del borde de ataque mantiene el slat pegado al ala; al aumentar el ángulo de ataque (o por orden del piloto) el slat se desplaza hacia delante y abre una ranura que canaliza aire energizado sobre la superficie superior, retrasando el desprendimiento.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 19, "stem": "La ventaja clave de desplegar un spoiler de forma asimétrica (solo en un ala) para el control del alabeo, frente a usar únicamente los alerones, es que:", "opts": ["aumenta la sustentación en el ala en la que se despliega", "no requiere potencia hidráulica ni eléctrica", "elimina la guiñada adversa, ya que elevar el spoiler del ala que debe bajar destruye sustentación y añade resistencia en ese lado sin tendencia a guiñar en sentido contrario", "solo es utilizable por encima de Mach 0,8"], "ans": 2, "why": "PHAK: un spoiler asimétrico hace alabear la aeronave hacia el ala en la que se despliega (al destruir sustentación y añadir resistencia en ella) sin la tendencia a guiñar en sentido contrario que puede crear la deflexión diferencial de alerones, por lo que evita la guiñada adversa.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 20, "stem": "Según las cifras cuantitativas del PHAK sobre el efecto suelo, a una altura sobre el suelo igual a 1/10 de la envergadura, la resistencia inducida (a C_L constante) se reduce en torno a:", "opts": ["1,4 %", "47,6 %", "90 %", "23,5 %"], "ans": 1, "why": "El PHAK da tres reducciones de referencia de la resistencia inducida: 1,4 % a una altura igual a la envergadura completa, 23,5 % a 1/4 de envergadura y 47,6 % a 1/10 de envergadura; el efecto crece bruscamente solo muy cerca del suelo.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 21, "stem": "Las cifras independientes de SKYbrary sobre el efecto suelo indican que la «bonificación» adicional de sustentación cae a aproximadamente la mitad de su valor máximo a una altura sobre el suelo igual a:", "opts": ["el 10 % de la envergadura", "el 100 % de la envergadura", "el 50 % de la envergadura", "el 1 % de la envergadura"], "ans": 0, "why": "SKYbrary: la bonificación de sustentación se reduce a la mitad a una altura del 10 % de la envergadura, cae a una cuarta parte al 25 % de la envergadura y a cerca del 10 % de su máximo al 90 % de la envergadura, en coherencia con las cifras de resistencia inducida del PHAK, obtenidas de forma independiente.", "src": "SKYbrary, \"Ground Effect\"", "note": ""}, {"n": 22, "stem": "Inmediatamente después de que una aeronave sale del efecto suelo tras el despegue, y el piloto mantiene el mismo C_L que antes, el PHAK indica que la aeronave experimenta:", "opts": ["una disminución del ángulo de ataque necesario y una disminución de la resistencia inducida", "ningún cambio en el ángulo de ataque, la resistencia ni el empuje necesario", "solo una disminución del empuje necesario", "un aumento del ángulo de ataque necesario para mantener el mismo C_L, junto con un aumento de la resistencia inducida y del empuje necesario"], "ans": 3, "why": "PHAK: salir del efecto suelo exige un ángulo de ataque mayor para el mismo C_L, lo que aumenta la resistencia inducida y el empuje necesario; una aeronave que se puso en el aire «demasiado lenta» estando aún en efecto suelo puede volver a posarse en la pista durante el ascenso inicial.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 23, "stem": "La resistencia de interferencia, el tercer subtipo de resistencia parásita junto con la resistencia de forma y la resistencia por fricción, es:", "opts": ["la resistencia causada exclusivamente por las ondas de choque supersónicas", "la que se reduce aumentando el ángulo con el que se cruzan dos superficies", "la resistencia originada por la intersección de flujos de aire (por ejemplo, en la unión ala-fuselaje), que es máxima cuando dos superficies se encuentran en ángulo recto y se reduce con carenados", "significativa únicamente por encima de Mach 1"], "ans": 2, "why": "PHAK: la resistencia de interferencia aparece donde se encuentran los flujos de aire alrededor de distintas partes de la estructura y crean remolinos o turbulencia por encima de lo que produciría cada superficie por separado; es máxima en las uniones en ángulo recto y se minimiza con carenados aerodinámicos.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 24, "stem": "El ejemplo del PHAK sobre la resistencia de interferencia indica que un caza a reacción que lleva dos depósitos externos de combustible idénticos en las alas tiene:", "opts": ["exactamente la misma resistencia total que si llevara un solo depósito", "más resistencia total que el doble de la resistencia de un único depósito por sí solo, debido a la interferencia entre los campos de flujo de los dos depósitos", "menos resistencia total que con un solo depósito, porque los depósitos se anulan mutuamente la estela", "una resistencia inducida reducida en comparación con un ala limpia"], "ans": 1, "why": "Ejemplo citado por el PHAK: los campos de flujo de los dos depósitos interactúan y añaden resistencia de interferencia a la propia de cada depósito, de modo que la resistencia total supera el simple doble de la de un depósito.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 25, "stem": "El mecanismo físico de la resistencia inducida, según el PHAK, es que:", "opts": ["el downwash inclina hacia abajo el viento relativo local y, como la sustentación es perpendicular al viento relativo local, el vector de sustentación se inclina hacia atrás; esa componente de la sustentación inclinada hacia atrás es la resistencia inducida", "la resistencia inducida se debe por completo a la fricción superficial en la superficie inferior del ala", "la resistencia inducida solo existe por encima del Mach crítico", "la resistencia inducida es independiente del ángulo de ataque"], "ans": 0, "why": "Los torbellinos de punta de ala producen un downwash detrás del borde de salida; como la sustentación sigue siendo perpendicular al viento relativo local (inclinado por el downwash), el vector de sustentación real se inclina ligeramente hacia atrás y esa componente trasera es la resistencia inducida, que aumenta con el ángulo de ataque.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 26, "stem": "La resistencia inducida varía con la velocidad del aire de la siguiente manera:", "opts": ["es directamente proporcional a la velocidad", "es directamente proporcional al cuadrado de la velocidad", "no depende en absoluto de la velocidad", "es inversamente proporcional al cuadrado de la velocidad, por lo que domina la resistencia total a baja velocidad"], "ans": 3, "why": "PHAK: la resistencia inducida disminuye al aumentar la velocidad (inversamente con V^2), por lo que domina cerca de la pérdida y a baja velocidad, al contrario que la resistencia parásita, que crece con la velocidad.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 27, "stem": "En la curva de potencia necesaria para el vuelo nivelado, el ajuste de potencia necesario a una velocidad muy baja, cerca de la pérdida, es:", "opts": ["cero, ya que la sustentación se genera solo con el ángulo de ataque", "el mínimo absoluto de toda la envolvente de vuelo", "alto, porque el gran ángulo de ataque necesario produce una gran resistencia inducida", "idéntico a la potencia necesaria en L/D_MAX"], "ans": 2, "why": "PHAK: cerca de la pérdida, el alto ángulo de ataque requerido genera una gran resistencia inducida, por lo que se necesita un ajuste de potencia alto para sostener el vuelo nivelado; el punto de potencia mínima está cerca de L/D_MAX, no cerca de la pérdida.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 28, "stem": "En la «región de mando invertido» (el régimen de baja velocidad entre la velocidad de máxima autonomía y la pérdida), ¿cuál de las siguientes afirmaciones es cierta?", "opts": ["Una velocidad menor requiere un ajuste de potencia mayor para mantener la altitud, lo contrario de la intuición del mando normal", "Una velocidad menor requiere un ajuste de potencia menor, como en vuelo normal", "El ajuste de potencia no tiene efecto sobre la velocidad en este régimen", "Este régimen solo existe por encima del Mach crítico"], "ans": 0, "why": "PHAK: en la región de mando invertido, reducir la velocidad exige más potencia (no menos) para mantener la altitud; es la base de que «ir lento y bajo» sea peligroso en la aproximación, y de que levantar el morro sin añadir potencia pueda empeorar el régimen de descenso.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 29, "stem": "La velocidad en el punto más bajo de la curva de potencia necesaria, donde la menor potencia sostiene el vuelo nivelado, se denomina:", "opts": ["VA, la velocidad de diseño de maniobra", "la velocidad de máxima autonomía (best endurance), utilizada para el máximo tiempo de espera o de vuelo en circuito de espera", "VMO, la velocidad máxima de operación", "la mejor velocidad de planeo"], "ans": 1, "why": "El PHAK distingue la velocidad de máxima autonomía (punto de potencia mínima, máximo tiempo en el aire) de la velocidad de máximo alcance o de mejor planeo (cerca de L/D_MAX, máxima distancia); son dos velocidades distintas de la misma curva.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 30, "stem": "En cuanto a la estabilidad estática y dinámica, el marco del PHAK implica que una aeronave puede tener:", "opts": ["estabilidad dinámica positiva pero ninguna estabilidad estática, ya que ambas son idénticas", "solo combinaciones positivo-positivo o negativo-negativo, ya que la estabilidad estática y la dinámica siempre coinciden", "estabilidad estática negativa con estabilidad dinámica positiva, lo cual es aerodinámicamente imposible", "estabilidad estática positiva (inicialmente tiende a volver al equilibrio) junto con estabilidad dinámica negativa (la oscilación resultante crece con el tiempo)"], "ans": 3, "why": "El PHAK trata la estabilidad estática (tendencia inicial) y la dinámica (comportamiento a lo largo del tiempo) como propiedades independientes; una aeronave puede corregir al principio y que esa corrección se convierta en una oscilación creciente, un patrón clásico de distractor de examen.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 31, "stem": "Para la estabilidad longitudinal estática, el PHAK indica que los diseñadores suelen colocar el centro de gravedad de la aeronave cerca del:", "opts": ["20 % de la cuerda aerodinámica media (MAC)", "80 % de la cuerda aerodinámica media (MAC)", "borde de ataque del encastre del ala", "borde de salida del estabilizador horizontal"], "ans": 0, "why": "El PHAK da aproximadamente el 20 % de la MAC como posición típica del CG; la mayoría de las aeronaves son «pesadas de morro» (el centro de sustentación del ala queda por detrás del CG) y requieren una ligera fuerza hacia abajo en la cola horizontal para equilibrarse, una cifra que el manual de ENAIRE no da en absoluto.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 32, "stem": "La estabilidad direccional respecto al eje vertical se consigue principalmente mediante:", "opts": ["el ángulo de diedro del ala por sí solo", "la colocación de los motores respecto al eje del fuselaje", "la deriva vertical más el área lateral del fuselaje por detrás del CG, que debe superar el área lateral por delante del CG", "el tab de compensación del timón de profundidad"], "ans": 2, "why": "El PHAK lo compara con una veleta o con la pluma de una flecha: la deriva vertical y el área lateral del fuselaje trasero deben dominar sobre el área lateral delantera para que un derrape genere un momento de guiñada restaurador.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 33, "stem": "El balanceo holandés (Dutch roll) se describe mejor como:", "opts": ["una espiral descendente lenta y divergente causada por una débil estabilidad de diedro", "una oscilación acoplada lateral-direccional (el morro dibuja un ocho en el horizonte), normalmente estable dinámicamente pero poco seguro por su carácter oscilatorio, que suele contrarrestarse con un amortiguador de guiñada (yaw damper)", "una oscilación solo de cabeceo que intercambia velocidad por altitud", "una oscilación que solo se produce por debajo de la velocidad de pérdida"], "ans": 1, "why": "PHAK: el balanceo holandés acopla alabeo y guiñada en desfase; normalmente está amortiguado, pero es oscilatorio e incómodo o inseguro, por lo que las aeronaves de ala en flecha propensas a él llevan amortiguadores de guiñada. Es un modo de fallo distinto de la inestabilidad espiral.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 34, "stem": "La inestabilidad espiral se desarrolla cuando:", "opts": ["la estabilidad de diedro (lateral) es muy fuerte en comparación con la estabilidad direccional", "una aeronave no tiene deriva vertical", "el balanceo holandés se amortigua por completo", "la estabilidad direccional es muy fuerte en comparación con el diedro (estabilidad lateral), de modo que un derrape provocado por una ráfaga hace guiñar el morro hacia el viento más deprisa de lo que el débil diedro puede nivelar las alas, produciendo una espiral con sobreinclinación cada vez más cerrada"], "ans": 3, "why": "PHAK: la inestabilidad espiral es un desajuste en el que una fuerte estabilidad direccional domina sobre una débil estabilidad lateral; el ala exterior del viraje resultante genera más sustentación, con lo que el alabeo y el descenso se acentúan si no se corrigen.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 35, "stem": "Respecto al equilibrio entre las tendencias al balanceo holandés y a la inestabilidad espiral, el PHAK señala que:", "opts": ["los fabricantes aceptan deliberadamente cierta tendencia al balanceo holandés, porque su divergencia es oscilatoria y manejable, mientras que la recuperación incorrecta de una inestabilidad espiral (tirar hacia atrás en lugar de nivelar las alas) ha contribuido probablemente a más víctimas mortales de la aviación general que cualquier otro factor por sí solo", "siempre se prefiere eliminar por completo la inestabilidad espiral, y el balanceo holandés nunca se tolera", "ambos fenómenos son igualmente raros e igualmente peligrosos", "el balanceo holandés solo se da en aeronaves de hélice, nunca en reactores"], "ans": 0, "why": "El PHAK plantea explícitamente este equilibrio: los diseñadores aceptan cierto grado de tendencia al balanceo holandés (corregible con un amortiguador de guiñada) antes que la inestabilidad espiral, porque el manejo incorrecto de la inestabilidad espiral (tirar hacia atrás en lugar de nivelar las alas) ha sido un factor importante de víctimas mortales en la aviación general.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 36, "stem": "El peligro de la «pérdida profunda» (deep stall) asociado a las aeronaves de transporte con cola en T se produce porque:", "opts": ["el timón de profundidad está montado por debajo de la estela del ala con cualquier ángulo de ataque", "las colas en T no pueden equiparse con un stick shaker", "con un ángulo de ataque muy alto y un CG retrasado, la estela del ala puede envolver la cola en T, reduciendo gravemente o eliminando la eficacia del timón de profundidad y dificultando la recuperación de la pérdida", "las aeronaves con cola en T entran siempre en pérdida con un ángulo de ataque menor que las de cola convencional"], "ans": 2, "why": "PHAK: como la cola en T está situada en alto, con un ángulo de ataque muy alto (CG retrasado) la estela turbulenta del ala puede envolverla y reducir la autoridad del timón de profundidad; el PHAK señala que este riesgo es mayor en las aeronaves de transporte con cola en T que en las ligeras de aviación general.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 37, "stem": "La diferencia clave entre una configuración canard y una configuración convencional de cola trasera es que:", "opts": ["el canard solo se utiliza en planeadores", "el canard produce sustentación y mantiene el morro arriba, mientras que una cola convencional empuja la cola hacia abajo para equilibrar la aeronave, de modo que la sustentación del canard ayuda teóricamente a sostener el peso de la aeronave en lugar de restarle", "el canard elimina la necesidad de alerones", "una cola convencional produce siempre más sustentación total que un canard"], "ans": 1, "why": "El PHAK contrapone ambas: una cola convencional suele producir una fuerza hacia abajo para equilibrar un diseño pesado de morro, restando sustentación total, mientras que una superficie canard delantera aporta sustentación en el mismo sentido que el ala.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 38, "stem": "Según CS 25.337(b), el factor de carga límite positivo de maniobra de un avión de transporte CS-25 debe ser:", "opts": ["exactamente 3,8 en todos los casos, sin fórmula", "no inferior a 1,0 y no necesita exceder de 2,5", "determinado únicamente a discreción del piloto en vuelo", "no inferior a 2,5 y no necesita exceder de 3,8, con el valor exacto dado por n = 2.1 + 24000/(W+10000), con W en libras"], "ans": 3, "why": "CS 25.337(b) fija un mínimo de 2,5 g y un máximo de 3,8 g para el factor de carga límite positivo, calculado a partir de la masa máxima de despegue mediante la fórmula indicada; CS 25.337(c) exige por separado que el factor de carga límite negativo no sea inferior a -1,0 hasta VC.", "src": "EASA CS-25 Amendment 28, CS 25.337", "note": ""}, {"n": 39, "stem": "El «factor de seguridad» que se aplica sobre la carga límite de una aeronave para obtener su carga última, según el PHAK, es:", "opts": ["1,5", "3,0", "1,0 (la carga límite y la última son la misma)", "0,5"], "ans": 0, "why": "PHAK: se aplica un factor de seguridad de 1,5 a la carga límite para determinar la carga última, a la cual se espera el fallo estructural; se acepta cierta deformación entre la carga límite y la última, pero no por debajo de la carga límite en operación normal.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 40, "stem": "En un viraje coordinado a altitud constante, el factor de carga con 80 grados de alabeo (n = 1/cos(alabeo)) es aproximadamente:", "opts": ["2,0 g", "1,4 g", "5,76 g", "3,8 g"], "ans": 2, "why": "n = 1/cos(80 grados) = 1/0,1736 ≈ 5,76 g, frente a n = 2,0 g con 60 grados de alabeo (cifras de referencia del propio PHAK), lo que muestra la rapidez con que aumenta el factor de carga a partir de 45-50 grados.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 41, "stem": "Formalmente, según CS 25.335(c), la velocidad de diseño de maniobra VA debe cumplir:", "opts": ["VA = VC exactamente, por definición", "VA no debe ser inferior a VS1 multiplicada por la raíz cuadrada de n (n = factor de carga límite positivo a VC)", "VA debe ser siempre igual a 1,7 veces la velocidad de pérdida en todas las aeronaves certificadas", "VA no tiene ninguna relación matemática definida con la velocidad de pérdida"], "ans": 1, "why": "CS 25.335(c) vincula formalmente VA con la velocidad de pérdida con flaps arriba VS1 y con el factor de carga límite positivo de maniobra n; el «1,7 x velocidad de pérdida» del PHAK es solo una regla práctica para aeronaves antiguas de aviación general sin VA publicada, no la relación formal de certificación.", "src": "EASA CS-25 Amendment 28, CS 25.335", "note": ""}, {"n": 42, "stem": "La VA (velocidad de diseño de maniobra) protege la estructura de la aeronave frente a daños por:", "opts": ["cualquier número de entradas completas de mando en cualquier número de ejes, simultáneamente, en turbulencia", "el vuelo sostenido por encima de VNE únicamente", "una única entrada de deflexión completa en un solo eje, una sola vez, en aire en calma; NO protege frente a varias entradas completas ni frente a entradas en ejes combinados", "cargas de ráfaga que excedan VB únicamente"], "ans": 2, "why": "El PHAK es explícito: VA cubre un mando, una deflexión completa, una vez, un eje, en aire en calma; un error común es tratarla como un margen de seguridad absoluto frente a cualquier combinación de entradas de mando, y no lo es.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 43, "stem": "El diagrama V-n (envolvente de maniobra) de un avión CS-25, según CS 25.333(b), utiliza para definir su contorno el siguiente conjunto de velocidades de diseño:", "opts": ["VS (pérdida), VA (maniobra), VC (crucero de diseño) y VD (picado de diseño)", "solo V1, VR y V2", "solo VMO y MMO", "solo VX y VY"], "ans": 0, "why": "CS 25.333(b)/25.335 definen el contorno de la envolvente V-n con VS, VA, VC y VD; la estructura debe ser adecuada en toda combinación de velocidad y factor de carga situada sobre esta envolvente o dentro de ella (CS 25.333(a)). V1/VR/V2 son velocidades de despegue; VMO/MMO y VX/VY son conjuntos de velocidades no relacionados.", "src": "EASA CS-25 Amendment 28, CS 25.333/25.335", "note": ""}, {"n": 44, "stem": "Para mostrar el margen entre VC/MC y VD/MD, el AMC 25.335(b)(2) supone una ráfaga horizontal de frente cuya velocidad, hasta 20 000 ft, es de:", "opts": ["50 m/s (164 ft/s) EAS", "25,2 m/s (82,7 ft/s) TAS", "15,2 m/s (50 ft/s) EAS, reduciéndose linealmente hasta 7,6 m/s (25 ft/s) EAS a 50 000 ft", "sin especificar; las cargas de ráfaga se dejan al criterio del piloto"], "ans": 2, "why": "El AMC 25.335(b)(2) (margen de VC/MC a VD/MD) especifica una ráfaga horizontal sustancialmente de frente de 15,2 m/s (50 fps) EAS hasta 20 000 ft, decreciente linealmente hasta 7,6 m/s (25 fps) EAS a 50 000 ft y constante por encima. El enunciado anterior la llamaba «ráfaga vertical discreta de referencia» para el diseño estructural, lo cual es erróneo; las ráfagas verticales de diseño de CS 25.341 son de 17,07 m/s (56 ft/s) a nivel del mar y son distintas.", "src": "EASA CS-25 Amendment 28, AMC 25.335(b)(2)", "note": ""}, {"n": 45, "stem": "Según las bandas numéricas de régimen de velocidad del PHAK, el vuelo transónico se define como:", "opts": ["de Mach 1,20 a 5,00", "de Mach 0,75 a 1,20", "de Mach 0,30 a 0,75", "por encima de Mach 5,00"], "ans": 1, "why": "PHAK: subsónico es por debajo de Mach 0,75, transónico de 0,75 a 1,20, supersónico de 1,20 a 5,00 e hipersónico por encima de Mach 5,00; los reactores civiles suelen crucear entre Mach 0,70 y 0,90, cerca del límite subsónico/transónico.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 46, "stem": "El Mach crítico de una aeronave se define como:", "opts": ["el número de Mach máximo de operación de la aeronave, MMO", "el número de Mach al que falla por primera vez la estructura de la aeronave", "la velocidad del sonido a la temperatura estándar del nivel del mar", "el menor número de Mach (subsónico) al que el flujo local sobre alguna parte de la estructura alcanza por primera vez, sin superarlo, Mach 1,0"], "ans": 3, "why": "SKYbrary/PHAK: el Mach crítico se alcanza mientras la propia aeronave aún vuela en régimen subsónico, cuando la aceleración local del flujo sobre la zona de máxima curvatura toca por primera vez Mach 1,0; más allá aparecen ondas de choque, bataneo y dificultades de control.", "src": "SKYbrary, \"Critical Mach Number\"; FAA PHAK 8083-25C", "note": ""}, {"n": 47, "stem": "El «número de Mach de divergencia de fuerzas», el punto en el que el coeficiente de resistencia sube bruscamente, se sitúa típicamente, según el PHAK:", "opts": ["un 5-10 % por encima del Mach crítico", "exactamente en el Mach crítico, sin diferencia entre ambos", "un 50 % por encima del Mach crítico", "siempre exactamente en Mach 1,0, sea cual sea la aeronave"], "ans": 0, "why": "El PHAK sitúa la divergencia de fuerzas con un pequeño margen (5-10 %) por encima del Mach crítico; la flecha retrasa ambos números y suaviza los cambios de resistencia, sustentación y momento de cabeceo que se producen en la divergencia de la resistencia.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 48, "stem": "El «Mach tuck» (tuck-under) es la tendencia de una aeronave, al aumentar la velocidad hacia el Mach crítico y más allá, a cabecear:", "opts": ["hacia arriba, porque el centro de presión se desplaza hacia delante", "ni hacia arriba ni hacia abajo; el Mach tuck es un efecto puramente lateral (de alabeo)", "hacia abajo, al desplazarse hacia atrás la onda de choque de la superficie superior del ala y, con ella, el centro de presión", "hacia abajo solo por debajo del Mach crítico, nunca por encima"], "ans": 2, "why": "SKYbrary/PHAK: al desplazarse hacia atrás la onda de choque de la superficie superior con el aumento de velocidad, el centro de presión se desplaza también hacia atrás y crea un momento de cabeceo a picar; si no se controla, la autoridad del timón de profundidad puede resultar insuficiente y provocar un picado irrecuperable.", "src": "SKYbrary, \"Mach Tuck\"; FAA PHAK 8083-25C", "note": ""}, {"n": 49, "stem": "A diferencia de un ala recta (que suele entrar en pérdida primero por el encastre), un ala en flecha tiende a entrar en pérdida primero por:", "opts": ["el borde de ataque del fuselaje", "las puntas del ala, lo que, al estar las puntas por detrás del centro de sustentación del ala, desplaza el centro de sustentación hacia delante y produce un momento de cabeceo a subir que puede agravar la pérdida", "el encastre del ala, exactamente igual que un ala recta", "el estabilizador horizontal, no el ala en absoluto"], "ans": 1, "why": "PHAK: la pérdida de punta de un ala en flecha desplaza el centro de sustentación hacia delante y levanta aún más el morro (empeorando la pérdida), la tendencia opuesta a la pérdida de encastre primero de un ala recta; el peligro se agrava en las aeronaves de cola en T, que reciben poco bataneo de aviso antes de la pérdida.", "src": "FAA PHAK 8083-25C, cap. 5", "note": ""}, {"n": 50, "stem": "La «regla del área» (area rule), desarrollada por Richard T. Whitcomb en el NASA Langley a comienzos de la década de 1950, establece que la resistencia transónica y supersónica mínima se obtiene cuando:", "opts": ["la envergadura se reduce al mínimo, con independencia de la forma del fuselaje", "los motores de la aeronave se montan lo más adelante posible", "la sección transversal del fuselaje es constante a lo largo de toda su longitud", "el área transversal total de la aeronave, representada a lo largo del eje longitudinal, forma una curva suave sin cambios bruscos, como en el fuselaje con «cintura de botella de cola» del Convair F-102A"], "ans": 3, "why": "NASA SP-367: el F-102A no pudo alcanzar la velocidad supersónica hasta que un fuselaje estrechado y abultado suavizó la curva de área transversal total en la unión de las alas con el fuselaje, lo que le permitió entrar en servicio supersónico; una sección transversal constante (C) no es lo que exige la regla del área.", "src": "NASA SP-367", "note": ""}, {"n": 51, "stem": "Sobre el coffin corner, SKYbrary añade un detalle operativo que el manual no menciona: en un viraje realizado cerca del coffin corner,", "opts": ["ambas alas se ralentizan a la vez, de modo que solo puede sobrepasarse el límite de pérdida a baja velocidad", "el ala interior se ralentiza mientras el ala exterior se acelera, de modo que el propio viraje (no solo la turbulencia) puede sobrepasar a la vez los límites de baja y de alta velocidad", "el viraje no tiene efecto sobre ninguno de los dos límites de velocidad", "solo puede verse afectado el límite de alta velocidad (bataneo por Mach)"], "ans": 1, "why": "SKYbrary: cerca del coffin corner, la diferencia de velocidad entre el ala interior (más lenta) y la exterior (más rápida) en un viraje puede llevar a la aeronave a cruzar a la vez el límite de pérdida y el límite de bataneo de alta velocidad o MMO, incluso sin turbulencia alguna.", "src": "SKYbrary, \"Coffin Corner\"", "note": ""}, {"n": 52, "stem": "Según el esquema de estela turbulenta RECAT-EU, ¿cuántas categorías de aeronaves se definen y cuál es la categoría del Airbus A380?", "opts": ["Tres categorías; el A380 es Pesada (Heavy)", "Cuatro categorías; el A380 es Media (Medium)", "Seis categorías (de Super Pesada A a Ligera F); el A380 es Super Pesada (Super Heavy, categoría A)", "Seis categorías; el A380 es Pesada superior (Upper Heavy, categoría B)"], "ans": 2, "why": "RECAT-EU divide el antiguo esquema OACI de 3 categorías en seis: Super Pesada (A, A380), Pesada superior (B), Pesada inferior (C), Media superior (D), Media inferior (E) y Ligera (F), más fino que el esquema heredado de 3 categorías (+A380).", "src": "EUROCONTROL RECAT-EU 2015, Edition 2.0", "note": ""}, {"n": 53, "stem": "Según las categorías de estela turbulenta heredadas de la OACI (tal como las cita el documento RECAT-EU de EUROCONTROL), una aeronave se clasifica como «Pesada» (Heavy) cuando su masa máxima de despegue (MTOM) es:", "opts": ["de 7000 kg o más", "de 136 000 kg o más", "de entre 7000 kg y 20 000 kg", "inferior a 7000 kg"], "ans": 1, "why": "OACI heredada: Pesada es MTOM ≥ 136 000 kg, Media es 7000 kg ≤ MTOM &lt; 136 000 kg y Ligera es MTOM &lt; 7000 kg; cifras confirmadas aquí con la propia cita que EUROCONTROL hace del Doc 4444 de la OACI, con lo que una cifra antes señalada como procedente de un resumen de Wikipedia pasa a.", "src": "EUROCONTROL RECAT-EU 2015 (quoting ICAO/PANS-ATM legacy scheme)", "note": ""}, {"n": 54, "stem": "Según RECAT-EU, la separación mínima basada en distancia para un líder Super Pesada (categoría A) seguido de una aeronave Ligera (categoría F) es de:", "opts": ["3 NM", "6 NM", "5 NM", "8 NM"], "ans": 3, "why": "La matriz de separaciones de RECAT-EU da 8 NM de Super Pesada (A) a Ligera (F), el valor mayor de la matriz (el menor, 3 NM, corresponde a pares de la misma categoría F o de Super Pesada a Super Pesada).", "src": "EUROCONTROL RECAT-EU 2015, Edition 2.0", "note": ""}, {"n": 55, "stem": "Ejemplo resuelto: al nivel del mar ISA (ρ = 1,225 kg/m3), una aeronave vuela a V = 60 m/s con una superficie alar S = 20 m2 y C_L = 0,6. La presión dinámica q y la sustentación L resultantes son aproximadamente:", "opts": ["q = 2205 Pa y L = 26 460 N", "q = 1225 Pa y L = 14 700 N", "q = 4410 Pa y L = 52 920 N", "q = 2205 Pa y L = 13 230 N"], "ans": 0, "why": "q = 0,5 * ρ * V^2 = 0,5 * 1,225 * 60^2 = 2205 Pa; L = C_L * q * S = 0,6 * 2205 * 20 = 26 460 N (unos 2698 kgf). La opción D usa la q correcta pero divide L por dos de forma errónea; B y C usan valores incorrectos de la presión dinámica.", "src": "derivado y comprobado dos veces, según <code>syllabus/ext/T09a-aerodynamics.md</code> §12</p>\n<h2>Notas sobre este banco</h2>\n<ul>\n<li>55 preguntas, con las claves repartidas así: A=15 (27 %), B=14 (25 %), C=13 (24 %), D=13 (24 %), dentro de la banda exigida del 10-40 % por letra.</li>\n<li>Ninguna pregunta duplica un hecho ya evaluado en <code>questions/t09-test.md</code> o <code>questions/manual/OM09-test.md</code> (comprobado buscando en ambos ficheros las palabras clave pertinentes —efecto suelo, coffin corner, Mach crítico, RECAT, VA, capa límite, CS-25, etc.— antes de redactar); donde el mismo tema general aparece en <code>OM09-test.md</code> (efecto suelo, coffin corner, Mach crítico), las preguntas de aquí evalúan hechos distintos y más específicos (curvas cuantitativas de decaimiento del PHAK y de SKYbrary, el mecanismo del coffin corner en viraje, la definición formal de Mach 1 local) en lugar de la redacción más simple del propio manual.</li>\n<li>Solo se incluyen hechos leídos en texto completo () o derivados y comprobados dos veces (); nada de lo que aparece aquí se apoya en un resumen de búsqueda () ni en memoria no verificada ().</li>\n</ul>", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/09-aerodinamica-mecanica/ampliacion/T09a-
