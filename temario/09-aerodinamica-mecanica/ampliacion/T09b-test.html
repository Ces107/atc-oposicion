c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Aerodinámica y mecánica del vuelo</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Mecánica de vuelo, sistemas de la aeronave y actuaciones (performance) (T09b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "La VS0, tal como se marca en un anemómetro, es:", "opts": ["La velocidad de pérdida / velocidad mínima de vuelo estable en configuración de aterrizaje", "La velocidad máxima con los flaps extendidos", "La velocidad que nunca debe excederse", "La velocidad de diseño de maniobra"], "ans": 0, "why": "La VS0 es la velocidad de pérdida sin potencia (power-off) al peso máximo de aterrizaje, con tren y flaps abajo; marca el extremo inferior del arco blanco del anemómetro (ASI). B, C y D son VFE, VNE y VA, respectivamente.", "src": "FAA PHAK 8083-25C ch. 8, \"Airspeed Indicator Markings\"", "note": ""}, {"n": 2, "stem": "Según CS 25.107(d), la velocidad mínima de despegue (VLOF) con todos los motores operativos debe ser al menos:", "opts": ["el 100 % de VMU", "el 110 % de VMU", "el 120 % de VMU", "el 90 % de VMU"], "ans": 1, "why": "CS 25.107(d) exige VLOF &gt;= 110 % de VMU con todos los motores operativos (108 % si la actitud de VMU está limitada por la geometría); con un motor inoperativo el margen baja al 105 %/104 %.", "src": "EASA CS-25 Amendment 28, CS 25.107(d)", "note": ""}, {"n": 3, "stem": "La distancia de despegue disponible (TODA) se define como:", "opts": ["La longitud de pista menos la zona de parada", "El recorrido de despegue disponible (TORA) menos el clearway", "El recorrido de despegue disponible (TORA) más el clearway, si existe", "La distancia de aceleración-parada menos un 15 %"], "ans": 2, "why": "JAR-OPS 1.480(a)(7): TODA = el recorrido de despegue disponible (TORA) más la longitud del clearway, si se ha declarado disponible. B invierte el signo; A y D no son las definiciones certificadas.", "src": "Airbus Getting to Grips with Aircraft Performance (GTG) §3.2.2", "note": ""}, {"n": 4, "stem": "La distancia de aceleración-parada disponible (ASDA) se define como:", "opts": ["El TORA más el clearway", "La distancia de aterrizaje disponible menos el umbral desplazado", "Solo la longitud de pista, sin ampliaciones", "El TORA más la zona de parada (stopway), si existe"], "ans": 3, "why": "JAR-OPS 1.480(a)(1): ASDA = TORA más la longitud de la zona de parada, si se ha declarado disponible y con capacidad portante. A describe la TODA, no la ASDA.", "src": "GTG §3.2.3", "note": ""}, {"n": 5, "stem": "La pendiente ascendente máxima permitida para el plano de un clearway es:", "opts": ["1,25 %", "2 %", "5 %", "0,8 %"], "ans": 0, "why": "Las definiciones JAR/FAR exigen que el plano del clearway ascienda como máximo un 1,25 % desde el final de la pista. El 2 % es el plano de franqueamiento de obstáculos que se usa para un umbral de aterrizaje desplazado; el 0,8 % es la penalización de gradiente de despegue de un bimotor.", "src": "GTG §3.2.2", "note": ""}, {"n": 6, "stem": "Para que una zona de parada (stopway) pueda usarse en los cálculos de la distancia de aceleración-parada, debe:", "opts": ["Estar libre de todo obstáculo, pero no es necesario que soporte el peso de la aeronave", "Tener al menos la misma anchura que la pista y poder soportar el peso de la aeronave sin daños estructurales", "Existir solo como una prolongación pavimentada utilizable para el ascenso", "Tener al menos 1000 m de longitud en todos los casos"], "ans": 1, "why": "Una zona de parada debe tener al menos la anchura de la pista, estar centrada en su eje prolongado y poder soportar el peso de la aeronave durante un despegue interrumpido sin daños estructurales; es el perfil de requisitos opuesto al de un clearway (que no necesita soportar peso, pero sí estar libre de obstáculos).", "src": "GTG §3.2.3", "note": ""}, {"n": 7, "stem": "Sin ningún obstáculo bajo la trayectoria de aproximación, la distancia de aterrizaje disponible (LDA) es igual a:", "opts": ["El TORA más la zona de parada", "La distancia de aceleración-parada", "El TORA (la zona de parada nunca puede contarse para el aterrizaje)", "La TODA menos el clearway"], "ans": 2, "why": "GTG §2.1: cuando no hay ningún obstáculo en el embudo de aproximación, la LDA es la longitud de pista (TORA); la zona de parada, aunque exista, nunca se incluye en el cálculo de la distancia de aterrizaje.", "src": "GTG §2.1", "note": ""}, {"n": 8, "stem": "Cuando un obstáculo penetra en el embudo de aproximación, el umbral desplazado para el aterrizaje se establece mediante:", "opts": ["Un plano del 5 % y un margen de 100 m", "Un plano del 1,25 % y un margen de 152 m", "Un plano del 15 % y ningún margen", "Un plano del 2 % tangente al obstáculo, más un margen de 60 m"], "ans": 3, "why": "GTG §2.2: el umbral desplazado se define mediante un plano del 2 % tangente al obstáculo más penalizante, más un margen de 60 m; la LDA va entonces desde el umbral desplazado hasta el final de la pista.", "src": "GTG §2.2", "note": ""}, {"n": 9, "stem": "La penalización obligatoria de gradiente de despegue que se resta de la trayectoria de vuelo bruta para obtener la trayectoria neta, en un avión bimotor, es:", "opts": ["1,25 %", "0,5 %", "0,8 %", "2,0 %"], "ans": 2, "why": "CS/JAR 25.115(b): la trayectoria neta de despegue es la trayectoria bruta reducida en cada punto un 0,8 % para los aviones bimotores (1,0 % para los cuatrimotores).", "src": "GTG §4.2.1, quoting CS/JAR 25.115", "note": ""}, {"n": 10, "stem": "La penalización obligatoria de gradiente de despegue para un avión cuatrimotor es:", "opts": ["0,8 %", "1,0 %", "1,25 %", "1,5 %"], "ans": 1, "why": "CS/JAR 25.115(b) fija la penalización en el 1,0 % para los aviones cuatrimotores, frente al 0,8 % de los bimotores.", "src": "GTG §4.2.1", "note": ""}, {"n": 11, "stem": "El ángulo de alabeo máximo permitido por debajo de 200 ft durante un viraje de evitación de obstáculos (procedimiento estándar) es:", "opts": ["30 grados", "25 grados", "15 grados", "45 grados"], "ans": 2, "why": "GTG Tabla C6 (citando FAR 121.189(f)): el alabeo máximo es de 15 grados por debajo de 200 ft con el procedimiento estándar, y sube a 25 grados (30 con aprobación específica) por encima de 400 ft.", "src": "GTG Table C6", "note": ""}, {"n": 12, "stem": "Con el esquema heredado de ascenso escalonado (step climb) previo al RVSM, los escalones de altitud de crucero son de:", "opts": ["1000 ft en todo el rango", "4000 ft por debajo de FL290 y 2000 ft por encima", "500 ft en todo el rango", "2000 ft por debajo de FL290 y 4000 ft por encima de FL290"], "ans": 3, "why": "GTG §3.4 y Figura F26: la separación vertical heredada da escalones de 2000 ft por debajo de FL290 y de 4000 ft por encima, reflejo del cambio de los mínimos de separación vertical en FL290.", "src": "GTG §3.4", "note": ""}, {"n": 13, "stem": "En un entorno RVSM, un ascenso escalonado suele aumentar la altitud de crucero en:", "opts": ["4000 ft", "500 ft", "1000 ft", "2000 ft"], "ans": 3, "why": "El RVSM da una separación vertical de 1000 ft hasta FL410, de modo que un escalón (que debe saltarse un nivel para mantener la separación con el resto del tráfico RVSM) es en la práctica de 2000 ft en toda la banda RVSM.", "src": "GTG §3.4", "note": ""}, {"n": 14, "stem": "Un índice de costes (Cost Index, CI) igual a cero, introducido en el FMS, significa que la aeronave volará:", "opts": ["A la velocidad máxima, sin importar el consumo de combustible", "Con el consumo mínimo de combustible, a costa del tiempo de vuelo (cerca de la velocidad de máximo alcance)", "A un número de Mach fijo, sin importar el peso", "Con el tiempo mínimo, sin importar el consumo de combustible"], "ans": 1, "why": "El CI expresa la relación entre el coste del tiempo y el coste del combustible; con CI = 0 solo cuenta el coste del combustible, lo que da un perfil de crucero lento que minimiza el combustible. Un CI alto hace lo contrario (rápido, más combustible quemado, hasta VMO/MMO).", "src": "GTG, Cost Index definition", "note": ""}, {"n": 15, "stem": "La relación de derivación (bypass ratio) de un turbofán se define como:", "opts": ["El diámetro del fan dividido por el diámetro del núcleo", "El empuje dividido por el peso", "El flujo másico de aire que atraviesa el fan dividido por el flujo másico de aire que atraviesa el núcleo del motor", "El consumo de combustible dividido por el empuje"], "ans": 2, "why": "El PHAK, cap. 7, da esta definición exacta; un distractor verosímil pero erróneo es confundir la relación de derivación con una relación de tamaños físicos (diámetro del fan frente al del núcleo) en lugar de una relación de flujos másicos de aire.", "src": "FAA PHAK 8083-25C ch. 7, \"Turbofan\"", "note": ""}, {"n": 16, "stem": "Un turbohélice alcanza normalmente su consumo específico mínimo de combustible:", "opts": ["Solo al nivel del mar", "Entre 25 000 ft y la tropopausa", "Solo por debajo de 10 000 ft", "Solo en el circuito de tránsito"], "ans": 1, "why": "PHAK: los turbohélices son más eficientes entre 250-400 mph y 18 000-30 000 ft, con el consumo específico mínimo normalmente disponible desde 25 000 ft hasta la tropopausa; un error común es creer que los turbohélices son intrínsecamente «bajos y lentos».", "src": "FAA PHAK 8083-25C ch. 7, \"Turboprop\"", "note": ""}, {"n": 17, "stem": "Un turboeje (turboshaft) se diferencia de un turborreactor principalmente en que:", "opts": ["No tiene sección de compresor", "La mayor parte de la energía de los gases en expansión acciona un eje en lugar de producir empuje; se utiliza en la mayoría de los helicópteros", "No puede utilizar combustible para reactores", "No tiene sección de turbina"], "ans": 1, "why": "PHAK cap. 7: en un turboeje, la mayor parte de la energía producida por los gases en expansión acciona una turbina y un eje en lugar de producir empuje directamente; los helicópteros suelen utilizar motores turboeje.", "src": "FAA PHAK 8083-25C ch. 7, \"Turboshaft\"", "note": ""}, {"n": 18, "stem": "¿Qué significa FADEC y cuál es su función principal?", "opts": ["Fuel And Detonation Engine Control; solo gestiona la selección del grado de combustible", "Full Authority Digital Engine Control (control digital del motor con plena autoridad); un computador digital que controla los parámetros del motor (y en ocasiones de la hélice), con redundancia de doble canal", "Forward Air Data Engine Computer; se utiliza solo para la calibración de la velocidad", "Flight Auto-Deploy Emergency Circuit; se utiliza solo en emergencias"], "ans": 1, "why": "El FADEC es un sistema de control del motor (y de la hélice, cuando la hay) basado en un computador digital, utilizado primero en motores de turbina y cada vez más en motores de pistón; como su fallo puede suponer la pérdida total de empuje, dos canales digitales independientes proporcionan redundancia.", "src": "FAA PHAK 8083-25C ch. 7, \"Full Authority Digital Engine Control (FADEC)\"", "note": ""}, {"n": 19, "stem": "La detonación en un motor alternativo se debe con más frecuencia a:", "opts": ["Utilizar una mezcla aire-combustible demasiado rica solo al ralentí", "La baja humedad ambiente", "Un grado de combustible inferior al especificado, una presión de admisión excesiva a bajas rpm o una mezcla excesivamente pobre a alta potencia", "Volar por encima de 10 000 ft de altitud densidad"], "ans": 2, "why": "El PHAK enumera estas como las causas operativas habituales de la detonación (combustión explosiva incontrolada), que puede dañar rápidamente el pistón, el cilindro o las válvulas.", "src": "FAA PHAK 8083-25C ch. 7, \"Detonation\"", "note": ""}, {"n": 20, "stem": "La formación de hielo en el carburador puede producirse:", "opts": ["Solo cuando la temperatura del aire exterior es inferior a 0 °C", "Solo por encima de 10 000 ft", "Con temperaturas del aire exterior de hasta 38 °C (100 °F), con una humedad de apenas el 50 %", "Solo cuando el motor está parado"], "ans": 2, "why": "El enfriamiento por efecto Venturi y por vaporización del combustible, y no la temperatura ambiente por sí sola, provoca el hielo en el carburador; el PHAK señala expresamente que puede formarse con temperaturas exteriores de hasta 38 °C y una humedad de apenas el 50 %, una trampa habitual de examen («solo hay hielo con tiempo frío» es falso).", "src": "FAA PHAK 8083-25C ch. 7, \"Carburetor Icing\"", "note": ""}, {"n": 21, "stem": "El tren de aterrizaje triciclo (rueda de morro delante, tren principal detrás) se prefiere al tren de rueda de cola principalmente porque:", "opts": ["Permite un frenado más enérgico sin capotar, mejor visibilidad hacia delante y resiste el caballito en tierra (ground loop)", "Siempre pesa menos", "No requiere sistema de dirección", "Elimina la necesidad de frenos"], "ans": 0, "why": "El PHAK, cap. 7, da exactamente estas tres ventajas; la última, porque en la configuración triciclo el CG queda por delante de las ruedas principales.", "src": "FAA PHAK 8083-25C ch. 7, \"Tricycle Landing Gear\"", "note": ""}, {"n": 22, "stem": "El principal inconveniente del tren de rueda de cola («convencional») es que:", "opts": ["No puede utilizarse en campos sin preparar", "Con el CG detrás del tren principal, el control direccional en tierra es más difícil y se favorece el caballito en tierra (ground loop)", "Requiere replegarse en vuelo", "Reduce la distancia de la hélice al suelo"], "ans": 1, "why": "PHAK: con el CG por detrás de las ruedas principales, un viraje brusco a baja velocidad puede superar la autoridad del timón de dirección del piloto y el CG «se adelanta» al tren principal, lo que favorece el caballito en tierra; además se reduce la visibilidad hacia delante.", "src": "FAA PHAK 8083-25C ch. 7, \"Tailwheel Landing Gear\"", "note": ""}, {"n": 23, "stem": "Un sistema de presurización típico mantiene la altitud de cabina, a la altitud máxima de crucero de diseño de la aeronave, en aproximadamente:", "opts": ["8000 ft", "2000 ft", "14 000 ft", "Exactamente el nivel del mar"], "ans": 0, "why": "PHAK cap. 7: los sistemas de presurización suelen mantener una altitud de presión de cabina de unos 8000 ft a la altitud máxima de crucero, evitando cambios rápidos e incómodos de la altitud de cabina.", "src": "FAA PHAK 8083-25C ch. 7, \"Pressurized Aircraft\"", "note": ""}, {"n": 24, "stem": "La descompresión explosiva se define, en general, como un cambio de la presión de cabina que se produce:", "opts": ["En más de 5 segundos", "Solo por encima de FL410", "Solo durante el descenso", "En menos de unos 0,5 segundos, más rápido de lo que pueden descomprimirse los pulmones"], "ans": 3, "why": "PHAK: la mayoría de las autoridades consideran explosiva, y potencialmente peligrosa, cualquier descompresión que se produzca en menos de 0,5 segundos, ya que el tiempo normal de descompresión pulmonar sin restricciones es de unos 0,2 segundos.", "src": "FAA PHAK 8083-25C ch. 7, \"Pressurized Aircraft\"", "note": ""}, {"n": 25, "stem": "La tripulación de vuelo está obligada a utilizar oxígeno suplementario tras cuánto tiempo a una altitud de presión de cabina entre 12 500 y 14 000 ft?", "opts": ["30 minutos", "Inmediatamente", "2 horas", "No existe tal requisito"], "ans": 0, "why": "El PHAK cita la norma: se requiere oxígeno suplementario para la tripulación de vuelo tras 30 minutos de exposición a altitudes de cabina entre 12 500 y 14 000 ft; por encima de 14 000 ft se requiere inmediatamente, y por encima de 15 000 ft todos los ocupantes deben disponer de él.", "src": "FAA PHAK 8083-25C ch. 7, \"Oxygen Systems\"", "note": ""}, {"n": 26, "stem": "Por encima de una altitud de presión de cabina de 15 000 ft:", "opts": ["Solo la tripulación de vuelo necesita oxígeno suplementario", "Todos los ocupantes de la aeronave deben disponer de oxígeno suplementario", "El uso de oxígeno es opcional", "Solo los pasajeros mayores de 60 años necesitan oxígeno suplementario"], "ans": 1, "why": "PHAK: por encima de una altitud de presión de cabina de 15 000 ft, todos los ocupantes deben disponer de oxígeno suplementario, el más estricto de los tres umbrales de oxígeno que enumera.", "src": "FAA PHAK 8083-25C ch. 7, \"Oxygen Systems\"", "note": ""}, {"n": 27, "stem": "Las botas de deshielo neumáticas (inflables) funcionan:", "opts": ["Exudando un líquido anticongelante por pequeños orificios del borde de ataque", "Calentando eléctricamente el borde de ataque en todo momento", "Inflando una lámina de goma en el borde de ataque para romper el hielo acumulado", "Rociando alcohol solo sobre el parabrisas"], "ans": 2, "why": "PHAK: una bomba neumática accionada por el motor (o aire de sangrado en los turbohélices) infla botas de goma pegadas al borde de ataque y rompe el hielo acumulado; las botas modernas pueden ciclarse en cuanto se observa hielo.", "src": "FAA PHAK 8083-25C ch. 7, \"Airfoil Anti-Ice and Deice\"", "note": ""}, {"n": 28, "stem": "El sistema de protección contra el hielo de «ala con exudación» (weeping wing, TKS) funciona:", "opts": ["Redirigiendo aire de sangrado del motor hacia el borde de ataque", "Inflando botas de goma", "Utilizando un laminado de lámina de grafito calentado eléctricamente", "Exudando un fluido anticongelante o glicol por pequeños orificios del borde de ataque, que impide la formación de hielo y rompe químicamente la adherencia del hielo ya formado"], "ans": 3, "why": "El PHAK describe el diseño de ala con exudación como el bombeo de una solución anticongelante hasta el borde de ataque, que impide la formación de hielo y, si ya se ha formado, rompe químicamente la unión entre el hielo y la estructura para que lo retiren las fuerzas aerodinámicas.", "src": "FAA PHAK 8083-25C ch. 7, \"Other Anti-Ice and Deice Systems\"", "note": ""}, {"n": 29, "stem": "El calentamiento eléctrico de un parabrisas con fines antihielo conlleva, según la documentación, ¿qué efecto secundario?", "opts": ["Puede causar errores de desviación de la brújula de hasta 40 grados", "Siempre sobrecalienta la cabina", "Desactiva el piloto automático", "Reduce la presurización de la cabina"], "ans": 0, "why": "El PHAK advierte expresamente de que la corriente eléctrica que circula por los hilos calefactores embebidos en el parabrisas puede causar errores de desviación de la brújula de hasta 40 grados, un dato concreto y evaluable.", "src": "FAA PHAK 8083-25C ch. 7, \"Windscreen Anti-Ice\"", "note": ""}, {"n": 30, "stem": "Un piloto automático de un solo eje controla la aeronave alrededor de ¿qué eje y mediante qué servo?", "opts": ["El eje vertical, mediante el servo del timón de dirección", "El eje longitudinal, mediante el servo de los alerones (solo alabeo)", "Los tres ejes simultáneamente", "El eje lateral, mediante el servo del timón de profundidad"], "ans": 1, "why": "PHAK cap. 6: un piloto automático de un solo eje controla la aeronave únicamente alrededor del eje longitudinal, con un servo que acciona los alerones (alabeo); un sistema de tres ejes añade servos del timón de profundidad y del timón de dirección para el cabeceo y la guiñada.", "src": "FAA PHAK 8083-25C ch. 6, \"Autopilot\"", "note": ""}, {"n": 31, "stem": "Un aviso de resolución (RA) del TCAS/ACAS II pretende establecer, respecto a la aeronave amenaza, ¿qué separación vertical?", "opts": ["1000 pies", "100-200 pies", "De 300 a 700 pies", "Exactamente 500 pies, siempre"], "ans": 2, "why": "El artículo de SKYbrary sobre el ACAS indica que los RA pretenden lograr una separación vertical segura de 300-700 pies, en lugar de restablecer un mínimo de separación ATC prescrito.", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 32, "stem": "Cuando un piloto recibe un aviso de resolución (RA) del TCAS/ACAS que contradice una instrucción del ATC, el piloto debe:", "opts": ["Seguir siempre la instrucción del ATC, ya que este tiene una visión de conjunto mayor", "Pedir aclaración al ATC antes de hacer nada", "Ignorar el RA si se ha establecido contacto visual con el tráfico", "Cumplir inmediatamente el RA, aunque sea contrario a la autorización o instrucción del ATC"], "ans": 3, "why": "SKYbrary/OACI: los pilotos están obligados a cumplir inmediatamente todos los RA, incluso si son contrarios a las autorizaciones o instrucciones del ATC, salvo que hacerlo ponga en peligro la aeronave.", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 33, "stem": "Una vez que un piloto notifica al ATC un aviso de resolución (RA) del TCAS, el controlador:", "opts": ["Debe emitir inmediatamente una nueva autorización para resolver el conflicto", "Deja de ser responsable de la separación de las aeronaves implicadas en el RA hasta que se anuncie «libre de conflicto» (clear of conflict)", "Debe ordenar al piloto que ignore el RA", "Asume el control total de la trayectoria de vuelo de la aeronave"], "ans": 1, "why": "Según las orientaciones de SKYbrary/OACI, una vez notificado un RA, el controlador deja de ser responsable de la separación de las aeronaves afectadas y no debe intentar modificar su trayectoria hasta que se anuncie «libre de conflicto» (clear of conflict).", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 34, "stem": "La versión 7.1 del TCAS II pasó a ser obligatoria en el espacio aéreo de la Unión Europea el:", "opts": ["1 de enero de 2017", "1 de diciembre de 2015", "1 de marzo de 2012", "1 de enero de 2020"], "ans": 1, "why": "SKYbrary: la versión 7.1 es obligatoria en Europa desde el 1 de diciembre de 2015, antes del mandato mundial del Anexo 10 de la OACI del 1 de enero de 2017.", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 35, "stem": "La diferencia clave entre el GPWS clásico y el EGPWS/TAWS es que:", "opts": ["El EGPWS/TAWS es puramente reactivo, mientras que el GPWS es predictivo", "El GPWS usa una base de datos de terreno almacenada y GPS, mientras que el EGPWS no", "El GPWS reacciona a condiciones ya presentes (envolventes basadas en el radioaltímetro); el EGPWS/TAWS añade una base de datos de terreno almacenada y GPS para dar avisos predictivos, de mirada hacia delante", "No hay ninguna diferencia funcional; EGPWS es solo un nombre comercial"], "ans": 2, "why": "El GPWS clásico compara los datos del radioaltímetro con envolventes de aviso fijas (reactivo); el EGPWS/TAWS añade una base de datos mundial de terreno y obstáculos y la posición GPS para dar una capacidad predictiva que redujo las tasas de accidentes CFIT (impacto contra el suelo sin pérdida de control).", "src": "Expansiones de los acrónimos verificadas en AIP España y en el reglamento ATM/ANS de EASA; la distinción operativa es conocimiento general del sector", "note": ""}, {"n": 36, "stem": "Respecto a la familia ACAS, ¿qué afirmación es correcta?", "opts": ["El ACAS III es actualmente la única versión implantada, como el TCAS clásico", "El ACAS I da solo avisos de tránsito (TA); el ACAS II (implantado como TCAS II) da avisos de tránsito y avisos de resolución (RA) verticales; el ACAS III añadiría RA horizontales, pero todavía no está implantado", "El ACAS II da solo avisos de resolución horizontales", "El ACAS I y el ACAS II son funcionalmente idénticos"], "ans": 1, "why": "El Anexo 10 de la OACI, vol. IV, define el ACAS I (solo TA), el ACAS II (TA más RA en sentido vertical, el único concepto implantado, como TCAS II) y el ACAS III (añadiría RA horizontales, aún no realizado).", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 37, "stem": "Según el mandato de la UE, ¿qué aeronaves deben ir equipadas con ACAS II?", "opts": ["Todas las aeronaves, sea cual sea su tamaño o peso", "Solo las aeronaves que vuelan por encima de FL290", "Los aviones con motor de turbina cuya MTOM exceda de 5700 kg o que estén autorizados a transportar más de 19 pasajeros", "Solo los helicópteros"], "ans": 2, "why": "SKYbrary, citando la norma de ejecución de la Comisión Europea: los aviones con motor de turbina con MTOM superior a 5700 kg o autorizados para más de 19 pasajeros deben llevar ACAS II (desde el 1 de marzo de 2012, o el 1 de diciembre de 2015 para las aeronaves con un certificado de aeronavegabilidad anterior).", "src": "SKYbrary \"Airborne Collision Avoidance System (ACAS)\"", "note": ""}, {"n": 38, "stem": "La velocidad máxima de operación y el número de Mach máximo de operación certificados de la familia A320 (VMO/MMO) son:", "opts": ["320 kt / Mach 0,78", "250 kt / Mach 0,70", "400 kt / Mach 0,85", "350 kt / Mach 0,82"], "ans": 3, "why": "La ficha de datos del certificado de tipo de EASA (TCDS) del A318-A321 indica VMO = 350 kt, MMO = 0,82.", "src": "EASA TCDS A064, A318-A321", "note": ""}, {"n": 39, "stem": "La envergadura del Boeing 747 clásico (modelos -100/-200/-300 y SP, el primer bloque de dimensiones de su ficha de datos del certificado de tipo de EASA IM.A196) es aproximadamente:", "opts": ["79,8 m", "34 m", "59,6 m", "45 m"], "ans": 2, "why": "La TCDS indica una envergadura de 59,6 m (195 ft 8 in) para los modelos clásicos y el SP. La misma TCDS enumera también 64,44 m (747-400) y 68,5 m (747-8), por lo que el enunciado era ambiguo sin nombrar la serie clásica; ninguno de esos dos valores se ofrece como opción.", "src": "EASA TCDS IM.A196, Boeing 747", "note": ""}, {"n": 40, "stem": "La masa máxima de despegue del Airbus A330, para la variante más pesada que figura en su TCDS de EASA, es aproximadamente:", "opts": ["79 t", "120 t", "350 t", "242 t"], "ans": 3, "why": "La TCDS del A330 enumera masas máximas de despegue de 217 t, 218 t y hasta 242 t según la variante.", "src": "EASA TCDS A004, Airbus A330", "note": ""}, {"n": 41, "stem": "El peso máximo sin combustible (MZFW) se define como:", "opts": ["El peso máximo incluido todo el combustible utilizable", "El peso en vacío de la aeronave sin ningún equipo instalado", "El peso en el toque de ruedas tras un aterrizaje normal", "El peso máximo sin incluir el combustible utilizable"], "ans": 3, "why": "Definición GAMA del PHAK: el MZFW es el peso máximo sin incluir el combustible utilizable; el peso añadido en forma de combustible por encima de este punto no aumenta, en términos generales, la carga de flexión en el encastre del ala, ya que el combustible se transporta en las alas.", "src": "FAA PHAK 8083-25C ch. 10, \"Maximum zero fuel weight (GAMA)\"", "note": ""}, {"n": 42, "stem": "En comparación con el peso máximo de despegue (MTOW), el peso máximo de rampa (rodaje) es:", "opts": ["Siempre igual al MTOW", "Irrelevante para la planificación de peso y centrado", "Siempre menor que el MTOW, ya que se reserva parte del combustible", "Mayor que el MTOW, porque incluye el combustible que se consumirá durante el rodaje y las pruebas de motor"], "ans": 3, "why": "PHAK: el peso máximo de rampa es el peso total cargado, con todo el combustible, y es mayor que el peso de despegue por el combustible consumido antes de soltar frenos para el despegue.", "src": "FAA PHAK 8083-25C ch. 10, \"Maximum ramp weight\"", "note": ""}, {"n": 43, "stem": "La cuerda aerodinámica media (MAC), en términos de peso y centrado, se utiliza principalmente para:", "opts": ["Calcular el consumo de combustible", "Determinar la velocidad que nunca debe excederse", "Calcular la intensidad de los torbellinos de punta de ala", "Expresar la posición del CG de la aeronave, normalmente como «% MAC», en las aeronaves de transporte"], "ans": 3, "why": "La MAC es la distancia media entre el borde de ataque y el borde de salida del ala y sirve de referencia estándar para indicar la posición del CG como porcentaje de la MAC en las aeronaves de categoría de transporte.", "src": "FAA PHAK 8083-25C ch. 10, \"Mean aerodynamic chord (MAC)\"", "note": ""}, {"n": 44, "stem": "Una aeronave con una VREF de 135 kt, ¿en qué categoría de aproximación de aeronave (AAC) se clasifica?", "opts": ["Categoría E", "Categoría A", "Categoría C", "Categoría B"], "ans": 2, "why": "La categoría C abarca velocidades de aproximación desde 121 kt hasta menos de 141 kt, y 135 kt queda dentro de esa banda.", "src": "FAA AC 150/5300-13B, Table 1-1", "note": ""}, {"n": 45, "stem": "El grupo de diseño de aeronave (Airplane Design Group, ADG) es una clasificación basada en:", "opts": ["Solo el número de motores", "La letra de la categoría de aproximación de la aeronave", "El número de Mach máximo de operación", "La envergadura o la altura de la cola, la que sea más restrictiva"], "ans": 3, "why": "FAA AC 150/5300-13B: el ADG agrupa las aeronaves (I-VI) por envergadura o por altura de cola, utilizando la dimensión que sitúe a la aeronave en el grupo mayor.", "src": "FAA AC 150/5300-13B, §1.6.2", "note": ""}, {"n": 46, "stem": "La VMU (velocidad mínima de despegue, minimum unstick speed) se define como:", "opts": ["La velocidad máxima a la que puede replegarse el tren de aterrizaje", "La velocidad calibrada a partir de la cual el avión puede despegar con seguridad del suelo y continuar el despegue", "La velocidad de pérdida en configuración de aterrizaje", "La velocidad a la que se activa el dispositivo de aviso de pérdida"], "ans": 1, "why": "CS 25.107(d) da exactamente esta definición; la VMU es una velocidad obtenida en ensayos en vuelo, y la VLOF se certifica después con un margen porcentual fijo por encima de ella.", "src": "EASA CS-25 Amendment 28, CS 25.107(d)", "note": ""}, {"n": 47, "stem": "Cuando la pista disponible excede la longitud mínima requerida para un peso dado, un operador puede elegir una V1 entre:", "opts": ["Solo VR y V2", "Una V1 mínima (despegue continuado seguro con un motor inoperativo) y una V1 máxima (la aeronave aún puede detenerse en la pista restante)", "Solo VMCG y VMCA", "Cero y VR, sin ninguna otra restricción"], "ans": 1, "why": "SKYbrary: cuando la longitud de pista excede el mínimo requerido, existe un rango de velocidades V1 válidas, limitado por una V1 mínima (que satisface el criterio de despegue continuado) y una V1 máxima (que satisface el criterio de despegue interrumpido).", "src": "SKYbrary \"V1\"", "note": ""}, {"n": 48, "stem": "La velocidad de rotación (VR) es función de:", "opts": ["Solo la temperatura del aire exterior", "El peso de la aeronave y la posición de los flaps, y también puede variar con la altitud de presión y la temperatura", "Solo la longitud de la pista", "Solo la matrícula de la aeronave"], "ans": 1, "why": "SKYbrary «Rotation Speed (Vr)»: la VR es función del peso de la aeronave y de la posición de los flaps, y también puede variar con la altitud de presión y la temperatura; no es un valor único y fijo para un tipo de aeronave.", "src": "SKYbrary \"Rotation Speed (Vr)\"", "note": ""}, {"n": 49, "stem": "Una regla práctica del piloto para estimar la TAS a partir de la CAS, sin computador de vuelo, es:", "opts": ["Restar el 2 % de la CAS por cada 1000 ft de altitud", "Multiplicar la CAS por el cuadrado de la altitud en miles de pies", "Sumar el 2 % a la CAS por cada 1000 ft de altitud", "Sumar 10 kt por cada 1000 ft de altitud, sea cual sea la velocidad"], "ans": 2, "why": "Regla práctica del PHAK: sumar el 2 % a la CAS por cada 1000 ft de altitud para aproximar la TAS, ya que la densidad del aire (y, por tanto, la relación CAS-TAS) disminuye con la altitud.", "src": "FAA PHAK 8083-25C ch. 8, \"True airspeed (TAS)\"", "note": ""}, {"n": 50, "stem": "La limitación de velocidad de 250 kt IAS según SERA se aplica:", "opts": ["Solo por encima de FL410", "A todas las altitudes, sin excepción", "Por debajo de aproximadamente 10 000 ft (3050 m) AMSL, a los vuelos IFR y VFR en la mayoría de las clases de espacio aéreo de la OACI", "Solo a los vuelos VFR, nunca a los IFR"], "ans": 2, "why": "SERA.923 establece que se aplica una limitación de velocidad de 250 kt IAS a los vuelos por debajo de 3050 m (10 000 ft) AMSL, tanto IFR como VFR, en las clases de espacio aéreo que enumera.", "src": "EASA Easy Access Rules for SERA (SERA.923)", "note": ""}, {"n": 51, "stem": "La trayectoria de vuelo de despegue «neta», frente a la «bruta», es:", "opts": ["La trayectoria realmente volada por la aeronave, sin ningún ajuste", "La utilizada solo para planificar el combustible, no para el franqueamiento de obstáculos", "La trayectoria bruta reducida en cada punto por una penalización obligatoria de gradiente, y es la trayectoria utilizada para el franqueamiento de obstáculos certificado", "Siempre idéntica a la trayectoria bruta en los aviones cuatrimotores"], "ans": 2, "why": "CS/JAR 25.115(b): la trayectoria neta es la trayectoria bruta (realmente volada) reducida en cada punto por una penalización fija de gradiente (0,8 %/1,0 %); esta trayectoria neta, más conservadora, es la que utiliza la certificación del franqueamiento de obstáculos.", "src": "GTG §4.2.1", "note": ""}, {"n": 52, "stem": "En la mayoría de los turbofanes modernos de alta relación de derivación, la inversión de empuje se consigue principalmente:", "opts": ["Parando por completo el motor durante la carrera de aterrizaje", "Redirigiendo hacia delante el flujo de aire del fan (de derivación) mediante puertas de bloqueo o álabes de cascada, en lugar de invertir el escape caliente del núcleo", "Invirtiendo el paso de la hélice", "Desplegando solo los spoilers, sin intervención del motor"], "ans": 1, "why": "Los turbofanes modernos de alta relación de derivación suelen invertir únicamente el flujo de aire del fan (de derivación) mediante puertas de bloqueo o álabes de cascada; el escape caliente del núcleo normalmente no se invierte. La inversión de empuje pierde eficacia a medida que disminuye la velocidad respecto al suelo.", "src": "Synthesis from turbofan bypass-ratio material, FAA PHAK 8083-25C ch. 7", "note": ""}, {"n": 53, "stem": "El grupo auxiliar de potencia (APU) se describe mejor como:", "opts": ["Solo una bomba hidráulica de reserva", "Un pequeño motor de turbina, normalmente en el cono de cola, que proporciona energía eléctrica y aire de sangrado en tierra sin hacer funcionar los motores principales", "Un dispositivo que solo funciona en vuelo por encima de FL200", "Un computador secundario de mandos de vuelo"], "ans": 1, "why": "El APU es un pequeño motor de turbina a bordo que permite al personal de tierra alimentar los sistemas de la cabina y arrancar los motores principales sin energía externa en tierra; también puede servir de fuente de reserva en vuelo dentro de su envolvente certificada.", "src": "General operational knowledge", "note": ""}, {"n": 54, "stem": "Durante una aproximación frustrada (go-around) desde una aproximación baja y lenta, la razón aerodinámica por la que es esencial aplicar potencia de inmediato (y no solo levantar el morro) es que:", "opts": ["La aeronave está por encima de la región de mando invertido, donde solo la velocidad controla la altitud", "La aeronave está en la región de mando invertido, donde una velocidad menor requiere MÁS potencia, no menos, para detener el régimen de descenso", "La potencia no tiene efecto sobre el régimen de descenso a baja velocidad", "Solo el timón de dirección puede detener un régimen de descenso a baja velocidad"], "ans": 1, "why": "En la aproximación, una aeronave vuela en la región de mando invertido (T09a §7): por debajo de la velocidad de máxima autonomía, una velocidad menor requiere un ajuste de potencia mayor para sostener la trayectoria de vuelo, que es exactamente la razón por la que una aproximación frustrada exige un aumento inmediato de potencia.", "src": "FAA PHAK 8083-25C ch. 5, region of reversed command, applied to the go-around case", "note": ""}, {"n": 55, "stem": "El esquema de clasificación de mercancías peligrosas OACI/ONU para el transporte aéreo comprende:", "opts": ["Tres clases", "Quince clases", "Nueve clases (explosivos, gases, líquidos o sólidos inflamables, comburentes, sustancias tóxicas o infecciosas, material radiactivo, corrosivos, varios)", "Solo dos clases: inflamable e ininflamable"], "ans": 2, "why": "El Anexo 18 de la OACI y las Instrucciones Técnicas clasifican las mercancías peligrosas en nueve clases, cada una con requisitos específicos de embalaje, etiquetado y estiba.", "src": "General aviation-industry knowledge, ICAO Annex 18 classification scheme", "note": ""}, {"n": 56, "stem": "El combustible de reserva final para un avión con motor de turbina, según las normas típicas de política de combustible de EASA, se define habitualmente como:", "opts": ["30 minutos de combustible de espera a 1500 ft sobre la elevación del aeródromo en condiciones estándar", "El combustible para un desvío completo al aeródromo de salida", "El 5 % del combustible del trayecto únicamente", "Sin mínimo fijo; se deja por completo a discreción del comandante"], "ans": 0, "why": "La política estándar de combustible de EASA Air OPS Part-CAT define el combustible de reserva final de los aviones con motor de turbina, habitualmente, como 30 minutos de combustible de espera a 1500 ft sobre la elevación del aeródromo en condiciones estándar (ISA), además del combustible de rodaje, de trayecto, de contingencia y de alternativa.", "src": "General EASA Air OPS fuel-policy knowledge, not independently re-verified against a primary Part-CAT text this session", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/09-aerodinamica-mecanica/ampliacion/T09b-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let order=Q.map((_,i)=>i),shuffleOpts=false,hideDone=false;
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
  const box=$('#qs');box.innerHTML='';let done=0,right=0;
  Q.forEach((q,i)=>{const r=st[q.n];if(r){done++;if(r.ok)right++}});
  $('#score').textContent=`${right} ${U.score} ${done} ${U.answered} · ${Q.length} ${U.questions}`+(done?` · ${Math.round(100*right/done)}%`:'');
  order.forEach(i=>{
    const q=Q[i],r=st[q.n];if(hideDone&&r)return;
    const d=document.createElement('section');d.className='q';d.id='q'+q.n;d.tabIndex=-1;
    const idx=(r&&r.idx)?r.idx:(shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3]);
    d.innerHTML=`<div class="qn">Q${q.n}</div><div class="stem">${q.stem}</div>`;
    idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
