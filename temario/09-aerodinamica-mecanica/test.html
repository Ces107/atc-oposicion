ual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 125, "stem": "Según el manual, la línea equidistante del intradós y del extradós es:", "opts": ["la cuerda", "la cuerda media", "la línea de curvatura media", "el radio de curvatura del borde de ataque"], "ans": 2, "why": "«La línea de curvatura media es la línea equidistante del intradós y del extradós». La cuerda une el borde de ataque y el borde de salida.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 126, "stem": "Según el manual, la envergadura es:", "opts": ["la distancia entre el borde de ataque y el borde de salida", "el cociente entre la superficie alar y la cuerda en la punta", "la distancia entre los dos extremos de las alas", "la longitud total del fuselaje"], "ans": 2, "why": "«La envergadura es la distancia entre los dos extremos de las alas»; multiplicada por la cuerda media da la superficie alar.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 127, "stem": "Según el manual, a medida que el alargamiento se hace más elevado, el ala es:", "opts": ["más corta y ancha", "más corta y estrecha", "más larga y ancha", "más larga y estrecha"], "ans": 3, "why": "El alargamiento (envergadura/cuerda media) indica la relación entre la longitud y la anchura del ala; «a medida que este valor se hace más elevado el ala es más larga y estrecha».", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 128, "stem": "Según el manual, la flecha del ala es el ángulo que forman las alas respecto:", "opts": ["del eje longitudinal del avión", "del horizonte, visto el avión de frente", "de la dirección del viento relativo", "del eje transversal del avión"], "ans": 3, "why": "«La flecha del ala es el ángulo que forman las alas respecto del eje transversal del avión». El diedro es el ángulo en «V» con el eje lateral visto de frente y el ángulo de ataque se mide respecto del viento relativo.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 129, "stem": "Según el texto del manual (edición de noviembre de 2026), la flecha regresiva o positiva es la de un ala con:", "opts": ["los extremos de las alas orientados hacia atrás", "los extremos de las alas adelantados", "los extremos a la altura del encastre", "los extremos más altos que el encastre"], "ans": 0, "why": "«regresiva/positiva (extremos de las alas orientados hacia atrás)». En la edición de agosto de 2023 «regresiva» iba con «negativa» y significaba extremos adelantados; ya no vale. La opción D describe un diedro positivo.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 130, "stem": "Según el texto de la p. 15 del manual (no los rótulos de la Figura 7), la flecha puede ser:", "opts": ["progresiva/positiva, neutra o regresiva/negativa", "regresiva/positiva, recta o invertida/progresiva", "positiva, neutra o negativa, sin otros nombres", "progresiva, recta o regresiva, sin signo"], "ans": 1, "why": "Texto de noviembre de 2026: «regresiva/positiva (...), recta, o invertida/progresiva». La opción A es la redacción de agosto de 2023; la C son los rótulos de la Figura 7.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 131, "stem": "La Figura 7 del manual («Tipos de flecha de ala») rotula el ala con los extremos adelantados como:", "opts": ["Flecha Positiva", "Flecha Neutra", "Flecha Progresiva", "Flecha Negativa"], "ans": 3, "why": "La Figura 7 conserva los rótulos «Flecha Positiva» (extremos hacia atrás), «Flecha Neutra» y «Flecha Negativa» (extremos adelantados). En el texto de la p. 15 el ala adelantada se llama «invertida/progresiva».", "src": "Manual 9 (nov. 2026), capítulo 8, p. 16 (Figura 7)", "note": ""}, {"n": 132, "stem": "Según el manual, el diedro es:", "opts": ["visto en planta, el ángulo que forman las alas con el eje transversal", "visto el avión de frente, el ángulo en forma de «V» que forman las alas con el eje lateral", "el ángulo agudo entre la cuerda y el viento relativo", "el ángulo entre el eje longitudinal y el horizonte"], "ans": 1, "why": "«El diedro, visto el avión de frente, es el ángulo en forma de \"V\" que forman las alas con el eje lateral». La opción A es la flecha y la C, el ángulo de ataque.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 16", "note": ""}, {"n": 133, "stem": "Según el manual, el ángulo diedro puede ser:", "opts": ["regresivo, recto o invertido", "progresivo o regresivo", "alto, medio o bajo", "positivo, neutro o negativo"], "ans": 3, "why": "«El ángulo diedro puede ser positivo, neutro, o negativo» (Figura 8). «Recta» e «invertida» son tipos de flecha en el texto de la p. 15.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 16 (Figura 8)", "note": ""}, {"n": 134, "stem": "Según el manual, el ángulo de ataque es variable porque depende de:", "opts": ["la envergadura, la cuerda media y el alargamiento del ala", "el peso del avión, la posición del CG y el factor de carga", "la dirección del viento relativo y la posición de las alas con respecto a este", "la temperatura, la altitud de presión y la humedad del aire"], "ans": 2, "why": "«Este ángulo es variable, pues depende de la dirección del viento relativo y de la posición de las alas con respecto a este».", "src": "Manual 9 (nov. 2026), capítulo 8, p. 16", "note": ""}, {"n": 135, "stem": "Según el manual, los ejes de un avión son tres líneas imaginarias que:", "opts": ["pasan por el borde de ataque y son paralelas entre sí", "pasan por el centro de presiones y forman 45° entre sí", "pasan a través del centro de gravedad y son perpendiculares entre sí", "pasan por el encastre del ala y se cortan en el morro"], "ans": 2, "why": "«Los ejes de un avión son tres líneas imaginarias que pasan a través del centro de gravedad de la aeronave»; la figura muestra los tres ejes de referencia perpendiculares entre sí.", "src": "Manual 9 (nov. 2026), capítulo 9, p. 16", "note": ""}, {"n": 136, "stem": "¿Qué pareja eje-momento es correcta en la Figura 10 del manual («Ejes de una aeronave»)?", "opts": ["Eje Z con N, momento de guiñada positivo", "Eje X con M, momento de cabeceo positivo", "Eje Y con L, momento de balanceo positivo", "Eje Z con L, momento de balanceo positivo"], "ans": 0, "why": "La Figura 10 rotula X con L («Momento de balanceo positivo»), Y con M («Momento de cabeceo positivo») y Z, hacia abajo, con N («Momento de guiñada positivo»).", "src": "Manual 9 (nov. 2026), capítulo 9, p. 17 (Figura 10)", "note": ""}, {"n": 137, "stem": "En la Figura 10 del manual, el eje X, que va hacia el morro, lleva asociado el momento:", "opts": ["M, de cabeceo positivo", "L, de balanceo positivo", "N, de guiñada positivo", "N, de balanceo positivo"], "ans": 1, "why": "X (eje longitudinal) con L, momento de balanceo positivo; Y (lateral) con M, cabeceo; Z (vertical) con N, guiñada.", "src": "Manual 9 (nov. 2026), capítulo 9, p. 17 (Figura 10)", "note": ""}, {"n": 138, "stem": "Según el manual, el timón de dirección está situado en ___ y se acciona ___:", "opts": ["el estabilizador horizontal; empujando y tirando de la palanca", "el borde de salida de las alas; girando la palanca a izquierda y derecha", "el estabilizador vertical, cerca del borde de salida; pisando los pedales del timón", "el extradós del ala; con la palanca de aerofrenos"], "ans": 2, "why": "El timón de dirección (rudder) controla la guiñada alrededor del eje vertical, está en el estabilizador vertical en la sección de cola, cerca del borde de salida, y se acciona pisando los pedales a derecha e izquierda. A son los timones de profundidad y B, los alerones.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 18", "note": ""}, {"n": 139, "stem": "Según el manual, los dispositivos hipersustentadores (slats y flaps):", "opts": ["disminuyen la curvatura del perfil y el valor de C_Lmax", "reducen las velocidades de despegue y aterrizaje y, consiguientemente, las longitudes de pista necesarias", "aumentan las velocidades de despegue y aterrizaje para mejorar el control", "reducen la sustentación y aumentan la resistencia en el aterrizaje"], "ans": 1, "why": "Slats y flaps varían la curvatura aumentándola y consiguen un aumento de C_Lmax; reducen las velocidades de despegue y aterrizaje y, consiguientemente, las longitudes de pista necesarias. La opción D describe los spoilers.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 19", "note": ""}, {"n": 140, "stem": "Según el manual, los spoilers o aerofrenos:", "opts": ["reducen la sustentación, aumentan la resistencia y están situados en el extradós", "aumentan la sustentación y están situados en el borde de ataque", "aumentan la curvatura del perfil y el valor de C_Lmax", "están situados en el intradós y solo funcionan simétricamente"], "ans": 0, "why": "Los spoilers reducen la sustentación y aumentan la resistencia; están en el extradós; simétricos funcionan como aerofrenos y asimétricos, como mandos de alabeo a altas velocidades.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 19", "note": ""}, {"n": 141, "stem": "Según el manual, los trim tabs son pequeñas superficies de control situadas cerca del borde de salida de:", "opts": ["los slats, los flaps y los spoilers", "el timón de profundidad, el timón de dirección y los alerones", "los alerones únicamente", "las alas, entre el flap y el alerón"], "ans": 1, "why": "«Trim tabs. Son pequeñas superficies de control situadas cerca del borde de salida del timón de profundidad, timón de dirección y alerones».", "src": "Manual 9 (nov. 2026), capítulo 10, p. 19", "note": ""}, {"n": 142, "stem": "En el ejemplo del manual, al deflectar el tab hacia abajo, el momento de charnela que se produce tiende a mover el timón:", "opts": ["hacia arriba", "hacia abajo", "hacia la izquierda", "a su posición neutra, sin generar fuerza"], "ans": 0, "why": "Deflectando el tab hacia abajo aumenta la curvatura de esa parte del perfil y se produce una fuerza aerodinámica que da lugar a un momento de charnela considerable; «Este momento tiende a mover el timón hacia arriba». Es el sentido opuesto al del tab.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 19", "note": ""}, {"n": 143, "stem": "Según el manual, de los factores que influyen en las actuaciones del avión, ¿sobre cuáles podemos actuar?", "opts": ["La temperatura, el viento y la altitud de presión", "La posición de los flaps, el peso y la velocidad", "El viento, el peso y la temperatura", "El empuje, la temperatura y la posición del CG"], "ans": 1, "why": "Influyen el empuje de los motores, la temperatura, la altitud de presión, la posición de los flaps, el peso, el viento, la posición del CG y la velocidad; podemos actuar escogiendo la posición de flaps más adecuada, limitando el peso y llevando una determinada velocidad en cada momento.", "src": "Manual 9 (nov. 2026), capítulo 11, p. 19", "note": ""}, {"n": 144, "stem": "Según el manual, ¿qué dos efectos produce el fallo del motor crítico a V_MCG?", "opts": ["Un aumento de la sustentación y un alabeo hacia el lado del motor que sigue operativo", "Una pérdida de aceleración y un momento de giro que tiende a sacar el avión de la pista por el lado del motor fallado", "Una pérdida de aceleración y un cabeceo del morro hacia abajo que obliga a rotar antes", "Un momento de giro hacia el lado del motor operativo y un aumento de la velocidad V1"], "ans": 1, "why": "Se producen una pérdida de aceleración (mayor distancia en pista para alcanzar una velocidad) y un momento de giro que tenderá a sacar el avión de la pista por el lado del motor fallado.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 145, "stem": "Según el manual, el momento de giro causado por el fallo de un motor es igual al producto de:", "opts": ["el peso del avión por la envergadura", "la potencia de ese motor por la velocidad del avión", "el empuje de los motores restantes por la distancia al eje lateral", "la potencia de ese motor por su brazo (distancia al eje longitudinal)"], "ans": 3, "why": "El momento de giro «será igual al producto de la potencia de ese motor por su brazo (distancia al eje longitudinal)».", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 146, "stem": "Según el manual, en un polimotor el fallo de un motor con los otros a potencia de despegue causará una guiñada tanto mayor cuanto:", "opts": ["más cerca esté el motor del eje longitudinal", "menor sea la potencia de los demás motores", "más alejado esté el motor (motor crítico) del eje longitudinal", "mayor sea la velocidad del avión"], "ans": 2, "why": "«causara una guiñada tanto mayor cuanto más alejado este el motor (motor critico) del eje longitudinal». Por el contrario, a mayor velocidad más efectivos son los controles aerodinámicos.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 147, "stem": "¿Qué relación da el manual entre V1 y V_MCG?", "opts": ["V1 ≥ V_MCG", "V1 ≤ V_MCG", "V1 = 1,05 V_MCG", "V1 ≥ 1,2 V_MCG"], "ans": 0, "why": "El manual imprime V1 ≥ V_MCG. El factor 1,05 corresponde a V_R ≥ 1,05 V_MC y el 1,2, a V_MCA ≥ 1,2 V_S.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 148, "stem": "Según el manual, V_LOF es:", "opts": ["la velocidad de seguridad que se alcanza a 35 pies", "la velocidad a la que se inicia la rotación", "la velocidad a la que, inicialmente, el avión se va al aire", "la velocidad de decisión"], "ans": 2, "why": "«VLOF: velocidad de despegue. La velocidad a la que, inicialmente, el avión se va al aire». A es V2, B es V_R y D es V1.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 149, "stem": "Según el manual, V2 es esencialmente la velocidad de:", "opts": ["mejor ángulo de ascenso con un motor operativo", "mejor régimen de ascenso con todos los motores", "máximo alcance en crucero", "aproximación final a 50 pies"], "ans": 0, "why": "V2 es la velocidad de seguridad al despegue (35 pies al final de la pista requerida) y «esencialmente la velocidad de mejor ángulo de ascenso con un motor de operativo» (sic); se mantiene hasta franquear los obstáculos o hasta al menos 400 pies.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 21", "note": ""}, {"n": 150, "stem": "¿En qué orden aparecen las velocidades a lo largo de la pista en la Figura 12 del manual («velocidades en despegue»)?", "opts": ["V0, V1, V_S, V_R, V2, V_LOF, V_TR", "V0, V_S, V1, V_R, V_LOF, V_TR, V2", "V_S, V0, V1, V_LOF, V_R, V_TR, V2", "V1, V0, V_S, V_R, V_TR, V_LOF, V2"], "ans": 1, "why": "La Figura 12 rotula, de izquierda a derecha, V0, V_S, V1, V_R, V_LOF, V_TR y V2, con una cota de 35 ft (10,7 m). El texto no define V0 ni V_TR.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 21 (Figura 12)", "note": ""}, {"n": 151, "stem": "Según el manual, la pista requerida para el despegue debe basarse en la posible pérdida de un motor en el punto más crítico, que es:", "opts": ["V1", "V_R", "V2", "V_LOF"], "ans": 0, "why": "«La pista requerida para el despegue debe estar basada en la posible pérdida de un motor en el punto más crítico, que es a V1 (velocidad de decisión)».", "src": "Manual 9 (nov. 2026), capítulo 11.2, p. 21", "note": ""}, {"n": 152, "stem": "Según el manual, la distancia de aceleración-despegue incluye la distancia necesaria para:", "opts": ["ascender a 50 pies, momento en el cual se debe llevar V_REF", "ascender a 400 pies manteniendo V2 con un motor", "detener el avión utilizando solo la acción de los frenos", "ascender a 35 pies, momento en el cual se debe haber llegado a V2"], "ans": 3, "why": "Acelerar a V1 con todos los motores, fallo de motor a V1, continuar con el motor restante; «La pista requerida incluye la distancia necesaria para ascender a 35 pies momento en el cual se debe haber llegado a V2». La opción C es la aceleración-parada.", "src": "Manual 9 (nov. 2026), capítulo 11.2, p. 21", "note": ""}, {"n": 153, "stem": "Según el manual, las velocidades de despegue varían con el peso del avión; por eso, antes de calcularlas, el piloto primero debe determinar:", "opts": ["el peso máximo permitido al despegue", "la componente de viento cruzado", "la longitud del clearway disponible", "la posición de los spoilers"], "ans": 0, "why": "«Antes de que las velocidades de despegue puedan ser calculadas, el piloto primero debe determinar el peso máximo permitido al despegue».", "src": "Manual 9 (nov. 2026), capítulo 11.2, p. 22", "note": ""}, {"n": 154, "stem": "Según el manual, se considera que el clearway empieza:", "opts": ["al final del stopway, si lo hay, y si no, al final de la pista", "en el umbral de la pista, antes del recorrido de despegue", "a 35 pies de altura sobre el final de la pista", "al final de la pista, tanto si hay stopway como si no"], "ans": 3, "why": "«Se considera que empieza a final de pista tanto si hay stopway como si no».", "src": "Manual 9 (nov. 2026), capítulo 11.2.1, p. 22", "note": ""}, {"n": 155, "stem": "Según el manual, V_SO es:", "opts": ["1,3 veces la velocidad de pérdida en configuración de aterrizaje", "la velocidad de pérdida o velocidad mínima de vuelo estable en configuración de aterrizaje", "la velocidad de toma, 1,15 veces la velocidad de pérdida", "la velocidad de pérdida en configuración limpia"], "ans": 1, "why": "«VSO: velocidad de pérdida o velocidad mínima de vuelo estable en configuración de aterrizaje». A es V_REF y C es V_TD.", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 22", "note": ""}, {"n": 156, "stem": "Según el manual, la velocidad de «ascenso en aterrizaje» es la que da la mejor performance en configuración de aterrizaje con:", "opts": ["un motor inoperativo y máxima potencia en el resto", "todos los motores al ralentí", "potencia de crucero en todos los motores", "máxima potencia de despegue en todos los motores"], "ans": 3, "why": "Ascenso en aterrizaje: configuración de aterrizaje y máxima potencia de despegue en todos los motores. La opción A corresponde al ascenso en aproximación (configuración de aproximación).", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 23", "note": ""}, {"n": 157, "stem": "En la Figura 13 del manual («velocidades en aterrizaje»), la altura de 50 ft a la que se indica V_REF ≈ 1,3 V_SO equivale a:", "opts": ["10,7 m", "35 m", "50 m", "15,2 m"], "ans": 3, "why": "La figura rotula «h = 50 ft (15,2 m)». Los 10,7 m son los 35 ft de la Figura 12 (despegue).", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 23 (Figura 13)", "note": ""}, {"n": 158, "stem": "¿Cuál de los siguientes NO figura entre los detalles que el manual manda considerar para determinar el peso de aterrizaje permitido?", "opts": ["La longitud de pista", "La condición de la superficie de la pista", "La posición del centro de gravedad", "La componente de viento en contra"], "ans": 2, "why": "Los seis detalles son: altitud de presión del aeródromo, temperatura, componente de viento en contra, longitud de pista, gradiente o pendiente de pista y condición de la superficie de la pista. La posición del CG aparece entre los factores generales de las actuaciones (capítulo 11), no en esta lista.", "src": "Manual 9 (nov. 2026), capítulo 11.4, p. 23", "note": ""}, {"n": 159, "stem": "Según el manual, el hidroplaneo depende, entre otros, de:", "opts": ["la temperatura del aceite de los motores y la potencia aplicada", "la posición de los flaps, la del CG y el peso del avión", "la longitud del clearway y la del stopway de la pista", "los neumáticos, la contaminación de la pista y el espesor de la capa de agua o nieve"], "ans": 3, "why": "«Este fenómeno depende de los neumáticos, de la contaminación de la pista, del espesor de la capa de agua o nieve entre otros».", "src": "Manual 9 (nov. 2026), capítulo 11.5, p. 23", "note": ""}, {"n": 160, "stem": "Según el manual, con hidroplaneo el método más efectivo para parar el avión es:", "opts": ["la acción de los frenos de las ruedas", "los spoilers en deflexión asimétrica", "el timón de dirección", "el uso de la reversa"], "ans": 3, "why": "«El método más efectivo para parar el avión es el uso de la reversa»: con hidroplaneo la acción de frenado pierde toda su eficacia. Ojo: en la distancia de aceleración-parada el manual no considera la inversión de empuje.", "src": "Manual 9 (nov. 2026), capítulo 11.5, p. 23", "note": ""}, {"n": 161, "stem": "Según el manual, la distancia de despegue con todos los motores operativos:", "opts": ["normalmente no es un factor limitante, ya que suele ser menor que la distancia con un motor inoperativo", "es normalmente la más limitante de las tres distancias que fijan el peso de despegue", "es siempre igual a la distancia de aceleración-parada con todos los motores", "incluye el uso de la inversión de empuje para detener el avión en la pista"], "ans": 0, "why": "«Esta distancia no es normalmente un factor limitante ya que es generalmente menor que la distancia de despegue con un motor inoperativo».", "src": "Manual 9 (nov. 2026), capítulo 11.2, p. 22", "note": ""}, {"n": 162, "stem": "¿Qué velocidad separa abortar el despegue (antes de ella) de continuarlo (después de ella)?", "opts": ["V_R", "V2", "V1", "V_MCG"], "ans": 2, "why": "«V1: Velocidad de decisión, es aquella en la que el piloto tiene que continuar el despegue o abortarlo. Antes abortará y después de esa velocidad continuará el despegue». V_R es la de rotación, V2 la de seguridad al despegue (a 35 pies) y V_MCG la mínima de control en el suelo. El examen real de 2026 preguntó cuál es la velocidad de decisión.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 163, "stem": "¿Qué velocidad marca el anemómetro (ASI) sin corregir ningún error?", "opts": ["CAS", "IAS", "EAS", "TAS"], "ans": 1, "why": "«Velocidad indicada (IAS): es la velocidad que marca el anemómetro (ASI). Es la velocidad sin corrección por errores del indicador, posición, o compresibilidad». La CAS corrige los errores de posición e instrumento, la EAS además la compresibilidad, y la TAS es la velocidad respecto al aire. El examen real de 2026 preguntó qué velocidad indica el anemómetro sin correcciones.", "src": "Manual 9 (nov. 2026), capítulo 3.5, p. 6", "note": ""}, {"n": 164, "stem": "¿Cómo se llama la velocidad que da el mejor rendimiento de ascenso en configuración de aproximación, con un motor inoperativo y máxima potencia de despegue en el resto?", "opts": ["Ascenso en aterrizaje", "V_REF", "V2", "Ascenso en aproximación"], "ans": 3, "why": "«Ascenso en aproximación: la velocidad que proporciona el mejor rendimiento de ascenso en configuración de aproximación con un motor inoperativo, y con la máxima potencia de despegue en el motor operativo(s)». El ascenso en aterrizaje es en configuración de aterrizaje y con máxima potencia de despegue en todos los motores. El examen real de 2023 dio esta definición y pidió el nombre.", "src": "Manual 9 (nov. 2026), capítulo 11.3, pp. 22-23", "note": ""}, {"n": 165, "stem": "¿Qué fuerza se opone al empuje?", "opts": ["La resistencia", "El peso", "La sustentación", "La fuerza centrífuga"], "ans": 0, "why": "«La resistencia se opone al empuje y actúa hacia atrás, paralela al viento relativo». El peso se opone a la sustentación. El examen real de 2023 preguntó cuál es la fuerza opuesta al empuje.", "src": "Manual 9 (nov. 2026), capítulo 4.2, p. 8", "note": ""}, {"n": 166, "stem": "¿Cuáles son las superficies de control primarias con las que el piloto consigue el equilibrio del avión?", "opts": ["Alerones, timones de profundidad y spoilers", "Alerones, timones de profundidad y timón de dirección", "Alerones, flaps y timón de dirección", "Timones de profundidad, flaps y trim tabs"], "ans": 1, "why": "«Las superficies de control primarias con las que el piloto consigue el equilibrio del avión son tres»: timones de profundidad, alerones y timón de dirección. Slats, flaps, spoilers y trim tabs son «otros dispositivos que se engloban también en el grupo de mandos de vuelo». El examen real de 2023 preguntó por las superficies primarias con trim tabs, spoilers y flaps como distractores.", "src": "Manual 9 (nov. 2026), capítulo 10, pp. 18-19", "note": ""}, {"n": 167, "stem": "El timón de dirección controla la guiñada alrededor del eje:", "opts": ["longitudinal", "lateral", "vertical", "de charnela"], "ans": 2, "why": "«El timón de dirección controla el movimiento de guiñada alrededor del eje vertical». Alrededor del eje lateral se produce el cabeceo (timones de profundidad) y alrededor del longitudinal el alabeo (alerones). El examen real de 2023 puso como afirmación falsa que el timón de dirección controla la guiñada «alrededor del eje lateral».", "src": "Manual 9 (nov. 2026), capítulo 10, p. 18", "note": ""}, {"n": 168, "stem": "¿Cuál de las siguientes afirmaciones es correcta?", "opts": ["La corriente que circula por el extradós disminuye en velocidad y aumenta en presión, generando sustentación.", "El Mach crítico es el que hace que en un punto del intradós se alcance Mach 1.", "Lo mejor para evitar la pérdida de alta velocidad es aumentar el número de Mach.", "Para evitar el coffin corner, el piloto debe descender."], "ans": 3, "why": "«El piloto debe descender para ampliar el margen entre las velocidades de perdida y de ese modo evitarlo». A invierte el manual: la corriente del extradós «aumenta en velocidad y disminuye en presión». B: el Mach crítico se refiere a un punto del extradós. C: lo mejor es «reducir el número de Mach si es posible». El examen real de 2023 hizo esta misma pregunta de afirmaciones con estas inversiones.", "src": "Manual 9 (nov. 2026), capítulo 7.1, pp. 13-14", "note": ""}, {"n": 169, "stem": "¿Cuál de las siguientes afirmaciones sobre el despegue es correcta?", "opts": ["Las velocidades de despegue varían con el peso del avión.", "La pista requerida se basa en la posible pérdida de un motor a V_R, el punto más crítico.", "La distancia de despegue con todos los motores suele ser mayor que con un motor inoperativo.", "La distancia de aceleración-parada considera el uso de la inversión de empuje."], "ans": 0, "why": "«Las velocidades de despegue varían con el peso del avión». B: el punto más crítico «es a V1 (velocidad de decisión)». C: es «generalmente menor que la distancia de despegue con un motor inoperativo». D: en la aceleración-parada «no se considera el uso de la inversión de empuje». El examen real de 2023 preguntó con estas afirmaciones.", "src": "Manual 9 (nov. 2026), capítulo 11.2, pp. 21-22", "note": ""}, {"n": 170, "stem": "¿Cuál de las siguientes afirmaciones sobre los mandos de vuelo es correcta?", "opts": ["El timón de dirección está en el estabilizador vertical, cerca del borde de salida.", "Los timones de profundidad controlan el cabeceo alrededor del eje vertical.", "Los timones de profundidad se accionan pisando los pedales del timón.", "Los alerones se accionan con los pedales del timón."], "ans": 0, "why": "«El timón de dirección está localizado en el estabilizador vertical en la sección de cola y cerca del borde de salida». Los timones de profundidad controlan el cabeceo alrededor del eje lateral y se actúan empujando y tirando de la palanca; los alerones están en el borde de salida de las alas y se activan girando la palanca. El examen real de 2023 hizo dos preguntas de afirmaciones con estas frases.", "src": "Manual 9 (nov. 2026), capítulo 10, p. 18", "note": ""}, {"n": 171, "stem": "¿Cuál de las siguientes afirmaciones sobre la ISA es correcta?", "opts": ["Al nivel del mar tiene 15 ºC y 1023 hectopascales.", "Por encima de 36 000 pies la temperatura sigue bajando 2º cada 1000 pies.", "La temperatura disminuye 2º cada 1000 pies hasta 36 000 pies.", "Por encima de 36 000 pies la temperatura se considera constante, -56 ºC, hasta 50 000 pies."], "ans": 2, "why": "«La temperatura disminuye 2º cada 1000 pies de altitud (6,5ºC por km) [...] hasta 36000 pies. Por encima de este punto, la temperatura se considera constante, -56ºC, hasta los 80.000 pies». Al nivel del mar, 15 ºC y 1013 hectopascales.", "src": "Manual 9 (nov. 2026), capítulo 3.2, p. 4", "note": ""}, {"n": 172, "stem": "Señale la afirmación INCORRECTA sobre la altitud densidad.", "opts": ["La densidad del aire decrece cuando aumentan la temperatura, la altitud y la humedad.", "Cuando la altitud densidad es alta, las actuaciones de la aeronave aumentan.", "Es la altitud que correspondería en la ISA a una determinada densidad del aire.", "Alta temperatura, alta altitud y alta humedad hacen crítica la maniobra de despegue."], "ans": 1, "why": "«Cuando la densidad del aire decrece (altitud densidad alta) las actuaciones de la aeronave disminuyen». A, C y D son frases del manual.", "src": "Manual 9 (nov. 2026), capítulo 3.4, p. 6", "note": ""}, {"n": 173, "stem": "¿Qué velocidad es la IAS corregida por errores de posición y de instrumento?", "opts": ["EAS", "TAS", "CAS", "GS"], "ans": 2, "why": "«Velocidad calibrada (CAS): es la IAS corregida por errores de posición, y del instrumento». La EAS corrige además la compresibilidad.", "src": "Manual 9 (nov. 2026), capítulo 3.5, p. 6", "note": ""}, {"n": 174, "stem": "¿Cómo se llama el punto en que coinciden las velocidades de pérdida por alta y por baja velocidad?", "opts": ["Mach crítico", "Pérdida de alta velocidad", "Punto de bataneo", "Coffin corner"], "ans": 3, "why": "«El punto donde coinciden ambas velocidades es conocido como Coffin Corner». El Mach crítico es el que hace que en un punto del extradós se alcance Mach 1.", "src": "Manual 9 (nov. 2026), capítulo 7.1, p. 14", "note": ""}, {"n": 175, "stem": "¿Cómo se llama el cociente entre la envergadura y la cuerda media?", "opts": ["Estrechamiento", "Flecha", "Diedro", "Alargamiento"], "ans": 3, "why": "«El alargamiento es el cociente entre la envergadura y la cuerda media». El estrechamiento es el cociente entre la cuerda en el encastre y la cuerda en la punta.", "src": "Manual 9 (nov. 2026), capítulo 8, p. 15", "note": ""}, {"n": 176, "stem": "¿Cómo se llama el área en la prolongación de la pista, al menos de su misma anchura, que soporta el peso del avión y solo se usa para decelerar y frenar en un despegue abortado?", "opts": ["Stopway", "Clearway", "Zona de toma de contacto", "Franja de seguridad"], "ans": 0, "why": "«Stopway o zona de parada es un área en la prolongación de la pista, al menos de su misma anchura y que puede soportar el peso del avión [...] para que en caso de despegue abortado se pueda utilizar para deceleración y frenado». El clearway es la zona libre de obstáculos utilizable solo para la subida.", "src": "Manual 9 (nov. 2026), capítulo 11.2.1, p. 22", "note": ""}, {"n": 177, "stem": "Un avión tiene una V_SO (velocidad de pérdida en configuración de aterrizaje) de 110 kt. ¿Qué V_REF le corresponde?", "opts": ["126,5 kt", "132 kt", "143 kt", "115,5 kt"], "ans": 2, "why": "«VREF: 1,3 veces la velocidad de pérdida en configuración de aterrizaje»: 1,3 × 110 = 143 kt. 126,5 kt sería 1,15 V_SO (la V_TD), 132 kt 1,2 V_SO y 115,5 kt 1,05 V_SO.", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 22", "note": ""}, {"n": 178, "stem": "Con una V_SO de 100 kt, ¿qué velocidad de toma (V_TD) resulta?", "opts": ["105 kt", "120 kt", "130 kt", "115 kt"], "ans": 3, "why": "«VTD: velocidad de toma (touchdown) 1,15 veces la velocidad de pérdida en configuración de aterrizaje»: 1,15 × 100 = 115 kt. 130 kt sería la V_REF (1,3 V_SO).", "src": "Manual 9 (nov. 2026), capítulo 11.3, p. 22", "note": ""}, {"n": 179, "stem": "Con el gradiente de temperatura de la ISA que da el manual, ¿qué temperatura corresponde a 10 000 pies?", "opts": ["5 ºC", "-5 ºC", "-15 ºC", "-35 ºC"], "ans": 1, "why": "La ISA tiene 15 ºC al nivel del mar y «la temperatura disminuye 2º cada 1000 pies de altitud (6,5ºC por km)»: 15 − 2 × 10 = −5 ºC.", "src": "Manual 9 (nov. 2026), capítulo 3.2, p. 4", "note": ""}, {"n": 180, "stem": "Si la velocidad de pérdida V_S de un avión es 100 kt, ¿qué V_MCA mínima exige la fórmula del manual?", "opts": ["120 kt", "105 kt", "115 kt", "130 kt"], "ans": 0, "why": "El manual da V_MCA ≥ 1,2 V_S: 1,2 × 100 = 120 kt. El factor 1,05 es el de V_R frente a V_MC, 1,15 el de V_TD y 1,3 el de V_REF.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 20", "note": ""}, {"n": 181, "stem": "¿Cuál de estos factores figura en la lista del manual de los que afectan a los requerimientos de pista para el despegue?", "opts": ["La condición de la superficie de la pista", "La longitud de pista", "El uso de la inversión de empuje", "El gradiente o pendiente de pista"], "ans": 3, "why": "Los requerimientos de pista para el despegue son afectados por la altitud de presión, la temperatura, la componente de viento de frente, el gradiente o pendiente de pista y el peso del avión. La longitud de pista y la condición de su superficie figuran entre los detalles para el peso de aterrizaje (p. 23).", "src": "Manual 9 (nov. 2026), capítulo 11.2, p. 21", "note": ""}, {"n": 182, "stem": "¿Qué velocidad debe alcanzarse a 35 pies de altura al final de la distancia de pista requerida?", "opts": ["V_LOF", "V2", "V_R", "V_REF"], "ans": 1, "why": "«V2: velocidad de seguridad al despegue que se debe alcanzar a una altura 35 pies al final de la distancia de pista requerida». V_REF es la de 50 pies sobre el umbral en el aterrizaje.", "src": "Manual 9 (nov. 2026), capítulo 11.1, p. 21", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/09-aerodinamica-mecanica/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}ca     d.innerHTML=`<div class="qn">Q${q.n}</div><div class="stem">${q.stem}</div>`;
    idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
