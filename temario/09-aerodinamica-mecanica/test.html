<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Aerodinámica y mecánica del vuelo</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

const Q=[{"n": 1, "stem": "Según el manual de ENAIRE, la aerodinámica es:", "opts": ["la ciencia aplicada que estudia el movimiento de los vehículos voladores", "la rama de la mecánica de fluidos que calcula las acciones sobre los cuerpos sólidos cuando existe un movimiento relativo entre estos y el fluido", "la ciencia que estudia la atmósfera y sus capas", "la rama de la mecánica que estudia la estructura de las aeronaves"], "ans": 1, "why": "El manual define la aerodinámica como la rama de la mecánica de fluidos especializada en el cálculo de las acciones que aparecen sobre los cuerpos sólidos cuando existe un movimiento relativo entre estos y el fluido en el que se desplazan. La opción A es su definición de la mecánica de vuelo.", "src": "Manual §2, p. 3", "note": ""}, {"n": 2, "stem": "En el manual, la mecánica de vuelo se limita al estudio de:", "opts": ["el movimiento de las aeronaves en el espacio", "el diseño del ala", "el movimiento de los helicópteros", "el movimiento atmosférico de los aviones"], "ans": 3, "why": "La mecánica de vuelo se define como la ciencia aplicada que se ocupa del estudio del movimiento de los vehículos voladores, y el documento se centra únicamente en el movimiento atmosférico de los aviones.", "src": "Manual §2, p. 3", "note": ""}, {"n": 3, "stem": "El teorema de Bernoulli establece que, en un punto cualquiera de un fluido:", "opts": ["P + 1/2 ρ V^2 es constante, de modo que, si aumenta la velocidad, disminuye la presión", "P + 1/2 ρ V^2 es constante, de modo que, si aumenta la velocidad, aumenta la presión", "P x ρ x V es constante", "P / V^2 es constante"], "ans": 0, "why": "La suma de la presión más la mitad del producto de la densidad por el cuadrado de la velocidad es constante; si una partícula aumenta su velocidad, será a costa de disminuir su presión.", "src": "Manual §3.1, pp. 3-4", "note": ""}, {"n": 4, "stem": "En el tubo Venturi que muestra el manual, la sección S2 es más estrecha que S1. Por tanto:", "opts": ["V2 &lt; V1 y P2 &lt; P1", "V2 &lt; V1 y P2 &gt; P1", "V2 &gt; V1 y P2 &lt; P1", "V2 &gt; V1 y P2 &gt; P1"], "ans": 2, "why": "En la sección estrecha la velocidad es mayor y, para mantener constante la suma de Bernoulli con densidad constante, disminuye la presión.", "src": "Manual §3.1, p. 4 (figura)", "note": ""}, {"n": 5, "stem": "La OACI definió la atmósfera estándar internacional (ISA) al nivel del mar como aquella que tiene:", "opts": ["15 °C y 1023 hPa", "15 °C y 1013 hPa", "0 °C y 1013 hPa", "20 °C y 1000 hPa"], "ans": 1, "why": "El manual indica 15 °C de temperatura y 1013 hectopascales de presión al nivel del mar.", "src": "Manual §3.2, p. 4", "note": ""}, {"n": 6, "stem": "Según el manual, la temperatura ISA disminuye con la altitud a razón de:", "opts": ["1 grado por cada 1000 pies hasta 36 000 pies", "3 grados por cada 1000 pies hasta 36 000 pies", "2 grados por cada 1000 pies hasta 25 000 pies", "2 grados por cada 1000 pies (6,5 °C por km) hasta 36 000 pies"], "ans": 3, "why": "El gradiente de temperatura es de 2 grados cada 1000 pies (6,5 °C por km) hasta 36 000 pies.", "src": "Manual §3.2, p. 4", "note": ""}, {"n": 7, "stem": "Según el manual, por encima de 36 000 pies la temperatura ISA se considera constante e igual a:", "opts": ["-56 °C, hasta 80 000 pies", "-56 °C, hasta 60 000 pies", "-60 °C, hasta 80 000 pies", "-40 °C, hasta 100 000 pies"], "ans": 0, "why": "El texto dice que por encima de ese punto la temperatura se considera constante, -56 °C, hasta los 80 000 pies.", "src": "Manual §3.2, p. 4", "note": ""}, {"n": 8, "stem": "¿Por qué todos los instrumentos de las aeronaves están calibrados para la atmósfera estándar?", "opts": ["Porque la atmósfera es siempre estándar en los niveles de vuelo", "Porque la OACI prohíbe otras calibraciones", "Porque las performances de las aeronaves se comparan y evalúan con respecto a la atmósfera estándar", "Porque la presión al nivel del mar es constante"], "ans": 2, "why": "El manual da exactamente este motivo: «Debido a que las performances de las aeronaves se comparan y evalúan con respecto a la atmósfera estándar, todos los instrumentos están calibrados para la atmósfera estándar».", "src": "Manual §3.2, p. 5", "note": ""}, {"n": 9, "stem": "La altitud de presión es la altitud indicada por el altímetro cuando está ajustado a:", "opts": ["el QNH del aeródromo", "el QFE del aeródromo", "la presión del nivel de transición", "1013 hectopascales"], "ans": 3, "why": "El manual dice: «Si el altímetro está ajustado para 1013 hectopascales, la altitud indicada es la altitud de presión».", "src": "Manual §3.3, p. 5", "note": ""}, {"n": 10, "stem": "¿Qué dos usos de la altitud de presión menciona el manual?", "opts": ["El cálculo del viento y la planificación del combustible", "Determinar la performance del avión y asignar niveles de vuelo por encima del nivel de transición", "Determinar la velocidad sobre el suelo y la base de las nubes", "Calibrar el tubo pitot y el aviso de pérdida"], "ans": 1, "why": "La altitud de presión es la base para determinar la performance del avión y para la asignación de niveles de vuelo a los aviones que operan por encima de un determinado nivel (nivel de transición).", "src": "Manual §3.3, p. 6", "note": ""}, {"n": 11, "stem": "La densidad del aire disminuye cuando:", "opts": ["aumentan la temperatura, la altitud y la humedad", "aumenta la temperatura y disminuyen la altitud y la humedad", "disminuye la temperatura y aumenta la altitud", "disminuye la humedad y aumenta la temperatura"], "ans": 0, "why": "El manual establece que la densidad del aire decrece cuando la temperatura, la altitud y la humedad aumentan.", "src": "Manual §3.4, p. 6", "note": ""}, {"n": 12, "stem": "Según el manual, ¿qué combinación hace crítica la maniobra de despegue?", "opts": ["Baja temperatura, baja altitud y alta humedad", "Alta temperatura, baja altitud y baja humedad", "Alta temperatura, alta altitud y alta humedad", "Baja temperatura, alta altitud y baja humedad"], "ans": 2, "why": "Una altitud densidad alta (aire caliente, en altitud y húmedo) reduce la potencia del motor, el empuje y la sustentación, lo que hace crítico el despegue.", "src": "Manual §3.4, p. 6", "note": ""}, {"n": 13, "stem": "¿Cuál NO es uno de los tres factores con los que, según el manual, está relacionada la altitud densidad?", "opts": ["La potencia del motor", "El empuje (eficiencia de la hélice)", "La capacidad de sustentación", "La calibración del anemómetro"], "ans": 3, "why": "Los tres factores son la potencia del motor, el empuje y la capacidad de sustentación; la calibración del anemómetro no figura entre ellos.", "src": "Manual §3.4, p. 6", "note": ""}, {"n": 14, "stem": "La velocidad verdadera (TAS) es:", "opts": ["la velocidad que marca el anemómetro", "la velocidad del avión respecto al aire en el que vuela", "la velocidad del avión respecto al suelo", "la IAS corregida por compresibilidad"], "ans": 1, "why": "La TAS es la velocidad respecto a la masa de aire. La opción A es la IAS, la C es la velocidad sobre el suelo y la D es (aproximadamente) la EAS.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 15, "stem": "La velocidad indicada (IAS) es la velocidad:", "opts": ["que marca el anemómetro, sin corrección por errores del indicador, de posición o de compresibilidad", "corregida por errores de posición y de instrumento", "respecto al suelo", "que es igual a la TAS a cualquier altitud"], "ans": 0, "why": "La IAS es la lectura sin corregir. La opción B es la CAS.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 16, "stem": "La velocidad calibrada (CAS) es:", "opts": ["la IAS corregida solo por compresibilidad", "la TAS dividida por el número de Mach", "la IAS corregida por errores de posición y de instrumento", "la suma vectorial de la TAS y el viento"], "ans": 2, "why": "La CAS corrige los errores de instrumento y de posición; el manual añade que la CAS es igual a la TAS al nivel del mar en atmósfera estándar.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 17, "stem": "¿Qué velocidad se obtiene una vez corregidos los errores de instrumento, de posición Y de compresibilidad?", "opts": ["IAS", "CAS", "GS", "EAS"], "ans": 3, "why": "La velocidad equivalente (EAS) corrige además la compresibilidad; es igual a la CAS al nivel del mar en atmósfera estándar.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 18, "stem": "La velocidad sobre el suelo (GS) es:", "opts": ["la TAS corregida por altitud", "la suma vectorial de la velocidad verdadera y la velocidad del viento", "la IAS corregida por temperatura", "la velocidad del sonido a la altitud de la aeronave"], "ans": 1, "why": "El manual define la GS como la velocidad del avión respecto al suelo, resultado de la suma vectorial de la velocidad verdadera y la velocidad del viento.", "src": "Manual §3.5, p. 6", "note": ""}, {"n": 19, "stem": "Según el manual, ¿por encima de qué velocidad el error de compresibilidad del anemómetro se hace apreciable?", "opts": ["250 kt", "150 kt", "350 kt", "Mach 0,82"], "ans": 0, "why": "Por encima de 250 kt la variación de la densidad es apreciable.", "src": "Manual §3.5.1, p. 7", "note": ""}, {"n": 20, "stem": "El número de Mach es la relación entre:", "opts": ["la velocidad indicada y la velocidad del sonido", "la velocidad sobre el suelo y la velocidad del sonido", "la velocidad verdadera y la velocidad del sonido", "la velocidad calibrada y la velocidad verdadera"], "ans": 2, "why": "M = V/c, donde V es la TAS y c la velocidad del sonido.", "src": "Manual §3.5, p. 7", "note": ""}, {"n": 21, "stem": "En la tabla ISA del manual, la velocidad del sonido a 40 000 pies es:", "opts": ["661,5 kt", "614,3 kt", "589,3 kt", "573,6 kt"], "ans": 3, "why": "A partir de 38 000 pies la temperatura es constante (-56,5 °C) y la velocidad del sonido se mantiene en 573,6 kt; 661,5 kt es el valor al nivel del mar.", "src": "Manual §3.2, p. 5 (tabla)", "note": ""}, {"n": 22, "stem": "En vuelo recto y nivelado, las cuatro fuerzas que actúan sobre el avión son:", "opts": ["sustentación, peso, resistencia y empuje, equilibradas", "sustentación, peso, resistencia y empuje, desequilibradas", "sustentación, peso, resistencia y fuerza centrífuga", "sustentación, peso, empuje y gravedad"], "ans": 0, "why": "El manual enumera el empuje, el peso, la resistencia y la sustentación, equilibradas entre ellas en vuelo recto y nivelado.", "src": "Manual §4, p. 7", "note": ""}, {"n": 23, "stem": "En la fórmula de la sustentación L = C_L q S del manual, q es:", "opts": ["la presión dinámica 1/2 ρ V^2", "la presión estática", "el caudal", "el factor de carga"], "ans": 0, "why": "q es la presión dinámica, igual a la mitad de la densidad por el cuadrado de la velocidad.", "src": "Manual §4, p. 8", "note": ""}, {"n": 24, "stem": "El coeficiente de sustentación C_L depende, para cada perfil, de:", "opts": ["la superficie alar", "solo la temperatura del aire", "el ángulo de ataque", "el peso de la aeronave"], "ans": 2, "why": "El manual establece que el coeficiente de sustentación depende, para cada perfil, del ángulo de ataque.", "src": "Manual §4, p. 8", "note": ""}, {"n": 25, "stem": "El coeficiente de resistencia C_D es, según el manual:", "opts": ["la suma del coeficiente de sustentación y el coeficiente de empuje", "la diferencia entre la resistencia parásita y la inducida", "el producto de los coeficientes parásito e inducido", "la suma del coeficiente de resistencia parásita y el coeficiente de resistencia inducida"], "ans": 3, "why": "El manual dice que el coeficiente de resistencia es la suma del coeficiente de resistencia parásita y el coeficiente de resistencia inducida.", "src": "Manual §4.2, p. 8", "note": ""}, {"n": 26, "stem": "Si el empuje excede a la resistencia, el manual dice que:", "opts": ["la aeronave desciende porque disminuye la sustentación", "la aeronave acelera, la sustentación aumenta y la aeronave asciende", "la aeronave mantiene constante su velocidad", "la aeronave decelera y entra en pérdida"], "ans": 1, "why": "Más empuje que resistencia aumenta la velocidad, lo que incrementa la sustentación, y el avión sube. Lo contrario (la resistencia excede al empuje) produce deceleración y descenso.", "src": "Manual §4.3, p. 9", "note": ""}, {"n": 27, "stem": "La intensidad de los torbellinos de punta de ala es:", "opts": ["directamente proporcional al peso e inversamente proporcional a la envergadura y a la velocidad", "inversamente proporcional al peso y directamente proporcional a la velocidad", "directamente proporcional a la envergadura y a la velocidad", "independiente del peso"], "ans": 0, "why": "El manual establece que es directamente proporcional al peso de la aeronave e inversamente proporcional a la envergadura y a la velocidad.", "src": "Manual §5, p. 10", "note": ""}, {"n": 28, "stem": "El torbellino de punta de ala empieza a formarse:", "opts": ["en el momento de arrancar los motores", "en el momento de replegar el tren de aterrizaje", "en la rotación, cuando las ruedas de proa dejan de hacer contacto con la pista", "cuando la aeronave alcanza V2"], "ans": 2, "why": "Empieza en la rotación (las ruedas de proa dejan de hacer contacto con la pista) y termina cuando dichas ruedas hacen contacto con el suelo en el aterrizaje.", "src": "Manual §5, p. 10", "note": ""}, {"n": 29, "stem": "La intensidad del torbellino alcanza su valor máximo cuando la aeronave que lo genera está:", "opts": ["ligera, en configuración de aterrizaje y rápida", "pesada, en configuración de aterrizaje y lenta", "ligera, en configuración limpia y lenta", "pesada, en configuración limpia y lenta"], "ans": 3, "why": "El manual: «alcanza su valor máximo cuando la aeronave que lo genera es PESADA, en configuración limpia, y lenta».", "src": "Manual §5, p. 11", "note": ""}, {"n": 30, "stem": "El peligro más grave para una aeronave que penetra en la zona de estela turbulenta es:", "opts": ["la pérdida de potencia del motor", "el balanceo inducido, cuando su violencia sobrepasa la eficacia de sus mandos", "el aumento de la velocidad de pérdida", "la formación de hielo en las alas"], "ans": 1, "why": "El manual identifica el balanceo inducido como el peligro más grave.", "src": "Manual §5, p. 10", "note": ""}, {"n": 31, "stem": "El efecto suelo produce:", "opts": ["una disminución de la resistencia y un aumento de la sustentación", "un aumento de la resistencia y una disminución de la sustentación", "un aumento tanto de la resistencia como de la sustentación", "una disminución tanto de la resistencia como de la sustentación"], "ans": 0, "why": "Cerca del suelo cambian las características aerodinámicas: menor resistencia al avance y mayor sustentación.", "src": "Manual §5.1, p. 11", "note": ""}, {"n": 32, "stem": "El efecto suelo es mayor cuando:", "opts": ["la aeronave está más alta y su envergadura es menor", "la aeronave está más alta y su envergadura es mayor", "la aeronave está más cerca del suelo y su envergadura es mayor", "la aeronave está más cerca del suelo y su envergadura es menor"], "ans": 2, "why": "El efecto es mayor cuanto más cercano esté el avión al suelo y mayor sea su envergadura.", "src": "Manual §5.1, p. 12", "note": ""}, {"n": 33, "stem": "La Figura 5 del manual (viraje coordinado a altura constante) muestra una gravedad de 1 G, una fuerza centrífuga de 1,73 Gs y un factor de carga de:", "opts": ["1,41 Gs", "1,73 Gs", "2,73 Gs", "2 Gs"], "ans": 3, "why": "La resultante de 1 G y 1,73 Gs es de 2 Gs (60 grados de alabeo).", "src": "Manual §6, p. 12 (Figura 5)", "note": ""}, {"n": 34, "stem": "Para hacer un viraje manteniendo la altura, la sustentación total debe:", "opts": ["disminuir, ya que el peso es menor", "aumentar hasta que su componente vertical iguale al peso", "mantenerse igual", "ser sustituida por la fuerza centrífuga"], "ans": 1, "why": "En viraje solo la componente vertical de la sustentación equilibra el peso, por lo que la sustentación total debe aumentar.", "src": "Manual §6, p. 12", "note": ""}, {"n": 35, "stem": "La pérdida de una aeronave resulta de:", "opts": ["una rápida disminución de la sustentación causada por la separación del flujo de aire al exceder el ángulo de ataque crítico", "un exceso de empuje", "la pérdida de potencia del motor", "la superación de la velocidad máxima"], "ans": 0, "why": "El manual define la pérdida como una rápida disminución de la sustentación causada por la separación del flujo de aire de la superficie superior del ala al exceder el ángulo de ataque crítico.", "src": "Manual §7, p. 13", "note": ""}, {"n": 36, "stem": "Según el manual, cuando estamos a mayor altitud:", "opts": ["la velocidad de pérdida es menor porque la densidad es menor", "la velocidad de pérdida no cambia", "la velocidad de pérdida es mayor porque la densidad disminuye", "el ángulo de ataque de pérdida disminuye"], "ans": 2, "why": "El manual dice que la velocidad de pérdida Vs depende de la densidad del aire; a mayor altitud la densidad disminuye y la velocidad de pérdida es mayor.", "src": "Manual §7, p. 13", "note": ""}, {"n": 37, "stem": "Un valor típico del coeficiente de sustentación en crucero, mencionado en el manual, es:", "opts": ["C_L = 0,04", "C_L = 4,0", "C_L = 1,4", "C_L = 0,4"], "ans": 3, "why": "En crucero, con velocidad elevada, el C_L no precisa ser muy grande; un valor típico es 0,4.", "src": "Manual §7, p. 13", "note": ""}, {"n": 38, "stem": "El bataneo (buffet) es:", "opts": ["el ruido del aviso de pérdida", "una fuerte vibración antes de entrar en pérdida, porque no todas las zonas del ala entran en pérdida a la vez", "la vibración de los motores en el despegue", "la oscilación en la onda de choque"], "ans": 1, "why": "La nota 1 del manual define el bataneo así: «una fuerte vibración que se produce antes de entrar en pérdida. Es debido a que no todas las zonas del ala entran en pérdida a la vez».", "src": "Manual §7, p. 13 (nota 1)", "note": ""}, {"n": 39, "stem": "El aviso de pérdida (stick shaker o aerodinámico) debe experimentarse, según el manual, a una velocidad:", "opts": ["un 7 % por encima de la pérdida", "un 15 % por encima de la pérdida", "de 1,3 veces V_REF", "un 7 % por debajo de la pérdida"], "ans": 0, "why": "El manual establece que el aviso debe experimentarse a una velocidad un 7 % por encima de la pérdida.", "src": "Manual §7, p. 13", "note": ""}, {"n": 40, "stem": "El coffin corner es:", "opts": ["el punto donde coinciden V1 y V_R", "el punto donde la aeronave alcanza Mach 1", "el punto donde coinciden las velocidades de pérdida por alta velocidad y por baja velocidad", "la esquina de la envolvente de vuelo con el factor de carga máximo"], "ans": 2, "why": "Los reactores comerciales que vuelan a gran altura pueden tener, en función de su peso, un margen muy pequeño entre las velocidades de pérdida por alta velocidad y por baja velocidad; el punto donde coinciden ambas es el coffin corner.", "src": "Manual §7.1, p. 14", "note": ""}, {"n": 41, "stem": "¿Qué debe hacer el piloto para evitar el coffin corner?", "opts": ["Aumentar el número de Mach", "Extender los flaps", "Ascender a un nivel superior", "Descender para ampliar el margen entre las velocidades de pérdida"], "ans": 3, "why": "El manual dice que el piloto debe descender para ampliar el margen entre las velocidades de pérdida y de ese modo evitarlo.", "src": "Manual §7.1, p. 14", "note": ""}, {"n": 42, "stem": "El Mach crítico es el número de Mach que:", "opts": ["hace que la aeronave entre en pérdida a baja velocidad", "hace que se alcance Mach 1 en un punto del extradós, dando lugar a una onda de choque", "es igual a la velocidad del sonido al nivel del mar", "corresponde a la velocidad máxima de operación"], "ans": 1, "why": "«El número de Mach que hace que en un punto del extradós se alcance Mach 1 se llama Mach crítico y dará lugar a una onda de choque», con la aparición de una nueva resistencia.", "src": "Manual §7.1, p. 14", "note": ""}, {"n": 43, "stem": "El alargamiento de un ala es:", "opts": ["el cociente entre la envergadura y la cuerda media", "el cociente entre la cuerda en el encastre y la cuerda en la punta", "el producto de la envergadura por la cuerda media", "el ángulo entre las alas y el eje transversal"], "ans": 0, "why": "Envergadura/cuerda media; B es el estrechamiento, C es la superficie alar y D es la flecha.", "src": "Manual §8, p. 15", "note": ""}, {"n": 44, "stem": "El estrechamiento de un ala es el cociente entre:", "opts": ["la envergadura y la cuerda media", "la superficie alar y la envergadura", "la cuerda en el encastre y la cuerda en la punta del ala", "la cuerda media y la envergadura"], "ans": 2, "why": "Estrechamiento = cuerda en el encastre / cuerda en la punta.", "src": "Manual §8, p. 15", "note": ""}, {"n": 45, "stem": "La cuerda media es la cuerda que:", "opts": ["une el borde de ataque y el borde de salida", "es equidistante del intradós y del extradós", "se mide en la punta del ala", "multiplicada por la envergadura es igual a la superficie alar"], "ans": 3, "why": "Como en general la cuerda disminuye a medida que nos alejamos del encastre, se define la cuerda media como aquella que multiplicada por la envergadura es igual a la superficie alar. La opción A es la cuerda y la B, la línea de curvatura media.", "src": "Manual §8, p. 15", "note": ""}, {"n": 46, "stem": "El manual da como valores típicos del alargamiento:", "opts": ["1-2 en planeadores y 10 en aviones rápidos", "3-4 en aviones muy rápidos y 25-30 en planeadores", "25-30 en aviones rápidos y 3-4 en planeadores", "10-12 en todos los aviones"], "ans": 1, "why": "«Del orden de 3-4 en aviones muy rápidos a 25-30 en los planeadores».", "src": "Manual §8, p. 15", "note": ""}, {"n": 47, "stem": "Un ala con flecha positiva (progresiva) tiene:", "opts": ["los extremos hacia delante", "los extremos a la altura del encastre", "los extremos hacia atrás", "los extremos hacia arriba"], "ans": 2, "why": "La flecha positiva/progresiva tiene los extremos de las alas orientados hacia atrás; la negativa/regresiva, adelantados.", "src": "Manual §8, pp. 15-16 (Figura 7)", "note": ""}, {"n": 48, "stem": "El ángulo de ataque es el ángulo agudo formado por:", "opts": ["la cuerda y la dirección del viento relativo", "el horizonte y el eje longitudinal", "las alas y el eje lateral", "la cuerda y la línea de curvatura media"], "ans": 0, "why": "El manual: el ángulo agudo formado por la cuerda del ala y la dirección del viento relativo.", "src": "Manual §8, p. 16", "note": ""}, {"n": 49, "stem": "En un perfil simétrico:", "opts": ["la línea de curvatura media está por encima de la cuerda y hay sustentación con ángulo de ataque cero", "hay sustentación con ángulo de ataque cero", "la cuerda es más larga que la línea de curvatura media", "la cuerda y la línea de curvatura media coinciden y no hay sustentación con ángulo de ataque cero"], "ans": 3, "why": "En un perfil simétrico coinciden y no se genera sustentación con ángulo de ataque cero; en un perfil asimétrico autosustentador, la línea de curvatura media está por encima de la cuerda.", "src": "Manual §8, p. 15", "note": ""}, {"n": 50, "stem": "¿Qué eje pasa por el CG hacia el morro y qué movimiento se produce alrededor de él?", "opts": ["Eje lateral, cabeceo", "Eje longitudinal, balanceo o alabeo (roll)", "Eje vertical, guiñada", "Eje longitudinal, cabeceo"], "ans": 1, "why": "El balanceo o alabeo se produce alrededor del eje longitudinal y se controla con los alerones.", "src": "Manual §9, p. 17", "note": ""}, {"n": 51, "stem": "En el manual, el sentido positivo del eje vertical es:", "opts": ["hacia arriba", "hacia el morro", "hacia abajo", "hacia el ala derecha"], "ans": 2, "why": "El eje vertical tiene su sentido positivo hacia abajo; el longitudinal, hacia el morro, y el lateral, hacia el ala derecha.", "src": "Manual §9, p. 17", "note": ""}, {"n": 52, "stem": "Los timones de profundidad (elevators) están situados:", "opts": ["en el borde de salida del estabilizador horizontal y controlan el cabeceo", "en el estabilizador vertical y controlan la guiñada", "en el borde de salida de las alas y controlan el alabeo", "en el borde de ataque de las alas y controlan el cabeceo"], "ans": 0, "why": "Los timones de profundidad están en el borde de salida del estabilizador horizontal y controlan el cabeceo alrededor del eje lateral, empujando y tirando de la palanca.", "src": "Manual §10, p. 18", "note": ""}, {"n": 53, "stem": "Los alerones se accionan:", "opts": ["con los pedales del timón de dirección", "empujando y tirando de la palanca", "con la rueda de compensación", "girando la palanca o el mando a izquierda y derecha"], "ans": 3, "why": "Los alerones, situados en el borde de salida de las alas, controlan el balanceo/alabeo y se activan girando la palanca o mando a izquierda y derecha.", "src": "Manual §10, p. 18", "note": ""}, {"n": 54, "stem": "Los slats están situados en:", "opts": ["el borde de salida del ala", "el borde de ataque del ala", "el extradós, cerca del encastre", "el estabilizador horizontal"], "ans": 1, "why": "Los slats están en el borde de ataque y los flaps en el borde de salida. Ambos son dispositivos hipersustentadores que aumentan el valor de C_Lmax.", "src": "Manual §10, p. 19", "note": ""}, {"n": 55, "stem": "Los spoilers, cuando se deflectan asimétricamente, funcionan como:", "opts": ["aerofrenos", "dispositivos hipersustentadores", "mandos de alabeo a altas velocidades", "mandos de guiñada a bajas velocidades"], "ans": 2, "why": "Deflexión simétrica = aerofrenos; asimétrica = mandos de alabeo a altas velocidades.", "src": "Manual §10, p. 19", "note": ""}, {"n": 56, "stem": "El trim tab (tab de compensación) se deflecta:", "opts": ["en dirección opuesta al control primario, para anular el momento de charnela y el esfuerzo sobre el mando", "en la misma dirección que el control primario, para aumentar la sustentación", "solo en los alerones", "simétricamente, para aumentar la resistencia"], "ans": 0, "why": "El tab se deflecta en dirección opuesta al control primario y se utiliza para anular el momento de charnela y, por tanto, la fuerza en palanca o mando de vuelo.", "src": "Manual §10, p. 19", "note": ""}, {"n": 57, "stem": "El eje de charnela es:", "opts": ["el eje del fuselaje", "el eje que pasa por el centro de gravedad", "la línea del encastre del ala", "el eje de rotación del mando primario (por ejemplo, el timón de profundidad)"], "ans": 3, "why": "El manual lo define como el eje de rotación del mando primario.", "src": "Manual §10, p. 19", "note": ""}, {"n": 58, "stem": "La guiñada provocada por un fallo de motor a V_MCG, si se decide continuar el despegue, debe controlarse:", "opts": ["con la dirección de la rueda de morro y los frenos", "únicamente con los controles aerodinámicos, es decir, con el timón de dirección", "solo reduciendo el empuje de los demás motores", "utilizando la inversión de empuje"], "ans": 1, "why": "Las normas dicen que esta guiñada adversa se debe controlar haciendo uso únicamente de los controles aerodinámicos, es decir, del timón de dirección.", "src": "Manual §11.1, p. 20", "note": ""}, {"n": 59, "stem": "¿Qué fórmula da el manual para la velocidad mínima de control en el aire?", "opts": ["V_MCA &lt;= 1,13 V_S", "V_MCA &gt;= V1", "V_MCA &gt;= 1,2 V_S", "V_MCA &gt;= 1,05 V_R"], "ans": 2, "why": "El manual imprime V_MCA &gt;= 1,2 V_S.", "src": "Manual §11.1, p. 20", "note": ""}, {"n": 60, "stem": "V1, la velocidad de decisión, es la velocidad a la que el piloto:", "opts": ["decide si continúa el despegue (después de V1) o lo aborta (antes de V1)", "inicia la rotación", "repliega el tren de aterrizaje", "alcanza los 35 pies sobre la pista"], "ans": 0, "why": "Antes de V1 abortará y después continuará el despegue. El manual da también V1 &gt;= V_MCG.", "src": "Manual §11.1, p. 20", "note": ""}, {"n": 61, "stem": "La velocidad de rotación V_R no puede ser inferior a:", "opts": ["V2 o 1,2 V_S", "V_MCG o 1,3 V_S", "V1 o 1,15 V_MC", "V1 o 1,05 V_MC"], "ans": 3, "why": "V_R &gt;= V1 y V_R &gt;= 1,05 V_MC.", "src": "Manual §11.1, p. 20", "note": ""}, {"n": 62, "stem": "¿A qué altura debe alcanzarse V2, al final de la distancia de pista requerida?", "opts": ["15 pies", "35 pies", "50 pies", "400 pies"], "ans": 1, "why": "V2 se alcanza a una altura de 35 pies (10,7 m). Los 50 pies son la altura de V_REF en el aterrizaje y los 400 pies, la altura mínima hasta la que se mantiene V2.", "src": "Manual §11.1, p. 21", "note": ""}, {"n": 63, "stem": "V2 debe mantenerse hasta después de franquear los obstáculos, o hasta por lo menos:", "opts": ["35 pies sobre el suelo", "50 pies sobre el suelo", "400 pies sobre el suelo", "1500 pies sobre el suelo"], "ans": 2, "why": "El manual dice: «o hasta por lo menos 400 pies por encima del suelo».", "src": "Manual §11.1, p. 21", "note": ""}, {"n": 64, "stem": "¿Cuál de los siguientes NO es uno de los factores que afectan, según el manual, a los requerimientos de pista para el despegue?", "opts": ["La altitud de presión", "La componente de viento de frente", "El peso del avión", "La condición de la superficie de la pista"], "ans": 3, "why": "Los cinco factores son la altitud de presión, la temperatura, la componente de viento de frente, el gradiente o pendiente de pista y el peso del avión. La condición de la superficie de la pista aparece en la lista del aterrizaje.", "src": "Manual §11.2, p. 21 y §11.4, p. 23", "note": ""}, {"n": 65, "stem": "El peso de despegue de la aeronave tiene que adaptarse a:", "opts": ["la más corta de tres distancias", "la media de tres distancias", "solo la distancia de aceleración-parada", "la más larga de tres distancias"], "ans": 3, "why": "Por regulación, el peso de despegue tiene que adaptarse a la más larga de las tres distancias: de aceleración-despegue, de aceleración-parada y de despegue con todos los motores operativos.", "src": "Manual §11.2, p. 21", "note": ""}, {"n": 66, "stem": "La distancia de aceleración-parada es la distancia necesaria para acelerar hasta V1, sufrir un fallo de motor y detenerse:", "opts": ["utilizando los frenos y la inversión de empuje", "utilizando solo la acción de los frenos (no se considera el uso de la inversión de empuje)", "utilizando solo la inversión de empuje", "utilizando conjuntamente la zona de parada y el clearway"], "ans": 1, "why": "El manual dice que se utiliza solo la acción de los frenos y que no se considera el uso de la inversión de empuje.", "src": "Manual §11.2, p. 22", "note": ""}, {"n": 67, "stem": "Según el manual, la distancia de despegue hasta 35 pies con todos los motores operativos debe ser:", "opts": ["igual a la distancia con un motor inoperativo", "por lo menos un 15 % mayor que la distancia de aceleración-parada", "por lo menos un 15 % menor que la distancia requerida para un despegue con un motor inoperativo", "un 50 % menor que la distancia de aceleración-despegue"], "ans": 2, "why": "Es la redacción del manual: «por lo menos 15 por ciento menos que la distancia requerida para un despegue con un motor inoperativo»; normalmente no es un factor limitante porque suele ser menor que la distancia con un motor inoperativo.", "src": "Manual §11.2, p. 22", "note": ""}, {"n": 68, "stem": "Un stopway (zona de parada) es:", "opts": ["un área en la prolongación de la pista, al menos de su misma anchura, que puede soportar el peso del avión y se utiliza para frenar en un despegue abortado", "un área libre de obstáculos utilizable solo para la subida", "una calle de rodaje que lleva al umbral", "la parte de la pista utilizada para el aterrizaje"], "ans": 0, "why": "Stopway = longitud adicional a la pista para frenar en un despegue abortado; B es el clearway.", "src": "Manual §11.2.1, p. 22", "note": ""}, {"n": 69, "stem": "El clearway es:", "opts": ["un área utilizada para frenar tras un despegue abortado", "los primeros 300 m de la pista", "el área con la superficie más resistente", "una zona en la prolongación del eje de la pista, libre de obstáculos, utilizable solo para la subida"], "ans": 3, "why": "El manual dice que el clearway proporciona espacio adicional utilizable solo para la subida (el agua del mar, por ejemplo) y que se considera que empieza al final de la pista, tanto si hay stopway como si no.", "src": "Manual §11.2.1, p. 22", "note": ""}, {"n": 70, "stem": "La velocidad de referencia de aterrizaje V_REF es, según el manual:", "opts": ["1,15 veces la velocidad de pérdida en configuración de aterrizaje, en el umbral", "1,3 veces la velocidad de pérdida en configuración de aterrizaje, a 50 pies sobre el umbral", "1,3 veces la velocidad de pérdida en configuración de aterrizaje, a 35 pies sobre el umbral", "1,05 veces V_MC a 50 pies"], "ans": 1, "why": "V_REF = 1,3 V_SO a 50 pies (15,2 m) sobre el umbral de la pista (Figura 13).", "src": "Manual §11.3, p. 22 y Figura 13, p. 23", "note": ""}, {"n": 71, "stem": "La velocidad de toma (touchdown) V_TD es, según el manual:", "opts": ["1,3 veces V_SO", "1,05 veces V_SO", "1,15 veces la velocidad de pérdida en configuración de aterrizaje", "igual a V_SO"], "ans": 2, "why": "V_TD = 1,15 veces la velocidad de pérdida en configuración de aterrizaje.", "src": "Manual §11.3, p. 22", "note": ""}, {"n": 72, "stem": "El peso máximo de aterrizaje permitido será el menor de los pesos dictados por:", "opts": ["los requisitos de pista de aterrizaje y los requisitos de ascenso en aproximación", "el peso de despegue y el peso del combustible", "la distancia de aceleración-parada y la distancia de despegue", "solo la temperatura y el viento"], "ans": 0, "why": "El manual: el menor de los pesos según lo dictado por los requisitos de pista de aterrizaje y los requisitos de ascenso en aproximación.", "src": "Manual §11.4, p. 23", "note": ""}, {"n": 73, "stem": "¿Qué factor se incluye entre los del peso de aterrizaje pero NO entre los de los requerimientos de pista para el despegue del manual?", "opts": ["La altitud de presión", "La temperatura", "El gradiente o pendiente de pista", "La condición de la superficie de la pista"], "ans": 3, "why": "Factores del aterrizaje: altitud de presión, temperatura, componente de viento en contra, longitud de pista, gradiente y condición de la superficie de la pista. Factores del despegue: altitud de presión, temperatura, componente de viento de frente, gradiente y peso.", "src": "Manual §11.2 y §11.4, pp. 21, 23", "note": ""}, {"n": 74, "stem": "La velocidad de «ascenso en aproximación» es la que proporciona el mejor rendimiento de ascenso en configuración de aproximación con:", "opts": ["todos los motores al ralentí", "un motor inoperativo y la máxima potencia de despegue en el motor o motores operativos", "todos los motores a la máxima potencia de despegue", "los flaps replegados y el tren de aterrizaje arriba"], "ans": 1, "why": "Ascenso en aproximación: con un motor inoperativo; ascenso en aterrizaje: todos los motores a la máxima potencia de despegue en configuración de aterrizaje.", "src": "Manual §11.3, pp. 22-23", "note": ""}, {"n": 75, "stem": "Según el manual, con pista mojada o contaminada se produce hidroplaneo cuando:", "opts": ["se sobrecalientan los frenos", "revientan los neumáticos", "las ruedas dejan de girar y deslizan, perdiendo toda su eficacia la acción de frenado", "la aeronave excede V_REF"], "ans": 2, "why": "Es la definición del manual; el método más efectivo para parar el avión es, en palabras del manual, el uso de la reversa.", "src": "Manual §11.5, p. 23", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resum
