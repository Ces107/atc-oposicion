eléctricas, satélites meteorológicos y aeronaves.", "src": "Manual 3 (nov. 2026), capítulo 1.3, p. 9", "note": ""}, {"n": 142, "stem": "Según el manual, las observaciones con radar de superficie y de a bordo, junto con la red de descargas eléctricas, permiten sobre todo:", "opts": ["Medir la presión y la temperatura sobre la vertical del lugar", "Determinar la posición de cumulonimbos y tormentas", "Medir el contenido de ozono de la estratosfera", "Calcular la visibilidad reinante del aeródromo"], "ans": 1, "why": "También permiten relacionar las imágenes del radar con fenómenos adversos para el vuelo. La presión, la temperatura y la humedad en la vertical las miden los sondeos.", "src": "Manual 3 (nov. 2026), capítulo 1.3, p. 9", "note": ""}, {"n": 143, "stem": "La aportación fundamental de los satélites meteorológicos, según el manual, es:", "opts": ["La medida del RVR en las pistas", "La observación de la visibilidad horizontal en superficie", "La localización de los sistemas nubosos, su naturaleza, extensión, desarrollo y movimiento", "El lanzamiento de radiosondas a las 00 y 12 UTC"], "ans": 2, "why": "Además proporcionan datos de altitud, medidas de temperatura y humedad y contenido de ozono, entre otros.", "src": "Manual 3 (nov. 2026), capítulo 1.3, p. 9", "note": ""}, {"n": 144, "stem": "El ingente volumen de datos mundiales necesario para monitorizar la atmósfera y alimentar los modelos numéricos se obtiene mediante:", "opts": ["La red de WAFC de Londres y Washington", "Los bancos internacionales de datos OPMET", "El Sistema Europeo de Navegación por Satélite", "El Sistema Mundial de Observación de la Organización Meteorológica Mundial"], "ans": 3, "why": "La figura de la p. 10 muestra sus elementos de forma esquemática.", "src": "Manual 3 (nov. 2026), capítulo 1.3, pp. 9-10", "note": ""}, {"n": 145, "stem": "¿Cuál de estos elementos NO aparece en la figura del Sistema Mundial de Observación de la OMM que reproduce el manual?", "opts": ["El radar secundario de vigilancia", "El satélite geoestacionario y el satélite en órbita polar", "La boya de datos oceánicos y el buque meteorológico", "La estación aerológica y la estación automatizada"], "ans": 0, "why": "La figura muestra satélites geoestacionario y en órbita polar, aeronaves, radar meteorológico, estaciones automatizada, de superficie, aerológica y satelital terrena, sondeos satelitales, buque meteorológico, boya de datos oceánicos y servicios meteorológicos nacionales.", "src": "Manual 3 (nov. 2026), capítulo 1.3, p. 10 (figura)", "note": ""}, {"n": 146, "stem": "En meteorología, el aire húmedo se define como:", "opts": ["El aire con una humedad relativa superior al 70 %", "La mezcla de dos gases: el aire seco y el vapor de agua", "El aire saturado de vapor de agua", "La mezcla de nitrógeno, oxígeno y gotas de agua en suspensión"], "ans": 1, "why": "El aire seco es la mezcla de gases (78 % N2, 21 % O2, 1 % otros); el vapor de agua puede variar entre un 0,2 % y un 3 %.", "src": "Manual 3 (nov. 2026), capítulo 2.1, pp. 10-11", "note": ""}, {"n": 147, "stem": "Según el manual, ¿en qué estado aparece el agua en forma de rocío?", "opts": ["Sólido", "Gaseoso", "Líquido", "Sólido o líquido, según la temperatura"], "ans": 2, "why": "Sólido: nieve, granizo o cristales de hielo; líquido: lluvia, rocío o gotas de agua en algunas nubes; gaseoso: vapor de agua.", "src": "Manual 3 (nov. 2026), capítulo 2.2, p. 11", "note": ""}, {"n": 148, "stem": "Según la figura de los procesos de cambio de estado del agua, ¿cuál de estos procesos desprende calor?", "opts": ["La evaporación", "La fusión", "La sublimación de sólido a vapor", "La condensación"], "ans": 3, "why": "Desprenden calor la condensación, la congelación y la sublimación de vapor a sólido; lo absorben la evaporación, la fusión y la sublimación de sólido a vapor.", "src": "Manual 3 (nov. 2026), capítulo 2.2, p. 11 (figura)", "note": ""}, {"n": 149, "stem": "Según la figura de los procesos de cambio de estado del agua, ¿cuál de estos procesos absorbe calor?", "opts": ["La fusión", "La congelación", "La condensación", "La sublimación de vapor a sólido"], "ans": 0, "why": "El paso de hielo a líquido (fusión) absorbe calor; el de líquido a hielo (congelación) lo desprende.", "src": "Manual 3 (nov. 2026), capítulo 2.2, p. 11 (figura)", "note": ""}, {"n": 150, "stem": "En el ciclo hidrológico, la evapotranspiración es:", "opts": ["La condensación del vapor de agua sobre la vegetación", "La evaporación del líquido que reside en la vegetación u otras superficies", "La precipitación que vuelve a evaporarse antes de llegar al suelo", "El paso directo del hielo a vapor en las montañas"], "ans": 1, "why": "El agua de mares y océanos se evapora, al igual que la que reside en la vegetación u otras superficies (evapotranspiración); el vapor se condensa formando nubes y precipita.", "src": "Manual 3 (nov. 2026), capítulo 2.2, p. 12", "note": ""}, {"n": 151, "stem": "Según el manual, la presión atmosférica sobre una superficie es igual a:", "opts": ["La fuerza del viento que actúa sobre esa superficie por unidad de área", "La densidad del aire multiplicada por su temperatura absoluta", "El peso de una columna de aire de 1000 m de altura sobre esa superficie", "El peso de la columna de aire desde esa superficie hasta el límite exterior de la atmósfera"], "ans": 3, "why": "Se debe al peso de los gases que componen la atmósfera y se ejerce por igual en todas las direcciones: P = F/S = mg/S.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 12", "note": ""}, {"n": 152, "stem": "La variación diaria de la presión atmosférica, según el manual, es:", "opts": ["Menor de 1 hPa en las zonas templadas y prácticamente nula en los polos", "De unos 10 hPa en las zonas templadas y máxima en los polos", "Mayor en los polos que en las zonas templadas", "Nula en todas las latitudes"], "ans": 0, "why": "Presenta dos máximos (hacia las 10 y 22 h) y dos mínimos (hacia las 4 y 16 h).", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 13", "note": ""}, {"n": 153, "stem": "¿Cuál de los siguientes NO figura entre los factores por los que, según el manual, la presión varía en función de la temperatura?", "opts": ["El momento del día", "La composición química del aire seco", "La época del año", "El movimiento de las masas de aire"], "ans": 1, "why": "Un cambio de masa de aire suele llevar asociado un cambio de temperatura, que produce perturbaciones irregulares en la presión.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 13", "note": ""}, {"n": 154, "stem": "En general, según el manual, cuanto mayor es la temperatura del aire:", "opts": ["Mayor es su densidad y mayor su presión", "Mayor es su densidad y menor su presión", "Menor es su densidad y menor su presión", "Menor es su densidad y mayor su presión"], "ans": 2, "why": "Cuanto más frío es el aire, mayor es su densidad y la presión aumenta.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 13", "note": ""}, {"n": 155, "stem": "Según el manual, la presencia de accidentes orográficos:", "opts": ["No influye en la presión, solo en la temperatura del aire", "Hace disminuir siempre la presión en la ladera de sotavento", "Hace aumentar siempre la presión sobre las cimas", "Puede acumular o restar masa de aire y subir o bajar localmente la presión"], "ans": 3, "why": "La orografía es el tercer factor que afecta a la presión, tras la altitud y la temperatura.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 14", "note": ""}, {"n": 156, "stem": "En el experimento de Torricelli, el mercurio del tubo de 1 m de largo y 1 cm² de sección descendió hasta una altura de:", "opts": ["76 cm", "1013 mm", "50 cm", "7,6 cm"], "ans": 0, "why": "La fuerza de la atmósfera fuera del tubo quedó equilibrada con la del mercurio de dentro: 1 atm = 760 mm Hg = 1013,25 hPa.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 14", "note": ""}, {"n": 157, "stem": "Según el manual, un gradiente térmico vertical positivo significa que:", "opts": ["La temperatura aumenta con la altura", "La temperatura desciende con la altura", "La temperatura se mantiene constante con la altura", "La presión aumenta con la altura"], "ans": 1, "why": "Gradiente térmico positivo: la temperatura desciende con la altura; negativo: la temperatura aumenta con la altura.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 15", "note": ""}, {"n": 158, "stem": "Según el manual, la nubosidad influye en la temperatura del aire porque:", "opts": ["Aumenta la amplitud térmica al retener la radiación solar", "Solo afecta a la temperatura mínima nocturna", "Suaviza los máximos y mínimos, de modo que la amplitud térmica es menor", "Retrasa el máximo diario hasta el atardecer"], "ans": 2, "why": "Las nubes reflejan parte de la radiación solar y absorben parte de la radiación terrestre.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 15", "note": ""}, {"n": 159, "stem": "Según el manual, el viento influye en la temperatura del aire porque:", "opts": ["Aumenta siempre la temperatura máxima del día", "Produce inversiones térmicas persistentes en superficie", "Hace más marcada la variación diurna de temperatura", "Mezcla capas a distinta temperatura y suaviza la variación diurna"], "ans": 3, "why": "Con el viento se remueve el aire y se mezclan capas de distinta temperatura.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 15", "note": ""}, {"n": 160, "stem": "Según el manual, la variación diaria de temperatura es mayor en la superficie terrestre que en el mar y en las zonas costeras porque el agua tiene un calor específico:", "opts": ["Más alto que las zonas terrestres", "Más bajo que las zonas terrestres", "Igual al de las zonas terrestres", "Nulo"], "ans": 0, "why": "La edición de noviembre de 2026 dice «más alto» (la anterior decía, por error, «más bajo»). Coincide con el capítulo 3.1: el agua es la sustancia de mayor calor específico y los mares se calientan y enfrían más lentamente.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 15", "note": ""}, {"n": 161, "stem": "Según la tabla de escalas de temperatura del manual (p. 16), el punto de ebullición del agua es:", "opts": ["100 ºF y 373,16 K", "212 ºF y 373,16 K", "212 ºF y 273,16 K", "180 ºF y 100 K"], "ans": 1, "why": "Fusión del hielo: 0 ºC, 32 ºF y 273,16 K; ebullición del agua: 100 ºC, 212 ºF y 373,16 K.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 16 (tabla)", "note": ""}, {"n": 162, "stem": "Según el manual (p. 16), las escalas centígrada y Kelvin se relacionan mediante:", "opts": ["K = C - 273,16", "C = K + 273,16", "K = C + 273,16", "K = 5/9 · (C + 273,16)"], "ans": 2, "why": "La edición de noviembre de 2026 imprime K = C + 273,16 (la anterior decía «+ 273»). Ojo: en las características de la ISA (p. 21) el punto de fusión del hielo es 273,15 K.", "src": "Manual 3 (nov. 2026), capítulo 2.5, p. 16", "note": ""}, {"n": 163, "stem": "La densidad de un gas se define en el manual como:", "opts": ["El peso de la columna de aire por unidad de superficie", "El producto de la presión por la temperatura", "La cantidad de vapor de agua que contiene el aire", "La masa que tiene el gas en la unidad de volumen (ρ = m/V)"], "ans": 3, "why": "El volumen depende de la sección y la altura (V = S·h); la densidad del aire se relaciona con la presión y la temperatura por la ecuación de estado P = d·R·T.", "src": "Manual 3 (nov. 2026), capítulo 2.6, p. 16", "note": ""}, {"n": 164, "stem": "La humedad relativa es el cociente entre:", "opts": ["El vapor de agua que realmente contiene un volumen de aire y el máximo que puede almacenar a la misma temperatura", "El vapor de agua contenido y la masa total del aire seco", "La temperatura del aire y la temperatura del punto de rocío", "El vapor de agua contenido a una temperatura y el contenido a 15 ºC"], "ans": 0, "why": "Cuando el volumen de aire está saturado, su humedad relativa es del 100 %.", "src": "Manual 3 (nov. 2026), capítulo 2.7, p. 17", "note": ""}, {"n": 165, "stem": "Según el manual, la cantidad de vapor de agua que un volumen de aire puede almacenar:", "opts": ["Es independiente de la temperatura", "Aumenta al aumentar la temperatura", "Disminuye al aumentar la temperatura", "Depende solo de la presión"], "ans": 1, "why": "A mayor temperatura, mayor cantidad de vapor de agua puede almacenar; cuando contiene la máxima, está saturado.", "src": "Manual 3 (nov. 2026), capítulo 2.7, p. 17", "note": ""}, {"n": 166, "stem": "Si a un volumen de aire ya saturado se le añade más vapor de agua o se enfría todavía más:", "opts": ["Su humedad relativa sube por encima del 100 %", "Su temperatura aumenta", "Una parte del vapor de agua se condensa", "El vapor se sublima en cristales de hielo"], "ans": 2, "why": "El aire saturado no admite más vapor; el exceso se transforma en agua líquida.", "src": "Manual 3 (nov. 2026), capítulo 2.7, p. 17", "note": ""}, {"n": 167, "stem": "Según el manual, las cinco capas en que se divide verticalmente la atmósfera:", "opts": ["Tienen el mismo espesor en todo el globo", "Solo varían con la estación del año", "Son uniformes salvo la exosfera", "No son uniformes, sino que dependen de la latitud"], "ans": 3, "why": "Por ejemplo, la tropopausa está a unos 8 km en latitudes altas, 12 km en latitudes medias y 18 km en latitudes bajas.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 18", "note": ""}, {"n": 168, "stem": "¿En qué latitudes alcanza la troposfera su menor espesor, según el manual?", "opts": ["En las latitudes altas (tropopausa polar, unos 8 km)", "En las latitudes medias (unos 12 km)", "En las latitudes bajas (tropopausa tropical, unos 18 km)", "Es igual en todas las latitudes (unos 11 km)"], "ans": 0, "why": "Latitudes bajas = tropopausa alta (18 km); latitudes altas = tropopausa baja (8 km).", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 18", "note": ""}, {"n": 169, "stem": "Según el manual, en las «roturas» entre las tropopausas de diferentes latitudes se originan:", "opts": ["Las nubes nacaradas", "Las corrientes en chorro", "Las auroras boreales", "Los ciclones tropicales"], "ans": 1, "why": "La tropopausa no es continua y en esas roturas se originan corrientes de viento muy fuertes, las corrientes en chorro.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 18", "note": ""}, {"n": 170, "stem": "Según el manual, en la estratosfera la presión:", "opts": ["Aumenta con la altitud por efecto de la abundancia de ozono", "Es aproximadamente la mitad de la del nivel del mar", "Sigue bajando y es solo alrededor del 0,1 % de la del nivel del mar", "Se mantiene constante desde la tropopausa hasta la estratopausa"], "ans": 2, "why": "Su contenido de vapor de agua es pequeño y apenas hay nubes.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 18", "note": ""}, {"n": 171, "stem": "La estratosfera se extiende desde la tropopausa hasta unos:", "opts": ["12 o 15 km", "25 o 30 km", "80 o 85 km", "50 o 55 km"], "ans": 3, "why": "Su límite superior, la estratopausa, está a unos 50 km; a partir de ella la temperatura vuelve a disminuir.", "src": "Manual 3 (nov. 2026), capítulo 2.8, pp. 18-19", "note": ""}, {"n": 172, "stem": "La mesosfera se extiende desde la estratopausa hasta unos:", "opts": ["80 km", "50 km", "500 km", "120 km"], "ans": 0, "why": "En ella la temperatura disminuye con la altitud hasta unos -95 ºC; su límite superior es la mesopausa.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 19", "note": ""}, {"n": 173, "stem": "Las nubes noctilucentes se observan, según el manual:", "opts": ["En la estratosfera, a 20-30 km, en latitudes tropicales", "En la mesosfera, en latitudes altas, cuando el Sol se sitúa entre 5º y 13º", "En la termosfera, en torno a los 300 km", "En la troposfera, sobre los cumulonimbos"], "ans": 1, "why": "Están formadas por cristales y polvo de meteorito y se ven en el crepúsculo con tonos azulados (nota 3). Las nubes nacaradas son las de la estratosfera, a 20-30 km.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 19 (nota 3)", "note": ""}, {"n": 174, "stem": "La capa también llamada ionosfera, en la que los iones pueden reflejar las ondas de radio y se producen fenómenos como la aurora boreal, es la:", "opts": ["Mesosfera", "Exosfera", "Termosfera", "Estratosfera"], "ans": 2, "why": "La termosfera o ionosfera se extiende desde la mesopausa hasta unos 500 km; en ella no se forma ninguna nube y su límite superior es la termopausa.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 19", "note": ""}, {"n": 175, "stem": "La última capa de la atmósfera, de espesor muy elevado, hasta confundirse con el gas interplanetario, es la:", "opts": ["Termosfera", "Mesosfera", "Ionosfera", "Exosfera"], "ans": 3, "why": "Se sitúa encima de la termosfera.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 19", "note": ""}, {"n": 176, "stem": "En la figura del manual «Principales fenómenos presentes en cada capa de la atmósfera», la capa de ozono aparece en:", "opts": ["La estratosfera", "La troposfera", "La mesosfera", "La termosfera"], "ans": 0, "why": "En la misma figura, el Monte Everest (8848 m) y los aviones a reacción están en la troposfera, los aviones supersónicos en la estratosfera y las auroras polares en la termosfera.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 20 (figura)", "note": ""}, {"n": 177, "stem": "En la figura del manual «Principales fenómenos presentes en cada capa de la atmósfera», las auroras polares aparecen en:", "opts": ["La mesosfera", "La termosfera", "La estratosfera", "La troposfera"], "ans": 1, "why": "Coincide con el texto, que sitúa la aurora boreal en la termosfera o ionosfera, por la ionización de los átomos libres.", "src": "Manual 3 (nov. 2026), capítulo 2.8, pp. 19-20 (figura)", "note": ""}, {"n": 178, "stem": "En la figura del manual «Capas de la atmósfera y sus grosores», el grosor que se dibuja para la termosfera es de:", "opts": ["500 km", "80 km", "300 km", "1000 km"], "ans": 2, "why": "La figura da grosores (troposfera 8-10 / 15 / 18-22 km, termosfera 300 km) distintos de las alturas del texto; el texto dice que la termosfera se extiende desde la mesopausa hasta unos 500 km.", "src": "Manual 3 (nov. 2026), capítulo 2.8, p. 20 (figura)", "note": ""}, {"n": 179, "stem": "En la atmósfera, la estabilidad se define como:", "opts": ["La ausencia de viento en superficie durante un periodo prolongado", "La capacidad de una masa de aire para mantener constante su humedad", "La igualdad de temperatura entre dos capas de aire contiguas", "La capacidad de una masa de aire de resistirse al desplazamiento vertical"], "ans": 3, "why": "La atmósfera es tanto más estable cuanto más difícil es que se den en ella movimientos verticales.", "src": "Manual 3 (nov. 2026), capítulo 2.9, p. 21", "note": ""}, {"n": 180, "stem": "Según el manual, en el aire la inestabilidad se origina cuando una burbuja de aire:", "opts": ["Está más caliente (es menos densa) que el aire que la rodea, y asciende", "Está más fría (es más densa) que el aire que la rodea, y asciende", "Está más fría que su entorno, y desciende", "Tiene la misma temperatura que su entorno"], "ans": 0, "why": "La estabilidad es la situación contraria, en la que la burbuja está más fría que su entorno.", "src": "Manual 3 (nov. 2026), capítulo 2.9, p. 21", "note": ""}, {"n": 181, "stem": "¿Qué característica atribuye el manual al aire inestable?", "opts": ["Nieblas en capas bajas, sobre todo en invierno", "Buena visibilidad, excepto dentro de las nubes y en caso de chubascos", "Cielo despejado o nubes estratiformes", "Humo y contaminantes que no pueden elevarse"], "ans": 1, "why": "El aire inestable da nubes a veces muy desarrolladas, chubascos y turbulencia; A, C y D son rasgos del aire estable.", "src": "Manual 3 (nov. 2026), capítulo 2.9, p. 21", "note": ""}, {"n": 182, "stem": "La atmósfera ideal, definida por la OACI, en la que la distribución de la presión, la densidad y la temperatura es independiente de la latitud y de la época del año, se denomina:", "opts": ["Atmósfera real", "Atmósfera tipo de la OMM", "Atmósfera ISA", "Homosfera"], "ans": 2, "why": "ISA = <em>International Standard Atmosphere</em>. La determinación de la altitud se realiza a partir de esa atmósfera ideal, no real.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 21", "note": ""}, {"n": 183, "stem": "En la atmósfera ISA, el aire seco se considera un gas perfecto con una masa molecular media de:", "opts": ["0,0180 kg/mol", "1,2250 kg/mol", "28,96 kg/mol", "0,02896442 kg/mol"], "ans": 3, "why": "Es la primera de las características de la atmósfera estándar que enumera el manual.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 21", "note": ""}, {"n": 184, "stem": "En la atmósfera ISA, la temperatura a nivel del mar expresada en kelvin es de:", "opts": ["288,15 K", "273,15 K", "256,5 K", "301,15 K"], "ans": 0, "why": "15 ºC = 288,15 K, con 1013,25 hPa (760 mm Hg) y 1,2250 kg/m³.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 21", "note": ""}, {"n": 185, "stem": "En las características de la atmósfera ISA que enumera el manual (p. 21), la temperatura absoluta del punto de fusión del hielo es de:", "opts": ["288,15 K", "273,15 K", "256,5 K", "0 K"], "ans": 1, "why": "Es la tercera característica de la ISA. 288,15 K es la temperatura ISA a nivel del mar. (La tabla de escalas de la p. 16 imprime 273,16 K.)", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 21", "note": ""}, {"n": 186, "stem": "Según la figura del manual «Perfil vertical de temperatura según atmósfera ISA» (p. 22), la temperatura permanece constante entre:", "opts": ["0 y 11 km", "47 y 80 km", "11 y 25 km", "25 y 47 km"], "ans": 2, "why": "La figura dibuja 15 ºC en superficie, un gradiente de -6,5 ºC/km hasta los 11 km (-56 ºC), isotermia hasta los 25 km, aumento hasta los 47 km (10 ºC), isotermia hasta los 53 km y descenso. La ISA real tiene la isotermia entre 11 y 20 km: se responde según la figura cuando la pregunta la cita.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 22 (figura)", "note": ""}, {"n": 187, "stem": "Según la figura ISA del manual (p. 22), tras aumentar desde los 25 km, la temperatura llega a 10 ºC a una altitud de:", "opts": ["11 km", "25 km", "80 km", "47 km"], "ans": 3, "why": "De 47 a 53 km la figura mantiene 10 ºC y después la temperatura vuelve a descender (a 11 km marca -56 ºC; a 25 km termina la isotermia de -56 ºC).", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 22 (figura)", "note": ""}, {"n": 188, "stem": "Según la tabla ISA del manual, a 7000 ft corresponden:", "opts": ["782 mb y 1,1 ºC", "752 mb y -0,8 ºC", "697 mb y -4,8 ºC", "812 mb y 3,1 ºC"], "ans": 0, "why": "Fila corregida en la edición de noviembre de 2026 (la anterior imprimía «1.700» ft por errata). 8000 ft: 752 mb y -0,8 ºC; 10 000 ft: 697 mb y -4,8 ºC.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 23 (tabla)", "note": ""}, {"n": 189, "stem": "Según la tabla ISA del manual, ¿qué presión y temperatura corresponden a 22 000 ft?", "opts": ["466 mb y -24,6 ºC", "428 mb y -28,5 ºC", "500 mb y -21,0 ºC", "400 mb y -30,0 ºC"], "ans": 1, "why": "20 000 ft: 466 mb y -24,6 ºC; 22 000 ft: 428 mb y -28,5 ºC (última fila de la tabla).", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 23 (tabla)", "note": ""}, {"n": 190, "stem": "Según el manual, la atmósfera estándar:", "opts": ["Describe exactamente la atmósfera real de las latitudes medias", "Se usa en meteorología para elaborar los pronósticos de aeródromo", "Se usa solo en aeronáutica y la atmósfera real puede diferir mucho de ella", "Varía con la latitud y con la época del año, como la real"], "ans": 2, "why": "Las constantes fluctuaciones de presión y temperatura y las diferencias según la latitud hacen que la atmósfera real pueda diferir significativamente de la ISA.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 23", "note": ""}, {"n": 191, "stem": "La distancia vertical entre un punto del terreno y el nivel medio del mar se denomina:", "opts": ["Altura", "Altitud", "Nivel de vuelo", "Elevación"], "ans": 3, "why": "Altura: desde un punto del aire hasta una superficie de referencia, generalmente el suelo; altitud: desde un punto del aire hasta el MSL.", "src": "Manual 3 (nov. 2026), capítulo 2.10.2, p. 23", "note": ""}, {"n": 192, "stem": "Según el manual, es necesario calar el altímetro porque:", "opts": ["En la atmósfera real la presión a nivel del mar en general no es de 1013,25 hPa", "El altímetro mide la temperatura y no la presión", "La atmósfera ISA cambia cada día", "Los niveles de vuelo se expresan en metros"], "ans": 0, "why": "Las altitudes calculadas con la ISA pueden diferir de las reales; se ajusta el altímetro a la presión real a nivel del mar o en un punto de altitud conocida.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, pp. 24-25", "note": ""}, {"n": 193, "stem": "El QNH es:", "opts": ["La presión estándar a nivel del mar, 1013,25 hPa", "La presión atmosférica del aeródromo reducida al nivel del mar en condiciones ISA", "La presión atmosférica del aeródromo medida por el barómetro de la oficina meteorológica", "La presión en el nivel de transición"], "ans": 1, "why": "Con QNH el altímetro indica la altitud respecto al nivel medio del mar. C es el QFE y A, el QNE.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 194, "stem": "Según el manual, los valores para reglar un altímetro a QNH o QFE:", "opts": ["Son fijos para cada aeródromo y se publican en el AIP", "Solo cambian con la estación del año y se fijan cada trimestre", "No son fijos: varían con el tiempo y el lugar, y se actualizan con la estación más cercana", "Son siempre iguales a 1013,25 hPa por encima de la altitud de transición"], "ans": 2, "why": "El único valor fijo es el QNE (1013,25 hPa).", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 195, "stem": "Para un aeropuerto situado por debajo del nivel del mar:", "opts": ["El QNH es igual al QFE", "El QNH es mayor que el QFE", "El QFE es igual a 1013,25 hPa", "El QNH es menor que el QFE"], "ans": 3, "why": "A nivel del mar QNH = QFE; por encima del nivel del mar, QNH &gt; QFE; por debajo, QNH &lt; QFE.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 196, "stem": "Según el manual, los niveles de vuelo son niveles de crucero que siempre quedan:", "opts": ["Por encima de la altitud de transición", "Por debajo de la altitud de transición", "Dentro de la capa de transición", "Por encima de los 20 000 ft"], "ans": 0, "why": "Son superficies de presión constante situadas a una distancia determinada de la superficie de 1013,25 hPa, calculadas a partir de la atmósfera estándar de la OACI.", "src": "Manual 3 (nov. 2026), capítulo 2.10.4, p. 25", "note": ""}, {"n": 197, "stem": "¿En qué fase del vuelo tiene en cuenta la aeronave el nivel de transición?", "opts": ["En el despegue", "En la aproximación para el aterrizaje", "En el rodaje", "En crucero, al cambiar de FIR"], "ans": 1, "why": "La altitud de transición se tiene en cuenta en el despegue; el nivel de transición, en la aproximación para el aterrizaje.", "src": "Manual 3 (nov. 2026), capítulo 2.10.5, p. 26", "note": ""}, {"n": 198, "stem": "Según el manual, el valor del nivel de transición:", "opts": ["Es fijo para cada aeropuerto y se publica junto con la altitud de transición", "Coincide siempre con la altitud de transición del aeropuerto", "Depende de la meteorología y suele estar al menos 1000 ft sobre la altitud de transición", "Es de 6000 ft en todo el territorio salvo en Madrid y Granada"], "ans": 2, "why": "Lo fijo es la altitud de transición (13 000 ft TMA de Madrid, 7000 ft CTA de Granada, 6000 ft el resto).", "src": "Manual 3 (nov. 2026), capítulo 2.10.5, p. 26", "note": ""}, {"n": 199, "stem": "Según la figura «Altitud de transición, nivel de transición y cambios de reglaje», en el descenso el cambio de reglaje a QNH se hace al pasar:", "opts": ["La altitud de transición", "La isobara de 700 hPa", "La elevación del aeródromo", "El nivel de transición"], "ans": 3, "why": "En el ascenso, el cambio de reglaje a QNE se hace al pasar la altitud de transición; en el descenso, a QNH, al pasar el nivel de transición.", "src": "Manual 3 (nov. 2026), capítulo 2.10.5, p. 27 (figura)", "note": ""}, {"n": 200, "stem": "En la figura «Altitud de transición, nivel de transición y cambios de reglaje», la aeronave en ruta sigue una isobara rotulada como FL 100. ¿De qué isobara se trata?", "opts": ["700 hPa", "500 hPa", "850 hPa", "1013,25 hPa"], "ans": 0, "why": "El nivel de vuelo es una superficie de presión constante. En la tabla ISA del manual, 10 000 ft corresponden a 697 mb.", "src": "Manual 3 (nov. 2026), capítulo 2.10.5, p. 27 (figura)", "note": ""}, {"n": 201, "stem": "De la radiación emitida por el Sol, el 20 % que absorben los gases atmosféricos se reparte, según el manual, en:", "opts": ["15 % ozono y 5 % dióxido de carbono", "5 % ozono y 15 % dióxido de carbono", "10 % ozono y 10 % vapor de agua", "20 % vapor de agua"], "ans": 1, "why": "5 % ozono (O3) y 15 % dióxido de carbono (CO2). El resto: 36 % nubes, 4 % reflejado por la superficie y 40 % absorbido por la corteza.", "src": "Manual 3 (nov. 2026), capítulo 3.1, p. 27", "note": ""}, {"n": 202, "stem": "Según el manual, el efecto más notorio de que el agua sea la sustancia con mayor calor específico es que:", "opts": ["Los mares se calientan y enfrían más deprisa que las zonas terrestres", "La niebla se forma solo sobre el mar", "Los mares se calientan y enfrían más lentamente que las zonas terrestres", "El agua refleja la mayor parte de la radiación solar"], "ans": 2, "why": "El calor específico es la capacidad que tiene un cuerpo para almacenar calor.", "src": "Manual 3 (nov. 2026), capítulo 3.1, p. 27", "note": ""}, {"n": 203, "stem": "Según el manual, que algunos materiales de la corteza terrestre se calienten más que otros con la misma radiación solar depende de sus valores de:", "opts": ["Densidad, presión y humedad", "Conductividad eléctrica y magnetismo", "Altitud, latitud y longitud", "Reflectancia, absorbancia y transmitancia"], "ans": 3, "why": "Esa diferencia de calentamiento depende de las propiedades del material.", "src": "Manual 3 (nov. 2026), capítulo 3.1, p. 27", "note": ""}, {"n": 204, "stem": "La radiación terrestre es, según el manual:", "opts": ["Radiación de onda larga emitida por la superficie, los gases, los aerosoles y las nubes", "Radiación de onda corta procedente del Sol y reflejada por los océanos", "Radiación ultravioleta del Sol absorbida por el ozono de la estratosfera", "Radiación de onda corta emitida por las nubes hacia el espacio exterior"], "ans": 0, "why": "Los gases atmosféricos son absorbentes selectivos de la radiación terrestre para determinadas longitudes de onda.", "src": "Manual 3 (nov. 2026), capítulo 3.1, p. 28", "note": ""}, {"n": 205, "stem": "Según el manual, cuando el cielo está totalmente cubierto, las nubes:", "opts": ["Reflejan casi toda la radiación terrestre de vuelta hacia el suelo", "Absorben mucha radiación terrestre y la reemiten con su propia longitud de onda", "Dejan escapar al espacio toda la radiación terrestre emitida", "Absorben solo la radiación solar de onda corta que reciben"], "ans": 1, "why": "La radiación terrestre que reflejan las nubes no es muy alta, en general.", "src": "Manual 3 (nov. 2026), capítulo 3.1, p. 28", "note": ""}, {"n": 206, "stem": "El balance radiactivo es, según el manual:", "opts": ["La diferencia entre la radiación solar y la reflejada por las nubes", "El equilibrio entre la presión y la temperatura de una masa de aire", "El balance entre los flujos de radiación solar y terrestre en la superficie de la Tierra", "La cantidad de radiación absorbida por el ozono"], "ans": 2, "why": "El manual lo titula «Balance radiactivo» (el término técnico habitual es «radiativo»).", "src": "Manual 3 (nov. 2026), capítulo 3.2, p. 28", "note": ""}, {"n": 207, "stem": "¿De qué NO depende, según el manual, la intensidad de la radiación solar recibida en un punto?", "opts": ["De la latitud", "De la época del año", "De la hora del día", "De la presión del aire"], "ans": 3, "why": "Depende de la posición del punto respecto al Sol, es decir, de la latitud, la época del año y la hora del día.", "src": "Manual 3 (nov. 2026), capítulo 3.2, p. 28", "note": ""}, {"n": 208, "stem": "Según el manual, la temperatura anual media de la Tierra y de la atmósfera varía muy poco porque:", "opts": ["Cada año el sistema atmósfera-Tierra envía al espacio tanta energía como recibe del Sol", "Todas las latitudes absorben la misma radiación que emiten", "El ozono bloquea toda la radiación solar", "La radiación solar es constante en todas las latitudes"], "ans": 0, "why": "En algunas latitudes se absorbe más de lo que se emite y en otras ocurre lo contrario, pero el balance anual del conjunto se mantiene.", "src": "Manual 3 (nov. 2026), capítulo 3.2, p. 29", "note": ""}, {"n": 209, "stem": "Según el manual, la convección es un tipo de transmisión de calor que:", "opts": ["Se realiza por contacto directo entre dos cuerpos a distinta temperatura", "Se realiza mediante un fluido y suele originar los movimientos verticales del aire", "Se realiza por movimientos horizontales de las masas de aire", "Se realiza mediante corrientes desordenadas que forman remolinos"], "ans": 1, "why": "A es la conducción, C la advección y D la turbulencia.", "src": "Manual 3 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 210, "stem": "Según el manual, la sensibilidad de una aeronave a la turbulencia es función de:", "opts": ["Su altitud de crucero y su autonomía", "La potencia de sus motores y el número de pasajeros", "Su peso, superficie alar, actitud y velocidad", "El tipo de altímetro y el reglaje utilizado"], "ans": 2, "why": "La turbulencia puede producir aceleraciones verticales u horizontales, cambios de altitud y actitud e incluso pérdida momentánea de la gobernabilidad.", "src": "Manual 3 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 211, "stem": "Según el manual, la transferencia de calor:", "opts": ["Va siempre de las zonas más frías a las más calientes", "Es más lenta cuanto mayor es la diferencia de temperatura", "Solo se produce por radiación, nunca por contacto", "Va de lo más caliente a lo más frío, y más rápido cuanto mayor es la diferencia"], "ans": 3, "why": "Es el principio con que el manual cierra los procesos de intercambio de calor.", "src": "Manual 3 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 212, "stem": "Además de las corrientes de convección, otro proceso por el que se transfiere energía entre latitudes es:", "opts": ["Las corrientes oceánicas que van de los trópicos a los polos", "La subsidencia en las altas polares", "La conducción desde las pistas de los aeropuertos", "La fuerza de Coriolis"], "ans": 0, "why": "Estos mecanismos contribuyen a mantener el equilibrio térmico del sistema Tierra-atmósfera.", "src": "Manual 3 (nov. 2026), capítulo 3.3, p. 31", "note": ""}, {"n": 213, "stem": "Se denomina circulación general atmosférica a:", "opts": ["La circulación diaria de la brisa entre el mar y la tierra", "El flujo de aire alrededor del globo que redistribuye el calor sobre la Tierra", "El giro horario del aire alrededor de los anticiclones", "El movimiento vertical del aire dentro de los cumulonimbos"], "ans": 1, "why": "Abarca todo el planeta y ayuda a comprender muchos sistemas meteorológicos a menor escala.", "src": "Manual 3 (nov. 2026), capítulo 4, p. 31", "note": ""}, {"n": 214, "stem": "¿Cuál de estas hipótesis NO forma parte del modelo simple de circulación general con una tierra inmóvil?", "opts": ["Superficie uniforme, sin fricción", "Sin calentamiento diferencial entre océanos y continentes", "Vientos desviados por la fuerza de Coriolis", "Vientos debidos exclusivamente a factores térmicos"], "ans": 2, "why": "La rotación de la Tierra entra en el modelo realista de tres células.", "src": "Manual 3 (nov. 2026), capítulo 4.1.1, p. 31", "note": ""}, {"n": 215, "stem": "En el modelo simple de circulación con una tierra inmóvil, el aire:", "opts": ["Asciende en los polos, va en altura hacia el ecuador y desciende allí", "Asciende a 30º de latitud y desciende a 60º de latitud", "Circula de este a oeste en altura alrededor de todo el globo", "Asciende en el ecuador, va en altura a los polos, baja y vuelve por superficie"], "ans": 3, "why": "Ese movimiento se llama célula de circulación.", "src": "Manual 3 (nov. 2026), capítulo 4.1.1, p. 31", "note": ""}, {"n": 216, "stem": "El cinturón de bajas presiones situado hacia los 60º de latitud se denomina:", "opts": ["Zona de baja presión subpolar", "Vaguada ecuatorial", "Zona de alta presión subtropical", "Zona de Convergencia Intertropical"], "ans": 0, "why": "Bajas a 60º (subpolar), altas a 30º (subtropical) y baja en el ecuador (vaguada ecuatorial).", "src": "Manual 3 (nov. 2026), capítulo 4.1.2, p. 32", "note": ""}, {"n": 217, "stem": "En la figura «Circulación atmosférica. Modelo de 3 células» del manual, el frente polar se sitúa hacia:", "opts": ["30º de latitud", "60º de latitud", "0º de latitud", "90º de latitud"], "ans": 1, "why": "La figura sitúa altas (H) a 30º, bajas (L) y el frente polar a 60º, altas polares en los polos y calmas y bajas ecuatoriales en 0º.", "src": "Manual 3 (nov. 2026), capítulo 4.1.2, p. 33 (figura)", "note": ""}, {"n": 218, "stem": "Según el manual, los vientos originados por el gradiente de presión entre latitudes:", "opts": ["Llevan el aire de las bajas a las altas presiones sin desviarse", "Soplan siempre paralelos a los meridianos, de polo a polo", "Llevan el aire de las altas a las bajas presiones, desviados por Coriolis", "No se ven afectados por la rotación de la Tierra en ninguna latitud"], "ans": 2, "why": "Es la consecuencia de la fuerza de Coriolis sobre los vientos.", "src": "Manual 3 (nov. 2026), capítulo 4.2.1, p. 33", "note": ""}, {"n": 219, "stem": "Cuando el campo de viento es tal que se produce la compresión de la masa de aire al encontrarse dos corrientes en una zona, se habla de:", "opts": ["Divergencia", "Subsidencia", "Advección", "Convergencia"], "ans": 3, "why": "Cuando se produce la separación de la masa de aire se habla de divergencia.", "src": "Manual 3 (nov. 2026), capítulo 5.1, p. 34", "note": ""}, {"n": 220, "stem": "En la figura de convergencia y divergencia del manual, la convergencia en superficie da lugar a:", "opts": ["Un ascenso del aire y divergencia en altura", "Un descenso del aire y convergencia en altura", "Subsidencia y altas presiones en superficie", "Divergencia en superficie"], "ans": 0, "why": "La figura muestra «Convergencia en superficie», «Ascenso del aire» y «Divergencia en altura». Los anticiclones cálidos son lo contrario: convergencia en altura, subsidencia y divergencia en superficie.", "src": "Manual 3 (nov. 2026), capítulo 5.1, p. 34 (figura)", "note": ""}, {"n": 221, "stem": "Los Vientos del Oeste surgen, según el manual, entre:", "opts": ["La vaguada ecuatorial y la zona de alta presión subtropical", "La zona de baja presión subpolar y la zona de alta presión subtropical", "Los polos y la zona de baja presión subpolar", "Las dos zonas de alta presión subtropical"], "ans": 1, "why": "A es la zona de los alisios; C, la de los vientos que soplan desde el NE (hemisferio norte) y desde el SE (hemisferio sur).", "src": "Manual 3 (nov. 2026), capítulo 5.3, p. 35", "note": ""}, {"n": 222, "stem": "Entre los polos y la zona de baja presión subpolar se originan, según el manual, unos vientos que soplan:", "opts": ["Del oeste en ambos hemisferios, entre los 30º y los 60º de latitud", "Del NE en el hemisferio sur y del SE en el hemisferio norte", "Del NE hacia el sur en el hemisferio norte y del SE hacia el norte en el sur", "Del SO en el hemisferio norte y del NO en el hemisferio sur"], "ans": 2, "why": "Siempre ligeramente desviados por la fuerza de Coriolis.", "src": "Manual 3 (nov. 2026), capítulo 5.3, p. 35", "note": ""}, {"n": 223, "stem": "Según la definición del manual, la corriente en chorro se caracteriza por:", "opts": ["Vientos flojos y variables en la baja troposfera", "Un eje vertical sobre las zonas de baja presión", "Ausencia de cizalladura y un único máximo de velocidad", "Fuerte cizalladura horizontal y vertical del viento y uno o varios máximos de velocidad"], "ans": 3, "why": "Es una fuerte y estrecha corriente concentrada a lo largo de un eje casi horizontal en la alta troposfera o en la estratosfera.", "src": "Manual 3 (nov. 2026), capítulo 5.4, p. 35", "note": ""}, {"n": 224, "stem": "Según el manual, las corrientes en chorro más intensas son:", "opts": ["Las polares; existen también corrientes en chorro subtropicales en ambos hemisferios", "Las subtropicales; las polares solo existen en el hemisferio norte", "Las ecuatoriales", "Las de la baja troposfera"], "ans": 0, "why": "La figura de la p. 36 muestra las corrientes en chorro polar y subtropical en el hemisferio norte.", "src": "Manual 3 (nov. 2026), capítulo 5.4, pp. 35-36", "note": ""}, {"n": 225, "stem": "Según el manual, las aeronaves tratan de fijar sus trayectorias en ruta con viento en cola porque:", "opts": ["Así reducen la turbulencia en aire claro de los niveles altos", "Así ahorran combustible, sobre todo con las corrientes en chorro, que soplan a altura de crucero", "Así evitan el engelamiento en las capas de nubes medias", "Lo exige el Reglamento de Circulación Aérea en todas las rutas"], "ans": 1, "why": "Siempre en ausencia de otros factores, como condiciones meteorológicas adversas previstas en ruta.", "src": "Manual 3 (nov. 2026), capítulo 5.4, p. 36", "note": ""}, {"n": 226, "stem": "Según el manual, el tiempo asociado a los anticiclones es generalmente:", "opts": ["Inestable, con chubascos y tormentas frecuentes por la tarde", "Lluvioso y con vientos fuertes en superficie y en el centro", "Estable, con vientos flojos y cielo despejado; en invierno favorece las nieblas", "Nuboso, con desarrollo vertical por la convergencia en superficie"], "ans": 2, "why": "Las condiciones de estabilidad asociadas a los anticiclones hacen probable la baja visibilidad en los aeródromos en invierno.", "src": "Manual 3 (nov. 2026), capítulo 6, p. 37", "note": ""}, {"n": 227, "stem": "Según el manual, las depresiones, regiones donde la presión es mucho más baja que en las áreas circundantes, también se denominan:", "opts": ["Dorsales", "Anticiclones dinámicos", "Altas subtropicales", "Borrascas"], "ans": 3, "why": "Su extensión horizontal es muy variable; los vientos giran en sentido antihorario en el hemisferio norte y horario en el sur, normalmente fuertes en el centro y más débiles en el exterior.", "src": "Manual 3 (nov. 2026), capítulo 6, p. 37", "note": ""}, {"n": 228, "stem": "Según la tabla de depresiones del manual, los ciclones tropicales se llaman tifones en:", "opts": ["El Pacífico noroccidental", "El Océano Atlántico", "El Pacífico nororiental", "El Océano Índico meridional"], "ans": 0, "why": "En el Océano Atlántico y en el Pacífico nororiental se llaman huracanes, y en el Pacífico noroccidental, tifones. Se forman en océanos y mares calientes, generalmente tropicales.", "src": "Manual 3 (nov. 2026), capítulo 6, p. 37", "note": ""}, {"n": 229, "stem": "¿Qué afirmación sobre la DANA es correcta según el manual?", "opts": ["Es un anticiclón de origen térmico que suele dar tiempo estable y seco", "Suele medir 200 km o más, su trayectoria es difícil de predecir y da intensas precipitaciones", "Es una borrasca de latitudes medias asociada al frente polar", "Se forma sobre mares tropicales con el agua por encima de 27 ºC"], "ans": 1, "why": "Es un embolsamiento de aire frío en altura con reflejo difuso en superficie. La tabla del manual la presenta como un ejemplo propio, distinto de las borrascas de latitudes medias (C) y del ciclón tropical (D).", "src": "Manual 3 (nov. 2026), capítulo 6, p. 38", "note": ""}, {"n": 230, "stem": "En la tabla de depresiones del manual, las «depresiones asociadas a los frentes polares de ambos hemisferios», que pueden ser de gran extensión y generar fuertes vientos y lluvias, son:", "opts": ["Las DANA", "Los ciclones tropicales", "Las borrascas de latitudes medias", "Las depresiones tropicales"], "ans": 2, "why": "Los tres ejemplos característicos de depresión son el ciclón tropical, la DANA y las borrascas de latitudes medias, cada uno en su propia fila.", "src": "Manual 3 (nov. 2026), capítulo 6, p. 38", "note": ""}, {"n": 231, "stem": "¿Cuántos ejemplos característicos de depresión da la tabla del manual, y cuáles son?", "opts": ["Dos: ciclón tropical y borrascas de latitudes medias (que incluyen la DANA)", "Cuatro: ciclón tropical, DANA, borrascas de latitudes medias y anticiclón cálido", "Dos: DANA y gota fría", "Tres: ciclón tropical, DANA y borrascas de latitudes medias"], "ans": 3, "why": "La DANA (antigua gota fría) no se incluye dentro de las borrascas de latitudes medias: tiene su propia fila.", "src": "Manual 3 (nov. 2026), capítulo 6, pp. 37-38", "note": ""}, {"n": 232, "stem": "Según el manual, si la región manantial de una masa de aire es marítima, la masa:", "opts": ["Tenderá a adquirir humedad", "Tenderá a enfriarse", "Tenderá a secarse", "No cambia sus propiedades"], "ans": 0, "why": "Si la superficie es fría, la masa tenderá a enfriarse; si es marítima, a adquirir humedad.", "src": "Manual 3 (nov. 2026), capítulo 7.1, p. 38", "note": ""}, {"n": 233, "stem": "¿Cuál de estas NO es una de las cuatro clases de masa de aire según la temperatura que da el manual?", "opts": ["Ártica", "Templada", "Tropical", "Ecuatorial"], "ans": 1, "why": "Las cuatro son ártica, polar, tropical y ecuatorial, según la latitud donde se genera.", "src": "Manual 3 (nov. 2026), capítulo 7.1, p. 39", "note": ""}, {"n": 234, "stem": "Según el manual, los cambios en las propiedades de una masa de aire que se desplaza dependen de:", "opts": ["Solo de la estación del año en que se desplace la masa", "De la altura de la tropopausa y de la fuerza de Coriolis", "De sus propiedades iniciales, su velocidad y la superficie sobre la que se desplace", "Del número de frentes que atraviese en su desplazamiento"], "ans": 2, "why": "Las características adquiridas en la fuente varían con el tiempo conforme la masa se desplaza.", "src": "Manual 3 (nov. 2026), capítulo 7.1, p. 39", "note": ""}, {"n": 235, "stem": "Según el manual, los frentes se clasifican en función de:", "opts": ["La altura de su base", "La estación del año", "La humedad de las masas que separan", "La masa de aire que empuja"], "ans": 3, "why": "Las masas no se mezclan de forma inmediata porque sus densidades son distintas; la más ligera y caliente asciende sobre la fría y densa. Los frentes están asociados a depresiones.", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 39", "note": ""}, {"n": 236, "stem": "¿Cuándo se produce un frente cálido?", "opts": ["Cuando una masa de aire caliente desplaza a una fría y asciende por encima de ella", "Cuando una masa de aire frío desplaza a una caliente avanzando como una cuña", "Cuando se encuentran dos masas sin que haya desplazamiento", "Cuando un frente frío alcanza a otro cálido"], "ans": 0, "why": "El ascenso puede provocar enfriamiento, condensación, nubosidad y precipitaciones; el tiempo depende de la humedad y la estabilidad de la masa. B es el frente frío; C, el estacionario; D, el ocluido.", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 40", "note": ""}, {"n": 237, "stem": "En la figura del frente cálido del manual, ¿qué nubes se dibujan por delante del frente, en la superficie frontal?", "opts": ["Cumulonimbos, cúmulos y altocúmulos", "Cirros, cirrostratos, altoestratos y nimbostratos", "Altocúmulos, sin desplazamiento del frente", "Estratos, niebla y llovizna"], "ans": 1, "why": "La figura del frente cálido muestra Ci, Cs, As y Ns, con estratocúmulos y «lluvias suaves»; la del frente frío, cumulonimbos, cúmulos y altocúmulos con «lluvias fuertes».", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 40 (figura)", "note": ""}, {"n": 238, "stem": "En la figura del frente frío del manual se dibujan:", "opts": ["Nimbostratos y lluvias suaves", "Altocúmulos sin desplazamiento del frente", "Cumulonimbos, cúmulos y lluvias fuertes", "Cirros y cirrostratos sin precipitación"], "ans": 2, "why": "Coincide con el texto: al ascender el aire caliente aparecen nubes de desarrollo vertical y precipitaciones. B corresponde a la figura del frente estacionario.", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 40 (figura)", "note": ""}, {"n": 239, "stem": "En las figuras de los frentes del manual, las temperaturas rotuladas para el aire frío y el aire caliente son:", "opts": ["0º y 15º", "10º y 20º", "18º y 30º", "15º y 30º"], "ans": 3, "why": "Aire frío, Tª = 15º; aire caliente (cálido), Tª = 30º. En la figura del frente ocluido aparece además «aire fresco», Tª = 18º.", "src": "Manual 3 (nov. 2026), capítulo 7.2, pp. 40-41 (figuras)", "note": ""}, {"n": 240, "stem": "Una oclusión es de tipo frío cuando:", "opts": ["El aire que está detrás de la oclusión es más frío que el aire situado delante", "El aire que está detrás de la oclusión es más caliente que el situado delante", "La temperatura en superficie es inferior a 0 ºC", "El frente frío se mueve más despacio que el cálido"], "ans": 0, "why": "La oclusión puede ser de tipo frío o de tipo caliente según que el aire de detrás sea más frío o más caliente que el de delante.", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 41", "note": ""}, {"n": 241, "stem": "Según el manual, las nubes están formadas por:", "opts": ["Solo gotas de agua líquida en suspensión en la atmósfera", "Partículas minúsculas de agua líquida y/o de hielo en suspensión", "Vapor de agua invisible a una temperatura inferior a 0 ºC", "Polvo, humo y aerosoles mezclados con vapor de agua"], "ans": 1, "why": "Es la definición con la que se abre el capítulo 8.1.", "src": "Manual 3 (nov. 2026), capítulo 8.1, p. 41", "note": ""}, {"n": 242, "stem": "Según el manual, el enfriamiento por contacto de la masa de aire con una superficie muy fría corresponde a los casos de:", "opts": ["Convección y turbulencia", "Expansión adiabática", "Advección y radiación", "Convergencia en superficie"], "ans": 2, "why": "El enfriamiento es el mecanismo de saturación más común; el otro caso es la expansión adiabática.", "src": "Manual 3 (nov. 2026), capítulo 8.1.1, p. 41", "note": ""}, {"n": 243, "stem": "La convergencia del aire en superficie que origina su ascenso produce un enfriamiento que el manual denomina:", "opts": ["Convectivo", "Orográfico", "Por radiación", "Frontal"], "ans": 3, "why": "La expansión en una columna ascendente es el enfriamiento convectivo; el ascenso forzado por una ladera y la turbulencia en capas bajas son los otros casos de expansión adiabática.", "src": "Manual 3 (nov. 2026), capítulo 8.1.1, p. 42", "note": ""}, {"n": 244, "stem": "Según el manual, la mayor parte de las nubes se encuentra entre el nivel del mar y el nivel de la tropopausa, que en latitudes medias significa:", "opts": ["0-13 km", "0-8 km", "0-18 km", "0-25 km"], "ans": 0, "why": "Por convención esa parte se divide en tres pisos: alto, medio y bajo.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 42", "note": ""}, {"n": 245, "stem": "Según la tabla de pisos del manual, el piso medio de la región tropical se sitúa entre:", "opts": ["2 y 4 km", "2 y 8 km", "2 y 7 km", "6 y 18 km"], "ans": 1, "why": "Piso medio: polar 2-4 km, templada 2-7 km, tropical 2-8 km (6500-25 000 ft). 6-18 km es el piso alto tropical.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 42 (tabla)", "note": ""}, {"n": 246, "stem": "Según la tabla de pisos del manual, el piso alto de la región polar se sitúa entre:", "opts": ["5 y 13 km", "6 y 18 km", "3 y 8 km (10 000-25 000 ft)", "2 y 4 km (6500-13 000 ft)"], "ans": 2, "why": "Piso alto: polar 3-8 km, templada 5-13 km (16 500-45 000 ft), tropical 6-18 km (20 000-60 000 ft).", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 42 (tabla)", "note": ""}, {"n": 247, "stem": "Según la tabla de pisos del manual, el piso bajo:", "opts": ["Llega a 4 km en la región tropical", "Es más alto en la región polar", "No existe en la región tropical", "Va de 0 a 2 km (0-6500 ft) en las tres regiones"], "ans": 3, "why": "Es el único piso con los mismos límites en las regiones polar, templada y tropical.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 42 (tabla)", "note": ""}, {"n": 248, "stem": "Los géneros de nubes se subdividen en especies y en variedades. Las especies dependen de:", "opts": ["Las peculiaridades y la estructura interna de la nube", "La disposición de los elementos macroscópicos y el grado de transparencia", "La altura de la base y la del tope", "La región (polar, templada o tropical)"], "ans": 0, "why": "B es el criterio de las variedades.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43", "note": ""}, {"n": 249, "stem": "Según la tabla de géneros del manual, la base media y el tope medio de las nubes altas son:", "opts": ["2500 m y 6000 m", "6000 m y 12 000 m", "600-2400 m y 12 000 m", "3000 m y 8000 m"], "ans": 1, "why": "Nubes altas (Ci, Cs, Cc): 6000 m y 12 000 m; nubes medias (Ac, Ns, As): 2500 m y 6000 m.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43 (tabla)", "note": ""}, {"n": 250, "stem": "Según la tabla de géneros del manual, los estratos (St) tienen una base media y un tope medio de:", "opts": ["600-1500 m y 2400 m", "300-2400 m y 6000 m", "150-600 m y 750 m", "0 m y 2000 m"], "ans": 2, "why": "Estratocúmulos: 600-1500 m y 2400 m; cúmulos: 300-2400 m y 6000 m.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43 (tabla)", "note": ""}, {"n": 251, "stem": "Según la tabla de géneros del manual, el tope medio de los cumulonimbos es de:", "opts": ["6000 m", "2400 m", "18 000 m", "12 000 m"], "ans": 3, "why": "Cb: base 600-2400 m, tope 12 000 m; Cu: base 300-2400 m, tope 6000 m.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43 (tabla)", "note": ""}, {"n": 252, "stem": "Según la tabla de géneros del manual, ¿qué nubes tienen una base media de 600-1500 m y un tope medio de 2400 m?", "opts": ["Los estratocúmulos", "Los estratos", "Los cúmulos", "Los altocúmulos"], "ans": 0, "why": "Estratos: 150-600 m y 750 m; cúmulos: 300-2400 m y 6000 m; altocúmulos (nubes medias): 2500 m y 6000 m.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43 (tabla)", "note": ""}, {"n": 253, "stem": "Según las notas de la tabla de géneros, ¿qué nubes tienen una extensión vertical tan grande que pueden alcanzar el piso medio y el alto?", "opts": ["Los nimbostratos", "Los cúmulos y los cumulonimbos", "Los altoestratos", "Los cirrostratos"], "ans": 1, "why": "Nota 6. La nota 5 dice que la base de los Ns puede llegar hasta la superficie y considerarse nube baja.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 43 (notas 5 y 6)", "note": ""}, {"n": 254, "stem": "Según el manual, los cirros:", "opts": ["Producen halos al atravesarlos el Sol", "Indican tormentas por la tarde si se ven por la mañana", "Son normalmente blancos y, en ocasiones, indican la aproximación de una perturbación", "Están formados por gotas superenfriadas"], "ans": 2, "why": "Son largos, finos y etéreos filamentos de cristales de hielo, alargados por los fuertes vientos de esas altitudes. Los halos son propios de los cirrostratos; las tormentas por la tarde, de los altocúmulos.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 44", "note": ""}, {"n": 255, "stem": "¿Qué nubes forman un banco, manto o capa delgada generalmente blanca y sin sombras, compuesta por elementos muy pequeños en forma de granos o rizos?", "opts": ["Altocúmulos", "Estratocúmulos", "Cirrostratos", "Cirrocúmulos"], "ans": 3, "why": "Los altocúmulos, en cambio, son blancos o grises y tienen sombras.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 44", "note": ""}, {"n": 256, "stem": "Según el manual, las nubes medias están formadas por:", "opts": ["Gotas de agua, muchas superenfriadas o en subfusión, y a veces cristales de hielo", "Solo cristales de hielo, alargados por los vientos fuertes de altura", "Solo gotas de agua líquida, sin ninguna superenfriada", "Partículas de los tres pisos, por su gran desarrollo vertical"], "ans": 0, "why": "Altas: cristales de hielo; bajas: generalmente solo gotas de agua líquida; de desarrollo vertical: combinación de partículas de los tres pisos.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 44", "note": ""}, {"n": 257, "stem": "¿Qué nube es una capa gris con la base rasgada, velada por la lluvia o nieve que cae de forma más o menos continua, y lo bastante espesa para ocultar completamente el Sol?", "opts": ["El altoestrato", "El nimbostrato", "El estrato", "El cumulonimbo"], "ans": 1, "why": "El altoestrato, en cambio, tiene partes lo bastante delgadas para distinguir vagamente el Sol.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 45", "note": ""}, {"n": 258, "stem": "¿Qué nubes tienen partes suficientemente delgadas para distinguir vagamente el Sol, «como a través de un vidrio deslustrado»?", "opts": ["Los cirrostratos", "Los nimbostratos", "Los altoestratos", "Los estratocúmulos"], "ans": 2, "why": "Son una capa gris o azul grisácea que suele cubrir todo el cielo y, a diferencia de los cirrostratos, no producen halos.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 45", "note": ""}, {"n": 259, "stem": "¿Qué nubes bajas suelen formar hileras con trozos de cielo azul visible entre ellas?", "opts": ["Los estratos", "Los altocúmulos", "Los nimbostratos", "Los estratocúmulos"], "ans": 3, "why": "Son bancos, mantos o capas grumosas, grises o blanquecinas.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 45", "note": ""}, {"n": 260, "stem": "Según el manual, los cúmulos son nubes aisladas, densas y blancas con:", "opts": ["Base plana y relativamente oscura y zonas altas en forma de coliflor", "Forma de yunque y base oscura con nubes desgarradas", "Aspecto fibroso, como cabellos, que produce halos", "Base rasgada y precipitación más o menos continua"], "ans": 0, "why": "Parecen enormes bolas de algodón. El yunque y la base oscura con nubes desgarradas corresponden al cumulonimbo.", "src": "Manual 3 (nov. 2026), capítulo 8.1.2, p. 46", "note": ""}, {"n": 261, "stem": "Según el manual, una descripción completa de la nubosidad incluye, para cada capa observada:", "opts": ["Solo la cantidad de cielo cubierto en octas", "La altura, la cantidad de cielo cubierto y los tipos de nubes presentes", "La temperatura de la base y la del tope", "La velocidad y la dirección de desplazamiento de las nubes"], "ans": 1, "why": "Para estimar la nubosidad el cielo se divide en ocho partes (octas) y se cuenta cuántas cubre cada capa, desde la más baja a la más alta.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 262, "stem": "La abreviatura OACI SCT indica:", "opts": ["Algunas nubes, de 1 a 2 octas", "Nuboso, de 5 a 7 octas", "Nubosidad dispersa, de 3 a 4 octas", "Sin nubes de importancia para las operaciones"], "ans": 2, "why": "FEW: 1-2 octas; SCT: 3-4; BKN: 5-7; OVC: cielo cubierto; NSC: sin nubes de importancia para las operaciones.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 263, "stem": "La abreviatura OACI NSC indica:", "opts": ["Cielo cubierto", "Nubosidad dispersa", "Nuboso", "Sin nubes de importancia para las operaciones"], "ans": 3, "why": "CAVOK añade sin fenómenos significativos y visibilidad mayor que 10 km.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 264, "stem": "Según el manual, la visibilidad vertical es:", "opts": ["La máxima a la que se ve un globo que asciende; en aeronáutica, la distancia vertical desde la que se ve la pista", "La distancia desde la cual el piloto, mirando a lo largo de la senda de planeo, ve la pista", "La distancia hasta la cual el piloto situado sobre el eje de la pista ve sus luces", "La altura sobre el suelo de la base de la capa de nubes más baja que cubre más de la mitad del cielo"], "ans": 0, "why": "B es la visibilidad oblicua y C, el RVR.", "src": "Manual 3 (nov. 2026), capítulo 8.2, p. 47", "note": ""}, {"n": 265, "stem": "El alcance visual en pista (RVR) se define en el manual como:", "opts": ["La visibilidad horizontal determinada de noche con luces de unas 1000 candelas", "La distancia hasta la que el piloto sobre el eje de una pista ve sus señales de superficie o sus luces", "La visibilidad mínima que se cifra cuando la reinante no puede determinarse", "La distancia vertical a partir de la cual el piloto tiene visión de la pista"], "ans": 1, "why": "El manual lo presenta en relación con la visibilidad oblicua; en el capítulo 9.1 precisa que el piloto se considera a 5 m de altura sobre el eje.", "src": "Manual 3 (nov. 2026), capítulo 8.2, p. 47", "note": ""}, {"n": 266, "stem": "De noche, la visibilidad en sentido aeronáutico se determina generalmente con:", "opts": ["Un objeto negro ante un fondo brillante", "Luces de unas 100 candelas ante un fondo iluminado", "Luces de aproximadamente 1000 candelas ante un fondo no iluminado", "Un globo que asciende"], "ans": 2, "why": "Esa distancia puede variar con la iluminación del fondo. De día se usa el objeto negro (MOR).", "src": "Manual 3 (nov. 2026), capítulo 8.2, p. 47", "note": ""}, {"n": 267, "stem": "Según el manual, los principales factores que influyen en la visibilidad son:", "opts": ["La presión, la temperatura y la densidad", "El tipo de nube, la altura de la tropopausa y la latitud", "La agudeza visual del observador y el color del objeto, exclusivamente", "La humedad relativa, la posición del Sol y la dirección en la que sopla el viento"], "ans": 3, "why": "Otros factores en la estimación son el tamaño y el color del objeto, la iluminación, la agudeza visual del observador y la posición desde la que se estima. La visibilidad se mide normalmente en metros.", "src": "Manual 3 (nov. 2026), capítulo 8.2, p. 48", "note": ""}, {"n": 268, "stem": "Según el manual, se denomina precipitación a:", "opts": ["El conjunto de partículas líquidas o sólidas que, procedentes de las nubes, alcanzan el suelo", "Toda gota de agua en suspensión en la atmósfera", "Las partículas que se evaporan antes de llegar al suelo", "La condensación del vapor de agua sobre las superficies frías"], "ans": 0, "why": "Para que se produzca, las gotas o cristales deben alcanzar un tamaño que les permita vencer las corrientes ascendentes y caer por gravedad. C describe las virgas.", "src": "Manual 3 (nov. 2026), capítulo 8.3, p. 49", "note": ""}, {"n": 269, "stem": "Según el manual, la lluvia helada es:", "opts": ["La nieve que se funde al llegar al suelo", "Gotas que se congelan en el momento del contacto", "Granizo de pequeño tamaño", "La mezcla de agua y nieve"], "ans": 1, "why": "Según la altura a la que comienza la caída y la temperatura del aire que atraviesa, la precipitación será de agua, nieve, aguanieve, lluvia helada o granizo.", "src": "Manual 3 (nov. 2026), capítulo 8.3, p. 49", "note": ""}, {"n": 270, "stem": "Según la tabla del manual, las precipitaciones intensas, en forma de chubasco y frecuentemente de tormenta, proceden de:", "opts": ["Los altoestratos y, ocasionalmente, los nimbostratos de gran espesor", "Los nimbostratos y los altoestratos, sobre todo cuando cubren todo el cielo", "Los cumulonimbos y, ocasionalmente, los cúmulos de gran desarrollo vertical", "Los estratos y, ocasionalmente, los estratocúmulos de gran extensión"], "ans": 2, "why": "Las nubes estratiformes, sobre todo As y Ns, dan precipitaciones continuadas de intensidad moderada; los altoestratos, débiles o moderadas y continuas.", "src": "Manual 3 (nov. 2026), capítulo 8.3, p. 49 (tabla)", "note": ""}, {"n": 271, "stem": "Según el manual, un chubasco es una precipitación que:", "opts": ["Es continua, de intensidad moderada y procede de nubes estratiformes", "Empieza y termina de forma gradual y no es de origen convectivo", "Solo puede ser de agua y nunca dura más de cinco minutos", "Se inicia y cesa bruscamente, es relativamente intensa y de no mucha duración"], "ans": 3, "why": "Puede ser de agua, de nieve o de ambas mezcladas, con gotas relativamente grandes, y procede de nubes convectivas.", "src": "Manual 3 (nov. 2026), capítulo 8.3.1, p. 49", "note": ""}, {"n": 272, "stem": "Según el manual, la presencia de placas de hielo o depósitos de nieve en las calles de rodaje:", "opts": ["Reduce la velocidad de la aeronave y alarga la ocupación de los viales y de la pista", "No afecta a las operaciones mientras la pista esté limpia", "Obliga siempre a cerrar el aeropuerto hasta su retirada", "Aumenta la eficacia de frenado de la aeronave en el rodaje"], "ans": 0, "why": "En el aterrizaje la precipitación disminuye la eficacia de frenado y puede producir aquaplaning; tras una nevada hay que limpiar las pistas para evitar la formación de hielo si la temperatura baja de 0 ºC.", "src": "Manual 3 (nov. 2026), capítulo 8.3.1, p. 50", "note": ""}, {"n": 273, "stem": "¿Cuál de los siguientes NO figura entre los efectos de las precipitaciones sobre las operaciones que cita el manual?", "opts": ["Reducción de la visibilidad en vuelo, según la intensidad", "Aumento de la sustentación en el despegue", "Cizalladura vertical y horizontal por las corrientes que origina la caída de las gotas", "Engelamiento si la temperatura es inferior a 0 ºC"], "ans": 1, "why": "También afectan al aterrizaje (frenado, aquaplaning) y al rodaje.", "src": "Manual 3 (nov. 2026), capítulo 8.3.1, p. 50", "note": ""}, {"n": 274, "stem": "Además de la fuerza debida al gradiente de presión, el manual cita como fuerzas que influyen en el movimiento del aire:", "opts": ["La gravedad, la sustentación y la flotabilidad", "La convección, la advección y la conducción", "La fuerza de Coriolis, la fuerza centrífuga y la fuerza de rozamiento con la superficie", "La fuerza magnética terrestre y la fuerza de marea"], "ans": 2, "why": "El movimiento del aire lo origina principalmente la fuerza del gradiente de presión, a la que es proporcional.", "src": "Manual 3 (nov. 2026), capítulo 8.4, p. 50", "note": ""}, {"n": 275, "stem": "Según el manual, la intensidad del viento se expresa en la medida aeronáutica estándar de:", "opts": ["Metros por segundo", "Kilómetros por hora", "Escala Beaufort", "Nudos (millas por hora)"], "ans": 3, "why": "El manual dice «millas/hora (nudos)»; en otros contextos se usan m/s o km/h. La dirección se expresa según su procedencia, en grados desde el norte verdadero.", "src": "Manual 3 (nov. 2026), capítulo 8.4, p. 51", "note": ""}, {"n": 276, "stem": "Según el manual, el valor máximo admisible de componente de viento en cola en el despegue y el aterrizaje depende de:", "opts": ["El tipo de avión y la longitud de la pista", "La temperatura y la humedad del aeródromo", "Solo de la categoría de la aproximación", "El reglaje del altímetro"], "ans": 0, "why": "Las operaciones se hacen en contra del viento, aunque es posible operar con ligero viento en cola. La componente transversal máxima (15-35 kt) depende del tipo de aeronave y de las condiciones de la pista.", "src": "Manual 3 (nov. 2026), capítulo 8.4, p. 51", "note": ""}, {"n": 277, "stem": "Según el manual, la causa del distinto calentamiento de la superficie del mar y de la tierra que origina las brisas es:", "opts": ["La diferente altitud de la tierra y el mar", "La diferencia de calores específicos de la tierra y del mar", "La fuerza de Coriolis", "La diferente composición química del aire sobre el mar"], "ans": 1, "why": "Las brisas son vientos a escala local; la de mar sopla de día y la de tierra, de noche.", "src": "Manual 3 (nov. 2026), capítulo 8.4.1, p. 51", "note": ""}, {"n": 278, "stem": "Según el manual, de noche se produce la brisa de tierra porque:", "opts": ["La tierra se calienta más que el mar y la presión sobre ella baja", "El mar se enfría más rápidamente que la tierra", "La tierra se enfría más rápidamente que el mar y se forma un área de alta presión sobre ella", "Los vientos catabáticos bajan hacia el mar"], "ans": 2, "why": "La diferencia de presión desplaza el aire de la tierra al mar.", "src": "Manual 3 (nov. 2026), capítulo 8.4.1, p. 52", "note": ""}, {"n": 279, "stem": "En el efecto Foehn, la masa de aire que asciende por barlovento, una vez que condensa, sigue:", "opts": ["El gradiente adiabático seco, que es menor que el saturado", "El gradiente térmico ISA de 2 ºC por cada 1000 ft", "Una temperatura constante", "El gradiente adiabático saturado, que es menor que el seco"], "ans": 3, "why": "Al descender por sotavento se calienta por compresión adiabática según el gradiente seco; por eso llega al valle más caliente y seco que a la misma altitud en barlovento.", "src": "Manual 3 (nov. 2026), capítulo 8.4.2, pp. 52-53", "note": ""}, {"n": 280, "stem": "En la figura del efecto Foehn del manual, el aire que está a 15 ºC al pie de la ladera de barlovento llega al pie de la ladera de sotavento a:", "opts": ["19 ºC", "15 ºC", "6 ºC", "10 ºC"], "ans": 0, "why": "La figura marca 15 ºC al pie de barlovento, 6 ºC en la cima y 19 ºC al pie de sotavento («aire caliente y seco»), con una escala de 0 a 1400 m.", "src": "Manual 3 (nov. 2026), capítulo 8.4.2, p. 53 (figura)", "note": ""}, {"n": 281, "stem": "Según el manual, la visibilidad que percibe el piloto desde el aire respecto a la medida en el suelo:", "opts": ["Es siempre la misma, porque se mide con la misma definición", "No es la misma, porque fenómenos locales como la niebla afectan a la de superficie", "Es siempre mayor que la medida en el suelo, de día y de noche", "Solo difiere de noche, por la iluminación de las luces de pista"], "ans": 1, "why": "El piloto puede tener buena visibilidad al iniciar la aproximación y encontrarse después con una densa niebla en la pista.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 53", "note": ""}, {"n": 282, "stem": "En los informes meteorológicos, el RVR corresponde a:", "opts": ["El valor mínimo de la última hora", "El valor instantáneo en el momento de la observación", "El valor promedio de los 10 minutos anteriores a la hora de observación", "El promedio de las 24 horas anteriores"], "ans": 2, "why": "Se cifra cuando la visibilidad es inferior a 1500 m y se obtiene de transmisómetros situados a 2,5 m de altura.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 54", "note": ""}, {"n": 283, "stem": "¿Cuál de los siguientes NO figura en la lista del manual de fenómenos que afectan a la visibilidad en superficie?", "opts": ["Las calimas (partículas de polvo en suspensión)", "Las ventiscas y los torbellinos de polvo o arena", "El smog y las nubes bajas", "La turbulencia en aire claro"], "ans": 3, "why": "La lista incluye nieblas y neblinas, ventiscas, calimas, contaminación del aire y/o humo, smog, torbellinos de polvo o arena, nubes bajas y precipitaciones intensas.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 54", "note": ""}, {"n": 284, "stem": "Según el manual, entre todos los factores que reducen la visibilidad, el que normalmente influye más es:", "opts": ["La niebla", "La calima", "El humo", "La precipitación intensa"], "ans": 0, "why": "Así lo dice el manual al final del apartado 9.1.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 54", "note": ""}, {"n": 285, "stem": "Para valorar cuánto puede prolongarse una reducción de visibilidad por niebla, neblina o contaminación, el manual destaca como factor muy importante:", "opts": ["La dirección y la intensidad del viento en la tropopausa", "La estabilidad de la atmósfera, porque una inversión dificulta disipar la niebla", "La altura de la tropopausa sobre el aeródromo", "La presión a nivel del mar reducida en condiciones ISA"], "ans": 1, "why": "La inestabilidad favorece los chubascos y las corrientes verticales que arrastran polvo y arena.", "src": "Manual 3 (nov. 2026), capítulo 9.1, p. 54", "note": ""}, {"n": 286, "stem": "Según el manual, la formación de la niebla es consecuencia de la condensación del vapor de agua, que puede producirse por:", "opts": ["Calentamiento del aire o pérdida de vapor", "Solo por la llegada de un frente frío", "Enfriamiento o adición de vapor de agua", "Aumento de la presión atmosférica"], "ans": 2, "why": "Son los mismos dos mecanismos de saturación del capítulo 2.7.", "src": "Manual 3 (nov. 2026), capítulo 9.1.1, p. 55", "note": ""}, {"n": 287, "stem": "La bruma es, según el manual:", "opts": ["Una niebla de menos de 2 m de extensión vertical sobre la pista", "Una niebla que se forma en los valles por enfriamiento nocturno", "Una nube estratiforme baja que no llega a tocar el suelo", "Una neblina causada sobre todo por partículas de sal, típica de zonas costeras"], "ans": 3, "why": "La neblina reduce la visibilidad a más de 1000 m con humedad relativa superior al 70 %; la niebla, a menos de 1000 m.", "src": "Manual 3 (nov. 2026), capítulo 9.1.1, p. 55", "note": ""}, {"n": 288, "stem": "Una nube estratiforme que reduce la visibilidad a valores superiores a 1000 m con una humedad relativa superior al 70 % se llama:", "opts": ["Neblina", "Niebla", "Niebla baja", "Calima"], "ans": 0, "why": "Por debajo de 1000 m es niebla. La niebla baja es la que no supera los 2 m de extensión vertical.", "src": "Manual 3 (nov. 2026), capítulo 9.1.1, p. 55", "note": ""}, {"n": 289, "stem": "¿Cuál de los siguientes NO figura entre los factores de las ilusiones ópticas que cita el manual?", "opts": ["La pendiente y la anchura de la pista", "La frecuencia de radio asignada a la torre", "El agua en el parabrisas", "La falta de contraste de las luces de balizaje con el terreno"], "ans": 1, "why": "También la inclinación del terreno, los fenómenos meteorológicos y la luminosidad durante la maniobra. Pueden hacer creer al piloto que vuela a una altura o distancia diferente de la real.", "src": "Manual 3 (nov. 2026), capítulo 9.2, p. 56", "note": ""}, {"n": 290, "stem": "Según el manual, el engelamiento en vuelo se forma cuando el avión penetra en gotas de agua visibles con una temperatura del aire:", "opts": ["Siempre inferior a -10 ºC, nunca entre 0 ºC y -10 ºC", "Solo entre 0 ºC y -40 ºC, nunca por encima de 0 ºC", "Menor o igual que 0 ºC, y a veces incluso ligeramente superior", "Siempre superior a 0 ºC, por el calentamiento cinético"], "ans": 2, "why": "Las gotas pueden ser de nube o de lluvia.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 56", "note": ""}, {"n": 291, "stem": "Según el manual, el hielo se adhiere principalmente a:", "opts": ["La parte inferior del fuselaje y las zonas a sotavento", "Las superficies interiores de la cabina y de los motores", "Las zonas más protegidas del viento relativo de la aeronave", "Las zonas que más sobresalen y las expuestas al viento relativo"], "ans": 3, "why": "El engelamiento es uno de los mayores riesgos meteorológicos porque puede reducir la eficiencia de la aeronave.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 56", "note": ""}, {"n": 292, "stem": "¿Cuál de los siguientes NO es un efecto del engelamiento según el manual?", "opts": ["El aumento de la sustentación", "El aumento de peso y de resistencia al avance", "Las falsas indicaciones de los instrumentos e interferencias en las comunicaciones", "La pérdida de efectividad de los frenos y de todo el tren de aterrizaje"], "ans": 0, "why": "Provoca disminución de la sustentación, además de reducción de visibilidad y maniobrabilidad, pérdida de potencia, vibraciones que provocan fatiga estructural y daños en los motores.", "src": "Manual 3 (nov. 2026), capítulo 9.3, pp. 56-57", "note": ""}, {"n": 293, "stem": "Un engelamiento en el que el depósito de hielo crece rápido incluso en periodos muy cortos, pero que los equipos de defensa de a bordo son capaces de deshacer, es:", "opts": ["Ligero", "Moderado", "Fuerte", "Extremo"], "ans": 1, "why": "La intensidad se mide por la velocidad de acumulación y sus efectos. El manual da tres grados (ligero, moderado y fuerte); «extremo» es un grado de la turbulencia.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 57", "note": ""}, {"n": 294, "stem": "¿Cuál de los siguientes NO es uno de los cuatro procesos de engelamiento en vuelo del manual?", "opts": ["Hielo claro o transparente", "Lluvia engelante", "Engelamiento por granizo", "Depósito de nieve húmeda o escarcha"], "ans": 2, "why": "Los cuatro son hielo claro o transparente, hielo granulado, lluvia engelante y depósito de nieve húmeda o escarcha.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 57", "note": ""}, {"n": 295, "stem": "Según el manual, el hielo granulado (<em>rime icing</em>):", "opts": ["Es el engelamiento más peligroso", "Se congela lentamente y tiene gran adherencia", "Se forma solo con temperaturas por encima de 0 ºC", "No presenta grandes problemas para las operaciones"], "ans": 3, "why": "Es blanco, opaco, rugoso, de mala adherencia y congelación rápida; se favorece entre 0 ºC y -40 ºC, habitualmente entre -10 ºC y -20 ºC.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 58", "note": ""}, {"n": 296, "stem": "Según el manual, la lluvia engelante se forma cuando:", "opts": ["Gotas de una capa por encima de 0 ºC se sobreenfrían al cruzar capas bajo 0 ºC", "Cristales de hielo coexisten con gotas subfundidas en la nube", "La nieve se funde al llegar a una capa cálida próxima al suelo", "El vapor de agua se sublima directamente sobre el ala"], "ans": 0, "why": "B describe la nieve húmeda o escarcha.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 58", "note": ""}, {"n": 297, "stem": "¿Qué pareja es correcta según el manual?", "opts": ["Hielo claro: congelación rápida; hielo granulado: congelación lenta", "Hielo claro: congelación lenta y gran adherencia; hielo granulado: congelación rápida y mala adherencia", "Hielo claro: blanco y opaco; hielo granulado: transparente", "Hielo claro: sin peligro; hielo granulado: el más peligroso"], "ans": 1, "why": "El hielo claro es homogéneo, casi transparente, vidrioso y liso, y es muy peligroso; el granulado es blanco, opaco y rugoso.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 58", "note": ""}, {"n": 298, "stem": "Según el manual, el engelamiento por escarcha o nieve húmeda sobre aviones aparcados a la intemperie:", "opts": ["No tiene efecto sobre el despegue si los motores están calientes", "Solo afecta a los parabrisas y a la visibilidad del piloto", "Puede ser muy peligroso si se despega sin retirarlo y obligar a cancelar el despegue", "Solo puede producirse en vuelo, nunca sobre aviones en tierra"], "ans": 2, "why": "El hielo muy adherido altera el perfil aerodinámico, disminuye la sustentación y aumenta la resistencia. Este engelamiento puede generarse tanto en tierra como en vuelo.", "src": "Manual 3 (nov. 2026), capítulo 9.3, p. 59", "note": ""}, {"n": 299, "stem": "Según el manual, la cizalladura en niveles bajos es de especial importancia:", "opts": ["Por encima de la tropopausa, cerca de las nubes nacaradas", "En crucero, cerca del eje de las corrientes en chorro", "Solo con cielo despejado y viento en calma en superficie", "Debajo de la capa de fricción, donde afecta a la senda de planeo"], "ans": 3, "why": "En niveles altos la cizalladura favorece la aparición de turbulencia; en niveles bajos es un peligro para el aterrizaje y el despegue.", "src": "Manual 3 (nov. 2026), capítulo 9.4, p. 59", "note": ""}, {"n": 300, "stem": "Según el manual, los frentes de racha son:", "opts": ["Ráfagas en la frontera entre el aire frío de la tormenta y el aire más cálido", "Frentes fríos que se desplazan a más de 25 kt sobre el terreno", "Rotores que se forman bajo la primera onda de montaña", "Vientos catabáticos nocturnos que bajan por las laderas"], "ans": 0, "why": "Forman parte del ciclo normal de formación de las tormentas y originan cizalladura.", "src": "Manual 3 (nov. 2026), capítulo 9.4, p. 59", "note": ""}, {"n": 301, "stem": "Según el manual, las inversiones térmicas cerca del suelo que pueden originar cizalladura están asociadas a:", "opts": ["Las corrientes en chorro y la tropopausa de latitudes medias", "Zonas frontales, brisas (sobre todo marinas) y vientos catabáticos", "Los ciclones trop
