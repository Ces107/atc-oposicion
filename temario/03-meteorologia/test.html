icales y las tormentas de masa de aire", "La subsidencia en la Zona de Convergencia Intertropical"], "ans": 1, "why": "También originan cizalladura las tormentas (microrreventones, frentes de racha), los tornados, los frentes fríos o cálidos y los vientos fuertes perturbados por el relieve.", "src": "Manual 3 (nov. 2026), capítulo 9.4, p. 59", "note": ""}, {"n": 302, "stem": "Según el manual, en aviación se considera que existe turbulencia cuando:", "opts": ["La velocidad del viento en superficie supera los 25 kt", "Hay nubes de desarrollo vertical en las proximidades", "Sus efectos afectan al movimiento del avión, con aceleraciones sobre todo verticales", "La temperatura varía más de 2 ºC por cada 1000 ft"], "ans": 2, "why": "La turbulencia es un estado del flujo con fluctuaciones irregulares de velocidad, con vórtices que suman o restan su velocidad a la del viento predominante.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 60", "note": ""}, {"n": 303, "stem": "Una turbulencia que causa variaciones amplias y violentas en la altura y en el ángulo de ataque del avión es:", "opts": ["Ligera", "Moderada", "Extrema", "Fuerte"], "ans": 3, "why": "Con la extrema el avión es zarandeado violentamente y es prácticamente ingobernable; la moderada suele exigir la intervención del piloto.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 60", "note": ""}, {"n": 304, "stem": "Según el manual, si la atmósfera es estable, la convección:", "opts": ["Solo afecta a las capas bajas y, con humedad suficiente, da cúmulos de poco desarrollo", "Genera siempre cumulonimbos que atraviesan la tropopausa", "Desaparece por completo, incluso en los días calurosos", "Solo afecta a los niveles altos, por encima de las nubes"], "ans": 0, "why": "Con humedad e inestabilidad en capas medias y altas, las ascendentes pueden ir acompañadas de grandes nubes de desarrollo vertical.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 60", "note": ""}, {"n": 305, "stem": "Según el manual, la intensidad de la turbulencia mecánica depende de:", "opts": ["La humedad relativa y la temperatura del aire en superficie", "El tamaño de los obstáculos, la velocidad del viento y la rugosidad del terreno", "El peso y la configuración de la aeronave que la atraviesa", "La hora del día y el calentamiento solar del terreno"], "ans": 1, "why": "Los obstáculos van desde grupos de árboles o edificios hasta cadenas de montañas; la debida a montañas es la turbulencia por ondas de montaña.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 61", "note": ""}, {"n": 306, "stem": "En la turbulencia mecánica, si el aire es inestable:", "opts": ["Los remolinos son más pequeños y afectan a un espesor menor", "No hay turbulencia", "Se forman remolinos grandes y la turbulencia afecta a un espesor mayor de la atmósfera", "La turbulencia solo afecta al suelo"], "ans": 2, "why": "Con aire estable los remolinos son más pequeños y la turbulencia afecta a un espesor menor.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 61", "note": ""}, {"n": 307, "stem": "Según el manual, la intensidad de los vórtices de la turbulencia de estela depende de:", "opts": ["La temperatura del aire, la humedad y la visibilidad", "El reglaje del altímetro y el nivel de vuelo asignado", "La longitud, la anchura y la orientación de la pista", "El tamaño del avión, su velocidad y la configuración de las alas"], "ans": 3, "why": "La producen los aviones en vuelo, en el aterrizaje y en el despegue; los remolinos se desplazan con el viento y tardan en disiparse.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 61", "note": ""}, {"n": 308, "stem": "Según el manual, las ondas de montaña afectan:", "opts": ["A todas las aeronaves en el ascenso, pero especialmente a las ligeras en el descenso", "Solo a las aeronaves pesadas", "Solo a las aeronaves en crucero por encima de la tropopausa", "A todas las aeronaves en el descenso, pero especialmente a las pesadas en el ascenso"], "ans": 0, "why": "Son muy peligrosas y han causado numerosos accidentes.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 62", "note": ""}, {"n": 309, "stem": "Según el manual, la onda de montaña suele desaparecer en niveles muy altos, salvo cuando:", "opts": ["La atmósfera es inestable por encima de la cima de la montaña", "Hay una corriente en chorro casi perpendicular a la montaña que refuerza la onda", "El viento en la cima de la montaña es inferior a 15 kt", "Se forman nubes de bonete o sombrero sobre la cima"], "ans": 1, "why": "En niveles bajos, la onda más peligrosa se asocia a rotores, sobre todo el de debajo de la primera onda.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 62", "note": ""}, {"n": 310, "stem": "Según el manual, las peligrosas nubes rotor de una onda de montaña, con aire girando en un eje horizontal, son:", "opts": ["Altocúmulos y altoestratos", "Cumulonimbos y nimbostratos", "Fractocúmulos y fractostratos", "Cirros y cirrostratos"], "ans": 2, "why": "Nubes lenticulares: altocúmulos y altoestratos; nubes de ladera y cresta: cumulonimbos y nimbostratos; nubes de bonete o sombrero: estratiformes.", "src": "Manual 3 (nov. 2026), capítulo 9.5, pp. 62-63", "note": ""}, {"n": 311, "stem": "Según el manual, las nubes lenticulares de una onda de montaña son:", "opts": ["Fractocúmulos y fractostratos", "Cumulonimbos y nimbostratos", "Estratiformes de tipo bonete", "Altocúmulos y altoestratos"], "ans": 3, "why": "Cuando hay humedad, las ondas pueden presentar nubes en los tramos de ascenso del aire.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 62", "note": ""}, {"n": 312, "stem": "Respecto a la dirección del viento como condición de la onda de montaña, el manual indica que:", "opts": ["Debe formar menos de 30º con la perpendicular al eje; cuanto menor el ángulo, más intensa la onda", "Debe ser paralela al eje de la montaña para que se forme la onda", "Debe formar más de 30º con la perpendicular al eje de la montaña", "Puede variar libremente si el viento en la cima es fuerte"], "ans": 0, "why": "Además debe ser constante, con viento en la cima superior a 15 kt que aumente con la altura y una capa estable por encima de la cima.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 62", "note": ""}, {"n": 313, "stem": "En la figura del manual «Onda de montaña típica y turbulencia en aire claro (TAC)», la línea rotulada «Tropopausa y corriente en chorro» se dibuja hacia:", "opts": ["10 000 ft", "40 000 ft", "20 000 ft", "60 000 ft"], "ans": 1, "why": "El eje vertical está en miles de pies; la figura dibuja nubes lenticulares, nube rotor con cúmulos y estratocúmulos, nimbostratos y cumulonimbos sobre la cresta, y símbolos de turbulencia.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 63 (figura)", "note": ""}, {"n": 314, "stem": "Según el manual, la turbulencia en aire claro (TAC):", "opts": ["En general es severa y en algunos casos llega a ser extrema", "En general es moderada y aparece sobre todo dentro de las nubes", "En general es ligera y solo en algunos casos puede ser severa", "En general es ligera, pero aparece sobre todo en niveles bajos"], "ans": 2, "why": "Aparece en vuelos de alta cota y muchas veces fuera de nubes.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 63", "note": ""}, {"n": 315, "stem": "Según el manual, el mecanismo de la TAC en capas estables de niveles altos es:", "opts": ["El calentamiento del suelo, que crea corrientes convectivas verticales", "Los obstáculos del terreno, que perturban la marcha del viento", "La estela que dejan tras de sí las aeronaves pesadas en crucero", "La parte superior de una capa estable se desliza sobre la inferior y la cizalladura forma remolinos"], "ans": 3, "why": "También aparece cerca de las corrientes en chorro y puede asociarse a ondas de montaña o a dorsales y vaguadas en niveles altos.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 63", "note": ""}, {"n": 316, "stem": "Además de cerca de las corrientes en chorro, el manual indica que la TAC puede aparecer asociada a:", "opts": ["Ondas de montaña o dorsales y vaguadas en niveles altos", "Nieblas de valle o inversiones térmicas junto al suelo", "Brisas de mar o vientos catabáticos en la costa", "Corrientes convectivas en superficie en días de verano"], "ans": 0, "why": "Con mayor frecuencia se presenta en capas estables de niveles altos con fuerte cizalladura vertical del viento.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 63", "note": ""}, {"n": 317, "stem": "Cuando la TAC se presenta en forma de meneos, según el manual:", "opts": ["El avión sufre grandes y repentinos cambios de altitud", "No hay grandes variaciones de altitud, sino sacudidas con un ruido de martilleo", "El avión es zarandeado y se vuelve prácticamente ingobernable", "Solo se nota en la cabina de pasajeros, no en los mandos"], "ans": 1, "why": "Cuando se presenta en forma de baches, el avión sufre un cambio de altitud.", "src": "Manual 3 (nov. 2026), capítulo 9.5, p. 64", "note": ""}, {"n": 318, "stem": "¿Cuál de las siguientes NO figura entre las condiciones necesarias para que se desarrollen cumulonimbos de tormenta según el manual?", "opts": ["Presencia de energía en forma de calor, sobre todo en superficie", "Atmósfera inestable", "Una inversión térmica en superficie", "Humedad suficiente"], "ans": 2, "why": "Una inversión estabiliza el aire e impide los movimientos verticales. En algunos casos se necesita además un mecanismo de elevación (convergencia de vientos a baja cota, ascendencia orográfica, etc.). Una tormenta se produce cuando hay cumulonimbos con aparato eléctrico.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 64", "note": ""}, {"n": 319, "stem": "Según el manual, en climas secos:", "opts": ["No se forman tormentas, por la falta de humedad en superficie", "Las tormentas llevan siempre granizo de gran tamaño", "Las tormentas duran más de 12 horas por la falta de lluvia", "Puede haber tormentas secas, sin precipitación o con precipitación que no llega al suelo"], "ans": 3, "why": "Las tormentas suelen ir acompañadas de chubascos e incluso granizo, turbulencia fuerte o extrema, viento fuerte y racheado, engelamiento y cizalladura: reúnen todos los elementos capaces de dañar a un avión en vuelo.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 64", "note": ""}, {"n": 320, "stem": "Según el manual, las tormentas frontales asociadas a un frente frío:", "opts": ["Se extienden a lo largo del frente durante varios centenares de kilómetros", "Abarcan un área de grandes dimensiones inmersas en nimbostratos", "Son siempre células aisladas de corta duración", "Tienen dimensiones de decenas de kilómetros cuadrados"], "ans": 0, "why": "Las de frente cálido abarcan un área de grandes dimensiones, en general con menor desarrollo, inmersas en los nimbostratos; D describe las tormentas de masa de aire.", "src": "Manual 3 (nov. 2026), capítulo 9.6, pp. 64-65", "note": ""}, {"n": 321, "stem": "Según el manual, las tormentas frontales, en comparación con las células tormentosas aisladas:", "opts": ["Son menos duraderas, porque se disipan al pasar el frente", "Son más duraderas, porque aparecen encadenadas unas a otras", "Son siempre estacionarias, sin desplazarse con el frente", "Solo se dan en verano, con el calentamiento diurno"], "ans": 1, "why": "Las líneas tormentosas suelen desplazarse con el avance del frente, aunque a veces son estacionarias.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 65", "note": ""}, {"n": 322, "stem": "Las tormentas de masa de aire, según el manual:", "opts": ["Se deben al ascenso del aire cálido sobre una superficie frontal", "Abarcan siempre cientos de kilómetros a lo largo de un frente", "Se deben sobre todo al calentamiento diurno en atmósfera inestable y miden decenas de km²", "Son muy frecuentes en las latitudes altas durante todo el año"], "ans": 2, "why": "Pueden ser de origen térmico, orográfico o de mezcla turbulenta. En latitudes altas, donde el calentamiento solar prácticamente no existe, son muy raras.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 65", "note": ""}, {"n": 323, "stem": "Según el manual, en latitudes medias las tormentas de masa de aire aparecen preferentemente:", "opts": ["En las noches de invierno", "En cualquier época del año, como en el ecuador", "Solo en otoño", "En las tardes de verano y primavera"], "ans": 3, "why": "En las zonas ecuatoriales se dan en cualquier época del año; en latitudes superiores son muy raras.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 65", "note": ""}, {"n": 324, "stem": "En la fase de formación de una tormenta, según el manual:", "opts": ["Las ascendentes elevan el aire húmedo y empiezan descendentes fuera de la nube, más débiles", "Las corrientes descendentes se extienden por todo el nivel inferior de la nube", "Las corrientes descendentes llegan al suelo y forman el frente de racha", "Aparece el yunque en la parte superior y las descargas eléctricas son frecuentes"], "ans": 0, "why": "La condensación libera energía suficiente para que el aire húmedo siga subiendo. B es la disipación; C y D, la madurez.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 65", "note": ""}, {"n": 325, "stem": "En la figura del manual «Etapa de formación de una tormenta», la nube se dibuja hasta unos ___ con una anchura en la base de ___:", "opts": ["45 000 ft y 10 km", "30 000 ft y 8 km", "40 000 ft y 10 km", "20 000 ft y 5 km"], "ans": 1, "why": "Formación: 30 000 ft y 8 km; madurez: 45 000 ft y 10 km; disipación: 40 000 ft y 10 km. En las tres figuras se dibuja la isoterma de 0 ºC.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 65 (figura)", "note": ""}, {"n": 326, "stem": "En la figura del manual «Etapa de madurez de una tormenta», la nube alcanza unos:", "opts": ["30 000 ft", "40 000 ft", "45 000 ft", "60 000 ft"], "ans": 2, "why": "La figura dibuja hielo arriba, nieve en medio y lluvia bajo la isoterma de 0 ºC, sobre una base de 10 km.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 66 (figura)", "note": ""}, {"n": 327, "stem": "En la figura del manual «Etapa de disipación de una tormenta», la nube se dibuja hasta unos:", "opts": ["30 000 ft", "45 000 ft", "20 000 ft", "40 000 ft"], "ans": 3, "why": "Con 10 km de base y corrientes descendentes en toda la nube.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 67 (figura)", "note": ""}, {"n": 328, "stem": "Según el manual, la fase de madurez de una tormenta comienza cuando:", "opts": ["Las gotas o el hielo empiezan a caer por su peso, como chubascos y granizo", "Desaparecen las corrientes ascendentes de la nube", "Se forman los primeros cúmulos por el calentamiento diurno", "La precipitación disminuye y la nube empieza a disiparse"], "ans": 0, "why": "En esta fase las descendentes coexisten con ascendentes de máxima intensidad, puede aparecer el yunque y hay frecuentes descargas eléctricas.", "src": "Manual 3 (nov. 2026), capítulo 9.6, p. 66", "note": ""}, {"n": 329, "stem": "¿Cuál de las siguientes NO figura entre las condiciones de tiempo severo asociadas a una línea de turbonada según el manual?", "opts": ["Vientos fuertes y destructivos", "Nieblas persistentes", "Granizo fuerte y turbulencia severa", "Tornados"], "ans": 1, "why": "La línea de turbonada es una línea de tormentas muy activas.", "src": "Manual 3 (nov. 2026), capítulo 9.6.1, p. 67", "note": ""}, {"n": 330, "stem": "Cuando el aire descendente de un microrreventón alcanza el suelo, forma torbellinos horizontales (vórtices anulares) que pueden alcanzar:", "opts": ["Hasta 5 km de altura sobre el suelo", "Hasta 100 m de altura sobre el suelo", "Hasta 1 km de altura sobre el suelo", "Hasta la tropopausa"], "ans": 2, "why": "Además, no siempre son simétricos. El microrreventón es una fuerte corriente descendente de aire frío y denso que se origina desde una nube convectiva.", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 67", "note": ""}, {"n": 331, "stem": "La escala espacial de un microrreventón, según el manual, suele abarcar una distancia de:", "opts": ["Hasta 50 km", "Cientos de kilómetros", "Hasta 500 m", "Hasta 5 km"], "ans": 3, "why": "Dura entre 1 y 5 minutos, nunca más de 15 desde que llega al suelo hasta que desaparece.", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 68", "note": ""}, {"n": 332, "stem": "Según el manual, un microrreventón genera vientos que pueden alcanzar:", "opts": ["Hasta 150 kt, con variaciones de más de 50 kt y cambios de presión que alteran los instrumentos", "Hasta 60 kt en superficie, sin ningún efecto sobre los instrumentos", "Más de 270 kt, con un diámetro de hasta 1 km", "Hasta 25 kt, desplazándose a lo largo de un frente frío"], "ans": 0, "why": "60 kt es la corriente descendente; más de 270 kt son los vientos en superficie de un tornado.", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 68", "note": ""}, {"n": 333, "stem": "Según el manual, el diámetro de un tornado puede variar desde:", "opts": ["100 metros hasta 10 kilómetros", "Menos de 10 metros hasta 1 kilómetro", "1 kilómetro hasta 5 kilómetros", "Menos de 100 metros hasta 5 kilómetros"], "ans": 1, "why": "Se desplaza sobre el suelo a una media de unos 25 kt y puede provocar vientos en superficie de más de 270 kt.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 334, "stem": "Un tornado se origina, según el manual:", "opts": ["En la base de un nimbostrato", "Sobre el mar, por la brisa", "En la base de un cumulonimbo", "En la tropopausa"], "ans": 2, "why": "Se origina en la base del cumulonimbo y se extiende hasta el suelo. Es una columna de aire que rota violentamente; su giro ciclónico succiona el aire de su interior y genera una caída de presión.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 335, "stem": "En una tromba marina, según el manual:", "opts": ["El viento supera siempre los 270 kt", "El torbellino no alcanza la superficie", "El giro es anticiclónico", "El agua es aspirada hasta centenares de metros de altura"], "ans": 3, "why": "Es un tornado formado sobre el mar. Si el torbellino no alcanza la superficie, se llama tuba.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 336, "stem": "¿Dónde se denomina «ciclón» al ciclón tropical, según el manual?", "opts": ["En la Bahía de Bengala y el Mar Arábigo", "En el Atlántico norte occidental y el mar Caribe", "En Filipinas, Taiwán, China y Japón", "En el golfo de México"], "ans": 0, "why": "«Huracán»: Atlántico norte occidental, parte central y oriental del Pacífico norte, mar Caribe y golfo de México; «tifón»: Filipinas, Taiwán, China y Japón.", "src": "Manual 3 (nov. 2026), capítulo 9.7, p. 69", "note": ""}, {"n": 337, "stem": "Ordene de menor a mayor intensidad del viento en superficie las denominaciones que recibe una depresión tropical según el manual:", "opts": ["Depresión tropical, perturbación tropical, tormenta tropical, huracán", "Perturbación tropical, depresión tropical, tormenta tropical, huracán", "Perturbación tropical, tormenta tropical, depresión tropical, huracán", "Tormenta tropical, depresión tropical, perturbación tropical, huracán"], "ans": 1, "why": "Perturbación: vientos ligeros; depresión: hasta 33 kt; tormenta: 34-63 kt; huracán, ciclón o tifón: más de 64 kt.", "src": "Manual 3 (nov. 2026), capítulo 9.7, p. 70", "note": ""}, {"n": 338, "stem": "Según el manual, la presencia de un ciclón, tifón o huracán:", "opts": ["Obliga a desviar el tráfico solo por encima de FL 300", "Exige aumentar la separación a 10 NM", "Es razón suficiente para suspender toda actividad aérea", "Solo afecta a la aviación ligera"], "ans": 2, "why": "Así termina el apartado de ciclones tropicales.", "src": "Manual 3 (nov. 2026), capítulo 9.7, p. 70", "note": ""}, {"n": 339, "stem": "¿A partir de qué viento máximo en superficie una depresión tropical recibe la denominación de huracán, ciclón o tifón según el manual?", "opts": ["Más de 33 kt", "Más de 34 kt", "Más de 100 kt", "Más de 64 kt"], "ans": 3, "why": "La tormenta tropical va de 34 a 63 kt y la depresión tropical, hasta 33 kt. Atención a la cifra exacta del manual: «mayores a 64 kt».", "src": "Manual 3 (nov. 2026), capítulo 9.7, p. 70", "note": ""}, {"n": 340, "stem": "Según el manual, las corrientes convectivas se producen porque:", "opts": ["El suelo caliente calienta por conducción el aire, que se hace menos denso y asciende", "El aire frío de altura desciende por subsidencia y calienta el suelo", "El viento choca con una cadena montañosa y asciende por la ladera", "La radiación terrestre reflejada por las nubes calienta las capas altas"], "ans": 0, "why": "Al ascender, ese aire se expande y se enfría, por lo que en algún momento vuelve a descender. Las corrientes convectivas pueden provocar turbulencia y a veces súbitos y bruscos ascensos y descensos de las aeronaves.", "src": "Manual 3 (nov. 2026), capítulo 9.8, p. 70", "note": ""}, {"n": 341, "stem": "¿Cómo varía la presión atmosférica con la altitud?", "opts": ["Disminuye linealmente, 1 mb cada 9 m, a cualquier altitud", "Disminuye de forma exponencial", "Aumenta hasta la tropopausa y después disminuye", "Disminuye de forma lineal hasta unos 11 km de altitud"], "ans": 1, "why": "El manual dice que «el descenso de la presión con la altitud no es lineal»: solo en los primeros metros baja de forma aproximadamente lineal (1 mb por cada 9 m), y después «adquiere una forma exponencial». El examen real de febrero de 2026 preguntó este dato con «linealmente» como trampa.", "src": "Manual 3 (nov. 2026), capítulo 2.4, p. 13", "note": ""}, {"n": 342, "stem": "Cuando un volumen de aire está saturado, su humedad relativa es del:", "opts": ["70 %", "100 %", "90 %", "80 %"], "ans": 1, "why": "La humedad relativa es el cociente entre el vapor que contiene el aire y el máximo que puede almacenar a esa temperatura; por eso, «cuando el volumen de aire esté saturado, su humedad relativa será del 100%». Lo preguntó el examen real de febrero de 2026.", "src": "Manual 3 (nov. 2026), capítulo 2.7, p. 17", "note": ""}, {"n": 343, "stem": "Las depresiones tropicales se forman cuando el agua del mar está, aproximadamente, por encima de:", "opts": ["22 ºC", "25 ºC", "30 ºC", "27 ºC"], "ans": 3, "why": "Se forman entre los 25ºN y los 25ºS, «cuando el agua del mar está muy caliente (aproximadamente por encima de 27ºC)». El 25 es la latitud, no la temperatura. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 3 (nov. 2026), capítulo 9.7, p. 70", "note": ""}, {"n": 344, "stem": "En los mensajes aeronáuticos, la abreviatura OACI OVC indica:", "opts": ["Cielo cubierto", "Nubosidad dispersa, de 3 a 4 octas", "Nuboso, de 5 a 7 octas", "Algunas nubes, de 1 a 2 octas"], "ans": 0, "why": "Lista del manual: OVC, cielo cubierto; BKN, nuboso (5 a 7 octas); SCT, nubosidad dispersa (3 a 4 octas); FEW, algunas nubes (1 a 2 octas); NSC, sin nubes de importancia para las operaciones. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 345, "stem": "¿Qué porcentaje del aire seco cerca del nivel del mar es oxígeno?", "opts": ["78 %", "1 %", "21 %", "16 %"], "ans": 2, "why": "Composición del manual: 78 % de nitrógeno (N2), 21 % de oxígeno (O2) y 1 % de otros gases (Ar, Ne, CO2, H2, O3…). El 78 % es el nitrógeno. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 3 (nov. 2026), capítulo 2.1, p. 10", "note": ""}, {"n": 346, "stem": "En la atmósfera estándar (ISA), la temperatura y la presión a nivel del mar son:", "opts": ["0 ºC y 1013,25 hPa", "15 ºC y 1000 hPa", "15 ºC y 760 hPa", "15 ºC y 1013,25 hPa"], "ans": 3, "why": "«A nivel del mar tiene una temperatura de 15ºC (288,15 K), una presión de 1013,25 hPa (760 mm Hg) y una densidad de 1,2250 kg/m3». 760 es la presión en mm Hg, no en hPa. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 3 (nov. 2026), capítulo 2.10.1, p. 21", "note": ""}, {"n": 347, "stem": "¿Qué afirmación sobre la cizalladura del viento es FALSA?", "opts": ["Puede ser horizontal, vertical o una combinación de ambas", "En niveles altos de la atmósfera favorece la aparición de turbulencia", "Es la diferencia de temperatura entre dos puntos próximos", "En niveles bajos es un peligro para el despegue y el aterrizaje"], "ans": 2, "why": "La cizalladura es «un cambio en la velocidad y/o la dirección del viento entre dos puntos próximos», no de temperatura. A, B y D son frases del manual. El examen real de 2023 preguntó la afirmación falsa con esta misma trampa.", "src": "Manual 3 (nov. 2026), capítulo 9.4, p. 59", "note": ""}, {"n": 348, "stem": "¿Cuál de estos procesos NO es uno de los mecanismos de transferencia de calor que describe el manual?", "opts": ["La turbulencia", "La advección", "La evapotranspiración", "Las corrientes oceánicas"], "ans": 2, "why": "El intercambio de calor se realiza por conducción, convección, advección y turbulencia, y entre latitudes también por las corrientes de convección y las corrientes oceánicas que van de los trópicos a los polos. La evapotranspiración es una parte del ciclo hidrológico (evaporación del agua de la vegetación), no un mecanismo de transferencia de calor. El examen real de 2023 preguntó esto con «transpiración».", "src": "Manual 3 (nov. 2026), capítulo 3.3, pp. 30-31; capítulo 2.2, p. 12", "note": ""}, {"n": 349, "stem": "En un aeródromo situado al nivel del mar, una aeronave cala el altímetro a QNH y otra a QFE. En tierra, sus altímetros indicarán:", "opts": ["Lo mismo, porque allí el QNH coincide con el QFE", "Una diferencia igual a la elevación del aeródromo sobre el nivel medio del mar", "Más altitud el calado a QFE que el calado a QNH", "El de QNH, la altitud del aeródromo; el de QFE, un nivel de vuelo"], "ans": 0, "why": "«En el caso de que el aeropuerto esté al nivel del mar, el QNH coincidirá con el QFE»; por encima del nivel del mar el QNH es mayor que el QFE y por debajo, menor. Con QNH el altímetro indica la altitud del aeródromo y con QFE indicaría cero, que aquí es lo mismo. El examen real de 2023 planteó este caso de dos aeronaves.", "src": "Manual 3 (nov. 2026), capítulo 2.10.3, p. 25", "note": ""}, {"n": 350, "stem": "Respecto al nivel de transición, la altitud de transición se sitúa:", "opts": ["Por encima, separada de él por la capa de transición", "Por debajo, separada de él por la capa de transición", "A la misma altura, salvo cuando el QNH es bajo", "Por encima o por debajo, según las condiciones meteorológicas"], "ans": 1, "why": "El nivel de transición es «el nivel de vuelo más bajo disponible por encima de la altitud de transición», y la capa de transición es la situada entre ambos, con un espesor siempre igual o mayor que 1000 ft. Lo que depende de la meteorología es el valor del nivel de transición, no su posición. Lo preguntó el examen real de 2023.", "src": "Manual 3 (nov. 2026), capítulo 2.10.5, p. 26", "note": ""}, {"n": 351, "stem": "En los mensajes aeronáuticos, la abreviatura OACI BKN indica:", "opts": ["Cielo cubierto", "Nubosidad dispersa", "Algunas nubes", "Nuboso"], "ans": 3, "why": "BKN: nuboso, de 5 a 7 octas de cielo cubierto. OVC es cielo cubierto, SCT nubosidad dispersa y FEW algunas nubes. El examen real de 2017 preguntó el significado de BKN con estas mismas alternativas.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 352, "stem": "¿Qué Anexo de la OACI regula el servicio meteorológico prestado a la navegación aérea internacional?", "opts": ["Anexo 3", "Anexo 11", "Anexo 10", "Anexo 14"], "ans": 0, "why": "«El servicio meteorológico prestado a la navegación aérea internacional está regulado por el Anexo 3 de OACI». El Anexo 10 trata de telecomunicaciones, el 11 de servicios de tránsito aéreo y el 14 de aeródromos. Lo preguntó el examen real de 2017.", "src": "Manual 3 (nov. 2026), capítulo 1.2, p. 5", "note": ""}, {"n": 353, "stem": "Un tornado es:", "opts": ["Un cambio en la velocidad o la dirección del viento entre dos puntos próximos", "Una fuerte corriente descendente de aire frío y denso que nace en una nube convectiva", "Una columna de aire que rota violentamente", "Una línea de tormentas muy activas de cientos de kilómetros de longitud"], "ans": 2, "why": "Definición del manual: «Un tornado es una columna de aire que rota violentamente», originada en la base de un cumulonimbo. A es la cizalladura, B el microrreventón y D la línea de turbonada. El examen real de 2017 usó estas cuatro definiciones como opciones.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 354, "stem": "El microrreventón es:", "opts": ["Una columna de aire que rota violentamente desde la base de un cumulonimbo", "Un cambio en la velocidad o la dirección del viento entre dos puntos próximos", "Una línea de tormentas muy activas, de 20 a 50 km de anchura", "Una fuerte corriente descendente de aire frío y denso"], "ans": 3, "why": "«El microrreventón es una fuerte corriente de aire descendente de aire frío y denso que se origina desde una nube convectiva». A es el tornado, B la cizalladura y C la línea de turbonada. Lo preguntó el examen real de 2017 con estas definiciones como opciones.", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 67", "note": ""}, {"n": 355, "stem": "Un frente frío se produce cuando:", "opts": ["Una masa de aire caliente desplaza a una fría y asciende sobre ella", "Una masa de aire frío desplaza a una caliente y ocupa su lugar", "Dos masas de aire se encuentran sin que ninguna desplace a la otra", "Un frente cálido alcanza al frío y eleva el sector frío en altura"], "ans": 1, "why": "Frente frío: «cuando una masa de aire frío desplaza a una caliente ocupando su lugar, avanzando como una cuña y obligando al aire caliente a ascender». A es el frente cálido y C el estacionario. Lo preguntó el examen real de 2017.", "src": "Manual 3 (nov. 2026), capítulo 7.2, p. 40", "note": ""}, {"n": 356, "stem": "¿Qué fenómeno define el manual como «un cambio en la velocidad y/o la dirección del viento entre dos puntos próximos»?", "opts": ["La cizalladura", "La turbulencia", "El microrreventón", "El frente de racha"], "ans": 0, "why": "Es la definición de la cizalladura del viento (<em>wind shear</em>). La turbulencia se debe a corrientes desordenadas, el microrreventón es una corriente descendente y los frentes de racha son ráfagas en la frontera entre el aire frío de la tormenta y el aire cálido del entorno.", "src": "Manual 3 (nov. 2026), capítulo 9.4, p. 59", "note": ""}, {"n": 357, "stem": "Una línea de tormentas muy activas, de hasta cientos de kilómetros de longitud y de 20 a 50 km de anchura, es:", "opts": ["Un frente de racha", "Una línea de turbonada", "Un microrreventón", "Una tromba marina"], "ans": 1, "why": "«Una línea de turbonada es una línea de tormentas muy activas que puede alcanzar una dimensión de hasta cientos de kilómetros de longitud y de 20 a 50 Km de anchura», con un desplazamiento medio de unos 25 kt.", "src": "Manual 3 (nov. 2026), capítulo 9.6.1, p. 67", "note": ""}, {"n": 358, "stem": "En los mensajes aeronáuticos, la abreviatura OACI FEW indica:", "opts": ["Nubosidad dispersa", "Nuboso", "Algunas nubes", "Sin nubes de importancia"], "ans": 2, "why": "FEW: algunas nubes, de 1 a 2 octas de cielo cubierto. SCT es nubosidad dispersa (3 a 4 octas), BKN nuboso (5 a 7 octas) y NSC sin nubes de importancia para las operaciones.", "src": "Manual 3 (nov. 2026), capítulo 8.1.3, p. 46", "note": ""}, {"n": 359, "stem": "¿Cuánto suele durar un microrreventón?", "opts": ["Entre 15 y 30 minutos", "Entre 5 y 15 minutos", "Entre 1 y 5 minutos", "Entre 30 y 60 minutos"], "ans": 2, "why": "Su escala es muy pequeña: abarca hasta 5 km y dura «entre 1 y 5 minutos, nunca más de 15 minutos desde que llega al suelo hasta que desaparece».", "src": "Manual 3 (nov. 2026), capítulo 9.6.2, p. 68", "note": ""}, {"n": 360, "stem": "Un tornado se desplaza sobre el suelo a una velocidad media aproximada de:", "opts": ["25 kt", "60 kt", "150 kt", "270 kt"], "ans": 0, "why": "El tornado «se desplaza sobre el suelo a una velocidad media de 25 kt aproximadamente», y puede provocar vientos en superficie de más de 270 kt. 60 kt es la corriente descendente de un microrreventón y 150 kt sus vientos máximos.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 361, "stem": "Los vientos en superficie que provoca un tornado pueden superar los:", "opts": ["64 kt", "150 kt", "60 kt", "270 kt"], "ans": 3, "why": "El tornado llega «a provocar vientos en superficie con valores superiores a 270 kt». 150 kt es el máximo de un microrreventón, 60 kt su corriente descendente y 64 kt el umbral del huracán.", "src": "Manual 3 (nov. 2026), capítulo 9.6.3, p. 68", "note": ""}, {"n": 362, "stem": "En la ecuación de estado de los gases perfectos P = dRT que da el manual, la constante R vale:", "opts": ["287 hPa cm³/kg K", "2870 hPa cm³/kg K", "8,31 hPa cm³/kg K", "0,0289 hPa cm³/kg K"], "ans": 1, "why": "El manual define «“R” la constante de los gases ideales (R= 2870 hPa cm3/ Kg K)». 0,0289 recuerda a la masa molecular media del aire (0,02896442 kg/mol).", "src": "Manual 3 (nov. 2026), capítulo 2.6, p. 16", "note": ""}, {"n": 363, "stem": "La región de la atmósfera donde la presión es más alta que en las áreas circundantes es:", "opts": ["Un anticiclón", "Una depresión", "Una DANA", "Una borrasca"], "ans": 0, "why": "Definición del manual de anticiclón. La depresión (o borrasca) es la región donde la presión es más baja que en su entorno, y la DANA es un tipo de depresión.", "src": "Manual 3 (nov. 2026), capítulo 6, p. 36", "note": ""}, {"n": 364, "stem": "¿Qué Oficina de Vigilancia Meteorológica se encarga del FIR Barcelona?", "opts": ["Barcelona", "Madrid", "Las Palmas de Gran Canaria", "Valencia"], "ans": 3, "why": "En España hay dos OVM de AEMET: «una en Valencia para el FIR Madrid y para el FIR Barcelona, y otra en Las Palmas de Gran Canaria para el FIR Canarias».", "src": "Manual 3 (nov. 2026), capítulo 1.2, p. 8", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "
