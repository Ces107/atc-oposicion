<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Meteorología</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id const Q=[{"n": 1, "stem": "¿Cuántos Centros Mundiales de Pronóstico de Área (<em>World Area Forecast Centres</em>, WAFC) existen según el manual?", "opts": ["Dos, Londres y Washington", "Tres, Londres, Washington y Toulouse", "Nueve", "Siete"], "ans": 0, "why": "El WAFC está formado por dos centros, Londres y Washington; si uno deja de funcionar, el otro asume su labor. Nueve es el número de VAAC y siete, el de TCAC.", "src": "Manual 3, 1.2, p. 7", "note": ""}, {"n": 2, "stem": "¿Cuántos Centros de Avisos de Cenizas Volcánicas (VAAC) están establecidos?", "opts": ["Dos", "Siete", "Ocho", "Nueve"], "ans": 3, "why": "El manual indica que hay nueve VAAC. Siete es el número de TCAC y ocho, el de CMRE.", "src": "Manual 3, 1.2, p. 7", "note": ""}, {"n": 3, "stem": "¿Qué centros proporcionan mapas de previsión de la trayectoria y la deposición de los materiales radiactivos liberados a la atmósfera?", "opts": ["Los WAFC", "Las oficinas de vigilancia meteorológica", "Los TCAC", "Los Centros Meteorológicos Regionales Especializados (CMRE) de la OMM"], "ans": 3, "why": "Lo hacen los ocho CMRE (Pekín, Exeter, Melbourne, Montreal, Obninsk, Tokio, Toulouse, Washington). Los WAFC solo reciben su información.", "src": "Manual 3, 1.2, p. 7", "note": ""}, {"n": 4, "stem": "Las Oficinas de Vigilancia Meteorológica de España están situadas en:", "opts": ["Madrid y Barcelona", "Sevilla y Santander", "Madrid y Las Palmas", "Valencia y Las Palmas de Gran Canaria"], "ans": 3, "why": "AEMET tiene dos: una en Valencia (FIR Madrid y FIR Barcelona) y otra en Las Palmas (FIR Canarias).", "src": "Manual 3, 1.2, p. 8", "note": ""}, {"n": 5, "stem": "¿Cuál de las siguientes NO es una de las cinco oficinas meteorológicas de aeródromo (OMAe) de España que enumera el manual?", "opts": ["Santander", "Sevilla", "Barcelona", "Valencia"], "ans": 2, "why": "Las cinco son Las Palmas, Madrid, Santander, Sevilla y Valencia.", "src": "Manual 3, 1.2, p. 8", "note": ""}, {"n": 6, "stem": "¿A qué horas se realizan los sondeos aerológicos con globo sonda?", "opts": ["A las 06 y 18 UTC", "Cada hora", "A las 00, 06, 12 y 18 UTC", "A las 00 y 12 UTC"], "ans": 3, "why": "Los globos se sueltan a las 00 y 12 UTC.", "src": "Manual 3, 1.3, p. 9", "note": ""}, {"n": 7, "stem": "¿Qué centro facilita información sobre la posición prevista, la dirección, la velocidad, la presión central y el viento máximo en superficie de los ciclones tropicales?", "opts": ["VAAC", "WAFC", "TCAC", "CMRE"], "ans": 2, "why": "Esa es la función de los Centros de Avisos de Ciclones Tropicales (TCAC); existen siete.", "src": "Manual 3, 1.2, p. 7", "note": ""}, {"n": 8, "stem": "La composición del aire seco cerca del nivel del mar que indica el manual es:", "opts": ["78 % de nitrógeno, 21 % de oxígeno, 1 % de otros gases", "21 % de nitrógeno, 78 % de oxígeno, 1 % de otros gases", "75 % de nitrógeno, 24 % de oxígeno, 1 % de otros gases", "80 % de nitrógeno, 20 % de oxígeno"], "ans": 0, "why": "78 % de N2, 21 % de O2, 1 % de Ar, Ne, CO2, H2, O3...", "src": "Manual 3, 2.1, p. 10", "note": ""}, {"n": 9, "stem": "El vapor de agua de la atmósfera varía entre:", "opts": ["0,02 % y 0,3 %", "1 % y 10 %", "0,2 % y 3 %", "5 % y 20 %"], "ans": 2, "why": "El manual da de 0,2 % a 3 %, casi todo en la troposfera.", "src": "Manual 3, 2.1-2.2, pp. 11", "note": ""}, {"n": 10, "stem": "El ciclo hidrológico se describe mediante los procesos de:", "opts": ["Sublimación, fusión y congelación", "Radiación, absorción y reflexión", "Convección, advección y conducción", "Evaporación, condensación y precipitación"], "ans": 3, "why": "Sus procesos fundamentales son la evaporación (incluida la evapotranspiración), la condensación y la precipitación.", "src": "Manual 3, 2.2, p. 12", "note": ""}, {"n": 11, "stem": "Cerca de la superficie, la presión atmosférica disminuye aproximadamente:", "opts": ["1 mb por cada 9 metros (30 ft)", "1 mb por cada 90 metros", "10 mb por cada 9 metros", "1 mb por cada 300 ft"], "ans": 0, "why": "El manual indica aproximadamente 1 mb por cada 9 m (30 ft) en los primeros metros; después la disminución pasa a ser exponencial.", "src": "Manual 3, 2.4, p. 13", "note": ""}, {"n": 12, "stem": "Los dos máximos y los dos mínimos diarios de la presión atmosférica se producen aproximadamente a las:", "opts": ["Máximos a las 4 y 16 h; mínimos a las 10 y 22 h", "Máximos a las 0 y 12 h; mínimos a las 6 y 18 h", "Máximos a las 6 y 18 h; mínimos a las 0 y 12 h", "Máximos a las 10 y 22 h; mínimos a las 4 y 16 h"], "ans": 3, "why": "Dos máximos hacia las 10 y 22 h y dos mínimos hacia las 4 y 16 h, con una variación inferior a 1 hPa en las zonas templadas.", "src": "Manual 3, 2.4, p. 13", "note": ""}, {"n": 13, "stem": "Una atmósfera (1 atm) equivale a:", "opts": ["1013,25 hPa = 760 mm Hg", "1000 hPa = 750 mm Hg", "1013,25 hPa = 76 mm Hg", "760 hPa = 1013,25 mm Hg"], "ans": 0, "why": "Es el peso de una columna de mercurio de 76 cm y 1 cm² de sección (experimento de Torricelli).", "src": "Manual 3, 2.4, p. 14", "note": ""}, {"n": 14, "stem": "Según el manual, la temperatura máxima diaria del aire se produce normalmente:", "opts": ["Al mediodía", "Al atardecer", "Unas dos horas después del mediodía", "Justo después del amanecer"], "ans": 2, "why": "La inercia térmica retrasa el máximo unas dos horas después del mediodía; el mínimo se produce poco después del amanecer.", "src": "Manual 3, 2.5, p. 15", "note": ""}, {"n": 15, "stem": "El manual da la siguiente fórmula para pasar de grados Fahrenheit a centígrados:", "opts": ["C = 9/5 (F - 32)", "C = (F + 32) / 1.8", "C = 5/9 F + 32", "C = 5/9 (F - 32)"], "ans": 3, "why": "C = 5/9 · (F - 32); y K = C + 273.", "src": "Manual 3, 2.5, p. 16", "note": ""}, {"n": 16, "stem": "La ecuación de estado de los gases perfectos en el manual es:", "opts": ["P = d·g·h", "P = m/V", "P = d·R·T", "P = F/S"], "ans": 2, "why": "P = d·R·T relaciona presión, densidad, constante del gas y temperatura. P = d·g·h relaciona la presión con la altura; P = F/S define la presión.", "src": "Manual 3, 2.4 y 2.6, pp. 12, 16", "note": ""}, {"n": 17, "stem": "A presión constante, una columna de aire más cálido:", "opts": ["Es más densa y más baja", "Es más densa y más alta", "Es menos densa y más baja", "Es menos densa y más alta"], "ans": 3, "why": "El aire más cálido es menos denso, por lo que la columna se expande y aumenta su altura.", "src": "Manual 3, 2.6, p. 17", "note": ""}, {"n": 18, "stem": "El punto de rocío es:", "opts": ["La temperatura a la que hierve el agua", "La temperatura a la que la humedad relativa es del 50 %", "La temperatura a la que se funde el hielo", "La temperatura a la que hay que enfriar el aire, a presión constante, para saturarlo"], "ans": 3, "why": "En el punto de rocío la humedad relativa es del 100 %; sirve para predecir la niebla.", "src": "Manual 3, 2.7, p. 18", "note": ""}, {"n": 19, "stem": "¿Cuáles son los dos mecanismos por los que un volumen de aire no saturado llega a saturarse?", "opts": ["Calentarlo y reducir la presión", "Aumentar la densidad y disminuir solo la temperatura", "Aumentar el viento y reducir la humedad", "Disminuir su temperatura o aportarle vapor de agua"], "ans": 3, "why": "El enfriamiento y el aporte de vapor son los dos mecanismos que se enumeran.", "src": "Manual 3, 2.7, p. 17", "note": ""}, {"n": 20, "stem": "La altura media de la tropopausa tropical en el manual es:", "opts": ["8 km", "12 km", "11 km", "18 km"], "ans": 3, "why": "Polar, 8 km; latitudes medias, 12 km; tropical, 18 km.", "src": "Manual 3, 2.8, p. 18", "note": ""}, {"n": 21, "stem": "¿En qué capa aumenta la temperatura con la altitud principalmente a causa del ozono?", "opts": ["Troposfera", "Exosfera", "Mesosfera", "Estratosfera"], "ans": 3, "why": "La estratosfera se calienta con la altitud gracias al ozono; se extiende hasta unos 50-55 km.", "src": "Manual 3, 2.8, p. 18", "note": ""}, {"n": 22, "stem": "El nivel más frío de toda la atmósfera es la:", "opts": ["Tropopausa", "Estratopausa", "Mesopausa", "Termopausa"], "ans": 2, "why": "La mesopausa (unos -95 ºC) es el nivel más frío; además pone fin a la zona de composición homogénea.", "src": "Manual 3, 2.8, p. 19", "note": ""}, {"n": 23, "stem": "La homosfera comprende:", "opts": ["Solo la troposfera y la estratosfera", "La termosfera y la exosfera", "La troposfera, la estratosfera y la mesosfera", "La mesosfera y la termosfera"], "ans": 2, "why": "Es la zona de composición homogénea de los gases, hasta la mesopausa.", "src": "Manual 3, 2.8, p. 19", "note": ""}, {"n": 24, "stem": "La termosfera alcanza una temperatura de unos:", "opts": ["-95 ºC", "-56 ºC", "100 ºC", "1100 ºC"], "ans": 3, "why": "La temperatura aumenta con la altitud por efecto de la radiación solar hasta los 1100 ºC; la capa se extiende hasta unos 500 km.", "src": "Manual 3, 2.8, p. 19", "note": ""}, {"n": 25, "stem": "Las nubes nacaradas se encuentran en la:", "opts": ["Troposfera, a 2-4 km", "Termosfera", "Mesosfera, a 70 km", "Estratosfera, a 20-30 km"], "ans": 3, "why": "En la estratosfera apenas hay nubes, salvo las nubes nacaradas, a 20-30 km, y los topes de los cumulonimbos que sobrepasan la tropopausa.", "src": "Manual 3, 2.8, p. 18", "note": ""}, {"n": 26, "stem": "El aire estable se asocia típicamente con:", "opts": ["Nubes desarrolladas, chubascos y turbulencia", "Tormentas por la tarde", "Muy buena visibilidad y cumulonimbos", "Cielo despejado o nubes estratiformes, posible niebla y visibilidad reducida por contaminantes"], "ans": 3, "why": "En el aire estable el humo y los contaminantes no pueden ascender; en invierno puede formarse niebla. Las demás opciones describen el aire inestable.", "src": "Manual 3, 2.9, p. 21", "note": ""}, {"n": 27, "stem": "En la ISA, la densidad al nivel del mar es:", "opts": ["1,0130 kg/m³", "1,5000 kg/m³", "0,9250 kg/m³", "1,2250 kg/m³"], "ans": 3, "why": "ISA: 15 ºC, 1013,25 hPa y 1,2250 kg/m³.", "src": "Manual 3, 2.10.1, p. 21", "note": ""}, {"n": 28, "stem": "El gradiente térmico ISA en la troposfera es:", "opts": ["6,5 ºC por cada 1000 ft", "2 ºC por cada 1000 m", "2 ºC por cada 1000 ft (6,5 ºC por cada 1000 m)", "1 ºC por cada 1000 ft"], "ans": 2, "why": "El gradiente es de 2 ºC/1000 ft, es decir, 6,5 ºC/1000 m, hasta la tropopausa, a unos -56,5 ºC.", "src": "Manual 3, 2.10.1, p. 22", "note": ""}, {"n": 29, "stem": "Según la tabla ISA del manual, a 10 000 ft la presión y la temperatura son:", "opts": ["697 mb y -4,8 ºC", "724 mb y -2,8 ºC", "466 mb y -24,6 ºC", "752 mb y -0,8 ºC"], "ans": 0, "why": "8000 ft: 752 mb, -0,8 ºC; 9000 ft: 724 mb, -2,8 ºC; 10 000 ft: 697 mb, -4,8 ºC; 20 000 ft: 466 mb, -24,6 ºC.", "src": "Manual 3, 2.10.1, p. 23 (tabla reproducida)", "note": ""}, {"n": 30, "stem": "La altitud es la distancia vertical entre un punto del aire y:", "opts": ["El suelo", "El punto de referencia del aeródromo", "La superficie de 1013,25 hPa", "El nivel medio del mar"], "ans": 3, "why": "La altura se mide desde el suelo y la altitud, desde el nivel medio del mar (MSL); la elevación es la distancia al MSL de un punto del terreno.", "src": "Manual 3, 2.10.2, p. 23", "note": ""}, {"n": 31, "stem": "El altímetro es:", "opts": ["Un barómetro aneroide graduado para indicar altitudes", "Un barómetro de mercurio", "Un dispositivo de radio", "Un termómetro"], "ans": 0, "why": "Mide la presión y la convierte en altitud mediante la ISA.", "src": "Manual 3, 2.10.3, p. 24", "note": ""}, {"n": 32, "stem": "Con el altímetro ajustado a QNH, una aeronave en tierra indica:", "opts": ["Cero", "1013 ft", "La elevación del aeródromo", "El nivel de vuelo"], "ans": 2, "why": "El QNH da la altitud respecto al MSL, por lo que en tierra el altímetro indica la elevación del aeródromo. Con el QFE indica cero.", "src": "Manual 3, 2.10.3, p. 25", "note": ""}, {"n": 33, "stem": "El QFE se define como:", "opts": ["La presión estándar al nivel del mar", "La presión del aeródromo reducida al nivel del mar en la ISA", "La presión atmosférica del aeródromo medida por el barómetro de la oficina meteorológica de aeródromo", "La presión en el nivel de transición"], "ans": 2, "why": "Con el QFE el altímetro indica la altura sobre el aeródromo (cero en tierra).", "src": "Manual 3, 2.10.3, p. 25", "note": ""}, {"n": 34, "stem": "Para un aeródromo situado por encima del nivel del mar:", "opts": ["El QNH es menor que el QFE", "El QNH es igual al QFE", "El QNH es mayor que el QFE", "El QFE es igual a 1013,25 hPa"], "ans": 2, "why": "A nivel del mar, QNH = QFE; por debajo del nivel del mar, QNH &lt; QFE; por encima del nivel del mar, QNH &gt; QFE.", "src": "Manual 3, 2.10.3, p. 25", "note": ""}, {"n": 35, "stem": "El reglaje QNE es:", "opts": ["1013,25 hPa, que se utiliza para los niveles de vuelo", "La presión local al nivel del mar", "La presión en el aeródromo", "1000 hPa"], "ans": 0, "why": "En ruta todas las aeronaves vuelan con la misma presión de referencia, el QNE (1013,25 hPa); de ahí los niveles de vuelo.", "src": "Manual 3, 2.10.3, p. 25", "note": ""}, {"n": 36, "stem": "Los niveles de vuelo se expresan en:", "opts": ["Metros", "Hectopascales", "Miles de pies", "Centenas de pies"], "ans": 3, "why": "Son superficies de presión constante, expresadas en centenas de pies; su separación la fija el Reglamento de la Circulación Aérea.", "src": "Manual 3, 2.10.4, p. 25", "note": ""}, {"n": 37, "stem": "La altitud de transición:", "opts": ["Es la altitud por encima de la cual se utilizan niveles de vuelo, con el altímetro ajustado a QNE", "Es el nivel de vuelo más bajo por encima del nivel de transición", "Varía con las condiciones meteorológicas", "Es la capa comprendida entre dos niveles"], "ans": 0, "why": "Por debajo de ella se utilizan altitudes (QNH); por encima, niveles de vuelo (QNE). Es fija para cada aeródromo y se utiliza en el despegue.", "src": "Manual 3, 2.10.5, p. 26", "note": ""}, {"n": 38, "stem": "Las altitudes de transición en España según el manual son:", "opts": ["TMA de Madrid, 13 000 ft; CTA de Granada, 7000 ft; resto, 6000 ft", "TMA de Madrid, 6000 ft; CTA de Granada, 13 000 ft; resto, 7000 ft", "Todas, 6000 ft", "TMA de Madrid, 7000 ft; CTA de Granada, 6000 ft; resto, 13 000 ft"], "ans": 0, "why": "Se dan tres valores: 13 000 ft para la TMA de Madrid, 7000 ft para la CTA de Granada y 6000 ft para el resto.", "src": "Manual 3, 2.10.5, p. 26", "note": ""}, {"n": 39, "stem": "El nivel de transición es:", "opts": ["La mayor altitud con QNH", "La capa de espesor variable", "Un valor fijo para cada aeropuerto", "El nivel de vuelo más bajo disponible por encima de la altitud de transición"], "ans": 3, "why": "Su valor depende de las condiciones meteorológicas y normalmente está al menos 1000 ft por encima de la altitud de transición; se tiene en cuenta en la aproximación.", "src": "Manual 3, 2.10.5, p. 26", "note": ""}, {"n": 40, "stem": "El espesor de la capa de transición es:", "opts": ["Exactamente 1000 ft", "Exactamente 500 ft", "Variable y siempre inferior a 1000 ft", "Variable y siempre igual o superior a 1000 ft"], "ans": 3, "why": "Es la capa comprendida entre el nivel de transición y la altitud de transición.", "src": "Manual 3, 2.10.5, p. 26", "note": ""}, {"n": 41, "stem": "De la radiación solar, el porcentaje absorbido por la corteza terrestre (tierras y océanos) es de aproximadamente:", "opts": ["20 %", "36 %", "4 %", "40 %"], "ans": 3, "why": "36 % las nubes, 20 % los gases (5 % O3 + 15 % CO2), 4 % lo refleja la superficie y 40 % lo absorbe la corteza.", "src": "Manual 3, 3.1, p. 27", "note": ""}, {"n": 42, "stem": "La radiación solar se caracteriza por ser de:", "opts": ["Onda larga", "Ultrasonidos", "Solo infrarroja", "Onda corta"], "ans": 3, "why": "La radiación solar es de onda corta; la radiación terrestre es de onda larga.", "src": "Manual 3, 3.1, pp. 27-28", "note": ""}, {"n": 43, "stem": "Según la descripción que hace el manual del desequilibrio, los gases de efecto invernadero son:", "opts": ["Transparentes a la radiación de onda corta y absorbentes de la radiación de onda larga que reemite la Tierra", "Transparentes a la de onda larga y absorbentes de la de onda corta", "Transparentes a ambas", "Absorbentes de ambas por igual"], "ans": 0, "why": "Ese mecanismo eleva la temperatura de la atmósfera y de la superficie.", "src": "Manual 3, 3.3, p. 29", "note": ""}, {"n": 44, "stem": "El hemisferio norte recibe la máxima radiación solar hacia:", "opts": ["El equinoccio de marzo", "El solsticio de diciembre", "El equinoccio de septiembre", "El solsticio de junio"], "ans": 3, "why": "El hemisferio sur la recibe hacia el solsticio de diciembre.", "src": "Manual 3, 3.2, p. 28", "note": ""}, {"n": 45, "stem": "La transmisión de calor por contacto entre dos cuerpos a distinta temperatura, como ocurre en las pistas de los aeropuertos, es:", "opts": ["Convección", "Advección", "Conducción", "Turbulencia"], "ans": 2, "why": "La conducción se produce por colisión molecular; la convección requiere un fluido; la advección es el movimiento horizontal del aire.", "src": "Manual 3, 3.3, p. 30", "note": ""}, {"n": 46, "stem": "¿Qué proceso de transmisión de calor es muy importante para la formación de nubes orográficas?", "opts": ["Advección", "Conducción", "Convección", "Radiación"], "ans": 0, "why": "La advección (movimiento horizontal de masas de aire) es importante para las nubes orográficas y el ciclo del agua; la convección origina movimientos verticales.", "src": "Manual 3, 3.3, p. 30", "note": ""}, {"n": 47, "stem": "Las tres células del modelo realista de circulación, del ecuador al polo, son:", "opts": ["Ferrel, Hadley, polar", "Polar, Ferrel, Hadley", "Hadley, polar, Ferrel", "Hadley, Ferrel, polar"], "ans": 3, "why": "Hadley (de 0 a ~30º), Ferrel (de ~30º a 60º), polar (de ~60º al polo).", "src": "Manual 3, 4.1.2, p. 32", "note": ""}, {"n": 48, "stem": "El cinturón de altas presiones situado hacia los 30º de latitud se denomina:", "opts": ["Vaguada ecuatorial", "Zona de baja presión subpolar", "Zona de alta presión subtropical", "Alta polar"], "ans": 2, "why": "La vaguada ecuatorial es una zona de baja presión en el ecuador; la baja subpolar se sitúa hacia los 60º.", "src": "Manual 3, 4.1.2, p. 32", "note": ""}, {"n": 49, "stem": "La fuerza de Coriolis desvía los objetos en movimiento:", "opts": ["Hacia la izquierda en el hemisferio norte", "Hacia la derecha en el hemisferio sur", "Hacia la derecha en el hemisferio norte y hacia la izquierda en el sur", "Siempre hacia el este"], "ans": 2, "why": "Es consecuencia de la rotación de la Tierra.", "src": "Manual 3, 4.2, p. 33", "note": ""}, {"n": 50, "stem": "Los vientos alisios soplan del:", "opts": ["NO en el hemisferio norte", "Este en ambos hemisferios, exactamente", "SO en el hemisferio norte", "NE en el hemisferio norte y del SE en el hemisferio sur"], "ans": 3, "why": "Soplan entre la alta subtropical y la vaguada ecuatorial y convergen en la ZCIT.", "src": "Manual 3, 5.3, p. 35", "note": ""}, {"n": 51, "stem": "La Zona de Convergencia Intertropical es aquella donde:", "opts": ["Los vientos del oeste se encuentran con los vientos polares", "Se forman las altas subtropicales", "Se forman las corrientes en chorro", "Los alisios de ambos hemisferios convergen en el ecuador"], "ans": 3, "why": "Los alisios del NE y del SE convergen en el ecuador.", "src": "Manual 3, 5.3, p. 35", "note": ""}, {"n": 52, "stem": "La subsidencia es:", "opts": ["El ascenso de aire cálido", "La convergencia horizontal de corrientes", "El descenso de aire hacia el suelo en la troposfera", "La separación de una masa de aire"], "ans": 2, "why": "Suele estar causada por el desplazamiento hacia el suelo de aire frío y denso de las capas media y alta.", "src": "Manual 3, 5.2, p. 35", "note": ""}, {"n": 53, "stem": "Una corriente en chorro (<em>jet stream</em>) circula:", "opts": ["De este a oeste en la troposfera baja", "Perpendicular a la circulación general", "Solo en la estratosfera de los polos", "De oeste a este en altura, de forma ocasionalmente discontinua, con ondas de Rossby"], "ans": 3, "why": "Es una corriente fuerte y estrecha en la troposfera alta o en la estratosfera; los chorros polares son los más intensos.", "src": "Manual 3, 5.4, pp. 35-36", "note": ""}, {"n": 54, "stem": "En el hemisferio norte, la circulación alrededor de un anticiclón es:", "opts": ["En sentido horario, con vientos débiles en el centro y más fuertes en el exterior", "En sentido antihorario, con vientos débiles en el exterior", "En sentido horario, con vientos fuertes en el centro", "En sentido antihorario, con vientos fuertes en el centro"], "ans": 0, "why": "En las depresiones la circulación es antihoraria en el hemisferio norte, con vientos fuertes en el centro.", "src": "Manual 3, 6, pp. 36-37", "note": ""}, {"n": 55, "stem": "Los anticiclones fríos son:", "opts": ["De origen térmico, formados por bajas temperaturas y alta densidad", "De origen dinámico", "Formados por convergencia en altura", "Típicos de los trópicos"], "ans": 0, "why": "Los anticiclones cálidos son dinámicos: convergencia en altura, subsidencia y divergencia en superficie.", "src": "Manual 3, 6, pp. 36-37", "note": ""}, {"n": 56, "stem": "Una DANA (Depresión Aislada en Niveles Altos) se conocía antiguamente como:", "opts": ["Gota fría", "Dorsal", "Vaguada", "Ciclón tropical"], "ans": 0, "why": "Se forma cuando una ondulación de gran amplitud de la Circulación del Oeste se rompe y se separa del flujo, creando una bolsa de aire frío en altura; su diámetro es de 200 km o más.", "src": "Manual 3, 6, p. 38", "note": ""}, {"n": 57, "stem": "Los ciclones tropicales, a diferencia de los extratropicales, suelen tener:", "opts": ["Vientos débiles en altura", "Vientos fuertes en altura", "Ninguna baja en superficie", "Estructura frontal"], "ans": 0, "why": "Tienen una baja aislada en superficie y una alta presión en altura; los vientos en altura suelen ser débiles.", "src": "Manual 3, 6, p. 37", "note": ""}, {"n": 58, "stem": "Una masa de aire es un volumen de aire:", "opts": ["De miles de kilómetros con propiedades horizontalmente homogéneas", "De decenas de kilómetros con propiedades heterogéneas", "Solo sobre el mar", "Limitado por dos frentes"], "ans": 0, "why": "Sus características principales son la temperatura y la humedad, adquiridas en la región de origen.", "src": "Manual 3, 7.1, p. 38", "note": ""}, {"n": 59, "stem": "¿Cuántos tipos de masa de aire resultan de combinar la clasificación por temperatura (4 tipos) y por humedad (2 tipos)?", "opts": ["4", "6", "8", "16"], "ans": 2, "why": "Ártica, polar, tropical y ecuatorial, cada una seca (origen continental) o húmeda (origen marítimo): 8.", "src": "Manual 3, 7.1, p. 39", "note": ""}, {"n": 60, "stem": "Una masa de aire cuya región de origen es continental se clasifica como:", "opts": ["Seca", "Húmeda", "Ecuatorial", "Ocluida"], "ans": 0, "why": "Es seca si la región de origen es continental y húmeda si es marítima.", "src": "Manual 3, 7.1, p. 39", "note": ""}, {"n": 61, "stem": "Un frente es:", "opts": ["Una región de alta presión", "Un viento en altura", "La frontera entre dos masas de aire de distinta temperatura y densidad", "Una capa de nubes"], "ans": 2, "why": "La masa cálida, más ligera, asciende sobre la fría y densa; los frentes están asociados a depresiones.", "src": "Manual 3, 7.2, p. 39", "note": ""}, {"n": 62, "stem": "¿Qué frente se caracteriza por un viento que tiende a soplar paralelo al frente y en sentidos opuestos?", "opts": ["Frío", "Cálido", "Ocluido", "Estacionario"], "ans": 3, "why": "En los frentes estacionarios no hay desplazamiento; pueden dar precipitaciones prolongadas si las masas son muy húmedas.", "src": "Manual 3, 7.2, p. 40", "note": ""}, {"n": 63, "stem": "Un frente ocluido se forma cuando:", "opts": ["Un frente cálido alcanza a un frente frío", "Se encuentran dos masas frías", "Un frente frío alcanza al frente cálido y eleva el sector cálido en altura", "El frente deja de desplazarse"], "ans": 2, "why": "Normalmente el frente frío se mueve más deprisa. Las oclusiones pueden ser de tipo frío o de tipo cálido, según que el aire de detrás sea más frío o más cálido que el de delante.", "src": "Manual 3, 7.2, p. 41", "note": ""}, {"n": 64, "stem": "¿Cuál de los siguientes NO es un requisito para la formación de nubes según el manual?", "opts": ["Humedad relativa alta", "Un mecanismo que sature el aire", "Núcleos de condensación", "Viento de más de 15 kt"], "ans": 3, "why": "Los tres requisitos son la humedad, un mecanismo de saturación (por ejemplo, el enfriamiento) y los núcleos de condensación.", "src": "Manual 3, 8.1.1, p. 41", "note": ""}, {"n": 65, "stem": "El enfriamiento denominado expansión adiabática se produce:", "opts": ["Por contacto con una superficie fría", "Solo de noche", "Con un intercambio de calor casi nulo con el aire circundante", "Solo en las nubes estratiformes"], "ans": 2, "why": "Ejemplos: columna ascendente (convectiva), ascenso forzado por una ladera, convergencia en superficie (frontal), turbulencia en capas bajas.", "src": "Manual 3, 8.1.1, p. 42", "note": ""}, {"n": 66, "stem": "Niveles de las nubes según el manual para la región templada: las nubes altas se sitúan entre:", "opts": ["3-8 km", "6-18 km", "5-13 km", "2-7 km"], "ans": 2, "why": "Polar, 3-8 km; templada, 5-13 km; tropical, 6-18 km. De 2 a 7 km es el nivel medio de la región templada.", "src": "Manual 3, 8.1.2, p. 42", "note": ""}, {"n": 67, "stem": "El Atlas Internacional de Nubes de la OMM, Volumen I, clasifica las nubes en:", "opts": ["4 géneros", "10 géneros", "27 géneros", "3 géneros"], "ans": 1, "why": "OMM n.º 407 (1993); las cuatro familias son nubes bajas, medias, altas y de desarrollo vertical.", "src": "Manual 3, 8.1.2, p. 42", "note": ""}, {"n": 68, "stem": "¿Cuál de estas nubes se clasifica como nube media en la tabla del manual?", "opts": ["Estratocúmulo", "Cirrocúmulo", "Nimbostrato", "Cúmulo"], "ans": 2, "why": "Los Ns se incluyen en la familia media, aunque pueden llegar hasta el suelo; los Sc son bajas, los Cc altas y los Cu de desarrollo vertical.", "src": "Manual 3, 8.1.2, p. 43 y nota 5", "note": ""}, {"n": 69, "stem": "Las nubes que pueden producir halos son:", "opts": ["Los altoestratos", "Los cirroestratos", "Los estratos", "Los nimbostratos"], "ans": 1, "why": "Los halos se forman por refracción y reflexión en los cristales de hielo; los altoestratos no los producen.", "src": "Manual 3, 8.1.2, p. 44-45", "note": ""}, {"n": 70, "stem": "Los altocúmulos observados en una mañana cálida y húmeda indican que:", "opts": ["La niebla persistirá", "Pueden aparecer tormentas por la tarde", "Ha pasado un frente frío", "Llega buen tiempo"], "ans": 1, "why": "Así lo afirma el manual para los altocúmulos.", "src": "Manual 3, 8.1.2, p. 44", "note": ""}, {"n": 71, "stem": "Las nubes bajas están formadas, en general:", "opts": ["Solo por cristales de hielo", "Por gotas subfundidas y hielo", "Solo por gotas de agua líquida", "Por polvo"], "ans": 2, "why": "Las nubes altas son de hielo; las medias, de gotas subfundidas y a veces de hielo.", "src": "Manual 3, 8.1.2, p. 44-45", "note": ""}, {"n": 72, "stem": "Una nube que parece una niebla que no llega al suelo es:", "opts": ["El estrato", "El cirro", "El altocúmulo", "El cúmulo"], "ans": 0, "why": "El estrato suele parecer una niebla que no toca el suelo.", "src": "Manual 3, 8.1.2, p. 45", "note": ""}, {"n": 73, "stem": "Una nube que puede crecer hasta la tropopausa, donde una capa estable impide la flotabilidad, es:", "opts": ["El cúmulo", "El nimbostrato", "El cumulonimbo", "El estratocúmulo"], "ans": 2, "why": "Los Cb pueden sobrepasar ligeramente la tropopausa si las corrientes convectivas son muy fuertes.", "src": "Manual 3, 8.1.2, p. 46", "note": ""}, {"n": 74, "stem": "¿A cuántas octas equivale BKN?", "opts": ["De 1 a 2", "De 3 a 4", "De 5 a 7", "8"], "ans": 2, "why": "FEW 1-2, SCT 3-4, BKN 5-7, OVC 8 (cubierto).", "src": "Manual 3, 8.1.3, p. 46", "note": ""}, {"n": 75, "stem": "Una octa es:", "opts": ["Una décima parte del cielo", "Una octava parte del cielo", "Una cuarta parte del cielo", "Cien pies de nube"], "ans": 1, "why": "El cielo se divide en ocho partes, cada una de ellas una octa.", "src": "Manual 3, 8.1.3, p. 46", "note": ""}, {"n": 76, "stem": "CAVOK significa, según el manual:", "opts": ["Sin nubes, sin fenómenos significativos y con visibilidad superior a 10 km", "Visibilidad superior a 5 km", "Techo y visibilidad correctos por debajo de 10 km", "Solo sin cumulonimbos"], "ans": 0, "why": "Esa es la definición del manual. NSC es «sin nubes de importancia para las operaciones».", "src": "Manual 3, 8.1.3, p. 46", "note": ""}, {"n": 77, "stem": "El techo de nubes es la altura de la base de la capa más baja que:", "opts": ["Cubre más de la mitad del cielo (BKN/OVC) y está por debajo de 20 000 ft (6000 m)", "Cubre cualquier parte del cielo, por debajo de 10 000 ft", "Es un cumulonimbo, a cualquier altura", "Cubre de 1 a 2 octas, por debajo de 5000 ft"], "ans": 0, "why": "Altura sobre el suelo (tierra o agua) de la capa BKN/OVC más baja situada por debajo de 20 000 ft.", "src": "Manual 3, 8.1.3, p. 47", "note": ""}, {"n": 78, "stem": "Una nube de importancia para las operaciones es aquella cuya base está por debajo del mayor de los valores entre 1500 m (5000 ft) y la mayor altitud mínima de sector, o bien:", "opts": ["Cualquier cirro", "Un cumulonimbo o un cúmulo torreante a cualquier altura", "Cualquier estrato", "Solo un cumulonimbo por debajo de 6000 m"], "ans": 1, "why": "Los Cb y los cúmulos torreantes son significativos a cualquier altura.", "src": "Manual 3, 8.1.3, p. 47", "note": ""}, {"n": 79, "stem": "La visibilidad horizontal del Anexo 3 es el mayor de dos valores; el valor diurno se refiere a:", "opts": ["Un objeto negro de dimensiones adecuadas visto contra un fondo brillante (MOR)", "Luces de 100 candelas", "Las luces de eje de pista", "Un globo"], "ans": 0, "why": "De noche se utilizan luces de unas 1000 candelas sobre un fondo no iluminado.", "src": "Manual 3, 8.2, p. 47", "note": ""}, {"n": 80, "stem": "La visibilidad oblicua es normalmente:", "opts": ["Mayor que la visibilidad vertical y que la horizontal", "Igual a la visibilidad horizontal", "Menor que la visibilidad vertical y que la horizontal", "Medida con un globo"], "ans": 2, "why": "El segmento aeronave-objeto es más largo que sus proyecciones horizontal y vertical.", "src": "Manual 3, 8.2, p. 47", "note": ""}, {"n": 81, "stem": "La visibilidad reinante es el valor máximo alcanzado en un círculo que abarque al menos:", "opts": ["Todo el horizonte", "Una cuarta parte del horizonte", "La mitad del horizonte o de la superficie del aeródromo", "Solo la pista"], "ans": 2, "why": "Si fluctúa con rapidez y no puede determinarse un valor reinante, se notifica la visibilidad mínima.", "src": "Manual 3, 8.2, pp. 48-49", "note": ""}, {"n": 82, "stem": "La precipitación intermitente, a diferencia de los chubascos:", "opts": ["Comienza y termina bruscamente", "Procede de nubes convectivas", "No suele empezar ni terminar bruscamente y no procede de nubes convectivas", "Tiene gotas grandes"], "ans": 2, "why": "Los chubascos empiezan y terminan bruscamente, con gotas relativamente grandes procedentes de nubes convectivas.", "src": "Manual 3, 8.3.1, pp. 49-50", "note": ""}, {"n": 83, "stem": "Las virgas son:", "opts": ["Gotas de lluvia congeladas", "Estructuras filamentosas bajo una nube en las que la precipitación se evapora antes de llegar al suelo", "Chubascos de granizo", "Bancos de niebla"], "ans": 1, "why": "Aparecen sobre todo con humedad relativa baja y/o temperatura alta.", "src": "Manual 3, 8.3.1, p. 50", "note": ""}, {"n": 84, "stem": "La componente máxima de viento cruzado que toleran las aeronaves, según el manual, varía entre:", "opts": ["5 y 10 kt", "15 y 35 kt", "40 y 60 kt", "10 y 20 kt"], "ans": 1, "why": "Depende del tipo de aeronave y de las condiciones de la pista.", "src": "Manual 3, 8.4, p. 51", "note": ""}, {"n": 85, "stem": "La dirección del viento se expresa como:", "opts": ["La dirección hacia la que sopla, desde el norte magnético", "La dirección de la que procede, en grados desde el norte verdadero, medidos en sentido horario", "La dirección de la que procede, desde el norte magnético en sentido antihorario", "Solo una letra cardinal"], "ans": 1, "why": "0º es el norte verdadero (geográfico).", "src": "Manual 3, 8.4, p. 51", "note": ""}, {"n": 86, "stem": "La brisa de mar sopla:", "opts": ["De noche, de tierra a mar", "De día, de mar a tierra", "De día, de tierra a mar", "Solo en invierno"], "ans": 1, "why": "De día la tierra se calienta más, la presión sobre ella es menor y el aire fluye desde el mar. De noche sopla la brisa de tierra, de tierra a mar.", "src": "Manual 3, 8.4.1, pp. 51-52", "note": ""}, {"n": 87, "stem": "El efecto Foehn se caracteriza, en la ladera de sotavento, por:", "opts": ["Mayor temperatura y menor humedad relativa que a la misma altura en la ladera de barlovento", "Menor temperatura y mayor humedad", "Niebla", "Ningún cambio de temperatura"], "ans": 0, "why": "El aire pierde humedad en el ascenso por barlovento (gradiente saturado, menor) y se calienta por compresión en el descenso (gradiente seco).", "src": "Manual 3, 8.4.2, pp. 52-53", "note": ""}, {"n": 88, "stem": "El alcance visual en pista (RVR) debe notificarse cuando la visibilidad es inferior a:", "opts": ["5000 m", "1500 m", "1000 m", "800 m"], "ans": 1, "why": "El RVR se refiere a un piloto situado a 5 m sobre el eje de la pista; es el promedio de los 10 minutos anteriores.", "src": "Manual 3, 9.1, p. 54", "note": ""}, {"n": 89, "stem": "Los transmisómetros del RVR se colocan:", "opts": ["A 2,5 m sobre el suelo, a unos 100 m del eje de la pista, en la zona de toma de contacto", "A 5 m sobre el suelo, en el eje", "En el umbral, a 10 m de altura", "Al final de la pista, a 1 m"], "ans": 0, "why": "Los 5 m son la altura del ojo del piloto que se usa en la definición, no la altura del sensor.", "src": "Manual 3, 9.1, p. 54", "note": ""}, {"n": 90, "stem": "La niebla se define en el manual como una nube estratiforme en contacto con el suelo o a muy poca altura que reduce la visibilidad a:", "opts": ["Menos de 1000 m", "Menos de 5000 m", "Menos de 200 m", "Menos de 10 km"], "ans": 0, "why": "Si la reducción es superior a 1000 m y la humedad relativa es superior al 70 %, se llama neblina.", "src": "Manual 3, 9.1.1, p. 55", "note": ""}, {"n": 91, "stem": "La niebla baja es aquella cuya extensión vertical no supera:", "opts": ["2 m", "20 m", "200 m", "10 m"], "ans": 0, "why": "La extensión vertical de la niebla varía desde unos pocos metros hasta unos cientos de metros.", "src": "Manual 3, 9.1.1, p. 55", "note": ""}, {"n": 92, "stem": "El engelamiento se produce cuando:", "opts": ["Gotas de agua líquida subfundidas se congelan al impactar con la aeronave", "Se condensa el vapor de agua", "Rebota el granizo", "La aeronave desciende"], "ans": 0, "why": "Las gotas subfundidas están a 0 ºC o menos.", "src": "Manual 3, 9.3, p. 56", "note": ""}, {"n": 93, "stem": "El hielo claro se ve más favorecido con una temperatura del aire entre:", "opts": ["0 ºC y -10 ºC", "-10 ºC y -20 ºC", "0 ºC y -40 ºC", "-20 ºC y -40 ºC"], "ans": 0, "why": "Según el manual, las condiciones más favorables para el hielo claro (<em>clear icing</em>) son una temperatura del aire entre 0 ºC y -10 ºC y una temperatura de la aeronave ligeramente inferior a 0 ºC. El hielo granulado, en cambio, se ve favorecido entre 0 ºC y -40 ºC (normalmente entre -10 ºC y -20 ºC).", "src": "Manual 3, 9.3, p. 58", "note": ""}, {"n": 94, "stem": "¿Qué tipo de engelamiento se describe como blanco, opaco, rugoso, de poca adherencia y de congelación rápida?", "opts": ["Hielo transparente", "Lluvia engelante", "Hielo granulado (<em>rime ice</em>)", "Escarcha"], "ans": 2, "why": "El hielo transparente es diáfano, vítreo y adherente, de congelación lenta.", "src": "Manual 3, 9.3, p. 58", "note": ""}, {"n": 95, "stem": "El tipo de engelamiento más peligroso para las aeronaves es:", "opts": ["El hielo granulado", "La lluvia engelante", "La escarcha sobre las aeronaves estacionadas", "El engelamiento débil"], "ans": 1, "why": "Es transparente y se congela de manera uniforme sobre todas las partes de la aeronave.", "src": "Manual 3, 9.3, p. 58", "note": ""}, {"n": 96, "stem": "El engelamiento fuerte se caracteriza por:", "opts": ["Un crecimiento rápido que los equipos de a bordo no pueden eliminar y que obliga a cambiar de altitud de inmediato", "Un crecimiento que no crea ningún problema", "Un crecimiento que eliminan los equipos de a bordo", "Un crecimiento solo en la base de las nubes"], "ans": 0, "why": "El engelamiento moderado puede eliminarse con los equipos de a bordo; el ligero no crea problemas salvo que sea muy prolongado.", "src": "Manual 3, 9.3, p. 57", "note": ""}, {"n": 97, "stem": "La cizalladura del viento es más intensa cuando:", "opts": ["La distancia es mayor y la velocidad menor", "La distancia en la que se produce el cambio es menor y la velocidad del cambio, mayor", "La temperatura es más baja", "No hay nubes"], "ans": 1, "why": "Puede ser horizontal, vertical o una combinación de ambas.", "src": "Manual 3, 9.4, p. 59", "note": ""}, {"n": 98, "stem": "¿Cuál es un fenómeno que el manual enumera como capaz de originar cizalladura?", "opts": ["Las nubes nacaradas", "Los frentes de racha de las tormentas", "La subsidencia anticiclónica a 30º", "El hielo granulado"], "ans": 1, "why": "También los microrreventones, los tornados, los frentes, los vientos fuertes perturbados por el relieve y las inversiones térmicas cerca del suelo.", "src": "Manual 3, 9.4, p. 59", "note": ""}, {"n": 99, "stem": "¿Qué intensidad de turbulencia exige, en general, la intervención del piloto y provoca mayores variaciones de altitud?", "opts": ["Débil", "Moderada", "Fuerte", "Extrema"], "ans": 1, "why": "La débil produce pequeñas variaciones de altitud; la fuerte, variaciones amplias y violentas de altitud y de ángulo de ataque; la extrema deja la aeronave prácticamente incontrolable.", "src": "Manual 3, 9.5, p. 60", "note": ""}, {"n": 100, "stem": "La turbulencia convectiva es típica de:", "opts": ["Noches frías de invierno", "Días calurosos de verano o aire frío sobre una superficie más cálida", "Los núcleos de las corrientes en chorro", "Condiciones de niebla"], "ans": 1, "why": "El suelo se calienta y transmite calor por conducción a las capas bajas, creando corrientes convectivas; en aeronáutica solo se consideran las corrientes ascendentes.", "src": "Manual 3, 9.5, p. 60", "note": ""}, {"n": 101, "stem": "Tras el despegue de una aeronave pesada, el controlador debe extremar la precaución por:", "opts": ["Las ondas de montaña", "La estela turbulenta", "La turbulencia en aire claro", "La turbulencia frontal"], "ans": 1, "why": "El aire sobre la pista permanece agitado y autorizar de inmediato otro despegue puede ser peligroso.", "src": "Manual 3, 9.5, p. 61", "note": ""}, {"n": 102, "stem": "La turbulencia asociada a los frentes es, en general:", "opts": ["Mayor en los frentes cálidos", "Mayor en los frentes fríos", "Igual en ambos", "Inexistente"], "ans": 1, "why": "Aumenta todavía más con la convección y los vientos sinópticos fuertes.", "src": "Manual 3, 9.5, pp. 61-62", "note": ""}, {"n": 103, "stem": "¿Cuál es una condición que favorece las ondas de montaña?", "opts": ["Viento en la cima superior a 15 kt y que aumenta con la altura", "Dirección del viento paralela al eje de la montaña", "Una capa inestable por encima de la cima", "Viento que disminuye con la altura"], "ans": 0, "why": "También una dirección del viento a menos de 30º de la perpendicular al eje y una capa estable por encima de la cima.", "src": "Manual 3, 9.5, p. 62", "note": ""}, {"n": 104, "stem": "El rotor más peligroso de una onda de montaña se forma:", "opts": ["Sobre la cima", "Bajo la primera onda", "Bajo la última onda", "Solo sobre el mar"], "ans": 1, "why": "Los rotores son torbellinos que se forman bajo las crestas de las ondas.", "src": "Manual 3, 9.5, p. 62", "note": ""}, {"n": 105, "stem": "La turbulencia en aire claro (TAC) aparece principalmente:", "opts": ["En nubes bajas espesas", "En vuelos a gran altitud, a menudo fuera de las nubes, cerca de las corrientes en chorro y en capas estables con fuerte cizalladura vertical", "Durante la niebla", "En el suelo"], "ans": 1, "why": "Suele ser débil y solo a veces fuerte; los pilotos que sufren una TAC intensa y persistente solicitan cambios de ruta o de nivel.", "src": "Manual 3, 9.5, pp. 63-64", "note": ""}, {"n": 106, "stem": "Una tormenta dura típicamente:", "opts": ["De 10 a 20 minutos", "De 2 a 3 horas", "12 horas", "24 horas"], "ans": 1, "why": "Tres fases: formación, madurez y disipación.", "src": "Manual 3, 9.6, p. 65", "note": ""}, {"n": 107, "stem": "¿En qué fase de la tormenta se forma el frente de racha?", "opts": ["Formación", "Madurez", "Disipación", "Antes de la fase de cúmulo"], "ans": 1, "why": "En la fase de madurez las corrientes descendentes llegan al suelo y forman el frente de racha; las ascendentes están en su máximo y aparece el yunque.", "src": "Manual 3, 9.6, p. 66", "note": ""}, {"n": 108, "stem": "La fase de disipación de una tormenta comienza cuando:", "opts": ["La precipitación es más intensa", "Desaparecen las corrientes ascendentes", "Se forma el yunque", "Se forma el frente de racha"], "ans": 1, "why": "Entonces las corrientes descendentes se extienden por el nivel inferior y se debilitan.", "src": "Manual 3, 9.6, p. 66", "note": ""}, {"n": 109, "stem": "Una línea de turbonada puede alcanzar:", "opts": ["5 km de ancho y 10 km de largo", "De 20 a 50 km de ancho y cientos de km de largo, desplazándose a unos 25 kt de media", "200 km de ancho, desplazándose a 100 kt", "1 km de ancho"], "ans": 1, "why": "Está asociada a vientos destructivos, turbulencia fuerte, granizo intenso y tornados.", "src": "Manual 3, 9.6.1, p. 67", "note": ""}, {"n": 110, "stem": "La corriente descendente de un microrreventón puede alcanzar:", "opts": ["6 kt", "60 kt", "600 kt", "15 kt"], "ans": 1, "why": "Eso supera la velocidad de descenso de una aeronave. Vientos de hasta 150 kt, variaciones de más de 50 kt, duración de 1 a 5 min (nunca más de 15).", "src": "Manual 3, 9.6.2, pp. 67-68", "note": ""}, {"n": 111, "stem": "Un microrreventón acompañado de precipitación se denomina:", "opts": ["Seco", "Húmedo", "Anular", "Frontal"], "ans": 1, "why": "Sin precipitación es seco.", "src": "Manual 3, 9.6.2, p. 68", "note": ""}, {"n": 112, "stem": "Un vórtice de tornado que no llega al suelo se denomina:", "opts": ["Tromba marina", "Tuba (<em>funnel cloud</em>)", "Microrreventón", "Rotor"], "ans": 1, "why": "Un tornado sobre el mar es una tromba marina.", "src": "Manual 3, 9.6.3, p. 68", "note": ""}, {"n": 113, "stem": "El viento máximo en superficie de una «tormenta tropical» es:", "opts": ["De hasta 33 kt", "De 34 a 63 kt", "De más de 64 kt", "Vientos flojos"], "ans": 1, "why": "Depresión: hasta 33 kt; huracán/ciclón/tifón: más de 64 kt.", "src": "Manual 3, 9.7, p. 70", "note": ""}, {"n": 114, "stem": "Las depresiones tropicales se forman entre aproximadamente ___ y sobre aguas marinas más cálidas de unos ___:", "opts": ["5ºN-5ºS y 10 ºC", "25ºN-25ºS y 27 ºC", "60ºN-60ºS y 27 ºC", "25ºN-25ºS y 50 ºC"], "ans": 1, "why": "Son depresiones no frontales.", "src": "Manual 3, 9.7, p. 70", "note": ""}, {"n": 115, "stem": "El nombre «tifón» se utiliza en:", "opts": ["La bahía de Bengala", "El golfo de México", "Filipinas, Taiwán, China y Japón", "El Caribe"], "ans": 2, "why": "«Ciclón» se utiliza en la bahía de Bengala y el mar Arábigo; «huracán», en el Atlántico norte occidental, el Pacífico norte central y oriental, el Caribe y el golfo de México.", "src": "Manual 3, 9.7, p. 69", "note": ""}, {"n": 116, "stem": "En los aeródromos donde la temperatura supera los 30 ºC:", "opts": ["La densidad del aire aumenta y el recorrido de despegue se acorta", "La densidad del aire disminuye, lo que puede alargar el       b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
