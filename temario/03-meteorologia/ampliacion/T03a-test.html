<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Meteorología general (T03a)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

bol><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Meteorología</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Meteorología general (T03a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Con los valores de anclaje ISA confirmados (15 °C al nivel del mar, -56,5 °C a 36 089 ft), ¿cuál es el gradiente térmico ISA en la troposfera, en °C por cada 1000 ft, redondeado a dos decimales?", "opts": ["1,65", "3,00", "2,50", "1,98"], "ans": 3, "why": "(15 - (-56,5)) / 36,089 = 71,5 / 36,089 = 1,98 °C por cada 1000 ft, lo que confirma el valor redondeado del manual: «2ºC por cada 1.000 ft de elevación». A es demasiado bajo; B (3,00) es el gradiente adiabático seco, no la cifra ISA; C tampoco es el valor indicado.", "src": "FAA-H-8083-28B Table 4-2; derivación.", "note": ""}, {"n": 2, "stem": "¿Cuál es la temperatura estándar ISA en el FL180 (18 000 ft), con la regla de 2 °C por cada 1000 ft?", "opts": ["-9 °C", "-15 °C", "-21 °C", "-36 °C"], "ans": 2, "why": "15 - 2x18 = -21 °C. A y B utilizan un gradiente erróneo; D cuenta dos veces la altitud.", "src": "FAA-H-8083-28B Table 4-2, derivado.", "note": ""}, {"n": 3, "stem": "¿Qué es la altitud de presión?", "opts": ["La altitud que indica el altímetro cuando se ajusta al QNH local", "La altitud que indica el altímetro cuando se ajusta a 29,92 inHg / 1013,25 hPa", "La altitud corregida por las desviaciones de presión y de temperatura respecto a las condiciones estándar", "La altura sobre el punto de referencia del aeródromo"], "ans": 1, "why": "La altitud de presión se define con respecto al reglaje estándar, 29,92 inHg / 1013,25 hPa. A describe una lectura de altitud con QNH; C describe la altitud densidad; D describe una altura tipo QFE.", "src": "FAA-H-8083-28B §8.4.1.4.", "note": ""}, {"n": 4, "stem": "La altitud densidad se describe mejor como:", "opts": ["La altitud de presión corregida por la temperatura no estándar", "La altitud verdadera corregida por la presión no estándar", "La altitud a la que la densidad del aire es igual a la densidad estándar al nivel del mar", "La altitud que indica el altímetro ajustado a QFE"], "ans": 0, "why": "La altitud densidad es la altitud de presión corregida además por la desviación de la temperatura respecto a la atmósfera estándar. C describe un concepto distinto y sin relación (no existe una única altitud fija de densidad estándar); B y D describen otros reglajes.", "src": "FAA-H-8083-28B §8.4.1.5.", "note": ""}, {"n": 5, "stem": "En un día muy caluroso, ¿cómo se compara la altitud densidad con la altitud de presión en el mismo aeropuerto?", "opts": ["Es siempre menor", "Es siempre igual", "Es mayor", "No puede determinarse sin datos de viento"], "ans": 2, "why": "El calor reduce la densidad del aire, por lo que la aeronave se comporta como si volara a una altitud (densidad) superior a la altitud de presión. A y B son lo contrario o ignoran el efecto de la temperatura; el viento no influye en la altitud densidad.", "src": "FAA-H-8083-28B §8.4.1.5.", "note": ""}, {"n": 6, "stem": "Un aeropuerto tiene una altitud de presión de 2000 ft y una temperatura exterior (OAT) de 30 °C. Con la temperatura estándar ISA de 11 °C a 2000 ft, ¿cuál es la desviación ISA?", "opts": ["ISA-19", "ISA+8", "ISA+11", "ISA+19"], "ans": 3, "why": "Desviación ISA = OAT - temperatura estándar ISA = 30 - 11 = +19 °C, es decir, ISA+19. Las demás opciones usan el signo erróneo o un valor de referencia erróneo.", "src": "derivado de FAA-H-8083-28B §8.4.1.5 y del gradiente térmico ISA.", "note": ""}, {"n": 7, "stem": "¿Cuál es, aproximadamente, el gradiente adiabático seco (DALR) de una burbuja de aire no saturado que asciende?", "opts": ["0,5 °C por cada 1000 ft", "2 °C por cada 1000 ft", "3 °C por cada 1000 ft", "6,5 °C por cada 1000 ft"], "ans": 2, "why": "El DALR es de unos 3 °C por cada 1000 ft (9,8 °C/km). A es el gradiente del punto de rocío; B es el SALR simplificado de la FAA; D es el gradiente térmico ISA expresado por km, no por cada 1000 ft.", "src": "FAA-H-8083-28B §12.2.", "note": ""}, {"n": 8, "stem": "¿Qué es el nivel de condensación por ascenso (<em>Lifted Condensation Level</em>, LCL)?", "opts": ["El nivel en el que una burbuja pasa a estar por primera vez más cálida que su entorno", "La base de la capa de fricción", "El nivel en el que el gradiente térmico ambiental es igual al SALR", "El nivel en el que convergen la temperatura y el punto de rocío de una burbuja ascendente (HR = 100 %)"], "ans": 3, "why": "El LCL es donde la diferencia entre temperatura y punto de rocío llega a cero, es decir, a la saturación; marca la base de las nubes. A describe el LFC; B no guarda relación; C describe una condición límite de estabilidad, no el LCL.", "src": "FAA-H-8083-28B §12.3.", "note": ""}, {"n": 9, "stem": "¿Por qué una burbuja saturada (nubosa) que asciende se enfría más despacio que una seca?", "opts": ["Porque la fricción la frena", "Porque el aire saturado es más denso que el seco", "Porque la fuerza de Coriolis reduce su velocidad vertical", "Porque la condensación libera calor latente que compensa parte del enfriamiento por expansión"], "ans": 3, "why": "La liberación de calor latente durante la condensación compensa en parte el enfriamiento adiabático, lo que da el gradiente adiabático saturado (más lento). La fricción y la fuerza de Coriolis no actúan verticalmente de este modo; B es falsa, porque el aire saturado no es simplemente «más denso» por esta razón.", "src": "FAA-H-8083-28B §12.3.", "note": ""}, {"n": 10, "stem": "¿Qué es el nivel de convección libre (<em>Level of Free Convection</em>, LFC)?", "opts": ["El nivel en el que una burbuja se satura", "El nivel de transición en una atmósfera estándar", "El nivel en el que comienza la tropopausa", "El nivel, por encima del LCL, en el que una burbuja elevada en una columna condicionalmente inestable pasa por primera vez a estar más cálida que su entorno"], "ans": 3, "why": "El LFC solo se define en columnas condicionalmente inestables, por encima del LCL, como el punto en que la burbuja adquiere flotabilidad por sí sola. A describe el LCL; B y C son conceptos de altimetría o de atmósfera sin relación.", "src": "FAA-H-8083-28B §13.4.", "note": ""}, {"n": 11, "stem": "Una columna de aire tiene un gradiente térmico ambiental inferior al gradiente adiabático saturado. ¿De qué estado de estabilidad se trata?", "opts": ["Inestabilidad absoluta", "Inestabilidad condicional", "Estabilidad neutra", "Estabilidad absoluta"], "ans": 3, "why": "ELR &lt; SALR (que es el menor de los dos gradientes adiabáticos) significa que una burbuja elevada es siempre más fría y más densa que su entorno en todos los niveles: estabilidad absoluta. Las demás opciones exigen que el ELR sea mayor.", "src": "FAA-H-8083-28B §13.2.", "note": ""}, {"n": 12, "stem": "Una columna de aire tiene un gradiente térmico ambiental comprendido entre el SALR y el DALR. ¿De qué estado de estabilidad se trata?", "opts": ["Estabilidad absoluta", "Estabilidad neutra", "Inestabilidad condicional", "Inestabilidad absoluta"], "ans": 2, "why": "SALR &lt; ELR &lt; DALR es exactamente la definición de inestabilidad condicional: estable mientras no está saturada e inestable una vez elevada más allá del LFC. Las demás opciones exigen que el ELR sea igual o superior al DALR, o inferior al SALR.", "src": "FAA-H-8083-28B §13.4.", "note": ""}, {"n": 13, "stem": "¿Qué mecanismo da FAA-H-8083-28B para la inestabilidad convectiva?", "opts": ["Al elevar una capa entera, esta se estira y su parte superior se enfría más deprisa que la inferior, con lo que aumenta el gradiente térmico de la capa", "La fricción superficial frena la base de la capa más que su parte superior", "La fuerza de Coriolis desvía la parte superior de la capa con respecto a su base", "El punto de rocío de la capa aumenta más deprisa que su temperatura"], "ans": 0, "why": "Cuando una capa elevada se estira verticalmente (la densidad disminuye con la altura), la parte superior se enfría más que la inferior, con lo que aumenta el gradiente y disminuye la estabilidad; esto se asocia al desarrollo de tormentas. Las demás opciones no son el mecanismo que se indica.", "src": "FAA-H-8083-28B §13.8.", "note": ""}, {"n": 14, "stem": "En un ejemplo resuelto del efecto Foehn, una burbuja que desciende 6000 ft por la ladera de sotavento, ya no saturada, ¿a qué ritmo se calienta?", "opts": ["El gradiente adiabático saturado, de unos 2 °C/1000 ft", "El gradiente del punto de rocío, de unos 0,5 °C/1000 ft", "El gradiente térmico ISA, de unos 2 °C/1000 ft aplicado al descenso", "El gradiente adiabático seco, de unos 3 °C/1000 ft"], "ans": 3, "why": "Una vez no saturada (tras perder humedad en forma de precipitación en la ladera de barlovento), la burbuja se calienta al (mayor) gradiente adiabático seco durante todo el descenso, lo que produce el característico calentamiento del efecto Foehn. A es el gradiente saturado de la fase de ascenso; B y C son gradientes sin relación en este contexto.", "src": "derivado de FAA-H-8083-28B §12.2-12.3, aplicado a la descripción del efecto Foehn del manual (§8.4.2).", "note": ""}, {"n": 15, "stem": "Indique las tres fuerzas principales que afectan al viento, según FAA-H-8083-28B.", "opts": ["La fuerza del gradiente de presión, la gravedad y la sustentación", "La fuerza del gradiente de presión, la fuerza de Coriolis y la fricción", "La fuerza de Coriolis, la fuerza centrífuga y la flotabilidad", "La advección, la convección y la turbulencia"], "ans": 1, "why": "La FAA nombra exactamente estas tres fuerzas (§10.3). La gravedad y la sustentación son aerodinámicas, no fuerzas meteorológicas del viento; la fuerza centrífuga y la flotabilidad no forman parte de este modelo de tres fuerzas; la advección, la convección y la turbulencia son procesos de intercambio de calor (capítulo 3 del manual), no fuerzas del viento.", "src": "FAA-H-8083-28B §10.3.", "note": ""}, {"n": 16, "stem": "¿Cómo varía la fuerza de Coriolis con la velocidad del viento?", "opts": ["Es inversamente proporcional a la velocidad del viento", "Es independiente de la velocidad del viento", "Es directamente proporcional a la velocidad del viento", "Solo existe por encima de 110 kt"], "ans": 2, "why": "La fuerza de Coriolis es directamente proporcional a la velocidad del viento: si se duplica la velocidad, se duplica la fuerza, a una latitud dada. Las demás opciones enuncian mal la relación o inventan un umbral.", "src": "FAA-H-8083-28B §10.3.2.", "note": ""}, {"n": 17, "stem": "¿Qué es el viento geostrófico?", "opts": ["El viento en superficie medido con un anemómetro", "El viento en el núcleo de una corriente en chorro únicamente", "El viento generado por una circulación de brisa marina", "El viento por encima de la capa de fricción en el que la fuerza de Coriolis equilibra exactamente la fuerza del gradiente de presión, y que sopla paralelo a las isobaras"], "ans": 3, "why": "Esta es la definición de la FAA del viento geostrófico, que se da por encima de la capa de fricción. A describe una medición en superficie; B lo restringe erróneamente a los núcleos de las corrientes en chorro; C describe una circulación térmica local.", "src": "FAA-H-8083-28B §10.4.", "note": ""}, {"n": 18, "stem": "¿Por qué el viento en superficie sopla cruzando las isobaras hacia la baja presión, en lugar de paralelo a ellas como el viento geostrófico?", "opts": ["Porque la fricción frena el viento y debilita la fuerza de Coriolis sin afectar a la fuerza del gradiente de presión, con lo que ambas dejan de estar equilibradas", "Porque la fuerza del gradiente de presión desaparece cerca de la superficie", "Porque la fuerza de Coriolis cambia de signo cerca de la superficie", "Porque las inversiones térmicas superficiales bloquean el flujo geostrófico"], "ans": 0, "why": "La fricción reduce la velocidad del viento y, con ella, la fuerza de Coriolis (que depende de la velocidad), pero no afecta a la fuerza del gradiente de presión; el desequilibrio resultante desvía el viento a través de las isobaras. B es falsa porque la fuerza del gradiente de presión no desaparece; C es falsa porque Coriolis no cambia de signo; las inversiones de D no son el mecanismo indicado.", "src": "FAA-H-8083-28B §10.5.", "note": ""}, {"n": 19, "stem": "¿Qué tres corrientes en chorro distingue FAA-H-8083-28B?", "opts": ["Chorro del frente polar, chorro subtropical y chorro de la noche polar", "Chorros ecuatorial, tropical y polar", "Chorros del oeste, del este y meridiano", "Chorros de nivel bajo, medio y alto"], "ans": 0, "why": "Estas son las tres corrientes en chorro que nombra la fuente. Las demás agrupaciones no son la clasificación utilizada.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 20, "stem": "¿Dónde se sitúa típicamente la corriente en chorro subtropical?", "opts": ["Hacia los 30° N/S", "Hacia los 50-60° N/S", "Solo en el ecuador", "Solo en la estratosfera"], "ans": 0, "why": "El chorro subtropical está ligado al borde polar de la célula de Hadley, hacia los 30° N/S. B describe la ubicación del chorro del frente polar; C y D son incorrectas.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 21, "stem": "¿Qué velocidad del viento en el núcleo del chorro se considera, en general, el umbral de la turbulencia en aire claro (TAC, <em>clear air turbulence</em>)?", "opts": ["60 kt", "85 kt", "110 kt", "150 kt"], "ans": 2, "why": "110 kt es la cifra que se da como velocidad del núcleo del chorro que marca el umbral de la TAC. Los demás valores no figuran en la fuente.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 22, "stem": "¿Qué valor de cizalladura vertical del viento hace probable una TAC moderada?", "opts": ["1 kt por cada 1000 ft o más", "40 kt por cada 1000 ft o más", "15 kt por cada 1000 ft o más", "5 kt por cada 1000 ft o más"], "ans": 3, "why": "La FAA afirma que la TAC moderada es probable con una cizalladura vertical de 5 kt/1000 ft o más (y/o una cizalladura horizontal de 40 kt/150 mi o más). Los demás valores no coinciden con la fuente.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 23, "stem": "¿Qué dimensiones típicas da FAA-H-8083-28B para una zona de TAC asociada a una corriente en chorro?", "opts": ["100-300 mi de largo, 50-100 mi de ancho y unos 5000 ft de espesor", "10-30 mi de largo, 5-10 mi de ancho y 500 ft de espesor", "1000-3000 mi de largo, 500-1000 mi de ancho y 50 000 ft de espesor", "Un único punto, sin extensión horizontal medible"], "ans": 0, "why": "Son las dimensiones típicas indicadas para una zona de TAC, que persiste de 30 minutos a un día. Las demás opciones no son las cifras dadas.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 24, "stem": "¿Qué genera una TAC especialmente intensa según FAA-H-8083-28B?", "opts": ["La convergencia de dos corrientes en chorro, por ejemplo el chorro del frente polar descendiendo hacia el sur bajo el chorro subtropical", "Una única corriente en chorro aislada, lejos de cualquier cadena montañosa", "Solo condiciones de calma y alta presión en superficie", "Un frente estacionario a nivel del mar"], "ans": 0, "why": "La confluencia de dos corrientes en chorro, con una fuerte cizalladura del viento entre ellas, se destaca como un generador notable de TAC. Las demás opciones describen condiciones que esta fuente no asocia a una TAC intensa.", "src": "FAA-H-8083-28B §19.2.3.2.1.", "note": ""}, {"n": 25, "stem": "¿Qué es una onda de Kelvin-Helmholtz (onda de cizalladura gravitatoria) en este contexto?", "opts": ["Una onda de presión en superficie asociada a una línea de turbonada", "Una banda de precipitación detectada por radar", "El movimiento ondulatorio en una capa estable con fuerte cizalladura vertical del viento que genera TAC y turbulencia de onda de montaña", "La oscilación de un altímetro ante un cambio rápido de presión"], "ans": 2, "why": "Es el mecanismo ondulatorio que hay detrás de la TAC y de la turbulencia de onda de montaña en capas estables con cizalladura, a veces visible en forma de nubes en oleaje (<em>billow clouds</em>). Las demás opciones describen fenómenos sin relación.", "src": "FAA AC 00-57 (figure captions).", "note": ""}, {"n": 26, "stem": "¿Qué tres ingredientes enumera FAA-H-8083-28B como necesarios para la formación de una célula de tormenta?", "opts": ["Suficiente vapor de agua, aire inestable y un mecanismo de elevación", "Alta presión, aire seco y viento fuerte en superficie", "Frente frío, frente cálido y oclusión", "Ozono, CO2 y vapor de agua"], "ans": 0, "why": "Estos tres ingredientes (humedad, inestabilidad y elevación) son los que nombra la FAA. Las demás listas describen condiciones sin relación o contrarias.", "src": "FAA-H-8083-28B §22.2.", "note": ""}, {"n": 27, "stem": "¿Son frecuentes o raras las tormentas de una sola célula (células ordinarias)?", "opts": ["Son raras; casi todas las tormentas reales son multicelulares", "Son el tipo más frecuente en todo el mundo", "Solo se dan sobre los océanos", "Nunca producen granizo"], "ans": 0, "why": "La FAA afirma que las tormentas de una sola célula son raras a pesar de ser el caso más sencillo de los libros de texto; la mayoría de las tormentas reales son multicelulares. B es lo contrario de la verdad; C y D son afirmaciones falsas que la fuente no respalda (las tormentas de una sola célula pueden producir granizo).", "src": "FAA-H-8083-28B §22.4.", "note": ""}, {"n": 28, "stem": "¿Qué define estructuralmente una tormenta de supercélula?", "opts": ["Un conjunto de células en distintas etapas de su ciclo de vida que se desplazan juntas", "Una banda estrecha de tormentas que se extiende cientos de millas", "Una única corriente ascendente giratoria, longeva y casi estacionaria", "Una tormenta confinada por completo por debajo del nivel de congelación"], "ans": 2, "why": "La característica que define a la supercélula es su corriente ascendente única, persistente y giratoria. A describe un conjunto multicelular; B describe una línea de turbonada; D describe un sistema de «nube cálida», sin relación con la estructura de la supercélula.", "src": "FAA-H-8083-28B §22.4.", "note": ""}, {"n": 29, "stem": "¿Qué porcentaje aproximado de las supercélulas produce un tornado, según FAA-H-8083-28B?", "opts": ["5 %", "50 %", "25 %", "80 %"], "ans": 2, "why": "La FAA afirma que casi todas las supercélulas producen fenómenos severos y que en torno al 25 % produce un tornado. D es, en cambio, la estadística (distinta) de qué fracción de los tornados de EE. UU. procede de supercélulas.", "src": "FAA-H-8083-28B §22.4.", "note": ""}, {"n": 30, "stem": "¿Qué fracción de los tornados de Estados Unidos producen las tormentas de supercélula?", "opts": ["Menos del 10 %", "Alrededor del 25 %", "Alrededor del 50 %", "Más del 80 %"], "ans": 3, "why": "La FAA afirma que más del 80 % de los tornados de EE. UU. proceden de tormentas de supercélula, cifra distinta del 25 % de supercélulas que producen un tornado.", "src": "FAA-H-8083-28B §22.4/8.10.", "note": ""}, {"n": 31, "stem": "¿Con qué tipo de tormenta se asocia con más frecuencia una nube estante (<em>shelf cloud</em>) o en rollo (<em>roll cloud</em>)?", "opts": ["Tormentas aisladas de una sola célula", "Tormentas confinadas en la mesosfera", "Tormentas secas sin precipitación", "Tormentas multicelulares en línea (línea de turbonada)"], "ans": 3, "why": "La FAA afirma que las nubes estante, que marcan el techo de la zona de turbulencia extrema en el frente de racha de una tormenta, son más frecuentes en las tormentas multicelulares en línea. Las demás opciones no están respaldadas.", "src": "FAA-H-8083-28B §19.2.", "note": ""}, {"n": 32, "stem": "Según la práctica del NWS y la FAA de EE. UU., ¿cuál es el umbral de tamaño del granizo para clasificar una tormenta como «severa»?", "opts": ["0,25 pulgadas de diámetro", "0,5 pulgadas de diámetro", "1 pulgada de diámetro o más", "3 pulgadas de diámetro o más"], "ans": 2, "why": "El umbral indicado es un granizo de 1 pulgada («del tamaño de una moneda de 25 centavos») de diámetro o más (y/o rachas de 50 kt o más). Es un criterio administrativo propio de EE. UU., no de la OACI ni de España.", "src": "FAA-H-8083-28B.", "note": ""}, {"n": 33, "stem": "¿Qué proceso de crecimiento es el mecanismo principal de precipitación en masas de aire cálidas y tropicales con un nivel de congelación muy alto?", "opts": ["El proceso de cristales de hielo", "La sublimación", "La colisión-coalescencia (proceso de lluvia cálida)", "La evaporación de virgas"], "ans": 2, "why": "La colisión-coalescencia, en la que las gotas mayores barren a las menores, es el principal proceso de crecimiento en masas de aire cálidas; el proceso de cristales de hielo (A) exige, en cambio, cristales de hielo y gotas subfundidas coexistentes. B y D son procesos sin relación u opuestos.", "src": "FAA-H-8083-28B §14.2.", "note": ""}, {"n": 34, "stem": "Describa el proceso de cristales de hielo en el crecimiento de la precipitación.", "opts": ["Las gotas mayores barren a las menores al caer a distintas velocidades", "El vapor de agua se deposita preferentemente sobre los cristales de hielo, que crecen a costa de las gotas subfundidas coexistentes", "La precipitación se evapora antes de llegar al suelo y forma virga", "Los granizos se recirculan repetidamente por una corriente ascendente"], "ans": 1, "why": "Esto describe el proceso de cristales de hielo. A describe la colisión-coalescencia; C describe la virga, un fenómeno distinto (ya incluido en el manual); D describe el crecimiento del granizo, que las fuentes utilizadas aquí no tratan con este nivel de detalle.", "src": "FAA-H-8083-28B §14.2.", "note": ""}, {"n": 35, "stem": "¿Qué espesor mínimo aproximado de las nubes asocia FAA-H-8083-28B con una precipitación significativa?", "opts": ["500 ft", "1500 ft", "4000 ft", "10 000 ft"], "ans": 2, "why": "La FAA afirma que, en general, las nubes deben tener al menos 4000 ft de espesor para producir una precipitación significativa. Los demás valores no son la cifra indicada.", "src": "FAA-H-8083-28B §14.2.", "note": ""}, {"n": 36, "stem": "¿Por qué corredor se canaliza el viento Cierzo-Mestral antes de llegar al Mediterráneo, según la guía LEBL de AEMET?", "opts": ["El valle del Ebro", "El corredor del Ródano", "La llanura del Rosellón", "El estrecho de Gibraltar"], "ans": 0, "why": "El Cierzo-Mestral se acelera a lo largo del valle del Ebro (depresión del Ebro) antes de entrar en el Mediterráneo, donde gira ciclónicamente. B es el corredor del Mistral; C, el de la Tramontana; D no guarda relación.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 37, "stem": "¿Por qué corredor se canaliza la Tramontana?", "opts": ["Entre los Pirineos y el Macizo Central francés, por la llanura del Rosellón", "El valle del Ebro", "El corredor del Ródano", "Solo el valle del Llobregat"], "ans": 0, "why": "La Tramontana se acelera por la estrecha llanura del Rosellón, cerca del golfo de León, entre los Pirineos y el Macizo Central, y a la salida gira anticiclónicamente. B es el corredor del Cierzo-Mestral; C, el del Mistral; D es un canal más abajo, no el origen de la Tramontana.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 38, "stem": "¿Qué es la línea de convergencia catalano-balear?", "opts": ["Un frente frío que cruza regularmente las islas Baleares en invierno", "El límite de la zona de control de Barcelona", "Una discontinuidad que se forma a sotavento de la Tramontana y del Cierzo-Mestral ya establecidos, entre la Costa Daurada y la Costa Brava", "Una línea que marca el borde de la brisa marina en Palma de Mallorca"], "ans": 2, "why": "Esta es la descripción que hace la propia AEMET de la formación y ubicación de la línea de convergencia. Las demás opciones la identifican erróneamente como un frente sinóptico, un límite ATC o el borde de una brisa marina sin relación.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 39, "stem": "¿Por qué la línea de convergencia catalano-balear es más activa en su lado norte (desde la desembocadura del Llobregat hasta el sur de la Costa Brava)?", "opts": ["Porque la temperatura de la superficie del mar es siempre más alta allí", "Porque el vórtice anticiclónico a sotavento de la Tramontana es más frecuente y está mejor definido que el vórtice ciclónico a sotavento del Mestral", "Porque no hay orografía en ese lado", "Porque la isla de calor urbana de Barcelona domina ese sector"], "ans": 1, "why": "AEMET atribuye la asimetría a la frecuencia y a la definición relativas de los dos vórtices, no a la temperatura del mar, a la ausencia de orografía ni a la isla de calor urbana.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 40, "stem": "En LEBL, un viento de componente este asociado al vórtice de la Tramontana puede proceder de dos direcciones según la posición del centro del vórtice. ¿Cuáles son?", "opts": ["N y S", "S-SE y NE (el viento del NE se denomina Gregal)", "O y NO", "SO y NO"], "ans": 1, "why": "La guía LEBL de AEMET dice que el viento en LEBL es siempre de componente este, pero del S-SE o del NE según dónde se sitúe el centro del vórtice anticiclónico de la Tramontana; el caso del NE es el Gregal. (El Garbí es otro viento: SSO-OSO, el giro vespertino de la brisa marina en LEBL, no un viento del S-SE.) Los demás pares no son de componente este.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 41, "stem": "¿Por qué las «lluvias cálidas» (lluvias intensas de tipo cálido) de la costa catalana casi no producen rayos?", "opts": ["Porque las tormentas nunca llegan a una fase de madurez", "Porque la nube precursora se desarrolla por completo por encima del nivel de congelación, sin partículas de hielo que impulsen una separación de cargas eficaz", "Porque la lluvia cae demasiado deprisa para que se formen campos eléctricos", "Porque ocurren siempre sobre el mar, que descarga cualquier carga a tierra"], "ans": 1, "why": "AEMET atribuye la práctica ausencia de rayos a la naturaleza de «nube cálida» de estos sistemas, que carecen de la microfísica de la fase de hielo necesaria para una electrificación eficaz. Las demás opciones no son el mecanismo indicado.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 42, "stem": "¿Cuál es la trampa característica de la predicción de las «lluvias cálidas» catalanas?", "opts": ["Coinciden siempre con viento fuerte en superficie", "La reflectividad radar se mantiene baja (&lt;= 50 dBZ) incluso con lluvia intensa, porque las gotas son relativamente pequeñas", "Van siempre precedidas de granizo", "Solo se producen al mediodía, con fuerte calentamiento solar"], "ans": 1, "why": "Como las gotas se forman por colisión-coalescencia y siguen siendo relativamente pequeñas, y el desarrollo vertical de la nube es limitado, la reflectividad radar infravalora la intensidad real de la lluvia. Las demás opciones no coinciden con la descripción de AEMET (el fenómeno es sobre todo nocturno, en otoño y sin granizo).", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 43, "stem": "¿Qué desencadena los episodios de «lluvias cálidas» catalanas, según la guía LEBL de AEMET?", "opts": ["La convergencia entre un flujo de levante en la costa central de Barcelona y los vientos descendentes (catabáticos) de terral procedentes de la cordillera litoral", "Un frente frío que llega desde el noroeste", "La subsidencia bajo un anticiclón fuerte", "Los restos de un ciclón tropical que llegan al Mediterráneo occidental"], "ans": 0, "why": "La convergencia sostenida en capas bajas entre el levante y el terral, canalizada por los valles fluviales locales, es el desencadenante indicado. Las demás opciones describen situaciones sinópticas distintas y sin relación.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 44, "stem": "¿Qué tres situaciones enumera la guía LEBL de AEMET como las más probables para producir cizalladura del viento en ese aeródromo?", "opts": ["Tormentas, viento sinóptico fuerte de componente O y corriente de densidad atrapada en la costa", "Solo niebla, escarcha y nubes bajas", "Marea alta, marea baja y calma", "Ceniza volcánica, tormentas de arena y nube radiactiva"], "ans": 0, "why": "Son las tres situaciones de cizalladura más probables en LEBL según la propia AEMET. Las demás listas no guardan relación o son inverosímiles para este aeródromo.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 45, "stem": "¿Qué condición atmosférica es inusual en el mecanismo de cizalladura de la «corriente de densidad atrapada en la costa» de LEBL?", "opts": ["Solo se produce durante un huracán", "Solo se produce por encima del FL150", "Requiere una nube de ceniza volcánica sobre el aeródromo", "Se produce en una atmósfera por lo demás estable, sin desencadenantes convectivos"], "ans": 3, "why": "A diferencia de la cizalladura provocada por tormentas o por vientos fuertes, este mecanismo (una masa de aire más fría y húmeda que avanza sobre aire más cálido y seco en la costa) se produce en un entorno estable, por lo que es fácil pasarlo por alto en operaciones. Las demás opciones carecen de respaldo.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 46, "stem": "¿Cómo se percibe típicamente una corriente de densidad atrapada en la costa en LEBL?", "opts": ["Como un descenso gradual e imperceptible de la presión a lo largo de varias horas", "Como una subida del QNH de más de 10 hPa en un minuto", "Como un aumento constante de la visibilidad", "Como un cambio brusco de la dirección y de la velocidad del viento, que probablemente forma una línea de convergencia sobre las pistas"], "ans": 3, "why": "AEMET describe un cambio brusco de dirección o de velocidad del viento y una línea de convergencia probable, detectable por las diferentes lecturas de los anemómetros en cada cabecera de pista. Las demás opciones describen mal el fenómeno.", "src": "AEMET Guía Meteorológica de Aeródromo LEBL.", "note": ""}, {"n": 47, "stem": "¿Qué valores puede tomar el campo «código de colores para la aviación» (<em>aviation colour code</em>) en un mensaje de aviso de cenizas volcánicas (VAA) de la OMM?", "opts": ["LOW, MEDIUM, HIGH, EXTREME", "RED, ORANGE, YELLOW, GREEN, UNKNOWN, NOT GIVEN o NIL", "SEVERE, MODERATE, LIGHT, NIL", "CAT I, CAT II, CAT III"], "ans": 1, "why": "OMM n.º 49 vol. II enumera exactamente estos valores permitidos para el elemento del código de colores para la aviación de un mensaje VAA. Los demás conjuntos de opciones no se utilizan en este campo.", "src": "WMO-No. 49 Vol. II, Part II.", "note": ""}, {"n": 48, "stem": "¿En qué nivel documental se define en última instancia el formato de los mensajes SIGMET/AIRMET?", "opts": ["Por cada oficina meteorológica de aeródromo (OMAe)", "A nivel OACI/OMM (OMM n.º 49 vol. II, el equivalente gratuito del Anexo 3 de la OACI, Apéndice 6)", "Por la aerolínea que opera el vuelo", "Solo dentro de la Guía MET de AEMET, sin base internacional"], "ans": 1, "why": "Se confirma que OMM n.º 49 vol. II es el equivalente de texto libre del Anexo 3 de la OACI, y su Apéndice 6 contiene las tablas de códigos de fenómenos y las plantillas de los SIGMET/AIRMET; la guía de AEMET aplica esta plantilla internacional a España. Las demás opciones atribuyen mal el origen del formato.", "src": "WMO-No. 49 Vol. II.", "note": ""}, {"n": 49, "stem": "¿Qué señala FAA AC 00-57 sobre las nubes lenticulares y las nubes rotor como indicadores de onda de montaña?", "opts": ["Están siempre presentes siempre que hay turbulencia de onda de montaña", "Puede haber turbulencia sin nubes lenticulares o rotor visibles si el aire es demasiado seco, de modo que su ausencia no prueba que el vuelo vaya a ser suave", "Solo se dan sobre los océanos, nunca sobre montañas", "Indican la ausencia total de turbulencia"], "ans": 1, "why": "AC 00-57 documenta que el aire seco puede producir turbulencia de onda de montaña o de rotor sin los indicadores visuales de nubes habituales. A y D exageran la fiabilidad de las nubes como indicador; C es falsa (son específicamente un fenómeno de terreno montañoso).", "src": "FAA AC 00-57.", "note": ""}, {"n": 50, "stem": "¿Cómo explica la estabilidad absoluta debida a un anticiclón con subsidencia la formación de niebla, según la referencia cruzada de esta guía de estudio?", "opts": ["El aire en subsidencia se enfría adiabáticamente y forma directamente gotas de niebla en altura", "El aire en subsidencia se comprime y se calienta adiabáticamente, lo que suele producir una inversión térmica en capas bajas que retiene la humedad cerca de la superficie", "El aire en subsidencia aumenta la velocidad del viento en superficie y dispersa la niebla por mezcla mecánica", "El aire en subsidencia no tiene efecto sobre la humedad superficial"], "ans": 1, "why": "La subsidencia provoca compresión y calentamiento adiabáticos, lo que suele producir una inversión en capas bajas (un caso de estabilidad absoluta) que retiene la humedad cerca de la superficie y favorece la niebla. A enuncia mal la termodinámica (el aire en subsidencia se calienta, no se enfría); C y D contradicen el mecanismo.", "src": "referencia cruzada derivada, FAA-H-8083-28B §13.2 y manual 3 de ENAIRE, cap. 6.", "note": ""}, {"n": 51, "stem": "¿Por qué una altitud de presión constante no es una altitud verdadera constante a lo largo de la distancia?", "opts": ["Porque los altímetros se desajustan de forma aleatoria con el tiempo", "Porque las superficies de presión constante tienen alturas distintas a lo largo de una distancia horizontal, de modo que la altitud verdadera varía aunque la altitud de presión (una referencia fija) permanezca constante", "Porque la altitud de presión solo es válida por debajo de la altitud de transición", "Porque la fuerza de Coriolis modifica la calibración del altímetro"], "ans": 1, "why": "Las superficies de presión constante están inclinadas con respecto a la altitud verdadera a lo largo de la distancia horizontal (por ejemplo, entre masas de aire más cálidas y más frías), de modo que volar a una altitud de presión fija (como hacen los niveles de vuelo) significa que la altitud verdadera varía con la posición. Las demás opciones atribuyen mal la causa.", "src": "FAA-H-8083-28B §8.4.1.4.", "note": ""}, {"n": 52, "stem": "¿Por qué FAA-H-8083-28B llama a la altitud densidad «un índice de las actuaciones de la aeronave»?", "opts": ["Porque solo importa para las aeronaves a reacción, no para las de pistón", "Porque una mayor altitud densidad reduce directamente las actuaciones de la aeronave (ascenso, recorrido de despegue, potencia del motor), con independencia de la elevación real del campo", "Porque sustituye la necesidad de una tabla de distancia de despegue", "Porque es idéntica a la altitud verdadera en todas las condiciones"], "ans": 1, "why": "La altitud densidad se correlaciona directamente con las actuaciones aerodinámicas y del motor: cuanto mayor es, peores son las actuaciones, con independencia de la elevación del aeropuerto que figura en las cartas. Las demás opciones enuncian mal su alcance o su función.", "src": "FAA-H-8083-28B §8.4.1.5.", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/03-meteorologia/ampliacion/T03a-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
