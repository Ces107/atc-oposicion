<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Productos meteorológicos aeronáuticos y ejercicios de decodificación (T03b)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

bol><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Meteorología</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Productos meteorológicos aeronáuticos y ejercicios de decodificación (T03b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según WMO-49, ¿con qué velocidad media máxima del viento una variación direccional de 60-179 grados se notifica como VRB (sin dirección media), en lugar de con las dos direcciones extremas?", "opts": ["Menos de 10 kt (5 m/s)", "Menos de 6 kt (3 m/s)", "Menos de 5 kt (2,5 m/s)", "Menos de 3 kt (1,5 m/s)"], "ans": 3, "why": "WMO-49, apartado 4.1.5.2(b), fija el umbral en 1,5 m/s (3 kt): por debajo de esa velocidad y con una variación de 60-179 grados se notifica VRB sin dirección media; con 3 kt o más se dan, en cambio, las dos direcciones extremas.", "src": "WMO49, apartado 4.1.5.2", "note": ""}, {"n": 2, "stem": "Cuando la variación direccional total del viento durante los 10 minutos anteriores es de 60 grados o más pero inferior a 180 grados, y la velocidad media es de al menos 3 kt, ¿cómo se notifica la dirección?", "opts": ["Como VRB sin dirección media", "Solo con una dirección media única", "Con las dos direcciones extremas entre las que ha variado el viento", "La variación no se notifica en absoluto"], "ans": 2, "why": "WMO-49 4.1.5.2(b)(i): con 3 kt o más y una variación de 60-179 grados se notifican las dos direcciones extremas (por ejemplo, 350V090), no VRB ni una dirección media a secas.", "src": "WMO49, apartado 4.1.5.2", "note": ""}, {"n": 3, "stem": "¿Cuál es la definición exacta de WMO-49 de «nube de importancia para las operaciones», que se usa para decidir si se aplica CAVOK o NSC?", "opts": ["Una nube con la base por debajo de 1500 m (5000 ft) o por debajo de la mayor altitud mínima de sector, la que sea mayor, o CB/TCU a cualquier altura", "Cualquier capa de nubes notificada en el METAR", "Solo el cumulonimbo, con independencia de su altura", "Una base de nube por debajo de 3000 m, sea cual sea el tipo"], "ans": 0, "why": "El glosario de WMO-49 la define con precisión como una base por debajo de 1500 m/5000 ft o de la mayor MSA (la que sea mayor), o una nube CB o TCU a cualquier altura.", "src": "WMO49, definiciones del glosario", "note": ""}, {"n": 4, "stem": "¿Qué condición de visibilidad se exige, junto con la ausencia de nubes de importancia para las operaciones y de fenómenos significativos, para codificar CAVOK?", "opts": ["Visibilidad exactamente de 9999", "Visibilidad de 8000 m o más sin mínimo notificable", "Visibilidad de 10 km o más, sin que sea necesario notificar aparte la visibilidad mínima", "Visibilidad de 5000 m o más"], "ans": 2, "why": "WMO-49, apartado 2.2(a), exige una visibilidad de 10 km o más cuando no es necesario notificar aparte la visibilidad mínima; combinada con (b) ausencia de nubes de importancia para las operaciones y (c) ausencia de fenómenos significativos, los tres grupos se sustituyen entonces por CAVOK.", "src": "WMO49, apartado 2.2", "note": ""}, {"n": 5, "stem": "Un SPECI obligatorio se activa por un cambio de dirección del viento de 60 grados o más solo si la velocidad media antes y/o después del cambio es de al menos:", "opts": ["20 kt (10 m/s)", "15 kt (7,5 m/s)", "10 kt (5 m/s)", "3 kt (1,5 m/s)"], "ans": 2, "why": "WMO-49, Apéndice 3, apartado 2.3.2(a): el criterio de SPECI obligatorio para un cambio de dirección de 60 grados o más exige que la velocidad media antes y/o después del cambio sea de 10 kt (5 m/s) o más.", "src": "WMO49, Apéndice 3, apartado 2.3.2", "note": ""}, {"n": 6, "stem": "¿Cuánto debe variar la velocidad media del viento en superficie respecto al último informe para activar un SPECI obligatorio solo por ese criterio?", "opts": ["20 kt (10 m/s) o más", "15 kt (7,5 m/s) o más", "5 kt (2,5 m/s) o más", "10 kt (5 m/s) o más"], "ans": 3, "why": "WMO-49, Apéndice 3, apartado 2.3.2(b), fija el umbral de cambio de velocidad del viento en 10 kt (5 m/s) o más respecto al informe anterior.", "src": "WMO49, Apéndice 3, apartado 2.3.2", "note": ""}, {"n": 7, "stem": "Un SPECI obligatorio se activa por un cambio de 10 kt (5 m/s) o más en la variación de las rachas, siempre que la velocidad media antes y/o después del cambio sea de al menos:", "opts": ["10 kt (5 m/s)", "15 kt (7,5 m/s)", "25 kt (12,5 m/s)", "5 kt (2,5 m/s)"], "ans": 1, "why": "WMO-49, Apéndice 3, apartado 2.3.2(c), exige que la velocidad media antes y/o después del cambio en la variación de las rachas sea de 15 kt (7,5 m/s) o más para que este criterio se aplique.", "src": "WMO49, Apéndice 3, apartado 2.3.2", "note": ""}, {"n": 8, "stem": "¿Se activa un SPECI obligatorio cuando la cantidad de una capa de nubes situada por debajo de qué altura pasa de SCT o menos a BKN u OVC, o viceversa?", "opts": ["450 m (1500 ft)", "900 m (3000 ft)", "300 m (1000 ft)", "1000 m (3300 ft)"], "ans": 0, "why": "WMO-49, Apéndice 3, apartado 2.3.2(f), fija el umbral en 450 m (1500 ft): un cambio de cantidad de una capa por debajo de esa altura, que pase de SCT o menos a BKN u OVC o viceversa, es un criterio de SPECI obligatorio.", "src": "WMO49, Apéndice 3, apartado 2.3.2", "note": ""}, {"n": 9, "stem": "¿Cuál de los siguientes cambios de fenómeno meteorológico activa un SPECI obligatorio solo por su comienzo o su cese (y no por ningún cambio de intensidad)?", "opts": ["Lluvia engelante", "Lluvia moderada o fuerte", "Tormenta con precipitación", "Niebla engelante"], "ans": 3, "why": "WMO-49, Apéndice 3, apartado 2.3.2(e), enumera la niebla engelante y la tormenta sin precipitación como criterios solo de comienzo o cese; la precipitación engelante, la precipitación moderada o fuerte y la tormenta con precipitación (apartado 2.3.2(d)) se notifican por el comienzo, el cese o cualquier cambio de intensidad.", "src": "WMO49, Apéndice 3, apartado 2.3.2", "note": ""}, {"n": 10, "stem": "¿Durante qué período se define el «tiempo reciente» (el grupo RE), según WMO-49?", "opts": ["Solo los 10 minutos anteriores a la observación", "Desde el último informe ordinario, o la última hora, el período que sea más corto, sin incluir el momento de la propia observación", "Las 24 horas completas desde el informe de medianoche del día anterior", "Las 3 horas anteriores, con independencia de la frecuencia de los informes"], "ans": 1, "why": "WMO-49, apartado 4.8.1.1, define el tiempo reciente como los fenómenos observados desde el último informe ordinario emitido, o durante la última hora, el período que sea más corto, pero excluye expresamente los fenómenos que se producen en el momento de la propia observación (estos van en el grupo de tiempo presente).", "src": "WMO49, apartado 4.8.1.1", "note": ""}, {"n": 11, "stem": "¿Cuál es el número máximo de grupos de tiempo reciente (RE) que pueden aparecer en un mismo METAR/SPECI?", "opts": ["Tres", "Dos", "Ilimitado", "Uno"], "ans": 0, "why": "WMO-49, apartado 4.8.1.1, limita la notificación del tiempo reciente a un máximo de tres grupos.", "src": "WMO49, apartado 4.8.1.1", "note": ""}, {"n": 12, "stem": "¿En qué tipo o tipos de informe se incluye el grupo QFE, según WMO-49?", "opts": ["Solo en los informes ordinarios locales y en los informes especiales locales, nunca en el METAR/SPECI", "Solo en el SPECI", "Solo en el METAR", "Tanto en el METAR como en el SPECI, siempre"], "ans": 0, "why": "WMO-49, apartado 4.5.1(k), establece que el QFE se incluye solo en los informes ordinarios locales y en los informes especiales locales; nunca forma parte de la clave METAR/SPECI que se difunde internacionalmente.", "src": "WMO49, apartado 4.5.1", "note": ""}, {"n": 13, "stem": "¿Cuál es la plantilla correcta de WMO-49 para un grupo suplementario de cizalladura del viento que afecta a una pista concreta?", "opts": ["WS/RVR nnn", "SEV WS FL nnn", "[MOD or SEV] WS [APCH] RWYnn", "WSHR RWY nn KT"], "ans": 2, "why": "La plantilla de WMO-49 es [MOD or SEV] WS [APCH] RWYnn (WS ALL RWY cuando se ven afectadas todas las pistas). Los demás formatos (WS/RVR nnn, SEV WS FL nnn, WSHR RWY nn KT) no existen en WMO-49.", "src": "WMO49, Apéndice 3, tablas de plantillas", "note": ""}, {"n": 14, "stem": "¿Por debajo de qué altura sobre el nivel de la pista se notifica normalmente la cizalladura del viento mediante el grupo suplementario WS, según WMO-49?", "opts": ["1000 m (3300 ft)", "2000 m (6600 ft)", "150 m (500 ft)", "500 m (1600 ft)"], "ans": 3, "why": "WMO-49, apartado 4, da 500 m (1600 ft) sobre el nivel de la pista como la capa dentro de la cual la cizalladura del viento observada o notificada por las aeronaves se codifica en el grupo suplementario WS.", "src": "WMO49, apartado sobre la notificación de la cizalladura del viento", "note": ""}, {"n": 15, "stem": "Según la práctica recomendada de WMO-49, ¿cuál es el período de validez mínimo de un TAF ordinario?", "opts": ["9 horas", "12 horas", "3 horas", "6 horas"], "ans": 3, "why": "WMO-49, apartado 6.2.6, recomienda que la validez de un TAF ordinario no sea inferior a 6 horas ni superior a 30 horas.", "src": "WMO49, apartado 6.2.6", "note": ""}, {"n": 16, "stem": "¿Cuál es el período de validez máximo recomendado para un TAF ordinario?", "opts": ["30 horas", "18 horas", "24 horas", "27 horas"], "ans": 0, "why": "WMO-49, apartado 6.2.6: la validez no debería superar las 30 horas.", "src": "WMO49, apartado 6.2.6", "note": ""}, {"n": 17, "stem": "Según WMO-49, ¿con qué frecuencia se emite un TAF con validez inferior a 12 horas?", "opts": ["Cada 6 horas", "Cada 3 horas", "Cada 12 horas", "Cada 9 horas"], "ans": 1, "why": "WMO-49, apartado 6.2.6: los TAF con validez inferior a 12 horas se emiten cada 3 horas.", "src": "WMO49, apartado 6.2.6", "note": ""}, {"n": 18, "stem": "Según WMO-49, ¿con qué frecuencia se emite un TAF con validez de 12 a 30 horas?", "opts": ["Cada 3 horas", "Solo una vez, al comienzo de la validez", "Cada 6 horas", "Cada 12 horas"], "ans": 2, "why": "WMO-49, apartado 6.2.6: los TAF con validez de 12 a 30 horas se emiten cada 6 horas.", "src": "WMO49, apartado 6.2.6", "note": ""}, {"n": 19, "stem": "Según el Apéndice 5 de WMO-49, ¿en qué se diferencia el grupo de cambio FM de BECMG en un TAF?", "opts": ["FM y BECMG son intercambiables y significan exactamente lo mismo", "Todos los elementos indicados antes de FM quedan totalmente sustituidos por los que le siguen, mientras que BECMG solo modifica los elementos que se enumeran expresamente a continuación", "FM tiene una ventana horaria de desde/hasta como BECMG, pero más corta", "FM solo se aplica al viento y BECMG se aplica a todos los elementos"], "ans": 1, "why": "WMO-49, Apéndice 5, Tabla A5-2: FM indica un cambio rápido en un instante único, y todo lo que sigue a FM sustituye por completo (deja sin efecto) lo indicado antes; BECMG solo enumera y modifica los elementos concretos cuyo cambio se espera, y el resto de la previsión permanece como se había indicado.", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 20, "stem": "¿Cuál es la duración máxima recomendada de la ventana horaria de un grupo de cambio BECMG en un TAF?", "opts": ["2 horas", "6 horas", "1 hora", "4 horas"], "ans": 3, "why": "WMO-49, Apéndice 5, Tabla A5-2: el período de BECMG normalmente debería ser inferior a 2 horas y, en todo caso, no debería superar las 4 horas.", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 21, "stem": "¿Cuál es la duración máxima de un episodio individual de fluctuación TEMPO dentro de un TAF?", "opts": ["Hasta 6 horas", "Menos de 1 hora", "Hasta 2 horas", "Hasta 4 horas"], "ans": 1, "why": "WMO-49, Apéndice 5, Tabla A5-2: las fluctuaciones temporales bajo TEMPO no deberían durar más de una hora en cada caso.", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 22, "stem": "¿Cuál es la regla sobre la duración total de todos los episodios TEMPO dentro de su ventana horaria?", "opts": ["Deben sumar exactamente el período completo", "Su suma debe superar la mitad del período indicado", "No hay límite total, solo un límite por episodio", "Su suma debe ser inferior a la mitad del período TEMPO indicado"], "ans": 3, "why": "WMO-49, Apéndice 5, Tabla A5-2: en conjunto, los episodios TEMPO deben cubrir menos de la mitad del período día-hora/día-hora indicado.", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 23, "stem": "¿Qué grupos de probabilidad pueden utilizarse en un TAF según WMO-49 (probabilidad expresada en decenas de por ciento)?", "opts": ["PROB30 o PROB40", "PROB70 o PROB80", "PROB10 o PROB20", "PROB50 o PROB60"], "ans": 0, "why": "WMO-49, Apéndice 5, Tabla A5-2, muestra PROB30 o PROB40, y el apartado 1.4 dice que una probabilidad inferior al 30 por ciento no es lo bastante significativa para indicarla, mientras que el 50 por ciento o más no debe darse como probabilidad (se usan BECMG, TEMPO o FM).", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 24, "stem": "En el uso estándar de la OACI/OMM, ¿con qué otro indicador de grupo de cambio se combina normalmente PROB30/PROB40?", "opts": ["NOSIG", "BECMG", "FM", "TEMPO"], "ans": 3, "why": "WMO-49, Apéndice 5, Tabla A5-2, muestra PROBnn junto con TEMPO (por ejemplo, PROB30 TEMPO ddhh/ddhh...); no es un uso estándar emitir un grupo PROB aislado sin un TEMPO que lo acompañe.", "src": "WMO49, Apéndice 5, Tabla A5-2", "note": ""}, {"n": 25, "stem": "¿Cuál es el número máximo de valores de temperatura TX (máxima) y TN (mínima) que pueden aparecer en un solo TAF, según WMO-49?", "opts": ["Uno (TX o TN, nunca ambos)", "Seis (tres TX y tres TN)", "Cuatro (hasta dos TX y dos TN)", "Dos (solo una TX y una TN)"], "ans": 2, "why": "Las notas del Apéndice 5 de WMO-49 permiten hasta cuatro valores de temperatura por TAF: dos máximas (TX) y dos mínimas (TN), con sus horas UTC de ocurrencia.", "src": "WMO49, Apéndice 5, nota 9", "note": ""}, {"n": 26, "stem": "¿Cuál es la diferencia entre TAF AMD y TAF COR?", "opts": ["AMD corrige errores de sintaxis; COR se emite tras una revisión continua", "AMD es una enmienda emitida tras una revisión porque han cambiado las condiciones previstas; COR corrige un error de sintaxis o de transmisión", "AMD solo se usa para el SIGMET y COR solo para el TAF", "Son dos nombres para la misma acción"], "ans": 1, "why": "AMD refleja el criterio del predictor de que las condiciones han cambiado lo bastante como para necesitar una nueva previsión (proceso de revisión continua, WMO-49, apartados 6.2.4-6.2.5); COR se limita a corregir un error de formato o de transmisión en una previsión que ya era correcta.", "src": "WMO49, apartado 6.2.4-6.2.5; AEMET", "note": ""}, {"n": 27, "stem": "¿Cuál es el período máximo de validez de un SIGMET ordinario (que no sea de cenizas volcánicas ni de ciclón tropical)?", "opts": ["2 horas", "4 horas", "3 horas", "6 horas"], "ans": 1, "why": "WMO-49, apartado 7.1.3: la validez del SIGMET no será superior a 4 horas, salvo para las nubes de cenizas volcánicas y los ciclones tropicales, que se amplía a 6 horas.", "src": "WMO49, apartado 7.1.3", "note": ""}, {"n": 28, "stem": "¿Cuál es la validez máxima de un SIGMET de nube de cenizas volcánicas o de ciclón tropical?", "opts": ["4 horas", "8 horas", "5 horas", "6 horas"], "ans": 3, "why": "WMO-49, apartado 7.1.3, amplía la validez de los SIGMET de cenizas volcánicas y de ciclón tropical a 6 horas (SIGMET ordinario: 4 horas); 5 y 8 horas no son valores del texto.", "src": "WMO49, apartado 7.1.3", "note": ""}, {"n": 29, "stem": "¿Con cuánta antelación respecto al comienzo de su período de validez puede emitirse un SIGMET ordinario?", "opts": ["En cualquier momento, sin límite", "No más de 4 horas antes", "No más de 6 horas antes", "No más de 2 horas antes"], "ans": 1, "why": "WMO-49, apartado 7.1.6: los mensajes SIGMET se emitirán no más de 4 horas antes del comienzo del período de validez (la excepción de VA/TC permite hasta 12 horas).", "src": "WMO49, apartado 7.1.6", "note": ""}, {"n": 30, "stem": "Para los SIGMET de cenizas volcánicas y de ciclón tropical, ¿con cuánta antelación pueden emitirse y con qué frecuencia deben actualizarse?", "opts": ["Emitidos hasta 12 horas antes, actualizados al menos cada 6 horas", "Emitidos hasta 2 horas antes, actualizados cada hora", "Emitidos hasta 24 horas antes, actualizados cada 12 horas", "Emitidos hasta 6 horas antes, actualizados cada 3 horas"], "ans": 0, "why": "WMO-49, apartado 7.1.6: los SIGMET de VA y TC pueden emitirse tan pronto como sea posible, pero no más de 12 horas antes de que comience la validez, y deben actualizarse al menos cada 6 horas.", "src": "WMO49, apartado 7.1.6", "note": ""}, {"n": 31, "stem": "¿A qué hora UTC se reinicia la numeración secuencial diaria de los SIGMET de una FIR?", "opts": ["A las 1200 UTC (mediodía)", "A las 0000 UTC exactas, pero la cuenta empieza con el primer SIGMET posterior a las 0100 UTC", "Nunca se reinicia; la numeración es continua durante el mes natural", "A las 0001 UTC"], "ans": 3, "why": "WMO-49, apartado 7.1.1 (y la nota de la plantilla del Apéndice 6), establece que el número de secuencia corresponde a los mensajes SIGMET emitidos para la FIR desde las 0001 UTC del día en cuestión.", "src": "WMO49, apartado 7.1.1 / Apéndice 6", "note": ""}, {"n": 32, "stem": "¿Cuántos fenómenos meteorológicos distintos puede describir un único mensaje SIGMET?", "opts": ["Tantos como hagan falta para describir la situación", "Hasta dos, si están estrechamente relacionados", "Solo uno", "Hasta tres"], "ans": 2, "why": "WMO-49, Apéndice 6, apartados 1.1.4-1.1.5: en cada mensaje SIGMET se incluye solo uno de los fenómenos enumerados, sin material descriptivo adicional.", "src": "WMO49, Apéndice 6, apartados 1.1.4-1.1.5", "note": ""}, {"n": 33, "stem": "¿Cuál de estos es un código de fenómeno de tormenta válido en el SIGMET, según el Apéndice 6 de WMO-49?", "opts": ["WSPR TS", "ISOL TS", "EMBD TS", "LOC TS"], "ans": 2, "why": "El Apéndice 6 de WMO-49 enumera exactamente cuatro códigos SIGMET de tormenta: OBSC TS, EMBD TS, FRQ TS, SQL TS (más sus variantes TSGR/granizo); ISOL TS es un código de nivel AIRMET (aislada, de menor severidad), y las otras dos opciones no existen en la norma.", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 34, "stem": "¿Qué velocidad media del viento en superficie en 10 minutos debe alcanzar una depresión para clasificarse como ciclón tropical (TC) a efectos del SIGMET?", "opts": ["34 kt (17 m/s) o más", "45 kt (23 m/s) o más", "25 kt (13 m/s) o más", "64 kt (33 m/s) o más"], "ans": 0, "why": "WMO-49, Apéndice 6, apartado 1.1.4, fija el umbral del SIGMET de TC en una velocidad media del viento en superficie en 10 minutos de 17 m/s (34 kt) o más.", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 35, "stem": "¿Qué indica específicamente el código SIGMET «SEV ICE (FZRA)»?", "opts": ["Engelamiento fuerte de causa desconocida", "Engelamiento fuerte debido a lluvia engelante", "Engelamiento moderado debido a lluvia engelante", "Engelamiento fuerte previsto pero aún no observado"], "ans": 1, "why": "El Apéndice 6 de WMO-49 enumera SEV ICE (FZRA) como el código específico del engelamiento fuerte causado por lluvia engelante, distinto del código general SEV ICE (que no especifica la causa).", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 36, "stem": "¿Qué fenómeno describe el código SIGMET «SEV MTW»?", "opts": ["Tiempo severo de vaguada monzónica", "Onda de tormenta de mesoescala severa", "Onda de montaña fuerte", "Aviso de tiempo severo de varios tipos"], "ans": 2, "why": "WMO-49, Apéndice 6: MTW significa onda de montaña (<em>mountain wave</em>); SEV MTW es el código SIGMET de onda de montaña fuerte.", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 37, "stem": "¿Qué significan, respectivamente, los códigos SIGMET HVY DS y HVY SS?", "opts": ["Tormenta de polvo fuerte y tormenta de arena fuerte", "Cizalladura de corriente descendente fuerte y cizalladura en superficie fuerte", "Llovizna fuerte y chubasco de nieve fuerte", "Turbonada retrasada fuerte y turbonada estacionaria fuerte"], "ans": 0, "why": "WMO-49, Apéndice 6: HVY DS = tormenta de polvo fuerte (<em>heavy duststorm</em>); HVY SS = tormenta de arena fuerte (<em>heavy sandstorm</em>).", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 38, "stem": "¿Qué indica el código SIGMET «RDOACT CLD»?", "opts": ["Nube de cúmulos de desarrollo rápido", "Nube radiactiva (liberación accidental de material radiactivo)", "Nube activa en radar (una célula convectiva detectada por radar)", "Nube de visibilidad reducida que oculta el aeródromo"], "ans": 1, "why": "El Apéndice 6 de WMO-49 enumera RDOACT CLD como el código SIGMET de una nube radiactiva, vinculado a la cadena de productos de los CMRE (centros meteorológicos regionales especializados) para las liberaciones accidentales de material radiactivo.", "src": "WMO49, Apéndice 6, apartado 1.1.4", "note": ""}, {"n": 39, "stem": "¿Cuál es el período máximo de validez de un mensaje AIRMET?", "opts": ["2 horas", "4 horas", "3 horas", "6 horas"], "ans": 1, "why": "WMO-49, apartado 7.2.3: el período de validez de un mensaje AIRMET no será superior a 4 horas.", "src": "WMO49, apartado 7.2.3", "note": ""}, {"n": 40, "stem": "¿Cuál es el nivel de vuelo límite por defecto de la OACI por debajo del cual se aplica la información AIRMET?", "opts": ["Por debajo del FL80", "Por debajo del FL120", "Por debajo del FL50", "Por debajo del FL100 (ampliado al FL150 en zonas montañosas, o más alto, por acuerdo regional)"], "ans": 3, "why": "WMO-49, Apéndice 6, apartado 2.1.4: el AIRMET abarca los niveles de crucero por debajo del FL100, ampliados a por debajo del FL150 en zonas montañosas, o más altos cuando así lo especifique el acuerdo regional de navegación aérea.", "src": "WMO49, Apéndice 6, apartado 2.1.4", "note": ""}, {"n": 41, "stem": "¿Qué umbral de velocidad del viento en superficie define el fenómeno AIRMET «SFC WIND»?", "opts": ["Viento medio en superficie extendido superior a 30 kt", "Viento medio en superficie extendido superior a 45 kt", "Cualquier viento en superficie con rachas superiores a 20 kt", "Viento medio en superficie extendido superior a 15 kt"], "ans": 0, "why": "El Apéndice 6 de WMO-49 define el fenómeno AIRMET SFC WIND como una velocidad media del viento en superficie extendida superior a 15 m/s (30 kt).", "src": "WMO49, Apéndice 6, apartado 2.1.4", "note": ""}, {"n": 42, "stem": "¿Qué umbral de visibilidad define el fenómeno AIRMET «SFC VIS»?", "opts": ["Reducción extendida de la visibilidad a menos de 8000 m", "Reducción extendida de la visibilidad a menos de 3000 m", "Reducción extendida de la visibilidad a menos de 5000 m", "Reducción extendida de la visibilidad a menos de 1500 m"], "ans": 2, "why": "El Apéndice 6 de WMO-49 define el fenómeno AIRMET SFC VIS como zonas extendidas con visibilidad reducida por debajo de 5000 m, junto con el fenómeno meteorológico causante.", "src": "WMO49, Apéndice 6, apartado 2.1.4", "note": ""}, {"n": 43, "stem": "En los códigos de fenómenos AIRMET, ¿qué indican los calificativos ISOL, OCNL y FRQ antepuestos a CB, TCU o TS?", "opts": ["Las tres regiones de la OACI donde se aplica el código", "Presencia aislada, ocasional y frecuente del fenómeno", "Niveles de intensidad: débil, moderada y fuerte", "Métodos de observación: solo instrumental, óptico y solo previsto"], "ans": 1, "why": "Según la leyenda de tiempo significativo de WMO-49 (Apéndice 1), los calificativos que se usan con CB/TCU son ISOL = aislados (CB individuales), OCNL = ocasionales (CB bien separados) y FRQ = frecuentes (CB con poca o ninguna separación): describen la cobertura del fenómeno, no su intensidad ni el método de observación.", "src": "WMO49, Apéndice 6, apartado 2.1.4", "note": ""}, {"n": 44, "stem": "¿Con qué frecuencia se emite un GAMET y cuál es su período de validez?", "opts": ["Se emite cada 6 horas, con validez de 6 horas", "Se emite cada 24 horas, con validez de 24 horas", "Se emite cada 12 horas, con validez de 12 horas", "Se emite cada 3 horas, con validez de 3 horas"], "ans": 0, "why": "El Apéndice 5 de WMO-49 (plantilla del GAMET) y la guía de AEMET confirman que el GAMET es una previsión de área ordinaria que se emite cada 6 horas con una validez de 6 horas.", "src": "WMO49 / AEMET", "note": ""}, {"n": 45, "stem": "¿Qué nivel límite abarca una previsión de área GAMET?", "opts": ["Vuelos por debajo del FL150", "Vuelos por debajo del FL250", "Todos los niveles de vuelo, sin límite", "Vuelos por debajo del FL100"], "ans": 0, "why": "El GAMET es la previsión de área específica para los vuelos por debajo del FL150 (vuelos a baja altura), distinta de los mapas SIGWX, que cubren los niveles medios y altos.", "src": "WMO49 / AEMET", "note": ""}, {"n": 46, "stem": "En un grupo de viento/temperatura de la Sección II de un GAMET, ¿qué significan los prefijos PS y MS?", "opts": ["Secciones provisional y obligatoria", "Estación primaria y estación móvil", "Temperatura positiva y temperatura negativa (menos)", "Superficie de presión y superficie media"], "ans": 2, "why": "La plantilla del GAMET del Apéndice 5 de WMO-49 usa PS como prefijo de un valor de temperatura positivo (por encima de cero) y MS como prefijo de uno negativo (por debajo de cero, «menos») en cada nivel de previsión.", "src": "WMO49, Apéndice 5, Tabla A5-3", "note": ""}, {"n": 47, "stem": "¿Qué banda de niveles de vuelo cubre normalmente un mapa de tiempo significativo (SIGWX) de nivel alto, según las plantillas de mapas modelo de WMO-49?", "opts": ["Del FL450 al FL999", "De la superficie al FL100", "Del FL100 al FL250", "Del FL250 al FL630"], "ans": 3, "why": "El ejemplo Model SWH (mapa de tiempo significativo de nivel alto) del Apéndice 1 de WMO-49 está rotulado explícitamente «FL 250-630».", "src": "WMO49, Apéndice 1, Model SWH", "note": ""}, {"n": 48, "stem": "¿Qué banda de niveles de vuelo cubre un mapa de tiempo significativo (SIGWX) de nivel bajo?", "opts": ["Del FL250 al FL450", "De la superficie al FL450", "Del FL100 al FL250", "De la superficie al FL100"], "ans": 3, "why": "El Model SWL (mapa de tiempo significativo de nivel bajo) del Apéndice 1 de WMO-49 cubre «SIGWX SFC-10,000 FT», es decir, de la superficie al FL100.", "src": "WMO49, Apéndice 1, Model SWL", "note": ""}, {"n": 49, "stem": "¿Qué dos centros constituyen conjuntamente el sistema de Centros Mundiales de Pronóstico de Área (WAFC)?", "opts": ["Londres y Washington", "Fráncfort y Madrid", "Washington y Tokio", "Londres y París"], "ans": 0, "why": "La OACI designa dos WAFC: WAFC Londres y WAFC Washington; si uno interrumpe su actividad, el otro asume sus funciones (ya confirmado en OM03; los mapas modelo del Apéndice 1 de WMO-49 llevan explícitamente el rótulo «ISSUED BY WAFC», en formato de Londres/Washington).", "src": "WMO49, Apéndice 1 (encabezados de los mapas) / OM03", "note": ""}, {"n": 50, "stem": "Según OACI EUR Doc 013, ¿qué combinación de altura de decisión y de visibilidad/RVR define una aproximación de precisión CAT I estándar?", "opts": ["DH no inferior a 50 ft, con RVR no inferior a 175 m", "Sin DH, con cualquier RVR", "DH no inferior a 200 ft, con visibilidad no inferior a 800 m o RVR no inferior a 550 m", "DH no inferior a 100 ft, con RVR no inferior a 300 m"], "ans": 2, "why": "AWO, apartado sobre la clasificación de las aproximaciones por instrumentos: la CAT I exige una altura de decisión no inferior a 60 m (200 ft), con una visibilidad no inferior a 800 m o un RVR no inferior a 550 m.", "src": "AWO, clasificación de las operaciones de aproximación por instrumentos", "note": ""}, {"n": 51, "stem": "Según EUR Doc 013, ¿qué intervalo de altura de decisión y qué RVR mínimo definen una aproximación de precisión CAT II?", "opts": ["Sin DH, RVR no inferior a 50 m", "DH de 100 ft hasta (pero sin llegar a) 200 ft, RVR no inferior a 300 m", "DH de 200-250 ft, RVR de 550 m", "DH inferior a 50 ft, RVR no inferior a 175 m"], "ans": 1, "why": "AWO: la CAT II es una altura de decisión inferior a 60 m (200 ft) pero no inferior a 30 m (100 ft), con un RVR no inferior a 300 m.", "src": "AWO, clasificación de las operaciones de aproximación por instrumentos", "note": ""}, {"n": 52, "stem": "Según EUR Doc 013, ¿qué define la CAT IIIA?", "opts": ["DH no inferior a 60 m (200 ft), con RVR no inferior
