c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Plan de vuelo y gestión de afluencia (ATFCM)</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Plan de vuelo, mensajes ATS e IFPS (T06a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "En la casilla 9 del plan de vuelo OACI, ¿qué letra de categoría de estela turbulenta se reserva en exclusiva para el Airbus A380-800?", "opts": ["J", "H", "M", "S"], "ans": 0, "why": "J = SUPER se usa solo para el Airbus A380-800; H (pesada, HEAVY), M (media, MEDIUM) y L (ligera, LIGHT) son las categorías clásicas por peso, y «S» no es una letra de categoría de estela.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 2, "stem": "¿Cuál de estas es una de las tres formas permitidas de construir la casilla 7 (identificación de aeronave)?", "opts": ["Un código numérico aleatorio de 7 cifras asignado por el ATC", "El designador OACI del operador seguido del número de vuelo", "El código IATA de dos letras de la aerolínea, solo, sin número de vuelo", "El número de licencia del piloto"], "ans": 1, "why": "Las tres formas permitidas son: designador OACI del operador más número de vuelo; matrícula de la aeronave; o, para los vuelos militares domésticos, la matrícula o el indicativo radiotelefónico (R/T).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 3, "stem": "En la casilla 10 del plan de vuelo, ¿qué debe acompañar en la casilla 18 a la letra W (aprobación RVSM)?", "opts": ["El nombre del piloto bajo C/", "El código SELCAL bajo SEL/", "La matrícula de la aeronave bajo REG/", "Nada; W se basta por sí sola"], "ans": 2, "why": "Nota 5 del AIP: si se incluye la letra W (aprobación RVSM) en la casilla 10, hay que insertar en la casilla 18 la matrícula de la aeronave precedida de REG/.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 4, "stem": "Una aeronave de Estado que vuela en formación, con aprobación RVSM, pretende operar como GAT en espacio aéreo RVSM. ¿Qué debe hacer en el plan de vuelo?", "opts": ["Insertar W en la casilla 10 como de costumbre", "Insertar W en la casilla 10 y STS/ALTRV en la casilla 18", "No insertar nunca la casilla 10", "No insertar W en la casilla 10 e insertar STS/NONRVSM en la casilla 18"], "ans": 3, "why": "Las aeronaves de Estado en formación no deben insertar nunca W en la casilla 10, sea cual sea su situación real respecto al RVSM; si pretenden operar como GAT en espacio aéreo RVSM, insertan en su lugar STS/NONRVSM en la casilla 18 (AIP ENR 1.10, casilla 10 nota 5 y sección EUR RVSM).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 5, "stem": "En el bloque de vigilancia de la casilla 10, ¿cuál es el número máximo de caracteres permitido cuando se usan letras de equipo (no «N»)?", "opts": ["20", "16", "10", "24"], "ans": 0, "why": "El AIP permite hasta 20 caracteres para describir el equipo o las capacidades de vigilancia operativos; la «N» sola se usa únicamente cuando no hay ninguno.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 6, "stem": "¿Qué letra de vigilancia designa un transpondedor modo S con identificación de aeronave pero SIN capacidad de altitud de presión?", "opts": ["S", "I", "P", "X"], "ans": 1, "why": "I = modo S con identificación pero sin altitud; P es lo contrario (altitud, sin identificación); S tiene ambas; X no tiene ninguna.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 7, "stem": "¿Qué código PBN de la casilla 18 designa «RNP AR APCH con RF» y qué condición adicional lleva?", "opts": ["S1; ninguna condición adicional", "O1; requiere solo GNSS", "T1; requiere autorización especial", "B2; requiere DME/DME"], "ans": 2, "why": "T1 = RNP AR APCH con RF y requiere autorización especial (T2 es lo mismo sin RF, también con autorización).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 8, "stem": "¿Cuál es el número máximo de entradas PBN/ permitidas en la casilla 18?", "opts": ["4 entradas (8 caracteres)", "6 entradas (12 caracteres)", "10 entradas (20 caracteres)", "8 entradas (16 caracteres)"], "ans": 3, "why": "El AIP limita PBN/ a 8 entradas, es decir, a un máximo de 16 caracteres.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 9, "stem": "¿Qué indicador STS/ designa «una entidad militar asume la responsabilidad de la separación de aeronaves militares»?", "opts": ["MARSA", "MEDEVAC", "ATFMX", "FLTCK"], "ans": 0, "why": "MARSA se define exactamente así; MEDEVAC es una evacuación médica crítica para la vida, ATFMX es una exención ATFM y FLTCK es un vuelo de calibración de ayudas para la navegación.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 10, "stem": "En un plan de vuelo IFR/GAT que sale de un aeródromo español con SID publicada, ¿cuál de las siguientes prácticas está expresamente prohibida en la descripción de la ruta de la casilla 15?", "opts": ["Usar DCT antes de la primera ruta ATS", "Escribir el nombre de la SID o la palabra «SID»", "Incluir un subcampo de cambio de nivel", "Incluir una cláusula de ascenso en crucero"], "ans": 1, "why": "El AIP establece que la casilla de ruta no debe incluir nunca los términos SID/STAR ni sus descripciones, «por requisitos operativos del IFPS»; solo puede aparecer el primer punto significativo de la SID.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 11, "stem": "En la casilla 15, ¿en qué punto supone el IFPS que el tipo de tránsito de un plan de vuelo cambia de GAT a OAT?", "opts": ["En ninguno; el IFPS trata siempre todo el vuelo como GAT", "En el aeródromo de salida, por defecto", "En el punto marcado expresamente «punto/OAT» en la ruta", "Solo si la casilla 8 usa «Z»"], "ans": 2, "why": "El IFPS supone GAT en todo el vuelo salvo que se marque un cambio a OAT en un punto concreto de la casilla 15; a partir de ahí, cada tramo posterior se trata como OAT hasta que haya un cambio de vuelta a GAT.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 12, "stem": "¿Cuál es la longitud máxima de un subcampo de «cambio de velocidad o de nivel» en la casilla 15 (p. ej., «LN/N0284A045»)?", "opts": ["11 caracteres", "28 caracteres", "5 caracteres", "21 caracteres"], "ans": 3, "why": "El AIP fija un máximo de 21 caracteres para este subcampo, frente a los 28 del subcampo más largo de «ascenso en crucero».", "src": "AIP España ENR 1.10", "note": ""}, {"n": 13, "stem": "En los vuelos que operan fuera de las rutas ATS designadas, ¿a qué distancia entre sí deben insertarse normalmente los puntos significativos en la casilla 15?", "opts": ["A no más de 30 minutos de tiempo de vuelo o 370 km (200 NM)", "A no más de 10 minutos de tiempo de vuelo o 100 km", "A no más de 1 hora de tiempo de vuelo en todos los casos", "Exactamente cada 5 grados de latitud"], "ans": 0, "why": "La regla general del AIP para los vuelos fuera de ruta son puntos separados como máximo 30 minutos de tiempo de vuelo o 370 km (200 NM) (a las derrotas este-oeste entre 70N y 70S se les aplica otra regla, más fina).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 14, "stem": "¿Qué indicador se usa para dar el número, la capacidad total (en personas), la cubierta y el color de los botes neumáticos que se llevan, y en qué casilla del formulario de plan de vuelo aparece?", "opts": ["A/, en la casilla 18", "D/, en la casilla 19", "S/, en la casilla 19", "P/, en la casilla 18"], "ans": 1, "why": "Los datos de los botes neumáticos (número, capacidad, cubierta, color) se dan bajo D/ en la casilla 19, que nunca se transmite con el mensaje FPL.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 15, "stem": "En la casilla 19, ¿qué debe anotarse en «personas a bordo» si el número aún no se conoce al presentar el plan?", "opts": ["Dejarlo en blanco", "Insertar 0 (cero)", "Insertar TBN", "Insertar ZZZZ"], "ans": 2, "why": "TBN («por notificar», <em>to be notified</em>) es la anotación prescrita cuando no se conoce el número de personas a bordo en el momento de presentar el plan.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 16, "stem": "¿Qué clase de espacio aéreo indica expresamente el AIP que no se utiliza nunca para zonas de control?", "opts": ["Clase C", "Clase D", "Clase F", "Clase E"], "ans": 3, "why": "El AIP establece de forma expresa que «la clase E no se utilizará para zonas de control» («Class E shall not be used for control zones.»).", "src": "AIP España ENR 1.4", "note": ""}, {"n": 17, "stem": "En el espacio aéreo español, ¿qué clase se aplica a todo el espacio aéreo por encima del FL195, con independencia de la clase que se aplicaría en otro caso?", "opts": ["Clase C", "Clase A", "Clase E", "Clase G"], "ans": 0, "why": "El AIP establece que el espacio aéreo por encima del FL195 se clasifica como espacio aéreo de clase C, como excepción nacional.", "src": "AIP España ENR 1.4", "note": ""}, {"n": 18, "stem": "¿En cuál de estas clases de espacio aéreo NO se requiere en absoluto autorización ATC?", "opts": ["Clase D", "Clases F y G", "Clase E (para IFR)", "Clase B"], "ans": 1, "why": "Las clases F y G no requieren autorización ATC (la F ofrece solo servicio de asesoramiento; la G ofrece servicio de información de vuelo previa solicitud); todas las demás clases enumeradas requieren autorización al menos para parte del tráfico.", "src": "AIP España ENR 1.4", "note": ""}, {"n": 19, "stem": "¿Entre qué niveles de vuelo se aplica en España la separación vertical RVSM de 300 m (1000 ft)?", "opts": ["FL100 a FL290", "FL195 a FL410", "FL290 a FL410, ambos inclusive", "FL245 a FL460"], "ans": 2, "why": "El RVSM se aplica entre el FL290 y el FL410, ambos inclusive, según la tabla de niveles de crucero del AIP.", "src": "AIP España ENR 1.7", "note": ""}, {"n": 20, "stem": "¿Cuántas letras componen una dirección AFTN completa?", "opts": ["4", "6", "7", "8"], "ans": 3, "why": "Una dirección AFTN tiene exactamente 8 letras: un indicador de lugar OACI de 4 letras, un designador de organización de 3 letras y 1 letra adicional de departamento.", "src": "SKYbrary/AFTN", "note": ""}, {"n": 21, "stem": "Al descodificar la dirección AFTN EBLGZTZX, ¿qué representa «ZTZ»?", "opts": ["La organización: la torre de control del aeródromo", "La matrícula de la aeronave", "La letra de departamento", "Un designador militar sin código asignado"], "ans": 0, "why": "EBLG es el lugar (Lieja), ZTZ es el designador de organización de 3 letras de la torre de control de aeródromo, y X es la letra de departamento, que significa que no hace falta una identificación específica.", "src": "SKYbrary/AFTN", "note": ""}, {"n": 22, "stem": "¿Qué sustituye al designador de organización de 3 letras en una dirección AFTN cuando el destinatario es una aeronave en vuelo?", "opts": ["YYY", "ZZZ", "YXY", "XXX"], "ans": 1, "why": "ZZZ se usa cuando el destinatario es una aeronave en vuelo; YYY se usa para una organización civil sin código asignado en el Doc 8585, y YXY para una militar que no lo tiene.", "src": "SKYbrary/AFTN", "note": ""}, {"n": 23, "stem": "¿Qué categoría AFTN se define como los mensajes «originados para obtener información o verificación sobre otros mensajes que parecen haberse transmitido de forma incorrecta»?", "opts": ["Mensajes de regularidad de vuelo", "Mensajes aeronáuticos administrativos", "Mensajes de servicio", "Mensajes de los servicios de información aeronáutica (AIS)"], "ans": 2, "why": "Esta es la definición de los «mensajes de servicio», una categoría AFTN distinta de los mensajes de regularidad de vuelo, los administrativos y los AIS, aunque varios de ellos compartan la prioridad GG o KK.", "src": "SKYbrary/AFTN", "note": ""}, {"n": 24, "stem": "¿Qué es el AMHS?", "opts": ["Un algoritmo de asignación de slots que utiliza CASA", "Un sinónimo de la tabla de prioridades AFTN", "La base de datos interna de validación del IFPS (ENV)", "El sistema basado en X.400 que sustituye progresivamente a la AFTN para el intercambio de mensajes ATS"], "ans": 3, "why": "El AMHS (<em>ATS Message Handling System</em>, sistema de tratamiento de mensajes ATS) es el sucesor de la AFTN basado en X.400 y interopera con ella mediante pasarelas durante la transición.", "src": "IFPS UM context", "note": ""}, {"n": 25, "stem": "¿Cuál es la antelación mínima necesaria para que un mensaje CPL llegue a una dependencia ATS antes de la hora estimada a la que la aeronave alcanzará el punto de transferencia o de frontera?", "opts": ["20 minutos", "10 minutos", "5 minutos", "30 minutos"], "ans": 0, "why": "Los PANS-ATM de la OACI exigen al menos 20 minutos de antelación tanto para los mensajes CPL como para los EST, salvo que se haya acordado otro período (mayor si la dependencia receptora no dispone de tratamiento automático).", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 Ch.11 text)", "note": ""}, {"n": 26, "stem": "¿Entre qué dos partes puede intercambiarse un mensaje LAM (acuse de recibo lógico)?", "opts": ["Piloto y controlador ATC", "Solo dos ordenadores ATC", "Operador de aeronaves y NMOC", "FMP y Jefe de Sala"], "ans": 1, "why": "El LAM se usa únicamente entre ordenadores ATC; si no se recibe dentro del parámetro de tiempo de reacción del centro transferidor, las dependencias vuelven a la coordinación telefónica y manual.", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 Ch.11 text)", "note": ""}, {"n": 27, "stem": "¿Qué cierra un diálogo de coordinación repetido después de enviar un mensaje CDN (coordinación)?", "opts": ["Un tiempo de espera automático", "Un segundo CDN de la misma dependencia", "Un mensaje ACP (aceptación)", "Un mensaje RQP"], "ans": 2, "why": "El diálogo se repite (intercambios de CDN) hasta que una de las dos dependencias interesadas lo completa con la transmisión de un mensaje ACP.", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 Ch.11 text)", "note": ""}, {"n": 28, "stem": "Según el AIP España, ¿a cuántas direcciones debe enviar una dependencia ATS un RQP para solicitar un plan de vuelo IFR/GAT?", "opts": ["A una, la ARO de salida", "Solo al NMOC", "A la TWR de destino", "A las dos direcciones del IFPS"], "ans": 3, "why": "El AIP establece que el RQP «debería transmitirse a las dos direcciones del IFPS» («should be transmitted to both IFPS addresses»).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 29, "stem": "¿Qué indicación añade el IFPS a la casilla 18 cuando devuelve un plan de vuelo en respuesta a un RQP?", "opts": ["SRC/RQP", "RFP/Q1", "STS/RQP", "RMK/RQP-REPLY"], "ans": 0, "why": "El AIP da el ejemplo: el IFPS devuelve el FPL solicitado con la indicación «SRC/RQP» insertada en la casilla 18.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 30, "stem": "Si una aeronave sufre un fallo de radiocomunicaciones y la siguiente dependencia ATS a lo largo de su ruta AÚN NO ha recibido los datos básicos del plan de vuelo, ¿qué dos mensajes se envían juntos a esa dependencia?", "opts": ["DLA y CHG", "RCF y CPL", "ALR y RQS", "SPL y ACP"], "ans": 1, "why": "En ese caso concreto, se transmiten juntos a la siguiente dependencia un mensaje RCF y un mensaje de plan de vuelo actualizado (CPL), y esa dependencia repite el proceso hacia delante.", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 Ch.11 text)", "note": ""}, {"n": 31, "stem": "¿Qué relación hay entre AIDC y OLDI?", "opts": ["AIDC es el conjunto regional europeo; OLDI es la norma global de la OACI", "No guardan relación; son normas rivales", "AIDC es la norma global de la OACI; OLDI es su implantación regional europea", "AIDC sustituyó a OLDI en 2020"], "ans": 2, "why": "AIDC (<em>ATS Interfacility Data Communications</em>, comunicaciones de datos entre instalaciones ATS) es la norma de alcance OACI; OLDI es la implantación regional europea de EUROCONTROL del mismo concepto.", "src": "EASA PANS-ATM Checklist / base notes cross-reference", "note": ""}, {"n": 32, "stem": "¿Para qué sirve un mensaje «Notify» en el conjunto de mensajes AIDC?", "opts": ["Para cerrar formalmente el diálogo de coordinación", "Para solicitar datos suplementarios del plan de vuelo", "Para confirmar la asunción del control", "Para avisar con antelación, antes de la coordinación formal, a las dependencias que tendrán que coordinar el vuelo"], "ans": 3, "why": "Un mensaje Notify se envía por adelantado, a la hora o distancia acordada antes del límite común, a las dependencias para las que se requerirá coordinación, con los datos de estimación en el límite.", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 §11.4.2.5)", "note": ""}, {"n": 33, "stem": "¿Garantiza un ACK ORM del IFPS que un plan de vuelo cumple los requisitos de autorización diplomática o de ETOPS?", "opts": ["No; eso sigue siendo responsabilidad del propio originador del mensaje", "Sí, siempre", "Solo para los vuelos dentro de la IFPZ", "Solo si se incluyó REG/ en la casilla 18"], "ans": 0, "why": "El IFPS UM establece de forma explícita que un procesamiento ACK satisfactorio no asegura el cumplimiento de las autorizaciones diplomáticas ni de los requisitos ETOPS, SAFA o MNPS, que el originador del mensaje debe considerar por separado.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 34, "stem": "¿Qué debe hacer el originador de un mensaje al recibir un MAN ORM?", "opts": ["Reenviar de inmediato un mensaje corregido", "Nada; esperar un ACK o un REJ antes de enviar cualquier otra cosa para ese vuelo", "Contactar por teléfono con el NMOC en un plazo de 5 minutos", "Presentar un CNL para el vuelo"], "ans": 1, "why": "No se requiere ninguna acción al recibir un MAN ORM; el originador no debe enviar ningún otro mensaje relativo a ese vuelo hasta que llegue un ACK o un REJ.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 35, "stem": "¿Cuál es el número máximo de entradas de error que puede contener un REJ ORM?", "opts": ["3", "5", "10", "Ilimitado"], "ans": 2, "why": "Cada REJ ORM contiene una lista de errores de hasta 10 entradas como máximo, con la naturaleza del error y el campo o campos erróneos.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 36, "stem": "Si el IFPS rechaza (REJ) un plan de vuelo porque ya se aceptó un plan idéntico procedente de otra fuente, ¿qué se adjunta al REJ?", "opts": ["No se adjunta nada", "Una copia del plan de vuelo rechazado (el nuevo)", "El extracto de la base de datos ENV", "Una copia del plan de vuelo existente (el ya aceptado)"], "ans": 3, "why": "En ese caso se adjunta al REJ ORM una copia del plan de vuelo existente, no del rechazado.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 37, "stem": "¿Cuál es la antelación máxima respecto a la EOBT con la que el IFPS aceptará un plan de vuelo presentado, como límite estricto del sistema?", "opts": ["120 horas", "96 horas", "72 horas", "168 horas"], "ans": 0, "why": "El IFPS no aceptará ningún plan de vuelo presentado con más de 120 horas (5 días) de antelación a la EOBT; es la misma cifra que la regla del manual de «no más de 120 horas», pero aquí confirmada como el umbral estricto de rechazo del propio sistema IFPS.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 38, "stem": "¿A partir de cuántas horas de antelación a la EOBT exige el IFPS la fecha del vuelo (DOF) en el mensaje?", "opts": ["12 horas", "24 horas", "48 horas", "72 horas"], "ans": 1, "why": "Se requiere la fecha del vuelo en cualquier mensaje en el que la EOBT esté a más de 24 horas del momento del procesamiento.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 39, "stem": "Un operador quiere adelantar la EOBT de un vuelo a una hora ANTERIOR a la presentada originalmente. ¿Qué debe hacerse?", "opts": ["Enviar un CHG con la nueva EOBT", "Enviar un DLA", "Cancelar el plan de vuelo y volver a presentarlo con la nueva EOBT, más temprana", "Nada; el IFPS lo actualiza automáticamente"], "ans": 2, "why": "El IFPS no acepta nunca una «demora negativa»; adelantar la EOBT exige siempre cancelar el plan existente y presentar uno nuevo.", "src": "IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 40, "stem": "Según el AIP España ENR 1.10, ¿cuál de los siguientes es uno de los CINCO campos que un mensaje CHG no puede modificar (una lista más larga que los tres del manual)?", "opts": ["El nivel de crucero", "La ruta", "El código SELCAL", "La fecha estimada de fuera calzos"], "ans": 3, "why": "La lista operativa del AIP de campos no modificables añade la fecha estimada de fuera calzos y un adelanto de la EOBT a los tres del manual (identificación de la aeronave, aeródromo de salida y aeródromo de destino).", "src": "AIP España ENR 1.10", "note": ""}, {"n": 41, "stem": "Según el texto de referencia de la OACI en la lista de comprobación PANS-ATM (Doc 4444, cap. 11), ¿a partir de cuántos minutos de demora, sin distinción por reglas de vuelo, debe enviarse un mensaje DLA?", "opts": ["Más de 30 minutos", "Más de 15 minutos", "Más de 45 minutos", "Más de 60 minutos"], "ans": 0, "why": "La regla de referencia de la OACI es un simple «más de 30 minutos después de la EOBT», sin distinguir entre IFR y VFR; los umbrales más finos de 15/30/60 minutos del AIP España precisan esta referencia para España.", "src": "EASA PANS-ATM Checklist (ICAO Doc 4444 Ch.11 text)", "note": ""}, {"n": 42, "stem": "En un plan de vuelo repetitivo (RPL), ¿qué casilla con letra es la análoga a la casilla 10 (equipo) de un FPL individual y qué deben indicar en ella los vuelos RPL con aprobación RVSM?", "opts": ["Casilla A; la identificación de la aeronave", "Casilla Q; la situación de aprobación RVSM", "Casilla C; el nivel de crucero", "Casilla P; el número de personas a bordo"], "ans": 1, "why": "El AIP España establece que los vuelos con aprobación RVSM deben incluir su situación RVSM en la «casilla Q» del RPL, análoga a la casilla 10 del FPL individual.", "src": "AIP España ENR 1.10", "note": ""}, {"n": 43, "stem": "¿Qué es un GUFI y en qué se diferencia del ARCID (casilla 7)?", "opts": ["Es lo mismo que el ARCID, con otro nombre", "Solo se usa en vuelos VFR", "Es un identificador de vuelo inmutable y único a escala mundial, distinto del ARCID, asignado por el operador", "Sustituye a la categoría de estela turbulenta"], "ans": 2, "why": "El GUFI (<em>Globally Unique Flight Identifier</em>, identificador de vuelo único a escala mundial) es un elemento de datos separado e inmutable que el operador asigna a un vuelo FF-ICE, distinto del ARCID, que puede cambiar.", "src": "AIP España ENR 1.10 (FF-ICE section)", "note": ""}, {"n": 44, "stem": "¿Qué organismo está designado como unidad de servicios FF-ICE para la zona IFPS (IFPZ)?", "opts": ["AESA", "La Dirección de Operaciones de ENAIRE", "Cada AMC nacional por separado", "El Gestor de Red (NM) de EUROCONTROL"], "ans": 3, "why": "El AIP nombra al Gestor de Red de EUROCONTROL como unidad de servicios FF-ICE designada para la IFPZ, que presta por B2B los servicios de presentación, prueba, solicitud de datos de vuelo, notificación y publicación.", "src": "AIP España ENR 1.10 (FF-ICE section)", "note": ""}, {"n": 45, "stem": "Como muy pronto, ¿con cuánta antelación a la última EOBT recibida puede enviarse un SAM (mensaje de asignación de slot) cuando un vuelo pasa a estar regulado?", "opts": ["2 horas", "1 hora", "30 minutos", "3 horas"], "ans": 0, "why": "Un SAM se envía en cualquier momento en que un vuelo pasa a estar regulado, pero como muy pronto 2 horas antes de la última EOBT recibida.", "src": "EUROCONTROL ATFCM Users Manual, Wave 2.3", "note": ""}, {"n": 46, "stem": "¿A partir de qué magnitud de cambio del CTOT (no debido al propio vuelo, p. ej., una nueva restricción) envía el NM un SRM?", "opts": ["Más de 1 minuto", "Más de 5 minutos", "Más de 15 minutos", "Más de 30 minutos"], "ans": 1, "why": "Se envía un SRM para notificar un cambio significativo, superior a 5 minutos, respecto al CTOT original (o un cambio en la regulación más penalizadora, o ambos).", "src": "EUROCONTROL ATFCM Users Manual, Wave 2.3", "note": ""}, {"n": 47, "stem": "En un mensaje de slot, ¿qué representa la PRIMERA regulación que figura en el campo --REGUL cuando hay varias?", "opts": ["La regulación menos penalizadora", "Una lista en orden aleatorio", "La regulación más penalizadora (la que más contribuye a la demora)", "Siempre la regulación de la fase estratégica"], "ans": 2, "why": "Puede haber varios campos --REGUL; el primero es siempre el más penalizador, es decir, el que más contribuye a la demora.", "src": "EUROCONTROL ATFCM Users Manual, Wave 2.3", "note": ""}, {"n": 48, "stem": "¿Entre qué dos horas de referencia puede ponerse un vuelo en estado «REA» (Ready, listo)?", "opts": ["EOBT-2 h y EOBT", "CTOT y CTOT+10 min", "EOBT-4 h y EOBT-30 min", "EOBT-15 min y el CTOT"], "ans": 3, "why": "El REA puede enviarse entre la EOBT menos 15 minutos y el CTOT.", "src": "EUROCONTROL ATFCM Users Manual, Wave 2.3", "note": ""}, {"n": 49, "stem": "¿Cuántos hitos numerados componen el proceso A-CDM?", "opts": ["16", "12", "10", "20"], "ans": 0, "why": "La especificación A-CDM de EUROCONTROL define 16 hitos numerados, desde el hito 1 (plan de vuelo ATC activado) hasta el hito 16 (despegue).", "src": "EUROCONTROL Specification for A-CDM, 2025-01", "note": ""}, {"n": 50, "stem": "¿Cuál es la diferencia esencial entre un mensaje T-DPI-t y uno T-DPI-s?", "opts": ["El T-DPI-t lo envía el AO y el T-DPI-s, el ATC", "El T-DPI-t notifica la hora objetivo de despegue basada en la TOBT; el T-DPI-s la notifica basada en la TSAT", "El T-DPI-t cancela un DPI anterior; el T-DPI-s lo confirma", "Son idénticos, solo que se envían en momentos distintos"], "ans": 1, "why": "El T-DPI-t («target», objetivo) se basa en la TOBT del operador; el T-DPI-s («sequenced», secuenciado) se basa en la TSAT del secuenciador, una estimación posterior y más afinada.", "src": "EUROCONTROL Specification for A-CDM / DPI Implementation Guide", "note": ""}, {"n": 51, "stem": "¿Qué tipo de mensaje DPI se usa para cancelar un DPI enviado anteriormente?", "opts": ["E-DPI", "A-DPI", "C-DPI", "X-DPI"], "ans": 2, "why": "El C-DPI (<em>Cancel</em>) cancela un DPI anterior; el E- es <em>Early</em>, el A- es ATC (confirmación de la salida real) y el X- no es uno de los tipos de DPI definidos en esta biblioteca.", "src": "DPI Implementation Guide", "note": ""}, {"n": 52, "stem": "¿Qué dice realmente el Doc 7030 de la OACI (EUR SUPPs), el documento original que creó el procedimiento RFP, sobre dónde debe ir «RFP/Qn» en la casilla 18?", "opts": ["«Como primer elemento»", "«Como último elemento»", "«En la casilla 15, no en la 18»", "Solo «en la casilla 18», sin especificar posición"], "ans": 3, "why": "La fuente primaria del procedimiento especifica únicamente que RFP/Qn va «en la casilla 18», sin indicar una posición; «primero» y «último» son añadidos posteriores que figuran en otros documentos, no en el propio Doc 7030.", "src": "ICAO Doc 7030 EUR SUPPs, Ed.5 Amdt 9", "note": ""}, {"n": 53, "stem": "Dentro del propio Manual del usuario del IFPS, ¿dónde hay una incoherencia interna sobre la posición de «RFP/Qn»?", "opts": ["Entre un párrafo resumen de procedimientos generales («primer elemento») y su propia sección específica sobre el RFP (sin posición indicada)", "Entre dos ediciones distintas del manual", "No hay incoherencia; el IFPS UM es plenamente coherente", "Entre las versiones inglesa y francesa del manual"], "ans": 0, "why": "El resumen general del IFPS UM (página 12) dice «como primer elemento de la casilla 18», mientras que su propia sección específica 96 «Replacement Flight Plan (RFP)» da la regla de RFP/Qn sin especificar ninguna posición.", "src": "EUROCONTROL IFPS Users Manual, Wave 2.3", "note": ""}, {"n": 54, "stem": "¿Qué indicador de prioridad lleva el mensaje CNL cuando inicia un procedimiento de plan de vuelo que reemplaza (RFP)?", "opts": ["FF, igual que un FPL ordinario", "DD", "GG", "SS"], "ans": 1, "why": "La cancelación que abre el procedimiento RFP se envía con prioridad DD (urgencia), a diferencia de la prioridad FF que se usa normalmente en los mensajes de movimiento de planes de vuelo ordinarios.", "src": "AIP España ENR 1.10 / IFPS Users Manual", "note": ""}, {"n": 55, "stem": "¿Cuál es el número máximo de aeródromos de alternativa de destino que pueden anotarse en la casilla 16?", "opts": ["Uno", "Tres", "Dos", "No hay límite"], "ans": 2, "why": "El AIP permite los indicadores OACI de 4 letras de no más de dos aeródromos de alternativa de destino, separados por un espacio.", "src": "AIP España ENR 1.10", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/06-plan-vuelo-atfcm/ampliacion/T06a-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

function render(){
  const box=$('#qs');box.innerHTML='';let done=0,right=0;
  Q.forEach((q,i)=>{const r=st[q.n];if(r){done++;if(r.ok)right++}});
  $('#score').textContent=`${right} ${U.score} ${done} ${U.answered} · ${Q.length} ${U.questions}`+(done?` · ${Math.round(100*right/done)}%`:'');
  order.forEach(i=>{
    const q=Q[i],r=st[q.n];if(hideDone&&r)return;
    const d=document.createElement('section');d.className='q';d.id='q'+q.n;d.tabIndex=-1;
    const idx=(r&&r.idx)?r.idx:(shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3]);
    d.innerHTML=`<div class="qn">Q${q.n}</div><div class="stem">${q.stem}</div>`;
    idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
</script><script src="../../../assets/search.js" defer></script><script src="../../../assets/config.js"></script><script src="../../../assets/account.js" defer></script><script src="../../../assets/progress.js" defer></script></body></html>
