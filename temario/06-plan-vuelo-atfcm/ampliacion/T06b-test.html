:root{color-scheme:light dark;

  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;

  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;

  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}

details.side li a svg.i{color:var(--mut)}

details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

 id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Plan de vuelo y gestión de afluencia (ATFCM)</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: ATFCM, Gestor de Red, FUA y capacidad (T06b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "En el proceso de asignación de slots de CASA, presentar el plan de vuelo constituye en la práctica:", "opts": ["Una solicitud de slot, ya que CASA funciona en modo pasivo desde el punto de vista del AO", "Una solicitud al coordinador de slots del aeropuerto", "Una exención automática de la ATFCM", "Un compromiso vinculante de CTOT"], "ans": 0, "why": "El ATFCM Operations Manual establece que CASA es en gran medida automático y, desde el punto de vista del AO, funciona en modo pasivo: presentar el FPL es la solicitud de slot. B) lo confunde con los slots aeroportuarios; C y D no tienen respaldo.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, Annex C, 14.1", "note": ""}, {"n": 2, "stem": "¿Qué busca minimizar principalmente el algoritmo de priorización de CASA?", "opts": ["El número de rechazos de planes de vuelo", "La demora global (en toda la red)", "El número de regulaciones activadas por día", "La demora propia de cada vuelo individual"], "ans": 1, "why": "El manual establece que el algoritmo «aims at minimizing the global delay» (busca minimizar la demora global), es decir, la de toda la red, no la equidad vuelo a vuelo.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.1", "note": ""}, {"n": 3, "stem": "Un subperíodo de regulación dura 4 horas con un rate básico de 28 vuelos/hora. ¿Cuántos slots contiene la lista de slots resultante y con qué separación aproximada?", "opts": ["28 slots, con unos 8 minutos de separación", "4 slots, con unos 60 minutos de separación", "112 slots, con unos 2 minutos de separación", "224 slots, con aproximadamente 1 minuto de separación"], "ans": 2, "why": "4 x 28 = 112 slots; 60/28 es aproximadamente 2 minutos. Es el ejemplo resuelto del propio manual.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.1", "note": ""}, {"n": 4, "stem": "¿Qué vuelos se benefician del «pending rate» (rate pendiente) de una regulación?", "opts": ["Los vuelos que presentaron su plan de vuelo tarde", "Solo los vuelos exentos", "Los vuelos sujetos a un escenario de level capping", "Los vuelos modificados tras la emisión del SAM (mediante FCM, DLA o CHG)"], "ans": 3, "why": "El pending rate se reserva para los vuelos modificados tras la emisión del SAM; los que presentan el plan tarde quedan excluidos expresamente de la asignación de slots pendientes.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.2", "note": ""}, {"n": 5, "stem": "¿A partir de qué rate global de regulación se aplica la regla por defecto de pending rate del «5 % del rate total»?", "opts": ["Rate mayor o igual que 20 vuelos/hora", "Cualquier rate superior a 5 vuelos/hora", "Solo rates entre 30 y 49 vuelos/hora", "Solo durante la fase estratégica"], "ans": 0, "why": "La regla del 5 % por defecto se aplica «when the rate is greater or equal to 20 per hour regardless of the regulation duration» (cuando el rate es mayor o igual que 20 por hora, con independencia de la duración de la regulación); por debajo de ese valor se usa en su lugar una tabla de conversión fija.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.2", "note": ""}, {"n": 6, "stem": "Según la tabla de conversión estándar, ¿cuántos slots pendientes corresponden a un rate global de regulación de 50-69 vuelos/hora?", "opts": ["1", "5", "3", "2"], "ans": 2, "why": "La tabla da 3 slots pendientes (47-66 normales) para la banda de 50-69.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.2", "note": ""}, {"n": 7, "stem": "¿Cuándo se convierten los slots pendientes en slots normales?", "opts": ["En el SIT1 (EOBT-2 h)", "Cuando la regulación se rectifica en profundidad (<em>deep rectified</em>)", "2 horas y 15 minutos antes de la Slot Reference Time", "Solo en el proceso de revisión real (<em>true revision process</em>)"], "ans": 2, "why": "El manual establece que los slots pendientes se convierten en slots normales 2 h 15 antes de la Slot Reference Time (hora de referencia del slot).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.2", "note": ""}, {"n": 8, "stem": "El proceso de modificación de slots, que se activa cuando CASA recibe la cancelación de un vuelo, se aplica a:", "opts": ["Todos los vuelos de la regulación, con independencia de su estado", "Solo los vuelos que ya tienen un slot asignado", "Solo los vuelos exentos", "Solo los vuelos preasignados (aún no asignados de forma definitiva)"], "ans": 3, "why": "El proceso reasigna los slots liberados y «applies only to pre-allocated flights» (se aplica solo a los vuelos preasignados), por lo que la cancelación temprana es beneficiosa.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.3", "note": ""}, {"n": 9, "stem": "¿Qué Window Width (ancho de ventana) se aplica a una regulación con un rate de 30 vuelos/hora o más?", "opts": ["30 minutos", "18 minutos", "10 minutos", "6 minutos"], "ans": 3, "why": "La tabla de Window Width da 6 minutos para rates de 30/h o más (la ventana más estrecha, en la banda de rate más alta).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.5", "note": ""}, {"n": 10, "stem": "¿Qué efecto tiene un Window Width menor sobre el patrón de demoras que se produce?", "opts": ["Elimina las demoras por completo", "Reparte pequeñas demoras entre más vuelos y suaviza los picos de ocupación", "Solo afecta a los vuelos que ya tienen slot asignado", "Crea menos demoras, pero mayores, concentradas en menos vuelos"], "ans": 1, "why": "El manual explica que un Window Width menor reparte entre más vuelos pequeñas demoras y ayuda a suavizar los picos de ocupación, frente a la alternativa de reducir el rate (que crea demoras mayores).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.5", "note": ""}, {"n": 11, "stem": "En el mecanismo del Delay Confirmation Threshold (umbral de confirmación de demora), ¿qué mensaje y qué campo horario se envían a un vuelo cuya demora calculada supera el umbral configurado?", "opts": ["Un SAM con un CTOT, en el SIT1", "Un DLA que solicita confirmación", "Un FLS con un PTOT (Provisional Take-Off Time, hora provisional de despegue), en el SIT1", "Un SRM con un nuevo CTOT"], "ans": 2, "why": "Los vuelos por encima del umbral reciben en el SIT1 (EOBT-2 h) un nuevo tipo de FLS que lleva la demora como PTOT, y no antes de esa hora.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.6", "note": ""}, {"n": 12, "stem": "¿Cuánto dura el plazo de «respuesta antes de» (RESPBY) para que un AO confirme un vuelo que supera el Delay Confirmation Threshold?", "opts": ["5 minutos", "10 minutos", "60 minutos", "20 minutos"], "ans": 3, "why": "El plazo RESPBY es de 20 minutos; si el AO confirma mediante FCM dentro de él, el PTOT pasa a ser el CTOT.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 14.2.6", "note": ""}, {"n": 13, "stem": "¿Cuál es la finalidad del parámetro TRS (Time to Remove from the Sequence, tiempo para retirar de la secuencia)?", "opts": ["Especificar el punto antes del cual el CTOT ya no puede modificarse, una vez que el vuelo está en la secuencia de salida", "Evitar que una mejora del CTOT llegue demasiado tarde para que el aeródromo pueda aprovecharla", "Calcular automáticamente el tiempo de rodaje de salida", "Fijar el Window Width de una pista determinada"], "ans": 0, "why": "El TRS especifica el tiempo antes del cual el CTOT ya no se modificará (CTOT - tiempo de rodaje - TRS); B) describe en cambio el TIS.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, taxi-time section", "note": ""}, {"n": 14, "stem": "¿Qué mensaje DPI se envía una vez emitida la TSAT, para confirmar al NM la posición del vuelo en la secuencia de presalida?", "opts": ["E-DPI", "T-DPI-s", "T-DPI-t", "A-DPI"], "ans": 1, "why": "El T-DPI-s (Target DPI - sequenced) se emite tras la emisión de la TSAT para los vuelos no regulados.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 10", "note": ""}, {"n": 15, "stem": "¿Qué mensaje DPI se genera normalmente cuando el número de actualizaciones de la TOBT posteriores a la emisión de la TSAT supera un máximo definido localmente?", "opts": ["T-DPI-t", "E-DPI", "A-DPI", "C-DPI"], "ans": 3, "why": "Superar el número máximo de actualizaciones de la TOBT (p. ej., 3) genera un C-DPI (DPI de cancelación) y una alerta, y descarta los datos T-DPI anteriores.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 10", "note": ""}, {"n": 16, "stem": "¿Qué desencadena el primer mensaje E-DPI en el proceso A-CDM?", "opts": ["El despegue real de la aeronave", "La confirmación de la TOBT antes de la emisión de la TSAT", "Que la aeronave llegue a la aproximación final", "Una comprobación de coherencia satisfactoria entre el plan de vuelo ATC, el slot aeroportuario y los datos de vuelo del aeropuerto (hito 1)"], "ans": 3, "why": "El hito 1 comprueba esta coherencia; si se superan todas las comprobaciones, se genera un E-DPI; si no, se envía en su lugar una alerta al AO/GH.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 1", "note": ""}, {"n": 17, "stem": "Como muy pronto, ¿cuándo puede activarse el hito 1 del A-CDM (plan de vuelo ATC activado)?", "opts": ["EOBT menos 3 horas", "EOBT menos 5 días", "EOBT menos 2 horas", "En el momento de la salida real de calzos"], "ans": 0, "why": "La activación del plan de vuelo ATC para este hito se produce, como muy pronto, en la EOBT-3 h.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 1", "note": ""}, {"n": 18, "stem": "¿Puede producirse el hito 3 del A-CDM (despegue desde la estación de origen) antes del hito 2 (EOBT-2 h)?", "opts": ["No, los hitos deben producirse siempre en estricto orden numérico", "Sí, si el vuelo entrante sale de su estación de origen antes de la EOBT-2 h", "Solo si el vuelo está exento de la ATFCM", "Solo para aeronaves en rotación con una TOBT manual ya fijada"], "ans": 1, "why": "El manual señala de forma expresa que el hito 3 puede preceder al hito 2 en un vuelo cuyo tramo entrante sale temprano.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 2 remarks", "note": ""}, {"n": 19, "stem": "¿Qué fórmula da la TTOT calculada automáticamente antes de que haya una TOBT manual?", "opts": ["TTOT = TOBT + EXOT", "TTOT = EOBT + EXOT", "TTOT = EIBT + MTTT + EXOT", "TTOT = ELDT + EXIT"], "ans": 2, "why": "La estimación automática combina la estimación de llegada del vuelo entrante (EIBT), el tiempo mínimo de rotación (MTTT) y el tiempo de rodaje de salida (EXOT).", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 2", "note": ""}, {"n": 20, "stem": "Una vez introducida una TOBT manual, ¿cómo se recalcula la TTOT?", "opts": ["La TTOT es el promedio entre la TOBT manual y la estimación automática", "La TTOT permanece fija en su valor calculado automáticamente", "TTOT = TOBT sola, sin EXOT", "TTOT = TOBT + EXOT, que prevalece sobre la estimación automática"], "ans": 3, "why": "Una TOBT manual anula la estimación EIBT+MTTT+EXOT; la nueva TTOT es TOBT+EXOT, que puede ser posterior, y no solo anterior, al valor calculado automáticamente.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 2", "note": ""}, {"n": 21, "stem": "¿Cómo trata el NM la TTOT en relación con el CTOT que pueda emitir?", "opts": ["Como una hora «no slot antes de»: el CTOT no se emitirá antes de la TTOT", "Como un límite superior: el CTOT no puede ser posterior a la TTOT", "La TTOT no guarda relación con el CTOT", "La TTOT sustituye por completo al CTOT una vez implantado el A-CDM"], "ans": 0, "why": "El manual establece que las operaciones de Network Management toman la TTOT como una hora «No slot before» (no slot antes de).", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, Milestone 10", "note": ""}, {"n": 22, "stem": "¿Qué umbral, si se supera, genera una alerta CDM08 en la comprobación de discrepancia EOBT/TOBT?", "opts": ["Una TOBT que difiere de la EOBT en 5 minutos o más", "Una TOBT confirmada fuera de la ventana de tolerancia de la EOBT de EOBT más o menos 15 minutos", "Una TOBT anterior a la EOBT en cualquier cuantía", "Una TTOT que difiere de la EOBT en 30 minutos"], "ans": 1, "why": "La CDM08 (alerta de cumplimiento de la EOBT) se envía al AO/GH cuando la TOBT confirmada queda fuera de la ventana de EOBT más/menos 15 minutos (una TOBT posterior a EOBT+15 es el caso que describen expresamente las comprobaciones del hito); entonces hace falta actualizar de inmediato la EOBT del plan de vuelo ATC.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0, discrepancy checks", "note": ""}, {"n": 23, "stem": "¿Quién puede pasar a ser la «TOBT Responsible Person» (persona responsable de la TOBT) si las circunstancias de la rotación afectan a la TOBT del vuelo?", "opts": ["El Gestor de Red", "La FMP", "El agente de asistencia en tierra (<em>Ground Handler</em>)", "La torre de control de salida"], "ans": 2, "why": "Si las circunstancias de la rotación afectan a la TOBT, el agente de asistencia en tierra puede actualizarla y pasar a ser la persona responsable de la TOBT, con la información más reciente.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0", "note": ""}, {"n": 24, "stem": "¿Cuántos hitos estructuran el proceso A-CDM?", "opts": ["10", "12", "20", "16"], "ans": 3, "why": "El A-CDM Implementation Manual define 16 hitos secuenciales, desde el plan de vuelo ATC activado hasta el despegue.", "src": "EUROCONTROL A-CDM Implementation Manual v5.0", "note": ""}, {"n": 25, "stem": "¿Qué reglamento de la UE creó las normas detalladas vigentes para las funciones del Gestor de Red, aplicables desde 2020?", "opts": ["Reglamento de Ejecución (UE) 2019/123 de la Comisión", "Reglamento (UE) n.º 677/2011", "Reglamento (CEE) n.º 95/93", "Reglamento (UE) 2017/373"], "ans": 0, "why": "El Reglamento 2019/123, Reglamento de funciones de red, derogó el Reglamento 677/2011 y se aplica desde 2020.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 1", "note": ""}, {"n": 26, "stem": "¿Cuál de los siguientes se nombra expresamente en el artículo 1, apartado 3, del Reglamento 2019/123 como incluido en su ámbito de aplicación, junto a los Estados miembros, el Gestor de Red y los ANSP?", "opts": ["Los servicios meteorológicos nacionales", "Los coordinadores de slots aeroportuarios", "Los fabricantes de aeronaves", "Las asociaciones de pasajeros"], "ans": 1, "why": "El artículo 1, apartado 3, cita expresamente a los coordinadores de slots aeroportuarios, lo que confirma el vínculo entre el Reglamento de funciones de red y la asignación de slots aeroportuarios.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 1(3)", "note": ""}, {"n": 27, "stem": "¿Cuántos miembros con derecho a voto tiene el Network Management Board (NMB)?", "opts": ["6", "8", "12", "18"], "ans": 2, "why": "4 votos de ANSP/FAB + 4 votos de usuarios civiles del espacio aéreo + 2 votos de gestores aeroportuarios + 2 votos militares = 12.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 18(3)", "note": ""}, {"n": 28, "stem": "¿Cuántos votos tiene el propio representante de EUROCONTROL en el NM Board?", "opts": ["1", "2", "4", "0 (sin derecho a voto)"], "ans": 3, "why": "El representante de EUROCONTROL figura entre los miembros sin derecho a voto del NM Board.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 18(4)", "note": ""}, {"n": 29, "stem": "¿Quién nombra al presidente del Network Management Board y con qué criterio?", "opts": ["La Comisión, con base en la competencia técnica y la experiencia, a propuesta de los miembros con derecho a voto", "EUROCONTROL, por turno rotatorio entre los países asociados", "El EACCC, tras una revisión de respuesta a crisis", "Los representantes de los ANSP militares, por mayoría de votos"], "ans": 0, "why": "La Comisión nombra al presidente con base en la competencia técnica y la experiencia, a propuesta de los miembros con derecho a voto.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 18(6)", "note": ""}, {"n": 30, "stem": "¿Cuántas reuniones ordinarias al año debe celebrar como mínimo el Network Management Board?", "opts": ["Una", "Tres", "Dos", "Doce"], "ans": 1, "why": "El Board «celebrará al menos tres reuniones ordinarias al año» («shall hold at least three ordinary meetings a year»), además de las reuniones que solicite el presidente o la Comisión.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 18(11)", "note": ""}, {"n": 31, "stem": "¿Quién presta la secretaría del Network Management Board?", "opts": ["La Comisión Europea", "EASA", "El Gestor de Red", "Cada Estado miembro por turno rotatorio"], "ans": 2, "why": "El Reglamento encomienda al Gestor de Red la tarea de prestar la secretaría del NMB y de su presidente.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 18(11)", "note": ""}, {"n": 32, "stem": "¿Cuál es la finalidad principal de la European Aviation Crisis Coordination Cell (EACCC, Célula Europea de Coordinación de Crisis de la Aviación)?", "opts": ["Asignar slots aeroportuarios en temporada alta", "Gestionar la publicación diaria del AUP/UUP", "Certificar al personal del Gestor de Red", "Coordinar las respuestas a las crisis de la red"], "ans": 3, "why": "La EACCC se establece para contribuir, mediante su labor, a la coordinación de las respuestas a las crisis de la red (p. ej., una perturbación a gran escala).", "src": "Commission Implementing Regulation (EU) 2019/123, Article 19(1)", "note": ""}, {"n": 33, "stem": "¿Qué designa cada Estado miembro para el enlace con la EACCC?", "opts": ["Un punto focal del Estado y un suplente", "Un agregado militar", "Una aerolínea representativa", "Un director regional de FMP"], "ans": 0, "why": "Cada Estado miembro designa un punto focal del Estado y un suplente, lo que facilita el acceso a las estructuras nacionales de gestión de crisis.", "src": "Commission Implementing Regulation (EU) 2019/123, Article 19(3)", "note": ""}, {"n": 34, "stem": "Una EU Restriction, en comparación con una regulación de rate cero, ¿qué efecto distintivo tiene?", "opts": ["Se aplica solo a los vuelos VFR", "Hace que el IFPS rechace (invalide) los planes de vuelo afectados, obligando a los AO a volver a presentarlos", "Cancela todos los CTOT ya emitidos en el espacio aéreo", "Sustituye la necesidad de un ANM"], "ans": 1, "why": "A diferencia de una regulación de rate cero (que deja pasar los FPL y luego los demora), una EU Restriction hace que el IFPS rechace los FPL directamente.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.6.7", "note": ""}, {"n": 35, "stem": "¿Qué antelación mínima se requiere antes de la hora de entrada en vigor de una EU Restriction para que la medida sea plenamente eficaz?", "opts": ["30 minutos", "1 hora", "24 horas", "2 horas"], "ans": 3, "why": "Los criterios del manual para aplicar una EU Restriction especifican una antelación de al menos 2 horas.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.6.7", "note": ""}, {"n": 36, "stem": "¿Qué duración mínima se considera necesaria para justificar una EU Restriction?", "opts": ["15 minutos", "4 horas", "1 día", "1 hora"], "ans": 3, "why": "El criterio de duración especifica un mínimo de 1 hora, que se considera junto con el criterio de estabilidad.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.6.7", "note": ""}, {"n": 37, "stem": "Según la sección de procedimientos internos del ATFCM Operations Manual, ¿requiere el level capping interno (dentro de un mismo ACC) coordinación individual con el NMOC?", "opts": ["No, no se requiere coordinación individual con el NMOC", "Sí, siempre", "Solo si afecta a dos o más ACC adyacentes", "Solo durante la fase estratégica"], "ans": 0, "why": "El manual establece que no se requiere la coordinación individual de estas medidas internas con el NMOC (aunque sigue haciendo falta la coordinación entre ACC).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.9.1.1", "note": ""}, {"n": 38, "stem": "¿Elimina la aplicación de un Minimum Departure Interval (MDI, intervalo mínimo de salida) la exigencia de que un vuelo respete su EOBT/CTOT?", "opts": ["Sí, el MDI anula el cumplimiento del CTOT", "No, la aplicación del MDI no atenúa la exigencia de cumplir la EOBT y el CTOT", "Solo para los vuelos exentos", "Solo si el MDI supera los 30 minutos"], "ans": 1, "why": "El manual establece de forma expresa que la aplicación del MDI no atenúa las exigencias de cumplimiento de la EOBT y del CTOT.", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, 5.9.1.3", "note": ""}, {"n": 39, "stem": "Según el FUA/AMC/CADF Operations Manual, ¿qué determina la activación de una RSA de nivel 1 (estratégico)?", "opts": ["Su asignación en el AUP/UUP", "Una solicitud de activación en tiempo real del ATC", "Su disponibilidad", "Una decisión del Network Management Board"], "ans": 2, "why": "El manual establece que la activación de una RSA de nivel 1 «is determined by its availability» (viene determinada por su disponibilidad), a diferencia del nivel 2, que se activa por asignación en el AUP/UUP.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, 4.1.4", "note": ""}, {"n": 40, "stem": "¿Cómo se activa una RSA de nivel 2 (pretáctico)?", "opts": ["Por instrucción del controlador en tiempo real", "Por decisión del NMB", "Por su inclusión en el Network Strategy Plan", "Por su asignación en el AUP/UUP"], "ans": 3, "why": "La activación de nivel 2 se produce mediante la asignación en el AUP/UUP, el producto pretáctico diario.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, 4.1.4", "note": ""}, {"n": 41, "stem": "En cuanto a la activación de las RSA de nivel 3 (táctico), el manual señala que las activaciones en tiempo real:", "opts": ["De momento no son necesariamente conocidas de antemano por el NM", "Se notifican siempre al NM con 24 horas de antelación", "Requieren la aprobación del Network Management Board cada vez", "Solo pueden darse en rutas CDR1"], "ans": 0, "why": "El manual establece que las RSA de nivel 3 «can be activated by real time activations, which are presently not known by the NM» (pueden activarse en tiempo real, activaciones que por ahora el NM no conoce de antemano).", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, 4.1.4", "note": ""}, {"n": 42, "stem": "Según la tabla de parámetros FUA, ¿en qué niveles de la ASM se puede gestionar un TSA (Temporarily Segregated Area)?", "opts": ["Niveles 1, 2 y 3", "Solo el nivel 1 (nunca el 2 ni el 3)", "Solo los niveles 2 y 3", "Solo el nivel 3"], "ans": 1, "why": "La tabla marca el TSA como Y/N en el nivel 1 y N tanto en el nivel 2 como en el nivel 3.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, 4.1.4 table", "note": ""}, {"n": 43, "stem": "Según el manual FUA, ¿qué debe elaborar cada AMC para cada día, incluso cuando no haya aperturas ni restricciones que declarar?", "opts": ["Un informe a la EACCC", "Un NOTAM", "Un AUP «READY»", "Un RAD revisado"], "ans": 2, "why": "El manual exige que cada AMC elabore cada día un AUP «READY», tenga o no algo que declarar.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, chapter 2", "note": ""}, {"n": 44, "stem": "Si una AMC no tiene personal durante un fin de semana o un festivo, ¿qué debe hacer?", "opts": ["Suspender por completo la publicación del AUP durante ese período", "Delegar toda la responsabilidad de forma permanente en una AMC adyacente", "Notificar al Network Management Board para obtener una dispensa especial", "Preparar los AUP de ese período antes de cerrar por el descanso"], "ans": 3, "why": "El manual exige que la AMC prepare por adelantado los AUP de los días en que no tendrá personal.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, chapter 2", "note": ""}, {"n": 45, "stem": "¿Para qué sirve el concepto de «Lead AMC» (AMC coordinadora)?", "opts": ["Para asignar a una AMC la responsabilidad de coordinar una estructura transfronteriza compartida por más de una AMC", "Para designar la AMC más ocupada de Europa", "Para elegir qué AMC alberga el Network Management Board", "Para determinar las prioridades de slots aeroportuarios"], "ans": 0, "why": "El concepto de Lead AMC evita AUP nacionales contradictorios para una misma ruta o área transfronteriza compartida, dando a una AMC el papel coordinador.", "src": "EUROCONTROL FUA/AMC/CADF Operations Manual ed. 21.0, chapter 6", "note": ""}, {"n": 46, "stem": "¿Cuántas posiciones de gestión de afluencia (FMP) regionales presta ENAIRE en España?", "opts": ["Tres", "Cinco", "Cuatro", "Siete"], "ans": 1, "why": "El AIP ENR 1.9 nombra cinco FMP regionales: Madrid, Barcelona, Sevilla, Palma y Canarias.", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 47, "stem": "¿Qué FMP española presta el servicio de respaldo tanto a la FMP Sevilla como a la FMP Canarias cuando esas unidades no están operativas?", "opts": ["FMP Barcelona", "FMP Palma", "FMP Madrid", "La FMP Canarias se respalda a sí misma"], "ans": 2, "why": "El AIP ENR 1.9 establece que la FMP Madrid asume la prestación de servicios de las FMP regionales de Sevilla y Canarias durante los períodos en que esas unidades no están operativas.", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 48, "stem": "¿Qué FMP española presta el servicio de respaldo a la FMP Palma cuando esta no está operativa?", "opts": ["FMP Madrid", "FMP Sevilla", "FMP Canarias", "FMP Barcelona"], "ans": 3, "why": "AIP ENR 1.9: la FMP Barcelona asume la prestación de servicios de la FMP Palma cuando esa unidad no está operativa.", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 49, "stem": "¿Qué FMP española cubre la zona de la FIR/UIR Madrid al sur del paralelo 39°00'00\"N?", "opts": ["FMP Sevilla", "FMP Madrid", "FMP Barcelona", "FMP Palma"], "ans": 0, "why": "El AIP ENR 1.9 asigna la FMP Sevilla a la FIR/UIR Madrid al sur del paralelo 390000N, a la que presta servicio el ACC Sevilla.", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 50, "stem": "¿Qué indicador STS/ se aplica a los vuelos que transportan una evacuación de emergencia crítica para la vida?", "opts": ["STS/HOSP", "STS/MEDEVAC", "STS/HUM", "STS/SAR"], "ans": 1, "why": "El AIP ENR 1.9 recoge STS/MEDEVAC específicamente para los vuelos que transportan una evacuación de emergencia crítica para la vida, distinto de STS/HOSP (equipo médico o posicionamiento) y de STS/HUM (razones humanitarias en general).", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 51, "stem": "¿Qué observación adicional, junto a STS/ATFMX, señala un vuelo que transporta vacunas críticas cuyo retraso podría ponerlas en riesgo?", "opts": ["STS/HUM", "RMK/COLD", "RMK/VACCINE", "STS/CARGO"], "ans": 2, "why": "El AIP ENR 1.9 especifica que los vuelos que transportan vacunas críticas usan el indicador «RMK/VACCINE» además de la solicitud de exención.", "src": "AIP España ENR 1.9 (en)", "note": ""}, {"n": 52, "stem": "La composición en tres partes del campo REGCAUSE que llevan los mensajes SAM y SRM es:", "opts": ["Tipo de aeronave + categoría de estela + código del operador", "CTOT + STW + EOBT", "Nombre de la FMP + nombre del ACC + hora de inicio de la regulación", "Letra de causa de la regulación + letra de ubicación (D/E/A) + código numérico IATA de demora (o 00)"], "ans": 3, "why": "El REGCAUSE tiene un código de causa de una letra, un código de ubicación de una letra (Salida/En ruta/Llegada, <em>Departure/En-route/Arrival</em>) y, tras un espacio, el código de demora IATA en formato numérico o 00 si no está disponible.", "src": "EUROCONTROL ATFCM Users Manual Wave 2.3, REGCAUSE description", "note": ""}, {"n": 53, "stem": "En el REGCAUSE, ¿qué código de ubicación de la regulación corresponde a «En ruta» (<em>En-route</em>)?", "opts": ["E", "D", "A", "R"], "ans": 0, "why": "El código de ubicación de la regulación es uno de estos: D (<em>Departure</em>, salida), E (<em>En-route</em>, en ruta) o A (<em>Arrival</em>, llegada).", "src": "EUROCONTROL ATFCM Users Manual Wave 2.3, REGCAUSE description", "note": ""}, {"n": 54, "stem": "¿Qué código de motivo de regulación del NM corresponde a «Special Event» (evento especial: grandes acontecimientos deportivos, gubernamentales o sociales, o actualizaciones del sistema ATM)?", "opts": ["M", "P", "V", "O"], "ans": 1, "why": "El código P es Special Event; M es Airspace Management (gestión del espacio aéreo), V es Environmental Issues (cuestiones medioambientales) y O es Other (otros; solo se usa cuando no es aplicable ningún otro código).", "src": "EUROCONTROL ATFCM Operations Manual Wave 2.3, Regulation Reason table", "note": ""}, {"n": 55, "stem": "El conjunto de indicadores de causa de demora ATFM propio de ENAIRE (que usa en sus informes del Plan de Vuelo 2030) emplea un subconjunto de seis letras. ¿Cuál de las siguientes NO figura entre las seis de ENAIRE?", "opts": ["C", "M", "W", "P"], "ans": 2, "why": "El subconjunto propio de ENAIRE es C, R, S, T, M, P; la W (<em>Weather</em>, meteorología) pertenece a la lista completa de 14 códigos de motivo de regulación del NM de EUROCONTROL, pero no forma parte del conjunto de indicadores, más breve, de ENAIRE.", "src": "Base t06 notes cross-checked against EUROCONTROL ATFCM Operations Manual Wave 2.3 Regulation Reason table", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/06-plan-vuelo-atfcm/ampliacio       e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
