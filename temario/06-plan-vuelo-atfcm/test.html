<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Plan de vuelo y gestión de afluencia (ATFCM)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Plan de vuelo y gestión de afluencia (ATFCM)</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Plan de vuelo y gestión de afluencia (ATFCM)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el manual, el plan de vuelo se describe mejor como:", "opts": ["Una autorización que emite el ATC antes de la puesta en marcha", "Una declaración de intenciones del piloto al mando y una solicitud de servicios ATS", "Un contrato entre el operador y el Gestor de Red", "Un informe del vuelo que se elabora después del aterrizaje"], "ans": 1, "why": "El manual lo define como una «declaración de intenciones»: el responsable del vuelo manifiesta la intención de realizar una operación y el requerimiento de servicios ATS para garantizar su seguridad. No es una autorización (A), no es un contrato (C) y se presenta antes del vuelo, no después (D).", "src": "Manual, Introducción, M p.4", "note": ""}, {"n": 2, "stem": "Según el manual, ¿qué organismo desempeña en Europa las funciones centrales de tratamiento de planes de vuelo, datos del espacio aéreo y ATFM?", "opts": ["El NMOC (Centro de Operaciones del Gestor de Red) de EUROCONTROL", "La Comisión de Aeronavegación de la OACI", "AESA", "La secretaría de la CEAC"], "ans": 0, "why": "La introducción atribuye estas funciones centrales al Centro de Operaciones del Gestor de Red (NMOC) de EUROCONTROL. De la CEAC solo se dice que es la zona donde el crecimiento del tráfico hizo necesarios estos mecanismos.", "src": "Manual, Introducción, M p.4", "note": ""}, {"n": 3, "stem": "¿Cuál de los siguientes vuelos NO necesita presentar plan de vuelo según el manual?", "opts": ["Cualquier vuelo VFR que cruce fronteras internacionales", "Un vuelo VFR en espacio aéreo controlado de clase C", "Un vuelo de búsqueda y salvamento en misión urgente", "Un vuelo VFR nocturno que se aleja de las inmediaciones del aeródromo de salida"], "ans": 2, "why": "Están exentas las misiones tácticas militares o de defensa aérea, las misiones urgentes de búsqueda y salvamento y los vuelos autorizados expresamente por la autoridad competente. Los otros tres figuran entre los vuelos que requieren FPL.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 4, "stem": "¿Exime la aplicación del Convenio Schengen de presentar un FPL al cruzar fronteras?", "opts": ["Sí, para todos los vuelos VFR", "Sí, si el vuelo es IFR", "No, no exime de la obligación", "Solo dentro del área de la CEAC"], "ans": 2, "why": "El manual dice de forma explícita que la aplicación del Convenio Schengen no exime de presentar un FPL cuando se atraviesan fronteras internacionales.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 5, "stem": "Un vuelo VFR con origen, destino o alternativo en un aeródromo controlado o con servicio AFIS:", "opts": ["Debe presentar un FPL", "No necesita ningún plan", "Necesita plan solo de noche", "Necesita plan solo si cruza fronteras"], "ans": 0, "why": "El manual incluye «cualquier vuelo VFR con origen, destino o alternativo en aeródromos controlados o con servicio AFIS» entre los vuelos que requieren FPL.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 6, "stem": "Según el manual, ¿por qué vía puede presentar directamente su plan de vuelo un vuelo IFR/GAT?", "opts": ["Solo a través de la torre de salida", "Solo a través de la oficina AIS", "Solo a través de AESA", "Directamente al IFPS de EUROCONTROL"], "ans": 3, "why": "Además de ICARO (web/app) y de la ARO centralizada, el manual permite presentar el plan directamente al IFPS (EUROCONTROL) cuando se trata de vuelos IFR y GAT.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 7, "stem": "En el manual, el aeródromo de La Cuesta (Córdoba) se da como ejemplo de:", "opts": ["Una ruta CDR", "Una zona geográfica designada de la ARO centralizada, la zona 10", "Un aeródromo con servicio AFIS", "Un aeródromo exento de plan de vuelo"], "ans": 1, "why": "A los aeródromos de uso restringido se les asigna una zona geográfica de la ARO centralizada, publicada en AIP ENR 1.10; La Cuesta (Córdoba) tiene la zona 10.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 8, "stem": "¿Qué es un plan AFIL?", "opts": ["Un plan presentado con 120 horas de antelación", "Un plan de vuelo repetitivo", "Un plan que, de manera excepcional, transmite una aeronave en vuelo a una estación de telecomunicaciones aeronáuticas que sirve a una dependencia ATS", "Un plan presentado en la torre de salida"], "ans": 2, "why": "En casos excepcionales, una aeronave en vuelo puede transmitir un plan de vuelo (AFIL) a una estación de telecomunicaciones aeronáuticas que sirva a una dependencia ATS.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 9, "stem": "¿Quién es responsable de enviar todos los mensajes asociados al plan de vuelo (DLA, CHG, CNL, DEP...) y a dónde?", "opts": ["El controlador, al NMOC", "El piloto o su representante autorizado, a la misma dependencia ATS en la que se presentó el FPL", "El operador, al ACC de destino", "El IFPS, a todas las dependencias ATS"], "ans": 1, "why": "El manual establece que es el piloto o su representante autorizado, y que los mensajes se dirigen a la misma dependencia a la que se envió el FPL.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 10, "stem": "Según el manual, ¿con cuánta antelación máxima respecto a la EOBT puede presentarse un plan de vuelo?", "opts": ["24 horas", "48 horas", "120 horas", "240 horas"], "ans": 2, "why": "Punto 1 del tiempo de presentación: no más de 120 horas antes de la hora prevista de fuera calzos.", "src": "Manual 1.2.1 «Tiempo de presentación», M p.5", "note": ""}, {"n": 11, "stem": "Un vuelo que puede estar sujeto a medidas ATFM debe presentar su plan de vuelo, como mínimo:", "opts": ["3 horas antes de la hora prevista de fuera calzos", "60 minutos antes de la hora prevista de fuera calzos", "6 horas antes de la salida", "30 minutos antes de la puesta en marcha"], "ans": 0, "why": "Punto 2: al menos tres horas antes de la EOBT para los vuelos que puedan estar sujetos a medidas de gestión de afluencia del tránsito aéreo.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 12, "stem": "Para todos los demás vuelos no sujetos a medidas ATFM (que cruzan fronteras o reciben servicio ATC), el tiempo mínimo de presentación es:", "opts": ["10 minutos antes de la salida", "30 minutos antes de la salida", "3 horas antes de la EOBT", "60 minutos antes de la salida"], "ans": 3, "why": "Punto 3: al menos sesenta minutos antes de la salida para todos los demás vuelos no incluidos en el punto 2.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 13, "stem": "Un plan presentado durante el vuelo debe ser recibido por la dependencia ATS adecuada, como mínimo, ¿cuánto tiempo antes de que la aeronave llegue al punto de entrada en un área de control?", "opts": ["5 minutos", "10 minutos", "20 minutos", "60 minutos"], "ans": 1, "why": "Punto 4: al menos diez minutos antes de la hora estimada de llegada al punto previsto de entrada en un área de control o en un área con servicio de asesoramiento, o al punto de cruce con una aerovía o con una ruta con servicio de asesoramiento.", "src": "Manual 1.2.1, M p.5", "note": ""}, {"n": 14, "stem": "¿Cuál de los siguientes datos forma parte del contenido del plan de vuelo que enumera el manual?", "opts": ["El nombre de la dependencia ATC que dio la autorización", "El tiempo meteorológico en el destino", "El sistema de recuperación por paracaídas balístico (como equipo de emergencia y de supervivencia)", "El designador de la SID"], "ans": 2, "why": "La lista de contenido incluye «equipo de emergencia y de supervivencia, incluido el sistema de recuperación por paracaídas balístico». Las demás opciones no figuran en la lista.", "src": "Manual 1.2.1 «Contenido», M p.6", "note": ""}, {"n": 15, "stem": "El procedimiento RFP se aplica a los vuelos sujetos a gestión de afluencia que, en la etapa previa al vuelo y para evitar demoras:", "opts": ["Cambian el tipo de aeronave", "Cambian el aeródromo de destino", "Retrasan la EOBT más de 15 minutos", "Eligen una ruta alternativa entre los mismos aeródromos de salida y destino"], "ans": 3, "why": "El RFP (plan de vuelo que reemplaza) afecta a los vuelos con medidas ATFCM que deciden, en la etapa previa al vuelo, tomar una ruta distinta entre los mismos aeródromos.", "src": "Manual 1.2.1 «Cuando/Procedimiento RFP», M p.6", "note": ""}, {"n": 16, "stem": "Para el procedimiento RFP, la etapa previa al vuelo se define como:", "opts": ["EOBT menos 1 hora", "EOBT menos 2 horas", "EOBT menos 3 horas", "EOBT menos 4 horas"], "ans": 3, "why": "Para evitar un uso excesivo del procedimiento, la etapa previa al vuelo es la EOBT menos 4 horas; el último RFP debe presentarse al menos 30 minutos antes de la EOBT.", "src": "Manual 1.2.1, M p.6", "note": ""}, {"n": 17, "stem": "El último plan de vuelo que reemplaza (RFP) debe presentarse:", "opts": ["Al menos 30 minutos antes de la EOBT", "Al menos 60 minutos antes de la EOBT", "Al menos 10 minutos antes de la EOBT", "Antes de que se emita el CTOT"], "ans": 0, "why": "El manual dice: «el último RFP se presentará por lo menos 30 minutos antes de la EOBT».", "src": "Manual 1.2.1, M p.6", "note": ""}, {"n": 18, "stem": "Según el manual, el plan de vuelo que reemplaza debe contener «RFP/Qn» como:", "opts": ["El primer elemento de la casilla 15", "El último elemento de la casilla 18", "El primer elemento de la casilla 18", "El último elemento de la casilla 19"], "ans": 1, "why": "El manual dice: «la nueva ruta completa en la casilla 15 y, como último elemento en la casilla 18, la indicación RFP/Qn». (El Manual del usuario del IFPS dice que va el primero; como referencia del examen vale el texto del manual.)", "src": "Manual 1.2.1, M p.6", "note": ""}, {"n": 19, "stem": "Cuando ya se había presentado un FPL y se elige una ruta alternativa en la etapa previa al vuelo, el mensaje CNL se envía:", "opts": ["Con prioridad GG, después del nuevo FPL", "Con prioridad FF, 30 minutos antes de la EOBT", "De inmediato y, de manera excepcional, con prioridad DD", "Solo al aeródromo de salida"], "ans": 2, "why": "El CNL se transmite inmediatamente y, de manera excepcional, con prioridad «DD» a todas las direcciones afectadas según el plan original.", "src": "Manual 1.2.1, M p.6", "note": ""}, {"n": 20, "stem": "Después del CNL del plan original, el FPL que lo reemplaza se transmite:", "opts": ["De forma simultánea", "Tras un breve intervalo de no menos de 5 minutos", "Exactamente 30 minutos después", "Antes del CNL"], "ans": 1, "why": "El plan de vuelo que reemplaza se transmite después de la cancelación «con un breve intervalo de no menos de 5 minutos».", "src": "Manual 1.2.1, M p.6-7", "note": ""}, {"n": 21, "stem": "En el formulario FPL de la OACI que reproduce el manual, ¿qué parte lleva la indicación «NOT TO BE TRANSMITTED IN FPL MESSAGES»?", "opts": ["La casilla 19, información suplementaria", "La casilla 18, otros datos", "La casilla 15, ruta", "La casilla 10, equipo"], "ans": 0, "why": "El encabezado de la parte inferior del formulario dice «Información suplementaria (En los mensajes FPL no hay que transmitir estos datos)»: autonomía, personas a bordo, radio de emergencia, equipo de supervivencia, chalecos, botes neumáticos, color, observaciones y piloto.", "src": "Manual, formulario FPL, M p.8 (imagen)", "note": ""}, {"n": 22, "stem": "¿Qué prioridad viene preimpresa en el formulario FPL del manual?", "opts": ["SS", "DD", "FF", "GG"], "ans": 2, "why": "El formulario muestra «&lt;&lt;≡ FF» junto a PRIORITY (Prioridad), porque los mensajes de plan de vuelo son FF.", "src": "Manual, formulario FPL, M p.8 (imagen); 2.2, M p.9", "note": ""}, {"n": 23, "stem": "¿Cuál es el orden correcto de prioridad de transmisión AFTN según el manual?", "opts": ["1 SS; 2 DD y FF; 3 GG y KK", "1 SS y DD; 2 FF; 3 GG y KK", "1 DD; 2 SS y FF; 3 GG y KK", "1 SS; 2 DD; 3 FF; 4 GG; 5 KK"], "ans": 0, "why": "La tabla del manual da tres niveles: primero SS, en segundo lugar DD y FF, y en tercer lugar GG y KK.", "src": "Manual 2.2, M p.10", "note": ""}, {"n": 24, "stem": "¿Qué mensajes llevan en el manual la prioridad AFTN DD?", "opts": ["Los mensajes de plan de vuelo", "Los mensajes de socorro", "Las observaciones meteorológicas", "Los mensajes de urgencia"], "ans": 3, "why": "SS, socorro; DD, urgencia; FF, plan de vuelo y movimiento y control; GG, pronósticos, observaciones, regularidad de vuelo y AIS; KK, administrativos.", "src": "Manual 2.2, M p.9", "note": ""}, {"n": 25, "stem": "Los mensajes de plan de vuelo, los de movimiento y control y la información SIGMET se transmiten con prioridad:", "opts": ["SS", "DD", "FF", "GG"], "ans": 2, "why": "En la tabla del manual, el grupo FF comprende el mensaje de plan de vuelo, los mensajes de movimiento y control, los mensajes de la empresa explotadora de interés inmediato y los mensajes meteorológicos limitados a la información SIGMET, las aeronotificaciones especiales y los pronósticos enmendados.", "src": "Manual 2.2, M p.9", "note": ""}, {"n": 26, "stem": "Los pronósticos meteorológicos, las observaciones, los mensajes de regularidad de vuelo y los mensajes AIS llevan el indicador de prioridad:", "opts": ["GG", "FF", "KK", "DD"], "ans": 0, "why": "El grupo GG contiene los pronósticos, los pronósticos de área y de ruta, las observaciones e informes, los mensajes de regularidad de vuelo y los mensajes AIS. KK es administrativo.", "src": "Manual 2.2, M p.9", "note": ""}, {"n": 27, "stem": "Los mensajes con el mismo indicador de prioridad AFTN se transmiten:", "opts": ["Por tamaño, primero el más corto", "Por orden alfabético del remitente", "En orden aleatorio", "En el orden en que se reciben para su transmisión"], "ans": 3, "why": "El manual dice que los mensajes con el mismo indicador de prioridad se transmiten según el orden en que se reciban para su transmisión.", "src": "Manual 2.2, M p.10", "note": ""}, {"n": 28, "stem": "Los mensajes relativos a una fase de incertidumbre se envían con prioridad:", "opts": ["SS", "DD", "FF", "GG"], "ans": 1, "why": "Los mensajes de urgencia, incluidos los de alerta y los relacionados con una fase de incertidumbre, llevan DD; los de la fase de peligro llevan SS.", "src": "Manual 2.3, M p.10", "note": ""}, {"n": 29, "stem": "La fase de incertidumbre se declara, entre otros casos, cuando no se ha recibido ninguna comunicación en el transcurso de:", "opts": ["5 minutos desde el momento en que debería haberse recibido una comunicación", "15 minutos desde el momento en que debería haberse recibido una comunicación", "30 minutos desde el momento en que debería haberse recibido una comunicación, o desde el primer intento infructuoso, según cuál sea anterior", "60 minutos desde el momento en que debería haberse recibido una comunicación"], "ans": 2, "why": "Condición i): 30 minutos desde el momento en que debería haberse recibido una comunicación o desde el primer intento infructuoso de establecer comunicación, según cuál sea anterior.", "src": "Manual 2.3, M p.10", "note": ""}, {"n": 30, "stem": "Una aeronave no ha llegado. La fase de incertidumbre se aplica cuando no ha llegado:", "opts": ["5 minutos después de la última hora prevista de llegada, según cuál sea anterior", "30 minutos después de la última hora prevista de llegada, notificada o estimada, según cuál sea posterior", "30 minutos después del despegue", "60 minutos después de la última hora prevista de llegada, según cuál sea anterior"], "ans": 1, "why": "Condición ii): 30 minutos después de la última hora prevista de llegada notificada o estimada por las dependencias de los servicios de tránsito aéreo, según cuál sea posterior.", "src": "Manual 2.3, M p.10", "note": ""}, {"n": 31, "stem": "Una aeronave autorizada a aterrizar no ha aterrizado. La fase de alerta se aplica cuando no ha aterrizado:", "opts": ["30 minutos después de la hora prevista de aterrizaje", "15 minutos después de la hora prevista de aterrizaje", "5 minutos después de la hora prevista de aterrizaje y no se ha restablecido la comunicación", "1 minuto después de la hora prevista de aterrizaje"], "ans": 2, "why": "Condición ii) de la fase de alerta: autorizada a aterrizar, no ha aterrizado 5 minutos después de la hora prevista de aterrizaje y no se ha restablecido la comunicación.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 32, "stem": "¿Qué situación pertenece a la fase de ALERTA según el manual?", "opts": ["Se considera agotado el combustible a bordo", "Se ha efectuado un aterrizaje forzoso", "Se sabe o se cree que una aeronave está siendo objeto de interferencia ilícita", "Se juzga probable un aterrizaje forzoso por la eficiencia mermada de la aeronave"], "ans": 2, "why": "La interferencia ilícita es la condición v) de la fase de alerta. El combustible agotado, el aterrizaje forzoso efectuado y el aterrizaje forzoso probable son condiciones de la fase de peligro.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 33, "stem": "La información que indica que la eficiencia operativa de la aeronave se ha visto afectada, pero no en la medida en que sea probable un aterrizaje forzoso, corresponde a la:", "opts": ["Fase de incertidumbre", "Fase de alerta", "Fase de peligro", "No se declara ninguna fase"], "ans": 1, "why": "Condición iv) de la fase de alerta. Si un aterrizaje forzoso fuera probable, sería la condición iii) de la fase de peligro.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 34, "stem": "¿Cuál de las siguientes es una condición de la fase de PELIGRO?", "opts": ["El combustible a bordo se considera agotado o insuficiente para que la aeronave llegue a un lugar seguro", "30 minutos sin comunicación", "La aeronave no ha aterrizado 5 minutos después de la hora prevista de aterrizaje", "Interferencia ilícita en un aeródromo AFIS"], "ans": 0, "why": "Condición ii) de la fase de peligro. B corresponde a la incertidumbre; C y D son condiciones de la fase de alerta.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 35, "stem": "La fase de peligro NO se aplica cuando:", "opts": ["La aeronave vuela con plan de vuelo IFR", "Hay una certeza razonable de que la aeronave y sus ocupantes no están amenazados por un peligro grave e inminente ni necesitan asistencia inmediata", "La aeronave ya ha aterrizado en un alternativo", "La fase de alerta ha durado menos de 30 minutos"], "ans": 1, "why": "El manual excluye la fase de peligro cuando hay una certeza razonable de que la aeronave y sus ocupantes no corren un peligro grave e inminente y no necesitan asistencia inmediata.", "src": "Manual 2.3, M p.11", "note": ""}, {"n": 36, "stem": "En la tabla de mensajes de movimiento y control del manual, ¿qué mensaje pertenece a la familia de «coordinación»?", "opts": ["DLA", "RQP", "SPL", "LAM (acuse de recibo lógico)"], "ans": 3, "why": "Coordinación: CPL, EST, CDN, ACP, LAM. DLA pertenece a los mensajes de plan de vuelo presentado; RQP y SPL, a los de plan de vuelo suplementario.", "src": "Manual 2.4, M p.12 (imagen de la tabla)", "note": ""}, {"n": 37, "stem": "¿Qué conjunto contiene solo mensajes de la familia de «plan de vuelo presentado»?", "opts": ["DLA, CHG, CNL, DEP, ARR", "CPL, EST, CDN, ACP, LAM", "RQP, RQS, SPL", "Autorización, transferencia de control, control de afluencia, informes de posición"], "ans": 0, "why": "Las cuatro familias del apartado 2.4 son: plan de vuelo presentado (DLA, CHG, CNL, DEP, ARR), coordinación (CPL, EST, CDN, ACP, LAM), plan de vuelo suplementario (RQP, RQS, SPL) y control (autorización, transferencia, control de afluencia, informe de posición).", "src": "Manual 2.4, M p.12", "note": ""}, {"n": 38, "stem": "¿Cuál de los siguientes NO es un campo que pueda modificarse con un mensaje CHG según el manual?", "opts": ["El nivel de crucero", "La ruta", "El aeródromo de salida", "La velocidad de crucero"], "ans": 2, "why": "El manual dice que la identificación de la aeronave, el aeródromo de salida y el aeródromo de destino no pueden modificarse con un CHG; hay que cancelar el FPL y presentar uno nuevo.", "src": "Manual 2.6, M p.13", "note": ""}, {"n": 39, "stem": "Si hay que cambiar el aeródromo de destino de un plan presentado, el manual prescribe:", "opts": ["Un mensaje CHG", "Un mensaje DLA", "Un mensaje RQP", "Cancelar el FPL y presentar uno nuevo"], "ans": 3, "why": "Campos como la identificación, la salida y el destino no pueden modificarse con un CHG; hay que cancelar el FPL y presentar uno nuevo.", "src": "Manual 2.6, M p.13", "note": ""}, {"n": 40, "stem": "¿Qué dependencia ATS transmite el mensaje CNL a las dependencias que recibieron los datos básicos del plan de vuelo?", "opts": ["La dependencia ATS que sirve al aeródromo de salida", "El centro de control de área del destino", "El Gestor de Red", "La AMC"], "ans": 0, "why": "La dependencia que sirve al aeródromo de salida transmite el CNL a las dependencias ATS que recibieron los datos básicos.", "src": "Manual 2.7, M p.13", "note": ""}, {"n": 41, "stem": "Cuando se envía un CNL para cancelar el FPL de un día determinado y se presenta un plan nuevo, el CNL lleva el indicador de prioridad:", "opts": ["SS", "DD", "FF", "KK"], "ans": 1, "why": "El manual dice que el mensaje de cancelación se envía con el indicador de prioridad «DD» a todas las dependencias ATS interesadas, seguido del nuevo plan de vuelo presentado.", "src": "Manual 2.7, M p.13", "note": ""}, {"n": 42, "stem": "Salvo que un acuerdo regional prescriba otra cosa, los mensajes DEP se transmiten:", "opts": ["30 minutos antes de la salida", "En el momento de la solicitud de pushback", "Inmediatamente después de la salida de la aeronave", "Dentro de la hora siguiente a la salida"], "ans": 2, "why": "Los mensajes DEP se envían inmediatamente después de la salida de una aeronave con respecto a la cual se hayan distribuido datos básicos de plan de vuelo.", "src": "Manual 2.8, M p.13", "note": ""}, {"n": 43, "stem": "En la región EUR, los mensajes DEP pueden omitirse, por acuerdo mutuo de los Estados, para:", "opts": ["Todos los vuelos VFR", "Los vuelos IFR dentro de áreas designadas o a lo largo de rutas designadas donde existan circuitos radiotelefónicos ATS fiables", "Todos los vuelos del mismo operador", "Los vuelos con CTOT"], "ans": 1, "why": "La condición es que existan circuitos radiotelefónicos ATS fiables entre dependencias ATS sucesivas y que se trate de vuelos IFR dentro de áreas o rutas designadas.", "src": "Manual 2.8, M p.13", "note": ""}, {"n": 44, "stem": "¿Para qué vuelos transmite la dependencia ATS del aeródromo de destino un ARR tras el aterrizaje (manual 2.9)?", "opts": ["Solo para los vuelos IFR", "Para los vuelos VFR y, previa petición, para los vuelos IFR", "Solo para los vuelos con CTOT", "Solo para los vuelos nocturnos"], "ans": 1, "why": "El ARR se transmite para los vuelos VFR y, previa petición, para los vuelos que operen bajo reglas de vuelo por instrumentos.", "src": "Manual 2.9, M p.14", "note": ""}, {"n": 45, "stem": "Una aeronave aterriza en un aeródromo alternativo. ¿Cuál de los siguientes es destinatario del ARR?", "opts": ["La torre de control del aeródromo de destino", "Solo el Gestor de Red", "AESA", "Solo el IFPS"], "ans": 0, "why": "Destinatarios: el ACC/FIC del área del aeródromo de llegada; la torre de control del aeródromo de destino; la ARO del aeródromo de salida; el ACC/FIC de cada FIR/UIR que se habría cruzado de no haberse desviado.", "src": "Manual 2.9, M p.14", "note": ""}, {"n": 46, "stem": "Una vez que ha aterrizado en el aeródromo de destino una aeronave con fallo de comunicaciones en ambos sentidos, ¿quién transmite el ARR?", "opts": ["El centro de control de área", "La torre de control del aeródromo de llegada", "El NMOC", "El operador"], "ans": 1, "why": "El manual se lo asigna a la torre de control del aeródromo de llegada, dirigido a todas las dependencias ATS interesadas durante el fallo y a las que hayan podido ser alertadas.", "src": "Manual 2.9, M p.14", "note": ""}, {"n": 47, "stem": "Si la aeronave con fallo de comunicaciones aterriza en un aeródromo distinto del de destino, el ARR se envía primero a:", "opts": ["Todos los ACC", "La dependencia ATS del aeródromo de destino, que informa después a las demás interesadas o alertadas", "El IFPS", "Solo la ARO de salida"], "ans": 1, "why": "La torre envía el ARR a la dependencia ATS del aeródromo de destino; esta lo retransmite a todas las demás dependencias interesadas o alertadas.", "src": "Manual 2.9, M p.14", "note": ""}, {"n": 48, "stem": "Una dependencia ATS recibe un mensaje EST de una aeronave de la que nunca recibió los datos básicos del plan de vuelo. ¿Qué mensaje envía y a quién?", "opts": ["Un RQS a la ARO de salida", "Un SPL al ACC", "Un RQP a la dependencia transferidora que originó el EST", "Un CHG al operador"], "ans": 2, "why": "El RQP (solicitud de plan de vuelo presentado) se envía a la dependencia ATS transferidora que originó un mensaje EST, o al centro que originó un mensaje de actualización para el cual no existen datos básicos.", "src": "Manual 2.10, M p.15", "note": ""}, {"n": 49, "stem": "El mensaje RQS (solicitud de información suplementaria) se envía a:", "opts": ["El centro de control de área del destino", "El NMOC", "La dependencia ATS anterior a lo largo de la ruta", "La ARO del aeródromo de salida o la dependencia ATS especificada en un plan presentado en vuelo"], "ans": 3, "why": "El RQS va a la ARO del aeródromo de salida o, en el caso de un plan presentado durante el vuelo, a la dependencia especificada en ese mensaje de plan de vuelo.", "src": "Manual 2.10, M p.15", "note": ""}, {"n": 50, "stem": "¿Quién transmite un mensaje SPL?", "opts": ["La ARO del aeródromo de salida, a las dependencias que solicitaron más información que la enviada en un CPL o FPL", "El IFPS al ANSP", "La FMP al NMOC", "El piloto a la torre"], "ans": 0, "why": "El SPL lo envía la oficina de notificación de los servicios de tránsito aéreo del aeródromo de salida a las dependencias que pidieron información adicional a la ya transmitida en un CPL o FPL.", "src": "Manual 2.10, M p.15", "note": ""}, {"n": 51, "stem": "Según el manual, ¿qué organización creó la unidad central única ATFM para la región EUR de la OACI?", "opts": ["EASA", "EUROCONTROL", "La Comisión Europea", "IATA"], "ans": 1, "why": "En la región EUR de la OACI, EUROCONTROL creó una unidad central única ATFM para planificar, coordinar y ejecutar las medidas ATFM.", "src": "Manual 3.1, M p.15", "note": ""}, {"n": 52, "stem": "El Gestor de Red está gobernado por un comité denominado:", "opts": ["Performance Review Body (PRB)", "Network Manager Board (NMB)", "Comité de Cielo Único Europeo", "Consejo de Gestión del Espacio Aéreo"], "ans": 1, "why": "El NM está gobernado por el Network Manager Board, en el que están representadas las ramas de la aviación, las autoridades reguladoras y los ANSP. El PRB es el órgano a través del cual la Comisión fija los objetivos de rendimiento.", "src": "Manual 3.2, M p.16", "note": ""}, {"n": 53, "stem": "Las funciones estratégicas del Gestor de Red se definen en un plan estratégico operativo que abarca:", "opts": ["Un año", "Tres años", "Cinco años", "Diez años"], "ans": 2, "why": "El manual dice: «Plan estratégico operativo que abarca un periodo de cinco años».", "src": "Manual 3.2, M p.16", "note": ""}, {"n": 54, "stem": "En España, el NM coordina las medidas estratégicas y pretácticas con todos los siguientes EXCEPTO:", "opts": ["La Dirección de Operaciones ATM (UATM)", "Las Posiciones de Gestión de Afluencia (FMP)", "AMC España", "La División de Inspección de AESA"], "ans": 3, "why": "Los tres organismos citados son la Dirección de Operaciones ATM, a través de la UATM; las FMP; y la Célula de Gestión de Espacio Aéreo (AMC España).", "src": "Manual 3.2, M p.16", "note": ""}, {"n": 55, "stem": "El sistema que monitoriza los datos de tráfico y permite implantar las medidas ATFCM es el:", "opts": ["CASA", "ENV", "IFPS", "ETFMS"], "ans": 3, "why": "ETFMS = Sistema de Gestión del Flujo Táctico Reforzado (<em>Enhanced Tactical Flow Management System</em>). CASA asigna los slots, ENV es la base de datos e IFPS valida y distribuye los planes de vuelo.", "src": "Manual 3.2, M p.16-17; glosario M p.34", "note": ""}, {"n": 56, "stem": "Según el glosario del manual, TACT es:", "opts": ["El nombre actual de CASA", "La antigua denominación del actual ETFMS", "Una base de datos del espacio aéreo", "El Equipo Táctico de Coordinación del Espacio Aéreo"], "ans": 1, "why": "El glosario define TACT como «antigua denominación del actual ETFMS».", "src": "Manual, glosario, M p.35", "note": ""}, {"n": 57, "stem": "¿Bajo la responsabilidad de quién trabajan los técnicos de control de afluencia de una FMP?", "opts": ["El Jefe de Sala del ACC al que está adscrita la FMP", "La AMC", "El Network Manager Board", "El jefe de la UCATM"], "ans": 0, "why": "Las FMP están dotadas de técnicos de control de afluencia y siempre bajo la responsabilidad del Jefe de Sala del ACC.", "src": "Manual 3.2, M p.17", "note": ""}, {"n": 58, "stem": "¿Cuál es una función de la UCATM según el manual?", "opts": ["Asignar CTOT a vuelos individuales", "Emitir autorizaciones ATC", "Actuar como célula de crisis en situaciones excepcionales que afecten al tránsito aéreo", "Validar planes de vuelo"], "ans": 2, "why": "La UCATM gestiona la fase estratégica, supervisa las actividades pretácticas y tácticas, centraliza las funciones de las FMP cuando no están operativas, actúa como célula de crisis, asesora a los AO/ATS y participa en la parte civil de la AMC.", "src": "Manual 3.3, M p.17", "note": ""}, {"n": 59, "stem": "La fase estratégica de la ATFCM abarca el período:", "opts": ["Hasta siete días antes del día de la operación, con el NOP como resultado", "Los seis días anteriores a la operación, con el ADP como resultado", "El día de la operación", "Desde el día siguiente a la operación"], "ans": 0, "why": "Estratégica: hasta siete días antes, con el Plan Operacional de la Red (NOP) como resultado. Pretáctica: seis días antes, ADP. Táctica: el día de la operación. Postoperacional: desde el día siguiente.", "src": "Manual 3.3.1, M p.18", "note": ""}, {"n": 60, "stem": "El producto principal de la fase pretáctica es:", "opts": ["El Plan Operacional de la Red (NOP)", "El Plan Diario ATFCM (ADP)", "El AUP", "El informe postoperacional"], "ans": 1, "why": "En la fase pretáctica, las medidas ATFCM se recogen en el Plan Diario ATFCM (ADP).", "src": "Manual 3.3.1, M p.18", "note": ""}, {"n": 61, "stem": "¿En qué fase tienen especial importancia la actuación de los Jefes de Sala y Supervisores y su coordinación con los TCA?", "opts": ["Estratégica", "Pretáctica", "Táctica", "Postoperacional"], "ans": 2, "why": "El manual destaca que en la fase táctica tiene gran importancia la correcta actuación de los responsables de las dependencias de control y su coordinación con los técnicos de control de afluencia.", "src": "Manual 3.3.1, M p.19", "note": ""}, {"n": 62, "stem": "El análisis postoperacional:", "opts": ["Se aplica durante los seis días anteriores a la operación", "Sustituye a la fase táctica", "Lo realiza solo EUROCONTROL", "Se aplica desde el día siguiente a la operación y realimenta a las tres fases anteriores"], "ans": 3, "why": "Analiza el día de la operación y realimenta a las fases anteriores; todos los participantes aportan <em>feedback</em> y el resultado son mejores prácticas.", "src": "Manual 3.3.1 (numerado 1.3.2 en el manual), M p.19", "note": ""}, {"n": 63, "stem": "El IFPS tiene dos centros redundantes situados en:", "opts": ["Bruselas y Brétigny (París)", "Bruselas y Maastricht", "Madrid y París", "Ginebra y Bruselas"], "ans": 0, "why": "El manual dice: «consta de dos centros redundantes: Bruselas y Bretigny (Paris)».", "src": "Manual 3.4, M p.19", "note": ""}, {"n": 64, "stem": "¿Cuál de las siguientes NO es una tarea del IFPS según el manual?", "opts": ["Recepcionar los planes de vuelo", "El procesado inicial (validación)", "Distribuir los datos de plan de vuelo a las unidades ATC del área ECAC", "Determinar la capacidad declarada de cada sector"], "ans": 3, "why": "La capacidad declarada la determina el proveedor de servicios ATS (en ENAIRE, la Dirección de Operaciones). El IFPS recepciona, valida, distribuye y proporciona datos de FPL a operaciones del NM.", "src": "Manual 3.4, M p.19-20", "note": ""}, {"n": 65, "stem": "Un plan de vuelo que contiene información contraria a la base de datos ENV es:", "opts": ["Aceptado (ACK) y enviado al ANSP", "Rechazado (REJ) y no llega a ATC", "Suspendido (FLS)", "Enviado a la FMP para que se le asigne un CTOT"], "ans": 1, "why": "Contradecir la base de datos ENV lleva al rechazo (REJ); los planes rechazados no llegan a ATC y el operador o el originador debe actuar.", "src": "Manual 3.4, M p.20", "note": ""}, {"n": 66, "stem": "Un mensaje FLS recibido en una dependencia ATS significa, en principio, que el vuelo:", "opts": ["Ha sido cancelado definitivamente", "Ha recibido un nuevo CTOT", "No está autorizado a salir", "Está exento de regulación"], "ans": 2, "why": "El FLS (mensaje de suspensión del vuelo) suspende un plan ya aceptado e «inicialmente implica la no autorización de salida del vuelo».", "src": "Manual 3.4, M p.21", "note": ""}, {"n": 67, "stem": "El valor de la demanda que utiliza el sistema ATFCM se basa en:", "opts": ["Todos los vuelos, incluidos los VFR y los operacionales", "Solo los vuelos con CTOT", "Los planes de vuelo presentados, sin incluir los vuelos VFR ni los operacionales", "Las trazas radar"], "ans": 2, "why": "El manual establece que la demanda que maneja el sistema ATFCM se basa en los planes de vuelo presentados, sin incluir los vuelos VFR ni los operacionales.", "src": "Manual 3.5.1, M p.21", "note": ""}, {"n": 68, "stem": "¿Qué tipo de capacidad «podría ser bastante mayor que los valores de capacidad sostenible» durante períodos cortos?", "opts": ["La capacidad declarada", "La capacidad disponible", "La capacidad máxima", "La capacidad planificada"], "ans": 2, "why": "Las observaciones sobre la capacidad máxima dicen que puede lograrse durante períodos cortos y que podría ser bastante mayor que los valores de capacidad sostenible.", "src": "Manual 3.5.2, M p.22 (tabla)", "note": ""}, {"n": 69, "stem": "¿Qué capacidad «deberá constituir el factor principal a efectos de planificación»?", "opts": ["La capacidad sostenible", "La capacidad máxima", "La capacidad disponible", "La capacidad declarada"], "ans": 0, "why": "Las observaciones sobre la capacidad sostenible establecen que debe ser el factor principal de planificación. La capacidad declarada se basa en ella.", "src": "Manual 3.5.2, M p.22", "note": ""}, {"n": 70, "stem": "En condiciones óptimas, la capacidad disponible se corresponde con la:", "opts": ["Capacidad máxima", "Capacidad sostenible menos un 10 %", "Capacidad declarada", "Demanda"], "ans": 2, "why": "La observación sobre la capacidad disponible dice: «en condiciones óptimas la capacidad disponible se corresponde con la capacidad declarada».", "src": "Manual 3.5.2, M p.22", "note": ""}, {"n": 71, "stem": "En situaciones tácticas sobrevenidas, ¿quién determina la capacidad disponible en una dependencia en la que no hay Jefe de Sala ni Supervisor?", "opts": ["El FMP Manager", "El controlador de tránsito aéreo con la habilitación más antigua de los que estén de servicio", "La Dirección de Operaciones", "El NMOC"], "ans": 1, "why": "Orden: el Jefe de Sala; si no lo hay o está ausente, el Supervisor de servicio; si no hay Supervisor, el CTA con la habilitación más antigua en la dependencia de los que se encuentren de servicio.", "src": "Manual 3.5.3, M p.22-23", "note": ""}, {"n": 72, "stem": "La capacidad máxima puede ser sensiblemente superior a la capacidad sostenible durante un período no superior a:", "opts": ["15 minutos", "30 minutos", "60 minutos", "120 minutos"], "ans": 2, "why": "Punto c: sesenta (60) minutos; también la determina la Dirección de Operaciones.", "src": "Manual 3.5.3, M p.23", "note": ""}, {"n": 73, "stem": "Se utiliza únicamente el valor HEC para detectar sobredemandas y establecer medidas ATFCM:", "opts": ["En la fase táctica, cuando las medidas hacen falta con menos de 3 horas de antelación", "En la fase pretáctica, o cuando hay que tomar medidas con más de 3 horas de antelación", "Solo en la fase estratégica", "En todas las fases, junto con el OCC Peak"], "ans": 1, "why": "Las gráficas de ocupación solo son estables en horizontes cortos, por lo que se usa únicamente el HEC en la fase pretáctica y para medidas con más de 3 horas de antelación a la operación.", "src": "Manual 3.5.4, M p.23-24", "note": ""}, {"n": 74, "stem": "Según el manual, existe sobredemanda siempre que el traffic load:", "opts": ["Sobrepase cualquiera de los parámetros de monitorización", "Sobrepase la capacidad sostenible", "Sobrepase todos los parámetros de monitorización aplicables", "Sobrepase la capacidad máxima"], "ans": 2, "why": "«Se considerará que existe una sobredemanda siempre que el traffic load sobrepase todos los parámetros de monitorización aplicables».", "src": "Manual 3.5.4, M p.24", "note": ""}, {"n": 75, "stem": "Cuando se prevé que la demanda vaya a superar la capacidad, el manual da el siguiente orden de actuación:", "opts": ["Regular con CTOT, después STAM y después adaptar la capacidad", "STAM, después adaptar la capacidad y después regular", "Adaptar la capacidad a la demanda, después STAM (sin regulación) y, como último recurso, regular", "Cancelar vuelos, después regular y después adaptar la capacidad"], "ans": 2, "why": "Primero, analizar si se puede adaptar la capacidad; segundo, medidas sin regulación (STAM); como último recurso, la regulación mediante CTOT y, si no queda otra opción, actuar sobre el tráfico en vuelo.", "src": "Manual 3.5.5, M p.24", "note": ""}, {"n": 76, "stem": "¿Quién tiene la decisión final sobre la aplicación de una técnica para evitar la regulación (configuración dinámica, level capping, etc.)?", "opts": ["El TCA", "El Supervisor", "El NMOC", "El Jefe de Sala"], "ans": 3, "why": "El TCA estudia, el Supervisor analiza y el Jefe de Sala decide; cualquiera de los tres puede proponer.", "src": "Manual 3.5.5.1, M p.25", "note": ""}, {"n": 77, "stem": "La configuración dinámica permite:", "opts": ["Aplicar MDI en el aeropuerto de salida", "Redirigir los vuelos a otra FIR", "Adaptar en táctica el número de sectores/posiciones a la demanda prevista", "Suspender planes de vuelo"], "ans": 2, "why": "Optimiza el número de sectores y posiciones en la fase táctica, reservando recursos durante los períodos de baja demanda para utilizarlos cuando esta aumente.", "src": "Manual 3.5.5.1, M p.25", "note": ""}, {"n": 78, "stem": "El level capping:", "opts": ["Restringe los niveles de vuelo utilizables dentro de un ACC o entre dos ACC adyacentes", "Asigna CTOT a los vuelos por encima del FL290", "Lo aplica únicamente el NMOC", "Nunca requiere cambiar el plan de vuelo"], "ans": 0, "why": "Reduce la demanda por encima o por debajo de un nivel de vuelo, y su aplicación mediante escenarios predefinidos implica que el cambio se refleje en el plan de vuelo.", "src": "Manual 3.5.5.1, M p.25", "note": ""}, {"n": 79, "stem": "Cuando el rerouting requiere un nuevo plan de vuelo, es recomendable plantearlo a los operadores de aeronaves con una antelación mínima de:", "opts": ["30 minutos", "Una hora", "Dos horas", "Tres horas"], "ans": 3, "why": "El manual dice: «es recomendable plantearla a los AOs con una antelación mínima de tres horas».", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 80, "stem": "El rerouting detectado en la fase pretáctica lo gestiona:", "opts": ["El Supervisor del sector", "El FMP Manager de la región", "El controlador de torre", "La AMC"], "ans": 1, "why": "Lo gestiona el FMP Manager de la región e implica que el operador presente un nuevo plan de vuelo.", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 81, "stem": "El «rerouting táctico» es:", "opts": ["Una medida ATFCM que exige un nuevo plan de vuelo del operador", "Una medida ATC que modifica la ruta de un vuelo en curso para evitar el sector sobrecargado", "Una medida aplicada en la fase estratégica", "Un cierre de CDR"], "ans": 1, "why": "El rerouting táctico es una medida ATC que modifica la ruta de un vuelo en curso; se comunica al piloto la causa y se le reincorpora a su ruta lo antes posible.", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 82, "stem": "El MDI es aplicable:", "opts": ["Solo en la fase estratégica", "Solo en la fase pretáctica", "Solo en la fase táctica, si se satura un sector o se reduce repentinamente la capacidad", "En todas las fases"], "ans": 2, "why": "El MDI no es de aplicación en la fase estratégica ni en la pretáctica; en táctica, solo si se satura un sector o se reduce repentinamente la capacidad.", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 83, "stem": "El intervalo de despegue MDI entre salidas consecutivas será, como máximo, de:", "opts": ["2 minutos durante una hora", "5 minutos durante unos 30 minutos", "10 minutos durante unos 60 minutos", "15 minutos durante unas 2 horas"], "ans": 1, "why": "Pauta c: como máximo 5 minutos, durante un período no superior a aproximadamente 30 minutos; si no se soluciona la sobredemanda, deben tomarse otras medidas ATFCM.", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 84, "stem": "Antes de aplicar el MDI, ¿a quién se debe informar?", "opts": ["Al supervisor de torre", "A la AMC", "A la FMP, que a su vez coordinará con el NMOC", "Solo al centro de operaciones de la aerolínea"], "ans": 2, "why": "«Antes de aplicar esta técnica se debe informar a la FMP, que a su vez coordinará con NMOC.»", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 85, "stem": "Con el MDI, el controlador de torre autoriza el despegue de modo que el vuelo:", "opts": ["Ignore su CTOT", "Respete su CTOT, incluido el tiempo MDI", "Salga exactamente 5 minutos después del anterior", "Espere la aprobación del NMOC"], "ans": 1, "why": "La torre autoriza el despegue respetando el CTOT (incluido el tiempo MDI); si no puede cumplirlo, requiere la orientación de la FMP.", "src": "Manual 3.5.5.1, M p.26", "note": ""}, {"n": 86, "stem": "Miles in Trail (MIT) consiste en:", "opts": ["Retrasar las salidas de un aeródromo", "Coordinar la transferencia de un flujo de tráfico de manera que las aeronaves mantengan entre sí una determinada separación en millas", "Restringir los niveles de vuelo", "Seleccionar vuelos individuales para retrasarlos"], "ans": 1, "why": "MIT: las aeronaves del flujo mantienen entre sí una determinada separación en millas, con las instrucciones que reciben de Control. Seleccionar vuelos es el cherry picking; retrasar salidas es el MDI.", "src": "Manual 3.5.5.1, M p.27", "note": ""}, {"n": 87, "stem": "La regulación cherry pick se utiliza para resolver:", "opts": ["Picos largos, de más de 4 horas, que afectan a muchos vuelos", "Picos cortos (p. ej., 1 h o 1 h 30 min) de un número limitado de vuelos en zonas congestionadas", "Cierres de aeropuertos", "Desequilibrios estratégicos"], "ans": 1, "why": "Consiste en seleccionar vuelos y aplicar medidas ATFCM solo a esos vuelos, y puede combinarse con otras medidas.", "src": "Manual 3.5.5.1, M p.27", "note": ""}, {"n": 88, "stem": "Una regulación se define como una medida que:", "opts": ["Cierra un sector", "Adecua la demanda de tráfico a la capacidad disponible asignando CTOT para limitar los vuelos que entran en un espacio aéreo o aeródromo", "Cambia los niveles de vuelo de todos los vuelos", "Aumenta el número de sectores"], "ans": 1, "why": "La regulación limita los vuelos con entrada prevista a un espacio aéreo o aeródromo regulado mediante la asignación de CTOT, que demoran el despegue.", "src": "Manual 3.5.5.2, M p.27", "note": ""}, {"n": 89, "stem": "Dentro del espacio aéreo que gestiona un ACC, ¿quién aprueba las medidas de control de afluencia decididas en la FMP cuando ENAIRE presta el servicio ATS?", "opts": ["El Supervisor", "El Jefe de Sala del ACC", "El NMOC", "La Dirección de Operaciones"], "ans": 1, "why": "Aprueba el Jefe de Sala; las medidas deben estar siempre debidamente justificadas y se dejará constancia escrita de ellas.", "src": "Manual 3.5.5.2 b, M p.27", "note": ""}, {"n": 90, "stem": "En las dependencias en las que ENAIRE no es el proveedor de servicios ATS, las medidas de afluencia:", "opts": ["Las aprueba el Jefe de Sala del ACC", "Las aprueba el NMOC", "Se coordinan directamente con la FMP, sin necesitar la aprobación del Jefe de Sala", "No son de aplicación"], "ans": 2, "why": "Punto d: esas dependencias coordinan directamente con la FMP y no necesitan la aprobación del Jefe de Sala.", "src": "Manual 3.5.5.2 d, M p.28", "note": ""}, {"n": 91, "stem": "Sectores sin OTMV definidos: la capacidad de monitorización durante los primeros 60 minutos es la capacidad HEC declarada incrementada en:", "opts": ["5 %", "10 %", "15 %", "20 %"], "ans": 1, "why": "+10 % durante los primeros 60 minutos, siempre que en los 120 minutos posteriores no se rebase la capacidad declarada.", "src": "Manual 3.5.5.2, M p.28", "note": ""}, {"n": 92, "stem": "El procedimiento del +10 % para sectores sin OTMV se aplica en todos los sectores de control EXCEPTO:", "opts": ["Los sectores de los TMA de Barcelona y Madrid", "Los sectores de Canarias", "Los sectores superiores de los ACC", "Los sectores de Palma"], "ans": 0, "why": "El manual excluye los sectores de control de los TMA de Barcelona y Madrid.", "src": "Manual 3.5.5.2 a, M p.28", "note": ""}, {"n": 93, "stem": "La demanda de la primera hora supera la capacidad declarada, pero es inferior a la declarada +10 %, y en los 120 minutos siguientes no supera la capacidad declarada. Resultado:", "opts": ["Regular a la capacidad declarada", "Regular a la declarada +10 %", "No regular", "Aplicar MDI"], "ans": 2, "why": "Regla b: en ese caso no se aplica regulación.", "src": "Manual 3.5.5.2 b, M p.28", "note": ""}, {"n": 94, "stem": "La demanda de la primera hora supera la declarada +10 %, y en los 120 minutos siguientes no supera la capacidad declarada. Resultado:", "opts": ["Regular la primera hora a la declarada +10 % y, las horas siguientes, si es preciso, a la capacidad declarada", "Regular todo a la capacidad declarada desde el principio", "No regular", "Regular todo a la declarada +10 %"], "ans": 0, "why": "Regla c del manual.", "src": "Manual 3.5.5.2 c, M p.28", "note": ""}, {"n": 95, "stem": "La primera hora supera la capacidad declarada y los 120 minutos siguientes también la superan. Resultado:", "opts": ["Regular a la declarada +10 % en todo momento", "No regular", "Aplicar solo level capping", "Regular a la capacidad declarada desde el comienzo de la regulación"], "ans": 3, "why": "Regla d del manual.", "src": "Manual 3.5.5.2 d, M p.28", "note": ""}, {"n": 96, "stem": "En los sectores con OTMV definidos, el rate de regulación debe ser:", "opts": ["Igual o superior a la capacidad declarada, de modo que permita bajar el OCC Peak y controlar el OCC Sustained", "Siempre un 10 % inferior a la capacidad declarada", "Igual a la capacidad máxima", "Definido por la aerolínea"], "ans": 0, "why": "El rate puede determinarse con herramientas como ASIM, IMPACT o SIMEX, que simulan con datos de EUROCONTROL.", "src": "Manual 3.5.5.2, M p.28", "note": ""}, {"n": 97, "stem": "Con independencia de las coordinaciones con el NM, la decisión final de implantar, modificar o cancelar una medida ATFCM corresponde a la:", "opts": ["FMP", "NMOC", "Supervisor", "AMC"], "ans": 0, "why": "El manual dice: «la decisión final de implantar, modificar o cancelar cualquier medida ATFCM, pertenece a la FMP».", "src": "Manual 3.5.5.2, M p.28", "note": ""}, {"n": 98, "stem": "En cuanto al CTOT y la autorización ATC, el manual dice que:", "opts": ["El CTOT se comunica únicamente al operador", "Los Estados se asegurarán de que el CTOT, cuando aplique, se incluya como parte de la autorización ATC", "La autorización se emite una vez transcurrido el CTOT", "El CTOT sustituye a la autorización ATC"], "ans": 1, "why": "Pauta a: el CTOT forma parte de la autorización ATC, y el ATC tiene en cuenta también el turno de salida y la suspensión de un vuelo.", "src": "Manual 3.5.5.3 a, M p.29", "note": ""}, {"n": 99, "stem": "Si aparece un plan de vuelo suspendido, el controlador de torre:", "opts": ["Autoriza el despegue del vuelo", "Cancela el plan", "Contacta solo con el operador", "Comunica con la FMP"], "ans": 3, "why": "Pauta b: si aparece un plan de vuelo suspendido, el CTA de TWR comunica con la FMP.", "src": "Manual 3.5.5.3 b, M p.29", "note": ""}, {"n": 100, "stem": "¿Qué afirmación sobre los vuelos exentos y los vuelos excluidos es correcta?", "opts": ["Los vuelos exentos los autorizan los proveedores de servicio; los excluidos, los Estados", "Los vuelos exentos lo están de todas las regulaciones y los autorizan los Estados; los excluidos, solo de alguna regulación o volumen específico y los autorizan los proveedores de servicio", "Ambos los autoriza el NMOC", "Los vuelos excluidos están exentos de todas las regulaciones"], "ans": 1, "why": "El manual: exentos = todas las regulaciones, autorizados por los Estados; excluidos = solo alguna regulación o volumen específico, autorizados por los proveedores de servicio.", "src": "Manual 3.5.5.4, M p.29", "note": ""}, {"n": 101, "stem": "¿Qué vuelo NO figura en la lista de vuelos exentos del manual?", "opts": ["Un vuelo que transporta a un jefe de Estado", "Un vuelo de búsqueda y salvamento", "Un vuelo médico o de ambulancia cuando están en juego vidas humanas", "Un vuelo regular de carga de una gran aerolínea"], "ans": 3, "why": "Exentos: jefes de Estado o equivalentes, búsqueda y salvamento, vuelos autorizados por autoridades relevantes de los Estados, vuelos médicos o de ambulancia cuando están en juego vidas humanas y servicios de extinción de incendios.", "src": "Manual 3.5.5.4, M p.29-30", "note": ""}, {"n": 102, "stem": "¿Quién decide la cancelación de una regulación y quién es el responsable último?", "opts": ["La decide el NMOC; responde la FMP", "La decide el Supervisor; responde el TCA", "La decide la FMP correspondiente; el Jefe de Sala es el responsable último", "La decide la AMC; responde la UCATM"], "ans": 2, "why": "Apartado 3.5.5.5: la decisión se toma en la FMP correspondiente y el Jefe de Sala es el responsable último de tomarla.", "src": "Manual 3.5.5.5, M p.30", "note": ""}, {"n": 103, "stem": "¿Cuál es uno de los tres pasos que se siguen al modificar o cancelar una regulación?", "opts": ["Esperar a que caduquen los CTOT", "Volver a emitir todos los planes de vuelo", "Monitorizar el impacto de la actualización en la carga de tráfico", "Cerrar el sector afectado"], "ans": 2, "why": "Los tres pasos: contactar con el NM lo antes posible y tomar medidas tras la coordinación entre el Jefe de Sala y el NMOC; monitorizar el impacto en la carga de tráfico; tomar las medidas necesarias para evitar una nueva sobrecarga.", "src": "Manual 3.5.5.5, M p.30 (figura)", "note": ""}, {"n": 104, "stem": "El concepto FUA se basa en:", "opts": ["Separar de forma permanente el espacio aéreo civil y el militar", "Un espacio aéreo considerado único y continuo, de uso flexible, con cualquier segregación de carácter temporal", "El uso exclusivo de rutas CDR", "Reservar espacio aéreo para uso militar por la noche"], "ans": 1, "why": "FUA: el espacio aéreo no se considera civil ni militar, sino único y continuo, y su uso es flexible; toda segregación debe ser temporal.", "src": "Manual 4.1, M p.30", "note": ""}, {"n": 105, "stem": "¿Qué nivel FUA corresponde a la gestión día a día, el día anterior a las operaciones, a través de la AMC?", "opts": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "ans": 1, "why": "Nivel 1, estratégico (política a largo plazo); nivel 2, pretáctico (día anterior, AMC); nivel 3, táctico (tiempo real).", "src": "Manual 4.1, M p.30-31", "note": ""}, {"n": 106, "stem": "Un TSA (área temporalmente segregada) es:", "opts": ["Un volumen de espacio aéreo a través del cual puede transitar otro tráfico con autorización ATC", "Una ruta condicional", "Un área de dimensiones predefinidas reservada temporalmente, a través de la cual no puede transitar ningún otro tráfico", "Un espacio aéreo de coordinación previa"], "ans": 2, "why": "TSA: reserva temporal, sin tránsito de otros tráficos. La descripción de A corresponde al TRA.", "src": "Manual 4.2, M p.31", "note": ""}, {"n": 107, "stem": "Un TRA (área temporalmente restringida), según el manual, es:", "opts": ["Un área a través de la cual no puede transitar ningún tráfico", "Un volumen de espacio aéreo para uso específico de una actividad aeronáutica, a través del cual se puede permitir el tránsito de otro tráfico bajo autorización ATC", "Un área de restricción permanente", "Una ruta ATS de carácter no permanente"], "ans": 1, "why": "El TRA se distingue del TSA en que el ATC puede autorizar el tránsito de otros tráficos.", "src": "Manual 4.2 b, M p.31", "note": ""}, {"n": 108, "stem": "¿Qué categoría de ruta condicional existe hoy según el manual?", "opts": ["CDR 1, 2 y 3", "Solo CDR 2", "Solo CDR 3", "Solo CDR 1"], "ans": 3, "why": "Se han eliminado dos de las tres categorías y solo queda la CDR 1, que se establece en la fase estratégica (nivel 1) y puede planificarse de forma permanente en los FPL.", "src": "Manual 4.2 c, M p.31", "note": ""}, {"n": 109, "stem": "Una CDR1 se cierra temporalmente. ¿Qué deben hacer los operadores con FPL afectados?", "opts": ["Continuar con el plan y esperar al ATC", "Cancelar el FPL y presentar uno nuevo con la ruta alternativa publicada en la casilla 15", "Enviar un DLA", "Enviar un RQP"], "ans": 1, "why": "Los FPL afectados por rutas cerradas temporalmente deben cancelarse y presentarse un nuevo FPL con la ruta alternativa en la casilla 15.", "src": "Manual 4.2 c, M p.31", "note": ""}, {"n": 110, "stem": "Cuando una CDR1 debe cerrarse al tráfico con poco tiempo de preaviso, el ATC:", "opts": ["Cancela todos los planes de vuelo", "Da instrucciones a los vuelos para que utilicen rutas alternativas en la fase táctica", "Aplica un MDI", "Deniega el cruce"], "ans": 1, "why": "El manual dice que el ATC dará instrucciones a los vuelos para utilizar rutas alternativas en la fase táctica.", "src": "Manual 4.2 c, M p.31", "note": ""}, {"n": 111, "stem": "La AMC distribuye el AUP a EUROCONTROL, a los ACC/FMP y a las AMC adyacentes:", "opts": ["Antes de las 14:00 UTC del día anterior a las operaciones", "A las 06:00 UTC del día de las operaciones", "Después de las 18:00 UTC del día anterior", "En las 24 horas posteriores a las operaciones"], "ans": 0, "why": "Antes de las 14:00 UTC del día anterior a las operaciones, con un período de validez de 24 horas a partir de las 06:00 UTC del día siguiente.", "src": "Manual 4.2.2, M p.32", "note": ""}, {"n": 112, "stem": "El período de validez del AUP es:", "opts": ["12 horas a partir de las 00:00 UTC", "24 horas a partir de las 06:00 UTC del día siguiente al de la distribución", "48 horas a partir de las 14:00 UTC", "24 horas a partir de las 14:00 UTC"], "ans": 1, "why": "El AUP es válido 24 horas a partir de las 06:00 UTC del día siguiente; se distribuye antes de las 14:00 UTC del día anterior.", "src": "Manual 4.2.2, M p.32", "note": ""}, {"n": 113, "stem": "El AUP contiene:", "opts": ["La lista de rutas CDR2 disponibles", "La lista de vuelos exentos", "El ADP", "La lista de rutas ATS permanentes y CDR 1 cerradas temporalmente, y la lista de TSA y TRA activadas"], "ans": 3, "why": "Estos son los dos apartados del AUP; el UUP lo actualiza.", "src": "Manual 4.2.2, M p.32", "note": ""}, {"n": 114, "stem": "El glosario del manual define CTOT como:", "opts": ["Hora calculada de despegue", "Hora estimada de despegue", "Hora prevista de fuera calzos", "Hora de llegada calculada"], "ans": 0, "why": "ETOT es la hora estimada de despegue; EOBT, la hora prevista de fuera calzos; CTOT, la hora calculada de despegue.", "src": "Manual, glosario, M p.34", "note": ""}, {"n": 115, "stem": "Según el glosario, RCA tiene dos significados:", "opts": ["Reglamento de Circulación Aérea y Espacio Aéreo de coordinación reducida", "Red de Control Aéreo y Regulación de Capacidad Aérea", "Área de Control de Ruta (<em>Route Control Area</em>) y Área de Control Radar (<em>Radar Control Area</em>)", "Área de Control de Notificación (<em>Reporting Control Area</em>) y Espacio Aéreo de Control Restringido (<em>Restricted Control Airspace</em>)"], "ans": 0, "why": "El glosario recoge «Reglamento de Circulación Aérea / Air traffic regulations» y «Espacio Aéreo de coordinación reducida / Reduced coordination airspace».", "src": "Manual, glosario, M p.34", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/06-plan-vuelo-atfcm/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
