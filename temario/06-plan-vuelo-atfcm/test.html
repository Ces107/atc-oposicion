casilla 16 recoge:", "opts": ["La velocidad de crucero, el nivel de crucero y la ruta que ha de seguirse", "El aeródromo de destino, la EET total y los aeródromos de alternativa", "El número y tipo de aeronaves y la categoría de estela turbulenta", "El aeródromo de salida y la hora prevista de fuera calzos"], "ans": 1, "why": "Casilla 16: aeródromo de destino, duración total prevista (EET total), aeródromo de alternativa y 2.º aeródromo de alternativa. A es la casilla 15; C, la 9; D, la 13.", "src": "Manual 6 (nov. 2026), formulario FPL OACI, p. 8 (figura)", "note": ""}, {"n": 136, "stem": "Según las normas generales del apartado 2.1, los mensajes relativos a un FPL más utilizados son los destinados a:", "opts": ["La actuación y la notificación de cambios", "La asignación de slots y de CTOT", "La coordinación entre unidades civiles y militares", "La difusión de información meteorológica y AIS"], "ans": 0, "why": "2.1: «Los mensajes relativos a un FPL más utilizados son aquellos para la actuación y notificación de cambios», y se agrupan en mensajes de emergencia (socorro y alerta) y mensajes de movimiento y control.", "src": "Manual 6 (nov. 2026), capítulo 2.1, p. 9", "note": ""}, {"n": 137, "stem": "Según la definición que recoge el manual, la red AFTN es un sistema completo y mundial de circuitos fijos aeronáuticos dispuestos como parte del:", "opts": ["Servicio móvil aeronáutico", "Servicio de radionavegación aeronáutica", "Servicio fijo aeronáutico", "Servicio de radiodifusión aeronáutica"], "ans": 2, "why": "AFTN: «sistema completo y mundial de circuitos fijos aeronáuticos dispuestos como parte del servicio fijo aeronáutico, para el intercambio de mensajes o de datos numéricos entre estaciones fijas aeronáuticas» con características de comunicación idénticas o compatibles.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 9", "note": ""}, {"n": 138, "stem": "¿Cuál de estos mensajes meteorológicos se transmite con prioridad FF y no con GG?", "opts": ["Los pronósticos de área", "Los pronósticos de ruta", "Las observaciones e informes", "Los pronósticos enmendados"], "ans": 3, "why": "FF incluye los mensajes meteorológicos limitados a la información SIGMET, a las aeronotificaciones especiales y a los pronósticos enmendados. Los pronósticos, los de área, los de ruta y las observaciones e informes van con GG.", "src": "Manual 6 (nov. 2026), capítulo 2.2, pp. 9-10", "note": ""}, {"n": 139, "stem": "Los mensajes originados por una empresa explotadora de aeronaves, de interés inmediato para las aeronaves en vuelo o que se preparan para la salida, llevan prioridad:", "opts": ["DD", "FF", "GG", "KK"], "ans": 1, "why": "Figuran en el grupo FF, junto con el mensaje de plan de vuelo, los de movimiento y control y la meteorología limitada a SIGMET, aeronotificaciones especiales y pronósticos enmendados.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 9", "note": ""}, {"n": 140, "stem": "La prioridad AFTN KK corresponde a:", "opts": ["Los mensajes aeronáuticos administrativos", "Los mensajes relativos a la regularidad de vuelo", "Los mensajes de los servicios de información aeronáutica", "Los mensajes relativos a observaciones e informes"], "ans": 0, "why": "KK: mensajes aeronáuticos administrativos. B, C y D son GG; ambos comparten el tercer nivel de transmisión.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 10", "note": ""}, {"n": 141, "stem": "Los mensajes relacionados con una fase de peligro se incluyen, según el manual, en:", "opts": ["Los mensajes de urgencia, con prioridad DD", "Los mensajes de socorro y tráfico de socorro, con prioridad SS", "Los mensajes de movimiento y control, con prioridad FF", "Los mensajes de alerta, con prioridad DD"], "ans": 1, "why": "2.3: mensajes de socorro y tráfico de socorro, incluidos los relacionados con una fase de peligro (SS); mensajes de urgencia, incluidos los de alerta y los de una fase de incertidumbre (DD).", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 10", "note": ""}, {"n": 142, "stem": "Según la redacción del manual, la fase de incertidumbre no resulta aplicable:", "opts": ["Mientras no existan dudas acerca de la seguridad de la aeronave y de sus ocupantes", "Cuando la aeronave vuela en espacio aéreo no controlado de clase G", "Si la aeronave ha presentado un plan de vuelo VFR o un plan AFIL", "Hasta que hayan transcurrido 60 minutos sin ninguna comunicación"], "ans": 0, "why": "La edición de 2026 dice: «La fase de incertidumbre no resulta aplicable mientras no existan dudas acerca de la seguridad de la aeronave y de sus ocupantes» (la de 2024 lo decía con una doble negación errónea; el sentido es el mismo).", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 143, "stem": "Los incisos i) a iv) de la fase de alerta no se aplican cuando existen pruebas que disipan los temores sobre la seguridad de la aeronave. ¿Qué situación de alerta queda fuera de esa excepción?", "opts": ["Tras la incertidumbre, los nuevos intentos de comunicación no revelan noticias de la aeronave", "Autorizada a aterrizar, no aterriza 5 minutos después de la hora prevista y sin comunicación", "Se recibe información de eficiencia operativa afectada sin aterrizaje forzoso probable", "Se sabe o se cree que la aeronave está siendo objeto de interferencia ilícita"], "ans": 3, "why": "La interferencia ilícita es el inciso v), al que no alcanza la excepción. A, B y C son los incisos i), ii) y iv).", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 144, "stem": "Según el manual, en los aeródromos AFIS la fase de alerta se declara:", "opts": ["Siempre que la aeronave se retrase 15 minutos sobre su hora prevista", "Solo si lo solicita el piloto al mando", "En las circunstancias prescritas por la autoridad competente", "Nunca: en los aeródromos AFIS solo existe la fase de incertidumbre"], "ans": 2, "why": "Inciso iii) de la fase de alerta: «en aeródromos AFIS, en las circunstancias prescritas por la autoridad competente».", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 145, "stem": "Se recibe información de que la aeronave está a punto de realizar un aterrizaje forzoso. ¿Qué fase corresponde?", "opts": ["Ninguna, si se mantiene el contacto radio", "Fase de incertidumbre", "Fase de alerta", "Fase de peligro"], "ans": 3, "why": "Inciso iv) de la fase de peligro: se recibe información o hay una certeza razonable de que la aeronave está a punto de realizar o ha realizado un aterrizaje forzoso.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 146, "stem": "En la tabla de mensajes de movimiento y control, los mensajes de control de afluencia pertenecen a la familia de:", "opts": ["Mensajes de plan de vuelo presentado", "Mensajes de coordinación", "Mensajes de plan de vuelo suplementario", "Mensajes de control"], "ans": 3, "why": "Mensajes de control: autorización, transferencia de control, control de afluencia, e informe de posición y aeronotificaciones.", "src": "Manual 6 (nov. 2026), capítulo 2.4, p. 12", "note": ""}, {"n": 147, "stem": "En la tabla del apartado 2.4, el mensaje CPL es un mensaje de:", "opts": ["Plan de vuelo actualizado, de la familia de coordinación", "Cancelación, de la familia de plan de vuelo presentado", "Plan de vuelo suplementario, de su propia familia", "Control de afluencia, de la familia de control"], "ans": 0, "why": "Coordinación: plan de vuelo actualizado (CPL), estimadas sobre un punto (EST), coordinación (CDN), aceptación (ACP) y acuse de recibo lógico (LAM). La cancelación es CNL.", "src": "Manual 6 (nov. 2026), capítulo 2.4, p. 12", "note": ""}, {"n": 148, "stem": "Según el manual, cuando la salida sufre una demora respecto a la EOBT se transmite un mensaje DLA de acuerdo con los procedimientos descritos en:", "opts": ["El Doc 4444 de la OACI", "AIP-España, ENR 1.10", "El IFPS handbook", "AIP-España, ENR 1.9"], "ans": 1, "why": "2.5 remite a las publicaciones de información aeronáutica (AIP-España, ENR 1.10). El manual no da ningún umbral de minutos para el DLA.", "src": "Manual 6 (nov. 2026), capítulo 2.5, p. 13", "note": ""}, {"n": 149, "stem": "¿Quién transmite el mensaje DEP y a quién?", "opts": ["La dependencia ATS del aeródromo de salida, a los destinatarios de los datos básicos", "El piloto o su representante, a la ARO en la que presentó el FPL", "La torre del aeródromo de destino, al ACC en cuya área está", "El IFPS, a las FMP de las regiones afectadas"], "ans": 0, "why": "2.8: la dependencia de los servicios de tránsito aéreo del aeródromo de salida transmitirá el mensaje DEP a todos los destinatarios de los datos básicos de plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 2.8, p. 13", "note": ""}, {"n": 150, "stem": "Tras el aterrizaje en el aeródromo de destino, el ARR se envía a la dependencia ATS del aeródromo de salida que inició el mensaje de plan de vuelo:", "opts": ["Siempre, en todos los vuelos, sin necesidad de petición", "Si en el plan de vuelo se había solicitado un mensaje ARR", "Solo si el vuelo era IFR y aterrizó en su destino", "Nunca; solo se envía al ACC o FIC del área"], "ans": 1, "why": "Destinatarios en destino: el ACC o FIC del área del aeródromo de llegada, si así lo exige; y la dependencia ATS del aeródromo de salida que inició el plan, si en este se había solicitado un mensaje ARR.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 151, "stem": "Una aeronave aterriza en un aeródromo de alternativa. ¿Cuál de los siguientes NO figura entre los destinatarios del ARR?", "opts": ["El ACC o FIC en cuya área está el aeródromo de llegada", "La torre de control del aeródromo de destino", "La oficina de notificación ATS del aeródromo de salida", "La FMP del ACC del que depende el aeródromo de salida"], "ans": 3, "why": "Destinatarios en alternativo: el ACC/FIC del área del aeródromo de llegada; la torre del aeródromo de destino; la ARO del aeródromo de salida; y el ACC/FIC de cada FIR/UIR que habría cruzado de no haberse desviado. La FMP no figura.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 152, "stem": "Una aeronave de la que no se ha recibido mensaje alguno establece comunicación radiotelefónica y requiere servicios de tránsito aéreo. ¿Qué se transmite y a quién?", "opts": ["Un RQS a la oficina ARO del aeródromo de salida", "Un SPL a la dependencia transferidora", "Un RQP a la dependencia ATS anterior a lo largo de la ruta", "Un RQP al IFPS de EUROCONTROL"], "ans": 2, "why": "2.10: «Si no se ha recibido mensaje alguno, pero una aeronave establece comunicaciones radiotelefónicas y requiere los servicios de tránsito aéreo, se transmitirá un mensaje RQP a la dependencia ATS anterior a lo largo de la ruta».", "src": "Manual 6 (nov. 2026), capítulo 2.10, p. 15", "note": ""}, {"n": 153, "stem": "Según el manual, en la actualidad las funciones de control de afluencia se encuadran en el Network Manager (NM):", "opts": ["A instancias de la Comisión Europea", "Por decisión del Consejo de la OACI", "A propuesta de la CEAC", "Por acuerdo entre los ANSP europeos"], "ans": 0, "why": "3.1: «En la actualidad las funciones de control de afluencia se encuadran en el Network Manager (NM), a instancias de la Comisión Europea».", "src": "Manual 6 (nov. 2026), capítulo 3.1, p. 16", "note": ""}, {"n": 154, "stem": "La Comisión Europea marca los objetivos a los que se refieren los planes estratégicos del NM a través de:", "opts": ["El Network Manager Board (NMB)", "El Centro de Operaciones del Gestor de Red (NMOC)", "El PRB (Performance Review Body), encuadrado en el SES", "La Unidad Central ATM (UCATM)"], "ans": 2, "why": "3.2: los planes se refieren a objetivos definidos por la Comisión Europea para mejorar la eficiencia del servicio, que la Comisión marca a través de la PRB, encuadrada en el SES (Cielo Único Europeo). El NMB gobierna el NM.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 155, "stem": "Según el manual, la Dirección de Operaciones ATM participa en la coordinación con el Network Manager a través de la:", "opts": ["Unidad Central ATM (UCATM)", "Célula de Gestión de Espacio Aéreo (AMC España)", "Posición de Gestión de Afluencia (FMP) de Madrid", "Oficina ARO centralizada"], "ans": 0, "why": "3.2: «La Dirección de Operaciones ATM, a través de la Unidad Central ATM (UCATM)». La edición de 2024 escribía «UATM» en esta línea; la de 2026 usa UCATM en todo el manual.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 156, "stem": "La AMC España asigna temporalmente el espacio aéreo en función de las peticiones de los usuarios. ¿Cuál NO figura entre los usuarios que enumera el apartado 3.2?", "opts": ["Los ACC", "Las FMP", "Las unidades gestoras de zonas militares", "El IFPS"], "ans": 3, "why": "3.2: peticiones realizadas por los usuarios (ACC, FMP, unidades gestoras de zonas militares y otras agencias acreditadas). El IFPS es el sistema de tratamiento de planes de vuelo del NM.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 157, "stem": "La AMC España gestiona diariamente la asignación temporal del espacio aéreo en fase <strong><em>_ y confecciona el </em></strong>_ el día anterior a las operaciones.", "opts": ["táctica; Plan Diario ATFCM (ADP)", "estratégica; Network Operational Plan (NOP)", "pretáctica; Plan de Utilización del Espacio Aéreo (AUP/UUP)", "post-operacional; informe de eficiencia de las medidas"], "ans": 2, "why": "La AMC es una unidad nacional mixta civil/militar que gestiona diariamente, en fase pretáctica, la asignación temporal del espacio aéreo y el día anterior a las operaciones confecciona el «Plan de Utilización del Espacio Aéreo (AUP/UUP)».", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 158, "stem": "Dentro del NM, el sistema de asignación de slots es:", "opts": ["ENV", "CASA", "IFPS", "TACT"], "ans": 1, "why": "CASA = sistema de asignación de slot por ordenador (<em>Computer Assisted Slot Allocation</em>). ENV es la base de datos del área de operaciones, IFPS valida y distribuye los planes de vuelo y TACT es la antigua denominación del ETFMS.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 17; capítulo 5 (Acrónimos), p. 33", "note": ""}, {"n": 159, "stem": "¿Cuál de las siguientes funciones de la UCATM está clasificada en el manual como «relativa al FUA» y no como «relativa a ATFM»?", "opts": ["Supervisar las actividades pretácticas y tácticas", "Actuar como célula de crisis en situaciones excepcionales", "Asesorar al usuario (AO/ATS) en gestión de control de afluencia", "Participar en la gestión de la parte civil de la AMC"], "ans": 3, "why": "La única función relativa al FUA es participar en la gestión de la parte civil de la AMC. Las otras tres, junto con gestionar la fase estratégica y centralizar las FMP, son funciones relativas a ATFM.", "src": "Manual 6 (nov. 2026), capítulo 3.3, p. 17", "note": ""}, {"n": 160, "stem": "Respecto de las fases ATFCM, la UCATM:", "opts": ["Gestiona y coordina la fase estratégica y supervisa las actividades pretácticas y tácticas", "Gestiona la fase táctica y supervisa la fase estratégica de cada ACC", "Asigna los CTOT de cada vuelo en coordinación con el sistema CASA", "Solo interviene en el análisis post-operacional, emitiendo informes"], "ans": 0, "why": "Funciones ATFM de la UCATM: gestionar y coordinar la fase estratégica con los organismos nacionales e internacionales (OACI, NM, ACC...) y supervisar las actividades pretácticas y tácticas.", "src": "Manual 6 (nov. 2026), capítulo 3.3, p. 17", "note": ""}, {"n": 161, "stem": "En la fase estratégica, EUROCONTROL involucra a todas las partes implicadas en ATM. ¿Cuál de las siguientes figura en la lista del manual?", "opts": ["Los militares", "Las autoridades aduaneras", "Los fabricantes de aeronaves", "Los servicios meteorológicos nacionales"], "ans": 0, "why": "La fase estratégica es una tarea cooperativa que involucra a proveedores de servicios de navegación aérea, aeropuertos, usuarios del espacio aéreo y militares; su resultado es el NOP.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 18", "note": ""}, {"n": 162, "stem": "En la fase táctica, ¿qué se actualiza conforme a la demanda real y la capacidad disponible?", "opts": ["El Network Operational Plan (NOP)", "El Plan Diario ATFCM (ADP)", "El Plan de Utilización del Espacio Aéreo (AUP)", "El Plan estratégico operativo de cinco años"], "ans": 1, "why": "Fase táctica: se trabaja en tiempo real, a veces adaptando los planes a necesidades inmediatas (tormentas, fallos de radioayudas...), y «se actualiza el Plan Diario conforme a la demanda real y la capacidad disponible».", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 18", "note": ""}, {"n": 163, "stem": "En la infografía de las fases ATFCM del manual, los rótulos «Afinar previsión» y «Detectar necesidad de aplicar medidas ATFCM» corresponden a la fase:", "opts": ["Estratégica", "Pretáctica", "Táctica", "Análisis post-operacional"], "ans": 1, "why": "Infografía de 4 pasos: 1 estratégica (hasta 7 días antes; NOP); 2 pretáctica (6 días antes; afinar previsión; detectar necesidad de medidas ATFCM); 3 táctica (el día; tiempo real; adaptar previsión); 4 post-operacional (después del día; análisis de eficiencia de medidas; emisión de informes).", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 18 (figura)", "note": ""}, {"n": 164, "stem": "Según el manual, ¿de qué centro del IFPS depende España, generalmente?", "opts": ["Bruselas (sede belga)", "Maastricht (sede neerlandesa)", "Bretigny (sede francesa)", "Madrid (sede española)"], "ans": 2, "why": "El manual dice: «España depende de la sede francesa, generalmente» (Bretigny, París). Las fuentes de EUROCONTROL lo describen de otra forma (guía, sección 7); en el examen vale el manual.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 19", "note": ""}, {"n": 165, "stem": "Durante el análisis post-operacional, todos los participantes en el servicio ATFCM deben aportar <em>feedback</em> sobre, entre otros aspectos:", "opts": ["Solo los incidentes con pérdida de separación del día", "Las tarifas de ruta y los costes unitarios del ANSP", "Las licencias y habilitaciones de los controladores", "La eficiencia de las medidas, las demoras, los escenarios y los incidentes"], "ans": 3, "why": "Deben aportar <em>feedback</em> sobre la eficiencia de las medidas y las demoras aplicadas, el uso de escenarios, la planificación de los vuelos o incidentes relacionados con la operación; el resultado es el desarrollo de mejores prácticas.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1 (numerado «1.3.2» en el manual), p. 19", "note": ""}, {"n": 166, "stem": "Según el manual, la centralización de la información en una única base de datos permite garantizar, de los datos que usan los sistemas del NM, su:", "opts": ["Confidencialidad, integridad y disponibilidad", "Rapidez, bajo coste y redundancia", "Trazabilidad, auditoría y cifrado", "Coherencia, homogeneidad y compatibilidad"], "ans": 3, "why": "3.4: la base de datos única garantiza «la coherencia, homogeneidad y compatibilidad de los datos»; la fiabilidad de los sistemas se asienta en la exactitud de los datos aportados a la base de datos ENV.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 20", "note": ""}, {"n": 167, "stem": "Un plan de vuelo cuya información es correcta o cuyo error puede corregirse manualmente:", "opts": ["Es rechazado (REJ) y no llega a ATC", "Es suspendido mediante un mensaje FLS", "Es aceptado (ACK) y enviado a los ANSP correspondientes", "Queda retenido hasta que el operador envíe un CHG"], "ans": 2, "why": "«Si la información del plan de vuelo es correcta o permite que el error sea corregido manualmente, será aceptado por el sistema (ACK) y enviada a los proveedores de servicios de navegación (ANSP)».", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 20", "note": ""}, {"n": 168, "stem": "Según el manual, la capacidad se expresa en función del número de aeronaves que, en un determinado período de tiempo:", "opts": ["Presentan su plan de vuelo ante el IFPS en ese período", "Entran en un sector, sobrevuelan un punto o despegan o aterrizan en un aeródromo", "Reciben un CTOT del NMOC para ese volumen de tráfico", "Mantienen contacto radio simultáneo con el mismo sector"], "ans": 1, "why": "3.5.1: aeronaves que entran en una parte especificada de espacio aéreo (sector), sobrevuelan un punto, despegan o aterrizan en un aeródromo (o grupo de aeródromos) en un determinado período; la capacidad puede variar según la hora del día y el día de la semana.", "src": "Manual 6 (nov. 2026), capítulo 3.5.1, p. 21", "note": ""}, {"n": 169, "stem": "Para evaluar la demanda frente a la capacidad del ATC se tienen en cuenta:", "opts": ["Solo los vuelos IFR con CTOT asignado por una regulación", "Los vuelos IFR y VFR, excepto los vuelos operacionales", "Solo los vuelos IFR con plan aceptado (ACK) y sin FLS", "Todos los IFR, incluida la parte IFR de los mixtos, sea cual sea su estatus"], "ans": 3, "why": "3.5.1: «se tienen en cuenta todos los vuelos IFR, incluyendo la parte IFR de los vuelos mixtos IFR/VFR, independientemente de su estatus».", "src": "Manual 6 (nov. 2026), capítulo 3.5.1, p. 21", "note": ""}, {"n": 170, "stem": "En la figura de tipos de capacidad del manual, la capacidad declarada aparece también con el nombre de capacidad:", "opts": ["Publicada", "Sostenible", "Disponible", "Nominal"], "ans": 0, "why": "Los rótulos de la figura son: capacidad sostenible, capacidad máxima, capacidad declarada (o publicada) y capacidad disponible.", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 21 (figura)", "note": ""}, {"n": 171, "stem": "En la tabla de tipos de capacidad, ¿cuál se define como «la capacidad notificada a los organismos apropiados, basada en la capacidad sostenible»?", "opts": ["La capacidad máxima", "La capacidad disponible", "La capacidad declarada", "La capacidad sostenible"], "ans": 2, "why": "Es la definición de la columna DECLARADA, que no tiene más filas rellenas en la tabla. Sostenible y disponible son «la máxima afluencia de tránsito alcanzable»; máxima, «la máxima afluencia de tránsito que puede alcanzarse solamente».", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 21 (tabla)", "note": ""}, {"n": 172, "stem": "En la tabla de tipos de capacidad, la capacidad máxima se refiere a la unidad de tiempo especificada, que normalmente es:", "opts": ["15 minutos", "30 minutos", "24 horas", "Una hora"], "ans": 3, "why": "Fila TIEMPO de la columna MÁXIMA: «en la unidad de tiempo especificada, normalmente una hora».", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 173, "stem": "¿Qué tipo de capacidad se refiere a una unidad de tiempo específica «en función de las condiciones reales del sistema ATS en cada momento»?", "opts": ["La sostenible", "La máxima", "La declarada", "La disponible"], "ans": 3, "why": "Fila TIEMPO de la columna DISPONIBLE. La sostenible dice solo «en una unidad de tiempo específica» y la máxima, «normalmente una hora».", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 174, "stem": "En la tabla de tipos de capacidad, ¿cuál se alcanza «cumpliéndose los requisitos en materia de seguridad y sin que se produzca ningún incremento excesivo en el factor medio de demora»?", "opts": ["La capacidad sostenible", "La capacidad máxima", "La capacidad declarada", "La capacidad disponible"], "ans": 1, "why": "Es la fila REQUISITOS de la columna MÁXIMA. Sostenible y disponible dicen «de conformidad con los requisitos en materia de seguridad y el factor medio de demora aceptable».", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 175, "stem": "Dentro de ENAIRE, la capacidad declarada de cada Torre la determina la Dirección de Operaciones en el documento:", "opts": ["«Sectores, configuraciones operativas y capacidades declaradas»", "«Capacidad ATC. Valores de referencia»", "«Plan Diario ATFCM»", "«Plan de Utilización del Espacio Aéreo»"], "ans": 1, "why": "3.5.3 a: la Dirección de Operaciones determina la capacidad declarada en «Sectores, configuraciones operativas y capacidades declaradas» y la de cada Torre en «Capacidad ATC. Valores de referencia». Ambos documentos se publican para cada región.", "src": "Manual 6 (nov. 2026), capítulo 3.5.3, p. 22", "note": ""}, {"n": 176, "stem": "Según 3.5.3, ¿quién determina la capacidad y calcula el nivel de la demanda por encima del cual deberán aplicarse medidas de gestión de afluencia?", "opts": ["El NMOC de EUROCONTROL, con los datos del sistema ETFMS", "El proveedor de servicios de tránsito aéreo, según un funcionamiento óptimo", "La AMC, al elaborar el AUP del día anterior a las operaciones", "La FMP, a petición del operador de aeronave afectado"], "ans": 1, "why": "«El proveedor de servicios de tránsito aéreo, basándose en un funcionamiento óptimo del sistema, determinará la capacidad y calculará el nivel de la demanda por encima del cual deberán aplicarse medidas de gestión de afluencia de tránsito».", "src": "Manual 6 (nov. 2026), capítulo 3.5.3, p. 22", "note": ""}, {"n": 177, "stem": "En fase táctica, la capacidad disponible la determina:", "opts": ["Cada unidad ATS; si la causa se conoce antes, puede participar la Dirección de Operaciones", "Siempre la Dirección de Operaciones, mediante su documento anual", "El NMOC, a propuesta de la FMP afectada y con datos del ETFMS", "La UCATM, en su papel de célula de crisis a nivel nacional"], "ans": 0, "why": "3.5.3 b: en condiciones normales coincide con la declarada; en fase táctica la determina cada unidad ATS y, si la circunstancia que origina el cambio se conoce con mayor antelación, la Dirección de Operaciones podrá participar.", "src": "Manual 6 (nov. 2026), capítulo 3.5.3, p. 22", "note": ""}, {"n": 178, "stem": "Según el manual, ¿quién realiza la detección de los desequilibrios entre capacidad y demanda?", "opts": ["El Jefe de Sala del ACC", "El técnico de control de afluencia (TCA)", "El Supervisor de servicio", "El NMOC de EUROCONTROL"], "ans": 1, "why": "3.5.4: la detección la realizará el TCA, basada en la monitorización de los <em>traffic load</em> de todos los volúmenes de tráfico (TV) de su jurisdicción: HEC, OCC Peak y OCC Sustained.", "src": "Manual 6 (nov. 2026), capítulo 3.5.4, p. 23", "note": ""}, {"n": 179, "stem": "Según el manual, los parámetros OCC Peak y OCC Sustained se monitorizan:", "opts": ["En todos los volúmenes de tráfico, sin excepción", "En los TV con umbrales OTMV definidos", "Solo en la fase pretáctica", "Solo en los aeródromos coordinados"], "ans": 1, "why": "La lista de 3.5.4 es: HEC; OCC Peak (en TVs con umbrales OTMV definidos); OCC Sustained (<em>Occurrence / Elapse</em>) (en TVs con umbrales OTMV definidos).", "src": "Manual 6 (nov. 2026), capítulo 3.5.4, p. 23", "note": ""}, {"n": 180, "stem": "En la gráfica de conteo de tráfico del NM que reproduce el manual con el rótulo «Sobrecarga», ¿qué valores muestra la ventana de la franja 14:40-15:40?", "opts": ["Hourly Capacity 34 y Traffic Load 35", "Hourly Capacity 35 y Traffic Load 34", "Hourly Capacity 36 y Traffic Load 40", "Hourly Capacity 30 y Traffic Load 35"], "ans": 0, "why": "La ventana dice «From 14:40 To 15:40», «Hourly Capacity: 34», «Traffic Load: 35», «Traffic Demand: 35» y «Regulated Demand: 35»: la carga supera la capacidad horaria, de ahí la sobrecarga.", "src": "Manual 6 (nov. 2026), capítulo 3.5.4, p. 24 (figura)", "note": ""}, {"n": 181, "stem": "El manual llama STAM a las medidas que no implican regulaciones y desarrolla la sigla como:", "opts": ["Short Term ATFCM Measures", "Short Term Affluence Measures", "Strategic Traffic Allocation Method", "Sector Traffic Adjustment Measures"], "ans": 1, "why": "3.5.5 b: «medidas que no impliquen regulaciones (STAM o Short Term Affluence Measures)». EUROCONTROL usa «Short Term ATFCM Measures»; si la pregunta cita el manual, vale su grafía.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5, p. 24", "note": ""}, {"n": 182, "stem": "La configuración dinámica proporciona más capacidad al sistema porque permite:", "opts": ["Abrir todos los sectores posibles durante toda la jornada", "Cerrar sectores en cuanto se aplica una regulación", "Asignar CTOT sin necesidad de coordinar con el NMOC", "Reservar recursos en baja demanda para usarlos cuando la demanda aumente"], "ans": 3, "why": "La aplicación de esta técnica permite reservar los recursos disponibles durante los periodos de baja demanda para utilizarlos cuando esta aumente, proveyendo así al sistema de una mayor capacidad.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 183, "stem": "Según el manual, el rerouting (medida ATFCM) se aplica en los ACC para:", "opts": ["Distribuir mejor el tráfico y reducir la complejidad y ocupación del sector", "Espaciar los despegues de un aeródromo a intervalos regulares", "Seleccionar unos pocos vuelos y aplicar solo a ellos un CTOT", "Restringir los niveles utilizables entre dos ACC adyacentes"], "ans": 0, "why": "El rerouting requiere modificar la ruta presentada por un operador para solventar problemas de capacidad y minimizar demoras; se aplica en los ACC para conseguir una mejor distribución del tráfico y reducir la complejidad y ocupación del sector que se prevé sobrecargado.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 184, "stem": "Si el rerouting se aplica en fase táctica, la coordinación se hace:", "opts": ["Desde la torre de salida, directamente con el piloto", "Desde la AMC, mediante la publicación de un UUP", "Desde la FMP, directamente con el operador o a través del NMOC", "Desde la UCATM, en su papel de célula de crisis"], "ans": 2, "why": "En táctica, la coordinación se hace desde la FMP, directamente con el operador de aeronave o a través del NMOC, y podría requerir un nuevo plan de vuelo según la antelación, si el tráfico ha despegado o los sectores y dependencias afectados.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 185, "stem": "El MDI consiste en espaciar los despegues de un aeródromo en intervalos regulares para:", "opts": ["Reducir el ruido en las horas nocturnas del aeródromo", "Garantizar la separación por estela entre aeronaves pesadas", "Dar tiempo a la ARO para procesar los planes de vuelo", "Evitar cargar el sector saturado con salidas acumuladas o aliviar el propio aeródromo"], "ans": 3, "why": "El MDI espacia los despegues para evitar cargar al sector saturado con una acumulación de salidas, o para aliviar una situación de saturación en el propio aeródromo.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 186, "stem": "¿A qué técnica corresponde la frase «medida aplicada en el corto plazo entre unidades ATC adyacentes [...] para conseguir una disminución de la complejidad del sector, reduciendo la necesidad de poner regulaciones»?", "opts": ["Cherry picking", "MDI (Minimum Departure Interval)", "Configuración dinámica", "Miles in Trail"], "ans": 3, "why": "En la tabla de la p. 27 es la segunda viñeta de MILES IN TRAIL. El cherry picking, en la fila siguiente, es la regulación para picos cortos de un número limitado de vuelos.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 27 (tabla)", "note": ""}, {"n": 187, "stem": "Según el manual, la regulación cherry pick:", "opts": ["Afecta a todos los vuelos del volumen regulado", "Solo se aplica en la fase estratégica", "Puede utilizarse en combinación con otras medidas", "Nunca puede combinarse con otras medidas"], "ans": 2, "why": "Consiste en seleccionar vuelos y aplicar medidas ATFCM solo a esos vuelos, y «puede utilizarse en combinación con otras medidas».", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 27", "note": ""}, {"n": 188, "stem": "En las dependencias sin Jefe de Sala situadas en el espacio aéreo que gestiona el ACC, y en las que hay supervisor o supervisor jefe, las medidas tácticas de control de afluencia:", "opts": ["Se coordinan con la FMP sin aprobación del Jefe de Sala", "Las determina y aprueba el propio supervisor", "Las determina el NMOC y las comunica a la FMP", "Las determina el supervisor y las remite al Jefe de Sala para su aprobación"], "ans": 3, "why": "3.5.5.2 c: el supervisor o supervisor jefe las determina y las remite al Jefe de Sala para su aprobación. A es el caso d, de las dependencias en las que ENAIRE no es proveedor.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 c, p. 27", "note": ""}, {"n": 189, "stem": "Según 3.5.5.2, las medidas de control de afluencia que aprueba el Jefe de Sala del ACC deberán:", "opts": ["Estar siempre debidamente justificadas, dejando constancia escrita de ellas", "Comunicarse por radio a todos los pilotos afectados", "Ser ratificadas por la UCATM antes de aplicarse", "Publicarse en el AUP del día siguiente"], "ans": 0, "why": "3.5.5.2 b: «Estas medidas deberán estar siempre debidamente justificadas y se dejará constancia escrita de ellas». La FMP coordina la regulación con el NMOC (punto a).", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 b, p. 27", "note": ""}, {"n": 190, "stem": "¿Cuál NO es una de las herramientas que el manual cita para determinar el rate de regulación en sectores con OTMV definidos?", "opts": ["ASIM", "IMPACT", "SIMEX", "CASA"], "ans": 3, "why": "El manual cita ASIM, IMPACT, SIMEX «u otras que permiten hacer simulaciones con datos de Eurocontrol». CASA es el sistema de asignación de slots del NM.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 28", "note": ""}, {"n": 191, "stem": "En sectores con OTMV definidos, cuando hay que tomar medidas con una antelación superior al ámbito temporal estimado de uso de la ocupación, se puede:", "opts": ["Aplicar un MDI en fase pretáctica", "Aplicar el procedimiento de los sectores sin OTMV, basado solo en el HEC", "Regular a la capacidad máxima durante 60 minutos", "Esperar a la fase táctica sin tomar ninguna medida"], "ans": 1, "why": "3.5.5.2, sectores con OTMV, punto b: se podrá optar por implementar el procedimiento para sectores sin OTMV definidos (basado únicamente en HEC). El MDI nunca se aplica en pretáctica.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 28", "note": ""}, {"n": 192, "stem": "Una vez acordadas las medidas de regulación, ¿quién solicita al NM su implantación?", "opts": ["El TCA", "El Jefe de Sala", "El controlador de torre", "La UCATM"], "ans": 0, "why": "«El TCA solicitará al NM la implantación de las medidas acordadas». La decisión final de implantar, modificar o cancelar pertenece a la FMP.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 29", "note": ""}, {"n": 193, "stem": "¿Quién es el responsable de la vigilancia de los turnos de salida en el aeródromo de despegue?", "opts": ["El técnico de control de afluencia (TCA)", "El operador de aeronave", "El NMOC", "El controlador de tránsito aéreo (CTA)"], "ans": 3, "why": "3.5.5.3: «El controlador de tránsito aéreo (CTA) es el responsable de la vigilancia de los turnos de salida en el aeródromo de despegue»; los procedimientos exactos dependen de cómo esté organizado el servicio en cada aeródromo.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3, p. 29", "note": ""}, {"n": 194, "stem": "Según las pautas de asignación de CTOT, el ATC:", "opts": ["Asigna por sí mismo un nuevo CTOT a cada vuelo", "Solo informa al operador del CTOT, sin más intervención", "Ayuda a los AO a cumplir el CTOT o a coordinar su revisión", "Puede ignorar el CTOT si el vuelo está listo antes"], "ans": 2, "why": "Pauta c: «ATC proporcionará la asistencia necesaria a las AOs para cumplir con el CTOT o para coordinar una revisión del mismo». Pauta d: los explotadores deben informarse y cumplir con los procedimientos y medidas ATFCM generales.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3, p. 29", "note": ""}, {"n": 195, "stem": "Según la lista de vuelos exentos de regulación del manual, un vuelo médico o de ambulancia está exento:", "opts": ["Siempre, sea cual sea el motivo del vuelo", "Cuando están en juego vidas humanas", "Solo si lo opera una unidad militar", "Nunca: solo lo están los vuelos de búsqueda y salvamento"], "ans": 1, "why": "La lista dice «Vuelos médicos/ambulancias cuando estén en juego vidas humanas».", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.4, p. 30", "note": ""}, {"n": 196, "stem": "Según el manual, la cancelación de una regulación puede ocasionar:", "opts": ["La anulación automática de los planes de vuelo que tenían un CTOT asignado", "La suspensión (FLS) de todos los vuelos del volumen que estaba regulado", "Una reducción inmediata de la capacidad declarada de los sectores afectados", "Un incremento repentino de la carga de tráfico e impacto negativo en otros ACC"], "ans": 3, "why": "3.5.5.5: «La cancelación de una regulación puede ocasionar un incremento repentino en la carga de tráfico, y también puede producir un impacto negativo para otros ACC».", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.5, p. 30", "note": ""}, {"n": 197, "stem": "En el procedimiento de tres pasos que debería seguir el personal FMP para modificar o cancelar una regulación, el PRIMER paso es:", "opts": ["Monitorizar el impacto de la actualización en la carga de tráfico", "Tomar las medidas necesarias para evitar una nueva sobrecarga", "Contactar cuanto antes con el personal NM, coordinando jefe de sala y NMOC", "Publicar la cancelación en el AUP o en un UUP"], "ans": 2, "why": "Figura: 1) contactar con el personal NM lo antes posible para informar sobre el cambio y tomar las medidas necesarias previa coordinación entre jefe de sala y NMOC; 2) monitorizar el impacto (A); 3) evitar una nueva sobrecarga (B).", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.5, p. 30 (figura)", "note": ""}, {"n": 198, "stem": "En el FUA, el Nivel 1 (estratégico) consiste en:", "opts": ["Una planificación a largo plazo de la política nacional, mediante un proceso conjunto civil/militar", "La asignación temporal diaria del espacio aéreo a través de la AMC, el día anterior", "La gestión del uso del espacio aéreo en tiempo real", "La publicación del UUP para actualizar el AUP"], "ans": 0, "why": "Nivel 1: planificación a largo plazo de la política nacional de gestión del espacio aéreo y sus estructuras, mediante un proceso conjunto civil/militar. B es el nivel 2 y C el nivel 3.", "src": "Manual 6 (nov. 2026), capítulo 4.1, p. 31", "note": ""}, {"n": 199, "stem": "Según el manual, cada CDR que se publica en la sección ENR 3.5-1:", "opts": ["Es de categoría CDR 2 y solo se planifica de noche", "Lleva asociada una ruta alternativa", "Solo puede utilizarla el tráfico militar (CAO)", "Está cerrada salvo que un UUP la abra"], "ans": 1, "why": "4.2 c: las CDR son rutas o tramos de rutas ATS no permanentes, que solo se pueden planificar y utilizar bajo ciertas condiciones; «cada CDR que se publica en la sección ENR 3.5-1 lleva asociada una ruta alternativa».", "src": "Manual 6 (nov. 2026), capítulo 4.2 c, p. 31", "note": ""}, {"n": 200, "stem": "Según el manual, las CDR 1:", "opts": ["Se establecen en la fase pretáctica (nivel 2) y solo se planifican si el AUP las abre", "Se establecen en la fase táctica (nivel 3) y solo las asigna el ATC en tiempo real", "Se establecen en la fase estratégica (nivel 1) y se pueden planificar permanentemente en los FPL", "Se establecen en la fase estratégica (nivel 1) y nunca pueden incluirse en un FPL"], "ans": 2, "why": "Las CDR 1 se establecen en la fase estratégica (Nivel 1), están disponibles la mayor parte del tiempo y se pueden planificar permanentemente en los FPL; a diario el AUP distribuye las CDR1 que se cierran.", "src": "Manual 6 (nov. 2026), capítulo 4.2 c, p. 31", "note": ""}, {"n": 201, "stem": "Las Áreas Temporalmente Segregadas (TSA) se establecen para dar respuesta a las necesidades:", "opts": ["Solo militares, en misiones tácticas o de defensa aérea", "Solo civiles, de trabajos aéreos especializados", "De los aeródromos con servicio AFIS", "Civiles y militares que requieran una reserva temporal de espacio aéreo"], "ans": 3, "why": "4.2 a: las TSA son áreas de dimensiones predefinidas que se establecen para dar respuesta a las necesidades civiles y militares que requieran una reserva temporal de espacio aéreo; no se permite el tránsito de otros tráficos.", "src": "Manual 6 (nov. 2026), capítulo 4.2 a, p. 31", "note": ""}, {"n": 202, "stem": "La información contenida en el AUP puede actualizarse mediante:", "opts": ["El UUP (<em>Updated Use Plan</em>)", "Un NOTAM del ACC afectado", "El Plan Diario ATFCM (ADP)", "Un mensaje CHG de la AMC"], "ans": 0, "why": "4.2.2: «La información contenida en AUP puede actualizarse mediante el UUP (Updated Use Plan)». El glosario lo llama «Plan de Utilización de Espacio Aéreo actualizado».", "src": "Manual 6 (nov. 2026), capítulo 4.2.2, p. 32; capítulo 5 (Acrónimos), p. 35", "note": ""}, {"n": 203, "stem": "Según el glosario del manual, CAO significa:", "opts": ["Circulación aérea general / <em>General air traffic</em>", "Circulación aérea operativa / <em>Operational air traffic</em>", "Centro de asignación operativa / <em>Operational allocation centre</em>", "Control de afluencia operativo / <em>Operational flow control</em>"], "ans": 1, "why": "CAO = Circulación aérea operativa (<em>Operational air traffic</em>); CAG = Circulación aérea general (<em>General air traffic</em>).", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 33", "note": ""}, {"n": 204, "stem": "En el glosario del manual, AIRAC es:", "opts": ["Oficina de información aeronáutica / <em>Aeronautical information office</em>", "Red de telecomunicaciones fijas aeronáuticas / <em>Aeronautical fixed telecommunication network</em>", "Servicio de información de vuelo de aeródromo / <em>Aerodrome flight information service</em>", "Reglamentación y control de la información aeronáutica / <em>Aeronautical information regulation and control</em>"], "ans": 3, "why": "AIRAC = Reglamentación y control de la información aeronáutica. A es AIO, B es AFTN y C es AFIS, todos en la misma página del glosario.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 33", "note": ""}, {"n": 205, "stem": "En el glosario del manual, TRA figura como «Espacio aéreo temporalmente reservado / <em>Temporary reserved airspace</em>». ¿Cómo lo denomina el apartado 4.2?", "opts": ["Área Temporalmente Segregada", "Área Temporalmente Restringida", "Ruta condicional temporal", "Espacio aéreo de coordinación previa"], "ans": 1, "why": "En 4.2 b, TRA = «Áreas Temporalmente Restringidas»; el glosario dice «temporalmente reservado». El TSA es el área temporalmente segregada (A) y PCA, el espacio aéreo de coordinación previa (D).", "src": "Manual 6 (nov. 2026), capítulo 4.2 b, p. 31; capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 206, "stem": "Según el glosario del manual, PCA es:", "opts": ["Espacio aéreo de coordinación reducida / <em>Reduced coordination airspace</em>", "Posición de control de afluencia / <em>Flow control position</em>", "Espacio aéreo de coordinación previa / <em>Prior coordination airspace</em>", "Plan de capacidad anual / <em>Planned capacity allocation</em>"], "ans": 2, "why": "PCA = Espacio aéreo de coordinación previa. El espacio aéreo de coordinación reducida es uno de los dos significados de RCA; la posición de gestión de afluencia es la FMP.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 207, "stem": "Según el glosario del manual, OCC significa:", "opts": ["Operational Control Centre (Centro de control operacional)", "Overload Capacity Count (Conteo de sobrecarga)", "Occurrence (Ocurrencia)", "Occupancy (Ocupación)"], "ans": 3, "why": "El glosario: «OCC — Occupancy (Ocupación)». <em>Occurrence / Elapse</em> son los parámetros del OCC Sustained en 3.5.4.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 208, "stem": "En el glosario del manual, UCATM corresponde en inglés a:", "opts": ["Central Air Traffic Management Unit", "Upper Control Area Traffic Management", "Unified Civil Air Traffic Management", "Unit for Capacity and Air Traffic Management"], "ans": 0, "why": "«UCATM — Unidad central de gestión de tránsito aéreo / Central Air Traffic Management Unit».", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 35", "note": ""}, {"n": 209, "stem": "La bibliografía del manual cita SERA como:", "opts": ["Reglamento UE 2017/373", "Reglamento UE 923/2012", "Reglamento UE 1035/2011", "Reglamento UE 2020/469"], "ans": 1, "why": "La bibliografía recoge «Reglamento UE 923/2012 (SERA)».", "src": "Manual 6 (nov. 2026), capítulo 6 (Bibliografía), p. 36", "note": ""}, {"n": 210, "stem": "En la bibliografía del manual, el Doc 9613 de la OACI es el:", "opts": ["Doc de Gestión del Tránsito Aéreo", "Doc de Abreviaturas y Códigos de la OACI", "Reglamento del Aire", "Manual de navegación basada en la performance (PBN)"], "ans": 3, "why": "Bibliografía: Doc 4444, Gestión del Tránsito Aéreo; Doc 8400, Abreviaturas y Códigos de la OACI; Doc 9613, Manual de navegación basada en la performance (PBN); el Reglamento del Aire es el Anexo 2.", "src": "Manual 6 (nov. 2026), capítulo 6 (Bibliografía), p. 36", "note": ""}, {"n": 211, "stem": "En la bibliografía del manual, ¿qué documento de la OACI corresponde a «Servicios de Tránsito Aéreo»?", "opts": ["Anexo 2", "Anexo 11", "Doc 8400", "Doc 4444"], "ans": 1, "why": "Bibliografía: Anexo 2, Reglamento del Aire; Anexo 11, Servicios de Tránsito Aéreo; Doc 4444, Gestión del Tránsito Aéreo; Doc 8400, Abreviaturas y Códigos.", "src": "Manual 6 (nov. 2026), capítulo 6 (Bibliografía), p. 36", "note": ""}, {"n": 212, "stem": "¿A través de qué estructura flexible del FUA no se puede permitir el tránsito de otros tráficos?", "opts": ["TRA", "CDR", "TSA", "PCA"], "ans": 2, "why": "Las Áreas Temporalmente Segregadas (TSA) son áreas «a través de las cuales no se puede permitir el tránsito de otros tráficos»; por las TRA sí puede transitar otro tráfico bajo autorización ATC. Las CDR son rutas y el PCA es un espacio aéreo de coordinación previa. El examen real de febrero de 2026 preguntó este dato.", "src": "Manual 6 (nov. 2026), capítulo 4.2, p. 31", "note": ""}, {"n": 213, "stem": "¿Qué mensaje se transmite inmediatamente después de la salida de una aeronave cuyos datos básicos de plan de vuelo ya se distribuyeron?", "opts": ["DLA", "DEP", "ARR", "EST"], "ans": 1, "why": "«Los mensajes DEP se transmitirán inmediatamente después de la salida de una aeronave con respecto a la cual se hayan distribuido anteriormente datos básicos de plan de vuelo», salvo acuerdo regional. DLA es la demora, ARR la llegada y EST las estimadas sobre un punto. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 6 (nov. 2026), capítulo 2.8, p. 13", "note": ""}, {"n": 214, "stem": "Los mensajes de socorro de la red AFTN llevan el indicador de prioridad:", "opts": ["DD", "FF", "GG", "SS"], "ans": 3, "why": "Tabla de prioridades: SS, mensajes de socorro; DD, de urgencia; FF, de plan de vuelo y de movimiento y control; GG, meteorológicos, de regularidad y AIS; KK, administrativos. Lo preguntó el examen real de febrero de 2026.", "src": "Manual 6 (nov. 2026), capítulo 2.2, pp. 9-10", "note": ""}, {"n": 215, "stem": "Dentro del NM, ¿qué sistema valida y distribuye los planes de vuelo?", "opts": ["IFPS", "ETFMS", "CASA", "ENV"], "ans": 0, "why": "El manual enumera los sistemas del NM: ETFMS monitoriza los datos de tráfico y permite implantar las medidas ATFCM, CASA asigna los slots, ENV es la base de datos del área de operaciones de la red e IFPS es «el sistema para la validación y distribución de los planes de vuelo». Lo preguntó el examen real de febrero de 2026.", "src": "Manual 6 (nov. 2026), capítulo 3.2, pp. 16-17; capítulo 3.4, p. 19", "note": ""}, {"n": 216, "stem": "¿Cuál de estas tareas corresponde al IFPS?", "opts": ["Asignar los slots de los vuelos regulados en el área ECAC", "Determinar la capacidad declarada de cada sector de control", "Distribuir los datos del plan de vuelo en el área ECAC", "Confeccionar el AUP el día anterior a las operaciones"], "ans": 2, "why": "El IFPS recepciona los planes de vuelo, hace su procesado inicial (validación), distribuye los datos de plan de vuelo en el área ECAC a las unidades ATC y proporciona a operaciones del NM datos de FPL para la planificación ATFCM, la monitorización y la asignación de slot. Los slots los asigna CASA, la capacidad declarada la determina la Dirección de Operaciones y el AUP lo confecciona la AMC. El examen real de 2023 preguntó las tareas del IFPS.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 19", "note": ""}, {"n": 217, "stem": "Una aeronave aterriza en un aeródromo de alternativa. ¿Cuál de estos destinatarios recibe el mensaje ARR?", "opts": ["El explotador de la aeronave", "Todos los destinatarios de los datos básicos del plan de vuelo", "La oficina ARO del aeródromo de salida", "Únicamente la torre del aeródromo de destino"], "ans": 2, "why": "En aterrizaje en un aeródromo de alternativa el ARR va al ACC o FIC en cuya área está el aeródromo de llegada, a la torre del aeródromo de destino, a la oficina de notificación ATS (ARO) del aeródromo de salida y a los ACC o FIC de cada FIR o UIR que la aeronave habría cruzado. «Todos los destinatarios de los datos básicos» es la regla del DEP. El examen real de 2023 usó estas mismas trampas.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 218, "stem": "¿Cuál es una función de la UCATM «relativa a ATFM»?", "opts": ["Participar en la gestión de la parte civil de la AMC", "Gestionar la base de datos del área de operaciones de la red (ENV)", "Monitorizar el sistema de validación y distribución de los planes de vuelo (IFPS)", "Centralizar las funciones de las FMP cuando no estén operativas"], "ans": 3, "why": "Funciones de la UCATM relativas a ATFM: gestionar y coordinar la fase estratégica, supervisar las actividades pretácticas y tácticas, centralizar a nivel nacional las funciones de las FMP cuando no estén operativas o siempre que así se determine, actuar como célula de crisis y asesorar al usuario. Participar en la parte civil de la AMC es su función relativa al FUA; ENV e IFPS son sistemas del NM. Lo preguntó el examen real de 2023.", "src": "Manual 6 (nov. 2026), capítulo 3.3, p. 17", "note": ""}, {"n": 219, "stem": "Si la salida de una aeronave cuyos datos de plan de vuelo ya se enviaron sufre una demora respecto a la EOBT, se transmite un mensaje:", "opts": ["DLA", "CHG", "DEP", "CNL"], "ans": 0, "why": "«Cuando la salida de una aeronave para la cual se hayan enviado datos del plan de vuelo sufra una demora con respecto a la hora prevista de fuera calzos (EOBT) indicada en el plan de vuelo, se transmitirá un mensaje DLA». Lo preguntó el examen real de 2017.", "src": "Manual 6 (nov. 2026), capítulo 2.5, p. 13", "note": ""}, {"n": 220, "stem": "¿Qué datos básicos de un FPL ya transmitido pueden modificarse con un mensaje CHG?", "opts": ["Todos, porque el CHG sirve para cambiar cualquier dato básico del plan de vuelo", "Todos salvo los aeródromos de salida y de destino; la identificación sí se cambia", "Todos salvo la identificación de la aeronave, la salida, el destino y la EOBT", "Todos salvo la identificación de la aeronave y los aeródromos de salida y de destino"], "ans": 3, "why": "Los campos que no pueden modificarse con un CHG son la identificación de la aeronave, el aeródromo de salida y el aeródromo de destino; para cambiarlos hay que cancelar el FPL y presentar uno nuevo. La EOBT no está entre esos campos; la demora respecto a la EOBT se comunica con un DLA. Lo preguntó el examen real de 2017.", "src": "Manual 6 (nov. 2026), capítulo 2.6, p. 13", "note": ""}, {"n": 221, "stem": "El plan de vuelo que una aeronave en vuelo transmite a una estación de telecomunicaciones aeronáuticas que sirve a una dependencia ATS se denomina:", "opts": ["RPL", "SPL", "AFIL", "RFP"], "ans": 2, "why": "«En casos excepcionales, una aeronave en vuelo puede transmitir un plan de vuelo (AFIL) a una estación de telecomunicaciones aeronáuticas que sirve a una dependencia ATS». RPL es el plan repetitivo, SPL el suplementario y RFP el plan que reemplaza. Lo preguntó el examen real de 2017.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 222, "stem": "Según el glosario del manual, RFP significa:", "opts": ["Repetitive flight plan", "Replacement flight plan", "Rerouting flight plan", "Revised flight plan"], "ans": 1, "why": "RFP: «Plan de vuelo que reemplaza / Replacement flight plan». <em>Repetitive flight plan</em> es el RPL. El examen real de 2017 preguntó el significado del procedimiento RFP.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34; capítulo 1.2.1, p. 6", "note": ""}, {"n": 223, "stem": "La categoría de mensajes de emergencia comprende:", "opts": ["Solo los mensajes de socorro y tráfico de socorro", "Los mensajes de socorro y tráfico de socorro y los de urgencia", "Solo los mensajes relativos a la fase de alerta", "Los mensajes de urgencia y los de movimiento y control con prioridad FF"], "ans": 1, "why": "Los mensajes de emergencia comprenden los de socorro y tráfico de socorro, incluidos los de fase de peligro (prioridad SS), y los de urgencia, incluidos los de alerta y los de fase de incertidumbre (prioridad DD). Lo preguntó el examen real de 2017.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 10", "note": ""}, {"n": 224, "stem": "El volumen definido de espacio aéreo para uso específico de una actividad aeronáutica, a través del cual se puede permitir el tránsito de otro tráfico bajo autorización ATC, es una:", "opts": ["TRA", "TSA", "CDR", "PCA"], "ans": 0, "why": "Es la definición de las Áreas Temporalmente Restringidas (TRA). Por una TSA no se puede permitir el tránsito de otros tráficos; una CDR es una ruta condicional y PCA es el espacio aéreo de coordinación previa.", "src": "Manual 6 (nov. 2026), capítulo 4.2, p. 31", "note": ""}, {"n": 225, "stem": "Según el glosario del manual, ETOT es la:", "opts": ["Hora calculada de despegue", "Hora prevista de fuera calzos", "Hora estimada de llegada", "Hora estimada de despegue"], "ans": 3, "why": "ETOT: «Hora estimada de despegue / Estimated take-off time». La hora calculada de despegue es el CTOT y la hora prevista de fuera calzos, la EOBT.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 226, "stem": "Según el glosario del manual, CAG significa:", "opts": ["Circulación aérea operativa", "Circulación aérea general", "Control de afluencia general", "Célula de asignación de gestión"], "ans": 1, "why": "CAG: «Circulación aérea general / General air traffic»; CAO es la circulación aérea operativa (<em>Operational air traffic</em>). Los vuelos IFR y GAT pueden presentar el plan directamente al IFPS.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 33", "note": ""}, {"n": 227, "stem": "Según el glosario del manual, AIO es la:", "opts": ["Oficina de información aeronáutica", "Oficina de notificación de los servicios de tránsito aéreo", "Centro de operaciones del gestor de red", "Célula de gestión de espacio aéreo civil/militar"], "ans": 0, "why": "AIO: «Oficina de información aeronáutica / Aeronautical information office». La oficina de notificación ATS es la ARO, el centro de operaciones del gestor de red el NMOC y la célula de gestión del espacio aéreo la AMC.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 33", "note": ""}, {"n": 228, "stem": "Según la figura de ETOT y CTOT del manual, ¿qué tolerancia tiene la hora de despegue de un vuelo regulado (CTOT)?", "opts": ["±15'", "±5'", "-5'/+10'", "-10'/+5'"], "ans": 2, "why": "La figura dice que el piloto debe cumplir su CTOT y que «esta hora de despegue cuenta con una tolerancia de -5+10' que está exclusivamente a disposición ATC cuando tenga que establecer una secuencia de tráficos en despegue». El margen de ±15' es el del ETOT de un vuelo no regulado.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3, p. 29 (figura)", "note": ""}, {"n": 229, "stem": "Según la figura de ETOT y CTOT del manual, un vuelo no regulado debe ajustarse a su ETOT dentro de un margen de:", "opts": ["±5'", "-5'/+10'", "±10'", "±15'"], "ans": 3, "why": "«Un vuelo no regulado tiene una ETOT que se calcula añadiendo a la hora EOBT el tiempo de rodaje»; el piloto es el responsable de cumplirla y ajustarse a ella «dentro del margen de ±15'». La tolerancia -5'/+10' es la del CTOT.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3, p. 29 (figura)", "note": ""}, {"n": 230, "stem": "Un vuelo regulado tiene una EOBT de las 1000, un tiempo de rodaje de 15 minutos y una demora de 20 minutos. Según la fórmula de la figura del manual, su CTOT es:", "opts": ["1035", "1015", "1020", "1050"], "ans": 0, "why": "CTOT = EOBT + TAXI TIME + DELAY = 1000 + 15 + 20 = 1035. Sin la demora se obtendría el ETOT de un vuelo no regulado (ETOT = EOBT + TAXI TIME = 1015).", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3, p. 29 (figura)", "note": ""}, {"n": 231, "stem": "En la tabla de mensajes de coordinación, el mensaje de «estimadas sobre un determinado punto» es el:", "opts": ["CPL", "EST", "CDN", "ACP"], "ans": 1, "why": "Mensajes de coordinación: plan de vuelo actualizado (CPL), estimadas sobre un determinado punto (EST), coordinación (CDN), aceptación (ACP) y acuse de recibo lógico (LAM).", "src": "Manual 6 (nov. 2026), capítulo 2.4, p. 12", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en
