Plan de vuelo y gestión de afluencia (ATFCM)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el manual, el plan de vuelo se describe mejor como:", "opts": ["Una declaración de intenciones del piloto al mando y una solicitud de servicios ATS", "Una autorización que emite el ATC antes de la puesta en marcha", "Un contrato entre el operador y el Gestor de Red", "Un informe del vuelo que se elabora después del aterrizaje"], "ans": 0, "why": "El manual lo define como una «declaración de intenciones»: el piloto al mando presenta el manifiesto de una acción proyectada y un requerimiento de servicios ATS para garantizar la seguridad de pasajeros y aeronaves. No es una autorización (B), no es un contrato (C) y se presenta antes del vuelo, no después (D).", "src": "Manual 6 (nov. 2026), Introducción, p. 4", "note": ""}, {"n": 2, "stem": "Según el manual, ¿qué organismo desempeña en Europa las funciones centrales de tratamiento de planes de vuelo, datos del espacio aéreo y ATFM?", "opts": ["El NMOC (Centro de Operaciones del Gestor de Red) de EUROCONTROL", "La Comisión de Aeronavegación de la OACI", "La Agencia Estatal de Seguridad Aérea (AESA)", "La secretaría de la Conferencia Europea de Aviación Civil"], "ans": 0, "why": "La introducción atribuye estas funciones centrales al Centro de Operaciones del Gestor de la Red (NMOC) de EUROCONTROL. De la CEAC (ECAC) solo se dice que es la zona donde el crecimiento del tráfico hizo necesarios estos mecanismos.", "src": "Manual 6 (nov. 2026), Introducción, p. 4", "note": ""}, {"n": 3, "stem": "¿Cuál de los siguientes vuelos NO necesita presentar plan de vuelo según el manual?", "opts": ["Cualquier vuelo VFR que cruce fronteras internacionales", "Un vuelo VFR en espacio aéreo controlado de clase C", "Un vuelo de búsqueda y salvamento en misión urgente", "Un vuelo VFR nocturno que se aleja de las inmediaciones del aeródromo de salida"], "ans": 2, "why": "Están exentos los vuelos militares en misiones tácticas o de defensa aérea, los de búsqueda y salvamento en misiones de urgencia y los expresamente autorizados por la autoridad competente. Los otros tres figuran entre los vuelos que requieren FPL.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 4, "stem": "¿Exime la aplicación del Convenio Schengen de presentar un FPL al cruzar fronteras?", "opts": ["Sí, para todos los vuelos VFR", "Sí, si el vuelo es IFR", "No, no exime de la obligación", "Solo dentro del área de la CEAC"], "ans": 2, "why": "El manual dice de forma explícita que la aplicación del Convenio Schengen no exime de la obligatoriedad de presentar un FPL cuando se atraviesan fronteras internacionales.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 5, "stem": "Un vuelo VFR con origen, destino o alternativo en un aeródromo controlado o con servicio AFIS:", "opts": ["Debe presentar un FPL", "No necesita ningún plan", "Necesita plan solo de noche", "Necesita plan solo si cruza fronteras"], "ans": 0, "why": "El manual incluye «cualquier vuelo VFR con origen, destino o alternativo en aeródromos controlados o con servicio AFIS» entre los vuelos que requieren FPL.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 6, "stem": "Según el manual, además de ICARO y de la ARO centralizada, ¿a qué destinatario puede enviarse el plan de vuelo de un vuelo IFR y GAT?", "opts": ["A la torre de control del aeródromo de salida", "A la oficina AIS del aeródromo de salida", "A la Agencia Estatal de Seguridad Aérea (AESA)", "Al IFPS de EUROCONTROL"], "ans": 3, "why": "Además de ICARO (web/app) y de la ARO centralizada, el manual permite presentar el plan directamente al IFPS (EUROCONTROL) cuando se trata de vuelos IFR y GAT (General Air Traffic).", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 7, "stem": "En el manual, el aeródromo de La Cuesta (Córdoba) se da como ejemplo de:", "opts": ["Una ruta condicional (CDR) con ruta alternativa publicada", "Un aeródromo con servicio AFIS que exige plan de vuelo", "Un aeródromo de uso restringido exento de plan de vuelo", "Una zona geográfica designada de la ARO centralizada, la zona 10"], "ans": 3, "why": "A los aeródromos y helipuertos de uso restringido se les asigna una zona geográfica de la ARO centralizada, publicada en AIP-España ENR 1.10; La Cuesta (Córdoba) tiene la zona 10.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 8, "stem": "¿Qué es un plan AFIL?", "opts": ["Un plan presentado por teléfono a la ARO centralizada antes de la puesta en marcha", "Un plan de vuelo repetitivo que se presenta una sola vez para toda una temporada", "Un plan que una aeronave en vuelo transmite, excepcionalmente, a una estación que sirve a una dependencia ATS", "Un plan que el IFPS genera automáticamente cuando el operador no ha presentado ninguno"], "ans": 2, "why": "En casos excepcionales, una aeronave en vuelo puede transmitir un plan de vuelo (AFIL) a una estación de telecomunicaciones aeronáuticas que sirve a una dependencia ATS.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 9, "stem": "Según el apartado de direccionamiento del manual, ¿quién es responsable de enviar todos los mensajes asociados al plan de vuelo y a qué dependencia?", "opts": ["El controlador de la torre de salida, al NMOC de EUROCONTROL", "El piloto o su representante autorizado, a la dependencia donde presentó el FPL", "El operador, al ACC en cuya área está el aeródromo de destino", "El IFPS, a todas las dependencias ATS que figuran en la ruta"], "ans": 1, "why": "El manual establece que el piloto o su representante autorizado es el responsable del envío, a la misma dependencia donde envió el FPL, de todos los mensajes asociados al plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 10, "stem": "Según el manual, ¿con cuánta antelación máxima respecto a la EOBT puede presentarse un plan de vuelo?", "opts": ["24 horas", "48 horas", "120 horas", "240 horas"], "ans": 2, "why": "Punto 1 del tiempo de presentación: no más de 120 horas antes de la hora prevista de fuera calzos.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 5", "note": ""}, {"n": 11, "stem": "Un vuelo que puede estar sujeto a medidas ATFM debe presentar su plan de vuelo, como mínimo:", "opts": ["3 horas antes de la hora prevista de fuera calzos", "60 minutos antes de la hora prevista de fuera calzos", "6 horas antes de la salida", "30 minutos antes de la puesta en marcha"], "ans": 0, "why": "Punto 2: al menos tres horas antes de la EOBT para los vuelos que puedan estar sujetos a medidas de gestión de afluencia del tránsito aéreo.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 6", "note": ""}, {"n": 12, "stem": "Para todos los demás vuelos no sujetos a medidas ATFM (que cruzan fronteras o reciben servicio ATC), el tiempo mínimo de presentación es:", "opts": ["10 minutos antes de la salida", "30 minutos antes de la salida", "3 horas antes de la EOBT", "60 minutos antes de la salida"], "ans": 3, "why": "Punto 3: al menos sesenta minutos antes de la salida para todos los demás vuelos no contemplados en el punto 2.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 6", "note": ""}, {"n": 13, "stem": "Un plan presentado durante el vuelo debe ser recibido por la dependencia ATS adecuada, como mínimo, ¿cuánto tiempo antes de que la aeronave llegue al punto de entrada en un área de control?", "opts": ["5 minutos", "10 minutos", "20 minutos", "60 minutos"], "ans": 1, "why": "Punto 4: al menos diez minutos antes de la hora estimada de llegada al punto previsto de entrada en un área de control o en un área con servicio de asesoramiento, o al punto de cruce con una aerovía o con una ruta con servicio de asesoramiento.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), p. 6", "note": ""}, {"n": 14, "stem": "¿Cuál de los siguientes datos forma parte del contenido del plan de vuelo que enumera el manual?", "opts": ["El nombre de la dependencia ATC que emitió la autorización de salida", "El tiempo meteorológico previsto en el aeródromo de destino", "El sistema de recuperación por paracaídas balístico, como equipo de emergencia y supervivencia", "El designador de la salida normalizada por instrumentos (SID) asignada"], "ans": 2, "why": "La lista de contenido incluye «equipo de emergencia y de supervivencia, incluido el sistema de recuperación por paracaídas balístico». Las demás opciones no figuran en la lista.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Contenido»), p. 6", "note": ""}, {"n": 15, "stem": "El procedimiento RFP se aplica a los vuelos sujetos a gestión de afluencia que, en la etapa previa al vuelo y para evitar demoras:", "opts": ["Cambian el tipo de aeronave manteniendo la misma ruta y horario", "Cambian el aeródromo de destino por otro de la misma región", "Retrasan la EOBT más de 15 minutos respecto a la del plan original", "Eligen una ruta alternativa entre los mismos aeródromos de salida y destino"], "ans": 3, "why": "El RFP (plan de vuelo que reemplaza) afecta a los vuelos con aplicación de medidas ATFCM que deciden, en la etapa previa al vuelo, tomar una ruta alternativa distinta a la original entre los mismos aeródromos de salida y destino.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («FPL que reemplaza»), p. 6", "note": ""}, {"n": 16, "stem": "Para el procedimiento RFP, la etapa previa al vuelo se define como:", "opts": ["EOBT menos 1 hora", "EOBT menos 2 horas", "EOBT menos 3 horas", "EOBT menos 4 horas"], "ans": 3, "why": "Para evitar un uso excesivo del procedimiento, la etapa previa al vuelo es la EOBT menos 4 horas; el último RFP debe presentarse al menos 30 minutos antes de la EOBT.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («FPL que reemplaza»), p. 6", "note": ""}, {"n": 17, "stem": "El último plan de vuelo que reemplaza (RFP) debe presentarse:", "opts": ["Al menos 30 minutos antes de la EOBT", "Al menos 60 minutos antes de la EOBT", "Al menos 10 minutos antes de la EOBT", "Antes de que se emita el CTOT"], "ans": 0, "why": "El manual dice: «el último RFP se presentará por lo menos 30 minutos antes de la EOBT».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («FPL que reemplaza»), p. 6", "note": ""}, {"n": 18, "stem": "Según el manual, el plan de vuelo que reemplaza debe contener «RFP/Qn» como:", "opts": ["El primer elemento de la casilla 15", "El último elemento de la casilla 18", "El primer elemento de la casilla 18", "El último elemento de la casilla 19"], "ans": 1, "why": "El manual dice: «la nueva ruta completa en la casilla 15 y, como último elemento en la casilla 18, la indicación RFP/Qn». (El Manual del usuario del IFPS dice que va el primero; como referencia del examen vale el texto del manual.)", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Procedimiento»), p. 6", "note": ""}, {"n": 19, "stem": "Cuando ya se había presentado un FPL y se elige una ruta alternativa en la etapa previa al vuelo, el mensaje CNL se envía:", "opts": ["Con prioridad GG, después del nuevo FPL", "Con prioridad FF, 30 minutos antes de la EOBT", "De inmediato y, de manera excepcional, con prioridad DD", "Solo al aeródromo de salida"], "ans": 2, "why": "El CNL se transmite inmediatamente y, de manera excepcional, con prioridad «DD» a todas las direcciones afectadas según el plan de vuelo original.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Procedimiento»), pp. 6-7", "note": ""}, {"n": 20, "stem": "Después del CNL del plan original, el FPL que lo reemplaza se transmite:", "opts": ["Tras un breve intervalo de no menos de 5 minutos", "De forma simultánea, en el mismo envío que el CNL", "Exactamente 30 minutos después de transmitir el CNL", "Antes del CNL, para que no quede un hueco sin plan"], "ans": 0, "why": "El plan de vuelo que reemplaza se transmite después de la cancelación (CNL) «con un breve intervalo de no menos de 5 minutos».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Procedimiento»), p. 7", "note": ""}, {"n": 21, "stem": "En el formulario FPL de la OACI que reproduce el manual, ¿qué parte lleva la indicación «NOT TO BE TRANSMITTED IN FPL MESSAGES»?", "opts": ["La casilla 19, información suplementaria", "La casilla 18, otros datos del vuelo", "La casilla 15, velocidad, nivel y ruta", "La casilla 10, equipo y capacidades"], "ans": 0, "why": "El encabezado de la casilla 19 dice «Información suplementaria (En los mensajes FPL no hay que transmitir estos datos)»: autonomía, personas a bordo, radio de emergencia, equipo de supervivencia, chalecos, botes neumáticos, color, observaciones y piloto al mando.", "src": "Manual 6 (nov. 2026), formulario FPL OACI, p. 8 (figura)", "note": ""}, {"n": 22, "stem": "¿Qué prioridad viene preimpresa en el formulario FPL del manual?", "opts": ["SS", "DD", "FF", "GG"], "ans": 2, "why": "El formulario muestra «&lt;&lt;≡ FF →» junto a PRIORITY (Prioridad), porque el mensaje de plan de vuelo lleva prioridad FF.", "src": "Manual 6 (nov. 2026), formulario FPL OACI, p. 8 (figura); capítulo 2.2, p. 9", "note": ""}, {"n": 23, "stem": "¿Cuál es el orden correcto de prioridad de transmisión AFTN según el manual?", "opts": ["1 SS; 2 DD y FF; 3 GG y KK", "1 SS y DD; 2 FF; 3 GG y KK", "1 DD; 2 SS y FF; 3 GG y KK", "1 SS; 2 DD; 3 FF; 4 GG; 5 KK"], "ans": 0, "why": "La tabla del manual da tres niveles: primero SS, en segundo lugar DD y FF, y en tercer lugar GG y KK.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 10", "note": ""}, {"n": 24, "stem": "¿Qué mensajes llevan en el manual la prioridad AFTN DD?", "opts": ["Los mensajes de plan de vuelo", "Los mensajes de socorro", "Las observaciones meteorológicas", "Los mensajes de urgencia"], "ans": 3, "why": "SS, socorro; DD, urgencia; FF, plan de vuelo y movimiento y control; GG, pronósticos, observaciones, regularidad de vuelo y AIS; KK, administrativos.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 9", "note": ""}, {"n": 25, "stem": "Los mensajes de plan de vuelo, los de movimiento y control y la información SIGMET se transmiten con prioridad:", "opts": ["SS", "DD", "FF", "GG"], "ans": 2, "why": "En la tabla del manual, el grupo FF comprende el mensaje de plan de vuelo, los mensajes de movimiento y control, los mensajes de la empresa explotadora de interés inmediato y los mensajes meteorológicos limitados a la información SIGMET, las aeronotificaciones especiales y los pronósticos enmendados.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 9", "note": ""}, {"n": 26, "stem": "Los pronósticos meteorológicos, las observaciones, los mensajes de regularidad de vuelo y los mensajes AIS llevan el indicador de prioridad:", "opts": ["GG", "FF", "KK", "DD"], "ans": 0, "why": "El grupo GG contiene los pronósticos, los pronósticos de área y de ruta, las observaciones e informes, los mensajes de regularidad de vuelo y los mensajes AIS. KK es administrativo.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 10", "note": ""}, {"n": 27, "stem": "Los mensajes con el mismo indicador de prioridad AFTN se transmiten:", "opts": ["Por tamaño, primero el más corto", "Por orden alfabético del remitente", "En orden aleatorio", "En el orden en que se reciben para su transmisión"], "ans": 3, "why": "El manual dice que los mensajes que tengan el mismo indicador de prioridad se transmitirán según el orden en que se reciban para su transmisión.", "src": "Manual 6 (nov. 2026), capítulo 2.2, p. 10", "note": ""}, {"n": 28, "stem": "Los mensajes relativos a una fase de incertidumbre se envían con prioridad:", "opts": ["SS", "DD", "FF", "GG"], "ans": 1, "why": "Los mensajes de urgencia, incluidos los de alerta y los relacionados con una fase de incertidumbre, llevan DD; los relacionados con una fase de peligro van con los de socorro, con SS.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 10", "note": ""}, {"n": 29, "stem": "La fase de incertidumbre se declara, entre otros casos, cuando no se ha recibido ninguna comunicación de la aeronave en el transcurso de:", "opts": ["5 minutos desde el momento en que debería haberse recibido una comunicación", "15 minutos desde el momento en que debería haberse recibido una comunicación", "30 minutos desde que debería haberse recibido o desde un intento infructuoso, según cuál sea anterior", "60 minutos desde el momento en que debería haberse recibido una comunicación"], "ans": 2, "why": "Condición i): 30 minutos desde el momento en que debería haberse recibido una comunicación, o desde el momento en que se realizó un intento infructuoso de establecer comunicación con la aeronave, según cuál sea anterior.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 10", "note": ""}, {"n": 30, "stem": "Una aeronave no ha llegado. La fase de incertidumbre se aplica cuando no ha llegado:", "opts": ["5 minutos después de la última hora prevista de llegada, según cuál sea anterior", "30 minutos después de la última hora prevista de llegada, notificada o estimada, según cuál sea posterior", "30 minutos después del despegue", "60 minutos después de la última hora prevista de llegada, según cuál sea anterior"], "ans": 1, "why": "Condición ii): 30 minutos después de la última hora prevista de llegada, notificada o estimada por las dependencias de los servicios de tránsito aéreo, según cuál sea posterior.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 31, "stem": "Una aeronave autorizada a aterrizar no ha aterrizado. La fase de alerta se aplica cuando no ha aterrizado:", "opts": ["30 minutos después de la hora prevista de aterrizaje, aunque haya comunicación", "15 minutos después de la hora prevista de aterrizaje y sin comunicación", "5 minutos después de la hora prevista de aterrizaje y no se ha restablecido la comunicación", "1 minuto después de la hora prevista de aterrizaje, sin más condiciones"], "ans": 2, "why": "Condición ii) de la fase de alerta: autorizada a aterrizar, no ha aterrizado 5 minutos después de la hora prevista de aterrizaje y no se ha restablecido la comunicación con la aeronave.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 32, "stem": "¿Qué situación pertenece a la fase de ALERTA según el manual?", "opts": ["Se considera agotado el combustible a bordo", "Se ha efectuado un aterrizaje forzoso", "Se sabe o se cree que una aeronave está siendo objeto de interferencia ilícita", "Se juzga probable un aterrizaje forzoso por la eficiencia mermada de la aeronave"], "ans": 2, "why": "La interferencia ilícita es la condición v) de la fase de alerta. El combustible agotado, el aterrizaje forzoso efectuado y el aterrizaje forzoso probable son condiciones de la fase de peligro.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 33, "stem": "La información que indica que la eficiencia operativa de la aeronave se ha visto afectada, pero no en la medida en que sea probable un aterrizaje forzoso, corresponde a la:", "opts": ["Fase de incertidumbre", "Fase de alerta", "Fase de peligro", "No se declara ninguna fase"], "ans": 1, "why": "Condición iv) de la fase de alerta. Si un aterrizaje forzoso fuera probable, sería la condición iii) de la fase de peligro.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 34, "stem": "¿Cuál de las siguientes es una condición de la fase de PELIGRO?", "opts": ["El combustible a bordo se considera agotado o insuficiente para que la aeronave llegue a un lugar seguro", "No se ha recibido ninguna comunicación de la aeronave en 30 minutos", "La aeronave no ha aterrizado 5 minutos después de la hora prevista de aterrizaje", "Se sabe o se cree que la aeronave es objeto de interferencia ilícita"], "ans": 0, "why": "Condición ii) de la fase de peligro. B corresponde a la incertidumbre; C y D son condiciones de la fase de alerta.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 35, "stem": "La fase de peligro NO se aplica cuando:", "opts": ["La aeronave vuela con plan de vuelo IFR y en espacio aéreo controlado", "La aeronave ya ha aterrizado en un aeródromo de alternativa", "La fase de alerta ha durado menos de 30 minutos", "Hay certeza razonable de que no corren peligro grave e inminente ni necesitan asistencia inmediata"], "ans": 3, "why": "El manual excluye la fase de peligro cuando hay una certeza razonable de que la aeronave y sus ocupantes no están amenazados por un peligro grave e inminente ni necesitan asistencia inmediata.", "src": "Manual 6 (nov. 2026), capítulo 2.3, p. 11", "note": ""}, {"n": 36, "stem": "En la tabla de mensajes de movimiento y control del manual, ¿qué mensaje pertenece a la familia de «coordinación»?", "opts": ["DLA (demora)", "RQP (solicitud de plan de vuelo)", "SPL (plan de vuelo suplementario)", "LAM (acuse de recibo lógico)"], "ans": 3, "why": "Coordinación: CPL, EST, CDN, ACP, LAM. DLA pertenece a los mensajes de plan de vuelo presentado; RQP y SPL, a los de plan de vuelo suplementario.", "src": "Manual 6 (nov. 2026), capítulo 2.4, p. 12", "note": ""}, {"n": 37, "stem": "¿Qué conjunto contiene solo mensajes de la familia de «plan de vuelo presentado»?", "opts": ["DLA, CHG, CNL, DEP, ARR", "CPL, EST, CDN, ACP, LAM", "RQP, RQS, SPL", "Autorización, transferencia de control, control de afluencia, informes de posición"], "ans": 0, "why": "Las cuatro familias del apartado 2.4 son: plan de vuelo presentado (DLA, CHG, CNL, DEP, ARR), coordinación (CPL, EST, CDN, ACP, LAM), plan de vuelo suplementario (solicitud de plan de vuelo, solicitud de plan suplementario, plan suplementario) y control (autorización, transferencia de control, control de afluencia, informe de posición y aeronotificaciones).", "src": "Manual 6 (nov. 2026), capítulo 2.4, p. 12", "note": ""}, {"n": 38, "stem": "¿Cuál de los siguientes NO es un campo que pueda modificarse con un mensaje CHG según el manual?", "opts": ["El nivel de crucero", "La ruta", "El aeródromo de salida", "La velocidad de crucero"], "ans": 2, "why": "El manual dice que la identificación de la aeronave, el aeródromo de salida y el aeródromo de destino no pueden modificarse con un CHG; hay que cancelar el FPL y presentar uno nuevo.", "src": "Manual 6 (nov. 2026), capítulo 2.6, p. 13", "note": ""}, {"n": 39, "stem": "Si hay que cambiar el aeródromo de destino de un plan presentado, el manual prescribe:", "opts": ["Un mensaje CHG con el nuevo destino", "Un mensaje DLA con la nueva EOBT", "Un mensaje RQP a la ARO de salida", "Cancelar el FPL y presentar uno nuevo"], "ans": 3, "why": "La identificación de la aeronave, el aeródromo de salida y el de destino no pueden modificarse con un CHG; hay que cancelar el FPL y presentar uno nuevo.", "src": "Manual 6 (nov. 2026), capítulo 2.6, p. 13", "note": ""}, {"n": 40, "stem": "¿Qué dependencia ATS transmite el mensaje CNL a las dependencias que recibieron los datos básicos del plan de vuelo?", "opts": ["La dependencia ATS que sirve al aeródromo de salida", "El centro de control de área del destino", "El Gestor de Red", "La AMC"], "ans": 0, "why": "La dependencia ATS que sirve al aeródromo de salida transmite el CNL a las dependencias ATS que hayan recibido los datos básicos de plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 2.7, p. 13", "note": ""}, {"n": 41, "stem": "Cuando se envía un CNL para cancelar el FPL de un día determinado y se presenta un plan nuevo, el CNL lleva el indicador de prioridad:", "opts": ["SS", "DD", "FF", "KK"], "ans": 1, "why": "El manual dice que el mensaje de cancelación se envía con el indicador de prioridad «DD» a todas las dependencias ATS interesadas, seguido del correspondiente plan de vuelo presentado (FPL).", "src": "Manual 6 (nov. 2026), capítulo 2.7, p. 13", "note": ""}, {"n": 42, "stem": "Salvo que un acuerdo regional prescriba otra cosa, los mensajes DEP se transmiten:", "opts": ["30 minutos antes de la salida", "En el momento de la solicitud de pushback", "Inmediatamente después de la salida de la aeronave", "Dentro de la hora siguiente a la salida"], "ans": 2, "why": "Los mensajes DEP se transmiten inmediatamente después de la salida de una aeronave con respecto a la cual se hayan distribuido anteriormente datos básicos de plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 2.8, p. 13", "note": ""}, {"n": 43, "stem": "En la región EUR, los mensajes DEP deben omitirse, por mutuo acuerdo entre los Estados interesados, para:", "opts": ["Todos los vuelos VFR, con independencia de los circuitos disponibles", "Los vuelos IFR en áreas o rutas designadas, si hay circuitos radiotelefónicos ATS confiables", "Todos los vuelos de un mismo operador que salgan del mismo aeródromo", "Los vuelos con CTOT asignado, una vez cumplido su turno de salida"], "ans": 1, "why": "La condición es que existan circuitos radiotelefónicos ATS confiables entre las sucesivas dependencias ATS afectadas y que se trate de vuelos IFR que operen dentro de áreas o a lo largo de rutas designadas.", "src": "Manual 6 (nov. 2026), capítulo 2.8, p. 14", "note": ""}, {"n": 44, "stem": "¿Para qué vuelos transmite la dependencia ATS del aeródromo de llegada un ARR tras el aterrizaje en el aeródromo de destino?", "opts": ["Solo para los vuelos IFR, nunca para los VFR", "Para los vuelos VFR y, previa petición, para los vuelos IFR", "Solo para los vuelos con CTOT asignado por el NMOC", "Solo para los vuelos que han declarado emergencia"], "ans": 1, "why": "El ARR se transmite para los vuelos que operen bajo reglas de vuelo visual y, previa petición, para los vuelos que operen bajo reglas de vuelo instrumental.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 45, "stem": "Una aeronave aterriza en un aeródromo alternativo. ¿Cuál de los siguientes es destinatario del ARR?", "opts": ["La torre de control del aeródromo de destino", "Solo el Gestor de Red, que informa a los demás", "La Agencia Estatal de Seguridad Aérea (AESA)", "Solo el IFPS, para cerrar el plan de vuelo"], "ans": 0, "why": "Destinatarios: el ACC/FIC del área del aeródromo de llegada; la torre de control del aeródromo de destino; la ARO del aeródromo de salida; el ACC/FIC de cada FIR/UIR que la aeronave habría cruzado de no haberse desviado.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 46, "stem": "Una vez que ha aterrizado en el aeródromo de destino una aeronave con fallo de comunicaciones en ambos sentidos durante un vuelo controlado, ¿quién transmite el ARR?", "opts": ["El centro de control de área de la llegada", "La torre de control del aeródromo de llegada", "El NMOC de EUROCONTROL", "El operador de la aeronave"], "ans": 1, "why": "El manual se lo asigna a la torre de control del aeródromo de llegada, dirigido a todas las dependencias ATS interesadas en el vuelo durante el fallo y a todas las que hayan podido ser alertadas.", "src": "Manual 6 (nov. 2026), capítulo 2.9, p. 14", "note": ""}, {"n": 47, "stem": "Si la aeronave con fallo de comunicaciones aterriza en un aeródromo distinto del de destino, el ARR se envía a:", "opts": ["Todos los ACC de las FIR que la aeronave habría cruzado", "El IFPS, que lo distribuye a las dependencias afectadas", "La dependencia ATS del aeródromo de destino, que avisa a las demás", "Solo la ARO del aeródromo de salida"], "ans": 2, "why": "La torre envía el ARR a la dependencia ATS del aeródromo de destino; esta transmite entonces un ARR a todas las demás dependencias ATS interesadas o que hayan sido alertadas.", "src": "Manual 6 (nov. 2026), capítulo 2.9, pp. 14-15", "note": ""}, {"n": 48, "stem": "Una dependencia ATS recibe un mensaje EST de una aeronave de la que nunca recibió los datos básicos del plan de vuelo. ¿Qué mensaje envía y a quién?", "opts": ["Un RQS a la ARO del aeródromo de salida", "Un SPL al ACC en cuya área está la aeronave", "Un RQP a la dependencia transferidora que originó el EST", "Un CHG al operador de la aeronave"], "ans": 2, "why": "El RQP se transmite a la dependencia ATS transferidora que originó un mensaje EST, o al centro que originó un mensaje de actualización para el cual no se dispone de datos básicos.", "src": "Manual 6 (nov. 2026), capítulo 2.10, p. 15", "note": ""}, {"n": 49, "stem": "El mensaje RQS (solicitud de información suplementaria) se envía a:", "opts": ["La dependencia ATS del aeródromo de destino del vuelo", "El NMOC, que lo reenvía a la ARO del aeródromo de salida", "La dependencia ATS anterior a lo largo de la ruta del vuelo", "La ARO de salida o, si el plan se presentó en vuelo, la dependencia indicada en él"], "ans": 3, "why": "El RQS va a la oficina de notificación ATS del aeródromo de salida o, en el caso de un plan presentado durante el vuelo, a la dependencia especificada en ese mensaje de plan de vuelo. La dependencia anterior en la ruta recibe el RQP cuando no ha llegado ningún mensaje.", "src": "Manual 6 (nov. 2026), capítulo 2.10, p. 15", "note": ""}, {"n": 50, "stem": "¿Quién transmite un mensaje SPL?", "opts": ["La ARO del aeródromo de salida, a quien pidió más datos que los de un CPL o FPL", "El IFPS, a todos los ANSP del área ECAC, tras validar el plan", "La FMP, al NMOC, para la asignación del slot del vuelo", "El piloto, a la torre del aeródromo de destino, al aterrizar"], "ans": 0, "why": "El SPL lo envía la oficina de notificación de los servicios de tránsito aéreo del aeródromo de salida a las dependencias que hayan solicitado información adicional a la ya transmitida en un mensaje CPL o FPL.", "src": "Manual 6 (nov. 2026), capítulo 2.10, p. 15", "note": ""}, {"n": 51, "stem": "Según el manual, ¿qué organización creó la unidad central única ATFM para la región EUR de la OACI?", "opts": ["EASA", "EUROCONTROL", "La Comisión Europea", "IATA"], "ans": 1, "why": "En la región EUR de la OACI, EUROCONTROL creó una unidad central única ATFM encargada de planificar, coordinar y ejecutar las medidas ATFM, teniendo en cuenta las recomendaciones de la OACI.", "src": "Manual 6 (nov. 2026), capítulo 3.1, pp. 15-16", "note": ""}, {"n": 52, "stem": "El Gestor de Red está gobernado por un comité denominado:", "opts": ["Network Manager Board (NMB)", "Performance Review Body (PRB)", "Comité de Cielo Único Europeo", "Consejo de Gestión del Espacio Aéreo"], "ans": 0, "why": "El NM está gobernado por el Network Manager Board, en el que están representadas las diversas ramas de la aviación, incluidas las autoridades aeronáuticas reguladoras y los proveedores de servicios de navegación aérea. El PRB es el órgano a través del cual la Comisión fija los objetivos.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 53, "stem": "Las funciones estratégicas del Gestor de Red se definen en un plan estratégico operativo que abarca:", "opts": ["Un año", "Tres años", "Cinco años", "Diez años"], "ans": 2, "why": "El manual dice: «Plan estratégico operativo que abarca un periodo de cinco años».", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 54, "stem": "En España, el NM coordina las medidas estratégicas y pretácticas con todos los siguientes EXCEPTO:", "opts": ["La Dirección de Operaciones ATM, a través de la UCATM", "Las Posiciones de Gestión de Afluencia (FMP)", "AMC España", "La División de Inspección de AESA"], "ans": 3, "why": "Los tres organismos citados son la Dirección de Operaciones ATM, a través de la Unidad Central ATM (UCATM); las FMP establecidas en los centros de control; y la Célula de Gestión de Espacio Aéreo (AMC España). La edición de 2024 escribía «UATM» en este punto; la de 2026 dice «UCATM».", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 16", "note": ""}, {"n": 55, "stem": "El sistema que monitoriza los datos de tráfico y permite implantar las medidas ATFCM es el:", "opts": ["CASA", "ENV", "IFPS", "ETFMS"], "ans": 3, "why": "ETFMS = Sistema de Gestión del Flujo Táctico Reforzado (<em>Enhanced Tactical Flow Management System</em>). CASA asigna los slots, ENV es la base de datos e IFPS valida y distribuye los planes de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 3.2, pp. 16-17; capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 56, "stem": "Según el glosario del manual, TACT es:", "opts": ["El nombre actual de CASA", "La antigua denominación del actual ETFMS", "Una base de datos del espacio aéreo", "El Equipo Táctico de Coordinación del Espacio Aéreo"], "ans": 1, "why": "El glosario define TACT como «Sistema táctico (antigua denominación del actual ETFMS)». En el texto de 3.2 aparece como el sistema que gestiona las medidas en la fase táctica.", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 57, "stem": "¿Bajo la responsabilidad de quién trabajan los técnicos de control de afluencia de una FMP?", "opts": ["El Jefe de Sala del ACC al que está adscrita la FMP", "La Célula de Gestión de Espacio Aéreo (AMC)", "El Network Manager Board (NMB) de EUROCONTROL", "El responsable de la Unidad Central ATM (UCATM)"], "ans": 0, "why": "Las FMP, situadas en los centros de control, las gestionan los técnicos de control de afluencia, siempre bajo la responsabilidad del Jefe de Sala del ACC al que están adscritos.", "src": "Manual 6 (nov. 2026), capítulo 3.2, p. 17", "note": ""}, {"n": 58, "stem": "¿Cuál es una función de la UCATM según el manual?", "opts": ["Asignar el CTOT de cada vuelo regulado en el área ECAC", "Emitir las autorizaciones ATC de salida en los aeródromos", "Actuar como célula de crisis en situaciones excepcionales", "Validar los planes de vuelo contra la base de datos ENV"], "ans": 2, "why": "La UCATM gestiona la fase estratégica, supervisa las actividades pretácticas y tácticas, centraliza las funciones de las FMP cuando no están operativas, actúa como célula de crisis, asesora a los AO/ATS y participa en la parte civil de la AMC.", "src": "Manual 6 (nov. 2026), capítulo 3.3, p. 17", "note": ""}, {"n": 59, "stem": "La fase estratégica de la ATFCM abarca el período:", "opts": ["Hasta siete días antes del día de la operación, con el NOP como resultado", "Los seis días anteriores a la operación, con el ADP como resultado", "El día de la operación", "Desde el día siguiente a la operación"], "ans": 0, "why": "Estratégica: hasta siete días antes, con el Plan Operacional de la Red (NOP) como resultado. Pretáctica: los seis días anteriores, ADP. Táctica: el día de la operación. Post-operacional: desde el día siguiente.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 18", "note": ""}, {"n": 60, "stem": "El producto principal de la fase pretáctica es:", "opts": ["El Plan Operacional de la Red (NOP)", "El Plan Diario ATFCM (ADP)", "El AUP", "El informe postoperacional"], "ans": 1, "why": "En la fase pretáctica, las medidas ATFCM se recogen en el Plan Diario ATFCM (ADP). El NOP es el resultado de la fase estratégica.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 18", "note": ""}, {"n": 61, "stem": "¿En qué fase tienen especial importancia la actuación de los Jefes de Sala y Supervisores y su coordinación con los TCA?", "opts": ["Estratégica", "Pretáctica", "Táctica", "Postoperacional"], "ans": 2, "why": "El manual destaca que en la fase táctica tiene gran importancia la correcta actuación de los responsables de las dependencias de control (Jefes de Sala y Supervisores) y su coordinación con los técnicos de control de afluencia.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1, p. 19", "note": ""}, {"n": 62, "stem": "El análisis postoperacional:", "opts": ["Se aplica durante los seis días anteriores a la operación", "Sustituye a la fase táctica cuando hay tormentas", "Lo realiza solo EUROCONTROL, sin participación de las FMP", "Se aplica desde el día siguiente y realimenta a las tres fases anteriores"], "ans": 3, "why": "Se aplica desde el día siguiente a la operación, analiza el día de la operación y realimenta a las tres fases anteriores; todos los participantes aportan <em>feedback</em> y el resultado son mejores prácticas.", "src": "Manual 6 (nov. 2026), capítulo 3.3.1 (numerado «1.3.2» en el manual), p. 19", "note": ""}, {"n": 63, "stem": "El IFPS tiene dos centros redundantes situados en:", "opts": ["Bruselas y Brétigny (París)", "Bruselas y Maastricht", "Madrid y París", "Ginebra y Bruselas"], "ans": 0, "why": "El manual dice: «consta de dos centros redundantes: Bruselas y Bretigny (Paris)».", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 19", "note": ""}, {"n": 64, "stem": "¿Cuál de las siguientes NO es una tarea del IFPS según el manual?", "opts": ["Recepcionar los planes de vuelo", "El procesado inicial (validación)", "Distribuir los datos de plan de vuelo a las unidades ATC del área ECAC", "Determinar la capacidad declarada de cada sector"], "ans": 3, "why": "La capacidad la determina el proveedor de servicios de tránsito aéreo (en ENAIRE, la Dirección de Operaciones). El IFPS recepciona, valida, distribuye y proporciona datos de FPL a operaciones del NM.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 19", "note": ""}, {"n": 65, "stem": "Un plan de vuelo que contiene información contraria a la base de datos ENV es:", "opts": ["Aceptado (ACK) y enviado al ANSP", "Rechazado (REJ) y no llega a ATC", "Suspendido (FLS)", "Enviado a la FMP para que se le asigne un CTOT"], "ans": 1, "why": "Contradecir la base de datos ENV lleva al rechazo (REJ); los planes rechazados no llegan a ATC y es tarea del operador o del originador del mensaje tomar medidas.", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 20", "note": ""}, {"n": 66, "stem": "Un mensaje FLS recibido en una dependencia ATS significa, en principio, que el vuelo:", "opts": ["Ha sido cancelado definitivamente", "Ha recibido un nuevo CTOT", "No está autorizado a salir", "Está exento de regulación"], "ans": 2, "why": "El FLS (mensaje de suspensión del vuelo) suspende un plan ya aceptado e «inicialmente implica la no autorización de salida del vuelo».", "src": "Manual 6 (nov. 2026), capítulo 3.4, p. 21", "note": ""}, {"n": 67, "stem": "El valor de la demanda que utiliza el sistema ATFCM se basa en:", "opts": ["Todos los vuelos, incluidos los VFR y los operacionales", "Solo los vuelos con CTOT asignado por una regulación", "Los planes de vuelo presentados, sin incluir los vuelos VFR ni los operacionales", "Las trazas radar de los vuelos que ya están en el aire"], "ans": 2, "why": "El manual establece que la demanda que maneja el sistema ATFCM se basa en los planes de vuelo presentados, sin incluir los vuelos VFR ni los operacionales.", "src": "Manual 6 (nov. 2026), capítulo 3.5.1, p. 21", "note": ""}, {"n": 68, "stem": "¿Qué tipo de capacidad «podría ser bastante mayor que los valores de capacidad sostenible» durante períodos cortos?", "opts": ["La capacidad declarada", "La capacidad disponible", "La capacidad máxima", "La capacidad planificada"], "ans": 2, "why": "Las observaciones sobre la capacidad máxima dicen que puede lograrse durante períodos cortos y que podría ser bastante mayor que los valores de capacidad sostenible.", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 69, "stem": "¿Qué capacidad «deberá constituir el factor principal a efectos de planificación»?", "opts": ["La capacidad sostenible", "La capacidad máxima", "La capacidad disponible", "La capacidad declarada"], "ans": 0, "why": "Las observaciones sobre la capacidad sostenible establecen que debe ser el factor principal a efectos de planificación. La capacidad declarada se basa en ella.", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 70, "stem": "En condiciones óptimas, la capacidad disponible se corresponde con la:", "opts": ["Capacidad máxima", "Capacidad sostenible menos un 10 %", "Capacidad declarada", "Demanda"], "ans": 2, "why": "La observación sobre la capacidad disponible dice: «en condiciones óptimas la capacidad disponible se corresponde con la capacidad declarada».", "src": "Manual 6 (nov. 2026), capítulo 3.5.2, p. 22 (tabla)", "note": ""}, {"n": 71, "stem": "En situaciones tácticas sobrevenidas, ¿quién determina la capacidad disponible en una dependencia en la que no hay Jefe de Sala ni Supervisor?", "opts": ["El FMP Manager de la región", "La Dirección de Operaciones de ENAIRE", "El técnico de control de afluencia (TCA) de la FMP", "El CTA de servicio con la habilitación más antigua en la dependencia"], "ans": 3, "why": "Orden: el Jefe de Sala; si no lo hay o está ausente, el Supervisor de servicio; si no hay Supervisor, el CTA con la habilitación más antigua en la dependencia de los que se encuentren de servicio.", "src": "Manual 6 (nov. 2026), capítulo 3.5.3, p. 23", "note": ""}, {"n": 72, "stem": "La capacidad máxima puede ser sensiblemente superior a la capacidad sostenible durante un período no superior a:", "opts": ["15 minutos", "30 minutos", "60 minutos", "120 minutos"], "ans": 2, "why": "Punto c: sesenta (60) minutos; la capacidad máxima también la determina la Dirección de Operaciones.", "src": "Manual 6 (nov. 2026), capítulo 3.5.3, p. 23", "note": ""}, {"n": 73, "stem": "Se utiliza únicamente el valor HEC para detectar sobredemandas y establecer medidas ATFCM:", "opts": ["En la fase táctica, cuando las medidas hacen falta con menos de 3 horas de antelación", "En la fase pretáctica, o cuando hay que tomar medidas con más de 3 horas de antelación", "Solo en la fase estratégica", "En todas las fases, junto con el OCC Peak"], "ans": 1, "why": "Las gráficas de ocupación tienden a ser más estables cuanto más corto es el horizonte temporal, por lo que se usa únicamente el HEC en la fase pretáctica y cuando hay que tomar medidas con una antelación superior a 3 h.", "src": "Manual 6 (nov. 2026), capítulo 3.5.4, p. 24", "note": ""}, {"n": 74, "stem": "Según el manual, existe sobredemanda siempre que el traffic load:", "opts": ["Sobrepase cualquiera de los parámetros de monitorización", "Sobrepase la capacidad sostenible", "Sobrepase todos los parámetros de monitorización aplicables", "Sobrepase la capacidad máxima"], "ans": 2, "why": "«Se considerará que existe una sobredemanda siempre que el traffic load sobrepase todos los parámetros de monitorización aplicables, en cuyo caso será necesario establecer medidas ATFCM».", "src": "Manual 6 (nov. 2026), capítulo 3.5.4, p. 24", "note": ""}, {"n": 75, "stem": "Cuando se prevé que la demanda vaya a superar la capacidad, el manual da el siguiente orden de actuación:", "opts": ["Regular con CTOT, después STAM y después adaptar la capacidad", "STAM, después adaptar la capacidad y después regular", "Adaptar la capacidad, después STAM y, como último recurso, regular", "Cancelar vuelos, después regular y después adaptar la capacidad"], "ans": 2, "why": "Primero, analizar si se puede adaptar la capacidad; segundo, medidas que no impliquen regulaciones (STAM); como último recurso, regular la demanda mediante CTOT y actuando sobre el tráfico en vuelo si no queda otra opción.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5, p. 24", "note": ""}, {"n": 76, "stem": "¿Quién tiene la decisión final sobre la aplicación de una técnica para evitar la regulación (configuración dinámica, level capping, etc.)?", "opts": ["El TCA", "El Supervisor", "El NMOC", "El Jefe de Sala"], "ans": 3, "why": "La idoneidad la estudia el TCA, se analiza con el Supervisor y se propone al Jefe de Sala; cualquiera de los tres puede proponer, pero siempre decide el Jefe de Sala.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 77, "stem": "La configuración dinámica permite:", "opts": ["Aplicar un MDI en los aeródromos de salida del sector", "Desviar los vuelos a otra FIR mediante rerouting táctico", "Adaptar en táctica el número de sectores/posiciones a la demanda prevista", "Suspender planes de vuelo mediante mensajes FLS"], "ans": 2, "why": "Optimiza el número de sectores y posiciones en táctica, reservando recursos durante los períodos de baja demanda para utilizarlos cuando esta aumente.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 78, "stem": "El level capping:", "opts": ["Restringe los niveles de vuelo utilizables dentro de un ACC o entre dos ACC adyacentes", "Asigna CTOT a todos los vuelos que vuelan por encima del FL 290", "Lo aplica únicamente el NMOC, sin participación de la FMP", "Nunca requiere que el cambio se refleje en el plan de vuelo"], "ans": 0, "why": "Reduce la demanda por encima o por debajo de un nivel de vuelo determinado, y su aplicación mediante escenarios predefinidos implica que el cambio se refleje en el plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 25", "note": ""}, {"n": 79, "stem": "Cuando el rerouting requiere un nuevo plan de vuelo, es recomendable plantearlo a los operadores de aeronaves con una antelación mínima de:", "opts": ["30 minutos", "Una hora", "Dos horas", "Tres horas"], "ans": 3, "why": "El manual dice: «es recomendable plantearla a los AOs con una antelación mínima de tres horas».", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 80, "stem": "El rerouting detectado en la fase pretáctica lo gestiona:", "opts": ["El Supervisor del sector", "El FMP Manager de la región", "El controlador de torre", "La AMC"], "ans": 1, "why": "Lo gestiona el FMP Manager de la región e implica que el operador de aeronave presente un nuevo plan de vuelo.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 81, "stem": "El «rerouting táctico» es:", "opts": ["Una medida ATFCM que exige un nuevo plan de vuelo del operador", "Una medida ATC que modifica la ruta de un vuelo en curso para evitar el sector sobrecargado", "Una medida que solo se aplica en la fase estratégica, en el NOP", "El cierre temporal de una CDR1 con poco tiempo de preaviso"], "ans": 1, "why": "El rerouting táctico es una medida ATC que modifica la ruta de un tráfico en vuelo; se comunica al piloto la causa y se le reincorpora a su ruta original lo antes posible.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 82, "stem": "El MDI es aplicable:", "opts": ["Solo en la fase estratégica, al elaborar el NOP", "Solo en la fase pretáctica, incluido en el ADP", "Solo en la fase táctica, si se satura un sector o cae de repente la capacidad", "En todas las fases, siempre que lo apruebe el NMOC"], "ans": 2, "why": "El MDI no es de aplicación en la fase estratégica ni en la pretáctica; la aplicación táctica solo se hará si se satura un determinado sector o se reduce repentinamente la capacidad.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1 (guía MDI), p. 26", "note": ""}, {"n": 83, "stem": "El intervalo de despegue MDI entre salidas consecutivas será, como máximo, de:", "opts": ["2 minutos durante una hora", "5 minutos durante unos 30 minutos", "10 minutos durante unos 60 minutos", "15 minutos durante unas 2 horas"], "ans": 1, "why": "Pauta c: como máximo 5 minutos, durante un período no superior a aproximadamente 30 minutos; si no se soluciona la sobredemanda, deberían tomarse otras medidas ATFCM.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1 (guía MDI), p. 26", "note": ""}, {"n": 84, "stem": "Antes de aplicar el MDI, ¿a quién se debe informar?", "opts": ["Directamente al NMOC, sin pasar por la FMP", "A la AMC, que lo incluye en el AUP del día", "A la FMP, que a su vez coordinará con el NMOC", "Solo al centro de operaciones de la aerolínea"], "ans": 2, "why": "«Antes de aplicar esta técnica se debe informar a la FMP, que a su vez coordinará con NMOC.»", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 26", "note": ""}, {"n": 85, "stem": "Con el MDI, el controlador de torre autoriza el despegue de modo que el vuelo:", "opts": ["Ignore su CTOT", "Respete su CTOT, incluido el tiempo MDI", "Salga exactamente 5 minutos después del anterior", "Espere la aprobación del NMOC"], "ans": 1, "why": "La torre autoriza el despegue de forma que el vuelo respete su CTOT (incluido el tiempo MDI); si en la planificación determina que el vuelo no puede cumplir su CTOT/MDI, requerirá la orientación de la FMP.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1 (guía MDI), p. 26", "note": ""}, {"n": 86, "stem": "Miles in Trail (MIT) consiste en:", "opts": ["Espaciar los despegues de un aeródromo a intervalos regulares", "Restringir los niveles de vuelo utilizables entre dos ACC", "Transferir un flujo de tráfico con una separación determinada en millas entre aeronaves", "Seleccionar vuelos concretos y aplicar medidas solo a ellos"], "ans": 2, "why": "MIT: coordinar la transferencia de un flujo de tráfico de manera que las aeronaves mantengan entre sí una determinada separación en millas, con las instrucciones que reciben de Control. A es el MDI, B el level capping y D el cherry picking.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 27", "note": ""}, {"n": 87, "stem": "La regulación cherry pick se utiliza para resolver:", "opts": ["Picos largos, de más de 4 horas, que afectan a muchos vuelos", "Picos cortos (p. ej., 1 h o 1 h 30 min) de un número limitado de vuelos", "Cierres prolongados de aeropuerto por meteorología adversa", "Desequilibrios detectados en la fase estratégica, hasta 7 días antes"], "ans": 1, "why": "Se usa para picos cortos de un número limitado de vuelos en zonas congestionadas; consiste en seleccionar vuelos y aplicar medidas ATFCM solo a esos vuelos, y puede combinarse con otras medidas.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.1, p. 27", "note": ""}, {"n": 88, "stem": "Una regulación se define como una medida que:", "opts": ["Limita con CTOT los vuelos que entran en un espacio aéreo o aeródromo", "Cierra un sector hasta que la demanda baje por debajo de la capacidad", "Cambia los niveles de vuelo de todos los vuelos que cruzan el sector", "Aumenta el número de sectores abiertos para atender la demanda prevista"], "ans": 0, "why": "La regulación adecua la demanda a la capacidad disponible limitando los vuelos con entrada prevista a un espacio aéreo o aeródromo mediante la asignación de CTOT, que demoran el despegue para que entren más tarde.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 27", "note": ""}, {"n": 89, "stem": "Dentro del espacio aéreo que gestiona un ACC, ¿quién aprueba las medidas de control de afluencia decididas en la FMP para las dependencias en las que ENAIRE presta el servicio ATS?", "opts": ["El Supervisor", "El Jefe de Sala del ACC", "El NMOC", "La Dirección de Operaciones"], "ans": 1, "why": "Corresponde al Jefe de Sala del ACC; las medidas deben estar siempre debidamente justificadas y se dejará constancia escrita de ellas.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 b, p. 27", "note": ""}, {"n": 90, "stem": "En las dependencias en las que ENAIRE no es el proveedor de servicios ATS, las medidas de afluencia:", "opts": ["Las aprueba el Jefe de Sala del ACC, por escrito", "Las aprueba el NMOC a propuesta del supervisor", "Se coordinan directamente con la FMP, sin aprobación del Jefe de Sala", "No son de aplicación en esas dependencias"], "ans": 2, "why": "Punto d: esas dependencias coordinan directamente con la FMP y no necesitan la aprobación de las medidas por parte del Jefe de Sala.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 d, p. 27", "note": ""}, {"n": 91, "stem": "Sectores sin OTMV definidos: la capacidad de monitorización durante los primeros 60 minutos es la capacidad HEC declarada incrementada en:", "opts": ["5 %", "10 %", "15 %", "20 %"], "ans": 1, "why": "+10 % durante los primeros 60 minutos, siempre que en los ciento veinte (120) minutos posteriores no se rebase la capacidad declarada.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 28", "note": ""}, {"n": 92, "stem": "El procedimiento del +10 % para sectores sin OTMV se aplica en todos los sectores de control EXCEPTO:", "opts": ["Los sectores de los TMA de Barcelona y Madrid", "Los sectores de Canarias", "Los sectores superiores de los ACC", "Los sectores de Palma"], "ans": 0, "why": "El manual excluye los sectores de control correspondientes a los TMA de Barcelona y Madrid.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 a, p. 28", "note": ""}, {"n": 93, "stem": "La demanda de la primera hora supera la capacidad declarada, pero es inferior a la declarada +10 %, y en los 120 minutos siguientes no supera la capacidad declarada. Resultado:", "opts": ["Regular a la capacidad declarada", "Regular a la declarada +10 %", "No regular", "Aplicar MDI"], "ans": 2, "why": "Regla b: en ese caso no se aplicará regulación, siempre que en los 120 minutos posteriores la demanda no supere la capacidad declarada.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 b, p. 28", "note": ""}, {"n": 94, "stem": "La demanda de la primera hora supera la declarada +10 %, y en los 120 minutos siguientes no supera la capacidad declarada. Resultado:", "opts": ["Regular la primera hora a la declarada +10 % y después, si es preciso, a la declarada", "Regular todo a la capacidad declarada desde el comienzo de la regulación", "No regular, porque los 120 minutos siguientes están dentro de la declarada", "Regular todo el periodo a la capacidad declarada incrementada un 10 %"], "ans": 0, "why": "Regla c: se regulará la primera hora a ese valor (declarada +10 %) y las horas siguientes, si es preciso, a la capacidad declarada.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 c, p. 28", "note": ""}, {"n": 95, "stem": "La primera hora supera la capacidad declarada y los 120 minutos siguientes también la superan. Resultado:", "opts": ["Regular a la declarada +10 % durante todo el periodo", "No regular y aplicar solo medidas STAM", "Aplicar solo level capping en el sector afectado", "Regular a la capacidad declarada desde el comienzo de la regulación"], "ans": 3, "why": "Regla d: cuando la demanda supera la declarada en la primera hora y también en los 120 minutos siguientes, se regula a la capacidad declarada desde el comienzo de la regulación.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2 d, p. 28", "note": ""}, {"n": 96, "stem": "En los sectores con OTMV definidos, el rate de regulación debe ser:", "opts": ["Igual o superior a la declarada, para bajar el OCC Peak y controlar el OCC Sustained", "Siempre un 10 % inferior a la capacidad declarada del sector", "Igual a la capacidad máxima durante los primeros 60 minutos", "El que proponga el operador más afectado por la regulación"], "ans": 0, "why": "Se aplica un rate igual o superior a la capacidad declarada que permita bajar el OCC Peak y controlar el OCC Sustained; puede determinarse con herramientas como ASIM, IMPACT o SIMEX, que simulan con datos de EUROCONTROL.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 28", "note": ""}, {"n": 97, "stem": "Con independencia de las coordinaciones con el NM, la decisión final de implantar, modificar o cancelar una medida ATFCM corresponde a la:", "opts": ["FMP", "NMOC", "Supervisor", "AMC"], "ans": 0, "why": "El manual dice: «la decisión final de implantar, modificar o cancelar cualquier medida ATFCM, pertenece a la FMP».", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.2, p. 29", "note": ""}, {"n": 98, "stem": "En cuanto al CTOT y la autorización ATC, el manual dice que:", "opts": ["El CTOT se comunica únicamente al operador, nunca en la autorización", "Los Estados se asegurarán de que el CTOT, cuando aplique, se incluya en la autorización ATC", "La autorización ATC se emite solo cuando ya ha pasado el CTOT", "El CTOT sustituye a la autorización ATC y la hace innecesaria"], "ans": 1, "why": "Pauta a: el CTOT, cuando aplique, se incluye como parte de la autorización ATC, y el ATC tiene en cuenta tanto el turno de salida como la suspensión de un vuelo.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3 a, p. 29", "note": ""}, {"n": 99, "stem": "Si aparece un plan de vuelo suspendido, el controlador de torre:", "opts": ["Autoriza el despegue del vuelo", "Cancela el plan", "Contacta solo con el operador", "Comunica con la FMP"], "ans": 3, "why": "Pauta b: si aparece un plan de vuelo suspendido, el CTA de TWR comunica con la FMP.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.3 b, p. 29", "note": ""}, {"n": 100, "stem": "¿Qué afirmación sobre los vuelos exentos y los vuelos excluidos es correcta?", "opts": ["Exentos: todas las regulaciones, autorizados por los proveedores de servicio; excluidos: alguna regulación, autorizados por los Estados", "Exentos: todas las regulaciones, autorizados por los Estados; excluidos: alguna regulación o volumen, autorizados por los proveedores de servicio", "Exentos: alguna regulación, autorizados por los Estados; excluidos: todas las regulaciones, autorizados por el NMOC", "Exentos y excluidos: todas las regulaciones, autorizados en ambos casos por el NMOC"], "ans": 1, "why": "El manual: los exentos lo son para todas las regulaciones y los autorizan los Estados; los excluidos solo lo están de alguna regulación o volumen específico y los autorizan los proveedores de servicio.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.4, p. 29", "note": ""}, {"n": 101, "stem": "¿Qué vuelo NO figura en la lista de vuelos exentos del manual?", "opts": ["Un vuelo que transporta a un jefe de Estado", "Un vuelo de búsqueda y salvamento", "Un vuelo médico o de ambulancia cuando están en juego vidas humanas", "Un vuelo regular de carga de una gran aerolínea"], "ans": 3, "why": "Exentos: vuelos que transporten Jefes de Estado o equivalentes, misiones de búsqueda y salvamento, vuelos autorizados por autoridades relevantes de los Estados, vuelos médicos/ambulancias cuando estén en juego vidas humanas y servicios de extinción de incendios.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.4, p. 30", "note": ""}, {"n": 102, "stem": "¿Quién decide la cancelación de una regulación y quién es el responsable último?", "opts": ["La decide el NMOC; la FMP es la responsable última", "La decide el Supervisor; el TCA es el responsable último", "La decide la FMP correspondiente; el Jefe de Sala es el responsable último", "La decide la AMC; la UCATM es la responsable última"], "ans": 2, "why": "Apartado 3.5.5.5: una regulación se cancela cuando deja de ser necesaria; la decisión se toma en la FMP correspondiente y el Jefe de Sala es el responsable último de tomarla.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.5, p. 30", "note": ""}, {"n": 103, "stem": "¿Cuál es uno de los tres pasos que se siguen al modificar o cancelar una regulación?", "opts": ["Esperar a que caduquen todos los CTOT asignados", "Volver a emitir todos los planes de vuelo", "Monitorizar el impacto de la actualización en la carga de tráfico", "Cerrar el sector afectado hasta que baje la carga"], "ans": 2, "why": "Los tres pasos de la figura: 1) contactar con el personal NM lo antes posible para informar sobre el cambio y tomar las medidas necesarias previa coordinación entre jefe de sala y NMOC; 2) monitorizar el impacto de la actualización en la carga de tráfico; 3) tomar las medidas necesarias para evitar que la modificación provoque una nueva sobrecarga.", "src": "Manual 6 (nov. 2026), capítulo 3.5.5.5, p. 30 (figura)", "note": ""}, {"n": 104, "stem": "El concepto FUA se basa en:", "opts": ["Un espacio aéreo único y continuo, de uso flexible, en el que toda segregación es temporal", "Separar de forma permanente el espacio aéreo civil del militar", "Reservar las rutas condicionales para uso exclusivo militar", "Asignar el espacio aéreo militar solo durante la noche"], "ans": 0, "why": "FUA: el espacio aéreo no se considera civil o militar, sino único y continuo, y su uso es flexible según las necesidades; cualquier segregación deberá ser de naturaleza temporal.", "src": "Manual 6 (nov. 2026), capítulo 4.1, p. 30", "note": ""}, {"n": 105, "stem": "¿Qué nivel FUA corresponde a la gestión día a día, el día anterior a las operaciones, a través de la AMC?", "opts": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "ans": 1, "why": "Nivel 1, estratégico (planificación a largo plazo); nivel 2, pretáctico (día anterior, AMC); nivel 3, táctico (tiempo real).", "src": "Manual 6 (nov. 2026), capítulo 4.1, p. 31", "note": ""}, {"n": 106, "stem": "Un TSA (área temporalmente segregada) es:", "opts": ["Un volumen de espacio aéreo a través del cual puede transitar otro tráfico con autorización ATC", "Una ruta condicional", "Un área de dimensiones predefinidas reservada temporalmente, a través de la cual no puede transitar ningún otro tráfico", "Un espacio aéreo de coordinación previa"], "ans": 2, "why": "TSA: áreas de dimensiones predefinidas para necesidades civiles y militares que requieran una reserva temporal de espacio aéreo, a través de las cuales no se puede permitir el tránsito de otros tráficos. La descripción de A corresponde al TRA.", "src": "Manual 6 (nov. 2026), capítulo 4.2 a, p. 31", "note": ""}, {"n": 107, "stem": "Un TRA (área temporalmente restringida), según el manual, es:", "opts": ["Un área de dimensiones predefinidas a través de la cual nunca puede transitar otro tráfico", "Un área de restricción permanente publicada en el AIP para uso militar", "Una ruta ATS de carácter no permanente con ruta alternativa", "Un volumen para una actividad aeronáutica específica que otro tráfico puede cruzar con autorización ATC"], "ans": 3, "why": "El TRA es el volumen definido de espacio aéreo para uso específico de una actividad aeronáutica, a través del cual se puede permitir el tránsito de otro tráfico bajo autorización ATC; en eso se distingue del TSA (A). C describe una CDR.", "src": "Manual 6 (nov. 2026), capítulo 4.2 b, p. 31", "note": ""}, {"n": 108, "stem": "¿Qué categoría de ruta condicional existe hoy según el manual?", "opts": ["CDR 1, 2 y 3", "Solo CDR 2", "Solo CDR 3", "Solo CDR 1"], "ans": 3, "why": "Se han eliminado dos de las tres categorías y solo queda la CDR 1, que se establece en la fase estratégica (nivel 1) y puede planificarse de forma permanente en los FPL.", "src": "Manual 6 (nov. 2026), capítulo 4.2 c, p. 31", "note": ""}, {"n": 109, "stem": "Una CDR1 se cierra temporalmente. ¿Qué deben hacer los operadores con FPL afectados?", "opts": ["Continuar con el plan y esperar instrucciones del ATC", "Cancelar el FPL y presentar uno nuevo con la ruta alternativa en la casilla 15", "Enviar un mensaje DLA con la nueva hora prevista de fuera calzos", "Enviar un mensaje CHG con la ruta alternativa en la casilla 15"], "ans": 1, "why": "Los FPL afectados por rutas cerradas temporalmente deben cancelarse y se presentará un nuevo FPL que incluya en la casilla 15 la ruta alternativa publicada para cada CDR1 no disponible.", "src": "Manual 6 (nov. 2026), capítulo 4.2 c, p. 31", "note": ""}, {"n": 110, "stem": "Cuando una CDR1 debe cerrarse al tráfico con poco tiempo de preaviso, el ATC:", "opts": ["Cancela todos los planes de vuelo afectados", "Da instrucciones para usar rutas alternativas en la fase táctica", "Aplica un MDI en los aeródromos de salida", "Deniega el cruce y mantiene a los vuelos en espera"], "ans": 1, "why": "El manual dice que el ATC dará instrucciones a los vuelos para utilizar rutas alternativas en la fase táctica.", "src": "Manual 6 (nov. 2026), capítulo 4.2 c, p. 31", "note": ""}, {"n": 111, "stem": "La AMC distribuye el AUP a EUROCONTROL, a los ACC/FMP y a las AMC adyacentes:", "opts": ["Antes de las 14:00 UTC del día anterior a las operaciones", "A las 06:00 UTC del día de las operaciones", "Después de las 18:00 UTC del día anterior", "En las 24 horas posteriores a las operaciones"], "ans": 0, "why": "Antes de las 14:00 UTC del día anterior a las operaciones, con un período de validez de 24 horas a partir de las 06:00 UTC del día siguiente.", "src": "Manual 6 (nov. 2026), capítulo 4.2.2, p. 32", "note": ""}, {"n": 112, "stem": "El período de validez del AUP es:", "opts": ["12 horas a partir de las 00:00 UTC del día de las operaciones", "24 horas a partir de las 06:00 UTC del día siguiente al de la distribución", "48 horas a partir de las 14:00 UTC del día de la distribución", "24 horas a partir de las 14:00 UTC del día de la distribución"], "ans": 1, "why": "El AUP es válido 24 horas a partir de las 06:00 UTC del día siguiente; se distribuye antes de las 14:00 UTC del día anterior a las operaciones.", "src": "Manual 6 (nov. 2026), capítulo 4.2.2, p. 32", "note": ""}, {"n": 113, "stem": "El AUP contiene:", "opts": ["La lista de rutas CDR2 disponibles y los niveles asignados", "La lista de vuelos exentos de regulación para el día siguiente", "El Plan Diario ATFCM (ADP) con las regulaciones previstas", "Rutas ATS permanentes y CDR 1 cerradas temporalmente, y TSA y TRA activadas"], "ans": 3, "why": "Estos son los dos apartados del AUP: lista de rutas ATS permanentes y CDR 1 cerradas temporalmente, y lista de TSA y TRA activadas. El UUP lo actualiza.", "src": "Manual 6 (nov. 2026), capítulo 4.2.2, p. 32", "note": ""}, {"n": 114, "stem": "El glosario del manual define CTOT como:", "opts": ["Hora calculada de despegue", "Hora estimada de despegue", "Hora prevista de fuera calzos", "Hora de llegada calculada"], "ans": 0, "why": "ETOT es la hora estimada de despegue; EOBT, la hora prevista de fuera calzos; CTOT, la hora calculada de despegue (<em>Calculated take-off time</em>).", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 115, "stem": "Según el glosario, RCA tiene dos significados:", "opts": ["Reglamento de Circulación Aérea y Espacio Aéreo de coordinación reducida", "Red de Control Aéreo y Regulación de Capacidad Aérea", "Área de Control de Ruta (<em>Route Control Area</em>) y Área de Control Radar (<em>Radar Control Area</em>)", "Área de Control de Notificación (<em>Reporting Control Area</em>) y Espacio Aéreo de Control Restringido (<em>Restricted Control Airspace</em>)"], "ans": 0, "why": "El glosario recoge «Reglamento de Circulación Aérea / Air traffic regulations» y «Espacio Aéreo de coordinación reducida / Reduced coordination airspace».", "src": "Manual 6 (nov. 2026), capítulo 5 (Acrónimos), p. 34", "note": ""}, {"n": 116, "stem": "Según SERA, tal como lo recoge el manual, el plan de vuelo es:", "opts": ["Una información especificada que, respecto a un vuelo proyectado o a parte del mismo, se somete a las dependencias ATS", "La autorización que expide una dependencia ATC para que una aeronave proceda en condiciones especificadas", "El conjunto de datos que el NMOC genera para asignar un slot a cada vuelo IFR de la red", "La notificación que el piloto envía al aterrizar para cerrar el vuelo ante la oficina ARO"], "ans": 0, "why": "Definición de 1.1: «Según SERA, el plan de vuelo es una información especificada que, respecto a un vuelo proyectado o a parte del mismo, se somete a las dependencias de los Servicios de Tránsito Aéreo». B describe una autorización ATC.", "src": "Manual 6 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 117, "stem": "Según el manual, el plan de vuelo se presenta para su aceptación y tramitación con el fin de que dispongan de los datos necesarios las dependencias de:", "opts": ["Meteorología, información aeronáutica y comunicaciones", "Control, alerta e información de vuelo", "Seguridad aeroportuaria, aduanas y policía de fronteras", "Gestión de afluencia, asignación de slots y capacidad"], "ans": 1, "why": "1.1: se presenta «con el fin de que las dependencias de control, alerta e información de vuelo dispongan de los datos necesarios para poder proporcionar los servicios que requiera la aeronave».", "src": "Manual 6 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 118, "stem": "La expresión «Plan de vuelo» se aplica también, en supuestos excepcionales, a la información que se exige para obtener permiso para una parte secundaria de un vuelo. ¿Qué ejemplo da el manual?", "opts": ["Sobrevolar una zona peligrosa activa fuera del espacio aéreo controlado", "Cambiar el nivel de crucero durante la fase de ruta", "Solicitar un cambio de frecuencia a la dependencia de aproximación", "Cruzar una aerovía, o despegar de un aeródromo controlado o aterrizar en él"], "ans": 3, "why": "La introducción cita como parte secundaria de un vuelo «cruzar una aerovía, despegar de un aeródromo controlado o aterrizar en él».", "src": "Manual 6 (nov. 2026), Introducción, p. 4", "note": ""}, {"n": 119, "stem": "La introducción del manual atribuye la necesidad de equilibrar demanda y capacidad al incremento del tránsito, principalmente en los países del área ECAC. ECAC significa:", "opts": ["European Civil Aviation Conference", "European Common Aviation Certification", "Eurocontrol Central Airspace Coordination", "European Centre for Air Control"], "ans": 0, "why": "El manual escribe «ECAC (European Civil Aviation Conference)», es decir, la Conferencia Europea de Aviación Civil (CEAC).", "src": "Manual 6 (nov. 2026), Introducción, p. 4", "note": ""}, {"n": 120, "stem": "Según el manual, requiere presentar plan de vuelo cualquier vuelo VFR en espacio aéreo controlado de las clases:", "opts": ["A, B y C", "C y D solamente", "D, E, F y G", "B, C, D y E"], "ans": 3, "why": "La lista de 1.2.1 dice: «Cualquier vuelo VFR en espacios aéreos controlados clases B, C, D y E».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 121, "stem": "¿Cuál de los siguientes vuelos VFR requiere presentar plan de vuelo según la lista del manual?", "opts": ["Un VFR diurno local en un aeródromo no controlado y sin AFIS, en espacio aéreo de clase G", "Un VFR diurno en el circuito de tránsito de un aeródromo no controlado sin servicio AFIS", "Un VFR que, procediendo del territorio nacional, va a operar en espacio de jurisdicción española sobre aguas internacionales", "Un VFR diurno entre dos aeródromos no controlados sin AFIS, siempre en clase G y dentro de España"], "ans": 2, "why": "La lista incluye «cualquier vuelo VFR que, procediendo del territorio nacional, vaya a operar en espacio aéreo de jurisdicción española sobre aguas internacionales». Los otros tres no cumplen ninguno de los supuestos (ni controlado, ni AFIS, ni nocturno, ni frontera).", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 122, "stem": "¿Qué vuelo está exento de presentar plan de vuelo (1.2.1) pero NO figura en la lista de vuelos exentos de las regulaciones ATFCM (3.5.5.4)?", "opts": ["Un vuelo de búsqueda y salvamento en misión de urgencia", "Un vuelo que transporta a un Jefe de Estado", "Un vuelo militar en misión táctica o de defensa aérea", "Un vuelo de un servicio de extinción de incendios"], "ans": 2, "why": "Exentos de FPL: militares en misiones tácticas o de defensa aérea, búsqueda y salvamento en misiones de urgencia y vuelos expresamente autorizados. Exentos de regulación: Jefes de Estado, búsqueda y salvamento, autorizados por los Estados, médicos con vidas en juego y extinción de incendios. A está en las dos listas; B y D solo en la de regulaciones.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5; capítulo 3.5.5.4, p. 30", "note": ""}, {"n": 123, "stem": "Si en un aeródromo de uso restringido no se dispone de medios establecidos para presentar el plan de vuelo en la dependencia designada, el plan se presentará:", "opts": ["Por radio a la primera dependencia ATS que preste servicio en la ruta propuesta", "Por teléfono al NMOC de EUROCONTROL, en Bruselas", "Por escrito a la Dirección General de Aviación Civil", "En el aeródromo de destino, después del aterrizaje"], "ans": 0, "why": "El manual: «Si no se dispone de medios establecidos para la presentación del plan de vuelo en la dependencia designada, se presentará por radio a la primera dependencia ATS que preste servicio en la ruta propuesta en el plan de vuelo».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 124, "stem": "A los aeródromos y helipuertos de uso restringido autorizados por la Dirección General de Aviación Civil se les asigna:", "opts": ["Una FMP propia que asume las tareas de la oficina ARO", "Un indicador OACI de cuatro letras y una ruta CDR1 asociada", "Una zona geográfica del IFPS, publicada en el AUP diario", "Una zona geográfica de la ARO centralizada, publicada en AIP-España ENR 1.10"], "ans": 3, "why": "Se les asigna una zona geográfica de la oficina ARO centralizada que asume las tareas de esa dependencia ATS; las zonas designadas están en AIP-España, ENR 1.10 (ejemplo: La Cuesta, Córdoba, zona 10).", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 125, "stem": "Según el apartado de direccionamiento, ¿quién se encarga de retransmitir el plan de vuelo a los destinatarios correspondientes?", "opts": ["El piloto al mando o su representante, desde el aeródromo de salida", "El NMOC, que lo envía a todas las dependencias del área ECAC", "La ARO centralizada o, si es AFIL, la estación de telecomunicaciones que lo acepta", "La torre del aeródromo de destino, una vez aceptado el plan"], "ans": 2, "why": "Son la oficina ARO centralizada o la estación de telecomunicaciones aeronáuticas que sirve a una dependencia ATS (en el caso de plan AFIL), responsables de la aceptación del plan, las encargadas de retransmitirlo. El piloto responde de los mensajes asociados posteriores.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 126, "stem": "Según el manual, ¿para qué vuelos puede la autoridad competente haber prescrito un plazo de presentación del plan de vuelo más corto que los generales?", "opts": ["Los vuelos IFR sujetos a medidas ATFM", "Los vuelos VFR domésticos", "Los vuelos que atraviesan fronteras internacionales", "Los vuelos que presentan un plan AFIL"], "ans": 1, "why": "Los plazos se aplican «salvo que la autoridad competente haya prescrito un plazo más corto para los vuelos VFR domésticos».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), pp. 5-6", "note": ""}, {"n": 127, "stem": "Sobre los plazos de presentación del plan de vuelo, ¿qué afirmación es correcta?", "opts": ["Debe presentarse al menos 120 horas antes de la EOBT", "Los vuelos sujetos a ATFM lo presentan al menos 60 minutos antes de la EOBT", "Un plan presentado en vuelo debe recibirse al menos 30 minutos antes del punto de entrada", "No puede presentarse más de 120 horas antes de la EOBT"], "ans": 3, "why": "120 horas es un máximo («no más de 120 horas antes»); los demás plazos son mínimos: 3 h para los vuelos sujetos a ATFM, 60 min para los demás y 10 min antes del punto de entrada para el plan presentado en vuelo.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Tiempo de presentación»), pp. 5-6", "note": ""}, {"n": 128, "stem": "El plan de vuelo que reemplaza (RFP) debe contener, entre otros datos:", "opts": ["Un indicativo nuevo, la ruta original en la casilla 15 y «RFP/Qn» en la casilla 19", "El indicativo original, la nueva ruta completa en la casilla 15 y «RFP/Qn» al final de la casilla 18", "El indicativo original, solo el tramo de ruta modificado y «RFP/Qn» en la casilla 15", "El indicativo original, la nueva ruta en la casilla 18 y «RFP/Qn» al principio de la casilla 15"], "ans": 1, "why": "Debe contener el indicativo de vuelo original, la nueva ruta completa en la casilla 15 y, como último elemento en la casilla 18, la indicación «RFP/Qn».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Procedimiento»), p. 6", "note": ""}, {"n": 129, "stem": "En la indicación «RFP/Qn» del plan de vuelo que reemplaza, «n» corresponde a:", "opts": ["El número de RFP que se presenta", "El número de la casilla modificada", "El número de horas de antelación respecto a la EOBT", "El nivel de prioridad AFTN del mensaje"], "ans": 0, "why": "El manual dice que «n» corresponde al número de RFP que se presenta.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Procedimiento»), p. 6", "note": ""}, {"n": 130, "stem": "¿Cuál de los siguientes datos NO aparece en la lista de contenido del plan de vuelo del manual?", "opts": ["La autonomía", "El número total de personas a bordo", "La categoría de estela turbulenta", "La hora calculada de despegue (CTOT)"], "ans": 3, "why": "La lista incluye la autonomía, el número total de personas a bordo y «número y tipo o tipos de aeronaves y categoría de estela turbulenta». El CTOT no lo pone el piloto: lo calcula el sistema ATFCM y se incluye en la autorización.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Contenido»), p. 6", "note": ""}, {"n": 131, "stem": "Según el manual, se puede encontrar un ejemplo del formulario FPL en:", "opts": ["El Anexo 11 de la OACI y en el IFPS handbook", "El Doc 8400 de la OACI y en AIP GEN 3.3", "El Apéndice 6 de SERA y en AIP ENR 1.10", "El Apéndice 2 de SERA y en AIP ENR 1.9"], "ans": 2, "why": "«Se puede encontrar un ejemplo del formulario FPL en el Apéndice 6 de SERA y en AIP ENR 1.10».", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Formulario de plan de vuelo»), p. 7", "note": ""}, {"n": 132, "stem": "El formulario de plan de vuelo que se utiliza, según el manual, es el normalizado por la OACI:", "opts": ["Solo en inglés", "Solo en español", "En francés y en inglés", "En español y en inglés"], "ans": 3, "why": "«Se utiliza el formulario de plan de vuelo normalizado por OACI, en español y en inglés». La figura de la p. 8 es bilingüe.", "src": "Manual 6 (nov. 2026), capítulo 1.2.1 («Formulario de plan de vuelo»), p. 7", "note": ""}, {"n": 133, "stem": "En la casilla 19 del formulario FPL que reproduce el manual, ¿qué indicador precede a la autonomía (<em>Endurance</em>)?", "opts": ["A/", "N/", "P/", "E/"], "ans": 3, "why": "En la casilla 19: E/ autonomía, P/ personas a bordo, R/ radio de emergencia, S/ equipo de supervivencia, J/ chalecos, D/ botes neumáticos, A/ color y marcas, N/ observaciones, C/ piloto al mando.", "src": "Manual 6 (nov. 2026), formulario FPL OACI, p. 8 (figura)", "note": ""}, {"n": 134, "stem": "En la casilla 19 del formulario FPL, el indicador «N/» introduce:", "opts": ["Las observaciones (<em>Remarks</em>)", "El número de personas a bordo", "El número de botes neumáticos", "El nombre del piloto al mando"], "ans": 0, "why": "N/ = observaciones (<em>Remarks</em>). Las personas a bordo van tras P/, los botes neumáticos tras D/ (número, capacidad, cubierta y color) y el piloto al mando tras C/.", "src": "Manual 6 (nov. 2026), formulario FPL OACI, p. 8 (figura)", "note": ""}, {"n": 135, "stem": "En el formulario FPL que reproduce el manual, la
