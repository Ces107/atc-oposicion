@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}

nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}

.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}

h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}

pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}

main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}

.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}

.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}

.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}

h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}

.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}

.row-title{font-weight:600}

.row-desc{color:var(--mut);font-size:.9rem}

@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}

table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}

main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}

T04)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Cuál de estas dos fuentes oficiales OACI/DoD da valores numéricos distintos para GM (la constante gravitacional de la Tierra que usa el WGS-84) y en cuánto difieren al nivel de precisión indicado?", "opts": ["El Doc 9674 de la OACI (2002) da 398 600,5 km^3/s^2; el NIMA TR8350.2 (1997) da 398 600,4418 km^3/s^2", "Ambas fuentes coinciden exactamente hasta nueve cifras significativas", "El manual WGS 84 de EUROCONTROL da un valor diez veces mayor que el de la OACI", "La diferencia está solo en las unidades utilizadas (km^3/s^2 frente a NM^3/s^2)"], "ans": 0, "why": "La Tabla 3-1 del Doc 9674 recoge el valor original de 1987, 398 600,5 km^3/s^2; el valor refinado del DoD en el NIMA TR8350.2 es 3986004,418 x 10^8 m^3/s^2 = 398600,4418 km^3/s^2. Difieren en las últimas cifras.", "src": "OACI Doc 9674, Tabla 3-1; NIMA TR8350.2, apartado 3.2", "note": ""}, {"n": 2, "stem": "En la terminología del Doc 9674 de la OACI, el coeficiente que el manual de ENAIRE denomina «J2 = -484,16685 x 10^-6» se llama con más precisión:", "opts": ["El achatamiento f", "La constante gravitacional geocéntrica GM", "La excentricidad e", "El coeficiente armónico zonal normalizado de segundo grado C2,0"], "ans": 3, "why": "La Tabla 3-1 del Doc 9674 da a este mismo valor el nombre «coeficiente armónico zonal normalizado de segundo grado del potencial gravitatorio» (Normalized second degree zonal harmonic coefficient of the gravitational potential), con el símbolo C2,0 y no J2.", "src": "OACI Doc 9674, Tabla 3-1", "note": ""}, {"n": 3, "stem": "Según el Doc 9674 de la OACI, el origen y la orientación de los ejes de coordenadas del WGS-84 quedan definidos por las coordenadas X, Y, Z de cuántas estaciones de seguimiento GPS:", "opts": ["Tres", "Cuatro", "Cinco", "Siete"], "ans": 2, "why": "Las cinco estaciones son Colorado Springs (control maestro), Hawái, Ascensión, Diego García y Kwajalein.", "src": "OACI Doc 9674, 3.2.1 y Fig. 3-2", "note": ""}, {"n": 4, "stem": "Según el Doc 9674 de la OACI, ¿qué exactitud (1 sigma) puede exigir una aproximación de precisión de categoría III basada en satélites que la definición básica de coordenadas WGS-84 no puede proporcionar por sí sola?", "opts": ["100 m en horizontal", "No se necesita ninguna exactitud adicional para la CAT III", "1 NM en horizontal", "6,0 m en horizontal y 0,6 m en vertical"], "ans": 3, "why": "El Doc 9674 indica que la CAT III necesita una exactitud de 0,6 m en vertical y 6,0 m en horizontal, más fina que la definición propia del WGS-84 (±1 m); el ITRF puede proporcionarla.", "src": "OACI Doc 9674, 3.3.4", "note": ""}, {"n": 5, "stem": "El Real Decreto 1071/2007 asigna qué proyección a la cartografía terrestre española (básica y derivada) a escalas de 1:500 000 o menores:", "opts": ["Universal Transversa de Mercator", "Mercator", "Gnomónica", "ETRS-Lambert cónica conforme"], "ans": 3, "why": "El artículo 5.1 del RD 1071/2007 adopta el sistema de referencia de coordenadas ETRS-Lambert cónico conforme para la cartografía terrestre a escala 1:500 000 o menor.", "src": "Real Decreto 1071/2007, art. 5.1", "note": ""}, {"n": 6, "stem": "Según el artículo 5 del RD 1071/2007, ¿qué proyección se aplica a la cartografía terrestre española a escalas mayores que 1:500 000?", "opts": ["ETRS-Transversa de Mercator (UTM)", "Estereográfica polar", "Cónica conforme de Lambert", "Gnomónica"], "ans": 0, "why": "El artículo 5.2 adopta el sistema ETRS-Transversa de Mercator para escalas mayores que 1:500 000.", "src": "Real Decreto 1071/2007, art. 5.2", "note": ""}, {"n": 7, "stem": "¿Qué tamaño tiene una hoja del MTN50 (1:50 000) según el artículo 6 del RD 1071/2007?", "opts": ["5' de latitud x 10' de longitud", "2' 30\" x 5'", "1° x 1°", "10' de latitud x 20' de longitud"], "ans": 3, "why": "El artículo 6.2 fija las hojas del MTN50 en 10 minutos de latitud por 20 minutos de longitud.", "src": "Real Decreto 1071/2007, art. 6.2", "note": ""}, {"n": 8, "stem": "Según el plazo del RD 1071/2007, ¿desde qué fecha toda la cartografía y las bases de datos geográficas producidas o actualizadas por las administraciones públicas debían cumplir el ETRS89/REGCAN95?", "opts": ["27 de julio de 2007 (fecha del real decreto)", "1 de enero de 2012", "1 de enero de 2015", "No existe tal plazo"], "ans": 2, "why": "Las disposiciones transitorias exigen el cumplimiento desde el 1 de enero de 2015; antes de esa fecha se podía usar el ED50 o el ETRS89, siempre que las producciones en ED50 también estuvieran referidas al ETRS89.", "src": "Real Decreto 1071/2007, disposición transitoria segunda", "note": ""}, {"n": 9, "stem": "¿Cuál es la referencia vertical (altimétrica) oficial de la península según el artículo 4 del RD 1071/2007?", "opts": ["La ondulación del geoide en Madrid", "Solo mareógrafos locales, sin una referencia peninsular única", "La superficie del elipsoide GRS80", "Los registros del nivel medio del mar en Alicante"], "ans": 3, "why": "El artículo 4.1 fija los registros del nivel medio del mar en Alicante como referencia de altitudes para la península (las islas usan referencias de mareógrafos locales).", "src": "Real Decreto 1071/2007, art. 4.1", "note": ""}, {"n": 10, "stem": "El AIP España establece que ETRS89 y REGCAN95 no pueden usarse para publicar coordenadas en el AIP-España. ¿Cuál es el motivo indicado?", "opts": ["ETRS89/REGCAN95 se han ido separando del WGS-84 más allá de la exactitud requerida para algunos datos aeronáuticos", "Usan un elipsoide distinto del WGS-84", "La OACI prohíbe su uso para cualquier fin", "Carecen de un campo de época"], "ans": 0, "why": "El GEN 2.1 explica que ETRS89/REGCAN95 se consideraron inicialmente equivalentes al WGS-84, pero su divergencia continua ha producido desviaciones superiores a la exactitud requerida para ciertos datos.", "src": "AIP España GEN 2.1, apartado 3.1", "note": ""}, {"n": 11, "stem": "Según el AIP España GEN 2.1, ¿qué debe acompañar a las coordenadas aeronáuticas enviadas al AIS junto con los valores WGS-84?", "opts": ["Las coordenadas equivalentes en ED50", "No se requiere nada adicional", "El nombre del topógrafo", "La fecha de medición (época)"], "ans": 3, "why": "El GEN 2.1 indica que las coordenadas enviadas al AIS en WGS-84 deben incluir la época (fecha de medición) como metadato.", "src": "AIP España GEN 2.1, apartado 3", "note": ""}, {"n": 12, "stem": "La guía de sistemas de referencia de coordenadas de EUROCONTROL (2024) da como ejemplo una estación (BRUX, Bruselas) que se desplaza en el ITRF2020 a una velocidad aproximada de:", "opts": ["2,4 mm por año", "24 cm por año", "2,4 cm por año, hacia el noreste", "No se mueve; solo se mueven las estaciones del ETRS89"], "ans": 2, "why": "El ejemplo de la guía muestra que BRUX se desplaza unos 18 mm al este y 16 mm al norte por año, lo que combina unos 2,4 cm/año hacia el noreste.", "src": "EUROCONTROL CRS Basic User Guide, apartado 2.4", "note": ""}, {"n": 13, "stem": "Según la misma guía de EUROCONTROL, ¿por qué se definió el ETRS89 fijo a la parte estable de la placa euroasiática en la época 1989,00?", "opts": ["Para que las coordenadas fueran numéricamente idénticas a las del WGS-84 para siempre", "Para alinearse con el calendario AIRAC", "Porque el GPS no podía medir el movimiento de las placas antes de 1989", "Para que las bases de datos nacionales y los registros de la propiedad no necesiten actualizarse constantemente por la deriva continental"], "ans": 3, "why": "La guía explica que los sistemas globales como el WGS-84/ITRS se desplazan con la tectónica de placas, lo que resulta poco práctico para los usos catastrales nacionales, de modo que el ETRS89 elimina la mayor parte de esa deriva en Europa.", "src": "EUROCONTROL CRS Basic User Guide, apartado 2.5", "note": ""}, {"n": 14, "stem": "¿Qué realización del WGS-84 cita el AIP España GEN 2.1 como la vigente y a qué marco ITRF equivale?", "opts": ["G873, equivalente al ITRF96", "G1150, equivalente al ITRF2000", "G2139, equivalente al ITRF2014", "G1762, equivalente al ITRF2008"], "ans": 2, "why": "El GEN 2.1 indica que la última realización publicada por la NGA en la fecha de actualización de la página es la G2139, equivalente al ITRF2014.", "src": "AIP España GEN 2.1, apartado 3", "note": ""}, {"n": 15, "stem": "En una carta cónica conforme de Lambert construida con un cono secante, ¿dónde es exacta la escala?", "opts": ["A lo largo de los dos paralelos estándar", "Solo en el ápice", "Solo a lo largo del meridiano central", "En ninguna parte; la proyección no tiene línea de escala exacta"], "ans": 0, "why": "Bowditch y el USGS afirman que la escala es correcta (exacta, k = 1) precisamente a lo largo de los dos paralelos estándar de una cónica conforme de Lambert secante; es ligeramente menor entre ellos y ligeramente mayor fuera de ellos.", "src": "Bowditch, vol. 1, apartado 413; USGS PP1395", "note": ""}, {"n": 16, "stem": "Los paralelos estándar de la hoja de Canarias de la carta aeronáutica OACI 1:500 000 de España son:", "opts": ["37° N y 42° N", "30° N y 60° N", "33° N y 45° N", "24° N y 29° N"], "ans": 3, "why": "El AIP GEN 3.2 establece que los paralelos automecoicos son 24° N y 29° N para Canarias, frente a 37° N y 42° N para la península.", "src": "AIP España GEN 3.2, apartado 4.2", "note": ""}, {"n": 17, "stem": "Bowditch explica que la cónica conforme de Lambert se hizo popular en las cartas aeronáuticas específicamente porque:", "opts": ["Muestra las loxodrómicas como líneas exactamente rectas", "Es la única proyección equivalente", "Las señales de las radiobalizas viajan por círculos máximos y pueden trazarse en ella sin corrección, mientras que la carta sigue siendo conforme", "Puede mostrar toda la Tierra en una sola hoja"], "ans": 2, "why": "Bowditch indica que, como una línea recta en la LCC se aproxima mucho a un círculo máximo y las señales de radio viajan por círculos máximos, esta característica hizo popular la proyección en las cartas aeronáuticas sin perder la conformidad.", "src": "Bowditch, vol. 1, apartado 413", "note": ""}, {"n": 18, "stem": "Según el Professional Paper 1395 del USGS, la proyección UTM divide la Tierra (entre 84° N y 80° S) en cuántos husos y de qué anchura es cada uno:", "opts": ["24 husos, de 15° de anchura", "12 husos, de 30° de anchura", "36 husos, de 10° de anchura", "60 husos, de 6° de anchura"], "ans": 3, "why": "El USGS PP1395 establece que la Tierra se divide en 60 husos, cada uno de 6° de longitud en general, numerados hacia el este a partir del meridiano 180.", "src": "USGS PP1395, «Universal Transverse Mercator Projection»", "note": ""}, {"n": 19, "stem": "En el sistema UTM, ¿qué factor de escala se usa en el meridiano central y por qué se eligió ese valor concreto?", "opts": ["0,9996, para minimizar la variación máxima de escala dentro de un huso", "1,0000, para mantener el meridiano central a escala exacta", "1,0004, para compensar la curvatura de la Tierra", "0,9990, igual al factor secante de Mercator en el ecuador"], "ans": 0, "why": "El USGS explica que k0 = 0,9996 (una reducción de 1:2500) se eligió para minimizar la variación de escala en un huso, de modo que las líneas de escala exacta quedan a unos 180 km a cada lado del meridiano central.", "src": "USGS PP1395, «Universal Transverse Mercator Projection»", "note": ""}, {"n": 20, "stem": "¿Qué huso UTM (y meridiano central aproximado) cubre Madrid, según la regla estándar de husos de 6°?", "opts": ["Huso 28, meridiano central 15° W", "Huso 29, meridiano central 9° W", "Huso 30, meridiano central 3° W", "Huso 31, meridiano central 3° E"], "ans": 2, "why": "La longitud de Madrid (unos 3,7° W) cae en la banda de 0° a 6° W, huso UTM 30, cuyo meridiano central es 3° W.", "src": "Regla de husos UTM (USGS PP1395) aplicada a las coordenadas de Madrid", "note": ""}, {"n": 21, "stem": "Según Bowditch, en una carta de Mercator un círculo máximo (distinto de un meridiano o del ecuador) se representa como:", "opts": ["Una línea recta", "Una curva convexa hacia el ecuador", "Una circunferencia centrada en el polo", "Una curva cóncava hacia el ecuador"], "ans": 3, "why": "Bowditch afirma que los círculos máximos en la proyección de Mercator aparecen como líneas curvas cóncavas hacia el ecuador, que se extienden distancias iguales a cada lado.", "src": "Bowditch, vol. 1, apartado 405", "note": ""}, {"n": 22, "stem": "Según Bowditch, ¿cuál es la fórmula del factor de escala de Mercator en función de la latitud y su valor aproximado a 60°?", "opts": ["tan(latitud); valor 1,73 a 60°", "cos(latitud); valor 0,50 a 60°", "sec(latitud); valor 2,00 a 60°", "sen(latitud); valor 0,87 a 60°"], "ans": 2, "why": "La expansión de Mercator es igual a la secante de la latitud; sec 60° = 2,00, es decir, el mapa es allí el doble de grande en escala lineal.", "src": "Bowditch, vol. 1, apartado 405", "note": ""}, {"n": 23, "stem": "Según Bowditch, ¿qué proyección acimutal perspectiva sitúa el punto de proyección en el centro de la Tierra, de modo que todo círculo máximo aparece como una línea recta?", "opts": ["Estereográfica", "Ortográfica", "Gnomónica", "Policónica"], "ans": 2, "why": "Bowditch define la proyección gnomónica como la perspectiva desde el centro de la Tierra, lo que le da el nombre común de «carta de círculos máximos» (great-circle chart), porque todo círculo máximo es en ella una línea recta.", "src": "Bowditch, vol. 1, apartado 416", "note": ""}, {"n": 24, "stem": "Según Bowditch, ¿cuál es el procedimiento de navegación típico que usa una carta gnomónica junto con una carta de Mercator?", "opts": ["Trazar la derrota ortodrómica en la carta gnomónica, transferir los puntos de paso a la carta de Mercator y volar después tramos loxodrómicos entre ellos", "Trazar la loxodrómica directamente en la carta gnomónica", "Usar la carta gnomónica solo en vuelos polares, nunca con Mercator", "Convertir las coordenadas de Mercator en coordenadas gnomónicas con fórmulas UTM"], "ans": 0, "why": "Bowditch describe el trazado de la derrota ortodrómica en una carta gnomónica, la transferencia posterior de los puntos a una carta de Mercator y el seguimiento de loxodrómicas entre los puntos de paso.", "src": "Bowditch, vol. 1, apartado 416", "note": ""}, {"n": 25, "stem": "Según Bowditch, el principal uso en navegación de la proyección estereográfica (polar) es:", "opts": ["Cartas náuticas ecuatoriales", "Cartas de las regiones polares, con la cuadrícula UPS", "Cartas aeronáuticas en ruta en latitudes medias", "Cartas de puerto a escala muy grande"], "ans": 1, "why": "Bowditch indica que el principal uso de la proyección estereográfica en navegación son las cartas de las regiones polares y las soluciones mecánicas o gráficas del triángulo de navegación, ligadas a la cuadrícula Universal Polar Estereográfica (UPS).", "src": "Bowditch, vol. 1, apartado 417", "note": ""}, {"n": 26, "stem": "El Doc 9674 define un «punto calculado» (frente a un punto levantado o declarado) como aquel que es:", "opts": ["Medido directamente por un equipo de topografía de campo", "Utilizado solo para los límites de las FIR", "Definido de forma arbitraria sin referencia a ningún levantamiento", "Obtenido por manipulación matemática a partir de un punto levantado conocido (por ejemplo, una posición por radial y distancia)"], "ans": 3, "why": "El Doc 9674 define el punto calculado como el que se obtiene matemáticamente a partir de un punto levantado, como una posición por radial y distancia o una intersección.", "src": "OACI Doc 9674, apartado 2.2.2", "note": ""}, {"n": 27, "stem": "Según el Doc 9674, los requisitos de exactitud de los datos de posición aeronáuticos se basan normalmente en qué nivel de confianza:", "opts": ["50 % (1 sigma)", "68 % de error probable", "95 % (2 sigma)", "99,7 % (3 sigma)"], "ans": 2, "why": "El Doc 9674 establece que los requisitos de exactitud se basan en un nivel de confianza del 95 %, con la distribución normal circular como distribución subyacente.", "src": "OACI Doc 9674, apartado 2.4.4", "note": ""}, {"n": 28, "stem": "El Doc 9674 asigna qué nivel de integridad a los datos críticos, como las coordenadas del umbral de pista que definen el punto de aterrizaje:", "opts": ["1 x 10^-3", "1 x 10^-5", "1 x 10^-8", "1 x 10^-1"], "ans": 2, "why": "Los datos críticos tienen el requisito de integridad más alto, 1 x 10^-8, derivado del requisito de integridad del aterrizaje automático.", "src": "OACI Doc 9674, apartado 2.6.2.2", "note": ""}, {"n": 29, "stem": "Según el Doc 9674, ¿qué nivel de integridad se aplica a los datos «ordinarios» (routine), como los puntos de los límites de las FIR?", "opts": ["1 x 10^-8", "1 x 10^-5", "1 x 10^-3", "1 x 10^-1"], "ans": 2, "why": "A los datos ordinarios, cuyos errores no afectan a la actuaciones de navegación (<em>performance</em>), se les asigna una integridad de 1 x 10^-3.", "src": "OACI Doc 9674, apartado 2.6.2.2", "note": ""}, {"n": 30, "stem": "El Doc 9674 advierte de que los parámetros de transformación de datum publicados por distintas fuentes pueden diferir lo suficiente como para causar discrepancias sustanciales en las coordenadas. ¿Qué orden de magnitud indica?", "opts": ["Hasta unos 50 m", "Unos pocos milímetros", "Hasta unos 5 km", "No es posible ninguna discrepancia una vez publicados los parámetros"], "ans": 0, "why": "El Doc 9674 indica que, como los parámetros de datum y de transformación suelen estar determinados con poca robustez, pueden darse discrepancias de hasta 50 m entre los valores publicados por distintas fuentes de referencia.", "src": "OACI Doc 9674, apartado 4.2.2.2.2", "note": ""}, {"n": 31, "stem": "El Doc 9674 advierte de que digitalizar coordenadas a partir de un mapa impreso introduce error. ¿Aproximadamente cuánto puede quedar subestimada la distancia sobre el terreno entre dos puntos digitalizados, por kilómetro?", "opts": ["Hasta unos 30 cm por kilómetro", "Hasta unos 30 m por kilómetro", "Ningún error medible; la digitalización es exacta", "Hasta unos 3 km por kilómetro"], "ans": 0, "why": "El Doc 9674 pone el ejemplo de que una distancia de cuadrícula calculada a partir de coordenadas digitalizadas de un mapa puede ser hasta 30 cm por kilómetro menor que el valor medido sobre el terreno.", "src": "OACI Doc 9674, apartado 4.4.1.2", "note": ""}, {"n": 32, "stem": "Según el AIP España GEN 3.2, en las cartas incluidas en el AIP, ¿a partir de qué umbral de escala los obstáculos agrupados (de más de 100 m) se separan 2 NM del obstáculo más alto en lugar de 1 NM?", "opts": ["Escala (denominador) igual o mayor que 500 000, pero menor que 1 000 000", "Escala (denominador) igual o mayor que 1 000 000", "Cualquier escala menor que 1:100 000", "Solo en la carta OACI 1:500 000"], "ans": 0, "why": "El GEN 3.2 fija la banda de agrupación de 2 NM para las cartas con denominador igual o mayor que 500 000 pero menor que 1 000 000; por debajo de 500 000 es 1 NM, y con 1 000 000 o más, 3 NM.", "src": "AIP España GEN 3.2, apartado 1", "note": ""}, {"n": 33, "stem": "¿Qué carta del AIP España se indica expresamente que el AIS de ENAIRE vende, pero que NO está incluida en el propio AIP?", "opts": ["El Plano de aeródromo / helipuerto", "La Carta Aeronáutica OACI 1:500 000", "La carta SID", "La carta ATCSMAC"], "ans": 1, "why": "El manual de ENAIRE señala que España proporciona la carta OACI 1:500 000, pero no la incluye en el AIP-España.", "src": "Manual de ENAIRE «4. Cartografía», apartado 4.4.15", "note": ""}, {"n": 34, "stem": "Según el AIP España GEN 1.7, ¿se produce en España la Carta Aeronáutica Mundial OACI 1:1 000 000 (WAC)?", "opts": ["Sí, se publica cada dos años", "Sí, pero solo en formato digital", "No; el GEN 1.7 la recoge como no proporcionada en España", "Solo para las islas Canarias"], "ans": 2, "why": "El GEN 1.7 recoge el capítulo 16 (Carta Aeronáutica Mundial 1:1 000 000) como no proporcionado en España.", "src": "AIP España GEN 1.7", "note": ""}, {"n": 35, "stem": "Según el AIP España GEN 1.7, ¿en qué cartas se representa el norte verdadero, en lugar del magnético?", "opts": ["En todas las cartas de navegación en ruta y de área", "El norte verdadero no se muestra nunca en ninguna carta española", "Solo en las cartas ATCSMAC", "Solo en el Plano de aeródromo, el Plano de aeródromo para movimientos en tierra y el Plano de estacionamiento y atraque de aeronaves"], "ans": 3, "why": "El GEN 1.7 indica que el norte verdadero solo se muestra en las cartas aeronáuticas de aeródromo (ADC, GMC, PDC); las demás cartas de área usan el norte magnético, y el AOC y la PATC están orientados según la dirección de la pista.", "src": "AIP España GEN 1.7", "note": ""}, {"n": 36, "stem": "¿Qué significa la abreviatura «NO_ADQ» del AIP España asociada a un dato publicado marcado con una nota?", "opts": ["Not Applicable Data Quantity (cantidad de datos no aplicable)", "Not Aeronautical Data Quality (calidad de datos aeronáuticos no conforme: no cumple los requisitos del Catálogo de Datos)", "National Obstacle Data Query (consulta nacional de datos de obstáculos)", "Una designación exclusiva de NOTAM"], "ans": 1, "why": "El GEN 1.7 explica que NO_ADQ marca los datos que no cumplen los requisitos de exactitud, resolución o integridad del Catálogo de Datos Aeronáuticos, conforme al Reglamento (UE) 2017/373.", "src": "AIP España GEN 1.7", "note": ""}, {"n": 37, "stem": "En la TMA de Madrid, el AIP GEN 1.7 registra una desviación respecto al margen lateral normalizado de franqueamiento de obstáculos en la carta ATCSMAC. ¿Cuál es?", "opts": ["Un margen de 10 NM en lugar de 5 NM", "Un margen de 3 NM en lugar de 5 NM", "En Madrid no se aplica ningún margen", "Un margen de 1 NM en lugar de 3 NM"], "ans": 1, "why": "El GEN 1.7 indica que en algunos sectores ATCSMAC de la TMA de Madrid se utilizó, en el análisis de obstáculos, un margen lateral adicional inferior al normalizado aplicable (3 NM en lugar de 5 NM).", "src": "AIP España GEN 1.7", "note": ""}, {"n": 38, "stem": "Según el AIP España GEN 3.2, ¿cuál es la relación entre la escala vertical y la horizontal del Plano de obstáculos de aeródromo tipo A (AOC)?", "opts": ["Iguales (1:1)", "No hay escala vertical, solo horizontal", "La escala vertical es la mitad de la horizontal", "La escala vertical es diez veces la horizontal"], "ans": 3, "why": "El GEN 3.2 establece que la escala vertical del AOC es diez veces la horizontal, con un intervalo de escala horizontal de 1:10 000 a 1:50 000.", "src": "AIP España GEN 3.2, apartado 4.2", "note": ""}, {"n": 39, "stem": "La Carta topográfica para aproximaciones de precisión (PATC) del AIP España se elabora para qué categorías de aproximación de precisión:", "opts": ["Solo CAT I", "CAT II y CAT III", "Todas las categorías, incluidas las de no precisión", "Solo las aproximaciones en circuito"], "ans": 1, "why": "El GEN 3.2 indica que la PATC facilita información del perfil del terreno para las pistas con aproximaciones de precisión CAT II y III.", "src": "AIP España GEN 3.2, apartado 4.2", "note": ""}, {"n": 40, "stem": "¿Cuáles son las escalas horizontal y vertical de la Carta topográfica para aproximaciones de precisión (PATC) del AIP España?", "opts": ["Horizontal 1:2500 o 1:5000; vertical 1:500", "Horizontal 1:500; vertical 1:2500", "Horizontal y vertical, ambas 1:500", "Horizontal 1:10 000; vertical 1:1000"], "ans": 0, "why": "El GEN 3.2 da la escala horizontal de la PATC como 1:2500 o 1:5000 y su escala vertical como 1:500.", "src": "AIP España GEN 3.2, apartado 4.2", "note": ""}, {"n": 41, "stem": "Según el AIP España GEN 3.2, ¿en cuántas hojas se publica la Carta Aeronáutica OACI 1:500 000 para cubrir todo el espacio aéreo español?", "opts": ["3 hojas", "5 hojas", "7 hojas", "12 hojas"], "ans": 2, "why": "El GEN 3.2 establece que la serie de la carta 1:500 000 se publica en un conjunto de 7 hojas que cubren todo el espacio aéreo español.", "src": "AIP España GEN 3.2, apartado 4.2", "note": ""}, {"n": 42, "stem": "¿Qué es una «maniobra de desplazamiento lateral» (side-step), tal como se describe en las Cartas de aproximación por instrumentos del AIP España?", "opts": ["Un procedimiento de aproximación frustrada que solo se vuela de noche", "Una maniobra visual al final de una aproximación instrumental que permite aterrizar en una pista paralela situada a 1200 ft o menos de la pista autorizada", "Un procedimiento publicado de entrada a un circuito de espera", "Un cambio de reglaje del altímetro durante el descenso"], "ans": 1, "why": "El GEN 3.2 define la maniobra de desplazamiento lateral como el aterrizaje directo en una pista paralela situada a 1200 ft o menos de la pista para la que se autorizó la aproximación.", "src": "AIP España GEN 3.2, sección IAC", "note": ""}, {"n": 43, "stem": "Según el AIP España GEN 3.1, el sistema de publicación AIRAC usa fechas de entrada en vigor con qué intervalo fijo:", "opts": ["Cada 14 días", "Cada 21 días", "Cada 28 días", "Cada mes natural"], "ans": 2, "why": "El GEN 3.1 establece que el sistema AIRAC se basa en un calendario predeterminado, acordado internacionalmente, con intervalos de 28 días.", "src": "AIP España GEN 3.1, apartado 4", "note": ""}, {"n": 44, "stem": "El AIS España distribuye la información AIRAC cuántos días antes de la fecha de entrada en vigor y con cuánta antelación llega a los destinatarios:", "opts": ["14 días antes, con 7 días de antelación", "56 días antes, con 42 días de antelación", "28 días antes, con 14 días de antelación", "42 días antes, con 28 días de antelación"], "ans": 3, "why": "El GEN 3.1 establece que el AIS-España distribuye la información 42 días antes de la fecha de entrada en vigor para que llegue a los destinatarios con 28 días de antelación.", "src": "AIP España GEN 3.1, apartado 4", "note": ""}, {"n": 45, "stem": "¿Durante cuánto tiempo permanece vigente un Trigger NOTAM (que anuncia una enmienda AIRAC o un SUP), contado desde la fecha de entrada en vigor?", "opts": ["14 días", "7 días", "28 días", "56 días"], "ans": 0, "why": "El GEN 3.1 establece que un Trigger NOTAM permanece vigente 14 días después de la fecha de entrada en vigor, tanto si anuncia cambios permanentes como temporales.", "src": "AIP España GEN 3.1, apartado 3.4.2", "note": ""}, {"n": 46, "stem": "¿Qué serie de NOTAM, según el AIP España GEN 3.1, se refiere exclusivamente al aeropuerto de Gibraltar (LXGB)?", "opts": ["Serie A", "Serie D", "Serie F", "Serie R"], "ans": 2, "why": "El GEN 3.1 define la serie F como la que se refiere exclusivamente al aeropuerto de Gibraltar.", "src": "AIP España GEN 3.1, apartado 3.4.1", "note": ""}, {"n": 47, "stem": "¿Qué serie de NOTAM del AIP España cubre la actividad de RPAS (aeronaves no tripuladas) a baja altura?", "opts": ["Serie B", "Serie E", "Serie G", "Serie R"], "ans": 3, "why": "El GEN 3.1 define la serie R como la que se refiere a la actividad de aeronaves no tripuladas (RPAS) a baja altura.", "src": "AIP España GEN 3.1, apartado 3.4.1", "note": ""}, {"n": 48, "stem": "El informe técnico WMM2025 establece que el Modelo Magnético Mundial es un desarrollo en armónicos esféricos del potencial magnético hasta qué grado y orden:", "opts": ["Grado y orden 4", "Grado y orden 12", "Grado y orden 133", "Grado y orden 360"], "ans": 1, "why": "El informe indica que el WMM usa funciones armónicas esféricas hasta el grado y orden 12 (336 coeficientes distintos de cero); el WMMHR, de alta resolución, llega al grado y orden 133.", "src": "NOAA/BGS WMM2025 Technical Report, apartado 1.1", "note": ""}, {"n": 49, "stem": "Según el informe WMM2025, ¿por qué hay que actualizar los coeficientes del WMM cada cinco años?", "opts": ["Las órbitas de los satélites decaen y requieren una recalibración cada cinco años", "El campo magnético del núcleo sufre una variación secular impredecible y no lineal que un modelo lineal fijo no puede seguir indefinidamente", "Un reglamento de la OACI impone un ciclo de revisión fijo de cinco años para todos los documentos aeronáuticos", "El propio elipsoide WGS-84 cambia de forma cada cinco años"], "ans": 1, "why": "El informe explica que, por las variaciones no lineales e impredecibles del campo del núcleo, los coeficientes del WMM deben actualizarse cada cinco años; el WMM2025 es válido de 2025,0 a 2030,0.", "src": "NOAA/BGS WMM2025 Technical Report, apartado 1.1", "note": ""}, {"n": 50, "stem": "Según el informe técnico de 2025, ¿qué es una «zona de exclusión» (Blackout Zone, BoZ) del WMM?", "opts": ["Una región donde se bloquean las señales GPS", "Una zona donde el modelo WMM no publica valores de inclinación", "Un área de vuelo restringido sin relación con el magnetismo", "Un área alrededor de un polo magnético donde los valores de declinación son inexactos y no se puede confiar en las brújulas"], "ans": 3, "why": "El informe define las zonas de exclusión alrededor de los polos magnéticos norte y sur, dentro de las cuales los valores de declinación del WMM son inexactos y no puede confiarse en las brújulas; están rodeadas por zonas de precaución.", "src": "NOAA/BGS WMM2025 Technical Report, apartado 1.8", "note": ""}, {"n": 51, "stem": "Según el informe WMM2025, el intervalo vertical en el que el modelo se considera válido se extiende desde:", "opts": ["El nivel del mar hasta 100 km de altitud solamente", "1 km por debajo de la superficie del elipsoide WGS-84 hasta al menos 850 km por encima de ella", "El centro de la Tierra hasta la órbita geoestacionaria", "Solo la troposfera (0-12 km)"], "ans": 1, "why": "El informe indica que el WMM proporciona la geometría del campo desde 1 km por debajo de la superficie del elipsoide WGS-84 hasta al menos 850 km por encima de ella.", "src": "NOAA/BGS WMM2025 Technical Report, introducción", "note": ""}, {"n": 52, "stem": "La guía de EUROCONTROL para la carta OACI 1:500 000 recomienda que el espacio aéreo representado en la carta tenga normalmente un límite superior en torno a:", "opts": ["FL100", "FL195", "FL460", "Ilimitado (no se muestra límite superior)"], "ans": 0, "why": "La guía recomienda que el límite superior del espacio aéreo mostrado en la ca
