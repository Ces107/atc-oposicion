<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Cartografía</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Cartografía</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Cartografía</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el manual de ENAIRE, el geoide es:", "opts": ["la superficie que se obtiene al girar una elipse alrededor de su eje menor", "una esfera perfecta de 6371 km de radio", "el plano tangente a la Tierra en el Ecuador", "la superficie equipotencial del campo de gravedad de la Tierra, coincidente aproximadamente con el nivel medio del mar"], "ans": 3, "why": "El manual define el geoide como «la superficie equipotencial del campo de gravedad de la Tierra, coincidente, aproximadamente, con el nivel promedio del mar». La opción A describe el elipsoide de revolución y la B, la esfera que se usa para el estudio de puntos y líneas.", "src": "Manual 2.1, p. 5", "note": ""}, {"n": 2, "stem": "La forma real de la Tierra, ligeramente achatada en los polos y ensanchada por el Ecuador, es el resultado de:", "opts": ["la acción combinada de las fuerzas centrífugas y gravitatorias", "la inclinación del eje de 23° 27'", "el movimiento de traslación alrededor del Sol", "el campo magnético del planeta"], "ans": 0, "why": "El manual atribuye el achatamiento a la combinación de las fuerzas centrífugas y gravitatorias; esta forma real recibe el nombre de geoide.", "src": "Manual 2.1, p. 5", "note": ""}, {"n": 3, "stem": "¿Cuál es el perímetro aproximado de la Tierra que da el manual?", "opts": ["12 742 km", "6371 km", "510 000 km", "40 076 km"], "ans": 3, "why": "El cuadro de dimensiones da 12 742 km (diámetro), 6371 km (radio) y 40 076 km (perímetro).", "src": "Manual 2.1, cuadro p. 6", "note": ""}, {"n": 4, "stem": "El manual da como radio medio de la Tierra:", "opts": ["6371 km", "6378 km", "6356 km", "6731 km"], "ans": 0, "why": "6371 km. Los 6378 km se aproximan al semieje mayor del WGS84 y los 6356 km, al semieje menor.", "src": "Manual 2.1, p. 6", "note": ""}, {"n": 5, "stem": "La circunferencia de cualquier círculo máximo mide, según el manual:", "opts": ["20 038 km", "10 019 km", "12 742 km", "40 076 km"], "ans": 3, "why": "El manual indica 40 076 km para cualquier círculo máximo. Los 12 742 km son el diámetro.", "src": "Manual 2.2, p. 6", "note": ""}, {"n": 6, "stem": "¿Cuál de estos círculos NO pasa por el centro de la Tierra?", "opts": ["Dos meridianos opuestos que forman un círculo completo", "El Ecuador", "Cualquier círculo máximo", "Un paralelo como el Trópico de Cáncer"], "ans": 3, "why": "Los paralelos (salvo el Ecuador) son círculos menores, que no pasan por el centro y dividen la Tierra en casquetes esféricos.", "src": "Manual 2.2, pp. 7-8", "note": ""}, {"n": 7, "stem": "¿Qué afirmación sobre los meridianos es correcta?", "opts": ["Son semicírculos máximos que pasan por los polos y cortan perpendicularmente al Ecuador y a todos los paralelos", "Son círculos menores paralelos al Ecuador", "Son paralelos al eje de la Tierra", "Cortan al Ecuador con un ángulo de 45°"], "ans": 0, "why": "El manual define los meridianos como «los infinitos semicírculos máximos que pasan por los polos de la Tierra», que cortan perpendicularmente al Ecuador y a todos los paralelos.", "src": "Manual 2.2, p. 7", "note": ""}, {"n": 8, "stem": "El meridiano de Greenwich se considera el meridiano de referencia del sistema horario desde:", "opts": ["1884", "1804", "1984", "1919"], "ans": 0, "why": "El manual dice que fue considerado meridiano de referencia del sistema horario «a partir de 1884».", "src": "Manual 2.2, p. 7", "note": ""}, {"n": 9, "stem": "El Ecuador terrestre es:", "opts": ["el círculo máximo cuyo plano es perpendicular al eje de la Tierra", "un círculo menor paralelo a sí mismo", "un meridiano", "el círculo que divide la Tierra en Este y Oeste"], "ans": 0, "why": "El manual lo define como el círculo máximo cuyo plano es perpendicular al eje de la Tierra; separa los hemisferios norte y sur. La división en Este y Oeste la marca el meridiano de Greenwich.", "src": "Manual 2.2, p. 7", "note": ""}, {"n": 10, "stem": "Los círculos menores dividen la Tierra en dos partes desiguales llamadas:", "opts": ["casquetes esféricos", "hemisferios", "husos", "gajos"], "ans": 0, "why": "Los círculos máximos dan dos hemisferios iguales; los círculos menores dan casquetes esféricos, que son desiguales.", "src": "Manual 2.2, p. 8", "note": ""}, {"n": 11, "stem": "¿Cuál NO es uno de los cuatro «paralelos más importantes» que cita el manual?", "opts": ["Círculo Polar Ártico", "Trópico de Capricornio", "Círculo Polar Antártico", "Paralelo de Greenwich"], "ans": 3, "why": "Los cuatro son los Círculos Polares Ártico y Antártico y los Trópicos de Cáncer y de Capricornio. No existe un «paralelo de Greenwich».", "src": "Manual 2.2, p. 8", "note": ""}, {"n": 12, "stem": "El manual estudia cuatro movimientos de la Tierra. ¿Qué conjunto es el correcto?", "opts": ["rotación, traslación, precesión, nutación", "rotación, revolución, libración, mareas", "traslación, oblicuidad, precesión, mareas", "rotación, inclinación, nutación, libración"], "ans": 0, "why": "Rotación, traslación, precesión y nutación («de los más de 16 descritos en la actualidad»).", "src": "Manual 2.3, p. 9", "note": ""}, {"n": 13, "stem": "Una rotación completa de la Tierra dura, según el manual:", "opts": ["23 h 56 min 4 s", "24 h 00 min 00 s", "24 h 56 min 4 s", "23 h 4 min 56 s"], "ans": 0, "why": "23 horas, 56 minutos y 4 segundos.", "src": "Manual 2.3.1, p. 9", "note": ""}, {"n": 14, "stem": "El sentido de la rotación de la Tierra es:", "opts": ["de oeste a este", "de este a oeste", "de norte a sur", "alterna cada año"], "ans": 0, "why": "El manual dice que la dirección de este movimiento es de oeste a este.", "src": "Manual 2.3.1, p. 9", "note": ""}, {"n": 15, "stem": "Según el manual, la velocidad variable de la rotación de la Tierra se debe principalmente a:", "opts": ["las fuerzas gravitatorias de la Luna", "el campo magnético del Sol", "la inclinación del eje", "la elipticidad de la órbita"], "ans": 0, "why": "El manual la atribuye principalmente a las fuerzas gravitatorias de su satélite, la Luna.", "src": "Manual 2.3.1, p. 9", "note": ""}, {"n": 16, "stem": "La órbita que describe la Tierra alrededor del Sol se llama:", "opts": ["Zodiaco", "Meridiano", "Geoide", "Eclíptica"], "ans": 3, "why": "La eclíptica es una elipse en uno de cuyos focos se encuentra el Sol.", "src": "Manual 2.3.2, p. 10", "note": ""}, {"n": 17, "stem": "La Tierra está más cerca del Sol (perihelio) en torno al:", "opts": ["4 de enero", "4 de julio", "21 de marzo", "21 de diciembre"], "ans": 0, "why": "El manual sitúa el perihelio el 4 de enero y el afelio en torno al 4 de julio.", "src": "Manual 2.3.2, p. 10", "note": ""}, {"n": 18, "stem": "El ángulo que forma el eje de rotación con el plano de la órbita es aproximadamente de:", "opts": ["23° 27'", "90°", "66° 33'", "45°"], "ans": 2, "why": "66° 33' (23° 27' es la latitud de los trópicos, su complemento).", "src": "Manual 2.3.2, p. 10", "note": ""}, {"n": 19, "stem": "El Trópico de Cáncer se encuentra a:", "opts": ["23° 27' N", "23° 27' S", "66° 33' N", "66° 33' S"], "ans": 0, "why": "Trópico de Cáncer a 23° 27' al norte del Ecuador; Capricornio, a 23° 27' al sur.", "src": "Manual 2.3.2, p. 11", "note": ""}, {"n": 20, "stem": "Los rayos solares inciden perpendicularmente sobre el Trópico de Cáncer en el:", "opts": ["Solsticio de Invierno", "Equinoccio de Primavera", "Solsticio de Verano", "Equinoccio de Otoño"], "ans": 2, "why": "En el Solsticio de Verano, el día del año con más horas de luz solar en el hemisferio norte.", "src": "Manual 2.3.2, p. 11", "note": ""}, {"n": 21, "stem": "En el Solsticio de Invierno, en el hemisferio sur el día es:", "opts": ["el más corto del año", "igual a la noche", "el más largo del año", "no está definido"], "ans": 2, "why": "Los rayos inciden sobre el Trópico de Capricornio: menos horas de luz solar en el norte y día más largo del año en el sur.", "src": "Manual 2.3.2, p. 11", "note": ""}, {"n": 22, "stem": "Los equinoccios son los momentos en que los rayos solares inciden perpendicularmente sobre:", "opts": ["el Trópico de Cáncer", "el Trópico de Capricornio", "los Polos", "el Ecuador"], "ans": 3, "why": "Se caracterizan por la equivalencia en el número de horas nocturnas y diurnas.", "src": "Manual 2.3.2, p. 11", "note": ""}, {"n": 23, "stem": "La precesión de la Tierra es:", "opts": ["el desplazamiento del eje de rotación en el espacio, que describe un cono", "una ligera oscilación superpuesta a la nutación", "la rotación diaria", "el movimiento orbital alrededor del Sol"], "ans": 0, "why": "El eje describe un cono; la nutación se superpone a la precesión, no al revés.", "src": "Manual 2.3.3, p. 11", "note": ""}, {"n": 24, "stem": "Un ciclo completo de precesión dura aproximadamente:", "opts": ["365 días", "18 años", "2570 años", "25 700 años"], "ans": 3, "why": "Unos 25 700 años. Dieciocho años es el ciclo de la nutación.", "src": "Manual 2.3.3, p. 11", "note": ""}, {"n": 25, "stem": "El movimiento de precesión del eje es, respecto a la rotación de la Tierra:", "opts": ["contrario", "del mismo sentido", "perpendicular", "aleatorio"], "ans": 0, "why": "El manual dice que el sentido del movimiento del eje es contrario al de rotación.", "src": "Manual 2.3.3, p. 12", "note": ""}, {"n": 26, "stem": "La precesión está causada principalmente por las fuerzas gravitatorias de:", "opts": ["el Sol y la Luna sobre una Tierra ensanchada en el Ecuador", "Júpiter y Saturno", "solo la Luna", "solo la fuerza centrífuga de la rotación"], "ans": 0, "why": "Aparecen pares de fuerzas porque la Tierra no es esférica, sino ensanchada en el Ecuador.", "src": "Manual 2.3.3, p. 12", "note": ""}, {"n": 27, "stem": "Un ciclo de nutación dura:", "opts": ["unos 25 700 años", "unas 23 horas", "exactamente 365 días", "algo más de dieciocho años"], "ans": 3, "why": "Algo más de dieciocho años (el manual dice que el eje oscila aproximadamente «9 minutos» alrededor de su posición media). Unos 25 700 años es el ciclo de la precesión.", "src": "Manual 2.3.4, p. 12", "note": ""}, {"n": 28, "stem": "El principal efecto de la combinación de la precesión y la nutación es:", "opts": ["la alternancia del día y la noche", "las estaciones", "la variación de la posición del norte magnético", "el achatamiento de la Tierra"], "ans": 2, "why": "El día y la noche y el achatamiento proceden de la rotación; las estaciones, de la traslación y de la inclinación del eje.", "src": "Manual 2.3.4, p. 12", "note": ""}, {"n": 29, "stem": "El Polo Norte Magnético es aquel por donde:", "opts": ["salen las líneas de fuerza del campo magnético", "la declinación es siempre cero", "emerge el eje geográfico", "entran las líneas de fuerza"], "ans": 3, "why": "Según el manual, las líneas de fuerza entran por el Polo Norte Magnético y salen por el Polo Sur Magnético.", "src": "Manual 2.4.1, p. 13", "note": ""}, {"n": 30, "stem": "La declinación magnética en un punto es:", "opts": ["el ángulo entre el rumbo y la ruta", "el error de la brújula causado por la aeronave", "el ángulo entre el eje de la aeronave y el viento", "el ángulo entre el norte magnético local y el norte geográfico"], "ans": 3, "why": "La declinación es el ángulo comprendido entre el norte magnético local y el geográfico (verdadero). La opción A describe la deriva; la B, el desvío de la brújula (que el manual no trata).", "src": "Manual 2.4.2, p. 13", "note": ""}, {"n": 31, "stem": "Un observador que mira al norte geográfico ve el norte magnético a su derecha. La declinación es:", "opts": ["Este (E) o positiva", "Oeste (W) o negativa", "cero", "no se puede determinar"], "ans": 0, "why": "Declinación Este (positiva): el norte magnético queda a la derecha; Oeste: a la izquierda.", "src": "Manual 2.4.2, p. 14", "note": ""}, {"n": 32, "stem": "En aviación, un rumbo se escribe con:", "opts": ["dos cifras, medido en sentido contrario al de las agujas del reloj", "cuatro cifras, medido en el sentido de las agujas del reloj", "tres cifras, medido en sentido contrario al de las agujas del reloj", "tres cifras, medido en el sentido de las agujas del reloj"], "ans": 3, "why": "Tres cifras, en el sentido de giro de las agujas del reloj a partir del norte.", "src": "Manual 2.4.3, p. 14", "note": ""}, {"n": 33, "stem": "Rumbo geográfico de 081°, declinación de 3° E. El rumbo magnético es:", "opts": ["084", "087", "081", "078"], "ans": 3, "why": "Rm = Rg - declinación = 081 - (+3) = 078.", "src": "Manual 2.4.3, p. 15", "note": ""}, {"n": 34, "stem": "Rumbo geográfico de 200, declinación de 4° W. El rumbo magnético es:", "opts": ["196", "200", "204", "214"], "ans": 2, "why": "Rm = 200 - (-4) = 204 (la declinación W es negativa).", "src": "Manual 2.4.3, p. 15; cálculo", "note": ""}, {"n": 35, "stem": "En la fórmula del manual, la declinación se introduce:", "opts": ["negativa para E y positiva para W", "positiva en ambos casos", "positiva para E y negativa para W", "siempre en valor absoluto"], "ans": 2, "why": "«La declinación será negativa para W y positiva para E», y Rm = Rg - declinación.", "src": "Manual 2.4.3, p. 15", "note": ""}, {"n": 36, "stem": "El rumbo es el ángulo comprendido entre el norte de referencia y:", "opts": ["la dirección del viento", "la ruta deseada", "la derrota sobre el terreno", "el eje longitudinal de la aeronave"], "ans": 3, "why": "El rumbo se mide hasta el eje longitudinal de la aeronave.", "src": "Manual 2.4.3, p. 14", "note": ""}, {"n": 37, "stem": "La ruta se define como:", "opts": ["la proyección del movimiento de una aeronave, persona u objeto sobre la superficie terrestre", "el ángulo entre el viento y la aeronave", "la dirección del morro de la aeronave", "la línea más corta entre dos polos magnéticos"], "ans": 0, "why": "Sobre una carta de navegación es la trayectoria que une el punto de salida con el punto de destino.", "src": "Manual 2.4.4, p. 15", "note": ""}, {"n": 38, "stem": "En ausencia de viento, el rumbo de la aeronave:", "opts": ["es siempre distinto de la ruta", "es igual a la declinación magnética", "es igual al ángulo de deriva", "coincide con la ruta que sobrevuela"], "ans": 3, "why": "Con viento, el rumbo y la ruta pueden diferir.", "src": "Manual 2.4.4, p. 16", "note": ""}, {"n": 39, "stem": "¿Qué ruta es el arco de círculo máximo que une dos puntos?", "opts": ["Loxodrómica", "Equidistante", "Isogónica", "Ortodrómica"], "ans": 3, "why": "La ruta ortodrómica es el arco de círculo máximo y la ruta más corta.", "src": "Manual 2.4.4, p. 16", "note": ""}, {"n": 40, "stem": "La ruta loxodrómica:", "opts": ["es la más corta entre dos puntos", "forma ángulos distintos con cada meridiano", "mantiene un rumbo constante en la brújula y forma el mismo ángulo con todos los meridianos", "es difícil de seguir"], "ans": 2, "why": "Las opciones A, B y D describen la ortodrómica.", "src": "Manual 2.4.4, pp. 16-17", "note": ""}, {"n": 41, "stem": "La ruta loxodrómica se suele seguir en rutas:", "opts": ["superiores a 10 000 km", "superiores a 5000 km", "de cualquier longitud", "inferiores a 1000 km"], "ans": 3, "why": "Para distancias pequeñas (rutas inferiores a 1000 km) la diferencia es pequeña.", "src": "Manual 2.4.4, p. 16", "note": ""}, {"n": 42, "stem": "¿Por qué la ortodrómica sigue siendo fundamental en la aviación de larga distancia?", "opts": ["es fácil de seguir con una brújula", "es más larga y, por tanto, más segura", "forma el mismo ángulo con todos los meridianos", "el ahorro de combustible es uno de los objetivos principales del transporte aéreo"], "ans": 3, "why": "El manual da como razón el ahorro de combustible; la ortodrómica es difícil de seguir y más corta.", "src": "Manual 2.4.4, p. 17", "note": ""}, {"n": 43, "stem": "El manual dice que la navegación loxodrómica en el ámbito aeronáutico:", "opts": ["es el método preferido en los vuelos largos", "solo la usan los helicópteros", "es obligatoria en el espacio aéreo oceánico", "cae en desuso"], "ans": 3, "why": "Su simplicidad ha sido superada por la precisión de los sistemas modernos de navegación.", "src": "Manual 2.4.4, p. 17", "note": ""}, {"n": 44, "stem": "El manual define la milla náutica como la longitud recorrida en un minuto sobre:", "opts": ["un paralelo; 1 NM = 1,609 km", "un arco de círculo máximo; 1 NM = 1,852 km", "una loxodrómica; 1 NM = 1,000 km", "un meridiano a 45°; 1 NM = 1,750 km"], "ans": 1, "why": "1 NM = 1,852 km, un minuto sobre un arco de círculo máximo.", "src": "Manual 2.4.4, p. 17", "note": ""}, {"n": 45, "stem": "La deriva es el ángulo entre:", "opts": ["el norte magnético y el geográfico", "la ruta deseada y la dirección del movimiento de la aeronave", "el rumbo y el eje de la aeronave", "la pista y el viento"], "ans": 1, "why": "La opción A es la declinación.", "src": "Manual 2.4.5, p. 17", "note": ""}, {"n": 46, "stem": "La deriva es máxima cuando la dirección del viento es:", "opts": ["igual al rumbo de la aeronave", "opuesta solo al rumbo", "perpendicular al rumbo de la aeronave", "de 45° respecto a la ruta"], "ans": 2, "why": "Es máxima con viento perpendicular; mínima o nula cuando la dirección del viento coincide con la de la aeronave.", "src": "Manual 2.4.5, p. 17", "note": ""}, {"n": 47, "stem": "La derrota es:", "opts": ["la ruta ideal trazada sobre la carta", "la proyección sobre el suelo de la trayectoria que ha seguido realmente la aeronave al intentar sobrevolar una determinada ruta", "el ángulo entre dos rumbos", "otro nombre de la deriva"], "ans": 1, "why": "Es el resultado de las sucesivas correcciones de rumbo, debidas principalmente al viento.", "src": "Manual 2.4.6, p. 18", "note": ""}, {"n": 48, "stem": "Un datum es:", "opts": ["un conjunto de parámetros que fijan el origen, la orientación y la escala de un sistema de coordenadas con respecto a un elipsoide de referencia", "un tipo de proyección", "un tipo de carta", "el modelo magnético"], "ans": 0, "why": "Definición del manual, apartado 2.5.", "src": "Manual 2.5, p. 18", "note": ""}, {"n": 49, "stem": "La latitud se mide:", "opts": ["sobre el Ecuador, a partir del meridiano de Greenwich", "sobre un meridiano, a partir del Ecuador", "sobre un paralelo, a partir de los polos", "sobre la eclíptica"], "ans": 1, "why": "La latitud es la distancia angular, medida sobre un meridiano, entre el punto y el Ecuador, de 0° a 90°.", "src": "Manual 2.5.1, p. 19", "note": ""}, {"n": 50, "stem": "El intervalo de valores de la longitud es:", "opts": ["de 0° a 90°", "de 0° a 360°", "de 0° a 180° E u W", "de 0° a 45°"], "ans": 2, "why": "De 0° a 180°, positiva al Este y negativa al Oeste.", "src": "Manual 2.5.1, p. 19", "note": ""}, {"n": 51, "stem": "Todos los puntos de un mismo paralelo tienen la misma:", "opts": ["longitud", "declinación", "altitud", "latitud"], "ans": 3, "why": "Mismo paralelo = misma latitud; mismo meridiano = misma longitud.", "src": "Manual 2.5.1, p. 19", "note": ""}, {"n": 52, "stem": "¿Quién desarrolló el sistema WGS84?", "opts": ["la OACI", "ENAIRE", "el Departamento de Defensa de Estados Unidos", "la Comisión Europea"], "ans": 2, "why": "El manual dice que fue el Departamento de Defensa estadounidense.", "src": "Manual 2.5.2, p. 20", "note": ""}, {"n": 53, "stem": "El origen del sistema de coordenadas WGS84 es:", "opts": ["Greenwich", "el centro de masas de la Tierra", "el Polo Norte geográfico", "Colorado Springs"], "ans": 1, "why": "Origen: centro de masas de la Tierra.", "src": "Manual 2.5.2, p. 20", "note": ""}, {"n": 54, "stem": "En el WGS84, el eje Y es el que:", "opts": ["está situado sobre el plano del Ecuador medio, a 90° a la derecha del eje X, y forma con el eje Z un triedro a derechas", "coincide con el eje medio de rotación", "está en la intersección del Ecuador con Greenwich", "apunta a la Estrella Polar"], "ans": 0, "why": "La opción B es el eje Z y la C, el eje X.", "src": "Manual 2.5.2, p. 20", "note": ""}, {"n": 55, "stem": "El eje Z del WGS84 se define por el polo medio convencional terrestre del:", "opts": ["IERS", "OACI", "IATA", "NOAA"], "ans": 0, "why": "IERS: Servicio Internacional de Rotación de la Tierra (International Earth Rotation Service).", "src": "Manual 2.5.2, p. 20", "note": ""}, {"n": 56, "stem": "El semieje mayor del WGS84 es:", "opts": ["6 356 752 m", "6 378 137 m", "6 371 000 m", "6 378 388 m"], "ans": 1, "why": "6 378 137 m; el semieje menor es 6 356 752 m.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 57, "stem": "El semieje menor del WGS84 según el manual es:", "opts": ["6 356 752 m", "6 378 137 m", "6 371 000 m", "6 365 000 m"], "ans": 0, "why": "b = 6 356 752 m.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 58, "stem": "Las coordenadas aeronáuticas publicadas en el AIP-ESPAÑA están referidas a:", "opts": ["ETRS89", "ED50", "WGS84", "REGCAN95"], "ans": 2, "why": "De acuerdo con lo establecido en el Anexo 15 de la OACI, WGS84.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 59, "stem": "El Real Decreto 1071/2007, de 27 de julio, adopta como sistema geodésico oficial en la península Ibérica y las Islas Baleares:", "opts": ["WGS84", "ED50", "REGCAN95", "ETRS89"], "ans": 3, "why": "ETRS89; para las islas Canarias se adopta REGCAN95.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 60, "stem": "El sistema oficial en las islas Canarias es:", "opts": ["REGCAN95", "ETRS89", "REGENTE", "GRS80"], "ans": 0, "why": "REGENTE es la red geodésica y GRS80, el elipsoide.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 61, "stem": "El elipsoide asociado a ETRS89 y REGCAN95 es:", "opts": ["WGS84", "GRS80", "Bessel", "Hayford"], "ans": 1, "why": "Ambos sistemas tienen asociado el elipsoide GRS80 (Sistema de Referencia Geodésico 1980).", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 62, "stem": "¿Por qué ETRS89 y REGCAN95 no son válidos para publicar coordenadas en el AIP ESPAÑA?", "opts": ["usan otro elipsoide que la OACI desconoce", "debido a la deriva entre sistemas, las discrepancias superan la exactitud requerida para algunos datos", "no tienen un origen definido", "la OACI prohíbe cualquier sistema nacional"], "ans": 1, "why": "Inicialmente se consideraron equivalentes a WGS84, pero la deriva produjo discrepancias mayores que la exactitud requerida.", "src": "Manual 2.5.2, p. 22", "note": ""}, {"n": 63, "stem": "La red que materializa ETRS89 y REGCAN95 en España es:", "opts": ["REDNAP", "REGENTE", "ITRF", "SENASA"], "ans": 1, "why": "Red Geodésica Nacional por Técnicas Espaciales, REGENTE.", "src": "Manual 2.5.2, p. 21", "note": ""}, {"n": 64, "stem": "La escala numérica se expresa como:", "opts": ["longitud en el terreno / longitud en el plano", "longitud en el plano / longitud en el terreno", "área en el plano x área en el terreno", "una línea graduada"], "ans": 1, "why": "E = longitud en el plano / longitud en el terreno. La opción D describe la escala gráfica.", "src": "Manual 3.1.1, p. 23", "note": ""}, {"n": 65, "stem": "En un plano a escala 1:10, 5 cm en el plano equivalen en el terreno a:", "opts": ["0,5 cm", "15 cm", "2 cm", "50 cm"], "ans": 3, "why": "5 x 10 = 50 cm.", "src": "Manual 3.1.1, p. 23", "note": ""}, {"n": 66, "stem": "Una escala grande es aquella cuyo denominador es:", "opts": ["grande, y abarca mucho terreno", "pequeño, y abarca poco terreno", "igual a 1", "menor que el numerador"], "ans": 1, "why": "Escala grande = denominador pequeño (ciudades, fincas, caminos); escala pequeña = denominador grande (países).", "src": "Manual 3.1.1, p. 23", "note": ""}, {"n": 67, "stem": "¿Qué escala es una escala pequeña en los términos del manual?", "opts": ["1:5000", "1:10 000", "1:1", "1:5 000 000"], "ans": 3, "why": "1:5 000 000 y 1:7 000 000 son los ejemplos de escala pequeña del manual.", "src": "Manual 3.1.1, p. 23", "note": ""}, {"n": 68, "stem": "En una escala 1/5 000 000, una división de 1 cm de la escala gráfica equivale a:", "opts": ["5 km", "500 km", "50 km", "0,5 km"], "ans": 2, "why": "1 cm x 5 000 000 = 50 km.", "src": "Manual 3.1.2, p. 24", "note": ""}, {"n": 69, "stem": "Una proyección que conserva los ángulos entre dos puntos se llama:", "opts": ["equivalente", "conforme", "equidistante", "afiláctica"], "ans": 1, "why": "La equivalente conserva las áreas; la equidistante, las distancias; la afiláctica, ninguna de las tres magnitudes.", "src": "Manual 3.2.2, p. 26", "note": ""}, {"n": 70, "stem": "Las proyecciones afilácticas:", "opts": ["conservan solo las áreas", "conservan solo los ángulos", "conservan solo las distancias", "no tienen ninguna de las tres propiedades"], "ans": 3, "why": "No son ni conformes, ni equivalentes, ni equidistantes.", "src": "Manual 3.2.2, p. 26", "note": ""}, {"n": 71, "stem": "¿Qué afirmación sobre las proyecciones es verdadera?", "opts": ["una proyección puede ser conforme y equivalente a la vez", "ninguna proyección mantiene a la vez la conformidad, la equivalencia y la equidistancia", "todas las proyecciones conservan las distancias", "las proyecciones conformes conservan las áreas"], "ans": 1, "why": "Está matemáticamente demostrado que solo se puede mantener una de las tres.", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 72, "stem": "En una proyección ortográfica, el foco de proyección está:", "opts": ["en el centro de la Tierra", "sobre la superficie terrestre", "fuera de la Tierra, a una distancia infinita", "fuera de la Tierra, a una distancia finita"], "ans": 2, "why": "Escenográfica: distancia finita; estereográfica: sobre la superficie; gnomónica: en el centro.", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 73, "stem": "En una proyección gnomónica, el foco está en:", "opts": ["el centro de la Tierra", "el infinito", "un polo", "la superficie"], "ans": 0, "why": "Gnomónica: el foco de proyección se encuentra en el centro de la superficie terrestre.", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 74, "stem": "En una proyección estereográfica, el foco de proyección se encuentra:", "opts": ["en el centro de la Tierra", "sobre la superficie terrestre", "en el infinito", "dentro del cono"], "ans": 1, "why": "«Cuando el foco de proyección se encuentra sobre la superficie terrestre».", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 75, "stem": "En una proyección polar, el plano de proyección es tangente a la Tierra:", "opts": ["en un punto del Ecuador", "en uno de los Polos", "en un punto no significativo", "a lo largo de un paralelo"], "ans": 1, "why": "Ecuatorial: en un punto del Ecuador; horizontal: en un punto no significativo.", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 76, "stem": "En una proyección cónica o cilíndrica «directa», el eje de la superficie de proyección es:", "opts": ["perpendicular al eje de rotación terrestre", "oblicuo, con un ángulo comprendido entre 0° y 90° respecto al eje de rotación terrestre", "paralelo al eje de rotación terrestre", "tangente al Ecuador"], "ans": 2, "why": "Directa: paralelo; transversal: perpendicular; oblicua: ángulo comprendido entre 0° y 90°.", "src": "Manual 3.2.2, p. 27", "note": ""}, {"n": 77, "stem": "¿Qué proyecciones son las más utilizadas en la cartografía aeronáutica, especialmente en ruta?", "opts": ["cilíndricas", "acimutales", "cónicas", "ortográficas"], "ans": 2, "why": "Las proyecciones cónicas, por la facilidad y exactitud con que se pueden representar las trayectorias.", "src": "Manual 3.2.3, p. 28", "note": ""}, {"n": 78, "stem": "En la proyección cónica, los meridianos se transforman en:", "opts": ["rectas paralelas", "circunferencias concéntricas", "rectas concurrentes en el Polo", "curvas sinusoidales"], "ans": 2, "why": "Los meridianos son rectas concurrentes en el Polo; los paralelos, arcos de circunferencias concéntricas; ambos se cortan a 90°.", "src": "Manual 3.2.3, p. 28", "note": ""}, {"n": 79, "stem": "La proyección cónica conforme de Lambert se diferencia de la cónica tangente en que utiliza:", "opts": ["un cilindro", "un plano en el polo", "un cono secante", "un cono en el infinito"], "ans": 2, "why": "El cono tangente se sustituye por uno secante, lo que da dos paralelos estándar automecoicos.", "src": "Manual 3.2.3, pp. 28-29", "note": ""}, {"n": 80, "stem": "En la proyección de Lambert, las deformaciones lineales son, en comparación con un cono tangente:", "opts": ["el doble", "las mismas", "nulas en todas partes", "reducidas a la mitad del valor absoluto"], "ans": 3, "why": "El manual indica que quedan reducidas a la mitad del valor absoluto.", "src": "Manual 3.2.3, p. 29", "note": ""}, {"n": 81, "stem": "¿Por qué la proyección cónica conforme de Lambert es muy útil para la navegación aérea?", "opts": ["conserva todas las áreas", "se pueden medir rumbos y distancias directamente y la ortodrómica es casi una recta", "la loxodrómica es una recta", "no tiene distorsión"], "ans": 1, "why": "En Lambert la loxodrómica es una curva; la ortodrómica es casi una recta.", "src": "Manual 3.2.3, p. 29", "note": ""}, {"n": 82, "stem": "¿Cuál de estas es una proyección «modificada» citada en el manual?", "opts": ["Gnomónica", "Ortográfica", "Mercator", "Escenográfica"], "ans": 2, "why": "La gnomónica, la ortográfica y la escenográfica son puras; Bonne, Lambert, Mercator, Mollweide y Goode son modificadas.", "src": "Manual 3.2.3, p. 28", "note": ""}, {"n": 83, "stem": "El sistema de planos acotados utiliza:", "opts": ["una proyección cónica", "una proyección cilíndrica ortogonal sobre un único plano", "una proyección estereográfica", "una proyección de Mercator"], "ans": 1, "why": "Un único plano de referencia y una proyección cilíndrica ortogonal; la cota (distancia vertical) lleva signo + o -.", "src": "Manual 3.3, p. 30", "note": ""}, {"n": 84, "stem": "En el sistema de curvas de nivel, la distancia vertical entre los planos paralelos que cortan el terreno es la:", "opts": ["cota", "escala", "isohipsa", "equidistancia"], "ans": 3, "why": "La equidistancia. La isohipsa es la curva resultante.", "src": "Manual 3.3.1, p. 31", "note": ""}, {"n": 85, "stem": "Para mostrar pequeños detalles del relieve con curvas de nivel hay que:", "opts": ["aumentar la equidistancia", "disminuir la equidistancia", "usar una escala menor", "reducir el número de planos"], "ans": 1, "why": "Los pequeños detalles exigen curvas de nivel muy cercanas entre sí, es decir, una equidistancia menor.", "src": "Manual 3.3.1, p. 31", "note": ""}, {"n": 86, "stem": "En la cartografía aeronáutica, la simbología está normalizada en:", "opts": ["el Anexo 15 de la OACI", "el AIP GEN 2.3", "el Anexo 4 de la OACI", "solo el Doc 8697"], "ans": 2, "why": "Anexo 4. Los símbolos adicionales de España figuran en el AIP GEN 2.3 con un asterisco.", "src": "Manual 3.4, p. 32", "note": ""}, {"n": 87, "stem": "Los símbolos cartográficos españoles no incluidos en el Anexo 4 de la OACI se encuentran en:", "opts": ["el GEN 2.3 del AIP-España, marcados con un asterisco", "el ENR 6.1", "el Anexo 15", "el AD 2"], "ans": 0, "why": "Marcados con * = «No incluidos en el ANEXO 4 de OACI».", "src": "Manual 3.4, p. 32", "note": ""}, {"n": 88, "stem": "¿Qué Anexo hace responsable al AIS de la producción de la cartografía aeronáutica?", "opts": ["el Anexo 4", "el Anexo 15", "el Anexo 11", "el Anexo 14"], "ans": 1, "why": "El Anexo 15 trata los Servicios de Información Aeronáutica; el Anexo 4 es el de las cartas.", "src": "Manual 4, p. 33", "note": ""}, {"n": 89, "stem": "En ENAIRE, la cartografía aeronáutica recae sobre la:", "opts": ["División de Operaciones", "División AIS", "División CNS", "División ATM"], "ans": 1, "why": "«División AIS».", "src": "Manual 4, p. 33", "note": ""}, {"n": 90, "stem": "El manual dice que el documento de la OACI que describe exhaustivamente cada carta es el:", "opts": ["Doc 4444", "Doc 8168", "Doc 8697", "Doc 7300"], "ans": 2, "why": "Doc 8697, Manual de cartas aeronáuticas.", "src": "Manual 4.1.2, p. 35", "note": ""}, {"n": 91, "stem": "¿Cuál es una carta obligatoria según el Doc 8697?", "opts": ["Plano de estacionamiento y atraque de aeronaves", "Plano de obstáculos de aeródromo tipo A", "Carta de posición", "Plano de obstáculos de aeródromo tipo B"], "ans": 1, "why": "El tipo A es obligatorio; el tipo B, el plano de estacionamiento y la carta de posición son opcionales.", "src": "Manual 4.2, pp. 35-36", "note": ""}, {"n": 92, "stem": "¿Qué carta es opcional?", "opts": ["Carta de aproximación por instrumentos", "Plano de aeródromo / helipuerto", "Plano de aeródromo para movimientos en tierra", "Carta de navegación en ruta"], "ans": 2, "why": "El plano para movimientos en tierra es opcional; las otras tres son obligatorias.", "src": "Manual 4.2.2, p. 36", "note": ""}, {"n": 93, "stem": "¿Qué carta es condicionalmente necesaria?", "opts": ["Carta topográfica para aproximaciones de precisión", "Carta OACI 1:500 000", "Carta de navegación de escala pequeña", "Carta SID"], "ans": 3, "why": "La SID es condicional: se necesita cuando se ha establecido una salida normalizada y no puede indicarse con claridad en la Carta de área.", "src": "Manual 4.2.3, p. 36", "note": ""}, {"n": 94, "stem": "La Carta de área solo es necesaria si:", "opts": ["las rutas ATS o los requisitos de notificación de posición son complicados y no pueden indicarse en la Carta de navegación en ruta", "el aeródromo tiene ILS", "existe una TMA", "el aeródromo es internacional"], "ans": 0, "why": "Manual 4.2.3.", "src": "Manual 4.2.3, p. 36", "note": ""}, {"n": 95, "stem": "¿Qué carta cita el manual entre las «otras cartas que se producen en España»?", "opts": ["Plano de estacionamiento y atraque de aeronaves", "Carta de concentración de aves", "Plano de obstáculos de aeródromo tipo A", "Carta de aproximación por instrumentos"], "ans": 1, "why": "La lista adicional incluye cobertura radar, ATCSMAC en TMA, circulación VFR en TMA, TRAN, CDA, luces aeronáuticas de superficie, áreas prioritarias a evitar, concentración de aves y presencia de buitres y cigüeñas.", "src": "Manual 4.2.3, p. 37", "note": ""}, {"n": 96, "stem": "¿Qué cartas se utilizan en la fase 1 (rodaje desde el puesto de estacionamiento hasta el punto de despegue)?", "opts": ["SID, plano de obstáculos tipo A y ATCSMAC", "Plano de estacionamiento y atraque, plano para movimientos en tierra y plano de aeródromo / helipuerto", "STAR, CDA y TRAN", "Cartas de área y de navegación en ruta"], "ans": 1, "why": "Las fases 1 y 6 usan las mismas tres cartas de aeródromo.", "src": "Manual 4.3, p. 38", "note": ""}, {"n": 97, "stem": "Las cartas de la fase 2 (despegue y ascenso hasta la estructura de rutas ATS) son:", "opts": ["plano de obstáculos tipo A, SID y Carta de altitud mínima de vigilancia ATC", "STAR, CDA, TRAN", "IAC, PATC, VAC", "cartas de navegación en ruta y de área"], "ans": 0, "why": "Lista de la fase 2.", "src": "Manual 4.3, p. 38", "note": ""}, {"n": 98, "stem": "¿Qué conjunto corresponde a la fase 4 (descenso hasta la aproximación)?", "opts": ["IAC, PATC, VAC, plano de obstáculos tipo A", "SID, plano de obstáculos tipo A, ATCSMAC", "STAR, CDA, TRAN y ATCSMAC", "Área, navegación en ruta, VFR"], "ans": 2, "why": "Fase 4. La opción A corresponde a la fase 5.", "src": "Manual 4.3, p. 38", "note": ""}, {"n": 99, "stem": "La Carta topográfica para aproximaciones de precisión pertenece a la fase:", "opts": ["5, aproximación para aterrizar", "2", "3", "6"], "ans": 0, "why": "Fase 5: IAC, PATC, Carta de aproximación visual y plano de obstáculos tipo A (limitaciones de utilización).", "src": "Manual 4.3, p. 38", "note": ""}, {"n": 100, "stem": "La Carta de circulación VFR aparece en la fase:", "opts": ["1", "2", "3, estructura de rutas ATS en ruta", "6"], "ans": 2, "why": "Fase 3: Carta de área (salida), de navegación en ruta, de área (llegada) y de circulación VFR.", "src": "Manual 4.3, p. 38", "note": ""}, {"n": 101, "stem": "El Plano de obstáculos de aeródromo tipo A proporciona datos para cumplir con:", "opts": ["solo el requisito de despegue", "despegue, en ruta con un motor inactivo y aterrizaje", "solo los requisitos VFR", "las rutas de rodaje"], "ans": 1, "why": "Los tres casos (a, b, c) del apartado 4.4.4.", "src": "Manual 4.4.4, p. 40", "note": ""}, {"n": 102, "stem": "La Carta topográfica para aproximaciones de precisión permite a los explotadores evaluar el efecto del terreno sobre la altura de decisión empleando:", "opts": ["altímetros barométricos", "DME", "radioaltímetros", "GPS"], "ans": 2, "why": "Radioaltímetros; se facilita para las pistas de aproximación de precisión de las categorías II y III.", "src": "Manual 4.4.5, p. 41", "note": ""}, {"n": 103, "stem": "La Carta topográfica para aproximaciones de precisión se facilita respecto a las pistas para aproximaciones de precisión de:", "opts": ["solo la categoría I", "las categorías II y III", "todas las categorías", "las pistas de no precisión"], "ans": 1, "why": "Categorías II y III de los aeródromos utilizados por la aviación civil internacional.", "src": "Manual 4.4.5, p. 41", "note": ""}, {"n": 104, "stem": "En España, la Carta de navegación en ruta se proporciona:", "opts": ["solo en papel", "en papel y en formato digital", "exclusivamente en formato digital en insignia.enaire.es", "solo dentro de la parte AD del AIP"], "ans": 2, "why": "Solo en formato digital.", "src": "Manual 4.4.6, p. 41", "note": ""}, {"n": 105, "stem": "La Carta de navegación en ruta debe proporcionarse en todas las áreas en que se hayan establecido:", "opts": ["TMA", "CTR", "ATZ", "FIR y UIR"], "ans": 3, "why": "Regiones de información de vuelo inferior (FIR) y superior (UIR).", "src": "Manual 4.4.6, p. 41", "note": ""}, {"n": 106, "stem": "La carta que elimina las restricciones de velocidad y altitud de las STAR, excepto las altitudes mínimas de seguridad, es la:", "opts": ["TRAN", "CDA", "ATCSMAC", "IAC"], "ans": 1, "why": "CDA: Carta de llegada por instrumentos - Descenso continuo.", "src": "Manual 4.4.10, p. 42", "note": ""}, {"n": 107, "stem": "La carta TRAN contiene:", "opts": ["procedimientos de aproximación visual", "circuitos de espera NDB", "transiciones RNAV1 con tramos en forma de trombón para secuenciar las llegadas", "rutas de rodaje"], "ans": 2, "why": "1 tramo inicial, 1 tramo de alejamiento y 1 tramo de acercamiento que enlazan una STAR con la aproximación final al ILS.", "src": "Manual 4.4.11, p. 42", "note": ""}, {"n": 108, "stem": "En la actualidad, las transiciones TRAN solo existen en:", "opts": ["Madrid-Barajas", "Barcelona/El Prat", "Palma de Mallorca", "Valencia"], "ans": 1, "why": "«En la actualidad, solo existen en el aeropuerto de Barcelona/El Prat.»", "src": "Manual 4.4.11, p. 42", "note": ""}, {"n": 109, "stem": "La Carta de altitud mínima de vigilancia ATC debe llevar en el anverso una nota que indique que solo puede utilizarse para verificar las altitudes asignadas cuando la aeronave está:", "opts": ["en IMC", "por debajo de 3000 ft", "identificada", "en aproximación final"], "ans": 2, "why": "Solo cuando la aeronave está identificada.", "src": "Manual 4.4.12, p. 42", "note": ""}, {"n": 110, "stem": "Se publica una Carta de aproximación por instrumentos para cada:", "opts": ["aeródromo", "pista", "compañía aérea", "procedimiento de aproximación por instrumentos"], "ans": 3, "why": "«Se publica una carta de aproximación para cada procedimiento.»", "src": "Manual 4.4.13, p. 43", "note": ""}, {"n": 111, "stem": "La carta OACI 1:500 000:", "opts": ["está incluida en el AIP-España, parte AD", "la proporciona España, pero no está incluida en el AIP-España", "no la produce España", "se publica solo en formato digital"], "ans": 1, "why": "«Aunque España las proporciona, no las incluye dentro del AIP-España.»", "src": "Manual 4.4.15, p. 43", "note": ""}, {"n": 112, "stem": "La función principal de la carta OACI 1:500 000 es atender:", "opts": ["los vuelos IFR de alta velocidad y gran altitud", "la navegación visual a baja velocidad, a distancias cortas o medias y a altitudes bajas e intermedias", "el rodaje", "la guía vectorial por radar"], "ans": 1, "why": "Navegación aérea visual en vuelos a baja velocidad, a distancias cortas o medias y a altitudes bajas e intermedias.", "src": "Manual 4.4.15, p. 43", "note": ""}, {"n": 113, "stem": "La Carta de circulación VFR para TMA se publica por la alta densidad de tránsito aéreo en las TMA de:", "opts": ["Madrid, Barcelona, Palma de Mallorca, Valencia, Sevilla y Galicia", "Madrid, Málaga, Bilbao, Gran Canaria, Tenerife e Ibiza", "Barcelona, Bilbao, Alicante, Madrid, Girona y Reus", "solo Madrid"], "ans": 0, "why": "La lista que da el manual.", "src": "Manual 4.4.16, p. 44", "note": ""}, {"n": 114, "stem": "Los datos de la carta de concentración de aves y de la de áreas prioritarias a evitar los facilita:", "opts": ["AEMET", "AESA", "el Ministerio de Agricultura y Pesca, Alimentación y Medio Ambiente", "SEO/BirdLife"], "ans": 2, "why": "El manual nombra ese ministerio.", "src": "Manual 4.4.18-4.4.19, p. 44", "note": ""}, {"n": 115, "stem": "La especificación de la OACI para las cartas electrónicas exige que:", "opts": ["no se pueda quitar la presentación de información básica", "se pueda quitar toda la información", "no se pueda variar la escala", "la posición se introduzca manualmente"], "ans": 0, "why": "Agregar o quitar información es una función simple, pero no es posible quitar la presentación de información básica; la escala debe poder variarse y la posición se determina de modo dinámico.", "src": "Manual 4.5, p. 45", "note": ""}, {"n": 116, "stem": "Las modificaciones urgentes de las cartas que son significativas para las operaciones se notifican mediante:", "opts": ["corrección manuscrita", "enmienda del AIP", "solo AIRAC", "un NOTAM que haga referencia a la carta afectada"], "ans": 3, "why": "NOTAM; si el cambio no afecta a las operaciones, corrección manuscrita al AIP.", "src": "Manual 4.6, p. 46", "note": ""}, {"n": 117, "stem": "Un cambio de importancia operacional en los procedimientos de las cartas se publica como:", "opts": ["una nueva edición distribuida mediante el sistema AIRAC", "una corrección manuscrita", "solo un NOTAM", "no se publica"], "ans": 0, "why": "Nueva edición mediante el sistema AIRAC.", "src": "Manual 4.6, p. 46", "note": ""}, {"n": 118, "stem": "Los cambios sin importancia operacional en las cartas se publican mediante:", "opts": ["NOTAM", "AIRAC", "enmienda regular al AIP, Suplemento Regular o correcciones manuscritas", "Trigger NOTAM"], "ans": 2, "why": "Manual 4.6.", "src": "Manual 4.6, p. 46", "note": ""}, {"n": 119, "stem": "El Plano de aeródromo / helipuerto, según la OACI, es necesario en:", "opts": ["solo los aeródromos militares", "todos los aeródromos utilizados regularmente por la aviación civil internacional", "solo los helipuertos", "solo los aeródromos con ILS"], "ans": 1, "why": "En España se publica para prácticamente todos los aeródromos y helipuertos civiles.", "src": "Manual 4.4.1, p. 39", "note": ""}, {"n": 120, "stem": "El coeficiente de forma dinámica J2 del WGS84 en el manual es:", "opts": ["7292115 x 10^-11", "6 356 752", "-484,166 85 x 10^-6", "3986004,418 x 10^8"], "ans": 2, "why": "A es la velocidad angular y D es GM.", "src": "Manual 2.5.2, p. 21", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/04-cartografia/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
