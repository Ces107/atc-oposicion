nantes", "el movimiento aparente de los astros"], "ans": 1, "why": "La variación del norte magnético es el efecto de la combinación de precesión y nutación. La traslación y la rotación causan los ciclos climáticos y atmosféricos, la duración del día, los vientos predominantes, la radiación solar y el movimiento aparente de los astros.", "src": "Manual 4 (nov. 2026), capítulos 2.3.2 y 2.3.4, pp. 11-12", "note": ""}, {"n": 143, "stem": "Según el manual, los polos magnéticos de la Tierra:", "opts": ["coinciden con los polos geográficos", "están situados sobre el Ecuador", "no están alineados con los polos geográficos", "son fijos y no cambian de posición"], "ans": 2, "why": "«Estos polos magnéticos no están alineados con los polos geográficos.» La posición del norte magnético varía (precesión y nutación).", "src": "Manual 4 (nov. 2026), capítulo 2.4.1, p. 13", "note": ""}, {"n": 144, "stem": "En la figura «Campo magnético de la tierra» del manual, ¿qué ángulo se indica entre el Polo Norte Magnético y el Polo Norte Geográfico?", "opts": ["23º 27'", "3º", "66º 33'", "11,5º"], "ans": 3, "why": "La figura rotula 11.5° entre ambos polos. 23º 27' es la latitud de los trópicos y 66º 33', la inclinación del eje respecto al plano de la órbita.", "src": "Manual 4 (nov. 2026), capítulo 2.4.1, figura de la p. 13", "note": ""}, {"n": 145, "stem": "Un observador mira al norte geográfico y ve el norte magnético a su izquierda. La declinación es:", "opts": ["Oeste (W) o negativa", "Este (E) o positiva", "Oeste (W) o positiva", "Este (E) o negativa"], "ans": 0, "why": "Izquierda = W = negativa; derecha = E = positiva. La figura de la p. 14 rotula «Declinación 3ºW (-3º)» y «Declinación 3ºE (3º)».", "src": "Manual 4 (nov. 2026), capítulo 2.4.2, p. 14", "note": ""}, {"n": 146, "stem": "Según el manual, los rumbos se miden a partir de:", "opts": ["el eje longitudinal de la aeronave", "el Norte geográfico o el magnético, según se considere", "la ruta deseada que une el punto de salida con el de destino", "el meridiano de Greenwich"], "ans": 1, "why": "El origen es «el Norte geográfico o magnético, según se considere», y el ángulo se mide en el sentido de las agujas del reloj hasta el eje longitudinal de la aeronave.", "src": "Manual 4 (nov. 2026), capítulo 2.4.3, p. 14", "note": ""}, {"n": 147, "stem": "Según el segundo ejemplo del manual, ¿cuál es el rumbo magnético para un rumbo geográfico de 122º y una declinación de 3ºW?", "opts": ["119º", "122º", "125º", "127º"], "ans": 2, "why": "Rm = 122º - (-3º) = 122º + 3º = 125º. La edición de noviembre de 2026 pone 3ºW en el enunciado (la de 2024 ponía 5ºW con el mismo cálculo); 127º correspondería a 5ºW y 119º a 3ºE.", "src": "Manual 4 (nov. 2026), capítulo 2.4.3, p. 15", "note": ""}, {"n": 148, "stem": "Rumbo geográfico 270º, declinación 2ºE. Aplicando la fórmula del manual, el rumbo magnético es:", "opts": ["272º", "270º", "266º", "268º"], "ans": 3, "why": "Rm = Rg - declinación = 270 - (+2) = 268º (la declinación E es positiva).", "src": "Manual 4 (nov. 2026), capítulo 2.4.3, p. 15; cálculo", "note": ""}, {"n": 149, "stem": "En la figura «Rumbo geográfico y magnético» del manual, ¿qué valores aparecen?", "opts": ["rumbo geográfico 081º, rumbo magnético 078º y declinación magnética 3ºE", "rumbo geográfico 078º, rumbo magnético 081º y declinación magnética 3ºW", "rumbo geográfico 122º, rumbo magnético 125º y declinación magnética 3ºW", "rumbo geográfico 081º, rumbo magnético 084º y declinación magnética 3ºE"], "ans": 0, "why": "La figura ilustra el primer ejemplo: 081º geográfico, 3ºE, 078º magnético.", "src": "Manual 4 (nov. 2026), capítulo 2.4.3, figura de la p. 15", "note": ""}, {"n": 150, "stem": "Según el manual, la ruta podrá ser magnética o geográfica según:", "opts": ["se mida con brújula o con un sistema de navegación por satélite", "se tome como referencia el Norte Magnético o el Geográfico", "haya o no viento durante el vuelo", "se trace sobre una carta Lambert o sobre una Mercator"], "ans": 1, "why": "«Podrá ser magnética o geográfica según se tome como referencia el Norte Magnético o el Geográfico.»", "src": "Manual 4 (nov. 2026), capítulo 2.4.4, p. 15", "note": ""}, {"n": 151, "stem": "La ruta ortodrómica forma ángulos distintos con cada meridiano, EXCEPTO cuando:", "opts": ["la ruta es inferior a 1000 km", "se traza sobre una carta Lambert", "coincide con un meridiano o con el Ecuador", "se mantiene un rumbo constante en la brújula"], "ans": 2, "why": "«Forma ángulos distintos con cada meridiano excepto cuando dicha ruta coincide con un meridiano o con el Ecuador.» Mantener rumbo constante describe la loxodrómica.", "src": "Manual 4 (nov. 2026), capítulo 2.4.4, p. 17", "note": ""}, {"n": 152, "stem": "¿Qué afirmación sobre la ruta loxodrómica es FALSA según el manual?", "opts": ["Mantiene un rumbo constante en la brújula", "Es más larga que la ortodrómica", "Es fácil de seguir", "Es la preferida para grandes distancias por ser más corta"], "ans": 3, "why": "Para grandes distancias se prefiere la ortodrómica, que es más corta. La loxodrómica se suele seguir en rutas inferiores a 1000 km.", "src": "Manual 4 (nov. 2026), capítulo 2.4.4, pp. 16-17", "note": ""}, {"n": 153, "stem": "Según el manual, la deriva es mínima o nula cuando:", "opts": ["la dirección del viento coincide con la de la aeronave", "el viento es perpendicular al rumbo de la aeronave", "el viento forma 45º con la ruta deseada", "la aeronave sigue una ruta loxodrómica"], "ans": 0, "why": "La deriva es máxima con viento perpendicular al rumbo y mínima o nula cuando la dirección del viento coincide con la de la aeronave.", "src": "Manual 4 (nov. 2026), capítulo 2.4.5, p. 17", "note": ""}, {"n": 154, "stem": "Según el manual, la derrota se debe principalmente a:", "opts": ["la declinación magnética", "los vientos", "la precesión del eje terrestre", "la curvatura de la Tierra"], "ans": 1, "why": "«La derrota se debe principalmente a los vientos»; a lo largo del vuelo hay que hacer sucesivas correcciones de rumbo para no abandonar la ruta.", "src": "Manual 4 (nov. 2026), capítulo 2.4.6, p. 18", "note": ""}, {"n": 155, "stem": "Según el manual, los modelos matemáticos desarrollados para localizar puntos de la superficie terrestre se caracterizan básicamente por:", "opts": ["una escala y una proyección", "un geoide y un elipsoide", "un sistema de coordenadas y un datum", "una latitud y una declinación"], "ans": 2, "why": "1) un sistema de coordenadas, que permite posicionar puntos sobre el elipsoide; 2) un datum.", "src": "Manual 4 (nov. 2026), capítulo 2.5, p. 18", "note": ""}, {"n": 156, "stem": "Según el manual, la latitud es Norte o positiva cuando el punto se encuentra:", "opts": ["a la derecha del meridiano origen", "por debajo del Ecuador", "a la izquierda del meridiano origen", "por encima del Ecuador"], "ans": 3, "why": "Latitud N (+) por encima del Ecuador, S (-) por debajo. Derecha/izquierda del meridiano origen define la longitud E/W.", "src": "Manual 4 (nov. 2026), capítulo 2.5.1, p. 19", "note": ""}, {"n": 157, "stem": "Según el manual, la longitud es Este o positiva cuando el punto se sitúa:", "opts": ["a la derecha del meridiano origen", "a la izquierda del meridiano origen", "por encima del Ecuador", "por debajo del Ecuador"], "ans": 0, "why": "Longitud E (+) a la derecha del meridiano origen; W (-) a la izquierda.", "src": "Manual 4 (nov. 2026), capítulo 2.5.1, p. 19", "note": ""}, {"n": 158, "stem": "¿Qué latitud tienen, respectivamente, un punto situado sobre el Ecuador y los Polos?", "opts": ["90º y 0º", "0º y 90º", "0º y 180º", "180º y 90º"], "ans": 1, "why": "«Los puntos situados sobre el Ecuador tienen como latitud 0º y los Polos tienen como latitud 90º.» Los puntos del meridiano origen tienen longitud 0º.", "src": "Manual 4 (nov. 2026), capítulo 2.5.1, pp. 19-20", "note": ""}, {"n": 159, "stem": "Según el manual, el WGS84 se desarrolló porque:", "opts": ["la Comisión Europea lo exigió en su mandato de 1999", "el Anexo 4 de la OACI obligaba a un sistema único para las cartas", "la ambigüedad en el cálculo de coordenadas por el uso de diferentes datums exigía un modelo único", "la deriva entre ETRS89 y REGCAN95 superaba la exactitud requerida"], "ans": 2, "why": "«La ambigüedad en el cálculo de coordenadas, ocasionada por el uso de diferentes datums, puso de manifiesto la necesidad de normalizar un modelo único de referencia.»", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 20", "note": ""}, {"n": 160, "stem": "En el WGS84, el eje X está formado por:", "opts": ["la dirección del polo medio convencional terrestre definido por el IERS", "una recta en el plano del Ecuador medio a 90º a la derecha del eje Y", "la dirección que apunta a la estrella polar", "la intersección del plano del Ecuador y el meridiano de Greenwich definido por el IERS"], "ans": 3, "why": "La A describe el eje Z; el eje Y está a 90º a la derecha del eje X.", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 20", "note": ""}, {"n": 161, "stem": "La velocidad angular del WGS84 que da el manual es:", "opts": ["W = 7292115 x 10^-11 rad/s", "W = 3986004,418 x 10^8 rad/s", "W = -484,166 85 x 10^-6 rad/s", "W = 7292115 x 10^-8 rad/s"], "ans": 0, "why": "W = 7292115 x 10^-11 rad/s. 3986004,418 x 10^8 es GM (m3/s2) y -484,166 85 x 10^-6, J2.", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 21", "note": ""}, {"n": 162, "stem": "La constante de gravitación terrestre del WGS84 que da el manual es:", "opts": ["GM = 7292115 x 10^-11 m3/s2", "GM = (3986004,418 ± 0,008) x 10^8 m3/s2", "GM = (3986004,418 ± 0,008) x 10^6 m3/s2", "GM = 6 378 137 m3/s2"], "ans": 1, "why": "GM = (3986004.418 ± 0.008) x 10^8 m3/s2.", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 21", "note": ""}, {"n": 163, "stem": "En la figura «Representación del esquema del WGS84», el origen de los ejes se rotula como:", "opts": ["Meridiano de Greenwich (IERS)", "Polo medio convencional terrestre", "Centro de masa terrestre (atmósfera incluida)", "Centro geométrico del elipsoide GRS80"], "ans": 2, "why": "La figura muestra los ejes X, Y y Z partiendo de un punto rotulado «Centro de masa terrestre (Atmósfera incluida)».", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, figura de la p. 21", "note": ""}, {"n": 164, "stem": "Según el manual, el Real Decreto 1071/2007, de 27 de julio, es adaptación de:", "opts": ["el Anexo 15 de la OACI", "la Directiva europea de infraestructuras de información espacial", "el Reglamento europeo de calidad de los datos aeronáuticos", "el mandato de la Comisión Europea de 1999"], "ans": 3, "why": "«El Real Decreto 1071/2007, de 27 de julio, adaptación del mandato de la Comisión Europea de 1999, por el que se regula el sistema geodésico de referencia oficial en España.»", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 21", "note": ""}, {"n": 165, "stem": "ETRS89 y REGCAN95 se consideraron inicialmente equivalentes a WGS84 teniendo en cuenta la exactitud requerida para los datos establecida en:", "opts": ["el Catálogo de Datos Aeronáuticos", "el Anexo 4 de la OACI", "el Doc 8697 de la OACI", "el Real Decreto 1071/2007"], "ans": 0, "why": "«Teniendo en cuenta la exactitud requerida para los diferentes datos establecidas en el Catálogo de Datos Aeronáuticos.» Después, la deriva entre sistemas los invalidó para el AIP.", "src": "Manual 4 (nov. 2026), capítulo 2.5.2, p. 21", "note": ""}, {"n": 166, "stem": "Según el manual, la escala se define como:", "opts": ["la diferencia entre la dimensión real de un objeto y la de su dibujo", "la relación entre la dimensión real de un objeto y su representación gráfica", "la distancia vertical entre los planos que cortan el terreno", "la transformación matemática que proyecta la Tierra en un plano"], "ans": 1, "why": "Definición del manual. La C es la equidistancia y la D, la proyección cartográfica.", "src": "Manual 4 (nov. 2026), capítulo 3.1, p. 22", "note": ""}, {"n": 167, "stem": "Según el manual, las dos formas más comunes de expresar la escala son:", "opts": ["grande y pequeña", "natural y de ampliación", "gráfica y numérica", "de reducción y de ampliación"], "ans": 2, "why": "«Existen diversas formas de expresar la escala, pero las dos más comunes son la gráfica y la numérica.» Grande/pequeña, reducción/ampliación y natural son tipos de escala numérica.", "src": "Manual 4 (nov. 2026), capítulo 3.1, p. 22", "note": ""}, {"n": 168, "stem": "Una escala es de ampliación cuando:", "opts": ["el numerador es menor que el denominador", "numerador y denominador son iguales (1:1)", "el denominador es pequeño y abarca poco terreno", "el numerador de la fracción es mayor que el denominador"], "ans": 3, "why": "Ampliación: numerador mayor que denominador (2/1 en el esquema); reducción: numerador menor; natural: 1:1.", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, p. 23", "note": ""}, {"n": 169, "stem": "¿Cuál de estas escalas es una escala grande según los ejemplos del manual?", "opts": ["1:10.000", "1:5.000.000", "1:7.000.000", "2:1"], "ans": 0, "why": "Escalas grandes: 1:5.000 y 1:10.000 (ciudades, fincas, caminos). 1:5.000.000 y 1:7.000.000 son pequeñas; 2:1 es de ampliación.", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, p. 23", "note": ""}, {"n": 170, "stem": "Según el manual, en la escala numérica se han de utilizar siempre las mismas unidades porque:", "opts": ["así lo exige el Anexo 4 de la OACI", "de no ser así, se perderían las proporciones", "la escala gráfica solo admite centímetros", "el numerador debe ser siempre 1"], "ans": 1, "why": "«Se han de utilizar siempre las mismas unidades ya que, de no ser así, se perderían las proporciones.»", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, p. 23", "note": ""}, {"n": 171, "stem": "En el «Esquema de tipos de escala» del manual, la fila 2/1 corresponde a la escala:", "opts": ["natural", "de reducción", "de ampliación", "grande"], "ans": 2, "why": "El esquema compara realidad y dibujo: 1/1 natural, 1/2 reducción, 2/1 ampliación.", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, figura de la p. 23", "note": ""}, {"n": 172, "stem": "En la figura «Ejemplos de diferentes tipos de escala» del manual, ¿qué escala NO aparece?", "opts": ["1:50.000", "1:250.000", "1:1.000.000", "1:500.000"], "ans": 3, "why": "La figura muestra el mismo lugar a escalas a) 1:50.000, b) 1:100.000, c) 1:250.000 y d) 1:1.000.000.", "src": "Manual 4 (nov. 2026), capítulo 3.1.1, figura de la p. 24", "note": ""}, {"n": 173, "stem": "Según el manual, la escala gráfica permite:", "opts": ["reconocer las proporciones reales sobre una representación de manera visual y sin cálculos", "conservar los ángulos entre dos puntos medidos en la superficie de referencia", "expresar la escala como una fracción entre longitudes del plano y del terreno", "representar el relieve mediante planos paralelos equidistantes"], "ans": 0, "why": "Es una línea graduada en divisiones con su equivalencia real; permite reconocer las proporciones «de una manera visual y sin cálculos». La C describe la escala numérica.", "src": "Manual 4 (nov. 2026), capítulo 3.1.2, p. 24", "note": ""}, {"n": 174, "stem": "En la figura «Ejemplo de escala gráfica» del manual, cada división de 1 cm equivale en la realidad a:", "opts": ["50 km", "500 m", "2500 m", "5 km"], "ans": 1, "why": "La línea está graduada 500, 1000, 1500, 2000 y 2500 m, con 1 cm marcado como 500 m. Los 50 km por centímetro son el ejemplo del texto para la escala 1/5.000.000.", "src": "Manual 4 (nov. 2026), capítulo 3.1.2, figura de la p. 24", "note": ""}, {"n": 175, "stem": "Según el manual, la elección del tipo de proyección depende principalmente de:", "opts": ["la escala de la carta y la equidistancia de las curvas de nivel", "el datum y el elipsoide de referencia empleados", "la zona de la superficie terrestre que se quiera representar y la especialización del mapa", "la declinación magnética de la zona y el tipo de ruta"], "ans": 2, "why": "Dos factores: 1) la zona que se quiera representar; 2) la especialización del mapa, es decir, su finalidad, factor clave porque una proyección concreta puede evitar distorsiones que dificulten su uso.", "src": "Manual 4 (nov. 2026), capítulo 3.2.1, pp. 25-26", "note": ""}, {"n": 176, "stem": "Según el manual, las distorsiones que lleva implícitas cualquier mapa generado a partir de una proyección tienen que ver con:", "opts": ["la declinación magnética, el ángulo de deriva y la derrota seguida por la aeronave", "la latitud, la longitud y la altitud de los puntos respecto al datum", "el color, la forma, la dimensión y la orientación de los símbolos del mapa", "las distancias entre puntos, los ángulos entre líneas o curvas y la equivalencia entre áreas"], "ans": 3, "why": "No es posible transformar un área esférica en una plana sin deformarla; las proyecciones intentan minimizar esas alteraciones.", "src": "Manual 4 (nov. 2026), capítulo 3.2.1, p. 25", "note": ""}, {"n": 177, "stem": "Según la tabla de clasificación de la edición de noviembre de 2026, en las proyecciones equidistantes la proporcionalidad entre las distancias:", "opts": ["solo puede conservarse a lo largo de determinadas líneas, que se denominan automecoicas", "se conserva a lo largo de todo el mapa", "se conserva únicamente en las proyecciones afilácticas", "se conserva a lo largo de las curvas de nivel o isohipsas"], "ans": 0, "why": "«En la práctica, no existe ninguna proyección capaz de conservar esta propiedad a lo largo de todo el mapa. Sin embargo, puede conservarse a lo largo de determinadas líneas que se denominan automecoicas.» En la cónica tangente la única automecoica es el paralelo estándar; en Lambert, los dos paralelos estándar.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 26", "note": ""}, {"n": 178, "stem": "Según la tabla de clasificación, ¿por qué ninguna proyección puede ser equivalente y conforme a la vez?", "opts": ["porque las proyecciones conformes solo conservan distancias", "porque la equivalencia no es posible sin deformar considerablemente los ángulos originales", "porque las proyecciones equivalentes son siempre cónicas tangentes", "porque la conformidad solo se obtiene con un cono secante"], "ans": 1, "why": "«La equivalencia no es posible sin deformar considerablemente los ángulos originales. Por lo tanto, ninguna proyección puede ser equivalente y conforme a la vez» (frase completa en la edición de 2026).", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 26", "note": ""}, {"n": 179, "stem": "Según el manual, ¿cuál de estas combinaciones NO puede darse en una proyección?", "opts": ["cónica y conforme", "modificada y conforme", "equivalente y conforme", "pura y cilíndrica"], "ans": 2, "why": "Ninguna proyección puede ser equivalente y conforme a la vez (p. 26). La cónica gnomónica-directa y la de Lambert (modificada) son conformes; las cilíndricas son proyecciones puras por desarrollo.", "src": "Manual 4 (nov. 2026), capítulos 3.2.2-3.2.3, pp. 26-28", "note": ""}, {"n": 180, "stem": "Según la nota 2 del manual, para la navegación aérea interesa el uso de cartas que no deformen:", "opts": ["las áreas entre las zonas representadas", "el relieve ni las curvas de nivel", "los símbolos normalizados del Anexo 4", "los ángulos entre rumbos o la distancia entre dos puntos"], "ans": 3, "why": "Nota 2 (que en la edición de 2026 queda al pie de la p. 27): «Para la navegación aérea, por ejemplo, es interesante el uso de cartas que no deformen los ángulos entre rumbos o la distancia entre dos puntos.»", "src": "Manual 4 (nov. 2026), capítulo 3.2.1, p. 27, nota 2", "note": ""}, {"n": 181, "stem": "Atendiendo a la forma de proyección, el manual divide las proyecciones en:", "opts": ["puras y modificadas", "conformes y equivalentes", "planas y cónicas", "directas y transversales"], "ans": 0, "why": "1) proyecciones puras (planas o perspectivas y por desarrollo) y 2) proyecciones modificadas. Conformes/equivalentes es la clasificación por la magnitud que se conserva.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 27", "note": ""}, {"n": 182, "stem": "En una proyección escenográfica, el foco de proyección se encuentra:", "opts": ["en el centro de la superficie terrestre", "fuera de la superficie terrestre, a una distancia finita", "fuera de la superficie terrestre, a una distancia infinita", "sobre la superficie terrestre"], "ans": 1, "why": "Escenográfica: fuera, a distancia finita. Ortográfica: fuera, a distancia infinita. Estereográfica: sobre la superficie. Gnomónica: en el centro.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 27", "note": ""}, {"n": 183, "stem": "En una proyección plana horizontal, el plano de proyección es tangente:", "opts": ["en uno de los Polos de la superficie terrestre", "en algún punto del Ecuador de la superficie terrestre", "en algún punto no significativo de la superficie terrestre", "a lo largo de dos paralelos estándar automecoicos"], "ans": 2, "why": "Polar: en un Polo; ecuatorial: en un punto del Ecuador; horizontal: en un punto no significativo.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 27", "note": ""}, {"n": 184, "stem": "En una proyección por desarrollo «transversal», el eje de la superficie de proyección es:", "opts": ["paralelo al eje de rotación terrestre", "oblicuo, con un ángulo entre 0º y 90º respecto al eje de rotación", "tangente al Ecuador", "perpendicular al eje de rotación terrestre"], "ans": 3, "why": "Directa: paralelo; transversal: perpendicular; oblicua: entre 0º y 90º.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 27", "note": ""}, {"n": 185, "stem": "¿Cuál de estas proyecciones planas se clasifica según la posición del plano de proyección y no según el lugar donde se sitúa el centro de proyección?", "opts": ["ecuatorial", "gnomónica", "estereográfica", "ortográfica"], "ans": 0, "why": "Según el centro de proyección: ortográficas, escenográficas, estereográficas y gnomónicas. Según la posición del plano: polares, ecuatoriales y horizontales.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 27", "note": ""}, {"n": 186, "stem": "Las proyecciones por desarrollo se dividen, según la superficie de proyección, en:", "opts": ["polares, ecuatoriales y horizontales", "cónicas y cilíndricas", "ortográficas y gnomónicas", "conformes y afilácticas"], "ans": 1, "why": "Cónicas: cono tangente o secante a la superficie de referencia. Cilíndricas: cilindro tangente o secante a la esfera. Cada una puede ser directa, transversal u oblicua.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, pp. 27-28", "note": ""}, {"n": 187, "stem": "Según el manual, las proyecciones modificadas:", "opts": ["resultan de la verdadera proyección geométrica de la superficie terrestre sobre un plano o una superficie desarrollable", "no poseen ninguna de las tres propiedades de conformidad, equivalencia y equidistancia", "recurren a artificios geométricos y analíticos para que una proyección pura adquiera alguna propiedad que no posea originariamente", "se obtienen siempre con el foco de proyección en el centro de la Tierra"], "ans": 2, "why": "Su fin es disminuir las distorsiones geométricas en las áreas de interés para el uso de la carta. La A define las puras; la B, las afilácticas; la D, las gnomónicas.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 28", "note": ""}, {"n": 188, "stem": "¿Cuál NO figura entre las proyecciones modificadas «más populares» que cita el recuadro del manual?", "opts": ["Boggs", "Mollweide", "Bonne", "Estereográfica"], "ans": 3, "why": "«En la actualidad, la mayoría de los mapas se hacen a base de proyecciones modificadas. Entre las más populares se encuentran las proyecciones de Bonne, Lambert, Mercator, Mollweide, Goode o Boggs.» Esta frase está en la capa de texto del recuadro de la p. 28, aunque su borde la tapa en la página impresa. La estereográfica es una proyección pura.", "src": "Manual 4 (nov. 2026), capítulo 3.2.2, p. 28 (recuadro «Proyecciones modificadas»)", "note": ""}, {"n": 189, "stem": "Según el manual, las proyecciones cónicas más utilizadas en la cartografía aeronáutica son las:", "opts": ["gnomónicas-directas, con el cono tangente a lo largo de un paralelo que se denomina estándar", "estereográficas transversales, con el cono tangente a lo largo de un meridiano", "ortográficas oblicuas, con el cono secante a lo largo de dos meridianos", "escenográficas polares, con el cono tangente a lo largo del Ecuador"], "ans": 0, "why": "«Las cónicas más utilizadas son las gnomónicas-directas, en las que el plano cónico es tangente a la superficie terrestre a lo largo de un paralelo que se denomina estándar.»", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, p. 28", "note": ""}, {"n": 190, "stem": "En la proyección cónica gnomónica-directa, ¿dónde son mínimas las distorsiones lineales y superficiales?", "opts": ["en el vértice del cono, donde concurren los meridianos", "en las inmediaciones del paralelo estándar, único automecoico", "en el Ecuador, por ser un círculo máximo", "en toda la carta por igual, por ser conforme"], "ans": 1, "why": "Son mínimas cerca del paralelo estándar («único automecoico, es decir, sin deformación lineal») y aumentan al alejarse de él.", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, p. 28", "note": ""}, {"n": 191, "stem": "En la proyección cónica descrita en el manual, meridianos y paralelos mantienen entre sí un ángulo constante de:", "opts": ["45º", "66º 33'", "90º", "un valor variable según la latitud"], "ans": 2, "why": "Los meridianos son rectas concurrentes en el Polo y los paralelos, arcos de circunferencias concéntricas; «ambos tipos de línea mantienen un ángulo constante de 90º».", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, p. 28", "note": ""}, {"n": 192, "stem": "¿Cuántos paralelos estándar automecoicos tiene la proyección cónica conforme de Lambert, frente a la cónica tangente?", "opts": ["uno, frente a dos", "tres, frente a uno", "ninguno, frente a uno", "dos, frente a uno"], "ans": 3, "why": "Lambert sustituye el cono tangente por uno secante y consigue dos paralelos estándar automecoicos; la cónica tangente tiene un único paralelo estándar automecoico.", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, p. 28", "note": ""}, {"n": 193, "stem": "En la proyección cónica conforme de Lambert, la loxodrómica está representada por:", "opts": ["una curva con la concavidad orientada hacia el vértice de la proyección", "una línea recta, igual que la ortodrómica", "una curva con la concavidad orientada hacia el Ecuador", "un arco de circunferencia concéntrico con los paralelos"], "ans": 0, "why": "La ortodrómica es, con gran aproximación, una recta; la loxodrómica, una curva con la concavidad orientada hacia el vértice.", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, p. 29", "note": ""}, {"n": 194, "stem": "¿Qué afirmación sobre la proyección cónica conforme de Lambert es FALSA según el manual?", "opts": ["Es conforme y prácticamente equidistante", "Es una proyección pura obtenida con un cono tangente", "Mantiene una constancia en la escala bastante extendida en la carta", "Por ser conforme, la distorsión de las áreas es mínima"], "ans": 1, "why": "Es una proyección modificada que se basa en la directa-gnomónica pero sustituye el cono tangente por uno secante.", "src": "Manual 4 (nov. 2026), capítulo 3.2.3, pp. 28-29", "note": ""}, {"n": 195, "stem": "Según el manual, la topografía es la ciencia que:", "opts": ["estudia la forma y dimensiones de la Tierra y su campo de gravedad", "estudia la representación de cartas para la navegación aérea", "se ocupa de la representación de pequeñas extensiones de la superficie terrestre", "estudia los movimientos de la Tierra y sus efectos"], "ans": 2, "why": "La principal dificultad es el alto grado de irregularidad de los terrenos naturales; al no abarcar grandes dimensiones, se puede obviar la esfericidad y aproximarse a un plano.", "src": "Manual 4 (nov. 2026), capítulo 3.3, pp. 29-30", "note": ""}, {"n": 196, "stem": "En el sistema de planos acotados, la cota de un punto es:", "opts": ["su distancia horizontal al plano de referencia", "la distancia vertical constante entre los planos que cortan el terreno", "su latitud medida sobre el plano del cuadro", "su distancia vertical al plano del cuadro, con signo + o - según esté por encima o por debajo"], "ans": 3, "why": "Un punto queda definido por sus coordenadas planas en el cuadro y su cota. La B es la equidistancia.", "src": "Manual 4 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 197, "stem": "Según la nota 3 del manual, en una proyección cilíndrica ortogonal los rayos proyectantes:", "opts": ["tienen su origen en el infinito, son paralelos entre sí y perpendiculares al plano de proyección", "parten del centro de la Tierra y cortan oblicuamente el plano de proyección", "parten de un punto de la superficie terrestre opuesto al plano", "convergen en el vértice de un cono tangente al terreno"], "ans": 0, "why": "Nota 3: «El origen de los rayos proyectantes se sitúa en el infinito, siendo todos ellos paralelos entre sí y perpendiculares al plano de proyección.» La figura del sistema de planos acotados rotula «Rayos proyectantes» y «Plano de proyección».", "src": "Manual 4 (nov. 2026), capítulo 3.3, p. 30, nota 3", "note": ""}, {"n": 198, "stem": "¿Por qué se usa el sistema de curvas de nivel en lugar de una representación puntual del terreno?", "opts": ["porque la representación puntual exige una proyección cónica", "porque con pocos puntos se pierde precisión y con demasiados el plano se hace ininteligible", "porque las cotas no admiten signo negativo", "porque el Anexo 4 prohíbe las cotas en las cartas aeronáuticas"], "ans": 1, "why": "«Se correría el riesgo de perder precisión en el plano (en el caso de escoger un escaso número de puntos) o de hacerlo ininteligible (en caso de representar demasiados).»", "src": "Manual 4 (nov. 2026), capítulo 3.3, p. 30", "note": ""}, {"n": 199, "stem": "Las curvas de nivel también se denominan:", "opts": ["isógonas", "isobaras", "isohipsas", "automecoicas"], "ans": 2, "why": "Cada sección produce un perímetro orográfico de igual cota que, proyectado en el plano del cuadro, forma las «curvas de nivel o isohipsas». Las automecoicas son líneas sin deformación lineal de una proyección.", "src": "Manual 4 (nov. 2026), capítulo 3.3.1, p. 31", "note": ""}, {"n": 200, "stem": "Según el manual, la precisión de los planos obtenidos con el sistema de curvas de nivel depende de:", "opts": ["la declinación magnética de la zona", "la proyección y el datum empleados", "el número de símbolos del plano", "el valor de la equidistancia y la escala"], "ans": 3, "why": "La definición aumenta con el tamaño de la escala; para reflejar pequeños detalles hay que disminuir la equidistancia.", "src": "Manual 4 (nov. 2026), capítulo 3.3.1, p. 31", "note": ""}, {"n": 201, "stem": "Según el manual, la topografía basada en curvas de nivel es muy común en las cartas aeronáuticas que:", "opts": ["sirven para la navegación visual, representan aeródromos o definen superficies delimitadoras de obstáculos", "se publican solo en formato electrónico para la navegación en ruta por encima de FL 245", "representan las luces aeronáuticas de superficie y los faros de las posiciones significativas", "indican las altitudes mínimas de guía vectorial cuando la aeronave está identificada"], "ans": 0, "why": "Literal del final del apartado 3.3.1.", "src": "Manual 4 (nov. 2026), capítulo 3.3.1, p. 31", "note": ""}, {"n": 202, "stem": "En la figura «Sistema de curvas de nivel» del manual, la equidistancia natural indicada es:", "opts": ["E = 50 m", "E = 10 m", "E = 70 m", "E = 100 m"], "ans": 1, "why": "La figura rotula «Equidistancia natural: E=10 m», con planos a 50, 60 y 70 m sobre un «plano horizontal de referencia».", "src": "Manual 4 (nov. 2026), capítulo 3.3.1, figura de la p. 31", "note": ""}, {"n": 203, "stem": "Según el manual, los símbolos se crean conforme a:", "opts": ["los colores normalizados de cada Estado", "las coordenadas WGS84 de cada elemento", "signos evocadores, figurativos, cuantitativos o ideogramas", "la escala gráfica de la carta"], "ans": 2, "why": "«Los símbolos se crean conforme a signos evocadores, figurativos, cuantitativos o ideogramas que produzcan una percepción significativa asociada a la realidad.»", "src": "Manual 4 (nov. 2026), capítulo 3.4, p. 32", "note": ""}, {"n": 204, "stem": "En la tabla de símbolos del AIP GEN 2.3 que reproduce el manual, ¿cuál de estos símbolos lleva asterisco («No incluidos en el ANEXO 4 de OACI»)?", "opts": ["Aeródromo civil", "Helipuerto", "Aeródromo abandonado o cerrado", "Zona de paracaidismo"], "ans": 3, "why": "Llevan asterisco, entre otros, el helipuerto militar, el aeródromo restringido, planeadores, ultraligeros, campo de aeromodelismo, globo, estación de radiosondeo meteorológico y zona de paracaidismo.", "src": "Manual 4 (nov. 2026), capítulo 3.4, figura de la p. 32", "note": ""}, {"n": 205, "stem": "En la misma tabla del GEN 2.3, ¿cuál de estos símbolos NO lleva asterisco, es decir, sí está en el Anexo 4?", "opts": ["Aeródromo mixto (civil y militar)", "Helipuerto militar", "Aeródromo restringido", "Ultraligeros"], "ans": 0, "why": "Sin asterisco: aeródromo civil, militar, helipuerto, aeródromo mixto, base militar de hidroaviones y aeródromo abandonado o cerrado. Helipuerto militar, aeródromo restringido y ultraligeros llevan asterisco.", "src": "Manual 4 (nov. 2026), capítulo 3.4, figura de la p. 32", "note": ""}, {"n": 206, "stem": "En el ejemplo de rotulación de aeródromo de la tabla del GEN 2.3 («BILBAO 137 26 118.500 / ATIS 118.825»), el número 26 indica:", "opts": ["la elevación del aeródromo en decenas de pies", "la longitud de la pista más larga en centenares de metros", "el designador magnético de la pista principal", "la distancia al VOR más próximo en millas náuticas"], "ans": 1, "why": "137 = elevación (ft); 26 = longitud de la pista más larga (centenares de metros); 118.500 = frecuencia de TWR; 118.825 = frecuencia ATIS.", "src": "Manual 4 (nov. 2026), capítulo 3.4, figura de la p. 32", "note": ""}, {"n": 207, "stem": "Según el manual, la carta aeronáutica se define como:", "opts": ["cualquier mapa o plano a escala pequeña que represente un país o un continente con sus fronteras y ciudades principales", "la presentación electrónica e interactiva de la información aeronáutica del AIP, con posición dinámica de la aeronave", "la representación de una porción de tierra, su relieve y construcciones, diseñada especialmente para satisfacer los requisitos de la navegación aérea", "el plano acotado de un aeródromo con curvas de nivel, elaborado según la simbología normalizada del Anexo 4 de la OACI"], "ans": 2, "why": "Definición del inicio del capítulo 4.", "src": "Manual 4 (nov. 2026), capítulo 4, p. 33", "note": ""}, {"n": 208, "stem": "Según el manual, las cartas aeronáuticas se desarrollan en:", "opts": ["el Anexo 15 y el Doc 4444 de la OACI", "el Anexo 11 y el Doc 8168 de la OACI", "el Anexo 14 y el Doc 9674 de la OACI", "el Anexo 4 y el Documento 8697 de la OACI"], "ans": 3, "why": "«Las cartas aeronáuticas se desarrollan en el Anexo 4 y en el Documento 8697 de la OACI.» El Anexo 15 atribuye al AIS la producción de la cartografía.", "src": "Manual 4 (nov. 2026), capítulo 4, p. 33", "note": ""}, {"n": 209, "stem": "Según el apartado del Anexo 4 sobre generalidades, las cartas deben:", "opts": ["ser de interpretación rápida y dejar abierto el camino para posibles mejoras de diseño", "ser idénticas en todos los Estados, sin cartografías específicas nacionales", "publicarse solo en formato electrónico a través de la OACI", "producirse por la OACI para los Estados que no tengan servicio AIS"], "ans": 0, "why": "Hay que equilibrar la uniformidad de presentación, los requisitos operacionales y la aplicación de técnicas eficaces y económicas; la cooperación entre Estados es fundamental. Cada Estado puede desarrollar cartografías específicas.", "src": "Manual 4 (nov. 2026), capítulo 4.1.1, p. 34", "note": ""}, {"n": 210, "stem": "Según el manual, ¿quién es responsable de la producción cartográfica de cada Estado?", "opts": ["la OACI, a través del Doc 8697", "cada Estado, atendiendo a las necesidades de sus servicios de tránsito aéreo", "EUROCONTROL, para los Estados miembros", "la Comisión Europea, mediante reglamentos de ejecución"], "ans": 1, "why": "«Cada Estado es responsable de su propia producción cartográfica, atendiendo a las necesidades de sus servicios de tránsito aéreo», cumpliendo los Anexos 4 y 15.", "src": "Manual 4 (nov. 2026), capítulo 4.1.1, p. 34", "note": ""}, {"n": 211, "stem": "¿Cuál NO figura entre los puntos que desarrolla el Anexo 4 según el manual?", "opts": ["la declaración de las diferencias respecto al Anexo", "el idioma de publicación", "las tarifas de venta de las cartas a los usuarios", "la publicación de información sobre la disponibilidad de las cartas"], "ans": 2, "why": "Los cinco puntos son: diferencias, disponibilidad, idioma, especificaciones generales (requisitos de utilización, título, símbolos...) y desarrollo de cada carta.", "src": "Manual 4 (nov. 2026), capítulo 4.1.2, p. 35", "note": ""}, {"n": 212, "stem": "Según el manual, en cuanto al idioma de publicación de las cartas, en España:", "opts": ["se publican solo en español", "se publican solo en inglés, por exigencia de la OACI", "se publican en español, inglés y francés", "se están empezando a hacer bilingües: español e inglés"], "ans": 3, "why": "«En España en la actualidad se están empezando a hacer bilingües las cartas: español e inglés.»", "src": "Manual 4 (nov. 2026), capítulo 4.1.2, p. 35", "note": ""}, {"n": 213, "stem": "¿Cuál de estas cartas es obligatoria según el Doc 8697, tal como la recoge el manual?", "opts": ["Carta Aeronáutica Mundial - OACI 1:1.000.000", "Carta Aeronáutica - OACI 1:500.000", "Carta de Navegación Aeronáutica - OACI, Escala Pequeña", "Carta de Posición - OACI"], "ans": 0, "why": "Obligatorias: AOC Tipo A, PATC, navegación en ruta, aproximación por instrumentos, aeródromo/helipuerto y la Carta Aeronáutica Mundial 1:1.000.000. La 1:500.000, la de escala pequeña y la de posición son opcionales.", "src": "Manual 4 (nov. 2026), capítulos 4.2.1-4.2.2, pp. 35-36", "note": ""}, {"n": 214, "stem": "Según el manual, las cartas opcionales solo deben producirse si:", "opts": ["el aeródromo es utilizado regularmente por la aviación civil internacional y dispone de servicio de control de aeródromo", "en opinión de las autoridades estatales, su disponibilidad contribuiría a la seguridad, regularidad y eficiencia de las operaciones", "la información que contienen no puede indicarse con suficiente claridad en la Carta de área - OACI del mismo espacio aéreo", "la OACI lo solicita expresamente al Estado tras una auditoría de su servicio de información aeronáutica"], "ans": 1, "why": "Es la condición de las opcionales; el manual la repite para las otras cartas que se producen en España. La C es la condición de las SID y STAR (condicionalmente necesarias).", "src": "Manual 4 (nov. 2026), capítulo 4.2.2, p. 36", "note": ""}, {"n": 215, "stem": "La Carta de llegada normalizada (STAR) debe prepararse siempre que se haya establecido una ruta de llegada normalizada y ésta:", "opts": ["no pueda indicarse con suficiente claridad en la Carta de navegación en ruta", "no pueda indicarse en la Carta de aproximación por instrumentos", "no pueda indicarse con suficiente claridad en la Carta de área", "no pueda indicarse en la Carta de circulación VFR"], "ans": 2, "why": "La SID y la STAR son condicionalmente necesarias cuando no pueden indicarse con suficiente claridad en la Carta de Área - OACI. La A es la condición de la propia Carta de área.", "src": "Manual 4 (nov. 2026), capítulo 4.2.3, p. 36", "note": ""}, {"n": 216, "stem": "La Carta de altitud mínima de vigilancia ATC debe prepararse cuando:", "opts": ["el aeródromo carece de instalaciones de radiocomunicaciones y solo tiene instalaciones limitadas de navegación", "existen pistas de aproximación de precisión de las categorías II y III en el aeródromo principal del TMA", "las rutas ATS o los requisitos de notificación de posición son complicados y no caben en la carta en ruta", "se han establecido procedimientos de guía vectorial cuyas altitudes mínimas no pueden indicarse con claridad en las cartas de área, SID o STAR"], "ans": 3, "why": "Condición de la ATCSMAC en el apartado de cartas condicionalmente necesarias.", "src": "Manual 4 (nov. 2026), capítulo 4.2.3, p. 37", "note": ""}, {"n": 217, "stem": "¿Cuál NO es una de las circunstancias en las que, según el manual, debe prepararse la Carta de aproximación visual?", "opts": ["que el aeródromo disponga de ILS de categorías II y III", "que solo existan instalaciones y servicios limitados de navegación", "que no se cuente con instalaciones y servicios de radiocomunicaciones", "que se hayan establecido procedimientos de aproximación visual"], "ans": 0, "why": "Las circunstancias son: instalaciones limitadas de navegación, sin radiocomunicaciones, sin otras cartas adecuadas del aeródromo a escala 1:500.000 o superior, o procedimientos de aproximación visual establecidos. Las categorías II y III son de la PATC.", "src": "Manual 4 (nov. 2026), capítulos 4.2.3 y 4.4.14, pp. 36-37 y 43", "note": ""}, {"n": 218, "stem": "¿Cuál NO figura entre las «otras cartas» que, según el manual, se producen en España?", "opts": ["Carta de presencia de buitres y cigüeñas", "Carta de posición - OACI", "Carta de área de cobertura radar", "Carta de transición a la aproximación final (TRAN)"], "ans": 1, "why": "La carta de posición es una de las opcionales de la OACI. La lista española: cobertura radar, ATCSMAC en TMA, circulación VFR en TMA, TRAN, CDA, luces aeronáuticas de superficie en ruta, áreas prioritarias a evitar, concentración de aves y presencia de buitres y cigüeñas.", "src": "Manual 4 (nov. 2026), capítulos 4.2.2-4.2.3, pp. 36-37", "note": ""}, {"n": 219, "stem": "¿Qué carta aparece tanto en la fase 2 (despegue y ascenso) como en la fase 4 (descenso hasta la aproximación)?", "opts": ["Carta de salida normalizada (SID)", "Carta de llegada normalizada (STAR)", "Carta de altitud mínima de vigilancia ATC", "Plano de obstáculos de aeródromo tipo A"], "ans": 2, "why": "Fase 2: plano de obstáculos tipo A, SID y ATCSMAC. Fase 4: STAR, CDA, TRAN y ATCSMAC. El tipo A está en las fases 2 y 5.", "src": "Manual 4 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 220, "stem": "El Plano de obstáculos de aeródromo tipo A figura en las fases del vuelo:", "opts": ["1 y 6", "3 y 4", "solo en la 2", "2 y 5"], "ans": 3, "why": "Fase 2 (despegue y ascenso) y fase 5 (aproximación para aterrizar, «Limitaciones de utilización»). Las fases 1 y 6 usan los tres planos de aeródromo.", "src": "Manual 4 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 221, "stem": "Según el apartado 4.4, el manual explica brevemente:", "opts": ["las cartas OACI que España publica y las cartas no OACI contenidas en el AIP-España", "todas las cartas del Anexo 4, las publique España o no", "solo las cartas obligatorias del Doc 8697", "solo las cartas que se presentan en formato electrónico en Insignia"], "ans": 0, "why": "«Solo de aquellas que España publica y de aquellas cartas que no son OACI pero contenidas en el AIP-España.»", "src": "Manual 4 (nov. 2026), capítulo 4.4, p. 39", "note": ""}, {"n": 222, "stem": "¿De qué dos cartas dice el manual que, aunque la OACI exige publicarlas para los aeródromos utilizados regularmente por la aviación civil internacional, en España se publican prácticamente para todos los aeródromos y helipuertos civiles?", "opts": ["Carta de aproximación visual y Carta OACI 1:500.000", "Plano de aeródromo / helipuerto y Plano de obstáculos tipo A", "Plano para movimientos en tierra y Plano de estacionamiento y atraque", "Carta topográfica para aproximaciones de precisión y Carta de aproximación por instrumentos"], "ans": 1, "why": "El manual repite la misma frase en 4.4.1 (plano de aeródromo / helipuerto) y en 4.4.4 (plano de obstáculos tipo A).", "src": "Manual 4 (nov. 2026), capítulos 4.4.1 y 4.4.4, pp. 39-40", "note": ""}, {"n": 223, "stem": "Si existe un plano de estacionamiento, en el Plano de aeródromo para movimientos en tierra solo se reflejarían:", "opts": ["los puestos de estacionamiento con sus designadores, coordenadas y sistemas de guía de atraque", "las pistas con sus distancias declaradas, umbrales y zonas de parada", "las calles de rodaje con su designador y sentido cuando no sea bidireccional, y otros datos necesarios de ellas", "los obstáculos del área de aproximación final y las superficies limitadoras de obstáculos"], "ans": 2, "why": "Literal del apartado 4.4.2.", "src": "Manual 4 (nov. 2026), capítulo 4.4.2, p. 39", "note": ""}, {"n": 224, "stem": "El Plano de estacionamiento y atraque de aeronaves se utilizará cuando:", "opts": ["el aeródromo sea utilizado regularmente por la aviación civil internacional, aunque su terminal sea sencilla", "existan procedimientos de aproximación de precisión de las categorías II y III con riesgo de incursión en pista", "la terminal no disponga de calles de rodaje bidireccionales y haya que indicar el sentido de cada una", "por la complejidad de las instalaciones terminales, la información no pueda detallarse en el plano de aeródromo y/o en el de movimientos en tierra"], "ans": 3, "why": "Proporciona información detallada para los movimientos entre las calles de rodaje y los puestos de estacionamiento y para el propio estacionamiento.", "src": "Manual 4 (nov. 2026), capítulo 4.4.3, p. 40", "note": ""}, {"n": 225, "stem": "Según el requisito de despegue del Plano de obstáculos tipo A, en caso de falla de un motor crítico en cualquier punto del despegue el avión podrá:", "opts": ["interrumpir el despegue y parar dentro de la distancia disponible de aceleración-parada, o continuarlo salvando todos los obstáculos", "continuar siempre el despegue, sin opción de interrumpirlo, y regresar al aeródromo de salida", "interrumpir el despegue solo si no ha alcanzado la mitad de la pista disponible para el recorrido", "continuar el vuelo hasta un aeródromo de alternativa en ruta en el que pueda aterrizar"], "ans": 0, "why": "Caso a) del 4.4.4. El caso b) es en ruta con un motor inactivo (continuar hasta un aeródromo donde pueda aterrizar) y el c), el aterrizaje.", "src": "Manual 4 (nov. 2026), capítulo 4.4.4, p. 40", "note": ""}, {"n": 226, "stem": "¿Cuál de estas fases NO figura entre las que facilita la Carta de área según el manual?", "opts": ["la transición entre la fase de ruta y la aproximación a un aeródromo", "el rodaje desde el puesto de estacionamiento hasta el punto de despegue", "la transición entre el despegue o aproximación frustrada y la fase en ruta", "los vuelos por áreas de estructura compleja de rutas ATS o del espacio aéreo"], "ans": 1, "why": "El rodaje se apoya en los planos de aeródromo. La Carta de área permite ver la llegada desde la aerovía que se deja o la salida hasta la aerovía a la que se incorpora.", "src": "Manual 4 (nov. 2026), capítulo 4.4.7, p. 41", "note": ""}, {"n": 227, "stem": "La Carta de llegada normalizada (STAR) facilita información sobre las rutas a seguir:", "opts": ["desde la fase de despegue hasta la fase de ruta", "desde la aproximación final hasta el umbral", "desde la fase en ruta hasta la fase de aproximación", "desde el puesto de estacionamiento hasta el punto de despegue"], "ans": 2, "why": "STAR: de la fase en ruta a la de aproximación. SID: del despegue a la fase de ruta. Ambas para aeronaves que operan en IFR.", "src": "Manual 4 (nov. 2026), capítulos 4.4.8-4.4.9, pp. 41-42", "note": ""}, {"n": 228, "stem": "Además de las rutas desde la fase en ruta hasta la aproximación, la Carta de llegada - Descenso continuo (CDA) informa sobre:", "opts": ["las altitudes mínimas de guía vectorial del TMA, para verificarlas cuando la aeronave está identificada", "las restricciones de velocidad y altitud de las STAR que debe cumplir la aeronave durante el descenso", "los tramos en trombón de las transiciones RNAV hasta el punto de inicio de la aproximación final", "la distancia del procedimiento de llegada, por el procedimiento de aproximación instrumental indicado, desde los puntos de notificación hasta el umbral"], "ans": 3, "why": "Literal del 4.4.10. El procedimiento CDA se basa en las STAR eliminando sus restricciones de velocidad y altitud, excepto las altitudes mínimas de seguridad.", "src": "Manual 4 (nov. 2026), capítulo 4.4.10, p. 42", "note": ""}, {"n": 229, "stem": "Según el manual, una transición RNAV está formada por:", "opts": ["1 tramo inicial, 1 tramo de alejamiento y 1 tramo de acercamiento", "2 tramos iniciales y 1 tramo final", "1 tramo inicial, 1 tramo intermedio y 1 tramo final", "1 tramo de alejamiento y 2 tramos de acercamiento"], "ans": 0, "why": "«Una transición RNAV es un procedimiento publicado, consistente en: 1 tramo inicial, 1 tramo de alejamiento y 1 tramo de acercamiento.»", "src": "Manual 4 (nov. 2026), capítulo 4.4.11, p. 42", "note": ""}, {"n": 230, "stem": "Una transición RNAV de la carta TRAN enlaza:", "opts": ["una SID con el primer punto de la estructura de rutas ATS, evitando los tramos de espera del TMA", "una STAR (desde un IAF o algún punto anterior) con un punto desde el que es posible realizar la aproximación final al ILS o equivalente", "dos aerovías de la Carta de navegación en ruta a través de un área de estructura compleja de rutas ATS", "el final de una aproximación frustrada con el punto de inicio de una nueva aproximación visual a la pista"], "ans": 1, "why": "Literal del 4.4.11; los procedimientos son RNAV1 con tramos en forma de trombón y, en la actualidad, solo existen en Barcelona/El Prat.", "src": "Manual 4 (nov. 2026), capítulo 4.4.11, p. 42", "note": ""}, {"n": 231, "stem": "La Carta de aproximación por instrumentos (IAC) facilita la información necesaria para efectuar los procedimientos de aproximación instrumental a la pista prevista, incluyendo:", "opts": ["solo los tramos de aproximación final", "las rutas de salida hasta la estructura de rutas ATS", "los de aproximación frustrada y los de espera", "las altitudes mínimas de guía vectorial"], "ans": 2, "why": "«Incluyendo los de aproximación frustrada y los de espera.» Se confecciona para todos los aeródromos con procedimientos de aproximación instrumental, una por procedimiento.", "src": "Manual 4 (nov. 2026), capítulo 4.4.13, p. 43", "note": ""}, {"n": 232, "stem": "¿Cuál NO es una de las funciones de la Carta Aeronáutica OACI 1:500.000 que cita el manual?", "opts": ["servir como carta aeronáutica básica", "ser utilizada para la planificación previa al vuelo", "suplementar cartas especializadas que no proporcionan información visual esencial", "verificar las altitudes asignadas por un controlador que usa un sistema de vigilancia"], "ans": 3, "why": "La D es la función de la Carta de altitud mínima de vigilancia ATC. La 1:500.000 también proporciona un medio adecuado para las instrucciones básicas de pilotaje y navegación.", "src": "Manual 4 (nov. 2026), capítulos 4.4.12 y 4.4.15, pp. 42-43", "note": ""}, {"n": 233, "stem": "Para evitar conflictos entre los vuelos comerciales y las operaciones visuales, la Carta de circulación VFR para TMA establece:", "opts": ["pasillos y/o sectores en los que se detallan las altitudes a las que pueden operar los vuelos visuales", "rutas RNAV1 con tramos en forma de trombón para secuenciar también los vuelos visuales", "zonas prohibidas a todos los vuelos visuales dentro del TMA durante las horas punta", "las altitudes mínimas de guía vectorial que el controlador puede asignar a los vuelos VFR"], "ans": 0, "why": "Es una carta para aeronaves que vuelan bajo reglas de vuelo visual dentro de un TMA; se publica por la alta densidad de tránsito en los TMA de Madrid, Barcelona, Palma de Mallorca, Valencia, Sevilla y Galicia.", "src": "Manual 4 (nov. 2026), capítulo 4.4.16, pp. 43-44", "note": ""}, {"n": 234, "stem": "La Carta de luces aeronáuticas de superficie - en ruta facilita información sobre:", "opts": ["las luces de aproximación, de umbral y de borde de pista de todos los aeródromos civiles y militares", "las luces aeronáuticas de superficie y otros faros que designen las posiciones geográficas seleccionadas por el Estado como significativas", "los obstáculos iluminados de más de 100 m de altura situados a lo largo de las rutas ATS", "los faros marítimos de la costa que sirven de referencia visual a los vuelos que cruzan el mar"], "ans": 1, "why": "Se identifican con el nombre de la ciudad, población u otra identificación propia.", "src": "Manual 4 (nov. 2026), capítulo 4.4.17, p. 44", "note": ""}, {"n": 235, "stem": "En la Carta de concentración de aves se representan:", "opts": ["las áreas a evitar en los vuelos de aeronaves particulares", "las colonias de buitres y cigüeñas de la península", "las zonas húmedas de invernada de aves acuáticas, además de otras especies", "los espacios naturales protegidos en los que se prohíbe volar"], "ans": 2, "why": "La A es la Carta de áreas prioritarias a evitar en vuelos particulares (que incluye también las áreas de riesgo para la navegación aérea). La de buitres y cigüeñas es otra carta de la lista española.", "src": "Manual 4 (nov. 2026), capítulos 4.4.18-4.4.19, p. 44", "note": ""}, {"n": 236, "stem": "En la Carta de áreas prioritarias a evitar en vuelos particulares se representan:", "opts": ["las zonas húmedas de invernada de aves acuáticas, además de otras especies", "los pasillos y sectores VFR del TMA con las altitudes de operación", "las zonas prohibidas, restringidas y peligrosas publicadas en el AIP", "las áreas a evitar en los vuelos de aeronaves particulares y las áreas de riesgo para la navegación aérea"], "ans": 3, "why": "Literal del 4.4.18; los datos los facilita el Ministerio de Agricultura y Pesca, Alimentación y Medio Ambiente, igual que los de la carta de aves.", "src": "Manual 4 (nov. 2026), capítulo 4.4.18, p. 44", "note": ""}, {"n": 237, "stem": "Según la especificación de la OACI que recoge el manual, ¿qué cartas aeronáuticas son candidatas para presentarse de forma electrónica?", "opts": ["todos los tipos de cartas aeronáuticas", "solo las cartas de navegación en ruta", "solo las cartas de aproximación por instrumentos", "solo las cartas que no se incluyen en el AIP"], "ans": 0, "why": "«Todos los tipos de cartas aeronáuticas son candidatas para ser presentadas de forma electrónica.» Suponen un grado avanzado de interactividad frente a las cartas en PDF.", "src": "Manual 4 (nov. 2026), capítulo 4.5, p. 44", "note": ""}, {"n": 238, "stem": "¿Cuál de estas características NO corresponde a las cartas electrónicas según el manual?", "opts": ["pueden presentar información suplementaria útil para la navegación segura", "la escala de presentación es fija e igual a la de la carta impresa", "determinan continuamente la posición de la aeronave de modo dinámico", "agregar o quitar información es una función simple, salvo la información básica"], "ans": 1, "why": "«Debe ser posible variar la escala en que se presenta la carta.» Las otras tres son características exigidas.", "src": "Manual 4 (nov. 2026), capítulo 4.5, p. 45", "note": ""}, {"n": 239, "stem": "Cuando una carta del AIP-España se presenta solo de forma electrónica:", "opts": ["se publica también una versión en papel en un Suplemento Regular al AIP", "se anuncia por NOTAM en cada ciclo AIRAC mientras siga solo en formato electrónico", "se indica claramente en la sección correspondiente del AIP, como en el «ENR 6.1 Cartas en Ruta», y se usa la aplicación Insignia", "se retira del AIP y se publica solo en la web de la OACI con un enlace desde el GEN 2.3"], "ans": 2, "why": "En el AIP-España algunas cartas se presentan de forma electrónica con la aplicación Insignia, y si solo existen así se indica en la sección del AIP (por ejemplo, ENR 6.1).", "src": "Manual 4 (nov. 2026), capítulo 4.5, p. 45", "note": ""}, {"n": 240, "stem": "Según el manual, las reimpresiones enmendadas de las cartas se publican:", "opts": ["obligatoriamente cada 28 días", "solo cuando hay un NOTAM en vigor", "solo con cada nueva edición del Anexo 4", "regularmente, cuando las fuentes de producción lo permiten"], "ans": 3, "why": "La revisión de la información de las cartas es continua y se publican «regularmente reimpresiones enmendadas cuando las fuentes de producción lo permiten»; los datos topográficos e hidrográficos se revisan cuando es necesario.", "src": "Manual 4 (nov. 2026), capítulo 4.6, pp. 45-46", "note": ""}, {"n": 241, "stem": "Según la bibliografía del manual, ¿qué ediciones se citan del Anexo 4 y del Doc 8697 de la OACI?", "opts": ["Anexo 4: 11.ª ed., 2009; Doc 8697: 3.ª ed., 2016", "Anexo 4: 3.ª ed., 2016; Doc 8697: 11.ª ed., 2009", "Anexo 4: 8.ª ed., 2000; Doc 8697: 3.ª ed., 2016", "Anexo 4: 11.ª ed., 2009; Doc 8697: 8.ª ed., 2000"], "ans": 0, "why": "Anexo 4, 11.ª ed., Montreal, 2009; Doc 8697-AN/889/2, 3.ª ed., Montreal, 2016. La 8.ª ed. de 2000 es la del Convenio (Doc 7300/8).", "src": "Manual 4 (nov. 2026), capítulo 5, pp. 47-48", "note": ""}, {"n": 242, "stem": "Entre los ejemplos de cartas de los anexos del manual, ¿cuál se clasifica en la parte ENR del AIP-España?", "opts": ["Plano de obstáculos de aeródromo - OACI - Tipo A", "Carta de concentración de aves", "Carta topográfica para aproximaciones de precisión", "Carta de salida normalizada (SID)"], "ans": 1, "why": "ENR: cobertura radar, luces aeronáuticas de superficie en ruta, áreas prioritarias a evitar, concentración de aves, circulación VFR para TMA y ATCSMAC. Los planos de aeródromo, AOC tipo A, PATC, SID, STAR, TRAN, IAC y VAC están en la parte AD.", "src": "Manual 4 (nov. 2026), capítulo 6, pp. 49-53", "note": ""}, {"n": 243, "stem": "¿Qué ejemplo de los anexos aparece tanto en la lista de la parte ENR como en la de la parte AD del AIP-España?", "opts": ["Carta de circulación VFR para TMA", "Plano de aeródromo / helipuerto", "Carta de altitud mínima de vigilancia ATC - OAC
