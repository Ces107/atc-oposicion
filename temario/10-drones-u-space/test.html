<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Drones (UAS) y U-space</title><style>
:root{color-scheme:light dark;

  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:nowrap}

header.top .hbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--mut);cursor:pointer;flex:none}
header.top .hbtn:hover,header.top .hbtn[aria-expanded=true]{color:var(--acc)}
@media (max-width:900px){header.top .hbtn{display:inline-flex}header.top:has(.hbtn){padding-top:2px;padding-bottom:2px;min-height:49px}}
@media (max-width:640px){
  header.top{gap:0;padding:2px .4rem 2px .6rem;min-height:49px}

  header.top.hb a.home .brand{display:none}
  header.top a.back{min-height:44px;flex:1 1 auto;padding-right:.3rem}
  header.top .cmdk-btn .lbl,header.top .cmdk-btn .kbd{display:none}
  header.top .cmdk-btn,header.top .nextbtn{width:44px;height:44px;justify-content:center;padding:0;gap:0;flex:none}
  header.top .nextbtn{font-size:0;margin:0}
  header.top .cmdk-btn svg.i,header.top .hbtn svg.i{width:20px;height:20px}
  header.top .nextbtn svg.i{width:18px;height:18px}
  header.top .hd-end{gap:0;min-width:88px;margin-left:0}
  header.top #acct-slot{min-width:44px;min-height:44px}
}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
@media (max-width:640px){.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:.5rem;white-space:nowrap;font-size:13px}.bar::-webkit-scrollbar{display:none}.bar>*{flex:0 0 auto}.bar button{padding:6px 9px}.bar #score{margin-right:.2rem}}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
nav.toc a.rd{color:var(--mut)}nav.toc a.rd::after{content:"\2713";color:var(--ok);margin-left:.4rem;font-size:.85em}
nav.toc a.active{color:var(--acc);font-weight:600}
@media (max-width:900px){
  #toc{display:none}
  body.toc-open #toc{display:block;position:fixed;align-self:auto;top:var(--hh,49px);right:0;bottom:0;width:min(22rem,86vw);max-height:none;overflow:auto;overscroll-behavior:contain;background:var(--bg);border:0;border-left:1px solid var(--line);padding:.4rem 1rem 2rem;margin:0;z-index:7}
  body.toc-open::after{content:"";position:fixed;left:0;right:0;bottom:0;top:var(--hh,49px);background:rgba(20,20,18,.42);z-index:6}
  #toc>b{padding:.6rem 0 .3rem}
  #toc a{display:block;padding:.8rem 0;line-height:1.35}
}
@media (max-width:900px),(pointer:coarse){table.src td.act a{min-height:44px;min-width:44px;padding:0 .35rem;margin-right:.3rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}

.docmain{flex:1 1 auto;min-width:0;max-width:780px}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}

.figs span{display:block;color:var(--mut);font:.8rem/1.3 var(--sans)}

</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Cuándo sitúa el manual 10 el origen de los UAS, en las primeras aeronaves no tripuladas empleadas con fines militares?", "opts": ["Durante la Segunda Guerra Mundial, a mediados del siglo XX", "Entre finales del siglo XIX y principios del siglo XX", "En la década de 1960, con los primeros blancos aéreos radiocontrolados", "A finales del siglo XX, con la llegada de la navegación por satélite"], "ans": 1, "why": "Capítulo 1.1: los UAS «tienen su origen en las primeras aeronaves no tripuladas empleadas con fines militares entre finales del siglo XIX y principios del siglo XX». Después, la electrónica, las telecomunicaciones y la navegación permitieron su paso a usos civiles y comerciales.", "src": "Manual 10 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 2, "stem": "Según el capítulo 1.1, ¿cuál de estos ámbitos NO figura entre los usos actuales de los UAS que cita el manual?", "opts": ["La agricultura de precisión", "La inspección de infraestructuras", "La gestión de emergencias", "El transporte regular de pasajeros"], "ans": 3, "why": "El manual cita la inspección de infraestructuras, la agricultura de precisión, la vigilancia, la gestión de emergencias y la logística. El transporte de pasajeros solo aparece en el capítulo 8.3 como «futuras operaciones» de la UAM.", "src": "Manual 10 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 3, "stem": "¿Qué consideración otorga la normativa europea a los UAS, según el capítulo 1.1?", "opts": ["Aeronaves, que deben integrarse en el sistema aeronáutico y compartir el espacio aéreo", "Productos de consumo, sujetos sobre todo a la normativa de seguridad de los juguetes", "Equipos radioeléctricos, sujetos sobre todo a la normativa del espectro radioeléctrico", "Artefactos de recreo, excluidos del sistema aeronáutico salvo en zonas geográficas UAS"], "ans": 0, "why": "«La normativa europea les otorga la consideración de aeronaves, por lo que sus operaciones deben integrarse de forma segura en el sistema aeronáutico y compartir el espacio aéreo con el resto de usuarios.» Juguetes y espectro son solo «otras disposiciones» (capítulo 2.3).", "src": "Manual 10 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 4, "stem": "Según el capítulo 1.2, ¿qué es el U-space?", "opts": ["Un volumen de espacio aéreo controlado reservado en exclusiva a las operaciones con UAS certificadas", "Una agencia de la Unión Europea encargada de certificar a los operadores y pilotos de UAS", "Un sistema de servicios y procedimientos para la gestión segura, eficiente y automatizada de un elevado número de operaciones con UAS", "Un sistema de vigilancia radar para detectar UAS no cooperativos en las proximidades de los aeropuertos"], "ans": 2, "why": "Definición literal: «El U-space es un sistema de servicios y procedimientos diseñado para permitir la gestión segura, eficiente y automatizada de un elevado número de operaciones con UAS».", "src": "Manual 10 (nov. 2026), capítulo 1.2, p. 4", "note": ""}, {"n": 5, "stem": "¿Quién ha desarrollado el concepto de U-space, según el manual 10?", "opts": ["La Organización de Aviación Civil Internacional (OACI)", "La Unión Europea", "EUROCONTROL, como gestor de la red", "ENAIRE, como proveedor único de información común"], "ans": 1, "why": "Capítulo 1.2: ante la necesidad de mecanismos de gestión del tráfico adaptados a los UAS, «la Unión Europea ha desarrollado el concepto de U-space».", "src": "Manual 10 (nov. 2026), capítulo 1.2, p. 4", "note": ""}, {"n": 6, "stem": "Según la introducción del capítulo 2, el Real Decreto 517/2024 regula determinados aspectos nacionales, las actividades excluidas de la normativa europea y el régimen de… ¿qué, mediante las zonas geográficas UAS y los espacios U-space?", "opts": ["Certificación de los USSP", "Sanciones a los pilotos a distancia", "Marcado de clase de los UAS", "Zonificación"], "ans": 3, "why": "«En España, este marco se complementa con el Real Decreto 517/2024, que regula determinados aspectos nacionales, las actividades excluidas de la normativa europea y el régimen de zonificación mediante las zonas geográficas UAS y los espacios U-space.»", "src": "Manual 10 (nov. 2026), capítulo 2, p. 5", "note": ""}, {"n": 7, "stem": "¿Qué planes cita el manual 10 como orientadores del despliegue progresivo del U-space en España?", "opts": ["PANDU y PANDU+", "El Plan de Vuelo 2025 y el Plan de Vuelo 2030", "El Plan Estratégico de Drones y el plan SORA", "El Plan Nacional de Zonificación y el Plan U-space Europeo"], "ans": 0, "why": "«Asimismo, los planes PANDU y PANDU+ orientan el despliegue progresivo del U-space en España.» El manual solo desarrolla PANDU+ (2026-2030, capítulo 6.1).", "src": "Manual 10 (nov. 2026), capítulo 2, p. 5", "note": ""}, {"n": 8, "stem": "Según el capítulo 2.1, ¿en qué se basa el marco normativo armonizado de la Unión Europea para los UAS?", "opts": ["En la masa máxima de despegue de la aeronave", "En el uso recreativo o profesional de la operación", "En el nivel de riesgo operacional", "En la clase de espacio aéreo en que se vuela"], "ans": 2, "why": "«La Unión Europea ha desarrollado un marco normativo armonizado para los UAS, basado en el nivel de riesgo operacional». El uso no es criterio: la definición del 2018/1139 se aplica «sin distinción por razón de su uso».", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 9, "stem": "El capítulo 2.1 dice que el marco europeo de los UAS lo constituyen principalmente tres reglamentos. ¿Cuál NO es uno de ellos?", "opts": ["Reglamento (UE) 2018/1139", "Reglamento de Ejecución (UE) 2021/664", "Reglamento Delegado (UE) 2019/945", "Reglamento de Ejecución (UE) 2019/947"], "ans": 1, "why": "Los tres son el 2018/1139, el Delegado 2019/945 y el de Ejecución 2019/947. El 2021/664 es el marco regulador del U-space (capítulo 5.2).", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 10, "stem": "¿De qué fecha es el Reglamento (UE) 2018/1139 del Parlamento Europeo y del Consejo?", "opts": ["De 4 de junio de 2018", "De 4 de julio de 2019", "De 25 de junio de 2018", "De 4 de julio de 2018"], "ans": 3, "why": "«Del Parlamento Europeo y del Consejo, de 4 de julio de 2018». No confundir con el RD 517/2024, de 4 de junio (en vigor el 25 de junio de 2024).", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 11, "stem": "Además de fijar normas comunes en el ámbito de la aviación civil, ¿qué crea el Reglamento (UE) 2018/1139?", "opts": ["Una Agencia de la Unión Europea para la Seguridad Aérea (EASA)", "La Agencia Estatal de Seguridad Aérea (AESA)", "El gestor de la red de gestión del tránsito aéreo europeo", "El espacio aéreo U-space y sus proveedores de servicios"], "ans": 0, "why": "El 2018/1139 es «sobre normas comunes en el ámbito de la aviación civil y por el que se crea una Agencia de la Unión Europea para la Seguridad Aérea (EASA)». AESA es la autoridad española.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 5", "note": ""}, {"n": 12, "stem": "Según el manual 10, el Reglamento (UE) 2018/1139 recoge que las aeronaves no tripuladas entran en el ámbito de EASA:", "opts": ["Solo cuando su masa máxima de despegue supera los 25 kg", "Solo cuando operan en las categorías específica o certificada", "Independientemente de su masa", "Solo cuando llevan un marcado de clase de C0 a C6"], "ans": 2, "why": "«Posteriormente recoge que las aeronaves no tripuladas entran a formar parte del ámbito de EASA independientemente de su masa.» La figura de la p. 6 lo repite: competencia sobre todas las aeronaves no tripuladas «independientemente de su masa operativa».", "src": "Manual 10 (nov. 2026), capítulo 2.1, pp. 5-6", "note": ""}, {"n": 13, "stem": "Según el recuadro del Reglamento (UE) 2018/1139 que reproduce el manual (p. 6), una «aeronave no tripulada» es cualquier aeronave que:", "opts": ["Tenga una masa máxima de despegue inferior a 150 kg y se pilote a distancia", "Opere o esté diseñada para operar de forma autónoma o para ser pilotada a distancia sin un piloto a bordo", "Se utilice con fines profesionales sin piloto a bordo, excluidos los aeromodelos", "Esté equipada con un enlace C2 y una estación de control remoto certificada"], "ans": 1, "why": "Figura de la p. 6, punto 1: «Cualquier aeronave que opere o esté diseñada para operar de forma autónoma o para ser pilotada a distancia sin un piloto a bordo», sin distinción por su uso y con los aeromodelos dentro.", "src": "Manual 10 (nov. 2026), capítulo 2.1, figura de la p. 6", "note": ""}, {"n": 14, "stem": "Según el recuadro de la p. 6 sobre el Reglamento (UE) 2018/1139, ¿qué ocurre con los aeromodelos?", "opts": ["Quedan fuera del concepto de aeronave no tripulada por su uso recreativo", "Solo son aeronaves no tripuladas si superan los 250 g", "Se rigen exclusivamente por la normativa de juguetes", "Quedan dentro del concepto de aeronave no tripulada"], "ans": 3, "why": "La figura dice: «Aeromodelos quedan dentro del concepto de aeronave no tripulada». Su régimen específico (artículo 16 del 2019/947) está en el capítulo 4.3.", "src": "Manual 10 (nov. 2026), capítulo 2.1, figura de la p. 6", "note": ""}, {"n": 15, "stem": "¿Qué dos excepciones recoge el recuadro de la p. 6 a la competencia de la Unión Europea sobre todas las aeronaves no tripuladas?", "opts": ["Las actividades NO EASA y las aeronaves del anexo I", "Los aeromodelos y los UAS de construcción privada", "Los UAS de clase C0 y los UAS sin marcado de clase", "Las operaciones VLOS en categoría abierta y las de los clubes de aeromodelismo"], "ans": 0, "why": "Figura de la p. 6, punto 2: la UE extiende su competencia sobre todas las aeronaves no tripuladas, «Excepto: \"Actividades o servicios NO EASA\"; Aeronaves no tripuladas incluidas en el anexo I».", "src": "Manual 10 (nov. 2026), capítulo 2.1, figura de la p. 6", "note": ""}, {"n": 16, "stem": "Según el recuadro de la p. 6, la definición de «aeronave no tripulada» del Reglamento (UE) 2018/1139 se aplica:", "opts": ["Solo a las aeronaves de uso profesional o comercial", "Solo a las aeronaves de uso civil no recreativo", "Sin distinción por razón de su uso", "Solo a las aeronaves de más de 250 g de masa operativa"], "ans": 2, "why": "La definición va seguida de «Sin distinción por razón de su uso» y de que los aeromodelos quedan dentro. La masa tampoco es criterio («independientemente de su masa operativa»).", "src": "Manual 10 (nov. 2026), capítulo 2.1, figura de la p. 6", "note": ""}, {"n": 17, "stem": "¿Qué tipo de reglamento es el 2019/945 y qué regula, según el manual 10?", "opts": ["De Ejecución; las normas y procedimientos para la utilización de los UAS", "Delegado; el diseño, la fabricación y la comercialización de los UAS y de los accesorios de identificación a distancia", "De Ejecución; el marco regulador de los espacios aéreos y de los servicios U-space", "Delegado; los requisitos de los proveedores de servicios de navegación aérea en espacio U-space"], "ans": 1, "why": "«Reglamento Delegado (UE) 2019/945: establece los requisitos aplicables al diseño, fabricación y comercialización de los sistemas de UAS y de los accesorios de identificación a distancia.» La utilización es el 2019/947, de Ejecución.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 18, "stem": "¿Qué sistema introduce el Reglamento Delegado (UE) 2019/945 para garantizar que los UAS comercializados en Europa cumplan unos requisitos técnicos mínimos de seguridad y prestaciones?", "opts": ["El sistema de categorías operacionales abierta, específica y certificada", "El sistema de escenarios estándar STS-01 y STS-02", "El sistema de zonas geográficas UAS", "El sistema de marcado de clase, de C0 a C6"], "ans": 3, "why": "«Para ello, introduce el sistema de marcado de clase, mediante el cual los drones se clasifican en las clases C0 a C6 en función de sus características técnicas y operacionales.» Las categorías son del 2019/947.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 19, "stem": "¿Qué reglamento establece las normas y procedimientos aplicables a la utilización de UAS y constituye la principal referencia normativa para las operaciones con drones en Europa?", "opts": ["El Reglamento de Ejecución (UE) 2019/947", "El Reglamento Delegado (UE) 2019/945", "El Reglamento (UE) 2018/1139", "El Reglamento de Ejecución (UE) 2021/664"], "ans": 0, "why": "El 2019/947 «establece las normas y procedimientos aplicables a la utilización de UAS y constituye la principal referencia normativa para las operaciones con drones en Europa». El 945 es el de producto (fabricantes).", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 20, "stem": "Según el texto del capítulo 2.1 (p. 6), además del marcado de clase, el Reglamento Delegado (UE) 2019/945 introduce las obligaciones de:", "opts": ["Los operadores de UAS y los pilotos a distancia de la Unión", "Los proveedores de servicios U-space certificados", "Fabricantes, importadores y distribuidores procedentes de terceros países", "Los clubes y asociaciones de aeromodelismo"], "ans": 2, "why": "Texto de la p. 6: «introduce las obligaciones de fabricantes, importadores y distribuidores procedentes de terceros países». (La figura de la p. 8 escribe «Operadores de terceros países»; por eso el enunciado cita el texto.)", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 21, "stem": "Según el Reglamento de Ejecución (UE) 2019/947, ¿qué categoría corresponde a las operaciones de riesgo medio?", "opts": ["Categoría abierta", "Categoría específica", "Categoría certificada", "Categoría NO EASA"], "ans": 1, "why": "Abierta = bajo riesgo; específica = riesgo medio; certificada = alto riesgo. «NO EASA» no es una categoría del 2019/947, sino actividades excluidas del 2018/1139.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 22, "stem": "En el enfoque basado en el riesgo del Reglamento de Ejecución (UE) 2019/947, la categoría certificada corresponde a operaciones de:", "opts": ["Riesgo bajo", "Riesgo medio", "Riesgo no evaluado", "Riesgo alto"], "ans": 3, "why": "«Categoría certificada, para operaciones de alto riesgo.» El capítulo 3.4.3 añade que está sujeta a requisitos similares a los de la aviación tripulada.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 23, "stem": "¿Cuál de estos aspectos NO lo atribuye el manual al Reglamento de Ejecución (UE) 2019/947, sino al Reglamento Delegado (UE) 2019/945?", "opts": ["El marcado de clase de los UAS", "El registro de operadores", "La formación de los pilotos a distancia", "Las condiciones aplicables a cada categoría operacional"], "ans": 0, "why": "El 2019/947 «regula aspectos como el registro de operadores, la formación de los pilotos a distancia y las condiciones aplicables a cada categoría operacional». El marcado de clase lo introduce el 2019/945.", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 6", "note": ""}, {"n": 24, "stem": "¿Qué reglamento europeo, que establece las reglas comunes del aire (SERA), puede resultar también de aplicación a las operaciones con UAS en determinadas circunstancias?", "opts": ["Reglamento de Ejecución (UE) 2017/373", "Reglamento (UE) 2018/1139", "Reglamento de Ejecución (UE) 923/2012", "Reglamento de Ejecución (UE) 2021/665"], "ans": 2, "why": "Entre las «otras disposiciones europeas de aplicación» destaca «el Reglamento de Ejecución (UE) 923/2012 (SERA), que establece las reglas comunes del aire aplicables en Europa y que, en determinadas circunstancias, también puede resultar de aplicación a las operaciones con UAS».", "src": "Manual 10 (nov. 2026), capítulo 2.1, p. 7", "note": ""}, {"n": 25, "stem": "¿De qué fecha es el Real Decreto 517/2024, que desarrolla el régimen jurídico para la utilización civil de los UAS en España?", "opts": ["De 25 de junio de 2024", "De 4 de junio de 2024", "De 4 de julio de 2024", "De 26 de enero de 2024"], "ans": 1, "why": "«Real Decreto 517/2024, de 4 de junio». El 25 de junio de 2024 es su entrada en vigor; el 4 de julio (de 2018) es la fecha del 2018/1139.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 26, "stem": "¿Cuándo entró en vigor el Real Decreto 517/2024, según el manual 10?", "opts": ["El 4 de junio de 2024", "El 1 de enero de 2025", "El 26 de enero de 2023", "El 25 de junio de 2024"], "ans": 3, "why": "«Entró en vigor el 25 de junio de 2024, adaptando la normativa española al nuevo marco regulador europeo de los UAS y del U-space.» El 4 de junio es la fecha del real decreto.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 27, "stem": "¿Cuál de estas NO figura entre las principales aportaciones del Real Decreto 517/2024 que enumera el manual?", "opts": ["La certificación de los proveedores de servicios U-space por ENAIRE", "La regulación de los clubes y asociaciones de aeromodelismo", "La regulación de las actividades y servicios NO EASA", "La designación de ENAIRE como proveedor único de servicios de información común (sCISP)"], "ans": 0, "why": "Las seis aportaciones: disposiciones nacionales de utilización civil, operaciones NO EASA, clubes y asociaciones de aeromodelismo, régimen de zonas geográficas UAS, marco nacional de espacios U-space y ENAIRE como sCISP. Los USSP los certifica «la autoridad competente» (capítulo 5.3.2), no ENAIRE.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 28, "stem": "Según el capítulo 2.2, el régimen de zonas geográficas UAS del Real Decreto 517/2024 permite al Estado, en determinados volúmenes de espacio aéreo:", "opts": ["Prohibir, restringir o someter a condiciones específicas las operaciones", "Autorizar, supervisar o sancionar las operaciones", "Limitar, restringir o facilitar operaciones", "Segregar, reservar o compartir el espacio aéreo con la aviación tripulada"], "ans": 2, "why": "El RD 517/2024 establece el régimen de zonas geográficas UAS, «que permite al Estado limitar, restringir o facilitar operaciones». La tríada «prohibidas, restringidas o sujetas a condiciones específicas» es la definición de zona del capítulo 4.1.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 29, "stem": "¿Cuál de estas razones NO cita el capítulo 2.2 para que el Estado limite, restrinja o facilite operaciones mediante zonas geográficas UAS?", "opts": ["La privacidad", "La economía", "La defensa", "El medio ambiente"], "ans": 1, "why": "Las razones son «seguridad, defensa, protección, privacidad o medio ambiente». Las razones económicas no aparecen.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 30, "stem": "¿Qué designación hace el Real Decreto 517/2024 respecto a ENAIRE en los espacios aéreos U-space bajo responsabilidad española?", "opts": ["Proveedor único de servicios U-space (USSP) para todos los operadores de UAS", "Autoridad competente para la supervisión del marco U-space", "Proveedor exclusivo de servicios de tránsito aéreo dentro del espacio U-space", "Proveedor único de servicios de información común (sCISP)"], "ans": 3, "why": "«La designación de ENAIRE como proveedor único de servicios de información común (sCISP) en los espacios aéreos U-space bajo responsabilidad española.» ENAIRE no es USSP único ni autoridad competente.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7", "note": ""}, {"n": 31, "stem": "Según el Real Decreto 517/2024, las operaciones «NO EASA» son las actividades y servicios excluidos del ámbito de aplicación de:", "opts": ["El Reglamento (UE) 2018/1139", "El Reglamento de Ejecución (UE) 2019/947", "El Reglamento de Ejecución (UE) 2021/664", "El Reglamento de Ejecución (UE) 923/2012 (SERA)"], "ans": 0, "why": "El RD regula «las actividades y servicios excluidos del ámbito de aplicación del Reglamento (UE) 2018/1139, comúnmente denominados operaciones NO EASA». Lo repite el capítulo 4.2.", "src": "Manual 10 (nov. 2026), capítulo 2.2, p. 7; capítulo 4.2, p. 17", "note": ""}, {"n": 32, "stem": "En el mapa normativo de la p. 8, ¿qué reglamento aparece como «Reglamento Base», del que cuelgan el 2019/947 y el 2019/945?", "opts": ["Reglamento de Ejecución (UE) 2021/664", "Reglamento de Ejecución (UE) 923/2012", "Reglamento (UE) 2018/1139", "Real Decreto 517/2024"], "ans": 2, "why": "La figura encabeza el esquema con «Reglamento Base (UE) 2018/1139», con dos flechas hacia el 2019/947 y el 2019/945. Debajo va la «Normativa Nacional UAS RD0517/24».", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 33, "stem": "En el mapa normativo de la p. 8, ¿qué reglamento lleva la anotación «Orientado a fabricantes»?", "opts": ["Reglamento de Ejecución (UE) 2019/947", "Reglamento Delegado (UE) 2019/945", "Reglamento (UE) 2018/1139", "Real Decreto 517/2024"], "ans": 1, "why": "«Reglamento Delegado (UE) 2019/945 (Orientado a fabricantes)»: diseño y fabricación UAS, marcado de clase, comercialización, operadores de terceros países. El 2019/947 lleva «(reglas y procedimientos para la utilización UAS)».", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 34, "stem": "En el mapa normativo de la p. 8, el bloque del Reglamento de Ejecución (UE) 2019/947 incluye, junto a las categorías operacionales, los operadores y pilotos y las condiciones de registro y formación:", "opts": ["El marcado de clase", "La comercialización", "Los operadores de terceros países", "El riesgo (SORA)"], "ans": 3, "why": "El bloque del 2019/947 lista: categorías operacionales (abierta, específica, certificada), operadores y pilotos, condiciones de registro y formación, «Riesgo (SORA)». Las otras tres opciones son del bloque del 2019/945.", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 35, "stem": "Según el mapa normativo de la p. 8, ¿qué contenidos asocia el manual a la normativa nacional (RD 517/24)?", "opts": ["Zonificación, operaciones EASA y NO EASA, clubes y asociaciones de aeromodelismo y ENAIRE como sCISP", "Diseño y fabricación de UAS, marcado de clase, comercialización y operadores de terceros países", "Categorías operacionales, operadores y pilotos, condiciones de registro y formación y riesgo (SORA)", "Protección de datos, espectro radioeléctrico, compatibilidad electromagnética y juguetes"], "ans": 0, "why": "El recuadro bajo «Normativa Nacional UAS RD0517/24» dice: «Zonificación, Operaciones EASA, NO EASA, clubes y asociaciones de aeromodelismo y ENAIRE como sCISP». B es el 2019/945, C el 2019/947 y D «Otras normativas».", "src": "Manual 10 (nov. 2026), capítulo 2, figura de la p. 8", "note": ""}, {"n": 36, "stem": "El capítulo 2.3 enumera otras disposiciones europeas y nacionales que afectan a las operaciones con UAS. ¿Cuál NO está en esa lista?", "opts": ["Compatibilidad electromagnética", "Juguetes", "Ciberseguridad", "Espectro radioeléctrico"], "ans": 2, "why": "La lista es: requisitos técnicos de diseño y fabricación de UAS, protección de datos y privacidad, espectro radioeléctrico, compatibilidad electromagnética, medio ambiente (ruido y emisiones) y juguetes.", "src": "Manual 10 (nov. 2026), capítulo 2.3, p. 8", "note": ""}, {"n": 37, "stem": "En la lista de «otras disposiciones de aplicación» del capítulo 2.3, el ámbito del medio ambiente se concreta en:", "opts": ["Fauna y espacios naturales protegidos", "Ruido y emisiones", "Residuos de baterías y reciclaje", "Contaminación lumínica y visual"], "ans": 1, "why": "El punto dice «Medio ambiente (ruido y emisiones)», igual en la lista del texto y en el recuadro «Otras normativas» de la figura.", "src": "Manual 10 (nov. 2026), capítulo 2.3, p. 8", "note": ""}, {"n": 38, "stem": "De acuerdo con el Reglamento (UE) 2018/1139, según el capítulo 3.1, un UAS está compuesto por:", "opts": ["Una aeronave no tripulada y un piloto a distancia titular de licencia", "Una aeronave no tripulada y un proveedor de servicios U-space", "Una aeronave no tripulada y un número de operador registrado", "Una aeronave no tripulada y el equipo necesario para permitir su operación segura"], "ans": 3, "why": "«De acuerdo con el Reglamento (UE) 2018/1139, un Sistema de Aeronaves No Tripuladas (UAS) está compuesto por una aeronave no tripulada (UA) y el equipo necesario para permitir su operación segura.»", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 39, "stem": "¿Cómo denomina el manual 10, con la sigla RCS, al equipo utilizado para controlar la aeronave y supervisar el vuelo?", "opts": ["Estación de control remoto", "Sistema de control de ruta", "Enlace de mando y control", "Sistema de comunicaciones del piloto"], "ans": 0, "why": "«Estación de control remoto (RCS): equipo utilizado para controlar la aeronave y supervisar el vuelo.» El enlace de mando y control es el C2.", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 40, "stem": "En el capítulo 3.1, el enlace de mando y control (C2) es:", "opts": ["El equipo utilizado para controlar la aeronave y supervisar el vuelo", "El servicio que transmite la identificación a distancia y la posición del UAS", "El sistema de comunicaciones que intercambia información entre aeronave y estación de control", "La persona que transmite información al piloto a distancia en las operaciones EVLOS"], "ans": 2, "why": "«Enlace de mando y control (C2): sistema de comunicaciones que permite el intercambio de información entre la aeronave y la estación de control.» A es la RCS; B, el servicio de identificación de red; D, el observador de espacio aéreo.", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 41, "stem": "¿Cuál de estos elementos NO figura entre los que, con carácter general, comprende un UAS según el capítulo 3.1?", "opts": ["El piloto a distancia", "El proveedor de servicios U-space (USSP)", "Los equipos asociados", "El enlace de mando y control (C2)"], "ans": 1, "why": "Los cinco elementos son: aeronave no tripulada (UA), piloto a distancia, estación de control remoto (RCS), enlace C2 y equipos asociados. El USSP es un actor del ecosistema U-space.", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 42, "stem": "Según el capítulo 3.1, ¿cuál de estos es uno de los ejemplos de «equipos asociados» de un UAS que da el manual?", "opts": ["La estación de control remoto", "El enlace de mando y control", "El servicio de geoconsciencia", "La carga útil"], "ans": 3, "why": "«Equipos asociados: sistemas y dispositivos necesarios para la operación, como equipos de navegación, posicionamiento, identificación a distancia o carga útil.» RCS y C2 son elementos distintos de la lista.", "src": "Manual 10 (nov. 2026), capítulo 3.1, p. 9", "note": ""}, {"n": 43, "stem": "Según el capítulo 3.2, para operar un UAS hay que cumplir los requisitos de la normativa en materia de registro, formación, edad mínima, seguro y:", "opts": ["Condiciones operacionales", "Reconocimiento médico aeronáutico", "Certificado de aeronavegabilidad", "Licencia de radiofonista"], "ans": 0, "why": "«Para operar un UAS es necesario cumplir los requisitos establecidos por la normativa aplicable en materia de registro, formación, edad mínima, seguro y condiciones operacionales.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 10", "note": ""}, {"n": 44, "stem": "Según el manual 10, el operador de UAS es:", "opts": ["La persona física responsable de conducir el UAS o supervisar su trayectoria", "La persona jurídica certificada para prestar servicios U-space", "La persona física o jurídica que utiliza o tiene intención de utilizar uno o varios UAS", "La persona física que actúa como observador de espacio aéreo"], "ans": 2, "why": "«Operador de UAS: persona física o jurídica que utiliza o tiene intención de utilizar uno o varios UAS.» A es el piloto a distancia, que solo puede ser persona física.", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 10", "note": ""}, {"n": 45, "stem": "Según el capítulo 3.2, el piloto a distancia es:", "opts": ["La persona física o jurídica que utiliza o tiene intención de utilizar uno o varios UAS", "La persona física responsable de conducir el UAS o supervisar su trayectoria durante el vuelo", "La persona jurídica responsable del registro del UAS ante AESA", "La persona física que transmite información al operador desde la estación de control"], "ans": 1, "why": "«Piloto a distancia: es la persona física responsable de conducir el UAS o supervisar su trayectoria durante el vuelo.» La persona «física o jurídica» es el operador.", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 10", "note": ""}, {"n": 46, "stem": "Según el recuadro «Registro como Operador» de la p. 10, el operador debe registrarse:", "opts": ["En ENAIRE Drones, y el número de operador debe llevarse en la documentación de vuelo", "En la sede electrónica de ENAIRE, y el número debe comunicarse al USSP antes de cada vuelo", "En el registro de matrícula de aeronaves, y el número debe figurar en la estación de control", "En la sede electrónica de AESA, y el número de operador debe figurar visible en el dron"], "ans": 3, "why": "«Registrarse en la sede electrónica de AESA y obtener número de operador, que debe figurar visible en el dron.» ENAIRE Drones publica las zonas geográficas UAS.", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 47, "stem": "Según el recuadro «Formación como Piloto» de la p. 10, el examen accesible en la web de AESA corresponde a las subcategorías:", "opts": ["A1 y A3", "A1 y A2", "A2 y A3", "A1, A2 y A3"], "ans": 0, "why": "«Formación mínima acreditable según la categoría operacional. Examen accesible en la web de AESA para subcategorías A1 y A3.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 48, "stem": "Según el recuadro «Seguro Obligatorio» de la p. 10, la póliza de responsabilidad civil frente a terceros tiene una excepción para los UAS con MTOM inferior a:", "opts": ["250 g", "4 kg", "20 kg", "25 kg"], "ans": 2, "why": "«Póliza de responsabilidad civil frente a terceros por daños durante cada vuelo. Excepción para UAS con MTOM inferior a 20 kg.» No confundir con los 25 kg (límite de la abierta en la figura de la p. 16; peso máximo de C3 y C4).", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 49, "stem": "Según el texto del capítulo 3.2 (p. 11), el seguro de responsabilidad civil es obligatorio para las operaciones de:", "opts": ["Todas las categorías, sin excepción, incluidas las de aeromodelismo", "Las categorías específica y certificada y las actividades o servicios NO EASA", "La categoría certificada únicamente", "Las categorías abierta y específica, salvo las operaciones NO EASA"], "ans": 1, "why": "Texto de la p. 11: «El seguro de responsabilidad civil es obligatorio para las operaciones realizadas en las categorías específica y certificada, así como para las actividades o servicios NO EASA.» (La figura de la p. 10 usa otro criterio, la masa; por eso el enunciado cita el texto.)", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 50, "stem": "Según el texto del capítulo 3.2 (p. 11), ¿qué operaciones pueden quedar exentas de la obligación de seguro en los términos de la normativa aplicable?", "opts": ["Las operaciones NO EASA de organismos públicos", "Las operaciones en escenarios estándar STS-01 y STS-02", "Las operaciones de clubes de aeromodelismo autorizados por AESA", "Determinadas operaciones de bajo riesgo en categoría abierta"], "ans": 3, "why": "«Determinadas operaciones de bajo riesgo en categoría abierta pueden quedar exentas de esta obligación en los términos previstos por la normativa aplicable.» Las NO EASA y la específica (donde están los STS) tienen seguro obligatorio.", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 51, "stem": "Con carácter general, ¿cuál es la edad mínima para actuar como piloto a distancia en España según el manual 10?", "opts": ["16 años", "14 años", "18 años", "12 años"], "ans": 0, "why": "«Con carácter general, la edad mínima para actuar como piloto a distancia en España es de 16 años, sin perjuicio de las excepciones previstas por la normativa para determinadas operaciones de bajo riesgo.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 52, "stem": "Según el recuadro «Edad Mínima» de la p. 10, ¿de qué depende que la edad mínima pueda reducirse en categoría abierta?", "opts": ["De la experiencia acreditada del piloto", "De la autorización expresa de AESA", "De la clase de UAS utilizada", "De la presencia de un observador de espacio aéreo"], "ans": 2, "why": "«16 años para pilotos a distancia. En categoría abierta puede reducirse dependiendo de la clase de UAS utilizada.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 53, "stem": "Según el capítulo 3.2, el número de operador que se obtiene al registrarse es válido:", "opts": ["Solo en el Estado miembro de registro", "En toda la Unión Europea", "En los Estados de EASA y en todos los de la OACI", "Solo para la categoría operacional en que se obtuvo"], "ans": 1, "why": "«Los operadores de UAS deben registrarse cuando así lo exija la normativa, obteniendo un número de operador válido en toda la Unión Europea.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 54, "stem": "Según el recuadro «Reglas de Vuelo y Lugar» de la p. 10, ¿qué debe consultarse antes de cada operación?", "opts": ["El parte meteorológico del aeródromo más próximo", "La lista de USSP certificados por AESA", "Los NOTAM de la FIR correspondiente", "Las zonas geográficas UAS"], "ans": 3, "why": "«Sujeto a reglas generales según peso, personas y edificios cercanos. Consultar zonas geográficas UAS antes de cada operación.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, figura de la p. 10", "note": ""}, {"n": 55, "stem": "Según el apartado «Responsabilidades» del capítulo 3.2, ¿quién debe garantizar que la operación respete las limitaciones operacionales, las zonas geográficas UAS y las condiciones de seguridad?", "opts": ["El operador y el piloto a distancia", "Solo el operador de UAS", "Solo el piloto a distancia", "El USSP que presta servicio a la operación"], "ans": 0, "why": "«El operador y el piloto a distancia deben garantizar que la operación se realiza de conformidad con la normativa aplicable, respetando las limitaciones operacionales, las zonas geográficas UAS y las condiciones de seguridad establecidas para cada tipo de vuelo.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 56, "stem": "Según el capítulo 3.2, la formación, competencias y acreditaciones que deben tener los pilotos a distancia dependen de:", "opts": ["La masa del UAS que utilicen y la edad que tenga el piloto", "El número de horas de vuelo que hayan acumulado como pilotos", "La categoría operacional y el tipo de operación que pretendan realizar", "La clase del espacio aéreo y la hora del día en que vuelen"], "ans": 2, "why": "«Los pilotos a distancia deben disponer de la formación, competencias y acreditaciones exigidas para la categoría operacional y el tipo de operación que pretendan realizar.»", "src": "Manual 10 (nov. 2026), capítulo 3.2, p. 11", "note": ""}, {"n": 57, "stem": "¿Qué modalidad de vuelo es aquella en la que el piloto a distancia mantiene contacto visual directo y continuo con la aeronave durante todo el vuelo?", "opts": ["EVLOS", "VLOS", "BVLOS", "FPV"], "ans": 1, "why": "«Las operaciones VLOS son aquellas en las que el piloto a distancia mantiene contacto visual directo y continuo con la aeronave durante todo el vuelo.» EVLOS añade observadores; en BVLOS no hay observación visual continua.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 58, "stem": "Según la tabla de modalidades de vuelo (p. 12), ¿qué modalidad constituye el tipo de operación más habitual y la base de la mayoría de las operaciones en categoría abierta?", "opts": ["BVLOS", "EVLOS", "Vuelo automático programado", "VLOS"], "ans": 3, "why": "De las VLOS: «Constituyen el tipo de operación más habitual y la base de la mayoría de las operaciones realizadas en categoría abierta.» Las BVLOS suelen ir a la categoría específica.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 59, "stem": "Según el capítulo 3.3, las operaciones EVLOS amplían el alcance de una operación VLOS mediante:", "opts": ["Uno o varios observadores de espacio aéreo", "Un enlace C2 por satélite", "El servicio de identificación de red", "Gafas de vuelo en primera persona"], "ans": 0, "why": "«Las operaciones EVLOS permiten ampliar el alcance de una operación VLOS mediante uno o varios observadores de espacio aéreo.»", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 60, "stem": "¿En qué modalidad de vuelo hay observadores que mantienen contacto visual con la aeronave y transmiten información al piloto a distancia, permitiendo operar a mayores distancias sin perder la conciencia situacional?", "opts": ["VLOS", "BVLOS", "EVLOS", "En todas las operaciones de categoría abierta"], "ans": 2, "why": "Es la descripción de las EVLOS (Extended Visual Line of Sight). En BVLOS no hay observación visual continua ni del piloto ni de observadores.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 61, "stem": "Según el manual 10, en una operación BVLOS:", "opts": ["Los observadores de espacio aéreo mantienen el contacto visual en lugar del piloto", "No hay observación visual continua del UAS ni por el piloto a distancia ni por observadores de espacio aéreo", "El piloto a distancia mantiene contacto visual directo, aunque de forma intermitente", "El UAS vuela siempre por encima de 120 m sobre la superficie"], "ans": 1, "why": "BVLOS: «realizadas más allá del alcance visual del piloto a distancia, sin observación visual continua del UAS por parte del piloto a distancia ni de observadores de espacio aéreo». A describe EVLOS.", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 62, "stem": "Según la tabla de la p. 12, ¿en qué categoría suelen desarrollarse las operaciones BVLOS?", "opts": ["Abierta, subcategoría A3", "Abierta, subcategoría A2", "Certificada", "Específica"], "ans": 3, "why": "«Debido a su mayor complejidad y riesgo operacional, suelen desarrollarse en categoría específica». El capítulo 3.4.2 repite que la específica incluye «numerosas operaciones BVLOS».", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 63, "stem": "Según la p. 12, por su mayor complejidad y riesgo, las operaciones BVLOS requieren medidas adicionales de mitigación del riesgo, procedimientos específicos de seguridad y:", "opts": ["Sistemas de comunicaciones fiables", "Un piloto con licencia de piloto comercial", "Un USSP designado por el Estado", "Un certificado de aeronavegabilidad del UAS"], "ans": 0, "why": "Las BVLOS «requieren medidas adicionales de mitigación del riesgo, sistemas de comunicaciones fiables y procedimientos específicos de seguridad».", "src": "Manual 10 (nov. 2026), capítulo 3.3, p. 12", "note": ""}, {"n": 64, "stem": "Según el capítulo 3.4.1, la categoría abierta está destinada a operaciones de bajo riesgo que:", "opts": ["Requieren una declaración operacional ante AESA", "Requieren un certificado LUC del operador", "No requieren autorización operacional previa de la autoridad competente", "Requieren autorización previa del proveedor de servicios U-space"], "ans": 2, "why": "«La categoría abierta está destinada a operaciones de bajo riesgo que no requieren autorización operacional previa de la autoridad competente.» La declaración y el LUC son mecanismos de la específica.", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 65, "stem": "¿Cuál es la altura máxima de vuelo en categoría abierta que destaca el manual 10?", "opts": ["120 ft sobre el terreno", "120 m sobre la superficie", "150 m sobre el obstáculo más alto", "400 m sobre el nivel del mar"], "ans": 1, "why": "Entre las limitaciones de la abierta «destacan una altura máxima de 120 m sobre la superficie y, con carácter general, el mantenimiento del vuelo dentro del alcance visual del piloto a distancia (VLOS)».", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 66, "stem": "¿Cuál de estas operaciones NO está prohibida por sí misma en la categoría abierta, según el capítulo 3.4.1?", "opts": ["El sobrevuelo de concentraciones de personas", "El transporte de mercancías peligrosas", "El lanzamiento de materiales que puedan poner en riesgo a terceros", "El vuelo sobre personas no participantes en la subcategoría A1"], "ans": 3, "why": "«No se permiten las operaciones sobre concentraciones de personas, el transporte de mercancías peligrosas ni el lanzamiento de materiales que puedan poner en riesgo a terceros.» La A1 sí permite operar sobre personas no participantes (nunca sobre concentraciones).", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 67, "stem": "¿Qué subcategoría de la categoría abierta permite operar sobre personas no participantes, evitando en todo caso el sobrevuelo de concentraciones de personas?", "opts": ["A1", "A2", "A3", "STS-01"], "ans": 0, "why": "A1 «Vuelo sobre personas»: «Permite operar sobre personas no participantes evitando en todo caso el sobrevuelo de concentraciones de personas.» STS-01 es un escenario de la específica.", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 68, "stem": "La subcategoría A2 de la categoría abierta corresponde a:", "opts": ["Vuelo sobre personas", "Vuelo alejado de personas", "Vuelo cerca de personas", "Vuelo sobre concentraciones de personas"], "ans": 2, "why": "A1 = sobre personas; A2 = cerca de personas («manteniendo las distancias de seguridad establecidas por la normativa»); A3 = alejado de personas. El vuelo sobre concentraciones está prohibido en la abierta.", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 69, "stem": "Según el capítulo 3.4.1, la subcategoría A3 se destina a operaciones realizadas lejos de personas y de zonas:", "opts": ["Agrícolas, forestales, costeras o portuarias", "Residenciales, comerciales, industriales o recreativas", "Aeroportuarias, militares, sanitarias o penitenciarias", "Urbanas, periurbanas o regionales"], "ans": 1, "why": "A3: «Destinada a operaciones realizadas lejos de personas y de zonas residenciales, comerciales, industriales o recreativas». «Urbanos, periurbanos y regionales» son los entornos de la IAM (capítulo 8.2).", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 70, "stem": "¿Qué subcategoría de la categoría abierta se denomina «vuelo alejado de personas»?", "opts": ["A1", "A2", "STS-02", "A3"], "ans": 3, "why": "A3 = «Vuelo alejado de personas». A1 es «sobre» y A2 «cerca de» personas; STS-02 es un escenario estándar de la categoría específica.", "src": "Manual 10 (nov. 2026), capítulo 3.4.1, p. 13", "note": ""}, {"n": 71, "stem": "Según el capítulo 3.4.2, la categoría específica comprende las operaciones cuyo riesgo:", "opts": ["Excede las limitaciones de la categoría abierta, pero no requiere los niveles de certificación de la certificada", "Es inferior al de la categoría abierta, aunque exige registro del operador y del UAS", "Es equivalente al de la aviación tripulada y exige licencia del piloto a distancia", "No puede mitigarse mediante ninguno de los mecanismos previstos por la normativa"], "ans": 0, "why": "«La categoría específica comprende aquellas operaciones cuyo riesgo excede las limitaciones de la categoría abierta, pero que no requieren los niveles de certificación propios de la categoría certificada.» C y D describen la certificada.", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, p. 13", "note": ""}, {"n": 72, "stem": "En la categoría específica, ¿qué mecanismo se usa cuando la operación se ajusta a uno de los escenarios estándar (STS) y no requiere autorización operacional?", "opts": ["La autorización operacional", "El certificado LUC", "La declaración operacional", "La evaluación SORA"], "ans": 2, "why": "«Declaración operacional: cuando la operación se ajusta a uno de los escenarios estándar (STS) definidos en la normativa europea. No requiere autorización operacional.»", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, p. 14", "note": ""}, {"n": 73, "stem": "Según el capítulo 3.4.2, la autorización operacional de la categoría específica:", "opts": ["La emite el USSP tras comprobar las zonas geográficas UAS afectadas", "La emite la autoridad competente, normalmente basada en una evaluación del riesgo operacional", "La emite el propio operador cuando la operación se ajusta a un escenario estándar", "La emite ENAIRE como sCISP antes de cada vuelo en espacio U-space"], "ans": 1, "why": "«Autorización operacional: emitida por la autoridad competente, normalmente basada en una evaluación del riesgo operacional.» C confunde con la declaración operacional.", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, p. 14", "note": ""}, {"n": 74, "stem": "¿Qué significa la sigla LUC en la categoría específica?", "opts": ["Licence for UAS Certified operations", "Limited U-space Clearance", "Light Unmanned Clearance", "Light UAS Operator Certificate"], "ans": 3, "why": "«Certificado LUC (Light UAS Operator Certificate): permite a determinados operadores ejercer privilegios previamente expedido por la autoridad competente» (frase mal construida en el manual).", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, p. 14", "note": ""}, {"n": 75, "stem": "¿Cuál de estos NO es uno de los mecanismos que el capítulo 3.4.2 prevé para demostrar que los riesgos de una operación en categoría específica están mitigados?", "opts": ["La certificación del UAS y la licencia del piloto a distancia", "La declaración operacional ante la autoridad competente", "La autorización operacional emitida por la autoridad competente", "El certificado LUC (Light UAS Operator Certificate)"], "ans": 0, "why": "Los tres mecanismos de la específica son declaración operacional, autorización operacional y certificado LUC. Certificación del UAS, del operador y licencia del piloto son requisitos de la categoría certificada.", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, pp. 13-14; capítulo 3.4.3, p. 14", "note": ""}, {"n": 76, "stem": "Según el capítulo 3.4.2, ¿qué operaciones engloba en gran parte la categoría específica?", "opts": ["Las operaciones recreativas de UAS de menos de 250 g", "El transporte de personas y de mercancías peligrosas", "Las operaciones profesionales avanzadas, incluidas numerosas operaciones BVLOS", "Las operaciones de aeromodelismo de los clubes legalmente constituidos"], "ans": 2, "why": "«Esta categoría engloba gran parte de las operaciones profesionales avanzadas, incluidas numerosas operaciones BVLOS y determinados vuelos desarrollados en entornos urbanos o de mayor complejidad operacional.» B corresponde a la certificada.", "src": "Manual 10 (nov. 2026), capítulo 3.4.2, p. 14", "note": ""}, {"n": 77, "stem": "¿Qué requiere, con carácter general, la categoría certificada según el capítulo 3.4.3?", "opts": ["Declaración operacional, registro del operador y examen A1/A3", "Certificación del UAS, certificación del operador y licencia del piloto a distancia", "Autorización operacional de AESA y certificado LUC del operador", "Marcado de clase C5 o C6 y ajuste a un escenario estándar"], "ans": 1, "why": "«Con carácter general, requiere: certificación del UAS, certificación del operador, licencia del piloto a distancia.»", "src": "Manual 10 (nov. 2026), capítulo 3.4.3, p. 14", "note": ""}, {"n": 78, "stem": "¿Cuál de estos supuestos NO cita el capítulo 3.4.3 como aplicable a la categoría certificada?", "opts": ["El transporte de personas", "El transporte de mercancías peligrosas", "Las operaciones cuyo riesgo, según la autoridad, no puede mitigarse con los requisitos de la específica", "Las operaciones BVLOS en entornos rurales"], "ans": 3, "why": "La certificada se aplica, entre otros supuestos, «al transporte de personas, al transporte de mercancías peligrosas o a aquellas operaciones para las que la autoridad determine que el riesgo no puede mitigarse adecuadamente mediante los requisitos de la categoría específica». Las BVLOS suelen ser de la específica.", "src": "Manual 10 (nov. 2026), capítulo 3.4.3, p. 14", "note": ""}, {"n": 79, "stem": "Según el capítulo 3.4.3, la categoría certificada está sujeta a requisitos similares a los exigidos en:", "opts": ["La aviación tripulada", "La subcategoría A3 de la categoría abierta", "Los escenarios estándar de la categoría específica", "Las operaciones NO EASA"], "ans": 0, "why": "«La categoría certificada se reserva para operaciones de alto riesgo, sujetas a requisitos similares a los exigidos en la aviación tripulada.»", "src": "Manual 10 (nov. 2026), capítulo 3.4.3, p. 14", "note": ""}, {"n": 80, "stem": "Según el capítulo 3.5, el sistema de marcado de clase del Reglamento Delegado (UE) 2019/945 se establece para los UAS destinados principalmente a operar en:", "opts": ["La categoría certificada", "Los espacios aéreos U-space", "La categoría abierta", "Las operaciones NO EASA"], "ans": 2, "why": "«El Reglamento delegado (UE) 2019/945 establece un sistema de marcado de clase para los UAS destinados principalmente a operar en la categoría abierta.»", "src": "Manual 10 (nov. 2026), capítulo 3.5, p. 14", "note": ""}, {"n": 81, "stem": "Según el capítulo 3.5, el marcado de clase identifica las características técnicas de la aeronave y permite determinar las condiciones operacionales aplicables conforme a:", "opts": ["El Reglamento (UE) 2018/1139", "El Reglamento de Ejecución (UE) 2019/947", "El Real Decreto 517/2024", "El Reglamento de Ejecución (UE) 2021/664"], "ans": 1, "why": "El marcado (del 2019/945) «permite determinar las condiciones operacionales aplicables conforme al Reglamento de Ejecución (UE) 2019/947». Así se enlazan el reglamento de producto y el de utilización.", "src": "Manual 10 (nov. 2026), capítulo 3.5, p. 14", "note": ""}, {"n": 82, "stem": "Según la tabla de clases del manual 10, ¿qué peso máximo tiene la clase C0?", "opts": ["900 g", "500 g", "4 kg", "250 g"], "ans": 3, "why": "Tabla de la p. 15: C0 250 g; C1 900 g; C2 4 kg; C3 25 kg; C4 25 kg; C5 y C6 sin peso indicado.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 83, "stem": "¿A qué clase corresponde un peso máximo de 900 g en la tabla de clases del manual 10?", "opts": ["C1", "C0", "C2", "C3"], "ans": 0, "why": "C1 = 900 g (subcategoría A1, con requisitos técnicos adicionales). C0 = 250 g; C2 = 4 kg; C3 = 25 kg.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 84, "stem": "¿Qué peso máximo indica la tabla de clases del manual 10 para la clase C2?", "opts": ["900 g", "25 kg", "4 kg", "2 kg"], "ans": 2, "why": "C2 = 4 kg, UAS aptos para la subcategoría A2.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 85, "stem": "Según la tabla de clases, ¿qué clase corresponde a UAS aptos para operaciones en la subcategoría A2, permitiendo vuelos cerca de personas bajo determinadas condiciones?", "opts": ["C1", "C2", "C3", "C4"], "ans": 1, "why": "C2: «UAS aptos para operaciones en la subcategoría A2, permitiendo vuelos cerca de personas bajo determinadas condiciones». C0 y C1 van a A1; C3 y C4, a A3.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 86, "stem": "Las clases C0 y C1 se asocian ambas a la subcategoría A1. ¿Qué distingue a la C1 en la columna «Destinada a» de la tabla de clases?", "opts": ["Que es apta para vuelos cerca de personas en la subcategoría A2", "Que corresponde a UAS de muy bajo riesgo operacional", "Que se diseña para el escenario estándar STS-01", "Que está sujeta a requisitos técnicos adicionales"], "ans": 3, "why": "C1: «UAS destinados a operaciones en la subcategoría A1, sujetos a requisitos técnicos adicionales». «Muy bajo riesgo operacional» describe la C0; A2 es la C2; STS-01 es la C5.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 87, "stem": "En la tabla de clases, ¿qué clase se describe como destinada a «UAS de muy bajo riesgo operacional, generalmente asociados a operaciones en la subcategoría A1»?", "opts": ["C0", "C1", "C2", "C4"], "ans": 0, "why": "Es la C0 (250 g). La C1 también va a A1, pero con «requisitos técnicos adicionales».", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 88, "stem": "¿Qué clase se destina a UAS de características similares a los aeromodelos tradicionales, para operaciones en la subcategoría A3?", "opts": ["C3", "C5", "C4", "C6"], "ans": 2, "why": "C4: «UAS de características similares a los aeromodelos tradicionales, destinados a operaciones en la subcategoría A3», peso máximo 25 kg. La C3 también va a A3, pero sin esa descripción.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 89, "stem": "Según la tabla de clases, ¿qué dos clases tienen un peso máximo de 25 kg?", "opts": ["C2 y C3", "C3 y C4", "C4 y C5", "C5 y C6"], "ans": 1, "why": "C3 y C4: 25 kg. C2 = 4 kg; C5 y C6 tienen la casilla de peso en blanco.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 90, "stem": "Según la tabla de clases, ¿para qué operaciones se diseñan los UAS de clase C5?", "opts": ["Para operaciones en la subcategoría A3", "Para el escenario estándar STS-02 de la categoría específica", "Para operaciones en la categoría certificada", "Para el escenario estándar STS-01 de la categoría específica"], "ans": 3, "why": "C5: «UAS diseñados para operaciones en el escenario estándar STS-01 de la categoría específica». STS-02 es la C6.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 91, "stem": "¿Qué clase de UAS se diseña para operaciones en el escenario estándar STS-02 de la categoría específica?", "opts": ["C6", "C5", "C4", "C3"], "ans": 0, "why": "C6 → STS-02; C5 → STS-01. Las dos son las únicas clases de la tabla ligadas a la categoría específica.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 92, "stem": "Según el capítulo 3.5, entre los UAS sin marcado de clase se encuentran:", "opts": ["Los UAS de clase C0 y los aeromodelos de los clubes y asociaciones legalmente constituidos", "Los UAS de las operaciones NO EASA y los utilizados en la categoría certificada para transporte", "Algunos introducidos en el mercado antes del sistema europeo de clases y los de construcción privada", "Los UAS de más de 25 kg de MTOM y todos los que operan más allá del alcance visual (BVLOS)"], "ans": 2, "why": "«La normativa contempla los UAS sin marcado de clase, entre los que se encuentran determinadas aeronaves introducidas en el mercado antes de la aplicación del sistema europeo de clases y los UAS de construcción privada.»", "src": "Manual 10 (nov. 2026), capítulo 3.5, p. 15", "note": ""}, {"n": 93, "stem": "En la tabla de clases de la p. 15, ¿para qué clases deja el manual en blanco la casilla «Peso máximo»?", "opts": ["C3 y C4", "C5 y C6", "C0 y C1", "C4 y C6"], "ans": 1, "why": "La segunda tabla da 25 kg para la C4 y deja vacías las casillas de C5 y C6, que se definen solo por su escenario estándar (STS-01 y STS-02).", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 94, "stem": "Según la tabla de clases, ¿qué clases se destinan a operaciones en la subcategoría A3?", "opts": ["C2 y C3", "C1 y C2", "C4 y C5", "C3 y C4"], "ans": 3, "why": "C3: «destinados principalmente a operaciones en la subcategoría A3»; C4: aeromodelos tradicionales «destinados a operaciones en la subcategoría A3». C5 es para STS-01.", "src": "Manual 10 (nov. 2026), capítulo 3.5, tabla de la p. 15", "note": ""}, {"n": 95, "stem": "Según la figura «Riesgo» de la p. 16, ¿qué límite de masa (MTOM) figura para la categoría abierta?", "opts": ["MTOM &lt; 25 kg", "MTOM &lt; 20 kg", "MTOM &lt; 4 kg", "MTOM &lt; 150 kg"], "ans": 0, "why": "Bajo «Categoría abierta» la figura lista: bajo riesgo, por debajo de 120 m, VLOS, «MTOM &lt; 25 Kg», prohibido sobrevolar concentraciones y prohibido el transporte o arrojo de materiales o mercancías peligrosas. Los 20 kg son la excepción del seguro (figura de la p. 10).", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 96, "stem": "En la figura «Riesgo» de la p. 16, ¿en qué categoría aparecen los «vuelos por encima de 120 m»?", "opts": ["Abierta", "Certificada", "Específica", "En ninguna; la figura los da como prohibidos"], "ans": 2, "why": "La columna de la categoría específica lista: riesgo medio, «vuelos por encima de 120 m», BVLOS, MTOM &gt; 25 kg, vuelos sobre concentraciones de personas y arrojo de materiales. La abierta va «por debajo de 120 m».", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 97, "stem": "Según la figura «Riesgo» de la p. 16, la categoría certificada incluye los UAS utilizados sobre concentraciones de personas que tienen una dimensión característica de:", "opts": ["1 m o más", "3 m o más", "2 m o más", "5 m o más"], "ans": 1, "why": "Columna «Categoría certificada»: operaciones de alto riesgo; «con una dimensión característica de 3 m o más, utilizados sobre concentraciones de personas»; diseñados y utilizados para el transporte de personas o de mercancías peligrosas.", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 98, "stem": "¿Qué indicación añade la figura «Riesgo» de la p. 16 bajo la categoría certificada?", "opts": ["«Requieren declaración operacional»", "«Prohibida en España»", "«Solo para organismos públicos»", "«Categoría en desarrollo»"], "ans": 3, "why": "Bajo la columna certificada la figura muestra un icono con el texto «Categoría en desarrollo».", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 99, "stem": "Según la figura «Riesgo» de la p. 16, las operaciones de la categoría abierta:", "opts": ["No requieren autorización de AESA ni declaración operacional", "Requieren declaración operacional, pero no autorización de AESA", "Requieren autorización de AESA o un certificado LUC", "Requieren registro previo del UAS en ENAIRE Drones"], "ans": 0, "why": "Bajo la abierta: «No requieren autorización de AESA ni declaración operacional». La específica, en cambio, «requieren autorización de AESA o declaración operacional (Escenario Estándar) o el operador posea un certificado LUC».", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 100, "stem": "En la figura «Riesgo» de la p. 16, ¿qué marcados de clase aparecen bajo la categoría específica?", "opts": ["0, 1, 2, 3 y 4", "3 y 4", "5 y 6", "Ninguno; la específica no usa marcado de clase"], "ans": 2, "why": "La figura pone los iconos de clase 0 a 4 bajo la abierta y los de clase 5 y 6 bajo la específica, en coherencia con la tabla (C5 → STS-01, C6 → STS-02).", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 101, "stem": "En la figura «Riesgo» de la p. 16, el «arrojo de materiales» aparece como característica de:", "opts": ["La categoría abierta", "La categoría específica", "La categoría certificada", "Las operaciones NO EASA"], "ans": 1, "why": "La columna específica incluye «Arrojo de materiales»; en la abierta está prohibido («Prohibido transporte y/o arrojo de materiales o mercancías peligrosas»), como dice también el capítulo 3.4.1.", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 102, "stem": "Según la figura «Riesgo» de la p. 16, ¿cuál de estas características se atribuye a la categoría específica?", "opts": ["Por debajo de 120 m", "MTOM &lt; 25 kg", "VLOS", "BVLOS"], "ans": 3, "why": "«BVLOS» figura en la columna específica. «Por debajo de 120 m», «MTOM &lt; 25 kg» y «VLOS» son de la columna abierta.", "src": "Manual 10 (nov. 2026), capítulo 3, figura «Riesgo» de la p. 16", "note": ""}, {"n": 103, "stem": "Según el capítulo 4, ¿qué instrumentos regulatorios destacan en la integración de los UAS en el espacio aéreo?", "opts": ["Las categorías operacionales, las modalidades de vuelo y las zonas geográficas UAS", "El marcado de clase, el registro de operadores y el seguro obligatorio", "Los servicios U-space, el CIS y la reconfiguración dinámica del espacio aéreo", "PANDU, PANDU+ y el Plan de Acción de Zonificación"], "ans": 0, "why": "«La integración de los UAS en el espacio aéreo se articula mediante diferentes instrumentos regulatorios, entre los que destacan las categorías operacionales, las modalidades de vuelo y las zonas geográficas UAS».", "src": "Manual 10 (nov. 2026), capítulo 4, p. 16", "note": ""}, {"n": 104, "stem": "Según el capítulo 4.1, ¿quién establece las zonas geográficas UAS?", "opts": ["EASA", "Los proveedores de servicios U-space", "Los Estados miembros", "Los proveedores de servicios de navegación aérea"], "ans": 2, "why": "«Las zonas geográficas UAS son volúmenes de espacio aéreo establecidos por los Estados miembros».", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 16", "note": ""}, {"n": 105, "stem": "Según la definición del capítulo 4.1, en las zonas geográficas UAS las operaciones con UAS pueden estar:", "opts": ["Limitadas, restringidas o facilitadas", "Prohibidas, restringidas o sujetas a condiciones específicas", "Segregadas, controladas o no controladas", "Autorizadas, declaradas o certificadas"], "ans": 1, "why": "«…en los que las operaciones con UAS pueden estar: a) prohibidas, b) restringidas o c) sujetas a condiciones específicas.» «Limitar, restringir o facilitar» es lo que el RD 517/2024 permite al Estado (capítulo 2.2).", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 16", "note": ""}, {"n": 106, "stem": "¿Cuál de estas finalidades NO cita el capítulo 4.1 para las zonas geográficas UAS?", "opts": ["La protección de infraestructuras críticas", "La defensa nacional", "La privacidad", "La economía nacional"], "ans": 3, "why": "«Su finalidad es proteger la seguridad operacional, la defensa nacional, la seguridad pública, la protección de infraestructuras críticas, la privacidad o la protección del medio ambiente.»", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 17", "note": ""}, {"n": 107, "stem": "¿Cuál de estas medidas NO figura entre las que, según el capítulo 4.1, pueden aplicarse en una zona geográfica UAS?", "opts": ["La suspensión del número de operador en toda la Unión Europea", "Las prohibiciones de vuelo", "Los requisitos adicionales para la realización de operaciones", "Las condiciones específicas de equipamiento o coordinación o autorización previa"], "ans": 0, "why": "Las medidas son: prohibiciones de vuelo; restricciones operacionales; requisitos adicionales para la realización de operaciones; condiciones específicas de equipamiento o coordinación o autorización previa.", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 17", "note": ""}, {"n": 108, "stem": "Entre las zonas geográficas UAS que los Estados miembros pueden establecer para necesidades operacionales específicas o situaciones concretas, el capítulo 4.1 NO cita:", "opts": ["Zonas asociadas a incendios forestales u otras situaciones de emergencia", "Zonas temporales vinculadas a eventos con gran concentración de personas", "Zonas reservadas en exclusiva a los clubes de aeromodelismo", "Zonas establecidas para facilitar determinadas operaciones UAS"], "ans": 2, "why": "Cita zonas de gestión de emergencias y protección civil, zonas asociadas a incendios forestales u otras emergencias, zonas temporales por eventos con gran concentración de personas y zonas para facilitar operaciones UAS que requieran una gestión específica del espacio aéreo.", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 17", "note": ""}, {"n": 109, "stem": "¿A través de qué plataforma se publica en España la información sobre las zonas geográficas UAS, sus restricciones y condiciones de utilización?", "opts": ["El AIP España, sección ENR 5.1", "ENAIRE Drones", "La sede electrónica de AESA", "El portal del proveedor único de servicios U-space"], "ans": 1, "why": "«En España, la información sobre las zonas geográficas UAS … se publica a través de la plataforma ENAIRE Drones, que permite a operadores y pilotos a distancia conocer las limitaciones aplicables antes de realizar una operación.» La sede de AESA es donde se registra el operador.", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 17", "note": ""}, {"n": 110, "stem": "Según el capítulo 4.1, el establecimiento de las zonas geográficas UAS está previsto en la normativa europea sobre UAS, y su desarrollo en España se complementa mediante:", "opts": ["PANDU+", "La Ley 48/1960, sobre Navegación Aérea", "El Reglamento de Ejecución (UE) 2021/664", "El Real Decreto 517/2024"], "ans": 3, "why": "«Su establecimiento está previsto en la normativa europea sobre UAS y su desarrollo en España se complementa mediante el Real Decreto 517/2024.» PANDU+ no es una norma jurídica.", "src": "Manual 10 (nov. 2026), capítulo 4.1, p. 16", "note": ""}, {"n": 111, "stem": "¿Cuál de estas actividades NO figura entre las operaciones NO EASA que enumera el capítulo 4.2?", "opts": ["La fotografía comercial privada", "La búsqueda y salvamento", "La vigilancia costera", "El control fronterizo"], "ans": 0, "why": "Incluyen aduanas, policía, búsqueda y salvamento, lucha contra incendios, control fronterizo, vigilancia costera y otras actividades de interés general bajo el control y responsabilidad de una autoridad pública. Un trabajo privado para un particular no lo es.", "src": "Manual 10 (nov. 2026), capítulo 4.2, p. 17", "note": ""}, {"n": 112, "stem": "Según el capítulo 4.2, las actividades o servicios NO EASA se realizan en interés general bajo el control y la responsabilidad de:", "opts": ["EASA", "Un proveedor de servicios U-space", "Una autoridad pública", "El Ministerio de Defensa, en exclusiva"], "ans": 2, "why": "«…y otras actividades o servicios realizados en interés general bajo el control y responsabilidad de una autoridad pública.»", "src": "Manual 10 (nov. 2026), capítulo 4.2, p. 17", "note": ""}, {"n": 113, "stem": "Según la figura de la p. 18, una actividad NO EASA es «directa» cuando:", "opts": ["La realiza otra organización en nombre de un organismo público", "La realiza directamente un organismo público", "Se realiza en VLOS, sin observadores de espacio aéreo", "Se realiza sin necesidad de autorización de AESA"], "ans": 1, "why": "«Directa: cuando son realizadas directamente por un organismo público.» «Indirecta: cuando son realizadas por otra organización en nombre de un organismo público.»", "src": "Manual 10 (nov. 2026), capítulo 4.2, figura de la p. 18", "note": ""}, {"n": 114, "stem": "¿Cómo se denomina, según la figura de la p. 18, la actividad NO EASA realizada por otra organización en nombre de un organismo público?", "opts": ["Delegada", "Directa", "Concertada", "Indirecta"], "ans": 3, "why": "«Indirecta: cuando son realizadas por otra organización en nombre de un organismo público.» La directa la realiza el propio organismo público.", "src": "Manual 10 (nov. 2026), capítulo 4.2, figura de la p. 18", "note": ""}, {"n": 115, "stem": "Según el capítulo 4.2, las operaciones NO EASA tienen exención de identificación a distancia cuando actúan contra:", "opts": ["El crimen organizado, el terrorismo o amenazas graves para la seguridad pública", "Los incendios forestales, las inundaciones o los terremotos de gran magnitud", "La inmigración irregular, el contrabando o el tráfico ilícito de mercancías", "Cualquier emergencia declarada por las autoridades de protección civil"], "ans": 0, "why": "«Estas operaciones tienen la exención de identificación a distancia cuando actú
