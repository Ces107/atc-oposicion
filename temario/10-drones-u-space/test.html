an en operaciones contra el crimen organizado, terrorismo o amenazas graves para la seguridad pública.»", "src": "Manual 10 (nov. 2026), capítulo 4.2, p. 18", "note": ""}, {"n": 116, "stem": "El régimen específico de las operaciones de los clubes y asociaciones de aeromodelismo se establece, según el capítulo 4.3, de conformidad con:", "opts": ["El artículo 16 del Reglamento Delegado (UE) 2019/945", "El artículo 6 del Reglamento (UE) 2018/1139", "El artículo 16 del Reglamento de Ejecución (UE) 2019/947", "El artículo 16 del Real Decreto 517/2024"], "ans": 2, "why": "«De conformidad con el artículo 16 del Reglamento de Ejecución (UE) 2019/947», que se cita de nuevo en la tercera opción de práctica del aeromodelismo.", "src": "Manual 10 (nov. 2026), capítulo 4.3, p. 18", "note": ""}, {"n": 117, "stem": "Según el capítulo 4.3, ¿a quién pueden solicitar los clubes y asociaciones de aeromodelismo legalmente constituidos una autorización operacional?", "opts": ["A ENAIRE", "A AESA", "A EASA", "A la federación aeronáutica nacional"], "ans": 1, "why": "«Los clubes y asociaciones de aeromodelismo legalmente constituidos pueden solicitar a AESA una autorización operacional para desarrollar sus actividades bajo las condiciones establecidas por la autoridad competente.»", "src": "Manual 10 (nov. 2026), capítulo 4.3, p. 18", "note": ""}, {"n": 118, "stem": "¿Cuál de estas opciones NO figura entre las que el capítulo 4.3 da para la práctica del aeromodelismo en España?", "opts": ["Operar conforme a los requisitos de la categoría abierta", "Operar dentro de zonas geográficas UAS, con sus condiciones y limitaciones", "Operar al amparo de una autorización operacional de AESA conforme al artículo 16 del 2019/947", "Operar en la categoría certificada con una licencia de piloto de aeromodelo"], "ans": 3, "why": "Las tres opciones son: categoría abierta; dentro de zonas geográficas UAS; autorización operacional de AESA conforme al artículo 16 del 2019/947.", "src": "Manual 10 (nov. 2026), capítulo 4.3, p. 18", "note": ""}, {"n": 119, "stem": "Según el capítulo 4.3, de conformidad con el Reglamento de Ejecución (UE) 2021/664, los Estados miembros pueden designar determinadas zonas geográficas UAS como espacios aéreos U-space cuando sea necesario:", "opts": ["Facilitar operaciones UAS de mayor complejidad o gestionar un elevado volumen de tráfico de UAS", "Proteger infraestructuras críticas frente a UAS no cooperativos", "Reservar el espacio aéreo a las operaciones NO EASA de organismos públicos", "Prohibir de forma permanente la aviación tripulada en entornos urbanos"], "ans": 0, "why": "«Determinadas zonas geográficas UAS pueden ser designadas por los Estados miembros como espacios aéreos U-space cuando resulte necesario facilitar operaciones UAS de mayor complejidad o gestionar un elevado volumen de tráfico de UAS.»", "src": "Manual 10 (nov. 2026), capítulo 4.3, p. 18", "note": ""}, {"n": 120, "stem": "Según el manual 10, el despliegue progresivo de los espacios aéreos U-space constituye uno de los objetivos de:", "opts": ["El Reglamento Delegado (UE) 2019/945", "La estrategia europea de movilidad urbana sostenible", "La estrategia nacional de zonificación y U-space", "El Plan de Vuelo 2030 de ENAIRE"], "ans": 2, "why": "«El despliegue progresivo de estos espacios aéreos constituye uno de los objetivos de la estrategia nacional de zonificación y U-space y representa una evolución en la integración de los UAS en el espacio aéreo.»", "src": "Manual 10 (nov. 2026), capítulo 4.3, p. 19", "note": ""}, {"n": 121, "stem": "¿Cuál de estos NO figura entre los principales objetivos del U-space que enumera el capítulo 5.1?", "opts": ["Permitir la gestión de un elevado volumen de operaciones simultáneas", "Prestar servicio de control de tránsito aéreo a la aviación tripulada en espacio no controlado", "Favorecer la digitalización y automatización de los procesos de gestión del tráfico UAS", "Garantizar la coordinación entre los distintos actores implicados"], "ans": 1, "why": "Los seis objetivos: facilitar la integración segura de los UAS; incrementar la seguridad operacional; gestionar un elevado volumen de operaciones simultáneas; favorecer la digitalización y automatización; facilitar operaciones más complejas, incluidas BVLOS; garantizar la coordinación entre actores.", "src": "Manual 10 (nov. 2026), capítulo 5.1, p. 19", "note": ""}, {"n": 122, "stem": "Entre los objetivos del U-space, el capítulo 5.1 cita facilitar operaciones de mayor complejidad operacional, incluidas las realizadas:", "opts": ["Sobre concentraciones de personas con UAS de clase C0", "En la categoría certificada con transporte de pasajeros", "Dentro de zonas geográficas UAS prohibidas", "Más allá del alcance visual del piloto a distancia (BVLOS)"], "ans": 3, "why": "«Facilitar operaciones de mayor complejidad operacional, incluidas aquellas realizadas más allá del alcance visual del piloto a distancia (BVLOS).»", "src": "Manual 10 (nov. 2026), capítulo 5.1, p. 19", "note": ""}, {"n": 123, "stem": "Según el capítulo 5.1, el objetivo del U-space es facilitar la realización de operaciones con UAS de forma segura, eficiente y:", "opts": ["Escalable, mediante un entorno de gestión altamente digitalizado y automatizado", "Gratuita, mediante servicios públicos prestados directamente por el Estado", "Segregada, mediante volúmenes de espacio aéreo cerrados a la aviación tripulada", "Sostenible, mediante la propulsión eléctrica obligatoria de todos los UAS"], "ans": 0, "why": "«El objetivo del U-space es facilitar la realización de operaciones con UAS de forma segura, eficiente y escalable mediante un entorno de gestión altamente digitalizado y automatizado.»", "src": "Manual 10 (nov. 2026), capítulo 5.1, p. 19", "note": ""}, {"n": 124, "stem": "Según el capítulo 5.1, el desarrollo del U-space responde a la necesidad de integrar los UAS en el espacio aéreo especialmente en entornos caracterizados por:", "opts": ["Una baja densidad de tráfico en espacio aéreo no controlado", "La presencia exclusiva de aviación militar", "Una elevada densidad de tráfico o una mayor complejidad operacional", "La proximidad a las fronteras exteriores de la Unión"], "ans": 2, "why": "«…especialmente en entornos caracterizados por una elevada densidad de tráfico o por una mayor complejidad operacional.»", "src": "Manual 10 (nov. 2026), capítulo 5.1, p. 19", "note": ""}, {"n": 125, "stem": "¿Dónde se encuentra la base jurídica del marco regulador del U-space, según el capítulo 5.2?", "opts": ["En el Reglamento de Ejecución (UE) 2019/947", "En el Reglamento (UE) 2018/1139", "En el Reglamento de Ejecución (UE) 923/2012", "En el Real Decreto 517/2024"], "ans": 1, "why": "«La base jurídica de este marco regulador se encuentra en el Reglamento (UE) 2018/1139, sobre el que se desarrolla el denominado paquete regulatorio U-space».", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20", "note": ""}, {"n": 126, "stem": "Dentro del paquete regulatorio U-space, ¿qué reglamento es «el marco regulador para el U-space»?", "opts": ["Reglamento de Ejecución (UE) 2021/665", "Reglamento de Ejecución (UE) 2021/666", "Reglamento Delegado (UE) 2019/945", "Reglamento de Ejecución (UE) 2021/664"], "ans": 3, "why": "«Reglamento de Ejecución (UE) 2021/664: es el marco regulador para el U-space.» El 665 modifica el 2017/373 y el 666 modifica el 923/2012 (SERA).", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20", "note": ""}, {"n": 127, "stem": "¿Qué reglamento modifica el Reglamento de Ejecución (UE) 2021/665?", "opts": ["El Reglamento de Ejecución (UE) 2017/373", "El Reglamento de Ejecución (UE) 923/2012 (SERA)", "El Reglamento de Ejecución (UE) 2019/947", "El Reglamento (UE) 2018/1139"], "ans": 0, "why": "El 2021/665 «modifica al Reglamento de ejecución (UE) 2017/373 incorporando requisitos aplicables a los proveedores de servicios de navegación aérea (ANSP)». El 923/2012 lo modifica el 2021/666.", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20; capítulo 5.4, p. 25", "note": ""}, {"n": 128, "stem": "¿Qué reglamento del paquete U-space modifica el Reglamento de Ejecución (UE) 923/2012 (SERA)?", "opts": ["El Reglamento de Ejecución (UE) 2021/664", "El Reglamento de Ejecución (UE) 2021/665", "El Reglamento de Ejecución (UE) 2021/666", "El Reglamento de Ejecución (UE) 2019/947"], "ans": 2, "why": "El 2021/666 «modifica al Reglamento de ejecución (UE) 923/2012 (SERA) estableciendo requisitos aplicables a la aviación tripulada». El 2021/665 modifica el 2017/373.", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20; capítulo 5.5, p. 27", "note": ""}, {"n": 129, "stem": "Según el capítulo 5.2, el Reglamento de Ejecución (UE) 2021/665 incorpora requisitos para los ANSP en relación con los volúmenes U-space situados en:", "opts": ["Espacio aéreo no controlado", "Espacio aéreo controlado", "Zonas geográficas UAS prohibidas", "Aeródromos no controlados"], "ans": 1, "why": "665: requisitos para los ANSP «en relación con los volúmenes U-space situados en espacio aéreo controlado». 666: aviación tripulada en espacios U-space «situados en espacio aéreo no controlado».", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20", "note": ""}, {"n": 130, "stem": "Según el capítulo 5.2, el Reglamento de Ejecución (UE) 2021/666 establece requisitos para garantizar la visibilidad electrónica de la aviación tripulada en los espacios aéreos U-space situados en:", "opts": ["Espacio aéreo controlado", "Zonas de tránsito de aeródromo (ATZ)", "Espacio aéreo de clase A", "Espacio aéreo no controlado"], "ans": 3, "why": "El 666 establece «requisitos aplicables a la aviación tripulada para garantizar su visibilidad electrónica en los espacios aéreos U-space situados en espacio aéreo no controlado». El espacio controlado es el del 665.", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20", "note": ""}, {"n": 131, "stem": "Según el capítulo 5.2, ¿a quién se aplican los requisitos que introduce el Reglamento de Ejecución (UE) 2021/666?", "opts": ["A la aviación tripulada", "A los proveedores de servicios U-space", "A los fabricantes de UAS", "A los proveedores de servicios de navegación aérea"], "ans": 0, "why": "El 666 establece «requisitos aplicables a la aviación tripulada para garantizar su visibilidad electrónica». Los requisitos para los ANSP son del 665.", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 20", "note": ""}, {"n": 132, "stem": "Según el capítulo 5.2, en España el marco europeo del U-space se complementa con el Real Decreto 517/2024, que desarrolla aspectos como la utilización de UAS, las zonas geográficas UAS, la designación de espacios aéreos U-space y:", "opts": ["La certificación de los fabricantes de UAS", "Las tasas de los servicios U-space", "El Servicio de Información Común", "La licencia de los pilotos de la categoría certificada"], "ans": 2, "why": "El RD 517/2024 «desarrolla determinados aspectos nacionales relacionados con la utilización de UAS, las zonas geográficas UAS, la designación de espacios aéreos U-space y el Servicio de Información Común».", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 21", "note": ""}, {"n": 133, "stem": "Según el manual 10, la estrategia PANDU+:", "opts": ["Es un real decreto que desarrolla el Reglamento de Ejecución (UE) 2021/664", "Es un instrumento de planificación y coordinación, no una norma de obligado cumplimiento", "Es una norma de obligado cumplimiento aprobada por AESA para todos los operadores", "Es un reglamento europeo que designa los espacios aéreos U-space de España"], "ans": 1, "why": "«El despliegue nacional del U-space se apoya en la estrategia PANDU+, que actúa como instrumento de planificación y coordinación y no constituye una norma jurídica de obligado cumplimiento.»", "src": "Manual 10 (nov. 2026), capítulo 5.2, p. 21", "note": ""}, {"n": 134, "stem": "Según el capítulo 5.3, además de aplicarse principalmente a los espacios aéreos, los servicios y los actores U-space, el Reglamento de Ejecución (UE) 2021/664 establece:", "opts": ["Las clases C0 a C6 de los UAS", "Los requisitos de formación de los pilotos de categoría abierta", "La lista de actividades NO EASA", "Determinados requisitos de coordinación con la aviación tripulada"], "ans": 3, "why": "«Asimismo, establece determinados requisitos de coordinación con la aviación tripulada para garantizar la interoperabilidad y la seguridad operacional.» Las clases son del 2019/945 y las NO EASA, del RD 517/2024.", "src": "Manual 10 (nov. 2026), capítulo 5.3, p. 21", "note": ""}, {"n": 135, "stem": "Según el capítulo 5.3.1, un espacio aéreo U-space es:", "opts": ["Una zona geográfica UAS designada por un Estado miembro en la que las operaciones con UAS solo pueden realizarse con el apoyo de servicios U-space", "Un volumen de espacio aéreo controlado en el que el ANSP presta servicio de control de tránsito aéreo a todos los UAS", "Cualquier zona geográfica UAS publicada en la plataforma ENAIRE Drones, con independencia de sus condiciones", "Un espacio aéreo segregado, designado por EASA, en el que está prohibida la entrada de la aviación tripulada"], "ans": 0, "why": "«Un espacio aéreo U-space es una zona geográfica UAS designada por un Estado miembro en la que las operaciones con UAS solo pueden realizarse con el apoyo de servicios U-space.»", "src": "Manual 10 (nov. 2026), capítulo 5.3.1, p. 21", "note": ""}, {"n": 136, "stem": "¿Qué relación establece el capítulo 5.3.1 entre los espacios aéreos U-space y las zonas geográficas UAS?", "opts": ["Toda zona geográfica UAS es espacio U-space, pero no todo espacio U-space es zona geográfica UAS", "Son conceptos equivalentes que se designan siempre a la vez", "Todo espacio aéreo U-space es una zona geográfica UAS, pero no todas las zonas geográficas UAS son espacio U-space", "Son conceptos excluyentes: un espacio U-space no puede ser zona geográfica UAS"], "ans": 2, "why": "«Por tanto, todo espacio aéreo U-space constituye una zona geográfica UAS, si bien no todas las zonas geográficas UAS tienen la consideración de espacio aéreo U-space.» A invierte la relación.", "src": "Manual 10 (nov. 2026), capítulo 5.3.1, p. 21", "note": ""}, {"n": 137, "stem": "Según el capítulo 5.3.2, los servicios U-space son servicios digitales prestados:", "opts": ["Por el CISP a los proveedores de servicios de tránsito aéreo", "Por USSP certificados por la autoridad competente a los operadores UAS", "Por los ANSP a los pilotos de la aviación tripulada", "Por AESA directamente a los pilotos a distancia registrados"], "ans": 1, "why": "«Estos servicios U-space son prestados por proveedores de servicios U-space (USSP) certificados por la autoridad competente a los operadores UAS que pretendan operar o estén operando en un espacio aéreo U-space.» El CISP presta el CIS a los USSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, p. 21", "note": ""}, {"n": 138, "stem": "El Reglamento de Ejecución (UE) 2021/664 establece cuatro servicios obligatorios para el funcionamiento de un espacio aéreo U-space. ¿Cuál NO es uno de ellos?", "opts": ["Servicio de autorización de vuelo", "Servicio de identificación de red", "Servicio de geoconsciencia", "Servicio de información meteorológica"], "ans": 3, "why": "Los cuatro obligatorios: autorización de vuelo, información de tráfico, identificación de red y geoconsciencia. La información meteorológica es un servicio adicional (opcional).", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, p. 22", "note": ""}, {"n": 139, "stem": "¿Cuál de estos servicios es uno de los servicios U-space obligatorios según el manual 10?", "opts": ["Servicio de información de tráfico", "Seguimiento de la conformidad (conformance monitoring)", "Información meteorológica", "Servicio de Información Común (CIS)"], "ans": 0, "why": "El de información de tráfico es uno de los cuatro obligatorios. El seguimiento de la conformidad y la meteorología son adicionales; el CIS no es un servicio U-space a los operadores, sino la información común que el CISP pone a disposición de los USSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, p. 22; capítulo 5.3.3, p. 23", "note": ""}, {"n": 140, "stem": "¿Cuántos servicios obligatorios establece el Reglamento de Ejecución (UE) 2021/664 para el funcionamiento de un espacio aéreo U-space, según el manual 10?", "opts": ["Dos", "Tres", "Cuatro", "Seis"], "ans": 2, "why": "«El Reglamento de Ejecución (UE) 2021/664 establece cuatro servicios obligatorios necesarios para el funcionamiento de un espacio aéreo U-space». Seis es el número de actores del ecosistema.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, p. 22", "note": ""}, {"n": 141, "stem": "Según los recuadros de la p. 22, ¿qué servicio U-space «permite gestionar las autorizaciones necesarias para realizar operaciones en dicho espacio aéreo U-space»?", "opts": ["Servicio de geoconsciencia", "Servicio de autorización de vuelo", "Servicio de identificación de red", "Servicio de información de tráfico"], "ans": 1, "why": "Es la descripción del recuadro «Servicio de autorización de vuelo».", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, figura de la p. 22", "note": ""}, {"n": 142, "stem": "Según los recuadros de la p. 22, el servicio de información de tráfico:", "opts": ["Permite obtener la identificación a distancia y la posición de los UAS", "Proporciona las condiciones operacionales, limitaciones y restricciones del espacio U-space", "Permite gestionar las autorizaciones necesarias para operar en el espacio U-space", "Suministra información sobre el tráfico aéreo que pueda afectar a la operación del UAS en su entorno operacional"], "ans": 3, "why": "Recuadro: «Suministra información sobre el tráfico aéreo que pueda afectar a la operación del UAS en su entorno operacional». A es identificación de red; B, geoconsciencia; C, autorización de vuelo.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, figura de la p. 22", "note": ""}, {"n": 143, "stem": "¿Qué servicio U-space obligatorio permite obtener y poner a disposición la información de identificación a distancia y la posición de los UAS que operan en el espacio aéreo U-space?", "opts": ["Servicio de identificación de red", "Servicio de información de tráfico", "Servicio de geoconsciencia", "Servicio de Información Común"], "ans": 0, "why": "Recuadro «Servicio de identificación de red»: «Permite obtener y poner a disposición la información de identificación a distancia y la posición de los UAS que operan en dicho espacio aéreo U-space».", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, figura de la p. 22", "note": ""}, {"n": 144, "stem": "Según el recuadro del servicio de geoconsciencia (geo-awareness) de la p. 22, este servicio:", "opts": ["Permite obtener y poner a disposición la identificación a distancia y la posición de los UAS", "Suministra información sobre el tráfico aéreo que pueda afectar a la operación del UAS", "Proporciona información sobre las condiciones operacionales, limitaciones y restricciones del espacio U-space", "Permite gestionar las autorizaciones necesarias para operar en dicho espacio aéreo U-space"], "ans": 2, "why": "Recuadro: «Proporciona información sobre las condiciones operacionales, limitaciones y restricciones aplicables al espacio aéreo U-space». (La nota al pie de la misma página da otra definición; el enunciado cita el recuadro.)", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, figura de la p. 22", "note": ""}, {"n": 145, "stem": "Según la nota al pie de la p. 22, la geoconsciencia es la capacidad del UAS de:", "opts": ["Transmitir su posición a la aviación tripulada que vuela en sus proximidades", "Detectar su intrusión en un espacio aéreo restringido y avisar al piloto", "Mantener por sí mismo la separación mínima con otros UAS del entorno", "Volver al punto de despegue si se pierde el enlace de mando y control"], "ans": 1, "why": "Nota: «Geoconsciencia. Capacidad del UAS de detectar su intrusión en un espacio aéreo restringido y avisar al piloto para que realice las acciones rectificadoras oportunas.»", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, nota de la p. 22", "note": ""}, {"n": 146, "stem": "Según el capítulo 5.3.2, ¿qué ejemplos da el manual de servicios U-space adicionales a los obligatorios?", "opts": ["La identificación de red y la geoconsciencia", "La autorización de vuelo y la información de tráfico", "La reconfiguración dinámica del espacio aéreo y el CIS", "El seguimiento de la conformidad y la información meteorológica"], "ans": 3, "why": "«Podrán prestarse servicios U-space adicionales … tales como el seguimiento de la conformidad de la operación (conformance monitoring), o la información meteorológica.» A y B son los cuatro obligatorios.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, p. 22", "note": ""}, {"n": 147, "stem": "En el diagrama radial del U-space de la p. 22, ¿cómo aparecen la «información meteorológica» y la «supervisión de la conformidad»?", "opts": ["Marcadas con un asterisco, como servicios opcionales", "En negrita, como servicios obligatorios", "En rojo, como servicios prestados por el ANSP", "Sin marca, como componentes del CIS"], "ans": 0, "why": "Ambas van en círculos discontinuos con asterisco y la leyenda «*Servicios opcionales». Los otros cuatro (autorización de vuelo de UAS, identificación de red, geoconsciencia, información sobre el tráfico) no llevan asterisco.", "src": "Manual 10 (nov. 2026), capítulo 5.3.2, figura de la p. 22", "note": ""}, {"n": 148, "stem": "Según el capítulo 5.3.3, el Servicio de Información Común (CIS) proporciona y difunde la información común:", "opts": ["Meteorológica y aeronáutica", "Pública y reservada", "Estática y dinámica", "Táctica y estratégica"], "ans": 2, "why": "«El Servicio de Información Común (Common Information Service, CIS) proporciona y difunde la información común estática y dinámica necesaria para apoyar la prestación de los servicios U-space».", "src": "Manual 10 (nov. 2026), capítulo 5.3.3, p. 23", "note": ""}, {"n": 149, "stem": "Según el capítulo 5.3.3, la información común constituye una fuente única y fiable para:", "opts": ["Los pilotos de la aviación tripulada", "Los proveedores de servicios U-space", "Los fabricantes de UAS", "La autoridad competente"], "ans": 1, "why": "«Constituye una fuente única y fiable para los proveedores de servicios U-space y es esencial para la prestación coordinada de los servicios U-space a los operadores UAS».", "src": "Manual 10 (nov. 2026), capítulo 5.3.3, p. 23", "note": ""}, {"n": 150, "stem": "¿Cuál de estos datos NO cita el capítulo 5.3.3 entre los que puede incluir la información común?", "opts": ["La estructura del espacio aéreo", "Las zonas geográficas UAS", "Las restricciones operacionales", "Los datos personales de los pilotos"], "ans": 3, "why": "«Puede incluir datos relativos a la estructura del espacio aéreo, zonas geográficas UAS, restricciones operacionales y cualquier otra información aeronáutica u operacional necesaria para la gestión segura de las operaciones.»", "src": "Manual 10 (nov. 2026), capítulo 5.3.3, p. 23", "note": ""}, {"n": 151, "stem": "¿Cuál de estos NO figura entre los principales actores del ecosistema U-space que enumera el capítulo 5.3.4?", "opts": ["El gestor de la red europea (Network Manager)", "El proveedor de servicios de información común (CISP)", "El operador de UAS", "La autoridad competente (AC)"], "ans": 0, "why": "Los seis actores: autoridad competente (AC), ANSP, CISP, USSP, operador de UAS y piloto a distancia.", "src": "Manual 10 (nov. 2026), capítulo 5.3.4, p. 23", "note": ""}, {"n": 152, "stem": "Según el capítulo 5.3.4, ¿qué actor del ecosistema U-space es responsable de la supervisión y aplicación del marco regulador U-space?", "opts": ["El proveedor de servicios de información común (CISP)", "El proveedor de servicios de navegación aérea (ANSP)", "La autoridad competente (AC)", "El proveedor de servicios U-space (USSP)"], "ans": 2, "why": "«Autoridad competente (AC), responsable de la supervisión, y aplicación del marco regulador U-space, así como de las funciones que le atribuye la normativa europea y nacional.»", "src": "Manual 10 (nov. 2026), capítulo 5.3.4, p. 23", "note": ""}, {"n": 153, "stem": "Según el capítulo 5.3.4, el ANSP es responsable de la prestación de servicios de navegación aérea y de:", "opts": ["La certificación de los USSP", "La coordinación con los servicios U-space cuando resulte necesario", "La prestación de los servicios U-space a los operadores de UAS", "El registro de los operadores de UAS"], "ans": 1, "why": "«Proveedor de servicios de navegación aérea (ANSP), responsable de la prestación de servicios de navegación aérea y de la coordinación con los servicios U-space cuando resulte necesario.» C es función del USSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.4, p. 23", "note": ""}, {"n": 154, "stem": "Según el capítulo 5.3.4, ¿qué actor es responsable de proporcionar el Servicio de Información Común?", "opts": ["El USSP", "El ANSP", "La autoridad competente", "El CISP"], "ans": 3, "why": "«Proveedor de servicios de información común (CISP), responsable de proporcionar el Servicio de Información Común.» El USSP presta los servicios U-space a los operadores.", "src": "Manual 10 (nov. 2026), capítulo 5.3.4, p. 23", "note": ""}, {"n": 155, "stem": "Según el capítulo 5.3.5, los USSP prestan a los operadores los servicios U-space necesarios para apoyar:", "opts": ["La planificación, autorización, ejecución y supervisión de las operaciones", "El diseño, la fabricación y la comercialización de los UAS", "El registro, la formación y el seguro de los pilotos a distancia", "La designación y la publicación de las zonas geográficas UAS"], "ans": 0, "why": "Los USSP «prestan a los operadores los servicios U-space necesarios para apoyar la planificación, autorización, ejecución y supervisión de las operaciones».", "src": "Manual 10 (nov. 2026), capítulo 5.3.5, p. 24", "note": ""}, {"n": 156, "stem": "Según el capítulo 5.3.5, para prestar sus servicios los USSP utilizan la información proporcionada mediante:", "opts": ["El servicio de identificación de red de otros USSP", "La reconfiguración dinámica del espacio aéreo del proveedor ATS", "El Servicio de Información Común (CIS)", "La plataforma ENAIRE Drones, exclusivamente"], "ans": 2, "why": "«Para ello utilizan la información proporcionada mediante el Servicio de Información Común (CIS)».", "src": "Manual 10 (nov. 2026), capítulo 5.3.5, p. 24", "note": ""}, {"n": 157, "stem": "Según el capítulo 5.3.6, el Servicio de Información Común será prestado:", "opts": ["Siempre por un único CISP designado por EASA para toda la Unión", "Por uno o varios CISP, según el modelo adoptado por cada Estado miembro", "Por los USSP certificados, de forma rotatoria", "Por el ANSP del espacio aéreo controlado adyacente"], "ans": 1, "why": "«El Servicio de Información Común será prestado por uno o varios proveedores de servicios de información común (CISP), según el modelo adoptado por cada Estado miembro.» Cada Estado puede designar un CISP único (sCISP).", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, p. 24", "note": ""}, {"n": 158, "stem": "¿Qué norma designa a ENAIRE como proveedor único de servicios de información común en España?", "opts": ["El Reglamento de Ejecución (UE) 2021/664", "El Reglamento de Ejecución (UE) 2021/665", "PANDU+", "El Real Decreto 517/2024"], "ans": 3, "why": "«En España, el Real Decreto 517/2024 designa a ENAIRE como proveedor único de servicios de información común.» El 2021/664 solo permite a los Estados designar un sCISP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, p. 24; capítulo 2.2, p. 7", "note": ""}, {"n": 159, "stem": "Según el capítulo 5.3.6, cada CISP (o el sCISP) integra información procedente de:", "opts": ["La AC, los ANSP, los USSP y otros proveedores cuando sea necesario", "Los fabricantes, importadores y distribuidores de UAS", "Los operadores de UAS y los pilotos a distancia, exclusivamente", "EASA, EUROCONTROL y la Comisión Europea, exclusivamente"], "ans": 0, "why": "«Para ello, integra información procedente de la Autoridad competente (AC), de los proveedores de servicios de navegación aérea (ANSP), de los proveedores de servicios U-space (USSP) y de otros proveedores de información cuando resulte necesario.»", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, p. 24", "note": ""}, {"n": 160, "stem": "¿Qué significa la sigla sCISP que usa el manual 10?", "opts": ["Proveedor de servicios U-space certificado por el Estado", "Proveedor de servicios de información común de seguridad", "Proveedor único de servicios de información común", "Proveedor secundario de servicios de información común"], "ans": 2, "why": "«Los Estados miembros podrán designar un Proveedor de Servicios de Información Común único (sCISP).» En España es ENAIRE.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, p. 24", "note": ""}, {"n": 161, "stem": "Según la figura de la p. 25, ¿cuál de estas informaciones aporta la autoridad competente a la información común?", "opts": ["La reconfiguración dinámica del espacio aéreo", "Una lista con los proveedores de servicios U-space (USSP) certificados", "Los términos y condiciones de los servicios U-space", "Los datos operacionales en tiempo real"], "ans": 1, "why": "La autoridad competente aporta: límites geográficos del espacio U-space designado; requisitos de performance; una lista con los USSP certificados; zonas geográficas UAS relevantes; restricciones estáticas y dinámicas. A y D son del ANSP; C, del USSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, figura de la p. 25", "note": ""}, {"n": 162, "stem": "Según la figura de la p. 25, ¿qué aporta el ANSP a la información común?", "opts": ["Los límites geográficos del espacio aéreo U-space designado y sus zonas geográficas UAS", "Los requisitos de performance del UAS, del servicio U-space y de las condiciones operativas", "Los términos y condiciones de los servicios U-space que presta cada proveedor", "La reconfiguración dinámica del espacio aéreo y los datos operacionales en tiempo real"], "ans": 3, "why": "Bloque ANSP: «Reconfiguración dinámica del espacio aéreo» y «Datos operacionales en tiempo real». A y B los aporta la autoridad competente; C, el USSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, figura de la p. 25", "note": ""}, {"n": 163, "stem": "Según la figura de la p. 25, ¿qué aporta el USSP a la información común?", "opts": ["Los términos y condiciones de los servicios U-space", "Las restricciones estáticas y dinámicas", "Las zonas geográficas UAS relevantes para el espacio U-space", "Los datos operacionales en tiempo real"], "ans": 0, "why": "El bloque USSP contiene solo «Términos y condiciones de los servicios U-Space». B y C son de la autoridad competente; D, del ANSP.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, figura de la p. 25", "note": ""}, {"n": 164, "stem": "Según la figura de la p. 25, ¿quién aporta las «restricciones estáticas y dinámicas» a la información común?", "opts": ["El ANSP", "Cada USSP", "La autoridad competente", "El operador de UAS"], "ans": 2, "why": "Es el último punto del bloque de la autoridad competente (AC). El ANSP aporta la DAR y los datos en tiempo real; el USSP, sus términos y condiciones.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, figura de la p. 25", "note": ""}, {"n": 165, "stem": "En el esquema de la p. 25, ¿a quién hace llegar el «Single CISP» la información común?", "opts": ["Directamente a los pilotos de la aviación tripulada", "A los USSP (USSP 1, USSP 2 … USSP n), que dan servicio a los UAS", "Solo a la autoridad competente", "A los ANSP, que la retransmiten a los UAS"], "ans": 1, "why": "El esquema muestra la «Información común» (CA, ANSP, USSP) conectada con el «Single CISP», y este con USSP 1, USSP 2 y USSP n, cada uno con sus drones.", "src": "Manual 10 (nov. 2026), capítulo 5.3.6, figura de la p. 25", "note": ""}, {"n": 166, "stem": "Según el capítulo 5.3.7, los ANSP participan en la coordinación entre las operaciones tripuladas y no tripuladas de conformidad con los requisitos del:", "opts": ["Reglamento de Ejecución (UE) 2021/664", "Reglamento de Ejecución (UE) 2021/666", "Reglamento Delegado (UE) 2019/945", "Reglamento de Ejecución (UE) 2021/665"], "ans": 3, "why": "Los ANSP participan «proporcionando información operacional relevante para el funcionamiento del ecosistema U-space, de conformidad con los requisitos establecidos en el Reglamento de Ejecución (UE) 2021/665».", "src": "Manual 10 (nov. 2026), capítulo 5.3.7, p. 25", "note": ""}, {"n": 167, "stem": "Según el texto del capítulo 5.4 (p. 25), el Reglamento de Ejecución (UE) 2021/665 incorpora requisitos aplicables a:", "opts": ["Los proveedores de servicios ATM/ANS en espacio U-space controlado", "Los fabricantes e importadores de UAS de clase C5 y C6", "Las aeronaves tripuladas que vuelan sin servicio de control", "Los clubes y asociaciones de aeromodelismo"], "ans": 0, "why": "El 2021/665 «modifica el Reglamento de Ejecución (UE) 2017/373 e incorpora requisitos aplicables a los proveedores de servicios de gestión del tránsito aéreo y navegación aérea (ATM/ANS) en relación con los espacios aéreos U-space situados en espacio aéreo controlado». C es el 2021/666.", "src": "Manual 10 (nov. 2026), capítulo 5.4, p. 25", "note": ""}, {"n": 168, "stem": "¿Cuál es la finalidad del Reglamento de Ejecución (UE) 2021/665, según el capítulo 5.4?", "opts": ["Establecer el sistema de marcado de clase de los UAS", "Definir las reglas del aire comunes de la aviación tripulada", "Garantizar la coordinación entre los servicios ATS y el ecosistema U-space", "Designar a los proveedores únicos de información común de cada Estado"], "ans": 2, "why": "«Su finalidad es garantizar la coordinación entre los servicios de tránsito aéreo y el ecosistema U-space, favoreciendo la integración segura de las operaciones con UAS en aquellos entornos donde coexisten aeronaves tripuladas y no tripuladas.»", "src": "Manual 10 (nov. 2026), capítulo 5.4, p. 25", "note": ""}, {"n": 169, "stem": "Según el capítulo 5.4.1, ¿qué información facilitarán los proveedores ATS para la prestación del Servicio de Información Común (CIS)?", "opts": ["La identificación a distancia de los UAS", "La información sobre tráfico tripulado", "Los términos y condiciones de los USSP", "La lista de operadores de UAS registrados"], "ans": 1, "why": "Los proveedores ATS «facilitarán la información sobre tráfico tripulado necesaria para la prestación del Servicio de Información Común (CIS)».", "src": "Manual 10 (nov. 2026), capítulo 5.4.1, p. 26", "note": ""}, {"n": 170, "stem": "¿Cuál de estas funciones NO atribuye el capítulo 5.4.1 a los proveedores ATS en espacios U-space situados en espacio aéreo controlado?", "opts": ["Facilitar información sobre tráfico tripulado para el CIS", "Coordinar sus actuaciones con los USSP", "Aplicar, cuando proceda, medidas DAR", "Prestar el servicio de autorización de vuelo a los operadores de UAS"], "ans": 3, "why": "Las tres funciones de los ATS son A, B y C. La autorización de vuelo es un servicio U-space que prestan los USSP a los operadores.", "src": "Manual 10 (nov. 2026), capítulo 5.4.1, p. 26", "note": ""}, {"n": 171, "stem": "¿Qué significa la sigla DAR en el manual 10?", "opts": ["Reconfiguración Dinámica del Espacio Aéreo (Dynamic Airspace Reconfiguration)", "Restricción de Espacio Aéreo Designado (Designated Airspace Restriction)", "Datos de Autorización de Ruta (Data for Authorised Routes)", "Declaración de Actividad de Riesgo (Declared Activity Risk)"], "ans": 0, "why": "«Reconfiguración Dinámica del Espacio Aéreo (Dynamic Airspace Reconfiguration, DAR)».", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 172, "stem": "Según el capítulo 5.4.2, la DAR permite modificar temporalmente las condiciones de utilización de un espacio aéreo U-space cuando resulte necesario por motivos:", "opts": ["Económicos, comerciales o de capacidad aeroportuaria", "Meteorológicos y de visibilidad, exclusivamente", "Operacionales, de seguridad o de coordinación del tráfico aéreo", "De defensa nacional y orden público, exclusivamente"], "ans": 2, "why": "La DAR «permite modificar temporalmente las condiciones de utilización de un espacio aéreo U-space cuando resulte necesario por motivos operacionales, de seguridad o de coordinación del tráfico aéreo».", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 173, "stem": "Según el capítulo 5.4.2, la aplicación de medidas DAR requiere la coordinación entre los proveedores ATS, los ANSP, los USSP y, cuando proceda:", "opts": ["La autoridad competente (AC) del Estado miembro", "Los proveedores de Servicios de Información Común (CISP)", "Los operadores de UAS afectados por la medida", "La Agencia de la Unión Europea para la Seguridad Aérea"], "ans": 1, "why": "«…requiere la adecuada coordinación entre los proveedores ATS, los proveedores de servicios de navegación aérea (ANSP), los proveedores de servicios U-space (USSP) y, cuando proceda, los proveedores de Servicios de Información Común (CISP).»", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 174, "stem": "Según el capítulo 5.4.2, las medidas DAR adaptan temporalmente las condiciones operacionales del espacio aéreo:", "opts": ["Mediante una nueva designación de espacio U-space por el Estado miembro", "Mediante la publicación de una nueva zona geográfica UAS permanente", "Mediante la modificación del Reglamento de Ejecución (UE) 2021/664", "Sin necesidad de modificar permanentemente su estructura"], "ans": 3, "why": "«Mediante estos mecanismos es posible adaptar temporalmente las condiciones operacionales del espacio aéreo para mantener niveles adecuados de seguridad y eficiencia sin necesidad de modificar permanentemente su estructura.»", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 175, "stem": "¿Cuál de estas situaciones NO cita el capítulo 5.4.2 entre aquellas a las que la DAR facilita la adaptación temporal del espacio aéreo?", "opts": ["La certificación anual de los USSP", "Las situaciones de elevada demanda", "Las emergencias", "Las operaciones especiales"], "ans": 0, "why": "«La DAR facilita la adaptación temporal del espacio aéreo a situaciones de elevada demanda, operaciones especiales, emergencias o necesidades específicas de coordinación entre aeronaves tripuladas y no tripuladas.»", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 176, "stem": "La figura que cierra el capítulo 5.4.2 (p. 27) muestra un «U-space in controlled airspace» en el que aparece una «Temporary limitation» para el paso de un helicóptero hacia un hospital. ¿Qué mecanismo ilustra?", "opts": ["La conspicuidad electrónica del Reglamento 2021/666", "El servicio de geoconsciencia", "La reconfiguración dinámica del espacio aéreo (DAR)", "Una zona geográfica UAS permanente de protección de infraestructuras"], "ans": 2, "why": "La figura acompaña al apartado de la DAR: el mismo espacio U-space en espacio aéreo controlado, antes y después de abrir temporalmente un corredor para el helicóptero, sin cambiar su estructura de forma permanente.", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, figura de la p. 27", "note": ""}, {"n": 177, "stem": "En el manual 10, la reconfiguración dinámica del espacio aéreo (DAR) se trata dentro del capítulo dedicado a:", "opts": ["El Reglamento de Ejecución (UE) 2021/664", "El Reglamento de Ejecución (UE) 2021/665", "El Reglamento de Ejecución (UE) 2021/666", "El Real Decreto 517/2024"], "ans": 1, "why": "La DAR es el apartado 5.4.2, dentro del 5.4 «Reglamento de Ejecución (UE) 2021/665», que regula la coordinación ATS-U-space en espacio aéreo controlado.", "src": "Manual 10 (nov. 2026), capítulo 5.4.2, p. 26", "note": ""}, {"n": 178, "stem": "Según el capítulo 5.5, ¿qué aeronaves tripuladas deben ser electrónicamente perceptibles en un espacio aéreo U-space?", "opts": ["Todas, reciban o no servicio de control de tránsito aéreo", "Solo las de transporte comercial de pasajeros", "Solo las que vuelan por debajo de 120 m sobre la superficie", "Las que no reciban servicio de control de tránsito aéreo"], "ans": 3, "why": "«Las aeronaves tripuladas que operen en un espacio aéreo U-space y no reciban servicios de control de tránsito aéreo deberán ser electrónicamente perceptibles».", "src": "Manual 10 (nov. 2026), capítulo 5.5, p. 27", "note": ""}, {"n": 179, "stem": "Según el capítulo 5.5, la información de posición de las aeronaves tripuladas electrónicamente perceptibles debe poder ponerse a disposición de:", "opts": ["Los USSP, para la prestación segura de los servicios U-space", "La autoridad competente, con fines sancionadores", "Los operadores de UAS directamente, sin intermediarios", "El gestor de la red europea, para la gestión de afluencia"], "ans": 0, "why": "«…de modo que la información relativa a su posición pueda ponerse a disposición de los USSP para la prestación segura de los servicios U-space.»", "src": "Manual 10 (nov. 2026), capítulo 5.5, p. 27", "note": ""}, {"n": 180, "stem": "Según el capítulo 5.5.1, la conspicuidad electrónica es:", "opts": ["La capacidad de una aeronave de ser percibida mediante la observación directa de terceros", "La capacidad del UAS de detectar su intrusión en un espacio aéreo restringido y avisar al piloto", "La capacidad de una aeronave de transmitir su presencia y posición mediante sistemas de vigilancia", "La obligación del USSP de publicar los términos y condiciones de sus servicios U-space"], "ans": 2, "why": "Definición del 5.5.1. A es la conspicuidad visual; B, la geoconsciencia según la nota de la p. 22.", "src": "Manual 10 (nov. 2026), capítulo 5.5.1, p. 27", "note": ""}, {"n": 181, "stem": "Según el capítulo 5.5.1, ¿en qué se basa la conspicuidad visual, de la que se diferencia la electrónica?", "opts": ["En la transmisión de la posición mediante sistemas de vigilancia", "En la observación directa de la aeronave", "En las luces anticolisión obligatorias de los UAS", "En el servicio de información de tráfico del USSP"], "ans": 1, "why": "La conspicuidad electrónica se diferencia «de la conspicuidad visual, que se basa en la observación directa de la aeronave».", "src": "Manual 10 (nov. 2026), capítulo 5.5.1, p. 27", "note": ""}, {"n": 182, "stem": "La figura de la p. 28, sin texto, muestra un «U-space airspace» con helicópteros que emiten señales entre edificios y drones. Por el apartado al que acompaña, ¿qué requisito ilustra?", "opts": ["La reconfiguración dinámica del espacio aéreo del Reglamento 2021/665", "El servicio de identificación de red de los UAS", "La exención de identificación a distancia de las operaciones NO EASA", "La conspicuidad electrónica de la aviación tripulada del Reglamento 2021/666"], "ans": 3, "why": "La figura sigue al apartado 5.5.1 (conspicuidad electrónica): las aeronaves tripuladas (los helicópteros) emiten su posición dentro del espacio U-space para que los USSP la conozcan.", "src": "Manual 10 (nov. 2026), capítulo 5.5.1, figura de la p. 28", "note": ""}, {"n": 183, "stem": "Según el capítulo 6, la implantación del U-space en España se desarrolla de forma progresiva mediante la combinación de:", "opts": ["El marco regulador europeo, la normativa nacional y las iniciativas estratégicas del sector", "Los acuerdos bilaterales con los Estados vecinos y los planes estratégicos internos de ENAIRE", "Las normas y métodos recomendados de la OACI y los reglamentos de EASA, exclusivamente", "Los contratos de servicio entre ENAIRE y los USSP y las tasas que pagan los operadores"], "ans": 0, "why": "«La implantación del U-space en España se desarrolla de forma progresiva mediante la combinación del marco regulador europeo, la normativa nacional y las iniciativas estratégicas impulsadas por las administraciones y organizaciones del sector aeronáutico.»", "src": "Manual 10 (nov. 2026), capítulo 6, p. 29", "note": ""}, {"n": 184, "stem": "¿Qué significa PANDU+ según el capítulo 6.1?", "opts": ["Plan Aeronáutico Nacional de Drones y U-space", "Programa de Acción Nacional para el Desarrollo de los UAS", "Plan de Acción Nacional para el Despliegue del U-space y la Zonificación", "Plan de Actuación Normativa sobre Drones Urbanos"], "ans": 2, "why": "«El Plan de Acción Nacional para el Despliegue del U-space y la Zonificación (PANDU+) 2026-2030».", "src": "Manual 10 (nov. 2026), capítulo 6.1, p. 29", "note": ""}, {"n": 185, "stem": "¿Qué periodo abarca PANDU+ según el manual 10?", "opts": ["2022-2025", "2026-2030", "2025-2030", "2024-2028"], "ans": 1, "why": "«PANDU+ 2026-2030 establece la hoja de ruta nacional para completar el despliegue del U-space».", "src": "Manual 10 (nov. 2026), capítulo 6.1, p. 29", "note": ""}, {"n": 186, "stem": "¿Cuál de estos fines NO atribuye el capítulo 6.1 a la hoja de ruta nacional de PANDU+?", "opts": ["Completar el despliegue del U-space", "Avanzar en el establecimiento y gestión de las zonas geográficas de UAS", "Favorecer la integración progresiva de operaciones UAS de mayor complejidad", "Certificar a ENAIRE como proveedor único de servicios U-space"], "ans": 3, "why": "PANDU+ «establece la hoja de ruta nacional para completar el despliegue del U-space, avanzar en el establecimiento y gestión de las zonas geográficas de UAS y favorecer la integración progresiva de operaciones UAS de mayor complejidad». ENAIRE es sCISP (por el RD 517/2024), no USSP.", "src": "Manual 10 (nov. 2026), capítulo 6.1, p. 29", "note": ""}, {"n": 187, "stem": "PANDU+ articula sus actuaciones en torno a tres objetivos principales. ¿Cuál NO es uno de ellos?", "opts": ["Certificación de operadores", "Zonificación del espacio aéreo", "Desarrollo del U-space", "Actividades transversales"], "ans": 0, "why": "La figura de la p. 29 da los tres: «Zonificación del espacio aéreo», «Desarrollo del U-space» y «Actividades transversales».", "src": "Manual 10 (nov. 2026), capítulo 6.1.1, figura de la p. 29", "note": ""}, {"n": 188, "stem": "En la figura de objetivos de PANDU+ (p. 29), ¿en qué objetivo se encuadran los «Habilitadores de la IAM en España»?", "opts": ["Zonificación del espacio aéreo", "Actividades transversales", "Desarrollo del U-space", "En ninguno; la IAM no figura en PANDU+"], "ans": 2, "why": "«Desarrollo del U-space» incluye: despliegue operacional del U-space, evolución del U-space y habilitadores de la IAM en España.", "src": "Manual 10 (nov. 2026), capítulo 6.1.1, figura de la p. 29", "note": ""}, {"n": 189, "stem": "En la figura de objetivos de PANDU+ (p. 29), el «Plan de Acción de Zonificación» aparece como línea de:", "opts": ["Zonificación del espacio aéreo", "Actividades transversales", "Desarrollo del U-space", "Evolución del U-space"], "ans": 1, "why": "«Actividades transversales»: coordinación y divulgación; actualización de la regulación; gestión de la seguridad y la calidad; Plan de Acción de Zonificación. No confundir con el objetivo «Zonificación del espacio aéreo».", "src": "Manual 10 (nov. 2026), capítulo 6.1.1, figura de la p. 29", "note": ""}, {"n": 190, "stem": "En la figura de objetivos de PANDU+ (p. 29), el objetivo «Zonificación del espacio aéreo» incluye las zonas geográficas de UAS, las nuevas estructuras de espacio aéreo y:", "opts": ["La coordinación y divulgación", "Los habilitadores de la IAM en España", "La gestión de la seguridad y la calidad", "La estandarización de las coordinaciones"], "ans": 3, "why": "«Zonificación del espacio aéreo»: zonas geográficas de UAS; nuevas estructuras de espacio aéreo; estandarización de las coordinaciones. A y C son actividades transversales; B, desarrollo del U-space.", "src": "Manual 10 (nov. 2026), capítulo 6.1.1, figura de la p. 29", "note": ""}, {"n": 191, "stem": "En la figura de objetivos de PANDU+ (p. 29), ¿cuál de estas líneas pertenece a «Actividades transversales»?", "opts": ["Actualización de la regulación", "Despliegue operacional del U-space", "Nuevas estructuras de espacio aéreo", "Evolución del U-space"], "ans": 0, "why": "Actividades transversales: coordinación y divulgación, actualización de la regulación, gestión de la seguridad y la calidad, Plan de Acción de Zonificación. B y D son del desarrollo del U-space; C, de la zonificación.", "src": "Manual 10 (nov. 2026), capítulo 6.1.1, figura de la p. 29", "note": ""}, {"n": 192, "stem": "Según el capítulo 7, la implantación del U-space se enmarca en la estrategia europea de integración gradual de los UAS en el espacio aéreo y en las iniciativas orientadas al desarrollo de:", "opts": ["Nuevos aeropuertos regionales", "La defensa aérea frente a UAS hostiles", "Nuevas capacidades de movilidad aérea innovadora", "La aviación general de recreo"], "ans": 2, "why": "«Este proceso se enmarca en la estrategia europea de integración gradual de los UAS en el espacio aéreo y en las iniciativas orientadas al desarrollo de nuevas capacidades de movilidad aérea innovadora.»", "src": "Manual 10 (nov. 2026), capítulo 7, p. 30", "note": ""}, {"n": 193, "stem": "Según el capítulo 7, ¿qué permitirá la disponibilidad de espacios aéreos U-space y de los servicios asociados?", "opts": ["Eliminar la obligación de registro de los operadores de UAS", "Apoyar operaciones cada vez más complejas y ampliar las capacidades de los UAS", "Sustituir los servicios de tránsito aéreo en el espacio aéreo controlado", "Suprimir las zonas geográficas UAS existentes en todo el territorio"], "ans": 1, "why": "«La disponibilidad de espacios aéreos U-space y de los servicios asociados permitirá apoyar operaciones cada vez más complejas y ampliar las capacidades operacionales de los sistemas de aeronaves no tripuladas.»", "src": "Manual 10 (nov. 2026), capítulo 7, p. 30", "note": ""}, {"n": 194, "stem": "¿Qué significa la sigla IAM en el manual 10?", "opts": ["Integrated Airspace Management", "International Air Mobility", "Intelligent Aerial Monitoring", "Innovative Air Mobility"], "ans": 3, "why": "«La Movilidad Aérea Innovadora (Innovative Air Mobility, IAM)».", "src": "Manual 10 (nov. 2026), capítulo 8.2, p. 31", "note": ""}, {"n": 195, "stem": "Según el capítulo 8.2, la IAM se define como la movilidad segura, eficiente y sostenible de personas y mercancías posibilitada por tecnologías de nueva generación integradas en:", "opts": ["Un sistema multimodal de transporte", "El espacio aéreo controlado de clase C", "Una red de vertipuertos urbanos exclusivos", "El sistema europeo de gestión de afluencia"], "ans": 0, "why": "La IAM «se define como la movilidad segura, eficiente y sostenible de personas y mercancías posibilitada por tecnologías de nueva generación integradas en un sistema multimodal de transporte».", "src": "Manual 10 (nov. 2026), capítulo 8.2, p. 32", "note": ""}, {"n": 196, "stem": "Según el capítulo 8.2, la IAM abarca operaciones desarrolladas en entornos:", "opts": ["Solo urbanos", "Urbanos y periurbanos", "Urbanos, periurbanos y regionales", "Regionales e internacionales"], "ans": 2, "why": "La IAM «abarca operaciones desarrolladas en diferentes entornos operacionales, incluyendo los ámbitos urbanos, periurbanos y regionales». La UAM se limita a urbanos y periurbanos.", "src": "Manual 10 (nov. 2026), capítulo 8.2, p. 32", "note": ""}, {"n": 197, "stem": "Según el capítulo 8.3, la UAM se centra en la prestación de servicios de transporte de personas y mercancías en entornos:", "opts": ["Urbanos, periurbanos y regionales", "Urbanos y periurbanos", "Exclusivamente urbanos", "Regionales y transfronterizos"], "ans": 1, "why": "La UAM «constituye un ámbito específico de la Movilidad Aérea Innovadora centrado en la prestación de servicios de transporte de personas y mercancías en entornos urbanos y periurbanos». Los regionales son de la IAM.", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 32", "note": ""}, {"n": 198, "stem": "Según el capítulo 8.3, la Movilidad Aérea Urbana (UAM):", "opts": ["Engloba a la IAM, que es uno de sus ámbitos específicos", "Es un concepto independiente de la IAM, ligado a la aviación tripulada", "Es el nombre que recibe la IAM en España", "Constituye un ámbito específico de la Movilidad Aérea Innovadora"], "ans": 3, "why": "«Constituye un ámbito específico de la Movilidad Aérea Innovadora». La IAM es el concepto amplio; la UAM, una parte.", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 32", "note": ""}, {"n": 199, "stem": "¿Cuál de estas tecnologías NO figura entre las que el capítulo 8.2 asocia habitualmente a la IAM?", "opts": ["Motores de combustión de alto rendimiento", "Aeronaves de despegue y aterrizaje vertical (eVTOL)", "Sistemas altamente automatizados", "Tecnologías avanzadas de navegación, vigilancia y gestión del tráfico"], "ans": 0, "why": "Las tecnologías de la IAM: eVTOL, sistemas altamente automatizados, servicios digitales avanzados, nuevas soluciones de conectividad e intercambio de información, y tecnologías avanzadas de navegación, vigilancia y gestión del tráfico.", "src": "Manual 10 (nov. 2026), capítulo 8.2, p. 32", "note": ""}, {"n": 200, "stem": "¿A qué tipo de aeronave se refiere la sigla eVTOL que usa el manual 10?", "opts": ["Aeronave eléctrica de ala variable con piloto a bordo", "Aeronave de transporte con despegue y aterrizaje cortos", "Aeronave de despegue y aterrizaje vertical", "Vehículo terrestre autónomo de entrega de última milla"], "ans": 2, "why": "El manual escribe «Aeronaves de despegue y aterrizaje vertical (eVTOL)», tanto en la IAM como en la UAM.", "src": "Manual 10 (nov. 2026), capítulos 8.2 y 8.3, p. 32", "note": ""}, {"n": 201, "stem": "Según el capítulo 8.3, la UAM comprende nuevas formas de transporte aéreo apoyadas en tecnologías como:", "opts": ["La propulsión a reacción y las aeronaves supersónicas", "La propulsión eléctrica y las aeronaves eVTOL", "Los dirigibles de hidrógeno y los globos cautivos", "Los helicópteros convencionales de turbina"], "ans": 1, "why": "La UAM «comprende nuevas formas de transporte aéreo apoyadas en tecnologías como la propulsión eléctrica y las aeronaves de despegue y aterrizaje vertical (eVTOL)».", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 32", "note": ""}, {"n": 202, "stem": "¿Cuál de estas aplicaciones NO cita el capítulo 8.3 entre las posibles aplicaciones de la UAM?", "opts": ["Transporte de mercancías", "Distribución urgente de suministros", "Inspección de infraestructuras", "Vigilancia fronteriza de largo alcance"], "ans": 3, "why": "Aplicaciones de la UAM: transporte de mercancías, distribución urgente de suministros, servicios de emergencia, inspección de infraestructuras y futuras operaciones de transporte de pasajeros.", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 32", "note": ""}, {"n": 203, "stem": "Entre las posibles aplicaciones de la UAM, ¿cómo presenta el capítulo 8.3 el transporte de pasajeros?", "opts": ["Como futuras operaciones de transporte de pasajeros", "Como la aplicación principal, ya implantada en Europa", "Como una aplicación excluida por la normativa europea", "Como una aplicación reservada a la categoría abierta"], "ans": 0, "why": "El último punto de la lista es «Futuras operaciones de transporte de pasajeros».", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 32", "note": ""}, {"n": 204, "stem": "Según el capítulo 8.1, en relación con la movilidad aérea, el desarrollo del U-space constituye:", "opts": ["Un obstáculo regulatorio de carácter temporal para la implantación de nuevos servicios", "Un sustituto de la gestión del tránsito aéreo convencional en el espacio aéreo controlado", "Un elemento facilitador de la evolución de los UAS y de nuevos servicios con aeronaves innovadoras", "Un requisito exclusivo de las operaciones de transporte de la categoría certificada"], "ans": 2, "why": "«En este contexto, el desarrollo del U-space constituye un elemento facilitador para la evolución de las operaciones con UAS y para la implantación progresiva de nuevos servicios basados en aeronaves innovadoras.»", "src": "Manual 10 (nov. 2026), capítulo 8.1, p. 31", "note": ""}, {"n": 205, "stem": "Según el final del capítulo 8.3, la evolución de las aplicaciones de la UAM está estrechamente vinculada a:", "opts": ["La reducción del precio de los combustibles de aviación y de las tasas aeroportuarias", "El desarrollo tecnológico, los servicios digitales adecuados y la integración progresiva de los UAS", "La construcción de nuevos aeropuertos convencionales en el interior de las grandes ciudades", "La supresión de las zonas geográficas UAS en los entornos urbanos y periurbanos"], "ans": 1, "why": "«La evolución de estas aplicaciones está estrechamente vinculada al desarrollo de las tecnologías aeronáuticas, a la disponibilidad de servicios digitales adecuados y a la integración progresiva de los UAS en el sistema aeronáutico.»", "src": "Manual 10 (nov. 2026), capítulo 8.3, p. 33", "note": ""}, {"n": 206, "stem": "Según el capítulo 8.1, ¿qué contribuye a crear las condiciones necesarias para la integración progresiva de nuevas capacidades de movilidad aérea?", "opts": ["Los espacios y servicios U-space, los mecanismos de coordinación y el intercambio de información", "La supresión de las categorías operacionales del Reglamento de Ejecución (UE) 2019/947", "La transferencia del control de todos los UAS a los proveedores de servicios de tránsito aéreo", "La obligación de que todos los UAS que vuelen en ciudad lleven marcado de clase C6"], "ans": 0, "why": "«La disponibilidad de espacios aéreos U-space, servicios U-space, mecanismos de coordinación y sistemas de intercambio de información contribuye a crear las condiciones necesarias para la integración progresiva de nuevas capacidades de movilidad aérea.»", "src": "Manual 10 (nov. 2026), capítulo 8.1, p. 31", "note": ""}, {"n": 207, "stem": "Según el capítulo 3.4, ¿cómo clasifica el Reglamento de Ejecución (UE) 2019/947 las operaciones con UAS?", "opts": ["En función del riesgo de la operación, con requisitos proporcionales a su nivel de complejidad", "En función de la masa del UAS, con requisitos fijos para cada tramo de peso", "En función del uso, separando las operaciones
