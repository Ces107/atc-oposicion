><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Factores humanos</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Factores humanos</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el Doc. 10151 de la OACI, tal como lo cita el manual de ENAIRE, las actuaciones humanas (<em>human performance</em>) son:", "opts": ["la aplicación del conocimiento sobre las capacidades humanas al diseño del equipamiento", "la selección del personal adecuado por parte de la organización", "el estudio físico y fisiológico del trabajador", "cómo realizan las personas sus actividades, es decir, la contribución humana al funcionamiento del sistema"], "ans": 3, "why": "Las actuaciones humanas son cómo realizan las personas sus actividades. La opción A es la definición de factores humanos; la C es el énfasis de la ergonomía; la B es un factor organizacional más.", "src": "Manual 8 de ENAIRE, apdo. 1.1, p. 4", "note": ""}, {"n": 2, "stem": "Según el manual, ¿qué énfasis distingue a la ergonomía de los factores humanos fuera del ámbito de la aviación?", "opts": ["La ergonomía se asocia más a los aspectos físicos o fisiológicos, y los factores humanos, más a los aspectos psicológicos", "La ergonomía se asocia a la organización, y los factores humanos, al equipamiento", "La ergonomía estudia solo los accidentes, y los factores humanos, solo los incidentes", "No hay diferencia de énfasis en ningún ámbito"], "ans": 0, "why": "El manual dice que los factores humanos se asocian más a menudo con los aspectos psicológicos y la ergonomía, con los aspectos físicos o fisiológicos.", "src": "Manual 8 de ENAIRE, apdo. 1.1, p. 4", "note": ""}, {"n": 3, "stem": "¿Qué modelo introdujo James Reason a mediados de la década de 1990 y qué concepto llevó a todas las industrias?", "opts": ["El modelo SHELL y el concepto de elemento humano (<em>liveware</em>)", "La curva de Yerkes-Dodson y el concepto de activación", "El modelo TEM y el concepto de estado no deseado", "El modelo del queso suizo y el concepto de accidente organizacional"], "ans": 3, "why": "El modelo del queso suizo introdujo el accidente organizacional, que tiene en cuenta el impacto de la cultura y las políticas de la organización en los controles de riesgos.", "src": "Manual 8 de ENAIRE, apdo. 1.2.1, p. 5", "note": ""}, {"n": 4, "stem": "En el modelo del queso suizo, el suceso se produce cuando:", "opts": ["todas las capas de protección se eliminan a propósito", "un solo controlador comete un error", "los agujeros de las capas de protección se alinean", "las condiciones meteorológicas son adversas"], "ans": 2, "why": "Cada capa tiene debilidades (agujeros); el suceso ocurre cuando se alinean. Los factores organizacionales pueden crear condiciones latentes que determinen una falla de las defensas.", "src": "Manual 8 de ENAIRE, apdo. 1.2.1, p. 5", "note": ""}, {"n": 5, "stem": "Según el manual, ¿cuál es la «mayor y menos conocida» aportación de Reason?", "opts": ["El modelo del queso suizo", "El modelo SHELL", "El enfoque Safety-II", "Su labor investigadora sobre el error humano, que dio el modelo de clasificación GEMS"], "ans": 3, "why": "El manual considera su labor investigadora sobre los errores humanos, que dio lugar al modelo GEMS, su mayor y menos conocida aportación.", "src": "Manual 8 de ENAIRE, apdo. 1.2.1, p. 6", "note": ""}, {"n": 6, "stem": "El modelo de Rasmussen explica la conducta humana mediante tres modos. ¿Qué lista es la correcta?", "opts": ["Desliz, lapsus, equivocación", "Amenaza, error, estado no deseado", "Basada en habilidades, basada en reglas, basada en conocimiento", "Percepción, comprensión, proyección"], "ans": 2, "why": "Los tres modos de Rasmussen son basado en habilidades, basado en reglas y basado en conocimiento; la A corresponde al GEMS, la B al TEM y la D a la conciencia situacional de Endsley.", "src": "Manual 8 de ENAIRE, apdo. 1.2.2, p. 6-7", "note": ""}, {"n": 7, "stem": "¿Qué conducta de Rasmussen se aplica a un controlador que aplica de forma rutinaria los procedimientos operativos en frecuencia, en situaciones conocidas pero no frecuentes?", "opts": ["Basada en habilidades", "Basada en emociones", "Basada en reglas", "Basada en conocimiento"], "ans": 2, "why": "La conducta basada en reglas implica la selección consciente de reglas para situaciones conocidas pero no frecuentes, como en el ejemplo del manual de la aplicación de procedimientos operativos.", "src": "Manual 8 de ENAIRE, apdo. 1.2.2, p. 7", "note": ""}, {"n": 8, "stem": "El manual pone «decidir ante una emergencia o una situación inusual en frecuencia, activando el conocimiento para aplicarlo de forma novedosa» como ejemplo de:", "opts": ["conducta basada en habilidades", "conducta basada en reglas", "un desliz", "conducta basada en conocimiento"], "ans": 3, "why": "Al no haber reglas almacenadas, hace falta un gran esfuerzo consciente de análisis: es la conducta basada en conocimiento.", "src": "Manual 8 de ENAIRE, apdo. 1.2.2, p. 7", "note": ""}, {"n": 9, "stem": "Según el manual, ¿quién creó el modelo SHELL y cuándo?", "opts": ["Edwards 1972, Hawkins 1993", "Reason 1990, Rasmussen 1983", "Endsley 1995, Isaac 1997", "Hollnagel 2009, Dekker 2006"], "ans": 0, "why": "El manual escribe «Edwards 1972, Hawkins 1993»; la OACI lo propuso formalmente en la Circular 216-AN31.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 7", "note": ""}, {"n": 10, "stem": "¿Qué añade a SHELL la versión actualizada SHELL-O?", "opts": ["Operaciones", "Observación", "Organización", "Supervisión"], "ans": 2, "why": "La O corresponde a Organización (<em>Organization</em>) y añade los factores organizacionales como parte del sistema.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 7", "note": ""}, {"n": 11, "stem": "En SHELL-O, el «software» (soporte lógico) se refiere principalmente a:", "opts": ["los procedimientos", "los sistemas técnicos", "las condiciones meteorológicas", "el elemento humano"], "ans": 0, "why": "El manual glosa la S como Software: soporte lógico (procedimientos); la H como Hardware: soporte físico (sistemas técnicos); la E como entorno y la L como elemento humano.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 7", "note": ""}, {"n": 12, "stem": "¿Qué componente ocupa el centro de SHELL-O y es el más flexible?", "opts": ["El soporte físico (<em>hardware</em>)", "La organización", "El entorno", "El elemento humano (<em>liveware</em>)"], "ans": 3, "why": "El ser humano (L) está en el centro; el resto de los componentes deben ajustarse a él.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 7", "note": ""}, {"n": 13, "stem": "La interfaz L-H de SHELL-O representa:", "opts": ["la relación entre el controlador y los reglamentos, manuales y listas de verificación", "la relación entre los individuos, el liderazgo y la cultura", "la interfaz entre el ser humano y «la máquina»: consolas, pantallas, alarmas, ergonomía", "la relación con las condiciones meteorológicas externas"], "ans": 2, "why": "L-S son los procedimientos y manuales, L-E es el entorno (temperatura, ruido, meteorología) y L-L es el liderazgo, la cooperación y la cultura.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 8", "note": ""}, {"n": 14, "stem": "La interfaz L-L del manual incluye:", "opts": ["las consolas y las alarmas", "los procedimientos operacionales normalizados", "la temperatura y el ruido", "el liderazgo, la cooperación, el trabajo en equipo (TRM), las relaciones entre el personal operativo y de gestión y la cultura empresarial"], "ans": 3, "why": "L-L es la relación del individuo con el resto de las personas en el lugar de trabajo.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 8", "note": ""}, {"n": 15, "stem": "¿Por qué tienen los factores organizacionales (O) un mayor peso específico en SHELL-O?", "opts": ["Porque los establece el piloto", "Porque el controlador no puede adaptarse a ellos", "Porque son los únicos factores que se pueden medir", "Porque fijan las políticas sobre los procedimientos y sus cambios, los sistemas técnicos y la gestión de las personas"], "ans": 3, "why": "El manual dice que los factores organizacionales tienen un mayor peso específico porque determinan cómo se gestionan los procedimientos, los cambios, los sistemas y las personas.", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 8", "note": ""}, {"n": 16, "stem": "Los factores psicosociales, según el manual, son:", "opts": ["los sistemas técnicos del sector", "el entorno físico de la torre", "factores externos del sistema social de la persona, dentro o fuera del trabajo, que suponen presiones adicionales", "las tareas asignadas al controlador ejecutivo"], "ans": 2, "why": "Influyen en el enfoque personal de la situación laboral y en la capacidad de manejar el estrés y las situaciones anómalas (OACI, 2002).", "src": "Manual 8 de ENAIRE, apdo. 1.2.3, p. 8", "note": ""}, {"n": 17, "stem": "¿Cuál de los siguientes NO es uno de los ocho factores organizacionales que enumera el manual al comienzo del apartado 1.3?", "opts": ["La adecuación de los recursos humanos", "La selección del personal adecuado", "La gestión de riesgos", "Las actuaciones de la aeronave"], "ans": 3, "why": "La lista es: recursos humanos, selección del personal, formación, bienestar laboral, eficiencia en la gestión de procesos y proyectos, planificación y organización del personal, gestión de riesgos, cultura de la organización y comunicación.", "src": "Manual 8 de ENAIRE, apdo. 1.3, p. 9", "note": ""}, {"n": 18, "stem": "¿Por qué dice el manual que la expresión «error humano» no ayuda a gestionar el riesgo?", "opts": ["Porque los seres humanos nunca cometen errores", "Porque solo se aplica a los pilotos", "Porque los errores son siempre deliberados", "Porque debería ser el punto de partida que indique dónde se produce un colapso del sistema, no la explicación"], "ans": 3, "why": "Las investigaciones de accidentes demuestran que muy rara vez el error de un individuo que actúa aisladamente precipita un accidente.", "src": "Manual 8 de ENAIRE, apdo. 1.3, p. 9", "note": ""}, {"n": 19, "stem": "El manual dice que el concepto de error humano es un «constructo social» porque:", "opts": ["lo define la OACI", "solo existe en España", "que una acción se califique de error depende más de sus consecuencias que de la propia acción", "se mide con KPI"], "ans": 2, "why": "Una instrucción errónea que se corrige a tiempo rara vez se considera un error, aunque no se diferencia de otra que acaba en incidente.", "src": "Manual 8 de ENAIRE, apdo. 1.3, p. 10", "note": ""}, {"n": 20, "stem": "¿Qué documento de la OACI adoptó formalmente, en 1994, el enfoque sistémico en la investigación de sucesos?", "opts": ["El Anexo 11", "El Anexo 13", "El Doc. 9966", "La Circular 216"], "ans": 1, "why": "El manual dice que el enfoque sistémico en la investigación de sucesos fue adoptado formalmente por la OACI (1994) en el Anexo 13.", "src": "Manual 8 de ENAIRE, apdo. 1.3, p. 10", "note": ""}, {"n": 21, "stem": "¿Quién propuso los diez principios de «Systems Thinking for Safety» que cita el manual y en qué año?", "opts": ["EASA, 2017", "OACI, 1994", "EUROCONTROL, 2014", "ENAIRE, 2023"], "ans": 2, "why": "EUROCONTROL (2014); el documento técnico «Systems Thinking for Safety: Ten Principles».", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 11 y bibliografía p. 63", "note": ""}, {"n": 22, "stem": "¿Cuál es el principio sistémico número 3 de EUROCONTROL?", "opts": ["Racionalidad local", "Implicación de los expertos en la materia", "Contrapartidas", "Cultura justa"], "ans": 3, "why": "El orden es: 1 implicación de los expertos en la materia (<em>field expert involvement</em>), 2 racionalidad local, 3 cultura justa, 4 demanda y presión, 5 recursos y limitaciones, 6 interacciones y flujos, 7 contrapartidas, 8 variabilidad del rendimiento, 9 emergencia, 10 equivalencia.", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 11-12", "note": ""}, {"n": 23, "stem": "¿Qué principio establece que cada persona actúa en función de sus propios objetivos, limitaciones y contexto?", "opts": ["Racionalidad local", "Equivalencia", "Emergencia", "Demanda y presión"], "ans": 0, "why": "Principio 2, racionalidad local (<em>local rationality</em>).", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 11", "note": ""}, {"n": 24, "stem": "El principio según el cual el éxito y el fracaso se originan en los mismos procesos es:", "opts": ["Interacciones y flujos", "Variabilidad del rendimiento", "Recursos y limitaciones", "Equivalencia"], "ans": 3, "why": "Principio 10, equivalencia: el resultado no está ligado necesariamente a las acciones que lo desencadenan.", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 12", "note": ""}, {"n": 25, "stem": "¿Qué principio dice que, en los sistemas sociotécnicos complejos, una pequeña acción puede tener grandes efectos y los resultados pueden ser inesperados?", "opts": ["Emergencia", "Contrapartidas", "Cultura justa", "Implicación de los expertos en la materia"], "ans": 0, "why": "Principio 9, emergencia (emergencia del sistema).", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 12", "note": ""}, {"n": 26, "stem": "¿Qué principio se refiere a que los profesionales equilibran la eficiencia y la precisión para resolver objetivos contrapuestos?", "opts": ["Demanda y presión", "Emergencia", "Racionalidad local", "Contrapartidas (<em>trade-offs</em>)"], "ans": 3, "why": "Principio 7, contrapartidas.", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 12", "note": ""}, {"n": 27, "stem": "¿Qué principio pide identificar la variabilidad deseada y la no deseada para mejorar el desempeño y la tolerancia del sistema?", "opts": ["Variabilidad del rendimiento", "Equivalencia", "Interacciones y flujos", "Cultura justa"], "ans": 0, "why": "Principio 8, variabilidad del rendimiento (<em>performance variability</em>).", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 12", "note": ""}, {"n": 28, "stem": "Según el principio «Demanda y presión» de EUROCONTROL, el binomio demanda-presión afecta de forma directa a:", "opts": ["la edad de jubilación", "el color de las pantallas", "la elección del aeropuerto", "el desempeño, en relación con la eficiencia y la capacidad"], "ans": 3, "why": "El manual dice que el binomio demanda-presión, en relación con la eficiencia y la capacidad, afecta de forma directa y fundamental al desempeño.", "src": "Manual 8 de ENAIRE, apdo. 1.3.1, p. 12", "note": ""}, {"n": 29, "stem": "¿En qué décadas se desarrolló principalmente la visión Safety-I?", "opts": ["De 1920 a 1939", "De 1990 a 2009", "De 1960 a 1989", "En la década de 2010"], "ans": 2, "why": "Entre los años 60 y 80, cuando la demanda de tráfico era menor y los sistemas eran más simples e independientes.", "src": "Manual 8 de ENAIRE, apdo. 1.3.2, p. 13", "note": ""}, {"n": 30, "stem": "En la tabla Safety-I frente a Safety-II, ¿qué afirmación corresponde a Safety-II?", "opts": ["Que el mínimo posible de cosas salgan mal", "El ser humano se considera predominantemente una amenaza", "Reactivo: responder cuando algo sucede", "Proactivo: tratar continuamente de anticiparse a los eventos"], "ans": 3, "why": "Safety-II es proactivo y ve al ser humano como un recurso necesario para la resiliencia y la flexibilidad; A, B y C describen Safety-I.", "src": "Manual 8 de ENAIRE, tabla 1, p. 14", "note": ""}, {"n": 31, "stem": "Safety-II define la seguridad como:", "opts": ["que el máximo posible de cosas salgan bien", "que no se produzca ningún accidente", "el cumplimiento de todos los procedimientos", "que el riesgo se categorice como aceptable"], "ans": 0, "why": "Safety-I: que el mínimo posible de cosas salgan mal; Safety-II: que el máximo posible salgan bien.", "src": "Manual 8 de ENAIRE, tabla 1, p. 14", "note": ""}, {"n": 32, "stem": "La «racionalidad limitada» (<em>bounded rationality</em>), de Simon (1957), se refiere a que los operadores están restringidos en sus decisiones por:", "opts": ["el rango y la jerarquía", "la información limitada, la capacidad limitada de la mente y el tiempo limitado", "únicamente la legislación", "el sistema de turnos"], "ans": 1, "why": "El manual enumera la información limitada de ese momento, la capacidad limitada de la mente humana y el tiempo limitado.", "src": "Manual 8 de ENAIRE, apdo. 1.3.2, p. 13", "note": ""}, {"n": 33, "stem": "La brecha entre el sistema tal como se diseña y el sistema tal como se opera realmente se expresa como:", "opts": ["trabajo como se imagina frente a trabajo como se hace (<em>Work-As-Imagined</em> frente a <em>Work-As-Done</em>)", "amenaza frente a error", "presión frente a tensión", "desliz frente a lapsus"], "ans": 0, "why": "El trabajo como se imagina (WAI) es lo que debería ocurrir; el trabajo como se hace (WAD) es lo que realmente sucede.", "src": "Manual 8 de ENAIRE, apdo. 1.3.3, p. 14", "note": ""}, {"n": 34, "stem": "¿Qué ejemplo de brecha entre WAI y WAD da el manual?", "opts": ["La jubilación de los controladores", "La implementación prematura de nuevos sistemas en ATM", "El uso de la fraseología normalizada", "Los errores de predicción meteorológica"], "ans": 1, "why": "Provoca un comportamiento inesperado del sistema y alteraciones operativas, y obliga a una revisión en una fase táctica.", "src": "Manual 8 de ENAIRE, apdo. 1.3.3, p. 14", "note": ""}, {"n": 35, "stem": "¿Qué autor enumera variedades como el trabajo prescrito, divulgado, analizado, observado, simulado, instruido, medido y juzgado?", "opts": ["Steven Shorrock", "Herbert Simon", "Mica Endsley", "James Reason"], "ans": 0, "why": "El manual cita a Shorrock (2016) para estas ocho variedades adicionales del trabajo humano.", "src": "Manual 8 de ENAIRE, apdo. 1.3.3, p. 15", "note": ""}, {"n": 36, "stem": "¿Qué Reglamento establece los requisitos comunes para los proveedores de servicios ATM/ANS e incluye los requisitos de FFHH para los proveedores de servicios de control de tránsito aéreo en el anexo IV, sección 3?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 2015/340", "Reglamento (UE) 376/2014", "Reglamento (UE) 2015/1018"], "ans": 0, "why": "Reglamento de Ejecución (UE) 2017/373. El Reglamento 2015/340 trata de las licencias de los controladores; el 376/2014, de la notificación de sucesos; el 2015/1018 recoge la lista de sucesos de notificación obligatoria.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 15-16 y apdo. 5.6, p. 44", "note": ""}, {"n": 37, "stem": "¿Qué punto de ATS.OR exige al proveedor desarrollar y aplicar un procedimiento objetivo, transparente y no discriminador para el uso problemático de sustancias psicoactivas?", "opts": ["ATS.OR.300", "ATS.OR.320", "ATS.OR.310", "ATS.OR.305"], "ans": 3, "why": "ATS.OR.305 trata de las sustancias psicoactivas; el procedimiento debe ser aprobado por la autoridad competente.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 16", "note": ""}, {"n": 38, "stem": "ATS.OR.310 trata de:", "opts": ["el estrés, incluido un programa de gestión del estrés en incidentes críticos", "los sistemas de turnos", "la fatiga", "el ámbito de aplicación"], "ans": 0, "why": "ATS.OR.300, ámbito de aplicación; 305, sustancias psicoactivas; 310, estrés; 315, fatiga; 320, sistemas de turnos.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 17", "note": ""}, {"n": 39, "stem": "¿Qué punto regula los sistemas de turnos de los controladores?", "opts": ["ATS.OR.310", "ATS.OR.315", "ATS.OR.300", "ATS.OR.320"], "ans": 3, "why": "ATS.OR.320: el proveedor desarrolla, aplica y supervisa un sistema de turnos y especifica ocho elementos.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 17-18", "note": ""}, {"n": 40, "stem": "¿Cuántos elementos debe especificar el sistema de turnos según ATS.OR.320 a)?", "opts": ["Cinco", "Seis", "Diez", "Ocho"], "ans": 3, "why": "Ocho: días hábiles consecutivos, horas por periodo de servicio, duración del servicio ATC sin descansos, relación entre periodos de servicio y descansos, periodos de descanso mínimos, periodos de servicio consecutivos que incluyan la noche, descanso mínimo tras un servicio que incluya horas nocturnas y periodos de descanso mínimos en un mismo ciclo.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 17-18", "note": ""}, {"n": 41, "stem": "¿Cuál de los siguientes NO es uno de los elementos que debe especificar el sistema de turnos de ATS.OR.320?", "opts": ["El número máximo de horas por periodo de servicio", "La duración máxima del servicio de control del tránsito aéreo sin descansos", "El número mínimo de periodos de descanso en un mismo ciclo de turnos", "El número máximo de frecuencias de radio por sector"], "ans": 3, "why": "El número de frecuencias no figura entre los ocho elementos.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 17-18", "note": ""}, {"n": 42, "stem": "Según ATS.OR.320 b), el proveedor debe consultar:", "opts": ["a las compañías aéreas", "a los pasajeros", "a los controladores sujetos al sistema de turnos o a sus representantes", "a la agencia meteorológica nacional"], "ans": 2, "why": "Para identificar y mitigar los riesgos relacionados con la fatiga que pudieran deberse al propio sistema de turnos.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 18", "note": ""}, {"n": 43, "stem": "¿Qué punto sobre licencias del Reglamento (UE) 2015/340 remite ATS.OR.305 para que el proveedor lo tenga en cuenta?", "opts": ["ATCO.A.015", "ATCO.B.001", "ATCO.C.010", "ATCO.D.030"], "ans": 0, "why": "El procedimiento de detección tiene en cuenta el punto ATCO.A.015 del Reglamento 2015/340.", "src": "Manual 8 de ENAIRE, apdo. 1.4, p. 16", "note": ""}, {"n": 44, "stem": "El Reglamento (UE) 2015/340 (de 20 de febrero de 2015) establece:", "opts": ["normas sobre fatiga y turnos de trabajo", "requisitos comunes para los proveedores de servicios ATM/ANS", "la lista de sucesos de notificación obligatoria", "requisitos técnicos y procedimientos administrativos relativos a las licencias y los certificados de los controladores de tránsito aéreo"], "ans": 3, "why": "Especifica los conocimientos en materia de FFHH que deben tener los controladores; el 2017/373 es para los proveedores.", "src": "Manual 8 de ENAIRE, apdo. 1.5, p. 18", "note": ""}, {"n": 45, "stem": "¿Qué materia forma parte del contenido de FFHH de la formación básica de los ATCO que enumera el manual?", "opts": ["Introducción a los factores humanos", "Estructuras de aeronaves", "Cartografía", "Economía de las aerolíneas"], "ans": 0, "why": "Los cinco epígrafes son: introducción a los factores humanos, actuaciones humanas, error humano, comunicación y entorno de trabajo.", "src": "Manual 8 de ENAIRE, apdo. 1.5, p. 18", "note": ""}, {"n": 46, "stem": "¿Qué tema se incluye en los cursos de formación de habilitación dentro del «trabajo colaborativo»?", "opts": ["Mantenimiento de aeronaves", "Cooperación controlador/piloto", "Programación de las aerolíneas", "Precio de los billetes"], "ans": 1, "why": "Trabajo colaborativo: comunicación, trabajo colaborativo dentro de la misma área de responsabilidad y con otras áreas de responsabilidad, cooperación controlador/piloto.", "src": "Manual 8 de ENAIRE, apdo. 1.5, p. 19", "note": ""}, {"n": 47, "stem": "Según EUROCONTROL-FAA (2010), ¿qué proporción del coste final de un proyecto queda fijada en el primer 10 % de su ciclo de vida?", "opts": ["Aproximadamente el 20 %", "Aproximadamente el 40 %", "Aproximadamente el 55 %", "Aproximadamente el 70 %"], "ans": 3, "why": "Aproximadamente el 70 %, por lo que la intervención de los FFHH al principio es crítica.", "src": "Manual 8 de ENAIRE, apdo. 1.6, p. 21", "note": ""}, {"n": 48, "stem": "¿Cuál se cita como ámbito en el que una integración efectiva de los FFHH tiene un impacto positivo y medible?", "opts": ["La mejora de la seguridad, de la capacidad y de la eficiencia, la reducción de costes y el cumplimiento de la normativa", "El precio de los billetes", "El número de pistas", "El precio del combustible"], "ans": 0, "why": "El manual enumera la mejora de la seguridad, la optimización de la organización y de su personal, la mejora de la capacidad y de la eficiencia, la reducción de costes y el cumplimiento de la normativa.", "src": "Manual 8 de ENAIRE, apdo. 1.6, p. 19", "note": ""}, {"n": 49, "stem": "«El ser humano siempre es el porqué, y la tecnología el cómo» expresa que:", "opts": ["la tecnología es más importante que las personas", "las personas son solo usuarios", "el ser humano es siempre el «porqué» y la tecnología, el «cómo»", "los errores son siempre técnicos"], "ans": 2, "why": "Frase recogida en la descripción del sistema sociotécnico ATM.", "src": "Manual 8 de ENAIRE, apdo. 1.6, p. 20", "note": ""}, {"n": 50, "stem": "¿Qué programa se dice que se desarrolló bajo la premisa de que el factor humano es un pilar fundamental de los futuros sistemas ATM?", "opts": ["SESAR", "FAB", "Galileo", "CISM"], "ans": 0, "why": "El concepto operacional básico de SESAR.", "src": "Manual 8 de ENAIRE, apdo. 1.6, p. 20", "note": ""}, {"n": 51, "stem": "En la distinción que hace el manual, un equipo se diferencia de un grupo en que el equipo:", "opts": ["trabaja con un alto grado de control externo", "limita la comunicación al superior inmediato", "pone el énfasis solo en el resultado", "actúa con un alto grado de autonomía y se preocupa tanto del resultado como del proceso"], "ans": 3, "why": "El grupo tiene un alto grado de control externo, énfasis en el resultado y comunicación limitada al superior.", "src": "Manual 8 de ENAIRE, apdo. 2.1, p. 22", "note": ""}, {"n": 52, "stem": "Un «sistema de monitorización mutua» en un equipo significa que los miembros:", "opts": ["están supervisados únicamente por el jefe", "alertan a los demás de que se está alcanzando un límite operativo o de que alguien se desvía", "registran los errores de los demás para sancionarlos", "trabajan sin comunicarse"], "ans": 1, "why": "Es uno de los objetivos de la formación de equipos que enumera el manual.", "src": "Manual 8 de ENAIRE, apdo. 2.1, p. 23", "note": ""}, {"n": 53, "stem": "El TRM deriva de:", "opts": ["SHELL", "TEM", "CRM (gestión de recursos de la cabina o de la tripulación, <em>Cockpit/Crew Resource Management</em>)", "LOSA"], "ans": 2, "why": "El TRM (<em>Team Resource Management</em>, gestión de recursos de equipo) deriva del CRM.", "src": "Manual 8 de ENAIRE, apdo. 2.2, p. 23", "note": ""}, {"n": 54, "stem": "¿Cuántas categorías de habilidades TRM enumera el manual?", "opts": ["Cuatro", "Diez", "Ocho", "Seis"], "ans": 3, "why": "Trabajo en equipo; gestión de roles; comunicación interpersonal; conciencia situacional; resolución de problemas y toma de decisiones; gestión del estrés.", "src": "Manual 8 de ENAIRE, apdo. 2.2, p. 23", "note": ""}, {"n": 55, "stem": "¿Cuál NO es una de las seis categorías de habilidades TRM?", "opts": ["Comunicación interpersonal", "Conciencia situacional", "Gestión del estrés", "Planificación de turnos por fatiga"], "ans": 3, "why": "La planificación de turnos por fatiga no figura en la lista.", "src": "Manual 8 de ENAIRE, apdo. 2.2, p. 23", "note": ""}, {"n": 56, "stem": "El manual describe el TRM como:", "opts": ["un programa informático", "una licencia", "una filosofía de trabajo que trata de maximizar la eficiencia en las interacciones interpersonales y en el uso de los recursos personales", "un sistema de turnos"], "ans": 2, "why": "Emerge del reconocimiento de que los seres humanos somos proclives a cometer errores y estos no se pueden eliminar en su totalidad.", "src": "Manual 8 de ENAIRE, apdo. 2.2, p. 23", "note": ""}, {"n": 57, "stem": "Según el manual, ¿cuánto tiempo retiene la información la memoria a corto plazo?", "opts": ["De 20 a 30 segundos", "De 2 a 3 segundos", "5 minutos", "24 horas"], "ans": 0, "why": "Funciona como la memoria de trabajo de un ordenador; la memoria a largo plazo es ilimitada, pero necesita más tiempo.", "src": "Manual 8 de ENAIRE, apdo. 3.1, p. 24", "note": ""}, {"n": 58, "stem": "¿Qué método da el manual para consolidar la información en la memoria a largo plazo?", "opts": ["Dormir menos", "El ensayo repetitivo de una actividad", "La cafeína", "Leer una sola vez"], "ans": 1, "why": "Cuanto más se recurre a la información almacenada, más fácil resulta utilizarla de nuevo.", "src": "Manual 8 de ENAIRE, apdo. 3.1, p. 24", "note": ""}, {"n": 59, "stem": "En un entorno de radar, el manual dice que los sectores son gestionados por:", "opts": ["un supervisor y un piloto", "un controlador ejecutivo y un controlador planificador", "solo dos controladores ejecutivos", "solo un ayudante"], "ans": 1, "why": "Controlador ejecutivo y controlador planificador (<em>planner</em>).", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 25", "note": ""}, {"n": 60, "stem": "Los tres niveles de conciencia situacional de Endsley son:", "opts": ["percepción, comprensión, proyección", "amenaza, error, estado no deseado", "atención, memoria, juicio", "alerta, peligro, urgencia"], "ans": 0, "why": "Percepción de la situación, comprensión y proyección en el futuro.", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 25", "note": ""}, {"n": 61, "stem": "¿Qué autores describieron en la figura 6 los elementos que influyen en la conciencia situacional del controlador?", "opts": ["Sebastian y del Hoyo", "Lazarus y Folkman", "Isaac y Ruitenberg", "Cox y Mackay"], "ans": 2, "why": "Isaac y Ruitenberg (1997).", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 26-27", "note": ""}, {"n": 62, "stem": "Los controladores expresan de manera informal la dificultad para mantener la SA como:", "opts": ["«adelantarse al tráfico»", "«ver el tráfico»", "«ir por detrás del tráfico» o «perder el control»", "«limpiar la bahía»"], "ans": 2, "why": "«Ver» el tráfico y «adelantarse» a él describen tener SA.", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 26", "note": ""}, {"n": 63, "stem": "Según el manual, la SA se entiende mejor como:", "opts": ["una foto fija del espacio aéreo", "un modelo mental dinámico construido con la información percibida, sobre el cual se proyectan los cursos de acción", "lo mismo que la carga de trabajo", "un procedimiento fijo"], "ans": 1, "why": "El manual afirma que la SA no es una «foto fija», sino un modelo mental dinámico.", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 27", "note": ""}, {"n": 64, "stem": "¿Qué afirmación sobre las asunciones figura en el manual?", "opts": ["Las asunciones nunca se dan en el ATC", "La mayoría de los incidentes de tránsito aéreo presentan alguna asunción", "Las asunciones son siempre señal de incompetencia", "Las asunciones solo se dan en los pilotos"], "ans": 1, "why": "Cuando al modelo mental le falta información, la mente rellena el hueco, y el equipo es una fuente de información vital para hacer robusta la SA.", "src": "Manual 8 de ENAIRE, apdo. 3.2, p. 27", "note": ""}, {"n": 65, "stem": "El manual nombra tres dimensiones fundamentales de la carga de trabajo mental. ¿Qué lista es la correcta?", "opts": ["Presión temporal, recursos cognitivos de procesamiento que demanda la tarea, aspectos emocionales", "Velocidad, altura, distancia", "Ruido, luz, temperatura", "Selección, formación, carrera profesional"], "ans": 0, "why": "1 presión temporal de la tarea; 2 recursos cognitivos que demanda; 3 aspectos emocionales.", "src": "Manual 8 de ENAIRE, apdo. 3.3, p. 28", "note": ""}, {"n": 66, "stem": "Según la norma UNE-EN ISO 10075-2, la «tensión mental» (<em>mental strain</em>) es:", "opts": ["el conjunto de influencias externas que afectan a la persona", "el efecto inmediato de la presión mental (<em>stress</em>) en el individuo", "un sinónimo de carga de trabajo", "un tipo de fatiga"], "ans": 1, "why": "Presión mental (<em>stress</em>) = influencias externas; tensión (<em>strain</em>) = efecto inmediato en el individuo.", "src": "Manual 8 de ENAIRE, apdo. 3.3, p. 28", "note": ""}, {"n": 67, "stem": "La ley de Yerkes-Dodson describe la relación entre la activación y el rendimiento como:", "opts": ["una recta ascendente", "una recta descendente", "una U invertida", "una recta horizontal"], "ans": 2, "why": "El rendimiento es óptimo con una activación moderadamente elevada; si es demasiado alta o demasiado baja, los resultados empeoran.", "src": "Manual 8 de ENAIRE, apdo. 3.3, p. 28", "note": ""}, {"n": 68, "stem": "Según la figura de Yerkes-Dodson del manual, en una tarea compleja el pico de rendimiento se alcanza:", "opts": ["más tarde que en una tarea sencilla", "en el mismo punto que en una tarea sencilla", "nunca", "antes que en una tarea sencilla"], "ans": 3, "why": "El umbral de rendimiento máximo se alcanza antes cuando la tarea es compleja.", "src": "Manual 8 de ENAIRE, apdo. 3.3, p. 29", "note": ""}, {"n": 69, "stem": "¿Por qué un periodo de baja densidad de tráfico no es inocuo desde el punto de vista de los FFHH?", "opts": ["Porque una atención vigilante mantenida en la monitorización puede causar una fatiga tan alta como la de una carga de trabajo elevada, o más", "Porque hay más llamadas por radio", "Porque las aeronaves vuelan más rápido", "Porque empeora el tiempo"], "ans": 0, "why": "El manual dice que mantener una atención continuada en tareas de monitorización puede ocasionar una fatiga tan alta o más que en periodos de alta carga de trabajo mental.", "src": "Manual 8 de ENAIRE, apdo. 3.3, p. 29", "note": ""}, {"n": 70, "stem": "Según el manual, la complejidad impulsa la carga de trabajo mental del controlador, que a su vez limita:", "opts": ["la capacidad ATC", "la velocidad de las aeronaves", "el número de aeropuertos", "la duración de la licencia"], "ans": 0, "why": "La opinión de consenso es que la complejidad impulsa la carga de trabajo mental, lo que limita en última instancia la capacidad ATC.", "src": "Manual 8 de ENAIRE, apdo. 3.4, p. 29", "note": ""}, {"n": 71, "stem": "¿Cuál NO figura entre los factores que influyen en la complejidad del tráfico aéreo?", "opts": ["La congestión de la frecuencia", "El número de cartas de acuerdo asociadas a un sector", "La meteorología", "El color del uniforme del controlador"], "ans": 3, "why": "Los demás aparecen en la lista de factores (congestión de la frecuencia, número de cartas de acuerdo, meteorología...).", "src": "Manual 8 de ENAIRE, apdo. 3.4, p. 29-30", "note": ""}, {"n": 72, "stem": "¿Qué táctica utilizan los controladores en los conflictos complejos según el manual?", "opts": ["Elegir soluciones que requieran menos coordinaciones y usar la separación vertical en los conflictos más complejos", "Ignorar el conflicto", "Usar siempre esperas", "Traspasar el sector de inmediato"], "ans": 0, "why": "También dar más autorizaciones iniciales «seguras» y revisarlas después.", "src": "Manual 8 de ENAIRE, apdo. 3.4, p. 30-31", "note": ""}, {"n": 73, "stem": "¿Quién desarrolló en 2013 el prototipo de taxonomía de estrategias de mitigación de la complejidad de los controladores?", "opts": ["Kontogiannis y Malakis", "Lazarus y Folkman", "Mitchell y Everly", "Edwards y Hawkins"], "ans": 0, "why": "Kontogiannis y Malakis (2013), que especifica funciones cognitivas, estrategias y marcadores conductuales.", "src": "Manual 8 de ENAIRE, apdo. 3.4, p. 30", "note": ""}, {"n": 74, "stem": "¿Qué afirmación figura en el manual sobre la eficacia de la comunicación?", "opts": ["Un mensaje es eficaz cuando está bien expresado", "Un mensaje es eficaz cuando el receptor actúa como se pretendía (la comunicación en la organización es persuasiva)", "Un mensaje es eficaz cuando es largo", "Un mensaje es eficaz cuando el receptor guarda silencio"], "ans": 1, "why": "El propósito en las organizaciones es generar una acción común; un mensaje puede ser correcto y no ser eficaz.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 32-33", "note": ""}, {"n": 75, "stem": "¿Cuál NO es un componente de la comunicación de los que enumera el manual?", "opts": ["Emisor", "Canal", "Código", "Altitud"], "ans": 3, "why": "Se enumeran el emisor, el receptor, el mensaje, el canal, el mismo código y las barreras; se tratan también el ruido y el feedback.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 32-33", "note": ""}, {"n": 76, "stem": "El manual dice que el silencio como respuesta es:", "opts": ["nunca un mensaje", "un error", "en sí mismo un mensaje", "solo una barrera"], "ans": 2, "why": "El feedback no tiene por qué ser explícito.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 33", "note": ""}, {"n": 77, "stem": "¿Quién es responsable de asegurarse de que un mensaje ha llegado adecuadamente?", "opts": ["El receptor", "Quien comunica", "El supervisor", "Nadie"], "ans": 1, "why": "Si no ha llegado, debe buscar vías alternativas.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 32", "note": ""}, {"n": 78, "stem": "¿Qué concepto vincula el manual con la comprobación de que las interferencias no merman la ejecución del mensaje?", "opts": ["La colación (comprobación de lo recibido)", "La delegación", "El relevo", "El traspaso"], "ans": 0, "why": "Se introduce a raíz del ejemplo del destornillador.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 32", "note": ""}, {"n": 79, "stem": "¿Cuál es un factor que favorece la escucha activa?", "opts": ["Las interrupciones constantes", "El lenguaje corporal inhibidor", "Hacer pequeños resúmenes de lo que dice y siente la otra persona", "Abusar de las distracciones"], "ans": 2, "why": "También mantener el contacto visual y hacer preguntas abiertas.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 34", "note": ""}, {"n": 80, "stem": "¿Cuál de los siguientes es un factor que dificulta la escucha activa?", "opts": ["Hacer preguntas abiertas", "Mantener el contacto visual", "Hacer pequeños resúmenes", "Dejar los temas a medias"], "ans": 3, "why": "Otros: el lenguaje corporal inhibidor, las distracciones, las interrupciones constantes y los comentarios cortantes.", "src": "Manual 8 de ENAIRE, apdo. 4.1, p. 34", "note": ""}, {"n": 81, "stem": "El manual enumera tres tipos de barreras inherentes al ser humano:", "opts": ["ambientales, semánticas, verbales", "cognitivas, fisiológicas, psicológicas", "sociales, económicas, políticas", "verbales, no verbales, paraverbales"], "ans": 1, "why": "Las barreras ambientales son una categoría aparte (físicas, impersonales).", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 35", "note": ""}, {"n": 82, "stem": "Una persona que habla muy rápido o cuya lengua materna es diferente de la del receptor genera:", "opts": ["una barrera fisiológica", "una barrera psicológica", "una barrera verbal (cognitiva)", "una barrera ambiental"], "ans": 2, "why": "Las barreras verbales se incluyen entre las barreras cognitivas.", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 35", "note": ""}, {"n": 83, "stem": "Una voz débil o una pronunciación defectuosa en el emisor es un ejemplo de barrera:", "opts": ["fisiológica", "cognitiva", "semántica", "ambiental"], "ans": 0, "why": "Barreras fisiológicas: limitaciones del emisor (voz débil, pronunciación) o del receptor (sordera, problemas visuales).", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 35", "note": ""}, {"n": 84, "stem": "Los dos grandes antídotos para salvar las barreras de la comunicación que da el manual son:", "opts": ["la empatía y la asertividad", "la velocidad y el volumen", "la autoridad y el silencio", "la tecnología y el dinero"], "ans": 0, "why": "La empatía y la asertividad.", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 36", "note": ""}, {"n": 85, "stem": "La asertividad se define como la capacidad de:", "opts": ["estar siempre de acuerdo", "defender la propia postura y decir «no» sin atacar a la otra parte", "evitar todo conflicto guardando silencio", "imponer los propios derechos a los demás"], "ans": 1, "why": "Comunica los sentimientos y las necesidades sin herir ni ofender a los demás.", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 36", "note": ""}, {"n": 86, "stem": "En la figura del manual, ¿qué reacción consiste en pensar que los demás tienen más derechos que nosotros y en no expresar con honestidad nuestras ideas?", "opts": ["La asertividad", "La agresividad", "La empatía", "La pasividad"], "ans": 3, "why": "Pasividad; la agresividad defiende los derechos propios sin respetar los del otro.", "src": "Manual 8 de ENAIRE, apdo. 4.2, p. 37 (figura)", "note": ""}, {"n": 87, "stem": "Según Allan Pease (manual), ¿más de qué porcentaje de la comunicación puede suponer el lenguaje no verbal?", "opts": ["10 %", "20 %", "50 %", "95 %"], "ans": 2, "why": "Más del 50 %; con el paraverbal, el 80 %.", "src": "Manual 8 de ENAIRE, apdo. 4.3, p. 37", "note": ""}, {"n": 88, "stem": "¿A qué tipo de lenguaje pertenecen el volumen y el tono de voz en la clasificación de Pease?", "opts": ["Verbal", "Paraverbal", "No verbal", "Escrito"], "ans": 1, "why": "Verbal = las palabras; no verbal = gestos, posturas; paraverbal = volumen, tono.", "src": "Manual 8 de ENAIRE, apdo. 4.3, p. 37", "note": ""}, {"n": 89, "stem": "¿Cuál es una de las seis emociones básicas que enumera el manual?", "opts": ["Orgullo", "Envidia", "Asco", "Vergüenza"], "ans": 2, "why": "Tristeza, asco, sorpresa, ira, alegría, miedo.", "src": "Manual 8 de ENAIRE, apdo. 4.3, p. 38", "note": ""}, {"n": 90, "stem": "Según el manual, la fatiga es:", "opts": ["solo una sensación subjetiva", "un estado fisiológico objetivo; el cansancio es el elemento subjetivo", "lo mismo que el cansancio", "una enfermedad psicológica"], "ans": 1, "why": "El cansancio es la sensación del individuo en relación con su nivel de fatiga.", "src": "Manual 8 de ENAIRE, apdo. 5.7, p. 45", "note": ""}, {"n": 91, "stem": "El manual afirma que un adulto de 18 a 64 años debe dormir por término medio:", "opts": ["6 horas", "7 horas", "8 horas", "10 horas"], "ans": 2, "why": "Según la OMS y la National Sleep Foundation (EE. UU.).", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 39-40", "note": ""}, {"n": 92, "stem": "¿Cuántas fases tiene el sueño en el manual (incluida la REM)?", "opts": ["Tres", "Cuatro", "Seis", "Cinco"], "ans": 3, "why": "El sueño no-REM tiene cuatro fases, más la REM.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 40", "note": ""}, {"n": 93, "stem": "Un nuevo ciclo de sueño comienza aproximadamente cada:", "opts": ["30 minutos", "60 minutos", "90 a 100 minutos", "3 horas"], "ans": 2, "why": "Los últimos 20 o 30 minutos de cada ciclo corresponden a la fase REM.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 40", "note": ""}, {"n": 94, "stem": "¿Qué fase del sueño ocupa el 50 % del tiempo de sueño de un adulto?", "opts": ["Fase I", "Fase II", "Fase III", "Fase IV"], "ans": 1, "why": "Fase II: bloqueo sensorial y recuperación parcial.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 40", "note": ""}, {"n": 95, "stem": "¿En qué fase disminuyen del 10 al 30 % la tensión arterial y el ritmo respiratorio y aumenta la producción de la hormona del crecimiento?", "opts": ["Fase I", "Fase II", "REM", "Fase III"], "ans": 3, "why": "Fase III («delta»); despertar en ella causa confusión y desorientación.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 40", "note": ""}, {"n": 96, "stem": "La atonía muscular (parálisis) que impide materializar los sueños se produce en:", "opts": ["el sueño REM", "la fase I", "la fase II", "la fase IV"], "ans": 0, "why": "REM: sueños en forma de narración y actividad cerebral rápida, sin tono muscular.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 41", "note": ""}, {"n": 97, "stem": "Los estudios que cita el manual dicen que el descanso de los controladores durante el turno de noche en su lugar de trabajo es:", "opts": ["más profundo que en casa", "más ligero y con frecuencia interrumpido (de tipo no-REM)", "siempre REM", "imposible de medir"], "ans": 1, "why": "No puede compararse con el sueño en el domicilio.", "src": "Manual 8 de ENAIRE, apdo. 5.2, p. 41", "note": ""}, {"n": 98, "stem": "¿Qué es un microsueño según el manual?", "opts": ["Una siesta de una hora", "La fase IV del sueño", "Unos segundos en los que el cerebro «desconecta» y la persona se duerme", "Un sueño sin imágenes"], "ans": 2, "why": "Puede pasar desapercibido, pero el cerebro pierde la conexión con los estímulos exteriores.", "src": "Manual 8 de ENAIRE, apdo. 5.3, p. 41", "note": ""}, {"n": 99, "stem": "¿Con qué afecciones vincula el manual la privación continuada de sueño?", "opts": ["Obesidad, diabetes tipo 2 y afecciones cardiovasculares", "Miopía", "Pérdida de audición", "Alergias"], "ans": 0, "why": "Dormir adecuadamente es tan importante como comer de forma equilibrada o hacer deporte.", "src": "Manual 8 de ENAIRE, apdo. 5.3, p. 42", "note": ""}, {"n": 100, "stem": "Los tres procesos que regulan el sueño y la vigilia son:", "opts": ["circadiano (C), homeostático (S), de vigilia (W)", "alfa, beta, gamma", "REM, delta, theta", "sensorial, motor, cognitivo"], "ans": 0, "why": "C = reloj corporal de 24 horas, S = impulso de dormir según el tiempo de vigilia, W = inercia del sueño.", "src": "Manual 8 de ENAIRE, apdo. 5.4, p. 42", "note": ""}, {"n": 101, "stem": "El mínimo de la ventana circadiana (WOCL, <em>Window Of Circadian Low</em>) se produce aproximadamente:", "opts": ["entre las 9 y las 12 a. m.", "entre las 3 y las 6 a. m.", "entre las 3 y las 6 p. m.", "entre las 8 y las 11 p. m."], "ans": 1, "why": "Coincide con la temperatura basal mínima corporal, la mayor somnolencia y la menor capacidad de desempeño.", "src": "Manual 8 de ENAIRE, apdo. 5.4, p. 42", "note": ""}, {"n": 102, "stem": "El proceso de vigilia (W) refleja:", "opts": ["la deuda de sueño", "la temperatura corporal", "la inercia del sueño tras despertar", "el impulso de dormir"], "ans": 2, "why": "Un estado de transición con menor rendimiento inmediatamente después de despertar.", "src": "Manual 8 de ENAIRE, apdo. 5.4, p. 42", "note": ""}, {"n": 103, "stem": "El proceso homeostático (S) es el responsable de:", "opts": ["el patrón de temperatura de 24 horas", "los sueños", "la inercia del sueño", "el impulso de dormir, mayor cuanto más tiempo lleva despierta la persona"], "ans": 3, "why": "Con el trabajo nocturno, S y C se desajustan.", "src": "Manual 8 de ENAIRE, apdo. 5.4, p. 42", "note": ""}, {"n": 104, "stem": "¿Qué documento de la OACI define la fatiga en el manual y en qué año se publicó la edición citada?", "opts": ["Doc. 4444, 2016", "Doc. 9966, 2016", "Anexo 13, 1994", "Circular 314, 2005"], "ans": 1, "why": "Doc. 9966 de la OACI, <em>Manual para la supervisión de los enfoques de gestión de la fatiga</em> (2016).", "src": "Manual 8 de ENAIRE, apdo. 5.5, p. 43 y bibliografía p. 64", "note": ""}, {"n": 105, "stem": "Según el manual, ¿qué nivel de carga de trabajo da el mejor desempeño?", "opts": ["Muy bajo", "Medio", "Muy alto", "Nulo"], "ans": 1, "why": "Una carga baja puede provocar monotonía y aburrimiento; una carga elevada puede rebasar la capacidad de una persona fatigada.", "src": "Manual 8 de ENAIRE, apdo. 5.5, p. 43", "note": ""}, {"n": 106, "stem": "¿Qué consecuencia se asocia a un nivel de activación demasiado alto?", "opts": ["Mejores decisiones", "Reacción más rápida y precisa", "Más errores, mayor dificultad para tomar decisiones, mayor tiempo de reacción e incapacidad para asignar prioridades", "Mejor evaluación del riesgo"], "ans": 2, "why": "También tendencia a reducir la atención y el enfoque y a omitir información.", "src": "Manual 8 de ENAIRE, apdo. 5.5, p. 44", "note": ""}, {"n": 107, "stem": "¿Qué Reglamento, de 29 de junio de 2015, convierte la fatiga que afecta al desempeño seguro del ATC en un suceso de notificación obligatoria?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 376/2014", "Reglamento (UE) 2015/1018 (anexo III)", "Reglamento (UE) 2015/340"], "ans": 2, "why": "El anexo III trata de los sucesos relacionados con los servicios e instalaciones de navegación aérea.", "src": "Manual 8 de ENAIRE, apdo. 5.6, p. 44-45", "note": ""}, {"n": 108, "stem": "¿Cómo se llama el sistema integrado de gestión de riesgos de fatiga y estrés de ENAIRE?", "opts": ["CISM", "FRMS-ENAIRE", "SMS-HF", "FSRMS"], "ans": 3, "why": "<em>Fatigue and Stress Risk Management System</em>; el CISM es el programa de incidentes críticos.", "src": "Manual 8 de ENAIRE, apdo. 5.6, p. 45", "note": ""}, {"n": 109, "stem": "¿Qué elemento es un síntoma psicológico de la fatiga en el manual?", "opts": ["Enrojecimiento de los ojos", "Visión borrosa", "Alteración de la percepción del riesgo", "Ojos llorosos"], "ans": 2, "why": "Los síntomas oculares son fisiológicos.", "src": "Manual 8 de ENAIRE, apdo. 5.7, p. 45-46", "note": ""}, {"n": 110, "stem": "En la figura 9 (fatiga y seguridad operacional), ¿qué ocurre si el controlador NO es consciente de la fatiga?", "opts": ["Puede producirse un incidente de seguridad", "Se aplica una estrategia de primer nivel", "Se programa una siesta", "Termina el turno"], "ans": 0, "why": "Si es consciente, las estrategias de primer nivel (siesta, cafeína) previenen o reducen la fatiga y las de segundo nivel mitigan sus efectos.", "src": "Manual 8 de ENAIRE, apdo. 5.7, p. 46", "note": ""}, {"n": 111, "stem": "El manual agrupa en tres grandes grupos los aspectos afectados por el trabajo a turnos. ¿Cuál es uno de ellos?", "opts": ["Problemas salariales", "Dificultades en la vida familiar y social", "Dificultades de idioma", "La vivienda"], "ans": 1, "why": "Alteraciones del sueño; problemas de salud, tanto física como psicológica; dificultades en la vida familiar y social.", "src": "Manual 8 de ENAIRE, apdo. 5.7, p. 47", "note": ""}, {"n": 112, "stem": "Según el manual, ¿qué sueño es «el auténticamente reparador»?", "opts": ["El sueño diurno", "Las siestas", "El sueño nocturno", "El sueño en el lugar de trabajo"], "ans": 2, "why": "Su ausencia produce fatiga crónica.", "src": "Manual 8 de ENAIRE, apdo. 5.7, p. 47", "note": ""}, {"n": 113, "stem": "El estrés, en el manual, es una respuesta psicofisiológica que emerge cuando:", "opts": ["la persona está de vacaciones", "el organismo interpreta que sus recursos no son suficientes para adaptarse al estímulo", "no hay ningún estímulo", "la persona está dormida"], "ans": 1, "why": "Puede desencadenarse por estímulos externos o internos.", "src": "Manual 8 de ENAIRE, apdo. 6.1, p. 48", "note": ""}, {"n": 114, "stem": "Según Lazarus y Folkman, se genera eustrés cuando la persona:", "opts": ["tiene expectativas de poder gestionar el estímulo", "no dispone de recursos", "está fatigada", "sufre estrés agudo"], "ans": 0, "why": "El distrés surge si no tiene expectativas de poder gestionarlo.", "src": "Manual 8 de ENAIRE, apdo. 6.1, p. 48", "note": ""}, {"n": 115, "stem": "¿Qué modelo, basado en «Managing Stress in ATM» de EUROCONTROL, tiene en cuenta la demanda y la capacidad reales y la autopercepción del individuo?", "opts": ["El modelo transaccional de Cox-Mackay", "El modelo de Rasmussen", "El modelo de Endsley", "La taxonomía de Kontogiannis y Malakis"], "ans": 0, "why": "Figura 10 del manual.", "src": "Manual 8 de ENAIRE, apdo. 6.1, p. 49", "note": ""}, {"n": 116, "stem": "¿Cuál NO es uno de los cuatro estados del estrés en las tareas de control?", "opts": ["Hipoestrés", "Eustrés", "Hiperestrés", "Paraestrés"], "ans": 3, "why": "Los cuatro son hipoestrés, eustrés, hiperestrés y distrés.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 51-52", "note": ""}, {"n": 117, "stem": "Un controlador que se aburre y realiza una tarea rutinaria con poco interés y tensión se encuentra en:", "opts": ["hiperestrés", "hipoestrés", "eustrés", "distrés"], "ans": 1, "why": "Su desempeño puede ser pobre y las posibilidades de cometer errores, altas.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 51", "note": ""}, {"n": 118, "stem": "Según el manual, la memoria de trabajo no puede manejar más de:", "opts": ["dos o tres ítems", "seis o siete ítems", "veinte ítems", "cincuenta ítems"], "ans": 1, "why": "Se afirma en el párrafo sobre el hiperestrés.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 51", "note": ""}, {"n": 119, "stem": "Según EASA (GM1 ATS.OR.310), las tres fuentes principales de estrés en el ATC son:", "opts": ["los estresores ambientales/físicos, los relacionados con la tarea y los relativos al individuo", "el hambre, la sed y el ruido", "la meteorología, el tráfico y las radios", "los pilotos, los controladores y los supervisores"], "ans": 0, "why": "El manual cita el GM1 ATS.OR.310 <em>Stress</em> de EASA del Reglamento 2017/373.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 52", "note": ""}, {"n": 120, "stem": "¿Cuál es un estresor relacionado con la tarea en el manual?", "opts": ["La muerte de un ser querido", "El calor en la sala de operaciones", "El hambre", "La ambigüedad de roles"], "ans": 3, "why": "Los estresores relacionados con la tarea incluyen la alta carga de trabajo sostenida, los equipos poco fiables, la supervisión de personal en instrucción, la ambigüedad de roles y el conflicto interpersonal. El calor es ambiental; la muerte de un ser querido es individual.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 52-53", "note": ""}, {"n": 121, "stem": "La creencia de que los factores estresantes personales se pueden dejar en casa la califica el manual de:", "opts": ["política de la empresa", "mito", "norma", "requisito legal"], "ans": 1, "why": "Los factores estresantes personales acompañan cada día a los controladores en el trabajo.", "src": "Manual 8 de ENAIRE, apdo. 6.3, p. 53", "note": ""}, {"n": 122, "stem": "¿Qué efecto del estrés elevado menciona el manual?", "opts": ["Mejor preparación del plan B", "Tendencia a evitar tomar decisiones, que se posponen", "Mejor uso de la fraseología", "Menos adrenalina"], "ans": 1, "why": "También la fijación mental, la propensión a asumir más riesgos y el uso de procedimientos que ya no están operativos y de la lengua materna.", "src": "Manual 8 de ENAIRE, apdo. 6.4, p. 54-55", "note": ""}, {"n": 123, "stem": "Las siglas inglesas CISM corresponden a:", "opts": ["<em>Controller Incident Safety Method</em> (método de seguridad ante incidentes del controlador)", "<em>Critical Incident Stress Management</em> (gestión del estrés por incidente crítico)", "<em>Central Incident Safety Monitoring</em> (monitorización central de la seguridad ante incidentes)", "<em>Cognitive Intervention for Stress Mitigation</em> (intervención cognitiva para la mitigación del estrés)"], "ans": 1, "why": "Gestión del Estrés por Incidente Crítico.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 55", "note": ""}, {"n": 124, "stem": "El programa CISM se describe como:", "opts": ["obligatorio y disciplinario", "confidencial, voluntario y educativo, conocido como «primeros auxilios psicológicos»", "público y punitivo", "solo para pilotos"], "ans": 1, "why": "Es un proceso formal, muy estructurado y profesionalmente reconocido.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 55", "note": ""}, {"n": 125, "stem": "¿Cuál de los siguientes se da como ejemplo de incidente crítico en el ATC?", "opts": ["Un cambio de turno rutinario", "Una sesión de formación programada", "Una vulneración de las mínimas de separación", "Una actualización de software"], "ans": 2, "why": "También accidentes, aeronaves en emergencia, fallecimientos, situaciones cercanas a incidentes, violencia y hechos delictivos.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 55-56", "note": ""}, {"n": 126, "stem": "En el programa CISM de ENAIRE, un <em>peer</em> es:", "opts": ["un psicólogo contratado por ENAIRE", "un piloto", "un controlador de apoyo formado específicamente para atender psicológicamente a otros controladores", "un representante sindical"], "ans": 2, "why": "Se complementa con asistencia psicológica profesional cuando se estime necesario.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 56", "note": ""}, {"n": 127, "stem": "¿Qué organización marca las recomendaciones y los estándares que sigue la formación de los <em>peers</em>?", "opts": ["OACI", "ICISF (<em>International Critical Incident Stress Foundation</em>)", "EASA", "IATA"], "ans": 1, "why": "Los <em>peers</em> son voluntarios, seleccionados y formados siguiendo los estándares de la ICISF.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 56", "note": ""}, {"n": 128, "stem": "¿Cuál es una de las tres tareas principales de los <em>peers</em>?", "opts": ["Sancionar al controlador", "Investigar el accidente", "Sustituir al controlador de servicio", "Proporcionar intervención inmediata a la crisis"], "ans": 3, "why": "También el asesoramiento psicológico y la organización del apoyo profesional a la salud mental.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 56", "note": ""}, {"n": 129, "stem": "El perfil idóneo del <em>peer</em> incluye saber que su labor es:", "opts": ["dar terapia psicológica profesional", "proporcionar primeros auxilios, no asistencia psicológica profesional", "decidir las sanciones", "enseñar fraseología"], "ans": 1, "why": "Es uno de los once puntos del perfil que recomienda EUROCONTROL (1997, 2008).", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 57", "note": ""}, {"n": 130, "stem": "¿Cuántas fases tiene el resumen del programa CISM?", "opts": ["Tres", "Cuatro", "Cinco", "Siete"], "ans": 2, "why": "Comunicación y divulgación; selección y formación de los <em>peers</em>; intervención del <em>peer</em>; derivación a un profesional; evaluación periódica.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 57-58", "note": ""}, {"n": 131, "stem": "La fase final del programa CISM es:", "opts": ["la evaluación periódica del programa", "la selección de los <em>peers</em>", "la comunicación", "la derivación a un médico"], "ans": 0, "why": "Cuestionarios anónimos e informe anual.", "src": "Manual 8 de ENAIRE, apdo. 6.5, p. 58", "note": ""}, {"n": 132, "stem": "El manual define el error, en un contexto operacional, como:", "opts": ["un acto punible", "una transgresión", "una situación en la que una secuencia planificada de acciones no consigue lograr el objetivo", "un accidente"], "ans": 2, "why": "En el sistema ATC, «error» se refiere a toda la organización.", "src": "Manual 8 de ENAIRE, apdo. 7, p. 58", "note": ""}, {"n": 133, "stem": "En el GEMS, un desliz (<em>slip</em>) es:", "opts": ["una acción intencional debida a un error de planificación", "una acción no intencional debida a un fallo o laguna en la atención", "una acción no intencional debida a un fallo de memoria", "una transgresión deliberada"], "ans": 1, "why": "Por ejemplo, una omisión, una inversión o una alteración en el orden o el tiempo de una secuencia.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 59", "note": ""}, {"n": 134, "stem": "En el GEMS, ¿qué tipo de error es el más frecuente?", "opts": ["Los deslices", "Las equivocaciones", "Los lapsus", "Las transgresiones"], "ans": 2, "why": "Los lapsus son fallos mnemónicos.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 59", "note": ""}, {"n": 135, "stem": "Una equivocación (<em>mistake</em>) en el GEMS es:", "opts": ["no intencional, debida a la atención", "no intencional, debida a la memoria", "una infracción deliberada de las reglas", "intencional, debida a la planificación: aplicación incorrecta de una regla correcta o aplicación correcta de una regla en una situación inadecuada"], "ans": 3, "why": "Las equivocaciones parten de decisiones basadas en conocimiento, experiencia y modelos mentales.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 59", "note": ""}, {"n": 136, "stem": "¿Cómo sugiere el manual mitigar los lapsus?", "opts": ["Con refrescos frecuentes de la información y ayudas cognitivas externas", "Con más llamadas por radio", "Hablando más rápido", "Ignorándolos"], "ans": 0, "why": "Por ejemplo, anotar en la etiqueta de la ficha o en un papel.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 59", "note": ""}, {"n": 137, "stem": "¿Cuál de estos es un sesgo cognitivo que nombra el manual?", "opts": ["El sesgo de continuidad de plan", "El sesgo meteorológico", "El sesgo de velocidad", "El sesgo de radio"], "ans": 0, "why": "También el sesgo de expectativa y el sesgo de familiaridad.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 60", "note": ""}, {"n": 138, "stem": "Los sesgos cognitivos tienen su origen en:", "opts": ["solo la fatiga", "procesos mentales heurísticos que generan reglas rápidas del tipo «si A, entonces B»", "el ruido", "la legislación"], "ans": 1, "why": "Son adaptativos, pero pueden interferir en un entorno complejo como el ATM.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 60", "note": ""}, {"n": 139, "stem": "¿Cuántas grandes familias de sesgos distingue el manual?", "opts": ["Dos", "Tres", "Cuatro", "Seis"], "ans": 2, "why": "Qué debo recordar; filtrar la información; actuar rápido; información sin suficiente significado.", "src": "Manual 8 de ENAIRE, apdo. 7.1, p. 60", "note": ""}, {"n": 140, "stem": "El TEM fue desarrollado por:", "opts": ["EUROCONTROL", "la OACI", "la IATA", "AESA"], "ans": 1, "why": "El manual dice que es un concepto de la OACI.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 60", "note": ""}, {"n": 141, "stem": "En el TEM, las amenazas son:", "opts": ["errores cometidos por el controlador", "los resultados de los accidentes", "errores externos o incidencias que aumentan la complejidad y no han sido propiciados por el controlador", "siempre previsibles"], "ans": 2, "why": "Por ejemplo, indicativos de llamada similares o condiciones meteorológicas adversas; pueden ser previsibles o imprevistas.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 61", "note": ""}, {"n": 142, "stem": "Un piloto que copia las instrucciones transmitidas a otra aeronave se da como ejemplo de:", "opts": ["un estado no deseado", "una amenaza previsible", "un lapsus", "una amenaza imprevista"], "ans": 3, "why": "Una amenaza inesperada exige la pericia del controlador; la meteorología adversa es una amenaza previsible.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 61", "note": ""}, {"n": 143, "stem": "Una aeronave que asciende a un nivel de vuelo no autorizado es un ejemplo de:", "opts": ["un estado no deseado", "una amenaza previsible", "una consecuencia (accidente)", "un lapsus"], "ans": 0, "why": "Es una situación en la que ha fallado la planificación y se reducen los márgenes de seguridad; todavía puede recuperarse.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 62", "note": ""}, {"n": 144, "stem": "¿Qué diferencia un estado no deseado del resultado en el TEM?", "opts": ["Nada", "En un estado no deseado la situación aún puede resolverse; una vez producido el resultado, ya no se puede volver atrás", "El resultado puede revertirse, pero el estado no deseado no", "Los estados no deseados solo se dan en los pilotos"], "ans": 1, "why": "El manual dice que, una vez que se produce el resultado, no se puede deshacer.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 62", "note": ""}, {"n": 145, "stem": "Según el manual, el control del tránsito aéreo consiste, de forma implícita, en:", "opts": ["la detección de estados no deseados", "la prevención de todas las amenazas", "la eliminación de todos los errores", "la presentación de informes"], "ans": 0, "why": "Tanto los que aparecen de forma natural por la evolución del tráfico como los que genera la propia actuación ATC.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 62", "note": ""}, {"n": 146, "stem": "¿Qué supone el TEM respecto a los errores y las amenazas?", "opts": ["Que se pueden eliminar con formación", "Que no se pueden eliminar, por lo que hacen falta estrategias para afrontarlos", "Que los causan siempre los pilotos", "Que están siempre ligados de forma lineal"], "ans": 1, "why": "La relación Amenaza-Error-Estado no deseado no es siempre directa ni lineal.", "src": "Manual 8 de ENAIRE, apdo. 7.2, p. 61-62", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/08-factores-humanos/test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
