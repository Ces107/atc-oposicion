<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Factores humanos</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

><symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Factores humanos</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Factores humanos</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el Doc. 10151 de la OACI, tal como lo cita el manual de ENAIRE, las actuaciones humanas (<em>human performance</em>) son:", "opts": ["la aplicación del conocimiento sobre las capacidades humanas al diseño del equipamiento", "la selección del personal adecuado por parte de la organización", "el estudio físico y fisiológico del trabajador", "cómo realizan las personas sus actividades, es decir, la contribución humana al funcionamiento del sistema"], "ans": 3, "why": "Las actuaciones humanas son cómo realizan las personas sus actividades. La opción A es la definición de factores humanos; la C es el énfasis de la ergonomía; la B es un factor organizacional más.", "src": "Manual 8 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 2, "stem": "Según el manual, ¿qué énfasis distingue a la ergonomía de los factores humanos fuera del ámbito de la aviación?", "opts": ["La ergonomía se asocia más a los aspectos físicos o fisiológicos, y los factores humanos, más a los aspectos psicológicos", "La ergonomía se asocia a la organización, y los factores humanos, al equipamiento", "La ergonomía estudia solo los accidentes, y los factores humanos, solo los incidentes", "No hay diferencia de énfasis en ningún ámbito"], "ans": 0, "why": "El manual dice que los factores humanos se asocian más a menudo con los aspectos psicológicos y la ergonomía, con los aspectos físicos o fisiológicos.", "src": "Manual 8 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 3, "stem": "Según el manual, Reason introdujo a mediados de 1990 una visión sistémica de la seguridad operacional. ¿Qué modelo suyo fue clave para introducir en cualquier industria qué concepto?", "opts": ["El modelo SHELL y el concepto de elemento humano (<em>liveware</em>)", "La curva de Yerkes-Dodson y el concepto de activación", "El modelo TEM y el concepto de estado no deseado", "El modelo del queso suizo y el concepto de accidente organizacional"], "ans": 3, "why": "El modelo del queso suizo introdujo el accidente organizacional, que tiene en cuenta el impacto de la cultura y las políticas de la organización en los controles de riesgos.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 4, "stem": "En el modelo del queso suizo, el suceso se produce cuando:", "opts": ["todas las capas de protección se eliminan a propósito", "un solo controlador comete un error", "los agujeros de las capas de protección se alinean", "las condiciones meteorológicas son adversas"], "ans": 2, "why": "Cada capa tiene debilidades (agujeros); el suceso ocurre cuando se alinean. Los factores organizacionales pueden crear condiciones latentes que determinen una falla de las defensas.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, p. 5", "note": ""}, {"n": 5, "stem": "Según el manual, ¿cuál es la «mayor y menos conocida» aportación de Reason?", "opts": ["El modelo del queso suizo y el accidente organizacional", "El modelo SHELL y sus interfaces con el elemento humano", "El enfoque Safety-II y el principio de equivalencia", "Su investigación del error humano, que dio el modelo GEMS"], "ans": 3, "why": "El manual considera su labor investigadora sobre los errores humanos, que dio lugar al modelo GEMS, su mayor y menos conocida aportación.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, p. 6", "note": ""}, {"n": 6, "stem": "El modelo de Rasmussen explica la conducta humana mediante tres modos. ¿Qué lista es la correcta?", "opts": ["Desliz, lapsus, equivocación", "Amenaza, error, estado no deseado", "Basada en habilidades, basada en reglas, basada en conocimiento", "Percepción, comprensión, proyección"], "ans": 2, "why": "Los tres modos de Rasmussen son basado en habilidades, basado en reglas y basado en conocimiento; la A corresponde al GEMS, la B al TEM y la D a la conciencia situacional de Endsley.", "src": "Manual 8 (nov. 2026), capítulo 1.2.2, p. 6-7", "note": ""}, {"n": 7, "stem": "¿Qué conducta de Rasmussen se aplica a un controlador que aplica de forma rutinaria los procedimientos operativos en frecuencia, en situaciones conocidas pero no frecuentes?", "opts": ["Basada en habilidades", "Basada en emociones", "Basada en reglas", "Basada en conocimiento"], "ans": 2, "why": "La conducta basada en reglas implica la selección consciente de reglas para situaciones conocidas pero no frecuentes, como en el ejemplo del manual de la aplicación de procedimientos operativos.", "src": "Manual 8 (nov. 2026), capítulo 1.2.2, p. 7", "note": ""}, {"n": 8, "stem": "El manual pone «decidir ante una emergencia o una situación inusual en frecuencia, activando el conocimiento para aplicarlo de forma novedosa» como ejemplo de:", "opts": ["conducta basada en habilidades", "conducta basada en reglas", "un desliz", "conducta basada en conocimiento"], "ans": 3, "why": "Al no haber reglas almacenadas, hace falta un gran esfuerzo consciente de análisis: es la conducta basada en conocimiento.", "src": "Manual 8 (nov. 2026), capítulo 1.2.2, p. 7", "note": ""}, {"n": 9, "stem": "En el apartado 1.2.3 del manual, ¿qué autores y años acompañan entre paréntesis al modelo SHELL?", "opts": ["Edwards 1972, Hawkins 1993", "Reason 1990, Rasmussen 1983", "Endsley 1995, Isaac 1997", "Hollnagel 2009, Dekker 2006"], "ans": 0, "why": "El manual escribe «El modelo SHELL (Edwards 1972, Hawkins 1993)»; la OACI lo propuso formalmente en la Circular 216-AN31. Las fuentes primarias (Circular 216-AN/131, CAP 719) datan la versión de Hawkins en 1975; en el examen manda el texto del manual.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 10, "stem": "¿Qué añade a SHELL la versión actualizada SHELL-O?", "opts": ["Operaciones", "Observación", "Organización", "Supervisión"], "ans": 2, "why": "La O corresponde a Organización (<em>Organization</em>) y añade los factores organizacionales como parte del sistema.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 11, "stem": "En SHELL-O, el «software» (soporte lógico) se refiere principalmente a:", "opts": ["los procedimientos", "los sistemas técnicos", "las condiciones meteorológicas", "el elemento humano"], "ans": 0, "why": "El manual glosa la S como Software: soporte lógico (procedimientos); la H como Hardware: soporte físico (sistemas técnicos); la E como entorno y la L como elemento humano.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 12, "stem": "¿Qué componente ocupa el centro de SHELL-O y es el más flexible?", "opts": ["El soporte físico (<em>hardware</em>)", "La organización", "El entorno", "El elemento humano (<em>liveware</em>)"], "ans": 3, "why": "El ser humano (L) está en el centro; el resto de los componentes deben ajustarse a él.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 13, "stem": "La interfaz L-H de SHELL-O representa:", "opts": ["la relación entre el controlador y los reglamentos, manuales y listas de verificación", "la relación entre los individuos, el liderazgo y la cultura", "la interfaz entre el ser humano y «la máquina»: consolas, pantallas, alarmas, ergonomía", "la relación con las condiciones meteorológicas externas"], "ans": 2, "why": "L-S son los procedimientos y manuales, L-E es el entorno (temperatura, ruido, meteorología) y L-L es el liderazgo, la cooperación y la cultura.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 14, "stem": "La interfaz L-L del manual incluye:", "opts": ["las consolas, las pantallas, las alarmas y la ergonomía", "los reglamentos, los manuales y las listas de verificación", "la temperatura, el ruido y el ambiente empresarial", "el liderazgo, la cooperación, el TRM y la cultura empresarial"], "ans": 3, "why": "L-L es la relación del individuo con el resto de las personas en el lugar de trabajo: liderazgo, cooperación, trabajo en equipo (TRM), relaciones entre personal operativo y de gestión y cultura empresarial. Ojo: el «ambiente empresarial» es entorno interno (L-E); A es L-H y B es L-S.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 15, "stem": "En SHELL-O, según el manual, ¿qué peso tienen en el sistema los factores derivados de la organización (O) y de qué se ocupa en particular esa relación?", "opts": ["Un peso menor; de la normativa europea sobre licencias y certificados de controlador", "El mismo peso que el resto; del reparto de tareas entre ejecutivo y planificador", "Un peso menor; de los indicadores de rendimiento (KPI) de cada sector de control", "Un mayor peso específico; de las políticas sobre procedimientos, sistemas y personas"], "ans": 3, "why": "El manual dice que los factores derivados de la propia organización tienen un mayor peso específico en el sistema y que esa relación se ocupa en particular de las políticas organizacionales que determinan cómo se gestionan los procedimientos y sus cambios, los sistemas técnicos y las personas. El manual no presenta lo segundo como la causa de lo primero.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 16, "stem": "Los factores psicosociales, según el manual, son:", "opts": ["los sistemas técnicos y equipos del sector de control", "el entorno físico de la torre: luz, ruido y temperatura", "factores externos del sistema social de la persona, dentro o fuera del trabajo", "las tareas asignadas al controlador ejecutivo y al planificador"], "ans": 2, "why": "Influyen en el enfoque personal de la situación laboral y en la capacidad de manejar el estrés y las situaciones anómalas (OACI, 2002).", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 17, "stem": "¿Cuál de los siguientes NO es uno de los ocho factores organizacionales que enumera el manual en el apartado 1.3.1?", "opts": ["La adecuación de los recursos humanos", "La selección del personal adecuado", "La gestión de riesgos", "Las actuaciones de la aeronave"], "ans": 3, "why": "La lista es: recursos humanos, selección del personal, formación, bienestar laboral, eficiencia en la gestión de procesos y proyectos, planificación y organización del personal, gestión de riesgos, cultura de la organización y comunicación.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 9", "note": ""}, {"n": 18, "stem": "¿Por qué dice el manual que la expresión «error humano» no ayuda a gestionar el riesgo?", "opts": ["Porque los controladores rara vez cometen errores en frecuencia", "Porque solo puede aplicarse a los pilotos y no a los controladores", "Porque los errores son siempre deliberados y deben sancionarse", "Porque debería ser el punto de partida para ver dónde colapsa el sistema"], "ans": 3, "why": "Las investigaciones de accidentes demuestran que muy rara vez el error de un individuo que actúa aisladamente precipita un accidente.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 9", "note": ""}, {"n": 19, "stem": "El manual dice que el concepto de error humano es un «constructo social» porque:", "opts": ["lo define cada organización en su manual de operaciones", "solo existe en los informes de investigación jurídica", "su calificación depende más de las consecuencias que de la acción", "se mide con indicadores de rendimiento (KPI) de la organización"], "ans": 2, "why": "Una instrucción errónea que se corrige a tiempo rara vez se considera un error, aunque no se diferencia de otra que acaba en incidente.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 10", "note": ""}, {"n": 20, "stem": "¿Qué documento de la OACI adoptó formalmente, en 1994, el enfoque sistémico en la investigación de sucesos?", "opts": ["El Anexo 11", "El Anexo 13", "El Doc. 9966", "La Circular 216"], "ans": 1, "why": "El manual dice que el enfoque sistémico en la investigación de sucesos fue adoptado formalmente por la OACI (1994) en el Anexo 13.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 10", "note": ""}, {"n": 21, "stem": "¿Quién propuso los diez principios de «Systems Thinking for Safety» que cita el manual y en qué año?", "opts": ["EASA, 2017", "OACI, 1994", "EUROCONTROL, 2014", "ENAIRE, 2023"], "ans": 2, "why": "EUROCONTROL (2014); el documento técnico «Systems Thinking for Safety: Ten Principles».", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 11, y capítulo 8 (bibliografía), p. 63", "note": ""}, {"n": 22, "stem": "¿Cuál es el principio sistémico número 3 de EUROCONTROL?", "opts": ["Racionalidad local", "Implicación de los expertos en la materia", "Contrapartidas", "Cultura justa"], "ans": 3, "why": "El orden es: 1 implicación de los expertos en la materia (<em>field expert involvement</em>), 2 racionalidad local, 3 cultura justa, 4 demanda y presión, 5 recursos y limitaciones, 6 interacciones y flujos, 7 contrapartidas, 8 variabilidad del rendimiento, 9 emergencia, 10 equivalencia.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 11-12", "note": ""}, {"n": 23, "stem": "¿Qué principio establece que cada persona actúa en función de sus propios objetivos, limitaciones y contexto?", "opts": ["Racionalidad local", "Equivalencia", "Emergencia", "Demanda y presión"], "ans": 0, "why": "Principio 2, racionalidad local (<em>local rationality</em>).", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 11", "note": ""}, {"n": 24, "stem": "El principio según el cual el éxito y el fracaso se originan en los mismos procesos es:", "opts": ["Interacciones y flujos", "Variabilidad del rendimiento", "Recursos y limitaciones", "Equivalencia"], "ans": 3, "why": "Principio 10, equivalencia: el resultado no está ligado necesariamente a las acciones que lo desencadenan.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 25, "stem": "¿Qué principio dice que, en los sistemas sociotécnicos complejos, una pequeña acción puede tener grandes efectos y los resultados pueden ser inesperados?", "opts": ["Emergencia", "Contrapartidas", "Cultura justa", "Implicación de los expertos en la materia"], "ans": 0, "why": "Principio 9, emergencia (emergencia del sistema).", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 26, "stem": "¿Qué principio se refiere a que los profesionales equilibran la eficiencia y la precisión para resolver objetivos contrapuestos?", "opts": ["Demanda y presión", "Emergencia", "Racionalidad local", "Contrapartidas (<em>trade-offs</em>)"], "ans": 3, "why": "Principio 7, contrapartidas.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 27, "stem": "¿Qué principio pide identificar la variabilidad deseada y la no deseada para mejorar el desempeño y la tolerancia del sistema?", "opts": ["Variabilidad del rendimiento", "Equivalencia", "Interacciones y flujos", "Cultura justa"], "ans": 0, "why": "Principio 8, variabilidad del rendimiento (<em>performance variability</em>).", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 28, "stem": "Según el principio «Demanda y presión» de EUROCONTROL, el binomio demanda-presión afecta de forma directa a:", "opts": ["la edad de jubilación", "el color de las pantallas", "la elección del aeropuerto", "el desempeño, en relación con la eficiencia y la capacidad"], "ans": 3, "why": "El manual dice que el binomio demanda-presión, en relación con la eficiencia y la capacidad, afecta de forma directa y fundamental al desempeño.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 29, "stem": "¿En qué décadas se desarrolló principalmente la visión Safety-I?", "opts": ["De 1920 a 1939", "De 1990 a 2009", "De 1960 a 1989", "En la década de 2010"], "ans": 2, "why": "Entre los años 60 y 80, cuando la demanda de tráfico era menor y los sistemas eran más simples e independientes.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 30, "stem": "En la tabla Safety-I frente a Safety-II, ¿qué afirmación corresponde a Safety-II?", "opts": ["Que el mínimo posible de cosas salgan mal", "El ser humano se considera predominantemente una amenaza", "Reactivo: responder cuando algo sucede", "Proactivo: tratar continuamente de anticiparse a los eventos"], "ans": 3, "why": "Safety-II es proactivo y ve al ser humano como un recurso necesario para la resiliencia y la flexibilidad; A, B y C describen Safety-I.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, tabla 1, p. 14", "note": ""}, {"n": 31, "stem": "Safety-II define la seguridad como:", "opts": ["que el máximo posible de cosas salgan bien", "que no se produzca ningún accidente", "el cumplimiento de todos los procedimientos", "que el riesgo se categorice como aceptable"], "ans": 0, "why": "Safety-I: que el mínimo posible de cosas salgan mal; Safety-II: que el máximo posible salgan bien.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, tabla 1, p. 14", "note": ""}, {"n": 32, "stem": "La «racionalidad limitada» (<em>bounded rationality</em>), de Simon (1957), se refiere a que los operadores están restringidos en sus decisiones por:", "opts": ["la jerarquía, la normativa y la presión de la organización", "la información, la capacidad de la mente y el tiempo, todos limitados", "la legislación, los procedimientos y las cartas de acuerdo", "el sistema de turnos, la fatiga y la carga de trabajo"], "ans": 1, "why": "El manual enumera la información limitada de ese momento, la capacidad limitada de la mente humana y el tiempo limitado.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 33, "stem": "La brecha entre el sistema tal como se diseña y el sistema tal como se opera realmente se expresa como:", "opts": ["<em>Work-As-Imagined</em> frente a <em>Work-As-Done</em>", "amenaza (<em>threat</em>) frente a error (<em>error</em>)", "presión (<em>stress</em>) frente a tensión (<em>strain</em>)", "desliz (<em>slip</em>) frente a lapsus de memoria"], "ans": 0, "why": "El trabajo como se imagina (WAI) es lo que debería ocurrir; el trabajo como se hace (WAD) es lo que realmente sucede.", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 14", "note": ""}, {"n": 34, "stem": "¿Qué ejemplo de brecha entre WAI y WAD da el manual?", "opts": ["La jubilación de los controladores", "La implementación prematura de nuevos sistemas en ATM", "El uso de la fraseología normalizada", "Los errores de predicción meteorológica"], "ans": 1, "why": "Provoca un comportamiento inesperado del sistema y alteraciones operativas, y obliga a una revisión en una fase táctica.", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 14", "note": ""}, {"n": 35, "stem": "¿Qué autor enumera variedades como el trabajo prescrito, divulgado, analizado, observado, simulado, instruido, medido y juzgado?", "opts": ["Steven Shorrock", "Herbert Simon", "Mica Endsley", "James Reason"], "ans": 0, "why": "El manual atribuye a Steven Shorrock estas ocho variedades adicionales del trabajo humano (nota al pie con su artículo «The varieties of human work»).", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 15", "note": ""}, {"n": 36, "stem": "¿Qué Reglamento establece los requisitos comunes para los proveedores de servicios ATM/ANS e incluye los requisitos de FFHH para los proveedores de servicios de control de tránsito aéreo en el anexo IV, sección 3?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 2015/340", "Reglamento (UE) 376/2014", "Reglamento (UE) 2015/1018"], "ans": 0, "why": "Reglamento de Ejecución (UE) 2017/373. El Reglamento 2015/340 trata de las licencias de los controladores; el 376/2014, de la notificación de sucesos; el 2015/1018 recoge la lista de sucesos de notificación obligatoria.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 15-16, y capítulo 5.6, p. 44", "note": ""}, {"n": 37, "stem": "¿Qué punto de ATS.OR exige al proveedor desarrollar y aplicar un procedimiento objetivo, transparente y no discriminador para el uso problemático de sustancias psicoactivas?", "opts": ["ATS.OR.300", "ATS.OR.320", "ATS.OR.310", "ATS.OR.305"], "ans": 3, "why": "ATS.OR.305 trata de las sustancias psicoactivas; el procedimiento debe ser aprobado por la autoridad competente.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 38, "stem": "ATS.OR.310 trata de:", "opts": ["el estrés, incluido un programa de gestión del estrés en incidentes críticos", "los sistemas de turnos", "la fatiga", "el ámbito de aplicación"], "ans": 0, "why": "ATS.OR.300, ámbito de aplicación; 305, sustancias psicoactivas; 310, estrés; 315, fatiga; 320, sistemas de turnos.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17", "note": ""}, {"n": 39, "stem": "¿Qué punto regula los sistemas de turnos de los controladores?", "opts": ["ATS.OR.310", "ATS.OR.315", "ATS.OR.300", "ATS.OR.320"], "ans": 3, "why": "ATS.OR.320: el proveedor desarrolla, aplica y supervisa un sistema de turnos y especifica ocho elementos.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17-18", "note": ""}, {"n": 40, "stem": "¿Cuántos elementos debe especificar el sistema de turnos según ATS.OR.320 a)?", "opts": ["Cinco", "Seis", "Diez", "Ocho"], "ans": 3, "why": "Ocho: días hábiles consecutivos, horas por periodo de servicio, duración del servicio ATC sin descansos, relación entre periodos de servicio y descansos, periodos de descanso mínimos, periodos de servicio consecutivos que incluyan la noche, descanso mínimo tras un servicio que incluya horas nocturnas y periodos de descanso mínimos en un mismo ciclo.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17-18", "note": ""}, {"n": 41, "stem": "¿Cuál de los siguientes NO es uno de los elementos que debe especificar el sistema de turnos de ATS.OR.320?", "opts": ["El número máximo de horas por periodo de servicio", "La duración máxima del servicio de control del tránsito aéreo sin descansos", "El número mínimo de periodos de descanso en un mismo ciclo de turnos", "El número máximo de frecuencias de radio por sector"], "ans": 3, "why": "El número de frecuencias no figura entre los ocho elementos.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17-18", "note": ""}, {"n": 42, "stem": "Según ATS.OR.320 b), el proveedor debe consultar:", "opts": ["a las compañías aéreas", "a los pasajeros", "a los controladores sujetos al sistema de turnos o a sus representantes", "a la agencia meteorológica nacional"], "ans": 2, "why": "Para identificar y mitigar los riesgos relacionados con la fatiga que pudieran deberse al propio sistema de turnos.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 18", "note": ""}, {"n": 43, "stem": "¿Qué punto sobre licencias del Reglamento (UE) 2015/340 remite ATS.OR.305 para que el proveedor lo tenga en cuenta?", "opts": ["ATCO.A.015", "ATCO.B.001", "ATCO.C.010", "ATCO.D.030"], "ans": 0, "why": "El procedimiento de detección tiene en cuenta el punto ATCO.A.015 del Reglamento 2015/340.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 44, "stem": "El Reglamento (UE) 2015/340 (de 20 de febrero de 2015) establece:", "opts": ["normas sobre fatiga y turnos de trabajo de los controladores", "requisitos comunes para los proveedores de servicios ATM/ANS", "la lista de sucesos de notificación obligatoria", "requisitos técnicos y administrativos de las licencias de los ATCO"], "ans": 3, "why": "Especifica los conocimientos en materia de FFHH que deben tener los controladores; el 2017/373 es para los proveedores.", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 18", "note": ""}, {"n": 45, "stem": "¿Qué materia forma parte del contenido de FFHH de la formación básica de los ATCO que enumera el manual?", "opts": ["Introducción a los factores humanos", "Estructuras de aeronaves", "Cartografía", "Economía de las aerolíneas"], "ans": 0, "why": "Los cinco epígrafes son: introducción a los factores humanos, actuaciones humanas, error humano, comunicación y entorno de trabajo.", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 18", "note": ""}, {"n": 46, "stem": "¿Qué tema se incluye en los cursos de formación de habilitación dentro del «trabajo colaborativo»?", "opts": ["Mantenimiento de aeronaves", "Cooperación controlador/piloto", "Programación de las aerolíneas", "Precio de los billetes"], "ans": 1, "why": "Trabajo colaborativo: comunicación, trabajo colaborativo dentro de la misma área de responsabilidad y con otras áreas de responsabilidad, cooperación controlador/piloto.", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 19", "note": ""}, {"n": 47, "stem": "Según EUROCONTROL-FAA (2010), ¿qué proporción del coste final de un proyecto queda fijada en el primer 10 % de su ciclo de vida?", "opts": ["Aproximadamente el 20 %", "Aproximadamente el 40 %", "Aproximadamente el 55 %", "Aproximadamente el 70 %"], "ans": 3, "why": "Aproximadamente el 70 %, por lo que la intervención de los FFHH al principio es crítica.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 21", "note": ""}, {"n": 48, "stem": "Según el manual, una integración efectiva de los FFHH tiene un impacto positivo directo y medible en varias áreas de la gestión de la organización. ¿Cuál NO figura entre ellas?", "opts": ["La reducción del número de sectores del espacio aéreo", "La optimización de la organización y de su personal", "La reducción de costes", "El cumplimiento de la normativa"], "ans": 0, "why": "El manual enumera la mejora de la seguridad, la optimización de la organización y de su personal, la mejora de la capacidad y de la eficiencia, la reducción de costes y el cumplimiento de la normativa.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 19", "note": ""}, {"n": 49, "stem": "¿Qué frase usa el manual, al describir el ATM como sistema sociotécnico, para resumir la relación entre las personas y la tecnología?", "opts": ["«La tecnología siempre es el porqué, y el ser humano el cómo»", "«El ser humano es el eslabón débil, y la tecnología la defensa»", "«El ser humano siempre es el por qué, y la tecnología el cómo»", "«La tecnología es el qué, y el ser humano el cuándo»"], "ans": 2, "why": "Frase literal del apartado 1.6, tras explicar que estos sistemas logran sus objetivos unificando tecnología avanzada con personas.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 20", "note": ""}, {"n": 50, "stem": "¿Qué programa se dice que se desarrolló bajo la premisa de que el factor humano es un pilar fundamental de los futuros sistemas ATM?", "opts": ["SESAR", "FAB", "Galileo", "CISM"], "ans": 0, "why": "El concepto operacional básico de SESAR.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 20", "note": ""}, {"n": 51, "stem": "En la distinción que hace el manual, un equipo se diferencia de un grupo en que el equipo:", "opts": ["trabaja con un alto grado de control externo", "limita la comunicación al superior inmediato", "pone el énfasis solo en el resultado", "tiene alta autonomía y atiende al resultado y al proceso"], "ans": 3, "why": "El grupo tiene un alto grado de control externo, énfasis en el resultado y comunicación limitada al superior.", "src": "Manual 8 (nov. 2026), capítulo 2.1, p. 22", "note": ""}, {"n": 52, "stem": "Un «sistema de monitorización mutua» en un equipo significa que los miembros:", "opts": ["están supervisados únicamente por el jefe de sala", "se avisan de que se alcanza un límite operativo o de un desvío", "registran los errores de los demás para sancionarlos", "trabajan cada uno en su tarea sin comunicarse"], "ans": 1, "why": "Es uno de los objetivos de la formación de equipos que enumera el manual.", "src": "Manual 8 (nov. 2026), capítulo 2.1, p. 23", "note": ""}, {"n": 53, "stem": "El TRM deriva de:", "opts": ["SHELL", "TEM", "CRM", "LOSA"], "ans": 2, "why": "El TRM (<em>Team Resource Management</em>, gestión de recursos de equipo) deriva del CRM (<em>Cockpit/Crew Resource Management</em>) de la aviación, transpuesto al ámbito de control.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 54, "stem": "¿Cuántas categorías de habilidades TRM enumera el manual?", "opts": ["Cuatro", "Diez", "Ocho", "Seis"], "ans": 3, "why": "Trabajo en equipo; gestión de roles; comunicación interpersonal; conciencia situacional; resolución de problemas y toma de decisiones; gestión del estrés.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 55, "stem": "¿Cuál NO es una de las seis categorías de habilidades TRM?", "opts": ["Comunicación interpersonal", "Conciencia situacional", "Gestión del estrés", "Planificación de turnos por fatiga"], "ans": 3, "why": "La planificación de turnos por fatiga no figura en la lista.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 56, "stem": "El manual describe el TRM como:", "opts": ["un programa informático de apoyo a la toma de decisiones", "una habilitación de la licencia de controlador de tránsito aéreo", "una filosofía de trabajo que maximiza la eficiencia en interacciones y recursos personales", "un sistema de turnos que reparte la carga de trabajo del equipo"], "ans": 2, "why": "Emerge del reconocimiento de que los seres humanos somos proclives a cometer errores y estos no se pueden eliminar en su totalidad.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 57, "stem": "Según el manual, ¿cuánto tiempo retiene la información la memoria a corto plazo?", "opts": ["De 20 a 30 segundos", "De 2 a 3 segundos", "5 minutos", "24 horas"], "ans": 0, "why": "Funciona como la memoria de trabajo de un ordenador; la memoria a largo plazo es ilimitada, pero necesita más tiempo.", "src": "Manual 8 (nov. 2026), capítulo 3.1, p. 24", "note": ""}, {"n": 58, "stem": "¿Qué método da el manual para consolidar la información en la memoria a largo plazo?", "opts": ["Dormir menos", "El ensayo repetitivo de una actividad", "La cafeína", "Leer una sola vez"], "ans": 1, "why": "Cuanto más se recurre a la información almacenada, más fácil resulta utilizarla de nuevo.", "src": "Manual 8 (nov. 2026), capítulo 3.1, p. 24", "note": ""}, {"n": 59, "stem": "En un entorno de radar, el manual dice que los sectores son gestionados por:", "opts": ["un supervisor y un piloto", "un controlador ejecutivo y un controlador planificador", "solo dos controladores ejecutivos", "solo un ayudante"], "ans": 1, "why": "Controlador ejecutivo y controlador planificador (<em>planner</em>).", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 25", "note": ""}, {"n": 60, "stem": "Los tres niveles de conciencia situacional de Endsley son:", "opts": ["percepción, comprensión, proyección", "amenaza, error, estado no deseado", "atención, memoria, juicio", "alerta, peligro, urgencia"], "ans": 0, "why": "Percepción de la situación, comprensión y proyección en el futuro.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 25", "note": ""}, {"n": 61, "stem": "¿Qué autores describieron en la figura 6 los elementos que influyen en la conciencia situacional del controlador?", "opts": ["Sebastian y del Hoyo", "Lazarus y Folkman", "Isaac y Ruitenberg", "Cox y Mackay"], "ans": 2, "why": "El pie de la figura 6 dice «Isaac y Ruitenberg, 1997» (la bibliografía fecha su libro en 1999). Lazarus y Folkman son del estrés; Cox y Mackay, del modelo transaccional; Sebastian y del Hoyo, de la carga mental.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26-27", "note": ""}, {"n": 62, "stem": "Los controladores expresan de manera informal la dificultad para mantener la SA como:", "opts": ["«adelantarse al tráfico»", "«ver el tráfico»", "«ir por detrás del tráfico» o «perder el control»", "«limpiar la bahía»"], "ans": 2, "why": "«Ver» el tráfico y «adelantarse» a él describen tener SA.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 63, "stem": "Según el manual, la SA se entiende mejor como:", "opts": ["una foto fija del espacio aéreo en un instante determinado", "un modelo mental dinámico sobre el que se proyectan cursos de acción", "lo mismo que la carga de trabajo mental del controlador", "un procedimiento fijo que se aplica igual en cada sector"], "ans": 1, "why": "El manual afirma que la SA no es una «foto fija», sino un modelo mental dinámico.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 27", "note": ""}, {"n": 64, "stem": "¿Qué afirmación sobre las asunciones figura en el manual?", "opts": ["Las asunciones nunca se dan en el ATC", "La mayoría de los incidentes de tránsito aéreo presentan alguna asunción", "Las asunciones son siempre señal de incompetencia", "Las asunciones solo se dan en los pilotos"], "ans": 1, "why": "Cuando al modelo mental le falta información, la mente rellena el hueco, y el equipo es una fuente de información vital para hacer robusta la SA.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 27", "note": ""}, {"n": 65, "stem": "El manual nombra tres dimensiones fundamentales de la carga de trabajo mental. ¿Qué lista es la correcta?", "opts": ["Presión temporal, recursos cognitivos de procesamiento que demanda la tarea, aspectos emocionales", "Velocidad de las aeronaves, nivel de vuelo, distancia entre tráficos", "Ruido de la sala, iluminación, temperatura del puesto de trabajo", "Selección del personal, formación recibida, experiencia del controlador"], "ans": 0, "why": "1 presión temporal de la tarea; 2 recursos cognitivos que demanda; 3 aspectos emocionales.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 66, "stem": "Según la norma UNE-EN ISO 10075-2, la «tensión mental» (<em>mental strain</em>) es:", "opts": ["el conjunto de influencias externas que afectan a la persona", "el efecto inmediato de la presión mental (<em>stress</em>) en el individuo", "un sinónimo de carga de trabajo", "un tipo de fatiga"], "ans": 1, "why": "Presión mental (<em>stress</em>) = influencias externas; tensión (<em>strain</em>) = efecto inmediato en el individuo.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 67, "stem": "La ley de Yerkes-Dodson describe la relación entre la activación y el rendimiento como:", "opts": ["una recta ascendente", "una recta descendente", "una U invertida", "una recta horizontal"], "ans": 2, "why": "El rendimiento es óptimo con una activación moderadamente elevada; si es demasiado alta o demasiado baja, los resultados empeoran.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 68, "stem": "Según la figura de Yerkes-Dodson del manual, en una tarea compleja el pico de rendimiento se alcanza:", "opts": ["más tarde que en una tarea sencilla", "en el mismo punto que en una tarea sencilla", "nunca", "antes que en una tarea sencilla"], "ans": 3, "why": "El umbral de rendimiento máximo se alcanza antes cuando la tarea es compleja.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 29", "note": ""}, {"n": 69, "stem": "¿Por qué un periodo de baja densidad de tráfico no es inocuo desde el punto de vista de los FFHH?", "opts": ["Porque la atención vigilante sostenida puede fatigar tanto o más que una carga alta", "Porque en esos periodos aumentan las llamadas por radio de los pilotos", "Porque las aeronaves vuelan más rápido cuando hay poco tráfico", "Porque esos periodos coinciden siempre con meteorología adversa"], "ans": 0, "why": "El manual dice que mantener una atención continuada en tareas de monitorización puede ocasionar una fatiga tan alta o más que en periodos de alta carga de trabajo mental.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 29", "note": ""}, {"n": 70, "stem": "Según el manual, la complejidad impulsa la carga de trabajo mental del controlador, que a su vez limita:", "opts": ["la capacidad ATC", "la velocidad de las aeronaves", "el número de aeropuertos", "la duración de la licencia"], "ans": 0, "why": "La opinión de consenso es que la complejidad impulsa la carga de trabajo mental, lo que limita en última instancia la capacidad ATC.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 29", "note": ""}, {"n": 71, "stem": "¿Cuál NO figura entre los factores que influyen en la complejidad del tráfico aéreo?", "opts": ["La congestión de la frecuencia", "El número de cartas de acuerdo asociadas a un sector", "La meteorología", "El color del uniforme del controlador"], "ans": 3, "why": "Los demás aparecen en la lista de factores (congestión de la frecuencia, número de cartas de acuerdo, meteorología...).", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 29-30", "note": ""}, {"n": 72, "stem": "¿Qué táctica utilizan los controladores en los conflictos complejos según el manual?", "opts": ["Elegir soluciones con menos coordinaciones y usar separación vertical", "Esperar a que el conflicto lo resuelvan los pilotos con el TCAS", "Usar siempre esperas y separación horizontal en todos los casos", "Traspasar el sector al planificador de inmediato y sin coordinar"], "ans": 0, "why": "También dar más autorizaciones iniciales «seguras» y revisarlas después.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 30-31", "note": ""}, {"n": 73, "stem": "¿Quién desarrolló en 2013 el prototipo de taxonomía de estrategias de mitigación de la complejidad de los controladores?", "opts": ["Kontogiannis y Malakis", "Lazarus y Folkman", "Mitchell y Everly", "Edwards y Hawkins"], "ans": 0, "why": "Kontogiannis y Malakis (2013), que especifica funciones cognitivas, estrategias y marcadores conductuales.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 30", "note": ""}, {"n": 74, "stem": "¿Qué afirmación figura en el manual sobre la eficacia de la comunicación?", "opts": ["Un mensaje es eficaz cuando está bien expresado", "Un mensaje es eficaz cuando el receptor actúa como se pretendía", "Un mensaje es eficaz cuando es largo", "Un mensaje es eficaz cuando el receptor guarda silencio"], "ans": 1, "why": "El propósito en las organizaciones es generar una acción común (la comunicación en la organización es persuasiva); un mensaje puede ser correcto y no ser eficaz.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32-33", "note": ""}, {"n": 75, "stem": "¿Cuál NO es un componente de la comunicación de los que enumera el manual?", "opts": ["Emisor", "Canal", "Código", "Altitud"], "ans": 3, "why": "Se enumeran el emisor, el receptor, el mensaje, el canal, el mismo código y las barreras; se tratan también el ruido y el feedback.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32-33", "note": ""}, {"n": 76, "stem": "El manual dice que el silencio como respuesta es:", "opts": ["nunca un mensaje", "un error", "en sí mismo un mensaje", "solo una barrera"], "ans": 2, "why": "El feedback no tiene por qué ser explícito.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 33", "note": ""}, {"n": 77, "stem": "¿Quién es responsable de asegurarse de que un mensaje ha llegado adecuadamente?", "opts": ["El receptor", "Quien comunica", "El supervisor", "Nadie"], "ans": 1, "why": "Si no ha llegado, debe buscar vías alternativas.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 78, "stem": "¿Qué concepto vincula el manual con la comprobación de que las interferencias no merman la ejecución del mensaje?", "opts": ["La colación", "La delegación", "El relevo", "El traspaso"], "ans": 0, "why": "Se introduce a raíz del ejemplo del destornillador.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 79, "stem": "¿Cuál es un factor que favorece la escucha activa?", "opts": ["Las interrupciones constantes", "El lenguaje corporal inhibidor", "Hacer pequeños resúmenes", "Abusar de las distracciones"], "ans": 2, "why": "También mantener el contacto visual y hacer preguntas abiertas.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 34", "note": ""}, {"n": 80, "stem": "¿Cuál de los siguientes es un factor que dificulta la escucha activa?", "opts": ["Hacer preguntas abiertas", "Mantener el contacto visual", "Hacer pequeños resúmenes", "Dejar los temas a medias"], "ans": 3, "why": "Otros: el lenguaje corporal inhibidor, las distracciones, las interrupciones constantes y los comentarios cortantes.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 34", "note": ""}, {"n": 81, "stem": "El manual enumera tres tipos de barreras inherentes al ser humano:", "opts": ["ambientales, semánticas, verbales", "cognitivas, fisiológicas, psicológicas", "sociales, económicas, políticas", "verbales, no verbales, paraverbales"], "ans": 1, "why": "Las barreras ambientales son una categoría aparte (físicas, impersonales).", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 82, "stem": "Una persona que habla muy rápido o cuya lengua materna es diferente de la del receptor genera:", "opts": ["una barrera fisiológica", "una barrera psicológica", "una barrera verbal (cognitiva)", "una barrera ambiental"], "ans": 2, "why": "Las barreras verbales se incluyen entre las barreras cognitivas.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 83, "stem": "Una voz débil o una pronunciación defectuosa en el emisor es un ejemplo de barrera:", "opts": ["fisiológica", "cognitiva", "semántica", "ambiental"], "ans": 0, "why": "Barreras fisiológicas: limitaciones del emisor (voz débil, pronunciación) o del receptor (sordera, problemas visuales).", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 84, "stem": "Los dos grandes antídotos para salvar las barreras de la comunicación que da el manual son:", "opts": ["la empatía y la asertividad", "la velocidad y el volumen", "la autoridad y el silencio", "la tecnología y el dinero"], "ans": 0, "why": "La empatía y la asertividad.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 36", "note": ""}, {"n": 85, "stem": "La asertividad se define como la capacidad de:", "opts": ["estar siempre de acuerdo", "defender la propia postura y decir «no» sin atacar a la otra parte", "evitar todo conflicto guardando silencio", "imponer los propios derechos a los demás"], "ans": 1, "why": "Comunica los sentimientos y las necesidades sin herir ni ofender a los demás.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 36", "note": ""}, {"n": 86, "stem": "En la figura del manual, ¿qué reacción consiste en pensar que los demás tienen más derechos que nosotros y en no expresar con honestidad nuestras ideas?", "opts": ["La asertividad", "La agresividad", "La empatía", "La pasividad"], "ans": 3, "why": "Pasividad; la agresividad defiende los derechos propios sin respetar los del otro.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 37 (figura)", "note": ""}, {"n": 87, "stem": "Según Allan Pease (manual), ¿más de qué porcentaje de la comunicación puede suponer el lenguaje no verbal?", "opts": ["10 %", "20 %", "50 %", "95 %"], "ans": 2, "why": "Más del 50 %; con el paraverbal, el 80 %.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 37", "note": ""}, {"n": 88, "stem": "¿A qué tipo de lenguaje pertenecen el volumen y el tono de voz en la clasificación de Pease?", "opts": ["Verbal", "Paraverbal", "No verbal", "Escrito"], "ans": 1, "why": "Verbal = las palabras; no verbal = gestos, posturas; paraverbal = volumen, tono.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 37", "note": ""}, {"n": 89, "stem": "¿Cuál es una de las seis emociones básicas que enumera el manual?", "opts": ["Orgullo", "Envidia", "Asco", "Vergüenza"], "ans": 2, "why": "Tristeza, asco, sorpresa, ira, alegría, miedo.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 90, "stem": "Según el manual, la fatiga es:", "opts": ["solo una sensación subjetiva de agotamiento", "un estado fisiológico objetivo; el cansancio es lo subjetivo", "exactamente lo mismo que el cansancio", "una enfermedad psicológica de origen laboral"], "ans": 1, "why": "El cansancio es la sensación del individuo en relación con su nivel de fatiga.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 45", "note": ""}, {"n": 91, "stem": "El manual afirma que un adulto de 18 a 64 años debe dormir por término medio:", "opts": ["6 horas", "7 horas", "8 horas", "10 horas"], "ans": 2, "why": "Según la OMS y la National Sleep Foundation (EE. UU.).", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 39-40", "note": ""}, {"n": 92, "stem": "¿Cuántas fases tiene el sueño en el manual (incluida la REM)?", "opts": ["Tres", "Cuatro", "Seis", "Cinco"], "ans": 3, "why": "El sueño no-REM tiene cuatro fases, más la REM.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 93, "stem": "Un nuevo ciclo de sueño comienza aproximadamente cada:", "opts": ["30 minutos", "60 minutos", "90 a 100 minutos", "3 horas"], "ans": 2, "why": "Los últimos 20 o 30 minutos de cada ciclo corresponden a la fase REM.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 94, "stem": "¿Qué fase del sueño ocupa el 50 % del tiempo de sueño de un adulto?", "opts": ["Fase I", "Fase II", "Fase III", "Fase IV"], "ans": 1, "why": "Fase II: bloqueo sensorial y recuperación parcial.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 95, "stem": "¿En qué fase disminuyen del 10 al 30 % la tensión arterial y el ritmo respiratorio y aumenta la producción de la hormona del crecimiento?", "opts": ["Fase I", "Fase II", "REM", "Fase III"], "ans": 3, "why": "Fase III («delta»); despertar en ella causa confusión y desorientación.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 96, "stem": "La atonía muscular (parálisis) que impide materializar los sueños se produce en:", "opts": ["el sueño REM", "la fase I", "la fase II", "la fase IV"], "ans": 0, "why": "REM: sueños en forma de narración y actividad cerebral rápida, sin tono muscular.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 41", "note": ""}, {"n": 97, "stem": "Los estudios que cita el manual dicen que el descanso de los controladores durante el turno de noche en su lugar de trabajo es:", "opts": ["más profundo y reparador que en el domicilio", "más ligero y con frecuencia interrumpido (no-REM)", "de tipo REM casi en su totalidad", "igual de reparador que el sueño en casa"], "ans": 1, "why": "No puede compararse con el sueño en el domicilio.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 41", "note": ""}, {"n": 98, "stem": "¿Qué es un microsueño según el manual?", "opts": ["Una siesta breve, de menos de una hora", "La fase IV, la de mayor profundidad del sueño", "Unos segundos en que el cerebro «desconecta» y uno se duerme", "Un sueño sin imágenes ni línea argumental"], "ans": 2, "why": "Puede pasar desapercibido, pero el cerebro pierde la conexión con los estímulos exteriores.", "src": "Manual 8 (nov. 2026), capítulo 5.3, p. 41", "note": ""}, {"n": 99, "stem": "¿Con qué afecciones vincula el manual la privación continuada de sueño?", "opts": ["Obesidad, diabetes tipo 2 y afecciones cardiovasculares", "Miopía, astigmatismo y vista cansada", "Pérdida de audición, acúfenos y vértigo", "Alergias, asma y dermatitis"], "ans": 0, "why": "Dormir adecuadamente es tan importante como comer de forma equilibrada o hacer deporte.", "src": "Manual 8 (nov. 2026), capítulo 5.3, p. 42", "note": ""}, {"n": 100, "stem": "Los tres procesos que regulan el sueño y la vigilia son:", "opts": ["circadiano (C), homeostático (S), de vigilia (W)", "alfa, beta, gamma", "REM, delta, theta", "sensorial, motor, cognitivo"], "ans": 0, "why": "C = reloj corporal de 24 horas, S = impulso de dormir según el tiempo de vigilia, W = inercia del sueño.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 101, "stem": "El mínimo de la ventana circadiana (WOCL, <em>Window Of Circadian Low</em>) se produce aproximadamente:", "opts": ["entre las 9 y las 12 a. m.", "entre las 3 y las 6 a. m.", "entre las 3 y las 6 p. m.", "entre las 8 y las 11 p. m."], "ans": 1, "why": "Coincide con la temperatura basal mínima corporal, la mayor somnolencia y la menor capacidad de desempeño.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 102, "stem": "El proceso de vigilia (W) refleja:", "opts": ["la deuda de sueño", "la temperatura corporal", "la inercia del sueño tras despertar", "el impulso de dormir"], "ans": 2, "why": "Un estado de transición con menor rendimiento inmediatamente después de despertar.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 103, "stem": "El proceso homeostático (S) es el responsable de:", "opts": ["el patrón de temperatura corporal de 24 horas", "los sueños narrativos de la fase REM", "la inercia del sueño al despertar", "el impulso de dormir, que crece con el tiempo despierto"], "ans": 3, "why": "Con el trabajo nocturno, S y C se desajustan.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 104, "stem": "¿Qué documento de la OACI define la fatiga en el manual y en qué año se publicó la edición citada?", "opts": ["Doc. 4444, 2016", "Doc. 9966, 2016", "Anexo 13, 1994", "Circular 314, 2005"], "ans": 1, "why": "Doc. 9966 de la OACI, <em>Manual para la supervisión de los enfoques de gestión de la fatiga</em> (2016).", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43, y capítulo 8 (bibliografía), p. 64", "note": ""}, {"n": 105, "stem": "Según el manual, ¿qué nivel de carga de trabajo da el mejor desempeño?", "opts": ["Muy bajo", "Medio", "Muy alto", "Nulo"], "ans": 1, "why": "Una carga baja puede provocar monotonía y aburrimiento; una carga elevada puede rebasar la capacidad de una persona fatigada.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 106, "stem": "¿Qué consecuencia se asocia a un nivel de activación demasiado alto?", "opts": ["Decisiones más fáciles y tiempo de reacción más corto", "Relajación deseada con rendimiento bajo pero suficiente", "Más errores, decisiones más difíciles y mayor tiempo de reacción", "Mejor evaluación del riesgo y asignación de prioridades"], "ans": 2, "why": "También tendencia a reducir la atención y el enfoque, a omitir información e incapacidad para evaluar el riesgo y asignar prioridades. La «relajación deseada» corresponde a los niveles bajos de activación.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 44", "note": ""}, {"n": 107, "stem": "¿Qué Reglamento, de 29 de junio de 2015, convierte la fatiga que afecta al desempeño seguro del ATC en un suceso de notificación obligatoria?", "opts": ["Reglamento (UE) 2017/373", "Reglamento (UE) 376/2014", "Reglamento (UE) 2015/1018", "Reglamento (UE) 2015/340"], "ans": 2, "why": "Reglamento de Ejecución (UE) 2015/1018; su anexo III trata de los sucesos relacionados con los servicios e instalaciones de navegación aérea y obliga a notificar tanto al proveedor como al CTA.", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 44-45", "note": ""}, {"n": 108, "stem": "¿Cómo se llama el sistema integrado de gestión de riesgos de fatiga y estrés de ENAIRE?", "opts": ["CISM", "FRMS-ENAIRE", "SMS-HF", "FSRMS"], "ans": 3, "why": "<em>Fatigue and Stress Risk Management System</em>; el CISM es el programa de incidentes críticos.", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 45", "note": ""}, {"n": 109, "stem": "¿Qué elemento es un síntoma psicológico de la fatiga en el manual?", "opts": ["Enrojecimiento de los ojos", "Visión borrosa", "Alteración de la percepción del riesgo", "Ojos llorosos"], "ans": 2, "why": "Los síntomas oculares son fisiológicos.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 45-46", "note": ""}, {"n": 110, "stem": "En la figura 9 (fatiga y seguridad operacional), ¿qué ocurre si el controlador NO es consciente de la fatiga?", "opts": ["Puede producirse un incidente de seguridad", "Se aplica una estrategia de primer nivel", "Se programa una siesta", "Termina el turno"], "ans": 0, "why": "Si es consciente, las estrategias de primer nivel (siesta, cafeína) previenen o reducen la fatiga y las de segundo nivel mitigan sus efectos.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 46", "note": ""}, {"n": 111, "stem": "El manual agrupa en tres grandes grupos los aspectos afectados por el trabajo a turnos. ¿Cuál es uno de ellos?", "opts": ["Problemas salariales", "Dificultades en la vida familiar y social", "Dificultades de idioma", "La vivienda"], "ans": 1, "why": "Alteraciones del sueño; problemas de salud, tanto física como psicológica; dificultades en la vida familiar y social.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 47", "note": ""}, {"n": 112, "stem": "Según el manual, ¿qué sueño es «el auténticamente reparador»?", "opts": ["El sueño diurno", "Las siestas", "El sueño nocturno", "El sueño en el lugar de trabajo"], "ans": 2, "why": "Su ausencia produce fatiga crónica.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 47", "note": ""}, {"n": 113, "stem": "El estrés, en el manual, es una respuesta psicofisiológica que emerge cuando:", "opts": ["la persona recibe un estímulo agradable e inesperado", "el organismo interpreta que sus recursos no bastan para adaptarse", "no hay ningún estímulo externo ni interno", "la persona ha dormido menos de ocho horas"], "ans": 1, "why": "Puede desencadenarse por estímulos externos o internos.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48", "note": ""}, {"n": 114, "stem": "Según Lazarus y Folkman, se genera eustrés cuando la persona:", "opts": ["tiene expectativas de poder gestionar el estímulo", "no dispone de recursos", "está fatigada", "sufre estrés agudo"], "ans": 0, "why": "El distrés surge si no tiene expectativas de poder gestionarlo.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48", "note": ""}, {"n": 115, "stem": "¿Qué modelo, basado en «Managing Stress in ATM» de EUROCONTROL, tiene en cuenta la demanda y la capacidad reales y la autopercepción del individuo?", "opts": ["El modelo transaccional de Cox-Mackay", "El modelo de Rasmussen", "El modelo de Endsley", "La taxonomía de Kontogiannis y Malakis"], "ans": 0, "why": "Figura 10 del manual.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 49", "note": ""}, {"n": 116, "stem": "¿Cuál NO es uno de los cuatro estados del estrés en las tareas de control?", "opts": ["Hipoestrés", "Eustrés", "Hiperestrés", "Paraestrés"], "ans": 3, "why": "Los cuatro son hipoestrés, eustrés, hiperestrés y distrés.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51-52", "note": ""}, {"n": 117, "stem": "Un controlador que se aburre y realiza una tarea rutinaria con poco interés y tensión se encuentra en:", "opts": ["hiperestrés", "hipoestrés", "eustrés", "distrés"], "ans": 1, "why": "Su desempeño puede ser pobre y las posibilidades de cometer errores, altas.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51", "note": ""}, {"n": 118, "stem": "Según el manual, la memoria de trabajo no puede manejar más de:", "opts": ["dos o tres ítems", "seis o siete ítems", "veinte ítems", "cincuenta ítems"], "ans": 1, "why": "Se afirma en el párrafo sobre el hiperestrés.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51", "note": ""}, {"n": 119, "stem": "Según EASA (GM1 ATS.OR.310), las tres fuentes principales de estrés en el ATC son:", "opts": ["ambientales/físicos, relacionados con la tarea y relativos al individuo", "el hambre, la sed y el ruido de la sala de control", "la meteorología, el volumen de tráfico y las radioayudas", "los pilotos, los compañeros controladores y los supervisores"], "ans": 0, "why": "El manual cita el GM1 ATS.OR.310 <em>Stress</em> de EASA del Reglamento 2017/373.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52", "note": ""}, {"n": 120, "stem": "¿Cuál es un estresor relacionado con la tarea en el manual?", "opts": ["La muerte de un ser querido", "El calor en la sala de operaciones", "El hambre", "La ambigüedad de roles"], "ans": 3, "why": "Los estresores relacionados con la tarea incluyen la alta carga de trabajo sostenida, los equipos poco fiables, la supervisión de personal en instrucción, la ambigüedad de roles y el conflicto interpersonal. El calor es ambiental; la muerte de un ser querido es individual.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52-53", "note": ""}, {"n": 121, "stem": "La creencia de que los factores estresantes personales se pueden dejar en casa la califica el manual de:", "opts": ["política de la empresa", "mito", "norma", "requisito legal"], "ans": 1, "why": "Los factores estresantes personales acompañan cada día a los controladores en el trabajo.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 53", "note": ""}, {"n": 122, "stem": "¿Qué efecto del estrés elevado menciona el manual?", "opts": ["Preparación más cuidadosa de un plan B", "Tendencia a evitar tomar decisiones, que se posponen", "Uso más riguroso de la fraseología normalizada", "Menor liberación de adrenalina y más calma"], "ans": 1, "why": "También la fijación mental, la propensión a asumir más riesgos y el uso de procedimientos que ya no están operativos y de la lengua materna.", "src": "Manual 8 (nov. 2026), capítulo 6.4, p. 54", "note": ""}, {"n": 123, "stem": "Las siglas inglesas CISM corresponden a:", "opts": ["<em>Controller Incident Safety Method</em> (método de seguridad ante incidentes del controlador)", "<em>Critical Incident Stress Management</em> (gestión del estrés por incidente crítico)", "<em>Central Incident Safety Monitoring</em> (monitorización central de la seguridad ante incidentes)", "<em>Cognitive Intervention for Stress Mitigation</em> (intervención cognitiva para la mitigación del estrés)"], "ans": 1, "why": "Gestión del Estrés por Incidente Crítico.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 55", "note": ""}, {"n": 124, "stem": "El programa CISM se describe como:", "opts": ["obligatorio, disciplinario y con informe al supervisor", "confidencial, voluntario y educativo: «primeros auxilios psicológicos»", "público, punitivo y gestionado por la autoridad", "voluntario, pero reservado a pilotos y tripulantes"], "ans": 1, "why": "Es un proceso formal, muy estructurado y profesionalmente reconocido.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 55", "note": ""}, {"n": 125, "stem": "¿Cuál de los siguientes se da como ejemplo de incidente crítico en el ATC?", "opts": ["Un cambio de turno rutinario", "Una sesión de formación programada", "Una vulneración de las mínimas de separación", "Una actualización de software"], "ans": 2, "why": "También accidentes, aeronaves en emergencia, fallecimientos, situaciones cercanas a incidentes, violencia y hechos delictivos.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 55-56", "note": ""}, {"n": 126, "stem": "En el programa CISM de ENAIRE, un <em>peer</em> es:", "opts": ["un psicólogo clínico contratado por ENAIRE", "un piloto con formación en factores humanos", "un controlador de apoyo formado para atender a otros controladores", "un representante sindical de los controladores"], "ans": 2, "why": "Se complementa con asistencia psicológica profesional cuando se estime necesario.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 56", "note": ""}, {"n": 127, "stem": "¿Qué organización marca las recomendaciones y los estándares que sigue la formación de los <em>peers</em>?", "opts": ["OACI", "ICISF", "EASA", "IATA"], "ans": 1, "why": "Los <em>peers</em> son voluntarios, seleccionados y formados en CISM siguiendo las recomendaciones y estándares de la ICISF (<em>International Critical Incident Stress Foundation</em>).", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 56", "note": ""}, {"n": 128, "stem": "¿Cuál es una de las tres tareas principales de los <em>peers</em>?", "opts": ["Sancionar al controlador", "Investigar el accidente", "Sustituir al controlador de servicio", "Proporcionar intervención inmediata a la crisis"], "ans": 3, "why": "También el asesoramiento psicológico y la organización del apoyo profesional a la salud mental.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 56", "note": ""}, {"n": 129, "stem": "El perfil idóneo del <em>peer</em> incluye saber que su labor es:", "opts": ["dar terapia psicológica profesional al afectado", "dar primeros auxilios, no asistencia psicológica profesional", "decidir las medidas tras el incidente crítico", "investigar el incidente y redactar el informe"], "ans": 1, "why": "Es uno de los once puntos del perfil que recomienda EUROCONTROL (1997, 2008).", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 57", "note": ""}, {"n": 130, "stem": "¿Cuántas fases tiene el resumen del programa CISM?", "opts": ["Tres", "Cuatro", "Cinco", "Siete"], "ans": 2, "why": "Comunicación y divulgación; selección y formación de los <em>peers</em>; intervención del <em>peer</em>; derivación a un profesional; evaluación periódica.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 57-58", "note": ""}, {"n": 131, "stem": "La fase final del programa CISM es:", "opts": ["la evaluación periódica del programa", "la selección de los <em>peers</em>", "la comunicación", "la derivación a un médico"], "ans": 0, "why": "Cuestionarios anónimos e informe anual.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 58", "note": ""}, {"n": 132, "stem": "El manual define el error, en un contexto operacional, como:", "opts": ["un acto punible que contradice una norma escrita", "una transgresión deliberada de un procedimiento", "una secuencia planificada de acciones que no logra el objetivo", "un suceso que termina en accidente o incidente"], "ans": 2, "why": "En el sistema ATC, «error» se refiere a toda la organización.", "src": "Manual 8 (nov. 2026), capítulo 7, p. 58", "note": ""}, {"n": 133, "stem": "En el GEMS, un desliz (<em>slip</em>) es:", "opts": ["una acción intencional debida a un error de planificación", "una acción no intencional debida a un fallo o laguna en la atención", "una acción no intencional debida a un fallo de memoria", "una transgresión deliberada"], "ans": 1, "why": "Por ejemplo, una omisión, una inversión o una alteración en el orden o el tiempo de una secuencia.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 134, "stem": "En el GEMS, ¿qué tipo de error es el más frecuente?", "opts": ["Los deslices", "Las equivocaciones", "Los lapsus", "Las transgresiones"], "ans": 2, "why": "El manual dice de los lapsus (fallos de memoria) que «es el tipo de error más frecuente».", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 135, "stem": "Una equivocación (<em>mistake</em>) en el GEMS es:", "opts": ["una acción no intencional debida a un fallo de atención", "una acción no intencional debida a un fallo de memoria", "una infracción deliberada de las reglas del sector", "una acción intencional debida a un error de planificación"], "ans": 3, "why": "Aplicación incorrecta de una regla correcta, o aplicación correcta de una regla e
