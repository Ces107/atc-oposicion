actores relativos a la capacidad de desempeño de cada persona", "El número de idiomas que domina el controlador"], "ans": 3, "why": "Son tres aspectos: tipo y naturaleza del trabajo, limitaciones de tiempo y factores de capacidad de desempeño de cada persona.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 286, "stem": "Entre los «factores relativos a la capacidad de desempeño de cada persona», el manual incluye:", "opts": ["experiencia, capacitación, esfuerzo, historial de sueño y fase circadiana", "duración, dificultad, complejidad y laboriosidad de la tarea", "horarios fijados por la tarea, por factores externos o por la persona", "temperatura, ruido, iluminación y vibraciones del entorno"], "ans": 0, "why": "B corresponde al tipo y naturaleza del trabajo; C, a las limitaciones de tiempo; D no es uno de los tres aspectos.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 287, "stem": "Según la definición de fatiga del Doc. 9966 recogida en el manual, ¿cuál NO es una causa de la reducción de la capacidad de desempeño?", "opts": ["La falta de sueño o los periodos prolongados de vigilia", "La fase circadiana", "La carga de trabajo, mental y/o física", "La falta de motivación"], "ans": 3, "why": "La definición cita la falta de sueño o vigilia prolongada, la fase circadiana y/o la carga de trabajo. La motivación aparece en el manual como factor del cansancio (elemento subjetivo).", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 288, "stem": "Según el manual, las actividades con una baja carga de trabajo pueden:", "opts": ["rebasar la capacidad de una persona fatigada", "provocar monotonía y aburrimiento y revelar una somnolencia subyacente", "dar el mejor nivel de desempeño posible", "eliminar la fatiga acumulada durante el turno"], "ans": 1, "why": "El mejor desempeño se obtiene con cargas medias; A es el riesgo de la carga elevada.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 43", "note": ""}, {"n": 289, "stem": "En la figura 8 (ley de Yerkes-Dodson), ¿qué rótulo señala el tramo descendente de la curva, con activación alta?", "opts": ["Increasing attention and interest", "Optimal arousal / Optimal performance", "Impaired performance because of strong anxiety", "Complex task"], "ans": 2, "why": "El tramo ascendente es «Increasing attention and interest»; el pico, «Optimal arousal / Optimal performance». «Complex task» es de la figura 7.", "src": "Manual 8 (nov. 2026), capítulo 5.5, figura 8, p. 44", "note": ""}, {"n": 290, "stem": "Según el manual, cuando por fatiga o falta de motivación el rendimiento alcanzado no coincide con el requerido (activación baja), se puede:", "opts": ["mejorar la evaluación del riesgo y la asignación de prioridades", "reaccionar más rápido a los cambios del tráfico", "perder información, omitir acciones y escanear insuficientemente", "aumentar la vigilancia por la relajación deseada"], "ans": 2, "why": "También ser menos vigilante, cometer errores y reaccionar mucho más lentamente a los cambios.", "src": "Manual 8 (nov. 2026), capítulo 5.5, p. 44", "note": ""}, {"n": 291, "stem": "Según el manual, las Easy Rules de EASA complementan el Reglamento 2017/373 describiendo, para cada requisito o <em>Implementing Rule</em>:", "opts": ["las sanciones aplicables por incumplimiento", "los límites numéricos de horas de servicio", "los formularios de notificación de sucesos", "medios aceptables de cumplimiento (AMC) y material guía (GM)"], "ans": 3, "why": "«Se describen medios aceptables de cumplimiento (AMC) y material guía (GM)».", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 44", "note": ""}, {"n": 292, "stem": "Según el manual, ¿de qué fecha es el Reglamento de Ejecución (UE) 2017/373?", "opts": ["20 de febrero de 2015", "1 de marzo de 2017", "29 de junio de 2015", "3 de abril de 2014"], "ans": 1, "why": "20/02/2015 es el Reglamento 2015/340; 29/06/2015, el 2015/1018; 03/04/2014, el 376/2014.", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 44, y capítulo 8 (bibliografía), p. 65", "note": ""}, {"n": 293, "stem": "En el apartado 5.6, ¿qué fecha da el manual para la entrada en vigor de las disposiciones del Reglamento 2017/373?", "opts": ["1 de marzo de 2017", "2 de enero de 2020", "1 de enero de 2019", "20 de febrero de 2015"], "ans": 1, "why": "El manual dice «que entra en vigor el 02/01/2020». En rigor, el Reglamento entró en vigor a los 20 días de su publicación y es aplicable desde el 2 de enero de 2020; en el examen manda el texto del manual.", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 44", "note": ""}, {"n": 294, "stem": "Según el manual, el anexo III del Reglamento 2015/1018 establece la obligación de notificar «la fatiga que repercuta, o pueda repercutir, en la capacidad de ejercer de forma segura» las funciones:", "opts": ["solo al proveedor de servicios de tránsito aéreo", "solo al controlador de tránsito aéreo", "tanto al proveedor de servicios como al CTA", "solo a la autoridad nacional, de oficio"], "ans": 2, "why": "«Establece la obligatoriedad de notificación, tanto para el proveedor de servicios de tránsito aéreo como para el CTA».", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 44-45", "note": ""}, {"n": 295, "stem": "Según el manual, las notificaciones de fatiga son una fuente esencial para analizar sus riesgos tanto si la fatiga se gestiona mediante un FRMS como:", "opts": ["de acuerdo con los límites prescriptivos", "mediante el programa CISM de la organización", "mediante el modelo TEM de la OACI", "de acuerdo con el sistema SHELL-O"], "ans": 0, "why": "«Tanto si ésta se gestiona mediante un FRMS o de acorde a los límites prescriptivos». ENAIRE cuenta además con el FSRMS (fatiga y estrés).", "src": "Manual 8 (nov. 2026), capítulo 5.6, p. 45", "note": ""}, {"n": 296, "stem": "Según el manual, el cansancio puede estar presente o no en un cuadro de fatiga dependiendo de factores como:", "opts": ["la fase circadiana y el historial de sueño", "la duración del servicio y los descansos mínimos", "la edad, el sexo y la condición física", "la motivación, el clima, el interés por el trabajo y las experiencias vividas"], "ans": 3, "why": "El cansancio es el elemento subjetivo de la fatiga; la fatiga es objetiva y fisiológica.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 45", "note": ""}, {"n": 297, "stem": "De forma general, el manual habla de tres tipos de fatiga:", "opts": ["aguda, crónica y residual", "mental, visual y física", "circadiana, homeostática y de vigilia", "cognitiva, fisiológica y psicológica"], "ans": 1, "why": "«Podemos hablar de fatiga mental, visual y física»; luego clasifica los síntomas en psicológicos y fisiológicos.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 45", "note": ""}, {"n": 298, "stem": "En la tabla de síntomas de la fatiga del manual, ¿cuál figura como síntoma fisiológico?", "opts": ["Irritabilidad", "Afección a la memoria", "Dolores de cabeza, confusión o mareo", "Alteración de estados de ánimo"], "ans": 2, "why": "Fisiológicos: dificultad para enfocar/visión borrosa, irritación o picor de ojos, ojos llorosos, enrojecimiento, dolores de cabeza, confusión o mareo, trastornos asociados al sueño. Los demás son psicológicos.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 45-46", "note": ""}, {"n": 299, "stem": "En la figura 9 (relación entre la fatiga y la seguridad operacional), ¿qué hacen las estrategias de segundo nivel?", "opts": ["Previenen o reducen la fatiga, como la siesta o la cafeína", "Detectan si el CTA es consciente de la fatiga", "Mitigan los efectos de la fatiga", "Notifican el incidente de seguridad"], "ans": 2, "why": "Si el CTA es consciente de la fatiga (SÍ), aplica estrategias de primer nivel (previenen o reducen: siesta, cafeína) y de segundo nivel (mitigan los efectos); si no (NO), puede producirse un incidente de seguridad.", "src": "Manual 8 (nov. 2026), capítulo 5.7, figura 9, p. 46", "note": ""}, {"n": 300, "stem": "¿Cuál NO figura entre los aspectos que, según el apartado 5.7, diferencian la profesión de control de otras industrias?", "opts": ["La seguridad en las operaciones es siempre un factor crítico", "Muchas de las dependencias requieren un servicio H24", "El escenario de trabajo es muy variable y puede fluctuar", "Los turnos son siempre fijos y exclusivamente diurnos"], "ans": 3, "why": "También el alto grado de complejidad y dinamismo y la necesidad de mantener un alto nivel de rendimiento.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 46-47", "note": ""}, {"n": 301, "stem": "Según el manual, ¿qué diferencias individuales hacen variar la tolerancia al trabajo a turnos?", "opts": ["La antigüedad, la categoría, la dependencia y el sector", "La altura, el peso, la agudeza visual y la audición", "La edad, el sexo y la condición física", "El idioma materno, la formación y el número de habilitaciones"], "ans": 2, "why": "Edad, sexo, condición física, flexibilidad para conciliar el sueño y capacidad para superar la somnolencia.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 47", "note": ""}, {"n": 302, "stem": "Según el manual, la falta de horas de sueño conduce a una disminución de la capacidad de:", "opts": ["toma de decisiones, que es la tarea principal del controlador", "coordinación con otros sectores, que es su tarea secundaria", "comunicación con los pilotos, que es su única tarea", "planificación del tráfico, que es tarea exclusiva del planificador"], "ans": 0, "why": "El sueño diurno no tiene la calidad del nocturno, que es el auténticamente reparador.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 47", "note": ""}, {"n": 303, "stem": "Según el manual, los problemas familiares y sociales que genera el trabajo a turnos se incrementan con:", "opts": ["el número de habilitaciones y de dependencias distintas", "la edad y el tiempo sometido a turnos", "el nivel de inglés y el número de cursos de formación", "la distancia al domicilio y el medio de transporte"], "ans": 1, "why": "Los efectos negativos pueden deberse también a condiciones de trabajo adversas como ruidos, iluminación deficiente o vibraciones.", "src": "Manual 8 (nov. 2026), capítulo 5.7, p. 47-48", "note": ""}, {"n": 304, "stem": "En la tabla del estrés del apartado 6.1, ¿cuáles son sus tres componentes?", "opts": ["Agudo, crónico y postraumático", "Fisiológico, psicológico y conductual", "Hipoestrés, eustrés e hiperestrés", "Endocrina, autónoma y conductual"], "ans": 3, "why": "Componentes: endocrina, autónoma y conductual. Fisiológico, psicológico y conductual es la clasificación de los síntomas (apartado 6.2); agudo y crónico son los tipos.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48", "note": ""}, {"n": 305, "stem": "Según la tabla del apartado 6.1, el componente autónomo del estrés prepara al organismo afectando fundamentalmente a:", "opts": ["la musculatura lisa", "la musculatura facial", "el equilibrio hormonal", "la memoria de trabajo"], "ans": 0, "why": "El componente endocrino cambia el equilibrio hormonal, los neurotransmisores y neuromoduladores; el conductual actúa sobre la musculatura facial o motora.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48", "note": ""}, {"n": 306, "stem": "Según la tabla del apartado 6.1, el estrés crónico:", "opts": ["se debe a factores que causan estrés de modo puntual", "resulta de presiones mantenidas largo tiempo y suele ser emocional", "aparece solo tras un incidente crítico", "se genera cuando la persona espera poder gestionar el estímulo"], "ans": 1, "why": "A es el estrés agudo; D describe el eustrés de Lazarus y Folkman.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48", "note": ""}, {"n": 307, "stem": "Según la tabla del apartado 6.1, ¿qué dos variables determinan cómo afecta el estrés al individuo?", "opts": ["La hora del día y la duración del turno", "La carga de trabajo y la complejidad del sector", "El tipo de factor estresante y el tipo de individuo con sus recursos", "La intensidad del estímulo y el nivel de ruido"], "ans": 2, "why": "a) El tipo de factor estresante (modelo de Lazarus y Folkman: eustrés si hay expectativas de gestionarlo, distrés si no); b) el tipo de individuo y los recursos que tenga.", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 48-49", "note": ""}, {"n": 308, "stem": "Según la fila «Atención» de la tabla del estrés, ¿qué ocurre cuando existen pocos estímulos?", "opts": ["La atención puede centrarse y mejora el desempeño del controlador", "Disminuye el desempeño por sobrecarga de estímulos", "Aparece siempre hipoestrés y aumentan los errores", "Se dispara la respuesta endocrina del estrés"], "ans": 0, "why": "Con muchos estímulos (sobrecarga) disminuye el desempeño. Ojo: no confundir con el hipoestrés del apartado 6.3 (tarea rutinaria y aburrida).", "src": "Manual 8 (nov. 2026), capítulo 6.1, p. 49", "note": ""}, {"n": 309, "stem": "En la figura 10 (modelo transaccional de Cox-Mackay), ¿qué es el estrés?", "opts": ["La demanda real del tráfico (<em>actual demand</em>)", "El desequilibrio (<em>imbalance</em>) tras la valoración cognitiva", "La defensa cognitiva (<em>cognitive defence</em>) del individuo", "La experiencia emocional (<em>emotional experience</em>)"], "ans": 1, "why": "La capacidad y la demanda reales se perciben; la valoración cognitiva (<em>cognitive appraisal</em>) detecta un desequilibrio («imbalance = stress»), que da una experiencia emocional y una respuesta de estrés, con realimentación (<em>feedback</em>).", "src": "Manual 8 (nov. 2026), capítulo 6.1, figura 10, p. 49", "note": ""}, {"n": 310, "stem": "En la relación de síntomas del estrés, «automedicación, consumo de alcohol o drogas» es un síntoma:", "opts": ["fisiológico", "psicológico afectivo", "psicológico cognitivo", "conductual"], "ans": 3, "why": "Conductuales: problemas de autocontrol, confianza o autoestima; automedicación, alcohol o drogas; fatiga y problemas del sueño; absentismo; aislamiento social; afectación al desempeño laboral.", "src": "Manual 8 (nov. 2026), capítulo 6.2, p. 50", "note": ""}, {"n": 311, "stem": "En la relación de síntomas del estrés, «realizar acciones no deliberadas (activación de funciones de forma no intencionada)» es un síntoma:", "opts": ["psicológico cognitivo", "conductual", "fisiológico", "psicológico afectivo"], "ans": 0, "why": "Cognitivos: afectación a la atención, vigilancia y nivel de alerta; a la capacidad para hacer planes y ejecutarlos; acciones no deliberadas.", "src": "Manual 8 (nov. 2026), capítulo 6.2, p. 50", "note": ""}, {"n": 312, "stem": "En la relación de síntomas del estrés, los «trastornos del sueño» figuran entre los fisiológicos. ¿Dónde figuran «fatiga, problemas del sueño»?", "opts": ["Entre los psicológicos afectivos", "Entre los psicológicos cognitivos", "Entre los conductuales", "No figuran en la relación"], "ans": 2, "why": "La relación los repite en dos grupos: «trastornos del sueño» (fisiológicos) y «fatiga, problemas del sueño» (conductuales).", "src": "Manual 8 (nov. 2026), capítulo 6.2, p. 50", "note": ""}, {"n": 313, "stem": "Según el manual, el estrés experimentado por los controladores aéreos es:", "opts": ["siempre único para el individuo y su interacción con el entorno", "igual para todos los controladores de un mismo sector", "independiente del entorno y de la interacción con él", "exclusivo de los periodos de alta densidad de tráfico"], "ans": 0, "why": "Aunque el trabajo es muy exigente por la gran responsabilidad y las numerosas habilidades y conocimientos necesarios.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 50", "note": ""}, {"n": 314, "stem": "¿Cuál NO figura entre las principales habilidades requeridas en el control de tránsito aéreo que enumera el apartado 6.3?", "opts": ["Habilidades espaciales visuales", "Reconocimiento de imágenes y patrones", "Uso de vocabulario técnico", "Dominio de la programación informática"], "ans": 3, "why": "Habilidades espaciales visuales, percepción, proceso de la información, reconocimiento de imágenes y patrones, priorización, resolución lógica de problemas, aplicación de reglas y procedimientos, toma de decisiones, comunicación interpersonal, trabajo en equipo y vocabulario técnico.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51", "note": ""}, {"n": 315, "stem": "En los cuatro estados del estrés del apartado 6.3, el eustrés se produce cuando:", "opts": ["el controlador se aburre o desempeña una tarea rutinaria", "la tarea se hace más interesante o urgente y nos concentramos sin desbordarnos", "los procedimientos son nuevos y aún no estamos familiarizados con ellos", "la tarea nos sobrepasa por sobrecarga o conflictividad"], "ans": 1, "why": "Tensión positiva y zona de mejor rendimiento. A es el hipoestrés, C el distrés y D el hiperestrés.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51", "note": ""}, {"n": 316, "stem": "En los cuatro estados del estrés del apartado 6.3, el distrés aparece cuando:", "opts": ["la tarea es interesante o urgente y la presión no nos desborda", "el controlador se aburre con una tarea rutinaria", "los procedimientos de control son nuevos y aún no estamos familiarizados", "nos sentimos sobrepasados y vamos por detrás del tráfico"], "ans": 2, "why": "Y nuestra calidad en la gestión y resolución de conflictos se resiente. Ojo: en el apartado 6.1 (Lazarus y Folkman) el distrés se define por no tener expectativas de gestionar el estímulo.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52", "note": ""}, {"n": 317, "stem": "Según el manual, bajo la tensión del hiperestrés tendemos a:", "opts": ["ampliar la atención a todas las fuentes de información", "delegar la comunicación en el planificador", "aumentar la eficiencia de la gestión del tráfico", "centrarnos en las señales más frecuentes y reconocibles"], "ans": 3, "why": "El hiperestrés conlleva sensación de pérdida de control, inseguridad, ir por detrás del tráfico y comunicar con dificultad.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 51-52", "note": ""}, {"n": 318, "stem": "Según el manual, ¿qué ejemplos da de estresores físicos internos del cuerpo humano?", "opts": ["Hambre, dolor y falta de sueño", "Contaminación acústica y calor", "Alta carga de trabajo sostenida", "Muerte de un ser querido o divorcio"], "ans": 0, "why": "B son estresores ambientales externos; C, relacionado con la tarea; D, relativo al individuo.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52", "note": ""}, {"n": 319, "stem": "Según el manual, el estrés no depende únicamente de la intensidad de un estímulo, sino también de:", "opts": ["la hora del día en que aparece", "la duración de la exposición", "la experiencia del controlador", "el número de personas presentes"], "ans": 1, "why": "Por ejemplo, un ruido agudo pero persistente puede causar tanto estrés como un ruido fuerte repentino.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52", "note": ""}, {"n": 320, "stem": "La supervisión de personal en instrucción o menos experimentado es, según el manual, un estresor:", "opts": ["ambiental/físico", "relacionado con la tarea", "relativo al individuo", "organizacional externo"], "ans": 1, "why": "Estresores relacionados con la tarea: alta carga sostenida, tráfico muy heterogéneo, equipos inadecuados o complejos, procedimientos imprecisos, supervisión de personal en instrucción, desfase carga-habilidades, ambigüedad de roles, conflicto interpersonal, problemas socio-laborales, situaciones inusuales.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 52-53", "note": ""}, {"n": 321, "stem": "Según el manual, las situaciones inusuales, incidentes, emergencias o accidentes pueden conducir a:", "opts": ["hipoestrés por la posterior falta de tráfico", "eustrés y la zona de mejor rendimiento", "la experiencia de estrés por incidente crítico", "fatiga visual y física exclusivamente"], "ans": 2, "why": "Es el último estresor relacionado con la tarea de la lista; enlaza con el programa CISM (apartado 6.5).", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 53", "note": ""}, {"n": 322, "stem": "¿Cuál NO figura entre los factores estresantes reconocidos por los controladores aéreos en varios estudios, según el manual?", "opts": ["La caída de equipos", "El miedo a causar accidentes", "Las evaluaciones continuas de la competencia", "El exceso de periodos de descanso"], "ans": 3, "why": "La lista: caída de equipos, tráfico muy elevado, miedo a causar accidentes, falta de tiempo, falta de conocimiento, incertidumbre, cambios en los procedimientos, evaluaciones continuas, incertidumbres en la carrera, trabajo a turnos y temas laborales.", "src": "Manual 8 (nov. 2026), capítulo 6.3, p. 53-54", "note": ""}, {"n": 323, "stem": "Según el manual, precipitarse a la hora de tomar decisiones bajo estrés se debe al efecto de:", "opts": ["la melatonina en el organismo", "la falta de glucosa en sangre", "la adrenalina en el organismo", "la cafeína consumida en el turno"], "ans": 2, "why": "«Debido al efecto de la adrenalina en el organismo. La precipitación puede incrementar el número de errores».", "src": "Manual 8 (nov. 2026), capítulo 6.4, p. 54", "note": ""}, {"n": 324, "stem": "Según el manual, con niveles de estrés significativos el controlador a menudo tenderá a:", "opts": ["usar procedimientos ya no operativos y su lengua materna", "aplicar con más rigor la fraseología normalizada en inglés", "preparar siempre un plan B antes de actuar", "asumir menos riesgos que en condiciones normales"], "ans": 0, "why": "Otros efectos: no disponer de «plan B», propensión a asumir más riesgos, fijación mental, pasar la responsabilidad a otros.", "src": "Manual 8 (nov. 2026), capítulo 6.4, p. 54", "note": ""}, {"n": 325, "stem": "Según el manual, la gestión de riesgos relativos al estrés ofrece la oportunidad de maximizar el bienestar del personal ATM con el propósito final de:", "opts": ["reducir los costes de personal de la organización", "aumentar la capacidad declarada de los sectores", "cumplir los requisitos de licencia del 2015/340", "mejorar la seguridad y la eficiencia"], "ans": 3, "why": "«Con el propósito final de mejorar la seguridad y la eficiencia»; debe considerarse un componente vital de la organización.", "src": "Manual 8 (nov. 2026), capítulo 6.4, p. 54", "note": ""}, {"n": 326, "stem": "¿Cuál NO está entre las medidas de mitigación del estrés que, según el manual, sugiere la normativa europea?", "opts": ["Adoptar una política de estrés y un programa de gestión del estrés por incidente crítico", "Monitorizar y gestionar los riesgos del estrés de forma proactiva y sistemática", "Establecer mecanismos de actuación si el estrés impide tareas críticas de seguridad", "Prohibir los turnos nocturnos a los controladores con síntomas de estrés"], "ans": 3, "why": "Además: mitigar el impacto operacional del estrés, proveer formación/información y educación y promover actividades que ayuden a mitigar el estrés.", "src": "Manual 8 (nov. 2026), capítulo 6.4, p. 54-55", "note": ""}, {"n": 327, "stem": "Según el manual, un incidente crítico se define como un evento que:", "opts": ["sucede repentina o inesperadamente y puede crear distrés severo", "termina siempre en un accidente con víctimas mortales", "se repite con frecuencia y genera estrés crónico", "se notifica de forma obligatoria según el Reglamento 2015/1018"], "ans": 0, "why": "Puede causar molestia o inhabilitación para el ejercicio de las funciones en ese momento o posteriormente.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 55", "note": ""}, {"n": 328, "stem": "Según el manual, el programa CISM es un protocolo de intervención desarrollado para cubrir el apoyo psicológico del personal operativo y así evitar:", "opts": ["las sanciones derivadas de un incidente", "reacciones de estrés post-traumático", "la fatiga acumulada por el trabajo a turnos", "los errores de colación en frecuencia"], "ans": 1, "why": "Ayuda a compartir experiencias, descargar emociones y aprender sobre los síntomas y reacciones del estrés tras un suceso traumático.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 55", "note": ""}, {"n": 329, "stem": "Según el manual, ENAIRE implantó el programa CISM con el objeto de moderar el impacto del incidente sobre el controlador y:", "opts": ["determinar las responsabilidades del suceso", "sustituir la asistencia psicológica profesional", "acelerar su regreso a la normalidad laboral", "reducir el número de notificaciones de seguridad"], "ans": 2, "why": "Como ayuda estructurada a la reacción humana ante incidencias ATC de carácter traumático.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 56", "note": ""}, {"n": 330, "stem": "Según el manual, el proceso de selección de los <em>peers</em> de ENAIRE se basa en los requisitos de qué documento de EUROCONTROL (2008)?", "opts": ["Managing Stress in ATM", "Systems Thinking for Safety: Ten Principles", "From Safety-I to Safety-II", "Critical Incident Stress Management: User Implementation Guidelines"], "ans": 3, "why": "Literal de la fase 2 del programa. «Managing Stress in ATM» es la fuente de la figura 10.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 57", "note": ""}, {"n": 331, "stem": "¿Qué fase del programa CISM ocupa el cuarto lugar?", "opts": ["La intervención del <em>peer</em> con el controlador afectado", "La derivación a un profesional médico cuando proceda", "La evaluación periódica del programa", "La selección y formación de los <em>peers</em>"], "ans": 1, "why": "1 comunicación y divulgación; 2 selección y formación de los <em>peers</em> y grupos de interés; 3 intervención del <em>peer</em>; 4 derivación a un profesional médico; 5 evaluación periódica.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 57-58", "note": ""}, {"n": 332, "stem": "¿Cuál NO forma parte del perfil idóneo del <em>peer</em> que recomienda EUROCONTROL (1997, 2008) según el manual?", "opts": ["Ser emocionalmente estable", "Aceptar estar disponible en su tiempo libre si fuera necesario", "Tener conocimiento operacional adecuado del entorno ATC", "Tener titulación oficial en psicología clínica"], "ans": 3, "why": "El <em>peer</em> es un controlador con amplia experiencia; debe conocer las limitaciones del CISM (primeros auxilios, no asistencia psicológica profesional).", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 57", "note": ""}, {"n": 333, "stem": "Según el manual, a efectos de estadística el programa CISM lleva un control de:", "opts": ["los nombres de los controladores atendidos", "las sanciones derivadas de cada activación", "las activaciones frente al número de incidencias", "las horas de servicio de cada <em>peer</em>"], "ans": 2, "why": "La evaluación periódica usa cuestionarios totalmente anónimos y se recoge en un informe anual.", "src": "Manual 8 (nov. 2026), capítulo 6.5, p. 58", "note": ""}, {"n": 334, "stem": "Según el capítulo 7, el error humano es:", "opts": ["evitable por completo con formación y procedimientos", "inevitable y también necesario para promover el aprendizaje", "consecuencia exclusiva de la falta de motivación", "responsabilidad única del controlador que lo comete"], "ans": 1, "why": "También necesario para entender las debilidades de los sistemas; se pueden identificar los contextos y condiciones que lo facilitan.", "src": "Manual 8 (nov. 2026), capítulo 7, p. 58", "note": ""}, {"n": 335, "stem": "Según el manual, el GEMS clasifica los errores como consecuencia de un comportamiento:", "opts": ["intencional o no intencional", "individual o colectivo", "técnico o humano", "consciente o automático"], "ans": 0, "why": "Y se subdividen en deslices, lapsus y equivocaciones según el grado de intencionalidad y el proceso cognitivo más relevante.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 58", "note": ""}, {"n": 336, "stem": "Según el manual, ¿cómo se suelen reducir los deslices (<em>slips</em>)?", "opts": ["Con refrescos frecuentes de la información y ayudas cognitivas externas", "Con procedimientos, estandarización y el estado mental (<em>mindset</em>)", "Con entrenamiento procedimental y atencional, monitorización mutua y checklists", "Con la derivación a un profesional médico"], "ans": 2, "why": "Los deslices están relacionados con el control de los procesos atencionales. A es la mitigación de los lapsus; B, la de las equivocaciones.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 337, "stem": "Según el manual, fallar en «recordar qué iba a hacer más adelante» (memoria prospectiva) es un ejemplo de:", "opts": ["desliz", "lapsus", "equivocación", "sesgo de expectativa"], "ans": 1, "why": "Los lapsus se relacionan con los procesos mnemónicos y la memoria de trabajo: olvidos de información reciente, fallo de memoria prospectiva o no almacenar información.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 338, "stem": "Según el manual, ¿qué errores son esencialmente respuestas automáticas, sin decisión consciente?", "opts": ["Los deslices y los lapsus", "Las equivocaciones", "Los sesgos de continuidad de plan", "Las transgresiones"], "ans": 0, "why": "Las equivocaciones, en cambio, parten de decisiones basadas en conocimiento, experiencia y modelos mentales que funcionaron en el pasado.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 339, "stem": "Según el manual, las equivocaciones están relacionadas con:", "opts": ["el control de los procesos atencionales", "la conciencia situacional y la toma de decisiones", "los procesos mnemónicos y la memoria de trabajo", "la inercia del sueño tras despertar"], "ans": 1, "why": "Una conciencia situacional no actualizada o un modelo mental incorrecto llevan a decisiones incorrectas. A son los deslices; C, los lapsus.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 340, "stem": "Además de los procedimientos y la estandarización de métodos de trabajo, ¿qué destaca el manual para mitigar las equivocaciones?", "opts": ["Las ayudas cognitivas externas como la etiqueta o la ficha", "El entrenamiento atencional y la monitorización mutua", "La reducción de la carga de trabajo del turno", "El estado mental (<em>mindset</em>), consciente de la vulnerabilidad a los sesgos"], "ans": 3, "why": "Ejemplos de sesgos: continuidad de plan, expectativa y familiaridad.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 60", "note": ""}, {"n": 341, "stem": "¿Cuál de estas NO es una de las cuatro grandes familias de sesgos del manual?", "opts": ["Los que deciden qué debo recordar", "Los que aparecen cuando necesito actuar rápido", "Los que surgen cuando la información no tiene suficiente significado", "Los que surgen cuando hay que coordinar con otro sector"], "ans": 3, "why": "La cuarta familia es la de los que filtran información cuando hay demasiada y orientan la atención hacia determinados estímulos.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 60", "note": ""}, {"n": 342, "stem": "Según el manual, el TEM busca identificar el origen y la gestión de los errores en la interacción entre los controladores y su contexto operacional, que incluye:", "opts": ["la organización, los procedimientos y las condiciones ambientales", "los pilotos, las aerolíneas y los aeropuertos", "el sueño, la fatiga y el estrés", "el emisor, el canal y el receptor"], "ans": 0, "why": "El método establece cómo se originan los errores, cómo se responde a ellos, cómo se detectan y cuáles son sus consecuencias.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 60", "note": ""}, {"n": 343, "stem": "Según el manual, la clave del modelo TEM es el análisis de acciones u omisiones que generan un estado inseguro:", "opts": ["que siempre acaba en un accidente o incidente", "en el que la situación no desemboca en un suceso", "cometidas solo por los pilotos", "que solo se analizan tras un accidente"], "ans": 1, "why": "Con el fin de detectar y capturar posibles errores, individuales y de equipo, como mecanismo para crear seguridad.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 60", "note": ""}, {"n": 344, "stem": "En la figura 11 (modelo TEM de la OACI), ¿qué palabras aparecen dentro del triángulo invertido situado bajo «Errors»?", "opts": ["Detect y Correct", "Avoid y Trap", "Resist y Resolve", "Threats y Strategies"], "ans": 2, "why": "El esquema va de Threats a un trapecio de Strategies, luego a Errors, al triángulo Resist/Resolve y, abajo, a Consequence.", "src": "Manual 8 (nov. 2026), capítulo 7.2, figura 11, p. 61", "note": ""}, {"n": 345, "stem": "En la figura 11, ¿qué elemento se sitúa entre «Threats» y «Errors»?", "opts": ["Strategies", "Consequence", "Resist", "Undesired states"], "ans": 0, "why": "Las amenazas pasan por las estrategias antes de los errores; los estados no deseados se explican en el texto, no en la figura.", "src": "Manual 8 (nov. 2026), capítulo 7.2, figura 11, p. 61", "note": ""}, {"n": 346, "stem": "Según el manual, las equivocaciones cometidas por personas que no trabajan en el entorno operativo son, para el controlador:", "opts": ["errores propios", "estados no deseados", "amenazas", "lapsus"], "ans": 2, "why": "Se incluyen entre las amenazas junto con indicativos similares, procedimientos locales no normalizados, restricciones del espacio aéreo, meteorología adversa, congestión y contingencias.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 61", "note": ""}, {"n": 347, "stem": "Según el manual, ¿puede llegarse a un estado no deseado sin haber cometido errores?", "opts": ["No, siempre hace falta un error previo del controlador", "Sí, las amenazas pueden llevar a estados no deseados sin errores", "Solo si hay meteorología adversa en el sector", "Solo cuando el error lo comete un piloto"], "ans": 1, "why": "No siempre hay una relación directa y lineal Amenaza-Error-Estado no deseado; también puede haber errores sin amenazas.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 61-62", "note": ""}, {"n": 348, "stem": "Según el manual, en el TEM los errores pueden ser:", "opts": ["solo consecuencia de amenazas previas", "siempre detectados por el sistema", "únicamente omisiones del piloto", "espontáneos, ligados a amenazas o encadenados"], "ans": 3, "why": "Se materializan en decisiones u omisiones del controlador que impiden cumplir los objetivos y comprometen los márgenes de seguridad.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 349, "stem": "Según el manual, para el método TEM es tan importante estudiar las circunstancias no deseadas que se pueden crear en las operaciones como:", "opts": ["el análisis de los errores y amenazas potenciales", "la sanción de los responsables de cada suceso", "la medición de la carga de trabajo del sector", "la revisión de los turnos de los controladores"], "ans": 0, "why": "Los errores y amenazas del trabajo cotidiano pueden generar estados no deseados (<em>undesired states</em>) que pueden convertirse en un riesgo.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 350, "stem": "Según el manual, ¿qué permite adelantarse a amenazas internas y estados no deseados?", "opts": ["El conocimiento en factores humanos", "La aplicación estricta de las sanciones", "La automatización completa del sector", "La reducción del tráfico en hora punta"], "ans": 0, "why": "Entrenar la detección de estados no deseados es esencial para consolidar estrategias de trabajo seguras.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 351, "stem": "Según la bibliografía del manual, ¿qué circular de la OACI (2005) trata del Manejo de Amenazas y Errores (TEM) en el control de tránsito aéreo?", "opts": ["Circular 216-AN31", "Doc. 9735 AN/960", "CIR 314 AN/178", "Doc. 9966"], "ans": 2, "why": "OACI (2005), «Manejo de Amenazas y Errores (TEM) en el Control de Tránsito Aéreo», CIR 314 AN/178. El Doc. 9735 trata de la observación continua del programa de auditoría.", "src": "Manual 8 (nov. 2026), capítulo 8 (bibliografía), p. 64", "note": ""}, {"n": 352, "stem": "¿Qué obra de Hollnagel (2009) figura en la bibliografía del manual?", "opts": ["The ETTO Principle: Efficiency-Thoroughness Trade-off", "Behind Human Er
