n una situación para la que no es adecuada. Las equivocaciones parten de decisiones basadas en conocimiento, experiencia y modelos mentales; A es el desliz y B el lapsus.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 136, "stem": "¿Cómo sugiere el manual mitigar los lapsus?", "opts": ["Con refrescos frecuentes de la información y ayudas cognitivas externas", "Con más llamadas por radio a las aeronaves", "Hablando más rápido para ganar tiempo", "Con sanciones que refuercen la atención"], "ans": 0, "why": "Ayudas cognitivas externas como anotar en etiqueta, anotaciones en ficha o en un papel, o cualquier otra «muleta cognitiva».", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 59", "note": ""}, {"n": 137, "stem": "¿Cuál de estos es un sesgo cognitivo que nombra el manual?", "opts": ["El sesgo de continuidad de plan", "El sesgo meteorológico", "El sesgo de velocidad", "El sesgo de radio"], "ans": 0, "why": "También el sesgo de expectativa y el sesgo de familiaridad.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 60", "note": ""}, {"n": 138, "stem": "Los sesgos cognitivos tienen su origen en:", "opts": ["la fatiga acumulada a lo largo del turno", "procesos heurísticos con reglas rápidas «si A, entonces B»", "el ruido y las interferencias de la frecuencia", "la legislación y los procedimientos locales"], "ans": 1, "why": "Son adaptativos, pero pueden interferir en un entorno complejo como el ATM.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 60", "note": ""}, {"n": 139, "stem": "¿Cuántas grandes familias de sesgos distingue el manual?", "opts": ["Dos", "Tres", "Cuatro", "Seis"], "ans": 2, "why": "Qué debo recordar; filtrar la información; actuar rápido; información sin suficiente significado.", "src": "Manual 8 (nov. 2026), capítulo 7.1, p. 60", "note": ""}, {"n": 140, "stem": "El TEM fue desarrollado por:", "opts": ["EUROCONTROL", "la OACI", "la IATA", "AESA"], "ans": 1, "why": "El manual dice que es un concepto de la OACI.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 60", "note": ""}, {"n": 141, "stem": "En el TEM, las amenazas son:", "opts": ["errores cometidos por el propio controlador en frecuencia", "los desenlaces de los accidentes e incidentes", "incidencias externas que aumentan la complejidad, no propiciadas por el controlador", "incidencias siempre previsibles, como la meteorología"], "ans": 2, "why": "Por ejemplo, indicativos de llamada similares o condiciones meteorológicas adversas; pueden ser previsibles o imprevistas.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 61", "note": ""}, {"n": 142, "stem": "Un piloto que copia las instrucciones transmitidas a otra aeronave se da como ejemplo de:", "opts": ["un estado no deseado", "una amenaza previsible", "un lapsus", "una amenaza imprevista"], "ans": 3, "why": "Una amenaza inesperada exige la pericia del controlador; la meteorología adversa es una amenaza previsible.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 61", "note": ""}, {"n": 143, "stem": "Una aeronave que asciende a un nivel de vuelo no autorizado es un ejemplo de:", "opts": ["un estado no deseado", "una amenaza previsible", "una consecuencia (accidente)", "un lapsus"], "ans": 0, "why": "Es una situación en la que ha fallado la planificación y se reducen los márgenes de seguridad; todavía puede recuperarse.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 144, "stem": "¿Qué diferencia un estado no deseado del resultado en el TEM?", "opts": ["Nada: en el modelo TEM son términos sinónimos", "El estado no deseado aún puede resolverse; el resultado, ya no", "El resultado puede revertirse; el estado no deseado, no", "Los estados no deseados solo los generan los pilotos"], "ans": 1, "why": "El manual dice que, una vez que se produce el resultado, no se puede deshacer.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 145, "stem": "Según el manual, el control del tránsito aéreo consiste, de forma implícita, en:", "opts": ["la detección de estados no deseados", "la prevención de todas las amenazas", "la eliminación de todos los errores", "la presentación de informes"], "ans": 0, "why": "Tanto los que aparecen de forma natural por la evolución del tráfico como los que genera la propia actuación ATC.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 62", "note": ""}, {"n": 146, "stem": "¿Qué supone el TEM respecto a los errores y las amenazas?", "opts": ["Que se pueden eliminar del todo con formación", "Que no son eliminables y hacen falta estrategias", "Que los causan siempre los pilotos, no el ATC", "Que siguen siempre una cadena directa y lineal"], "ans": 1, "why": "La relación Amenaza-Error-Estado no deseado no es siempre directa ni lineal.", "src": "Manual 8 (nov. 2026), capítulo 7.2, p. 61-62", "note": ""}, {"n": 147, "stem": "Según el manual, ¿en qué documento distingue la OACI entre factores humanos y actuaciones humanas?", "opts": ["Doc. 9966", "Doc. 10151", "Circular 216-AN31", "Doc. 9859"], "ans": 1, "why": "«OACI distingue entre factores humanos y actuaciones humanas de la siguiente manera en su Doc. 10151». El Doc. 9966 es el de la gestión de la fatiga y la Circular 216 la del modelo SHELL.", "src": "Manual 8 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 148, "stem": "¿Cuál de estas disciplinas NO enumera el manual entre las que aportan a los factores humanos la comprensión de las actuaciones humanas?", "opts": ["La sociología y la antropología", "Las ciencias médicas, incluida la medicina de aviación", "El diseño, la ingeniería, la informática y la estadística", "El derecho aeronáutico y la economía del transporte"], "ans": 3, "why": "El manual cita la psicología (cognitiva, organizacional y del trabajo, social), la psicología conductual, la sociología, la antropología, las ciencias médicas (medicina de aviación y ocupacional), el diseño e ingeniería, la informática y la estadística.", "src": "Manual 8 (nov. 2026), capítulo 1.1, p. 4", "note": ""}, {"n": 149, "stem": "En la figura 1 (esquema del modelo de Reason), ¿en qué orden aparecen los rótulos superiores, de izquierda a derecha?", "opts": ["Organización, Lugar de trabajo, Personas, Defensas, Accidente", "Personas, Lugar de trabajo, Organización, Defensas, Accidente", "Defensas, Organización, Personas, Lugar de trabajo, Accidente", "Organización, Personas, Defensas, Lugar de trabajo, Accidente"], "ans": 0, "why": "La figura avanza de la Organización («decisiones de gestión y procesos institucionales») al Lugar de trabajo («condiciones de trabajo»), a las Personas («errores e infracciones»), a las Defensas y al Accidente.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, figura 1, p. 6", "note": ""}, {"n": 150, "stem": "En la figura 1 del modelo de Reason, ¿qué tres rótulos llevan las láminas de las «Defensas»?", "opts": ["Decisiones de gestión, procesos institucionales y cultura", "Condiciones de trabajo, turnos y ergonomía", "Errores, infracciones y omisiones", "Tecnología, capacitación y reglamentos"], "ans": 3, "why": "Las defensas son tecnología, capacitación y reglamentos. «Decisiones de gestión y procesos institucionales» es la Organización; «condiciones de trabajo», el Lugar de trabajo; «errores e infracciones», las Personas.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, figura 1, p. 6", "note": ""}, {"n": 151, "stem": "En la figura 1, ¿qué rótulo lleva la flecha que va por debajo de las láminas desde la Organización hasta las Defensas?", "opts": ["Cadena de errores activos", "Trayectoria de las condiciones latentes", "Trayectoria de la oportunidad del accidente", "Flujo de amenazas y errores"], "ans": 1, "why": "«Trayectoria de las condiciones latentes»: los factores de la organización pueden crear condiciones latentes que determinen una falla de las defensas.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, figura 1, p. 5-6", "note": ""}, {"n": 152, "stem": "Además de su labor sobre el error humano, ¿en qué ámbito dice el manual que ha trabajado Reason para entender qué hace que los sistemas funcionen adecuadamente?", "opts": ["Los ritmos circadianos", "La carga de trabajo mental", "Las actuaciones sobresalientes", "La comunicación no verbal"], "ans": 2, "why": "Reason ha trabajado en las actuaciones sobresalientes: qué permite a las personas, en ocasiones, tener actuaciones que salvan situaciones críticas.", "src": "Manual 8 (nov. 2026), capítulo 1.2.1, p. 6", "note": ""}, {"n": 153, "stem": "¿Qué ejemplo da el manual de conducta basada en habilidades (<em>skill-based</em>) de Rasmussen?", "opts": ["Aplicar los procedimientos operativos de forma rutinaria en frecuencia", "Decidir ante una emergencia o situación inusual en frecuencia", "Conducir un coche con experiencia como conductor", "Aprender en simulador una habilidad nueva de control"], "ans": 2, "why": "En la conducta basada en habilidades intervienen procesos automatizados, con tareas muy conocidas y rutinarias. A es el ejemplo de la conducta basada en reglas; B, el de la basada en conocimiento.", "src": "Manual 8 (nov. 2026), capítulo 1.2.2, p. 6", "note": ""}, {"n": 154, "stem": "En la figura 2 (esquema del modelo SHELL-O), ¿qué letra aparece dos veces?", "opts": ["S", "H", "E", "L"], "ans": 3, "why": "La L ocupa el centro y la casilla inferior; la H está arriba, la S a la izquierda, la E a la derecha, y la O rodea el conjunto.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, figura 2, p. 7", "note": ""}, {"n": 155, "stem": "En la figura 2 del modelo SHELL-O, ¿dónde se sitúa la O (organización)?", "opts": ["En el centro de la cruz, en lugar de la L", "En el círculo exterior que rodea al resto", "En la casilla superior, encima de la L central", "A la derecha, junto a la casilla de la E"], "ans": 1, "why": "La O aparece en un círculo exterior que engloba S, H, E y L: los factores de la organización forman parte del sistema.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, figura 2, p. 7", "note": ""}, {"n": 156, "stem": "Según el manual, ¿en qué documento propuso la OACI formalmente el modelo SHELL como modelo conceptual de factores humanos?", "opts": ["En el Doc. 10151", "En el Anexo 13", "En la Circular 216-AN31", "En la Circular 314 AN/178"], "ans": 2, "why": "El manual escribe «Circular 216-AN31» (la designación de la OACI es 216-AN/131). La Circular 314 es la del TEM y el Anexo 13 el de la investigación de accidentes.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 157, "stem": "Según el manual, el elemento humano (L) del SHELL-O puede ser cualquier operador de primera línea. ¿Qué ejemplos cita?", "opts": ["Controlador aéreo, ATSEP y piloto", "Controlador, supervisor y jefe de sala", "Piloto, tripulante de cabina y mecánico", "Controlador, meteorólogo y gestor de afluencia"], "ans": 0, "why": "«Cualquier operador de primera línea (controlador aéreo, ATSEP, piloto)», el componente central y más flexible del sistema.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7", "note": ""}, {"n": 158, "stem": "Al describir el modelo SHELL-O, ¿cuál de estos factores clasifica el manual como psicológico y no como físico o fisiológico?", "opts": ["El estrés", "Los ritmos circadianos", "La fatiga", "El ruido"], "ans": 2, "why": "Físicos y fisiológicos: visión, audición, luz, ruido, estrés, ritmos circadianos. Psicológicos: conocimiento y experiencia, idoneidad de la formación, motivación, confianza, toma de decisiones, fatiga, carga de trabajo, trabajo en equipo.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 7-8", "note": ""}, {"n": 159, "stem": "En el modelo SHELL-O del manual, el «ambiente empresarial» forma parte de:", "opts": ["la interfaz L-L, junto con la cultura empresarial", "la interfaz L-E, como entorno de trabajo interno", "la interfaz L-S, como sistema de apoyo al controlador", "la organización (O), como política de gestión de personas"], "ans": 1, "why": "L-E comprende el entorno interno (temperatura, ruido, ambiente empresarial) y el externo (condiciones meteorológicas). La «cultura empresarial» es de L-L.", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 160, "stem": "¿Qué interfaz del SHELL-O representa la relación entre el controlador y los reglamentos, manuales, listas de verificación y procedimientos operacionales normalizados?", "opts": ["L-H", "L-E", "L-L", "L-S"], "ans": 3, "why": "L-S: el controlador y todos los sistemas de apoyo a su disposición. L-H es la interfaz con la máquina (consolas, pantallas, alarmas).", "src": "Manual 8 (nov. 2026), capítulo 1.2.3, p. 8", "note": ""}, {"n": 161, "stem": "¿Cómo describe el manual al ser humano dentro del sistema aeronáutico?", "opts": ["El componente más rígido y fiable, pero también el más caro", "El componente más flexible, adaptable y valioso, pero el más vulnerable", "El componente menos relevante frente a la tecnología avanzada", "El componente más previsible y más fácil de automatizar"], "ans": 1, "why": "«El ser humano es el componente más flexible, adaptable y valioso del sistema aeronáutico, pero también el más vulnerable».", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 9", "note": ""}, {"n": 162, "stem": "Según el manual, ¿con qué está relacionada la mayoría de los factores causales que convergen en un accidente?", "opts": ["Con la falta de consideraciones de FFHH en el diseño e implantación del sistema", "Con el error aislado de un solo controlador en frecuencia", "Con fallos técnicos imprevisibles de los equipos de control", "Con meteorología adversa no prevista en el plan de vuelo"], "ans": 0, "why": "Varios factores convergen en el tiempo y el espacio; la mayoría están relacionados con la falta de consideraciones de factores humanos durante el diseño y la implantación operacional del sistema. Muy rara vez un error individual aislado precipita un accidente.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 9", "note": ""}, {"n": 163, "stem": "¿Qué número ocupa «la formación recibida» en la lista de ocho factores organizacionales del apartado 1.3.1?", "opts": ["1", "3", "5", "8"], "ans": 1, "why": "1 adecuación de los recursos humanos; 2 selección del personal adecuado; 3 formación recibida; 4 bienestar laboral; 5 eficiencia en la gestión de procesos y proyectos; 6 planificación y organización del personal; 7 gestión de riesgos; 8 cultura de la organización y comunicación.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 9", "note": ""}, {"n": 164, "stem": "Según el manual, ¿de dónde han heredado sus procesos gran parte de las metodologías de investigación actuales?", "opts": ["De la ingeniería de fiabilidad de los años sesenta", "De la psicología cognitiva de los años ochenta", "De la investigación criminal de principios del siglo XX", "De la investigación ferroviaria del siglo XIX"], "ans": 2, "why": "El concepto de error humano se hereda de las concepciones jurídicas y de la búsqueda de responsabilidad individual; las metodologías actuales vienen de los procedimientos de investigación criminal de principios del siglo XX.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 10", "note": ""}, {"n": 165, "stem": "¿Qué trabajos destaca el manual por aportar una visión científica sobre las actuaciones que fallan?", "opts": ["Los de Reason y Rasmussen", "Los de Endsley y Hopkin", "Los de Simon y Hollnagel", "Los de Lazarus y Folkman"], "ans": 0, "why": "«Por ello los trabajos de Reason y Rasmussen fueron tan importantes para aportar una visión científica sobre actuaciones que fallan».", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 10", "note": ""}, {"n": 166, "stem": "¿Cómo entienden el error las concepciones modernas de la seguridad, según el manual?", "opts": ["Como una transgresión que obliga a buscar un responsable", "Como una actuación que no logra sus objetivos, sin juicio de valor", "Como una negligencia individual que debe sancionarse", "Como un fallo técnico atribuible a los equipos"], "ans": 1, "why": "Transgresión, negligencia y error se vinculan a la búsqueda de un responsable en un marco jurídico; el enfoque contemporáneo despoja al error de todo juicio de valor.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 10", "note": ""}, {"n": 167, "stem": "En la figura 3 de EUROCONTROL, ¿qué rótulo aparece en el centro del círculo de los diez principios?", "opts": ["Safety II", "Just Culture", "System Focus", "Human Performance"], "ans": 2, "why": "Los diez principios rodean el rótulo «System Focus»; «Just Culture» es uno de los segmentos (principio 3).", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, figura 3, p. 11", "note": ""}, {"n": 168, "stem": "En la figura 3 los principios conservan su nombre original en inglés. ¿Cuál corresponde a «Recursos y limitaciones»?", "opts": ["Resources &amp; Constraints", "Demand &amp; Pressure", "Interactions &amp; Flows", "Trade-offs"], "ans": 0, "why": "Demand &amp; Pressure = demanda y presión (4); Resources &amp; Constraints = recursos y limitaciones (5); Interactions &amp; Flows = interacciones y flujos (6); Trade-offs = contrapartidas (7).", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, figura 3, p. 11-12", "note": ""}, {"n": 169, "stem": "Según el principio 1 de EUROCONTROL, entender cómo se opera realmente (<em>Work-as-Done</em>) requiere:", "opts": ["la supervisión directa de la autoridad competente", "el análisis de los registros radar de cada sector", "la simulación previa de todas las operaciones", "la implicación de quienes realizan el trabajo"], "ans": 3, "why": "Principio 1, implicación de los expertos en la materia: los especialistas son decisivos para entender la naturaleza de las operaciones y su contexto.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 11", "note": ""}, {"n": 170, "stem": "¿Qué principio sistémico de EUROCONTROL implica gestionar los flujos de actividades «end-to-end»?", "opts": ["Recursos y limitaciones", "Interacciones y flujos", "Demanda y presión", "Equivalencia"], "ans": 1, "why": "Principio 6: las operaciones dependen de actividades interrelacionadas; se diseñan los procesos según su objetivo, entendiendo las interacciones que conforman los flujos.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 171, "stem": "¿Qué principio ocupa el número 5 en la lista de EUROCONTROL?", "opts": ["Demanda y presión", "Interacciones y flujos", "Recursos y limitaciones", "Contrapartidas"], "ans": 2, "why": "4 demanda y presión, 5 recursos y limitaciones, 6 interacciones y flujos, 7 contrapartidas. El principio 5 pide equilibrar recursos adecuados (efectivos, información, competencia, equipos, procedimientos) con las limitaciones del sistema.", "src": "Manual 8 (nov. 2026), capítulo 1.3.1, p. 12", "note": ""}, {"n": 172, "stem": "Según Rasmussen (1985, 1986), citado en el manual, el error humano es el resultado de:", "opts": ["la falta de motivación del individuo en su puesto", "el desequilibrio entre las exigencias del trabajo y los recursos mentales disponibles", "la mala calidad del sueño nocturno del trabajador", "el incumplimiento deliberado de los procedimientos"], "ans": 1, "why": "De ahí concluye que las raíces del éxito y del fracaso son las mismas: una misma decisión puede tener resultados muy distintos según el contexto.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 173, "stem": "¿A quién atribuye el manual que las situaciones inseguras se hayan atribuido tradicionalmente a la variabilidad del individuo, en lugar de investigar cómo fallan los sistemas?", "opts": ["Woods y Cook (1999)", "Simon (1957)", "Hollnagel (2009)", "Dekker (2006)"], "ans": 0, "why": "El apartado 1.3.2 cita a Woods y Cook (1999) en ese punto; Simon es la racionalidad limitada, Hollnagel (2009) los <em>trade-offs</em> y Dekker (2006) la brecha WAI/WAD.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 174, "stem": "En el apartado 1.3.2, ¿a qué autor se asocian las continuas contrapartidas o «trade-offs» de los controladores, como elegir entre ser más seguro o más eficiente?", "opts": ["Rasmussen (1985)", "Simon (1957)", "Woods y Cook (1999)", "Hollnagel (2009)"], "ans": 3, "why": "«Los controladores de tránsito aéreo frecuentemente tienen que afrontar continuas contrapartidas o \"trade-offs\" en sus decisiones (Hollnagel 2009)».", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 175, "stem": "Según el manual, el objetivo de la visión Safety-II es investigar:", "opts": ["solo los accidentes con víctimas y sus causas", "las infracciones de los procedimientos y sus responsables", "cómo las cosas normalmente van bien, para explicar por qué a veces van mal", "los fallos técnicos de los equipos y su fiabilidad"], "ans": 2, "why": "Safety-II investiga «como las cosas normalmente van bien» como base para explicar que ocasionalmente «pueden ir mal» (EUROCONTROL 2013, Hollnagel 2014).", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 176, "stem": "Según el manual, en la visión Safety-II los profesionales operativos están continuamente:", "opts": ["«generando riesgo»", "«creando seguridad»", "«cumpliendo procedimientos»", "«evitando errores»"], "ans": 1, "why": "Son una fuente necesaria para la flexibilidad y la resiliencia del sistema y están continuamente «creando seguridad».", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, p. 13", "note": ""}, {"n": 177, "stem": "En la tabla 1, ¿qué enfoque y qué fila sostienen que todos los eventos suceden de la misma forma, independientemente de su resultado final?", "opts": ["Safety-I, en la fila de investigación de accidentes", "Safety-II, en la fila de investigación de accidentes", "Safety-I, en la fila de evaluación del riesgo", "Safety-II, en la fila de definición del término"], "ans": 1, "why": "En Safety-II el propósito de la investigación es entender cómo las cosas normalmente salen bien. En Safety-I los accidentes ocurren por fallos y mal funcionamiento y se buscan las causas.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, tabla 1, p. 14", "note": ""}, {"n": 178, "stem": "En la tabla 1, «entender las condiciones en las que la variabilidad de las acciones puede resultar difícil de controlar y de monitorizar debido a la complejidad de los sistemas» corresponde a:", "opts": ["Safety-I, evaluación del riesgo", "Safety-I, principio de gestión", "Safety-II, visión del factor humano", "Safety-II, evaluación del riesgo"], "ans": 3, "why": "En la fila de evaluación del riesgo, Safety-I busca causas y factores contribuyentes; Safety-II, las condiciones en que la variabilidad es difícil de controlar.", "src": "Manual 8 (nov. 2026), capítulo 1.3.2, tabla 1, p. 14", "note": ""}, {"n": 179, "stem": "Según el manual, cuando el diseñador de un sistema ve «aparente simplicidad», el profesional operativo ve:", "opts": ["«complejidad real»", "«riesgo aceptable»", "«trabajo prescrito»", "«carga excesiva»"], "ans": 0, "why": "Frase del apartado Work as Done frente a Work as Imagined.", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 14", "note": ""}, {"n": 180, "stem": "¿Qué autores cita el manual para la brecha entre el sistema tal como se diseña y el sistema como se opera realmente?", "opts": ["Edwards (1972) y Hawkins (1993)", "Dekker (2006) y Hollnagel (2014)", "Woods y Cook (1999)", "Isaac y Ruitenberg (1997)"], "ans": 1, "why": "«La experiencia operacional muestra una brecha [...] (Dekker 2006, Hollnagel 2014)».", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 14", "note": ""}, {"n": 181, "stem": "En el apartado 1.3.3, ¿a quién atribuye el manual la idea de que los conceptos de diseño son solo hipótesis sobre la relación futura entre la tecnología y lo humano?", "opts": ["Steven Shorrock", "Simon (1957)", "Woods y Dekker (2002)", "Rasmussen (1986)"], "ans": 2, "why": "«De acuerdo con Woods y Dekker (2002), los conceptos de diseño son sólo hipótesis [...] y la automatización transforma realmente las prácticas cotidianas». (La bibliografía no recoge una obra de Woods y Dekker de 2002.)", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 15", "note": ""}, {"n": 182, "stem": "¿Cuál de estas NO está entre las variedades del trabajo humano de Shorrock que enumera el manual?", "opts": ["Work as prescribed", "Work as disclosed", "Work as simulated", "Work as negotiated"], "ans": 3, "why": "La lista es: work as prescribed, disclosed, analysed, observed, simulated, instructed, measured y judged.", "src": "Manual 8 (nov. 2026), capítulo 1.3.3, p. 15", "note": ""}, {"n": 183, "stem": "Según el apartado 1.4, la política de gestión de la fatiga del proveedor debe tener en cuenta varios factores. ¿Cuál NO figura?", "opts": ["La privación del sueño", "La alteración de los ritmos circadianos", "El tiempo de actividad acumulado", "La edad de los controladores"], "ans": 3, "why": "Privación del sueño, alteración de ritmos circadianos, horarios nocturnos, tiempo de actividad acumulado y reparto de tareas.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 15", "note": ""}, {"n": 184, "stem": "Según el apartado 1.4, el Reglamento (UE) 2017/373 obliga a realizar evaluaciones de seguridad operacional ante cambios en el sistema funcional considerando como uno de los elementos clave:", "opts": ["el impacto en el factor humano", "el coste económico del cambio", "la opinión de las compañías aéreas", "la capacidad declarada del sector"], "ans": 0, "why": "«Considerando el impacto en el Factor Humano como uno de los elementos clave en el análisis».", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 15", "note": ""}, {"n": 185, "stem": "Según ATS.OR.300, ¿para qué tres fines establece la sección 3 requisitos sobre el desempeño humano?", "opts": ["Licencias, formación y evaluación de la competencia", "Turnos, descansos y periodos de vacaciones", "Sustancias psicoactivas, estrés y fatiga", "Comunicación, TRM y conciencia situacional"], "ans": 2, "why": "Prevenir y limitar: a) el uso problemático de sustancias psicoactivas; b) los efectos negativos del estrés; c) los efectos negativos de la fatiga.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 186, "stem": "Según ATS.OR.305 b), el procedimiento de detección del uso problemático de sustancias psicoactivas se aplica sin perjuicio de:", "opts": ["el Reglamento (UE) 376/2014 y el Anexo 13 de la OACI", "la Directiva 95/46/CE y la legislación nacional sobre pruebas a personas", "el Reglamento (UE) 2015/1018 y su anexo III", "el Doc. 9966 de la OACI y las Easy Rules de EASA"], "ans": 1, "why": "«Sin perjuicio de lo dispuesto en la Directiva 95/46/CE [...] y en la legislación nacional aplicable en materia de pruebas a personas»; además tiene en cuenta ATCO.A.015 del Reglamento 2015/340.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 187, "stem": "Según ATS.OR.305 c), ¿quién debe aprobar el procedimiento de detección del uso problemático de sustancias psicoactivas?", "opts": ["EUROCONTROL", "El propio proveedor de servicios", "Los representantes de los controladores", "La autoridad competente"], "ans": 3, "why": "«El procedimiento de la letra b) deberá ser aprobado por la autoridad competente».", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 16", "note": ""}, {"n": 188, "stem": "¿Qué diferencia hay entre ATS.OR.310 b) (estrés) y ATS.OR.315 b) (fatiga) en lo que el proveedor facilita a los controladores?", "opts": ["Estrés: programas de formación e información; fatiga: solo de información", "Estrés: solo programas de información; fatiga: de formación e información", "Ambos: solo formación práctica en simulador", "Ambos: solo información escrita, sin formación"], "ans": 0, "why": "ATS.OR.310 b) habla de «programas de formación e información sobre la prevención del estrés»; ATS.OR.315 b), de «programas de información sobre la prevención de la fatiga».", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17", "note": ""}, {"n": 189, "stem": "ATS.OR.310 (estrés) y ATS.OR.315 (fatiga) comienzan con «De conformidad con el punto...»:", "opts": ["ATS.OR.300", "ATCO.A.015", "ATS.OR.200", "ATS.OR.320"], "ans": 2, "why": "Ambos dicen «De conformidad con el punto ATS.OR.200, el proveedor de servicios de control del tránsito aéreo...». ATCO.A.015 aparece en ATS.OR.305.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17", "note": ""}, {"n": 190, "stem": "Según ATS.OR.310 b) y 315 b), los programas que facilita el proveedor complementan la formación sobre factores humanos facilitada conforme a:", "opts": ["el anexo IV, sección 3, del Reglamento (UE) 2017/373", "las secciones 3 y 4 de la subparte D del anexo I del Reglamento (UE) 2015/340", "el capítulo 5 del Doc. 9966 de la OACI", "el anexo III del Reglamento (UE) 2015/1018"], "ans": 1, "why": "Literal de ATS.OR.310 b) y ATS.OR.315 b).", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17", "note": ""}, {"n": 191, "stem": "¿Cuál es el primer elemento que debe especificar el sistema de turnos según ATS.OR.320 a)?", "opts": ["El número máximo de horas por periodo de servicio", "Los periodos de descanso mínimos", "El número máximo de días hábiles consecutivos de servicio", "La duración máxima del servicio sin descansos"], "ans": 2, "why": "1 días hábiles consecutivos; 2 horas por periodo de servicio; 3 duración máxima sin descansos; 4 relación servicio/descanso; 5 descansos mínimos; 6 servicios consecutivos con noche; 7 descansos tras servicio nocturno; 8 descansos en un mismo ciclo.", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 17-18", "note": ""}, {"n": 192, "stem": "En ATS.OR.320 a), el número máximo de periodos de servicio consecutivos que incluyan la noche se fija, si procede, en función de:", "opts": ["la edad y la antigüedad de cada controlador", "el número de horas de operaciones de la dependencia", "la categoría del aeropuerto y su tráfico anual", "el número de controladores con licencia en la unidad"], "ans": 1, "why": "«Dependiendo del número de horas de operaciones de la dependencia de control de tránsito aéreo en cuestión» (elemento 6).", "src": "Manual 8 (nov. 2026), capítulo 1.4, p. 18", "note": ""}, {"n": 193, "stem": "En la formación básica de FFHH que recoge el manual (Reglamento 2015/340), ¿bajo qué epígrafe aparece el estrés?", "opts": ["Actuaciones humanas", "Error humano", "Introducción a los factores humanos", "El entorno de trabajo"], "ans": 0, "why": "Actuaciones humanas: conducta individual, cultura de seguridad y conducta profesional, salud y bienestar, trabajo en equipo, necesidades básicas de las personas en el trabajo y estrés. En la formación de habilitación, en cambio, «Estrés» es un tema propio.", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 18", "note": ""}, {"n": 194, "stem": "En la formación básica, ¿qué epígrafe incluye la ergonomía y la necesidad de un buen diseño, el equipamiento y las herramientas, y la automatización?", "opts": ["Comunicación", "Actuaciones humanas", "Error humano", "El entorno de trabajo"], "ans": 3, "why": "Los cinco epígrafes: introducción a los FFHH, actuaciones humanas, error humano, comunicación y el entorno de trabajo (ergonomía, equipamiento y herramientas, automatización).", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 18", "note": ""}, {"n": 195, "stem": "En los cursos de formación de habilitación, ¿qué tema recoge «fatiga y fitness»?", "opts": ["Factores psicológicos y cognitivos", "Factores médicos y fisiológicos", "Factores sociales y organizacionales", "Estrés"], "ans": 1, "why": "Temas de habilitación: factores psicológicos y cognitivos; médicos y fisiológicos (fatiga y fitness); sociales y organizacionales (TRM, trabajo en equipo y roles, conducta responsable); estrés; error humano (errores y transgresiones); trabajo colaborativo.", "src": "Manual 8 (nov. 2026), capítulo 1.5, p. 19", "note": ""}, {"n": 196, "stem": "¿Cuál NO figura entre las áreas en las que, según el manual, una mala gestión de los FFHH pasa factura a la organización?", "opts": ["El absentismo laboral", "La satisfacción del cliente", "El posible daño a la imagen y reputación", "El precio de las tasas de navegación aérea"], "ans": 3, "why": "Compromiso de los empleados, rendimiento y productividad de la plantilla, incidentes causados por error humano, absentismo laboral, satisfacción del cliente y posible daño a la imagen y reputación.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 19", "note": ""}, {"n": 197, "stem": "Según el manual, las técnicas de FFHH permiten establecer indicadores de rendimiento específicos (KPI) para entender los nexos entre:", "opts": ["el coste de los proyectos y la capacidad de los sectores", "los objetivos de calidad y el comportamiento y rendimiento humano", "el número de incidentes y las sanciones impuestas", "la meteorología y la demanda de tráfico del día"], "ans": 1, "why": "Los KPI aportan información adicional para entender los nexos entre los objetivos de calidad y el comportamiento y el rendimiento humano.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 20", "note": ""}, {"n": 198, "stem": "Según el manual, en un clima de cultura justa los controladores aéreos:", "opts": ["notifican con confianza las incidencias de seguridad", "notifican solo los sucesos que tienen consecuencias", "evitan notificar para no ser sancionados", "delegan siempre la notificación en el supervisor"], "ans": 0, "why": "Notifican con confianza, contribuyendo a identificar debilidades y áreas de mejora y logrando un sistema más robusto y resiliente.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 20", "note": ""}, {"n": 199, "stem": "Según el manual, ¿desde qué fase del proyecto conviene incorporar el análisis del impacto sobre el factor humano para optimizar costes?", "opts": ["Desde la implantación operacional", "Desde la validación final", "Desde la conceptualización", "Desde la evaluación posterior"], "ans": 2, "why": "Mediante procesos que incorporen el análisis del impacto sobre el factor humano desde la fase de conceptualización del proyecto, con el fin de optimizar costes.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 20", "note": ""}, {"n": 200, "stem": "En la figura 4 («Which curve is your organisation on?»), ¿qué curva tiene el coste más alto en la fase de diseño y el más bajo en la operación?", "opts": ["a) Sin integración de los FFHH", "b) Integración reactiva de los FFHH", "c) Integración proactiva de los FFHH", "Las tres parten del mismo coste en el diseño"], "ans": 2, "why": "La curva proactiva parte de unos 50 en el diseño y baja hasta el mínimo en la operación; la curva sin integración parte del mínimo y sube hasta casi 90.", "src": "Manual 8 (nov. 2026), capítulo 1.6, figura 4, p. 21", "note": ""}, {"n": 201, "stem": "En la figura 4, ¿qué curva parte del coste mínimo en el diseño y alcanza el coste más alto en la operación?", "opts": ["a) Sin integración de los FFHH", "b) Integración reactiva de los FFHH", "c) Integración proactiva de los FFHH", "Ninguna: las tres terminan en el mismo coste"], "ans": 0, "why": "Sin integración de FFHH el coste es mínimo al principio y máximo en la operación; la reactiva queda en medio (se estabiliza en torno a 55).", "src": "Manual 8 (nov. 2026), capítulo 1.6, figura 4, p. 21", "note": ""}, {"n": 202, "stem": "En la figura 4, ¿qué representa el eje vertical?", "opts": ["El número de incidentes por hora de vuelo", "El coste de detectar y resolver problemas de rendimiento humano", "La carga de trabajo del controlador en cada fase", "El tiempo de implantación del proyecto"], "ans": 1, "why": "«Cost of Detecting and Resolving Human Performance Issues»; el eje horizontal recorre Design, Implementation, Operation y Life-cycle.", "src": "Manual 8 (nov. 2026), capítulo 1.6, figura 4, p. 21", "note": ""}, {"n": 203, "stem": "En la figura 4, ¿qué curva se estabiliza en un coste intermedio durante la operación?", "opts": ["a) Sin integración de los FFHH", "c) Integración proactiva de los FFHH", "Ninguna: todas descienden en la operación", "b) Integración reactiva de los FFHH"], "ans": 3, "why": "La reactiva sube durante la implantación y se estabiliza en torno a 55; la proactiva acaba en el mínimo y la que no integra los FFHH, cerca de 90.", "src": "Manual 8 (nov. 2026), capítulo 1.6, figura 4, p. 21", "note": ""}, {"n": 204, "stem": "Como cambiar el diseño es mucho más efectivo en las fases iniciales, ¿qué debe fijar como prioridad la organización, según el manual?", "opts": ["La contratación de más controladores en la fase de operación", "La sistematización de la integración de FFHH en todos los proyectos tecnológicos", "La revisión de los procedimientos solo después de cada incidente", "La reducción del coste de los equipos en la fase de diseño"], "ans": 1, "why": "«Una organización debe fijar como prioridad la sistematización de la integración de los Factores Humanos en el desarrollo e implementación de todos los proyectos tecnológicos en el entorno ATM».", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 21", "note": ""}, {"n": 205, "stem": "Desde un punto de vista empresarial, el manual enumera para qué es crítico detectar, controlar, evitar y monitorizar el impacto en el factor humano. ¿Cuál NO figura?", "opts": ["Prevenir daños", "Anticiparse a nuevos requerimientos legislativos", "Evitar sanciones", "Aumentar la capacidad declarada de los sectores"], "ans": 3, "why": "La lista es: prevenir daños, anticiparse a nuevos requerimientos legislativos, evitar sanciones y favorecer la buena imagen pública e interna de la compañía.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 22", "note": ""}, {"n": 206, "stem": "Según el manual, las mayores exigencias de la normativa europea a los proveedores sobre la gestión del factor humano tendrán un impacto:", "opts": ["inmediato", "a corto plazo", "a medio y largo plazo", "solo en la formación inicial"], "ans": 2, "why": "«Tendrán un impacto a medio y largo plazo»; su objetivo es asegurar políticas para la salud y el bienestar laboral y una gestión de riesgos que considere el factor humano.", "src": "Manual 8 (nov. 2026), capítulo 1.6, p. 22", "note": ""}, {"n": 207, "stem": "Según el manual, un equipo es un grupo de personas que:", "opts": ["trabajan bajo control externo y rinden cuentas al superior", "comparten turno, pero tienen objetivos individuales", "interactúan dinámicamente, son interdependientes y comparten objetivo", "dependen de un líder que reparte y supervisa todas las tareas"], "ans": 2, "why": "«Un equipo es un grupo de personas que interactúan dinámicamente entre sí, sus miembros son interdependientes y tienen un objetivo común».", "src": "Manual 8 (nov. 2026), capítulo 2.1, p. 22", "note": ""}, {"n": 208, "stem": "Según el manual, ¿cuál es el propósito fundamental de la formación de equipos?", "opts": ["Reducir el número de controladores por sector", "Mejorar la imagen pública de la organización", "Aumentar la productividad individual", "Potenciar y reforzar la seguridad de la operación"], "ans": 3, "why": "Además busca mejorar la gestión y distribución del trabajo, que cada miembro conozca y acepte sus funciones, la monitorización mutua, la comunicación en bucle cerrado, la interdependencia y las sinergias.", "src": "Manual 8 (nov. 2026), capítulo 2.1, p. 22-23", "note": ""}, {"n": 209, "stem": "Entre los objetivos de la formación de equipos, el manual pide una comunicación constante:", "opts": ["en bucle cerrado, de lo relevante a todos los afectados", "jerárquica, dirigida solo al supervisor de la sala", "escrita en el registro de la dependencia", "limitada a las incidencias graves de seguridad"], "ans": 0, "why": "Comunicación en bucle cerrado, que se materialice tanto en la forma de emitir la información como en ser capaz de escuchar.", "src": "Manual 8 (nov. 2026), capítulo 2.1, p. 23", "note": ""}, {"n": 210, "stem": "Según el manual, la terminología TRM se utiliza también en otros ámbitos. ¿Cuáles cita?", "opts": ["La banca, los seguros y la logística", "La sanidad, la energía nuclear y las operaciones militares", "El ferrocarril, el transporte marítimo y la minería", "La educación, el deporte y el turismo"], "ans": 1, "why": "El TRM deriva del CRM y se transpone al control, aunque esta terminología se usa también en la sanidad, la energía nuclear o las operaciones militares.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 211, "stem": "¿Qué categoría ocupa el cuarto lugar en la lista de habilidades TRM del manual?", "opts": ["Comunicación interpersonal", "Gestión de roles dentro de un equipo", "Conciencia situacional", "Resolución de problemas y toma de decisiones"], "ans": 2, "why": "1 trabajo en equipo; 2 gestión de roles dentro de un equipo; 3 comunicación interpersonal; 4 conciencia situacional; 5 resolución de problemas y toma de decisiones; 6 gestión del estrés.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23", "note": ""}, {"n": 212, "stem": "¿Cómo son, según el manual, las habilidades TRM y las estrategias más concretas en que se dividen?", "opts": ["De naturaleza técnica, ligadas a los equipos de cada sector", "De naturaleza normativa, derivadas del Reglamento 2015/340", "De naturaleza intuitiva, imposibles de entrenar o evaluar", "De naturaleza conductual, trazables al funcionamiento humano"], "ans": 3, "why": "Son de naturaleza conductual y pueden trazarse a aspectos concretos del funcionamiento humano; por eso el TRM es una aplicación práctica y adaptada de los FFHH al ATM.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23-24", "note": ""}, {"n": 213, "stem": "¿Cuál NO figura entre los principales beneficios del TRM que enumera el manual?", "opts": ["Mayor motivación", "Continuidad y estabilidad en la forma de trabajar del equipo", "Eliminación total de los errores humanos", "Mayor flexibilidad y capacidad de adaptación a situaciones nuevas"], "ans": 2, "why": "El TRM nace de reconocer que los errores no se pueden eliminar en su totalidad. Los beneficios incluyen además programas que aumentan la cooperación y la comunicación, mayor eficiencia, mejor uso de los recursos humanos y mayor sentido de organización.", "src": "Manual 8 (nov. 2026), capítulo 2.2, p. 23-24", "note": ""}, {"n": 214, "stem": "Según el manual, la memoria a largo plazo:", "opts": ["retiene la información entre 20 y 30 segundos", "maneja como máximo seis o siete ítems", "funciona como la memoria de trabajo de un ordenador", "tiene capacidad ilimitada, aunque necesita más tiempo"], "ans": 3, "why": "A y C describen la memoria a corto plazo (apartado 3.1); B es la memoria de trabajo citada en el hiperestrés (apartado 6.3).", "src": "Manual 8 (nov. 2026), capítulo 3.1, p. 24", "note": ""}, {"n": 215, "stem": "¿Cuál NO es una de las funciones básicas del profesional del control del tráfico aéreo que enumera el apartado 3.2?", "opts": ["El mantenimiento de las radioayudas", "La supervisión del tráfico", "La gestión del espacio aéreo", "La prevención de colisiones"], "ans": 0, "why": "Prevención de colisiones, supervisión del tráfico, gestión del espacio aéreo, comunicaciones y toma de decisiones.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 25", "note": ""}, {"n": 216, "stem": "¿Cuál es la definición de conciencia situacional de Endsley que recoge el manual?", "opts": ["Un estado cognitivo de evaluación de señales pasadas y presentes en una situación dinámica", "La percepción de los elementos del entorno, la comprensión de su significado y la proyección de su estado futuro", "El conjunto de requerimientos mentales a los que se somete el trabajador en su jornada", "El efecto inmediato de la presión mental sobre el individuo"], "ans": 1, "why": "Endsley: «la percepción de los elementos en el entorno dentro de un volumen de tiempo y espacio, la comprensión de su significado y la proyección de su estado en un futuro próximo». A es la idea de Isaac y Ruitenberg; C, la carga mental de Sebastian y del Hoyo; D, la tensión mental (<em>strain</em>).", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 25", "note": ""}, {"n": 217, "stem": "¿A quién atribuye el manual la conciencia situacional entendida como un estado o proceso cognitivo asociado con la evaluación de señales pasadas y presentes en una situación dinámica?", "opts": ["Isaac y Ruitenberg", "Endsley", "Hopkin", "Kontogiannis y Malakis"], "ans": 0, "why": "El manual atribuye esa idea a Isaac y Ruitenberg; Endsley define tres niveles (percepción, comprensión, proyección).", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 218, "stem": "Según Isaac y Ruitenberg, tal como los cita el manual, la conciencia situacional del controlador de tráfico aéreo se refiere a:", "opts": ["el conocimiento de una persona y su estado dentro de un espacio y tiempo continuo", "la memorización de todos los indicativos presentes en el sector", "una predicción individual dentro de un continuo de espacio/tiempo conocido y especificado", "la percepción del entorno físico de la sala de control"], "ans": 2, "why": "A corresponde al piloto; C, al controlador de tráfico aéreo.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 219, "stem": "Según el manual, «perder el control» está directamente relacionado con la falta de:", "opts": ["tiempo, conocimiento, competencia y recursos cognitivos, sobre todo ante eventos inesperados", "sueño, alimentación e hidratación durante el turno de trabajo", "radioayudas, cobertura radar y comunicaciones con las aeronaves", "supervisión, procedimientos escritos y cartas de acuerdo con otros sectores"], "ans": 0, "why": "Literal del apartado 3.2. Las dificultades de SA se expresan como «ir por detrás del tráfico» o «perder el control».", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 220, "stem": "Según el manual, Endsley relaciona los factores individuales que afectan a la conciencia situacional con:", "opts": ["los factores estresantes físicos y psicológicos del entorno", "el diseño del sistema y la complejidad del sector", "la meteorología y el volumen de tráfico", "los límites de la atención humana y de la memoria de trabajo"], "ans": 3, "why": "Los factores individuales se relacionan con los límites de la atención y la memoria de trabajo; los ambientales y del sistema, con factores estresantes físicos y psicológicos.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 26", "note": ""}, {"n": 221, "stem": "En la figura 5 (modelo de Endsley), ¿qué elementos aparecen como «Task and Environmental Factors»?", "opts": ["Goals, preconceptions, knowledge, experience", "Workload, stressors, system design, complexity", "Training, abilities, goals, workload", "Perception, comprehension, projection, decision"], "ans": 1, "why": "Task and Environmental Factors: workload, stressors, system design, complexity. Individual Factors: goals, preconceptions, knowledge, experience, training, abilities.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 5, p. 25", "note": ""}, {"n": 222, "stem": "En la figura 5, ¿cuál de estos elementos figura entre los «Individual Factors»?", "opts": ["Training", "Workload", "System design", "Complexity"], "ans": 0, "why": "Individual Factors: goals, preconceptions, knowledge, experience, training, abilities. Workload, system design y complexity son Task and Environmental Factors.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 5, p. 25", "note": ""}, {"n": 223, "stem": "En la figura 5, ¿qué secuencia sigue a la conciencia situacional (<em>Situation Awareness</em>)?", "opts": ["Decision, Performance of action, State of the environment/system", "Performance of action, Decision, Perception", "Projection, Comprehension, Perception", "Workload, Stressors, Decision"], "ans": 0, "why": "La SA lleva a la decisión, esta a la ejecución de la acción (<em>Performance of action</em>), que modifica el estado del entorno/sistema, que vuelve a alimentar la SA.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 5, p. 25", "note": ""}, {"n": 224, "stem": "En la figura 5, el nivel 3 de la conciencia situacional es:", "opts": ["Perception of data and the elements of the environment", "Comprehension of the meaning and significance of the situation", "Decision", "Projection of future states and events"], "ans": 3, "why": "Nivel 1 percepción, nivel 2 comprensión, nivel 3 proyección; la decisión queda fuera del recuadro de la SA.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 5, p. 25", "note": ""}, {"n": 225, "stem": "¿Cuántos elementos que influyen en la conciencia situacional aparecen en la figura 6 (Isaac y Ruitenberg)?", "opts": ["Seis", "Ocho", "Once", "Diez"], "ans": 2, "why": "Adjacent centres, Personal factors, Weather, Airport infrastructure, Colleagues, Traffic, Operators and pilots, Environment, Navigational aids, Aircraft performance y Equipment.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 226, "stem": "En la figura 6, ¿dentro de qué elemento aparece el «social gradient» (gradiente social)?", "opts": ["Personal factors", "Colleagues", "Operators and pilots", "Adjacent centres"], "ans": 1, "why": "Colleagues: strengths/weaknesses, performance level, social gradient, training in progress.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 227, "stem": "En la figura 6, el «R/T level (incl. vocabulary)» es un aspecto de:", "opts": ["Operators and pilots", "Equipment", "Navigational aids", "Colleagues"], "ans": 0, "why": "Operators and pilots: familiarity level, performance level, R/T level (incl. vocabulary).", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 228, "stem": "En la figura 6, ¿qué aspectos se asocian a «Personal factors»?", "opts": ["Strengths/weaknesses, performance level, training in progress", "Familiarity level, performance level, R/T level", "Availability, reliability, performance, degradations", "Physical comfort, stress, fatigue"], "ans": 3, "why": "A es Colleagues; B, Operators and pilots; C, Equipment.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 229, "stem": "¿Cuál de estos NO es uno de los elementos de la figura 6?", "opts": ["Weather", "Airport infrastructure", "Automation", "Navigational aids"], "ans": 2, "why": "La figura no incluye la automatización. Weather incluye current, forecast y special (shear, upperwinds); Airport infrastructure, available runways, work in progress y visual aids.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 230, "stem": "En la figura 6, «obstacles, terrain characteristics, noise sensitivity» son aspectos del elemento:", "opts": ["Environment", "Airport infrastructure", "Weather", "Traffic"], "ans": 0, "why": "Environment: obstáculos, características del terreno y sensibilidad al ruido. Traffic: situation («picture»), development, patterns, flow.", "src": "Manual 8 (nov. 2026), capítulo 3.2, figura 6, p. 27", "note": ""}, {"n": 231, "stem": "En TRM, ¿qué hace la mente cuando al modelo mental le falta información, según el manual?", "opts": ["Detiene la toma de decisiones hasta completarla", "Lo rellena con asunciones basadas en experiencias pasadas", "Solicita siempre la información que falta al resto del equipo", "Ignora el hueco y trabaja solo con lo percibido"], "ans": 1, "why": "De ahí dos elementos vitales: el equipo como fuente de información y que la mayoría de los incidentes presentan alguna asunción. La mente hace asunciones por su funcionamiento natural, no defectuoso.", "src": "Manual 8 (nov. 2026), capítulo 3.2, p. 27", "note": ""}, {"n": 232, "stem": "¿De quién es la definición de carga de trabajo mental como el conjunto de requerimientos mentales, cognitivos o intelectuales a los que se ve sometido el trabajador a lo largo de su jornada?", "opts": ["Sebastian y del Hoyo (2002)", "Yerkes y Dodson", "Kontogiannis y Malakis (2013)", "La norma UNE-EN ISO 10075-2"], "ans": 0, "why": "Es decir, el nivel de esfuerzo intelectual necesario para desempeñar las tareas.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 233, "stem": "Según el manual, la definición de carga de trabajo mental considera este concepto de acuerdo a:", "opts": ["el número de aeronaves por hora en el sector", "un marco de factores de estrés que interactúan en el individuo", "la duración del turno y de los descansos", "el nivel de activación fisiológica medido"], "ans": 1, "why": "«De acuerdo a un marco de factores de estrés que interactúan en un individuo, y que, por tanto, tienen un impacto en el rendimiento humano».", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 234, "stem": "¿Qué norma, según el manual, da orientaciones técnicas y organizativas para diseñar los sistemas de trabajo previniendo el riesgo de la carga mental, y distingue entre presión y tensión mental?", "opts": ["UNE-EN ISO 10075-3", "ISO 9001", "UNE-EN ISO 10075-2", "El Doc. 9966 de la OACI"], "ans": 2, "why": "La UNE-EN ISO 10075-2. La 10075-3 aparece solo en la bibliografía.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 235, "stem": "Según la ley de Yerkes-Dodson descrita en el apartado 3.3, el mejor modo de potenciar el rendimiento consiste en:", "opts": ["reducir al mínimo la activación del controlador", "aumentar la carga de trabajo hasta el máximo posible", "alternar periodos de máxima y mínima activación", "aumentar la motivación sin que la carga sea inmanejable"], "ans": 3, "why": "Aumentar la motivación para las tareas, procurando que la carga no llegue a ser difícil de manejar, porque eso interfiere con la actividad y genera sentimientos desagradables.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 28", "note": ""}, {"n": 236, "stem": "En la figura 7 (Yerkes-Dodson según la complejidad de la tarea), ¿cómo se compara la curva de la tarea compleja con la de la tarea sencilla?", "opts": ["Está por encima y su óptimo llega con más activación", "Está por debajo y su óptimo llega con menos activación", "Coincide con ella en toda su longitud", "Está por debajo y su óptimo llega con más activación"], "ans": 1, "why": "La curva «Complex task» queda bajo la «Simple task» y su punto óptimo está más a la izquierda: en la tarea compleja el umbral de rendimiento máximo se alcanza antes.", "src": "Manual 8 (nov. 2026), capítulo 3.3, figura 7, p. 29", "note": ""}, {"n": 237, "stem": "Según el manual, ¿en qué momento saben los profesionales del control que hay muchas probabilidades de cometer un error o de no detectar un problema?", "opts": ["Al comienzo del turno, antes de adaptarse", "Durante las coordinaciones con otro sector", "En el relevo de posición con el compañero", "Después de atender «una vara de tráfico»"], "ans": 3, "why": "Porque los recursos mentales están saturados por una atención sostenida en el tiempo.", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 29", "note": ""}, {"n": 238, "stem": "¿Qué características de los entornos proclives a una pérdida de rendimiento en la detección de señales cita el manual?", "opts": ["El tiempo de atención vigilante y el nivel de atención sostenida necesario", "La iluminación y la temperatura de la sala de control", "El número de frecuencias y de pantallas del puesto", "La edad y la experiencia del controlador de servicio"], "ans": 0, "why": "«Como son el tiempo que hay que mantener una atención vigilante o el nivel de atención sostenida necesario».", "src": "Manual 8 (nov. 2026), capítulo 3.3, p. 29", "note": ""}, {"n": 239, "stem": "En la tabla de Kontogiannis y Malakis (2013) del manual, «Limpia la bahía y la pantalla» figura como:", "opts": ["una función cognitiva", "una estrategia", "un marcador conductual", "un factor de complejidad"], "ans": 2, "why": "Función cognitiva: ajustar la monitorización y anticipación. Estrategias: identificar flujos y conflictos, simplificar la presentación radar, anticipación. Marcadores: agrupar tráficos según necesidades, «limpia la bahía y la pantalla», visualiza y anota posibles conflictos.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 30", "note": ""}, {"n": 240, "stem": "En la misma tabla de Kontogiannis y Malakis, «simplificar la presentación radar» figura como:", "opts": ["una función cognitiva", "una estrategia", "un marcador conductual", "una amenaza del TEM"], "ans": 1, "why": "Es la estrategia 2 de la función cognitiva «ajustar la monitorización y anticipación»; su marcador es «limpia la bahía y la pantalla».", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 30", "note": ""}, {"n": 241, "stem": "Según el manual, «IFR versus VFR» y «tráficos en espera» son ejemplos de qué factor de complejidad del tráfico aéreo?", "opts": ["El volumen y tipo de tráfico a gestionar", "Las características del espacio aéreo", "Las situaciones de tráfico", "Los procedimientos"], "ans": 0, "why": "Volumen y tipo de tráfico: número de tráficos, plan de sector, tráficos en evolución o en vectorización, IFR versus VFR, tráficos en espera. Las características del espacio aéreo son complejidad del sector, flujos, áreas restringidas, proximidad a otro sector o FIR.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 29", "note": ""}, {"n": 242, "stem": "Según el manual, al incrementarse la complejidad aumentan:", "opts": ["las tareas que compiten por los recursos mentales, el ritmo de trabajo y las interrupciones", "los tiempos de descanso, las coordinaciones y las autorizaciones definitivas", "la calidad del servicio, la eficiencia y la capacidad del sector", "la separación mínima aplicada, las esperas y los vectores"], "ans": 0, "why": "«Se aumenta el número de tareas que están \"compitiendo\" por los recursos mentales, el ritmo de trabajo, y el número de interrupciones debido al trabajo en equipo».", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 30", "note": ""}, {"n": 243, "stem": "Según el manual, ¿qué otro efecto evidente tiene el incremento de la complejidad sobre el servicio?", "opts": ["Se amplía la calidad del servicio con más coordinaciones", "Se delegan en el planificador todas las tareas rutinarias", "Se solicita siempre la apertura inmediata de un nuevo sector", "Se reduce la calidad del servicio, priorizando lo importante"], "ans": 3, "why": "Se reduce la calidad del servicio priorizando las tareas más importantes, simplificando los problemas y anticipándose a las amenazas; ese esfuerzo cognitivo requiere tiempo, aumenta la carga y facilita el error.", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 31", "note": ""}, {"n": 244, "stem": "Según el manual, al trabajar bajo presión extrema el controlador aéreo tiende a:", "opts": ["improvisar soluciones nuevas y creativas", "delegar todas las decisiones en el supervisor", "actuar como normalmente funciona y, a veces, omitir acciones", "detener el tráfico hasta recuperar la calma"], "ans": 2, "why": "Lo dice el final del apartado 3.4 y lo repite el inicio del capítulo 7 (Error humano).", "src": "Manual 8 (nov. 2026), capítulo 3.4, p. 31", "note": ""}, {"n": 245, "stem": "Según el manual, la comunicación es un proceso mediante el cual un emisor transmite un mensaje, verbal o no verbal, a un receptor:", "opts": ["solo de forma verbal y por un canal radio", "mediante un canal concreto y con un código común a ambos", "con un código propio del emisor que el receptor aprende", "siempre por escrito para que quede constancia"], "ans": 1, "why": "Con el fin de difundir, intercambiar o compartir información, ideas o sentimientos.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 31", "note": ""}, {"n": 246, "stem": "Según el manual, ¿qué puede provocar un fallo en nuestra comunicación?", "opts": ["Aumentar la capacidad del sector a costa de la seguridad", "Mejorar la cohesión del equipo al obligar a coordinar más", "Acelerar la coordinación al reducir el número de mensajes", "Anular la ventaja de la experiencia y disminuir la capacidad del equipo"], "ans": 3, "why": "Un fallo en nuestra comunicación puede anular la ventaja de la experiencia, disminuir la capacidad de nuestro equipo humano o contribuir a la gestación de un conflicto innecesario.", "src": "Manual 8 (nov. 2026), capítulo 4, p. 31", "note": ""}, {"n": 247, "stem": "¿Qué frase sobre las barreras de la comunicación recoge el manual?", "opts": ["«Quien mejor comunica, es quien mejor escucha»", "«Quien más habla, mejor comunica»", "«El receptor es el responsable de que el mensaje llegue»", "«Las distorsiones son siempre culpa de alguien»"], "ans": 0, "why": "Además, las distorsiones pueden no ser «culpa de nadie» y quien comunica es responsable de asegurarse de que el mensaje ha llegado.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 248, "stem": "El ejemplo «Date prisa», que para uno significa «inmediatamente» y para otro «un par de días», ilustra según el manual:", "opts": ["una barrera ambiental del entorno de trabajo", "las interferencias humanas al interpretar según conocimientos y experiencia", "el ruido del canal que impide recibir el mensaje", "la colación que comprueba la ejecución del mensaje"], "ans": 1, "why": "Son interferencias «más propias del ser humano»: interpretamos los mensajes en función de nuestros conocimientos y experiencia. El ruido del canal es el ejemplo del destornillador.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 249, "stem": "¿Qué ejemplo da el manual del componente «mismo código»?", "opts": ["El hilo telefónico o la frecuencia de radio", "El silencio como respuesta al emisor", "La jerga técnica o los códigos de un entorno compartido", "La colación de la autorización recibida"], "ans": 2, "why": "El código es un conjunto de códigos para codificar y descodificar la información. El hilo telefónico o la frecuencia de radio son ejemplos de canal.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 250, "stem": "Según el manual, el hilo telefónico o la frecuencia de radio son ejemplos de:", "opts": ["canal", "código", "mensaje", "feedback"], "ans": 0, "why": "Canal: el medio físico por el que se transmite el mensaje.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 32", "note": ""}, {"n": 251, "stem": "El manual describe escuchar como una combinación de varias acciones. ¿Cuál NO figura?", "opts": ["Oír la recepción real de sonidos", "Retener y recordar lo que se ha oído", "Actuar o responder de algún modo a lo oído", "Repetir literalmente el mensaje recibido"], "ans": 3, "why": "Oír, comprender los sonidos, comprender la interpretación, retener y recordar, y actuar o responder.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 33", "note": ""}, {"n": 252, "stem": "Según el manual, escuchar es, ante todo:", "opts": ["una obligación reglamentaria del controlador", "una muestra de respeto", "una habilidad innata que no se aprende", "una técnica de persuasión del emisor"], "ans": 1, "why": "«Escuchar es, ante todo, una muestra de respeto»; la capacidad de escuchar es una conducta que se aprende, y la escucha activa es la mejor manera de conectar emocionalmente.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 33", "note": ""}, {"n": 253, "stem": "En el gráfico de la p. 34 sobre los beneficios de la escucha activa, ¿cuál NO aparece?", "opts": ["Se gana tiempo para pensar", "Se aprende del otro", "Se acorta la duración de las comunicaciones", "Se facilita la reducción de conflictos"], "ans": 2, "why": "Los nueve beneficios: clima de confianza y cercanía; comunicar aceptación e incrementar la motivación; cooperación; reducir la tensión y las diferencias de criterios; tiempo para pensar; aprender del otro; trabajar mejor; mejores decisiones con mayor seguridad; reducción de conflictos.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 34", "note": ""}, {"n": 254, "stem": "Según el gráfico de los beneficios de la escucha activa (p. 34), ¿qué se puede comunicar al usuario?", "opts": ["Autoridad, e incrementar su disciplina", "Urgencia, y reducir su tiempo de respuesta", "Neutralidad, y evitar implicarse", "Aceptación, e incrementar su motivación"], "ans": 3, "why": "«Se puede comunicar aceptación e incrementar la motivación del usuario»; también se estimula su cooperación.", "src": "Manual 8 (nov. 2026), capítulo 4.1, p. 34", "note": ""}, {"n": 255, "stem": "Según la edición de noviembre de 2026 del manual, en una barrera semántica:", "opts": ["el emisor usa palabras con un significado y el receptor lo interpreta de otra manera", "el emisor habla muy rápido o su lengua materna es distinta de la del receptor", "el receptor tiene sordera o problemas visuales que limitan la recepción", "el ruido de la sala impide oír bien el mensaje transmitido"], "ans": 0, "why": "Barrera semántica (cognitiva): significado distinto para emisor y receptor. B es la barrera verbal, C la fisiológica y D la ambiental. La edición de noviembre de 2026 corrige la errata de la anterior («el emisor lo interpreta»).", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 256, "stem": "¿Qué caracteriza a las barreras ambientales de la comunicación según el manual?", "opts": ["Dependen del estado emocional del emisor o del receptor", "Se deben a limitaciones fisiológicas de las personas", "Proceden de dificultades en el procesamiento cognitivo", "Son impersonales: barreras físicas del entorno (ruidos, iluminación)"], "ans": 3, "why": "Ejemplos: incomodidad física, distracciones visuales, interrupciones y ruidos. A es la barrera psicológica, B la fisiológica y C la cognitiva.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 257, "stem": "Tener pocas referencias sobre el receptor, lo que lleva a no adaptar el mensaje al suponerle códigos o conocimientos que no posee, es según el manual una barrera:", "opts": ["cognitiva", "ambiental", "fisiológica", "psicológica"], "ans": 0, "why": "Es uno de los ejemplos de barreras cognitivas, junto con las verbales, las semánticas, la falta de conocimiento de procedimientos o términos y la carga de trabajo.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 258, "stem": "En el manual, «Carga de trabajo: la fatiga nos puede impedir procesar bien la información» aparece como ejemplo de barrera:", "opts": ["psicológica", "fisiológica", "cognitiva", "ambiental"], "ans": 2, "why": "Figura entre las barreras cognitivas, no entre las fisiológicas (voz débil, sordera) ni entre las psicológicas (emociones, estrés).", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 35", "note": ""}, {"n": 259, "stem": "Según el manual, el estrés que lleva a una comunicación excesivamente agresiva es un ejemplo de barrera:", "opts": ["cognitiva", "psicológica", "fisiológica", "ambiental"], "ans": 1, "why": "Barreras psicológicas: estados emocionales del emisor o del receptor (miedo, tristeza, ira, estrés).", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 36", "note": ""}, {"n": 260, "stem": "Según el manual, el término «empatía» procede de un vocablo griego que alude a:", "opts": ["la capacidad de decir «no» sin atacar a la otra parte", "la comunicación sin palabras mediante gestos", "el respeto a la jerarquía dentro del grupo", "la capacidad de percibir los sentimientos ajenos como propios"], "ans": 3, "why": "Hoy se entiende como un sentimiento de participación afectiva en la realidad de otra persona, saber «leer» al otro. A define la asertividad.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 36", "note": ""}, {"n": 261, "stem": "Según el manual, ¿por qué debe acompañarse la empatía de la asertividad?", "opts": ["Para evitar reacciones agresivas o sentir que no se respetan los derechos propios", "Para ganar autoridad sobre el resto de los miembros del equipo", "Para acortar la duración de las comunicaciones en frecuencia", "Para cumplir la fraseología normalizada en todas las situaciones"], "ans": 0, "why": "La empatía debe acompañarse de la segunda habilidad, la asertividad, «para evitar caer en reacciones agresivas o tener la sensación de que los derechos propios no son respetados».", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 36", "note": ""}, {"n": 262, "stem": "En la figura de las tres formas básicas de reaccionar (p. 37), la agresividad implica:", "opts": ["pensar que los demás tienen más derechos que nosotros", "expresar directamente sentimientos y opiniones respetando al otro", "defender los derechos propios de forma inapropiada, sin respetar los del otro", "evitar el conflicto guardando silencio ante el otro"], "ans": 2, "why": "Agresividad: defensa de los derechos personales y expresión de los propios pensamientos de forma a menudo deshonesta, normalmente inapropiada, sin respetar los derechos de la otra persona. A es la pasividad y B la asertividad.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 37", "note": ""}, {"n": 263, "stem": "Según la figura de la p. 37, la asertividad implica un respeto:", "opts": ["solo por nuestras propias opiniones y derechos", "por los demás, por nuestras opiniones y por los derechos del otro", "por la jerarquía de la dependencia por encima de todo", "por los procedimientos, aunque se ignore a la otra persona"], "ans": 1, "why": "«La asertividad implica un respeto por los demás, respeto a nuestras propias opiniones, así como el respeto hacia los derechos y necesidades de la otra persona». La comunicación asertiva ayuda notablemente a mejorar la actuación de un equipo.", "src": "Manual 8 (nov. 2026), capítulo 4.2, p. 37", "note": ""}, {"n": 264, "stem": "Según Allan Pease, en la clasificación que recoge el manual, ¿qué recurso son los gestos y las posturas?", "opts": ["Lenguaje verbal", "Lenguaje paraverbal", "Lenguaje no verbal", "Lenguaje escrito"], "ans": 2, "why": "Verbal: las palabras (lo que se podría transcribir a un papel); no verbal: el lenguaje corporal, gestos y posturas; paraverbal: volumen, tono de voz.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 37", "note": ""}, {"n": 265, "stem": "Según el manual, el lenguaje no verbal sumado al paraverbal llega a suponer qué porcentaje de la comunicación entre personas?", "opts": ["El 50 %", "El 65 %", "El 80 %", "El 95 %"], "ans": 2, "why": "El no verbal puede suponer más del 50 %; si se le suma el paraverbal, se llega a un 80 % (Allan Pease, «El lenguaje del cuerpo»).", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 37", "note": ""}, {"n": 266, "stem": "Según el manual, tanto la comunicación no verbal como la paraverbal están relacionadas con:", "opts": ["la calidad técnica del canal de radio", "la fraseología normalizada del ATC", "el código común del entorno compartido", "el impacto de las emociones sobre la comunicación interpersonal"], "ans": 3, "why": "Las emociones nos acompañan siempre; en el trabajo necesitamos sacar partido de ellas para alcanzar nuestros objetivos.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 37", "note": ""}, {"n": 267, "stem": "Según el recuadro «Por tanto» de la p. 38, el lenguaje no verbal y el lenguaje paraverbal constituyen:", "opts": ["el lenguaje de la lógica", "el lenguaje de las emociones", "el lenguaje técnico de la profesión", "el lenguaje de la autoridad"], "ans": 1, "why": "«El lenguaje no verbal y el lenguaje paraverbal constituyen el lenguaje de las emociones, mientras que las palabras constituyen el lenguaje de la lógica».", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 268, "stem": "Según el mismo recuadro de la p. 38, ¿cuándo pasa a ser predominante el papel del lenguaje no verbal y paraverbal?", "opts": ["Cuando aparecen emociones: cansancio, estrés, presión de tiempos, conflictos", "En el día a día, cuando estamos totalmente de acuerdo y sin conflicto", "Solo en las comunicaciones por radio, sin contacto visual", "Cuando el mensaje se transmite por escrito"], "ans": 0, "why": "En el día a día, sin ningún conflicto, las palabras son más que suficientes; cuando aparecen las emociones predomina lo no verbal y paraverbal.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 269, "stem": "Según el manual, la sorpresa me ayuda a reconocer novedades siempre y cuando no me lleve:", "opts": ["a la parálisis", "al sobresalto constante", "a la ira descontrolada", "a la pérdida de energía"], "ans": 1, "why": "«Sorpresa: me ayuda a reconocer novedades, siempre y cuando no me lleve al sobresalto constante». La parálisis es el lado negativo del miedo; la pérdida de energía, la ira mal manejada.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 270, "stem": "¿De qué emoción dice el manual que su lado positivo es hacernos más responsables y cautelosos, y su lado negativo, que puede paralizarnos?", "opts": ["Tristeza", "Ira", "Sorpresa", "Miedo"], "ans": 3, "why": "Miedo. La tristeza no ayuda si nos dejamos llevar; superarla supone asumir una pérdida o tomar conciencia de una situación.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 271, "stem": "Según el manual, la ira bien manejada:", "opts": ["recarga las pilas y facilita la interacción", "me ayuda a rechazar algo que no es bueno para mi salud", "hace que me rebele contra lo que no deseo y aparezcan fuerzas para afrontarlo", "me ayuda a reconocer novedades del entorno"], "ans": 2, "why": "Mal manejada es una pérdida de energía. A describe la alegría; B, el asco; D, la sorpresa.", "src": "Manual 8 (nov. 2026), capítulo 4.3, p. 38", "note": ""}, {"n": 272, "stem": "Según el manual, la fatiga es un mecanismo biológico que:", "opts": ["no puede suprimirse de forma natural e impulsa al individuo a descansar", "puede suprimirse de forma natural con entrenamiento y experiencia", "solo aparece en los turnos nocturnos de los controladores", "no afecta al rendimiento cognitivo si hay motivación"], "ans": 0, "why": "Ignorar ese impulso interno degrada el rendimiento cognitivo, con consecuencias muy importantes en actividades relacionadas con la seguridad.", "src": "Manual 8 (nov. 2026), capítulo 5, p. 38-39", "note": ""}, {"n": 273, "stem": "Según el manual, además de los procesos circadianos, ¿qué otro inductor de fatiga cita para el CTA?", "opts": ["La exposición a la luz azul de las pantallas", "La altitud de la dependencia de control", "La carga de trabajo mental sostenida en el tiempo", "El uso continuado de auriculares en el turno"], "ans": 2, "why": "Esos factores no circadianos pueden combinarse con los circadianos, con el estrés y con otros factores personales.", "src": "Manual 8 (nov. 2026), capítulo 5, p. 39", "note": ""}, {"n": 274, "stem": "Según el apartado 5.1, puesto que la fisiología humana no varía, la única respuesta posible ante los efectos de la fatiga en el sector aeronáutico es:", "opts": ["automatizar todas las tareas críticas para la seguridad", "realizar una adecuada gestión de la fatiga que palie sus efectos", "eliminar los turnos nocturnos en las dependencias H24", "reducir el tráfico aéreo durante la noche"], "ans": 1, "why": "«Nadie es inmune a la fatiga»; la gestión debe apoyarse en los avances científicos sobre la fisiología del sueño.", "src": "Manual 8 (nov. 2026), capítulo 5.1, p. 39", "note": ""}, {"n": 275, "stem": "¿Qué fase del sueño es «poco o nada reparadora» y en ella todavía se perciben la mayoría de los estímulos auditivos y táctiles?", "opts": ["Fase I", "Fase II", "Fase III", "Fase REM"], "ans": 0, "why": "Fase I, sueño ligero, con tono muscular reducido y movimientos oculares lentos.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 276, "stem": "Según el manual, el sueño de la fase II es:", "opts": ["poco o nada reparador", "el más profundo, con predominio de ondas delta", "parcialmente reparador, insuficiente para un descanso completo", "la fase de los sueños narrativos con hilo argumental"], "ans": 2, "why": "En fase II el sistema nervioso bloquea la información sensorial, ocupa el 50 % del sueño adulto y desaparecen los movimientos oculares.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40", "note": ""}, {"n": 277, "stem": "Según el manual, los déficits de las fases III y IV del sueño causan:", "opts": ["atonía muscular", "microsueños nocturnos", "sueños con hilo argumental", "somnolencia diurna"], "ans": 3, "why": "Las fases III y IV son esenciales para la recuperación física y, especialmente, psíquica.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 40-41", "note": ""}, {"n": 278, "stem": "Según el manual, en la fase IV del sueño pueden aparecer en ocasiones sueños:", "opts": ["en forma de narración con hilo argumental", "en forma de imágenes, luces o figuras sin línea argumental", "nunca, porque es una fase sin actividad cerebral", "solo en el momento de despertar"], "ans": 1, "why": "No es la fase típica de los sueños. Los sueños narrativos, con hilo argumental aunque sea absurdo, son de la fase REM.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 41", "note": ""}, {"n": 279, "stem": "¿Cuál de estos factores NO cita el manual como capaz de afectar negativamente a la calidad del sueño?", "opts": ["El envejecimiento", "Los trastornos del sueño como la apnea", "La ingesta de cafeína, alcohol o nicotina", "La práctica regular de deporte"], "ans": 3, "why": "También la interrupción de los ciclos y los factores medioambientales (iluminación o temperatura inadecuadas). El deporte aparece en positivo: dormir bien es tan importante como comer equilibrado o hacer deporte.", "src": "Manual 8 (nov. 2026), capítulo 5.2, p. 41", "note": ""}, {"n": 280, "stem": "Según el manual, recuperar un nivel óptimo de las capacidades cognitivas tras una deuda de sueño prolongada requiere:", "opts": ["una sola noche de sueño nocturno habitual", "una siesta corta en el lugar de trabajo", "un periodo de descanso mayor que el sueño nocturno habitual", "la toma de cafeína al comienzo del turno"], "ans": 2, "why": "La deuda de sueño se acumula y degrada progresivamente la atención y la capacidad de trabajo.", "src": "Manual 8 (nov. 2026), capítulo 5.3, p. 41", "note": ""}, {"n": 281, "stem": "Según el manual, la disminución de la cantidad o de la calidad del sueño, aunque sea por una sola noche:", "opts": ["reduce la capacidad de desempeño y aumenta la somnolencia", "no tiene efectos medibles en un adulto sano", "solo afecta a personas mayores de 64 años", "mejora la tolerancia a la privación posterior"], "ans": 0, "why": "El modo en que afecta varía mucho según la tolerancia de cada individuo a la privación de sueño.", "src": "Manual 8 (nov. 2026), capítulo 5.3, p. 41", "note": ""}, {"n": 282, "stem": "Según el manual, ¿por qué pueden tener los CTA dificultades para adaptarse a un turno en que necesiten despertarse temprano?", "opts": ["Por el desajuste entre los procesos C y S", "Porque el proceso W desaparece con el trabajo a turnos", "Porque el WOCL se desplaza a primera hora de la tarde", "Porque la fase REM se alarga en las noches previas"], "ans": 0, "why": "En trabajo diurno sin turnos C y S están sincronizados; con el trabajo nocturno se desajustan y cuesta conciliar el sueño.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 283, "stem": "Según el manual, al comparar el rendimiento cognitivo a lo largo del día, este es menor:", "opts": ["a mediodía, tras la comida", "durante la madrugada, y va incrementándose en las horas siguientes", "a última hora de la tarde", "al anochecer, cuando baja la luz"], "ans": 1, "why": "Coincide con el pico más bajo del proceso circadiano (WOCL, aproximadamente de 3 a 6 a. m.).", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 284, "stem": "Para evitar la reducción de la capacidad de trabajo de quien acaba de despertarse (proceso W), el manual recomienda:", "opts": ["tomar cafeína inmediatamente al despertar", "retomar enseguida las tareas para activarse", "trabajar primero en tareas de alta vigilancia", "dejar pasar un tiempo prudencial antes de retomar las tareas"], "ans": 3, "why": "Sobre todo si las tareas requieren un alto nivel de vigilancia y alerta; el proceso W refleja la inercia del sueño.", "src": "Manual 8 (nov. 2026), capítulo 5.4, p. 42", "note": ""}, {"n": 285, "stem": "Como no existe una definición universal de carga de trabajo, el manual la evalúa con los aspectos que se relacionan con ella. ¿Cuál NO figura?", "opts": ["El tipo y la naturaleza del trabajo que ha de realizarse", "Las limitaciones de tiempo", "Los f
