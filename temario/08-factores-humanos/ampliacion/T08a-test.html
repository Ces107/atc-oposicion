@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}

nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}

.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}

h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}

pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}

main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}

.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}

.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}

.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}

.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}

.row-desc{color:var(--mut);font-size:.9rem}

.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}

@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}

table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}

c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Factores humanos</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Rendimiento humano y psicología en ATM (T08a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Qué significa la regla mnemotécnica PEAR en factores humanos?", "opts": ["People, Environment, Actions, Resources (personas, entorno, acciones, recursos)", "Perception, Ergonomics, Attention, Response (percepción, ergonomía, atención, respuesta)", "Planning, Evaluation, Analysis, Review (planificación, evaluación, análisis, revisión)", "People, Equipment, Awareness, Risk (personas, equipos, conciencia, riesgo)"], "ans": 0, "why": "PEAR sirve para recordar las cuatro consideraciones con que se evalúan y mitigan los factores humanos: personas, entorno, acciones y recursos (<em>People, Environment, Actions, Resources</em>).", "src": "SKYbrary, PEAR Model", "note": ""}, {"n": 2, "stem": "En el modelo PEAR, ¿de qué categoría son ejemplos los «conflictos interpersonales» y las «dificultades económicas»?", "opts": ["Factores psicosociales, dentro de Personas", "Factores físicos, dentro de Personas", "Factores organizacionales, dentro de Entorno", "Factores de personal, dentro de Recursos"], "ans": 0, "why": "La categoría «Personas» de PEAR incluye factores físicos, fisiológicos, psicológicos y psicosociales; los conflictos interpersonales y las dificultades económicas son psicosociales.", "src": "SKYbrary, PEAR Model", "note": ""}, {"n": 3, "stem": "¿Quién elaboró la lista de los «doce sucios» (<em>Dirty Dozen</em>) de factores humanos y para qué organización?", "opts": ["Gordon Dupont, para Transport Canada", "James Reason, para la UK CAA", "Scott Shappell, para la Armada de EE. UU.", "Elwyn Edwards, para la OACI"], "ans": 0, "why": "Gordon Dupont elaboró los «doce sucios» en 1993, cuando trabajaba para Transport Canada, como parte de un programa elemental de formación en FFHH para mantenimiento.", "src": "SKYbrary, The Human Factors \"Dirty Dozen\"", "note": ""}, {"n": 4, "stem": "¿Cuántos elementos contiene la lista original de los «doce sucios»?", "opts": ["8", "10", "12", "15"], "ans": 2, "why": "La lista enumera 12 precondiciones comunes del error humano.", "src": "SKYbrary, The Human Factors \"Dirty Dozen\"", "note": ""}, {"n": 5, "stem": "En los «doce sucios», «la forma en que se hacen aquí las cosas», impuesta por la presión de los compañeros, se denomina:", "opts": ["Normas informales (<em>Norms</em>)", "Complacencia", "Falta de asertividad", "Presión"], "ans": 0, "why": "Las «normas informales» (<em>norms</em>) son prácticas no escritas del lugar de trabajo que se apartan de las reglas o los procedimientos exigidos y se mantienen por la presión de los compañeros y por costumbre.", "src": "SKYbrary, The Human Factors \"Dirty Dozen\"", "note": ""}, {"n": 6, "stem": "Según la fuente de los «doce sucios», ¿qué porcentaje de un mensaje verbal se recibe y se entiende correctamente, por lo general?", "opts": ["Alrededor del 30 %", "Alrededor del 10 %", "Alrededor del 50 %", "Alrededor del 70 %"], "ans": 0, "why": "La fuente afirma que, en la comunicación verbal, es habitual que solo se reciba y se entienda alrededor del 30 % de un mensaje.", "src": "SKYbrary, The Human Factors \"Dirty Dozen\"", "note": ""}, {"n": 7, "stem": "¿Qué sistema de clasificación de errores de FFHH, muy basado en el modelo del queso suizo de Reason, desarrollaron Shappell y Wiegmann para la Armada de EE. UU.?", "opts": ["HFACS (<em>Human Factors Analysis and Classification System</em>, Sistema de Análisis y Clasificación de Factores Humanos)", "TEM (<em>Threat and Error Management</em>, gestión de amenazas y errores)", "GEMS (<em>Generic Error Modelling System</em>)", "SHELL-O"], "ans": 0, "why": "El HFACS lo desarrollaron Shappell y Wiegmann para la Armada de EE. UU., muy basado en el modelo del queso suizo de Reason.", "src": "SKYbrary, Human Factors Analysis and Classification System (HFACS)", "note": ""}, {"n": 8, "stem": "¿Cuántos niveles describe el marco HFACS, desde los actos inseguros hasta la organización?", "opts": ["2", "3", "4", "5"], "ans": 2, "why": "El HFACS tiene cuatro niveles: actos inseguros, precondiciones de los actos inseguros, supervisión insegura e influencias organizacionales.", "src": "SKYbrary, HFACS", "note": ""}, {"n": 9, "stem": "En el HFACS, un error que se produce durante una tarea rutinaria y muy practicada (por ejemplo, un error en una lista de verificación o un hábito negativo) se clasifica como:", "opts": ["un error de decisión", "un error de percepción", "un error basado en habilidades", "una transgresión excepcional"], "ans": 2, "why": "Los errores basados en habilidades se producen al ejecutar tareas rutinarias y muy practicadas y resultan de problemas de procedimiento, formación o competencia.", "src": "SKYbrary, HFACS", "note": ""}, {"n": 10, "stem": "En el nivel 1 del HFACS, una transgresión habitual y tolerada por la autoridad competente se denomina:", "opts": ["transgresión rutinaria", "transgresión excepcional", "error de decisión", "transgresión de supervisión"], "ans": 0, "why": "Las transgresiones rutinarias son acciones habituales toleradas por la autoridad competente, distintas de las transgresiones excepcionales (aisladas y no toleradas).", "src": "SKYbrary, HFACS", "note": ""}, {"n": 11, "stem": "¿A qué nivel del HFACS pertenecen la «supervisión inadecuada» y la «falta de corrección de un problema conocido»?", "opts": ["Actos inseguros", "Precondiciones de los actos inseguros", "Supervisión insegura", "Influencias organizacionales"], "ans": 2, "why": "El nivel 3 del HFACS, supervisión insegura, incluye la supervisión inadecuada, la operación inapropiada planificada, la falta de corrección de un problema conocido y la transgresión de supervisión.", "src": "SKYbrary, HFACS", "note": ""}, {"n": 12, "stem": "En un estudio de la Armada de EE. UU. con el HFACS, ¿qué proporción de los accidentes se asoció aproximadamente a transgresiones rutinarias?", "opts": ["Uno de cada diez, aproximadamente", "La mitad, aproximadamente", "Un tercio, aproximadamente", "Casi todos"], "ans": 2, "why": "La Armada de EE. UU. halló que casi un tercio de todos los accidentes se asociaba a transgresiones rutinarias, lo que llevó a intervenciones específicas.", "src": "SKYbrary, HFACS", "note": ""}, {"n": 13, "stem": "¿Por qué sostiene el artículo de SKYbrary sobre la «complacencia» que el término es un «modelo popular» (<em>folk model</em>) débil?", "opts": ["Porque solo se aplica al personal de mantenimiento", "Porque se inventó después del accidente de Tenerife", "Porque sustituye una etiqueta amplia por otra sin definirla en términos de componentes observables", "Porque la OACI ha prohibido oficialmente su uso"], "ans": 2, "why": "La crítica es que «complacencia» y otros términos populares similares sustituyen un término amplio por otro sin descomponerlo en conductas observables, lo que hace difícil probar o refutar el concepto.", "src": "SKYbrary, Complacency", "note": ""}, {"n": 14, "stem": "Según la Circular 216-AN/131 de la OACI (reimpresa como CAP 719), ¿quién desarrolló el concepto original SHEL y en qué año?", "opts": ["Hawkins, 1993", "Reason, 1990", "Edwards, 1972", "Rasmussen, 1985"], "ans": 2, "why": "El concepto SHEL lo desarrolló por primera vez Edwards en 1972; Hawkins añadió más tarde un diagrama modificado.", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 1", "note": ""}, {"n": 15, "stem": "En el propio texto del CAP 719, ¿en qué año elaboró Hawkins el diagrama modificado que ilustra el modelo SHEL?", "opts": ["1975", "1987", "1993", "2002"], "ans": 0, "why": "El CAP 719 dice: «a modified diagram to illustrate the model developed by Hawkins in 1975» (un diagrama modificado para ilustrar el modelo, desarrollado por Hawkins en 1975).", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 1, párr. 4.1", "note": ""}, {"n": 16, "stem": "¿Qué libro cita como referencia principal el Compendio de Factores Humanos n.º 1 de la OACI (CAP 719)?", "opts": ["«Human Error», de James Reason, 1990", "«The Field Guide to Understanding Human Error», de Sidney Dekker", "«Human Factors in Flight», de Frank Hawkins, 1987", "«Skilled Performance», de Elwyn Edwards, 1972"], "ans": 2, "why": "El compendio indica que su referencia principal fue «Human Factors in Flight», de Frank Hawkins, 1987.", "src": "Circular 216-AN/131 de la OACI / CAP 719, introducción", "note": ""}, {"n": 17, "stem": "En el modelo SHEL original de la OACI, tal como lo describe el CAP 719, ¿cuántas letras o componentes tiene el modelo?", "opts": ["Tres", "Cinco", "Cuatro", "Seis"], "ans": 2, "why": "El modelo original es SHEL (cuatro componentes: <em>Software</em>, <em>Hardware</em>, <em>Environment</em>, <em>Liveware</em>); la «O» de <em>Organization</em> es una incorporación posterior de otros autores.", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 1", "note": ""}, {"n": 18, "stem": "Según el CAP 719, ¿por qué puede pasar inadvertida una falta de adecuación entre el elemento humano y el soporte físico (L-H) aunque acabe conduciendo a un desastre?", "opts": ["Porque los fallos del soporte físico se notifican siempre de forma automática", "Porque las faltas de adecuación L-H nunca afectan a la seguridad", "Porque las personas se adaptan de forma natural a la falta de adecuación, lo que enmascara la deficiencia sin eliminarla", "Porque los supervisores siempre detectan estas faltas de adecuación durante la formación"], "ans": 2, "why": "El CAP 719 advierte de que la capacidad humana de adaptarse a las faltas de adecuación L-H enmascara la deficiencia, pero no la elimina: un peligro al que los diseñadores deben estar atentos.", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 1", "note": ""}, {"n": 19, "stem": "¿De qué problema de factores humanos pone el CAP 719 como ejemplo el accidente de Tenerife de 1977 (dos B-747, 583 vidas)?", "opts": ["La confianza excesiva en la automatización", "La ilusión visual del agujero negro", "La ruptura de los procedimientos de comunicación y la mala interpretación de los mensajes verbales", "El reglaje erróneo del altímetro"], "ans": 2, "why": "El CAP 719 recoge Tenerife 1977 como causado por una ruptura de los procedimientos normales de comunicación y una mala interpretación de mensajes verbales.", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 2", "note": ""}, {"n": 20, "stem": "Según el CAP 719, ¿qué ilusión visual se cita como factor en el accidente del B-707 en Pago Pago (Samoa) en 1974?", "opts": ["La inclinación aparente (<em>the leans</em>)", "La ilusión de Coriolis", "La ilusión del agujero negro", "La ilusión autocinética"], "ans": 2, "why": "Una ilusión visual relacionada con el «fenómeno del agujero negro» se citó como factor causal en el accidente de Pago Pago de 1974.", "src": "Circular 216-AN/131 de la OACI / CAP 719, cap. 2", "note": ""}, {"n": 21, "stem": "¿Cuál es la duración máxima que suele citarse para la memoria sensorial (por ejemplo, la memoria sensorial visual) en el artículo «Memory in ATC» de SKYbrary?", "opts": ["Menos de 0,5 segundos (la visual, unos 250 ms)", "De 15 a 30 segundos", "Unos 5 minutos", "Ilimitada"], "ans": 0, "why": "La memoria sensorial es de duración muy breve, por lo general menos de 0,5 segundos; la memoria sensorial visual dura unos 250 milisegundos.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 22, "stem": "En el artículo «Memory in ATC» de SKYbrary, una alarma sonora del STCA que capta la atención de forma automática, sin necesidad de atención selectiva, es un ejemplo de:", "opts": ["selección activa", "el bucle fonológico", "memoria prospectiva", "selección pasiva"], "ans": 3, "why": "La selección pasiva se guía por los datos y es automática, sin necesidad de atención selectiva; el artículo pone el STCA como ejemplo, en contraste con la selección activa (guiada por la atención), como captar el propio indicativo de llamada.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 23, "stem": "Según SKYbrary, ¿cuántos elementos no relacionados entre sí puede retener aproximadamente la memoria a corto plazo con ensayo atencional completo?", "opts": ["Unos 3", "Ilimitados", "Unos 12", "Unos 7"], "ans": 3, "why": "El número máximo de elementos no relacionados que pueden mantenerse en la memoria a corto plazo con ensayo completo es de unos siete.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 24, "stem": "Según el artículo «Memory in ATC», ¿por qué se desaconseja combinar un cambio de frecuencia con otra instrucción en los mensajes RTF?", "opts": ["Porque los pilotos tratan las frecuencias como dígitos individuales y eso sobrecarga la memoria a corto plazo", "Porque, por definición, infringe la fraseología de la OACI", "Porque los controladores no pueden pronunciar dos instrucciones en una sola transmisión", "Porque activa alertas automáticas del STCA"], "ans": 0, "why": "Los elementos de una frecuencia RTF son tratados por el piloto como dígitos individuales, de modo que combinar un cambio de frecuencia con otra instrucción aumenta la probabilidad de que se pierda algún elemento.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 25, "stem": "¿Qué psicólogo cognitivo propuso el modelo de memoria de trabajo que se emplea habitualmente para describir la cognición del ATCO?", "opts": ["George Miller", "Jens Rasmussen", "James Reason", "Alan Baddeley"], "ans": 3, "why": "El modelo de memoria de trabajo que se usa a menudo en los factores humanos del ATC es el que propuso Baddeley.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 26, "stem": "En el modelo de memoria de trabajo de Baddeley, ¿qué componente almacena la información auditiva o verbal mediante un almacén fonológico a corto plazo y un proceso de ensayo articulatorio?", "opts": ["El ejecutivo central", "La agenda visoespacial", "El bucle fonológico", "El búfer episódico"], "ans": 2, "why": "El bucle fonológico almacena la información auditiva mediante un almacén fonológico («oído interno») y un componente de ensayo articulatorio («voz interna»).", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 27, "stem": "¿Qué componente del modelo de Baddeley integra la información visual, espacial y verbal con la secuencia temporal?", "opts": ["El ejecutivo central", "La agenda visoespacial", "El bucle fonológico", "El búfer episódico"], "ans": 3, "why": "El búfer episódico vincula y almacena unidades integradas de información visual, espacial y verbal con secuencia temporal.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 28, "stem": "La memoria prospectiva en el ATC (por ejemplo, acordarse de comprobar más tarde el ascenso de una aeronave) se apoya mejor en:", "opts": ["la memoria sensorial únicamente", "aumentar el consumo de cafeína del controlador", "exclusivamente la agenda visoespacial", "ayudas de memoria y herramientas de apoyo del sistema, como el MTCD"], "ans": 3, "why": "La memoria prospectiva suele apoyarse en ayudas de memoria o herramientas automatizadas como el MTCD, que convierte una tarea de proyección mental en una tarea de percepción visual.", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 29, "stem": "¿Qué significa la regla mnemotécnica «WAYSRAYL», citada en el artículo Memory in ATC?", "opts": ["«Write As You See, Read As You Learn» (escribe a medida que ves, lee a medida que aprendes)", "«Warn ATC Yourself, Say Radio And You Listen» (avisa tú mismo al ATC, di por radio y escucha)", "«Watch And You Should Recall Any Yield Loss» (observa y deberías recordar cualquier pérdida de rendimiento)", "«Write what you say As You Speak, Read what you hear As You Listen» (escribe lo que dices a medida que hablas, lee lo que oyes a medida que escuchas)"], "ans": 3, "why": "WAYSRAYL es un hábito de ensayo: «Write what you say As You Speak, Read what you hear As You Listen».", "src": "SKYbrary, Memory in ATC", "note": ""}, {"n": 30, "stem": "¿En qué revista se publicó el artículo de George A. Miller (1956) sobre el «número mágico siete»?", "opts": ["Nature", "Journal of Aviation Psychology", "Human Factors", "Psychological Review"], "ans": 3, "why": "El artículo de Miller «The Magical Number Seven, Plus or Minus Two» se publicó en <em>Psychological Review</em>, volumen 63, páginas 81-97.", "src": "George A. Miller (1956), Psychological Review 63, 81-97", "note": ""}, {"n": 31, "stem": "¿Qué marco teórico utilizó Miller (1956) para medir la capacidad de las personas de procesar o transmitir información?", "opts": ["La teoría de detección de señales", "La teoría de la restauración de la atención", "La teoría de las perspectivas", "La teoría de la información"], "ans": 3, "why": "Miller plantea los experimentos de «juicio absoluto» en términos de teoría de la información y trata la «cantidad de información» como análoga a la varianza.", "src": "George A. Miller (1956), Psychological Review 63, 81-97", "note": ""}, {"n": 32, "stem": "En el artículo «Attention Span» de SKYbrary, realizar varias tareas a la vez que compiten por unos recursos de atención limitados se denomina:", "opts": ["atención selectiva", "atención sostenida", "atención dividida", "atención automática"], "ans": 2, "why": "La atención dividida se aplica cuando se realizan varias tareas a la vez que compiten por unos recursos de atención limitados («multitarea»), lo cual se señala como potencialmente peligroso.", "src": "SKYbrary, Attention Span", "note": ""}, {"n": 33, "stem": "¿Qué término trata el artículo Attention Span de SKYbrary como esencialmente sinónimo de «vigilancia»?", "opts": ["Atención dividida", "Atención alternante", "Atención sostenida", "Automaticidad"], "ans": 2, "why": "La guía citada en el artículo prefiere «atención sostenida» al término más vago «capacidad de atención» (<em>attention span</em>), y los psicólogos cognitivos llevan tiempo usando «atención sostenida» como sinónimo de vigilancia.", "src": "SKYbrary, Attention Span", "note": ""}, {"n": 34, "stem": "¿En qué se diferencian los procesos de atención «controlados» y «automáticos», según la guía citada en el artículo Attention Span de SKYbrary?", "opts": ["Los procesos controlados requieren esfuerzo y están limitados por la memoria a corto plazo; los automáticos requieren menos esfuerzo y no están limitados por ella", "Los procesos automáticos requieren siempre más esfuerzo que los controlados", "Los procesos controlados solo los usan los alumnos y los automáticos solo los expertos", "No hay ninguna diferencia significativa entre ambos"], "ans": 0, "why": "Los procesos de atención controlados requieren esfuerzo y están limitados por la memoria a corto plazo; con la formación, la atención se vuelve automática, requiere menos esfuerzo y deja de estar limitada por ella.", "src": "SKYbrary, Attention Span", "note": ""}, {"n": 35, "stem": "Según Sternberg (2003), citado en el artículo «Perception in ATC» de SKYbrary, la percepción se describe mejor como:", "opts": ["la transferencia directa de datos sensoriales en bruto al cerebro sin procesamiento", "un proceso exclusivamente auditivo", "un sinónimo de memoria a corto plazo", "un conjunto de procesos mediante los cuales reconocemos, organizamos y damos sentido a las sensaciones que recibimos del entorno"], "ans": 3, "why": "SKYbrary cita la definición de Sternberg de la percepción como un conjunto de procesos para reconocer, organizar y dar sentido a las sensaciones del entorno.", "src": "SKYbrary, Perception in ATC", "note": ""}, {"n": 36, "stem": "En un ejemplo de «Perception in ATC», ¿por qué podría un controlador percibir el nivel autorizado de una aeronave como FL330 cuando la etiqueta mostraba siempre FL350?", "opts": ["Porque el tipo de letra de la pantalla era demasiado grande", "Porque el controlador era daltónico", "Porque el transpondedor de la aeronave funcionaba mal", "Porque la expectativa influyó en la percepción: FL330 encajaba con el plan del controlador"], "ans": 3, "why": "El ejemplo ilustra que la expectativa puede hacer que un controlador perciba el valor que se ajusta a su plan y no el que realmente se muestra.", "src": "SKYbrary, Perception in ATC", "note": ""}, {"n": 37, "stem": "¿Cuál de las siguientes se enumera en el artículo de SKYbrary como defensa práctica de los controladores contra los errores de percepción?", "opts": ["Aceptar llamadas telefónicas mientras se recibe una colación para ahorrar tiempo", "Fiarse de la memoria en lugar de consultar las fichas de progresión", "No aceptar llamadas telefónicas cuando se recibe una colación", "Evitar los auriculares para estar atento a los sonidos ambientales"], "ans": 2, "why": "El artículo recomienda no aceptar llamadas telefónicas mientras se recibe una colación (<em>readback</em>), usar auriculares y no asumir nunca.", "src": "SKYbrary, Perception in ATC", "note": ""}, {"n": 38, "stem": "Según el artículo «Decision-Making» de SKYbrary, ¿cuál de estos NO es uno de los cuatro componentes de la toma de decisiones?", "opts": ["Definir el problema", "Considerar las opciones", "Revisar el resultado", "Asignar la responsabilidad legal"], "ans": 3, "why": "Los cuatro componentes son definir el problema, considerar las opciones, seleccionar o aplicar una opción y revisar el resultado; asignar la responsabilidad no forma parte del modelo.", "src": "SKYbrary, Decision-Making", "note": ""}, {"n": 39, "stem": "SKYbrary describe los sesgos cognitivos como atajos intelectuales convenientes que:", "opts": ["mejoran siempre la precisión de las decisiones", "fueron eliminados por la formación CRM en la década de 1990", "son exclusivos de los controladores de tránsito aéreo", "permiten decidir con rapidez con información incompleta, pero pueden provocar juicios irracionales"], "ans": 3, "why": "Los sesgos cognitivos (heurísticos) agilizan la toma de decisiones bajo presión o con información incompleta, pero pueden dar lugar a decisiones ilógicas o irracionales y a una valoración errónea del riesgo.", "src": "SKYbrary, Cognitive Bias", "note": ""}, {"n": 40, "stem": "¿Qué es el «sesgo de expectativa del ATC» (<em>ATC expectation bias</em>)?", "opts": ["La preferencia de un controlador por una determinada aerolínea", "Un sesgo exclusivo de los controladores en formación", "La tendencia de los controladores a esperar un ascenso tras años de servicio", "Una inclinación cognitiva por la cual las expectativas del controlador sobre una situación afectan a cómo percibe y responde a lo que realmente ocurre"], "ans": 3, "why": "El sesgo de expectativa se da cuando las expectativas o creencias sobre una situación influyen en cómo una persona percibe lo que ocurre y responde a ello.", "src": "SKYbrary, ATC Expectation Bias", "note": ""}, {"n": 41, "stem": "En la investigación de la NTSB sobre la casi colisión de Austin-Bergstrom del 4 de febrero de 2023, ¿a qué distancia llegaron a estar las aeronaves de FedEx y Southwest?", "opts": ["15-17 pies", "Unas 3 millas náuticas", "1500-1700 pies", "150-170 pies"], "ans": 3, "why": "La NTSB informó de que las dos aeronaves llegaron a estar a entre 150 y 170 pies una de otra antes de que FedEx hiciera un motor y al aire (<em>go-around</em>).", "src": "SKYbrary, ATC Expectation Bias (caso de Austin) / NTSB", "note": ""}, {"n": 42, "stem": "En el caso de Austin-Bergstrom, ¿qué citó la NTSB como factor contribuyente en el controlador de torre?", "opts": ["Fatiga tras un turno largo", "Un fallo de funcionamiento del equipo ILS", "No haber utilizado la fraseología normalizada", "Un sesgo de expectativa sobre la posición de la aeronave de Southwest"], "ans": 3, "why": "El informe de la NTSB citó como factor contribuyente el sesgo de expectativa del controlador de torre, que creía que el 737 de Southwest ya estaba en el punto de espera.", "src": "SKYbrary, ATC Expectation Bias (caso de Austin) / NTSB", "note": ""}, {"n": 43, "stem": "¿Qué significa el acrónimo SASHA en el informe de EUROCONTROL sobre la medición de la conciencia situacional?", "opts": ["<em>Safety Assessment for Sector Handling Activities</em> (evaluación de seguridad de las actividades de gestión de sectores)", "<em>Safety Analysis for Shift Handover Activities</em> (análisis de seguridad de las actividades de relevo de turno)", "<em>Situational Awareness Standard for Human Air traffic</em> (norma de conciencia situacional para el tránsito aéreo humano)", "<em>SA for SHAPE</em> (conciencia situacional para SHAPE; <em>Solutions for Human-Automation Partnerships in European ATM</em>)"], "ans": 3, "why": "SASHA significa «SA for SHAPE», donde SHAPE es el proyecto de EUROCONTROL sobre asociaciones entre humanos y automatización (<em>Human-Automation Partnerships</em>).", "src": "EUROCONTROL, EC-SA-measures-5558", "note": ""}, {"n": 44, "stem": "El informe SASHA de EUROCONTROL propone dos medidas de SA. ¿Qué pareja es la correcta?", "opts": ["SASHA_L (técnica de consulta en línea) y SASHA_Q (cuestionario)", "SASHA_A (automatizada) y SASHA_M (manual)", "SASHA_1 y SASHA_2", "SASHA_Live y SASHA_Debrief"], "ans": 0, "why": "Las dos medidas propuestas son SASHA_L («SASHA on-Line», una técnica de consulta en tiempo real) y SASHA_Q («SASHA Questionnaire», cuestionario).", "src": "EUROCONTROL, EC-SA-measures-5558", "note": ""}, {"n": 45, "stem": "¿Cuántas subescalas utiliza el Índice de Carga de Tareas de la NASA (NASA-TLX) para obtener una puntuación global de carga de trabajo?", "opts": ["3", "4", "6", "9"], "ans": 2, "why": "El NASA-TLX usa seis subescalas: demanda mental, demanda física, demanda temporal, rendimiento, esfuerzo y frustración (<em>Mental Demand, Physical Demand, Temporal Demand, Performance, Effort, Frustration</em>).", "src": "NASA-TLX v1.0 manual", "note": ""}, {"n": 46, "stem": "¿Cuál de las siguientes es una de las seis subescalas del NASA-TLX?", "opts": ["Vigilancia", "Fatiga", "Conciencia situacional", "Frustración"], "ans": 3, "why": "La frustración es una de las seis subescalas del NASA-TLX; la fatiga y el estrés se descartaron de las versiones anteriores por irrelevantes o redundantes.", "src": "NASA-TLX v1.0 manual", "note": ""}, {"n": 47, "stem": "¿Cómo se calcula la puntuación global de carga de trabajo del NASA-TLX a partir de las seis valoraciones de las subescalas?", "opts": ["Con una suma simple, sin ponderar", "Con la mediana de las seis valoraciones", "Se usa solo la puntuación más alta de las subescalas", "Con una media ponderada, cuyos pesos proceden de un procedimiento de comparación por pares entre subescalas"], "ans": 3, "why": "El NASA-TLX da una puntuación de media ponderada; los pesos se obtienen pidiendo a los sujetos que elijan, para cada par de títulos de subescala, cuál pesó más en su experiencia de carga de trabajo.", "src": "NASA-TLX v1.0 manual", "note": ""}, {"n": 48, "stem": "Según la Circular 234 de la OACI (Compendio de Factores Humanos n.º 5, sobre automatización), el «bucle interno» de la gestión de sistemas se refiere a:", "opts": ["la monitorización cognitiva de los sistemas automatizados", "el control de la aeronave o del sistema, con ejercicio de destrezas psicomotoras", "la comunicación con el control de tránsito aéreo", "el bucle de gestión de la seguridad operacional de la organización"], "ans": 1, "why": "El compendio distingue el bucle interno (control, destrezas psicomotoras) del bucle externo (monitorización, exigencias cognitivas).", "src": "Circular 234-AN/142 de la OACI", "note": ""}, {"n": 49, "stem": "Según la Circular 234 de la OACI, ¿reduce la automatización principalmente las destrezas que se exigen a un operador?", "opts": ["Sí, la automatización elimina siempre la necesidad de la mayoría de las destrezas manuales", "No; la automatización suele cambiar las destrezas requeridas (a menudo haciéndolas más exigentes) o añade otras nuevas", "La automatización no tiene ningún efecto medible en las destrezas requeridas", "La automatización solo afecta a las destrezas físicas, no a las cognitivas"], "ans": 1, "why": "El compendio corrige la suposición de que la automatización reduce o elimina los requisitos de destreza: en la práctica las destrezas cambian (más tareas de diagnóstico y de localización de fallos) o se añaden otras nuevas.", "src": "Circular 234-AN/142 de la OACI", "note": ""}, {"n": 50, "stem": "¿Qué riesgo de FFHH, además de la «complacencia con la automatización», nombra explícitamente la Circular 234 de la OACI en su lista de problemas relacionados con la automatización?", "opts": ["La intimidación por automatización", "El síndrome de fatiga por automatización", "La demencia digital", "La visión en túnel cognitiva"], "ans": 0, "why": "La lista de problemas de FFHH relacionados con la automatización del compendio incluye la conciencia situacional, la complacencia con la automatización y la intimidación por automatización, además del mantenimiento de la autoridad de mando.", "src": "Circular 234-AN/142 de la OACI", "note": ""}, {"n": 51, "stem": "¿Cuál es la definición de la OACI (2001) de «colación» (<em>readback</em>), tal como la cita el artículo de SKYbrary sobre la colación radiotelefónica?", "opts": ["Un procedimiento por el que la estación receptora repite a la estación transmisora un mensaje recibido, o una parte adecuada de él, para confirmar la recepción correcta", "Un procedimiento por el que el ATC repite dos veces cada instrucción", "Una grabación obligatoria de todas las transmisiones de radio", "Un registro escrito del piloto con todas las autorizaciones recibidas"], "ans": 0, "why": "La OACI (2001) define la colación exactamente así: un procedimiento por el que la estación receptora repite a la estación transmisora un mensaje recibido, o una parte adecuada de él, para obtener confirmación de la recepción correcta.", "src": "SKYbrary, Radiotelephony Readback Compliance", "note": ""}, {"n": 52, "stem": "En el bucle de colación y escucha de la colación (<em>readback/hearback</em>), ¿a qué se refiere el «hearback»?", "opts": ["A que el piloto repita la autorización", "A que el ATC escuche activamente y confirme la colación del piloto", "A que un segundo controlador compruebe el trabajo del primero", "A la grabación que se reproduce durante la investigación de un incidente"], "ans": 1, "why": "El <em>hearback</em> es la escucha activa del controlador para comprobar que la colación del piloto es correcta, lo que permite identificar y corregir los malentendidos.", "src": "SKYbrary, Radiotelephony Readback Compliance", "note": ""}, {"n": 53, "stem": "En la incursión en pista de 2005 en Sídney (Kingsford Smith) que implicó a un tractor de remolque y un B777, ¿qué hizo fallar el bucle de escucha de la colación?", "opts": ["El conductor del tractor nunca dio colación", "La colación del conductor del tractor quedó en su mayor parte tapada por otra transmisión y no llegó al Control de Movimientos en Superficie", "El controlador no estaba escuchando la frecuencia", "El tractor no tenía equipo de radio"], "ans": 1, "why": "La investigación de la ATSB halló que la mayor parte de la colación del conductor del tractor quedó tapada por otra transmisión y, por tanto, no la recibió el SMC, de modo que la comprobación del <em>hearback</em> nunca validó realmente la autorización.", "src": "SKYbrary, Radiotelephony Readback Compliance (ATSB 2006)", "note": ""}, {"n": 54, "stem": "En el estudio «On the Level» de la UK CAA (CAP 710) sobre 626 informes de incumplimiento de nivel (1998-1999), ¿qué porcentaje de casos implicó confusión de indicativos?", "opts": ["0,5 %", "4,2 %", "15,0 %", "25,0 %"], "ans": 1, "why": "La confusión de indicativos se registró como factor causal en 26 de los 626 informes, es decir, el 4,2 %.", "src": "UK CAA CAP 710 \"On the Level\"", "note": ""}, {"n": 55, "stem": "En la tabla de factores causales del CAP 710, ¿qué categoría tuvo el porcentaje más alto entre los informes de incumplimiento de nivel?", "opts": ["La confusión de indicativos", "La operación en SID", "La meteorología", "Una autorización ATC incorrecta"], "ans": 1, "why": "La «operación en SID» fue la categoría más numerosa, con el 15,0 %, por delante de los problemas de piloto automático (13,4 %) y del incumplimiento de instrucciones ATC (13,3 %).", "src": "UK CAA CAP 710 \"On the Level\"", "note": ""}, {"n": 56, "stem": "En el tipo de rotación del relevo de posición operativa (<em>handover-takeover</em>, HOTO) «nuevo a caliente a frío» (<em>New-to-Hot-to-Cold</em>), ¿quién ocupa primero la posición ejecutiva («caliente»)?", "opts": ["El controlador relevado permanece como ejecutivo durante todo el proceso", "El controlador de relevo (recién llegado) ocupa la posición ejecutiva de inmediato", "Nadie ocupa la posición ejecutiva durante el relevo", "Siempre ocupa la posición ejecutiva un supervisor"], "ans": 1, "why": "En «nuevo a caliente a frío», el controlador de relevo sustituye al ejecutivo («caliente») y el ejecutivo relevado pasa a planificador («frío»).", "src": "SKYbrary, Handover-Takeover Process", "note": ""}, {"n": 57, "stem": "¿Por qué recomienda el artículo Handover-Takeover de SKYbrary evitar siempre que sea posible el tipo de rotación de «dos controladores de relevo»?", "opts": ["Porque requiere demasiado tiempo administrativo", "Porque ninguno de los dos controladores nuevos puede tener plena conciencia situacional una vez que se han ido los dos relevados", "Porque lo prohíbe la normativa de la OACI", "Porque requiere frecuencias de radio adicionales"], "ans": 1, "why": "Con dos controladores de relevo, ambos relevados se marchan al terminar el relevo; si la información no se transfirió por completo, ninguno de los dos nuevos tiene plena SA y los relevados ya no están disponibles para ayudar.", "src": "SKYbrary, Handover-Takeover Process", "note": ""}, {"n": 58, "stem": "En el incidente de Gotemburgo de 2011 que cita el artículo Handover-Takeover, ¿qué hizo que el controlador autorizara la entrada de un vehículo en la pista delante de una aeronave que despegaba?", "opts": ["Un fallo de equipo", "Un error del controlador en el contexto de una conversación no esencial", "Una ficha de progresión mal leída", "Un error en la información de relevo de turno"], "ans": 1, "why": "La investigación concluyó que se autorizó la entrada del vehículo en la pista como resultado de un error del controlador en el contexto de una conversación no esencial.", "src": "SKYbrary, Handover-Takeover Process", "note": ""}, {"n": 59, "stem": "¿Cuál es la definición «antigua» (hoy considerada obsoleta) de TRM de EUROCONTROL que cita el documento EC-TRM-6049 (2021)?", "opts": ["Un programa de seguridad de FFHH que reduce los errores relacionados con el trabajo en equipo", "Estrategias para el mejor uso de todos los recursos disponibles (información, equipos y personas) con el fin de optimizar la seguridad y la eficiencia de los servicios de tránsito aéreo", "Un ejercicio de certificación obligatorio basado en simulador", "La aplicación de los principios del CRM exclusivamente a las tripulaciones de cabina"], "ans": 1, "why": "El EC-TRM-6049 cita la antigua definición de TRM (de la época de SKYbrary) sobre el mejor uso de los recursos disponibles y afirma que hoy está obsoleta.", "src": "EUROCONTROL, EC-TRM-6049", "note": ""}, {"n": 60, "stem": "Según el EC-TRM-6049 (2021), se propone redefinir el TRM como:", "opts": ["una actividad social puramente voluntaria entre controladores", "un programa de seguridad de FFHH que pretende reducir o minimizar el impacto de los errores relacionados con el trabajo en equipo y desarrollar actitudes positivas hacia el trabajo en equipo y las actuaciones humanas", "un sinónimo de CRM que solo se usa en operaciones con helicópteros", "un procedimiento disciplinario para los controladores que infrinjan los procedimientos"], "ans": 1, "why": "La nueva definición propuesta presenta el TRM expresamente como un programa de seguridad de FFHH dirigido a los errores relacionados con el trabajo en equipo y a las actitudes positivas hacia el trabajo en equipo y los FFHH.", "src": "EUROCONTROL, EC-TRM-6049", "note": ""}, {"n": 61, "stem": "¿Para qué requisito de formación de los ATCO se indica el TRM como medio aceptable de cumplimiento (AMC) de la EASA, según el EC-TRM-6049?", "opts": ["Renovación del reconocimiento médico", "Formación de actualización de los ATCO (AMC1 ATCO.D.080(b)(3))", "Pruebas de competencia lingüística en inglés", "Pruebas iniciales de aptitud (FEAST)"], "ans": 1, "why": "El TRM es el medio aceptable de cumplimiento indicado para los requisitos de formación en FFHH durante la formación de unidad y para la formación de actualización de los ATCO según el AMC1 ATCO.D.080(b)(3).", "src": "EUROCONTROL, EC-TRM-6049", "note": ""}, {"n": 62, "stem": "Según la página «Cultura justa» de AESA, ¿qué artículo de la Ley 21/2003 española establece la protección de la información sobre seguridad facilitada voluntariamente (salvo dolo o negligencia grave)?", "opts": ["El artículo 5", "El artículo 11, párrafo tercero", "Solo el artículo 19", "El artículo 25"], "ans": 1, "why": "El artículo 11, párrafo tercero, de la Ley 21/2003 (modificada por la Ley 1/2011) dispone que esa información de seguridad facilitada voluntariamente no puede utilizarse como prueba ni difundirse públicamente.", "src": "AESA, Cultura justa", "note": ""}, {"n": 63, "stem": "¿Qué real decreto español desarrolla el reglamento del Programa Estatal de Seguridad Operacional para la Aviación Civil (PESO) al que se remite el procedimiento de cultura justa?", "opts": ["RD 995/2013", "RD 1334/2005", "Solo el RD 1088/2020", "RD 552/2014"], "ans": 0, "why": "El Real Decreto 995/2013, de 13 de diciembre, por el que se desarrolla el reglamento del PESO, es el que se cita para los mecanismos de protección de la cultura justa (artículos 8.2 y 16).", "src": "AESA, Cultura justa", "note": ""}, {"n": 64, "stem": "Según el artículo 16, párrafo tercero, del RD 995/2013, ¿en qué circunstancia puede un órgano de supervisión adoptar aún medidas coercitivas o punitivas a pesar de una desviación de seguridad notificada?", "opts": ["Si la desviación fue claramente dolosa o gravemente negligente, o se aprecia negligencia grave por la repetición de la conducta", "Si el informe se presentó pasadas más de 24 horas desde el suceso", "Si la desviación afectó a más de una aeronave", "Si el notificante es un controlador en formación"], "ans": 0, "why": "El artículo 16 permite la acción coercitiva o punitiva solo si queda claramente establecido que la desviación fue dolosa o gravemente negligente, o si se aprecia negligencia grave por la repetición de la conducta.", "src": "AESA, Cultura justa", "note": ""}, {"n": 65, "stem": "¿Desde qué fecha se aplica el Reglamento (UE) n.º 376/2014 relativo a la notificación de sucesos en la aviación civil?", "opts": ["1 de enero de 2014", "15 de noviembre de 2015", "2 de enero de 2020", "1 de marzo de 2017"], "ans": 1, "why": "El Reglamento (UE) 376/2014 se aplica desde el 15 de noviembre de 2015, según su artículo 16, tal como lo cita AESA.", "src": "AESA, Cultura justa / Reglamento (UE) 376/2014", "note": ""}, {"n": 66, "stem": "Según el artículo 16, apartado 10, del Reglamento (UE) 376/2014, ¿cuál de los siguientes es un supuesto excepcional en el que NO se aplica la protección del notificante?", "opts": ["Cualquier suceso en el que intervenga una aeronave de matrícula extranjera", "Una infracción manifiesta, grave y de gran importancia del deber de diligencia que cause un daño previsible o un riesgo grave para la seguridad", "Un suceso notificado más de una vez por personas diferentes", "Un suceso relacionado con una demora por causas meteorológicas"], "ans": 1, "why": "El artículo 16, apartado 10, excluye de la protección (a) la conducta deliberada y (b) una infracción manifiesta, grave y de gran importancia del deber de diligencia con daño previsible o riesgo grave para la seguridad.", "src": "AESA, Cultura justa / Reglamento (UE) 376/2014, art. 16(10)", "note": ""}, {"n": 67, "stem": "La «prueba de sustitución» de AESA para valorar la conducta dolosa o la negligencia grave plantea si:", "opts": ["el notificante tenía problemas disciplinarios previos", "otro profesional con la misma cualificación y experiencia, en las mismas circunstancias, habría actuado de la misma manera", "el suceso causó pérdidas económicas al proveedor de servicios de navegación aérea", "el notificante utilizó el formulario de notificación correcto"], "ans": 1, "why": "La prueba de sustitución plantea si otro profesional con las condiciones, la cualificación y la experiencia adecuadas, en las mismas circunstancias, habría actuado de la misma manera.", "src": "AESA, Cultura justa", "note": ""}, {"n": 68, "stem": "¿En la obra de quién se basa expresamente la prueba de sustitución de AESA, según su propia descripción?", "opts": ["Endsley y Rasmussen", "James T. Reason y David Marx", "Hawkins y Edwards", "Shappell y Wiegmann"], "ans": 1, "why": "AESA afirma que el procedimiento se apoya en bibliografía ampliamente aceptada sobre el comportamiento humano y la cultura justa, como los trabajos de James T. Reason y David Marx.", "src": "AESA, Cultura justa", "note": ""}, {"n": 69, "stem": "¿Cuántos funcionarios valoran un caso en el procedimiento de cultura justa de AESA y qué regla de decisión se aplica si discrepan?", "opts": ["Un funcionario; no se exige mayoría", "Tres funcionarios; la apreciación de dolo o negligencia grave debe ser unánime; de lo contrario se mantiene la protección", "Cinco funcionarios; decide la mayoría simple", "Dos funcionarios; un empate se resuelve con una medida punitiva"], "ans": 1, "why": "Tres funcionarios (un delegado de gestión de riesgos, un asesor jurídico y un delegado de la dirección correspondiente) deben llegar a una apreciación unánime; sin unanimidad rige la duda razonable y la valoración es negativa.", "src": "AESA, Cultura justa", "note": ""}, {"n": 70, "stem": "¿Qué tipo de fotorreceptor de la retina humana es responsable de la visión del color y del detalle fino y se concentra en la fóvea central?", "opts": ["Los bastones", "Los conos", "Las células bipolares", "Las células ganglionares"], "ans": 1, "why": "Los conos proporcionan la visión del color y el detalle fino y se concentran en la fóvea central; los bastones se encargan de la detección del movimiento y de la sensibilidad con poca luz.", "src": "FAA, Pilot's Handbook of Aeronautical Knowledge, cap. 17", "note": ""}, {"n": 71, "stem": "¿Qué régimen de visión depende de los bastones, no da percepción del color, requiere una técnica de exploración y tiene una agudeza de 20/200 o peor?", "opts": ["Visión fotópica", "Visión mesópica", "Visión escotópica", "Visión binocular"], "ans": 2, "why": "La visión escotópica (con poca luz, dependiente de los bastones) no da percepción del color, requiere exploración y tiene una agudeza de alrededor de 20/200 o peor.", "src": "FAA, Pilot's Handbook of Aeronautical Knowledge, cap. 17", "note": ""}, {"n": 72, "stem": "¿Por qué se recomienda la visión descentrada (periférica) para detectar un objeto tenue de noche?", "opts": ["Porque la fóvea casi no tiene bastones, por lo que la visión central es deficiente con poca luz, mientras que la visión periférica recluta más bastones", "Porque la visión periférica discrimina mejor el color de noche", "Porque la visión central solo funciona de día y deja de funcionar de noche", "Porque los bastones se concentran exclusivamente en la fóvea"], "ans": 0, "why": "La fóvea está formada casi solo por conos (deficientes con poca luz); los bastones, que proporcionan la mayor parte de la visión nocturna, son más numerosos lejos de la fóvea, de modo que la visión descentrada aprovecha la densidad de bastones periférica.", "src": "FAA, Pilot's Handbook of Aeronautical Knowledge, cap. 17", "note": ""}, {"n": 73, "stem": "¿Qué agudeza visual es típica de la visión fotópica (con mucha luz, dependiente de los conos)?", "opts": ["20/20 o mejor", "20/100", "20/200 o peor", "La agudeza no se puede medir en condiciones fotópicas"], "ans": 0, "why": "La visión fotópica proporciona una resolución del detalle fino de 20/20 o mejor, pero solo con buena iluminación.", "src": "FAA, Pilot's Handbook of Aeronautical Knowledge, cap. 17", "note": ""}],U={"
