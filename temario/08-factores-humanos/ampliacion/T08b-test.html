or, TEM y gestión de la seguridad operacional (T08b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "Según el Real Decreto 1001/2010, ¿cuál es la duración total máxima de actividad aeronáutica en hasta 6 periodos de actividad consecutivos para un controlador civil de tránsito aéreo español?", "opts": ["50 horas", "40 horas", "60 horas", "80 horas"], "ans": 0, "why": "El art. 6.1 limita el bloque a un máximo de 6 periodos consecutivos con un total de 50 horas como máximo; las demás cifras no coinciden con las del propio artículo (60 horas es el descanso mínimo posterior, no el límite de actividad).", "src": "RD 1001/2010, art. 6.1", "note": ""}, {"n": 2, "stem": "Tras un bloque de hasta 6 periodos consecutivos de actividad aeronáutica (50 horas como máximo) según el RD 1001/2010, ¿qué descanso mínimo debe garantizar el proveedor?", "opts": ["24 horas", "48 horas", "72 horas", "60 horas"], "ans": 3, "why": "El art. 6.1 exige un descanso mínimo de 60 horas tras ese bloque; puede reducirse siempre que se respete el mínimo mensual de 180 h del art. 6.2, y el art. 6.3 permite que algunos descansos bajen a 48 horas cuando se programan menos de 6 periodos (menos de 50 h).", "src": "RD 1001/2010, art. 6.1", "note": ""}, {"n": 3, "stem": "Según el RD 1001/2010, ¿cuál es el descanso mensual mínimo del ATCO civil español y cómo debe distribuirse?", "opts": ["120 horas en 2 periodos de al menos 60 horas", "150 horas en 2 periodos de al menos 75 horas", "200 horas en al menos 4 periodos de al menos 50 horas cada uno", "180 horas en al menos 3 periodos de al menos 54 horas cada uno"], "ans": 3, "why": "El art. 6.2 fija el descanso mensual mínimo en 180 horas, distribuidas en al menos 3 periodos de al menos 54 horas cada uno.", "src": "RD 1001/2010, art. 6.2", "note": ""}, {"n": 4, "stem": "Según el RD 1001/2010, ¿cuál es la duración máxima de un periodo continuo en posición operativa y qué pausa le sigue?", "opts": ["2 horas, seguidas de un descanso parcial de al menos 30 minutos", "1 hora, seguida de 15 minutos", "3 horas, seguidas de 45 minutos", "4 horas, seguidas de 1 hora"], "ans": 0, "why": "El art. 7 fija el máximo ordinario en 2 horas continuas de actividad operacional, seguidas de un descanso parcial de al menos 30 minutos (que puede fraccionarse dentro del periodo de 2 horas).", "src": "RD 1001/2010, art. 7", "note": ""}, {"n": 5, "stem": "En una torre monoposición, según el RD 1001/2010, ¿hasta qué máximo puede ampliarse la actividad aeronáutica continua y qué descanso parcial mínimo se exige durante la jornada?", "opts": ["8 horas continuas, 1 hora de descanso", "10 horas continuas, 1 hora y 15 minutos de descanso", "14 horas continuas, 2 horas de descanso", "12 horas continuas, 1 hora y 30 minutos de descanso"], "ans": 3, "why": "El art. 8.2 permite ampliarla hasta 12 horas continuas en una torre monoposición, siempre que se garanticen al menos 1 hora y 30 minutos de descanso parcial durante la jornada; en este caso no se aplica el límite general de 2 horas del art. 7.", "src": "RD 1001/2010, art. 8.2", "note": ""}, {"n": 6, "stem": "Según el RD 1001/2010, art. 10.1, ¿dentro de qué franja se desarrolla, total o parcialmente, la «actividad aeronáutica nocturna»?", "opts": ["22:00 a 04:59", "23:00 a 05:00", "00:00 a 06:00", "01:30 a 05:29"], "ans": 3, "why": "El art. 10.1 define la franja española de «actividad nocturna» exactamente como de 01:30 a 05:29; la franja de 00:00 a 06:00 es, en cambio, el «periodo nocturno» de la EASA que se usa en las orientaciones de la UE sobre límites de servicio, una cifra distinta de otro reglamento.", "src": "RD 1001/2010, art. 10.1", "note": ""}, {"n": 7, "stem": "Según el RD 1001/2010, ¿cuál es la duración máxima de un periodo continuo de servicio nocturno y a más tardar a qué hora debe terminar?", "opts": ["9 horas y 30 minutos, terminando a las 07:30", "8 horas, terminando a las 06:00", "10 horas, terminando a las 08:00", "12 horas, terminando a las 09:00"], "ans": 0, "why": "El art. 10.2 limita el servicio nocturno continuo a 9 horas y 30 minutos y exige que concluya a las 07:30 como muy tarde.", "src": "RD 1001/2010, art. 10.2", "note": ""}, {"n": 8, "stem": "Según el RD 1001/2010, ¿cuántos periodos de servicio nocturno consecutivos pueden programarse como máximo y qué descanso mínimo les sigue?", "opts": ["2, seguidos de 54 horas", "1, seguido de 24 horas", "3, seguidos de 48 horas", "4, seguidos de 72 horas"], "ans": 0, "why": "El art. 10.3 permite como máximo 2 periodos de servicio nocturno consecutivos, tras los cuales se exige un descanso mínimo de 54 horas; tras un solo periodo de servicio nocturno, el descanso exigido antes del servicio diurno es de 48 horas (una cifra distinta, más corta, para otra situación).", "src": "RD 1001/2010, art. 10.3", "note": ""}, {"n": 9, "stem": "Según el RD 1001/2010, la «actividad aeronáutica de madrugada» es la que comienza dentro de una franja; ¿cuál es esa franja y cuál es su duración continua máxima?", "opts": ["Inicio entre las 05:30 y las 06:29, máximo 8 horas", "Inicio entre las 04:30 y las 05:29, máximo 6 horas", "Inicio entre las 06:00 y las 07:00, máximo 7 horas", "Inicio entre las 06:30 y las 07:59, máximo 8 h 30 min"], "ans": 0, "why": "El art. 11 define la actividad de «madrugada» como la que comienza entre las 05:30 y las 06:29, con una duración continua máxima de 8 horas; la opción D describe, en cambio, la actividad «matinal» (art. 12).", "src": "RD 1001/2010, art. 11", "note": ""}, {"n": 10, "stem": "Según el RD 1001/2010, art. 13, ¿cómo se computa el tiempo de imaginaria en el centro de trabajo a efectos del periodo máximo de 20 horas?", "opts": ["No se computa en absoluto", "Se computa una vez, igual que el tiempo fuera del centro de trabajo", "Se computa el triple", "Se computa el doble"], "ans": 3, "why": "El art. 13.1 establece que el tiempo de «imaginaria» en el centro de trabajo se computa el doble para el periodo máximo de 20 horas, lo que refleja su mayor impacto en la fatiga en comparación con la guardia que se cumple fuera del centro de trabajo.", "src": "RD 1001/2010, art. 13.1", "note": ""}, {"n": 11, "stem": "Según la guía de EUROCONTROL de 2023 sobre fatiga y planificación de turnos, ¿cuál es el máximo de horas por periodo de servicio que se recomienda y en qué condición puede ampliarse a 12 horas?", "opts": ["8 horas; ampliable solo si lo valida una evaluación de riesgos de seguridad", "6 horas; ampliable con el consentimiento de los sindicatos", "10 horas; ampliable libremente por el proveedor", "8 horas; nunca ampliable"], "ans": 0, "why": "La guía recomienda un máximo de 8 horas por periodo de servicio, ampliable a 12 horas solo si la ampliación queda validada por una evaluación formal de riesgos de seguridad.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023", "note": ""}, {"n": 12, "stem": "Según la misma guía de EUROCONTROL de 2023, ¿cuál es el tiempo máximo continuo de servicio ATC sin descanso que se recomienda para el personal que trabaja con pantallas visuales o radar?", "opts": ["1 hora", "1 hora y 30 minutos", "3 horas", "2 horas"], "ans": 3, "why": "La guía recomienda un máximo de 2 horas de servicio ATC continuo antes de un descanso, en coherencia con la propia cifra de 2 horas del RD 1001/2010 para España.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023", "note": ""}, {"n": 13, "stem": "¿Qué sentido de rotación de turnos recomienda la guía de EUROCONTROL de 2023 para reducir la deuda de sueño, citando a Monk, Folkard y Wedderburn (1996)?", "opts": ["Rotación hacia adelante (mañana, tarde, noche)", "Rotación hacia atrás (noche, tarde, mañana)", "Rotación aleatoria", "Solo turnos de noche fijos permanentes"], "ans": 0, "why": "Se recomienda la rotación hacia adelante porque coincide con la tendencia natural del reloj circadiano, que dura algo más de 24 horas, a retrasarse; la rotación hacia atrás va contra esa tendencia y genera más deuda de sueño.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023", "note": ""}, {"n": 14, "stem": "¿Cuál es el «periodo nocturno» de la EASA que se usa a efectos de los límites de servicio en la UE, según cita la guía de EUROCONTROL de 2023?", "opts": ["18:00-06:00", "22:00-05:00", "00:00-06:00", "01:30-05:29"], "ans": 2, "why": "El periodo nocturno de la EASA que se usa para los límites de servicio es de 00:00 a 06:00; 18:00-06:00 es, en cambio, el concepto más amplio de «horario nocturno» del Doc. 9966 de la OACI, y 01:30-05:29 es la franja de «actividad nocturna» del RD 1001/2010 español.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023, que cita a la EASA", "note": ""}, {"n": 15, "stem": "Según el Doc. 9966 de la OACI, ¿cuál es el máximo de horas de servicio acumuladas en un periodo definido de 30 días o 720 horas?", "opts": ["150 horas", "175 horas", "200 horas", "250 horas"], "ans": 2, "why": "El Doc. 9966 da 200 horas como tope de horas de servicio acumuladas en 720 horas consecutivas (30 días consecutivos).", "src": "Doc. 9966 de la OACI, citado en la guía de EUROCONTROL de 2023", "note": ""}, {"n": 16, "stem": "Según el Doc. 9966 de la OACI, ¿cuál es el intervalo mínimo exigido entre el final de un periodo de servicio y el comienzo del siguiente?", "opts": ["8 horas", "10 horas", "12 horas", "24 horas"], "ans": 2, "why": "El Doc. 9966 fija un mínimo de 12 horas entre el final de un periodo de servicio y el comienzo del siguiente.", "src": "Doc. 9966 de la OACI, citado en la guía de EUROCONTROL de 2023", "note": ""}, {"n": 17, "stem": "Según la AC 120-100 de la FAA, ¿cuál es aproximadamente la ventana WOCL (<em>Window of Circadian Low</em>, mínimo de la ventana circadiana) principal y qué característica adicional describe esta fuente que no recoge el manual de ENAIRE?", "opts": ["De 3 a 5 a. m., más un descenso secundario de la alerta por la tarde", "De 2 a 4 a. m., sin ventana secundaria", "De 4 a 7 a. m., más un pico secundario por la mañana", "De 1 a 3 a. m., sin ventana secundaria"], "ans": 0, "why": "La AC 120-100 de la FAA da el WOCL principal en aproximadamente de 3 a 5 a. m. y describe además un WOCL secundario, un descenso de la alerta a primera hora de la tarde; el capítulo 5 del manual de ENAIRE menciona solo una ventana nocturna (aproximadamente de 3 a 6 a. m.) y ningún descenso secundario.", "src": "FAA AC 120-100, Basics of Aviation Fatigue", "note": ""}, {"n": 18, "stem": "Una pregunta pide la ventana «nocturna» que se emplea específicamente a efectos de los límites nacionales españoles de servicio de los ATCO. ¿Qué cifra se aplica?", "opts": ["18:00-06:00 (Doc. 9966 de la OACI)", "00:00-06:00 (EASA, genérica)", "01:30-05:29 (RD 1001/2010)", "03:00-06:00 (WOCL del manual de ENAIRE)"], "ans": 2, "why": "El RD 1001/2010, la norma española vinculante que regula el servicio y el descanso de los ATCO civiles, define la «actividad aeronáutica nocturna» como la de 01:30 a 05:29; las otras tres cifras responden a preguntas distintas (orientación genérica de la UE sobre límites de servicio, comparación de valores típicos más amplia de la OACI y WOCL fisiológico, respectivamente).", "src": "RD 1001/2010, art. 10.1", "note": ""}, {"n": 19, "stem": "La guía de EUROCONTROL de 2023 sobre fatiga recomienda que, tras un periodo de servicio nocturno, se programe al controlador lo siguiente para proteger el sueño de recuperación:", "opts": ["Un «día de sueño» (un día libre) antes de volver al servicio diurno", "Un inicio inmediato a primera hora de la mañana del día siguiente", "Un turno doble para recuperar las horas perdidas", "Horas extraordinarias obligatorias"], "ans": 0, "why": "La guía recomienda un día libre («día de sueño») al concluir un periodo de servicio nocturno, para que el sueño de recuperación no se comprima por un inicio temprano al día siguiente.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023", "note": ""}, {"n": 20, "stem": "¿Por qué recomienda la guía de EUROCONTROL de 2023 límites más estrictos de tiempo continuo en posición y de pausas para las operaciones con controlador único (SPO)?", "opts": ["Porque no hay un segundo controlador presente para la monitorización mutua", "Porque las posiciones SPO tienen siempre más tráfico", "Porque los controladores SPO suelen tener menos experiencia", "Porque las posiciones SPO son siempre nocturnas"], "ans": 0, "why": "Al no haber un segundo controlador que comparta la posición, en las SPO falta el efecto de red de seguridad de la monitorización mutua, por lo que se recomiendan límites más estrictos y una monitorización reforzada de la fatiga para compensarlo.", "src": "EUROCONTROL Guidelines for the Management of the Risks of Fatigue in ATC Rostering, 2023", "note": ""}, {"n": 21, "stem": "Según el Reglamento (UE) 2015/340, ATCO.A.015(b), ¿qué debe hacer el titular de una licencia si tiene dudas sobre su capacidad para ejercer con seguridad las atribuciones de su licencia?", "opts": ["Seguir trabajando y vigilarse de cerca", "Pedir informalmente una segunda opinión a un compañero, sin obligación de notificar", "No ejercer las atribuciones y notificarlo de inmediato al proveedor de servicios de navegación aérea", "Esperar al final del turno para comunicarlo"], "ans": 2, "why": "ATCO.A.015(b) exige que el titular deje de ejercer las atribuciones de la licencia y notifique de inmediato la incapacidad provisional al proveedor de servicios de navegación aérea correspondiente, en lugar de seguir trabajando o retrasar la notificación.", "src": "Reglamento (UE) 2015/340, ATCO.A.015(b)", "note": ""}, {"n": 22, "stem": "Según ATCO.A.015(c), ¿puede el propio proveedor de servicios de navegación aérea declarar la incapacidad provisional de un controlador sin que este lo comunique por sí mismo?", "opts": ["Sí, si el proveedor tiene conocimiento de cualquier duda sobre la capacidad del titular de la licencia para ejercerla con seguridad", "No, solo es posible la autodeclaración", "Solo con una orden judicial", "Solo tras una audiencia disciplinaria formal"], "ans": 0, "why": "ATCO.A.015(c) permite expresamente que el proveedor declare la incapacidad provisional por iniciativa propia en cuanto tenga conocimiento de una duda de ese tipo, con independencia de la autodeclaración del punto (b).", "src": "Reglamento (UE) 2015/340, ATCO.A.015(c)", "note": ""}, {"n": 23, "stem": "Según el Reglamento (UE) 2015/340, ¿cuál de los siguientes queda excluido expresamente de la definición reglamentaria de «sustancia psicoactiva»?", "opts": ["El alcohol", "Los canabinoides", "La cafeína", "Los alucinógenos"], "ans": 2, "why": "La definición del Reglamento enumera el alcohol, los opiáceos, los canabinoides, los sedantes e hipnóticos, la cocaína, otros psicoestimulantes, los alucinógenos y los disolventes volátiles, y excluye expresamente la cafeína y el tabaco.", "src": "Reglamento (UE) 2015/340, definiciones", "note": ""}, {"n": 24, "stem": "¿Qué motivos pueden dar lugar a una «incapacidad provisional» según el Reglamento (UE) 2015/340?", "opts": ["Solo la caducidad del certificado médico", "Solo un retraso en la renovación de la licencia", "La fatiga, el estrés, el uso problemático de sustancias psicoactivas o una duda sobre la competencia actual", "Solo las sanciones disciplinarias"], "ans": 2, "why": "La incapacidad provisional es un estado temporal que se desencadena por dudas sobre el ejercicio seguro de la licencia, que las disposiciones del Reglamento vinculan a la fatiga, al estrés, a las sustancias psicoactivas y a las dudas sobre la competencia, algo distinto de un simple certificado caducado.", "src": "Reglamento (UE) 2015/340, ATCO.A.015 y disposiciones conexas", "note": ""}, {"n": 25, "stem": "¿Cuál de las siguientes afirmaciones expresa mejor la diferencia fundamental entre un «error» y una «transgresión» en términos de factores humanos?", "opts": ["Las transgresiones son decisiones deliberadas y conscientes; los errores se producen con independencia de la voluntad de evitarlos", "Los errores son siempre más graves que las transgresiones", "Las transgresiones solo ocurren de noche; los errores, solo de día", "No hay ninguna diferencia significativa entre ambos términos"], "ans": 0, "why": "La distinción definitoria es la intencionalidad: una transgresión es la decisión consciente de apartarse de una regla, mientras que un error se produce a pesar de la intención de la persona de evitarlo.", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 26, "stem": "Un controlador realiza con regularidad un atajo que se ha convertido en «parte de su rutina automatizada», tolerado por el grupo de trabajo como una práctica normal y de bajo riesgo. ¿De qué tipo de transgresión se trata y en qué nivel de Rasmussen suele producirse?", "opts": ["Transgresión rutinaria, nivel basado en habilidades", "Transgresión situacional, nivel basado en reglas", "Transgresión excepcional, nivel basado en conocimiento", "Transgresión de optimización, sin nivel específico"], "ans": 0, "why": "Un atajo habitual y automatizado, tolerado por el grupo y percibido como de bajo riesgo, es una transgresión rutinaria, que se da en el nivel basado en habilidades porque se ha convertido en parte de la rutina automatizada de la persona.", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 27, "stem": "Las presiones organizacionales y ambientales, como la presión de tiempo, la mala supervisión y la insuficiencia de recursos, ¿qué tipo de transgresión suelen producir y en qué nivel de Rasmussen?", "opts": ["Transgresión involuntaria, sin nivel específico", "Transgresión rutinaria, nivel basado en habilidades", "Transgresión situacional, nivel basado en reglas", "Transgresión excepcional, nivel basado en conocimiento"], "ans": 2, "why": "Las transgresiones situacionales surgen de factores organizacionales o ambientales que hacen difícil no transgredir, y tienden a producirse en el nivel basado en reglas, donde las personas realizan acciones «que se consideran necesarias para sacar el trabajo adelante».", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 28, "stem": "Un controlador, ante una emergencia muy poco frecuente y desconocida para la que no existe ningún procedimiento aplicable, decide de forma consciente apartarse de las reglas normalizadas. ¿Qué tipo de transgresión es y en qué nivel de Rasmussen?", "opts": ["Transgresión rutinaria, nivel basado en habilidades", "Transgresión situacional, nivel basado en reglas", "Transgresión de optimización, sin nivel específico", "Transgresión excepcional, nivel basado en conocimiento"], "ans": 3, "why": "Las transgresiones excepcionales se dan en circunstancias raras y muy inusuales, como las emergencias, y tienden a producirse en el nivel basado en conocimiento, porque son situaciones únicas y desconocidas.", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 29, "stem": "¿Qué proporción de las transgresiones, según los datos que cita SKYbrary, se gestiona mal y da lugar a nuevas transgresiones o errores?", "opts": ["Alrededor de un tercio", "Alrededor de una décima parte", "Alrededor de la mitad", "Casi todas"], "ans": 0, "why": "Los datos citados indican que alrededor de un tercio de las transgresiones se gestiona mal y conduce a nuevas transgresiones o errores, en operaciones rutinarias del día a día sin ningún resultado negativo en ese momento.", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 30, "stem": "¿Qué tipo de transgresión surge de procedimientos «imposibles de seguir en la práctica» por ser confusos, complejos o ambiguos?", "opts": ["Transgresión rutinaria", "Transgresión situacional", "Transgresión involuntaria", "Transgresión de optimización"], "ans": 2, "why": "Las transgresiones involuntarias surgen de procedimientos imposibles de seguir; la persona no eligió conscientemente infringir la regla, lo que hace esta categoría muy próxima en sus efectos a una «equivocación» del GEMS aunque técnicamente se clasifique como transgresión.", "src": "SKYbrary, \"Violation\"", "note": ""}, {"n": 31, "stem": "Según la Circular 240 de la OACI, Compendio de Factores Humanos n.º 7, ¿qué es un «fallo activo»?", "opts": ["Una decisión adoptada años antes de un accidente que permaneció latente", "Un módulo de formación eliminado durante la fusión de una empresa", "Una laguna normativa detectada durante una auditoría", "Un acto inseguro de alguien en contacto directo e inmediato con el sistema, que vulnera las defensas del sistema"], "ans": 3, "why": "Un fallo activo lo comete una persona en contacto directo con el sistema (por ejemplo, el controlador de turno), con un efecto casi inmediato, y vulnera las defensas existentes.", "src": "Circular 240 de la OACI, Human Factors Digest No. 7", "note": ""}, {"n": 32, "stem": "Según el mismo Compendio n.º 7 de la OACI, un «fallo latente» se origina típicamente en:", "opts": ["los sistemas de a bordo de la aeronave", "solo el controlador individual de turno", "las condiciones meteorológicas del día del suceso", "los responsables de la toma de decisiones, los reguladores o los mandos intermedios, mucho antes del accidente"], "ans": 3, "why": "Un fallo latente es el resultado de una decisión o acción adoptada mucho antes del accidente, cuyas consecuencias pueden permanecer latentes durante mucho tiempo; suele originarse en los responsables de la toma de decisiones, los reguladores o los mandos intermedios, y no en el operador de primera línea.", "src": "Circular 240 de la OACI, Human Factors Digest No. 7", "note": ""}, {"n": 33, "stem": "El Compendio n.º 7 ilustra un fallo latente con el ejemplo de la fusión de dos empresas. ¿Qué no se proporcionó en la fusión?", "opts": ["Un radar nuevo", "Un edificio de sede nuevo", "Un organigrama revisado", "Formación para normalizar los procedimientos operativos"], "ans": 3, "why": "El ejemplo del compendio describe empresas que se fusionan «sin proporcionar formación para normalizar los procedimientos operativos» (<em>without providing training to standardize operating procedures</em>), una laguna que permanece latente hasta que la revela más tarde un suceso no relacionado.", "src": "Circular 240 de la OACI, Human Factors Digest No. 7", "note": ""}, {"n": 34, "stem": "Según la cadena causal del Compendio n.º 7, ¿en qué orden se sitúan típicamente estos elementos, del más «aguas arriba» al más «aguas abajo»?", "opts": ["Fallos activos -&gt; precondiciones -&gt; mandos intermedios -&gt; responsables de la toma de decisiones", "Mandos intermedios -&gt; fallos activos -&gt; responsables de la toma de decisiones -&gt; precondiciones", "Precondiciones -&gt; fallos activos -&gt; responsables de la toma de decisiones -&gt; mandos intermedios", "Responsables de la toma de decisiones -&gt; mandos intermedios -&gt; precondiciones -&gt; fallos activos"], "ans": 3, "why": "La cadena del compendio va desde los responsables de la toma de decisiones, situados aguas arriba, pasando por los mandos intermedios, que crean las precondiciones, las cuales permiten después los fallos activos (actos inseguros) en primera línea.", "src": "Circular 240 de la OACI, Human Factors Digest No. 7", "note": ""}, {"n": 35, "stem": "¿Cuántos componentes y elementos tiene el marco del SMS de la OACI especificado en el Anexo 19 (según el Doc. 9859 de la OACI)?", "opts": ["3 componentes, 9 elementos", "4 componentes, 8 elementos", "5 componentes, 10 elementos", "4 componentes, 12 elementos"], "ans": 3, "why": "El marco del SMS de la OACI tiene 4 componentes (política y objetivos, gestión de riesgos, aseguramiento, promoción) repartidos en un total de 12 elementos (5+2+3+2).", "src": "Doc. 9859 de la OACI (SMM), tabla 10", "note": ""}, {"n": 36, "stem": "¿Qué componente del SMS de la OACI incluye como elementos el «nombramiento del personal clave de seguridad operacional» y la «coordinación de la planificación de la respuesta ante emergencias»?", "opts": ["Gestión de riesgos de seguridad operacional", "Política y objetivos de seguridad operacional", "Aseguramiento de la seguridad operacional", "Promoción de la seguridad operacional"], "ans": 1, "why": "Son dos de los cinco elementos del componente 1, política y objetivos de seguridad operacional, junto con el compromiso de la administración, las responsabilidades y obligaciones de rendición de cuentas en materia de seguridad operacional y la documentación del SMS.", "src": "Doc. 9859 de la OACI (SMM), tabla 10", "note": ""}, {"n": 37, "stem": "¿Qué componente del SMS de la OACI consta exactamente de la «identificación de peligros» y de la «evaluación y mitigación de riesgos de seguridad operacional»?", "opts": ["Política y objetivos de seguridad operacional", "Gestión de riesgos de seguridad operacional", "Aseguramiento de la seguridad operacional", "Promoción de la seguridad operacional"], "ans": 1, "why": "El componente 2, gestión de riesgos de seguridad operacional, tiene exactamente dos elementos: la identificación de peligros y la evaluación y mitigación de riesgos de seguridad operacional.", "src": "Doc. 9859 de la OACI (SMM), tabla 10", "note": ""}, {"n": 38, "stem": "¿De qué componente del SMS de la OACI son elementos la «gestión del cambio» y la «mejora continua del SMS»?", "opts": ["Política y objetivos de seguridad operacional", "Gestión de riesgos de seguridad operacional", "Aseguramiento de la seguridad operacional", "Promoción de la seguridad operacional"], "ans": 2, "why": "El componente 3, aseguramiento de la seguridad operacional, tiene tres elementos: la observación y medición del rendimiento en materia de seguridad operacional, la gestión del cambio y la mejora continua del SMS.", "src": "Doc. 9859 de la OACI (SMM), tabla 10", "note": ""}, {"n": 39, "stem": "¿De qué componente del SMS de la OACI son los dos elementos la «instrucción y educación» y la «comunicación de la seguridad operacional»?", "opts": ["Política y objetivos de seguridad operacional", "Gestión de riesgos de seguridad operacional", "Aseguramiento de la seguridad operacional", "Promoción de la seguridad operacional"], "ans": 3, "why": "El componente 4, promoción de la seguridad operacional, tiene exactamente estos dos elementos: la instrucción y educación, y la comunicación de la seguridad operacional.", "src": "Doc. 9859 de la OACI (SMM), tabla 10", "note": ""}, {"n": 40, "stem": "¿De qué materia trata el ESARR 2?", "opts": ["Licencias de los ATCO y evaluación de la competencia", "Notificación y evaluación de sucesos de seguridad en ATM", "Evaluación y mitigación de riesgos en los cambios del sistema ATM", "Fatiga de los ATCO y límites de los turnos"], "ans": 1, "why": "El ESARR 2 es específicamente el Requerimiento Reglamentario de Seguridad de EUROCONTROL sobre la notificación y evaluación de sucesos de seguridad; el ESARR 5 (no el ESARR 2) trata de las licencias y de la competencia.", "src": "ESARR 2", "note": ""}, {"n": 41, "stem": "Según el ESARR 2, ¿quién tiene derecho a notificar un suceso de seguridad?", "opts": ["Solo el controlador directamente implicado", "Solo los supervisores y los directivos", "Cualquier persona u organización del sector de la aviación que haya participado en el suceso o lo haya presenciado", "Solo el regulador de seguridad"], "ans": 2, "why": "El ESARR 2 prevé que cualquier persona u organización del sector de la aviación pueda notificar cualquier suceso o situación en que haya participado o que haya presenciado, con un alcance deliberadamente amplio.", "src": "ESARR 2, requisito 5.1.2", "note": ""}, {"n": 42, "stem": "Según el anexo A del ESARR 2, ¿en qué tres categorías generales se clasifican los sucesos relacionados con ATM a efectos de notificación?", "opts": ["Humanos, técnicos, ambientales", "Accidentes, incidentes, sucesos específicos de ATM", "Menores, moderados, graves", "Notificables, no notificables, confidenciales"], "ans": 1, "why": "El anexo A del ESARR 2 estructura los sucesos notificables relacionados con ATM en accidentes, incidentes y sucesos específicos de ATM, cada uno con subtipos de especial interés para la comunidad ATM.", "src": "ESARR 2, anexo A", "note": ""}, {"n": 43, "stem": "Según el ESARR 5, ¿qué experiencia mínima se exige antes de poder expedir a un controlador una anotación de OJTI (instructor de entrenamiento en posición), en el sector o la posición concretos de que se trate?", "opts": ["3 meses", "6 meses", "1 año", "2 años"], "ans": 1, "why": "El ESARR 5 exige un mínimo de 6 meses de experiencia en la habilitación, en el sector o la posición operativa concretos en los que se impartirá la instrucción, antes de poder expedir una anotación de OJTI.", "src": "ESARR 5", "note": ""}, {"n": 44, "stem": "Según el ESARR 5, ¿cuál de las siguientes debe poseer en todo momento un controlador de tránsito aéreo en activo?", "opts": ["Solo un certificado médico válido", "Habilitaciones, anotaciones de habilitación y anotaciones de unidad válidas y adecuadas al servicio que se presta", "Un registro personal de fatiga", "Una copia del propio ESARR 5 en la posición"], "ans": 1, "why": "El ESARR 5 exige que el controlador que presta servicio ATC posea en todo momento habilitaciones, anotaciones de habilitación y anotaciones de unidad válidas y adecuadas al servicio ATC que presta.", "src": "ESARR 5", "note": ""}, {"n": 45, "stem": "¿Cuál es la definición literal de «cultura justa» (<em>just culture</em>) de EUROCONTROL (EAM 2/GUI 6)?", "opts": ["Un sistema en el que ningún empleado es sancionado nunca por ningún acto", "Un ambiente de confianza en el que se anima, e incluso se recompensa, a las personas a facilitar información esencial relacionada con la seguridad, pero en el que también tienen claro dónde debe trazarse la línea entre la conducta aceptable y la inaceptable", "Un proceso confidencial reservado exclusivamente a la dirección", "Una defensa jurídica disponible solo ante un tribunal penal"], "ans": 1, "why": "Es la redacción exacta de EUROCONTROL (traducida aquí al español); la opción A describe la alternativa rechazada de la «cultura de no culpabilización» (<em>no-blame culture</em>), que la propia guía declara «ni viable ni deseable».", "src": "EUROCONTROL EAM 2/GUI 6, Just Culture Guidance", "note": ""}, {"n": 46, "stem": "¿Por qué rechaza la guía de EUROCONTROL sobre cultura justa una cultura de «no culpabilización» como modelo que perseguir?", "opts": ["Porque culpar mejora la moral", "Porque una amnistía general para todos los actos inseguros carecería de credibilidad y podría considerarse contraria a la justicia natural", "Porque las culturas de no culpabilización son ilegales según el Derecho de la UE", "Porque una cultura de no culpabilización aumenta la capacidad del tránsito aéreo"], "ans": 1, "why": "La guía afirma expresamente que una amnistía que cubriera todos los actos inseguros, con independencia de su gravedad o intención, carecería de credibilidad a ojos de la plantilla y podría considerarse contraria a la justicia natural.", "src": "EUROCONTROL EAM 2/GUI 6, Just Culture Guidance", "note": ""}, {"n": 47, "stem": "¿Qué reglamento traspone el Real Decreto 1088/2020 de España?", "opts": ["Reglamento (UE) 2015/340", "Reglamento (UE) 2017/373", "Reglamento (UE) 376/2014", "ESARR 2"], "ans": 2, "why": "El RD 1088/2020 es el instrumento interno español que traspone el Reglamento (UE) 376/2014 sobre notificación de sucesos, incluidas sus protecciones de cultura justa.", "src": "RD 1088/2020", "note": ""}, {"n": 48, "stem": "Según el RD 1088/2020, art. 3, ¿a qué organismo español se asigna la vigilancia de la cultura justa específicamente en la notificación de sucesos?", "opts": ["Solo a AESA (Agencia Estatal de Seguridad Aérea)", "A la Dirección General de Aviación Civil (DGAC)", "Al departamento de auditoría interna de ENAIRE", "Al Ministerio del Interior"], "ans": 1, "why": "El art. 3 del RD 1088/2020 asigna la vigilancia de la cultura justa en la notificación de sucesos a la DGAC, que ejerce las funciones del art. 16.12 del Reglamento (UE) 376/2014, sin perjuicio del papel sancionador independiente de AESA.", "src": "RD 1088/2020, art. 3", "note": ""}, {"n": 49, "stem": "¿Qué artículo del Reglamento (UE) 376/2014 nombra el RD 1088/2020 como origen de los principios de cultura justa que aplica en el ámbito nacional?", "opts": ["El artículo 5.2", "El artículo 12.1", "El artículo 16.9", "El artículo 21.3"], "ans": 2, "why": "El RD 1088/2020 remite en repetidas ocasiones al artículo 16.9 del Reglamento como el que establece los principios de cultura justa que deben aplicar las organizaciones en España y los organismos de vigilancia.", "src": "RD 1088/2020", "note": ""}, {"n": 50, "stem": "¿En qué orden enumera el documento «Safety Culture in ATM» de EUROCONTROL, siguiendo a Reason, los cinco componentes de una cultura de seguridad?", "opts": ["Justa -&gt; de notificación -&gt; informada -&gt; de aprendizaje -&gt; flexible", "Informada -&gt; de notificación -&gt; justa -&gt; flexible -&gt; de aprendizaje", "De notificación -&gt; justa -&gt; informada -&gt; flexible -&gt; de aprendizaje", "De aprendizaje -&gt; flexible -&gt; justa -&gt; de notificación -&gt; informada"], "ans": 1, "why": "El enunciado pedía un orden «de la base a la cima» que la fuente no establece (solo enumera los componentes en esta secuencia, y la Q51 trata la cultura justa como la base habilitadora). El orden de la enumeración es: cultura informada (recogida de datos) -&gt; cultura de notificación (el personal se siente libre de aportar) -&gt; cultura justa (la confianza que hace posible la notificación) -&gt; cultura flexible (adaptación a operaciones inusuales) -&gt; cultura de aprendizaje (aplicación de los cambios derivados de lo aprendido).", "src": "EUROCONTROL, Safety Culture in ATM", "note": ""}, {"n": 51, "stem": "¿Por qué trata el modelo de Reason la «cultura justa» como estructuralmente crítica para toda la cadena, y no como un elemento más de los cinco, con el mismo peso?", "opts": ["Porque es legalmente obligatoria en todos los países", "Porque el personal no notificará realmente a menos que haya un ambiente de confianza; sin él, la cultura de notificación (y todo lo que se construye sobre ella) se derrumba", "Porque es la más recientemente introducida de las cinco culturas", "Porque sustituye la necesidad de una cultura informada"], "ans": 1, "why": "La cultura de notificación, y con ella la cultura informada a la que alimenta, depende de que el personal confíe en que las notificaciones honestas se tratarán con equidad; sin una cultura justa, el flujo de notificaciones que necesita todo el modelo se agota.", "src": "EUROCONTROL, Safety Culture in ATM", "note": ""}, {"n": 52, "stem": "Una dependencia recoge excelentes datos de incidentes y el personal notifica con libertad, pero la dirección no ha cambiado nunca un procedimiento a pesar de años de notificaciones similares. ¿Qué eslabón del modelo de cinco partes de Reason está fallando?", "opts": ["La cultura informada", "La cultura de notificación", "La cultura justa", "La cultura de aprendizaje"], "ans": 3, "why": "Se recogen datos (informada) y el personal notifica libremente (notificación, lo que implica que la cultura justa funciona); lo que falta es la «voluntad de aplicar cambios» (<em>will to implement changes</em>), que es precisamente el elemento de la cultura de aprendizaje.", "src": "EUROCONTROL, Safety Culture in ATM", "note": ""}, {"n": 53, "stem": "¿Qué dos redes de seguridad terrestres funcionan «junto con» el sistema ACAS/TCAS de a bordo para ayudar a evitar la colisión de aeronaves o la pérdida de separación?", "opts": ["MSAW y APM", "STCA y APW", "GPWS y TAWS", "SMS y TEM"], "ans": 1, "why": "El STCA (<em>Short-Term Conflict Alert</em>, alerta de conflicto a corto plazo) advierte directamente de la pérdida de separación prevista, y el APW (<em>Area Proximity Warning</em>, aviso de proximidad de área) ayuda de forma indirecta al predecir o detectar infracciones de la segregación del espacio aéreo; ambos funcionan junto con el ACAS/TCAS de a bordo y con independencia de él.", "src": "EUROCONTROL, Safety Nets - A Guide for Ensuring Effectiveness", "note": ""}, {"n": 54, "stem": "¿Qué dos redes de seguridad terrestres ayudan principalmente a evitar el impacto contra el terreno sin pérdida de control (CFIT), con su equivalente a bordo en el (E)GPWS?", "opts": ["STCA y APW", "MSAW y APM", "ACAS y TCAS", "SMS y FRMS"], "ans": 1, "why": "El MSAW (<em>Minimum Safe Altitude Warning</em>, aviso de altitud mínima de seguridad) y el APM (<em>Approach Path Monitor</em>, supervisor de trayectoria de aproximación) ayudan a evitar accidentes CFIT y funcionan de forma coordinada con el sistema de aviso de proximidad al terreno (mejorado) de la propia aeronave.", "src": "EUROCONTROL, Safety Nets - A Guide for Ensuring Effectiveness", "note": ""}, {"n": 55, "stem": "Las redes de seguridad terrestres, como el STCA, y los sistemas de a bordo, como el ACAS/TCAS, a veces se activan ambos ante el mismo conflicto, con segundos de diferencia. ¿Qué indica esto?", "opts": ["Un mal funcionamiento del sistema que requiere mantenimiento inmediato", "El diseño previsto de defensa en capas, independiente y redundante, de las redes de seguridad terrestres y de a bordo", "Que la red de seguridad terrestre ha fallado y solo funciona la de a bordo", "Un error de software exclusivo de ese espacio aéreo"], "ans": 1, "why": "Las redes de seguridad terrestres y de a bordo están diseñadas para funcionar de forma independiente como protecciones redundantes y en capas del mismo espacio aéreo; que alerten casi a la vez es el comportamiento previsto de ese diseño en capas, no una avería.", "src": "EUROCONTROL, Safety Nets - A Guide for Ensuring Effectiveness", "note": ""}, {"n": 56, "stem": "Según el III Convenio Colectivo de ENAIRE, ¿cuál es la carga de trabajo mensual máxima de un controlador en un mes que combina actividad aeronáutica y no aeronáutica y cuál es la proporción mínima de descanso que se exige en los puestos declarados formalmente con necesidad de «descanso reforzado»?", "opts": ["150 horas; 25 %", "160 horas; 30 %", "170 horas; 33 %", "180 horas; 40 %"], "ans": 2, "why": "El III Convenio fija una carga de trabajo mensual máxima de 170 horas para esos meses mixtos y una proporción mínima de descanso del 33 % del tiempo en los puestos designados formalmente con necesidad de descanso reforzado.", "src": "III Convenio Colectivo de ENAIRE, BOE-A-2023-18633", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/08-factores-humanos/ampliacion/T08b-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
