}
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}

nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}

.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}

h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}

pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}

.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}

.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}

.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}

.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}

table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:nowrap;padding-right:0;vertical-align:middle}table.src td.act a{display:inline-flex;margin:0}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}

c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-toc" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M12.5 17.5H20M4.5 6.5h.01M4.5 12h.01M7.5 17.5h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top hb"><a class="home" href="../../../index.html" aria-label="ATC 2026"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg><span class="brand">ATC 2026</span></a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span>Códigos OACI/IATA y aeronaves</span></a><button type="button" class="cmdk-btn" aria-label="Buscar" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="lbl">Buscar</span> <span class="kbd">Ctrl K</span></button><span class="hd-end"><span id="acct-slot"></span></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Códigos OACI/IATA y características de aeronaves, notas ampliadas (T02)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "La primera letra de un indicador de lugar OACI identifica:", "opts": ["el país propietario del aeródromo", "un área de encaminamiento del servicio fijo aeronáutico (AFS)", "el tipo de aeródromo (civil o militar)", "la región de información de vuelo en la que se encuentra el lugar"], "ans": 1, "why": "El mundo se divide en áreas de encaminamiento del AFS, cada una con una letra; las áreas no tienen por qué coincidir con un Estado, un territorio o una FIR. Por eso España tiene L y G. La segunda letra identifica el Estado o territorio.", "src": "Manual de ENAIRE, apartado 2.3", "note": ""}, {"n": 2, "stem": "¿Qué prefijo OACI tienen los indicadores de Ceuta y Melilla (GECE, GEML)?", "opts": ["LE", "GC", "GS", "GE"], "ans": 3, "why": "El AIP GEN 2.4 recoge GECE (helipuerto de Ceuta), GEML (aeródromo de Melilla) y GEHM (helipuerto militar de Melilla). LE corresponde a la Península y Baleares, GC a Canarias y GS se usa en los aeródromos del Sáhara Occidental (GSAI, GSVO).", "src": "AIP España GEN 2.4, AIRAC AMDT 07/26", "note": ""}, {"n": 3, "stem": "¿Cuál es el período mínimo antes de que un indicador de lugar OACI pueda asignarse de nuevo a otro lugar, una vez anulada su asignación previa?", "opts": ["Seis meses", "Un mes", "Doce meses", "Tres años"], "ans": 0, "why": "El manual de ENAIRE, siguiendo los principios del Doc 7910, indica que un indicador no debería volver a asignarse durante seis meses, como mínimo, tras su anulación.", "src": "Manual de ENAIRE, apartado 2.2", "note": ""}, {"n": 4, "stem": "¿Cuál de los siguientes indicadores se emplea en el AIP GEN 2.4 tanto para un aeropuerto como para un centro de control de área terminal (TACC)?", "opts": ["LEPA", "LEST", "LEZG", "LECO"], "ans": 2, "why": "La entrada del AIP «(AD) ZARAGOZA, ZARAGOZA TACC» usa LEZG para ambos. LEPA es el aeropuerto de Palma, LEST el de Santiago y LECO el de A Coruña; el TACC de Palma es LECP y el TACC de Santiago es LECG.", "src": "AIP España GEN 2.4", "note": ""}, {"n": 5, "stem": "¿Cuál es el código IATA del aeropuerto de Jerez (OACI LEJR)?", "opts": ["XRY", "JER", "JRZ", "LEJ"], "ans": 0, "why": "Los códigos IATA no derivan del código OACI. Jerez es XRY en la lista del manual de ENAIRE (procedente de iata.org). LEJ tampoco sigue la regla.", "src": "Manual de ENAIRE, apartado 5.2", "note": ""}, {"n": 6, "stem": "¿Cuál es el indicador OACI de Tenerife Norte / Ciudad de La Laguna?", "opts": ["GCTS", "GCXM", "GCLP", "GCXO"], "ans": 3, "why": "AIP GEN 2.4: GCXO = (AD) Tenerife Norte/Ciudad de La Laguna; GCTS = Tenerife Sur; GCXM = helipuerto militar de Los Rodeos; GCLP = Gran Canaria.", "src": "AIP España GEN 2.4", "note": ""}, {"n": 7, "stem": "Según el manual de ENAIRE, ¿cuál es el indicador AFTN de ocho letras de la torre de control de aeródromo de Alicante?", "opts": ["LEALTWRX", "LEALZTZX", "ZTZLEALX", "LEALYTYX"], "ans": 1, "why": "LEAL (Alicante) + ZTZ (torre de control de aeródromo) + X como letra de relleno. YTY sería un centro de telecomunicaciones en el AIP GEN 2.4, no la torre.", "src": "Manual de ENAIRE 2.5; AIP GEN 2.4", "note": ""}, {"n": 8, "stem": "En la lista de designadores del AIP GEN 2.4, ¿qué identifica el grupo ZZZ?", "opts": ["Un tipo de aeronave sin designador asignado", "El servicio de seguridad del aeródromo", "Una aeronave en vuelo", "Una oficina de notificación de los servicios de tránsito aéreo (ATS)"], "ans": 2, "why": "ZZZ = aeronave en vuelo. ZYZ es el servicio de seguridad del aeródromo y ZPZ la oficina de notificación ATS. «ZZZZ» (cuatro letras) es el designador de tipo para un tipo aún no asignado.", "src": "AIP España GEN 2.4 p. 17", "note": ""}, {"n": 9, "stem": "Los códigos de lugar IATA se asignan conforme a:", "opts": ["la Resolución 700 de la IATA", "la Resolución 736 de la IATA", "el Doc 7910 de la OACI", "la Resolución 763 de la IATA"], "ans": 3, "why": "La ficha informativa de la IATA dice que las reglas para la asignación de identificadores de lugar se establecen en la Resolución 763. El Doc 7910 es el documento de la OACI para los indicadores de lugar de cuatro letras.", "src": "Ficha informativa de la IATA «IATA Location Codes»", "note": ""}, {"n": 10, "stem": "¿Cuándo asigna normalmente la IATA un nuevo código de lugar de tres letras?", "opts": ["Cuando lo solicita una aerolínea comercial (o para una estación intermodal en un viaje con billete)", "Cuando la OACI asigna el código de cuatro letras del aeropuerto", "Cuando lo pide la autoridad de aviación civil del Estado", "De forma automática a todo aeródromo con pista"], "ans": 0, "why": "Los códigos solo se emiten a petición de una aerolínea comercial, normalmente la primera que sirve el lugar, o para un lugar usado en un viaje intermodal con billete. Por eso los aeródromos privados y militares suelen carecer de código IATA.", "src": "Ficha informativa de la IATA «IATA Location Codes»", "note": ""}, {"n": 11, "stem": "Washington D.C. está servida por DCA, BWI e IAD. ¿Cuál es el código IATA de ciudad o área metropolitana?", "opts": ["DCA", "BWI", "WAS", "IAD"], "ans": 2, "why": "Cuando una ciudad tiene más de un aeropuerto, cada aeropuerto conserva su propio código y el área metropolitana tiene el suyo o reutiliza uno; en Washington el código de ciudad es WAS. Ginebra, con un solo aeropuerto, usa GVA para ambos.", "src": "Ficha informativa de la IATA «IATA Location Codes»", "note": ""}, {"n": 12, "stem": "¿Cuál es la primera opción de la IATA al elegir un nuevo código de lugar?", "opts": ["Un código no asignado que empiece por la letra de la región OACI", "Un código no asignado formado por las tres primeras letras del nombre del lugar", "Las tres últimas letras del indicador OACI", "Una combinación aleatoria no asignada"], "ans": 1, "why": "Primera opción: las tres primeras letras del nombre del lugar; segunda opción: una combinación no asignada que empiece preferiblemente por la primera letra del nombre. El solicitante puede proponer códigos.", "src": "Ficha informativa de la IATA «IATA Location Codes»", "note": ""}, {"n": 13, "stem": "¿Qué designador telefónico usa Plus Ultra Líneas Aéreas (código OACI PUE)?", "opts": ["PLUS", "ULTRA", "PLUSULTRA", "SPANISH"], "ans": 3, "why": "En la lista de designadores OACI reproducida en la FAA JO 7340.2P, PUE = Plus Ultra Líneas Aéreas, designador telefónico SPANISH. El designador radiotelefónico suele diferir del nombre comercial.", "src": "FAA JO 7340.2P, capítulo 3, sección 3", "note": ""}, {"n": 14, "stem": "¿Cuáles son el designador OACI y el designador telefónico de Iberia Express?", "opts": ["IBS, IBEREXPRES", "IBE, IBERIA", "IBX, IBEREXPRESS", "IEX, EXPRESS"], "ans": 0, "why": "JO 7340.2P: IBS = Compañía Operadora de Corto y Medio Radio Iberia Express, S.A.U., designador telefónico IBEREXPRES (con una sola S). IBE/IBERIA es la propia Iberia.", "src": "FAA JO 7340.2P, capítulo 3", "note": ""}, {"n": 15, "stem": "En la lista de designadores OACI de 2026 reproducida por la FAA, ¿quién tiene el designador de tres letras JAT?", "opts": ["Jat Airways (Serbia)", "Air Serbia", "Jet Airways (India)", "JetSmart SPA (Chile), designador telefónico ROCKSMART"], "ans": 3, "why": "La JO 7340.2P, Change 3 (julio de 2026), recoge JAT = JetSmart SPA, Chile; Air Serbia es ASL. El manual de ENAIRE (noviembre de 2026) sigue incluyendo «Jat Airways JAT»: en este punto el manual está desactualizado.", "src": "FAA JO 7340.2P, capítulo 3; manual de ENAIRE, apartado 5.3", "note": ""}, {"n": 16, "stem": "¿Cuál es el designador telefónico de Fly Level (código OACI LVL)?", "opts": ["LEVEL", "DALI", "FLY LEVEL", "LEMON"], "ans": 1, "why": "La JO 7340.2P recoge LVL = Fly Level, designador telefónico DALI. LEMON es Aura Airlines (GoWair, GWR).", "src": "FAA JO 7340.2P, capítulo 3", "note": ""}, {"n": 17, "stem": "¿Qué artículo del Convenio de Chicago exige que toda aeronave dedicada a la navegación aérea internacional lleve sus marcas de nacionalidad y de matrícula?", "opts": ["El artículo 20", "El artículo 17", "El artículo 18", "El artículo 21"], "ans": 0, "why": "Art. 20 «Ostentación de las marcas». El art. 17 da a las aeronaves la nacionalidad del Estado en que estén matriculadas; el art. 18 prohíbe la matrícula doble; el art. 21 trata de la presentación de informes sobre matrículas.", "src": "OACI Doc 7300 (9.ª ed.), arts. 17-21", "note": ""}, {"n": 18, "stem": "¿Qué establece el artículo 18 del Convenio de Chicago?", "opts": ["Todo Estado debe llevar un registro abierto a todos los demás Estados", "Las marcas deben exhibirse en ambos lados del fuselaje", "Las aeronaves de Estado no deben matricularse", "Una aeronave no puede matricularse válidamente en más de un Estado, pero su matrícula puede cambiarse de un Estado a otro"], "ans": 3, "why": "Art. 18 «Matriculación doble».", "src": "OACI Doc 7300, art. 18", "note": ""}, {"n": 19, "stem": "Según el artículo 3 del Convenio de Chicago, ¿las aeronaves utilizadas en qué servicios se consideran aeronaves de Estado?", "opts": ["Servicios de aerolíneas, de carga y postales", "Solo servicios de búsqueda y salvamento y de extinción de incendios", "Servicios militares, de aduanas y de policía", "Solo transporte gubernamental y diplomático"], "ans": 2, "why": "Art. 3 b): las aeronaves utilizadas en servicios militares, de aduanas y de policía son aeronaves de Estado; el Convenio se aplica solo a las aeronaves civiles, y las aeronaves de Estado necesitan autorización para sobrevolar otro Estado.", "src": "OACI Doc 7300, art. 3", "note": ""}, {"n": 20, "stem": "¿Qué formato de marca de matrícula indica el AIP España GEN 2.1 (sección 5) para las aeronaves españolas?", "opts": ["EC seguida de un guion y 4 letras", "EC seguida de un guion y 3 letras, o 2 letras y un dígito", "EC seguida de un guion, un dígito y 3 letras", "E seguida de un guion y 5 caracteres"], "ans": 1, "why": "El AIP GEN 2.1, sección 5, da como ejemplos EC-AUM y EC-JM7. El RD 384/2015, art. 17.1, fija como formato legal EC más 4 letras, que se usará cuando se agote la serie de 3 letras (disposición adicional tercera). (Norma derogada por el RD 1029/2025; vigente: art. 4.1 y DA 2.)", "src": "AIP España GEN 2.1 §5; RD 384/2015", "note": ""}, {"n": 21, "stem": "Según el art. 17.1 del RD 384/2015, la marca de matrícula de las aeronaves civiles españolas consta de EC seguida, tras un guion, de:", "opts": ["3 letras, incluida la ñ", "2 letras y 3 números", "5 letras", "4 letras del alfabeto español, con omisión de la ñ, combinadas sucesivamente en orden alfabético"], "ans": 3, "why": "Texto del art. 17.1. La disposición adicional tercera indica que las marcas de tres letras existentes continúan hasta que se agote esa serie. (Norma derogada por el RD 1029/2025; vigente: art. 4.1 y DA 2.)", "src": "Real Decreto 384/2015, art. 17 y DA 3", "note": ""}, {"n": 22, "stem": "¿Cuál es el formato de una matrícula de prueba española según el RD 384/2015?", "opts": ["EC, un guion y tres números", "EC, un guion y tres letras", "EC-T seguido de dos números", "EC, un guion y cuatro números"], "ans": 0, "why": "Art. 36: «la marca de nacionalidad EC seguida por un guion y a continuación tres números». (Norma derogada por el RD 1029/2025; vigente: art. 28.)", "src": "Real Decreto 384/2015, art. 36", "note": ""}, {"n": 23, "stem": "¿En qué fecha entró en vigor el RD 384/2015 (Reglamento de matriculación de aeronaves civiles)?", "opts": ["22 de mayo de 2015", "1 de diciembre de 2015", "17 de junio de 2015", "1 de enero de 2016"], "ans": 1, "why": "Se aprobó el 22 de mayo de 2015 y se publicó en el BOE el 17 de junio de 2015; la disposición final quinta fija la entrada en vigor el 1 de diciembre de 2015. (Norma derogada por el RD 1029/2025; vigente: disposición final sexta, 20 días tras su publicación y, para los capítulos II a IV y la DA 4, seis meses.)", "src": "Real Decreto 384/2015, DF 5", "note": ""}, {"n": 24, "stem": "¿Cuál es la duración máxima de una reserva de matrícula según el Reglamento de matriculación de aeronaves civiles vigente (Real Decreto 1029/2025)?", "opts": ["Seis meses (duración de la matrícula provisional, no de la reserva)", "Un año, prorrogable por otros seis meses", "Tres meses", "Cuarenta y cinco días"], "ans": 1, "why": "Art. 15.2 del RD 1029/2025 (vigente): la reserva de matrícula dura un año, prorrogable por otros seis meses. El RD 384/2015, derogado por el RD 1029/2025 (BOE 13-11-2025), fijaba la reserva en seis meses y la matrícula provisional en tres meses más 45 días; esas cifras ya no aplican a una reserva nueva.", "src": "Real Decreto 1029/2025 (BOE-A-2025-22950), art. 15.2", "note": ""}, {"n": 25, "stem": "El certificado de matrícula provisional según el Reglamento vigente (Real Decreto 1029/2025) es válido durante:", "opts": ["tres meses, prorrogables un máximo de 45 días naturales (regla del RD 384/2015, derogado)", "seis meses", "un año sin prórroga", "45 días sin prórroga"], "ans": 1, "why": "Art. 20.3 del RD 1029/2025 (vigente): la matrícula provisional dura seis meses. El RD 384/2015, derogado por el RD 1029/2025 (BOE 13-11-2025), la fijaba en tres meses prorrogables 45 días; ese plazo de tres meses más 45 días pasa ahora a ser el periodo de uso permitido tras un cambio de titularidad (art. 22.4).", "src": "Real Decreto 1029/2025 (BOE-A-2025-22950), art. 20.3", "note": ""}, {"n": 26, "stem": "Tras un cambio de titularidad de una aeronave, según el Reglamento vigente (Real Decreto 1029/2025), ¿en qué plazo debe solicitar el NUEVO propietario la actualización de los datos registrales?", "opts": ["quince días", "dos meses (es el plazo del transmitente, no del nuevo propietario)", "seis meses", "un mes a contar desde la fecha del contrato (regla del RD 384/2015, derogado)"], "ans": 2, "why": "Art. 22 del RD 1029/2025 (vigente): el transmitente debe comunicar el cambio en dos meses, y el nuevo propietario debe solicitar la actualización registral en seis meses; durante ese plazo puede seguir usando la aeronave hasta tres meses más 45 días (art. 22.4). El RD 384/2015, derogado por el RD 1029/2025 (BOE 13-11-2025), daba solo un mes al adquirente.", "src": "Real Decreto 1029/2025 (BOE-A-2025-22950), art. 22", "note": ""}, {"n": 27, "stem": "Según el art. 3 del RD 384/2015, un microplaneador sin motor está exento de inscripción si su peso en vacío es inferior a:", "opts": ["100 kg en monoplaza u 80 kg en biplaza", "80 kg en monoplaza o 100 kg en biplaza", "70 kg en monoplaza o 120 kg en biplaza", "50 kg, con independencia de las plazas"], "ans": 1, "why": "Art. 3 e). Otras exenciones: otras aeronaves cuyo peso total al despegue, descontado el peso del piloto, sea inferior a 70 kg; globos libres no tripulados de menos de 6 kg. (Norma derogada por el RD 1029/2025; vigente: art. 2.2.b, 6.º para los microplaneadores de 80 kg monoplaza o 100 kg biplaza.)", "src": "Real Decreto 384/2015, art. 3", "note": ""}, {"n": 28, "stem": "¿Dónde tiene su sede el Registro de Matrícula de Aeronaves Civiles, según el Reglamento vigente (Real Decreto 1029/2025)?", "opts": ["En Barcelona, con una sola oficina", "En cada comunidad autónoma", "En la sede de la Agencia Estatal de Seguridad Aérea (AESA)", "En Madrid y Barcelona, con dos oficinas (regla del RD 384/2015, derogado)"], "ans": 2, "why": "Art. 5 del RD 1029/2025 (vigente): el Registro tiene su sede en la de AESA, sin especificar ciudad ni oficina única. El RD 384/2015, derogado por el RD 1029/2025 (BOE 13-11-2025), sí fijaba una sola oficina en Madrid; ese dato concreto ya no está en la norma vigente.", "src": "Real Decreto 1029/2025 (BOE-A-2025-22950), art. 5", "note": ""}, {"n": 29, "stem": "En cuanto a las aeronaves militares, el RD 384/2015 (art. 2.3):", "opts": ["las aeronaves militares usan marcas de matrícula EC con la letra M", "no se aplica a las aeronaves militares", "se aplica a ellas salvo en las matrículas de prueba", "se aplica a ellas si las utilizan pilotos civiles"], "ans": 1, "why": "El Reglamento no se aplica a las aeronaves militares, según se definen en el art. 14.1.º de la Ley 48/1960, que están sujetas a su regulación específica. (Norma derogada por el RD 1029/2025; vigente: art. 2.2.a.)", "src": "Real Decreto 384/2015, art. 2", "note": ""}, {"n": 30, "stem": "¿Cuál es la marca de nacionalidad OACI de Türkiye?", "opts": ["TC", "TU", "TR", "YT"], "ans": 0, "why": "Tabla OACI 1/6/26: Türkiye TC. TU es Costa de Marfil y TR es Gabón.", "src": "Tabla OACI de marcas de nacionalidad de aeronaves", "note": ""}, {"n": 31, "stem": "¿Cuál es la marca de nacionalidad de Dinamarca?", "opts": ["DK", "OD", "DA", "OY"], "ans": 3, "why": "Dinamarca OY; OD es Líbano. Noruega LN, Suecia SE, Finlandia OH.", "src": "Tabla OACI de marcas de nacionalidad de aeronaves", "note": ""}, {"n": 32, "stem": "Las marcas de nacionalidad de Portugal son:", "opts": ["P", "PT", "CR y CS", "LP"], "ans": 2, "why": "La OACI asigna a Portugal dos marcas, CR y CS. PT es una de las cinco marcas de Brasil (PP, PR, PS, PT, PU); LP es el prefijo de los indicadores de lugar OACI de Portugal.", "src": "Tabla OACI de marcas de nacionalidad de aeronaves", "note": ""}, {"n": 33, "stem": "La marca común OACI 4YB se ha asignado a:", "opts": ["Arab Air Cargo, un organismo internacional de explotación establecido por Jordania e Irak", "Naciones Unidas", "Gibraltar", "Liechtenstein"], "ans": 0, "why": "La tabla «Marcas comunes asignadas por la OACI a organismos internacionales de explotación» recoge Arab Air Cargo con la marca común 4YB (Estado que ejerce las funciones de Estado de matrícula: Jordania). El manual cita 4U para Naciones Unidas.", "src": "Tabla OACI de marcas de nacionalidad de aeronaves, sección 5", "note": ""}, {"n": 34, "stem": "¿Cuál es la descripción del McDonnell Douglas MD-11 en el Doc 8643?", "opts": ["L2J", "L3J", "L4J", "H3J"], "ans": 1, "why": "L = avión terrestre, 3 motores, J = motor a reacción. El A320 es L2J y el B747-400 es L4J; H3J sería un helicóptero de tres motores a reacción, que no existe como tal.", "src": "Base de datos del Doc 8643 de la OACI (JSON del 24-sep-2026)", "note": ""}, {"n": 35, "stem": "En la descripción del Doc 8643, el carácter C en segunda posición significa:", "opts": ["versión de carga", "convertible de pasajeros/carga", "dos motores acoplados para accionar una sola hélice (solo ala fija)", "configuración canard"], "ans": 2, "why": "El manual de ENAIRE y la FAA JO 7360.1K definen C como dos motores acoplados para accionar una sola hélice. Solo un modelo de la base de datos lo tiene (GANT Gannet, LCT).", "src": "Manual de ENAIRE §7.1; FAA JO 7360.1K 2-10", "note": ""}, {"n": 36, "stem": "¿Qué designador especial se usa para un globo en un plan de vuelo?", "opts": ["BALN", "BLLN", "GLID", "BALL"], "ans": 3, "why": "Designadores especiales de la OACI: BALL globo, GLID planeador, GLIM motovelero, SHIP dirigible, PARA paracaídas motorizado, ULAC aeronave ultraligera, GYRO autogiro ultraligero, UHEL helicóptero ultraligero, ZZZZ tipo no asignado.", "src": "Página de designadores especiales del Doc 8643 de la OACI; FAA JO 7360.1K 2-4", "note": ""}, {"n": 37, "stem": "¿Con qué frecuencia publica la OACI una lista actualizada de designadores de tipo de aeronave, según la orden FAA JO 7360.1K?", "opts": ["Cada 28 días", "Cada 3 meses", "Cada año", "Cada 56 días"], "ans": 0, "why": "JO 7360.1K 2-2 b): la OACI actualiza y publica una nueva lista cada 28 días; aun así, la FAA ordena a su personal usar solo los designadores publicados en su propia orden.", "src": "FAA JO 7360.1K 2-2", "note": ""}, {"n": 38, "stem": "El Boeing 757-200 (B752) tiene, según la base de datos de la OACI y la lista de asignación de la EASA:", "opts": ["WTC H y RECAT-EU CAT-B", "WTC H y RECAT-EU CAT-C", "WTC M y RECAT-EU CAT-C", "WTC M y RECAT-EU CAT-D"], "ans": 2, "why": "El Doc 8643 da L2J, WTC M para el B752; la lista RECAT-EU de la EASA lo sitúa en CAT-C (Pesada inferior, <em>Lower Heavy</em>), por lo que es una excepción clásica. El manual de ENAIRE dice que se trata como Pesada cuando precede y como Media cuando sigue.", "src": "Base de datos del Doc 8643 de la OACI; asignación RECAT-EU de la EASA, edición 2021-12", "note": ""}, {"n": 39, "stem": "¿Cuántos tipos de aeronave tienen WTC J en la base de datos del Doc 8643 de la OACI?", "opts": ["Ninguno", "Uno: el A388 (Airbus A380-800)", "Tres", "Cinco"], "ans": 1, "why": "La base de datos tiene 2 filas de modelo con WTC J, ambas del A388 (A-380-800 y A-380-800 Prestige). J se define como «tipos especificados como tales en el Doc 8643», no por una masa.", "src": "Base de datos del Doc 8643 de la OACI; FAA JO 7360.1K 2-6", "note": ""}, {"n": 40, "stem": "Con las mínimas de separación por estela turbulenta de la OACI (Tabla 1 de RECAT-EU de EUROCONTROL), ¿qué distancia se aplica en aproximación con un A380-800 como aeronave precedente y una aeronave Media como siguiente?", "opts": ["4 NM", "5 NM", "6 NM", "7 NM"], "ans": 3, "why": "Precedente A380: Pesada 6 NM, Media 7 NM, Ligera 8 NM. Precedente Pesada: Pesada 4, Media 5, Ligera 6.", "src": "EUROCONTROL RECAT-EU, edición 1.1, Tabla 1", "note": ""}, {"n": 41, "stem": "Una aeronave de la categoría OACI Pesada precede y una aeronave Ligera la sigue. La separación por estela turbulenta de la OACI es:", "opts": ["6 NM", "5 NM", "4 NM", "8 NM"], "ans": 0, "why": "Precedente Pesada: 4 NM Pesada, 5 NM Media, 6 NM Ligera. Los 8 NM corresponden al precedente A380 con una siguiente Ligera.", "src": "EUROCONTROL RECAT-EU, edición 1.1, Tabla 1", "note": ""}, {"n": 42, "stem": "¿Cuál es la categoría RECAT-EU del Airbus A320 y del Boeing 737-800?", "opts": ["CAT-B (Pesada superior)", "CAT-C (Pesada inferior)", "CAT-D (Media superior)", "CAT-E (Media inferior)"], "ans": 2, "why": "La Tabla 2 de EUROCONTROL y la lista de la EASA sitúan los A318-A321, B736-B739 y el 737 MAX en CAT-D. CAT-E incluye los 737-300/400/500 más antiguos, los E-Jets 170-195, los ATR y los CRJ.", "src": "EUROCONTROL RECAT-EU, Tabla 2; asignación RECAT-EU de la EASA", "note": ""}, {"n": 43, "stem": "¿Cuál es la categoría RECAT-EU del Embraer 190 (E190)?", "opts": ["CAT-D", "CAT-E", "CAT-F", "CAT-C"], "ans": 1, "why": "El E190 y el E195 son CAT-E (Media inferior); el E190-E2 (E290) y el E195-E2 (E295) son CAT-D.", "src": "Asignación RECAT-EU de la EASA, edición 2021-12", "note": ""}, {"n": 44, "stem": "Con las mínimas de distancia RECAT-EU, ¿qué separación se aplica con una aeronave precedente Super Pesada (CAT-A) y una siguiente Media superior (CAT-D)?", "opts": ["3 NM", "4 NM", "6 NM", "5 NM"], "ans": 3, "why": "Tabla 3, fila A: A 3, B 4, C 5, D 5, E 6, F 8 NM. La mínima de la OACI para un precedente A380 y una siguiente Media es de 7 NM, de modo que RECAT-EU ahorra 2 NM.", "src": "EUROCONTROL RECAT-EU, edición 1.1, Tabla 3", "note": ""}, {"n": 45, "stem": "Con RECAT-EU, ¿cuál es la mínima basada en tiempo para la salida con una aeronave precedente Super Pesada (CAT-A) y una siguiente Ligera (CAT-F)?", "opts": ["180 s", "160 s", "120 s", "80 s"], "ans": 0, "why": "Tabla 4, fila A: B 100 s, C 120 s, D 140 s, E 160 s, F 180 s. Los 80 s corresponden a una Ligera tras otra Ligera.", "src": "EUROCONTROL RECAT-EU, edición 1.1, Tabla 4", "note": ""}, {"n": 46, "stem": "¿Qué pareja recibe una mínima mayor con RECAT-EU que con el esquema de la OACI?", "opts": ["Precedente Super Pesada seguida de Pesada superior", "Precedente Pesada superior seguida de Ligera (7 NM frente a 6 NM)", "Precedente Pesada inferior seguida de Media superior", "Precedente Media inferior seguida de Ligera"], "ans": 1, "why": "La Tabla 5 de RECAT-EU muestra +1 NM para Pesada superior seguida de Ligera, una mejora de seguridad para las aeronaves más vulnerables; las demás parejas obtienen reducciones (-2, -2, -1 NM).", "src": "EUROCONTROL RECAT-EU, edición 1.1, Tablas 3 y 5", "note": ""}, {"n": 47, "stem": "¿Cómo cambia el esquema RECAT-EU la categoría de estela turbulenta que se consigna en la casilla 9 del plan de vuelo?", "opts": ["Se sustituye por las letras de la A a la F", "Se sustituye por H+, H-, M+, M-, L+ y J", "No cambia: los operadores siguen consignando J, H, M o L", "Solo se exige para las aeronaves Pesadas"], "ans": 2, "why": "El manual y el documento de EUROCONTROL indican que RECAT-EU no cambia la forma de rellenar el plan de vuelo ni la fraseología; los pilotos no necesitan conocer su categoría RECAT-EU.", "src": "Manual de ENAIRE §7.1; EUROCONTROL RECAT-EU, capítulo 3", "note": ""}, {"n": 48, "stem": "Según la orden FAA JO 7360.1K, un tipo de aeronave es Pesada (H) si su masa máxima certificada de despegue es:", "opts": ["de más de 41 000 lb", "de 136 000 lb o más", "de 15 400 lb o menos", "de 300 000 lb o más (salvo los tipos indicados como Super en el Doc 8643)"], "ans": 3, "why": "FAA: Pesada, 300 000 lb o más; Media, menos de 300 000 y más de 15 400 lb; Ligera, 15 400 lb o menos. La OACI usa kilogramos: 136 000 kg o más para Pesada.", "src": "FAA JO 7360.1K 2-6", "note": ""}, {"n": 49, "stem": "¿Cuántas categorías de turbulencia de estela consolidada (CWT) utiliza la FAA según la AC 90-23H?", "opts": ["Nueve, de la A a la I", "Seis, de la A a la F", "Cuatro", "Siete, de la A a la G"], "ans": 0, "why": "AC 90-23H 9.5.3.1: la CWT clasifica las aeronaves en nueve categorías, de la A a la I; «A» es Super (A380) e «I» una aeronave menor como un King Air 200. RECAT-EU tiene seis categorías.", "src": "FAA AC 90-23H", "note": ""}, {"n": 50, "stem": "Según la circular de asesoramiento de la FAA AC 150/5300-13B, una aeronave de la categoría de aproximación D tiene una velocidad de referencia de aproximación (Vref):", "opts": ["de 121 kt o más, pero menos de 141 kt", "de 91 kt o más, pero menos de 121 kt", "de 141 kt o más, pero menos de 166 kt", "de 166 kt o más"], "ans": 2, "why": "Tabla 1-1: A menos de 91; B de 91 a &lt;121; C de 121 a &lt;141; D de 141 a &lt;166; E de 166 o más.", "src": "FAA AC 150/5300-13B, Tabla 1-1", "note": ""}, {"n": 51, "stem": "El manual del Airbus A321 da una velocidad de aproximación final de 142 kt con una masa máxima de aterrizaje de 77 800 kg. ¿A qué categoría de aproximación corresponde?", "opts": ["C", "D", "B", "E"], "ans": 1, "why": "142 kt está en la banda de 141 a &lt;166 kt, categoría D. El mismo manual da 140 kt (categoría C) con 75 500 kg, de modo que versiones del mismo tipo pueden caer en categorías distintas.", "src": "Airbus A321 Aircraft Characteristics (jul 2025) 3-5-0; FAA AC 150/5300-13B", "note": ""}, {"n": 52, "stem": "Cuando no se especifica la Vref, la FAA (14 CFR 97.3, citado en la AC 150/5300-13B) agrupa las aeronaves en categorías de aproximación usando:", "opts": ["1,3 veces la velocidad de pérdida Vso con la masa máxima certificada de aterrizaje", "la velocidad máxima de operación VMO", "1,5 veces la velocidad de seguridad al despegue", "la velocidad de crucero en FL350"], "ans": 0, "why": "La definición: velocidad de referencia de aterrizaje Vref si se especifica o, si no se especifica, 1,3 veces la velocidad de pérdida (Vso) con la masa máxima certificada de aterrizaje.", "src": "FAA AC 150/5300-13B, definición 6", "note": ""}, {"n": 53, "stem": "El Grupo de Diseño de Aeronaves (ADG) de la FAA se determina por:", "opts": ["la velocidad de aproximación", "la masa máxima de despegue y la longitud", "el número de motores", "la envergadura o la altura de la cola, la que sea más restrictiva"], "ans": 3, "why": "Tabla 1-2: grupos I a VI, según la envergadura o la altura de la cola; si caen en grupos distintos se aplica el mayor.", "src": "FAA AC 150/5300-13B, Tabla 1-2", "note": ""}, {"n": 54, "stem": "Según el manual de planificación de aeropuertos de Airbus, ¿cuál es la envergadura del A350-900?", "opts": ["60,30 m", "64,75 m", "79,75 m", "68,40 m"], "ans": 1, "why": "El manual indica 64,75 m. El A330-200/300 tiene 60,3 m; el A380 es mucho mayor.", "src": "Airbus A350 Aircraft Characteristics (jul 2025)", "note": ""}, {"n": 55, "stem": "¿Qué altitud máxima de operación da el TCDS de la EASA para el Boeing 747-400?", "opts": ["41 000 ft", "43 100 ft", "45 100 ft (13 750 m)", "41 450 ft"], "ans": 2, "why": "
