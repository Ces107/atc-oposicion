: ""}, {"n": 272, "stem": "¿Qué fabricante y qué designador figuran en la ficha del EF18 Hornet?", "opts": ["McDonnell Douglas, F18H", "Boeing, F18", "Northrop, F18H", "McDonnell Douglas, EF18"], "ans": 0, "why": "EF18 Hornet: McDonnell Douglas, F18H. El AV-8B II Harrier también figura como McDonnell Douglas; el F5, como Northrop.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 273, "stem": "¿Qué régimen máximo de ascenso inicial da el catálogo al EF18 Hornet (F18H)?", "opts": ["14500 ft/min", "30000 ft/min", "34000 ft/min", "4500 ft/min"], "ans": 1, "why": "F18H 30000; F5 34000 (el mayor); HAR 14500; EUFI 4500.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 274, "stem": "¿Qué descripción tiene el AV-8B II Harrier (HAR) en el catálogo?", "opts": ["L2J", "L1T", "L1J", "H1J"], "ans": 2, "why": "HAR: L1J, el único reactor monomotor del catálogo. L1T son el PC-21 y el Q9.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 275, "stem": "¿Qué alcance y qué categoría RECAT-EU da el catálogo al Harrier (HAR)?", "opts": ["600 NM y Light", "2000 NM y Lower medium", "1300 NM y Light", "600 NM y Lower medium"], "ans": 0, "why": "HAR: M0.80 - 480 kt, 14500 ft/min, FL500, 600 NM, WTC M, RECAT-EU Light, 9,2 m. B es el F18H y C el F5.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 276, "stem": "¿Qué fabricante y qué denominación tiene el F5 del catálogo?", "opts": ["McDonnell Douglas, F5 Tiger", "Northrop, F5E Tiger II", "Lockheed, F5M Freedom fighter", "Northrop, F5M Freedom fighter"], "ans": 3, "why": "Northrop F5M Freedom fighter, designador F5.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 277, "stem": "¿Qué techo y qué envergadura da el catálogo al F5?", "opts": ["FL500 y 9,2 m", "FL650 y 11,1 m", "FL510 y 8,1 m", "FL510 y 17,1 m"], "ans": 2, "why": "F5: L2J, M0.86 - 480 kt, 34000 ft/min, FL510, 1300 NM, M, Light, 8,1 m (la menor envergadura). A es el HAR y B el EUFI.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41", "note": ""}, {"n": 278, "stem": "¿Qué descripción y qué fabricante tiene el PC-21 del catálogo?", "opts": ["L1T, Pilatus", "L1P, Pilatus", "L2T, Pilatus", "L1T, Embraer"], "ans": 0, "why": "Pilatus PC-21, designador PC21, L1T.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 42", "note": ""}, {"n": 279, "stem": "¿Qué techo y qué régimen máximo de ascenso inicial da el catálogo al Pilatus PC-21 (PC21)?", "opts": ["FL500 y 4000 ft/min", "FL380 y 4000 ft/min", "FL300 y 2000 ft/min", "FL380 y 4500 ft/min"], "ans": 1, "why": "PC21: 4000 ft/min, FL380, 700 NM, L, Light, 8,7 m. FL500 y 4000 ft/min es el Q9.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 42", "note": ""}, {"n": 280, "stem": "Según el manual, ¿qué velocidad en nudos da la ficha del Pilatus PC-21?", "opts": ["240 kt", "280 kt", "340 kt", "420 kt"], "ans": 2, "why": "La ficha imprime «M 0.86 - 340 kt»; el número de Mach no casa con 340 kt en un turbohélice, así que la cifra útil es 340 kt. 240 kt es el C295, 280 kt el AT76 y 420 kt el A400.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 42", "note": ""}, {"n": 281, "stem": "Según el manual, ¿qué designador figura impreso en la ficha del AS.532 Cougar?", "opts": ["AS32", "A332", "AS53", "CGAR"], "ans": 1, "why": "La ficha imprime «A332», el designador del A330 MRTT; es una errata (la edición anterior usaba AS32 para el Cougar).", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 42", "note": ""}, {"n": 282, "stem": "Frente al AS.532 Cougar, el NH-90 Lobo tiene en el catálogo:", "opts": ["Menos velocidad y menos techo", "Más velocidad, más régimen de ascenso y más techo", "La misma velocidad y menos alcance", "Más velocidad y otra WTC"], "ans": 1, "why": "NH90 175 kt, 2100 ft/min, FL200, 500 NM; Cougar 140 kt, 1500 ft/min, FL170, 460 NM. Los dos son H2T, WTC M y RECAT-EU Light.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 42", "note": ""}, {"n": 283, "stem": "¿Qué WTC y qué categoría RECAT-EU dan las fichas del AS.532 Cougar y del NH-90 Lobo?", "opts": ["L y Light", "M y Lower medium", "H y Lower heavy", "M y Light"], "ans": 3, "why": "Los dos helicópteros militares son WTC M y RECAT-EU Light; los tres civiles (EC35, AS65, AS55) son L y Light.", "src": "Manual 2 (nov. 2026), capítulos 6.4.5 y 6.4.7, p. 37 y 42", "note": ""}, {"n": 284, "stem": "¿Qué designador OACI tiene el MQ-9 Predator B en el catálogo?", "opts": ["MQ9", "PRED", "Q9", "GA9"], "ans": 2, "why": "MQ-9 Predator B = Q9.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 43", "note": ""}, {"n": 285, "stem": "¿Qué datos da el catálogo al MQ-9 Predator B (Q9)?", "opts": ["L1J, 170 kt, FL500, 1000 NM", "L1T, 340 kt, FL380, 700 NM", "L1P, 120 kt, FL130, 950 NM", "L1T, 170 kt, FL500, 1000 NM"], "ans": 3, "why": "Q9: L1T, 170 kt, 4000 ft/min, FL500, 1000 NM, L, Light, 20 m. B es el PC-21 y C el SIRA.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 43", "note": ""}, {"n": 286, "stem": "¿Qué fabricante figura en la ficha del MQ-9 Predator B?", "opts": ["General Atomics", "Northrop", "Pilatus", "Airbus"], "ans": 0, "why": "General Atomics, MQ-9 Predator B, designador Q9.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 43", "note": ""}, {"n": 287, "stem": "¿Qué aeronave del catálogo es WTC H pero Lower heavy en RECAT-EU?", "opts": ["A337 (Beluga XL)", "A124 (Antonov 124)", "B752 (Boeing 757-200)", "A400 (A400M Grizzly)"], "ans": 3, "why": "A400: H y Lower heavy. A337 es H y Upper heavy; A124, H y Super heavy; B752, M y Lower heavy.", "src": "Manual 2 (nov. 2026), capítulos 6.4.2 y 6.4.7, p. 31-33 y 40", "note": ""}, {"n": 288, "stem": "¿Qué aeronave del catálogo es WTC M pero Light en RECAT-EU?", "opts": ["EUFI (Eurofighter Typhoon)", "F18H (EF18 Hornet)", "C295 Persuader", "F5 (F5M Freedom fighter)"], "ans": 3, "why": "WTC M y RECAT-EU Light: F5, HAR, Cougar y NH90. EUFI, F18H y C295 son M y Lower medium.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 40-42", "note": ""}, {"n": 289, "stem": "¿Qué dos aeronaves del catálogo figuran como Super heavy en RECAT-EU?", "opts": ["A388 y A124", "A388 y B748", "A388 y B778/B779", "A124 y B744"], "ans": 0, "why": "A388 (WTC J) y A124 (WTC H) son Super heavy en sus fichas; B748, 777X y B744 son Upper heavy. En la tabla RECAT-EU de la p. 45 solo figura el A388.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 29-31", "note": ""}, {"n": 290, "stem": "¿Qué aeronave del catálogo NO es L4J?", "opts": ["B744", "A124", "A400", "B748"], "ans": 2, "why": "L4J: A388, B744, B748 y A124. El A400 es L4T, cuatro turbohélices.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1, 6.4.2 y 6.4.7, p. 29-32 y 40", "note": ""}, {"n": 291, "stem": "¿Qué dos aeronaves del catálogo tienen la descripción L1T?", "opts": ["HAR y PC21", "Q9 y SIRA", "AT76 y C295 Persuader", "PC21 y Q9"], "ans": 3, "why": "PC-21 y MQ-9 son L1T. HAR es L1J; SIRA, L1P; AT76 y el C295 Persuader, L2T.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41-43", "note": ""}, {"n": 292, "stem": "¿Qué avión del grupo de pistón del catálogo es monomotor (L1P)?", "opts": ["C337 (Cessna 337)", "PA34 (PA-34 Seneca)", "P06T (Tecnam P2006T)", "P28R (PA-28 Arrow)"], "ans": 3, "why": "L1P: C172, DA40, SIRA y P28R. L2P: C337, DA-42, P06T y PA34.", "src": "Manual 2 (nov. 2026), capítulo 6.4.6, p. 38-39", "note": ""}, {"n": 293, "stem": "¿Qué aeronave tiene el techo más alto del catálogo?", "opts": ["F5", "GL7T (Global 8000)", "F18H", "EUFI (Eurofighter Typhoon)"], "ans": 3, "why": "EUFI FL650; F5 y GL7T FL510; F18H FL500.", "src": "Manual 2 (nov. 2026), capítulos 6.4.4 y 6.4.7, p. 35 y 40-41", "note": ""}, {"n": 294, "stem": "¿Qué aeronave tiene el techo más bajo del catálogo?", "opts": ["AS55 (AS-355 Ecureuil)", "DA40 (Diamond DA-40)", "SIRA (Tecnam P-Mentor)", "C172 (Cessna 172)"], "ans": 1, "why": "DA40 FL100; AS55 FL120; SIRA FL130; C172 FL150.", "src": "Manual 2 (nov. 2026), capítulos 6.4.5 y 6.4.6, p. 37-39", "note": ""}, {"n": 295, "stem": "¿Qué aeronave tiene el mayor régimen máximo de ascenso inicial del catálogo?", "opts": ["F18H (EF18 Hornet)", "HAR (AV-8B II Harrier)", "EUFI (Eurofighter Typhoon)", "F5 (F5M Freedom fighter)"], "ans": 3, "why": "F5 34000 ft/min; F18H 30000; HAR 14500; EUFI 4500.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 40-41", "note": ""}, {"n": 296, "stem": "¿Qué ficha da el mayor alcance del catálogo?", "opts": ["A35K (A350-1000)", "Boeing 777X (B778/B779)", "A124 (Antonov 124)", "A359 (A350-900)"], "ans": 1, "why": "777X 9500 NM; A35K 9000; A124 8900; A359 8500.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 28, 30 y 31", "note": ""}, {"n": 297, "stem": "¿Qué aeronave tiene el menor alcance del catálogo?", "opts": ["EC35 (EC-135)", "AS.532 Cougar", "HAR (AV-8B II Harrier)", "AS55 (AS-355 Ecureuil)"], "ans": 3, "why": "AS55 400 NM; EC35 y AS65 430; Cougar 460; NH90 500; C172 580; HAR 600.", "src": "Manual 2 (nov. 2026), capítulos 6.4.5 y 6.4.7, p. 37 y 41-42", "note": ""}, {"n": 298, "stem": "¿Qué aeronave tiene la mayor envergadura del catálogo?", "opts": ["A388", "A124", "Boeing 777X (B778/B779)", "B748"], "ans": 0, "why": "A388 79,8 m; A124 73,3; 777X 71,8; B748 68,5.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 29-31", "note": ""}, {"n": 299, "stem": "¿Qué aeronave tiene la menor envergadura del catálogo?", "opts": ["PC21 (Pilatus PC-21)", "HAR (AV-8B II Harrier)", "F5 (F5M Freedom fighter)", "SIRA (Tecnam P-Mentor)"], "ans": 2, "why": "F5 8,1 m; PC21 8,7; SIRA 9; HAR 9,2.", "src": "Manual 2 (nov. 2026), capítulos 6.4.6 y 6.4.7, p. 39 y 41-42", "note": ""}, {"n": 300, "stem": "¿Qué aeronave da la mayor velocidad de crucero en nudos del catálogo?", "opts": ["GL7T (Global 8000)", "A388", "B748", "FA8X (Falcon 8X)"], "ans": 3, "why": "FA8X 580 kt; A388 520; GL7T, B744, B748 y F900 510.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.4, p. 29-30 y 35", "note": ""}, {"n": 301, "stem": "¿Qué dos aeronaves del catálogo dan el número de Mach de crucero más alto (M0.90)?", "opts": ["GL7T y FA8X", "B748 y B78X", "F18H y F5", "A388 y B744"], "ans": 0, "why": "Global 8000 y Falcon 8X, M0.90. B748, B78X, F18H, F5 y PC-21 dan M0.86; A388 y B744, M0.85.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35", "note": ""}, {"n": 302, "stem": "Entre los aviones de los grupos de pasajeros y de carga, ¿cuál tiene el techo más alto?", "opts": ["A388", "A359", "B744", "B752"], "ans": 2, "why": "B744 FL450; A388 y A359 FL430; B752 FL420.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 28-30 y 33", "note": ""}, {"n": 303, "stem": "¿Qué aeronave del catálogo NO tiene techo FL510?", "opts": ["GL7T (Global 8000)", "CL35 (Challenger 3500)", "F900 (Falcon 900)", "GA7C (Gulfstream G700)"], "ans": 1, "why": "CL35 FL450. FL510: GL7T, FA8X, F900, GLF4, GA7C y F5.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35-36", "note": ""}, {"n": 304, "stem": "¿Qué aeronaves comparten techo FL500 en el catálogo?", "opts": ["F18H, HAR y Q9", "EUFI, F5 y F18H", "GL7T, F900 y GLF4", "HAR, F5 y PC21"], "ans": 0, "why": "FL500: EF18 Hornet, Harrier y MQ-9. EUFI FL650, F5 FL510, PC21 FL380.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 41 y 43", "note": ""}, {"n": 305, "stem": "¿Qué helicóptero del catálogo tiene el techo más alto?", "opts": ["EC35 (EC-135)", "AS.532 Cougar", "AS65 (AS-365 Dauphin)", "NH90 (NH-90 Lobo)"], "ans": 3, "why": "NH90 FL200; EC35 y Cougar FL170; AS65 FL150; AS55 FL120.", "src": "Manual 2 (nov. 2026), capítulos 6.4.5 y 6.4.7, p. 37 y 42", "note": ""}, {"n": 306, "stem": "¿Qué dos aeronaves de los grupos de pasajeros y de carga tienen el régimen máximo de ascenso inicial más bajo (1000 ft/min)?", "opts": ["A124 y A337", "B744 y B748", "A388 y A124", "A338 y A339"], "ans": 0, "why": "A124 y Beluga XL (A337) 1000 ft/min; B744 1500; A338/A339 2000; A388 2500; B748 2800.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 28-32", "note": ""}, {"n": 307, "stem": "Comparando el A124 y el A388 en el catálogo:", "opts": ["El A124 tiene más envergadura", "El A388 tiene más techo y más régimen de ascenso", "El A124 tiene más techo", "Los dos tienen el mismo alcance"], "ans": 1, "why": "A388 FL430 y 2500 ft/min, 8000 NM, 79,8 m; A124 FL390 y 1000 ft/min, 8900 NM, 73,3 m.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 29 y 31", "note": ""}, {"n": 308, "stem": "¿Qué aeronave del catálogo es Upper medium en RECAT-EU?", "opts": ["CRJX (CRJ-1000)", "AT76 (ATR 72-600)", "GL7T (Global 8000)", "E295 (E195-E2)"], "ans": 3, "why": "Upper medium: BCS1, BCS3, la familia A319-A321 y sus neo, B738, 737 MAX y E295. CRJX, AT76 y GL7T son Lower medium.", "src": "Manual 2 (nov. 2026), capítulos 6.4.3 y 6.4.4, p. 33-35", "note": ""}, {"n": 309, "stem": "¿Qué aeronave del catálogo NO tiene T (turbohélice/turboeje) como tercer carácter de la descripción?", "opts": ["AT76 (ATR 72-600)", "Q9 (MQ-9 Predator B)", "NH90 (NH-90 Lobo)", "HAR (AV-8B II Harrier)"], "ans": 3, "why": "HAR es L1J; AT76 L2T, Q9 L1T y NH90 H2T.", "src": "Manual 2 (nov. 2026), capítulos 6.4.3 y 6.4.7, p. 33 y 41-43", "note": ""}, {"n": 310, "stem": "Según el catálogo, frente al A320, el B738:", "opts": ["Asciende más y tiene más techo", "Asciende menos y tiene más techo", "Asciende más y tiene menos techo", "Asciende igual y tiene el mismo techo"], "ans": 0, "why": "B738 3000 ft/min y FL410; A320 2500 ft/min y FL390.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 27 y 29", "note": ""}, {"n": 311, "stem": "¿Qué WTC y qué RECAT-EU tienen las ocho aeronaves del grupo de pistón del catálogo?", "opts": ["L o M según el número de motores", "L todas, y RECAT-EU Lower medium", "L todas, y RECAT-EU Light", "M las bimotores y L las monomotores"], "ans": 2, "why": "Las ocho (C172, C337, DA40, DA-42, SIRA, P06T, P28R, PA34) son WTC L y RECAT-EU Light.", "src": "Manual 2 (nov. 2026), capítulo 6.4.6, p. 38-39", "note": ""}, {"n": 312, "stem": "¿Qué aeronave NO tiene un régimen máximo de ascenso inicial de 3000 ft/min en el catálogo?", "opts": ["A359 (A350-900)", "CRJX (CRJ-1000)", "F900 (Falcon 900)", "A35K (A350-1000)"], "ans": 3, "why": "A35K 2500. Con 3000 ft/min: A359, B738, Boeing 777, CRJX, E295 y F900.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1, 6.4.3 y 6.4.4, p. 28-30 y 34-35", "note": ""}, {"n": 313, "stem": "¿Qué aeronave tiene el mismo alcance que el A388 (8000 NM) en el catálogo?", "opts": ["A359 (A350-900)", "GL7T (Global 8000)", "A124 (Antonov 124)", "B744 (Boeing 747-400)"], "ans": 1, "why": "8000 NM: A388, GL7T y Boeing 787 (B788/B789). A359 8500; A124 8900; B744 7300.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.4, p. 29, 31 y 35", "note": ""}, {"n": 314, "stem": "¿Qué aeronave tiene la misma envergadura (35,1 m) que el Airbus 220-100 (BCS1)?", "opts": ["E295 (E195-E2)", "A20N (A320neo)", "Boeing 737 MAX", "A319"], "ans": 0, "why": "35,1 m: BCS1, BCS3 y E295. A20N 35,8 m; 737 MAX 35,9 m; A319 34,1 m.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.3, p. 26-27, 29 y 34", "note": ""}, {"n": 315, "stem": "¿Qué aeronaves militares del catálogo son WTC H?", "opts": ["A400M y C295 Persuader", "A400M y A330 MRTT", "Eurofighter y EF18 Hornet", "A330 MRTT y NH-90"], "ans": 1, "why": "A400 (H, Lower heavy) y A330 MRTT (H, Upper heavy). C295, Eurofighter, EF18 y NH-90 son M.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 40-42", "note": ""}, {"n": 316, "stem": "Según el manual, ¿qué permite conocer el Doc 8643 de la OACI?", "opts": ["El designador y la descripción de aeronave", "Los indicadores de lugar", "Los designadores de empresas explotadoras", "Las marcas de nacionalidad"], "ans": 0, "why": "«El documento 8643 de OACI permite conocer el designador y descripción de aeronave». Indicadores de lugar: Doc 7910; empresas: Doc 8585; marcas: Anexo 7.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 317, "stem": "En los ejemplos de denominaciones del manual, ¿de qué fabricante es el «Metro»?", "opts": ["PIPER", "SWEARINGEN", "CESSNA", "AIRBUS"], "ans": 1, "why": "PiperSport (PIPER), Skymaster (CESSNA), Metro (SWEARINGEN), A380 (AIRBUS).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 318, "stem": "¿Qué denominación atribuye el manual al fabricante CESSNA en sus ejemplos?", "opts": ["PiperSport", "Metro", "A380", "Skymaster"], "ans": 3, "why": "Skymaster (CESSNA); PiperSport (PIPER); Metro (SWEARINGEN); A380 (AIRBUS).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 319, "stem": "¿Qué masa figura en la tabla WTC del manual para el AIRBUS A380-800?", "opts": ["136.000 kg", "400.000 kg", "560.000 kg", "600.000 kg"], "ans": 2, "why": "«J (Súper): Exclusivo para la aeronave AIRBUS A380-800 (560.000 kg)». 136.000 kg es el límite de la H.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 320, "stem": "Una aeronave de exactamente 136.000 kg de MTOW es, según la tabla WTC del manual:", "opts": ["Media", "Pesada", "Súper", "Ligera"], "ans": 1, "why": "H = 136.000 kg o más; M = menos de 136.000 kg y más de 7.000 kg.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 321, "stem": "En la clasificación OACI del manual, las mínimas de separación por estela turbulenta se basan en:", "opts": ["La envergadura", "La MTOW y la envergadura", "La velocidad de aproximación", "La masa máxima certificada al despegue (MTOW)"], "ans": 3, "why": "La clasificación OACI usa solo la MTOW; RECAT-EU combina MTOW y envergadura.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44-45", "note": ""}, {"n": 322, "stem": "Según la edición de 2026 del manual, el esquema de estela turbulenta RECAT-EU:", "opts": ["Solo se contempla en la reglamentación europea", "Sustituye en todo el mundo a la WTC de la OACI", "Lo declaran los pilotos en la casilla 9 del plan de vuelo", "Solo se aplica a las aproximaciones finales"], "ans": 0, "why": "«El esquema de estela turbulenta RECAT-EU, solo se contempla en la reglamentación europea, introduce las seis categorías siguientes...». La casilla 9 sigue llevando J, H, M o L.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 323, "stem": "En RECAT-EU, la categoría SUPER HEAVY (J) es:", "opts": ["Una categoría nueva, sin equivalente en la OACI", "La suma de las categorías J y H de la OACI", "Equivalente a la categoría H de la OACI", "Equivalente a la categoría SUPER (J) de la WTC de la OACI"], "ans": 3, "why": "«SUPER HEAVY (J): Equivalente a la categoría SUPER (J) de la clasificación por estela turbulenta (WTC) OACI».", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 324, "stem": "En RECAT-EU, ¿cómo se muestra al controlador la categoría LOWER HEAVY?", "opts": ["H+", "H-", "M+", "L+"], "ans": 1, "why": "UPPER HEAVY H+, LOWER HEAVY H-, UPPER MEDIUM M+, LOWER MEDIUM M-, LIGHT L+.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 325, "stem": "¿Cuál es el orden de las seis categorías RECAT-EU del manual, de la a) a la f)?", "opts": ["J, H+, H-, M+, M-, L+", "J, H-, H+, M-, M+, L", "J, H+, M+, H-, M-, L+", "H+, J, H-, M+, M-, L+"], "ans": 0, "why": "a) SUPER HEAVY (J), b) UPPER HEAVY (H+), c) LOWER HEAVY (H-), d) UPPER MEDIUM (M+), e) LOWER MEDIUM (M-), f) LIGHT (L+).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 326, "stem": "Según el manual, la implementación de mínimos de separación RECAT-EU:", "opts": ["Obliga a cambiar la fraseología empleada con los pilotos", "Exige que el piloto notifique su categoría en el primer contacto", "Cambia la planificación y la gestión de los vuelos", "No afecta a los procedimientos de vuelo ni a la fraseología"], "ans": 3, "why": "«No afectará a los procedimientos de vuelo ni cambiará nada respecto a la planificación y/o gestión de los vuelos ni a la fraseología».", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 327, "stem": "¿Necesita el piloto conocer la categoría RECAT-EU de su aeronave?", "opts": ["Sí, debe notificarla en el primer contacto", "No, no es necesario ni requerido", "Sí, debe incluirla en la casilla 18 del plan de vuelo", "Solo en los aeropuertos que aplican RECAT-EU"], "ans": 1, "why": "«Tampoco es necesario ni requerido que el piloto conozca la categoría RECAT-EU de su aeronave».", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 328, "stem": "En la tabla «Categorías RECAT-EU relevantes» del manual, ¿en qué columna está la serie B736-B739?", "opts": ["UPPER MEDIUM", "LOWER MEDIUM", "LOWER HEAVY", "UPPER HEAVY"], "ans": 0, "why": "UPPER MEDIUM: A318-A321 (todas las series, incluido NEO) y B736-B739 (todas las series, incluido MAX).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 329, "stem": "En esa misma tabla, ¿qué serie del B737 figura en LOWER MEDIUM?", "opts": ["B736-B739", "B732-B735", "B737 MAX", "Ninguna serie del B737"], "ans": 1, "why": "LOWER MEDIUM incluye B732-B735; las series B736-B739, con la MAX, están en UPPER MEDIUM.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 330, "stem": "¿Qué categoría RECAT-EU NO tiene columna en la tabla «Categorías RECAT-EU relevantes» del manual?", "opts": ["SUPER HEAVY", "LOWER HEAVY", "LOWER MEDIUM", "LIGHT"], "ans": 3, "why": "La tabla tiene cinco columnas: SUPER HEAVY, UPPER HEAVY, LOWER HEAVY, UPPER MEDIUM y LOWER MEDIUM.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 331, "stem": "Según la nota (3) de la tabla RECAT-EU, la entrada A318-A321 de UPPER MEDIUM incluye:", "opts": ["Todas las series, incluido NEO", "Solo las versiones ceo", "Solo el A321", "Todas las series salvo el A318"], "ans": 0, "why": "«(3) Todas las series, incluido NEO»; la nota (4) dice lo mismo del B736-B739 «incluido MAX».", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 332, "stem": "¿Qué tipos figuran en LOWER MEDIUM en la tabla RECAT-EU del manual?", "opts": ["A318-A321 y B736-B739", "A310, B757 y B767", "B747, B777 y B787", "ATR, CRJ, DH8, E145-E190, B461-B463 y B732-B735"], "ans": 3, "why": "LOWER MEDIUM: AT43-AT46, AT72-AT76, B461-B463, B732-B735, CRJ1-CRJ9, CRJX, DH8A-DH8D y E145-E190. A es UPPER MEDIUM, B LOWER HEAVY y C UPPER HEAVY.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 333, "stem": "En la descripción del tipo de aeronave, el primer carácter G significa:", "opts": ["Glider (planeador)", "Gyrocopter (girohelicóptero)", "Ground vehicle (vehículo de superficie)", "Gear (tren fijo)"], "ans": 1, "why": "Primer carácter: L Landplane, S Seaplane, A Amphibian, H Helicopter, G Gyrocopter, T Tilt-wing aircraft.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 334, "stem": "En la descripción del tipo de aeronave, el primer carácter A significa:", "opts": ["Amphibian (anfibio)", "Airship (dirigible)", "Aeroplane (avión)", "Autogiro (autogiro)"], "ans": 0, "why": "A = Amphibian (anfibio); el avión terrestre es L (Landplane).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 335, "stem": "En el tercer carácter de la descripción, la letra T significa:", "opts": ["Tilt-wing aircraft (ala basculante)", "Turbojet (turborreactor)", "Turboprop/turboshaft engine (turbohélice/turboeje)", "Twin engine (bimotor)"], "ans": 2, "why": "Tercer carácter: P pistón, T turbohélice/turboeje, J reacción, E eléctrico. Tilt-wing es la T del primer carácter.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 336, "stem": "¿Cuántos caracteres emplea la descripción del tipo de aeronave?", "opts": ["Dos", "Tres", "Cuatro", "De dos a cuatro"], "ans": 1, "why": "«Se emplean tres caracteres». El designador, en cambio, tiene de 2 a 4 caracteres alfanuméricos.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44 y 46", "note": ""}, {"n": 337, "stem": "En el ejemplo cifrado del manual (AIRBUS A-330-900), ¿qué explicación figura bajo la columna WTC?", "opts": ["Categoría de estela turbulenta: media", "Heavy: más de 7.000 kg", "Hydroplane (hidroavión)", "Categoría de estela turbulenta: pesada"], "ans": 3, "why": "El ejemplo: A-330-900, designador A339, WTC H («Categoría de estela turbulenta: pesada»), descripción L2J.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 338, "stem": "En el designador ATA/IATA, la categoría J significa:", "opts": ["Jet engine (turborreactor), precedido del número de motores", "Jet engine, sin indicar el número de motores", "Categoría de estela J (Súper)", "Aviones de más de cuatro motores"], "ans": 0, "why": "Categorías: H helicóptero; J, P y T precedidos del número de motores; S hidroavión. Ejemplo: Embraer 190, 2J.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 339, "stem": "En los ejemplos ATA/IATA del manual, ¿qué categoría tiene el MD Helicopters MD 900 Explorer?", "opts": ["2T", "H", "2H", "S"], "ans": 1, "why": "MD 900 Explorer: designador general MD9, subtipo MD9, categoría H (sin número de motores delante).", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 340, "stem": "En el designador ATA/IATA, la categoría S significa:", "opts": ["Seaplane (hidroavión)", "Single engine (monomotor)", "Supersonic (supersónico)", "Short take-off (despegue corto)"], "ans": 0, "why": "S: Seaplane (hidroavión).", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 341, "stem": "Según el manual, ¿cuándo se asigna un subtipo de avión ATA/IATA?", "opts": ["Cuando una familia tiene versiones de pasajeros y de carga", "Cuando hay modelos de distinta longitud de fuselaje, envergadura, etc. en la misma familia", "Cuando la aeronave cambia de explotador", "Solo cuando la aeronave es un helicóptero"], "ans": 1, "why": "El subtipo es un código de tres caracteres que se asigna cuando existen diferentes modelos en la misma familia; la configuración (pasajeros, carga o mixta) define el designador general.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 46", "note": ""}, {"n": 342, "stem": "¿Qué categoría ATA/IATA da el manual al Airbus 340-300?", "opts": ["2J", "3J", "4J", "J4"], "ans": 2, "why": "Airbus 340-300: 340 / 343 / 4J, igual que el 340-500 y el 340-600.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 343, "stem": "Según el glosario, aeronave es toda máquina que puede sustentarse en la atmósfera por reacciones del aire:", "opts": ["Que no sean las reacciones del mismo contra la superficie de la tierra", "Incluidas las reacciones del aire contra la superficie de la tierra", "Generadas solo por alas fijas o rotores", "Producidas por uno o más motores"], "ans": 0, "why": "Definición literal del glosario.", "src": "Manual 2 (nov. 2026), Glosario, p. 48", "note": ""}, {"n": 344, "stem": "¿Cómo define el glosario la aeronave militar?", "opts": ["La inscrita en un registro de aeronaves militares", "La que tiene como misión la defensa nacional o está mandada por un militar comisionado al efecto", "La que pertenece al Ministerio de Defensa de un Estado", "La que solo vuela en espacio aéreo reservado"], "ans": 1, "why": "Definición literal del glosario.", "src": "Manual 2 (nov. 2026), Glosario, p. 48", "note": ""}, {"n": 345, "stem": "Según el glosario, ¿cuál NO está incluida en la expresión «dependencia de servicios de tránsito aéreo»?", "opts": ["Una dependencia de control de tránsito aéreo", "Un centro de información de vuelo", "Una oficina de notificación de los servicios de tránsito aéreo", "Una oficina meteorológica de aeródromo"], "ans": 3, "why": "La expresión abarca dependencia de control, centro de información de vuelo, dependencia de información de vuelo de aeródromo y oficina de notificación ATS.", "src": "Manual 2 (nov. 2026), Glosario, p. 48", "note": ""}, {"n": 346, "stem": "El glosario define el explotador como:", "opts": ["Persona o entidad que figura como propietaria en el registro de la aeronave", "Piloto al mando, responsable de la operación segura de la aeronave", "Organismo que gestion
