<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Códigos OACI/IATA y aeronaves</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

const Q=[{"n": 1, "stem": "¿Qué servicio se encarga de las comunicaciones entre estaciones terrestres fijas y se presta a través de la AFTN?", "opts": ["El Servicio Fijo Aeronáutico (AFS)", "El Servicio Móvil Aeronáutico (AMS)", "El Servicio de Radionavegación Aeronáutica", "El Servicio de Asesoramiento de Tránsito Aéreo"], "ans": 0, "why": "El AFS enlaza estaciones terrestres fijas y se presta a través de la AFTN; el AMS enlaza estaciones terrestres fijas con estaciones de aeronave.", "src": "Manual 2 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 2, "stem": "¿Qué estructura tiene la AFTN a nivel mundial?", "opts": ["En estrella", "En malla", "En anillo", "Lineal"], "ans": 1, "why": "Cualquier estación o centro de la red tiene comunicación con todas las demás, de forma que los mensajes llegan a todas las estaciones conectadas.", "src": "Manual 2 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 3, "stem": "¿Cuántas letras tiene un indicador de lugar OACI?", "opts": ["Dos", "Tres", "Cinco", "Cuatro"], "ans": 3, "why": "Es un grupo de cuatro letras (los indicadores de lugar IATA tienen tres).", "src": "Manual 2 (nov. 2026), capítulo 2.1, p. 4", "note": ""}, {"n": 4, "stem": "¿Qué documento de la OACI contiene las normas para la formulación de los indicadores de lugar?", "opts": ["Doc 8585", "Doc 7910", "Doc 8643", "Doc 4444"], "ans": 1, "why": "Doc 7910 «Indicadores de lugar»; el 8585 recoge los designadores de empresas explotadoras y el 8643, los tipos de aeronave.", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 5, "stem": "¿Cuál es el período mínimo antes de que un indicador de lugar pueda asignarse de nuevo a otro lugar, una vez anulada su asignación previa?", "opts": ["Un mes", "Tres meses", "Seis meses", "Un año"], "ans": 2, "why": "El manual indica que «no debería volverse a asignar [...] durante un período de seis meses, como mínimo».", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 6, "stem": "¿Cómo deben identificarse los indicadores de los lugares en los que no es posible cursar mensajes por la AFTN?", "opts": ["Con un asterisco (*)", "Con la letra X como cuarta letra", "Con el prefijo ZZ", "No se publican"], "ans": 0, "why": "Los lugares no conectados a la AFTN se marcan con un asterisco.", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 7, "stem": "El distintivo de llamada del ACC de Canarias es «Canarias Control» y su indicador de lugar es GCCC. En las comunicaciones radio:", "opts": ["GCCC sustituye al distintivo de llamada", "GCCC puede utilizarse después del distintivo de llamada", "GCCC solo puede utilizarse en las frecuencias de emergencia", "GCCC no puede utilizarse en lugar del distintivo de llamada"], "ans": 3, "why": "Los indicadores de lugar no deberían utilizarse para identificar las transmisiones de radio en vez de los distintivos de llamada.", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 8, "stem": "¿Qué representa la primera letra de un indicador de lugar OACI?", "opts": ["El Estado", "La FIR", "El área de encaminamiento del AFS", "El tipo de aeródromo"], "ans": 2, "why": "El mundo se divide en áreas de encaminamiento del AFS que no se superponen y se deciden solo según los requisitos del AFS; sus límites no tienen que coincidir con los de un Estado, territorio o FIR.", "src": "Manual 2 (nov. 2026), capítulo 2.3, p. 6", "note": ""}, {"n": 9, "stem": "¿Qué primeras letras corresponden a España?", "opts": ["E para la Península y C para Canarias", "L para la Península y G para Canarias, Ceuta y Melilla", "L para la Península, Ceuta y Melilla y G para Canarias", "G para la Península y L para Canarias"], "ans": 1, "why": "L = Península; G = Canarias, Ceuta y Melilla. E y C son segundas letras.", "src": "Manual 2 (nov. 2026), capítulo 2.3, p. 6", "note": ""}, {"n": 10, "stem": "¿Qué segundas letras corresponden a España?", "opts": ["L para la Península y G para Canarias", "E para Canarias y C para la Península", "E para la Península, Ceuta y Melilla y C para Canarias", "E solo para la Península y C para Ceuta, Melilla y Canarias"], "ans": 2, "why": "Segunda letra E: Península, Ceuta y Melilla; C: Canarias.", "src": "Manual 2 (nov. 2026), capítulo 2.3, p. 7", "note": ""}, {"n": 11, "stem": "En el indicador LEMD, ¿qué identifican las letras tercera y cuarta (MD)?", "opts": ["El Estado", "El lugar en sí mismo", "El área de encaminamiento", "La FIR"], "ans": 1, "why": "La tercera y la cuarta letra corresponden al lugar en sí mismo; el manual pone como ejemplo MD para MADRID/Adolfo Suárez Madrid-Barajas.", "src": "Manual 2 (nov. 2026), capítulo 2.3, p. 7", "note": ""}, {"n": 12, "stem": "¿Cuál es el indicador de lugar del FIC/ACC de Madrid?", "opts": ["LEMD", "LECB", "LECM", "LECS"], "ans": 2, "why": "LECM = Madrid FIC/ACC; LEMD es el aeropuerto; LECB, Barcelona FIC/ACC; LECS, Sevilla FIC/ACC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 13, "stem": "¿Qué dependencia española tiene el indicador LECP?", "opts": ["TACC de Palma", "FIC/ACC de Sevilla", "TACC de Valencia", "TACC de Santiago"], "ans": 0, "why": "Palma TACC LECP; Santiago TACC LECG; Sevilla FIC/ACC LECS; Valencia TACC LECL.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 14, "stem": "¿Qué dependencia tiene el indicador LECL?", "opts": ["TACC de Santiago", "FIC/ACC de Barcelona", "TACC de Palma", "TACC de Valencia"], "ans": 3, "why": "Valencia TACC es LECL; Santiago LECG, Barcelona LECB y Palma LECP.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 15, "stem": "El indicador LFRR corresponde a:", "opts": ["Bordeaux FIC/ACC/UAC", "Brest FIC/ACC/UAC", "Marselle FIC/ACC/UAC", "Lisboa ACC/FIC"], "ans": 1, "why": "Brest LFRR; Bordeaux LFBB; Marselle LFMM; Lisboa LPPC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 16, "stem": "¿Qué centro colateral tiene el indicador GMMM?", "opts": ["Casablanca ACC/FIC", "Dakar ACC/FIC", "Alger ACC", "Tunis ACC/FIC"], "ans": 0, "why": "Casablanca GMMM; Dakar GOOO; Alger DAAA; Tunis DTTC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 17, "stem": "En el manual, ¿qué significa la sigla TACC?", "opts": ["Centro de control de área táctica", "Centro de control de área transoceánica", "Centro de control de área terminal", "Centro de coordinación de tránsito de área"], "ans": 2, "why": "TACC es el centro de control de área terminal (<em>terminal area control centre</em>).", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 18, "stem": "¿Cuál es el indicador de lugar de Barcelona-El Prat?", "opts": ["LEBL", "LEBB", "LEBA", "LEBG"], "ans": 0, "why": "LEBL; LEBB es Bilbao, LEBA Córdoba y LEBG Burgos/Villafría.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 19, "stem": "¿Qué aeródromo tiene el indicador LEXJ?", "opts": ["Santiago", "Vitoria", "Santander", "Salamanca"], "ans": 2, "why": "Santander/Seve Ballesteros-Santander LEXJ; Santiago LEST; Vitoria LEVT; Salamanca LESA.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 20, "stem": "¿Qué aeródromo tiene el indicador LEZL?", "opts": ["Zaragoza", "Sevilla", "Málaga", "Valencia"], "ans": 1, "why": "LEZL es Sevilla; Zaragoza es LEZG, Málaga LEMG y Valencia LEVC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 21, "stem": "¿Qué aeródromo tiene el indicador GCXO?", "opts": ["Tenerife Sur", "Gran Canaria", "Lanzarote", "Tenerife Norte/Ciudad de La Laguna"], "ans": 3, "why": "GCXO Tenerife Norte; GCTS Tenerife Sur; GCLP Gran Canaria; GCRR Lanzarote.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 22, "stem": "¿Qué indicador tiene el aeródromo de Melilla?", "opts": ["LEML", "GEHM", "GEML", "GCML"], "ans": 2, "why": "GEML es el aeródromo; GEHM es el helipuerto de Melilla.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 23, "stem": "¿Qué indicadores figuran en el manual para Palma de Mallorca?", "opts": ["LEPA/LESJ", "LEPO/LESB", "LEPP/LEPA", "Solo LEPA"], "ans": 0, "why": "El manual recoge dos: LEPA/LESJ. LEPO es Mallorca/Pollensa, LESB Mallorca/Son Bonet y LEPP Pamplona.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 24, "stem": "¿Cuál de estos es un indicador de helipuerto español del manual?", "opts": ["LEMO (Sevilla/Morón)", "LEEC (Sevilla/El Copero)", "LEZL (Sevilla)", "LECS (FIC/ACC de Sevilla)"], "ans": 1, "why": "El Copero es un helipuerto (LEEC); Morón es un aeródromo (LEMO), LEZL el aeropuerto y LECS el FIC/ACC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 25, "stem": "¿Cuál de estos figura entre los «aeródromos en situación excepcional»?", "opts": ["Ceuta", "Melilla", "Gibraltar (LXGB)", "Tenerife Norte/Los Rodeos"], "ans": 2, "why": "La lista es El Aaiún GSAI, Gibraltar LXGB y Villacisneros GSVO. Ceuta (GECE) y Tenerife Norte/Los Rodeos (GCXM) son helipuertos.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 9", "note": ""}, {"n": 26, "stem": "Para identificar una oficina en una dirección AFTN, ¿qué documento proporciona el designador que se añade al indicador de lugar?", "opts": ["Doc 7910", "Doc 8585", "Doc 8643", "Anexo 7"], "ans": 1, "why": "El designador de tres o cuatro letras se toma del Doc 8585, «Designadores de empresas explotadoras de aeronaves, de entidades oficiales y de servicios aeronáuticos».", "src": "Manual 2 (nov. 2026), capítulo 2.5, p. 9", "note": ""}, {"n": 27, "stem": "Un designador de tres letras añadido a un indicador de lugar ocupa:", "opts": ["Las letras 1.ª a 3.ª", "Las letras 2.ª a 4.ª", "Las letras 5.ª, 6.ª y 7.ª, seguidas de X o de una letra de departamento", "Las letras 4.ª a 6.ª, seguidas de dos letras de relleno"], "ans": 2, "why": "Indicador (4) + designador (3) + X de relleno o letra de departamento o división = 8 letras.", "src": "Manual 2 (nov. 2026), capítulo 2.5, p. 9", "note": ""}, {"n": 28, "stem": "¿Cuál es la dirección completa del Director General de Aviación Civil (LEAC, designador YAY)?", "opts": ["LEACYAYX", "LEAC-YAY", "YAYLEACX", "LEACYAY"], "ans": 0, "why": "Indicador de lugar + YAY + letra de relleno X.", "src": "Manual 2 (nov. 2026), capítulo 2.5, p. 10", "note": ""}, {"n": 29, "stem": "En los ejemplos del manual, ¿qué designador identifica una torre de control de aeródromo?", "opts": ["YMY", "YOY", "YNY", "ZTZ"], "ans": 3, "why": "ZTZ = torre de control (LEALZTZX, Alicante); YMY = oficina meteorológica; YOY = oficina del servicio de información aeronáutica de aeródromo; YNY = oficina NOTAM internacional.", "src": "Manual 2 (nov. 2026), capítulo 2.5, p. 10", "note": ""}, {"n": 30, "stem": "En la dirección GCHIYMYX, ¿qué designador identifica la oficina meteorológica?", "opts": ["YMY", "YOY", "ZTZ", "YUY"], "ans": 0, "why": "YMY es la oficina meteorológica (ejemplo de El Hierro).", "src": "Manual 2 (nov. 2026), capítulo 2.5, p. 10", "note": ""}, {"n": 31, "stem": "Los designadores telegráficos de las empresas explotadoras de aeronaves son:", "opts": ["Dos caracteres alfanuméricos", "Grupos de tres letras", "Palabras habladas que se usan en radio", "Grupos de cuatro dígitos"], "ans": 1, "why": "Los designadores telegráficos son grupos de tres letras; los telefónicos son los que se usan en las comunicaciones radiotelefónicas.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 32, "stem": "IBERIA 301 es un ejemplo de:", "opts": ["Un designador telegráfico seguido de un número de vuelo", "Un código IATA y un número de vuelo", "Una matrícula", "Un designador telefónico seguido de la identificación del vuelo"], "ans": 3, "why": "El designador telefónico puede formar parte del distintivo de llamada radiotelefónico, seguido de la identificación del vuelo.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 33, "stem": "¿Cuáles son los designadores telegráfico y telefónico de British Airways?", "opts": ["BAW / SPEEDBIRD", "BA / SPEEDBIRD", "BRA / BRITISH", "BAW / AIRFRANS"], "ans": 0, "why": "BAW / SPEEDBIRD (BA es el código IATA).", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 34, "stem": "El designador telefónico de Air France es:", "opts": ["AIRFRANCE", "AMERICAN", "AIRFRANS", "FRANCE"], "ans": 2, "why": "AFR / AIRFRANS.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 35, "stem": "¿Qué pareja de designadores telegráfico y telefónico es correcta?", "opts": ["RYR / VUELING", "VLG / RYANAIR", "AAL / SPEEDBIRD", "VLG / VUELING"], "ans": 3, "why": "Vueling VLG/VUELING; Ryanair RYR/RYANAIR; American AAL/AMERICAN.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 36, "stem": "Las marcas de nacionalidad y las marcas comunes las asigna:", "opts": ["El Estado de matrícula", "La OACI", "La IATA", "El explotador"], "ans": 1, "why": "La OACI asigna ambas; la matrícula la adjudica la autoridad competente de cada país.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 37, "stem": "¿A quién tiene asignada el manual la marca común 4U?", "opts": ["Israel", "Mónaco", "Naciones Unidas", "Argelia"], "ans": 2, "why": "La marca común sustituye a la marca de nacionalidad cuando la aeronave pertenece a un organismo internacional de explotación sobre una base que no sea nacional, como Naciones Unidas (4U). Israel es 4X, Mónaco 3A y Argelia 7T.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 11", "note": ""}, {"n": 38, "stem": "¿Cuándo se coloca un guion entre la marca de nacionalidad y la matrícula?", "opts": ["Siempre", "Cuando la matrícula empieza por una letra", "Cuando la marca tiene dos caracteres", "Cuando la aeronave es civil"], "ans": 1, "why": "El manual indica que, cuando el primer carácter de la marca de matrícula sea una letra, irá precedida de un guion.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 39, "stem": "Cuando la marca de matrícula consiste en letras, ¿qué combinaciones no deben usarse?", "opts": ["Las que repitan tres veces una misma letra", "Las que empiecen por la letra de la nacionalidad", "Las que puedan confundirse con SOS, XXX, PAN o TTT", "Las que contengan una vocal en segunda posición"], "ans": 2, "why": "No deben usarse combinaciones confundibles con los grupos de cinco letras de la segunda parte del Código Internacional de Señales, con la señal de auxilio SOS ni con señales de urgencia como XXX, PAN y TTT.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 40, "stem": "La normativa de la OACI sobre las marcas de nacionalidad y de matrícula está en:", "opts": ["El Anexo 1", "El Anexo 6", "El Anexo 7", "El Anexo 8"], "ans": 2, "why": "Anexo 7 al Convenio sobre Aviación Civil Internacional.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 41, "stem": "¿Qué marca de nacionalidad corresponde a Argelia?", "opts": ["7T", "TS", "CN", "4X"], "ans": 0, "why": "Argelia 7T; Túnez TS; Marruecos CN; Israel 4X.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 42, "stem": "¿Qué país tiene la marca de nacionalidad OY?", "opts": ["Austria", "Bélgica", "Finlandia", "Dinamarca"], "ans": 3, "why": "OY Dinamarca; OE Austria; OO Bélgica; OH Finlandia.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 43, "stem": "¿Qué marca de nacionalidad tiene Gibraltar en el manual?", "opts": ["G", "VP-G", "GI", "EC"], "ans": 1, "why": "VP-G; G es el Reino Unido y EC España.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 44, "stem": "¿Qué marcas de nacionalidad tiene Portugal en la tabla del manual?", "opts": ["CR y CS", "Solo CS", "P y PT", "CP"], "ans": 0, "why": "La tabla imprime «CR,CS».", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 45, "stem": "¿Qué país tiene la marca de nacionalidad A6?", "opts": ["Argentina", "Argelia", "Austria", "Emiratos Árabes Unidos"], "ans": 3, "why": "Emiratos Árabes Unidos A6; Argelia 7T; Austria OE.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 46, "stem": "¿Qué marca corresponde a Luxemburgo?", "opts": ["LN", "LX", "LU", "LM"], "ans": 1, "why": "Luxemburgo LX; LN es Noruega.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 47, "stem": "¿Qué marca corresponde a la República Checa?", "opts": ["CZ", "OE", "OK", "HA"], "ans": 2, "why": "República Checa OK; OE Austria; HA Hungría.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 48, "stem": "¿Qué marca corresponde a Mónaco?", "opts": ["3A", "MC", "4X", "M"], "ans": 0, "why": "Mónaco 3A; 4X es Israel.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 13", "note": ""}, {"n": 49, "stem": "¿Cuántas letras tiene un indicador de lugar IATA?", "opts": ["Dos", "Tres", "Cuatro", "Variable"], "ans": 1, "why": "Los indicadores de lugar IATA están formados por tres letras.", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 14", "note": ""}, {"n": 50, "stem": "Los designadores de aerolíneas IATA constan de:", "opts": ["Tres letras", "Cuatro dígitos", "Solo una letra y un dígito", "Dos caracteres alfanuméricos"], "ans": 3, "why": "Dos caracteres alfanuméricos; un asterisco señala un código duplicado.", "src": "Manual 2 (nov. 2026), capítulo 5.3, p. 15", "note": ""}, {"n": 51, "stem": "Un asterisco después de un designador de aerolínea IATA indica que:", "opts": ["La aerolínea ha cesado sus operaciones", "El mismo código lo usan dos transportistas", "Es una compañía de carga", "Es un operador no regular"], "ans": 1, "why": "Los códigos duplicados se señalan con un asterisco después del designador.", "src": "Manual 2 (nov. 2026), capítulo 5.3, p. 15", "note": ""}, {"n": 52, "stem": "¿Qué documento de la IATA recoge los designadores de aerolíneas?", "opts": ["SSIM", "Doc 8585", "Airline Coding Directory (ACD)", "Anexo 7"], "ans": 2, "why": "El ACD, que la IATA edita y actualiza periódicamente; el Apéndice A del SSIM recoge los códigos de tipo de aeronave y el Doc 8585 es de la OACI.", "src": "Manual 2 (nov. 2026), capítulo 5.3, p. 16", "note": ""}, {"n": 53, "stem": "Según el manual, ¿cuál es el designador OACI de Emirates?", "opts": ["EMR", "EK", "EMI", "UAE"], "ans": 3, "why": "Emirates: código IATA EK, designador OACI UAE.", "src": "Manual 2 (nov. 2026), capítulo 5.3, p. 15", "note": ""}, {"n": 54, "stem": "¿Qué aerolínea tiene el código IATA KU y el designador OACI KAC?", "opts": ["Kuwait Airways", "Kenya Airways", "KLM", "Korean Air"], "ans": 0, "why": "Kuwait Airways KU/KAC.", "src": "Manual 2 (nov. 2026), capítulo 5.3, p. 16", "note": ""}, {"n": 55, "stem": "¿Cuál es el código IATA del aeropuerto de Sevilla?", "opts": ["SEV", "LEZ", "SVQ", "SVL"], "ans": 2, "why": "SVQ (indicador OACI LEZL).", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 14", "note": ""}, {"n": 56, "stem": "¿Cuál es el código IATA de Gran Canaria?", "opts": ["GCA", "LPA", "GRC", "GCL"], "ans": 1, "why": "LPA (indicador OACI GCLP).", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 15", "note": ""}, {"n": 57, "stem": "¿Qué aeropuerto tiene el código IATA TFN?", "opts": ["Tenerife Norte/Ciudad de La Laguna", "Tenerife Sur", "La Gomera", "La Palma"], "ans": 0, "why": "TFN Tenerife Norte; TFS Tenerife Sur; GMZ La Gomera; SPC La Palma.", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 14", "note": ""}, {"n": 58, "stem": "¿Qué aeropuerto tiene el código IATA XRY?", "opts": ["Reus", "Jerez", "Ibiza", "Almería"], "ans": 1, "why": "XRY Jerez; REU Reus; IBZ Ibiza; LEI Almería.", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 14", "note": ""}, {"n": 59, "stem": "¿Qué código IATA corresponde a Almería?", "opts": ["LEA", "ALM", "AME", "LEI"], "ans": 3, "why": "LEI Almería (no guarda relación con el nombre).", "src": "Manual 2 (nov. 2026), capítulo 5.2, p. 14", "note": ""}, {"n": 60, "stem": "¿Qué permite el alerón?", "opts": ["El cabeceo", "La guiñada", "El alabeo", "El frenado"], "ans": 2, "why": "Cuando el alerón de un ala sube, el de la otra baja, y las alas oscilan: es el alabeo.", "src": "Manual 2 (nov. 2026), capítulo 6.1, p. 16", "note": ""}, {"n": 61, "stem": "El estabilizador vertical o deriva controla:", "opts": ["La guiñada", "El cabeceo", "El alabeo", "La sustentación"], "ans": 0, "why": "Controla el deslizamiento lateral sobre el eje vertical o guiñada; el timón vertical o de dirección es parte del estabilizador vertical.", "src": "Manual 2 (nov. 2026), capítulo 6.1, p. 16-17", "note": ""}, {"n": 62, "stem": "Al tirar de la palanca de mando hacia atrás:", "opts": ["Baja el morro", "Sube el morro", "La aeronave vira a la derecha", "Se deflectan los alerones"], "ans": 1, "why": "El timón horizontal o de profundidad eleva el morro cuando se tira de la palanca hacia atrás (hacia el piloto) y lo baja al empujarla hacia adelante.", "src": "Manual 2 (nov. 2026), capítulo 6.1, p. 16", "note": ""}, {"n": 63, "stem": "¿Cuál de estas NO figura entre las cinco condiciones de vuelo que el manual cita para la sustentación del ala?", "opts": ["Despegue", "Crucero", "Rodaje", "Aterrizaje"], "ans": 2, "why": "Las cinco son despegue, subida, crucero, descenso y aterrizaje.", "src": "Manual 2 (nov. 2026), capítulo 6.1, p. 16", "note": ""}, {"n": 64, "stem": "¿Cuál NO es uno de los tipos de cola del apartado 6.2.3?", "opts": ["Cola en T", "Cola en cruz", "Cola doble", "Cola en V"], "ans": 3, "why": "El manual enumera cola en T, en cruz, fuselada y doble.", "src": "Manual 2 (nov. 2026), capítulo 6.2.3, p. 19", "note": ""}, {"n": 65, "stem": "«Flecha progresiva o invertida» se refiere a:", "opts": ["Alas con flecha hacia atrás", "Alas rectas", "Alas en delta", "Alas con flecha hacia delante"], "ans": 3, "why": "Tipos de flecha: regresiva o positiva (hacia atrás), recta, y progresiva o invertida (hacia delante).", "src": "Manual 2 (nov. 2026), capítulo 6.2.2, p. 19", "note": ""}, {"n": 66, "stem": "¿Qué dato NO ofrece el catálogo de reconocimiento para cada aeronave?", "opts": ["El alcance máximo", "La envergadura", "La estela según RECAT-EU", "La masa máxima de despegue en kg"], "ans": 3, "why": "Cada ficha da fabricante, denominación, designador OACI, tipo, velocidad de crucero (TAS), régimen máximo de ascenso inicial, techo, alcance máximo, WTC, estela según RECAT-EU y envergadura, pero no la masa.", "src": "Manual 2 (nov. 2026), capítulo 6.4, p. 25", "note": ""}, {"n": 67, "stem": "Según el catálogo, ¿qué aeronave es WTC J?", "opts": ["A124", "B744", "A388", "B748"], "ans": 2, "why": "Solo el A388 es J (y Super heavy en RECAT-EU); A124, B744 y B748 son H. El A124 figura como Super heavy en RECAT-EU, pero su WTC es H.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 29-31", "note": ""}, {"n": 68, "stem": "Según el catálogo de reconocimiento, ¿qué aeronave tiene la descripción L3J?", "opts": ["A400", "B752", "A124", "F900"], "ans": 3, "why": "Los Dassault Falcon FA8X y F900 son los únicos trimotores (L3J) del catálogo; el A400 es L4T, el B752 L2J y el A124 L4J.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35", "note": ""}, {"n": 69, "stem": "¿Qué aeronave del catálogo tiene la descripción L2T?", "opts": ["AT76 (ATR 72-600)", "CRJX (CRJ-1000)", "E295 (E195-E2)", "A400 (A400M Grizzly)"], "ans": 0, "why": "El AT76 es L2T, como el C295 Persuader; el CRJX y el E295 son L2J, y el A400 es L4T.", "src": "Manual 2 (nov. 2026), capítulos 6.4.3 y 6.4.7, p. 33-34 y 40", "note": ""}, {"n": 70, "stem": "El techo del B744 en el catálogo es:", "opts": ["FL410", "FL450", "FL390", "FL510"], "ans": 1, "why": "B744 FL450, el más alto de los aviones de línea del catálogo (B738 FL410, A124 FL390, GL7T FL510).", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 30", "note": ""}, {"n": 71, "stem": "¿Qué aeronave del catálogo es Ligera (L) aunque tiene motores a reacción?", "opts": ["C700 (Citation Longitude)", "GLF4 (Gulfstream G400)", "CL35 (Challenger 3500)", "C25M (Citation M2)"], "ans": 3, "why": "El Cessna Citation M2 (C25M) es L2J con WTC L y RECAT-EU Light; los demás ejecutivos del catálogo son M y Lower medium.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35-36", "note": ""}, {"n": 72, "stem": "¿Qué aeronave tiene un régimen máximo de ascenso de 3000 ft/min en el catálogo?", "opts": ["A320", "A321", "B738", "AT76"], "ans": 2, "why": "B738 3000 ft/min; A320 y A321 2500; AT76 1350.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.3, p. 27, 29 y 33", "note": ""}, {"n": 73, "stem": "¿Cuántos caracteres tiene un designador de tipo de aeronave OACI (Doc 8643)?", "opts": ["Exactamente tres", "De dos a cuatro caracteres alfanuméricos", "Cuatro letras", "Tres letras y un dígito"], "ans": 1, "why": "Es un código de 2 a 4 caracteres alfanuméricos.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 74, "stem": "¿Qué masa máxima certificada de despegue define a una aeronave Pesada (H) en la clasificación WTC de la OACI del manual?", "opts": ["136 000 kg o más", "Más de 7000 kg", "Menos de 136 000 kg", "560 000 kg o más"], "ans": 0, "why": "H es de 136 000 kg o más; J es exclusivo del A380-800 (560 000 kg).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 75, "stem": "Una aeronave de 7000 kg de MTOW es, según el manual:", "opts": ["Media", "Ligera", "Pesada", "Súper"], "ans": 1, "why": "L es de 7000 kg o menos; Media es de menos de 136 000 kg y más de 7000 kg.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 76, "stem": "A efectos de estela turbulenta, el B757 se considera:", "opts": ["Siempre Pesada", "Siempre Media", "Pesada cuando va seguida de otra aeronave y Media cuando sigue a otra aeronave", "Media cuando va seguida de otra aeronave y Pesada cuando sigue a otra aeronave"], "ans": 2, "why": "Nota (*) bajo la tabla WTC: PESADAS, cuando vayan seguidas de otra aeronave, y MEDIAS, cuando sigan a otra aeronave.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 44", "note": ""}, {"n": 77, "stem": "Las categorías RECAT-EU se basan en:", "opts": ["Solo la MTOW", "Solo la envergadura", "La velocidad de aproximación", "La MTOW y la envergadura"], "ans": 3, "why": "Seis categorías basadas tanto en el peso máximo certificado al despegue como en la envergadura.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 78, "stem": "Las categorías RECAT-EU se designan oficialmente:", "opts": ["CAT-A a CAT-F", "CAT-1 a CAT-6", "A a G", "J, H, M, L"], "ans": 0, "why": "Oficialmente CAT-A a CAT-F; a los controladores se designan y se muestran como J, H+, H-, M+, M- y L+.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 79, "stem": "Tras la implantación de RECAT-EU, la casilla 9 del plan de vuelo se rellena con:", "opts": ["CAT-A a CAT-F", "J, H+, H-, M+, M-, L+", "La WTC de la OACI: J, H, M o L", "La categoría RECAT-EU elegida por el piloto"], "ans": 2, "why": "RECAT-EU no cambia la forma de rellenar el plan de vuelo; los operadores siguen poniendo la WTC de la OACI.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 80, "stem": "En la tabla «Categorías RECAT-EU relevantes» del manual, ¿qué aeronave figura como SUPER HEAVY?", "opts": ["A388", "B744", "A350", "B777"], "ans": 0, "why": "En esa tabla solo el A388 está en SUPER HEAVY; A350, B747 y B777 están en UPPER HEAVY.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 81, "stem": "¿Qué tipos son Pesada inferior (LOWER HEAVY) en la tabla RECAT-EU del manual?", "opts": ["A330, B777, B787", "B737, todas las series", "A310, B757, B767", "AT72, CRJ, E190"], "ans": 2, "why": "LOWER HEAVY: A310, B757, B767; en UPPER HEAVY están A330, A340, A350, B747, B777 y B787.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 45", "note": ""}, {"n": 82, "stem": "En la descripción de tipo de aeronave L2J, el primer carácter L significa:", "opts": ["Ligera", "Avión terrestre", "Largo alcance", "Ala baja"], "ans": 1, "why": "L = <em>Landplane</em> (avión terrestre).", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 83, "stem": "En la descripción del manual, el segundo carácter C significa:", "opts": ["Dos motores acoplados que accionan un solo sistema de hélice, solo en ala fija", "Aeronave de carga, sea de ala fija o helicóptero", "Motor con compresor axial, en cualquier tipo de aeronave", "Aeronave certificada para operaciones de categoría III"], "ans": 0, "why": "La C se aplica únicamente a aeronaves de alas fijas e indica que dos motores están acoplados para accionar un solo sistema de hélice.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 84, "stem": "¿Qué valores puede tomar el segundo carácter de la descripción?", "opts": ["De 1 a 9", "Solo 1, 2, 4 y 6", "1, 2, 3, 4, 6, 8 o C", "1, 2, 3, 4, 5, 6 o C"], "ans": 2, "why": "1, 2, 3, 4, 6, 8 o C (número de motores); no aparecen los cinco ni los siete motores.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 85, "stem": "En el manual 2, ¿qué letra identifica un motor eléctrico en el tercer carácter?", "opts": ["L", "E", "J", "P"], "ans": 1, "why": "P motor de pistón, T turbohélice/turboeje, J motor a reacción, E motor eléctrico.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 86, "stem": "En el ejemplo del manual A339 (Airbus A-330-900), con WTC H y descripción L2J, ¿qué significa la descripción?", "opts": ["Ligera, 2 motores, motor a reacción", "Avión terrestre, 2 motores, turbohélice", "Avión terrestre, 1 motor, motor a reacción", "Avión terrestre, 2 motores, motor a reacción"], "ans": 3, "why": "L = <em>Landplane</em>; 2 = número de motores; J = motor a reacción. La H es la categoría de estela turbulenta: pesada.", "src": "Manual 2 (nov. 2026), capítulo 7.1, p. 46", "note": ""}, {"n": 87, "stem": "En el designador ATA/IATA, el designador general es:", "opts": ["Un código de dos letras del operador", "Un código de tres caracteres por familia de aviones", "El número de motores", "La categoría H, J, P, S o T"], "ans": 1, "why": "El subtipo es otro código de tres caracteres; la categoría es H/J/P/S/T, con el número de motores delante en J, P y T.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 46", "note": ""}, {"n": 88, "stem": "Para el Embraer 190, los datos ATA/IATA son:", "opts": ["Designador general E90, subtipo EMJ, categoría 2J", "Designador general EMJ, subtipo E90, categoría 2J", "Designador general EMJ, subtipo E90, categoría 4J", "Designador general 190, subtipo E90, categoría J"], "ans": 1, "why": "EMJ / E90 / 2J.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 89, "stem": "Para el Airbus A340-600, el subtipo ATA/IATA es:", "opts": ["340", "343", "345", "346"], "ans": 3, "why": "340-300 = 343, 340-500 = 345, 340-600 = 346; el designador general es 340.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 90, "stem": "¿Dónde se recogen los códigos IATA de tipo de aeronave?", "opts": ["En el Airline Coding Directory", "En el Apéndice A del SSIM", "En el Doc 8643 de la OACI", "En el Anexo 7"], "ans": 1, "why": "Apéndice A del «Standard Schedules Information Manual (SSIM)», que la IATA edita y actualiza periódicamente.", "src": "Manual 2 (nov. 2026), capítulo 7.2, p. 47", "note": ""}, {"n": 91, "stem": "La altitud, en el glosario del manual, es la distancia vertical entre un nivel o punto y:", "opts": ["El terreno subyacente", "Una referencia especificada", "El plano de referencia de 1013,2 hPa", "El nivel medio del mar (MSL)"], "ans": 3, "why": "La altura se mide desde una referencia especificada; la altitud, desde el MSL.", "src": "Manual 2 (nov. 2026), Glosario, p. 48", "note": ""}, {"n": 92, "stem": "El manual define la estela turbulenta como:", "opts": ["Masa de aire en movimiento espiral y descendente, que se genera en el extremo de los planos", "Masa de aire ascendente que se genera detrás de los motores de una aeronave en vuelo", "Turbulencia en aire claro que aparece a gran altitud cerca de las corrientes en chorro", "Masa de aire expulsada por los motores durante el despegue y el rodaje"], "ans": 0, "why": "Glosario: «masa de aire en movimiento espiral y descendente, que se genera en el extremo de los planos de una aeronave en vuelo».", "src": "Manual 2 (nov. 2026), Glosario, p. 48", "note": ""}, {"n": 93, "stem": "En el vocabulario inglés-español del manual, «empennage» se traduce como:", "opts": ["Timón de dirección", "Empenaje, cola", "Estabilizador horizontal", "Fuselaje"], "ans": 1, "why": "Empenaje, cola; <em>rudder</em> es timón de dirección.", "src": "Manual 2 (nov. 2026), Vocabulario específico inglés-español, p. 51", "note": ""}, {"n": 94, "stem": "¿Qué término español corresponde a «airspeed indicator» en el manual?", "opts": ["Altímetro", "Brújula", "Tacómetro", "Anemómetro"], "ans": 3, "why": "El manual traduce <em>airspeed indicator</em> como anemómetro; <em>altimeter</em> es altímetro y <em>compass</em>, brújula.", "src": "Manual 2 (nov. 2026), Vocabulario específico inglés-español, p. 51", "note": ""}, {"n": 95, "stem": "¿Qué término inglés corresponde a «bodega» en el vocabulario español-inglés del manual?", "opts": ["Hold", "Cabin", "Rear door", "Main tank"], "ans": 0, "why": "Bodega = <em>hold</em>; cabina de pasaje = <em>cabin</em>; puerta trasera = <em>rear door</em>; depósito principal = <em>main tank</em>.", "src": "Manual 2 (nov. 2026), Vocabulario específico español-inglés, p. 53", "note": ""}, {"n": 96, "stem": "El Servicio Móvil Aeronáutico (AMS) se encarga de las comunicaciones entre:", "opts": ["Estaciones terrestres fijas y estaciones de aeronave", "Estaciones terrestres fijas entre sí, a través de la AFTN", "Aeronaves en vuelo entre sí, sin estación en tierra", "Centros de control de Estados distintos, por línea telegráfica"], "ans": 0, "why": "El AMS enlaza estaciones terrestres fijas y estaciones de aeronave; las comunicaciones entre estaciones terrestres fijas son del AFS, que se presta a través de la AFTN.", "src": "Manual 2 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 97, "stem": "Según el manual, ¿qué ha sustituido a las líneas telegráficas por las que se cursaba al principio la AFTN?", "opts": ["Enlaces de datos por satélite, como ADS-C o CPDLC", "Circuitos radiotelefónicos en VHF y HF", "Redes telefónicas de voz entre los centros de control", "Redes de comunicaciones de datos, como REDAN o CIDIN"], "ans": 3, "why": "Las líneas telegráficas (teletipos, ya en desuso) se han sustituido por redes de comunicaciones de datos como REDAN o CIDIN, porque los terminales actuales son ordenadores personales.", "src": "Manual 2 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 98, "stem": "¿Qué ejemplo da el manual de indicadores de lugar que no están conectados a la red?", "opts": ["Los helipuertos de los hospitales", "Los centros de control oceánicos", "Los aeródromos privados", "Los aeródromos militares"], "ans": 2, "why": "El indicador de lugar identifica localizaciones por lo general conectadas al AFS (aeródromos y helipuertos civiles, centros de control), pero hay indicadores no conectados a la red, como los de los aeródromos privados.", "src": "Manual 2 (nov. 2026), capítulo 2.1, p. 4-5", "note": ""}, {"n": 99, "stem": "¿Quién asigna los indicadores de lugar OACI?", "opts": ["La OACI, que los publica en el Doc 7910", "Los Estados pertinentes, bajo supervisión de la OACI", "La IATA, en cooperación con la OACI y la FAA", "EUROCONTROL, para todos los Estados europeos"], "ans": 1, "why": "Los códigos los asignan los Estados pertinentes; la OACI supervisa que su formulación se realice conforme al Doc 7910 «Indicadores de lugar».", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 100, "stem": "Los cambios de asignación de indicadores de lugar deberían promulgarse:", "opts": ["Por circular AIC, con seis meses de antelación", "Solo en la siguiente edición del Doc 7910", "Por mensaje AFTN a todas las estaciones conectadas", "Por NOTAM o AIP, con la mayor antelación posible"], "ans": 3, "why": "Literal del manual: «por medio de NOTAM o AIP con la mayor antelación posible a la fecha de efectividad».", "src": "Manual 2 (nov. 2026), capítulo 2.2, p. 5", "note": ""}, {"n": 101, "stem": "¿De qué documento procede el índice de letras de las áreas de encaminamiento del AFS que reproduce el manual?", "opts": ["Doc 7910 de la OACI, 193.ª edición (septiembre de 2024)", "Doc 8585 de la OACI, 210.ª edición (octubre de 2024)", "Doc 8643 de la OACI, edición de 2024", "Anexo 10 de la OACI, volumen II"], "ans": 0, "why": "El pie del gráfico dice «Fuente: Indicadores de Lugar (Doc. 7910/ OACI; 193ª Ed: Montreal, Sep. 2024)». La 210.ª edición de octubre de 2024 es la del Doc 8585.", "src": "Manual 2 (nov. 2026), capítulo 2.3, p. 6", "note": ""}, {"n": 102, "stem": "En la tabla de centros colaterales del manual, ¿qué primera letra comparten los indicadores de Alger ACC y Tunis ACC/FIC?", "opts": ["L", "G", "D", "T"], "ans": 2, "why": "Alger ACC es DAAA y Tunis ACC/FIC, DTTC. Casablanca (GMMM) y Dakar (GOOO) empiezan por G.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 103, "stem": "¿Qué indicador corresponde a Santa María OAC/FIC?", "opts": ["LPPC", "LPPO", "GVSC", "LPPT"], "ans": 1, "why": "Santa María OAC/FIC LPPO; Lisboa ACC/FIC LPPC; SAL FIR/UIR GVSC.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 104, "stem": "¿A qué centro colateral corresponde el indicador GVSC?", "opts": ["Dakar ACC/FIC", "Santa María OAC/FIC", "Casablanca ACC/FIC", "SAL FIR/UIR"], "ans": 3, "why": "SAL FIR/UIR GVSC; Dakar GOOO; Santa María LPPO; Casablanca GMMM.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 105, "stem": "¿Qué indicador corresponde a Roma ACC en la tabla de centros colaterales?", "opts": ["LIRR", "LIMM", "LIBB", "LIRF"], "ans": 0, "why": "Roma ACC LIRR; Milano ACC LIMM; Brindisi FIC LIBB.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 106, "stem": "¿Cuál NO es una de las categorías en que el manual agrupa los indicadores de lugar de mayor uso en España?", "opts": ["Helipuertos", "FIC y ACC colaterales", "Aeródromos en situación excepcional", "Aeródromos militares"], "ans": 3, "why": "Las categorías son aeródromos, helipuertos, FIC y ACC, aeródromos en situación excepcional y FIC y ACC colaterales.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7", "note": ""}, {"n": 107, "stem": "¿Qué indicador tiene el TACC de Santiago?", "opts": ["LEST", "LECS", "LECG", "LECO"], "ans": 2, "why": "Santiago TACC LECG; LEST es el aeródromo de Santiago/Rosalía de Castro, LECS el FIC/ACC de Sevilla y LECO A Coruña.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 7-8", "note": ""}, {"n": 108, "stem": "En las siglas del apartado 2.4, ¿qué es un UAC?", "opts": ["Centro de control de área superior", "Centro de control de área oceánica", "Centro de información de vuelo", "Centro de control de aproximación unificado"], "ans": 0, "why": "UAC = centro de control de área superior; OAC = centro de control de área oceánica; FIC = centro de información de vuelo.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 109, "stem": "¿Qué indicadores figuran en el manual para MADRID/Cuatro Vientos?", "opts": ["LEGT/LEVS", "LECU/LEVS", "LECU/LECV", "LETO/LEGT"], "ans": 1, "why": "El manual da dos indicadores para Cuatro Vientos: LECU/LEVS. Getafe es LEGT; Torrejón, LETO; LECV es el helipuerto de Madrid/Colmenar Viejo.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 110, "stem": "¿Qué indicador tiene MADRID/Torrejón?", "opts": ["LEGT", "LETL", "LETO", "LETA"], "ans": 2, "why": "Torrejón LETO; Getafe LEGT; Teruel LETL; LETA es el helipuerto del Circuit de Catalunya.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 111, "stem": "¿Qué indicador corresponde a MURCIA/Aeropuerto de la Región de Murcia?", "opts": ["LELC", "LERI", "LEMU", "LEMI"], "ans": 3, "why": "Región de Murcia LEMI; San Javier LELC; Alcantarilla LERI.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 112, "stem": "¿Qué aeródromo tiene el indicador LERT?", "opts": ["Reus", "Cádiz/Rota", "Ciudad Real", "Logroño"], "ans": 1, "why": "Cádiz/Rota LERT; Reus LERS; Ciudad Real LERL; Logroño LERJ.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 113, "stem": "¿Qué indicador tiene GRANADA/Federico García Lorca. Granada-Jaén?", "opts": ["LEGR", "LEGA", "LEGE", "LEJR"], "ans": 0, "why": "Granada-Jaén LEGR; GRANADA/Armilla LEGA; Girona LEGE; Jerez LEJR.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 114, "stem": "¿Qué indicador tiene Sabadell?", "opts": ["LESB", "LESA", "LELL", "LESU"], "ans": 2, "why": "Sabadell LELL; Mallorca/Son Bonet LESB; Salamanca/Matacán LESA; Andorra-La Seu d'Urgell LESU.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 115, "stem": "¿Qué aeródromo tiene el indicador LECH?", "opts": ["Castellón", "A Coruña", "Córdoba", "Ciudad Real"], "ans": 0, "why": "Castellón LECH; A Coruña LECO; Córdoba LEBA; Ciudad Real LERL.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8", "note": ""}, {"n": 116, "stem": "¿Qué indicador corresponde a La Palma?", "opts": ["GCLP", "GCGM", "GCRR", "GCLA"], "ans": 3, "why": "La Palma GCLA; Gran Canaria GCLP; La Gomera GCGM; Lanzarote/César Manrique GCRR.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 117, "stem": "¿Qué indicador tiene Fuerteventura?", "opts": ["GCFU", "GCFV", "GCHI", "GCTS"], "ans": 1, "why": "Fuerteventura GCFV; El Hierro GCHI; Tenerife Sur GCTS.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 8-9", "note": ""}, {"n": 118, "stem": "¿Qué aeródromo tiene el indicador LEDA?", "opts": ["León", "Logroño", "Lleida/Alguaire", "Valladolid/Villanubla"], "ans": 2, "why": "Lleida/Alguaire LEDA; León LELN; Logroño LERJ; Valladolid/Villanubla LEVD.", "src": "Manual 2 (nov. 2026), capítulo 2.4, p. 9", "note": ""}, {"n": 119, "stem": "¿Qué indicador corresponde a VALLADOLID/Villanubla?", "opts": 26), capítulo 2.5, p. 10", "note": ""}, {"n": 130, "stem": "Además de a las compañías aéreas, ¿a quién identifican los designadores telegráficos?", "opts": ["Solo a las compañías aéreas que realizan vuelos regulares", "A los aeródromos y helipuertos civiles conectados al AFS", "A los tipos de aeronave de cada compañía", "A entidades y servicios gubernamentales"], "ans": 3, "why": "Se utilizan para identificar a las compañías aéreas, entidades y servicios gubernamentales, así como otros suministradores de servicios aeronáuticos.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 131, "stem": "¿Qué relación establece el manual entre los designadores telefónico y telegráfico?", "opts": ["A cada designador telefónico le corresponde un designador telegráfico determinado", "El designador telefónico es el telegráfico pronunciado letra a letra", "Un mismo designador telegráfico puede tener varios telefónicos", "No guardan relación porque los asignan organismos distintos"], "ans": 0, "why": "Literal: «A cada designador telefónico le corresponde un designador telegráfico determinado».", "src": "Manual 2 (nov. 2026), capítulo 3, p. 10", "note": ""}, {"n": 132, "stem": "¿Por qué recomienda el manual acudir a la última edición del Doc 8585?", "opts": ["Porque los designadores se eliminan o reasignan al cambiar las empresas", "Porque el documento cambia cada 28 días con el ciclo AIRAC", "Porque la OACI renumera todos los designadores cada año", "Porque los códigos IATA sustituyen poco a poco a los designadores OACI"], "ans": 0, "why": "Los datos están en continua actualización: los designadores se eliminan o reasignan cuando desaparecen antiguas empresas o surgen nuevas.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 10-11", "note": ""}, {"n": 133, "stem": "Según el manual, los designadores OACI de las empresas explotadoras y los códigos IATA:", "opts": ["Coinciden siempre", "Coinciden solo en las aerolíneas europeas", "No coinciden; los IATA se usan para la gestión comercial y las relaciones con los clientes", "No coinciden; los IATA se usan en las comunicaciones radiotelefónicas"], "ans": 2, "why": "«Los designadores OACI para empresas explotadoras no coinciden con los códigos IATA. Éstos últimos los utilizan las compañías aéreas para su gestión comercial y las relaciones con los clientes».", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 134, "stem": "¿Cuáles son los designadores telegráfico y telefónico de Lufthansa en la tabla del manual?", "opts": ["LH / LUFTHANSA", "DLH / HANSA", "LHA / LUFTHANSA", "DLH / LUFTHANSA"], "ans": 3, "why": "LUFTHANSA: designador telegráfico DLH, designador telefónico LUFTHANSA (LH sería un código IATA de dos caracteres).", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 135, "stem": "El designador telefónico de Qatar Airways en el manual es:", "opts": ["QATAR", "QATARI", "QTR", "DOHA"], "ans": 1, "why": "QATAR AIRWAYS: telegráfico QTR, telefónico QATARI.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 136, "stem": "En la tabla del capítulo 3, ¿cuál de estos designadores telefónicos NO coincide con el nombre comercial de la empresa?", "opts": ["LUFTHANSA", "RYANAIR", "VUELING", "QATARI"], "ans": 3, "why": "QATARI (Qatar Airways) no coincide con el nombre comercial, igual que AIRFRANS (Air France) y SPEEDBIRD (British Airways); LUFTHANSA, RYANAIR y VUELING sí coinciden.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 137, "stem": "¿Qué edición del Doc 8585 cita el manual como fuente de la tabla de designadores telegráficos y telefónicos?", "opts": ["193.ª edición, septiembre de 2024", "12.ª edición, marzo de 2023", "210.ª edición, octubre de 2024", "205.ª edición, noviembre de 2026"], "ans": 2, "why": "«Doc. 8585/ OACI; 210 º Ed; Montreal Oct. 2024». La 193.ª edición de septiembre de 2024 es la del Doc 7910.", "src": "Manual 2 (nov. 2026), capítulo 3, p. 11", "note": ""}, {"n": 138, "stem": "La marca de nacionalidad está formada normalmente por:", "opts": ["Uno o dos caracteres", "Tres letras", "Cuatro caracteres", "Dos letras y un número"], "ans": 0, "why": "Normalmente uno o dos caracteres, e indica el Estado en cuyo registro está inscrita la aeronave.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 11", "note": ""}, {"n": 139, "stem": "¿Cómo deben llevarse las marcas de nacionalidad y de matrícula, según el manual?", "opts": ["Pintadas solo en la deriva, en un color que contraste", "Grabadas en una placa ignífuga junto a la puerta principal", "Pintadas o fijadas con una permanencia similar, limpias y visibles en todo momento", "Pintadas en el fuselaje solo en los vuelos internacionales"], "ans": 2, "why": "Se pintarán sobre la aeronave o se fijarán de cualquier otra forma que les dé una permanencia similar, y deberán aparecer limpias y visibles en todo momento.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 140, "stem": "En la figura de ejemplo del manual, OE-FMK, ¿qué es FMK?", "opts": ["La marca común", "La matrícula", "La marca de nacionalidad de Austria", "El designador del explotador"], "ans": 1, "why": "En la figura, OE es la «Marca de nacionalidad de Austria» y FMK la «Matrícula»; el guion aparece porque la matrícula empieza por una letra.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 141, "stem": "¿Quién adjudica la matrícula de una aeronave?", "opts": ["La autoridad competente de cada país", "La OACI", "El fabricante de la aeronave", "La IATA"], "ans": 0, "why": "La matrícula la adjudica la autoridad competente de cada país; las marcas de nacionalidad y las comunes las asigna la OACI.", "src": "Manual 2 (nov. 2026), capítulo 4, p. 12", "note": ""}, {"n": 142, "stem": "¿Qué país de la tabla del manual NO tiene una marca de nacionalidad de una sola letra?", "opts": ["Alemania", "Francia", "Suiza", "Italia"], "ans": 2, "why": "Suiza HB; Alemania D, Francia F e Italia I (también EE.UU. N y Reino Unido G) t , "why": "Entre las características de performance figura el «régimen máximo de ascenso inicial (ft/min)», junto a la TAS de crucero (n.º de Mach - kt), el techo (FL) y el alcance máximo (NM).", "src": "Manual 2 (nov. 2026), capítulo 6.4, p. 25", "note": ""}, {"n": 192, "stem": "Según la nota (*) que abre el catálogo, los datos técnicos mostrados:", "opts": ["Son aproximados y dependen de la fuente consultada y de cada modelo, como la motorización", "Son los certificados por la EASA para cada tipo de aeronave", "Corresponden siempre a la masa máxima de despegue", "Son los publicados por la OACI en el Doc 8643"], "ans": 0, "why": "«Los datos técnicos mostrados son aproximados y dependen de la fuente consultada y de las características propias de cada modelo, como la motorización».", "src": "Manual 2 (nov. 2026), capítulo 6.4, p. 26", "note": ""}, {"n": 193, "stem": "¿En cuántos grupos divide el manual el catálogo de reconocimiento de aeronaves?", "opts": ["Cinco", "Seis", "Siete", "Ocho"], "ans": 2, "why": "6.4.1 pasajeros, 6.4.2 carga, 6.4.3 commuter y regional jet, 6.4.4 executive, 6.4.5 helicópteros, 6.4.6 ligeras de pistón y 6.4.7 militares.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 a 6.4.7, p. 26-43", "note": ""}, {"n": 194, "stem": "¿Cuál de estos NO es uno de los grupos del catálogo de reconocimiento?", "opts": ["Aviones comerciales de carga", "Turbohélices de transporte militar", "Commuter y regional jet para líneas de corto alcance", "Aeronaves ligeras de motor de pistón (RECIPROCATING)"], "ans": 1, "why": "El grupo militar se llama «Aeronaves militares» (6.4.7) e incluye reactores, turbohélices, helicópteros y un avión no tripulado.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 a 6.4.7, p. 26-43", "note": ""}, {"n": 195, "stem": "Según el manual, ¿de qué modelos existen versiones de carga?", "opts": ["Solo de los cuatrimotores", "Solo del B748 y del A124", "De ningún modelo de pasajeros", "De la mayoría de los modelos de Airbus y Boeing"], "ans": 3, "why": "El apartado 6.4.2 empieza: «Existen versiones de carga de la mayoría de los modelos de Airbus y Boeing».", "src": "Manual 2 (nov. 2026), capítulo 6.4.2, p. 31", "note": ""}, {"n": 196, "stem": "¿En qué grupo del catálogo figura el Boeing 757-200 (B752)?", "opts": ["Aviones comerciales de carga", "Aviones comerciales de pasajeros", "Commuter y regional jet para líneas de corto alcance", "Executive. Aviones corporativos y privados"], "ans": 0, "why": "El B752 es la última ficha de 6.4.2, carga (A124, A337, B748 y B752).", "src": "Manual 2 (nov. 2026), capítulo 6.4.2, p. 33", "note": ""}, {"n": 197, "stem": "¿En qué grupo del catálogo figuran el CRJ-1000 (CRJX) y el E195-E2 (E295)?", "opts": ["Executive. Aviones corporativos y privados", "Aviones comerciales de pasajeros", "Commuter y regional jet para líneas de corto alcance", "Aeronaves militares"], "ans": 2, "why": "El grupo 6.4.3 lo forman el ATR 72-600 (AT76), el CRJ-1000 (CRJX) y el E195-E2 (E295).", "src": "Manual 2 (nov. 2026), capítulo 6.4.3, p. 33-34", "note": ""}, {"n": 198, "stem": "¿Qué helicóptero figura en el grupo de aeronaves militares del catálogo?", "opts": ["EC35 (EC-135)", "NH90 (NH-90 Lobo)", "AS65 (AS-365 Dauphin)", "AS55 (AS-355 Ecureuil)"], "ans": 1, "why": "En 6.4.7 están el AS.532 Cougar y el NH-90 Lobo; EC35, AS65 y AS55 forman el grupo 6.4.5, helicópteros.", "src": "Manual 2 (nov. 2026), capítulos 6.4.5 y 6.4.7, p. 37 y 42", "note": ""}, {"n": 199, "stem": "¿Qué aeronave aparece dos veces en el catálogo, en el grupo de pasajeros y en el de carga, con los mismos datos?", "opts": ["A124", "B744", "A337", "B748"], "ans": 3, "why": "El Boeing 747-8 (B748) está en 6.4.1 (junto al B744) y en 6.4.2 (carga), con M0.86 - 510 kt, 2800 ft/min, FL430, 4400 NM, H, Upper heavy y 68,5 m.", "src": "Manual 2 (nov. 2026), capítulos 6.4.1 y 6.4.2, p. 30 y 32", "note": ""}, {"n": 200, "stem": "¿En qué grupo del catálogo figura el Airbus A330 MRTT?", "opts": ["Aeronaves militares", "Aviones comerciales de pasajeros", "Aviones comerciales de carga", "Executive. Aviones corporativos y privados"], "ans": 0, "why": "El A330 MRTT está en 6.4.7, junto al Eurofighter, el A400M y el C295 Persuader.", "src": "Manual 2 (nov. 2026), capítulo 6.4.7, p. 40", "note": ""}, {"n": 201, "stem": "¿Qué designador OACI tiene el Airbus 220-100 en el catálogo?", "opts": ["A221", "BCS1", "CS10", "BCS3"], "ans": 1, "why": "Airbus 220-100 = BCS1; 220-300 = BCS3. Ambos L2J, M0.78 - 445 kt, FL410, M, Upper medium, 35,1 m.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 26", "note": ""}, {"n": 202, "stem": "Según el catálogo, frente al Airbus 220-300 (BCS3), el 220-100 (BCS1) tiene:", "opts": ["Más régimen de ascenso y más alcance", "Menos régimen de ascenso y menos alcance", "Más envergadura y más techo", "Más velocidad de crucero y más techo"], "ans": 0, "why": "BCS1: 3500 ft/min y 3600 NM; BCS3: 3100 ft/min y 3400 NM. Comparten crucero (M0.78 - 445 kt), techo (FL410) y envergadura (35,1 m).", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 26", "note": ""}, {"n": 203, "stem": "¿Qué modelo de la familia A319/A320/A321 (ceo y neo) tiene el mayor régimen máximo de ascenso inicial en el catálogo?", "opts": ["A321neo (A21N)", "A320", "A319", "A320neo (A20N)"], "ans": 2, "why": "A319 3500 ft/min; A19N, A320 y A321 2500; A20N 2200; A21N 2000.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 26-27", "note": ""}, {"n": 204, "stem": "¿Qué designador OACI tiene el Airbus 319 neo?", "opts": ["A319N", "A31N", "A3NE", "A19N"], "ans": 3, "why": "319 neo = A19N, como 320 neo = A20N y 321 neo = A21N.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 26", "note": ""}, {"n": 205, "stem": "Según el catálogo, ¿qué envergadura tienen los A319neo, A320neo y A321neo frente a los A319, A320 y A321?", "opts": ["35,8 m frente a 34,1 m", "34,1 m frente a 35,8 m", "35,9 m frente a 34,3 m", "La misma, 34,1 m"], "ans": 0, "why": "Las tres neo (A19N, A20N, A21N) miden 35,8 m; A319, A320 y A321, 34,1 m. 35,9 m es  y 64,75 m", "FL430 y 64 m", "FL410 y 64,75 m"], "ans": 1, "why": "A359 FL430 y 64,75 m; el A350-1000 (A35K) FL410 y 64 m.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 28", "note": ""}, {"n": 212, "stem": "¿Qué designador OACI tiene el Airbus 350-1000?", "opts": ["A351", "A35X", "A35K", "A310"], "ans": 2, "why": "350-900 = A359; 350-1000 = A35K.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 28", "note": ""}, {"n": 213, "stem": "Según el catálogo, frente al A350-900 (A359), el A350-1000 (A35K):", "opts": ["Asciende más y tiene más techo", "Asciende menos, tiene menos techo y más alcance", "Asciende igual, tiene el mismo techo y menos alcance", "Asciende menos, tiene más techo y menos alcance"], "ans": 1, "why": "A35K 2500 ft/min, FL410, 9000 NM; A359 3000 ft/min, FL430, 8500 NM. Ambos M0.85 - 490 kt, H, Upper heavy.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 28", "note": ""}, {"n": 214, "stem": "¿Qué dato NO corresponde a la ficha del Airbus 380-800 (A388)?", "opts": ["Descripción L4J", "Crucero M0.85 - 520 kt", "Techo FL450", "Envergadura 79,8 m"], "ans": 2, "why": "El techo del A388 es FL430; FL450 es el del B744. Resto de la ficha: 2500 ft/min, 8000 NM, WTC J, RECAT-EU Super heavy.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 29", "note": ""}, {"n": 215, "stem": "¿Qué régimen máximo de ascenso inicial y qué alcance da el catálogo al A388?", "opts": ["1500 ft/min y 8000 NM", "2500 ft/min y 9500 NM", "1000 ft/min y 8900 NM", "2500 ft/min y 8000 NM"], "ans": 3, "why": "A388 2500 ft/min y 8000 NM. 1000 ft/min y 8900 NM son del A124; 9500 NM, del 777X.", "src": "Manual 2 (nov. 2026), capítulo 6.4.1, p. 29", "note": ""}, {"n": 216, "stem": "¿Qué dato corresponde a la ficha del Boeing 737-800 (B738)?", "opts": ["Techo FL390", "Alcance 2000 NM", "Envergadura 35,9 m", "Crucero M0.78 - 450 kt"], "ans": 1, "why": "B738: L2J, M0.79 - 460 kt, 3000 ft/min, FL410, 2000 NM, M, Upper medium, 34,3 m. FL390 es la familia A320 y 35,9 m el 737 MAX.", "src": "M A8X 3500 ft/min, 6400 NM, 26,3 m.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35", "note": ""}, {"n": 245, "stem": "¿Qué datos da el catálogo al Cessna Citation M2 (C25M)?", "opts": ["M0.84 - 480 kt, FL450, 3500 NM", "M0.69 - 400 kt, FL350, 2200 NM", "M0.69 - 400 kt, FL410, 1550 NM", "M0.85 - 450 kt, FL510, 4200 NM"], "ans": 2, "why": "C25M: L2J, M0.69 - 400 kt, 3700 ft/min, FL410, 1550 NM, L, Light, 14,4 m. A es el C700, B el Beluga XL (A337), D el G400.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 36", "note": ""}, {"n": 246, "stem": "¿Qué avión civil del catálogo tiene el mayor régimen máximo de ascenso inicial?", "opts": ["Cessna Citation Longitude (C700)", "Bombardier Challenger 3500 (CL35)", "Gulfstream G700 (GA7C)", "Cessna Citation M2 (C25M)"], "ans": 0, "why": "C700 4900 ft/min; CL35 4500; GA7C y GLF4 4000; C25M 3700. Solo lo superan militares: F5 34000, F18H 30000, HAR 14500.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 35-36", "note": ""}, {"n": 247, "stem": "¿Qué designadores OACI tienen el Gulfstream G400 y el G700 en el catálogo?", "opts": ["GLF4 y GLF7", "G400 y G700", "GLF4 y GA7C", "GA4C y GA7C"], "ans": 2, "why": "G400 = GLF4; G700 = GA7C.", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 36", "note": ""}, {"n": 248, "stem": "¿Qué tienen en común el Gulfstream G400 (GLF4) y el G700 (GA7C) en el catálogo?", "opts": ["El alcance y la envergadura", "El régimen de ascenso, el techo y el número de Mach", "La velocidad en nudos y el alcance", "La envergadura y la velocidad en nudos"], "ans": 1, "why": "Ambos 4000 ft/min, FL510 y M0.85, Lower medium; difieren en nudos (450/480), alcance (4200/7700 NM) y envergadura (26,3/31,4 m).", "src": "Manual 2 (nov. 2026), capítulo 6.4.4, p. 36", "note": ""}, {"n": 249, "stem": "¿Qué datos da el catálogo al helicóptero Airbus EC-135 (EC35)?", "opts": ["H2T, 140 kt, FL150, 430 NM", "H2T, 120 kt, FL120, 400 NM", "H1T, 130 kt, FL170, 430 NM", "H2T, 130 kt, FL170, 430 NM"], "ans": 3, "why": "EC35: H2T
