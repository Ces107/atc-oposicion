:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

 id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Entorno profesional</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: Los planes estratégicos de ENAIRE (Plan de Vuelo 2025, Plan de Vuelo 2030) y el contexto SES/SESAR (T07b)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿En qué fecha aprobó el Consejo Rector de ENAIRE el Plan de Vuelo 2030 (versión 1.0)?", "opts": ["El 19 de diciembre de 2025", "El 24 de noviembre de 2025", "El 19 de marzo de 2026", "El 21 de diciembre de 2023"], "ans": 0, "why": "El Consejo Rector aprobó el PV2030 v1.0 el 19-12-2025; el 24-11-2025 fue cuando el Comité de Dirección acordó presentar la propuesta; el 19-03-2026 es cuando la Orden Ministerial aprobó la v1.1; el 21-12-2023 es la fecha de la actualización del PV2025.", "src": "Plan_Vuelo_2030.txt (§2, cronología de aprobación)", "note": ""}, {"n": 2, "stem": "Por Orden Ministerial, ¿en qué fecha se aprobó el PV2030 (versión 1.1) tras incorporar los comentarios de varios departamentos ministeriales?", "opts": ["El 19 de diciembre de 2025", "El 19 de marzo de 2026", "El 28 de mayo de 2025", "El 24 de noviembre de 2025"], "ans": 1, "why": "La versión 1.1, la estudiada, fue aprobada por Orden del Ministro de Transportes y Movilidad Sostenible el 19-03-2026, tras la aprobación de la v1.0 por el Consejo Rector el 19-12-2025.", "src": "Plan_Vuelo_2030.txt (§2, cronología de aprobación)", "note": ""}, {"n": 3, "stem": "¿Cuál es el código de documento del Plan de Vuelo 2030, versión 1.1?", "opts": ["DGL-15-POL-002-2.0", "RD 517/2024", "G1-25-PLA-001-1.1", "ENS-2018-0006"], "ans": 2, "why": "G1-25-PLA-001-1.1 es el código propio del PV2030. DGL-15-POL-002-2.0 es el código de la Política de Cultura Justa; RD 517/2024 es el Real Decreto de drones; ENS-2018-0006 es el certificado de categoría MEDIA del Esquema Nacional de Seguridad de ENAIRE.", "src": "Plan_Vuelo_2030.txt (portada/cabecera)", "note": ""}, {"n": 4, "stem": "Una vez aprobado, ¿durante cuánto tiempo está vigente el PV2030?", "opts": ["3 años", "4 años", "10 años", "5 años"], "ans": 3, "why": "El PV2030 está vigente 5 años, sin perjuicio del mandato de la Ley 40/2015 de una revisión intermedia a los 3 años (como recibió el PV2025 en diciembre de 2023).", "src": "Plan_Vuelo_2030.txt (§2)", "note": ""}, {"n": 5, "stem": "¿Qué ley española obliga a ENAIRE, como entidad pública empresarial, a tener un plan de actuación estratégico revisado cada tres años, y sustenta tanto el PV2025 como el PV2030?", "opts": ["La Ley 40/2015, de Régimen Jurídico del Sector Público", "La Ley 9/2010", "La Ley 18/2014", "La Ley 39/2015"], "ans": 0, "why": "Los arts. 85.1, 92.2 y 92.3 de la Ley 40/2015 exigen un «plan de actuación» revisado cada tres años; es la base jurídica recurrente de todos los planes estratégicos de ENAIRE, no una ley nueva específica del PV2030.", "src": "Plan_Vuelo_2030.txt (§2); PV2025_Actualizacion_Consejo_21dic23.txt", "note": ""}, {"n": 6, "stem": "¿Cuál de los siguientes NO es uno de los cinco pilares estratégicos que nombra la introducción del PV2030?", "opts": ["Movilidad sostenible", "Rentabilidad", "Digitalización", "Internacionalización"], "ans": 1, "why": "Los cinco pilares que nombra el PV2030 son movilidad sostenible, digitalización, eficiencia, innovación e internacionalización. «Rentabilidad» no es uno de los cinco pilares que nombra la introducción, aunque hay objetivos afines a la rentabilidad en otros puntos (p. ej., el objetivo de Competitividad).", "src": "Plan_Vuelo_2030.txt (introducción)", "note": ""}, {"n": 7, "stem": "¿Qué elemento añade de forma explícita el Objetivo 1 (Seguridad) del PV2030 respecto a la redacción del PV2025/manual?", "opts": ["Escalabilidad", "Digitalización", "La seguridad física frente a los nuevos riesgos emergentes", "Nuevos entrantes"], "ans": 2, "why": "El texto del Objetivo 1 del PV2030 añade «a la seguridad física ante los nuevos riesgos emergentes», con lo que amplía la seguridad más allá de la ciberseguridad y el factor humano para incluir la seguridad física, ausente de la redacción del PV2025/manual.", "src": "Plan_Vuelo_2030.txt (§3, texto completo del Objetivo 1)", "note": ""}, {"n": 8, "stem": "¿A qué colectivo nombra de forma explícita el Objetivo 3 del PV2030 (Movilidad Aérea Sostenible), expresión ausente de la redacción del PV2025?", "opts": ["Grupos de interés", "Startical", "EGS", "Nuevos entrantes"], "ans": 3, "why": "El texto del Objetivo 3 dice «...a través del impulso a la incorporación de nuevos entrantes, la mejora de la eficiencia operativa y la descarbonización...»; «nuevos entrantes» es novedad respecto a la redacción del PV2025.", "src": "Plan_Vuelo_2030.txt (§3, texto completo del Objetivo 3)", "note": ""}, {"n": 9, "stem": "¿Qué impulsor concreto del cambio nombra el Objetivo 6 del PV2030 (Transformación y Modernización), ausente de la redacción del PV2025?", "opts": ["«Nuestras Regiones» como motor del cambio", "La ciberseguridad", "El Consejo Rector", "La Agencia Tributaria"], "ans": 0, "why": "El texto del Objetivo 6 dice de forma explícita «...con nuestras Regiones como motor del cambio...», expresión que no figura en la versión del PV2025 del mismo objetivo.", "src": "Plan_Vuelo_2030.txt (§3, texto completo del Objetivo 6)", "note": ""}, {"n": 10, "stem": "¿Cuál de los 4 bloques del PV2030 contiene el plan estratégico «SM1 — Fly Clean»?", "opts": ["Bloque 1 — Gobernanza y Cumplimiento", "Bloque 4 — Servicios", "Bloque 2 — Liderazgo Transformacional", "Bloque 3 — Internacionalización y Desarrollo Empresarial"], "ans": 1, "why": "SM1 Fly Clean es uno de los cinco planes del área «Sostenibilidad Medioambiental — Green Sky» del Bloque 4 (Servicios), el mayor bloque del PV2030, con 28 planes.", "src": "Plan_Vuelo_2030.txt (§4, lista de planes)", "note": ""}, {"n": 11, "stem": "¿Cuántos planes estratégicos contiene el Bloque 4 (Servicios) del PV2030 y cómo se compara con los Bloques 1+2+3 juntos?", "opts": ["17 planes; menos que los Bloques 1+2+3 juntos", "8 planes; igual que el Bloque 2 solo", "28 planes; exactamente igual que los Bloques 1+2+3 juntos", "28 planes; más del doble que los Bloques 1+2+3 juntos"], "ans": 2, "why": "El Bloque 4 tiene 28 planes; los Bloques 1+2+3 juntos tienen 3+17+8 = 28 planes: exactamente iguales, un dato limpio y citable para una pregunta trampa de «cuántos más».", "src": "Plan_Vuelo_2030.txt (§4, lista de planes, comprobado por el agente)", "note": ""}, {"n": 12, "stem": "¿Qué significa el código de plan estratégico «GC2» del PV2030?", "opts": ["Gestión de Clientes", "Gobernanza Corporativa", "Gestión de Capacidad", "Ética y Cumplimiento Normativo"], "ans": 3, "why": "GC2 es uno de los tres planes del Bloque 1 (GC1 Buena Gobernanza, GC2 Ética y Cumplimiento Normativo, GC3 Buenas prácticas tributarias).", "src": "Plan_Vuelo_2030.txt (§4, detalle del Bloque 1)", "note": ""}, {"n": 13, "stem": "Según el PV2030, ¿a qué certificación apunta el plan GC2 (Ética y Cumplimiento Normativo)?", "opts": ["UNE 19601 (certificación de cumplimiento penal)", "ISO 9001", "EFQM 600", "ENS Categoría ALTA"], "ans": 0, "why": "GC2 apunta a la certificación de cumplimiento penal UNE 19601 y a una herramienta GRC (gobernanza, riesgo y cumplimiento), junto con una formación reforzada sobre el Código Ético y el Canal Ético.", "src": "Plan_Vuelo_2030.txt (§4.4, fichas de planes del Bloque 1)", "note": ""}, {"n": 14, "stem": "¿Con qué nombre se conoce internamente el plan estratégico «IO3 — Estrategia de Inteligencia Artificial (IA)»?", "opts": ["GammaSIM", "iANAIRE", "INSIGNIA", "MiFIS"], "ans": 1, "why": "La estrategia de IA del IO3 lleva el nombre interno «iANAIRE». GammaSIM y MiFIS son herramientas de ENAIRE sin relación, citadas en el material del manual/t07; INSIGNIA es la herramienta gráfica de información aeronáutica.", "src": "Plan_Vuelo_2030.txt (§4, lista de planes del Bloque 3)", "note": ""}, {"n": 15, "stem": "¿A qué área del Bloque 3 pertenece el plan «IN2 — Refuerzo de participación de ENAIRE en estructuras de gobierno internacional»?", "opts": ["Desarrollo de Negocio", "Innovación como Motor del Desarrollo", "Internacionalización", "Cooperación Civil-Militar"], "ans": 2, "why": "IN1 e IN2 están ambos en el área «Internacionalización» del Bloque 3; Desarrollo de Negocio (DN1-DN3) e Innovación (IO1-IO3) son las otras dos áreas de ese bloque.", "src": "Plan_Vuelo_2030.txt (§4, lista de planes del Bloque 3)", "note": ""}, {"n": 16, "stem": "¿A qué área del Bloque 4 pertenece el plan «NU1 — U-Space / Innovative Air Mobility»?", "opts": ["Servicios de Red", "Digital Tech", "Sostenibilidad Medioambiental", "Servicios a Drones y Nuevos Usuarios"], "ans": 3, "why": "NU1-NU3 (U-Space/IAM, servicios basados en drones, gestión del tráfico espacial) forman el área «Servicios a Drones y Nuevos Usuarios», una de las siete áreas del Bloque 4.", "src": "Plan_Vuelo_2030.txt (§4, lista de planes del Bloque 4)", "note": ""}, {"n": 17, "stem": "¿Cuántos riesgos estratégicos seleccionó el PV2030 como vinculados a sus objetivos estratégicos y cómo se identifican?", "opts": ["13 riesgos, con letras de la A a la M", "6 riesgos, numerados del 1 al 6", "17 riesgos, uno por área", "56 riesgos, uno por plan"], "ans": 0, "why": "De todos los riesgos identificados en la Política de Control y Gestión Integral de Riesgos de ENAIRE, se seleccionaron 13 riesgos estratégicos, con letras de la A a la M, como vinculados a los objetivos del PV2030; son distintos de los 6 objetivos, las 17 áreas y los 56 planes.", "src": "Plan_Vuelo_2030.txt (§5, mapa de riesgos)", "note": ""}, {"n": 18, "stem": "¿Qué letra del mapa de riesgos del PV2030 corresponde a «Contrato de prestación de servicios Aena, S.A.»?", "opts": ["Riesgo C", "Riesgo E", "Riesgo G", "Riesgo M"], "ans": 1, "why": "El riesgo E abarca las cláusulas de penalización del contrato de servicios ENAIRE-Aena si se incumplen los compromisos; es el mismo contrato que la sección de contexto nacional describe con un valor de 601,2 M€ para 2022-2026.", "src": "Plan_Vuelo_2030.txt (§5, tabla de riesgos)", "note": ""}, {"n": 19, "stem": "¿Qué dos amenazas cubre conjuntamente el riesgo H del mapa de riesgos del PV2030?", "opts": ["Liquidez y reclamaciones judiciales", "Conflictividad laboral y daño reputacional", "Ciberseguridad y seguridad física", "Incertidumbre macroeconómica y regulatoria"], "ans": 2, "why": "El riesgo H, «Ciberseguridad y Seguridad física», cubre los ciberataques o ataques físicos a las instalaciones de ENAIRE (acceso no autorizado, fraude de datos, suplantación de identidad).", "src": "Plan_Vuelo_2030.txt (§5, tabla de riesgos)", "note": ""}, {"n": 20, "stem": "¿Qué comité supervisa la Política de Control y Gestión Integral de Riesgos de ENAIRE?", "opts": ["La Agencia Tributaria", "AESA", "El Club de Excelencia en Gestión", "El Comité de Riesgos, Resiliencia, Crisis y Recuperación"], "ans": 3, "why": "Este Comité de Riesgos, Resiliencia, Crisis y Recuperación supervisa la política integral de riesgos de la que se seleccionaron los 13 riesgos estratégicos del PV2030.", "src": "Plan_Vuelo_2030.txt (§5)", "note": ""}, {"n": 21, "stem": "Según el informe «Grado de Cumplimiento» de ENAIRE de junio de 2026 que cierra el PV2025, ¿qué sello de calidad obtuvo ENAIRE en 2024, después de que su evaluación EFQM de 2021 mostrara margen de mejora?", "opts": ["Sello EFQM 600", "ISO 27001", "UNE 19601", "ENS Categoría ALTA"], "ans": 0, "why": "Tras la evaluación EFQM de 2021, los resultados mejoraron en 2024, con lo que ENAIRE obtuvo el Sello EFQM 600 del Club de Excelencia en Gestión, citado como parte del logro de «transformación y modernización impulsadas» del PV2025.", "src": "Grado_Cumplimiento_PV2025_30jun26.txt (logros de cierre)", "note": ""}, {"n": 22, "stem": "¿Con qué volumen de vuelos cerró ENAIRE 2025 y cómo se compara con 2019?", "opts": ["2,0 millones de vuelos, igual que 2019", "2,5 millones de vuelos, un 14,9 % por encima de 2019", "3,0 millones de vuelos, un 20 % por encima de 2019", "1,8 millones de vuelos, por debajo de 2019"], "ans": 1, "why": "ENAIRE cerró 2025 con un récord histórico de 2,5 millones de vuelos, un 14,9 % por encima de la referencia prepandemia de 2019 y un 4,7 % por encima de 2024.", "src": "Grado_Cumplimiento_PV2025_30jun26.txt (cifras de tráfico)", "note": ""}, {"n": 23, "stem": "¿Cuál fue el récord histórico de vuelos de ENAIRE en un solo día establecido en 2025, y en qué fecha?", "opts": ["7500 vuelos el 1 de junio de 2025", "9000 vuelos el 15 de agosto de 2025", "8103 vuelos, alcanzados por primera vez el 5 de julio de 2025 (igualados el 9 de agosto de 2025)", "8103 vuelos el 24 de diciembre de 2025"], "ans": 2, "why": "El récord diario histórico de ENAIRE, 8103 vuelos, se estableció el 5 de julio de 2025 y se igualó el 9 de agosto de 2025.", "src": "Grado_Cumplimiento_PV2025_30jun26.txt (cifras de tráfico)", "note": ""}, {"n": 24, "stem": "Según las cifras de cierre del PV2025, ¿qué proporción del tráfico aéreo europeo representó España en 2025?", "opts": ["12 %", "35 %", "8 %", "22 %"], "ans": 3, "why": "Con su récord de tráfico de 2025, España representó el 22 % del tráfico aéreo europeo, parte de los logros de cierre del PV2025.", "src": "Grado_Cumplimiento_PV2025_30jun26.txt (cifras de tráfico)", "note": ""}, {"n": 25, "stem": "¿Cuántos «Planes Estratégicos de Actuación» tenía la estructura propia del PV2025 (distinta de la del PV2030) y en qué áreas se organizaban?", "opts": ["12 planes en 3 áreas (Servicios, Desarrollo de Negocio, Transformación) más la Gobernanza transversal", "56 planes en 4 bloques", "17 planes en 17 áreas", "6 planes en 6 objetivos"], "ans": 0, "why": "El PV2025 tenía 12 planes estratégicos de actuación (con 2-5 «iniciativas estratégicas» cada uno), clasificados en tres áreas (Servicios, Desarrollo de Negocio, Transformación) con la Gobernanza como garante transversal; la estructura de 56 planes, 4 bloques y 17 áreas del PV2030 supone un aumento de granularidad de unas 4,7 veces.", "src": "Grado_Cumplimiento_PV2025_30jun26.txt (estructura del PV2025)", "note": ""}, {"n": 26, "stem": "¿Qué empresa constituyó ENAIRE en julio de 2025 para convertirse en proveedor global de navegación aérea y servicios asociados?", "opts": ["Startical", "ENAIRE Global Services (EGS)", "CRIDA", "GroupEAD"], "ans": 1, "why": "EGS («Sociedad Mercantil Estatal 100% de ENAIRE») se constituyó en julio de 2025 con esta finalidad; Startical (2021), CRIDA (2008) y GroupEAD (2001) son participadas más antiguas.", "src": "Plan_Vuelo_2030.txt (§2, grupo empresarial)", "note": ""}, {"n": 27, "stem": "¿En qué año y con qué socio se constituyó Startical, la empresa de servicios por satélite de ENAIRE?", "opts": ["2008, con la UPM", "2001, con DFS", "2021, con Indra (50/50)", "1993, como Aena"], "ans": 2, "why": "Startical, que presta servicios por satélite de vigilancia y de comunicaciones de voz y datos en zonas remotas y oceánicas, se constituyó en 2021 como empresa conjunta al 50 % entre ENAIRE e Indra.", "src": "Plan_Vuelo_2030.txt (§2, grupo empresarial)", "note": ""}, {"n": 28, "stem": "¿En qué año y por qué socios se creó CRIDA, el centro de referencia de investigación, desarrollo e innovación de ENAIRE?", "opts": ["2001, por ENAIRE y DFS", "2015, solo por ENAIRE", "1993, por Aena e Ineco", "2008, por ENAIRE, la UPM e Ineco"], "ans": 3, "why": "CRIDA («el centro de referencia de investigación, desarrollo e innovación») se creó en 2008 por ENAIRE, la UPM (Universidad Politécnica de Madrid) e Ineco.", "src": "Plan_Vuelo_2030.txt (§2, grupo empresarial)", "note": ""}, {"n": 29, "stem": "¿Desde qué año es ENAIRE miembro de ESSP SAS (European Satellite Services Provider, operador de EGNOS)?", "opts": ["2008", "1993", "2001", "2021"], "ans": 0, "why": "ENAIRE forma parte de ESSP SAS desde 2008, junto con DSNA, ENAV, DFS, NATS, NAV Portugal y Skyguide.", "src": "Plan_Vuelo_2030.txt (§2, grupo empresarial)", "note": ""}, {"n": 30, "stem": "¿Con qué socios fundó ENAIRE GroupEAD en 2001?", "opts": ["UPM e Ineco", "DFS y Frequentis AG", "Indra y Aena", "Solo EUROCONTROL"], "ans": 1, "why": "GroupEAD se fundó en 2001 por ENAIRE con DFS y Frequentis AG; opera bajo EUROCONTROL desde 2003, y su modelo de gestión está en transición hacia la plena integración en EUROCONTROL.", "src": "Plan_Vuelo_2030.txt (§2, grupo empresarial)", "note": ""}, {"n": 31, "stem": "A 31 de diciembre de 2024, ¿cuál era la plantilla total de ENAIRE y qué proporción pertenecía al Convenio de Control?", "opts": ["4011 personas, 48,9 %", "2190 personas, 100 %", "4284 personas, 51,1 %", "4284 personas, 71,6 %"], "ans": 2, "why": "La plantilla consolidada a 31-12-2024 era de 4284 personas, de las cuales el 51,1 % pertenecía al Convenio de Control (2190 personas) y el 48,9 % al Convenio Grupo (2094 personas). El 71,6 % es la proporción en los Niveles profesionales A-B, un desglose distinto.", "src": "Plan_Vuelo_2030.txt (§2, cifras de plantilla)", "note": ""}, {"n": 32, "stem": "Según el PV2030, ¿qué proporción de la plantilla total de ENAIRE tenía más de 51 años a 31 de diciembre de 2024?", "opts": ["21 %", "35 %", "62 %", "49 %"], "ans": 3, "why": "El 49 % de la plantilla tenía más de 51 años a 31-12-2024, frente al 38 % en 2019; solo el 21 % tenía menos de 41 (frente al 14 % en 2019).", "src": "Plan_Vuelo_2030.txt (§2, cifras de plantilla, «por edad»)", "note": ""}, {"n": 33, "stem": "Según las cifras de plantilla del PV2030, ¿cuántos vuelos por controlador operativo gestionó ENAIRE en 2024?", "opts": ["1193", "601,2", "2190", "4284"], "ans": 0, "why": "Se gestionaron 1193 vuelos por controlador operativo en 2024, un +3,5 % respecto a 2023.", "src": "Plan_Vuelo_2030.txt (§2, cifras de plantilla)", "note": ""}, {"n": 34, "stem": "¿Cuándo aprobó el Consejo de la OACI el Plan Estratégico de la OACI 2026-2050 y cuántos objetivos estratégicos fija?", "opts": ["Aprobado el 19 de mayo de 2025, 4 objetivos", "Aprobado el 1 de noviembre de 2024, 6 objetivos", "Aprobado el 11 de noviembre de 2024, 10 objetivos", "Aprobado el 1 de diciembre de 2024, 8 objetivos"], "ans": 1, "why": "El Consejo de la OACI aprobó el Plan Estratégico de la OACI 2026-2050 el 1 de noviembre de 2024 y fija 6 objetivos estratégicos (cero víctimas mortales, cero emisiones netas de carbono en 2050, movilidad fluida, colaboración, derecho aeronáutico adaptado y desarrollo económico).", "src": "Plan_Vuelo_2030.txt (§6.1, contexto internacional)", "note": ""}, {"n": 35, "stem": "¿Qué papel desempeñó España en la elaboración del Plan Estratégico de la OACI 2026-2050?", "opts": ["Se abstuvo de participar", "Presidió el Consejo de la OACI", "Fue designada Coordinadora del Grupo Consultivo", "Solo acogió la ceremonia de aprobación"], "ans": 2, "why": "España fue designada Coordinadora del Grupo Consultivo, un papel destacado en la elaboración de este plan.", "src": "Plan_Vuelo_2030.txt (§6.1)", "note": ""}, {"n": 36, "stem": "¿Cuál de las siguientes distingue correctamente el GASP del GASeP?", "opts": ["GASP = Plan global para la seguridad de la aviación (Global Aviation Security Plan); GASeP = Plan global para la seguridad operacional de la aviación (Global Aviation Safety Plan)", "GASP = Plan mundial de navegación aérea; GASeP = Plan global para la seguridad operacional de la aviación (Global Aviation Safety Plan)", "GASP y GASeP son el mismo plan con dos nombres", "GASP = Plan global para la seguridad operacional de la aviación (Global Aviation Safety Plan); GASeP = Plan global para la seguridad de la aviación (Global Aviation Security Plan)"], "ans": 3, "why": "El GASP es el Plan global para la seguridad operacional de la aviación de la OACI (reducción de accidentes y riesgos); el GASeP es el Plan global para la seguridad de la aviación (protección frente a amenazas): una clásica trampa de intercambio. El GANP es el Plan mundial de navegación aérea, aparte.", "src": "Plan_Vuelo_2030.txt (§6.1); confirmado por el mapa DL01", "note": ""}, {"n": 37, "stem": "¿Mediante qué reglamento de la UE se adoptó el SES2+ y cuándo se publicó en el DOUE?", "opts": ["Reglamento (UE) 2024/2803, publicado el 11 de noviembre de 2024", "Reglamento (UE) 2019/317, publicado el 17 de diciembre de 2019", "Reglamento (CE) 549/2004, publicado el 10 de marzo de 2004", "Reglamento (UE) 2024/3128, publicado el 12 de junio de 2024"], "ans": 0, "why": "El SES2+ es el Reglamento (UE) 2024/2803, adoptado por el Parlamento Europeo y el Consejo, publicado en el DOUE el 11-11-2024 y parcialmente en vigor el 1-12-2024. Esto corrige lo que dice el manual desfasado («en proceso de negociación», «trílogos»).", "src": "Plan_Vuelo_2030.txt (§6.2)", "note": ""}, {"n": 38, "stem": "Conforme al SES2+, ¿qué órgano debe ser independiente del proveedor de servicios de navegación aérea y es designado por cada Estado miembro?", "opts": ["El Gestor de Despliegue de SESAR", "La Autoridad Nacional de Supervisión", "El Gestor de Red", "El Grupo Consultivo"], "ans": 1, "why": "El SES2+ exige una o varias Autoridades Nacionales de Supervisión, independientes del proveedor de servicios y designadas por los Estados; en España es AESA.", "src": "Plan_Vuelo_2030.txt (§6.2)", "note": ""}, {"n": 39, "stem": "Según el nuevo concepto de ATSP (proveedor de servicios de tránsito aéreo) del SES2+, ¿qué porcentaje mínimo de propiedad o control debe tener un Estado miembro o sus nacionales?", "opts": ["Más del 25 %", "Al menos el 33 %", "Más del 50 %", "Exactamente el 100 %"], "ans": 2, "why": "Un ATSP debe ser designado por tiempo ilimitado, estar certificado, cumplir los requisitos de seguridad y defensa, estar ubicado en un Estado miembro y ser propiedad y estar controlado en más del 50 % por un Estado miembro o sus nacionales.", "src": "Plan_Vuelo_2030.txt (§6.2)", "note": ""}, {"n": 40, "stem": "¿Qué es el «Proyecto Común Uno» (CP1) en el marco SES/SESAR?", "opts": ["Un plan solo para los servicios U-space", "El plan interno de digitalización propio de ENAIRE", "El predecesor del Plan Maestro ATM", "El reglamento de la UE vinculado a SESAR que impone el despliegue sincronizado e interoperable de funcionalidades ATM en toda Europa"], "ans": 3, "why": "El CP1 impone el despliegue sincronizado e interoperable de funcionalidades ATM en toda Europa para mejorar la seguridad, la eficiencia y la capacidad y reducir el impacto ambiental; el CP2, vinculado a los SDO del Plan Maestro ATM, está por llegar.", "src": "Plan_Vuelo_2030.txt (§6.2)", "note": ""}, {"n": 41, "stem": "¿Qué es el Gestor de Despliegue de SESAR (SDM) y qué consorcio lo gestiona (2022-2027)?", "opts": ["Un único departamento de la Comisión Europea", "El Grupo Consultivo de la OACI", "Un consorcio de los 14 principales ANSP europeos más gestores aeroportuarios y usuarios del espacio aéreo (el SDIP)", "Solo AESA"], "ans": 2, "why": "El SDM es el órgano designado por la Comisión Europea para coordinar el despliegue sincronizado de las mejoras de SESAR mediante Proyectos Comunes; desde el 1 de junio de 2022 hasta 2027 lo gestiona el consorcio SDIP (SESAR Deployment &amp; Infrastructure Partnership), formado por 14 grandes ANSP europeos, gestores aeroportuarios y usuarios del espacio aéreo.", "src": "Plan_Vuelo_2030.txt (§6.3)", "note": ""}, {"n": 42, "stem": "¿Cuál es el enunciado de la visión de la última actualización del Plan Maestro ATM europeo (aprobada en diciembre de 2024)?", "opts": ["Cero víctimas mortales por accidentes de aviación en 2030", "El espacio aéreo europeo como el más eficiente y ecológico del mundo en 2045", "Un único proveedor europeo de servicios de navegación aérea en 2035", "Automatización total de todas las posiciones ATC en 2040"], "ans": 1, "why": "El Plan Maestro ATM, principal herramienta de planificación del SES, contempla el espacio aéreo europeo como el más eficiente y ecológico del mundo en 2045; esto difiere del propio objetivo de la OACI de cero emisiones netas de carbono en 2050.", "src": "Plan_Vuelo_2030.txt (§6.4); atm-master-plan-2025.txt", "note": ""}, {"n": 43, "stem": "¿Cuál de los siguientes ES uno de los 10 Objetivos Estratégicos de Implementación (SDO) del Plan Maestro ATM europeo?", "opts": ["Creación de un único ANSP europeo", "Eliminación de todos los bloques funcionales de espacio aéreo", "Transformación hacia operaciones basadas en trayectorias (TBO)", "Sustitución de la OACI por la EASA"], "ans": 2, "why": "La transformación hacia operaciones basadas en trayectorias (TBO) es el SDO 5 de los 10 enumerados (junto con las alertas de riesgo de colisión en calles de rodaje y pistas, la optimización de la huella ambiental, la configuración dinámica del espacio aéreo, el apoyo de la automatización, la virtualización de las operaciones, la conectividad multienlace, la prestación orientada a servicios, la modernización CNS y la movilidad aérea innovadora/drones).", "src": "Plan_Vuelo_2030.txt (§6.4); atm-master-plan-2025.txt", "note": ""}, {"n": 44, "stem": "¿Quién elabora el Plan Estratégico de la Red (NSP, 2025-2029), la hoja de ruta de la red ATM continental en el marco del SES?", "opts": ["AESA", "ENAIRE", "El Gestor de Despliegue de SESAR", "El Gestor de Red Europeo (EUROCONTROL)"], "ans": 3, "why": "El NSP lo elabora el Gestor de Red Europeo (EUROCONTROL) y fija 10 objetivos estratégicos sobre diseño y operación de la red, digitalización, integración de nuevos actores, seguridad, gestión de crisis y sostenibilidad ambiental.", "src": "Plan_Vuelo_2030.txt (§6.4)", "note": ""}, {"n": 45, "stem": "El Plan de Operaciones de la Red (NOP 2025/2026-2029) fija Perfiles de Capacidad anuales por centro de control. ¿Para qué dos ACC españoles señala la fuente aumentos de capacidad requeridos especialmente exigentes?", "opts": ["Barcelona y Sevilla", "Palma y Canarias", "Madrid y Málaga", "Valencia y Santiago"], "ans": 0, "why": "Los aumentos de capacidad que exige el NOP son exigentes «en especial para centros de control como Barcelona y Sevilla», donde el Gestor de Red prevé niveles de demora superiores a los que exigirían los objetivos nacionales.", "src": "Plan_Vuelo_2030.txt (§6.4)", "note": ""}, {"n": 46, "stem": "¿Qué Decisión de Ejecución de la Comisión fijó los objetivos de rendimiento a escala de la Unión para el RP4, y cuándo?", "opts": ["Decisión (UE) 2025/1063, de 19 de mayo de 2025", "Decisión (UE) 2024/1688, de 12 de junio de 2024", "Decisión (UE) 2019/2174, de 17 de diciembre de 2019", "Reglamento (UE) 2019/317"], "ans": 1, "why": "La Decisión de Ejecución (UE) 2024/1688 de la Comisión, de 12 de junio de 2024, fija los objetivos a escala de la Unión para el RP4 (2025-2029) en las cuatro KPA.", "src": "Plan_Vuelo_2030.txt (§7); ESPP4_final.txt", "note": ""}, {"n": 47, "stem": "¿Mediante qué decisión revisó y aprobó la Comisión Europea el plan de rendimiento español del RP4 (ESPP4), y cuándo se publicó en el DOUE?", "opts": ["Decisión (UE) 2024/1688, publicada el 12 de junio de 2024", "Reglamento (UE) 2024/2803, publicado el 11 de noviembre de 2024", "Decisión (UE) 2025/1063 de 19 de mayo de 2025, publicada en el DOUE el 28 de mayo de 2025", "Decisión (UE) 2019/2174, publicada el 17 de diciembre de 2019"], "ans": 2, "why": "Los objetivos del ESPP4 fueron revisados y aprobados por la Decisión (UE) 2025/1063 de la Comisión, de 19 de mayo de 2025, publicada en el DOUE el 28 de mayo de 2025.", "src": "ESPP4_final.txt (resumen ejecutivo)", "note": ""}, {"n": 48, "stem": "¿Qué autoridad nacional es responsable de elaborar el ESPP4, en colaboración con las autoridades nacionales de supervisión MET y MIL?", "opts": ["ENAIRE", "EUROCONTROL", "La Agencia Tributaria", "AESA"], "ans": 3, "why": "AESA es la Autoridad Nacional de Supervisión civil responsable de elaborar el ESPP4, en colaboración con la ANS de MET y la ANS militar para los servicios meteorológicos y militares.", "src": "ESPP4_final.txt (resumen ejecutivo)", "note": ""}, {"n": 49, "stem": "En el RP4, ¿qué ANSP privado está exento de los objetivos de coste-eficiencia, del reparto de riesgos y de los incentivos financieros mientras presta ATS/AFIS de aeródromo en Alicante-Elche e Ibiza?", "opts": ["Skyway", "Startical", "EGS", "GroupEAD"], "ans": 0, "why": "Skyway, incluida en el ámbito del RP4 tras superar el umbral de 80 000 movimientos IFR, está exenta de los objetivos de coste-eficiencia, del reparto de riesgos y de otros requisitos conforme al art. 35(2) del Reglamento 2019/317 (declaración de condiciones de mercado, Decisión (UE) 2019/2174 de la Comisión, de 17 de diciembre de 2019). ENAIRE es el único ANSP sujeto a la totalidad del reglamento.", "src": "ESPP4_final.txt (ámbito)", "note": ""}, {"n": 50, "stem": "En el indicador KEA del área medioambiental (ineficiencia de la red de rutas), ¿en qué valor fija el objetivo local de España para 2025, frente al objetivo de toda la UE para 2025?", "opts": ["España 2,80 % frente a 2,86 % en toda la UE", "España 2,86 % frente a 2,80 % en toda la UE (el objetivo de España es algo menos estricto)", "Los objetivos de España y de toda la UE son idénticos, 2,80 %", "España 0,38 % frente a 0,90 % en toda la UE"], "ans": 1, "why": "El objetivo KEA de España para 2025 es del 2,86 % frente al techo del 2,80 % de toda la UE: los valores de referencia locales son desgloses específicos de cada Estado, no tienen por qué igualar la cifra de toda la UE, y un Estado puede situarse legítimamente por encima o por debajo.", "src": "ESPP4_final.txt; Plan_Vuelo_2030.txt (§4.3)", "note": ""}, {"n": 51, "stem": "¿Cuál es el objetivo a corto plazo, a escala de la Unión, de variación interanual del coste unitario determinado (DUC) en el RP4 (2025-2029)?", "opts": ["+1,2 %/año", "0 % (congelado)", "-1,2 %/año", "-5,0 %/año"], "ans": 2, "why": "El objetivo de variación interanual del DUC para toda la Unión es de -1,2 %/año en 2025-2029 (corto plazo) y de -1,0 %/año a largo plazo en RP3+RP4 combinados (considerando 22 de la Decisión 2024/1688).", "src": "ESPP4_final.txt", "note": ""}, {"n": 52, "stem": "¿Qué ley española, aprobada el 3 de diciembre de 2025, establece las condiciones de un sistema de movilidad sostenible, justo e inclusivo y desarrolla la Estrategia de Movilidad de 2021?", "opts": ["Ley 9/2010", "Ley 18/2014", "Ley 40/2015", "Ley 9/2025, de Movilidad Sostenible"], "ans": 3, "why": "La Ley 9/2025, de 3 de diciembre de 2025, de Movilidad Sostenible, es una ley nueva que desarrolla medidas de la Estrategia de Movilidad Segura, Sostenible y Conectada 2030 (aprobada en diciembre de 2021): un firme candidato a pregunta «actualizada» de examen, dada la actualización del tema 1 señalada en el proyecto el 20-11-2025.", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 53, "stem": "¿Aproximadamente cuánta financiación movilizó entre 2021 y 2025 el PERTE Aeroespacial, aprobado por el Consejo de Ministros en marzo de 2022?", "opts": ["4533 M€", "601,2 M€", "180 M€", "25 M€"], "ans": 0, "why": "El PERTE Aeroespacial movilizó aproximadamente 4533 M€ entre 2021 y 2025 (unos 2193 M€ públicos y unos 2340 M€ privados), con el objetivo de convertir la industria aeroespacial española en un actor clave de la transformación sectorial.", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 54, "stem": "¿Qué periodo cubre el DORA II, el Documento de Regulación Aeroportuaria de Aena, y cuándo se espera el DORA III?", "opts": ["El DORA II cubre 2027-2031; el DORA III ya está en vigor", "El DORA II cubre 2022-2026; el DORA III (2027-2031) se espera aprobar en 2026", "El DORA II cubre 2020-2024; el DORA III cubre 2025-2029", "El DORA II y el DORA III cubren ambos 2022-2026"], "ans": 1, "why": "El DORA (Documento de Regulación Aeroportuaria), instrumento de regulación de Aena conforme a la Ley 18/2014, tiene el DORA II para 2022-2026; el DORA III (2027-2031) se espera aprobar en 2026, con el objetivo de mantener la red de Aena en la cima de Europa.", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 55, "stem": "¿Qué valor tiene el contrato de servicios de navegación aérea Aena-ENAIRE (2022-2026) y a cuántos aeropuertos de la red de Aena alcanzan sus indicadores de Calidad de Servicio?", "opts": ["4533 M€ en 21 aeropuertos", "180 M€ en 5 aeropuertos", "601,2 M€ en 46 aeropuertos", "25 M€ en 12 aeropuertos"], "ans": 2, "why": "El contrato Aena-ENAIRE, firmado para 2022-2026, vale 601,2 M€ e incluye indicadores de Calidad de Servicio en 46 aeropuertos de la red de Aena; 2026 se describe como clave para preparar la oferta del contrato 2027-2031. Es el mismo contrato señalado como riesgo estratégico E.", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 56, "stem": "¿Qué tipo de proveedor designa el RD 517/2024 (junio de 2024) a ENAIRE para todos los volúmenes U-space de España, una vez completada la certificación?", "opts": ["ATSP", "MET NSA", "SDM", "El CISP inicial (proveedor del servicio de información común)"], "ans": 3, "why": "El nuevo Real Decreto de drones RD 517/2024 designa oficialmente a ENAIRE como CISP inicial para todos los volúmenes U-space de España, en complemento del PANDU (aprobado en 2022, revisado en 2024, con vigencia 2022-2025).", "src": "Plan_Vuelo_2030.txt (§8, contexto nacional)", "note": ""}, {"n": 57, "stem": "¿Cuántos planes o iniciativas estratégicos componen el área de sostenibilidad medioambiental «Green Sky» de ENAIRE dentro del Bloque 4 del PV2030?", "opts": ["5 (Fly Clean, Fly Quiet, Eco ENAIRE, Compromiso Verde, Responsabilidad Ambiental)", "3 (Fly Clean, Fly Quiet, Eco ENAIRE)", "6, uno por objetivo estratégico", "13, uno por riesgo estratégico"], "ans": 0, "why": "Green Sky consta de 5 planes: SM1 Fly Clean, SM2 Fly Quiet, SM3 Eco ENAIRE, SM4 Compromiso Verde, SM5 Responsabilidad Ambiental; los mismos cinco nombres aparecen como «iniciativas estratégicas» del pilar medioambiental del plan anterior en la Memoria de Sostenibilidad 2024, lo que muestra la continuidad entre el PV2025 y el PV2030.", "src": "Plan_Vuelo_2030.txt (§4, Bloque 4); Memoria_Sostenibilidad_2024.txt", "note": ""}, {"n": 58, "stem": "Según la nota de prensa de ENAIRE sobre la aprobación del PV2030, ¿cuántas toneladas de CO2 había evitado emitir ENAIRE en los cinco años anteriores mediante la optimización del espacio aéreo?", "opts": ["40 000 toneladas", "300 000 toneladas", "68 315 toneladas", "77 000 toneladas"], "ans": 1, "why": "La nota de prensa sobre la aprobación del PV2030 (dic. 2025) indica que ENAIRE evitó emitir 300 000 toneladas de CO2 en los últimos cinco años mediante la optimización del espacio aéreo, y prevé una reducción adicional de 40 000 toneladas durante la ejecución del PV2030. Las cifras de 68 315 t y 77 000 t son dos cifras distintas, mutuamente incoherentes, solo de 2024, de la Memoria de Sostenibilidad 2024.", "src": "PR_Board_approves_Strategic_Plan_2030_EN.txt", "note": ""}, {"n": 59, "stem": "¿Qué objetivo fija el PV2030 para la huella de carbono corporativa de ENAIRE (alcances 1+2) en 2030?", "opts": ["Una reducción del 50 % respecto a la base de 2020", "Una reducción anual del 10 % sin permitir compensación", "Cero emisiones en 2030, por compensación", "No se fija ningún objetivo para los alcances 1+2"], "ans": 2, "why": "El objetivo propio del PV2030 para la huella de carbono corporativa (alcances 1+2) es «Cero emisiones en 2030 (por compensación)», además de un plan de movilidad de ENAIRE.", "src": "Plan_Vuelo_2030.txt (§9, sostenibilidad)", "note": ""}, {"n": 60, "stem": "¿De qué categorías del Esquema Nacional de Seguridad tiene ENAIRE certificados de conformidad de AENOR?", "opts": ["Solo BAJA y MEDIA", "Solo ALTA", "BAJA, MEDIA y ALTA", "MEDIA y ALTA"], "ans": 3, "why": "ENAIRE tiene conformidad ENS en la Categoría MEDIA (ENS-2018/0006) y en la Categoría ALTA (ENS-2020/0020), además de las certificaciones de AENOR de Gestión Ambiental, Gestión de la Calidad y Seguridad y Salud en el Trabajo.", "src": "Plan_Vuelo_2030.txt (§9); Certificaciones_Sistema_Gestion_jun26.txt", "note": ""}, {"n": 61, "stem": "¿Qué organización otorgó a ENAIRE el Sello EFQM 600 en 2024 y en qué modelo se basa?", "opts": ["AENOR, basado en la ISO 9001", "AESA, basado en el reglamento SES2+", "La Comisión Europea, basado en el RP4", "El Club de Excelencia en Gestión, basado en el modelo EFQM 2020"], "ans": 3, "why": "El Sello EFQM 600 (código de certificado CEG/24/S600/6) fue concedido en 2024 por el Club de Excelencia en Gestión, en nombre de la Fundación Europea para la Gestión de la Calidad, basado en el modelo EFQM 2020, «por una gestión segura, eficiente, innovadora y sostenible».", "src": "Plan_Vuelo_2030.txt (§9)", "note": ""}, {"n": 62, "stem": "¿Cómo se compara el compromiso de calidad percibida de la Carta de Servicios 2025-2027 con el objetivo del indicador estratégico del propio PV2030 para el mismo concepto?", "opts": ["Ambos se fijan exactamente en el 80 %", "Carta de Servicios ≥75 % (mínimo público) frente al 78,5-80 % del PV2030 (ambición interna): la cifra de la Carta es inferior", "Carta de Servicios ≥90 % frente al 75 % del PV2030", "Ninguno de los dos documentos fija un objetivo de calidad percibida"], "ans": 1, "why": "La Carta de Servicios se compromete públicamente a un índice de calidad percibida superior al 75 %, un mínimo inferior al objetivo del propio indicador estratégico del PV2030, del 78,5 % (2026) que sube al 80 % (2030): la Carta es el mínimo de cara al público, el PV2030 la ambición interna. Un distractor podría intercambiar fácilmente estas dos cifras.", "src": "Carta_Servicios_2025-2027.txt; Plan_Vuelo_2030.txt (§4.1)", "note": ""}, {"n": 63, "stem": "Según la Carta de Servicios 2025-2027, ¿qué porcentaje mínimo de vuelos debe cumplir su ventana horaria programada?", "opts": ["75 %", "85 %", "90 %", "99 %"], "ans": 2, "why": "Al menos el 90 % de los vuelos cumplirá su ventana horaria programada, según los compromisos cuantificados de la Carta de Servicios; coincide con el indicador estratégico «Adherencia al slot» del propio PV2030, también fijado en &gt;90 %.", "src": "Carta_Servicios_2025-2027.txt", "note": ""}, {"n": 64, "stem": "¿Qué servicio de los que enumera la Carta de Servicios 2025-2027 NO figura entre los seis servicios descritos en el manual oficial de ENAIRE del tema 7?", "opts": ["ATS", "CNS", "AIS/AIP", "SDP (Servicio de Dirección de Plataforma)"], "ans": 3, "why": "El SDP (servicio de dirección de plataforma) figura en la Carta de Servicios pero no entre los seis servicios del manual (ATS, ATFM, ASM local de nivel 3, CNS, AIS/AIP, FPD).", "src": "Carta_Servicios_2025-2027.txt; contrastado con syllabus/manual/OM07", "note": ""}, {"n": 65, "stem": "¿En qué fecha se actualizó y se elevó a la aprobación del Consejo Rector la Política de Cultura Justa de ENAIRE, aprobada originalmente en noviembre de 2015?", "opts": ["El 27 de marzo de 2023", "El 21 de diciembre de 2023", "El 19 de diciembre de 2025", "El 24 de noviembre de 2025"], "ans": 0, "why": "La Política de Cultura Justa actualizada (código DGL-15-POL-002-2.0) entró en vigor el 27 de marzo de 2023, tras su aprobación por el Consejo Rector en esa misma fecha, adaptada a la nueva plantilla de políticas de ENAIRE.", "src": "Politica_Cultura_Justa.txt", "note": ""}, {"n": 66, "stem": "Según la Política de Cultura Justa de ENAIRE, ¿qué comportamientos son la excepción a que el personal NO sea sancionado por actuaciones acordes con su formación y experiencia?", "opts": ["Cualquier error notificado, sin excepción", "Dolo, negligencia flagrante, infracciones intencionadas o actuar bajo los efectos de sustancias psicoactivas", "Cualquier desviación del procedimiento estándar, por leve que sea", "Notificar un suceso de seguridad a un superior"], "ans": 1, "why": "La definición de la propia política no tolera «el dolo, la negligencia flagrante, las infracciones intencionadas ni los actos destructivos»; la sanción exige prueba de culpa deliberada o intencionada o de actuación bajo los efectos de sustancias psicoactivas.", "src": "Politica_Cultura_Justa.txt", "note": ""}, {"n": 67, "stem": "¿Qué programa nombra la Política de Cultura Justa de ENAIRE para gestionar el estrés del personal tras un incidente crítico?", "opts": ["GRC (gobernanza, riesgo y cumplimiento)", "PCATS", "CISM (gestión del estrés por incidente crítico)", "FEAST"], "ans": 2, "why": "La Política de Cultura Justa nombra un programa CISM (gestión del estrés por incidente crítico) para gestionar el estrés tras los incidentes; el GRC es una herramienta de cumplimiento, el PCATS se refiere a procedimientos de controladores y FEAST es la prueba informatizada de la Fase 2.", "src": "Politica_Cultura_Justa.txt", "note": ""}, {"n": 68, "stem": "Según la actualización de octubre de 2025 de STATFOR de EUROCONTROL, ¿en qué año recuperaría el tráfico europeo (ECAC, 44 Estados) los niveles de 2019 en el escenario «Base»?", "opts": ["2024", "2030", "Nunca se recuperaría del todo", "2026"], "ans": 3, "why": "La actualización de octubre de 2025 de STATFOR proyecta que Europa recupera los niveles de tráfico de 2019 en 2026 en el escenario «Base»; el crecimiento de 2030 respecto a 2025 va del 10,9 % («Base») al 20,6 % («High»).", "src": "Plan_Vuelo_2030.txt (§10, previsiones de tráfico)", "note": ""}, {"n": 69, "stem": "La previsión de octubre de 2025 de ENAIRE proyecta para España un crecimiento del tráfico en 2030 respecto a 2025 y un factor de recuperación respecto a 2019 de aproximadamente:", "opts": ["+18,1 % de crecimiento, 136 % de factor de recuperación", "+10,9 % de crecimiento, 110 % de factor de recuperación", "+22,1 % de crecimiento, 149 % de factor de recuperación", "+23 % de crecimiento, 100 % de factor de recuperación"], "ans": 0, "why": "La propia previsión de ENAIRE de oct-25 para España muestra un +18,1 % de crecimiento (2030 frente a 2025) y un factor de recuperación del 136 % respecto a 2019 (es decir, un 36 % por encima del tráfico prepandemia); hay que leer con cuidado a qué año base se refiere la pregunta, ya que los dos enfoques dan cifras muy distintas para la misma tendencia de fondo.", "src": "Plan_Vuelo_2030.txt (§10, previsiones de tráfico)", "note": ""}, {"n": 70, "stem": "Entre Canarias y la Península, ¿qué región muestra la previsión de octubre de 2025 de ENAIRE que crece más deprisa de 2025 a 2030?", "opts": ["La Península, con un +23 %", "Canarias, con un +23 % frente al +19 % de la Península", "Ambas crecen al mismo ritmo", "La Península, con un +19 % frente al +15 % de Canarias"], "ans": 1, "why": "Canarias crece más deprisa que la Península: +23 % (Canarias) frente a +19 % (Península) en 2030 respecto a 2025, con factores de recuperación respecto a 2019 del 149 % (Canarias) frente al 137 % (Península).", "src": "Plan_Vuelo_2030.txt (§10, previsiones de tráfico)", "note": ""}],U={"lang": "es", "contents": "Contenido", "index": "Índice", "words": "palabras", "min_read": "min de lectura", "quiz": "test", "article": "artículo", "score": "correctas de", "answered": "respondidas", "questions": "preguntas", "shuffle_q": "Mezclar", "shuffle_o": "Opciones al azar", "hide": "Ocultar respondidas", "mistakes": "Fallos", "reset": "Reiniciar", "correct": "Correcta.", "wrong": "Incorrecta.", "note": "Nota", "source": "Fuente", "confirm": "¿Borrar las respuestas?", "badge": {"V": "leído en el texto completo de la fuente", "V*": "leído solo en un resumen", "V-W": "Wikipedia (secundaria)", "NV": "no verificado", "D": "derivado o calculado", "X": "no encontrado"}},KEY='atcquiz:'+"temario/07-entorno-profesional/ampliacion/T07b-test.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
