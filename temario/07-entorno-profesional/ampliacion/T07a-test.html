<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: ENAIRE: organización, infraestructura, servicios y cifras (T07a)</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

 id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../../../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="../index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Entorno profesional</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>Test: ENAIRE: organización, infraestructura, servicios y cifras (T07a)</h1><div class="bar"><span id="score"></span><button id="shuf">Mezclar</button><label><input type="checkbox" id="so"> Opciones al azar</label><label><input type="checkbox" id="hd"> Ocultar respondidas</label><button id="wrong">Fallos</button><button id="reset">Reiniciar</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "¿Cuántas personas componen en total el Consejo Rector de ENAIRE?", "opts": ["9", "6", "15", "12"], "ans": 3, "why": "La Presidencia (por razón del cargo, en manos de la Secretaría de Estado de Transportes) más 11 Consejeros = 12 (RD 160/2023, art. 9).", "src": "RD 160/2023 art. 9.1; página web de gobernanza de ENAIRE", "note": ""}, {"n": 2, "stem": "¿Quién ocupa la Presidencia del Consejo Rector de ENAIRE por razón del cargo?", "opts": ["La Secretaría de Estado de Transportes y Movilidad Sostenible", "El Ministro de Transportes", "El Director General de ENAIRE", "El Consejero de más edad en activo"], "ans": 0, "why": "El art. 7 del RD 160/2023 vincula la Presidencia al puesto de la Secretaría de Estado de Transportes y Movilidad Sostenible, no a un nombramiento aparte.", "src": "RD 160/2023 art. 7", "note": ""}, {"n": 3, "stem": "¿Cuál es la indemnización anual máxima que puede percibir un Consejero de ENAIRE según el RD 462/2002, y por cuántas sesiones?", "opts": ["11 735,24 EUR/año por 11 sesiones", "25 000 EUR/año por 12 sesiones", "6000 EUR/año por 6 sesiones", "No se abona ninguna indemnización"], "ans": 0, "why": "La página web de gobernanza indica este tope exacto, que se reduce proporcionalmente si hay menos sesiones; los Consejeros que son altos cargos no lo cobran (se ingresa en el Tesoro).", "src": "Página web de gobernanza de ENAIRE, «Consejo Rector»", "note": ""}, {"n": 4, "stem": "¿Cuál de las siguientes NO está entre las materias que aprueba el Consejo Rector de ENAIRE, según su propia página web de gobernanza?", "opts": ["El Plan de Vuelo (plan estratégico)", "Las Cuentas Anuales", "Las anotaciones de unidad individuales de los controladores", "El Presupuesto Operativo"], "ans": 2, "why": "Las aprobaciones enumeradas son documentos estratégicos o de gobernanza (plan, código ético, políticas, PAP, presupuesto, plan empresarial, mapa de riesgos, objetivos, cuentas anuales, informes clave); las anotaciones de unidad individuales son una cuestión operativa y de formación, no una aprobación del Consejo Rector.", "src": "Página web de gobernanza de ENAIRE, «Consejo Rector»", "note": ""}, {"n": 5, "stem": "Según el RD 160/2023, ¿qué debe hacer ENAIRE con el 100 % de los dividendos que reciba de filiales AJENAS al negocio de la navegación aérea?", "opts": ["Reinvertirlos en infraestructura de navegación aérea", "Repartirlos entre la plantilla como una prima", "Transferirlos a Aena S.A.", "Ingresarlos en el Tesoro Público"], "ans": 3, "why": "Lo exige el art. 29 del RD 160/2023; el resto del excedente de ENAIRE lo destina el Consejo Rector a compensar pérdidas, a reservas o al Tesoro.", "src": "RD 160/2023 art. 29", "note": ""}, {"n": 6, "stem": "Según el art. 28 del RD 160/2023, ¿cuál es la naturaleza jurídica de las tarifas de ruta y de aproximación de ENAIRE?", "opts": ["Ingresos de derecho público", "Una tarifa comercial privada fijada libremente por ENAIRE", "Una cuota de suscripción voluntaria", "Un impuesto propiedad de EUROCONTROL"], "ans": 0, "why": "Se califican como ingresos de derecho público, exigibles mediante el procedimiento administrativo de recaudación del Ministerio de Hacienda.", "src": "RD 160/2023 art. 28.2", "note": ""}, {"n": 7, "stem": "¿Dónde se encuentra físicamente el centro de control de área (ACC) de Madrid de ENAIRE?", "opts": ["En el propio aeropuerto de Madrid-Barajas", "En Madrid-Cuatro Vientos", "En Getafe", "En Madrid-Torrejón"], "ans": 3, "why": "La página web de la Red ENAIRE nombra la sede como «Centro de Control Aéreo de ENAIRE en Madrid» / «Madrid-Torrejón ACC», distinta del aeropuerto de Barajas.", "src": "ENAIRE, página web de la Red ENAIRE", "note": ""}, {"n": 8, "stem": "Además del ACC de Madrid-Torrejón, ¿en cuál de estos aeropuertos presta ENAIRE directamente ATS (y no solo CNS) en la región Centro-Norte?", "opts": ["Vigo", "Vitoria", "Zaragoza", "A Coruña"], "ans": 1, "why": "Vitoria es uno de los aeropuertos ATS de la región (Asturias, Bilbao, Logroño, Pamplona, Santander, Santiago-TACC, Vitoria); Vigo, Zaragoza y A Coruña reciben de ENAIRE solo CNS, y el ATS/AFIS lo presta SAERCO o no hay ATC.", "src": "ENAIRE, página web de la Red ENAIRE", "note": ""}, {"n": 9, "stem": "En la región Sur, además del ACC de Sevilla, ¿qué aeropuerto recibe ATS directamente de ENAIRE?", "opts": ["Málaga", "Jerez", "Córdoba", "Badajoz"], "ans": 0, "why": "ENAIRE presta ATS en Almería, Granada, Málaga y Melilla en la región Sur; Córdoba, Jerez y Badajoz reciben de ENAIRE solo CNS.", "src": "ENAIRE, página web de la Red ENAIRE", "note": ""}, {"n": 10, "stem": "Si se suman las listas de aeropuertos ATS por región de la propia página web «Red ENAIRE», ¿cuántas ubicaciones ATS resultan, frente a la cifra de «21» que citan tanto el manual como el PV2030?", "opts": ["20, una menos", "25, cuatro más", "Exactamente 21, sin discrepancia", "22, una más"], "ans": 3, "why": "El recuento por regiones suma 22 ubicaciones ATS (recuento derivado propio), una más que el «21» redondo que citan el manual y el PV2030; ningún documento leído explica el origen de la discrepancia.", "src": "derivado de ENAIRE, página web de la Red ENAIRE; compárese con el manual 7 y el PV2030", "note": ""}, {"n": 11, "stem": "¿Qué organización privada presta el Servicio de Control de Aeródromo en Sevilla, Vigo y Madrid/Cuatro Vientos?", "opts": ["SAERCO", "Skyway Air Navigation Services", "AENA", "AESA"], "ans": 0, "why": "La lista de ATC de SAERCO, según el AIP GEN 3.3 vigente, es A Coruña, El Hierro, Fuerteventura, Jerez, La Palma, Lanzarote, Madrid/Cuatro Vientos, Sevilla y Vigo.", "src": "AIP España GEN 3.3, AMDT 401/25 (25-DIC-25)", "note": ""}, {"n": 12, "stem": "¿En cuál de los siguientes aeródromos presta SAERCO el servicio AFIS (Servicio de Información de Vuelo de Aeródromo) en lugar de un ATC completo?", "opts": ["Sevilla", "Vigo", "Burgos/Villafría", "Lanzarote"], "ans": 2, "why": "La lista de AFIS de SAERCO es Burgos/Villafría, Córdoba, El Hierro, Huesca/Pirineos y La Gomera; Sevilla, Vigo y Lanzarote figuran en cambio en la lista de ATC completo de SAERCO.", "src": "AIP España GEN 3.3, AMDT 401/25", "note": ""}, {"n": 13, "stem": "¿Qué organización privada presta el Servicio de Control de Aeródromo en Alicante-Elche, Ibiza y Valencia?", "opts": ["SAERCO", "FerroNATS (que aún opera con ese nombre)", "Skyway Air Navigation Services", "ENAIRE directamente"], "ans": 2, "why": "La lista de ATC de Skyway, según el AIP vigente, es Alicante-Elche, Castellón, Ibiza, Lleida-Alguaire, Murcia, Sabadell y Valencia.", "src": "AIP España GEN 3.3, AMDT 401/25", "note": ""}, {"n": 14, "stem": "¿En qué aeropuerto presta Skyway el servicio AFIS y no un ATC completo?", "opts": ["Sabadell", "Murcia", "Castellón", "Andorra-La Seu d'Urgell"], "ans": 3, "why": "El AFIS de Skyway se presta en Andorra-La Seu d'Urgell durante su operación de uso público; los otros tres figuran en la lista de ATC de Skyway.", "src": "AIP España GEN 3.3, AMDT 401/25", "note": ""}, {"n": 15, "stem": "«Skyway Air Navigation Services» es el nombre actual de una empresa anterior. ¿De cuál?", "opts": ["SAERCO", "FerroNATS", "GroupEAD", "Startical"], "ans": 1, "why": "FerroNATS pasó a llamarse Skyway en febrero de 2023, después de que Serveo (antes Ferrovial Servicios) comprara el 50 % de su socio en la empresa conjunta, NATS Ltd.", "src": "eleconomista.es, actualidadaeroespacial.com, nats.aero, cobertura del cambio de nombre de feb. 2023", "note": ""}, {"n": 16, "stem": "FerroNATS se creó originalmente en 2011 como una empresa conjunta al 50 % entre dos compañías. ¿Cuáles?", "opts": ["Aena e Indra", "Ferrovial Servicios y NATS Ltd (Reino Unido)", "ENAIRE y Serveo", "Indra y Thales"], "ans": 1, "why": "Esta empresa conjunta concurrió a los contratos de las torres de ATS de aeródromo licitados tras la Ley 9/2010, que liberalizó los ATS de aeródromo en España.", "src": "Documento principal del ESPP3; prensa sobre el cambio de nombre de feb. 2023", "note": ""}, {"n": 17, "stem": "Según el Reglamento de Rendimiento y Tarificación del SES, ¿cómo se fijan las tarifas de ATS de aeródromo en Alicante-Elche e Ibiza?", "opts": ["Mediante el mismo esquema de incentivos del RP que se aplica a ENAIRE", "Libremente por la aerolínea que usa el aeropuerto", "Por la CNMC", "En «condiciones de mercado» (licitadas por Aena)"], "ans": 3, "why": "El ESPP3 explica que estos dos aeropuertos, atendidos por el ANSP privado (antes FerroNATS, ahora Skyway), operan en condiciones de mercado, al margen del sistema de tarificación regulado de ENAIRE.", "src": "Documento principal del ESPP3, «Evaluation Report of SES Market Conditions in Spain»", "note": ""}, {"n": 18, "stem": "Según la Memoria de Sostenibilidad 2024, ¿cuántas radioayudas (DME, GBAS, ILS, NDB, VOR) operaba ENAIRE?", "opts": ["92", "168", "301", "135"], "ans": 2, "why": "La infografía de 2024 indica 301 radioayudas, 92 sistemas de vigilancia y 168 centros de comunicaciones: cifras distintas que no deben intercambiarse.", "src": "Memoria de Sostenibilidad 2024, «Instalaciones y equipos»", "note": ""}, {"n": 19, "stem": "¿Cuántos sistemas de vigilancia (ADS-B, MLAT, PSR, SSR, SMR) operaba ENAIRE en 2024?", "opts": ["301", "92", "122", "200"], "ans": 1, "why": "92 sistemas de vigilancia, frente a 301 radioayudas y 122 nodos REDAN: los tres recuentos se confunden con facilidad.", "src": "Memoria de Sostenibilidad 2024", "note": ""}, {"n": 20, "stem": "¿Cuántas posiciones de control de torre declaró ENAIRE para 2024, y cuántas de ellas eran posiciones de torre remota?", "opts": ["200 en total, 10 remotas", "168 en total, 0 remotas", "122 en total, 5 remotas", "135 en total, 5 remotas"], "ans": 3, "why": "135 posiciones de control de torre en total, 5 de ellas de torre remota, distintas de la cifra de 200 posiciones de control de sector.", "src": "Memoria de Sostenibilidad 2024", "note": ""}, {"n": 21, "stem": "¿Qué dos radares actualizó ENAIRE a Modo S en 2024?", "opts": ["Barcelona y Palma", "Valencia y Madrid-Barajas", "Sevilla y Gran Canaria", "Bilbao y San Sebastián"], "ans": 1, "why": "La Memoria de Sostenibilidad 2024 recoge esta actualización a Modo S específicamente para Valencia y Madrid-Barajas, aparte de la renovación del SMR de Barcelona y la del MLAT de Málaga y Palma.", "src": "Memoria de Sostenibilidad 2024", "note": ""}, {"n": 22, "stem": "¿Cuáles son las dos zonas tarifarias de ruta de ENAIRE?", "opts": ["Norte y Sur", "Nacional e internacional", "Civil y militar", "Península y Canarias"], "ans": 3, "why": "España diferencia las tarifas de ruta de Península y de Canarias, con tarifas unitarias distintas.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 23, "stem": "¿Cuál fue la tarifa unitaria de ruta de ENAIRE en 2025 para la Península, sin impuestos?", "opts": ["51,89 EUR", "25,78 EUR", "66,31 EUR", "19,33 EUR"], "ans": 2, "why": "66,31 EUR es la tarifa unitaria de ruta de la Península en vigor desde el 1 de enero de 2025; 51,89 EUR es la tarifa de ruta de Canarias; las otras dos cifras son tarifas por categoría de la tarifa de aproximación.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 24, "stem": "¿Qué exponente se aplica a (MTOW/50) en la fórmula de la tarifa de ruta de ENAIRE?", "opts": ["0,50", "1,00", "0,70", "0,25"], "ans": 0, "why": "Tarifa de ruta = <code>(MTOW/50)^0.5 × (distancia/100) × tarifa unitaria</code>; la fórmula de la tarifa de aproximación usa en cambio el exponente 0,70: un intercambio clásico de trampa de examen.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 25, "stem": "¿Qué exponente se aplica a (MTOW/50) en la fórmula de la tarifa de aproximación de ENAIRE?", "opts": ["0,70", "0,50", "1,50", "0,10"], "ans": 0, "why": "Tarifa de aproximación = <code>(MTOW/50)^0.70 × tarifa unitaria</code>, sin término de distancia (la ruta y el despegue se tratan como un solo servicio).", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 26, "stem": "¿Cuántas categorías de aeropuerto usa ENAIRE para la tarifa de aproximación?", "opts": ["Dos", "Cinco", "Tres", "Cuatro"], "ans": 2, "why": "Categoría 1 (25,78 EUR), Categoría 2 (23,20 EUR) y Categoría 3 (19,33 EUR), según el volumen de tráfico.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 27, "stem": "¿Cuál de estos es un aeropuerto de Categoría 1 para la tarifa de aproximación de ENAIRE de 2025?", "opts": ["Vitoria", "Santiago", "Madrid-Barajas", "Salamanca-Matacán"], "ans": 2, "why": "Madrid-Barajas es de Categoría 1 (25,78 EUR); Santiago es de Categoría 2; Vitoria y Salamanca-Matacán son de Categoría 3.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 28, "stem": "Según la Guía de Tasas 2025, además de a ENAIRE, ¿qué organismos financian las tarifas de ruta de España?", "opts": ["Solo Aena", "La Comisión Europea", "Solo EUROCONTROL", "AESA, AEMET, el Ministerio de Defensa y EUROCONTROL"], "ans": 3, "why": "Es la lista explícita que figura en la sección «Tarifas de ruta» de la guía.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 29, "stem": "¿A qué organización ha delegado España la facturación y el cobro de las tarifas de ruta y de aproximación?", "opts": ["AESA", "El Ministerio de Hacienda", "EUROCONTROL", "La CNMC"], "ans": 2, "why": "La Guía de Tasas lo establece de forma explícita; el Ministerio de Hacienda se ocupa, en cambio, del cobro forzoso de las deudas de derecho público impagadas conforme al art. 28 del RD 160/2023.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 30, "stem": "¿Qué categoría de vuelo está exenta de la tarifa de aproximación de ENAIRE pero NO figura entre las exenciones de la tarifa de ruta?", "opts": ["Vuelos de búsqueda y salvamento", "Vuelos militares españoles", "Vuelos de aduanas y de policía", "Vuelos de menos de 2 toneladas de MTOW"], "ans": 2, "why": "Los vuelos de aduanas y de policía figuran solo en la lista de exenciones de la tarifa de aproximación; las exenciones de vuelos de instrucción, calibración y circulares, en cambio, figuran solo en la lista de la tarifa de ruta.", "src": "Guía de Tasas de Navegación Aérea 2025", "note": ""}, {"n": 31, "stem": "¿Cuánto subieron las tarifas de ruta de ENAIRE en la Península en 2024 respecto a 2023?", "opts": ["+14,7 %", "+9,6 %", "+2,3 %", "+60 %"], "ans": 0, "why": "+14,7 % en la Península (+9,6 % en Canarias) en 2024 frente a 2023; una vez superados los niveles de 2019, el aumento respecto a 2019 fue de solo +2,3 % (Península).", "src": "Memoria de Sostenibilidad 2024", "note": ""}, {"n": 32, "stem": "Si se busca en la Ley 3/2013 (que creó la CNMC) una mención específica a las tarifas de navegación aérea, ¿qué resultado se obtiene?", "opts": ["Asigna expresamente las tarifas de ENAIRE a la supervisión de la CNMC", "No se encontró ninguna mención a tarifas de navegación aérea ni aeronáuticas", "Transfiere las tarifas a AESA", "Suprime las tarifas de ruta"], "ans": 1, "why": "Los sectores de la CNMC que enumera la ley (energía, telecomunicaciones, ferroviario, postal, competencia en general) no mencionan las tarifas de navegación aérea en el texto leído; por tanto, la afirmación del mapa DL07 sobre la supervisión de la CNMC no está confirmada.", "src": "Ley 3/2013", "note": ""}, {"n": 33, "stem": "¿Cuál fue aproximadamente el importe neto de la cifra de negocios de ENAIRE en 2025?", "opts": ["937 M EUR", "353,5 M EUR", "1192,2 M EUR", "601,2 M EUR"], "ans": 2, "why": "1192,2 M EUR en total (Navegación Aérea, 1192,1 M EUR, más Corporativo, 0,1 M EUR); 937 M EUR es la inversión del PV2030, 353,5 M EUR es el EBITDA de 2024 y 601,2 M EUR es el valor del contrato con Aena 2022-2026.", "src": "Informe de Gestión de ENAIRE 2025", "note": ""}, {"n": 34, "stem": "¿Cuál fue el EBITDA de ENAIRE en 2024 y cuánto creció respecto a 2023?", "opts": ["180 M EUR, +12 %", "937 M EUR, +18 %", "272,6 M EUR, -22 %", "353,5 M EUR, +29,7 %"], "ans": 3, "why": "El EBITDA de 2024 fue de 353,5 M EUR frente a 272,6 M EUR en 2023, un aumento de 80,8 M EUR (+29,7 %), muy por encima del objetivo mínimo del PV2030 de 180 M EUR.", "src": "Memoria de Sostenibilidad 2024", "note": ""}, {"n": 35, "stem": "¿Cuáles fueron, aproximadamente, las cifras principales de ENAIRE en 2022 en pasajeros e inversión?", "opts": ["328 millones de pasajeros, 937 M EUR de inversión", "243 millones de pasajeros, 169 M EUR de inversión", "300 millones de pasajeros, 601 M EUR de inversión", "2,47 millones de pasajeros, 25 M EUR de inversión"], "ans": 1, "why": "El Resumen ejecutivo de 2022 indica 243 millones de pasajeros y 169 M EUR invertidos (+36 % respecto al año anterior).", "src": "Resumen ejecutivo 2022", "note": ""}, {"n": 36, "stem": "¿Cuánto aumentaron los ingresos de ENAIRE en 2022 respecto a 2021, y a qué proporción del tráfico de 2019 se había recuperado?", "opts": ["+281,6 M€ (+60 %); 92 % de los niveles de 2019", "+80,8 M€ (+29,7 %); 100 % de los niveles de 2019", "+14,7 %; 75 % de los niveles de 2019", "+937 M€; 50 % de los niveles de 2019"], "ans": 0, "why": "Son las cifras exactas de 2022 del Resumen ejecutivo; las demás opciones mezclan cifras ajenas (crecimiento del EBITDA, subida de la tarifa de ruta, inversión del PV2030).", "src": "Resumen ejecutivo 2022", "note": ""}, {"n": 37, "stem": "¿Qué empresa tiene entre sus accionistas a ENAV (Italia) y no a ENAIRE (España), una clásica trampa de nombres?", "opts": ["Startical", "Aireon", "CRIDA", "ESSP SAS"], "ans": 1, "why": "Los accionistas ANSP de Aireon son NAV CANADA, ENAV (Italia), la Irish Aviation Authority, Naviair y NATS; ENAIRE no está entre ellos, a pesar de la casi identidad de los nombres «ENAV» y «ENAIRE».", "src": "Prensa sobre los accionistas de Aireon, 2026", "note": ""}, {"n": 38, "stem": "¿Con qué socios es el trabajo confirmado de Searidge Technologies en torres remotas en España (aeropuerto de Vigo)?", "opts": ["ENAIRE e Indra", "EUROCONTROL y Startical", "AESA y CRIDA", "Aena y FerroNATS/Skyway"], "ans": 3, "why": "Ninguna fuente hallada nombra a Searidge como socio de ENAIRE; su trabajo confirmado en España es con el operador aeroportuario Aena y con el ANSP de torres FerroNATS/Skyway.", "src": "Prensa sobre Searidge/Aena/FerroNATS, torre digital de Vigo", "note": ""}, {"n": 39, "stem": "¿Qué empresa está confirmada como socio tecnológico propio de ENAIRE para su trabajo en torres digitales/remotas y para la alianza iTEC?", "opts": ["Searidge", "Thales", "Indra", "Frequentis"], "ans": 2, "why": "El PV2030 y la página web de iTEC SkyNex nombran a Indra como socio tecnológico de ENAIRE, no a Searidge ni a Thales.", "src": "PV2030 (notas base); página web de iTEC SkyNex de ENAIRE", "note": ""}, {"n": 40, "stem": "¿Es ENAIRE miembro de la alianza COOPANS?", "opts": ["Sí, como miembro fundador", "Sí, desde 2021", "No: ninguna fuente de ENAIRE menciona COOPANS", "No, pero prevé incorporarse en 2027"], "ans": 2, "why": "Ningún documento de la biblioteca propia de ENAIRE menciona COOPANS; la alianza confirmada de ENAIRE es iTEC SkyNex, basada en tecnología distinta (Indra) del sistema de COOPANS, basado en Thales.", "src": "DL07-map; ausencia confirmada en todo el conjunto de fuentes de T07a", "note": ""}, {"n": 41, "stem": "¿Cuántos ANSP forman la alianza iTEC SkyNex y quién es el socio tecnológico designado?", "opts": ["5 ANSP, Thales", "8 ANSP, Indra", "6 ANSP, Frequentis", "10 ANSP, sin socio tecnológico"], "ans": 1, "why": "DFS, Avinor, Oro Navigacija, PANSA, LVNL, ENAIRE, NATS y NAV Canada (8 ANSP), con Indra como socio tecnológico.", "src": "Página web de iTEC SkyNex de ENAIRE", "note": ""}, {"n": 42, "stem": "¿Cuándo se puso en marcha el programa iTEC SkyNex y qué escala de espacio aéreo y tráfico gestiona la alianza?", "opts": ["2015; 10 millones de km², 5 millones de vuelos/año", "2025; 50 millones de km², 20 millones de vuelos/año", "2018; 5 millones de km², 2 millones de vuelos/año", "2021; más de 26 millones de km², más de 12 millones de vuelos/año"], "ans": 3, "why": "Son las cifras exactas que figuran en la página web de iTEC SkyNex de ENAIRE.", "src": "Página web de iTEC SkyNex de ENAIRE", "note": ""}, {"n": 43, "stem": "¿Cuál es la diferencia clave entre «Skyway» y «SkyNex» en el entorno profesional de ENAIRE?", "opts": ["Son la misma organización con dos nombres", "Skyway es un ANSP privado de torres; SkyNex es el programa de alianza tecnológica iTEC propio de ENAIRE", "Skyway es la academia de formación de ENAIRE; SkyNex es un modelo de radar", "Ambos se refieren al mismo sistema por satélite EGNOS"], "ans": 1, "why": "Skyway (antes FerroNATS) es un ANSP privado español que presta ATC de aeródromo en varias torres; SkyNex es el programa de alianza iTEC, sin relación con él, que ENAIRE desarrolla con Indra y otros siete ANSP.", "src": "AIP GEN 3.3; página web de iTEC SkyNex de ENAIRE", "note": ""}, {"n": 44, "stem": "¿Qué servicio enumera la Carta de Servicios 2025-2027 de ENAIRE que omite el manual oficial del tema 7 (nov. 2024)?", "opts": ["ATFM", "El Servicio de Dirección de Plataforma (SDP)", "AIS", "CNS"], "ans": 1, "why": "La Carta de Servicios (feb. 2025, más reciente que el manual de nov. 2024) añade el SDP (Servicio de Dirección de Plataforma) como séptimo servicio junto a los seis del manual.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 45, "stem": "¿Qué hace el Servicio de Dirección de Plataforma (SDP) de ENAIRE?", "opts": ["Diseña procedimientos de vuelo", "Gestiona el espacio aéreo de drones", "Certifica la formación de controladores", "Dirige la actividad y el movimiento de aeronaves y vehículos en una plataforma aeroportuaria"], "ans": 3, "why": "Es la definición de la Carta de Servicios 2025-2027: «Servicio prestado para dirigir las actividades y el movimiento de las aeronaves y vehículos en una plataforma aeroportuaria»; el FPD (diseño de procedimientos de vuelo) y el U-space/drones son servicios distintos.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 46, "stem": "¿Qué números de certificado corresponden a las certificaciones ISO 9001 e ISO 14001 de ENAIRE, ambas emitidas por AENOR?", "opts": ["ER-1034/2007 (ISO 9001) y GA-2005/0575 (ISO 14001)", "SST-0156/2014 (ISO 9001) y ENS-2018/0006 (ISO 14001)", "CEG/24/S600/6 (ISO 9001) y PFTAC-10 (ISO 14001)", "ENS-2020/0020 (ISO 9001) y ER-1034/2007 (ISO 14001)"], "ans": 0, "why": "ER-1034/2007 es el certificado ISO 9001 (calidad); GA-2005/0575 es el certificado ISO 14001 (medio ambiente); SST-0156/2014 es la ISO 45001; CEG/24/S600/6 es el sello EFQM 600; PFTAC-10 es el certificado de formación.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 47, "stem": "¿Cuándo obtuvo ENAIRE el sello EFQM 600 y con qué código de certificado?", "opts": ["2023, ER-1034/2007", "2024, CEG/24/S600/6", "2025, ENS-2020/0020", "2022, PFTAC-10"], "ans": 1, "why": "Concedido en 2024 por el Club de Excelencia en Gestión, con el certificado CEG/24/S600/6, basado en el modelo EFQM 2020.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 48, "stem": "El certificado PFTAC-10 de formación de controladores de ENAIRE abarca cuatro tipos de formación. ¿Cuáles?", "opts": ["Formación de unidad, formación continua, formación de instructor práctico y formación de evaluador", "Solo la formación inicial para la licencia", "Solo la formación en lengua inglesa", "Solo la formación de máster"], "ans": 0, "why": "El PFTAC-10, emitido por AESA conforme al Reglamento (UE) 2015/340, abarca la Formación de Unidad ATCO, la Formación Continua ATCO, la Formación de Instructor práctico y la Formación de Evaluador.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 49, "stem": "¿Cuál es el objetivo de la Carta de Servicios de ENAIRE para el Nivel Ponderado de Seguridad (NPS) en 2027?", "opts": ["≤ 11,00", "≤ 12,15", "≤ 13,30", "≤ 8,5"], "ans": 0, "why": "Los objetivos de la Carta de Servicios son ≤13,30 (2025), ≤12,15 (2026) y ≤11,00 (2027), una progresión más exigente que el propio objetivo del PV2030 para 2026, ≤12,8.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 50, "stem": "Según la Carta de Servicios, ¿qué porcentaje de los vuelos en los cinco principales aeropuertos de España debe cumplir su ventana horaria prevista ETOT/CTOT?", "opts": ["Al menos el 75 %", "Exactamente el 50 %", "Al menos el 99 %", "Al menos el 90 %"], "ans": 3, "why": "El compromiso de puntualidad es: «Al menos el 90% de los vuelos cumplirá su ventana horaria prevista de despegue (ETOT/CTOT), en los cinco principales aeropuertos españoles».", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 51, "stem": "Según la Carta de Servicios, ¿qué compromiso de continuidad (MTBO) asume ENAIRE para los servicios de su Sistema de Navegación Aérea?", "opts": ["Al menos el 97 % de los servicios con continuidad superior a 1000 horas", "El 100 % de los servicios con continuidad superior a 500 horas", "Al menos el 50 % de los servicios con continuidad superior a 2000 horas", "No asume ningún compromiso de continuidad"], "ans": 0, "why": "Este compromiso exacto («Asegurar que al menos el 97% de los servicios del Sistema de Navegación Aérea tengan una continuidad superior a 1.000 horas (MTBO)») figura junto al compromiso de que el 99 % de los servicios tengan una disponibilidad superior al 95 %.", "src": "Carta de Servicios 2025-2027", "note": ""}, {"n": 52, "stem": "En la fórmula del valor de la hora del III Convenio Colectivo, HO = (SB+CPT+CA+CAFP+CNP+CPAF)/CCE, ¿cuál es el valor fijo de CCE?", "opts": ["1595", "1711", "1470", "1000"], "ans": 2, "why": "CCE (Coeficiente de Cálculo Estimado) = 1470; 1595 y 1711 son, en cambio, los topes de horas anuales de la jornada a turnos y de la jornada ordinaria, respectivamente.", "src": "III Convenio Colectivo, art. 136", "note": ""}, {"n": 53, "stem": "En el III Convenio, ¿qué representa «CPT» (Complemento de Puesto de Trabajo)?", "opts": ["Un complemento salarial que varía según el grupo de dependencias y el puesto específico", "Una categoría profesional del personal", "El número de licencia del controlador", "Un tipo de jornada a turnos"], "ans": 0, "why": "El CPT es un componente retributivo de la fórmula del valor de la hora, fijado por «Grupo de Dependencias» (1 a 8) y por puesto específico; no es una categoría del personal.", "src": "III Convenio Colectivo, art. 136 y el ejemplo del CPT del Grupo 8", "note": ""}, {"n": 54, "stem": "Según el III Convenio, ¿cuál es el máximo anual de horas de jornada a turnos para los CTA, antes de la ampliación por formación?", "opts": ["1711 horas", "1595 horas", "2080 horas", "1470 horas"], "ans": 1, "why": "1595 horas/año es el tope de la jornada a turnos, ampliable en 20 horas por formación; 1711 horas/año es, en cambio, la jornada ordinaria (sin turnos).", "src": "III Convenio Colectivo, art. 29", "note": ""}, {"n": 55, "stem": "Según el III Convenio, ¿cuál es el porcentaje máximo combinado de servicios nocturnos y festivos sobre el total de servicios anuales de un CTA?", "opts": ["50 %", "20 %", "33 %", "10 %"], "ans": 2, "why": "El art. 40 limita los servicios nocturnos y festivos, conjuntamente, al 33 % del total de servicios anuales; un servicio cuenta como «festivo» si la mayor parte cae entre las 14:00 del sábado y las 23:59 del domingo.", "src": "III Convenio Colectivo, art. 40", "note": ""}, {"n": 56, "stem": "Según el artículo de definiciones del III Convenio, ¿qué consigna una «Anotación de Unidad»?", "opts": ["El grupo salarial del controlador", "La clase del certificado médico del controlador", "El número de antigüedad del controlador", "El indicador de lugar OACI y el sector, grupo de sectores o puestos en los que el titular de la licencia es competente para trabajar"], "ans": 3, "why": "Es la definición literal del III Convenio, distinta de la «Anotación de competencia lingüística» o de las anotaciones de instructor OJTI/STDI.", "src": "III Convenio Colectivo, artículo de Definiciones", "note": ""}],U={"lang": "es", "content       e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
