const Q=[{"n": 1, "stem": "¿Qué ley creó la Entidad Pública Empresarial Aeropuertos españoles y Navegación Aérea (Aena EPE), que después pasó a denominarse ENAIRE?", "opts": ["La Ley 9/2010, sobre la liberalización de los servicios de tránsito aéreo de aeródromo", "La Ley 18/2014, de medidas urgentes para el crecimiento, la competitividad y la eficiencia", "El artículo 82 de la Ley 4/1990, de Presupuestos Generales del Estado para 1990", "El Real Decreto 160/2023, por el que se aprueba el Estatuto de la entidad"], "ans": 2, "why": "El manual 7 (capítulo 1) dice que Aena EPE fue creada por el «artículo 82 de la Ley 4/1990 de 29 de junio, de Presupuestos Generales del Estado para 1990». La Ley 18/2014 la rebautizó como ENAIRE; la Ley 9/2010 liberalizó los ATS de aeródromo; el RD 160/2023 no aparece en el manual.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 2, "stem": "Según el manual 7, ¿qué ley cambió el nombre de Aena EPE por el de ENAIRE?", "opts": ["La Ley 18/2014, de 15 de octubre", "La Ley 4/1990, de 29 de junio", "La Ley 9/2010", "La Ley 40/2015"], "ans": 0, "why": "El cambio de nombre lo hizo la Ley 18/2014, de 15 de octubre (medidas urgentes para el crecimiento, la competitividad y la eficiencia). La Ley 4/1990 creó la entidad.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 3, "stem": "Según la cronología «Historia» del manual 7, ¿qué ocurrió en 2013?", "opts": ["Aena Aeropuertos S.A. se separó de la entidad pública", "Un acuerdo entre España y Portugal para el desarrollo del bloque funcional SW FAB", "El capital privado entró en el 49 % de Aena S.A.", "Aena pasó a denominarse ENAIRE"], "ans": 1, "why": "2013: «Se firma el Acuerdo entre los estados de España y Portugal para el desarrollo del bloque funcional SW FAB». La separación es de 2011, el cambio de nombre de 2014 y la entrada del capital privado de 2015.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 4, "stem": "Tras la entrada del capital privado en 2015, ¿qué porcentaje de Aena S.A. conservó ENAIRE, según el manual 7?", "opts": ["49 %", "33 %", "66,66 %", "51 %"], "ans": 3, "why": "El capital privado entró en el 49 % de la sociedad y ENAIRE mantiene el 51 % del accionariado. El 49 % es la participación privada; el 66,66 % es la participación de ENAIRE en CRIDA.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología, y capítulo 1.1.2, p. 8", "note": ""}, {"n": 5, "stem": "Según la cronología del manual 7, ¿qué se firmó el 23 de diciembre de 2016?", "opts": ["Un nuevo Acuerdo ENAIRE-Aena S.A. de prestación de servicios de navegación aérea, por un periodo de 5 años", "El acuerdo entre los estados de España y Portugal para el desarrollo del bloque funcional SW FAB", "El III Convenio Colectivo profesional de Controladores de Tránsito Aéreo, por un periodo de 5 años", "El acuerdo de constitución de la Fundación ENAIRE y de su patronato"], "ans": 0, "why": "La entrada de 2016 dice: «Nuevo Acuerdo ENAIRE-Aena S.A., de prestación de servicios de navegación aérea firmado el 23 de diciembre de 2016 por un periodo de 5 años».", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 6, "stem": "¿Cuál de las siguientes era una de las seis palabras con «+» del Plan de Vuelo 2020 (2017-2020) que muestra la cronología del manual 7?", "opts": ["+Rápidos", "+Digitales", "+Puntuales", "+Innovadores"], "ans": 2, "why": "Las seis palabras son +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 7, "stem": "Según el manual 7, ¿qué extensión de espacio aéreo gestiona ENAIRE?", "opts": ["2190 km²", "2 190 000 km²", "1 370 000 km²", "21 900 000 km²"], "ans": 1, "why": "El manual 7 dice «2.190.000 kilómetros cuadrados» (texto y recuadro del mapa). Los 1 370 000 km² son la superficie del ACC de Gran Canaria por sí solo.", "src": "Manual 7 (nov. 2026), capítulo 1.1, pp. 5-6", "note": ""}, {"n": 8, "stem": "Por volumen de tráfico, ¿qué posición ocupa ENAIRE en Europa según el manual 7?", "opts": ["La primera", "La segunda", "La tercera", "La cuarta"], "ans": 3, "why": "El manual dice que ENAIRE es «el principal proveedor de servicios de navegación aérea y de información aeronáutica en España, el cuarto en Europa por volumen de tráfico y uno de los más importantes a nivel mundial».", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 9, "stem": "¿En qué año designó el Estado a ENAIRE Operador de Infraestructuras Críticas?", "opts": ["2015", "2014", "2019", "2010"], "ans": 0, "why": "Operador de Infraestructuras Críticas: 2015. Operador de Servicios Esenciales: 2019.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6", "note": ""}, {"n": 10, "stem": "¿En qué año fue designada ENAIRE Operador de Servicios Esenciales?", "opts": ["2015", "2016", "2019", "2023"], "ans": 2, "why": "2019 (la designación como Operador de Infraestructuras Críticas fue en 2015).", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6", "note": ""}, {"n": 11, "stem": "En el esquema institucional del manual 7, ¿qué papel se asigna a la Agencia Estatal de Seguridad Aérea (AESA)?", "opts": ["Regulador que diseña la estrategia de la política aeronáutica", "Supervisor del cumplimiento de la normativa de la aviación civil en España", "Proveedor nacional de servicios de navegación aérea", "Proveedor de servicios meteorológicos para la aviación"], "ans": 1, "why": "AESA es el «supervisor del cumplimiento de la normativa de la aviación civil en España». El regulador es la Dirección General de Aviación Civil y el proveedor nacional es ENAIRE.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5, figura", "note": ""}, {"n": 12, "stem": "¿Cuáles son las tres regiones de información de vuelo (FIR) que muestra el manual 7?", "opts": ["Madrid, Barcelona y Sevilla", "Madrid, Palma y Canarias", "Barcelona, Sevilla y Canarias", "Madrid, Barcelona y Canarias"], "ans": 3, "why": "El mapa recoge «3 Regiones de Información de Vuelo (FIR) Madrid, Barcelona y Canarias». Sevilla y Palma son ACC (centros de control), no FIR.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 13, "stem": "¿Cuáles son los dos centros de control de área terminal (TACC) que muestra el mapa del manual 7?", "opts": ["Santiago y Valencia", "Málaga y Valencia", "Bilbao y Santiago", "Valencia y Palma"], "ans": 0, "why": "El mapa indica «2 TACCs Centros de Control de Area Terminal: Santiago y Valencia».", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 14, "stem": "¿Qué ACC tiene la mayor superficie en el mapa del manual 7?", "opts": ["Madrid (435 000 km²)", "Barcelona (266 000 km²)", "Gran Canaria (1 370 000 km²)", "Sevilla (179 000 km²)"], "ans": 2, "why": "Gran Canaria, 1 370 000 km²; el más pequeño es Palma (51 400 km²).", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 15, "stem": "¿Qué pareja de región y centro de control es correcta en el manual 7?", "opts": ["Balear / Barcelona", "Sur / Sevilla", "Este / Madrid", "Centro-Norte / Palma"], "ans": 1, "why": "Las cinco que imprime el mapa son Centro-Norte / Madrid, Este / Barcelona, Sur / Sevilla, Canaria / Gran Canaria y Balear / Palma.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 16, "stem": "Según el manual 7, ¿a cuántas personas transportó en 2023 el tráfico aéreo atendido por ENAIRE?", "opts": ["Más de 28 millones", "Más de 128 millones", "Más de 228 millones", "Más de 328 millones"], "ans": 3, "why": "Manual 7: «El tráfico aéreo atendido por ENAIRE, más de 2 millones de vuelos, transportó a más de 328 millones de personas en el año 2023». La edición de nov. 2026 mantiene la cifra de 2023.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 17, "stem": "En el organigrama del manual 7 (capítulo 1.1.1), ¿quién aparece directamente por encima del Director General?", "opts": ["El Presidente", "La Secretaria General", "El Director de Servicios de Navegación Aérea", "El Ministro de Transportes"], "ans": 0, "why": "El organigrama sitúa al Presidente (José Antonio Santano Clavero) en la cúspide, por encima del Director General (Enrique Maurer Somolinos); el Director de Servicios de Navegación Aérea está por debajo del Director General.", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7", "note": ""}, {"n": 18, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en CRIDA?", "opts": ["36 %", "45,85 %", "66,66 %", "50 %"], "ans": 2, "why": "CRIDA 66,66 %; STARTICAL 50 %; Ineco 45,85 %; Grupo EAD 36 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 19, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en STARTICAL?", "opts": ["66,66 %", "45,85 %", "36 %", "50 %"], "ans": 3, "why": "STARTICAL 50 %. Las demás: CRIDA 66,66 %, Ineco 45,85 %, Grupo EAD 36 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 20, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en Ineco?", "opts": ["45,85 %", "50 %", "66,66 %", "51 %"], "ans": 0, "why": "Ineco 45,85 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 21, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en el Grupo EAD?", "opts": ["45,85 %", "36 %", "50 %", "66,66 %"], "ans": 1, "why": "Grupo EAD 36 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 22, "stem": "En la figura del grupo empresarial del manual 7, ¿qué dos entidades figuran como «Participación mayoritaria de ENAIRE»?", "opts": ["Ineco y Startical", "Startical y Grupo EAD", "Aena e Ineco", "Aena y CRIDA"], "ans": 3, "why": "Aena (51 %) y CRIDA (66,66 %) son participaciones mayoritarias; Ineco (45,85 %), GroupEAD (36 %) y Startical (50 %) son «Participadas ENAIRE».", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8, figura", "note": ""}, {"n": 23, "stem": "Según el manual 7, ¿a qué se dedica la Fundación ENAIRE?", "opts": ["A formar a los nuevos controladores de tránsito aéreo y a gestionar el Máster de ENAIRE", "A gestionar la red de aeropuertos de interés general junto con Aena S.A.", "A gestionar, conservar y difundir el patrimonio artístico de la entidad y a fomentar la cultura aeronáutica", "A financiar proyectos de investigación aeronáutica y la innovación del sector"], "ans": 2, "why": "Es la redacción del manual 7 (capítulo 1.1.2): «dedicada a gestionar, conservar y difundir el patrimonio artístico de la entidad, así como a fomentar, divulgar e impulsar la cultura aeronáutica en la sociedad».", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 24, "stem": "Según el manual 7, ¿qué proporción de la plantilla de ENAIRE son controladores de tránsito aéreo?", "opts": ["Alrededor del 49 %", "Alrededor del 26 %", "Alrededor del 20 %", "Alrededor del 5 %"], "ans": 0, "why": "Controladores, alrededor del 49 %; Gestión, 26 %; Ingeniería y Explotación Técnica, 20 %; Operaciones, 5 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 25, "stem": "Según el manual 7, ¿cuál es la proporción aproximada del personal de «Ingeniería y Explotación Técnica»?", "opts": ["Alrededor del 5 %", "Alrededor del 20 %", "Alrededor del 26 %", "Alrededor del 49 %"], "ans": 1, "why": "Sobre un 20 % (personal técnico y de ingeniería dedicado al mantenimiento y explotación técnica y al desarrollo de los sistemas e instalaciones de navegación aérea).", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 26, "stem": "En el manual 7, ¿qué personal pertenece a la ocupación «Operaciones» (sobre un 5 %)?", "opts": ["El personal dedicado a tareas de administración y gestión de la empresa", "El personal de mantenimiento y explotación técnica de los sistemas de navegación aérea", "Los controladores de tránsito aéreo de los centros de control y de las torres", "El personal de información aeronáutica, planes de vuelo y apoyo a la gestión de los ATS"], "ans": 3, "why": "Operaciones = «personal dedicado a información aeronáutica, planes de vuelo y apoyo a la gestión de los servicios de tránsito aéreo ATS». La administración es «Gestión» y el mantenimiento es «Ingeniería y Explotación Técnica».", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 27, "stem": "Según el manual 7, ¿qué dos convenios colectivos existen en ENAIRE?", "opts": ["El II Convenio de Controladores y el II Convenio del Grupo Aena", "El I Convenio de Controladores y el III Convenio del Grupo Aena", "El III Convenio de Controladores de Tránsito Aéreo y el I Convenio del Grupo Aena", "El III Convenio de Controladores y el III Convenio del Grupo Aena"], "ans": 2, "why": "III Convenio Colectivo profesional de Controladores de Tránsito Aéreo e I Convenio Colectivo del Grupo Aena (personal no controlador).", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 28, "stem": "Según el manual 7, ¿a qué personal se aplica el «I Convenio Colectivo del Grupo Aena»?", "opts": ["Al personal no controlador", "Solo a los controladores de los aeropuertos de Aena", "Solo a los gestores de los aeropuertos de Aena", "Al personal de las filiales"], "ans": 0, "why": "Abarca al personal no controlador (técnicos de mantenimiento, operaciones, sistemas, seguridad, personas, jurídico, económico-administrativo, etc.).", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 29, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito se sitúan los operadores de drones?", "opts": ["Personas", "Clientes", "Sociedad", "Partners / Proveedores"], "ans": 1, "why": "El «Ámbito CLIENTES» incluye las asociaciones de compañías de aviación comercial, las compañías aéreas y sus pilotos, los gestores aeroportuarios, las asociaciones de aviación no comercial y los operadores de drones.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 30, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito aparece la Agencia Estatal de Meteorología (AEMET)?", "opts": ["Clientes", "Reguladores / Administraciones públicas", "Sociedad", "Partners / Proveedores"], "ans": 3, "why": "AEMET está en «Partners / Proveedores»; EASA, AESA y el Ejército del Aire y del Espacio están en «Reguladores / Administraciones públicas».", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 31, "stem": "¿Cuál es el Propósito de ENAIRE en el Plan de Vuelo 2025 que cita el manual 7?", "opts": ["«Conectamos España con el mundo de forma segura»", "«Cuidamos de tu vuelo para que sea seguro, eficiente y sostenible»", "«Cuidamos de tu vuelo para que sea seguro, rápido, eficiente y sostenible»", "«Somos el cielo de España, seguro y sostenible»"], "ans": 2, "why": "El propósito del manual tiene cuatro adjetivos, entre ellos «rápido». La opción B es la redacción del Plan de Vuelo 2030 (sin «rápido»).", "src": "Manual 7 (nov. 2026), capítulo 1.2.1, p. 11", "note": ""}, {"n": 32, "stem": "Completa el Propósito del Plan de Vuelo 2025: «Cuidamos de tu vuelo para que sea seguro, ___, eficiente y sostenible».", "opts": ["rápido", "puntual", "competitivo", "digital"], "ans": 0, "why": "Los cuatro adjetivos son seguro, rápido, eficiente y sostenible.", "src": "Manual 7 (nov. 2026), capítulo 1.2.1, p. 11", "note": ""}, {"n": 33, "stem": "Según el manual 7, ¿en qué tres elementos se basa la Visión de ENAIRE (Plan de Vuelo 2025)?", "opts": ["Seguridad, calidad y sostenibilidad", "Las personas, la innovación y la digitalización", "Clientes, capacidad y coste-eficiencia", "Profesionales, innovación y tecnología"], "ans": 1, "why": "«basándonos en las personas, la innovación y la digitalización». La opción D es la redacción del Plan de Vuelo 2030.", "src": "Manual 7 (nov. 2026), capítulo 1.2.3, p. 11", "note": ""}, {"n": 34, "stem": "¿Cómo se organizan los valores de ENAIRE en el manual 7?", "opts": ["6 valores en 2 grupos", "8 valores en 4 grupos", "9 valores en 3 grupos", "12 valores en 4 grupos de 3"], "ans": 3, "why": "Cuatro grupos («La seguridad es lo primero»; «Comprometidos con los clientes y la sociedad»; «Somos un solo y gran equipo»; «\"Hambre\" de mejora de nuestra organización») de tres valores cada uno.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 35, "stem": "¿Cuál de los siguientes NO es el título de un grupo de valores en el manual 7?", "opts": ["La seguridad es lo primero", "Comprometidos con los clientes y la sociedad", "\"Hambre\" de mejora de nuestra organización", "Perseguimos la excelencia"], "ans": 3, "why": "«Perseguimos la excelencia» es el título del grupo 4 del Plan de Vuelo 2030; en el manual el grupo 4 es «\"Hambre\" de mejora de nuestra organización».", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11; resumen del PV2030", "note": ""}, {"n": 36, "stem": "En el manual 7, ¿a qué grupo de valores pertenece «Actitud de confianza y \"cultura justa\"»?", "opts": ["Somos un solo y gran equipo", "Comprometidos con los clientes y la sociedad", "La seguridad es lo primero", "\"Hambre\" de mejora de nuestra organización"], "ans": 2, "why": "El grupo 1 contiene En nuestro ADN, Actitud de confianza y «cultura justa» y Refuerzo e impulso de la Seguridad.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 37, "stem": "¿Qué valor del manual 7 se define como actuar «con ética, honestidad y transparencia en el desempeño de nuestro trabajo»?", "opts": ["Somos ENAIRE", "La integridad es nuestro carácter", "Respetamos y confiamos", "Somos empáticos"], "ans": 1, "why": "«La integridad es nuestro carácter» (grupo 3, Somos un solo y gran equipo). «Respetamos y confiamos» menciona la generosidad y la humildad.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 38, "stem": "En el manual 7, ¿a qué grupo pertenece el valor «Somos proactivos»?", "opts": ["La seguridad es lo primero", "Comprometidos con los clientes y la sociedad", "Somos un solo y gran equipo", "\"Hambre\" de mejora de nuestra organización"], "ans": 3, "why": "El grupo 4 contiene Somos innovadores, Flexibles ante los cambios y Somos proactivos («Con implicación e iniciativa construimos el futuro de ENAIRE»).", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 39, "stem": "¿Cuál de los siguientes NO es uno de los tres valores del grupo «Somos un solo y gran equipo» en el manual 7?", "opts": ["Somos proactivos", "Somos ENAIRE", "La integridad es nuestro carácter", "Respetamos y confiamos"], "ans": 0, "why": "Los tres valores son Somos ENAIRE, La integridad es nuestro carácter y Respetamos y confiamos. «Somos proactivos» está en el grupo 4.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 40, "stem": "¿Cuántos objetivos estratégicos tiene el Plan de Vuelo 2025 en el manual 7?", "opts": ["4", "5", "6", "8"], "ans": 2, "why": "Seis objetivos (capítulo 1.2.5).", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, pp. 11-12", "note": ""}, {"n": 41, "stem": "¿Qué objetivo estratégico del manual 7 habla de «recuperación económica y viabilidad futura» y de superar la crisis?", "opts": ["El objetivo 3", "El objetivo 5", "El objetivo 4", "El objetivo 6"], "ans": 1, "why": "Objetivo 5: «Asegurar la recuperación económica y viabilidad futura de ENAIRE, y aumentar la eficiencia, productividad y, por tanto, la competitividad de la empresa para superar la crisis».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 42, "stem": "¿A qué elementos presta especial atención el objetivo 1 del Plan de Vuelo 2025 en el manual 7?", "opts": ["Desarrollo del negocio, internacionalización y liberalización", "Digitalización, modernización del espacio aéreo y conceptos operativos", "Descarbonización e impacto medioambiental", "Cultura de seguridad, factor humano y ciberseguridad"], "ans": 3, "why": "Objetivo 1: reforzar continuamente la seguridad, «prestando especial atención a la cultura de seguridad, al factor humano y a la ciberseguridad ante los nuevos riesgos emergentes». B es el objetivo 2; C es el objetivo 3; A es el objetivo 4.", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 11", "note": ""}, {"n": 43, "stem": "¿Qué objetivo del manual 7 aspira a la «movilidad sostenible en el sector», minimizando el impacto medioambiental e impulsando la descarbonización?", "opts": ["El objetivo 1", "El objetivo 2", "El objetivo 3", "El objetivo 6"], "ans": 2, "why": "Objetivo 3: «Contribuir a la movilidad sostenible en el sector, minimizando el impacto de la actividad de ENAIRE en el medioambiente e impulsando su descarbonización».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 44, "stem": "Según el manual 7, ¿quién creó la iniciativa del Cielo Único Europeo (SES) y en qué año?", "opts": ["La Comisión Europea, en 1999", "El Parlamento Europeo, en 2004", "EUROCONTROL, en 1960", "El Consejo de la UE, en 2009"], "ans": 0, "why": "«La iniciativa del Cielo Único Europeo (SES, Single European Sky), creada por la Comisión Europea en 1999». El paquete SES I es de 2004 y el SES II de 2009.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12", "note": ""}, {"n": 45, "stem": "¿Qué dos objetivos da el manual 7 para el Cielo Único Europeo?", "opts": ["Aumentar la capacidad de los aeropuertos y armonizar las tasas de navegación aérea de los Estados", "Crear una licencia única de controlador europeo y un único proveedor de servicios para toda la Unión", "Reducir las emisiones de la aviación y transferir el control del espacio aéreo superior a EUROCONTROL", "Mejorar la prestación de los servicios de navegación aérea y reducir la fragmentación del espacio aéreo europeo"], "ans": 3, "why": "Son los puntos a y b del capítulo 1.3: a) la mejora en la prestación de los servicios de navegación aérea en términos de capacidad, seguridad, coste-eficiencia y medio ambiente; b) la reducción de la fragmentación del espacio aéreo europeo.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12", "note": ""}, {"n": 46, "stem": "¿Cuántos proveedores de servicios de navegación aérea (ANSP) y centros de control de tránsito aéreo muestra el mapa de Europa del manual 7?", "opts": ["27 proveedores y 44 centros", "38 proveedores y 63 centros", "63 proveedores y 38 centros", "44 proveedores y 27 centros"], "ans": 1, "why": "«38 Proveedores de Servicio de Navegación Aérea; 63 Centros de Control de Tráfico Aéreo».", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12, figura", "note": ""}, {"n": 47, "stem": "Según el manual 7, ¿en qué años se aprobaron y entraron en vigor los paquetes SES I y SES II?", "opts": ["SES I en 1999 y SES II en 2004", "SES I en 2004 y SES II en 2020", "SES I en 2004 y SES II en 2009", "SES I en 2009 y SES II en 2014"], "ans": 2, "why": "SES I en 2004; SES II en 2009; la Comisión Europea retomó SES2+ a finales de 2020.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 48, "stem": "Según el manual 7, ¿qué cuatro áreas abarca el sistema europeo de rendimientos?", "opts": ["Seguridad, Coste-Eficiencia, Capacidad y Medioambiente", "Seguridad, Calidad, Puntualidad y Coste", "Capacidad, Medioambiente, Innovación y Seguridad", "Eficiencia, Sostenibilidad, Digitalización y Personas"], "ans": 0, "why": "Seguridad, Coste-Eficiencia, Capacidad y Medioambiente, «con un esquema de incentivos y penalizaciones asociado».", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 49, "stem": "Según la figura del manual 7, ¿cuáles son las fechas del segundo periodo de referencia (RP2)?", "opts": ["2012-2014", "2020-2024", "2025-2029", "2015-2019"], "ans": 3, "why": "RP1 2012-2014; RP2 2015-2019; RP3 2020-2024; RP4 2025-2029.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13, figura", "note": ""}, {"n": 50, "stem": "Según el manual 7 (nov. 2026), ¿qué periodo de referencia del sistema de rendimientos es el «actual»?", "opts": ["De 2015 a 2019", "De 2020 a 2024", "De 2025 a 2029", "De 2012 a 2014"], "ans": 2, "why": "La edición de nov. 2026 dice: «el período actual se extiende desde 2025 hasta 2029» (RP4). La edición anterior (nov. 2024) decía 2020-2024; esa respuesta ya no vale.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 51, "stem": "¿Cuál de los siguientes NO es uno de los servicios para los que ENAIRE está certificada en el manual 7 (capítulo 1.4)?", "opts": ["Gestión de afluencia del tránsito aéreo (ATFM)", "Diseño de procedimientos de vuelo (FPD)", "Servicio meteorológico aeronáutico (MET)", "Servicio de información aeronáutica (AIS)"], "ans": 2, "why": "Los seis servicios son ATS, CNS, AIS, ATFM, ASM local y FPD. La meteorología no figura (AEMET aparece como partner en la figura de grupos de interés).", "src": "Manual 7 (nov. 2026), capítulo 1.4, pp. 13-14", "note": ""}, {"n": 52, "stem": "Según el manual 7, ¿qué tipo de gestión del espacio aéreo (ASM) presta ENAIRE?", "opts": ["Local (táctico/nivel 3), asegurando la coordinación con civil / militar", "Estratégica (nivel 1), con el diseño del espacio aéreo a escala europea", "Pretáctica (nivel 2), con la asignación diaria del espacio aéreo de toda Europa", "Militar, limitada a las zonas restringidas y a los aeródromos militares"], "ans": 0, "why": "«Gestión del Espacio Aéreo (ASM) local (táctico/nivel 3) asegurando la coordinación con civil / militar en el desarrollo de las operaciones».", "src": "Manual 7 (nov. 2026), capítulo 1.4.5, p. 14", "note": ""}, {"n": 53, "stem": "¿Qué función NO forma parte del Servicio de Tránsito Aéreo (ATS) tal como lo describe el manual 7 (capítulo 1.4.1)?", "opts": ["Prevenir colisiones y acelerar y mantener ordenado el movimiento del tránsito", "Proporcionar asesoramiento e información útiles para la operación segura y eficaz de los vuelos", "Notificar y auxiliar a los organismos pertinentes respecto de las aeronaves que necesitan ayuda y salvamento", "Garantizar la explotación y el mantenimiento de las instalaciones técnicas del sistema de navegación"], "ans": 3, "why": "D es la definición del servicio CNS (capítulo 1.4.2).", "src": "Manual 7 (nov. 2026), capítulos 1.4.1-1.4.2, pp. 13-14", "note": ""}, {"n": 54, "stem": "¿Qué servicio se describe como el que pone a disposición de los usuarios del espacio aéreo toda la información de navegación aérea relevante, actualizada y con la calidad necesaria para que las operaciones se desarrollen de forma segura y eficiente?", "opts": ["CNS", "AIS", "ATFM", "FPD"], "ans": 1, "why": "Servicio de Información Aeronáutica (AIS), capítulo 1.4.3: información «relevante para la planificación de sus operaciones, de una forma adecuada, actualizada y con la calidad necesaria».", "src": "Manual 7 (nov. 2026), capítulo 1.4.3, p. 14", "note": ""}, {"n": 55, "stem": "Según el manual 7, ¿en qué tres partes se divide la Formación de Unidad de los controladores en ENAIRE?", "opts": ["Formación teórica, examen escrito y expedición de la licencia de unidad", "Formación en simulador, examen práctico y formación en el puesto de trabajo", "Formación de transición (teoría), Pre-OJT (simulador) y OJT (puesto de trabajo)", "Formación inicial, Formación de Actualización y Formación de Conversión"], "ans": 2, "why": "Formación de transición (teoría), Pre-OJT (formación en simulador) y OJT (formación en el puesto de trabajo). La actualización y la conversión pertenecen a la formación continua.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 56, "stem": "En el manual 7, ¿qué es la fase «Pre-OJT» de la Formación de Unidad?", "opts": ["Formación en simulador", "Formación teórica en aula", "Formación en el puesto de trabajo con tráfico real", "Formación en lengua inglesa"], "ans": 0, "why": "«Pre – OJT: Formación en simulador». El OJT es en el puesto de trabajo; la formación de transición es teórica.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 57, "stem": "¿Qué formación es «necesaria para mantener la anotación de Unidad» y abarca los procedimientos y prácticas estándar, las situaciones anormales y emergencias, el PCATS y los factores humanos?", "opts": ["La Formación de Conversión", "La formación de transición", "La formación lingüística", "La Formación de Actualización"], "ans": 3, "why": "La Formación de Actualización mantiene la anotación de Unidad. La Formación de Conversión está asociada a los cambios operativos que se implementen en cada unidad.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 58, "stem": "En el manual 7, ¿qué significan las siglas PCATS?", "opts": ["Plan de Capacitación de Aeródromo y Torre de Sector", "Plan de contingencia ATS", "Programa de control aéreo en tiempo de situación", "Plan de coordinación de aeronaves en tránsito seguro"], "ans": 1, "why": "«PCATS (Plan de contingencia ATS)», incluido en la Formación de Actualización.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 59, "stem": "Según el manual 7, ¿qué instituciones ofrecen junto con ENAIRE el «Máster en Gestión de Servicios de Navegación Aérea»?", "opts": ["La Universidad Politécnica y la Universidad Autónoma de Madrid, en colaboración con la OACI", "La Universidad Complutense de Madrid y la Universidad de Alcalá, en colaboración con EUROCONTROL", "La Universidad Politécnica de Madrid y la Universidad de Sevilla, en colaboración con EASA", "La Universidad Autónoma de Madrid y la Universidad Carlos III, en colaboración con AESA"], "ans": 0, "why": "«ENAIRE junto con la Universidad Politécnica y la Universidad Autónoma de Madrid y en colaboración con la Organización de Aviación Civil Internacional (OACI)».", "src": "Manual 7 (nov. 2026), capítulo 1.5.B, p. 16", "note": ""}, {"n": 60, "stem": "Según el manual 7, ¿qué certificación de programa de la OACI tiene actualmente el máster de ENAIRE?", "opts": ["Next Generation of Aviation Professionals (NGAP) de la OACI", "Global Aviation Training (GAT) de la OACI", "TRAINAIR PLUS", "Centro Regional de Formación de la OACI"], "ans": 2, "why": "«cuenta actualmente con la certificación de programa TRAINAIR PLUS de OACI».", "src": "Manual 7 (nov. 2026), capítulo 1.5.B, p. 16", "note": ""}, {"n": 61, "stem": "¿Cuál de los siguientes valores aparece en el Plan de Vuelo 2030 pero NO en el Plan de Vuelo 2025 impreso en el manual 7?", "opts": ["Somos innovadores", "Lideramos desde la excelencia", "Flexibles ante los cambios", "La integridad es nuestro carácter"], "ans": 1, "why": "«Lideramos desde la excelencia» sustituyó a «Somos proactivos» en el PV2030; los otros tres aparecen en ambos planes.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11; resumen del PV2030 (behavioral/flight-plan-2030-summary.md)", "note": ""}, {"n": 62, "stem": "¿En qué se diferencia el Propósito del manual 7 (Plan de Vuelo 2025) del Propósito del Plan de Vuelo 2030?", "opts": ["El Propósito es idéntico", "El PV2030 añade «digital»", "El PV2030 sustituye «sostenible» por «competitivo»", "El PV2030 elimina el adjetivo «rápido»"], "ans": 3, "why": "PV2025: «seguro, rápido, eficiente y sostenible»; PV2030: «seguro, eficiente y sostenible».", "src": "Manual 7 (nov. 2026), capítulo 1.2.1, p. 11; PV2030 p. 22 (a través del resumen)", "note": ""}, {"n": 63, "stem": "¿Cómo se titula la Ley 18/2014, de 15 de octubre, por la que Aena EPE pasó a denominarse ENAIRE?", "opts": ["De aprobación de medidas urgentes para el crecimiento, la competitividad y la eficiencia", "De medidas urgentes para la liberalización de los servicios de tránsito aéreo", "De medidas fiscales, administrativas y del orden social para el sector aéreo", "De régimen jurídico de las entidades públicas empresariales del Estado"], "ans": 0, "why": "El manual dice que Aena EPE «pasó a denominarse ENAIRE por la Ley 18/2014 de 15 de octubre, de aprobación de medidas urgentes para el crecimiento, la competitividad y la eficiencia».", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4", "note": ""}, {"n": 64, "stem": "Según la cronología «Historia» del manual 7, ¿en qué año se creó el Ente Público Aeropuertos Españoles y Navegación Aérea (AENA)?", "opts": ["1990", "1991", "1985", "2010"], "ans": 1, "why": "La cronología abre con «1991 Creación del Ente Público Aeropuertos Españoles y Navegación Aérea (AENA)». Trampa: la ley que lo creó es la Ley 4/1990 (Presupuestos Generales del Estado para 1990), pero el hito de la cronología es 1991.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 65, "stem": "En la cronología del manual 7, ¿qué hito corresponde a 2010?", "opts": ["La separación efectiva entre Aena Aeropuertos S.A. y Aena Entidad Pública Empresarial", "El acuerdo entre España y Portugal para el desarrollo del bloque funcional SW FAB", "La Ley 9/2010 de liberalización de los servicios de tránsito aéreo de aeródromo (ATS)", "La entrada de capital privado en el 49 % de la sociedad Aena S.A."], "ans": 2, "why": "2010: «Ley 9/2010 Liberalización de los servicios de tránsito aéreo de aeródromo (ATS)». A es 2011, B es 2013 y D es 2015.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 66, "stem": "Según la cronología del manual 7, ¿qué ocurrió en 2011?", "opts": ["La aprobación del Plan de Vuelo 2020", "El cambio de nombre de Aena por el de ENAIRE", "La firma del nuevo Acuerdo ENAIRE-Aena S.A. de servicios de navegación aérea", "La separación efectiva entre Aena Aeropuertos S.A. y Aena Entidad Pública Empresarial"], "ans": 3, "why": "2011: «Separación efectiva entre Aena Aeropuertos S.A. y Aena Entidad Pública Empresarial». El cambio de nombre es de 2014, el Acuerdo de 2016 y el Plan de Vuelo 2020 cubre 2017-2020.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 67, "stem": "Según la cronología del manual 7, ¿en qué contexto pasó Aena a denominarse ENAIRE en 2014?", "opts": ["En el de la liberalización de las torres de control de aeródromo", "En el de la privatización parcial de Aena, S.A.", "En el de la creación del bloque funcional SW FAB", "En el de su designación como Operador de Infraestructuras Críticas"], "ans": 1, "why": "2014: «Aena pasa a denominarse ENAIRE en el contexto de privatización parcial de Aena, S.A.». La liberalización es de 2010, el SW FAB de 2013 y la designación como Operador de Infraestructuras Críticas de 2015.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 68, "stem": "Ordena cronológicamente, según el manual 7: (1) separación de Aena Aeropuertos S.A. y Aena EPE; (2) acuerdo España-Portugal para el SW FAB; (3) Ley 9/2010 de liberalización de los ATS de aeródromo; (4) entrada de capital privado en el 49 % de Aena S.A.", "opts": ["3, 1, 2, 4", "1, 3, 2, 4", "3, 2, 1, 4", "1, 2, 3, 4"], "ans": 0, "why": "Ley 9/2010 (2010), separación (2011), SW FAB (2013), capital privado (2015).", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 69, "stem": "¿Qué periodo abarcaba el Plan de Vuelo 2020 según la cronología del manual 7?", "opts": ["2016-2020", "2015-2020", "2018-2020", "2017-2020"], "ans": 3, "why": "«2017-2020 Plan de Vuelo 2020», con las palabras +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos. Le sigue el Plan de Vuelo 2025 (2021-2025).", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 70, "stem": "Según la cronología del manual 7, ¿qué define el Plan de Vuelo 2025 (2021-2025)?", "opts": ["La hoja de ruta de la transformación de ENAIRE para el periodo", "El reparto de las participaciones del grupo empresarial ENAIRE", "El nuevo mapa de regiones y centros de control de ENAIRE", "Los objetivos de ENAIRE para el cuarto periodo de referencia del SES"], "ans": 0, "why": "«2021-2025 Plan de Vuelo 2025. Define la hoja de ruta de la transformación de ENAIRE para el periodo».", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 71, "stem": "¿Cuál de las siguientes NO es una de las palabras con «+» del Plan de Vuelo 2020 en la cronología del manual 7?", "opts": ["+Ecológicos", "+Valorados", "+Eficientes", "+Comprometidos"], "ans": 2, "why": "Las seis son +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos. «Eficientes» no está.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 72, "stem": "¿Cuál es el último hito de la cronología «Historia» del manual 7 en su edición de nov. 2026?", "opts": ["2026-2030 Plan de Vuelo 2030", "2021-2025 Plan de Vuelo 2025", "2017-2020 Plan de Vuelo 2020", "2025-2029 cuarto periodo de referencia (RP4)"], "ans": 1, "why": "La cronología termina en «2021-2025 Plan de Vuelo 2025»; la edición de nov. 2026 no añade el Plan de Vuelo 2030 ni el RP4.", "src": "Manual 7 (nov. 2026), capítulo 1, p. 4, cronología «Historia»", "note": ""}, {"n": 73, "stem": "Según el manual 7, ¿a qué ministerio está adscrita la entidad pública empresarial ENAIRE?", "opts": ["Al Ministerio de Defensa", "Al Ministerio de Hacienda y Función Pública", "Al Ministerio de Transportes y Movilidad Sostenible", "Al Ministerio de Industria y Turismo"], "ans": 2, "why": "«La entidad pública empresarial ENAIRE, adscrita al Ministerio de Transportes y Movilidad Sostenible, es el gestor nacional de navegación aérea en España».", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 74, "stem": "¿Cómo define a ENAIRE la primera frase del capítulo 1.1 del manual 7?", "opts": ["Como el gestor nacional de navegación aérea en España", "Como el gestor de la red de aeropuertos de interés general", "Como la autoridad nacional de supervisión de la navegación aérea", "Como el regulador del sector aéreo español"], "ans": 0, "why": "ENAIRE «es el gestor nacional de navegación aérea en España». El gestor aeroportuario es Aena S.A., el supervisor AESA y el regulador la Dirección General de Aviación Civil.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 75, "stem": "Según el manual 7, ¿con cuántos centros de control y cuántas torres gestiona ENAIRE sus vuelos?", "opts": ["5 centros de control y 22 torres", "5 centros de control y 21 torres", "7 centros de control y 21 torres", "3 centros de control y 21 torres"], "ans": 1, "why": "«sus cinco centros de control y 21 torres gestionan más de 2 millones de vuelos al año». No confundir con las 3 FIR ni con los 2 TACC.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 76, "stem": "Según el manual 7, ¿cuántos vuelos al año gestionan los centros de control y las torres de ENAIRE?", "opts": ["Más de 1 millón", "Más de 3 millones", "Más de 328 millones", "Más de 2 millones"], "ans": 3, "why": "«más de 2 millones de vuelos al año». Los más de 328 millones son personas transportadas en 2023.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 77, "stem": "Según el manual 7, ¿con qué objetivo tiene ENAIRE encomendada la planificación, dirección, coordinación, explotación, conservación y administración del tráfico aéreo?", "opts": ["Que la prestación del servicio sea segura, rápida, eficiente y sostenible", "Que la prestación del servicio sea segura, de calidad, eficiente y rentable", "Que la prestación del servicio sea segura, puntual, competitiva y ecológica", "Que la prestación del servicio sea segura, eficaz, continuada y sostenible"], "ans": 3, "why": "«con el objetivo de que la prestación del servicio sea segura, eficaz, continuada y sostenible». A es el Propósito del Plan de Vuelo 2025 (capítulo 1.2.1); no confundir.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 78, "stem": "¿Cuál de los siguientes pares NO figura entre las funciones que el manual 7 dice que tiene encomendadas ENAIRE?", "opts": ["La planificación y la dirección", "La coordinación y la explotación", "La certificación y la supervisión", "La conservación y la administración"], "ans": 2, "why": "El manual enumera «planificación, dirección, coordinación, explotación, conservación y administración» del tráfico aéreo, de los servicios de telecomunicaciones e información aeronáutica y de las infraestructuras, instalaciones y redes del sistema. La supervisión corresponde a AESA.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5", "note": ""}, {"n": 79, "stem": "En el esquema institucional del manual 7, ¿cuál es el orden de los órganos del Ministerio, de arriba abajo?", "opts": ["Ministro → Secretaría General de Transportes Aéreo y Marítimo → Secretaría de Estado → Dirección General de Aviación Civil", "Ministro → Secretaría de Estado de Transportes y Movilidad Sostenible → Secretaría General de Transportes Aéreo y Marítimo → Dirección General de Aviación Civil", "Ministro → Secretaría de Estado → Dirección General de Aviación Civil → Secretaría General de Transportes Aéreo y Marítimo", "Ministro → Dirección General de Aviación Civil → Secretaría de Estado → Secretaría General de Transportes Aéreo y Marítimo"], "ans": 1, "why": "La figura encadena Ministro de Transporte y Movilidad Sostenible, Secretaría de Estado de Transportes y Movilidad Sostenible, Secretaría General de Transportes Aéreo y Marítimo y Dirección General de Aviación Civil. ENAIRE (proveedor nacional) y AESA (supervisor) cuelgan de esa línea.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5, figura", "note": ""}, {"n": 80, "stem": "Según el esquema institucional del manual 7, ¿qué órgano del Ministerio «diseña la estrategia, dirige la política aeronáutica y ejerce de regulador en el sector aéreo»?", "opts": ["La Agencia Estatal de Seguridad Aérea", "La Secretaría General de Transportes Aéreo y Marítimo", "ENAIRE", "La Dirección General de Aviación Civil"], "ans": 3, "why": "«Dirección General de la Aviación Civil: Órgano del Ministerio que diseña la estrategia, dirige la política aeronáutica y ejerce de regulador en el sector aéreo». AESA es el supervisor; ENAIRE, el proveedor nacional.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 5, figura", "note": ""}, {"n": 81, "stem": "Según el manual 7, ¿qué servicios de tránsito aéreo presta ENAIRE, además de los de información de vuelo, alerta y asesoramiento?", "opts": ["Los de control de área, aproximación y aeródromo", "Solo los de control de área y aproximación", "Solo los de control de aeródromo en la red Aena", "Los de dirección de plataforma y control de aeródromo"], "ans": 0, "why": "«ENAIRE presta los servicios de tránsito aéreo de control de área, aproximación y aeródromo, así como los de información de vuelo, alerta y asesoramiento».", "src": "Manual 7 (nov. 2026), capítulo 1.1, pp. 5-6", "note": ""}, {"n": 82, "stem": "Según el manual 7, ¿dónde es ENAIRE el proveedor de servicios de comunicaciones, navegación y vigilancia?", "opts": ["Solo en el espacio aéreo superior, por encima del FL 245", "En todo el espacio aéreo español y en los aeropuertos de la red Aena", "En los aeropuertos de la red Aena, pero no en el espacio aéreo en ruta", "En las FIR de Madrid y Barcelona, pero no en la FIR de Canarias"], "ans": 1, "why": "«Es el proveedor de servicios de comunicaciones, navegación y vigilancia en todo el espacio aéreo español y en los aeropuertos de la red Aena».", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6", "note": ""}, {"n": 83, "stem": "Según el mapa del manual 7, ¿qué superficie tiene el ACC de Madrid?", "opts": ["266 000 km²", "179 000 km²", "435 000 km²", "1 370 000 km²"], "ans": 2, "why": "ACC Madrid 435 000 km²; Barcelona 266 000; Sevilla 179 000; Palma 51 400; Gran Canaria 1 370 000.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 84, "stem": "¿Cuál es el ACC de menor superficie según el mapa del manual 7?", "opts": ["Sevilla (179 000 km²)", "Barcelona (266 000 km²)", "Madrid (435 000 km²)", "Palma (51 400 km²)"], "ans": 3, "why": "ACC Palma, 51 400 km². El mayor es Gran Canaria (1 370 000 km²).", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 85, "stem": "Según el mapa del manual 7, ¿qué superficies corresponden a los ACC de Barcelona y de Sevilla?", "opts": ["Barcelona 266 000 km² y Sevilla 179 000 km²", "Barcelona 179 000 km² y Sevilla 266 000 km²", "Barcelona 435 000 km² y Sevilla 51 400 km²", "Barcelona 266 000 km² y Sevilla 51 400 km²"], "ans": 0, "why": "ACC Barcelona 266 000 km²; ACC Sevilla 179 000 km². 51 400 km² es Palma y 435 000 km² es Madrid.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 86, "stem": "Según el mapa del manual 7, ¿cuántas regiones con centro de control, regiones de información de vuelo (FIR) y TACC tiene ENAIRE?", "opts": ["3 regiones, 5 FIR y 2 TACC", "5 regiones, 3 FIR y 2 TACC", "5 regiones, 2 FIR y 3 TACC", "4 regiones, 3 FIR y 2 TACC"], "ans": 1, "why": "«5 Regiones / 5 Centros de Control», «3 Regiones de Información de Vuelo (FIR) Madrid, Barcelona y Canarias» y «2 TACCs» (Santiago y Valencia).", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 87, "stem": "Según el mapa del manual 7, ¿qué centro de control corresponde a la región Este?", "opts": ["Madrid", "Palma", "Valencia", "Barcelona"], "ans": 3, "why": "«Este / Barcelona». Valencia es un TACC, no el centro de control de la región; Palma es la región Balear.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 88, "stem": "¿Cuál de los siguientes es en el mapa del manual 7 un TACC y no uno de los cinco centros de control de región?", "opts": ["Valencia", "Palma", "Sevilla", "Gran Canaria"], "ans": 0, "why": "Los 2 TACC son Santiago y Valencia. Palma, Sevilla y Gran Canaria son ACC de las regiones Balear, Sur y Canaria.", "src": "Manual 7 (nov. 2026), capítulo 1.1, p. 6, mapa", "note": ""}, {"n": 89, "stem": "Según el organigrama del manual 7, ¿qué cargo depende del Director de Servicios de Navegación Aérea?", "opts": ["La Secretaria General", "El Director de Operaciones", "El Director de Comunicación", "El Jefe de la División de Auditoría Interna"], "ans": 1, "why": "Bajo el Director de Servicios de Navegación Aérea figuran la Directora Adjunta de Servicios de Navegación Aérea, el Jefe de la División de Diseño, Desarrollo e Implantación ATM, el Director de Sistemas, el Director de Operaciones y los cinco directores de región. Los otros tres dependen del Director General.", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7, organigrama", "note": ""}, {"n": 90, "stem": "¿Cuántos directores de región figuran en la base del organigrama del manual 7 y de qué regiones?", "opts": ["Tres: Centro-Norte, Este y Sur", "Cinco: Madrid, Barcelona, Sevilla, Palma y Canarias", "Cinco: Balear, Canaria, Centro-Norte, Este y Sur", "Cuatro: Centro-Norte, Este, Sur y Canaria"], "ans": 2, "why": "El organigrama termina con cinco directores de región: Balear, Canaria, Centro-Norte, Este y Sur (las mismas cinco regiones del mapa). Madrid, Barcelona, Sevilla y Palma son los nombres de los centros de control, no de las regiones.", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7, organigrama", "note": ""}, {"n": 91, "stem": "¿Cuál de los siguientes cargos NO figura en el organigrama del manual 7?", "opts": ["Directora de Estrategia e Innovación", "Directora Económico Financiera", "Director de Comunicación", "Director de Recursos Humanos y Calidad"], "ans": 3, "why": "La fila que depende del Director General la forman el Director de Comunicación, el Jefe de División de Seguridad, la Jefa de División de Sostenibilidad y Relaciones Institucionales, la Directora de Personas, la Directora Económico Financiera y la Directora de Estrategia e Innovación. No hay «Recursos Humanos y Calidad»: el cargo es «Directora de Personas».", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7, organigrama", "note": ""}, {"n": 92, "stem": "Según el organigrama del manual 7, ¿qué cargo ocupa Enrique Maurer Somolinos?", "opts": ["Presidente", "Director de Servicios de Navegación Aérea", "Director General", "Director de Coordinación Civil-Militar"], "ans": 2, "why": "Enrique Maurer Somolinos figura como Director General, bajo el Presidente José Antonio Santano Clavero. El Director de Servicios de Navegación Aérea es José Luis Meler Jordán. El manual de nov. 2026 reproduce el organigrama de la edición de 2024.", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7, organigrama", "note": ""}, {"n": 93, "stem": "En el organigrama del manual 7, ¿de quién dependen el Director de Coordinación Civil-Militar y el Jefe de la División de Auditoría Interna?", "opts": ["Del Director General", "Del Director de Operaciones", "De la Directora de Estrategia e Innovación", "Del Director de Servicios de Navegación Aérea"], "ans": 0, "why": "Ambos cuelgan de la línea del Director General, a la derecha, como la Secretaria General a la izquierda; quedan por encima de la fila de direcciones y del Director de Servicios de Navegación Aérea.", "src": "Manual 7 (nov. 2026), capítulo 1.1.1, p. 7, organigrama", "note": ""}, {"n": 94, "stem": "Según el manual 7, ¿cuál es la actividad central del Grupo Empresarial ENAIRE?", "opts": ["La gestión aeroportuaria de la red de Aena", "La ingeniería y la consultoría de transporte", "La gestión de la navegación aérea en España", "La investigación y el desarrollo de sistemas ATM"], "ans": 2, "why": "«ENAIRE constituye un Grupo Empresarial cuya actividad central es la gestión de la navegación aérea en España». La gestión aeroportuaria es de Aena S.A., de la que ENAIRE es accionista mayoritario.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 95, "stem": "En la figura del grupo empresarial del manual 7, ¿qué órgano figura como «Presidencia de ENAIRE»?", "opts": ["La Dirección General de Aviación Civil", "La Secretaría de Estado de Transportes y Movilidad Sostenible", "La Secretaría General de Transportes Aéreo y Marítimo", "La Agencia Estatal de Seguridad Aérea"], "ans": 1, "why": "La figura pone bajo el Ministerio el recuadro «Secretaría de Estado de Transportes y Movilidad Sostenible / Presidencia de ENAIRE», y debajo el «Grupo ENAIRE».", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8, figura", "note": ""}, {"n": 96, "stem": "En la figura del grupo empresarial del manual 7, ¿qué sociedad aparece como «Participada AENA» con el 100 %?", "opts": ["Ineco", "Startical", "CRIDA", "Aena Internacional"], "ans": 3, "why": "Bajo Aena (51 %) cuelga «Participadas AENA: Aena Internacional 100 %». Ineco y Startical son «Participadas ENAIRE»; CRIDA es participación mayoritaria de ENAIRE.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8, figura", "note": ""}, {"n": 97, "stem": "En la figura del grupo empresarial del manual 7, ¿bajo qué epígrafe aparece la Fundación ENAIRE?", "opts": ["Patronato", "Participadas ENAIRE", "Participación mayoritaria de ENAIRE", "Participadas AENA"], "ans": 0, "why": "La figura tiene tres columnas bajo el Grupo ENAIRE: «Participadas ENAIRE» (Ineco, GroupEAD, Startical), «Participación mayoritaria de ENAIRE» (Aena, CRIDA) y «Patronato» (Fundación ENAIRE).", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8, figura", "note": ""}, {"n": 98, "stem": "Según el manual 7, ¿en qué sociedad tiene ENAIRE el 51 % y en cuál el 50 %?", "opts": ["El 51 % en STARTICAL y el 50 % en Aena S.A.", "El 51 % en Aena S.A. y el 50 % en STARTICAL", "El 51 % en Aena S.A. y el 50 % en Ineco", "El 51 % en CRIDA y el 50 % en STARTICAL"], "ans": 1, "why": "Aena S.A. 51 % (accionista mayoritario); STARTICAL 50 %. Ineco es el 45,85 % y CRIDA el 66,66 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 99, "stem": "Según el manual 7, ¿cuál es el orden de mayor a menor de la participación de ENAIRE en estas cuatro empresas estratégicas?", "opts": ["CRIDA, Ineco, STARTICAL, Grupo EAD", "STARTICAL, CRIDA, Ineco, Grupo EAD", "CRIDA, STARTICAL, Ineco, Grupo EAD", "CRIDA, STARTICAL, Grupo EAD, Ineco"], "ans": 2, "why": "CRIDA 66,66 %, STARTICAL 50 %, Ineco 45,85 % y Grupo EAD 36 % (el mismo orden en que las cita el manual).", "src": "Manual 7 (nov. 2026), capítulo 1.1.2, p. 8", "note": ""}, {"n": 100, "stem": "Según el manual 7, ¿cuántas personas componen la plantilla de ENAIRE?", "opts": ["Más de 2.100", "Más de 3.200", "Más de 4.200", "Más de 5.200"], "ans": 2, "why": "«La plantilla de ENAIRE la componen más de 4.200 personas trabajadoras» (datos a 31 de octubre de 2024).", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 101, "stem": "¿A qué fecha se refieren los datos de plantilla del manual 7 (nota al pie del capítulo 1.1.3)?", "opts": ["Al 31 de diciembre de 2023", "Al 31 de octubre de 2024", "Al 31 de diciembre de 2024", "Al 31 de octubre de 2026"], "ans": 1, "why": "Nota 1: «Datos de plantilla a 31 de octubre de 2024». La edición de nov. 2026 no la actualiza.", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9, nota 1", "note": ""}, {"n": 102, "stem": "Según el manual 7, ¿qué ocupación de la plantilla «incluye ambos Convenios»?", "opts": ["Gestión", "Operaciones", "Ingeniería y Explotación Técnica", "Controladores aéreos"], "ans": 0, "why": "«Gestión: personal dedicado a tareas de administración y gestión de la empresa (incluye ambos Convenios). Alrededor de un 26%».", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 103, "stem": "Según el manual 7, ¿cuál es el segundo grupo más numeroso de la plantilla por ocupaciones?", "opts": ["Ingeniería y Explotación Técnica (sobre un 20 %)", "Operaciones (sobre un 5 %)", "Controladores aéreos (alrededor del 49 %)", "Gestión (alrededor de un 26 %)"], "ans": 3, "why": "Orden: controladores 49 %, Gestión 26 %, Ingeniería y Explotación Técnica 20 %, Operaciones 5 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 104, "stem": "Según el manual 7, ¿qué ocupación supone «sobre un 5 %» de la plantilla?", "opts": ["Operaciones", "Gestión", "Ingeniería y Explotación Técnica", "Controladores aéreos"], "ans": 0, "why": "Operaciones (información aeronáutica, planes de vuelo y apoyo a la gestión de los ATS), sobre un 5 %. Gestión 26 %, Ingeniería 20 %, controladores 49 %.", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 105, "stem": "¿Cuál de los siguientes colectivos NO aparece en la enumeración del I Convenio Colectivo del Grupo Aena del manual 7?", "opts": ["Meteorología", "Delineación", "Jurídico", "Sistemas de Información"], "ans": 0, "why": "La lista es: técnicos de Mantenimiento, Operaciones, Sistemas, Seguridad, Personas, Calidad y Medioambiente, Comunicación, Jurídico, Sistemas de Información, Económico-Administrativo, Planificación, Comunicación, Delineación, Servicios y Mantenimiento General. No hay meteorología (la presta AEMET).", "src": "Manual 7 (nov. 2026), capítulo 1.1.3, p. 9", "note": ""}, {"n": 106, "stem": "¿Cuál de los siguientes NO es uno de los cinco ámbitos de la figura de grupos de interés del manual 7?", "opts": ["Accionistas", "Sociedad", "Clientes", "Personas"], "ans": 0, "why": "Los cinco ámbitos son Clientes, Personas, Sociedad, Reguladores / Administraciones públicas y Partners / Proveedores.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 107, "stem": "¿En qué ámbito sitúa la figura de grupos de interés del manual 7 al «Gestor de Red europeo» (Network Manager)?", "opts": ["Reguladores / Administraciones públicas", "Partners / Proveedores", "Clientes", "Sociedad"], "ans": 1, "why": "El Gestor de Red europeo (logo Network Manager de EUROCONTROL) está en Partners / Proveedores, junto al Grupo A6, CANSO, SESAR, AEMET y otros. La entrada «Eurocontrol», en cambio, está en Reguladores / Administraciones públicas.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 108, "stem": "¿Qué grupo de entidades figura en el ámbito «Reguladores / Administraciones públicas» de la figura de grupos de interés del manual 7?", "opts": ["AEMET, CANSO y el Grupo A6 de ANSPs", "Organizaciones sindicales y asociaciones profesionales", "Pasaje, ciudadanía y medios de comunicación", "OACI, Eurocontrol, Comisión Europea y EASA"], "ans": 3, "why": "Reguladores / Administraciones públicas: OACI, Eurocontrol, Comisión Europea, EASA, Dirección General de Aviación Civil, resto de Ministerios y Órganos del Gobierno, instituciones autonómicas, regionales y locales, AESA y Ejército del Aire y del Espacio. A es Partners, B es Personas y C es Sociedad.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 109, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito aparece la Fundación ENAIRE?", "opts": ["Partners / Proveedores", "Personas", "Sociedad", "Reguladores / Administraciones públicas"], "ans": 2, "why": "Ámbito Sociedad: pasaje, ciudadanía y asociaciones locales, entidades de protección al medio ambiente, entidades de cooperación social, instituciones educativas, Fundación ENAIRE y medios de comunicación.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 110, "stem": "¿Qué grupos de interés figuran en el «Ámbito PERSONAS» del manual 7, además de las personas empleadas?", "opts": ["Organizaciones sindicales, asociaciones profesionales, antiguo personal y solicitantes de empleo", "Pasaje, ciudadanía y asociaciones locales, medios de comunicación e instituciones educativas", "Compañías aéreas y sus pilotos, gestores aeroportuarios y operadores de drones", "Entidades de cooperación social y entidades de protección al medio ambiente"], "ans": 0, "why": "Ámbito Personas: personas empleadas, organizaciones sindicales, asociaciones profesionales, antiguo personal y solicitantes de empleo. B y D son Sociedad; C es Clientes.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 111, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito se sitúa el «Pasaje»?", "opts": ["Sociedad", "Clientes", "Personas", "Partners / Proveedores"], "ans": 0, "why": "El pasaje está en el ámbito Sociedad, no en Clientes. Los clientes son las compañías aéreas y sus asociaciones, los gestores aeroportuarios, la aviación no comercial y los operadores de drones.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 112, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito aparecen la Civil Air Navigation Services Organisation (CANSO) y el Grupo A6 de ANSPs?", "opts": ["Reguladores / Administraciones públicas", "Clientes", "Sociedad", "Partners / Proveedores"], "ans": 3, "why": "Partners / Proveedores: Gestor de Red europeo, Grupo A6 de ANSPs, empresas participadas, alianzas y socios empresariales (ITEC), SESAR (SJU/SDM), CANSO, otros proveedores de servicios de NA, AEMET y proveedores (empresas contratistas).", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 113, "stem": "En el ámbito Partners / Proveedores del manual 7, ¿qué empresa aparece entre las «Empresas participadas» con la indicación «(EGNOS)»?", "opts": ["ESSP", "ITEC", "SESAR Deployment Manager", "Network Manager"], "ans": 0, "why": "«Empresas participadas (Aena, Ineco, Crida, Grupo EAD, ESSP (EGNOS), Startical)». ITEC aparece en «Alianzas y Socios empresariales».", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 114, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito figuran el Ejército del Aire y del Espacio y la AESA?", "opts": ["Partners / Proveedores", "Reguladores / Administraciones públicas", "Sociedad", "Clientes"], "ans": 1, "why": "Ambos están en Reguladores / Administraciones públicas, junto con la OACI, Eurocontrol, la Comisión Europea, EASA y la Dirección General de Aviación Civil.", "src": "Manual 7 (nov. 2026), capítulo 1.1.4, p. 10, figura", "note": ""}, {"n": 115, "stem": "¿Qué cuatro cualidades cita la Misión de ENAIRE (Plan de Vuelo 2025) en el manual 7?", "opts": ["Seguridad, rapidez, eficiencia y sostenibilidad", "Seguridad, capacidad, coste-eficiencia y medio ambiente", "Seguridad, calidad, eficiencia y respeto al medioambiente", "Seguridad, puntualidad, innovación y digitalización"], "ans": 2, "why": "Misión: «Proporcionamos servicios de navegación aérea con seguridad, calidad, eficiencia y respeto al medioambiente...». A recuerda el Propósito y B las áreas del SES y del sistema de rendimientos.", "src": "Manual 7 (nov. 2026), capítulo 1.2.2, p. 11", "note": ""}, {"n": 116, "stem": "Según la Misión del manual 7, ¿a qué contribuye ENAIRE al proporcionar servicios de navegación aérea?", "opts": ["A la reducción de la fragmentación del espacio aéreo europeo", "A la recuperación global del sector de la aviación tras la crisis", "A la transformación digital de la Administración General del Estado", "Al desarrollo de la aviación y, por tanto, al desarrollo económico y social de España"], "ans": 3, "why": "«...contribuyendo al desarrollo de la aviación y, por tanto, al desarrollo económico y social de España». A es un objetivo del SES y B forma parte del objetivo estratégico 5.", "src": "Manual 7 (nov. 2026), capítulo 1.2.2, p. 11", "note": ""}, {"n": 117, "stem": "Según la Visión («nuestra ambición») del manual 7, ¿en qué quiere convertir ENAIRE?", "opts": ["En un operador global, líder del sector de la navegación aérea", "En el primer proveedor de Europa por volumen de tráfico", "En el gestor de red europeo del Cielo Único", "En el principal operador aeroportuario del mundo"], "ans": 0, "why": "«Queremos convertir a ENAIRE en un operador global, líder del sector de la navegación aérea, basándonos en las personas, la innovación y la digitalización». Hoy es el cuarto de Europa por tráfico.", "src": "Manual 7 (nov. 2026), capítulo 1.2.3, p. 11", "note": ""}, {"n": 118, "stem": "En el manual 7, ¿qué tres valores forman el grupo «Comprometidos con los clientes y la sociedad»?", "opts": ["Somos profesionales, Somos empáticos y Protegemos el medioambiente", "Somos innovadores, Flexibles ante los cambios y Somos proactivos", "Buscamos la excelencia, Somos empáticos y Responsables con el Medioambiente", "Somos ENAIRE, La integridad es nuestro carácter y Respetamos y confiamos"], "ans": 2, "why": "Grupo 2 del manual: Buscamos la excelencia, Somos empáticos y Responsables con el Medioambiente. A es la versión del Plan de Vuelo 2030; B es el grupo 4 y D el grupo 3 del manual.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 119, "stem": "¿Qué valor del manual 7 dice que la seguridad es «nuestra máxima prioridad, un pilar en el que descansa nuestro servicio y el bienestar de las personas»?", "opts": ["Refuerzo e impulso de la Seguridad", "En nuestro ADN", "Actitud de confianza y «cultura justa»", "Responsables con el Medioambiente"], "ans": 1, "why": "«En nuestro ADN: La seguridad es nuestra máxima prioridad, un pilar en el que descansa nuestro servicio y el bienestar de las personas».", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 120, "stem": "Según el manual 7, el valor «Actitud de confianza y \"cultura justa\"» describe una atmósfera de confianza en la que todos notificamos información esencial ¿de qué modo?", "opts": ["De forma anónima y voluntaria", "Solo a través de la cadena jerárquica", "En un plazo máximo de 72 horas", "Sin temer consecuencias punitivas"], "ans": 3, "why": "«Participamos de una atmósfera de confianza en la que todos notificamos información esencial sin temer consecuencias punitivas, con el afán de mantener y reforzar nuestra Cultura de Seguridad».", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 121, "stem": "¿Qué valor del manual 7 dice que «para afrontar los retos del futuro, las actuaciones y cambios deben reforzar los niveles exigidos de Seguridad»?", "opts": ["Flexibles ante los cambios", "Somos innovadores", "Refuerzo e impulso de la Seguridad", "En nuestro ADN"], "ans": 2, "why": "Es la definición de «Refuerzo e impulso de la Seguridad», tercer valor del grupo 1.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 122, "stem": "¿Qué valor del manual 7 se define como «Damos un servicio de calidad que garantice y supere las necesidades y expectativas de nuestros clientes y grupos de interés»?", "opts": ["Buscamos la excelencia", "Somos empáticos", "Somos ENAIRE", "Somos proactivos"], "ans": 0, "why": "«Buscamos la excelencia», primer valor del grupo 2 (Comprometidos con los clientes y la sociedad). No confundir con «Perseguimos la excelencia», título de grupo del PV2030.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 123, "stem": "¿Qué valor del manual 7 consiste en ponerse «en el lugar del otro para entender y dar respuesta a las necesidades del cliente interno y externo»?", "opts": ["Respetamos y confiamos", "Somos empáticos", "Buscamos la excelencia", "La integridad es nuestro carácter"], "ans": 1, "why": "«Somos empáticos: Nos ponemos en el lugar del otro para entender y dar respuesta a las necesidades del cliente interno y externo» (grupo 2).", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 124, "stem": "¿Qué valor del manual 7 dice «Somos conscientes de la incidencia de nuestra actividad en el entorno natural y ponemos en marcha acciones para el desarrollo de soluciones sostenibles»?", "opts": ["Somos innovadores", "Flexibles ante los cambios", "Somos proactivos", "Responsables con el Medioambiente"], "ans": 3, "why": "«Responsables con el Medioambiente», tercer valor del grupo 2. En el PV2030 se llama «Protegemos el medioambiente».", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 125, "stem": "¿Qué valor del manual 7 se define como «Estamos orgullosos de ser parte de ENAIRE. Con nuestro trabajo hacemos todo lo posible para conseguir los objetivos colectivos»?", "opts": ["Somos ENAIRE", "Respetamos y confiamos", "En nuestro ADN", "Somos proactivos"], "ans": 0, "why": "«Somos ENAIRE», primer valor del grupo 3 (Somos un solo y gran equipo).", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 126, "stem": "Según el manual 7, el valor «Respetamos y confiamos» dice que colaboramos con los compañeros, reconocemos el mérito de su trabajo y actuamos con generosidad y humildad ¿para lograr qué?", "opts": ["Una cultura de seguridad positiva", "Una organización interconectada", "Un servicio de calidad", "Un entorno global y liberalizado"], "ans": 1, "why": "«...actuamos con generosidad y humildad para lograr una organización interconectada».", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 127, "stem": "¿Qué valor del manual 7 dice «Nos planteamos nuevos retos y buscamos nuevas ideas y formas de hacer nuestro trabajo, basadas en los últimos avances tecnológicos»?", "opts": ["Flexibles ante los cambios", "Buscamos la excelencia", "Somos innovadores", "Somos proactivos"], "ans": 2, "why": "«Somos innovadores», primer valor del grupo 4 («\"Hambre\" de mejora de nuestra organización»).", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 128, "stem": "¿Qué valor del manual 7 dice «Tenemos una mente abierta y nos adaptamos a los cambios para que ENAIRE se transforme y crezca»?", "opts": ["Somos empáticos", "Somos innovadores", "Respetamos y confiamos", "Flexibles ante los cambios"], "ans": 3, "why": "«Flexibles ante los cambios», segundo valor del grupo 4.", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 129, "stem": "¿Cuál es el orden de los cuatro grupos de valores en el manual 7?", "opts": ["Seguridad es lo primero; Solo y gran equipo; Comprometidos con los clientes y la sociedad; «Hambre» de mejora", "Seguridad es lo primero; Comprometidos con los clientes y la sociedad; Solo y gran equipo; «Hambre» de mejora", "Comprometidos con los clientes y la sociedad; Seguridad es lo primero; Solo y gran equipo; «Hambre» de mejora", "Seguridad es lo primero; «Hambre» de mejora; Comprometidos con los clientes y la sociedad; Solo y gran equipo"], "ans": 1, "why": "<ol>\n<li>La seguridad es lo primero; 2. Comprometidos con los clientes y la sociedad; 3. Somos un solo y gran equipo; 4. «Hambre» de mejora de nuestra organización.</li>\n</ol>", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 130, "stem": "¿Cuál de los siguientes NO es uno de los tres valores del grupo «La seguridad es lo primero» del manual 7?", "opts": ["En nuestro ADN", "Actitud de confianza y «cultura justa»", "Refuerzo e impulso de la Seguridad", "Buscamos la excelencia"], "ans": 3, "why": "«Buscamos la excelencia» es el primer valor del grupo 2 (Comprometidos con los clientes y la sociedad).", "src": "Manual 7 (nov. 2026), capítulo 1.2.4, p. 11", "note": ""}, {"n": 131, "stem": "¿Qué objetivo estratégico del manual 7 pretende mejorar la «calidad, escalabilidad y resiliencia de los servicios prestados»?", "opts": ["El objetivo 1", "El objetivo 2", "El objetivo 4", "El objetivo 6"], "ans": 1, "why": "Objetivo 2: «Mejorar la calidad, escalabilidad y resiliencia de los servicios prestados a través de la digitalización, la modernización del espacio aéreo y los conceptos operativos, y el refuerzo de la cultura de orientación al cliente y grupos de interés».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 132, "stem": "Según el objetivo 2 del manual 7, ¿a través de qué se mejoran la calidad, escalabilidad y resiliencia de los servicios?", "opts": ["De la reducción de la fragmentación del espacio aéreo y de la cooperación en el SW FAB", "De la contratación de nuevos controladores y del refuerzo de la cultura de seguridad", "De la digitalización, la modernización del espacio aéreo y los conceptos operativos, y la orientación al cliente", "De la venta de participaciones empresariales y de la entrada en nuevos mercados internacionales"], "ans": 2, "why": "«...a través de la digitalización, la modernización del espacio aéreo y los conceptos operativos, y el refuerzo de la cultura de orientación al cliente y grupos de interés».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 133, "stem": "¿Qué objetivo estratégico del manual 7 busca «posicionarnos en un entorno global y liberalizado del futuro sector de la navegación aérea»?", "opts": ["El objetivo 4, desarrollo del negocio e internacionalización", "El objetivo 2, calidad, escalabilidad y resiliencia de los servicios", "El objetivo 5, recuperación económica y viabilidad futura", "El objetivo 6, transformación cultural, organizativa y modernización"], "ans": 0, "why": "Objetivo 4: «Acometer el desarrollo del negocio e internacionalización de ENAIRE, para posicionarnos en un entorno global y liberalizado del futuro sector de la navegación aérea».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 134, "stem": "¿Qué objetivo estratégico del manual 7 habla de «acelerar la transformación cultural, organizativa y modernización de ENAIRE, aprovechando las nuevas tecnologías para ser más ágiles y eficientes»?", "opts": ["El objetivo 2", "El objetivo 3", "El objetivo 6", "El objetivo 4"], "ans": 2, "why": "Es el objetivo 6, el último; en el manual su texto queda cortado en «desarrollando una cultura».", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 135, "stem": "Según el objetivo 5 del manual 7, además de superar la crisis, ¿qué se pretende con el aumento de la eficiencia, la productividad y la competitividad?", "opts": ["Reducir la fragmentación del espacio aéreo europeo", "Reforzar la cultura de seguridad y el factor humano", "Posicionarse en un entorno global y liberalizado", "Adaptarse a los cambios estructurales del sector y contribuir a la recuperación global de la aviación"], "ans": 3, "why": "«...para superar la crisis y adaptarse a los cambios estructurales del sector, a la vez que se contribuye a la recuperación global del sector de la aviación». C es el objetivo 4 y B el objetivo 1.", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, p. 12", "note": ""}, {"n": 136, "stem": "¿Cuál es el orden de los temas de los objetivos estratégicos 1 a 4 del manual 7?", "opts": ["Seguridad; movilidad sostenible; calidad, escalabilidad y resiliencia; negocio e internacionalización", "Calidad, escalabilidad y resiliencia; seguridad; negocio e internacionalización; movilidad sostenible", "Seguridad; negocio e internacionalización; movilidad sostenible; calidad, escalabilidad y resiliencia", "Seguridad; calidad, escalabilidad y resiliencia; movilidad sostenible; negocio e internacionalización"], "ans": 3, "why": "1 seguridad; 2 calidad, escalabilidad y resiliencia; 3 movilidad sostenible; 4 desarrollo del negocio e internacionalización; 5 recuperación económica y viabilidad futura; 6 transformación cultural, organizativa y modernización.", "src": "Manual 7 (nov. 2026), capítulo 1.2.5, pp. 11-12", "note": ""}, {"n": 137, "stem": "Según el manual 7, ¿cuál es el principal objetivo de la iniciativa del Cielo Único Europeo?", "opts": ["Crear un proveedor único europeo de servicios de navegación aérea", "Aumentar la eficiencia de la gestión del tránsito aéreo y los servicios de navegación aérea", "Armonizar las tasas aeroportuarias de los Estados miembros", "Sustituir a EUROCONTROL como gestor de la red europea"], "ans": 1, "why": "El SES «tiene como principal objetivo aumentar la eficiencia de la gestión del tránsito aéreo y los servicios de navegación aérea» mediante la mejora de los servicios y la reducción de la fragmentación.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12", "note": ""}, {"n": 138, "stem": "Según el manual 7, ¿para qué persigue el SES mejorar la prestación de los servicios de navegación aérea en capacidad, seguridad, coste-eficiencia y medio ambiente?", "opts": ["Para reducir el número de proveedores de servicios", "Para cumplir los compromisos del Protocolo de Kioto", "Para hacer frente a la demanda creciente de tráfico aéreo", "Para compensar la crisis económica del sector"], "ans": 2, "why": "Punto a: «la mejora en la prestación de los servicios de navegación aérea en términos de capacidad, seguridad, coste-eficiencia y medio ambiente, para hacer frente a la demanda creciente de tráfico aéreo».", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12", "note": ""}, {"n": 139, "stem": "¿Cuál de los siguientes NO es uno de los términos en que el SES busca mejorar la prestación de los servicios de navegación aérea (punto a del capítulo 1.3 del manual 7)?", "opts": ["Capacidad", "Puntualidad", "Coste-eficiencia", "Medio ambiente"], "ans": 1, "why": "Los cuatro términos son capacidad, seguridad, coste-eficiencia y medio ambiente. «Puntuales» era una de las palabras del Plan de Vuelo 2020, no del SES.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 12", "note": ""}, {"n": 140, "stem": "Según el manual 7, ¿desde hace cuánto siguen vigentes los dos objetivos del Cielo Único Europeo?", "opts": ["Más de 10 años", "Más de 15 años", "Más de 20 años", "Más de 25 años"], "ans": 2, "why": "«Ambos objetivos siguen estando vigentes tras más de 20 años» (la iniciativa es de 1999).", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 141, "stem": "Según el manual 7, ¿entre qué instituciones se negocia el SES2+ en los «triálogos»?", "opts": ["Comisión Europea, EUROCONTROL y EASA", "Consejo, Parlamento Europeo y EUROCONTROL", "Comisión Europea, EASA y OACI", "Comisión Europea, Consejo y Parlamento Europeo"], "ans": 3, "why": "«está actualmente en proceso de negociación (triálogos entre la Comisión Europea, Consejo y Parlamento Europeo)». La edición de nov. 2026 escribe «triálogos» (la anterior decía «trílogos»).", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 142, "stem": "Según el manual 7 (nov. 2026), ¿en qué situación se encuentra el SES2+?", "opts": ["Aprobado y en vigor desde 2009", "Retomado por la Comisión a finales de 2020 y actualmente en proceso de negociación", "Retirado por la Comisión Europea a finales de 2020", "Aprobado en 2004 junto con el paquete SES I"], "ans": 1, "why": "El manual dice que la Comisión «retomó, a finales de 2020, la propuesta de nuevo texto reglamentario para SES2+, que está actualmente en proceso de negociación». Es lo que se pregunta en el examen, aunque el texto está desfasado: el SES2+ se publicó como Reglamento (UE) 2024/2803 el 11-11-2024.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 143, "stem": "Según el manual 7, ¿a quién requiere el sistema europeo de rendimientos el cumplimiento de metas?", "opts": ["A los Estados (y a los proveedores de servicios como ENAIRE)", "Solo a las compañías aéreas que operan en Europa", "Solo a EUROCONTROL como gestor de red", "A los aeropuertos de la red Aena"], "ans": 0, "why": "«El sistema europeo de rendimientos requiere a los Estados (y a los proveedores de servicios como ENAIRE) el cumplimiento de metas en cuatro áreas».", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 144, "stem": "Según el manual 7, ¿qué esquema lleva asociado el cumplimiento de metas del sistema europeo de rendimientos?", "opts": ["Un esquema de incentivos y penalizaciones", "Un esquema de subvenciones sin penalizaciones", "Un esquema de certificación anual de los proveedores", "Un esquema de tasas fijas por vuelo controlado"], "ans": 0, "why": "«...con un esquema de incentivos y penalizaciones asociado».", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 145, "stem": "Según el manual 7, ¿en periodos de qué duración se despliega la normativa de rendimientos?", "opts": ["De cuatro años, salvo el primero, que duró cinco", "De tres años en todos los casos", "De cinco años, aunque el primero duró tres", "De cinco años, aunque el último durará seis"], "ans": 2, "why": "«La normativa se despliega en períodos de cinco años (aunque el primero duró tres)»: RP1 2012-2014.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 146, "stem": "Según la figura de periodos del manual 7, ¿qué años abarca el tercer periodo (RP3)?", "opts": ["2015-2019", "2025-2029", "2012-2014", "2020-2024"], "ans": 3, "why": "1.er periodo RP1 2012-2014; 2.º RP2 2015-2019; 3.er RP3 2020-2024; 4.º RP4 2025-2029.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13, figura", "note": ""}, {"n": 147, "stem": "Según el manual 7 (nov. 2026), ¿por qué supondrá el RP4 (2025-2029) un importante reto?", "opts": ["Porque los objetivos planteados en las cuatro áreas de rendimientos son bastante ambiciosos", "Porque las áreas de rendimiento se reducen de cuatro a dos", "Porque desaparece el esquema de incentivos y penalizaciones", "Porque el periodo se alarga de cinco a siete años"], "ans": 0, "why": "«RP4 (2025-2029) supondrá un importante reto en cuanto a que los objetivos planteados en las cuatro áreas de rendimientos son bastante ambiciosos». La edición anterior decía que «se prevé que» fueran ambiciosos.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13", "note": ""}, {"n": 148, "stem": "Según el manual 7, ¿qué periodo de referencia duró solo tres años?", "opts": ["El RP4", "El RP1 (2012-2014)", "El RP2", "El RP3"], "ans": 1, "why": "Los periodos son de cinco años «aunque el primero duró tres»: RP1, 2012-2014.", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13, texto y figura", "note": ""}, {"n": 149, "stem": "Según el manual 7 (nov. 2026), ¿cuál es el periodo de referencia actual del sistema de rendimientos?", "opts": ["El RP4", "El RP3", "El RP2", "El RP5"], "ans": 0, "why": "El período actual se extiende desde 2025 hasta 2029, que en la figura es el «4.º periodo (RP4)». En la edición de nov. 2024 el actual era el RP3 (2020-2024).", "src": "Manual 7 (nov. 2026), capítulo 1.3, p. 13, texto y figura", "note": ""}, {"n": 150, "stem": "Según el manual 7, ¿de acuerdo con qué normativa está certificada ENAIRE como organización proveedora de servicios de navegación aérea?", "opts  ATFM, FPD, ASM", "ATS, CNS, AIS, ATFM, ASM, FPD", "ATS, ATFM, ASM, CNS, AIS, FPD"], "ans": 2, "why": "1.4.1 ATS, 1.4.2 CNS, 1.4.3 AIS, 1.4.4 ATFM, 1.4.5 ASM local (táctico/nivel 3), 1.4.6 FPD.", "src": "Manual 7 (nov. 2026), capítulo 1.4, pp. 13-14", "note": ""}, {"n": 155, "stem": "Según el manual 7, una vez superada la Formación de Unidad, ¿qué puede hacer el controlador?", "opts": ["Obtener la licencia de alumno controlador de tránsito aéreo", "Ejercer las atribuciones de su Licencia en dicha unidad", "Acceder a los puestos de instructor y evaluador", "Solicitar la conversión a otra dependencia ATC"], "ans": 1, "why": "«...una vez superada esta formación, podrás ejercer las atribuciones de tu Licencia en dicha unidad».", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 156, "stem": "Según el manual 7, la Formación de Unidad son cursos para cada anotación de unidad establecida en la dependencia de ATC, tal y como se define en:", "opts": ["El plan de formación de la unidad", "El plan de capacitación de unidad", "El Plan de contingencia ATS (PCATS)", "El Plan de Vuelo 2025"], "ans": 0, "why": "«Cursos de formación para cada anotación de unidad establecida en la dependencia de ATC, tal y como se define en el plan de formación de la unidad». El «plan de capacitación de unidad» es el que fija los requisitos de la formación continua.", "src": "Manual 7 (nov. 2026), capítulo 1.5.A, p. 15", "note": ""}, {"n": 157, "stem": "Según el manual 7, ¿de conformidad con qué plan se imparte la formación continua (actualización y conversión)?", "opts": ["El plan de formación de la unidad", "El plan de capacitación de unidad", "El Plan de contingencia ATS (PCATS)", "El plan de carrera profesional"], "ans": 1, "why": "«Formación continua: Formación de actualización y conversión que se impartirá de conformidad con los requisitos incluidos en el plan de capacitación de unidad, dirigida a mantener la cualificación». Par fácil de confundir con el «plan de formació
