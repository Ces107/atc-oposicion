<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test: Entorno profesional</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

const Q=[{"n": 1, "stem": "¿Qué ley creó la Entidad Pública Empresarial Aeropuertos españoles y Navegación Aérea (Aena EPE), que después pasó a denominarse ENAIRE?", "opts": ["La Ley 9/2010, sobre la liberalización de los servicios de tránsito aéreo de aeródromo", "La Ley 18/2014, de medidas urgentes para el crecimiento, la competitividad y la eficiencia", "El artículo 82 de la Ley 4/1990, de Presupuestos Generales del Estado para 1990", "El Real Decreto 160/2023, por el que se aprueba el Estatuto de la entidad"], "ans": 2, "why": "El manual 7 (capítulo 1) dice que Aena EPE fue creada por el «artículo 82 de la Ley 4/1990 de 29 de junio, de Presupuestos Generales del Estado para 1990». La Ley 18/2014 la rebautizó como ENAIRE; la Ley 9/2010 liberalizó los ATS de aeródromo; el RD 160/2023 no aparece en el manual.", "src": "Manual 7, capítulo 1, p. 3", "note": ""}, {"n": 2, "stem": "Según el manual 7, ¿qué ley cambió el nombre de Aena EPE por el de ENAIRE?", "opts": ["La Ley 18/2014, de 15 de octubre", "La Ley 4/1990, de 29 de junio", "La Ley 9/2010", "La Ley 40/2015"], "ans": 0, "why": "El cambio de nombre lo hizo la Ley 18/2014, de 15 de octubre (medidas urgentes para el crecimiento, la competitividad y la eficiencia). La Ley 4/1990 creó la entidad.", "src": "Manual 7, capítulo 1, p. 3", "note": ""}, {"n": 3, "stem": "Según la cronología «Historia» del manual 7, ¿qué ocurrió en 2013?", "opts": ["Aena Aeropuertos S.A. se separó de la entidad pública", "Un acuerdo entre España y Portugal creó el Bloque Funcional de Espacio Aéreo Sudoeste (SW FAB)", "El capital privado entró en el 49 % de Aena S.A.", "Aena pasó a denominarse ENAIRE"], "ans": 1, "why": "2013: acuerdo entre España y Portugal para el SW FAB. La separación es de 2011, el cambio de nombre de 2014 y la entrada del capital privado de 2015.", "src": "Manual 7, p. 3, cronología", "note": ""}, {"n": 4, "stem": "Tras la entrada del capital privado en 2015, ¿qué porcentaje de Aena S.A. conservó ENAIRE, según el manual 7?", "opts": ["49 %", "33 %", "66,66 %", "51 %"], "ans": 3, "why": "El capital privado entró en el 49 % de la sociedad y ENAIRE conservó el 51 % de las acciones. El 49 % es la participación privada; el 66,66 % es la participación de ENAIRE en CRIDA.", "src": "Manual 7, p. 3, cronología, y capítulo 1.1.2, p. 7", "note": ""}, {"n": 5, "stem": "Según la cronología del manual 7, ¿qué se firmó el 23 de diciembre de 2016?", "opts": ["Un nuevo convenio ENAIRE-Aena S.A. para la prestación de servicios de navegación aérea, por un periodo de 5 años", "El acuerdo España-Portugal para el SW FAB", "El III Convenio Colectivo de controladores de tránsito aéreo", "El acuerdo para crear la Fundación ENAIRE"], "ans": 0, "why": "La entrada de 2016 dice: nuevo convenio ENAIRE-Aena S.A. de servicios de navegación aérea, firmado el 23 de diciembre de 2016 por 5 años.", "src": "Manual 7, p. 3, cronología", "note": ""}, {"n": 6, "stem": "¿Cuál de las siguientes era una de las seis palabras con «+» del Plan de Vuelo 2020 (2017-2020) que muestra la cronología del manual 7?", "opts": ["+Rápidos", "+Digitales", "+Puntuales", "+Innovadores"], "ans": 2, "why": "Las seis palabras son +Seguros, +Competitivos, +Ecológicos, +Puntuales, +Valorados y +Comprometidos.", "src": "Manual 7, p. 3, cronología", "note": ""}, {"n": 7, "stem": "Según el manual 7, ¿qué extensión de espacio aéreo gestiona ENAIRE?", "opts": ["2190 km²", "2 190 000 km²", "1 370 000 km²", "21 900 000 km²"], "ans": 1, "why": "El manual 7 dice «2.190.000 kilómetros cuadrados». Los 1 370 000 km² son la superficie del ACC de Gran Canaria por sí solo.", "src": "Manual 7, capítulo 1.1, pp. 4-5", "note": ""}, {"n": 8, "stem": "Por volumen de tráfico, ¿qué posición ocupa ENAIRE en Europa según el manual 7?", "opts": ["La primera", "La segunda", "La tercera", "La cuarta"], "ans": 3, "why": "El manual dice que ENAIRE es «el principal proveedor de servicios de navegación aérea y de información aeronáutica en España, el cuarto en Europa por volumen de tráfico y uno de los más importantes a nivel mundial».", "src": "Manual 7, capítulo 1.1, p. 4", "note": ""}, {"n": 9, "stem": "¿En qué año designó el Estado a ENAIRE Operador de Infraestructuras Críticas?", "opts": ["2015", "2014", "2019", "2010"], "ans": 0, "why": "Operador de Infraestructuras Críticas: 2015. Operador de Servicios Esenciales: 2019.", "src": "Manual 7, capítulo 1.1, p. 5", "note": ""}, {"n": 10, "stem": "¿En qué año fue designada ENAIRE Operador de Servicios Esenciales?", "opts": ["2015", "2016", "2019", "2023"], "ans": 2, "why": "2019 (la designación como Operador de Infraestructuras Críticas fue en 2015).", "src": "Manual 7, capítulo 1.1, p. 5", "note": ""}, {"n": 11, "stem": "En el esquema institucional del manual 7, ¿qué papel se asigna a la Agencia Estatal de Seguridad Aérea (AESA)?", "opts": ["Regulador que diseña la estrategia de la política aeronáutica", "Supervisor del cumplimiento de las normas de aviación civil en España", "Proveedor nacional de servicios de navegación aérea", "Proveedor de servicios meteorológicos para la aviación"], "ans": 1, "why": "AESA es el «supervisor». El regulador es la Dirección General de Aviación Civil y el proveedor es ENAIRE.", "src": "Manual 7, p. 4, figura", "note": ""}, {"n": 12, "stem": "¿Cuáles son las tres regiones de información de vuelo (FIR) que muestra el manual 7?", "opts": ["Madrid, Barcelona y Sevilla", "Madrid, Palma y Canarias", "Barcelona, Sevilla y Canarias", "Madrid, Barcelona y Canarias"], "ans": 3, "why": "El mapa recoge 3 Regiones de Información de Vuelo: Madrid, Barcelona y Canarias. Sevilla y Palma son ACC (centros de control), no FIR.", "src": "Manual 7, p. 5, mapa", "note": ""}, {"n": 13, "stem": "¿Cuáles son los dos centros de control de área terminal (TACC) que muestra el mapa del manual 7?", "opts": ["Santiago y Valencia", "Málaga y Valencia", "Bilbao y Santiago", "Valencia y Palma"], "ans": 0, "why": "El mapa indica «2 TACCs Centros de Control de Área Terminal: Santiago y Valencia».", "src": "Manual 7, p. 5, mapa", "note": ""}, {"n": 14, "stem": "¿Qué ACC tiene la mayor superficie en el mapa del manual 7?", "opts": ["Madrid (435 000 km²)", "Barcelona (266 000 km²)", "Gran Canaria (1 370 000 km²)", "Sevilla (179 000 km²)"], "ans": 2, "why": "Gran Canaria, 1 370 000 km²; el más pequeño es Palma (51 400 km²).", "src": "Manual 7, p. 5, mapa", "note": ""}, {"n": 15, "stem": "¿Qué pareja de región y centro de control es correcta en el manual 7?", "opts": ["Balear / Barcelona", "Sur / Sevilla", "Este / Madrid", "Centro-Norte / Palma"], "ans": 1, "why": "Las cinco son Centro-Norte / Madrid, Este / Barcelona, Sur / Sevilla, Canarias / Gran Canaria y Balear / Palma.", "src": "Manual 7, p. 5, mapa", "note": ""}, {"n": 16, "stem": "Según el manual 7, ¿a cuántas personas transportó en 2023 el tráfico aéreo atendido por ENAIRE?", "opts": ["Más de 28 millones", "Más de 128 millones", "Más de 228 millones", "Más de 328 millones"], "ans": 3, "why": "Manual 7: más de 2 millones de vuelos que transportaron a más de 328 millones de personas en 2023.", "src": "Manual 7, capítulo 1.1, p. 4", "note": ""}, {"n": 17, "stem": "En el organigrama del manual 7 (capítulo 1.1.1), ¿quién aparece directamente por encima del Director General?", "opts": ["El Presidente", "La Secretaria General", "El Director de Servicios de Navegación Aérea", "El Ministro de Transportes"], "ans": 0, "why": "El organigrama sitúa al Presidente (José Antonio Santano Clavero) en la cúspide, por encima del Director General (Enrique Maurer Somolinos); el Director de Servicios de Navegación Aérea está por debajo del Director General.", "src": "Manual 7, capítulo 1.1.1, p. 6", "note": ""}, {"n": 18, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en CRIDA?", "opts": ["36 %", "45,85 %", "66,66 %", "50 %"], "ans": 2, "why": "CRIDA 66,66 %; STARTICAL 50 %; Ineco 45,85 %; Grupo EAD 36 %.", "src": "Manual 7, capítulo 1.1.2, p. 7", "note": ""}, {"n": 19, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en STARTICAL?", "opts": ["66,66 %", "45,85 %", "36 %", "50 %"], "ans": 3, "why": "STARTICAL 50 %. Las demás: CRIDA 66,66 %, Ineco 45,85 %, Grupo EAD 36 %.", "src": "Manual 7, capítulo 1.1.2, p. 7", "note": ""}, {"n": 20, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en Ineco?", "opts": ["45,85 %", "50 %", "66,66 %", "51 %"], "ans": 0, "why": "Ineco 45,85 %.", "src": "Manual 7, capítulo 1.1.2, p. 7", "note": ""}, {"n": 21, "stem": "Según el manual 7, ¿cuál es la participación de ENAIRE en el Grupo EAD?", "opts": ["45,85 %", "36 %", "50 %", "66,66 %"], "ans": 1, "why": "Grupo EAD 36 %.", "src": "Manual 7, capítulo 1.1.2, p. 7", "note": ""}, {"n": 22, "stem": "En el organigrama del grupo empresarial del manual 7, ¿qué dos entidades figuran como «Participación mayoritaria de ENAIRE»?", "opts": ["Ineco y Startical", "Startical y Grupo EAD", "Aena e Ineco", "Aena y CRIDA"], "ans": 3, "why": "Aena (51 %) y CRIDA (66,66 %) son participaciones mayoritarias; Ineco (45,85 %), GroupEAD (36 %) y Startical (50 %) son «Participadas ENAIRE».", "src": "Manual 7, capítulo 1.1.2, p. 7, figura", "note": ""}, {"n": 23, "stem": "Según el manual 7, ¿a qué se dedica la Fundación ENAIRE?", "opts": ["A formar a los nuevos controladores de tránsito aéreo", "A gestionar la red de aeropuertos", "A gestionar, conservar y difundir el patrimonio artístico de la entidad y a fomentar la cultura aeronáutica", "A financiar proyectos de investigación aeronáutica"], "ans": 2, "why": "Es la redacción del manual 7 (capítulo 1.1.2): «dedicada a gestionar, conservar y difundir el patrimonio artístico de la entidad, así como a fomentar, divulgar e impulsar la cultura aeronáutica en la sociedad».", "src": "Manual 7, capítulo 1.1.2, p. 7", "note": ""}, {"n": 24, "stem": "Según el manual 7, ¿qué proporción de la plantilla de ENAIRE son controladores de tránsito aéreo?", "opts": ["Alrededor del 49 %", "Alrededor del 26 %", "Alrededor del 20 %", "Alrededor del 5 %"], "ans": 0, "why": "Controladores, alrededor del 49 %; Gestión, 26 %; Ingeniería y Explotación Técnica, 20 %; Operaciones, 5 %.", "src": "Manual 7, capítulo 1.1.3, p. 8", "note": ""}, {"n": 25, "stem": "Según el manual 7, ¿cuál es la proporción aproximada del personal de «Ingeniería y Explotación Técnica»?", "opts": ["Alrededor del 5 %", "Alrededor del 20 %", "Alrededor del 26 %", "Alrededor del 49 %"], "ans": 1, "why": "Alrededor del 20 % (personal técnico y de ingeniería dedicado al mantenimiento, la explotación técnica y el desarrollo de los sistemas e instalaciones de navegación aérea).", "src": "Manual 7, capítulo 1.1.3, p. 8", "note": ""}, {"n": 26, "stem": "En el manual 7, ¿qué personal pertenece a la ocupación «Operaciones» (alrededor del 5 %)?", "opts": ["El personal de administración y gestión de la empresa", "El personal de mantenimiento de los sistemas de navegación aérea", "Los controladores de tránsito aéreo", "El personal de información aeronáutica, planes de vuelo y apoyo a la gestión de los ATS"], "ans": 3, "why": "Operaciones = información aeronáutica, planes de vuelo y apoyo a la gestión de los servicios de tránsito aéreo ATS. La administración es «Gestión» y el mantenimiento es «Ingeniería y Explotación Técnica».", "src": "Manual 7, capítulo 1.1.3, p. 8", "note": ""}, {"n": 27, "stem": "Según el manual 7, ¿qué dos convenios colectivos existen en ENAIRE?", "opts": ["El II Convenio de Controladores y el II Convenio del Grupo Aena", "El I Convenio de Controladores y el III Convenio del Grupo Aena", "El III Convenio de Controladores de Tránsito Aéreo y el I Convenio del Grupo Aena", "El III Convenio de Controladores y el III Convenio del Grupo Aena"], "ans": 2, "why": "III Convenio Colectivo profesional de Controladores de Tránsito Aéreo e I Convenio Colectivo del Grupo Aena (personal no controlador).", "src": "Manual 7, capítulo 1.1.3, p. 8", "note": ""}, {"n": 28, "stem": "Según el manual 7, ¿a qué personal se aplica el «I Convenio Colectivo del Grupo Aena»?", "opts": ["Al personal no controlador", "Solo a los controladores de los aeropuertos de Aena", "Solo a los gestores de los aeropuertos de Aena", "Al personal de las filiales"], "ans": 0, "why": "Abarca al personal no controlador (técnicos de mantenimiento, operaciones, sistemas, seguridad, personas, jurídico, económico-administrativo, etc.).", "src": "Manual 7, capítulo 1.1.3, p. 8", "note": ""}, {"n": 29, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito se sitúan los operadores de drones?", "opts": ["Personas", "Clientes", "Sociedad", "Partners / Proveedores"], "ans": 1, "why": "El «Ámbito CLIENTES» incluye las asociaciones de aerolíneas, las aerolíneas y sus pilotos, los gestores aeroportuarios, las asociaciones de aviación no comercial y los operadores de drones.", "src": "Manual 7, capítulo 1.1.4, p. 9", "note": ""}, {"n": 30, "stem": "En la figura de grupos de interés del manual 7, ¿en qué ámbito aparece la Agencia Estatal de Meteorología (AEMET)?", "opts": ["Clientes", "Reguladores / Administraciones públicas", "Sociedad", "Partners / Proveedores"], "ans": 3, "why": "AEMET está en «Partners / Proveedores»; EASA, AESA y el Ejército del Aire están en «Reguladores / Administraciones públicas».", "src": "Manual 7, capítulo 1.1.4, p. 9", "note": ""}, {"n": 31, "stem": "¿Cuál es el Propósito de ENAIRE en el Plan de Vuelo 2025 que cita el manual 7?", "opts": ["«Conectamos España con el mundo de forma segura»", "«Cuidamos de tu vuelo para que sea seguro, eficiente y sostenible»", "«Cuidamos de tu vuelo para que sea seguro, rápido, eficiente y sostenible»", "«Somos el cielo de España, seguro y sostenible»"], "ans": 2, "why": "El propósito del manual tiene cuatro adjetivos, entre ellos «rápido». La opción B es la redacción del Plan de Vuelo 2030 (sin «rápido»).", "src": "Manual 7, capítulo 1.2.1, p. 10", "note": ""}, {"n": 32, "stem": "Completa el Propósito del Plan de Vuelo 2025: «Cuidamos de tu vuelo para que sea seguro, ___, eficiente y sostenible».", "opts": ["rápido", "puntual", "competitivo", "digital"], "ans": 0, "why": "Los cuatro adjetivos son seguro, rápido, eficiente y sostenible.", "src": "Manual 7, capítulo 1.2.1, p. 10", "note": ""}, {"n": 33, "stem": "Según el manual 7, ¿en qué tres elementos se basa la Visión de ENAIRE (Plan de Vuelo 2025)?", "opts": ["Seguridad, calidad y sostenibilidad", "Las personas, la innovación y la digitalización", "Clientes, capacidad y coste-eficiencia", "Profesionales, innovación y tecnología"], "ans": 1, "why": "«basándonos en las personas, la innovación y la digitalización». La opción D es la redacción del Plan de Vuelo 2030.", "src": "Manual 7, capítulo 1.2.3, p. 10", "note": ""}, {"n": 34, "stem": "¿Cómo se organizan los valores de ENAIRE en el manual 7?", "opts": ["6 valores en 2 grupos", "8 valores en 4 grupos", "9 valores en 3 grupos", "12 valores en 4 grupos de 3"], "ans": 3, "why": "Cuatro grupos («La seguridad es lo primero»; «Comprometidos con los clientes y la sociedad»; «Somos un solo y gran equipo»; «\"Hambre\" de mejora de nuestra organización») de tres valores cada uno.", "src": "Manual 7, capítulo 1.2.4, p. 10", "note": ""}, {"n": 35, "stem": "¿Cuál de los siguientes NO es el título de un grupo de valores en el manual 7?", "opts": ["La seguridad es lo primero", "Comprometidos con los clientes y la sociedad", "\"Hambre\" de mejora de nuestra organización", "Perseguimos la excelencia"], "ans": 3, "why": "«Perseguimos la excelencia» es el título del grupo 4 del Plan de Vuelo 2030; en el manual el grupo 4 es «\"Hambre\" de mejora de nuestra organización».", "src": "Manual 7, capítulo 1.2.4, p. 10; resumen del PV2030", "note": ""}, {"n": 36, "stem": "En el manual 7, ¿a qué grupo de valores pertenece «Actitud de confianza y \"cultura justa\"»?", "opts": ["Somos un solo y gran equipo", "Comprometidos con los clientes y la sociedad", "La seguridad es lo primero", "\"Hambre\" de mejora de nuestra organización"], "ans": 2, "why": "El grupo 1 contiene En nuestro ADN, Actitud de confianza y «cultura justa» y Refuerzo e impulso de la Seguridad.", "src": "Manual 7, capítulo 1.2.4, p. 10", "note": ""}, {"n": 37, "stem": "¿Qué valor del manual 7 se define como actuar «con ética, honestidad y transparencia en el desempeño de nuestro trabajo»?", "opts": ["Somos ENAIRE", "La integridad es nuestro carácter", "Respetamos y confiamos", "Somos empáticos"], "ans": 1, "why": "«La integridad es nuestro carácter» (grupo 3, Somos un solo y gran equipo). «Respetamos y confiamos» menciona la generosidad y la humildad.", "src": "Manual 7, capítulo 1.2.4, p. 10", "note": ""}, {"n": 38, "stem": "En el manual 7, ¿a qué grupo pertenece el valor «Somos proactivos»?", "opts": ["La seguridad es lo primero", "Comprometidos con los clientes y la sociedad", "Somos un solo y gran equipo", "\"Hambre\" de mejora de nuestra organización"], "ans": 3, "why": "El grupo 4 contiene Somos innovadores, Flexibles ante los cambios y Somos proactivos («con implicación e iniciativa construimos el futuro de ENAIRE»).", "src": "Manual 7, capítulo 1.2.4, p. 10", "note": ""}, {"n": 39, "stem": "¿Cuál de los siguientes NO es uno de los tres valores del grupo «Somos un solo y gran equipo» en el manual 7?", "opts": ["Somos proactivos", "Somos ENAIRE", "La integridad es nuestro carácter", "Respetamos y confiamos"], "ans": 0, "why": "Los tres valores son Somos ENAIRE, La integridad es nuestro carácter y Respetamos y confiamos. «Somos proactivos» está en el grupo 4.", "src": "Manual 7, capítulo 1.2.4, p. 10", "note": ""}, {"n": 40, "stem": "¿Cuántos objetivos estratégicos tiene el Plan de Vuelo 2025 en el manual 7?", "opts": ["4", "5", "6", "8"], "ans": 2, "why": "Seis objetivos (capítulo 1.2.5).", "src": "Manual 7, capítulo 1.2.5, pp. 10-11", "note": ""}, {"n": 41, "stem": "¿Qué objetivo estratégico del manual 7 habla de «recuperación económica y viabilidad futura» y de superar la crisis?", "opts": ["El objetivo 3", "El objetivo 5", "El objetivo 4", "El objetivo 6"], "ans": 1, "why": "Objetivo 5: «Asegurar la recuperación económica y viabilidad futura de ENAIRE, y aumentar la eficiencia, productividad y, por tanto, la competitividad de la empresa para superar la crisis».", "src": "Manual 7, capítulo 1.2.5, p. 11", "note": ""}, {"n": 42, "stem": "¿A qué elementos presta especial atención el objetivo 1 del Plan de Vuelo 2025 en el manual 7?", "opts": ["Desarrollo del negocio, internacionalización y liberalización", "Digitalización, modernización del espacio aéreo y conceptos operativos", "Descarbonización e impacto medioambiental", "Cultura de seguridad, factor humano y ciberseguridad"], "ans": 3, "why": "Objetivo 1: reforzar la seguridad, «prestando especial atención a la cultura de seguridad, al factor humano y a la ciberseguridad ante los nuevos riesgos emergentes». B es el objetivo 2; C es el objetivo 3; A es el objetivo 4.", "src": "Manual 7, capítulo 1.2.5, p. 10", "note": ""}, {"n": 43, "stem": "¿Qué objetivo del manual 7 aspira a la «movilidad sostenible en el sector», minimizando el impacto medioambiental e impulsando la descarbonización?", "opts": ["El objetivo 1", "El objetivo 2", "El objetivo 3", "El objetivo 6"], "ans": 2, "why": "El objetivo 3.", "src": "Manual 7, capítulo 1.2.5, p. 11", "note": ""}, {"n": 44, "stem": "Según el manual 7, ¿quién creó la iniciativa del Cielo Único Europeo (SES) y en qué año?", "opts": ["La Comisión Europea, en 1999", "El Parlamento Europeo, en 2004", "EUROCONTROL, en 1960", "El Consejo de la UE, en 2009"], "ans": 0, "why": "«La iniciativa del Cielo Único Europeo (SES), creada por la Comisión Europea en 1999». El paquete SES I se aprobó en 2004 y el SES II en 2009.", "src": "Manual 7, capítulo 1.3, p. 11", "note": ""}, {"n": 45, "stem": "¿Qué dos objetivos da el manual 7 para el Cielo Único Europeo?", "opts": ["Aumentar la capacidad militar y reducir el precio del combustible", "Crear una licencia única de controlador y un idioma único", "Reducir el número de aerolíneas y unificar las tasas aeroportuarias", "Mejorar la prestación de los servicios de navegación aérea (capacidad, seguridad, coste-eficiencia, medio ambiente) y reducir la fragmentación del espacio aéreo europeo"], "ans": 3, "why": "Son los puntos a y b del capítulo 1.3.", "src": "Manual 7, capítulo 1.3, p. 11", "note": ""}, {"n": 46, "stem": "¿Cuántos proveedores de servicios de navegación aérea (ANSP) y centros de control de tránsito aéreo muestra el mapa de Europa del manual 7?", "opts": ["27 proveedores y 44 centros", "38 proveedores y 63 centros", "63 proveedores y 38 centros", "44 proveedores y 27 centros"], "ans": 1, "why": "«38 Proveedores de Servicio de Navegación Aérea; 63 Centros de Control de Tráfico Aéreo».", "src": "Manual 7, capítulo 1.3, p. 11, figura", "note": ""}, {"n": 47, "stem": "Según el manual 7, ¿en qué años se aprobaron y entraron en vigor los paquetes SES I y SES II?", "opts": ["SES I en 1999 y SES II en 2004", "SES I en 2004 y SES II en 2020", "SES I en 2004 y SES II en 2009", "SES I en 2009 y SES II en 2014"], "ans": 2, "why": "SES I en 2004; SES II en 2009; la Comisión Europea retomó SES2+ a finales de 2020.", "src": "Manual 7, capítulo 1.3, p. 12", "note": ""}, {"n": 48, "stem": "Según el manual 7, ¿qué cuatro áreas abarca el sistema europeo de rendimientos?", "opts": ["Seguridad, Coste-Eficiencia, Capacidad y Medioambiente", "Seguridad, Calidad, Puntualidad y Coste", "Capacidad, Medioambiente, Innovación y Seguridad", "Eficiencia, Sostenibilidad, Digitalización y Personas"], "ans": 0, "why": "Seguridad, Coste-Eficiencia, Capacidad y Medioambiente, «con un esquema de incentivos y penalizaciones asociado».", "src": "Manual 7, capítulo 1.3, p. 12", "note": ""}, {"n": 49, "stem": "Según la figura del manual 7, ¿cuáles son las fechas del segundo periodo de referencia (RP2)?", "opts": ["2012-2014", "2020-2024", "2025-2029", "2015-2019"], "ans": 3, "why": "RP1 2012-2014; RP2 2015-2019; RP3 2020-2024; RP4 2025-2029.", "src": "Manual 7, capítulo 1.3, p. 12, figura", "note": ""}, {"n": 50, "stem": "¿Qué periodo de referencia describe el manual 7 como el «actual»?", "opts": ["De 2015 a 2019", "De 2020 a 2024", "De 2025 a 2029", "De 2012 a 2014"], "ans": 1, "why": "El manual dice que «el periodo actual se extiende desde 2020 hasta 2024» y que el RP4 (2025-2029) «supondrá un importante reto» (el manual es de noviembre de 2024).", "src": "Manual 7, capítulo 1.3, p. 12", "note": ""}, {"n": 51, "stem": "¿Cuál de los siguientes NO es uno de los servicios para los que ENAIRE está certificada en el manual 7 (capítulo 1.4)?", "opts": ["Gestión de afluencia del tránsito aéreo (ATFM)", "Diseño de procedimientos de vuelo (FPD)", "Servicio meteorológico aeronáutico (MET)", "Servicio de información aeronáutica (AIS)"], "ans": 2, "why": "Los seis servicios son ATS, CNS, AIS, ATFM, ASM local y FPD. La meteorología no figura (AEMET aparece como partner en la figura de grupos de interés).", "src": "Manual 7, capítulo 1.4, pp. 12-13", "note": ""}, {"n": 52, "stem": "Según el manual 7, ¿qué tipo de gestión del espacio aéreo (ASM) presta ENAIRE?", "opts": ["Local, táctica (nivel 3), asegurando la coordinación civil/militar", "Estratégica (nivel 1) a escala europea", "Pretáctica (nivel 2) para toda Europa", "Solo en aeródromos militares"], "ans": 0, "why": "«Gestión del Espacio Aéreo (ASM) local (táctico/nivel 3) asegurando la coordinación con civil / militar».", "src": "Manual 7, capítulo 1.4.5, p. 13", "note": ""}, {"n": 53, "stem": "¿Qué función NO forma parte del Servicio de Tránsito Aéreo (ATS) tal como lo describe el manual 7 (capítulo 1.4.1)?", "opts": ["Prevenir colisiones y acelerar y mantener ordenado el movimiento del tránsito", "Proporcionar asesoramiento e información útiles para la operación segura y eficaz de los vuelos", "Notificar y auxiliar a los organismos pertinentes respecto de las aeronaves que necesitan ayuda y salvamento", "Garantizar la explotación y el mantenimiento de las instalaciones técnicas del sistema de navegación"], "ans": 3, "why": "D es la definición del servicio CNS (capítulo 1.4.2).", "src": "Manual 7, capítulos 1.4.1-1.4.2, pp. 12-13", "note": ""}, {"n": 54, "stem": "¿Qué servicio se describe como el que pone a disposición de los usuarios del espacio aéreo toda la información de navegación aérea relevante, actualizada y con la calidad necesaria para que las operaciones se desarrollen de forma segura y eficiente?", "opts": ["CNS", "AIS", "ATFM", "FPD"], "ans": 1, "why": "Servicio de Información Aeronáutica (AIS), capítulo 1.4.3.", "src": "Manual 7, capítulo 1.4.3, p. 13", "note": ""}, {"n": 55, "stem": "Según el manual 7, ¿en qué tres partes se divide la Formación de Unidad de los controladores en ENAIRE?", "opts": ["Teoría, examen y expedición de la licencia", "Simulador, examen y OJT", "Formación de transición (teoría), Pre-OJT (simulador) y OJT (en el puesto de trabajo)", "Formación inicial, de actualización y de conversión"], "ans": 2, "why": "Formación de transición (teoría), Pre-OJT (formación en simulador) y OJT (formación en el puesto de trabajo). La actualización y la conversión pertenecen a la formación continua.", "src": "Manual 7, capítulo 1.5.A, p. 14", "note": ""}, {"n": 56, "stem": "En el manual 7, ¿qué es la fase «Pre-OJT» de la Formación de Unidad?", "opts": ["Formación en simulador", "Formación teórica en aula", "Formación en el puesto de trabajo con tráfico real", "Formación en lengua inglesa"], "ans": 0, "why": "«Pre-OJT: Formación en simulador». El OJT es en el puesto de trabajo; la formación de transición es teórica.", "src": "Manual 7, capítulo 1.5.A, p. 14", "note": ""}, {"n": 57, "stem": "¿Qué formación es «necesaria para mantener la anotación de Unidad» y abarca los procedimientos y prácticas estándar, las situaciones anormales y emergencias, el PCATS y los factores humanos?", "opts": ["La Formación de Conversión", "La formación de transición", "La formación lingüística", "La Formación de Actualización"], "ans": 3, "why": "La Formación de Actualización mantiene la anotación de Unidad. La Formación de Conversión está asociada a los cambios operativos que se implementen en cada unidad.", "src": "Manual 7, capítulo 1.5.A, p. 14", "note": ""}, {"n": 58, "stem": "En el manual 7, ¿qué significan las siglas PCATS?", "opts": ["Plan de Capacitación de Aeródromo y Torre de Sector", "Plan de contingencia ATS", "Programa de control aéreo en tiempo de situación", "Plan de coordinación de aeronaves en tránsito seguro"], "ans": 1, "why": "«PCATS (Plan de contingencia ATS)», incluido en la Formación de Actualización.", "src": "Manual 7, capítulo 1.5.A, p. 14", "note": ""}, {"n": 59, "stem": "Según el manual 7, ¿qué instituciones ofrecen junto con ENAIRE el «Máster en Gestión de Servicios de Navegación Aérea»?", "opts": ["La Universidad Politécnica de Madrid y la Universidad Autónoma de Madrid, en colaboración con la OACI", "La Universidad Complutense y EUROCONTROL", "La Universidad de Sevilla y EASA", "AESA y el Ministerio de Defensa"], "ans": 0, "why": "ENAIRE con la Universidad Politécnica y la Universidad Autónoma de Madrid y en colaboración con la Organización de Aviación Civil Internacional (OACI).", "src": "Manual 7, capítulo 1.5.B, p. 15", "note": ""}, {"n": 60, "stem": "Según el manual 7, ¿qué certificación de programa de la OACI tiene actualmente el máster de ENAIRE?", "opts": ["Next Generation of Aviation Professionals (NGAP) de la OACI", "Global Aviation Training (GAT) de la OACI", "TRAINAIR PLUS", "Centro Regional de Formación de la OACI"], "ans": 2, "why": "«cuenta actualmente con la certificación de programa TRAINAIR PLUS de OACI».", "src": "Manual 7, capítulo 1.5.B, p. 15", "note": ""}, {"n": 61, "stem": "¿Cuál de los siguientes valores aparece en el Plan de Vuelo 2030 pero NO en el Plan de Vuelo 2025 impreso en el manual 7?", "opts": ["Somos innovadores", "Lideramos desde la excelencia", "Flexibles ante los cambios", "La integridad es nuestro carácter"], "ans": 1, "why": "«Lideramos desde l     idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
