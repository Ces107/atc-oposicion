<style>
:root{
  --bg:#f4f2ec; --stripe:#ebe8df; --surface:#ffffff; --text:#1b1b1b; --muted:#5f5b53; --rule:#cfcabd;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161615; --stripe:#262624; --surface:#1e1e1c; --text:#e7e4dc; --muted:#a19c90; --rule:#3a3935;
    --accent:#7fb0e8; --accent-h:#a6c8f0; --onacc:#161615; --warn:#e08a55; --ok:#7cbf8a; --err:#e5766d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);overflow-x:hidden}

.top h1{font:700 24px/1.1 var(--serif);margin:0;flex:1;min-width:0}
.top a.back{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;padding:6px 0;white-space:nowrap}
.top a.back:hover{text-decoration:underline;color:var(--accent-h)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.logo{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1100px;margin:0 auto;padding:4px 16px 40px}
h2{font:700 21px/1.3 var(--serif);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:1.8em 0 .7em;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:.6em}
h3{font:700 17px var(--serif);margin:1em 0 .3em}
p{margin:.4rem 0}
.soft{color:var(--muted)} .small{font-size:14px}
.good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:7px 12px;transition:background-color .12s,color .12s}
.btn:hover{background:var(--stripe);color:var(--accent-h)}

.btn.primary:hover{background:var(--accent-h);color:var(--onacc)}

.btn.sq{padding:7px 9px}
.seg{display:inline-flex;flex-wrap:wrap}

.seg button:first-child{border-radius:2px 0 0 2px;margin-left:0}
.seg button:last-child{border-radius:0 2px 2px 0}
.seg button:only-child{border-radius:2px}
.seg button:hover{background:var(--stripe)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--accent);color:var(--onacc)}

.fig{padding:8px 22px 8px 0;min-width:84px}
.fig b{font-variant-numeric:lining-nums tabular-nums;display:block;font:700 26px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.fig.bad b{color:var(--err)} .fig.good b{color:var(--ok)} .fig.warn b{color:var(--warn)}

th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--text);padding:6px 12px 6px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);vertical-align:middle;font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto}
.split{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:8px 28px;align-items:start}

.stage{width:100%;max-width:520px;margin:0 auto}
svg.fig-svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg text{font-family:var(--sans);fill:var(--text)}
.hit{cursor:grab}
.hit:active{cursor:grabbing}
.rd{border-top:1px solid var(--text);margin:8px 0 12px}
.rd div{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);color:var(--muted);font-variant-numeric:tabular-nums}
.rd div.on{color:var(--text)}
.rd div.cur{color:var(--text);font-weight:700}
.rd div b{font-variant-numeric:lining-nums tabular-nums;font:700 20px/1.2 var(--serif);color:var(--text);min-width:3.2ch}
.rd div i{font-style:normal;color:var(--accent);min-width:5.5ch;font-weight:600}
.rd div em{font-style:normal;color:var(--warn);margin-left:auto;font-size:13px}
.big{font-variant-numeric:lining-nums tabular-nums;font:700 34px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.foot{max-width:1100px;margin:0 auto;padding:14px 16px 36px;border-top:1px solid var(--rule)}
.foot a{color:var(--accent);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.foot a:hover{text-decoration:underline}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}

.rd div span{flex:1;min-width:0}
.rd div b{text-align:right}
.ctl{margin:6px 0 4px}
.ctl[hidden]{display:none}
.ctl .row{margin:2px 0}
.under{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:6px}
.dirb button{min-width:96px;justify-content:center}
#rose{cursor:grab;touch-action:none}

<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function lsLoad(key, def) { try { const v = localStorage.getItem(key); return v ? Object.assign({}, def, JSON.parse(v)) : def; } catch (e) { return def; } }
function lsSave(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
// Tolerant number parser: "070", " 70° ", "7,5", "+3" -> number; anything else -> NaN
function parseNum(s) {

  s = String(s).trim().replace(',', '.').replace(/[°\s]/g, '');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;

}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const pad3 = h => String(Math.round(h)).padStart(3, '0');
const RAD = Math.PI / 180;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion:reduce)').matches; } catch (e) { return false; } })();
// Pointer position in SVG user units
function svgPt(svg, ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;

}
// Generic drag: onDown(pt, ev) returns truthy to start; onMove(pt, ev); onUp()
function bindDrag(svg, onDown, onMove, onUp) {

    if (ev.button !== undefined && ev.button > 0) return;
    const p = svgPt(svg, ev);

  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);

// Numeric text input bound to a setter; accepts partial typing, commits on any parseable value, normalises on blur
function bindNum(el, get, set, fmt) {

  el.addEventListener('input', () => { const v = parseNum(el.value); if (!isNaN(v)) set(v, true); });
  el.addEventListener('blur', show);

let _tw = {};

}
const fx = (x, d) => (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ',');
const f1 = x => (Math.abs(x) < 0.05 ? '0' : x.toFixed(1)).replace('.', ',');
function mmss(sec) { sec = Math.round(sec); const m = Math.floor(Math.abs(sec) / 60), s = Math.abs(sec) % 60; return (sec < 0 ? '−' : '') + m + ':' + String(s).padStart(2, '0'); }


// ==== LOGIC START ====
const mod = (a, n) => ((a % n) + n) % n;
// Heading convention: 1..360 (north is 360, never 000)
function hdg(x) { const m = mod(Math.round(x * 1e6) / 1e6, 360); return m === 0 ? 360 : m; }

// "+200 -20" method with raw numbers, subtracting 360 only if the result goes past 360
function recipSteps(h) {

// Turn right (R, add) or left (L, subtract) by deg degrees; raw = number before wrapping, adj = +-360k applied

}

(function () {

  function arc(a0, sw, r, col, w, dash) {
    if (Math.abs(sw) < 0.05) return '';
    if (Math.abs(sw) >= 359.9) return `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}"${dash ? ' stroke-dasharray="' + dash + '"' : ''}/>`;
    const a = P(a0, r), b = P(a0 + sw, r);
    return `<path d="M${q(a[0])} ${q(a[1])}A${r} ${r} 0 ${Math.abs(sw) > 180 ? 1 : 0} ${sw > 0 ? 1 : 0} ${q(b[0])} ${q(b[1])}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ' stroke-dasharray="' + dash + '"' : ''}/>`;
  }
  function head(aEnd, dir, r, col) {
    const ahead = dir * (11 / r) / RAD, t = P(aEnd + ahead, r), b1 = P(aEnd, r + 5), b2 = P(aEnd, r - 5);
    return `<polygon points="${q(t[0])},${q(t[1])} ${q(b1[0])},${q(b1[1])} ${q(b2[0])},${q(b2[1])}" fill="${col}"/>`;
  }
  const PLANE = 'M0 -14L3 -4L13 3V6L3 3L2 11L6 14V16L0 14L-6 16V14L-2 11L-3 3L-13 6V3L-3 -4Z';
  function plane(a, scale, col, op) { return `<g transform="translate(${C} ${C}) rotate(${q(a + view)}) scale(${scale})" opacity="${op || 1}"><path d="${PLANE}" fill="var(--surface)" stroke="${col}" stroke-width="${1.4 / scale}" stroke-linejoin="round"/></g>`; }
  const handle = (a, r, col) => { const [x, y] = P(a, r); return `<circle cx="${q(x)}" cy="${q(y)}" r="9" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`; };
  const AC = 'var(--accent)', WC = 'var(--warn)';

  function base() {
    let s = `<circle cx="${C}" cy="${C}" r="${R}" fill="var(--surface)" stroke="var(--text)" stroke-width="1.2"/>`;
    for (let a = 0; a < 360; a += 5) {
      const len = a % 30 === 0 ? 14 : a % 10 === 0 ? 8 : 4;
      s += L(P(a, R), P(a, R - len), 'var(--text)', a % 30 === 0 ? 1.3 : .7);
    }
    for (let a = 0; a < 360; a += 30) s += T(P(a, R - 29), a === 0 ? '360' : pad3(a), { size: 11 });
    const names = S.pts === 4 ? [0, 4, 8, 12] : S.pts === 8 ? [0, 2, 4, 6, 8, 10, 12, 14] : NAMES16.map((_, i) => i);
    names.forEach(i => {
      const card = i % 4 === 0, a = i * 22.5;
      s += T(P(a, R + (card ? 20 : 17)), NAMES16[i], { size: card ? 17 : (i % 2 === 0 ? 12 : 10), w: card ? 700 : 400, fill: i === 0 ? AC : (card ? 'var(--text)' : 'var(--muted)') });
    });
    return s;
  }
  function wrapMark() { const [x, y] = P(0, R); return `<circle cx="${q(x)}" cy="${q(y)}" r="12" fill="none" stroke="${WC}" stroke-width="2.2"/>`; }

  function drawRec() {
    const r = recipSteps(S.h), st = S.st;
    let s = '', mark = false;
    s += L(P(S.h, 20), P(S.h, R - 4), AC, 3);
    if (st >= 1) {
      const sw = 200 * (st === 1 ? p : 1);
      s += arc(S.h, sw, R - 52, AC, 5);
      if (st > 1 || p > .98) s += head(S.h + 200, 1, R - 52, AC);
      s += T(P(S.h + sw / 2, R - 70), '+200', { size: 14, w: 700, fill: AC });
      if (crossesN(r.h, r.h + sw)) mark = true;
    }
    if (st >= 2) {
      const sw = -20 * (st === 2 ? p : 1);
      s += arc(S.h + 200, sw, R - 64, WC, 5);
      if (st > 2 || p > .98) s += head(S.h + 180, -1, R - 64, WC);
      s += T(P(S.h + 190, R - 84), '−20', { size: 13, w: 700, fill: WC });
      if (crossesN(r.s1, r.s1 + sw)) mark = true;
    }
    if (st >= 3) {
      const rc = recip(S.h);
      s += L(P(S.h, 0), P(rc, R - 4), WC, 3);
      s += L(P(S.h, R - 4), P(rc, R - 4), 'var(--muted)', 1, '3 4');
      s += `<circle cx="${q(P(rc, R)[0])}" cy="${q(P(rc, R)[1])}" r="9" fill="${WC}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    if (mark) s += wrapMark();
    s += plane(S.h, 1.1, 'var(--text)');
    s += handle(S.h, R, AC);
    return s;
  }
  function drawGiro() {
    const t = turn(S.h, S.dir, S.n), sg = S.dir === 'R' ? 1 : -1, col = S.dir === 'R' ? AC : WC;
    let s = L(P(S.h, 20), P(S.h, R - 4), 'var(--muted)', 2, '4 4');
    const sw = sg * S.n * p;
    s += arc(S.h, sw, R - 52, col, 5);
    if (p > .98 && S.n > 0) s += head(S.h + sg * S.n, sg, R - 52, col);
    if (S.n > 0) s += T(P(S.h + sw / 2, R - 72), (sg > 0 ? '+' : '−') + S.n, { size: 14, w: 700, fill: col });
    if (crossesN(hdg(S.h), hdg(S.h) + sw)) s += wrapMark();
    if (p > .98) s += L(P(t.res, 20), P(t.res, R - 4), col, 3);
    s += plane(S.h, 1.1, 'var(--muted)', .45);
    s += plane(S.h + sw, 1.1, 'var(--text)');
    s += handle(S.h, R, 'var(--muted)');
    if (p > .98) { const [x, y] = P(t.res, R); s += `<circle cx="${q(x)}" cy="${q(y)}" r="9" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`; }
    return s;
  }
  function drawCorto() {
    const r = shortest(S.h, S.b);
    let s = '', mark = false;
    if (r.amb) {
      s += arc(S.h, 180, R - 52, AC, 5) + arc(S.h, -180, R - 52, WC, 5);
    } else {
      s += arc(S.h, r.d, R - 52, AC, 5) + head(S.h + r.d, Math.sign(r.d), R - 52, AC);
      const lg = r.d > 0 ? r.d - 360 : r.d + 360;
      s += arc(S.h, lg, R - 66, 'var(--muted)', 2.5, '5 5');
      if (r.d !== 0) s += T(P(S.h + r.d / 2, R - 72), Math.abs(r.d) + '°', { size: 14, w: 700, fill: AC });
    }
    if (crossesN(hdg(S.h), hdg(S.h) + (r.amb ? 180 : r.d))) mark = true;
    if (mark) s += wrapMark();
    s += L(P(S.h, 20), P(S.h, R - 4), AC, 3) + L(P(S.b, 20), P(S.b, R - 4), WC, 3);
    s += plane(S.h, 1.1, 'var(--text)');
    s += handle(S.h, R, AC) + handle(S.b, R, WC);
    return s;
  }
  function drawRel() {
    const rel = relBearing(S.h, S.t), clk = clockPos(rel), sd = sideOf(rel);
    const half = (a0, col) => { const a = P(a0, R - 2), b = P(a0 + 180, R - 2); return `<path d="M${C} ${C}L${q(a[0])} ${q(a[1])}A${R - 2} ${R - 2} 0 0 1 ${q(b[0])} ${q(b[1])}Z" fill="${col}" fill-opacity=".09"/>`; };
    let s = half(S.h, AC) + half(S.h + 180, WC);
    s += T(P(S.h + 90, 104), 'Der', { size: 13, w: 700, fill: AC }) + T(P(S.h + 270, 104), 'Izq', { size: 13, w: 700, fill: WC });
    for (let k = 1; k <= 12; k++) {
      const pt = P(S.h + 30 * k, 64), on = k === clk && sd !== 'none' || (sd === 'none' && k === clk);
      if (on) s += `<circle cx="${q(pt[0])}" cy="${q(pt[1])}" r="11" fill="${sd === 'L' ? WC : AC}"/>`;
      s += T(pt, k, { size: 13, w: on ? 700 : 400, fill: on ? 'var(--surface)' : 'var(--muted)' });
    }
    const sw = rel <= 180 ? rel : rel - 360;
    s += arc(S.h, sw, 92, sd === 'L' ? WC : AC, 3);
    s += L(P(S.h, 30), P(S.h, R - 4), 'var(--text)', 3);
    s += L(P(S.t, 0), P(S.t, R), sd === 'L' ? WC : AC, 2, '6 4');
    const tp = P(S.t, R);
    s += `<circle cx="${q(tp[0])}" cy="${q(tp[1])}" r="10" fill="${sd === 'L' ? WC : AC}" stroke="var(--surface)" stroke-width="2"/><circle cx="${q(tp[0])}" cy="${q(tp[1])}" r="3.5" fill="var(--surface)"/>`;
    s += plane(S.h, 1.5, 'var(--text)');
    const hp = P(S.h, R - 58); s += `<circle cx="${q(hp[0])}" cy="${q(hp[1])}" r="7" fill="var(--text)" stroke="var(--surface)" stroke-width="2"/>`;
    return s;
  }
  function render() {
    const body = S.mode === 'rec' ? drawRec() : S.mode === 'giro' ? drawGiro() : S.mode === 'corto' ? drawCorto() : drawRel();
    svg.innerHTML = base() + body;
  }

  // ---- readout
  const row = (cls, lab, val, note) => `<div class="${cls}"><span>${lab}</span><b>${val}</b>${note ? '<em>' + note + '</em>' : ''}</div>`;
  function readout() {
    let h = '', big = '', foot = '';
    if (S.mode === 'rec') {
      const r = recipSteps(S.h), st = S.st, c = i => (st > i ? 'on' : st === i ? 'cur' : '');
      h += row(c(0) || 'cur', 'Rumbo', pad3(r.h));
      h += row(st >= 1 ? c(1) : '', '+ 200', r.s1, r.s1 > 360 ? 'pasa de 360' : '');
      h += row(st >= 2 ? c(2) : '', '− 20', r.s2, r.s2 > 360 ? 'pasa de 360' : '');
      if (r.wrap) h += row(st >= 3 ? c(3) : '', '− 360', pad3(r.fin));
      big = st >= 3 ? pad3(r.fin) : '';
      foot = `${pad3(r.h)} ${r.h <= 180 ? '+' : '−'} 180 = ${pad3(recip(r.h))}`;
    } else if (S.mode === 'giro') {
      const t = turn(S.h, S.dir, S.n);
      h += row('on', 'Rumbo', pad3(hdg(S.h)));
      h += row(t.adj === 0 ? 'on' : 'on', (S.dir === 'R' ? '+ ' : '− ') + S.n + (S.dir === 'R' ? ' der' : ' izq'), t.raw, t.adj !== 0 ? (t.raw > 360 ? 'pasa de 360' : 'baja de 0') : '');
      if (t.adj !== 0) h += row('on', (t.adj > 0 ? '+ ' : '− ') + Math.abs(t.adj), pad3(t.res));
      big = pad3(t.res);
    } else if (S.mode === 'corto') {
      const r = shortest(S.h, S.b);
      h += row('on', pad3(hdg(S.b)) + ' − ' + pad3(hdg(S.h)), r.diff);
      h += row('on', '+ 540, resto de 360', r.m);
      h += row('on', '− 180', r.d);
      big = r.amb ? '180°' : r.d === 0 ? '0°' : (r.d > 0 ? 'Der ' : 'Izq ') + Math.abs(r.d) + '°';
      foot = r.amb ? '180°: ambos lados' : `Largo: ${r.d > 0 ? 'izq' : 'der'} ${r.d > 0 ? r.ccw : r.cw}°`;
    } else {
      const rel = relBearing(S.h, S.t), clk = clockPos(rel), sd = sideOf(rel);
      h += row('on', pad3(hdg(S.t)) + ' − ' + pad3(hdg(S.h)), rel, rel === 0 ? 'de frente' : rel === 180 ? 'detrás' : '');
      h += row('on', '÷ 30, redondeo', clk + ' h', rel % 30 === 15 ? 'empate: sube' : '');
      h += row('on', '< 180 der · > 180 izq', sd === 'R' ? 'Der' : sd === 'L' ? 'Izq' : '—');
      h += row('on', 'Cuadrante del objetivo', quadrant(S.t));
      big = clk + ' h · ' + (sd === 'R' ? 'Der' : sd === 'L' ? 'Izq' : sd === 'none' ? (rel === 0 ? 'Frente' : 'Detrás') : '');
    }
    $('#rd').innerHTML = h; $('#big').textContent = big; $('#foot').textContent = foot;
  }

  // ---- controls
  const inH = $('#in-h'), inB = $('#in-b'), inN = $('#in-n');
  const keyB = () => S.mode === 'rel' ? 't' : 'b';
  function setAng(key, v, typed) { S[key] = hdg(Math.round(v)); if (key === 'h' && S.mode === 'rec') { /* keep step */ } p = 1; commit(); }
  function commit() { sync(); render(); readout(); lsSave(KEY, S); svg.setAttribute('aria-valuenow', S[active] || S.h); svg.setAttribute('aria-valuetext', pad3(S[active] || S.h)); }
  function sync() {
    if (document.activeElement !== inH) inH.value = pad3(S.h);
    if (document.activeElement !== inB) inB.value = pad3(S[keyB()]);
    if (document.activeElement !== inN) inN.value = S.n;
    $('#rg-h').value = S.h; $('#rg-b').value = S[keyB()]; $('#rg-n').value = clamp(S.n, 0, 360);
    $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.m === S.mode));
    $$('#pts button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.p === S.pts));
    $$('#dir button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === S.dir));
    $('#nose').setAttribute('aria-pressed', S.nose);
  }
  function layout() {
    $('#c-b').hidden = !(S.mode === 'corto' || S.mode === 'rel');
    $('#c-n').hidden = S.mode !== 'giro';
    $('#c-s').hidden = S.mode !== 'rec';
    $('#nose').hidden = S.mode !== 'rel';
    $('#lb-h').textContent = S.mode === 'corto' ? 'De' : S.mode === 'rel' ? 'Rumbo propio' : 'Rumbo';
    $('#lb-b').textContent = S.mode === 'corto' ? 'A' : 'Marcación';
    active = 'h';
  }
  function setMode(m) {
    S.mode = m; p = 1; if (m === 'rec') S.st = 3;
    tween('view', view, m === 'rel' && S.nose ? -S.h : 0, 400, v => { view = v; render(); });
    layout(); commit();
  }
  $$('#tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  $$('#pts button').forEach(b => b.addEventListener('click', () => { S.pts = +b.dataset.p; commit(); }));
  $$('#dir button').forEach(b => b.addEventListener('click', () => { S.dir = b.dataset.d; replay(); }));
  $('#nose').addEventListener('click', () => { S.nose = !S.nose; tween('view', view, S.nose ? -S.h : 0, 500, v => { view = v; render(); }); commit(); });
  bindNum(inH, () => S.h, (v) => { S.h = hdg(Math.round(v)); if (S.mode === 'rel' && S.nose) view = -S.h; p = 1; commit(); }, pad3);
  bindNum(inB, () => S[keyB()], (v) => { S[keyB()] = hdg(Math.round(v)); p = 1; commit(); }, pad3);
  bindNum(inN, () => S.n, (v) => { S.n = clamp(Math.round(Math.abs(v)), 0, 3600); replay(); }, String);
  $('#rg-h').addEventListener('input', e => { S.h = hdg(+e.target.value); if (S.mode === 'rel' && S.nose) view = -S.h; p = 1; commit(); });
  $('#rg-b').addEventListener('input', e => { S[keyB()] = hdg(+e.target.value); p = 1; commit(); });
  $('#rg-n').addEventListener('input', e => { S.n = +e.target.value; replay(); });
  function replay() { p = 0; commit(); tween('p', 0, 1, 700, v => { p = v; render(); }); }
  function stepTo(n) {
    n = clamp(n, 0, 3); S.st = n; p = 0; commit();
    tween('p', 0, 1, 650, v => { p = v; render(); });
  }
  $('#s-next').addEventListener('click', () => stepTo(S.st + 1));
  $('#s-prev').addEventListener('click', () => stepTo(S.st - 1));
  $('#s-play').addEventListener('click', () => {
    clearTimeout(playing); let n = 0; stepTo(0);
    const go = () => { n++; if (n > 3) return; stepTo(n); playing = setTimeout(go, 1000); };
    playing = setTimeout(go, 900);
  });
  $('#replay').addEventListener('click', replay);

  // ---- pointer + keyboard on the rose
  function handles() {
    if (S.mode === 'corto') return [{ k: 'h', pos: P(S.h, R) }, { k: 'b', pos: P(S.b, R) }];
    if (S.mode === 'rel') return [{ k: 'h', pos: P(S.h, R - 58) }, { k: 't', pos: P(S.t, R) }];
    return [{ k: 'h', pos: P(S.h, R) }];
  }
  function pick(pt) {
    let best = null, bd = 1e9;
    handles().forEach(h => { const d = Math.hypot(h.pos[0] - pt.x, h.pos[1] - pt.y); if (d < bd) { bd = d; best = h; } });
    return best;
  }
  const angOf = pt => Math.atan2(pt.x - C, C - pt.y) / RAD - view;
  let dragKey = null;
  bindDrag(svg, pt => { const h = pick(pt); if (!h) return false; dragKey = h.k; active = h.k; if (clearTimeout(playing), 1) { setAng(dragKey, angOf(pt)); } return true; },
    pt => { setAng(dragKey, angOf(pt)); if (dragKey === 'h' && S.mode === 'rel' && S.nose) { view = -S.h; render(); } }, null);
  svg.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 1; let d = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = step; else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = -step;
    else if (e.key === ' ' || e.key === 'Enter') { const hs = handles(); if (hs.length > 1) { active = active === hs[0].k ? hs[1].k : hs[0].k; commit(); } e.preventDefault(); return; }
    else return;
    e.preventDefault(); setAng(active, S[active] + d);
    if (active === 'h' && S.mode === 'rel' && S.nose) { view = -S.h; render(); }
  });

  layout(); view = (S.mode === 'rel' && S.nose) ? -S.h : 0; commit();
})();
</script>
<script src="../assets/config.js"></script><script src="../assets/account.js" defer></script><script src="../assets/progress.js" defer></script></body>
