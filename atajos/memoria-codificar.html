<script>
'use strict';
// ==== LOGIC START ====
const AIRLINES=[['IBE','IBERIA'],['VLG','VUELING'],['RYR','RYANAIR'],['BAW','SPEEDBIRD'],['DLH','LUFTHANSA'],['AEA','EUROPA'],['EZY','EASY'],['AFR','AIRFRANS'],['TAP','AIR PORTUGAL'],['VOE','VOLOTEA'],['ANE','AIR NOSTRUM'],['KLM','KLM'],['UAE','EMIRATES'],['SWR','SWISS']];
const TEL=Object.fromEntries(AIRLINES);
const ICAO={A:'Alfa',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliett',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};
const ICAO_IMG={A:'letra enorme',B:'toro',C:'Chaplin',D:'triángulo',E:'eco',F:'zorro',G:'palo de golf',H:'edificio',I:'vaca',J:'balcón',K:'pesa',L:'lima',M:'micrófono',N:'hoja',O:'estatuilla',P:'patata',Q:'arce',R:'rosa roja',S:'montaña',T:'pareja',U:'uniforme',V:'trofeo',W:'vaso',X:'radiografía',Y:'gorra',Z:'escudo'};
const MAJOR_ES='rorro rata reno remo roca rulo rosa rifa ragú ropa toro dedo tina dama taco tela taza tofu techo tubo nuera nido niño ñame ñoqui anillo nuez enojo nacho nube mar moto mono momia mueca mula mesa mafia mago mapa cura cota cono cama coco cola casa café coche copa loro lata luna lima loco lila lazo elfo lago lobo sierra seta sauna sumo saco sol seso sofá sushi sapo faro foto fauno fama foca fila foso fofo fuego faba gorro gato chino goma chico gol gas chef chucho guapo pera pato pan puma boca pala pez Piaf pecho papa'.split(' ');
const FIXES=['ZAR','TLD','VLC','BCN','SSY','NASOS','MORAL','ASBIN','LOBAR','RIBES','PINAR','TOLSU'];
const SLOT_KEYS=['ind','acc','val','fix'];
const SLOT_NAMES={ind:'Indicativo',acc:'Acción',val:'Valor',fix:'Fijo'};
const UNITS=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const TENS=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const HUND=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)]}
function int(rng,a,b){return a+Math.floor(rng()*(b-a+1))}
function pad(n,l){let s=String(n);while(s.length<l)s='0'+s;return s}
function normItem(s){return String(s==null?'':s).toUpperCase().replace(/[\s\-_]+/g,'')}

function spanishNumber(n){
  n=Math.floor(n);
  if(n<0||n>999)return String(n);
  if(n<30)return UNITS[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;return u?TENS[t]+' y '+UNITS[u]:TENS[t]}
  if(n===100)return 'cien';
  const c=Math.floor(n/100),r=n%100;
  return r?HUND[c]+' '+spanishNumber(r):(c===1?'cien':HUND[c]);
}
function readDigits(s){return s.split('').map(d=>UNITS[+d]).join(' ')}
function readChunk(t){
  if(/^\d+$/.test(t)){if(t[0]==='0'||t.length>3)return readDigits(t);return spanishNumber(+t)}
  return t;
}

// split a run of n units into group sizes (no group of 1 unless n is 1)
function splitUnits(n){
  if(n<=3)return [n];
  if(n===4)return [2,2];
  if(n===5)return [2,3];
  if(n===6)return [3,3];
  const out=[];let rem=n;
  while(rem>4){out.push(3);rem-=3}
  if(rem===4)out.push(2,2);else out.push(rem);
  return out;
}
function splitRun(str){const out=[];let p=0;splitUnits(str.length).forEach(l=>{out.push(str.substr(p,l));p+=l});return out}

function squawkValid(s){return /^[0-7]{4}$/.test(normItem(s))}

function chunkItem(raw,opts){
  opts=opts||{};
  const s=normItem(raw);const chunks=[];
  if(s){
    let m;
    if((m=/^(\d{3})\.(\d{1,3})$/.exec(s))){chunks.push({t:m[1],k:'num'},{t:m[2],k:'num'})}
    else if(/^FL\d{2,3}$/.test(s)){chunks.push({t:s,k:'level'})}
    else if(opts.squawk&&/^\d{4}$/.test(s)){chunks.push({t:s.slice(0,2),k:'num'},{t:s.slice(2),k:'num'})}
    else{
      const toks=s.match(/[A-Z]+|\d+/g)||[];
      toks.forEach((tk,i)=>{
        if(/^\d+$/.test(tk)){splitRun(tk).forEach(p=>chunks.push({t:p,k:'num'}))}
        else{
          let rest=tk;
          if(i===0&&tk.length>=3&&TEL[tk.slice(0,3)]){chunks.push({t:tk.slice(0,3),k:'air'});rest=tk.slice(3)}
          if(rest)splitRun(rest).forEach(p=>chunks.push({t:p,k:'let'}));
        }
      });
    }
  }
  return {norm:s,chunks:chunks,count:chunks.length,over:chunks.length>4};
}

const ACT_RE=/\b(TURN (?:LEFT|RIGHT) HEADING|(?:LEFT|RIGHT) HEADING|DESCEND|CLIMB|MAINTAIN|SQUAWK|CONTACT)\b/;
const VAL_RE=/^(FL\d{2,3}|\d{3}\.\d{2,3}|\d{3,4})$/;
const CS_RE=/^[A-Z]{3}\d{1,4}[A-Z]{0,2}$/;
function canonText(s){
  let t=String(s==null?'':s).toUpperCase().replace(/[,;:]/g,' ');
  t=t.replace(/FLIGHT LEVEL\s*(\d)/g,'FL$1').replace(/\bFL\s+(\d)/g,'FL$1').replace(/\bDCT\b/g,'DIRECT').replace(/\bHDG\b/g,'HEADING').replace(/\bKNOTS?\b/g,'KT');
  t=t.replace(/\b([A-Z]{3})\s+(\d{1,4}[A-Z]{0,2})\b/g,function(m,a,b){return TEL[a]?a+b:m});
  return t.replace(/\s+/g,' ').trim();
}
function parseClearance(text){
  const t=canonText(text);
  const toks=t.split(' ').filter(Boolean);
  let ind='';
  const ci=toks.findIndex(x=>CS_RE.test(x));
  if(ci>=0){ind=toks[ci];toks.splice(ci,1)}
  const rest=toks.join(' ');
  const m=ACT_RE.exec(rest);
  let acc='',after=rest;
  if(m){acc=m[1].replace(/^TURN /,'');after=rest.slice(m.index+m[0].length).trim()}
  const at=after.split(' ').filter(Boolean);
  const vi=at.findIndex(x=>VAL_RE.test(x));
  let val='',fix='';
  if(vi>=0){val=at[vi];fix=at.slice(vi+1).join(' ')}else fix=at.join(' ');
  return {ind:ind,acc:acc,val:val,fix:fix,canon:t};
}
function slotsFull(p){return SLOT_KEYS.every(k=>!!p[k])}

function genCallsign(rng){
  const icao=pick(rng,AIRLINES)[0];
  const f=int(rng,0,2);
  if(f===0)return icao+int(rng,1000,9999);
  if(f===1){const L='ABCDEFGHKLMNPRSTVWXZ';return icao+int(rng,10,99)+pick(rng,L.split(''))+pick(rng,L.split(''))}
  return icao+int(rng,100,999);
}
function genNumber(rng,len){let s=String(int(rng,1,9));while(s.length<len)s+=int(rng,0,9);return s}
function genFreq(rng){return int(rng,118,136)+'.'+int(rng,0,9)+pick(rng,['00','25','50','75'])}
function genSquawk(rng){let s='';for(let i=0;i<4;i++)s+=int(rng,0,7);return s}
function genClearance(rng){
  const cs=genCallsign(rng),f=pick(rng,FIXES);
  const n=int(rng,10,39)*10,n2=Math.max(100,n-int(rng,2,6)*10);
  const dir=pick(rng,['left','right']),hdg=pad(int(rng,1,36)*10,3);
  const k=int(rng,0,6);
  let text;
  switch(k){
    case 0:text=cs+' descend FL'+n+' direct '+f;break;
    case 1:text=cs+' climb FL'+n+' direct '+f;break;
    case 2:text=cs+' maintain FL'+n+' report passing '+f;break;
    case 3:text=cs+' turn '+dir+' heading '+hdg+' then direct '+f;break;
    case 4:text=cs+' squawk '+genSquawk(rng)+' report over '+f;break;
    case 5:text=cs+' contact '+genFreq(rng)+' over '+f;break;
    default:text=cs+' descend FL'+n+' cross '+f+' FL'+n2;
  }
  return {text:text,parsed:parseClearance(text)};
}
function chunkClearance(text){

  const cur=B.cur;
  if(B.phase==='show'){
    bRoot.append(h('div',{class:'item sm'},cur.text),slotTable(cur.parsed),h('div',{class:'row'},h('button',{onclick:bHide},icon('eye-off'),'Ocultar')));
  }else if(B.phase==='read'||B.phase==='done'){
    if(B.phase==='read'){
      bRoot.append(slotTable(cur.parsed,true),
        h('div',{class:'row'},h('span',{class:'mu timer'},'Visto '+fmtS(B.studyMs))),
        h('textarea',{id:'rb',rows:'2','aria-label':'Read-back',placeholder:'Read-back',onkeydown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();bCheck()}}}),
        h('div',{class:'row'},h('button',{class:'pri',onclick:bCheck},icon('check'),'Comprobar')));
      setTimeout(()=>{const t=$('#rb');if(t)t.focus()},0);
    }else{
      const d=B.diff,lab={ok:'Correcto',missing:'Falta',wrong:'Distinto',extra:'Sobra'};
      bRoot.append(h('div',{class:'item sm'},cur.text),
        h('div',{class:'tw'},h('table',null,h('thead',null,h('tr',null,['','Esperado','Tuyo',''].map(t=>h('th',null,t)))),h('tbody',null,d.slots.map((s,i)=>h('tr',null,
          h('th',{scope:'row',style:'border-top:4px solid var(--s'+i+')'},SLOT_NAMES[s.key]),h('td',{class:'mono'},s.expected||'-'),h('td',{class:'mono'},s.actual||'-'),
          h('td',{class:'st '+s.status},icon(s.status==='ok'?'check':'x'),' ',lab[s.status])))))),
        h('div',{class:'row'},h('b',{class:d.ok?'ok':'bad'},d.ok?'Read-back completo':d.counts.ok+' de 4')));
    }
  }
  bStats();
}
function bStats(){
  const b=DB.b;if(!b.length)return;
  const ok=b.reduce((s,x)=>s+x.ok,0),n=b.length;
  bRoot.append(h('p',{class:'note'},n+(n===1?' lectura':' lecturas')+' · '+pct(ok/(4*n))+' de huecos correctos · vista mediana '+fmtS(median(b.map(x=>x.study)))));
}

// footer link is static; init
render();renderStats();bRender();
})();
</script>
