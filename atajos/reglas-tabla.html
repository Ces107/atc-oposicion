<script>
// ==== LOGIC START ====
const FORMS=['círculo','triángulo','cuadrado'],COLORS=['rojo','azul','verde'],SIZES=['grande','pequeño'];
const PRED=[
 {id:'f-tri',g:'Forma',label:'forma = triángulo',t:o=>o.f==='triángulo'},
 {id:'f-cir',g:'Forma',label:'forma = círculo',t:o=>o.f==='círculo'},
 {id:'f-cua',g:'Forma',label:'forma = cuadrado',t:o=>o.f==='cuadrado'},
 {id:'c-roj',g:'Color',label:'color = rojo',t:o=>o.c==='rojo'},
 {id:'c-azu',g:'Color',label:'color = azul',t:o=>o.c==='azul'},
 {id:'c-ver',g:'Color',label:'color = verde',t:o=>o.c==='verde'},
 {id:'n-par',g:'Número',label:'número par',t:o=>o.n%2===0},
 {id:'n-may',g:'Número',label:'número > 5',t:o=>o.n>5},
 {id:'t-gra',g:'Tamaño',label:'tamaño grande',t:o=>o.s==='grande'}];
const PBY=Object.fromEntries(PRED.map(p=>[p.id,p]));
function universe(){const U=[];for(const f of FORMS)for(const c of COLORS)for(let n=1;n<=9;n++)for(const s of SIZES)U.push({f,c,n,s});return U}
const UNI=universe();
function passes(rule,o){return PBY[rule.p].t(o)}
function passProb(rule,U){U=U||UNI;let k=0;for(const o of U)if(passes(rule,o))k++;return k/U.length}
// rules: [{p,cost,cat}] in the user's priority order; mode 'y' (all must pass) or 'lista' (first rule that passes decides its category)
// order: array of rule indices = the order in which the checks are made
function outcome(order,rules,mode,o){let cost=0;
  for(let i=0;i<order.length;i++){const r=rules[order[i]];cost+=r.cost;const ok=passes(r,o);
    if(mode==='y'){if(!ok)return{cat:'No',checks:i+1,cost,at:i}}
    else if(ok)return{cat:r.cat||'A',checks:i+1,cost,at:i}}
  return{cat:mode==='y'?'Sí':'Resto',checks:order.length,cost,at:-1}}
function perms(n){if(n<=1)return[[...Array(n).keys()]];const o=[];for(const p of perms(n-1))for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);o.push(q)}return o}
function expectedEnum(order,rules,mode,U){U=U||UNI;let s=0;for(const o of U)s+=outcome(order,rules,mode,o).cost;return s/U.length}
function classVec(order,rules,mode,U){U=U||UNI;let s='';for(const o of U)s+=outcome(order,rules,mode,o).cat+'|';return s}
function equivalentPerms(rules,mode,U){U=U||UNI;const id=[...Array(rules.length).keys()],ref=classVec(id,rules,mode,U);return perms(rules.length).filter(p=>classVec(p,rules,mode,U)===ref)}
function analyse(rules,mode,userOrder,U){U=U||UNI;const eq=equivalentPerms(rules,mode,U);
  const rows=eq.map(p=>({order:p,E:expectedEnum(p,rules,mode,U)}));
  const key=p=>p.join('');rows.sort((a,b)=>a.E-b.E||(key(a.order)<key(b.order)?-1:1));
  const ord=userOrder||[...Array(rules.length).keys()];
  return{rows,best:rows[0],worst:rows[rows.length-1],user:{order:ord,E:expectedEnum(ord,rules,mode,U)},equivCount:eq.length}}
// independent-test model (research 4.10): cost c_i, rejection probability r_i
function expectedIndep(order,r,c){let E=0,alive=1;for(const i of order){E+=c[i]*alive;alive*=1-r[i]}return E}
function ratioOrder(r,c){const idx=r.map((_,i)=>i);return idx.sort((a,b)=>{const ra=r[a]>0?c[a]/r[a]:Infinity,rb=r[b]>0?c[b]/r[b]:Infinity;return ra===rb?a-b:ra<rb?-1:1})}
// truth table: every pass/fail combination, its outcome, how many of the objects realise it, checks in `order`
function truthTable(rules,mode,order,U){U=U||UNI;const n=rules.length,rows=[];
  for(let m=0;m<(1<<n);m++){const bits=[];for(let i=0;i<n;i++)bits.push(!!(m&(1<<i)));rows.push({bits,count:0,cat:null,checks:0})}
  for(const o of U){let m=0;for(let i=0;i<n;i++)if(passes(rules[i],o))m|=1<<i;rows[m].count++}
  for(const r of rows){let cost=0;r.checks=n;r.cat=mode==='y'?'Sí':'Resto';
    for(let i=0;i<n;i++){const k=order[i],ok=r.bits[k];if(mode==='y'){if(!ok){r.cat='No';r.checks=i+1;break}}else if(ok){r.cat=rules[k].cat||'A';r.checks=i+1;break}}}
  return rows}
// share of objects decided at each step of `order` (last entry = nobody decided)
function exits(rules,mode,order,U){U=U||UNI;const out=new Array(order.length+1).fill(0);for(const o of U){const r=outcome(order,rules,mode,o);out[r.at<0?order.length:r.at]++}return out.map(k=>k/U.length)}
// ==== LOGIC END ====

(function(){
if(typeof document==='undefined')return;
const $=s=>document.querySelector(s);
const KEY='atc_aid_reglas_v1';
const CATS=['A','B','C','D'];
const fmt=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const pc=x=>Math.round(x*100)+' %';
const PRE=[
 {n:'1',mode:'y',rules:[{p:'f-tri',cost:1,cat:'A'},{p:'c-roj',cost:1,cat:'B'},{p:'n-par',cost:1,cat:'C'}]},
 {n:'2',mode:'lista',rules:[{p:'f-tri',cost:1,cat:'A'},{p:'c-roj',cost:1,cat:'B'},{p:'n-may',cost:1,cat:'C'}]},
 {n:'3',mode:'y',rules:[{p:'t-gra',cost:1,cat:'A'},{p:'c-ver',cost:1,cat:'B'},{p:'n-may',cost:2,cat:'C'},{p:'f-cir',cost:1,cat:'D'}]}];
const S={mode:'y',rules:JSON.parse(JSON.stringify(PRE[0].rules)),view:'best',obj:null,step:0,done:null,sets:[],seed:7};
function sane(rs){return Array.isArray(rs)&&rs.length>=2&&rs.length<=4&&rs.every(r=>r&&PBY[r.p]&&[1,2,3].includes(r.cost)&&CATS.includes(r.cat))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({cur:{mode:S.mode,rules:S.rules},sets:S.sets}))}catch(e){}}
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){if(j.cur&&sane(j.cur.rules)&&(j.cur.mode==='y'||j.cur.mode==='lista')){S.mode=j.cur.mode;S.rules=j.cur.rules}if(Array.isArray(j.sets))S.sets=j.sets.filter(x=>x&&typeof x.name==='string'&&sane(x.rules)).slice(0,12)}}catch(e){}
function rng(){S.seed=(S.seed*1103515245+12345)&0x7fffffff;return S.seed/0x7fffffff}
let A=null;
function compute(){const n=S.rules.length;A=analyse(S.rules,S.mode);
  S.order=S.view==='best'?A.best.order:[...Array(n).keys()];}
const selHTML=v=>PRED.reduce((s,p,i)=>{const open=i===0||PRED[i-1].g!==p.g;return s+(open?(i?'</optgroup>':'')+`<optgroup label="${p.g}">`:'')+`<option value="${p.id}"${p.id===v?' selected':''}>${p.label}</option>`},'')+'</optgroup>';
function drawRules(){
  $('#rules').innerHTML=S.rules.map((r,i)=>`<div class="rr" data-i="${i}"><b class="num">${i+1}</b><select class="sp" aria-label="Regla ${i+1}">${selHTML(r.p)}</select><label class="cw" title="Coste"><svg class="ic"><use href="#i-clock"/></svg><select class="sc" aria-label="Coste">${[1,2,3].map(c=>`<option${c===r.cost?' selected':''}>${c}</option>`).join('')}</select></label>${S.mode==='lista'?`<select class="sk" aria-label="Categoría">${CATS.map(c=>`<option${c===r.cat?' selected':''}>${c}</option>`).join('')}</select>`:''}<button class="btn sm rm" type="button" aria-label="Quitar regla"${S.rules.length<=2?' disabled':''}><svg class="ic"><use href="#i-x"/></svg></button></div>`).join('');
  $('#add').disabled=S.rules.length>=4;
  $('#md-y').classList.toggle('on',S.mode==='y');$('#md-l').classList.toggle('on',S.mode==='lista');
  $('#v-best').classList.toggle('on',S.view==='best');$('#v-user').classList.toggle('on',S.view==='user');
}
const shapeSVG=(o,sz)=>{const r=o.s==='grande'?30:20,col={rojo:'var(--c-rojo)',azul:'var(--c-azul)',verde:'var(--c-verde)'}[o.c];let g;
  if(o.f==='círculo')g=`<circle r="${r}" fill="${col}"/>`;else if(o.f==='cuadrado')g=`<rect x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" fill="${col}"/>`;else g=`<path d="M0 ${-r*1.15}L${r*1.1} ${r*.85}H${-r*1.1}z" fill="${col}"/>`;
  return `<svg viewBox="-40 -40 80 80" width="${sz}" height="${sz}" aria-hidden="true">${g}<text class="on" y="${o.f==='triángulo'?10:1}">${o.n}</text></svg>`};
function drawLadder(){
  const rules=S.rules,order=S.order,n=order.length,ex=exits(rules,S.mode,order),W=420,H=44,G=26,top=14,x0=14,nw=190;
  let s='';const h=top+n*(H+G)+50;
  for(let i=0;i<n;i++){const r=rules[order[i]],y=top+i*(H+G),act=S.obj&&S.step>i||S.obj&&S.step===i+0&&false;
    const cur=S.obj&&S.step-1===i,state=S.obj&&S.step>i?(S.res[i]?'pass':'fail'):'';
    s+=`<g class="nd ${cur?'cur':''} ${state}"><rect x="${x0}" y="${y}" width="${nw}" height="${H}" rx="2"/><text class="nn" x="${x0+10}" y="${y+H/2}">${order[i]+1}</text><text class="nl" x="${x0+30}" y="${y+H/2}">${PBY[r.p].label}</text>`;
    if(state)s+=`<text class="mk ${state}" x="${x0+nw-14}" y="${y+H/2}">${state==='pass'?'✓':'✗'}</text>`;
    s+=`</g>`;
    // exit to the right
    const cat=S.mode==='y'?'No':(r.cat||'A'),ey=y+H/2;
    s+=`<path class="ed" d="M${x0+nw} ${ey}H${x0+nw+56}"/><text class="el" x="${x0+nw+62}" y="${ey}">${cat}</text><text class="ep" x="${x0+nw+62+(cat.length>1?22:14)}" y="${ey}">${pc(ex[i])}</text>`;
    // down
    s+=`<path class="ed" d="M${x0+nw/2} ${y+H}V${y+H+G}"/><path class="ed" d="M${x0+nw/2-4} ${y+H+G-6}L${x0+nw/2} ${y+H+G}L${x0+nw/2+4} ${y+H+G-6}"/>`;
    s+=`<text class="sm" x="${x0+nw/2+8}" y="${y+H+G/2+1}">${S.mode==='y'?'sí':'no'}</text>`}
  const by=top+n*(H+G)+4,last=S.mode==='y'?'Sí':'Resto';
  s+=`<text class="el fin" x="${x0+nw/2}" y="${by+10}" style="text-anchor:middle">${last}</text><text class="ep" x="${x0+nw/2+(last.length>2?32:22)}" y="${by+10}">${pc(ex[n])}</text>`;
  if(S.obj&&S.done)s+=`<rect class="ring" x="${x0+nw/2-40}" y="${by-8}" width="80" height="36" rx="2" style="display:${S.done.at<0?'block':'none'}"/>`;
  $('#ladder').setAttribute('viewBox',`0 0 ${W} ${h}`);$('#ladder').innerHTML=s}
function drawTable(){
  const rules=S.rules,n=rules.length,rows=truthTable(rules,S.mode,S.order);
  let h='<table><thead><tr>'+S.order.map(k=>`<th class="c">${k+1}</th>`).join('')+'<th>Cat</th><th class="r">Obj</th><th class="r">Comp.</th></tr></thead><tbody>';
  // order rows by decision depth in displayed order
  const mark=b=>b?'<svg class="ic ok"><use href="#i-check"/></svg>':'<svg class="ic bad"><use href="#i-x"/></svg>';
  const list=rows.map(r=>r).sort((a,b)=>a.checks-b.checks||(a.cat<b.cat?-1:1)||b.count-a.count);
  for(const r of list){const imp=!r.count;h+=`<tr class="${imp?'imp':''}">`+S.order.map(k=>`<td class="c">${mark(r.bits[k])}</td>`).join('')+`<td><b>${r.cat}</b></td><td class="r">${r.count}</td><td class="r">${r.checks}</td></tr>`}
  h+='</tbody></table>';$('#tt').innerHTML=h}
function drawStats(){
  const eqNote=A.equivCount<A.rows.length?'':'';
  const o=ord=>ord.map(k=>k+1).join('·');
  $('#stats').innerHTML=`<tr><td>Tuyo</td><td class="m">${o(A.user.order)}</td><td class="r"><b>${fmt(A.user.E)}</b></td></tr><tr class="best"><td>Mejor</td><td class="m">${o(A.best.order)}</td><td class="r"><b>${fmt(A.best.E)}</b></td></tr><tr><td>Peor</td><td class="m">${o(A.worst.order)}</td><td class="r"><b>${fmt(A.worst.E)}</b></td></tr>`+(S.mode==='lista'?`<tr><td colspan="3" class="muted small">${A.equivCount} de ${perms(S.rules.length).length} órdenes dan las mismas categorías</td></tr>`:'');
}
function drawObj(){
  const box=$('#obj');
  if(!S.obj){box.innerHTML='';$('#ot').textContent='';return}
  const o=S.obj;box.innerHTML=shapeSVG(o,92);
  $('#ot').innerHTML=`${o.f}, ${o.c}, ${o.n}, ${o.s}`;
  const r=$('#or');if(S.done){r.className='or '+(S.done.cat==='No'||S.done.cat==='Resto'?'':'ok');r.innerHTML=`<b>${S.done.cat}</b> · ${S.done.checks}`}else r.innerHTML='';
}
function render(){compute();drawRules();drawStats();drawLadder();drawTable();drawObj();drawPct()}
function newObj(){S.obj=UNI[Math.floor(rng()*UNI.length)];S.step=0;S.done=null;S.res=[];render()}
function stepObj(){
  if(!S.obj||S.done){newObj();return}
  const i=S.step,r=S.rules[S.order[i]],ok=passes(r,S.obj);S.res[i]=ok;S.step=i+1;
  if(S.mode==='y'){if(!ok)S.done={cat:'No',checks:S.step,at:i};else if(S.step===S.order.length)S.done={cat:'Sí',checks:S.step,at:-1}}
  else{if(ok)S.done={cat:r.cat,checks:S.step,at:i};else if(S.step===S.order.length)S.done={cat:'Resto',checks:S.step,at:-1}}
  render()}
function resetObj(){S.obj=null;S.step=0;S.done=null;S.res=[]}
// ---- events
$('#rules').addEventListener('change',e=>{const row=e.target.closest('.rr');if(!row)return;const i=+row.dataset.i,r=S.rules[i];
  if(e.target.classList.contains('sp'))r.p=e.target.value;else if(e.target.classList.contains('sc'))r.cost=+e.target.value;else if(e.target.classList.contains('sk'))r.cat=e.target.value;
  resetObj();persist();render()});
$('#rules').addEventListener('click',e=>{const b=e.target.closest('.rm');if(!b||b.disabled)return;S.rules.splice(+b.closest('.rr').dataset.i,1);resetObj();persist();render()});
$('#add').onclick=()=>{if(S.rules.length>=4)return;const used=new Set(S.rules.map(r=>r.p)),p=PRED.find(p=>!used.has(p.id))||PRED[0];S.rules.push({p:p.id,cost:1,cat:CATS[S.rules.length]});resetObj();persist();render()};
$('#md-y').onclick=()=>{S.mode='y';resetObj();persist();render()};
$('#md-l').onclick=()=>{S.mode='lista';resetObj();persist();render()};
$('#v-best').onclick=()=>{S.view='best';resetObj();render()};
$('#v-user').onclick=()=>{S.view='user';resetObj();render()};
$('#step').onclick=stepObj;
$('#newo').onclick=newObj;
$('#pres').innerHTML=PRE.map((p,i)=>`<button class="btn sm" type="button" data-i="${i}">${p.n}</button>`).join('');
$('#pres').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=PRE[+b.dataset.i];S.mode=p.mode;S.rules=JSON.parse(JSON.stringify(p.rules));resetObj();persist();render()});
function drawSets(){$('#sets').innerHTML=S.sets.length?S.sets.map((s,i)=>`<div class="sv" data-i="${i}"><span class="sn">${s.name.replace(/[<&>]/g,'')}</span><span class="muted small">${s.mode==='y'?'Y':'Lista'} · ${s.rules.length}</span><button class="btn sm ld" type="button">Cargar</button><button class="btn sm dl" type="button" aria-label="Borrar"><svg class="ic"><use href="#i-trash"/></svg></button></div>`).join(''):''}
$('#save').onclick=()=>{const nm=($('#nm').value||'').trim().slice(0,24)||('Reglas '+(S.sets.length+1));S.sets=S.sets.filter(s=>s.name!==nm);S.sets.unshift({name:nm,mode:S.mode,rules:JSON.parse(JSON.stringify(S.rules))});S.sets=S.sets.slice(0,12);$('#nm').value='';persist();drawSets()};
$('#sets').addEventListener('click',e=>{const row=e.target.closest(".sv");if(!row)return;const i=+row.dataset.i;if(e.target.closest('.dl')){S.sets.splice(i,1);persist();drawSets()}else if(e.target.closest('.ld')){const s=S.sets[i];S.mode=s.mode;S.rules=JSON.parse(JSON.stringify(s.rules));resetObj();persist();render()}});
// ---- percentage block (independent tests, research 4.10)
const PC={r:[50,20,10],c:[1,1,1]};
function drawPct(){
  $('#pr').innerHTML=PC.r.map((r,i)=>`<div class="rr2" data-i="${i}"><b class="num">${i+1}</b><label>% <input type="number" class="pi" min="0" max="99" step="5" value="${r}" aria-label="Rechazo ${i+1} %"></label><label class="cw"><svg class="ic"><use href="#i-clock"/></svg><select class="pcs" aria-label="Coste">${[1,2,3].map(c=>`<option${c===PC.c[i]?' selected':''}>${c}</option>`).join('')}</select></label></div>`).join('');
  const r=PC.r.map(x=>Math.max(0,Math.min(.99,x/100))),c=PC.c,rows=perms(3).map(p=>({p,E:expectedIndep(p,r,c)})).sort((a,b)=>a.E-b.E),mx=rows[rows.length-1].E;
  const rat=ratioOrder(r,c);
  $('#pt').innerHTML=rows.map((x,i)=>`<tr class="${i===0?'best':''}"><td class="m">${x.p.map(k=>k+1).join('·')}</td><td class="bar"><i style="width:${Math.round(x.E/mx*100)}%"></i></td><td class="r"><b>${fmt(x.E)}</b></td></tr>`).join('');
  $('#pn').textContent='c/r: '+rat.map(k=>k+1).join('·');
}
$('#pr').addEventListener('input',e=>{const row=e.target.closest('.rr2');if(!row)return;const i=+row.dataset.i;if(e.target.classList.contains('pi')){PC.r[i]=+e.target.value||0;drawPctTable()}});
$('#pr').addEventListener('change',e=>{const row=e.target.closest('.rr2');if(!row)return;if(e.target.classList.contains('pcs')){PC.c[+row.dataset.i]=+e.target.value;drawPct()}});
function drawPctTable(){const r=PC.r.map(x=>Math.max(0,Math.min(.99,x/100))),c=PC.c,rows=perms(3).map(p=>({p,E:expectedIndep(p,r,c)})).sort((a,b)=>a.E-b.E),mx=rows[rows.length-1].E;
  $('#pt').innerHTML=rows.map((x,i)=>`<tr class="${i===0?'best':''}"><td class="m">${x.p.map(k=>k+1).join('·')}</td><td class="bar"><i style="width:${Math.round(x.E/mx*100)}%"></i></td><td class="r"><b>${fmt(x.E)}</b></td></tr>`).join('');
  $('#pn').textContent='c/r: '+ratioOrder(r,c).map(k=>k+1).join('·')}
render();drawSets();
window.__reg={S,render,stepObj,newObj};
})();

</script>
