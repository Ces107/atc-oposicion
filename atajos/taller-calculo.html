<style>

  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;

}

}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
h3{font-size:1.02rem;margin:16px 0 6px}
a{color:var(--accent)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

.muted{color:var(--muted)} .ok{color:var(--ok)} .err{color:var(--err)} .warnc{color:var(--warn)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:8px 14px;cursor:pointer;line-height:1.2;min-height:38px}
.btn:hover{background:var(--stripe);color:var(--accent-h)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{background:var(--accent-h)}
.btn[disabled]{opacity:.45;cursor:default}

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:7px 10px;width:100%;min-height:38px;font-family:var(--mono)}

<script>
// ==== LOGIC START ====
function parseNum(s){
  if(typeof s==='number') return isFinite(s)?s:NaN;
  s=String(s==null?'':s).trim().replace(/[\s  ]/g,'').replace('−','-').replace(',','.');
  if(!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function rn(x){ return Math.round(x*1e9)/1e9; }
function fmt(n){
  if(!isFinite(n)) return '—';
  var r=Math.round(n*1e6)/1e6, neg=r<0; r=Math.abs(r);
  var p=String(r).split('.'), i=p[0], f=p[1];
  if(i.length>=5) i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'−':'')+i+(f?','+f:'');
}
function fmtPct(frac){ // fraction -> "+4,0 %"
  var v=Math.round(frac*1000)/10; var s=String(Math.abs(v).toFixed(1)).replace('.',',');
  return (v>0?'+':(v<0?'−':'±'))+s+' %';
}
function norm360(x){ return ((x%360)+360)%360; }
function pad2(n){ return (n<10?'0':'')+n; }
function pad3(n){ n=Math.round(n); return (n<10?'00':(n<100?'0':''))+n; }
function digitRoot(n){ n=Math.floor(Math.abs(n)); return n===0?0:1+((n-1)%9); }
var TRANSPOSITION_DEMO={good:1081,bad:1018};
var MINUS='−', TIMES='×', DIVS='÷';
function pow10(k){ return Math.pow(10,k); }
function placeParts(n){
  var s=String(Math.floor(n)), out=[];
  for(var k=0;k<s.length;k++){ var d=+s[k]; if(d) out.push(d*pow10(s.length-1-k)); }
  return out;
}
function carriesAdd(x,y){
  var c=0, carry=0;
  while(x>0||y>0||carry){ var s=(x%10)+(y%10)+carry; carry=s>=10?1:0; c+=carry; x=Math.floor(x/10); y=Math.floor(y/10); }
  return c;
}
function borrowsSub(x,y){
  var b=0, br=0;
  while(x>0||y>0){ var dx=x%10, dy=(y%10)+br; if(dx<dy){br=1;b++;} else br=0; x=Math.floor(x/10); y=Math.floor(y/10); }
  return b;
}
function scaleInts(x,y){
  var k=0;
  function isI(v){ return Math.abs(v-Math.round(v))<1e-7; }
  while(k<6&&(!isI(x*pow10(k))||!isI(y*pow10(k)))) k++;
  return [Math.round(x*pow10(k)),Math.round(y*pow10(k))];
}
function stripZ(n){ n=Math.abs(Math.round(n)); while(n>0&&n%10===0) n=n/10; return n; }
function mulEffort(x,y){
  var s=scaleInts(Math.abs(x),Math.abs(y)), sx=stripZ(s[0]), sy=stripZ(s[1]);
  if(sx<=1||sy<=1) return 0;
  var nx=String(sx).length, ny=String(sy).length;
  return nx*ny+(nx>1&&ny>1?2:0)-1;
}
function opCarries(op){
  var t=op[0], x=Math.abs(op[1]), y=Math.abs(op[2]);
  if(t==='+'){ var s=scaleInts(x,y); return carriesAdd(s[0],s[1]); }
  if(t==='-'){ var q=scaleInts(x,y); return q[0]>=q[1]?borrowsSub(q[0],q[1]):borrowsSub(q[1],q[0]); }
  return 0;
}
function S(t,e,ops,extra){ return {t:t,e:e,ops:ops||[],extra:extra||0}; }
function fin(r){
  var c=0,m=0;
  r.steps.forEach(function(s){
    c+=s.extra; s.ops.forEach(function(o){ c+=opCarries(o); if(o[0]==='*') m+=mulEffort(o[1],o[2]); });
  });
  r.cost={steps:r.steps.length,carries:c,effort:m,score:r.steps.length+c+2*m};
  return r;
}
function roundCand(x){
  var tab=[[1000,12],[100,6],[10,3]];
  for(var i=0;i<tab.length;i++){
    var base=tab[i][0], lim=tab[i][1], xr=Math.round(x/base)*base, d=xr-x;
    if(d!==0&&Math.abs(d)<=lim&&xr>0) return {xr:xr,d:d,base:base};
  }
  return null;
}
// ---------- estimacion y cotas ----------
function sig(x){ // {f,c,n}: suelo, techo y redondeo a 1 cifra significativa (x>0)
  if(x<=0) return {f:0,c:0,n:0};
  var s=x.toExponential(), m=s.match(/^(\d)(?:\.(\d+))?e([+-]\d+)$/);
  var lead=+m[1], rest=m[2]?+('0.'+m[2]):0, e=+m[3], u=pow10(e);
  var f=rn(lead*u), exact=rest===0;
  var c=exact?f:rn((lead+1)*u);
  var n=(rest>=0.5)?rn((lead+1)*u):f;
  return {f:f,c:c,n:n};
}
function estimate(op,a,b){
  var A=sig(a), B=sig(b), lo,hi,near;
  if(op==='mul'){ lo=A.f*B.f; hi=A.c*B.c; near=A.n*B.n; }
  else if(op==='add'){ lo=A.f+B.f; hi=A.c+B.c; near=A.n+B.n; }
  else if(op==='sub'){ lo=Math.max(0,A.f-B.c); hi=A.c-B.f; near=A.n-B.n; }
  else if(op==='div'){ lo=A.f/B.c; hi=B.f>0?A.c/B.f:Infinity; near=B.n>0?A.n/B.n:NaN; }
  else { lo=A.f*B.f/100; hi=A.c*B.c/100; near=A.n*B.n/100; }
  return {lo:rn(lo),hi:rn(hi),near:rn(near)};
}
function exactOf(op,a,b){
  if(op==='mul') return a*b; if(op==='add') return a+b; if(op==='sub') return a-b;
  if(op==='div') return a/b; return rn(a*b/100);
}
// ---------- multiplicacion ----------
function mulRoutes(a,b){
  var R=[], big=Math.max(a,b), small=Math.min(a,b), i;
  if(big<10||stripZ(small)<=1){
    R.push(fin({id:'directo',name:big<10?'Tabla':'Directo',steps:[S(a+' '+TIMES+' '+b,fmt(a*b))],result:a*b,visual:null}));
    return R;
  }
  // izquierda a derecha
  (function(){
    var parts=placeParts(big), run=0, st=[];

    var q=rn(p/f[1]), res=rn(q*f[0]), st=[S('invertir',p+' % de '+n+' = '+n+' % de '+p),S(n+' % de '+p,fmt(p)+' '+DIVS+' '+f[1]+' = '+fmt(q))];
    if(f[0]>1) st.push(S(TIMES+' '+f[0],f[0]+' '+TIMES+' '+fmt(q)+' = '+fmt(res),[['*',f[0],q]]));
    R.push(fin({id:'inv',name:'Invertir',steps:st,result:res,visual:null}));
  })();
  // multiplicar y mover la coma
  (function(){
    var prod=rn(p*n);
    R.push(fin({id:'coma',name:'Multiplicar y mover la coma',steps:[S(fmt(p)+' '+TIMES+' '+fmt(n),fmt(prod),[['*',p,n]]),S('coma 2 lugares',fmt(prod)+' '+DIVS+' 100 = '+fmt(rn(prod/100)))],result:rn(prod/100),visual:null}));
  })();
  return R;
}
// ---------- comprobacion ----------
function checkDigits(op,a,b,res){
  if(!Number.isInteger(a)||!Number.isInteger(b)) return null;
  var ra=digitRoot(a), rb=digitRoot(b), l, r;
  if(op==='mul'){ l=digitRoot(ra*rb); r=digitRoot(res); return {ra:ra,rb:rb,left:l,right:r,ok:l===r,sym:TIMES}; }
  if(op==='add'){ l=digitRoot(ra+rb); r=digitRoot(res); return {ra:ra,rb:rb,left:l,right:r,ok:l===r,sym:'+'}; }
  if(op==='sub'){ l=((ra-rb)%9+9)%9; r=res%9; return {ra:ra,rb:rb,left:l===0?9:l,right:r===0?9:r,ok:l===(r%9),sym:MINUS}; }
  if(op==='div'){
    var q=Math.floor(a/b), rm=a-q*b, lhs=digitRoot(digitRoot(q)*rb+digitRoot(rm)), rr=digitRoot(a);
    return {ra:ra,rb:rb,left:lhs,right:rr,ok:lhs===rr,sym:DIVS,q:q,rem:rm};
  }
  return null;
}
// ---------- calculo completo ----------
function calc(op,a,b){
  var routes, exact=exactOf(op,a,b), neg=false, A=a, B=b;
  if(op==='sub'&&a<b){ neg=true; A=b; B=a; }
  if(op==='mul') routes=mulRoutes(A,B);
  else if(op==='add') routes=addRoutes(A,B);
  else if(op==='sub') routes=subRoutes(A,B);
  else if(op==='div') routes=divRoutes(A,B);
  else routes=pctRoutes(A,B);
  var easiest=0;
  routes.forEach(function(r,i){ if(r.cost.score<=routes[easiest].cost.score) easiest=i; });
  if(neg) routes.forEach(function(r){ r.result=-r.result; });
  var est=estimate(op,A,B);
  if(neg){ est={lo:-est.hi,hi:-est.lo,near:-est.near}; }
  return {op:op,a:a,b:b,exact:exact,routes:routes,easiest:easiest,est:est,neg:neg,
          check:(op==='pct'||neg)?null:checkDigits(op,a,b,op==='div'?Math.floor(a/b):exact)};
}
function judge(c,ans){
  var ok=Math.abs(ans-c.exact)<1e-9, inb=ans>=c.est.lo-1e-9&&ans<=c.est.hi+1e-9;
  var root=null;
  if(Number.isInteger(ans)&&Number.isInteger(c.exact)&&c.op!=='pct'&&c.op!=='div'&&c.check&&!c.neg){
    root=(digitRoot(ans)===c.check.left);
  }
  return {exact:ok,inBounds:inb,rootOk:root};
}

function stepsHTML(r,n){
  var h='';
  r.steps.forEach(function(s,i){ h+='<li'+(i>=n?' class="hid"':'')+'><span>'+esc(s.t)+(s.e&&s.e!==s.t?' &nbsp;→&nbsp; '+esc(s.e):'')+'</span></li>'; });

function resStr(x){ return cur&&cur.op==='div'?divStr(cur.a,cur.b):fmt(x); }
function render(){
  var op=st.op, a=parseNum(st.a), b=parseNum(st.b), msg='';
  $('sym').textContent=SYM[op]; $('l-a').textContent=LAB[op][0]; $('l-b').textContent=LAB[op][1];
  var isPct=op==='pct';
  if(st.a===''||st.b===''||isNaN(a)||isNaN(b)) msg=(st.a===''&&st.b==='')?'':'Escribe dos números';
  else if(a<0||b<0) msg='Solo positivos';
  else if(!isPct&&(!Number.isInteger(a)||!Number.isInteger(b))) msg='Enteros';
  else if(!isPct&&(a>99999||b>99999)) msg='Hasta 99 999';
  else if(isPct&&(a>1000||b>9999999||String(st.a).replace(/^\D*\d*[.,]?/,'').length>2||String(st.b).replace(/^\D*\d*[.,]?/,'').length>2)) msg='Máx. 2 decimales, % hasta 1000';
  else if(op==='div'&&b===0) msg='No se divide entre 0';
  else if(isPct&&(a===0||b===0)) msg='Mayor que 0';
  $('msg').textContent=msg;
  if(msg||st.a===''||st.b===''){ $('out').hidden=true; cur=null; save(); return; }
  cur=calc(op,a,b);
  $('out').hidden=false;
  var neg=cur.neg;
  var exactTxt=op==='div'?divStr(a,b):fmt(cur.exact);
  $('res').textContent=fmt(a)+(op==='pct'?' % de ':' '+SYM[op]+' ')+fmt(b)+' = '+exactTxt+(op==='pct'?'':'');
  $('cota').innerHTML='<span>entre '+fmt(cur.est.lo)+' y '+(isFinite(cur.est.hi)?fmt(cur.est.hi):'∞')+'</span><span>≈ '+fmt(cur.est.near)+(cur.exact!==0?' ('+fmtPct((cur.est.near-cur.exact)/Math.abs(cur.exact))+')':'')+'</span>';
  var tb='', best=cur.easiest;
  cur.routes.forEach(function(r,i){ tb+='<tr'+(i===best?' style="font-weight:700;color:var(--accent)"':'')+'><td>'+(i===best?'<svg class="ic sm" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><use href="#i-check"/></svg>':'')+esc(r.name)+'</td><td class="num">'+r.cost.steps+'</td><td class="num">'+r.cost.carries+'</td><td class="num">'+r.cost.effort+'</td></tr>'; });
  $('rtab').tBodies[0].innerHTML=tb;
  var B=cur.routes[best], why=[];
  if(cur.routes.length>1){
    ['steps','carries','effort'].forEach(function(k,ki){
      var lbl=['menos pasos','menos acarreos','menos multiplicaciones difíciles'][ki];

    });

  $('why').textContent=cur.routes.length>1?(B.name+': '+B.cost.steps+(B.cost.steps===1?' paso, ':' pasos, ')+B.cost.carries+(B.cost.carries===1?' acarreo':' acarreos')+(why.length?' · '+why.join(', '):'')):'Una sola ruta';
  var h='';

    var n=(reveal[r.id]==null)?1:reveal[r.id];
    h+='<details class="route'+(i===best?' best':'')+'" data-id="'+r.id+'"'+(i===best?' open':'')+'><summary><span class="nm">'+(i===best?'<svg class="ic sm ck" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><use href="#i-check"/></svg>':'')+esc(r.name)+'</span><span class="mt">'+r.cost.steps+' · '+r.cost.carries+' · '+r.cost.effort+'</span></summary><div class="rb"><div class="vis">'+vis(r.visual)+'</div><ol class="steps">'+stepsHTML(r,n)+'</ol><div class="btns"><button class="btn sm" data-act="next" data-id="'+r.id+'"'+(n>=r.steps.length?' disabled':'')+'>Paso</button><button class="btn sm" data-act="all" data-id="'+r.id+'"'+(n>=r.steps.length?' disabled':'')+'>Todo</button><button class="btn sm" data-act="reset" data-id="'+r.id+'">Reiniciar</button></div></div></details>';
  });
  $('routes').innerHTML=h;
  // comprobar
  var c=cur.check, ch='';
  if(c){
    if(op==='div') ch='<table><tbody><tr><td>'+fmt(a)+'</td><td class="num">raíz '+c.ra+'</td></tr><tr><td>'+fmt(b)+'</td><td class="num">raíz '+c.rb+'</td></tr><tr><td>'+c.q+' × '+fmt(b)+' + '+c.rem+'</td><td class="num">raíz '+c.left+' '+(c.ok?'=':'≠')+' '+c.right+'</td></tr></tbody></table>';
    else ch='<table><tbody><tr><td>'+fmt(a)+'</td><td class="num">raíz '+c.ra+'</td></tr><tr><td>'+fmt(b)+'</td><td class="num">raíz '+c.rb+'</td></tr><tr><td>raíz '+c.ra+' '+c.sym+' raíz '+c.rb+'</td><td class="num">'+c.left+'</td></tr><tr><td>'+fmt(cur.exact)+'</td><td class="num">raíz '+c.right+' '+(c.ok?'<span class="ok">✓</span>':'<span class="err">✗</span>')+'</td></tr></tbody></table>';

  } else ch='<p class="small muted" style="margin:0">Solo cotas</p>';
  $('chk').innerHTML=ch;

}
function verdict(){
