<script>
'use strict';
// ==== LOGIC START ====
const SHAPES=[
 {id:0,name:'semicírculo',d:'M6 32A18 18 0 0 1 42 32Z'},
 {id:1,name:'triángulo',d:'M24 7L43 40H5Z'},
 {id:2,name:'rombo',d:'M24 5L43 24L24 43L5 24Z'},
 {id:3,name:'cruz',d:'M19 5h10v14h14v10H29v14H19V29H5V19h14Z'},
 {id:4,name:'ele',d:'M12 6h11v26h15v10H12Z'},
 {id:5,name:'te',d:'M5 8h38v11H29v21H19V19H5Z'},
 {id:6,name:'flecha',d:'M5 19h21V7l17 17-17 17V29H5Z'},
 {id:7,name:'luna',d:'M30 5A19 19 0 1 0 30 43A15 15 0 1 1 30 5Z'},
 {id:8,name:'hexágono',d:'M14 7h20l10 17-10 17H14L4 24Z'},
 {id:9,name:'estrella',d:'M24 4L29.5 18L44 19L33 28.5L36.5 43L24 35L11.5 43L15 28.5L4 19L18.5 18Z'},
 {id:10,name:'anillo',d:'M24 5A19 19 0 1 0 24 43A19 19 0 1 0 24 5Z M24 14A10 10 0 1 0 24 34A10 10 0 1 0 24 14Z',eo:1},
 {id:11,name:'uve',d:'M5 10L24 29L43 10V21L24 40L5 21Z'},
 {id:12,name:'trapecio',d:'M14 10h20l10 28H4Z'},
 {id:13,name:'barra-punto',d:'M5 31h38v9H5Z M24 8A8 8 0 1 0 24 24A8 8 0 1 0 24 8Z'},
 {id:14,name:'zigzag',d:'M4 29L14 13L24 29L34 13L44 29V39L34 23L24 39L14 23L4 39Z'},
 {id:15,name:'cuarto',d:'M24 24V6A18 18 0 0 1 42 24Z'},
 {id:16,name:'marco',d:'M6 6h36v36H6Z M15 15v18h18V15Z',eo:1},
 {id:17,name:'romboide',d:'M15 11h28L33 37H5Z'},
 {id:18,name:'casa',d:'M24 5L43 20V42H5V20Z'},
 {id:19,name:'pajarita',d:'M5 9L24 24L5 39Z M43 9L24 24L43 39Z'},
 {id:20,name:'escalera',d:'M5 42V31h11V20h11V9h16v33Z'},
 {id:21,name:'gota',d:'M24 5C38 20 41 31 24 43C7 31 10 20 24 5Z'},
 {id:22,name:'disco',d:'M24 6A18 18 0 1 0 24 42A18 18 0 1 0 24 6Z'},
 {id:23,name:'tres puntos',d:'M24 6A6 6 0 1 0 24 18A6 6 0 1 0 24 6Z M12 28A6 6 0 1 0 12 40A6 6 0 1 0 12 28Z M36 28A6 6 0 1 0 36 40A6 6 0 1 0 36 28Z'}
];
const UNITS_ES=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function int(rng,a,b){return a+Math.floor(rng()*(b-a+1))}
function shuffle(rng,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function median(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}

// ---- shape vocabulary
function normLabel(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim()}
function labelOk(s){const t=String(s==null?'':s).trim();return t.length>0&&t.length<=24&&t.split(/\s+/).length<=2}
function shapeName(labels,id){const l=labels&&labels[id];return l&&String(l).trim()?String(l).trim():SHAPES[id].name}
function namingStats(hist){
  const h=hist.filter(x=>x.checked);
  return {n:hist.length,checked:h.length,consistent:h.length?h.filter(x=>x.ok).length/h.length:0,medMs:median(hist.map(x=>x.ms))};
}

// ---- grid coding
function coord(idx,size){return String.fromCharCode(65+idx%size)+(Math.floor(idx/size)+1)}
function parseCoord(s,size){
  const m=/^([A-Za-z])(\d{1,2})$/.exec(String(s).trim());if(!m)return -1;
  const c=m[1].toUpperCase().charCodeAt(0)-65,r=+m[2]-1;
  return c>=0&&c<size&&r>=0&&r<size?r*size+c:-1;
}
function makeGrid(rng,size,n){
  const cells=shuffle(rng,Array.from({length:size*size},(_,i)=>i)).slice(0,n);
  const sh=shuffle(rng,SHAPES.map(s=>s.id)).slice(0,n);
  const map={};cells.forEach((c,i)=>{map[c]=sh[i]});
  return {size:size,cells:map};
}
function scanOrder(size,kind){
  const out=[];
  if(kind==='col'){for(let c=0;c<size;c++)for(let r=0;r<size;r++)out.push(r*size+c)}
  else if(kind==='spiral'){
    let t=0,b=size-1,l=0,r=size-1;
    while(t<=b&&l<=r){
      for(let c=l;c<=r;c++)out.push(t*size+c);t++;
      for(let k=t;k<=b;k++)out.push(k*size+r);r--;
      if(t<=b){for(let c=r;c>=l;c--)out.push(b*size+c);b--}
      if(l<=r){for(let k=b;k>=t;k--)out.push(k*size+l);l++}
    }
  }else{for(let i=0;i<size*size;i++)out.push(i)}
  return out;
}
function sentence(grid,labels,kind){
  return scanOrder(grid.size,kind).filter(i=>grid.cells[i]!=null).map(i=>({idx:i,coord:coord(i,grid.size),shape:grid.cells[i],text:coord(i,grid.size)+' '+shapeName(labels,grid.cells[i])}));
}
function gradeGrid(truth,answer){
  const correct=[],wrong=[],missing=[],extra=[];
  const n=truth.size*truth.size;
  for(let i=0;i<n;i++){
    const t=truth.cells[i],a=answer[i];
    if(t!=null&&a!=null){(t===a?correct:wrong).push(i)}
    else if(t!=null)missing.push(i);
    else if(a!=null)extra.push(i);
  }
  const total=Object.keys(truth.cells).length;
  return {correct:correct,wrong:wrong,missing:missing,extra:extra,total:total,score:total?Math.max(0,(correct.length-extra.length)/total):0,perfect:wrong.length+missing.length+extra.length===0};
}

// ---- dial as clock (heuristic)
const DIAL_SCALES=[60,120,300];
function valueToTick(v,max){return ((Math.round(v/(max/60))%60)+60)%60}
function tickToValue(t,max){return t*max/60}
function tickToCode(t){t=((t%60)+60)%60;const h=Math.floor(t/5);return {hour:h===0?12:h,past:t%5,tick:t}}
function codeToTick(hour,past){return ((hour%12)*5+past)%60}
function codePhrase(c){return c.past===0?UNITS_ES[c.hour]+' en punto':UNITS_ES[c.hour]+' y '+UNITS_ES[c.past]}
function tickToAngle(t){return t*6}
function angleToTick(a){return Math.round((((a%360)+360)%360)/6)%60}
function barCode(v){v=Math.max(0,Math.min(99,Math.round(v)));return {tens:Math.floor(v/10),units:v%10}}
function barPhrase(c){return UNITS_ES[c.tens]+' y '+UNITS_ES[c.units]}
function pairFromText(str){
  let s=normLabel(str);
  if(/^\d{2}$/.test(s))return [+s[0],+s[1]];
  if(/^\d{3}$/.test(s))return [+s.slice(0,2),+s[2]];
  UNITS_ES.forEach((w,i)=>{s=s.replace(new RegExp('\\b'+w+'\\b','g'),' '+i+' ')});
  s=s.replace(/en punto/g,' ');

  D.res=null;D.typed='';
  if(D.mode==='free'){D.phase='idle';renderDial();return}
  const N=D.kind==='dial'?60:100;
  D.target=int(rnd,0,N-1);D.t0=performance.now();
  if(D.mode==='translate'){D.pos=D.target;D.phase='ask'}
  else{D.pos=D.target;D.phase='show';D.left=3;dTimer=setInterval(()=>{D.left--;if(D.left<=0){clearInterval(dTimer);D.phase='ask';D.pos=null;D.t0=performance.now()}renderDial()},1000)}
  renderDial();
}
function dCode(pos){
  if(D.kind==='dial'){const c=tickToCode(pos);return {txt:c.hour+' y '+c.past,phrase:codePhrase(c)}}
  const c=barCode(pos);return {txt:c.tens+' y '+c.units,phrase:barPhrase(c)};
}
function dCheck(){
  if(D.phase!=='ask')return;
  const ms=Math.round(performance.now()-D.t0);
  if(D.mode==='translate'){
    const inp=$('#dtr');const typed=inp?inp.value:'';
    let ok=false;
    if(D.kind==='dial'){const p=parseDialCode(typed);ok=!!p&&codeToTick(p.hour,p.past)===D.target}
    else{const p=parseBarCode(typed);ok=!!p&&p.tens*10+p.units===D.target}
    D.res={ok:ok,ms:ms};
    DB.dial.push({t:Date.now(),kind:D.kind,mode:'tr',ok:ok,ms:ms,max:D.max});
  }else{
    if(D.pos==null)return;
    let err,errV;
    if(D.kind==='dial'){const g=gradeDialMemo(D.target,D.pos,D.max);err=g.err;errV=g.errValue}
    else{err=Math.abs(D.target-D.pos);errV=err}
    D.res={err:err,errV:errV,ms:ms};
    DB.dial.push({t:Date.now(),kind:D.kind,mode:'memo',err:err,ms:ms,max:D.max});
  }
  DB.dial=DB.dial.slice(-200);save();D.phase='done';renderDial();
}
function readoutEl(){
  const pos=viewPos();
  const showCode=D.mode==='free'||D.phase==='done'||(D.mode==='memo'&&D.phase==='ask'&&D.pos!=null);
  const rd=h('table',{class:'rd'});
  const val=pos==null?'--':(D.kind==='dial'?String(tickToValue(pos,D.max)):String(pos));
  const v2=D.mode==='translate'&&D.phase==='ask'?(D.kind==='dial'?String(tickToValue(D.target,D.max)):String(D.target)):val;
  rd.append(h('tbody',null,
    h('tr',null,h('th',null,'Valor'),h('td',null,v2)),
    h('tr',null,h('th',null,D.kind==='dial'?'Reloj':'Cifras'),h('td',null,(showCode&&pos!=null)?dCode(pos).txt:'--')),
    h('tr',null,h('th',null,'Frase'),h('td',{style:'font-size:16px'},(showCode&&pos!=null)?dCode(pos).phrase:'--'))));
  return rd;
}
function renderDial(keepFocus){
  diRoot.replaceChildren();
  const ctl=h('div',{class:'row'});
  ctl.append(h('div',{class:'seg',role:'group','aria-label':'Tipo'},[['dial','Esfera'],['bar','Barra']].map(x=>h('button',{class:D.kind===x[0]?'on':'','aria-pressed':String(D.kind===x[0]),onclick:()=>{D.kind=x[0];D.phase='idle';D.pos=D.kind==='dial'?0:50;D.res=null;clearInterval(dTimer);renderDial()}},x[1]))));
  ctl.append(h('div',{class:'seg',role:'group','aria-label':'Modo'},[['free','Libre'],['translate','Traducir'],['memo','Memorizar']].map(x=>h('button',{class:D.mode===x[0]?'on':'','aria-pressed':String(D.mode===x[0]),onclick:()=>{D.mode=x[0];D.phase='idle';D.res=null;clearInterval(dTimer);if(x[0]==='free'&&D.pos==null)D.pos=0;renderDial()}},x[1]))));
  if(D.kind==='dial')ctl.append(h('label',null,'Escala ',h('select',{'aria-label':'Escala',onchange:e=>{D.max=+e.target.value;renderDial()}},DIAL_SCALES.map(m=>h('option',{value:m,selected:D.max===m},'0-'+m)))));
  if(D.mode!=='free')ctl.append(h('span',{class:'sp'}),h('button',{class:'pri',onclick:dNew},icon('play'),D.phase==='idle'?'Empezar':'Nuevo'));
  diRoot.append(ctl);

  const interactive=D.mode==='free'||(D.mode==='memo'&&D.phase==='ask');
  const showNeedle=D.mode==='free'||D.mode==='translate'||D.phase==='show'||D.phase==='done'||(D.mode==='memo'&&D.phase==='ask');
  let pos=D.pos,ghost=null;
  if(D.mode!=='free'&&D.phase==='idle')pos=null;
  if(D.phase==='done'&&D.mode==='memo')ghost=D.target;
  if(D.mode==='memo'&&D.phase==='ask'&&D.pos==null)pos=null;
  const wrap=h('div',{class:'dial-wrap'});
  const gauge=D.kind==='dial'?dialSvg(pos,ghost,interactive):barSvg(pos,ghost,interactive);
  wrap.append(gauge);curGauge=gauge;
  // readout
  const side=h('div');
  const showCode=D.mode==='free'||D.phase==='done'||(D.mode==='memo'&&D.phase==='ask'&&D.pos!=null);
  const rd=readoutEl();
  side.append(rd);
  if(D.mode==='translate'&&D.phase==='ask'){
    const inp=h('input',{type:'text',id:'dtr','aria-label':'Código',autocomplete:'off',placeholder:D.kind==='dial'?'2 y 3':'7 y 3',style:'font-size:20px;width:160px',onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();dCheck()}}});
    side.append(h('div',{class:'row'},inp,h('button',{class:'pri',onclick:dCheck},icon('check'),'Ok')));
    setTimeout(()=>inp.focus(),0);
  }
  if(D.mode==='memo'){
    if(D.phase==='show')side.append(h('div',{class:'row'},h('span',{class:'big'},String(D.left))));
    if(D.phase==='ask')side.append(h('div',{class:'row'},h('button',{class:'pri',id:'dchk',onclick:dCheck,disabled:D.pos==null},icon('check'),'Comprobar')));
  }
  if(D.phase==='done'){
    const r=D.res;
    if(D.mode==='translate')side.append(h('div',{class:'row'},h('b',{class:r.ok?'ok':'bad'},icon(r.ok?'check':'x'),' '+(r.ok?'Bien':'Era '+dCode(D.target).txt)),h('span',{class:'mu timer'},fmtS(r.ms))));
    else side.append(h('div',{class:'row'},h('b',{class:r.err===0?'ok':(r.err<=1?'warn':'bad')},r.err===0?'Exacto':'±'+r.err+(D.kind==='dial'?' marcas ('+r.errV+')':'')),h('span',{class:'mu timer'},fmtS(r.ms))));
  }
  if(D.kind==='dial')side.append(h('p',{class:'note'},'Hora = número bajo la aguja; marcas = pasos tras la hora (0-4).'));
  wrap.append(side);
  diRoot.append(wrap);
  dStats();
}
function dStats(){
  const tr=DB.dial.filter(x=>x.mode==='tr'),me=DB.dial.filter(x=>x.mode==='memo');
  const parts=[];
  if(tr.length)parts.push('Traducir '+tr.length+' · '+pct(tr.filter(x=>x.ok).length/tr.length)+' · '+fmtS(median(tr.map(x=>x.ms))));
  if(me.length)parts.push('Memorizar '+me.length+' · error mediano '+median(me.map(x=>x.err))+(me.length?'':''));
  if(parts.length)diRoot.append(h('p',{class:'note'},parts.join('   ')));
}

renderShapes();renderGrid();renderDial();
})();
</script>
