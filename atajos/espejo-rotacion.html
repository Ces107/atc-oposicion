<script>
// ==== LOGIC START ====
// Figure: {cells:[[x,y],...], marks:{"x,y":"o"|"s"|"t"}}; screen coordinates (x right, y down), grid cell centre = (x+.5,y+.5)
const GR=6;
const ck=(x,y)=>x+','+y;
function cellsOf(F){return F.cells.map(c=>[c[0],c[1]])}
// transform: optional mirror (x -> -x) first, then r quarter turns clockwise ((x,y)->(-y,x) on screen)
function tPoint(p,m,r){let x=p[0],y=p[1];if(m)x=-x;for(let i=0;i<r;i++){const nx=-y,ny=x;x=nx;y=ny}return[x,y]}
function normalize(F){let mx=1e9,my=1e9;for(const c of F.cells){mx=Math.min(mx,c[0]);my=Math.min(my,c[1])}
  const cells=F.cells.map(c=>[c[0]-mx,c[1]-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]),marks={};
  for(const c of F.cells){const k=ck(c[0],c[1]);if(F.marks[k])marks[ck(c[0]-mx,c[1]-my)]=F.marks[k]}return{cells,marks}}
function canon(F){const n=normalize(F);return n.cells.map(c=>{const k=ck(c[0],c[1]);return k+(n.marks[k]||'')}).join(';')}
function transformFig(F,m,r){const cells=[],marks={};for(const c of F.cells){const q=tPoint(c,m,r);cells.push(q);const k=ck(c[0],c[1]);if(F.marks[k])marks[ck(q[0],q[1])]=F.marks[k]}return{cells,marks}}
// brute force over the 4 rotations x 2 mirror states
function matches(F1,F2){const t=canon(F2),o=[];for(const m of[0,1])for(let r=0;r<4;r++)if(canon(transformFig(F1,m,r))===t)o.push({m,r});return o}
function classify(F1,F2){const ms=matches(F1,F2);if(!ms.length)return'distinta';const rot=ms.some(x=>!x.m),mir=ms.some(x=>x.m);return rot&&mir?'ambos':rot?'giro':'espejo'}
function orient(A,B,C){const v=(B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0]);return Math.abs(v)<1e-9?0:v>0?1:-1} // +1 = clockwise on screen
function crossABC(A,B,C){return(B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0])}
// analytic decision from three landmarks (A,B,C in figure 1; A',B',C' in figure 2)
function decide(P,Q){const d=(U,V)=>Math.hypot(U[0]-V[0],U[1]-V[1]);
  for(const[i,j]of[[0,1],[0,2],[1,2]])if(Math.abs(d(P[i],P[j])-d(Q[i],Q[j]))>1e-9)return'incoherente';
  const s1=orient(P[0],P[1],P[2]),s2=orient(Q[0],Q[1],Q[2]);if(!s1||!s2)return'colineal';return s1===s2?'giro':'espejo'}
// rotation angle (degrees, clockwise) taking AB of figure 1 onto A'B' of figure 2; with mirror, after flipping x first
function alignAngle(P,Q,mirror){let u=[P[1][0]-P[0][0],P[1][1]-P[0][1]];if(mirror)u=[-u[0],u[1]];const v=[Q[1][0]-Q[0][0],Q[1][1]-Q[0][1]];
  return Math.atan2(u[0]*v[1]-u[1]*v[0],u[0]*v[0]+u[1]*v[1])*180/Math.PI}
// invariant descriptor of a cell: mark, degree and sorted graph distances to the others
function descriptors(F){const S=new Set(F.cells.map(c=>ck(c[0],c[1]))),out={};
  for(const c of F.cells){const dist={},q=[c];dist[ck(c[0],c[1])]=0;for(let i=0;i<q.length;i++){const p=q[i],dp=dist[ck(p[0],p[1])];for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+dx,p[1]+dy],kk=ck(n[0],n[1]);if(S.has(kk)&&dist[kk]===undefined){dist[kk]=dp+1;q.push(n)}}}
    let deg=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(S.has(ck(c[0]+dx,c[1]+dy)))deg++;
    out[ck(c[0],c[1])]=(F.marks[ck(c[0],c[1])]||'-')+deg+':'+Object.values(dist).sort((a,b)=>a-b).join('')}return out}
// three landmarks with unique, matching descriptors (marked cells first), non-collinear in both figures
function autoLandmarks(F1,F2){const d1=descriptors(F1),d2=descriptors(F2),cnt=d=>{const o={};for(const k in d)o[d[k]]=(o[d[k]]||0)+1;return o},c1=cnt(d1),c2=cnt(d2);
  const cand=[];for(const k in d1)if(c1[d1[k]]===1&&c2[d1[k]]===1){const k2=Object.keys(d2).find(x=>d2[x]===d1[k]);cand.push({k1:k,k2,d:d1[k]})}
  cand.sort((a,b)=>(b.d[0]!=='-')-(a.d[0]!=='-')||(a.d<b.d?-1:a.d>b.d?1:0));
  const pt=k=>{const s=k.split(',');return[+s[0]+.5,+s[1]+.5]};
  for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++)for(let l=j+1;l<cand.length;l++){const P=[cand[i],cand[j],cand[l]].map(c=>pt(c.k1)),Q=[cand[i],cand[j],cand[l]].map(c=>pt(c.k2));
    if(orient(P[0],P[1],P[2])&&orient(Q[0],Q[1],Q[2]))return{P,Q}}
  return null}
// does the rigid map defined by the landmarks (rotation, or mirror then rotation) send figure 1 exactly onto figure 2?
function consistent(F1,F2,P,Q,mirror){const th=alignAngle(P,Q,mirror)*Math.PI/180,c=Math.cos(th),s=Math.sin(th),map=p=>{let x=p[0]-P[0][0],y=p[1]-P[0][1];if(mirror)x=-x;return[Q[0][0]+c*x-s*y,Q[0][1]+s*x+c*y]};
  const want=new Map(F2.cells.map(q=>[ck(q[0],q[1]),F2.marks[ck(q[0],q[1])]||'']));if(want.size!==F1.cells.length)return false;
  for(const q of F1.cells){const r=map([q[0]+.5,q[1]+.5]),gx=Math.round(r[0]-.5),gy=Math.round(r[1]-.5);if(Math.abs(r[0]-.5-gx)>1e-6||Math.abs(r[1]-.5-gy)>1e-6)return false;const k=ck(gx,gy);if(!want.has(k)||want.get(k)!==(F1.marks[ck(q[0],q[1])]||''))return false}return true}
function figEq(A,B){return canon(A)===canon(B)}
function growFig(R,n){const S=[[2,2]],has=k=>S.some(c=>ck(c[0],c[1])===k);let g=0;
  while(S.length<n&&g++<500){const b=S[Math.floor(R()*S.length)],d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(R()*4)],c=[b[0]+d[0],b[1]+d[1]];if(c[0]<0||c[1]<0||c[0]>4||c[1]>4||has(ck(c[0],c[1])))continue;S.push(c)}
  return S}
function place(F,R){const n=normalize(F);let w=0,h=0;for(const c of n.cells){w=Math.max(w,c[0]+1);h=Math.max(h,c[1]+1)}const ox=Math.floor(R()*(GR-w+1)),oy=Math.floor(R()*(GR-h+1));
  const cells=n.cells.map(c=>[c[0]+ox,c[1]+oy]),marks={};for(const k in n.marks){const s=k.split(',');marks[ck(+s[0]+ox,+s[1]+oy)]=n.marks[k]}return{cells,marks}}
// random pair; rel: 'giro'|'espejo'|'distinta'
function genPair(R,rel){
  for(let tries=0;tries<400;tries++){
    const cells=growFig(R,5+Math.floor(R()*3));if(cells.length<5)continue;
    const marks={},ks=cells.map(c=>ck(c[0],c[1])),nm=2+Math.floor(R()*2),types=['o','s','t'];
    for(let i=0;i<nm;i++){const k=ks[Math.floor(R()*ks.length)];if(!marks[k])marks[k]=types[i]}
    const base={cells,marks};
    if(matches(base,base).length!==1)continue;           // asymmetric figure only
    let F2;
    if(rel==='distinta'){const k=Math.floor(R()*cells.length),c=cells[k],opts=[[1,0],[-1,0],[0,1],[0,-1]].map(d=>[c[0]+d[0],c[1]+d[1]]).filter(p=>p[0]>=0&&p[1]>=0&&p[0]<=4&&p[1]<=4&&!ks.includes(ck(p[0],p[1])));
      if(!opts.length)continue;const p=opts[Math.floor(R()*opts.length)],c2=cells.map((x,i)=>i===k?p:x),m2={};for(const kk in marks){m2[kk===ck(c[0],c[1])?ck(p[0],p[1]):kk]=marks[kk]}
      F2=transformFig({cells:c2,marks:m2},R()<.5?1:0,Math.floor(R()*4));
      // must really be different from every rotation/mirror of F1
      if(matches(base,F2).length)continue;
      if(!cells.length)continue}
    else F2=transformFig(base,rel==='espejo'?1:0,Math.floor(R()*4));
    const A=place(base,R),B=place(F2,R);
    if(!autoLandmarks(A,B)&&rel!=='distinta')continue;
    return{F1:A,F2:B,rel}}
  return null}
// ==== LOGIC END ====

const S={F1:null,F2:null,mode:'auto',man:{P:[],Q:[]},t:0,flip:0,ghost:false,seed:1,lab:'giro'};
function shiftFig(F,dx,dy){return{cells:F.cells.map(c=>[c[0]+dx,c[1]+dy]),marks:Object.fromEntries(Object.entries(F.marks).map(([k,v])=>{const s=k.split(',');return[ck(+s[0]+dx,+s[1]+dy),v]}))}}
function loadPreset(i){const p=PRESETS[i];S.lab=p.id;S.F1=p.F1;
  if(p.T==='x'){const c=p.F1.cells.map(x=>x.slice());c[5]=[0,2];const m=Object.assign({},p.F1.marks);S.F2=shiftFig(transformFig({cells:c,marks:m},0,1),1,1)}
  else{const q=transformFig(p.F1,p.T[0],p.T[1]);const n=normalize(q);S.F2=shiftFig(n,1,1)}
  after()}
function after(){S.man={P:[],Q:[]};S.t=0;S.flip=0;S.ghost=false;tok++;try{localStorage.setItem(KEY,JSON.stringify({lab:S.lab,seed:S.seed,mode:S.mode}))}catch(e){}render()}
function random(){S.seed=(S.seed*48271+Math.floor(Math.random()*1e6))%2147483647;const R=rng(S.seed),rel=['giro','espejo','giro','espejo','distinta'][Math.floor(R()*5)];const g=genPair(R,rel);if(!g)return random();S.F1=g.F1;S.F2=g.F2;S.lab='azar';after()}
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
// landmarks in use
function marks3(){
  if(S.mode==='auto'){const L=autoLandmarks(S.F1,S.F2);return L?{P:L.P,Q:L.Q}:null}
  if(S.man.P.length===3&&S.man.Q.length===3)return{P:S.man.P,Q:S.man.Q};return null}
function verdict(){
  const cls=classify(S.F1,S.F2),L=marks3();
  if(cls==='distinta')return{cls,L,txt:'Distinta',kind:'bad'};
  if(!L)return{cls,L:null,txt:S.mode==='auto'?(cls==='ambos'?'Simétrica':'Elige puntos'):'Elige 3+3',kind:'muted'};
  const d=decide(L.P,L.Q);
  if(d==='incoherente')return{cls,L,txt:'No coinciden',kind:'bad',d};
  if(d==='colineal')return{cls,L,txt:'En línea',kind:'bad',d};
  if(!consistent(S.F1,S.F2,L.P,L.Q,d==='espejo'))return{cls,L,txt:'No coinciden',kind:'bad',d:'incoherente'};
  if(cls==='ambos')return{cls,L,txt:'Simétrica: ambos',kind:'muted',d};
  return{cls,L,txt:d==='giro'?'Giro':'Espejo',kind:d==='giro'?'ok':'warn',d}}
function fmt(n){return(Math.round(n*10)/10).toString().replace('.',',').replace('-','−')}
const glyph=s=>s>0?'↻':s<0?'↺':'·';
function figSVG(F,which,L,ghost){
  let s=`<rect class="bg" x="0" y="0" width="${GR}" height="${GR}"/>`;
  for(let i=1;i<GR;i++)s+=`<path class="gl" d="M${i} 0V${GR}M0 ${i}H${GR}"/>`;
  const P=L?L[which==='a'?'P':'Q']:(S.mode==='man'?S.man[which==='a'?'P':'Q']:[]);
  for(const c of F.cells){const k=ck(c[0],c[1]),m=F.marks[k];
    s+=`<g class="cell" tabindex="${S.mode==='man'?0:-1}" role="${S.mode==='man'?'button':'img'}" aria-label="Celda ${c[0]+1},${c[1]+1}" data-w="${which}" data-x="${c[0]}" data-y="${c[1]}"><rect class="fill" x="${c[0]}" y="${c[1]}" width="1" height="1"/>`;
    if(m==='o')s+=`<circle class="mk" cx="${c[0]+.5}" cy="${c[1]+.5}" r=".22"/>`;
    if(m==='s')s+=`<rect class="mk" x="${c[0]+.3}" y="${c[1]+.3}" width=".4" height=".4"/>`;
    if(m==='t')s+=`<path class="mk" d="M${c[0]+.5} ${c[1]+.25}L${c[0]+.76} ${c[1]+.72}H${c[0]+.24}z"/>`;
    s+='</g>'}
  // landmark triangle
  if(P.length===3){const d=P.map(p=>p.join(' ')),sg=orient(P[0],P[1],P[2]);
    s+=`<path class="tri" d="M${P[0][0]} ${P[0][1]}L${P[1][0]} ${P[1][1]}L${P[2][0]} ${P[2][1]}z"/>`;
    if(sg){const cx=(P[0][0]+P[1][0]+P[2][0])/3,cy=(P[0][1]+P[1][1]+P[2][1])/3,r=.34,a0=sg>0?-150:-30,a1=sg>0?100:-280,rad=x=>x*Math.PI/180;
      const p0=[cx+r*Math.cos(rad(a0)),cy+r*Math.sin(rad(a0))],p1=[cx+r*Math.cos(rad(a1)),cy+r*Math.sin(rad(a1))];
      s+=`<path class="arc" d="M${p0[0].toFixed(3)} ${p0[1].toFixed(3)}A${r} ${r} 0 1 ${sg>0?1:0} ${p1[0].toFixed(3)} ${p1[1].toFixed(3)}"/>`;
      const tg=sg>0?[-Math.sin(rad(a1)),Math.cos(rad(a1))]:[Math.sin(rad(a1)),-Math.cos(rad(a1))],nx=[Math.cos(rad(a1)),Math.sin(rad(a1))];
      const tip=p1,b1=[tip[0]-.14*tg[0]+.07*nx[0],tip[1]-.14*tg[1]+.07*nx[1]],b2=[tip[0]-.14*tg[0]-.07*nx[0],tip[1]-.14*tg[1]-.07*nx[1]];
      s+=`<path class="arc" d="M${b1[0].toFixed(3)} ${b1[1].toFixed(3)}L${tip[0].toFixed(3)} ${tip[1].toFixed(3)}L${b2[0].toFixed(3)} ${b2[1].toFixed(3)}"/>`}
  }
  P.forEach((p,i)=>{s+=`<g class="lm"><circle cx="${p[0]}" cy="${p[1]}" r=".32"/><text x="${p[0]-.36}" y="${p[1]-.36}">${i+1}</text></g>`});
  if(ghost)s+=ghost;
  return s}
function ghostSVG(V){
  if(!S.ghost||!V.L)return'';
  const P=V.L.P,Q=V.L.Q,mir=V.d==='espejo';
  const th=alignAngle(P,Q,mir);let deg=th;
  // animation state S.t in [0,1]
  let rot,sx=1;
  if(mir){const turn=S.t<.62?S.t/.62:1;rot=turn*(th+360);sx=S.t<.7?1:1-2*Math.min(1,(S.t-.7)/.3)}else rot=S.t*(th)
  const pts=S.F1.cells.map(c=>`<rect x="${c[0]}" y="${c[1]}" width="1" height="1"/>`).join('');
  const tp=P.map(p=>p.join(',')).join(' ');
  return `<g class="ghost" transform="translate(${Q[0][0]} ${Q[0][1]}) rotate(${rot.toFixed(2)}) scale(${sx.toFixed(3)} 1) translate(${-P[0][0]} ${-P[0][1]})">${pts}<polyline class="gtri" points="${tp} ${P[0].join(',')}"/></g>`}
function render(){
  const V=verdict(),L=V.L;document.body.classList.toggle('man',S.mode==='man');
  $('#fa').innerHTML=figSVG(S.F1,'a',L&&L.P?L:L,'');
  $('#fb').innerHTML=figSVG(S.F2,'b',L,ghostSVG(V));
  $('#res').textContent=V.txt;$('#res').className='res '+V.kind;
  let F='';
  if(L&&V.d!=='incoherente'){const c1=crossABC(...L.P),c2=crossABC(...L.Q),s1=orient(...L.P),s2=orient(...L.Q);
    F=`(B−A)×(C−A)<br>izq: <b>${fmt(c1)}</b> ${glyph(s1)}<br>der: <b>${fmt(c2)}</b> ${glyph(s2)}<br>${s1&&s2?(s1===s2?'mismo signo: giro':'signo opuesto: espejo'):''}`}
  else if(V.d==='incoherente')F='distancias distintas: los puntos no se corresponden';
  $('#formula').innerHTML=F;
  const cls=V.cls;
  $('#anim').disabled=!(L&&(V.d==='giro'||V.d==='espejo')&&cls!=='distinta');
  for(const m of['auto','man'])$('#m-'+m).classList.toggle('on',S.mode===m);
  $('#clr').hidden=S.mode!=='man';
  $('#ca').textContent=S.mode==='man'?S.man.P.length+'/3':'';$('#cb').textContent=S.mode==='man'?S.man.Q.length+'/3':'';
  PRESETS.forEach((p,i)=>$('#p'+i).classList.toggle('on',S.lab===p.id))
}
let tok=0;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function animate(){const my=++tok;S.ghost=true;S.t=0;const V=verdict(),dur=V.d==='espejo'?3600:1600;const t0=performance.now();
  if(reduce){S.t=1;render();return}
  (function f(t){if(my!==tok)return;let u=Math.min(1,(t-t0)/dur);S.t=u<.5&&V.d!=='espejo'?2*u*u:V.d==='espejo'?u:1-Math.pow(-2*u+2,2)/2;render();if(u<1)requestAnimationFrame(f)})(t0)}
$('#anim').onclick=animate;
$('#m-auto').onclick=()=>{S.mode='auto';S.ghost=false;tok++;after()};
$('#m-man').onclick=()=>{S.mode='man';S.ghost=false;tok++;S.man={P:[],Q:[]};after()};
$('#clr').onclick=()=>{S.man={P:[],Q:[]};S.ghost=false;tok++;render()};
$('#rnd').onclick=random;
PRESETS.forEach((p,i)=>{$('#p'+i).onclick=()=>loadPreset(i)});
function cellTap(e){const g=e.target.closest('.cell');if(!g)return;if(S.mode!=='man')return;const w=g.dataset.w,pt=[+g.dataset.x+.5,+g.dataset.y+.5],arr=S.man[w==='a'?'P':'Q'];
  const ix=arr.findIndex(p=>p[0]===pt[0]&&p[1]===pt[1]);if(ix>=0)arr.splice(ix,1);else if(arr.length<3)arr.push(pt);S.ghost=false;tok++;const fx=g.dataset.x,fy=g.dataset.y;render();const nf=$('#f'+w).querySelector(`.cell[data-x="${fx}"][data-y="${fy}"]`);if(nf&&e.type==='keydown')nf.focus()}
for(const id of['#fa','#fb']){$(id).addEventListener('click',cellTap);$(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cellTap(e)}})}
let mode0='auto',lab0=0;
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){if(j.mode==='man')mode0='man';if(j.lab==='azar'&&j.seed){S.seed=j.seed}const ix=PRESETS.findIndex(p=>p.id===j.lab);if(ix>=0)lab0=ix}}catch(e){}
S.mode=mode0;loadPreset(lab0);
window.__esp={S,render,verdict,animate};
})();

</script>
