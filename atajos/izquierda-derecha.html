<style>

<script>
// ==== LOGIC START ====
const D2R=Math.PI/180;
function norm360(a){a=a%360;if(a<0)a+=360;return a===360?0:a}
// heading h: degrees clockwise from north; world x = east, y = north
function headingVec(h){return{x:Math.sin(h*D2R),y:Math.cos(h*D2R)}}
function hands(h){return{right:norm360(h+90),left:norm360(h-90)}}
function crossHV(h,v){const f=headingVec(h);return f.x*v.y-f.y*v.x}
function dotHV(h,v){const f=headingVec(h);return f.x*v.x+f.y*v.y}
// cross > 0 => object on the figure's LEFT; cross < 0 => RIGHT; 0 => ahead/behind
function sideOf(h,v){const e=1e-9,c=crossHV(h,v);if(c>e)return'izquierda';if(c<-e)return'derecha';const d=dotHV(h,v);if(d>e)return'delante';if(d<-e)return'detras';return'centro'}
function rotateCCW(v,deg){const c=Math.cos(deg*D2R),s=Math.sin(deg*D2R);return{x:v.x*c-v.y*s,y:v.x*s+v.y*c}}
// brute force: turn the whole scene until the figure faces north, then read the x sign
function bruteSide(h,v){const w=rotateCCW(v,h),e=1e-9;if(w.x>e)return'derecha';if(w.x<-e)return'izquierda';if(w.y>e)return'delante';if(w.y<-e)return'detras';return'centro'}
function facing(h){const c=Math.cos(h*D2R);return c<-0.5?'frente':c>0.5?'espaldas':'lado'}
// signed clockwise turn (-180..180] that makes you look where the figure looks
function turnToAlign(h){let t=norm360(h);if(t>180)t-=360;return t}
// screen direction (x right, y up) of one hand
function handScreen(h,hand){const b=(hand==='right'?h+90:h-90)*D2R;return{x:Math.sin(b),y:Math.cos(b)}}
// the facing-you reversal: right hand lands on the screen's left
function reversed(h){return Math.cos(h*D2R)<-1e-9}
function dirName(h){const n=['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'];return n[Math.round(norm360(h)/45)%8]}
function handWhere(h,hand){const s=handScreen(h,hand);if(s.x>0.2)return'derecha';if(s.x<-0.2)return'izquierda';return s.y>0?'arriba':'abajo'}
// ==== LOGIC END ====

(function(){
if(typeof document==='undefined')return;
const $=s=>document.querySelector(s);
const KEY='atc_aid_izq_v1';
const scene=$('#scene');
const S={h:0,x:80,y:0,stage:0,view:0};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&isFinite(j.h)&&isFinite(j.x)&&isFinite(j.y)){S.h=norm360(Math.round(j.h));S.x=j.x;S.y=j.y}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({h:S.h,x:S.x,y:S.y}))}catch(e){}}
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',').replace('-','−');
const CASES=[
 {h:0,x:80,y:0,t:'Mira al norte, objeto al este'},
 {h:180,x:80,y:0,t:'Mira al sur, objeto al este'},
 {h:270,x:0,y:80,t:'Mira al oeste, objeto al norte'}];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

let ticks='';for(let a=0;a<360;a+=30){const r=a*D2R,s=Math.sin(r),c=-Math.cos(r);ticks+=`<line class="tick" x1="${(128*s).toFixed(1)}" y1="${(128*c).toFixed(1)}" x2="${(136*s).toFixed(1)}" y2="${(136*c).toFixed(1)}"/>`}
scene.innerHTML=`<g id="world">
<circle class="ring" r="128"/>${ticks}
<text class="cl" id="cN" x="0" y="-147">N</text><text class="cl" id="cE" x="147" y="0">E</text><text class="cl" id="cS" x="0" y="147">S</text><text class="cl" id="cO" x="-147" y="0">O</text>
<line class="link" id="lk" x1="0" y1="0" x2="0" y2="0"/>
<g id="av" class="focusable" tabindex="0" role="slider" aria-label="Rumbo de la figura" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0">
<circle class="hit" r="50"/>
<g id="avr">
<g id="axg" opacity="0"><line class="axis" x1="-90" y1="-6" x2="90" y2="-6"/></g>
<ellipse class="body" cx="0" cy="6" rx="25" ry="12"/>
<circle class="body" cx="0" cy="-1" r="9.5"/>
<path d="M0 -17L-4.5 -10.5H4.5z" fill="var(--text)"/>
<circle class="glove d" id="gD" cx="32" cy="-6" r="9"/><text class="gl" id="tD" x="32" y="-6">D</text>
<circle class="glove i" id="gI" cx="-32" cy="-6" r="9"/><text class="gl" id="tI" x="-32" y="-6">I</text>
<text class="side i" id="sI" x="-90" y="-6" opacity="0">I</text><text class="side d" id="sD" x="90" y="-6" opacity="0">D</text>
<circle class="ring2" r="54"/>
</g></g>
<g id="obj" class="focusable" tabindex="0" role="button" aria-label="Objeto">
<circle class="hit" r="20"/><circle class="objr" id="objr" r="15" stroke-width="2.5"/>
<path class="obj" d="M0 -9L9 0L0 9L-9 0z"/><circle class="ring2" r="19"/>
</g>
</g>
<g transform="translate(-140 -122)"><path class="viewer" d="M0 22V0M-6 7L0 0L6 7"/><text class="viewer-t" x="12" y="14">tú</text></g>`;
const world=$('#world'),av=$('#av'),avr=$('#avr'),obj=$('#obj'),lk=$('#lk');

const fig=$('#fig');
function drawFig(){
  const h=S.h,f=facing(h),side=sideOf(h,{x:S.x,y:S.y}),hiD=S.stage===2&&side==='derecha',hiI=S.stage===2&&side==='izquierda';
  const glove=(x,y,l)=>`<circle class="g ${l==='D'?'d':'i'}${(l==='D'?hiD:hiI)?' hi':''}" cx="${x}" cy="${y}" r="8"/><text class="gt" x="${x}" y="${y}">${l}</text>`;
  let s='';
  if(f==='lado'){
    const east=Math.sin(h*D2R)>0,dx=east?1:-1,l=east?'D':'I';
    s=`<circle class="h" cx="60" cy="24" r="12"/><path class="l" d="M${60+dx*12} 24l${dx*6} 3l${-dx*6} 3"/><path class="l" d="M60 36V88M60 88L52 138M60 88L68 138M60 48L${60+dx*26} 70"/>${glove(60+dx*30,73,l)}`;
  }else{
    const L=f==='frente'?'D':'I',R=f==='frente'?'I':'D';
    s=`<circle class="h" cx="60" cy="24" r="12"/>`+(f==='frente'?`<circle class="dot" cx="55.5" cy="22" r="1.4"/><circle class="dot" cx="64.5" cy="22" r="1.4"/><path class="l" d="M56 28Q60 30.5 64 28" stroke-width="1.5"/>`:`<path class="l" d="M49 22A11 11 0 0 1 71 22" stroke-width="3.5"/>`)+
      `<path class="l" d="M60 36V88M60 88L46 138M60 88L74 138M60 48L32 76M60 48L88 76"/>${glove(28,80,L)}${glove(92,80,R)}`;
  }
  fig.innerHTML=s;
  $('#figcap').textContent={frente:'De frente',espaldas:'De espaldas',lado:'De lado'}[f];
}
function render(){
  const {h,x,y,stage,view}=S,v={x,y},side=sideOf(h,v);
  world.setAttribute('transform',`rotate(${view})`);
  avr.setAttribute('transform',`rotate(${h}) scale(1.25)`);
  obj.setAttribute('transform',`translate(${x} ${-y})`);
  lk.setAttribute('x2',x);lk.setAttribute('y2',-y);
  av.setAttribute('aria-valuenow',h);
  for(const [id,cx,cy] of [['cN',0,-147],['cE',147,0],['cS',0,147],['cO',-147,0]])$('#'+id).setAttribute('transform',`rotate(${-view} ${cx} ${cy})`);
  const hv=-(h+view);
  for(const [id,cx] of [['tD',32],['tI',-32],["sI",-90],["sD",90]])$('#'+id).setAttribute('transform',`rotate(${hv} ${cx} -6)`);
  $('#axg').setAttribute('opacity',stage>=1?1:0);
  for(const id of ['sI','sD'])$('#'+id).setAttribute('opacity',stage>=1?1:0);
  $('#gD').classList.toggle('hi',stage===2&&side==='derecha');
  $('#gI').classList.toggle('hi',stage===2&&side==='izquierda');
  const orr=$('#objr');orr.style.opacity=stage===2?1:0;
  orr.setAttribute('stroke',side==='derecha'?'var(--accent)':side==='izquierda'?'var(--warn)':'var(--muted)');
  $('#hr').value=h;$('#hv').textContent=h+'°';
  // result
  const res=$('#res');res.className='res'+(stage===2?(side==='derecha'?' d':side==='izquierda'?' i':''):'');
  res.textContent=stage===2?cap(side==='detras'?'detrás':side):' ';
  // formulas
  const hd=hands(h),f=headingVec(h),c=crossHV(h,v);
  const tu=turnToAlign(h);
  let F=`h = <b>${h}°</b> (${dirName(h)})`;
  F+=`<br>D = h+90 = <b>${hd.right}°</b> · I = h−90 = <b>${hd.left}°</b>`;
  if(stage>=1)F+=`<br>giro: <b>${tu===0?'ninguno':Math.abs(tu)+'° '+(tu>0?'horario':'antihorario')}</b>`;
  if(stage===2){F+=`<br>f = (${fmt(f.x)}; ${fmt(f.y)}) · v = (${x}; ${y})`;F+=`<br>cruz = fx·vy − fy·vx = <b>${fmt(c)}</b>`;F+=`<br>cruz &gt; 0 izquierda · cruz &lt; 0 derecha`}
  $('#formula').innerHTML=F;
  // reversal
  const rv=reversed(h),wd=handWhere(h,'right'),wi=handWhere(h,'left');
  $('#rev').className='rev'+(rv?' flip':'');
  $('#rev').innerHTML=`<span><span class="sw">D</span><svg class="ic"><use href="#i-arrow"/></svg>${wd}</span><span><span class="sw">I</span><svg class="ic"><use href="#i-arrow"/></svg>${wi}</span>`+(rv?`<span class="sw"><svg class="ic"><use href="#i-swap"/></svg>Te mira: se invierte</span>`:'');
  // buttons
  const fc=facing(h);
  for(const k of ['frente','espaldas','lado'])$('#b-'+k).classList.toggle('on',fc===k);
  $('#b-paso-t').textContent=['Gírate','Di el lado','Otra vez'][stage];
  [...document.querySelectorAll('.case')].forEach((b,i)=>b.classList.toggle('cur',CASES[i].h===h&&CASES[i].x===x&&CASES[i].y===y));
  drawFig();
}
// animation
let tok=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function tween(to,ms){const my=++tok,from=S.view;return new Promise(res=>{if(reduce||ms===0||from===to){S.view=to;render();return res()}const t0=performance.now();(function f(t){if(my!==tok)return res();let k=Math.min(1,(t-t0)/ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;S.view=from+(to-from)*k;render();k<1?requestAnimationFrame(f):res()})(t0)})}
function reset(){tok++;S.stage=0;S.view=0;render()}
async function go(n){
  if(n===1){S.stage=1;render();await tween(-turnToAlign(S.h),900)}
  else if(n===2){tok++;S.stage=2;render()}
  else{S.stage=0;await tween(0,500)}
}
$('#b-paso').onclick=()=>go((S.stage+1)%3);
$('#b-todo').onclick=async()=>{reset();await go(1);if(S.stage!==1)return;await new Promise(r=>setTimeout(r,reduce?0:450));if(S.stage===1)go(2)};
$('#b-reset').onclick=reset;
$('#hr').oninput=e=>{S.h=+e.target.value;S.stage=0;S.view=0;tok++;render();save()};
$('#b-frente').onclick=()=>{S.h=180;reset();save()};
$('#b-espaldas').onclick=()=>{S.h=0;reset();save()};
$('#b-lado').onclick=()=>{S.h=facing(S.h)==='lado'&&S.h===90?270:90;reset();save()};
// cases
$('#cases').innerHTML=CASES.map((c,i)=>`<button class="case" type="button" data-i="${i}"><b>${i+1}</b><span>${c.t}</span><span class="r">${cap(sideOf(c.h,{x:c.x,y:c.y}))}</span></button>`).join('');
$('#cases').addEventListener('click',async e=>{const b=e.target.closest('.case');if(!b)return;const c=CASES[+b.dataset.i];S.h=c.h;S.x=c.x;S.y=c.y;save();$('#b-todo').click()});
// pointer
let drag=null;
function pt(e){const p=scene.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(scene.getScreenCTM().inverse())}
function mv(e){const q=pt(e);
  if(drag==='av'){if(Math.hypot(q.x,q.y)>12)S.h=Math.round(norm360(Math.atan2(q.x,-q.y)/D2R))%360}
  else{const wx=q.x,wy=-q.y,r=Math.hypot(wx,wy),R=Math.min(Math.max(r,72),120),k=r?R/r:1;S.x=Math.round(wx*k);S.y=Math.round(wy*k)}
  render()}
scene.addEventListener('pointerdown',e=>{const t=e.target.closest('#av,#obj');if(!t)return;drag=t.id;try{scene.setPointerCapture(e.pointerId)}catch(_){ }tok++;S.stage=0;S.view=0;e.preventDefault();mv(e)});
scene.addEventListener('pointermove',e=>{if(drag)mv(e)});
const end=()=>{if(drag){drag=null;save()}};
scene.addEventListener('pointerup',end);scene.addEventListener('pointercancel',end);
av.addEventListener('keydown',e=>{const d={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key];if(!d)return;e.preventDefault();S.h=norm360(S.h+d*(e.shiftKey?1:15));reset();save()});
obj.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!d)return;e.preventDefault();let nx=S.x+d[0]*8,ny=S.y+d[1]*8;const r=Math.hypot(nx,ny);if(r>120||r<72)return;S.x=nx;S.y=ny;reset();save()});
render();
window.__izq={S,render,go};
})();

</script>
