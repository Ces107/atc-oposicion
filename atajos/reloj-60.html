<script>
// ==== LOGIC START ====
function parseNum(s){
  if(typeof s==='number') return isFinite(s)?s:NaN;
  s=String(s==null?'':s).trim().replace(/[\s  ]/g,'').replace('−','-').replace(',','.');
  if(!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function rn(x){ return Math.round(x*1e9)/1e9; }
function fmt(n){
  if(!isFinite(n)) return '—';
  var r=Math.round(n*1e6)/1e6, neg=r<0; r=Math.abs(r);
  var p=String(r).split('.'), i=p[0], f=p[1];
  if(i.length>=5) i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'−':'')+i+(f?','+f:'');
}
function fmtPct(frac){ // fraction -> "+4,0 %"
  var v=Math.round(frac*1000)/10; var s=String(Math.abs(v).toFixed(1)).replace('.',',');
  return (v>0?'+':(v<0?'−':'±'))+s+' %';
}
function norm360(x){ return ((x%360)+360)%360; }
function pad2(n){ return (n<10?'0':'')+n; }
function pad3(n){ n=Math.round(n); return (n<10?'00':(n<100?'0':''))+n; }
function digitRoot(n){ n=Math.floor(Math.abs(n)); return n===0?0:1+((n-1)%9); }
var TRANSPOSITION_DEMO={good:1081,bad:1018};
function fmtMMSS(minutes){
  var s=Math.round(minutes*60), mm=Math.floor(s/60), ss=s%60;
  return mm+':'+pad2(ss);
}
function parseTime(s){
  s=String(s==null?'':s).trim();
  var m=s.match(/^(\d+):(\d{1,2})$/);
  if(m){ var sec=+m[2]; if(sec>=60) return NaN; return +m[1]+sec/60; }
  return parseNum(s);
}
function nmPerMin(gs){ return gs/60; }
function sixMin(gs){ return gs/10; }
function secPerNM(gs){ return 3600/gs; }
function distance(gs,min){ return gs*min/60; }
function timeMin(nm,gs){ return nm*60/gs; }
function speed(nm,min){ return nm*60/min; }
// regla practica: NM/min redondeado a 0,1
function roundedRule(gs,min){
  var m1=Math.round(gs/60*10)/10, exact=distance(gs,min), d1=m1*min;
  return {mpm1:m1, d1:d1, exact:exact, err:exact===0?0:(d1-exact)/exact};
}
// enlazar velocidad, tiempo, distancia: dos entradas -> tercera
function solveTriple(v,src){
  // v={gs,t,d}; src=[k1,k2] claves de entrada; devuelve {out:clave, value}
  var all=['gs','t','d'], out=all.filter(function(k){return src.indexOf(k)<0;})[0];
  var gs=v.gs,t=v.t,d=v.d;
  if(out==='d') return {out:out, value:(gs>0&&t>=0)?distance(gs,t):NaN};
  if(out==='t') return {out:out, value:(gs>0&&d>=0)?timeMin(d,gs):NaN};
  return {out:out, value:(t>0&&d>=0)?speed(d,t):NaN};
}
function touchSrc(src,k){ // la ultima editada va primero; se conservan dos
  var o=[k]; src.forEach(function(x){ if(x!==k&&o.length<2) o.push(x); });
  if(o.length<2) o.push(['gs','t','d'].filter(function(x){return x!==k;})[0]);
  return o;
}
function clockSteps(out,gs,t,d){
  var st=[], mpm;
  if(out==='d'){
    mpm=gs/60;
    st.push(fmt(gs)+' ÷ 60 = '+fmt(mpm)+' NM/min'+(gs%10===0?'  ('+fmt(gs/10)+' ÷ 6)':''));
    var ip=Math.floor(rn(mpm)), fp=rn(mpm-ip);
    if(fp>0&&ip>0&&Number.isInteger(t)) st.push(fmt(mpm)+' × '+fmt(t)+' = '+fmt(ip*t)+' + '+fmt(rn(fp*t)));
    else if(Number.isInteger(mpm)&&t!==Math.floor(t)) st.push(fmt(mpm)+' × '+fmt(t)+' = '+fmt(mpm*Math.floor(t))+' + '+fmt(rn(mpm*(t-Math.floor(t)))));
    st.push('= '+fmt(rn(distance(gs,t)))+' NM');
  } else if(out==='t'){
    mpm=gs/60;
    st.push(fmt(gs)+' ÷ 60 = '+fmt(mpm)+' NM/min');
    st.push(fmt(d)+' ÷ '+fmt(mpm)+' = '+fmt(rn(timeMin(d,gs)))+' min');
    st.push('= '+fmtMMSS(timeMin(d,gs))+' min:s');
  } else {
    st.push(fmt(d)+' ÷ '+fmt(t)+' = '+fmt(rn(d/t))+' NM/min');
    st.push(fmt(rn(d/t))+' × 60 = '+fmt(rn(speed(d,t)))+' kt');
  }
  return st;
}
// ---- distancia a ojo: d ~ max + 0,4 min ----
var EYE_MAX_ERR=Math.sqrt(1.16)-1;          // +7,70 % (en min/max = 0,4)
var EYE_MIN_ERR=1.4/Math.SQRT2-1;           // -1,01 % (en min/max = 1)
function eyeDist(dx,dy){
  var a=Math.max(Math.abs(dx),Math.abs(dy)), b=Math.min(Math.abs(dx),Math.abs(dy));
  var ap=a+0.4*b, ex=Math.hypot(dx,dy);
  return {a:a,b:b,approx:ap,exact:ex,err:ex===0?0:(ap-ex)/ex};
}
// ---- conversiones ----
var FT_PER_NM_3DEG=Math.tan(3*Math.PI/180)*6076.11549; // 318,4 ft/NM
function isaExact(ft){ return ft<=36089?15-0.0019812*ft:-56.5; }
function isaRule(fl){ return 15-2*(fl/10); }
function conversions(c){
  // c={fl,kt,nm,toFl}; filas con regla, valor, exacto y error
  var rows=[], fl=c.fl, kt=c.kt, nm=c.nm;
  function row(id,rule,approx,exact,unit,note){
    rows.push({id:id,rule:rule,approx:approx,exact:exact,unit:unit,err:exact===0?0:(approx-exact)/Math.abs(exact),note:note||''});
  }
  row('fl','FL × 100',fl*100,fl*100,'ft','');
  row('kt1','kt × 1,85',kt*1.85,kt*1.852,'km/h','');
  row('kt2','kt × 2 − 10 %',kt*2*0.9,kt*1.852,'km/h','');
  row('nm','NM × 1,85',nm*1.85,nm*1.852,'km','');
  row('isa','15 − 2 × (FL ÷ 10)',isaRule(fl),isaExact(fl*100),'°C',fl>360?'fuera de regla (FL>360)':'');
  var lose=Math.max(0,fl-c.toFl)*100;
  row('d31','3 NM por 1000 ft',3*(lose/1000),lose/FT_PER_NM_3DEG,'NM','');
  row('d300','300 ft por NM',300*nm,FT_PER_NM_3DEG*nm,'ft','');
  row('rate','5 × kt',5*kt,FT_PER_NM_3DEG*kt/60,'ft/min','');
  return rows;
}
// ==== LOGIC END ====

(function(){
var KEY='atc_aid_reloj60';
var st={gs:240,t:7,d:null,src:['gs','t'],dx:30,dy:40,fl:350,kt:250,nm:5,toFl:50};
function num(x){ return typeof x==='number'&&isFinite(x); }
try{
  var j=JSON.parse(localStorage.getItem(KEY)||'null');
  if(j&&typeof j==='object'){
    ['gs','t','dx','dy','fl','kt','nm','toFl'].forEach(function(k){ if(num(j[k])) st[k]=j[k]; });
    if(Array.isArray(j.src)&&j.src.length===2&&j.src.every(function(k){return k==='gs'||k==='t'||k==='d';})&&j.src[0]!==j.src[1]) st.src=j.src;
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function $(id){ return document.getElementById(id); }
function fv(x,dec){ var m=Math.pow(10,dec==null?2:dec); return String(Math.round(x*m)/m).replace('.',','); }
var NS='http://www.w3.org/2000/svg';

// ---------- reloj ----------
function drawClock(){
  var s=$('clock'), cx=160, cy=160, R=118, h='';
  var gs=st.gs, t=st.t, ok=num(gs)&&gs>0, mpm=ok?gs/60:0, tt=(num(t)&&t>0)?t:0;
  function pt(r,min){ var a=min/60*2*Math.PI; return [cx+r*Math.sin(a),cy-r*Math.cos(a)]; }
  h+='<circle cx="160" cy="160" r="128" class="g"/>';
  if(ok&&tt>0){
    if(tt>=60) h+='<circle cx="160" cy="160" r="'+R+'" class="wd"/>';
    else { var e=pt(R,tt); h+='<path class="wd" d="M160 160 L160 '+(cy-R)+' A'+R+' '+R+' 0 '+(tt>30?1:0)+' 1 '+e[0].toFixed(2)+' '+e[1].toFixed(2)+' Z"/>'; }
  }
  for(var m=0;m<60;m++){
    var big=m%5===0, a=pt(big?120:123,m), b=pt(128,m);
    h+='<path class="ax" d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+'"/>';
  }
  for(m=0;m<60;m+=5){
    var o=pt(142,m), q=pt(97,m);
    h+='<text class="tm" x="'+o[0].toFixed(1)+'" y="'+(o[1]+4).toFixed(1)+'" text-anchor="middle">'+m+'</text>';
    if(ok) h+='<text class="ta" x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="middle">'+fmt(Math.round(mpm*m*10)/10)+'</text>';
  }
  if(ok){
    var n=Math.min(60,Math.floor(tt));
    for(m=1;m<=n;m++){ var f=pt(110,m); h+='<circle class="pt" cx="'+f[0].toFixed(1)+'" cy="'+f[1].toFixed(1)+'" r="2"/>'; }
    if(tt>0){ var hd=pt(R,tt%60===0?60:tt%60); h+='<path class="ln" d="M160 160L'+hd[0].toFixed(1)+' '+hd[1].toFixed(1)+'"/><circle class="pt" cx="'+hd[0].toFixed(1)+'" cy="'+hd[1].toFixed(1)+'" r="4.5"/>'; }
  }
  h+='<circle class="hub" cx="160" cy="160" r="40"/>';
  if(ok){
    h+='<text x="160" y="156" text-anchor="middle" class="ta" style="font-size:17px;font-weight:600">'+fmt(rn(mpm))+'</text>';
    h+='<text x="160" y="172" text-anchor="middle" class="t">NM/min</text>';
    h+='<text x="160" y="186" text-anchor="middle" class="t">'+fmt(gs)+' kt</text>';
  }
  s.innerHTML=h;
}
function setField(id,k){ var el=$(id); if(document.activeElement===el) return; el.value=num(st[k])?fv(st[k],k==='gs'?2:2):''; }
function renderMain(){
  var v={gs:st.gs,t:st.t,d:st.d}, r=solveTriple(v,st.src);
  st[r.out]=isFinite(r.value)?r.value:null;
  setField('f-gs','gs'); setField('f-t','t'); setField('f-d','d');
  ['gs','t','d'].forEach(function(k){ $('r-'+k).classList.toggle('calc',k===r.out); });
  if(num(st.gs)&&st.gs>=60&&st.gs<=600) $('sl-gs').value=Math.round(st.gs/10)*10;
  drawClock();
  var li=(num(st.gs)&&st.gs>0&&num(r.value))?clockSteps(r.out,st.gs,st.t,st.d):[];
  if(li.length&&r.out==='d'){
    var rr=roundedRule(st.gs,st.t);
    if(Math.abs(rr.mpm1-st.gs/60)>1e-9) li.push('regla práctica: '+fv(rr.mpm1,1)+' × '+fmt(st.t)+' = '+fmt(Math.round(rr.d1*100)/100)+' NM · error '+fmtPct(rr.err));
  }
  $('steps').innerHTML=li.map(function(x,i){ return '<li'+(i===li.length-1&&r.out!=='d'?' class="res"':'')+'>'+x+'</li>'; }).join('');
  var tb=$('rules').tBodies[0], g=st.gs, rows='';
  if(num(g)&&g>0){
    rows+='<tr><td>NM por minuto</td><td>kt ÷ 60</td><td class="num">'+fmt(rn(nmPerMin(g)))+'</td></tr>';
    rows+='<tr><td>NM en 6 min</td><td>kt ÷ 10</td><td class="num">'+fmt(rn(sixMin(g)))+'</td></tr>';
    rows+='<tr><td>1 NM cada</td><td>3600 ÷ kt</td><td class="num">'+fmt(Math.round(secPerNM(g)*10)/10)+' s</td></tr>';
  }
  tb.innerHTML=rows;
  save();
}
function bindMain(k,id,parse){
  $(id).addEventListener('input',function(){
    var x=parse(this.value);
    if(!(x>=0)||!isFinite(x)||((k==='gs')&&x<=0)||((k==='t')&&x<=0)){ this.setAttribute('aria-invalid','true'); return; }
    this.removeAttribute('aria-invalid');
    st[k]=x; st.src=touchSrc(st.src,k); renderMain();
  });
  $(id).addEventListener('blur',function(){ this.removeAttribute('aria-invalid'); renderMain(); });
}
bindMain('gs','f-gs',parseNum); bindMain('t','f-t',parseTime); bindMain('d','f-d',parseNum);
$('sl-gs').addEventListener('input',function(){ st.gs=+this.value; st.src=touchSrc(st.src,'gs'); renderMain(); });

// ---------- a ojo ----------
function niceMax(m){ var L=[50,100,200,500,1000]; for(var i=0;i<L.length;i++) if(m<=L[i]) return L[i]; return Math.ceil(m/1000)*1000; }
function drawEye(){
  var dx=num(st.dx)?st.dx:0, dy=num(st.dy)?st.dy:0, mx=niceMax(Math.max(dx,dy)), O=[34,266], W=240, k=W/mx;
  var P=[O[0]+dx*k,O[1]-dy*k], h='';
  for(var i=1;i<=4;i++){ var gx=O[0]+W*i/4, gy=O[1]-W*i/4; h+='<path class="g" d="M'+gx+' '+(O[1]-W)+'V'+O[1]+'M'+O[0]+' '+gy+'H'+(O[0]+W)+'"/>'; }
  h+='<path class="ax" d="M'+O[0]+' '+(O[1]-W)+'V'+O[1]+'H'+(O[0]+W)+'"/>';
  h+='<text class="tm" x="'+(O[0]+W)+'" y="'+(O[1]+16)+'" text-anchor="end">'+mx+' NM</text><text class="tm" x="'+(O[0]-6)+'" y="'+(O[1]-W+4)+'" text-anchor="end">'+mx+'</text><text class="tm" x="'+(O[0]-6)+'" y="'+(O[1]+4)+'" text-anchor="end">0</text>';
  h+='<path class="ln" d="M'+O[0]+' '+O[1]+'H'+P[0].toFixed(1)+'"/><path class="ln" style="stroke-opacity:.55" d="M'+P[0].toFixed(1)+' '+O[1]+'V'+P[1].toFixed(1)+'"/><path class="dash" d="M'+O[0]+' '+O[1]+'L'+P[0].toFixed(1)+' '+P[1].toFixed(1)+'"/>';
  h+='<text class="ta" x="'+((O[0]+P[0])/2).toFixed(1)+'" y="'+(O[1]-6)+'" text-anchor="middle">'+fmt(dx)+'</text>';
  h+='<text class="ta" x="'+(P[0]+(P[0]>250?-8:8)).toFixed(1)+'" y="'+((O[1]+P[1])/2).toFixed(1)+'" text-anchor="'+(P[0]>250?'end':'start')+'">'+fmt(dy)+'</text>';
  h+='<circle id="hd" class="hd" cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="8" tabindex="0" role="slider" aria-label="Punto: arrastra o usa las flechas" aria-valuetext="'+fmt(dx)+' y '+fmt(dy)+' NM"/>';
  $('plot').innerHTML=h; $('plot')._m={O:O,k:k,mx:mx};
}
function renderEye(){
  setField2('f-dx','dx'); setField2('f-dy','dy');
  drawEye();
  var r=eyeDist(st.dx,st.dy), el=$('eyesteps');
  el.innerHTML='<li>'+fmt(r.a)+' + 0,4 × '+fmt(r.b)+'</li><li>'+fmt(r.a)+' + '+fmt(rn(0.4*r.b))+' = '+fmt(rn(r.approx))+' NM</li>';
  $('eyetab').tBodies[0].innerHTML='<tr><th>Regla</th><td class="num">'+fmt(Math.round(r.approx*100)/100)+' NM</td></tr><tr><th>Exacto</th><td class="num">'+fmt(Math.round(r.exact*100)/100)+' NM</td></tr><tr><th>Error</th><td class="num">'+(r.exact>0?fmtPct(r.err):'—')+'</td></tr><tr><th>Máximo</th><td class="num">'+fmtPct(EYE_MIN_ERR)+' … '+fmtPct(EYE_MAX_ERR)+'</td></tr>';
  var X=function(e){ return 10+(e+0.02)/0.11*280; }, b='';
  b+='<rect x="'+X(EYE_MIN_ERR).toFixed(1)+'" y="10" width="'+(X(EYE_MAX_ERR)-X(EYE_MIN_ERR)).toFixed(1)+'" height="14" class="wd"/>';
  b+='<path class="ax" d="M10 28H290"/>';
  [0,0.04,0.08].forEach(function(e){ b+='<path class="ax" d="M'+X(e).toFixed(1)+' 28v4"/><text class="tm" x="'+X(e).toFixed(1)+'" y="43" text-anchor="middle">'+(e*100)+' %</text>'; });
  if(r.exact>0) b+='<path class="ln" d="M'+X(r.err).toFixed(1)+' 5V30"/>';
  $('errbar').innerHTML=b;
  save();
}
function setField2(id,k){ var el=$(id); if(document.activeElement===el) return; el.value=num(st[k])?fv(st[k],2):''; }
['dx','dy'].forEach(function(k){
  $('f-'+k).addEventListener('input',function(){ var x=parseNum(this.value); if(!(x>=0)||!isFinite(x)||x>5000){ this.setAttribute('aria-invalid','true'); return; } this.removeAttribute('aria-invalid'); st[k]=x; renderEye(); });
  $('f-'+k).addEventListener('blur',function(){ this.removeAttribute('aria-invalid'); renderEye(); });
});
(function(){
  var pl=$('plot'), drag=false;
  function from(e){ var m=pl._m, r=pl.getBoundingClientRect(), sc=300/r.width, x=(e.clientX-r.left)*sc, y=(e.clientY-r.top)*sc;
    st.dx=Math.max(0,Math.min(m.mx,Math.round((x-m.O[0])/m.k))); st.dy=Math.max(0,Math.min(m.mx,Math.round((m.O[1]-y)/m.k))); renderEye(); }
  pl.addEventListener('pointerdown',function(e){ drag=true; try{pl.setPointerCapture(e.pointerId);}catch(x){} from(e); e.preventDefault(); });
  pl.addEventListener('pointermove',function(e){ if(drag) from(e); });
  pl.addEventListener('pointerup',function(){ drag=false; });
  pl.addEventListener('pointercancel',function(){ drag=false; });
  pl.addEventListener('keydown',function(e){
    var d={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key]; if(!d) return;
    var s=e.shiftKey?10:1; st.dx=Math.max(0,st.dx+d[0]*s); st.dy=Math.max(0,st.dy+d[1]*s); renderEye(); var h=$('hd'); if(h) h.focus(); e.preventDefault();
  });
})();

// ---------- conversiones ----------
var NAMES={fl:['FL → ft','FL × 100','ft'],kt1:['kt → km/h','kt × 1,85','km/h'],kt2:['kt → km/h','kt × 2 − 10 %','km/h'],nm:['NM → km','NM × 1,85','km'],isa:['ISA en ese FL','15 − 2 × (FL ÷ 10)','°C'],d31:['Descenso, distancia','3 NM por 1000 ft','NM'],d300:['Descenso, altura','300 ft por NM','ft'],rate:['Descenso, régimen','5 × kt','ft/min']};
function renderConv(){
  [['f-fl','fl'],['f-to','toFl'],['f-kt','kt'],['f-nm','nm']].forEach(function(p){ var el=$(p[0]); if(document.activeElement!==el) el.value=num(st[p[1]])?fv(st[p[1]],2):''; });
  var rows=conversions({fl:st.fl,kt:st.kt,nm:st.nm,toFl:st.toFl}), h='';
  rows.forEach(function(r){
    var nm=NAMES[r.id], e=r.id==='fl'?'exacto':(r.id==='isa'?((r.approx-r.exact>=0?'+':'−')+fmt(Math.round(Math.abs(r.approx-r.exact)*10)/10)+' °C'):fmtPct(r.err));
    var bad=r.id!=='fl'&&Math.abs(r.err)>0.05&&r.id!=='isa';
    h+='<tr><td>'+nm[0]+'<span class="sub">'+nm[1]+(r.note?' · '+r.note:'')+'</span></td><td class="num">'+fmt(Math.round(r.approx*10)/10)+' '+nm[2]+'</td><td class="num">'+fmt(Math.round(r.exact*10)/10)+'</td><td class="num '+(bad?'bad':'')+'">'+e+'</td></tr>';
  });
  $('convtab').tBodies[0].innerHTML=h;
  save();
}
[['f-fl','fl'],['f-to','toFl'],['f-kt','kt'],['f-nm','nm']].forEach(function(p){
  var el=$(p[0]);
  el.addEventListener('input',function(){ var x=parseNum(this.value); if(!(x>=0)||!isFinite(x)||x>2000){ this.setAttribute('aria-invalid','true'); return; } this.removeAttribute('aria-invalid'); st[p[1]]=x; renderConv(); });
  el.addEventListener('blur',function(){ this.removeAttribute('aria-invalid'); renderConv(); });
});

renderMain(); renderEye(); renderConv();
})();
