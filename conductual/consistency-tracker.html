<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreador de consistencia 3B</title>
<style>
:root{color-scheme:light dark;--bg:#f4f2ec;--surface:#fff;--card:#ebe8df;--ink:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;--acc:#1a4d8f;--accd:#123a6e;--onacc:#fff;--ok:#2d6a3e;--bad:#a3241c;--warn:#b3450d;--serif:'Iowan Old Style',Charter,Cambria,Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--surface:#1e1e1c;--card:#262624;--ink:#e7e4dc;--mut:#a19c90;--line:#3a3935;--acc:#7fb0e8;--accd:#a5c8f0;--onacc:#161615;--ok:#7cbf8a;--bad:#e5766d;--warn:#e08a55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,'Segoe UI',Roboto,sans-serif}
header{padding:18px 18px 10px;max-width:1280px;margin:0 auto;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 26px/1.2 var(--serif)}
header p{margin:6px 0 0;font-size:13.5px;color:var(--mut);max-width:80ch}
nav{display:flex;gap:22px;padding:0 18px;max-width:1280px;margin:0 auto;border-bottom:1px solid var(--line)}
nav button,.tabs button{background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;font:inherit;font-weight:600;cursor:pointer;margin-bottom:-1px}
nav button:hover,.tabs button:hover{color:var(--ink)}
nav button[aria-selected=true],.tabs button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
.tabs{display:flex;gap:22px;margin-bottom:12px;border-bottom:1px solid var(--line)}
main{max-width:1280px;margin:0 auto;padding:16px 18px 48px}
.card{border-top:1px solid var(--line);padding:14px 0;margin-bottom:10px}
h2{font:700 19px/1.3 var(--serif);margin:0 0 8px}h3{font-size:15px;margin:12px 0 4px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button.btn{background:var(--acc);color:var(--onacc);border:1px solid var(--acc);border-radius:2px;padding:8px 14px;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--accd);border-color:var(--accd)}
button.btn.sec{background:transparent;color:var(--acc)}
button.btn.sec:hover{background:var(--card)}
button.btn:disabled,button.btn.sec:disabled{background:transparent;color:var(--mut);border-color:var(--line);cursor:not-allowed}
button.sm{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:2px;background:var(--surface);resize:vertical}
select,input[type=number],input[type=text],input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 2px;color:var(--mut)}
label.inline{display:inline-flex;align-items:center;gap:5px;font-weight:400;margin:2px 10px 2px 0;font-size:14px;color:var(--ink)}
label.inline input{width:auto}
.muted{color:var(--mut)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--mut);font-weight:600;border-bottom-color:var(--ink)}
tr.below td{color:var(--bad)}
tr.below .nm{font-weight:700}
td.gap{color:var(--warn);font-weight:600}
td input[type=number]{width:84px}
.tag{font-weight:700;color:var(--mut);margin-right:6px;font-size:12.5px}
.banner{padding:6px 0;font-weight:600;margin:8px 0}
.banner.bad{color:var(--bad)}.banner.ok{color:var(--ok)}.banner.neu{color:var(--ink);font-weight:400}.banner.warn{color:var(--warn)}
.clock{font:700 44px/1 ui-monospace,Consolas,monospace;letter-spacing:1px}
.clock.late{color:var(--bad)}
.model{border-top:1px solid var(--line);padding:8px 0;margin:4px 0}
.model.worst b{color:var(--bad)}
.model b{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.rate button{width:44px;height:44px;border-radius:2px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:16px;cursor:pointer}
.rate button:hover{background:var(--card)}
.ms{list-style:none;padding:0;margin:8px 0}
.ms li{padding:4px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.ms li.done{text-decoration:line-through}
.ms li.now{color:var(--ink);font-weight:700}
.prompt{font-size:17px;font-weight:600;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:10px 0;margin:8px 0;min-height:52px}
.prompt.flash{animation:fl .6s 3}
@keyframes fl{50%{color:var(--acc)}}
svg.trend{width:100%;height:64px;border-bottom:1px solid var(--line)}
.hidden{display:none!important}
kbd{border:1px solid var(--line);border-radius:2px;padding:0 5px;font-size:12px;background:var(--surface)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:600}
.find{border-top:1px solid var(--line);padding:8px 0}
.find .rid{font-weight:700;font-size:12.5px}
.find.contradiction .rid{color:var(--bad)}.find.warning .rid{color:var(--warn)}.find.structure .rid{color:var(--acc)}
.find q,.find blockquote{display:block;margin:3px 0;padding-left:0;color:var(--mut);font-size:13.5px;font-style:italic;quotes:none}
.rule{font-size:12.5px;color:var(--mut);margin:4px 0}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-weight:700;font-size:13px}
.pill.c{color:var(--bad)}.pill.w{color:var(--warn)}.pill.s{color:var(--acc)}.pill.ok{color:var(--ok)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}@media(max-width:980px){main{grid-template-columns:1fr}}
.tabs button{padding:8px 0}
select,input[type=text],input[type=date]{width:100%}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%231a4d8f%27 stroke-width=%271.9%27 stroke-linecap=%27round%27%3E%3Cstyle%3E@media(prefers-color-scheme:dark){*{stroke:%237fb0e8}}%3C/style%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%275.5%27/%3E%3Cpath d=%27M12 12L19 5%27/%3E%3Ccircle cx=%2716.4%27 cy=%2716.6%27 r=%271.1%27/%3E%3C/svg%3E">
</head>
<body>
<header>
<h1>Rastreador de consistencia</h1>
</header>
<main>
<div>
<div class="card">
<div id="corruptwarn" class="banner warn hidden">Algunas entradas guardadas no se pudieron leer; se han conservado las legibles.</div>
<div id="storewarn" class="banner warn hidden">Almacenamiento no disponible: exporta el CSV antes de salir.</div>
<div class="tabs" role="tablist">
<button role="tab" data-t="P" aria-selected="true">Personalidad</button>
<button role="tab" data-t="S" aria-selected="false">STAR</button>
<button role="tab" data-t="M" aria-selected="false">Simulacro</button>
</div>

<form id="f-P" autocomplete="off">
<label for="p-stmt">Afirmación</label>
<select id="p-stmt"></select>
<div id="p-custom" class="hidden">
<label for="p-ctext">Tu propia afirmación</label><input type="text" id="p-ctext" maxlength="200">
<div class="row"><label for="p-ccomp" style="margin:6px 0 0">Competencia que toca</label><select id="p-ccomp" style="width:auto"></select>
<label class="inline" style="margin-top:8px"><input type="checkbox" id="p-crev"> Invertida</label></div>
</div>
<label>Grado de acuerdo</label>
<div class="row" id="p-agree"></div>
<label>Origen</label>
<div class="row"><label class="inline"><input type="radio" name="p-src" value="practice" checked> Práctica</label><label class="inline"><input type="radio" name="p-src" value="recalled"> Recordada</label><label class="inline"><input type="radio" name="p-src" value="predicted"> Prevista</label></div>
<label for="p-note">Nota</label><input type="text" id="p-note" maxlength="200">
<div class="row" style="margin-top:10px"><button type="submit" class="btn" id="p-save">Añadir</button><button type="button" class="btn sec" id="p-cancel">Cancelar</button></div>
</form>

<form id="f-S" class="hidden" autocomplete="off">
<label for="s-title">Título</label><input type="text" id="s-title" maxlength="120">
<label for="s-sit">Situación</label><textarea id="s-sit"></textarea>
<label for="s-task">Tarea</label><textarea id="s-task"></textarea>
<label for="s-act">Acción</label><textarea id="s-act"></textarea>
<label for="s-res">Resultado</label><textarea id="s-res"></textarea>
<label for="s-learn">Lo que aprendí</label><textarea id="s-learn" style="min-height:40px"></textarea>
<label>Competencias</label>
<div id="s-tags"></div>
<div class="row" style="margin-top:4px"><button type="button" class="btn sec sm" id="s-suggest">Sugerir</button><span class="small muted" id="s-why" role="status"></span></div>
<div class="row" style="margin-top:10px"><button type="submit" class="btn" id="s-save">Añadir</button><button type="button" class="btn sec" id="s-cancel">Cancelar</button></div>
</form>

<form id="f-M" class="hidden" autocomplete="off">
<div class="row"><div style="flex:1"><label for="m-date">Fecha</label><input type="date" id="m-date"></div>
<div style="flex:2"><label for="m-comp">Competencia</label><select id="m-comp"></select></div></div>
<label>Nivel, de 1 a 5</label><div class="row" id="m-score"></div>
<label for="m-ctx">Contexto</label><input type="text" id="m-ctx" maxlength="160">
<label for="m-note">Conducta observada</label><textarea id="m-note"></textarea>
<div class="row" style="margin-top:10px"><button type="submit" class="btn" id="m-save">Añadir</button><button type="button" class="btn sec" id="m-cancel">Cancelar</button></div>
</form>
<div id="msg" class="small muted" role="status" style="margin-top:6px"></div>
</div>

<div class="card">
<h2>Tus entradas</h2>
<div class="row" style="margin-bottom:8px"><button class="btn" id="x-entries">Exportar CSV</button><button class="btn sec" id="x-clear">Borrar todo</button></div>
<div id="list"></div>
</div>
</div>

<div>
<div class="card">
<h2>Control de consistencia</h2>
<div class="summary" id="summary"></div>
<div id="findings"></div>
<div class="row"><button class="btn sec" id="x-find">Exportar CSV</button></div>
<details><summary>Reglas</summary>
<ul class="small" id="rulelist"></ul>
</details>
</div>
<div class="card">
<h2>Cobertura por competencia</h2>
<div id="cover"></div>
</div>
</div>
</main>

<script>
"use strict";
const COMPS=[
 {c:"TW",n:"Trabajo en equipo",max:18,kw:["equipo","juntos","compañer","colega","grupo","colabor","coordin","ayud","apoy","compart","cooper"]},
 {c:"RO",n:"Orientación a resultados",max:18,kw:["objetivo","plazo","entreg","terminé","terminar","resultado","meta","logr","complet","mejor","nota","calificaci","ganamos","gané","plan"]},
 {c:"DM",n:"Toma de decisiones",max:18,kw:["decid","decisión","elegí","elegir","elección","prioriz","prioridad","opción","opciones","valor","sopes"]},
 {c:"FL",n:"Flexibilidad y adaptación al cambio",max:18,kw:["adapt","cambio","cambié","imprevist","inesperad","nuevo plan","ajust","flexible","replanific","otro enfoque","enfoque distinto"]},
 {c:"OC",n:"Compromiso organizacional",max:18,kw:["seguridad","norma","procedimiento","responsab","honest","notific","comprometid","deber","integridad","calidad","ética","error","protocolo"]},
 {c:"RS",n:"Resiliencia",max:15,kw:["revés","fracaso","fallé","fallo","recuper","superé","persever","de nuevo","otra vez","crítica","rechaz","perdí","seguí adelante","aprendí de"]},
 {c:"ST",n:"Gestión del estrés y tolerancia a la presión",max:15,kw:["presión","estrés","calma","tensión","urgente","urgencia","plazo ajustado","agobi","nervios","pánico","saturad","carga de trabajo"]}
];
const CBY={};COMPS.forEach(x=>CBY[x.c]=x);
/* afirmaciones: rev = estar de acuerdo implica un nivel BAJO en la competencia */
const STMTS=[
 {c:"ST",rev:false,t:"Mantengo la calma cuando estoy bajo presión."},
 {c:"ST",rev:true,t:"La presión me hace perder la concentración."},
 {c:"RS",rev:false,t:"Me recupero rápido después de un revés."},
 {c:"RS",rev:true,t:"Los reveses se quedan conmigo mucho tiempo."},
 {c:"TW",rev:false,t:"Trabajo bien con otros hacia un objetivo común."},
 {c:"TW",rev:true,t:"Prefiero trabajar solo; los demás me hacen perder tiempo."},
 {c:"DM",rev:false,t:"Decido rápido aunque la información sea incompleta."},
 {c:"DM",rev:true,t:"Evito decidir hasta tener todos los datos."},
 {c:"FL",rev:false,t:"Me adapto con facilidad cuando cambian los planes."},
 {c:"FL",rev:true,t:"Me siento incómodo cuando cambian los planes."},
 {c:"RO",rev:false,t:"Siempre termino lo que empiezo."},
 {c:"RO",rev:true,t:"A menudo dejo las tareas sin terminar."},
 {c:"OC",rev:false,t:"Cumplo las normas aunque nadie me vea."},
 {c:"OC",rev:true,t:"Las normas se pueden saltar cuando el resultado es bueno."}
];
const RULES={
 C1:"Personalidad frente a personalidad: dos respuestas sobre la misma competencia cuyas puntuaciones efectivas difieren en 3 o más (tras invertir las afirmaciones invertidas) son una contradicción; una diferencia de 2 en la que una puntuación efectiva es 4 o más y la otra 2 o menos (por ejemplo, estar de acuerdo con una afirmación y con su contraria) es un aviso.",
 C2:"STAR frente a personalidad: una historia evidencia una competencia, pero una de tus respuestas de personalidad te sitúa en 2 o menos en ella.",
 C3:"STAR frente a simulacros: una historia evidencia una competencia, pero la media de tus 3 últimas observaciones de simulacro sobre ella es 2,5 o menos (contradicción con 2 o más simulacros y una media inferior a 2,5; en otro caso, un aviso). Los simulacros más antiguos se ignoran para no marcar la mejora.",
 C4:"Personalidad frente a simulacros: puntuación efectiva de personalidad de 4 o más, pero media de los 3 últimos simulacros de 2,5 o menos (o al revés: personalidad de 2 o menos y media de simulacros de 4 o más).",
 C5:"Simulacro frente a simulacro: la misma competencia observada con una diferencia de 3 o más entre simulacros (conducta inestable; no es algo que se arregle en una historia).",
 S1:"Estructura de la historia: no hay acción escrita.",
 S2:"Estructura de la historia: la acción no está en primera persona del singular (sin «yo», «mi», «me», ni verbos en primera persona como «decidí» o «propuse») o se usa «nosotros» más que «yo». Es una heurística sobre la forma de los verbos: puede fallar.",
 S3:"Estructura de la historia: el resultado no tiene ningún número (ni cifra ni palabra numérica como mitad, doble, duplicado o dos).",
 S4:"Estructura de la historia: no hay resultado escrito.",
 S5:"Estructura de la historia: no hay ninguna competencia marcada.",
 S6:"Estructura de la historia: falta la situación o la tarea."
};
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
 for(const k in (attrs||{})){const v=attrs[k];if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v);}
 kids.flat(Infinity).forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
function pad(n){return String(n).padStart(2,"0");}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

/* storage */
const KEY="atc3b.consistency.v1";let mem={entries:[],reviewed:{}},storageOK=true;
let corruptNote=false;
function okEntry(e){if(!e||typeof e!=="object"||typeof e.id!=="string"||typeof e.ts!=="number")return false;
 if(e.type==="P")return Number.isInteger(e.agree)&&e.agree>=1&&e.agree<=5&&(e.custom?(typeof e.ctext==="string"&&!!CBY[e.ccomp]):(Number.isInteger(e.stmt)&&e.stmt>=0&&e.stmt<STMTS.length));
 if(e.type==="S"){if(!Array.isArray(e.tags))e.tags=[];e.tags=e.tags.filter(c=>CBY[c]);["title","sit","task","act","res","learn"].forEach(k=>{if(typeof e[k]!=="string")e[k]="";});return true;}
 if(e.type==="M"){if(typeof e.ctx!=="string")e.ctx="";if(typeof e.note!=="string")e.note="";if(typeof e.date!=="string")e.date="";return !!CBY[e.comp]&&Number.isInteger(e.score)&&e.score>=1&&e.score<=5;}
 return false;}
function load(){let r=null;try{r=localStorage.getItem(KEY);}catch(e){storageOK=false;return mem;}
 if(!r)return mem;
 try{const o=JSON.parse(r);if(o&&Array.isArray(o.entries)){const good=o.entries.filter(okEntry);
  if(good.length!==o.entries.length){corruptNote=true;try{localStorage.setItem(KEY+".corrupt",r);}catch(e){}}
  return{entries:good,reviewed:(o.reviewed&&typeof o.reviewed==="object"&&!Array.isArray(o.reviewed))?o.reviewed:{}};}}catch(e){}
 corruptNote=true;try{localStorage.setItem(KEY+".corrupt",r);}catch(e){}
 return{entries:[],reviewed:{}};}
function save(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){storageOK=false;$("#storewarn").classList.remove("hidden");}}
let DB=load();if(!storageOK)$("#storewarn").classList.remove("hidden");
if(corruptNote){$("#corruptwarn").classList.remove("hidden");save();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- analysis (pure) ---------- */
const NUMW=/(?:^|[^a-záéíóúñ])(dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|docena|cien|ciento|cientos|mil|mitad|doble|duplic\w*|triplic\w*|triple|tercio|cuarto|por ciento|porcentaje|two|three|half|twice|double|doubled|percent)(?![a-záéíóúñ])/i;
function srcName(x){return x==="recalled"?"recordada del examen real":x==="predicted"?"prevista":"mi respuesta de práctica";}
function fd(x,d){return x.toFixed(d).replace(".",",");}
const SEVN={contradiction:"CONTRADICCIÓN",warning:"AVISO",structure:"ESTRUCTURA",info:"INFO"};
function pEff(e){return e.rev?6-e.agree:e.agree;}
function stmtOf(e){if(e.custom)return{c:e.ccomp,rev:!!e.crev,t:e.ctext};return STMTS[e.stmt];}
function pNorm(e){const s=stmtOf(e);return{...e,c:s.c,rev:s.rev,text:s.t,eff:s.rev?6-e.agree:e.agree};}
function firstPersonStats(t){
 const x=" "+t.toLowerCase().replace(/[.,;:!?()"«»]/g," ")+" ";
 const words=x.split(/\s+/).filter(Boolean);
 const NOT=/^(aquí|así|allí|sí|ahí|también|además|después|detrás|jamás|quizá|país|mí)$/;
 const irr=/^(hice|propuse|dije|fui|tuve|puse|pude|quise|supe|vi|di|traje|conduje|estuve|hago|decido|propongo|coordino|organizo|explico|ayudo|pido|digo|tengo|puedo|voy|soy|estoy|llevo|busco|aviso|informo|comunico|asumo|actúo|resuelvo|analizo|preparo|contacto|asigno|detecto|noto|reviso|escucho|pregunto|planteo|redacto|solicito|ofrezco|intervengo|priorizo|decidí|hablé|propuse|me|mi|mis|mí|conmigo|myself|my|i|yo)$/;
 let I=0,I2=0,we=0;
 words.forEach(w=>{
  if(w==="yo"||w==="i"){I2++;I++;}
  else if(irr.test(w)||(/[a-z]{2,}(é|í)$/.test(w)&&!NOT.test(w)))I++;
  if(/^(nosotros|nosotras|nuestro|nuestra|nuestros|nuestras|nos|we|our|us)$/.test(w)||/^[a-záéíóúñ]{3,}(amos|emos|imos)$/.test(w))we++;
 });
 return{I,I2,we};}
function analyze(entries){
 const F=[];const P=entries.filter(e=>e.type==="P").map(pNorm),S=entries.filter(e=>e.type==="S"),M=entries.filter(e=>e.type==="M");
 const q=t=>'"'+String(t).slice(0,140)+(String(t).length>140?"...":"")+'"';
 const add=(id,sev,comp,title,evidence,key)=>F.push({id,sev,comp,title,evidence,key:key||id+":"+comp+":"+evidence.join("|")});
 /* C1 */
 COMPS.forEach(x=>{const a=P.filter(p=>p.c===x.c);
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const gap=Math.abs(a[i].eff-a[j].eff),hi=Math.max(a[i].eff,a[j].eff),lo=Math.min(a[i].eff,a[j].eff);
   if(gap>=3||(gap===2&&hi>=4&&lo<=2))
   add("C1",gap>=3?"contradiction":"warning",x.c,"Misma competencia ("+x.n+") respondida de forma opuesta"+(gap>=3?".":" (has estado de acuerdo con afirmaciones que tiran en direcciones opuestas)."),[q(a[i].text)+" acuerdo "+a[i].agree+"/5 (efectiva "+a[i].eff+", "+srcName(a[i].source)+")",q(a[j].text)+" acuerdo "+a[j].agree+"/5 (efectiva "+a[j].eff+", "+srcName(a[j].source)+")"],"C1:"+a[i].id+":"+a[j].id);}});
 const mavg={},mn={};
 const mrec={};
 COMPS.forEach(x=>{const a=M.filter(m=>m.comp===x.c);const r=a.slice().sort((p,q)=>(p.date<q.date?-1:p.date>q.date?1:p.ts-q.ts)).slice(-3);mrec[x.c]=r;mn[x.c]=r.length;mavg[x.c]=r.length?r.reduce((s,m)=>s+m.score,0)/r.length:null;
  if(a.length>1){const mx=Math.max(...a.map(m=>m.score)),mi=Math.min(...a.map(m=>m.score));
   if(mx-mi>=3)add("C5","info",x.c,x.n+" se observó de forma muy distinta entre simulacros (puntuaciones de "+mi+" a "+mx+").",a.map(m=>m.date+" "+m.score+"/5: "+q(m.note||m.ctx||"")),"C5:"+x.c);}});
 /* C2, C3 */
 S.forEach(s=>{(s.tags||[]).forEach(c=>{
  P.filter(p=>p.c===c&&p.eff<=2).forEach(p=>add("C2","contradiction",c,'Historia «'+s.title+'»: afirma '+CBY[c].n+" pero una respuesta de personalidad dice lo contrario.",["Historia marcada con "+c,q(p.text)+" acuerdo "+p.agree+"/5 (efectiva "+p.eff+", "+srcName(p.source)+")"],"C2:"+s.id+":"+p.id));
  if(mn[c]&&mavg[c]<=2.5)add("C3",(mn[c]>=2&&mavg[c]<2.5&&mrec[c][mrec[c].length-1].score<=3)?"contradiction":"warning",c,'Historia «'+s.title+'»: afirma '+CBY[c].n+" pero tus observaciones de simulacro la muestran débil (media "+fd(mavg[c],1)+"/5 en tus últimos "+mn[c]+" simulacro"+(mn[c]>1?"s":"")+").",["Historia marcada con "+c].concat(mrec[c].map(m=>m.date+" "+m.score+"/5: "+q(m.note||m.ctx||""))),"C3:"+s.id+":"+c);});});
 /* C4 */
 COMPS.forEach(x=>{if(mavg[x.c]==null)return;const a=P.filter(p=>p.c===x.c);
  a.forEach(p=>{if(p.eff>=4&&mavg[x.c]<=2.5)add("C4","warning",x.c,"Te describes como fuerte en "+x.n+" pero los simulacros la muestran débil (media "+fd(mavg[x.c],1)+"/5).",[q(p.text)+" acuerdo "+p.agree+"/5 (efectiva "+p.eff+", "+srcName(p.source)+")","Media de simulacros "+fd(mavg[x.c],1)+"/5 sobre "+mn[x.c]],"C4a:"+p.id+":"+x.c);
   else if(p.eff<=2&&mavg[x.c]>=4)add("C4","warning",x.c,"Te describes como débil en "+x.n+" pero los simulacros la muestran fuerte (media "+fd(mavg[x.c],1)+"/5).",[q(p.text)+" acuerdo "+p.agree+"/5 (efectiva "+p.eff+", "+srcName(p.source)+")","Media de simulacros "+fd(mavg[x.c],1)+"/5 sobre "+mn[x.c]],"C4b:"+p.id+":"+x.c);});});
 /* structure */
 S.forEach(s=>{const t=s.title||"(sin título)";const ev=["Historia: "+t];
  const act=(s.act||"").trim(),res=(s.res||"").trim();
  if(!act)add("S1","structure",null,'Historia «'+t+'»: no tiene acción.',ev,"S1:"+s.id);
  else{const st=firstPersonStats(act);
   if(st.I===0)add("S2","structure",null,'Historia «'+t+'»: la acción no está en primera persona.',ev.concat([q(act)]),"S2a:"+s.id);
   else if(st.we>st.I)add("S2","structure",null,'Historia «'+t+'»: la acción dice «nosotros» ('+st.we+" veces) más que «yo» ("+st.I+" veces). Di lo que hiciste TÚ.",ev.concat([q(act)]),"S2b:"+s.id);}
  if(!res)add("S4","structure",null,'Historia «'+t+'»: no tiene resultado.',ev,"S4:"+s.id);
  else if(!/\d/.test(res)&&!NUMW.test(res))add("S3","structure",null,'Historia «'+t+'»: el resultado no tiene ningún número.',ev.concat([q(res)]),"S3:"+s.id);
  if(!(s.tags||[]).length)add("S5","structure",null,'Historia «'+t+'»: no evidencia ninguna competencia.',ev,"S5:"+s.id);
  if(!(s.sit||"").trim()||!(s.task||"").trim())add("S6","structure",null,'Historia «'+t+'»: falta '+(!(s.sit||"").trim()?"la situación":"")+(!(s.sit||"").trim()&&!(s.task||"").trim()?" y ":"")+(!(s.task||"").trim()?"la tarea":"")+".",ev,"S6:"+s.id);});
 return F;
}
function suggestTags(text){const t=text.toLowerCase(),out={};COMPS.forEach(x=>{const m=x.kw.filter(k=>t.includes(k));if(m.length)out[x.c]=m;});return out;}

$("#m-date").value=today();
const radio=n=>{const r=document.querySelector('input[name="'+n+'"]:checked');return r?r.value:null;};
function setRadio(n,v){document.querySelectorAll('input[name="'+n+'"]').forEach(r=>r.checked=r.value===String(v));}
function say(t){$("#msg").textContent=t;}
function cancelEdit(){editing=null;["P","S","M"].forEach(x=>{$("#"+x.toLowerCase()+"-save").textContent=({P:"Añadir",S:"Añadir",M:"Añadir"})[x];$("#"+x.toLowerCase()+"-cancel").classList.add("hidden");});
 $("#p-note").value="";$("#p-ctext").value="";["s-title","s-sit","s-task","s-act","s-res","s-learn","m-ctx","m-note"].forEach(i=>$("#"+i).value="");document.querySelectorAll('input[name="s-tag"]').forEach(c=>c.checked=false);$("#s-why").textContent="";}
["p-cancel","s-cancel","m-cancel"].forEach(i=>{$("#"+i).classList.add("hidden");$("#"+i).addEventListener("click",()=>{cancelEdit();say("Edición cancelada.");});});
let lastSig="",lastT=0;
function commit(e){
 const sig=JSON.stringify(Object.assign({},e,{id:0,ts:0}));if(!editing&&sig===lastSig&&Date.now()-lastT<1500)return;lastSig=sig;lastT=Date.now();
 if(editing){const i=DB.entries.findIndex(x=>x.id===editing);if(i>=0){e.id=editing;e.ts=DB.entries[i].ts;DB.entries[i]=e;}}else DB.entries.push(e);
 save();editing=null;cancelEdit();render();}
$("#f-P").addEventListener("submit",ev=>{ev.preventDefault();
 const v=$("#p-stmt").value;const e={id:uid(),ts:Date.now(),type:"P",date:today(),agree:parseInt(radio("p-agree"),10),source:radio("p-src"),note:$("#p-note").value.trim()};
 if(v==="custom"){const t=$("#p-ctext").value.trim();if(!t){say("Falta la afirmación.");return;}e.custom=true;e.ctext=t;e.ccomp=$("#p-ccomp").value;e.crev=$("#p-crev").checked;}else e.stmt=parseInt(v,10);
 commit(e);say("Respuesta de personalidad añadida.");});
$("#f-S").addEventListener("submit",ev=>{ev.preventDefault();
 const title=$("#s-title").value.trim();if(!title){say("Ponle un título a la historia.");return;}
 commit({id:uid(),ts:Date.now(),type:"S",date:today(),title,sit:$("#s-sit").value,task:$("#s-task").value,act:$("#s-act").value,res:$("#s-res").value,learn:$("#s-learn").value,tags:[...document.querySelectorAll('input[name="s-tag"]:checked')].map(c=>c.value)});say("Historia añadida.");});
$("#f-M").addEventListener("submit",ev=>{ev.preventDefault();

$("#s-suggest").addEventListener("click",()=>{
 const text=["s-sit","s-task","s-act","s-res","s-learn"].map(i=>$("#"+i).value).join(" ");const sg=suggestTags(text);
 document.querySelectorAll('input[name="s-tag"]').forEach(c=>{if(sg[c.value])c.checked=true;});
 $("#s-why").textContent=Object.keys(sg).length?Object.keys(sg).map(c=>c+" ("+sg[c].join(", ")+")").join("; "):"Sin coincidencias";});

function editEntry(e){
 editing=e.id;setTab(e.type);const pre=e.type.toLowerCase();$("#"+pre+"-save").textContent="Guardar cambios";$("#"+pre+"-cancel").classList.remove("hidden");
 if(e.type==="P"){$("#p-stmt").value=e.custom?"custom":e.stmt;$("#p-custom").classList.toggle("hidden",!e.custom);if(e.custom){$("#p-ctext").value=e.ctext;$("#p-ccomp").value=e.ccomp;$("#p-crev").checked=!!e.crev;}setRadio("p-agree",e.agree);setRadio("p-src",e.source);$("#p-note").value=e.note||"";}
 if(e.type==="S"){$("#s-title").value=e.title;$("#s-sit").value=e.sit;$("#s-task").value=e.task;$("#s-act").value=e.act;$("#s-res").value=e.res;$("#s-learn").value=e.learn;document.querySelectorAll('input[name="s-tag"]').forEach(c=>c.checked=(e.tags||[]).includes(c.value));}
 if(e.type==="M"){$("#m-date").value=e.date;$("#m-comp").value=e.comp;setRadio("m-score",e.score);$("#m-ctx").value=e.ctx;$("#m-note").value=e.note;}
 say("Editando. Guarda los cambios o cancela.");window.scrollTo({top:0});}

/* ---------- render ---------- */
function entryLine(e){
 if(e.type==="P"){const p=pNorm(e);return{k:"Personalidad ("+({practice:"práctica",recalled:"recordada",predicted:"prevista"}[e.source]||e.source)+")",body:[h("span",{class:"tag",text:p.c}),p.text+" "+e.agree+"/5"+(p.rev?" (invertida, efectiva "+p.eff+")":"")]};}
 if(e.type==="S")return{k:"Historia STAR",body:[(e.tags||[]).map(c=>h("span",{class:"tag",text:c})),h("strong",{text:e.title})]};
 return{k:"Simulacro "+e.date,body:[h("span",{class:"tag",text:e.comp}),e.score+"/5 "+(e.note||e.ctx||"")]};}
function render(){
 DB=load();
 const L=$("#list");
 if(!DB.entries.length)L.replaceChildren(h("p",{class:"muted",id:"empty",text:""}));
 else L.replaceChildren(h("table",{id:"etable"},h("thead",{},h("tr",{},h("th",{text:"Tipo"}),h("th",{text:"Entrada"}),h("th",{text:""}))),
  h("tbody",{},DB.entries.slice().sort((a,b)=>b.ts-a.ts).map(e=>{const l=entryLine(e);
   return h("tr",{},h("td",{text:l.k}),h("td",{},l.body),h("td",{class:"row"},h("button",{class:"btn sec sm",text:"Editar",onclick:()=>editEntry(e)}),h("button",{class:"btn sec sm",text:"Borrar","aria-label":"Borrar entrada",onclick:()=>{DB.entries=DB.entries.filter(x=>x.id!==e.id);save();render();}})));}))));
 const F=analyze(DB.entries);const open=F.filter(f=>!DB.reviewed[f.key]);
 const cnt=s=>open.filter(f=>f.sev===s).length;
 $("#summary").replaceChildren(
  h("span",{class:"pill c",id:"n-c",text:cnt("contradiction")+(cnt("contradiction")===1?" contradicción":" contradicciones")}),
  h("span",{class:"pill w",id:"n-w",text:cnt("warning")+" aviso"+(cnt("warning")===1?"":"s")}),
  h("span",{class:"pill s",id:"n-s",text:cnt("structure")+" de estructura"}),
  h("span",{class:"pill ok",text:F.length-open.length+" revisados"}));
 const order={contradiction:0,warning:1,structure:2,info:3};
 const box=$("#findings");
 if(!DB.entries.length)box.replaceChildren(h("p",{class:"muted",text:""}));
 else if(!F.length)box.replaceChildren(h("div",{class:"banner neu",id:"nofind",text:"Sin hallazgos"}));
 else box.replaceChildren(...F.slice().sort((a,b)=>order[a.sev]-order[b.sev]).map(f=>{
  const cb=h("input",{type:"checkbox",checked:!!DB.reviewed[f.key],onchange:()=>{if(cb.checked)DB.reviewed[f.key]=true;else delete DB.reviewed[f.key];save();render();}});
  return h("div",{class:"find "+f.sev+(DB.reviewed[f.key]?" reviewed":""),"data-rule":f.id,style:DB.reviewed[f.key]?"opacity:.55":null},
   h("div",{},h("span",{class:"rid",text:"REGLA "+f.id+" - "+SEVN[f.sev]}),f.comp?h("span",{class:"tag",style:"margin-left:8px",text:f.comp}):null),
   h("div",{text:f.title}),f.evidence.map(t=>h("blockquote",{text:t})),h("div",{class:"rule",text:"Regla aplicada: "+RULES[f.id]}),
   h("label",{class:"inline"},cb,"Revisado (lo he corregido o lo doy por bueno)"));}));
 /* coverage */
 const S=DB.entries.filter(e=>e.type==="S"),P=DB.entries.filter(e=>e.type==="P").map(pNorm),M=DB.entries.filter(e=>e.type==="M");
 $("#cover").replaceChildren(h("table",{id:"ctable"},h("thead",{},h("tr",{},["Competencia","Historias","Respuestas de personalidad","Observaciones de simulacro (media)"].map(t=>h("th",{text:t})))),
  h("tbody",{},COMPS.map(x=>{const ns=S.filter(s=>(s.tags||[]).includes(x.c)).length,np=P.filter(p=>p.c===x.c),nm=M.filter(m=>m.comp===x.c);
   return h("tr",{},h("td",{},h("span",{class:"tag",text:x.c}),x.n),h("td",ns?{text:String(ns)}:{class:"gap",text:"0"}),
    h("td",{text:np.length?np.length+" (efectiva media "+fd(np.reduce((s,p)=>s+p.eff,0)/np.length,1)+")":"-"}),
    h("td",{text:nm.length?nm.length+" ("+fd(nm.reduce((s,m)=>s+m.score,0)/nm.length,1)+"/5)":"-"}));}))));
}
$("#rulelist").replaceChildren(...Object.keys(RULES).map(k=>h("li",{},h("b",{text:k+": "}),RULES[k])));

/* ---------- CSV ---------- */
function esc(v){v=String(v==null?"":v).replace(/\r?\n/g," ");return /[;"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function dl(name,rows){const blob=new Blob([rows.join("\n")+"\n"],{type:"text/csv;charset=utf-8"});
 const a=h("a",{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
$("#x-entries").addEventListener("click",()=>{DB=load();if(!DB.entries.length){say("Nada que exportar.");return;}
 dl("3b-consistency-entries.csv",["Date;Type;Competency;Text;Rating;Source;Tags"].concat(DB.entries.slice().sort((a,b)=>a.ts-b.ts).map(e=>{
  if(e.type==="P"){const p=pNorm(e);return [e.date,"Personality",p.c,p.text,e.agree+" (effective "+p.eff+")",e.source,""].map(esc).join(";");}
  if(e.type==="S")return [e.date,"STAR",(e.tags||[]).join("/"),e.title+" | S: "+e.sit+" | T: "+e.task+" | A: "+e.act+" | R: "+e.res+" | L: "+e.learn,"","",(e.tags||[]).join("/")].map(esc).join(";");
  return [e.date,"Mock",e.comp,(e.ctx?e.ctx+": ":"")+e.note,e.score,"",""].map(esc).join(";");})));say("Entradas exportadas.");});

render();
