articles, quantifiers, gerund vs infinitive (solid C1)</h1><div class="bar"><span id="score"></span><button id="shuf">Shuffle questions</button><label><input type="checkbox" id="so"> Shuffle options</label><label><input type="checkbox" id="hd"> Hide answered</label><button id="wrong">Only my mistakes</button><button id="reset">Reset</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "______ the pilot needed most was a clear weather report.", "opts": ["That", "Which", "What", "It"], "ans": 2, "why": "A wh-cleft (\"What the pilot needed most was...\") puts the emphasis on the complement. \"What\" acts as the object of \"needed\".", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 2, "stem": "It was not until 2015 ______ the new procedure was introduced.", "opts": ["that", "when", "which", "since"], "ans": 0, "why": "In \"It was not until... that...\" the connector is \"that\".", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 3, "stem": "______ from the tower, the aircraft could not be seen in the fog.", "opts": ["Viewing", "Viewed", "To view", "Having view"], "ans": 1, "why": "A past participle clause with passive meaning (\"when it was viewed from the tower\") has the same subject as the main clause (the aircraft).", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 4, "stem": "The pilot regrets ______ you that the flight has been cancelled.", "opts": ["having informed", "informing", "to inform", "inform"], "ans": 2, "why": "\"Regret to + infinitive\" is used to announce bad news now; \"regret + gerund\" refers to regretting a past action.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 5, "stem": "She is ______ honest person I have ever met.", "opts": ["more", "most", "a most", "the most"], "ans": 3, "why": "The superlative of long adjectives needs \"the most\". \"A most\" means \"very\" and is not followed by \"ever met\" as a comparison.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 6, "stem": "______ of the two runways is currently open; both are closed for maintenance.", "opts": ["Any", "Either", "None", "Neither"], "ans": 3, "why": "\"Neither of the two\" means not one and not the other; it agrees with the fact that both are closed. \"None\" is used for more than two.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 7, "stem": "The number of passengers ______ increased significantly this year.", "opts": ["have", "has", "are", "were"], "ans": 1, "why": "\"The number of\" takes a singular verb; \"a number of\" takes a plural verb.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 8, "stem": "Not ______ the instructions, he made several mistakes.", "opts": ["to understand", "understanding", "understood", "having understand"], "ans": 1, "why": "A participle clause with an active meaning and a negative uses \"not + -ing\" (\"because he did not understand\").", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 9, "stem": "The airport is ______ hour's drive from the city centre.", "opts": ["a", "the", "an", "one of"], "ans": 2, "why": "\"Hour\" begins with a vowel sound (the \"h\" is silent), so the indefinite article is \"an\".", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 10, "stem": "He tried ______ the engine, but it would not start.", "opts": ["having restarted", "to restart", "restart", "to have restarted"], "ans": 1, "why": "\"Try + to-infinitive\" means to make an effort (\"tried to restart but failed\"); \"try + gerund\" would mean to experiment with a method.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 11, "stem": "Passengers are advised ______ to the airport at least two hours before departure.", "opts": ["to arriving", "arriving", "arrive", "to arrive"], "ans": 3, "why": "\"Advise someone to + infinitive\"; the passive keeps the to-infinitive.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 12, "stem": "Neither the captain nor the co-pilots ______ told about the fault.", "opts": ["were", "was", "has been", "is"], "ans": 0, "why": "With \"neither... nor\" the verb agrees with the nearer subject (\"the co-pilots\", plural), and the past tense fits the narrative.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 13, "stem": "There is hardly ______ time left before the deadline.", "opts": ["any", "no", "some", "many"], "ans": 0, "why": "\"Hardly\" is negative in meaning, so it is followed by \"any\"; \"hardly no\" is a double negative, and \"many\" needs a countable noun.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 14, "stem": "The two pilots, ______ of whom had over 10,000 flying hours, landed the aircraft in the storm.", "opts": ["most", "all", "both", "many"], "ans": 2, "why": "\"Both of whom\" is the partitive relative used for exactly two people. \"All\", \"most\" and \"many\" refer to larger groups.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 15, "stem": "______ the cost, the project is not worth continuing.", "opts": ["To give", "Giving", "Gave", "Given"], "ans": 3, "why": "\"Given + noun\" means \"considering\" (a participle used like a preposition).", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 16, "stem": "She has been working here for more ______ ten years.", "opts": ["than", "as", "that", "of"], "ans": 0, "why": "\"More than\" is used before numbers; \"as\" and \"that\" are not used in comparisons of this kind.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 17, "stem": "I object ______ being treated like a child.", "opts": ["to", "at", "on", "with"], "ans": 0, "why": "\"Object to\" takes a gerund, because \"to\" is a preposition.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 18, "stem": "He went on ______ about the problems for over an hour.", "opts": ["for talking", "talking", "talk", "to talking"], "ans": 1, "why": "\"Go on + gerund\" means to continue doing the same thing; \"go on + to-infinitive\" means to do something new next.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 19, "stem": "Each of the controllers ______ a headset.", "opts": ["have", "are having", "has", "were"], "ans": 2, "why": "\"Each\" is singular, so the verb agrees in the singular.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 20, "stem": "Air traffic control is ______ demanding job that it requires constant concentration.", "opts": ["so", "such a", "such", "a so"], "ans": 1, "why": "\"Such a + adjective + noun + that\" expresses result. \"So\" is used before an adjective without a noun (\"so demanding\"), and \"a so\" is not possible.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 21, "stem": "It was the manager, not the assistant, ______ made the mistake.", "opts": ["which", "whom", "who", "whose"], "ans": 2, "why": "In a cleft sentence about a person as the subject, \"who\" is used.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 22, "stem": "The report ______ by an independent panel is due tomorrow.", "opts": ["written", "writing", "to write", "which writes"], "ans": 0, "why": "A past participle reduces a passive relative clause (\"which was written by an independent panel\").", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 23, "stem": "______ we have finished the analysis, we will send you the results.", "opts": ["Once", "Whereas", "Unless", "Although"], "ans": 0, "why": "\"Once\" means \"as soon as\" and links two future actions; the present perfect is used after it for the completed one.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 24, "stem": "The captain, together with the officers, ______ decided to abort.", "opts": ["have", "were", "are", "has"], "ans": 3, "why": "\"Together with\" does not make the subject plural; \"the captain\" is singular.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}, {"n": 25, "stem": "I don't mind ______ late as long as the work is finished.", "opts": ["worked", "to work", "work", "working"], "ans": 3, "why": "\"Mind\" is followed by a gerund.", "src": "Practice item. Rule: Cambridge Dictionary; Swan, <em>Practical English Usage</em>.", "note": ""}],U={"lang": "en", "contents": "Contents", "index": "Index", "words": "words", "min_read": "min read", "quiz": "quiz", "article": "article", "score": "correct of", "answered": "answered", "questions": "questions", "shuffle_q": "Shuffle questions", "shuffle_o": "Shuffle options", "hide": "Hide answered", "mistakes": "Only my mistakes", "reset": "Reset", "correct": "Correct.", "wrong": "Wrong.", "note": "Note", "source": "Source", "confirm": "Clear your answers for this quiz?", "badge": {"V": "read in the full source", "V*": "read in a summary", "V-W": "Wikipedia (secondary)", "NV": "not verified", "D": "derived / calculated", "X": "not found"}},KEY='atcquiz:'+"ingles/uoe-set-08.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
