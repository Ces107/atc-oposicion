<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UoE Set 13: health and medicine vocabulary, with the grammar points that recur in the real papers</title><style>
:root{color-scheme:light dark;
  --bg:#f4f2ec;--surface:#ffffff;--card:#ebe8df;--fg:#1b1b1b;--mut:#5f5b53;--line:#cfcabd;
  --acc:#1a4d8f;--acc2:#123a6e;--onacc:#ffffff;--warn:#b3450d;--ok:#2d6a3e;--bad:#a3241c;
  --v:#2d6a3e;--vs:#b3450d;--nv:#a3241c;--d:#1a4d8f;
  --serif:'Iowan Old Style',Charter,Cambria,Georgia,serif;--sans:system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
  --bg:#161615;--surface:#1e1e1c;--card:#262624;--fg:#e7e4dc;--mut:#a19c90;--line:#3a3935;
  --acc:#7fb0e8;--acc2:#a5c8f0;--onacc:#161615;--warn:#e08a55;--ok:#7cbf8a;--bad:#e5766d;
  --v:#7cbf8a;--vs:#e08a55;--nv:#e5766d;--d:#7fb0e8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc)}a:hover{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.logo{width:22px;height:22px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1rem;font:14px var(--sans);display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
header.top a{text-decoration:none;color:var(--fg)}header.top a:hover{color:var(--acc)}
header.top a.home{display:inline-flex;align-items:center;gap:.5rem;font:700 15px var(--serif);letter-spacing:.01em}
header.top a.back{color:var(--mut);display:inline-flex;align-items:center;gap:.3rem}
header.top a.back svg{transform:scaleX(-1)}
header.top .t{color:var(--mut);margin-left:auto;font-size:13px}

.wrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
nav.toc{position:sticky;top:3.6rem;align-self:flex-start;flex:0 0 240px;max-height:calc(100vh - 4.5rem);overflow:auto;font:13.5px/1.4 var(--sans);border-right:1px solid var(--line);padding-right:1rem}
nav.toc>b,nav.toc summary{display:block;font:600 13px var(--sans);color:var(--mut);margin-bottom:.4rem;list-style:none}
nav.toc summary::-webkit-details-marker{display:none}nav.toc summary{cursor:pointer}
@media (min-width:901px){nav.toc summary{pointer-events:none}}
nav.toc ul{list-style:none;margin:0;padding-left:.9rem}nav.toc>ul{padding-left:0}nav.toc a{color:var(--mut);text-decoration:none;display:block;padding:.18rem 0}nav.toc a:hover{color:var(--acc)}
main{flex:1 1 auto;min-width:0;max-width:780px;overflow-wrap:break-word}
main p,main li,main blockquote{max-width:68ch}
.wrap>main:not(.quiz){font:17.5px/1.6 var(--serif)}
.wrap>main:only-child{margin:0 auto}
h1,h2,h3,h4{font-family:var(--serif);color:var(--fg);hyphens:none;scroll-margin-top:calc(var(--hh,2.9rem) + 1.2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:.5rem .8rem;font:600 14px var(--sans)}
.skip:focus{left:.5rem;top:.5rem}
main:focus{outline:none}
h1{font-weight:700;font-size:2.05rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 1.1rem}
h2{font-weight:700;font-size:1.4rem;line-height:1.3;margin:2.3rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
h3{font-weight:700;font-size:1.06rem;line-height:1.35;margin:1.6rem 0 .4rem}
h4{font-weight:700;font-size:1rem;margin:1.2rem 0 .3rem}
h2 svg.i{color:var(--acc);margin-right:.35rem}
p,li{hyphens:manual}
main ul,main ol{padding-left:1.3rem}
table{border-collapse:collapse;margin:1rem 0;font:14.5px/1.45 var(--sans)}
main table{display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.45rem .7rem .45rem 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--mut);border-bottom:1px solid var(--fg);font-size:.92em}
code{font:.88em var(--mono);background:var(--card);border-radius:2px;padding:.05em .3em}
pre{background:var(--card);border-radius:2px;padding:.8rem 1rem;overflow:auto}pre code{padding:0;background:none}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
main img,main svg{max-width:100%;height:auto}
main .figwrap{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:center}
main .figwrap img{display:block;margin:0 auto;background:#fff}
main .figwrap a{display:block;cursor:zoom-in}
main pre{max-width:100%}main pre code,main code{overflow-wrap:anywhere}main pre code{white-space:pre-wrap;word-break:break-word}
blockquote{margin:1.1rem 0;padding:.5rem 0 .5rem 1.1rem;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.b{font:600 .72em var(--sans);white-space:nowrap;margin:0 .1em}.b::before{content:"["}.b::after{content:"]"}
.b.v{color:var(--v)}.b.vs{color:var(--vs)}.b.nv{color:var(--nv)}.b.d{color:var(--d)}
.meta{font:13px var(--sans);color:var(--mut);margin-bottom:.8rem}
.sub{color:var(--mut)}

/* controles: rectangulares, 1px de acento, relleno solo en la accion principal */
.btn,button.btn{display:inline-flex;align-items:center;gap:.4rem;background:transparent;color:var(--acc)!important;border:1px solid var(--acc);text-decoration:none;font:600 14px var(--sans);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background-color .12s,color .12s}
.btn:hover{background:var(--card)}
.btn.pri{background:var(--acc);color:var(--onacc)!important}.btn.pri:hover{background:var(--acc2)}

/* preguntas de test */
main.quiz{font-family:var(--sans)}
.bar{position:sticky;top:var(--hh,2.9rem);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0;font:14px var(--sans);display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center}
.bar #score{margin-right:auto;font-variant-numeric:tabular-nums}
.bar button{font:600 13px var(--sans);padding:6px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:2px;cursor:pointer}
.bar button:hover{background:var(--card)}
.bar label{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.q{border-top:1px solid var(--line);padding:1.1rem 0 .6rem;margin:0}
.qn{font:600 .8rem var(--sans);color:var(--mut);font-variant-numeric:tabular-nums}
.stem{margin:.2rem 0 .8rem;font:600 1.02rem/1.5 var(--serif)}
.opt{display:flex;gap:.7rem;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.95em;padding:.55rem .75rem;margin:.3rem 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--fg);cursor:pointer}
.opt b{color:var(--mut);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.exp{margin-top:.7rem;font-size:.93em;padding:.2rem 0 .5rem}.okt{color:var(--ok)}.badt{color:var(--bad)}.src,.nt{color:var(--mut);font-size:.9em;margin-top:.3rem}

/* listas con regla: sustituyen a las rejillas de fichas */
.rows{border-top:1px solid var(--line);margin:.6rem 0 1.8rem}
h2+.rows,h2+div>.rows,h2+.tw{margin-top:0}
h2+.rows,h2+div>.rows{border-top:0}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem .15rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.row>svg.i{width:1.5rem;height:1.5rem;padding:.1rem;color:var(--acc)}
a.row:hover{background:var(--card)}a.row:hover .row-title{color:var(--acc)}
.row-num{flex:0 0 1.5rem;text-align:center;font:700 1rem var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.8rem}
.row-title{font-weight:600}
a.row-title{color:var(--fg);text-decoration:none}a.row-title:hover{color:var(--acc)}
.row-desc{color:var(--mut);font-size:.9rem}
.row-meta{flex:0 0 auto;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-meta a{color:var(--acc);text-decoration:none;margin-left:.9rem}.row-meta a:hover{text-decoration:underline}
.row.lk{color:var(--acc)}
table.src{width:100%;margin:0 0 .6rem;display:table;table-layout:fixed}
table.src tr:first-child td{border-top:0}
@media (max-width:700px){.hm{display:none}table.src{table-layout:auto}table.src td.act{white-space:normal}table.src td.act a{display:flex;margin:0 0 .35rem}}
.tw{overflow-x:auto}
table.src td.act{white-space:nowrap}
table.src td.act a{display:inline-flex;align-items:center;gap:.3rem;margin-right:1rem;text-decoration:none;font-weight:600}
table.src td.act a:hover{text-decoration:underline}
.small{font-size:.85em;color:var(--mut)}
.note{hyphens:none;color:var(--mut);font-size:.9rem;margin:.5rem 0 1.5rem}
.paid{display:block;font-weight:700;font-size:.85em;color:var(--warn)}
main.narrow{max-width:780px;margin:0 auto;padding:1.4rem 1rem 3rem}

@media (max-width:900px){.wrap{display:block}nav.toc{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:0 0 .5rem;margin-bottom:1rem}nav.toc summary{padding:.5rem 0;margin:0}nav.toc a{padding:.35rem 0}.wrap{padding:.8rem 1rem 3rem}.wrap>main:not(.quiz){font-size:16.5px}h1{font-size:1.7rem}header.top{gap:.8rem}}
@media print{header.top,nav.toc,.bar,details.side,.skip,.reading-progress,.cmdk-overlay{display:none}body{background:#fff;color:#000;font-size:11pt}.wrap{display:block;padding:0;max-width:none}main{max-width:none}a{color:#000;text-decoration:none}h2,h3{break-after:avoid}table,pre,blockquote{break-inside:avoid}}

.docwrap{display:flex;gap:2.5rem;max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem;align-items:flex-start}
details.side{flex:0 0 232px;position:sticky;top:3.6rem;font:14px var(--sans);max-height:calc(100vh - 4.5rem);overflow:auto}
details.side summary{display:none;cursor:pointer;font:600 14px var(--sans);padding:.5rem 0;list-style:none}
details.side summary::-webkit-details-marker{display:none}
details.side h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 .35rem}
details.side ul{list-style:none;margin:0 0 1.1rem;padding:0}
details.side ul+ul{border-top:1px solid var(--line);padding-top:.7rem}
details.side li a{display:flex;align-items:center;gap:.55rem;padding:.3rem .5rem;color:var(--fg);text-decoration:none;line-height:1.35}
details.side li a b{flex:0 0 1.15rem;font:700 13px var(--serif);color:var(--mut);font-variant-numeric:tabular-nums}
details.side li a svg.i{color:var(--mut)}
details.side li a:hover{color:var(--acc)}details.side li a:hover svg.i{color:var(--acc)}
details.side li a.active{background:var(--card);color:var(--fg);font-weight:600}
details.side li a.active svg.i,details.side li a.active b{color:var(--acc)}
.docmain{flex:1 1 auto;min-width:0;max-width:780px}
.docmain h1{display:flex;align-items:center;gap:.6rem}.docmain h1 svg.i{width:1.6rem;height:1.6rem;color:var(--acc)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;padding-bottom:.6rem}
.hero h1{margin:0}
.hero svg.illus{width:290px;height:auto;flex:none;color:var(--fg);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:-.2rem}
@media(max-width:900px){
  .docwrap{display:block;padding:1rem 1rem 3rem}
  details.side{position:static;width:auto;max-height:none;overflow:visible;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
  details.side summary{display:block;padding:.7rem 0}
  details.side li a{padding:.6rem .5rem}
  details.side[open] summary{margin-bottom:.4rem}
}
@media(max-width:560px){.hero svg.illus{display:none}.row-desc{flex:0 0 100%}}
details.amp{margin:1.6rem 0}details.amp>summary{cursor:pointer;font:700 1.15rem var(--serif);padding:.4rem 0;border-bottom:1px solid var(--line)}

.cmdk-btn{display:inline-flex;align-items:center;gap:.4rem;font:14px var(--sans);color:var(--mut);background:transparent;border:0;padding:.45rem 0;cursor:pointer;margin-left:auto}
.cmdk-btn:hover{color:var(--acc)}
.cmdk-btn .kbd{font:12px var(--sans);color:var(--mut);opacity:.85}
@media (max-width:560px){.cmdk-btn .kbd{display:none}header.top{gap:.8rem}}
.cmdk-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:80;display:none}
.cmdk-overlay.open{display:block}
.cmdk-panel{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:66vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--fg);border-radius:2px;overflow:hidden}
.cmdk-input{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--sans);padding:.85rem 1rem;border-radius:0}
.cmdk-input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (max-width:560px){.cmdk-panel{top:6vh;max-height:60vh}.cmdk-item{padding:.7rem 1rem}}
.cmdk-list{overflow:auto;flex:1 1 auto}
.cmdk-item{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 1rem;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--card)}
.cmdk-t{font:600 14px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cmdk-s{font:13px var(--sans);color:var(--mut);white-space:nowrap;flex:0 0 auto}
.cmdk-empty{padding:.9rem 1rem;color:var(--mut);font:14px var(--sans)}
nav.toc a.active{color:var(--acc);font-weight:600}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:90}

ymbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h11A1.5 1.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5h-2"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5v-8h15v8H17M7 14h10v6.5H7z"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14.5 6.5l3 3"/></symbol><symbol id="i-inst" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4l8.5 5.5zM5.5 12v6M9.5 12v6M14.5 12v6M18.5 12v6M3.5 20.5h17"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.3a4.6 4.6 0 0 0 .6 9.2z"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5L9 4l6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></symbol><symbol id="i-tower" viewBox="0 0 24 24"><path d="M9.5 21l1-9M14.5 21l-1-9M7.5 12h9L18 7.5H6zM12 7.5v-4M6 21h12"/></symbol><symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-wing" viewBox="0 0 24 24"><path d="M3 14c4-5.5 12-6.5 18-3.5-2 3.5-10 5.5-18 3.5zM2 19.5h7M12 19.5h4"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></symbol><symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7.5 18.5H17a4 4 0 0 0 1.6-7.7M6.9 9.3a4.6 4.6 0 0 0 .6 9.2M9 6.2a5.5 5.5 0 0 1 8.4 4.3M4 4l16 16"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13.5 9.5l2 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3 7.8-7.5 9.5-4.5-1.7-7.5-5-7.5-9.5V6z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></symbol></svg><header class="top"><a class="home" href="../index.html"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><path d="M12 12L19 5"/><circle cx="16.4" cy="16.6" r="1.1"/></svg>ATC 2025</a><a class="back" href="index.html"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>English</a><button type="button" class="cmdk-btn" onclick="window.__atcSearchOpen&&window.__atcSearchOpen()"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>Buscar <span class="kbd">Ctrl K</span></button><span id="acct-slot"></span></header><div class="wrap"><main id="main" tabindex="-1" class="quiz"><h1>UoE Set 13: health and medicine vocabulary, with the grammar points that recur in the real papers</h1><div class="bar"><span id="score"></span><button id="shuf">Shuffle questions</button><label><input type="checkbox" id="so"> Shuffle options</label><label><input type="checkbox" id="hd"> Hide answered</label><button id="wrong">Only my mistakes</button><button id="reset">Reset</button></div><div id="qs"></div></main></div><script>
const Q=[{"n": 1, "stem": "She had a sore throat and a ______ voice after shouting at the match all afternoon.", "opts": ["dizzy", "numb", "swollen", "hoarse"], "ans": 3, "why": "\"Hoarse\" describes a rough, strained voice. \"Dizzy\" is a feeling that things are spinning, \"numb\" means without feeling in a part of the body, and \"swollen\" means bigger than normal (glands, an ankle); none describes a voice.", "src": "Pattern: symptom words (uoe-real-dic2024 Q10: pinkeye, hoarse, dizzy, fever). Cambridge Dictionary, \"hoarse\".", "note": ""}, {"n": 2, "stem": "The nurse put a ______ on the small cut on my finger.", "opts": ["cast", "plaster", "sling", "crutch"], "ans": 1, "why": "In British English a (sticking) plaster is the small adhesive dressing for a cut (American \"Band-Aid\"). A \"cast\" holds a broken bone, a \"sling\" is a cloth that supports an injured arm, and a \"crutch\" is a stick you lean on to walk.", "src": "Pattern: uoe-real-nov2025 Q10 (cast, plaster, crutch, bandage). Cambridge Dictionary, \"plaster\".", "note": ""}, {"n": 3, "stem": "After the operation he was kept in hospital for three days and then ______.", "opts": ["dismissed", "expelled", "evicted", "discharged"], "ans": 3, "why": "A patient is \"discharged\" from hospital when allowed to go home. A worker is \"dismissed\" from a job, a pupil is \"expelled\" from a school, and a tenant is \"evicted\" from a home.", "src": "Pattern: uoe-real-nov2025 Q9 (discharged). Cambridge Dictionary, \"discharge\".", "note": ""}, {"n": 4, "stem": "The doctor wrote me a ______ for antibiotics and told me to take them for a week.", "opts": ["recipe", "receipt", "prescription", "description"], "ans": 2, "why": "A \"prescription\" is the doctor's written order for medicine. \"Recipe\" (Spanish \"receta\" de cocina) is for cooking, a \"receipt\" proves you paid, and a \"description\" says what something is like.", "src": "False friend receta. Cambridge Dictionary, \"prescription\", \"recipe\".", "note": ""}, {"n": 5, "stem": "I can't breathe through my nose; it's completely ______.", "opts": ["closed", "shut", "blocked", "locked"], "ans": 2, "why": "A \"blocked\" (or \"stuffy\") nose is the fixed phrase for a cold. \"Closed\", \"shut\" and \"locked\" are used for doors, shops and eyes, never for a nose.", "src": "Pattern: symptom collocations. Cambridge Dictionary, \"blocked\".", "note": ""}, {"n": 6, "stem": "A ______ is a doctor who specialises in the illnesses of children.", "opts": ["podiatrist", "gynaecologist", "paediatrician", "psychiatrist"], "ans": 2, "why": "A \"paediatrician\" (American \"pediatrician\") treats children. A \"podiatrist\" treats feet, a \"gynaecologist\" treats the female reproductive system, and a \"psychiatrist\" treats mental illness.", "src": "Pattern: health professions (uoe-real-nov2025 Q20, uoe-real-dic2024 Q29). Cambridge Dictionary, \"paediatrician\".", "note": ""}, {"n": 7, "stem": "She ______ her ankle when she slipped on the wet stairs.", "opts": ["bent", "folded", "curved", "twisted"], "ans": 3, "why": "You \"twist\" (or \"sprain\") an ankle when you injure it by turning it suddenly. \"Bend\" a knee is a normal movement, \"fold\" is for paper or clothes, and \"curve\" describes a shape.", "src": "Pattern: injury verbs. Cambridge Dictionary, \"twist\".", "note": ""}, {"n": 8, "stem": "I've got an appointment at the ______ at ten, so I'll be a bit late.", "opts": ["doctors", "doctor's", "doctors's", "doctor'"], "ans": 1, "why": "\"At the doctor's\" is the possessive with the noun left out (the doctor's surgery), like \"at the dentist's\" or \"at Maria's\". \"Doctors\" is a plain plural, and \"doctors's\" and \"doctor'\" are not English forms.", "src": "Pattern: possessive with the noun left out (uoe-real-dic2024 Q1, uoe-real-nov2025 Q1). Swan, <em>Practical English Usage</em>, possessive 's.", "note": ""}, {"n": 9, "stem": "The hospital wants to shorten waiting lists for ______ surgery, such as hip replacements, which can be planned in advance.", "opts": ["optional", "elective", "voluntary", "selective"], "ans": 1, "why": "\"Elective surgery\" is the fixed term for planned, non-emergency operations. \"Optional\", \"voluntary\" and \"selective\" are ordinary adjectives that do not form this medical term.", "src": "Pattern: uoe-real-nov2025 Q8 (surgery). Cambridge Dictionary, \"elective\".", "note": ""}, {"n": 10, "stem": "The cut was so deep that it needed six ______.", "opts": ["stitches", "seams", "knots", "patches"], "ans": 0, "why": "A doctor closes a wound with \"stitches\". \"Seams\" are the joins in sewn fabric, \"knots\" are tied in string or rope, and \"patches\" are pieces of material that cover a hole.", "src": "Pattern: concrete topic nouns. Cambridge Dictionary, \"stitch\".", "note": ""}, {"n": 11, "stem": "Many people feel ______ when they read in a moving car.", "opts": ["seasick", "carsick", "homesick", "airsick"], "ans": 1, "why": "\"Carsick\" is the nausea caused by travelling in a car. \"Seasick\" refers to a boat, \"airsick\" to a plane, and \"homesick\" means missing your home.", "src": "Pattern: compound adjectives of feeling. Cambridge Dictionary, \"carsick\".", "note": ""}, {"n": 12, "stem": "The vaccine has been shown to ______ the risk of serious illness by 90 %.", "opts": ["shorten", "drop", "fall", "cut"], "ans": 3, "why": "\"Cut (or reduce, lower) the risk\" is transitive and collocates with \"risk\". \"Shorten\" is for length or time, \"fall\" is intransitive (the risk falls, nobody \"falls\" it), and transitive \"drop\" (drop prices) does not collocate with \"risk\".", "src": "Pattern: verb + noun collocation. Cambridge Dictionary, \"cut\".", "note": ""}, {"n": 13, "stem": "Only when the test results came back ______ how serious the infection was.", "opts": ["the doctors realised", "realised the doctors", "did the doctors realise", "the doctors did realise"], "ans": 2, "why": "\"Only when...\" at the start of a sentence forces inversion in the main clause: auxiliary + subject + verb (\"did the doctors realise\"). A and D keep normal order, and B inverts a main verb, which English does not do.", "src": "Pattern: inversion after a fronted negative or limiting adverbial (uoe-real-dic2024 Q16, Q17, Q40). Swan, <em>Practical English Usage</em>, inversion.", "note": ""}, {"n": 14, "stem": "I need to ______ before the trip; I can't read road signs clearly any more.", "opts": ["have my eyes tested", "have tested my eyes", "have my eyes test", "test my eyes by someone"], "ans": 0, "why": "Causative \"have + object + past participle\" says someone else does the action for you. B is a perfect infinitive (I did it myself, already), C needs the participle \"tested\", and D is not English.", "src": "Pattern: causative have (uoe-real-dic2024 Q22, uoe-real-nov2025 Q2). Swan, <em>Practical English Usage</em>, have something done.", "note": ""}, {"n": 15, "stem": "\"I didn't sleep at all last night.\" \"______. The neighbours had a party.\"", "opts": ["So did I", "Neither did I", "Neither I did", "I didn't too"], "ans": 1, "why": "To agree with a negative statement: \"Neither / Nor + auxiliary + subject\". \"So did I\" agrees with a positive statement, \"Neither I did\" lacks the inversion, and the negative of \"too\" is \"either\" (\"I didn't either\").", "src": "Pattern: so/neither + auxiliary (uoe-real-dic2024 Q2). Swan, <em>Practical English Usage</em>, so am I, neither do I.", "note": ""}, {"n": 16, "stem": "It took her weeks to ______ the flu; she was exhausted for a long time afterwards.", "opts": ["get by", "get through to", "get round to", "get over"], "ans": 3, "why": "\"Get over\" an illness means to recover from it. \"Get by\" means to manage with little money, \"get through to\" means to make someone understand or reach them by phone, and \"get round to\" means to finally find time to do something.", "src": "Pattern: phrasal verbs (uoe-real-dic2024 Q8, Q26, Q37, Q38). Cambridge Dictionary, \"get over\".", "note": ""}, {"n": 17, "stem": "Your blood pressure is too high; you should ______ salt.", "opts": ["cut back from", "cut out of", "cut down on", "cut off from"], "ans": 2, "why": "\"Cut down on\" something means to consume less of it. \"Cut out\" (with no \"of\") would mean stop completely, \"cut off from\" means isolated from, and \"cut back from\" is not a phrasal verb with this meaning (\"cut back on\" is).", "src": "Pattern: three-part phrasal verbs (uoe-real-dic2024 Q37, face up to). Cambridge Dictionary, \"cut down on\".", "note": ""}, {"n": 18, "stem": "He was diagnosed ______ diabetes at the age of forty.", "opts": ["of", "from", "with", "by"], "ans": 2, "why": "\"Be diagnosed with\" an illness is the fixed dependent preposition. \"Suffer from\" takes \"from\", \"die of\" takes \"of\", and \"by\" would introduce the doctor who made the diagnosis.", "src": "Pattern: dependent prepositions (uoe-real-dic2024 Q19, sentenced to). Cambridge Dictionary, \"diagnose\".", "note": ""}, {"n": 19, "stem": "The doctor advised him ______ smoking immediately.", "opts": ["to give up", "giving up", "give up", "that he gives up"], "ans": 0, "why": "\"Advise + person + to-infinitive\". \"Advise + -ing\" is used only without a person (\"she advised giving up\"), the bare infinitive is never used after \"advise\", and the that-clause needs \"should\" (\"advised him that he should give up\"), not the present \"gives\".", "src": "Pattern: verb patterns (uoe-real-dic2024 Q35, deserve to be). Swan, <em>Practical English Usage</em>, advise.", "note": ""}, {"n": 20, "stem": "The patient's temperature has ______ steadily since this morning.", "opts": ["raised", "risen", "rose", "arisen"], "ans": 1, "why": "\"Rise, rose, risen\" is intransitive (something goes up by itself), so the present perfect is \"has risen\". \"Raise\" needs an object (you raise something), \"rose\" is the past simple, not the participle, and \"arise\" means that a problem or situation appears.", "src": "Pattern: rise/raise (uoe-real-dic2024 Q33, uoe-real-nov2025 Q14). Cambridge Dictionary, \"rise\", \"raise\".", "note": ""}, {"n": 21, "stem": "There's still ______ hope that he will walk again; the doctors say it will just take time.", "opts": ["a little", "little", "a few", "few"], "ans": 0, "why": "\"Hope\" is uncountable, and \"a little\" means some (positive), which fits \"will just take time\". \"Little\" without \"a\" means almost none, which contradicts the second clause, and \"a few\" and \"few\" go with countable plurals.", "src": "Pattern: quantifiers (uoe-real-nov2025 Q19). Swan, <em>Practical English Usage</em>, little, a little.", "note": ""}, {"n": 22, "stem": "The new drug has some unpleasant side ______, such as nausea and headaches.", "opts": ["effects", "affects", "results", "consequences"], "ans": 0, "why": "\"Side effects\" is the fixed compound for unwanted effects of a medicine. \"Affect\" is a verb, and \"side results\" and \"side consequences\" do not exist as compounds.", "src": "Pattern: fixed compounds and affect/effect. Cambridge Dictionary, \"side effect\".", "note": ""}, {"n": 23, "stem": "After the accident she was in a ______ for two weeks and remembers nothing.", "opts": ["trance", "daze", "coma", "faint"], "ans": 2, "why": "A \"coma\" is a long state of deep unconsciousness after injury or illness. A \"trance\" is a dream-like state (hypnosis), a \"daze\" is a short moment of confusion, and a \"faint\" lasts seconds.", "src": "Pattern: concrete topic nouns. Cambridge Dictionary, \"coma\".", "note": ""}, {"n": 24, "stem": "As a ______, she spends most of her day on the ward giving injections, changing dressings and checking patients' blood pressure.", "opts": ["surgeon", "pharmacist", "paramedic", "nurse"], "ans": 3, "why": "Injections, dressings and blood pressure on a hospital ward are a nurse's routine. A \"surgeon\" operates, a \"pharmacist\" prepares and sells medicines, and a \"paramedic\" gives emergency care in an ambulance, not on a ward.", "src": "Pattern: long stem ending in a profession (uoe-real-nov2025 Q20 midwife, uoe-real-dic2024 Q29 physician). Cambridge Dictionary, \"nurse\".", "note": ""}, {"n": 25, "stem": "The ______ arrived within minutes and gave him first aid before taking him to hospital in the ambulance.", "opts": ["paramedics", "physicians", "surgeons", "chemists"], "ans": 0, "why": "\"Paramedics\" are the trained staff of an ambulance. \"Physicians\" are doctors, \"surgeons\" operate in hospital, and in British English \"chemists\" are pharmacists (or a chemist's is a shop).", "src": "Pattern: health professions (uoe-real-dic2024 Q29). Cambridge Dictionary, \"paramedic\".", "note": ""}],U={"lang": "en", "contents": "Contents", "index": "Index", "words": "words", "min_read": "min read", "quiz": "quiz", "article": "article", "score": "correct of", "answered": "answered", "questions": "questions", "shuffle_q": "Shuffle questions", "shuffle_o": "Shuffle options", "hide": "Hide answered", "mistakes": "Only my mistakes", "reset": "Reset", "correct": "Correct.", "wrong": "Wrong.", "note": "Note", "source": "Source", "confirm": "Clear your answers for this quiz?", "badge": {"V": "read in the full source", "V*": "read in a summary", "V-W": "Wikipedia (secondary)", "NV": "not verified", "D": "derived / calculated", "X": "not found"}},KEY='atcquiz:'+"ingles/uoe-set-13.html";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let order=Q.map((_,i)=>i),shuffleOpts=false,hideDone=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  $('#score').textContent=`${right} ${U.score} ${done} ${U.answered} · ${Q.length} ${U.questions}`+(done?` · ${Math.round(100*right/done)}%`:'');
  order.forEach(i=>{
    const q=Q[i],r=st[q.n];if(hideDone&&r)return;
    const d=document.createElement('section');d.className='q';d.id='q'+q.n;d.tabIndex=-1;
    const idx=(r&&r.idx)?r.idx:(shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3]);
    d.innerHTML=`<div class="qn">Q${q.n}</div><div class="stem">${q.stem}</div>`;
    idx.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[pos]}</b> <span>${q.opts[oi]}</span>`;
      if(r){b.disabled=true;if(oi===q.ans)b.classList.add('right');else if(oi===r.pick)b.classList.add('wrong')}
      b.onclick=()=>{st[q.n]={pick:oi,ok:oi===q.ans,idx};save();render();const s=document.getElementById('q'+q.n);if(s)s.focus({preventScroll:true})};d.appendChild(b)});
    if(r){const e=document.createElement('div');e.className='exp';
      e.innerHTML=(r.ok?'<b class="okt">'+U.correct+'</b> ':'<b class="badt">'+U.wrong+'</b> ')+(q.why?q.why:'')+(q.note?`<div class="nt">${U.note}: ${q.note}</div>`:'')+(q.src?`<div class="src">${U.source}: ${q.src}</div>`:'');d.appendChild(e)}
    box.appendChild(d)});
}
let rc=0;$('#reset').onclick=function(){if(rc){rc=0;st={};save();render();this.textContent=U.reset;return}rc=1;this.textContent=U.lang==='es'?'¿Seguro?':'Sure?';setTimeout(()=>{rc=0;this.textContent=U.reset},3000)};
$('#shuf').onclick=()=>{order=shuffle(order);render()};
$('#so').onchange=e=>{shuffleOpts=e.target.checked;render()};
$('#hd').onchange=e=>{hideDone=e.target.checked;render()};
$('#wrong').onclick=()=>{order=Q.map((_,i)=>i).filter(i=>st[Q[i].n]&&!st[Q[i].n].ok);hideDone=false;$('#hd').checked=false;render()};
render();
